# The Parakeet transcription runner's environment (SPEC §40, PY-16, D319).
#
# The third speech-to-text engine and the second MLX one: NVIDIA's Parakeet-TDT
# through `parakeet-mlx`, Apple Silicon only. It sits BELOW `mlx_whisper/` in
# the registry, so a Mac still transcribes on Whisper unless the user chooses
# otherwise on the Engines tab — see the registry row for why (Parakeet covers
# 25 European languages against Whisper's ~99, and flipping the default would
# silently regress anyone relying on auto-detection).
#
# Its own folder for the reason every runner has one: `parakeet-mlx` pins
# `mlx`, `librosa` and `numpy>=2.2.5` and would have to be resolved against
# `mlx-whisper`'s pins if the two shared an interpreter — one unsatisfiable
# constraint and BOTH engines stop building.
#
# `envinstall` (PY-18) builds this on first use with the same detached
# `uv sync`, progress record and verbatim errors any declaring folder gets.
#
# **No system ffmpeg**, the rule `faster_whisper/pyproject.toml` states: this
# app bundles rclone, not ffmpeg, so a runner that shells out works on the
# machine it was written on and fails on a user's. It costs a dependency here
# exactly as it does for `mlx_whisper/`, and for a sharper reason:
# `parakeet_mlx.audio.load_audio` does not merely prefer ffmpeg, it raises
# "FFmpeg is not installed or not in your PATH" without one. So `worker.py`
# decodes with `av` and hands the waveform over in place of the path.
#
# **The engine lines carry CEILINGS**, for the reason
# `mflux_image/pyproject.toml` states at length: no lockfile is committed beside
# these manifests and `uv sync` runs bare, so an unbounded requirement is
# re-resolved from PyPI on every new venv key — which is exactly how an `mlx`
# minor bump reached users' machines with no commit behind it. `parakeet-mlx` is
# the line that carries `mlx` and `numpy` pins into this venv, so bounding it is
# what keeps this folder's resolution from drifting on its own.
#
# What each earns:
#   parakeet-mlx    the model and the transducer decoder, on Metal. Pulls mlx,
#                   librosa, numpy, dacite and huggingface_hub in itself; the
#                   ones this worker also uses directly are named below rather
#                   than borrowed from it.
#   huggingface_hub downloads
#   psutil          the RSS half of "how much memory is this costing" — the
#                   MLX half comes from mlx's own allocator (see `memory()`)
#   av              the ffmpeg LIBRARIES, in-process, with no binary to find.
#                   The reason `worker.py` never calls `subprocess`.
#   onnxruntime     runs Silero VAD (`../vad.py`, shared since D319), so
#                   `vad: true` means the same thing here as it does on both
#                   whisper engines (AI-10f). Same choice as the MLX whisper
#                   runner: the ONNX export rather than faster-whisper's copy
#                   (which would drag ctranslate2 into a Metal-only venv) or
#                   the PyTorch one (gigabytes for a 2MB detector).
#   sherpa-onnx     speaker diarization (`../diarize.py`), so `diarize: true`
#                   means the same thing here as it does on the other two.
#   sherpa-onnx-core  **NOT redundant, and do not delete it.** sherpa-onnx's
#                   wheels declare `Requires-Dist: sherpa-onnx-core` while its
#                   sdist declares nothing and its linux_armv7l wheels bundle
#                   the library instead — so uv's UNIVERSAL lock resolves it
#                   with no dependencies, `uv sync` installs a `sherpa_onnx`
#                   that cannot import (`Library not loaded:
#                   @rpath/libonnxruntime.dylib`), and `uv pip install` hides
#                   it by resolving per-platform. `mlx_whisper/pyproject.toml`
#                   tells the whole story; `tests/test_ai_runner_deps.py` pins
#                   the pairing for every runner so a tidy-up cannot undo it.
[project]
name = "fused-render-runner-parakeet-mlx"
version = "0.1.0"
# 3.11 for the same reason as mlx_whisper (see the comment there): the
# onnxruntime>=1.28 line below dropped 3.10, and uv's universal resolution
# refuses the project for a Python version nobody is running.
requires-python = ">=3.11"
dependencies = [
    "parakeet-mlx>=0.5,<0.6",
    "huggingface_hub",
    "psutil",
    "av",
    "onnxruntime>=1.28,<2",
    "sherpa-onnx>=1.13,<2",
    # The other half of sherpa-onnx, which its own metadata cannot get into the
    # lock. See the comment above before removing this as a duplicate.
    "sherpa-onnx-core",
]

# Not a distribution — a folder of scripts, not something to build and install.
[tool.uv]
package = false
