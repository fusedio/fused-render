<!DOCTYPE html>
<html lang="en" data-fused-theme="shell">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docs</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #131417;
    --bg-alt: #1b1d21;
    --panel: #1c1e23;
    --fg: #e8eaed;
    --fg-muted: #9aa0a6;
    --fg-faint: #7a7e83;
    --border: #2a2d33;
    --border-strong: #3a3e46;
    --sel: #2b3a52;
    --focus: rgba(10, 132, 255, 0.55);
    --error: #ff6b6b;
    --warning: #d29922;
    --note: #ffd60a;
    --on-note: #1d1d1f;
    --link: #6aa8ff;
    --mark: rgba(255, 214, 10, 0.32);
    --comment: rgba(255, 214, 10, 0.13);
    --comment-line: rgba(255, 214, 10, 0.6);
    --comment-active: rgba(255, 214, 10, 0.3);
    --hit: rgba(255, 159, 10, 0.3);
    --hit-current: rgba(255, 159, 10, 0.65);
    --hover: rgba(255, 255, 255, 0.06);
    --press: rgba(255, 255, 255, 0.11);
    --wash: rgba(255, 255, 255, 0.045);
    --scrim: rgba(0, 0, 0, 0.5);
    --shadow-pop: 0 12px 32px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.07);
    --shadow-sheet: 0 1px 3px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
    --toast-bg: #2c2c2e;
    --toast-fg: #f5f5f7;
    --av-1: #e5484d;
    --av-2: #f76b15;
    --av-3: #30a46c;
    --av-4: #0090ff;
    --av-5: #8e4ec6;
    --av-6: #d6409f;
    --on-av: #ffffff;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff;
    --bg-alt: #f4f5f7;
    --panel: #ffffff;
    --fg: #1f2023;
    --fg-muted: #61656c;
    --fg-faint: #84878d;
    --border: #e1e3e6;
    --border-strong: #c9ccd1;
    --sel: #cfe0f7;
    --focus: rgba(10, 132, 255, 0.45);
    --error: #c62828;
    --warning: #8f6a10;
    --note: #f5b800;
    --on-note: #1d1d1f;
    --link: #0b63ce;
    --mark: rgba(255, 204, 0, 0.42);
    --comment: rgba(255, 204, 0, 0.18);
    --comment-line: rgba(214, 160, 0, 0.75);
    --comment-active: rgba(255, 204, 0, 0.42);
    --hit: rgba(255, 149, 0, 0.28);
    --hit-current: rgba(255, 149, 0, 0.6);
    --hover: rgba(0, 0, 0, 0.045);
    --press: rgba(0, 0, 0, 0.085);
    --wash: rgba(0, 0, 0, 0.03);
    --scrim: rgba(15, 23, 42, 0.28);
    --shadow-pop: 0 12px 32px rgba(15, 23, 42, 0.14), 0 0 0 1px rgba(15, 23, 42, 0.08);
    --shadow-sheet: 0 1px 3px rgba(15, 23, 42, 0.12), 0 0 0 1px rgba(15, 23, 42, 0.06);
    --toast-bg: #1d1d1f;
    --toast-fg: #f5f5f7;
    --av-1: #e5484d;
    --av-2: #f76b15;
    --av-3: #30a46c;
    --av-4: #0090ff;
    --av-5: #8e4ec6;
    --av-6: #d6409f;
    --on-av: #ffffff;
  }
  html {
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, Menlo, Consolas, monospace;
    --zoom: 1;
    height: 100%;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    font-family: var(--font-ui); font-size: 13px; line-height: 1.4;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  button, input, select, textarea { font: inherit; color: inherit; margin: 0; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  button:disabled { cursor: default; }
  ::placeholder { color: var(--fg-faint); opacity: 1; }
  input, textarea { accent-color: var(--note); }
  svg { display: block; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .hidden { display: none !important; }
  * { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  .ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  #boot { height: 100vh; display: flex; flex-direction: column; }
  .sk-bar { height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 14px; }
  .sk-tools { height: 36px; margin: 0 10px 8px; border-radius: 18px; background: var(--bg-alt); }
  .sk-body { flex: 1; border-top: 1px solid var(--border); padding: 40px 24px; }
  .sk-col { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .sk { display: block; border-radius: 5px; height: 12px;
    background: linear-gradient(90deg, var(--bg-alt) 25%, var(--border) 50%, var(--bg-alt) 75%);
    background-size: 200% 100%; animation: sk 1.4s ease-in-out infinite; }
  .sk.round { width: 32px; height: 32px; border-radius: 8px; }
  .sk.t { width: 46%; height: 26px; margin-bottom: 10px; }
  .sk.s { width: 30%; height: 9px; align-self: center; margin-bottom: 8px; }
  @keyframes sk { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  #fatal { height: 100vh; display: grid; place-items: center; padding: 32px; text-align: center; color: var(--fg-muted); }
  #fatal .ic { width: 40px; height: 40px; margin: 0 auto 12px; color: var(--fg-faint); stroke-width: 1.4; }
  #fatal .fatal-msg { max-width: 520px; font-size: 14px; line-height: 1.5; word-break: break-word; }

  #app { height: 100vh; display: flex; flex-direction: column; }
  #bar { flex: none; position: relative; z-index: 20; background: var(--bg); }
  .bar-top { display: flex; align-items: center; gap: 8px; padding: 8px 12px 2px 10px; min-width: 0; }
  .doc-glyph { width: 32px; height: 32px; border-radius: 8px; flex: none; display: grid; place-items: center; background: var(--note); color: var(--on-note); }
  .doc-glyph .ic { width: 18px; height: 18px; stroke-width: 2; }
  .doc-head { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .title-row { display: flex; align-items: center; gap: 8px; min-width: 0; height: 24px; }
  #docTitle { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding: 1px 6px; margin-left: -6px; border-radius: 6px; border: 1px solid transparent; min-width: 24px; max-width: 100%; outline: none; }
  #docTitle.renamable:hover { border-color: var(--border-strong); cursor: text; }
  #docTitle[contenteditable="true"] { text-overflow: clip; border-color: var(--focus); background: var(--bg); }
  #saveState { flex: none; display: inline-flex; align-items: center; gap: 4px; color: var(--fg-faint); font-size: 12px; white-space: nowrap; }
  #saveState .ic { width: 14px; height: 14px; }
  #saveState.warn { color: var(--warning); }
  #saveState.err { color: var(--error); cursor: pointer; }
  #menubar { display: flex; margin-left: -7px; min-width: 0; overflow: hidden; }
  .mb { padding: 2px 7px; border-radius: 5px; font-size: 13px; line-height: 20px; color: var(--fg); white-space: nowrap; }
  .mb:hover, .mb.open { background: var(--hover); }
  .bar-actions { flex: none; display: flex; align-items: center; gap: 6px; }
  .icon-btn { width: 32px; height: 32px; border-radius: 8px; display: inline-grid; place-items: center; color: var(--fg-muted); position: relative; flex: none; }
  .icon-btn:hover { background: var(--hover); color: var(--fg); }
  .icon-btn.on { background: var(--press); color: var(--fg); }
  .count { position: absolute; top: 2px; right: 1px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
    background: var(--note); color: var(--on-note); font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; }
  .chip { height: 32px; padding: 0 8px 0 10px; border-radius: 16px; border: 1px solid var(--border-strong);
    display: inline-flex; align-items: center; gap: 6px; font-weight: 600; white-space: nowrap; }
  .chip .ic { width: 16px; height: 16px; }
  .chip:hover:not(:disabled), .chip.open { background: var(--hover); }
  .chip:disabled { opacity: .6; }
  .chip .caret { width: 14px; height: 14px; color: var(--fg-muted); }
  .pill { height: 32px; padding: 0 14px 0 12px; border-radius: 16px; background: var(--fg); color: var(--bg);
    display: inline-flex; align-items: center; gap: 6px; font-weight: 600; white-space: nowrap; }
  .pill:hover:not(:disabled), .pill.open { opacity: .86; }
  .pill:disabled { opacity: .5; }
  .pill .ic { width: 16px; height: 16px; }
  #ro:empty { display: none; }

  #toolbar { display: flex; align-items: center; flex-wrap: nowrap; gap: 1px; min-height: 40px;
    margin: 4px 10px 8px; padding: 3px 6px; border-radius: 20px; background: var(--bg-alt); overflow: hidden; }
  .tg { display: flex; align-items: center; gap: 1px; flex: none; }
  .tg::before { content: ""; width: 1px; height: 18px; background: var(--border-strong); margin: 0 5px; flex: none; }
  .tg.lead::before { display: none; }
  .tmore { display: flex; align-items: center; flex: none; margin-left: auto; padding-left: 4px; }
  .tb { height: 30px; min-width: 30px; padding: 0 6px; border-radius: 7px; color: var(--fg);
    display: inline-flex; align-items: center; justify-content: center; gap: 4px; flex: none; }
  .tb:hover:not(:disabled) { background: var(--hover); }
  .tb.on { background: var(--sel); }
  .tb.open { background: var(--press); }
  .tb:disabled { opacity: .35; }
  .tb.style { width: 132px; justify-content: space-between; padding: 0 6px 0 10px; font-size: 13px; }
  .tb.style span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tb .caret { width: 14px; height: 14px; color: var(--fg-muted); }
  .tb .hl { stroke: var(--note); stroke-width: 3; }
  body.mode-view #toolbar { display: none; }

  #banner { flex: none; display: flex; align-items: center; gap: 10px; margin: 0 10px 8px; padding: 8px 10px 8px 12px;
    border-radius: 10px; background: var(--bg-alt); border: 1px solid var(--warning); }
  #banner .ic { color: var(--warning); }
  #banner .banner-msg { flex: 1; min-width: 0; }
  #banner .banner-msg b { display: block; }
  #banner .banner-msg span { color: var(--fg-muted); font-size: 12px; }

  #main { flex: 1 1 auto; min-height: 0; display: flex; position: relative; border-top: 1px solid var(--border); }
  #outline { flex: 0 0 232px; overflow-y: auto; padding: 14px 8px 24px; border-right: 1px solid var(--border); background: var(--bg); }
  body:not(.outline-on) #outline { display: none; }
  .side-head { display: flex; align-items: center; justify-content: space-between; padding: 0 6px 8px 8px;
    font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--fg-faint); }
  .side-head .icon-btn { width: 24px; height: 24px; border-radius: 6px; }
  .side-head .icon-btn .ic { width: 15px; height: 15px; }
  .ol-item { display: block; width: 100%; text-align: left; padding: 5px 8px; border-radius: 6px; color: var(--fg-muted);
    font-size: 13px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ol-item:hover { background: var(--hover); color: var(--fg); }
  .ol-item.active { background: var(--press); color: var(--fg); }
  .ol-item.l0 { font-weight: 700; color: var(--fg); }
  .ol-item.l1 { font-weight: 600; }
  .ol-item.l2 { padding-left: 20px; }
  .ol-item.l3 { padding-left: 32px; }
  .ol-item.l4 { padding-left: 44px; }
  .ol-item.drop { box-shadow: inset 0 2px 0 var(--note); }
  .ol-empty { padding: 4px 8px; color: var(--fg-faint); font-size: 12.5px; line-height: 1.5; }

  #scroll { flex: 1 1 auto; min-width: 0; overflow-y: auto; position: relative; }
  #sheet { position: relative; max-width: calc(740px * var(--zoom)); margin: 0 auto; padding: 20px 56px 40vh; }
  body.layout-page #scroll { background: var(--bg-alt); }
  body.layout-page #sheet { max-width: calc(816px * var(--zoom)); margin: 28px auto 72px; padding: calc(64px * var(--zoom)) calc(80px * var(--zoom));
    min-height: calc(1056px * var(--zoom)); background: var(--bg); box-shadow: var(--shadow-sheet); border-radius: 3px; }
  #stamp { text-align: center; color: var(--fg-faint); font-size: 12px; margin: 0 0 20px; font-variant-numeric: tabular-nums; min-height: 16px; }
  #fnList { margin-top: 2.4em; padding-top: .8em; border-top: 1px solid var(--border); color: var(--fg-muted); font-size: calc(13px * var(--zoom)); }
  #fnList ol { margin: 0; padding-left: 1.6em; }
  #fnList li { margin: .35em 0; line-height: 1.5; }
  #fnList li button { text-align: left; color: inherit; }
  #fnList li button:hover { color: var(--fg); }
  .add-comment { position: absolute; right: 8px; width: 30px; height: 30px; border-radius: 15px; display: grid; place-items: center;
    background: var(--panel); color: var(--fg); box-shadow: var(--shadow-pop); z-index: 5; }
  .add-comment:hover { background: var(--bg-alt); }
  .add-comment .ic { width: 16px; height: 16px; }

  .ProseMirror { outline: none; font-family: var(--font-ui); font-size: calc(16px * var(--zoom)); line-height: 1.6; color: var(--fg);
    counter-reset: fn; caret-color: var(--fg); min-height: 30vh; }
  .ProseMirror ::selection { background: var(--sel); }
  .ProseMirror p { margin: 0 0 .55em; }
  .ProseMirror p.title { font-size: 2em; font-weight: 700; line-height: 1.2; letter-spacing: -0.015em; margin: 0 0 .3em; }
  .ProseMirror p.subtitle { font-size: 1.2em; color: var(--fg-muted); margin: 0 0 1em; }
  .ProseMirror h1, .ProseMirror h2, .ProseMirror h3, .ProseMirror h4, .ProseMirror h5, .ProseMirror h6 { line-height: 1.25; scroll-margin-top: 24px; }
  .ProseMirror h1 { font-size: 1.55em; font-weight: 700; margin: 1.1em 0 .4em; }
  .ProseMirror h2 { font-size: 1.3em; font-weight: 700; margin: 1em 0 .35em; }
  .ProseMirror h3 { font-size: 1.1em; font-weight: 600; margin: .9em 0 .3em; }
  .ProseMirror h4 { font-size: 1em; font-weight: 600; margin: .8em 0 .25em; }
  .ProseMirror h5, .ProseMirror h6 { font-size: .9em; font-weight: 600; margin: .8em 0 .25em; color: var(--fg-muted); }
  .ProseMirror > :first-child { margin-top: 0; }
  .ProseMirror blockquote { margin: 0 0 .6em; padding: .1em 0 .1em 1em; border-left: 3px solid var(--note); color: var(--fg-muted); }
  .ProseMirror blockquote p:last-child { margin-bottom: 0; }
  .ProseMirror pre { margin: 0 0 .7em; padding: .8em 1em; border-radius: 8px; background: var(--wash); border: 1px solid var(--border);
    font-family: var(--font-mono); font-size: .85em; line-height: 1.5; overflow-x: auto; white-space: pre; }
  .ProseMirror code { font-family: var(--font-mono); font-size: .88em; padding: .1em .3em; border-radius: 4px; background: var(--wash); border: 1px solid var(--border); }
  .ProseMirror pre code { padding: 0; background: none; border: 0; font-size: inherit; }
  .ProseMirror ul, .ProseMirror ol { margin: 0 0 .6em; padding-left: 1.6em; }
  .ProseMirror li { margin: .12em 0; padding-left: .1em; }
  .ProseMirror li > p { margin: 0; }
  .ProseMirror li > ul, .ProseMirror li > ol { margin: .12em 0 0; }
  .ProseMirror ul { list-style: disc; }
  .ProseMirror ul ul { list-style: circle; }
  .ProseMirror ul ul ul { list-style: square; }
  .ProseMirror li.task { list-style: none; position: relative; margin-left: -1.6em; padding-left: 1.75em; }
  .ProseMirror li.task::before { content: ""; position: absolute; left: .15em; top: .28em; width: 1.08em; height: 1.08em; border-radius: 50%;
    border: 1.5px solid var(--fg-faint); cursor: pointer; }
  .ProseMirror li.task[data-checked="true"]::before { background: var(--note); border-color: var(--note); }
  .ProseMirror li.task[data-checked="true"]::after { content: ""; position: absolute; left: .53em; top: .47em; width: .3em; height: .55em;
    border: solid var(--on-note); border-width: 0 2px 2px 0; transform: rotate(45deg); pointer-events: none; }
  .ProseMirror li.task[data-checked="true"] > p { color: var(--fg-muted); }
  body.mode-view .ProseMirror li.task::before { cursor: default; }
  .ProseMirror a { color: var(--link); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
  .ProseMirror mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
  .ProseMirror sup, .ProseMirror sub { font-size: .72em; line-height: 0; }
  .ProseMirror .smallcaps { font-variant: small-caps; }
  .ProseMirror img { display: inline-block; max-width: 100%; height: auto; border-radius: 4px; vertical-align: bottom; }
  .ProseMirror img.ProseMirror-selectednode { outline: 2px solid var(--focus); }
  .ProseMirror hr { border: 0; border-top: 1px solid var(--border-strong); margin: 1.4em 0; }
  .ProseMirror hr.ProseMirror-selectednode { border-top-color: var(--focus); }
  .ProseMirror table { margin: 0 0 .9em; }
  .ProseMirror td, .ProseMirror th { border: 1px solid var(--border-strong); padding: .35em .6em; }
  .ProseMirror th { background: var(--wash); font-weight: 600; text-align: left; }
  .ProseMirror td > p, .ProseMirror th > p { margin: 0; }
  .ProseMirror .selectedCell::after { background: var(--sel); opacity: .5; }
  .ProseMirror .column-resize-handle { background: var(--focus); }
  .ProseMirror sup.fn { counter-increment: fn; font-size: .72em; line-height: 0; cursor: pointer; }
  .ProseMirror sup.fn::after { content: counter(fn); color: var(--link); font-weight: 600; padding: 0 .1em; }
  .ProseMirror sup.fn.ProseMirror-selectednode { outline: none; background: var(--sel); border-radius: 3px; }
  .ProseMirror .comment { background: var(--comment); border-bottom: 2px solid var(--comment-line); cursor: pointer; }
  .ProseMirror .active-comment, .ProseMirror .pending-comment { background: var(--comment-active); }
  .ProseMirror .search-hit { background: var(--hit); border-radius: 2px; }
  .ProseMirror .search-hit.current { background: var(--hit-current); }
  .ProseMirror .math-node { cursor: pointer; }
  .ProseMirror .math-display-node { display: block; text-align: center; margin: .4em 0 .8em; overflow-x: auto; }
  .ProseMirror .math-node.ProseMirror-selectednode { background: var(--sel); border-radius: 4px; }
  .ProseMirror-gapcursor::after { border-top-color: var(--fg); }
  .ProseMirror .ph::before { content: attr(data-placeholder); color: var(--fg-faint); float: left; height: 0; pointer-events: none; }
  .drop-cursor { background: var(--focus); }

  #comments { flex: 0 0 312px; display: flex; flex-direction: column; border-left: 1px solid var(--border); background: var(--bg); min-width: 0; }
  #commentList { flex: 1; overflow-y: auto; padding: 4px 10px 24px; }
  .card { border-radius: 12px; padding: 11px 12px; margin-bottom: 8px; background: var(--bg-alt); border: 1px solid transparent; cursor: pointer; }
  .card:hover { border-color: var(--border-strong); }
  .card.active { background: var(--panel); border-color: var(--border-strong); box-shadow: var(--shadow-pop); cursor: default; }
  .card-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center; color: var(--on-av); font-size: 11px; font-weight: 700; }
  .avatar.a1 { background: var(--av-1); }
  .avatar.a2 { background: var(--av-2); }
  .avatar.a3 { background: var(--av-3); }
  .avatar.a4 { background: var(--av-4); }
  .avatar.a5 { background: var(--av-5); }
  .avatar.a6 { background: var(--av-6); }
  .who { flex: 1; min-width: 0; }
  .who b { display: block; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who span { display: block; font-size: 11px; color: var(--fg-faint); }
  .card-acts { display: flex; gap: 2px; }
  .card-acts .icon-btn { width: 26px; height: 26px; border-radius: 6px; }
  .card-acts .icon-btn .ic { width: 15px; height: 15px; }
  .quote { margin: 8px 0 0; padding-left: 8px; border-left: 2px solid var(--comment-line); color: var(--fg-muted); font-size: 12px;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .card-body { margin-top: 8px; font-size: 13px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
  .composer textarea, .composer input, .field input, .field textarea {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--bg); outline: none; resize: vertical; font-weight: 400; color: var(--fg); }
  .composer textarea:focus, .composer input:focus, .field input:focus, .field textarea:focus { border-color: var(--focus); box-shadow: 0 0 0 3px var(--sel); }
  .composer textarea { margin-top: 8px; min-height: 64px; }
  .composer input { margin-top: 6px; }
  .composer-acts { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; }

    em: { parseDOM: [{ tag: "em" }, { tag: "i" }, { style: "font-style=italic" }], toDOM: () => ["em", 0] },
    underline: { parseDOM: [{ tag: "u" }, { tag: "span.underline" }, { style: "text-decoration=underline" }], toDOM: () => ["u", 0] },
    strike: { parseDOM: [{ tag: "s" }, { tag: "del" }, { tag: "strike" }, { style: "text-decoration=line-through" }], toDOM: () => ["s", 0] },
    highlight: { parseDOM: [{ tag: "mark" }, { tag: "span.mark" }], toDOM: () => ["mark", 0] },
    sup: { excludes: "sub", parseDOM: [{ tag: "sup", getAttrs: (d) => !d.classList.contains("fn") && null }, { style: "vertical-align=super" }], toDOM: () => ["sup", 0] },
    sub: { excludes: "sup", parseDOM: [{ tag: "sub" }, { style: "vertical-align=sub" }], toDOM: () => ["sub", 0] },
    smallcaps: { parseDOM: [{ tag: "span.smallcaps" }, { style: "font-variant=small-caps" }], toDOM: () => ["span", { class: "smallcaps" }, 0] },
    code: { parseDOM: [{ tag: "code" }], toDOM: () => ["code", 0] },
    comment: {
      attrs: { id: {}, text: { default: "" }, author: { default: "" }, ts: { default: 0 } }, inclusive: false, excludes: "",
      parseDOM: [{ tag: "span.comment[data-cid]", getAttrs: (d) => ({ id: d.getAttribute("data-cid"), text: d.getAttribute("data-text") || "", author: d.getAttribute("data-author") || "", ts: +d.getAttribute("data-ts") || 0 }) }],
      toDOM: (m) => ["span", { class: "comment", "data-cid": m.attrs.id, "data-text": m.attrs.text, "data-author": m.attrs.author, "data-ts": String(m.attrs.ts) }, 0],
    },
  };
  const schema = new Schema({ nodes, marks });
  const N = schema.nodes, MK = schema.marks;
  const domSerializer = DOMSerializer.fromSchema(schema);
  const domParser = PMDOMParser.fromSchema(schema);

  const S = {
    view: null, mode: null, meta: { author: [], date: "", abstract: "" }, composer: null,
    rev: 0, savedRev: 0, saving: null, saveTimer: 0, mtime: null, conflict: false, saveError: "", lastSaved: 0,
    author: localStorage.getItem("fused-docs:author") || "",
  };
  let RO = false;
  let untitled = false;

  function importHtml(html) {
    const dom = new DOMParser().parseFromString(html, "text/html");
    const body = dom.body;
    const revisions = body.querySelectorAll("span.insertion, span.deletion").length;
    body.querySelectorAll("span.deletion").forEach((el) => el.remove());
    body.querySelectorAll("span.insertion").forEach((el) => el.replaceWith(...el.childNodes));
    const meta = { author: [], date: "", abstract: "" };
    const header = body.querySelector(":scope > header");
    if (header) {
      header.querySelectorAll("p.author").forEach((p) => { const a = p.textContent.trim(); if (a) meta.author.push(a); });
      meta.date = header.querySelector("p.date")?.textContent.trim() || "";
      meta.abstract = header.querySelector("div.abstract")?.textContent.trim() || "";
      header.replaceWith(...header.querySelectorAll(":scope > p.title, :scope > p.subtitle"));
    }
    const notes = {};
    body.querySelectorAll("section.footnotes, section[role='doc-endnotes']").forEach((sec) => {
      sec.querySelectorAll("li[id]").forEach((li) => {
        li.querySelectorAll("a.footnote-back").forEach((a) => a.remove());
        notes[li.id] = li.innerHTML.trim();
      });
      sec.remove();
    });
    body.querySelectorAll("a.footnote-ref").forEach((a) => {
      const sup = dom.createElement("sup");
      sup.className = "fn";
      sup.setAttribute("data-fn", notes[(a.getAttribute("href") || "").replace(/^#/, "")] || "");
      a.replaceWith(sup);
    });
    body.querySelectorAll("li").forEach((li) => {
      const box = li.querySelector(":scope > input[type=checkbox], :scope > label > input[type=checkbox], :scope > p:first-child > input[type=checkbox], :scope > p:first-child > label > input[type=checkbox]");
      if (!box) return;
      li.setAttribute("data-checked", box.hasAttribute("checked") ? "true" : "false");
      const label = box.parentElement.tagName === "LABEL" ? box.parentElement : null;
      box.remove();
      if (label) label.replaceWith(...label.childNodes);
    });
    const cidOf = (el) => el.getAttribute("data-comment-id") ?? el.getAttribute("id");
    const ends = new Map([...body.querySelectorAll("span.comment-end")].map((e) => [cidOf(e), e]));
    const seen = new Set();
    body.querySelectorAll("span.comment-start").forEach((start) => {
      const raw = cidOf(start);
      const end = ends.get(raw);
      if (raw == null || seen.has(raw) || !end) return;
      seen.add(raw);
      const attrs = {
        "data-cid": "w" + raw,
        "data-text": start.textContent.trim(),
        "data-author": start.getAttribute("data-author") || start.getAttribute("author") || "Unknown",
        "data-ts": String(Date.parse(start.getAttribute("data-date") || start.getAttribute("date") || "") || 0),
      };
      start.textContent = "";
      const walker = dom.createTreeWalker(body, NodeFilter.SHOW_TEXT);
      walker.currentNode = start;
      const between = [];
      let t;
      while ((t = walker.nextNode())) {
        if (end.compareDocumentPosition(t) & Node.DOCUMENT_POSITION_FOLLOWING) break;
        if (t.textContent) between.push(t);
      }
      between.forEach((tn) => {
        const span = dom.createElement("span");
        span.className = "comment";
        for (const [k, v] of Object.entries(attrs)) span.setAttribute(k, v);
        tn.before(span);
        span.append(tn);
      });
    });
    body.querySelectorAll("span.comment-start, span.comment-end").forEach((el) => el.remove());
    body.querySelectorAll("table").forEach((table) => {
      const cols = [...table.querySelectorAll(":scope > colgroup > col")].map((c) => parseFloat(c.style.width) || 0);
      table.querySelectorAll(":scope > colgroup").forEach((g) => g.remove());
      const total = cols.reduce((a, b) => a + b, 0);
      if (!total || cols.some((w) => !w)) return;
      const px = cols.map((w) => Math.round((w / total) * TABLE_WIDTH));
      table.querySelectorAll("tr").forEach((tr) => {
        let col = 0;
        for (const c of tr.children) {
          const span = +c.getAttribute("colspan") || 1;
          if (col + span <= px.length) c.setAttribute("data-colwidth", px.slice(col, col + span).join(","));
          col += span;
        }
      });
    });
    body.querySelectorAll("p > span.math.display").forEach((span) => {
      const p = span.parentNode;
      const after = dom.createElement("p");
      while (span.nextSibling) after.append(span.nextSibling);
      p.after(span, after);
      if (!p.childNodes.length) p.remove();
      if (!after.childNodes.length) after.remove();
    });
    return { doc: domParser.parse(body), meta, revisions };
  }

  function exportHtml(doc, { comments, styled }) {
    const out = document.implementation.createHTMLDocument("");
    const make = (tag) => out.createElement(tag);
    const div = make("div");
    div.append(domSerializer.serializeFragment(doc.content, { document: out }));
    const head = [];
    for (const [cls, style, tag] of [["title", "Title", (t) => `<title>${esc(t)}</title>`], ["subtitle", "Subtitle", (t) => `<meta name="subtitle" content="${esc(t)}">`]]) {
      const lead = div.querySelector(`:scope > p.${cls}`);
      if (!lead) continue;
      const t = lead.textContent.trim();
      if (!t || !styled) {
        if (t) head.push(tag(t));
        lead.remove();
        continue;
      }
      const wrap = make("div");
      wrap.setAttribute("custom-style", style);
      lead.removeAttribute("class");
      lead.replaceWith(wrap);
      wrap.append(lead);
    }
    S.meta.author.forEach((a) => head.push(`<meta name="author" content="${esc(a)}">`));
    if (S.meta.date) head.push(`<meta name="date" content="${esc(S.meta.date)}">`);
    if (S.meta.abstract) head.push(`<meta name="abstract" content="${esc(S.meta.abstract)}">`);
    div.querySelectorAll("li[data-checked]").forEach((li) => {
      const box = make("input");
      box.type = "checkbox";
      if (li.getAttribute("data-checked") === "true") box.setAttribute("checked", "");
      const host = li.firstElementChild && li.firstElementChild.tagName === "P" ? li.firstElementChild : li;
      host.prepend(box);
      li.removeAttribute("data-checked");
      li.removeAttribute("class");
    });
    const fns = [...div.querySelectorAll("sup.fn")];
    if (fns.length) {
      const ol = make("ol");
      fns.forEach((sup, i) => {
        const n = i + 1;
        const a = make("a");
        a.href = "#fn" + n;
        a.className = "footnote-ref";
        a.id = "fnref" + n;
        a.setAttribute("role", "doc-noteref");
        a.innerHTML = `<sup>${n}</sup>`;
        const li = make("li");
        li.id = "fn" + n;
        li.innerHTML = sup.getAttribute("data-fn") || "<p></p>";
        ol.append(li);
        sup.replaceWith(a);
      });
      const sec = make("section");
      sec.className = "footnotes";
      sec.setAttribute("role", "doc-endnotes");
      sec.append(ol);
      div.append(sec);
    }
    div.querySelectorAll("table").forEach((table) => {
      const first = table.querySelector("tr");
      const widths = first ? [...first.children].flatMap((c) => {
        const w = (c.getAttribute("data-colwidth") || "").split(",").map(Number);
        return Array.from({ length: +c.getAttribute("colspan") || 1 }, (_, i) => w[i] || 0);
      }) : [];
      table.querySelectorAll("[data-colwidth]").forEach((c) => c.removeAttribute("data-colwidth"));
      if (first && first.children.length && [...first.children].every((c) => c.tagName === "TH")) {
        const thead = make("thead");
        table.prepend(thead);
        thead.append(first);
      }
      if (!widths.some(Boolean)) return;
      const filled = widths.map((w) => w || CELL_MIN_WIDTH);
      const total = filled.reduce((a, b) => a + b, 0);
      const group = make("colgroup");
      filled.forEach((w) => { const col = make("col"); col.style.width = ((w / total) * 100).toFixed(2) + "%"; group.append(col); });
      table.prepend(group);
    });
    const anchors = [...div.querySelectorAll("span.comment[data-cid]")];
    if (comments) {
      const ranges = new Map();
      anchors.forEach((el) => {
        const cid = el.getAttribute("data-cid");
        if (!ranges.has(cid)) ranges.set(cid, { first: el, last: el });
        else ranges.get(cid).last = el;
      });
      let n = 0;
      for (const { first, last } of ranges.values()) {
        const id = String(n++);
        const start = make("span");
        start.className = "comment-start";
        start.id = id;
        start.setAttribute("author", first.getAttribute("data-author") || "Unknown");
        start.setAttribute("date", new Date(+first.getAttribute("data-ts") || Date.now()).toISOString());
        start.textContent = first.getAttribute("data-text") || "";
        first.before(start);
        const end = make("span");
        end.className = "comment-end";
        end.id = id;
        last.after(end);
      }
    }
    anchors.forEach((el) => el.replaceWith(...el.childNodes));
    return `<!DOCTYPE html><html><head><meta charset="utf-8">${head.join("")}</head><body>${div.innerHTML}</body></html>`;
  }

  class MathView {
    constructor(node, view, getPos, display) {
      this.node = node;
      this.view = view;
      this.getPos = getPos;
      this.display = display;
      this.dom = document.createElement(display ? "div" : "span");
      this.dom.className = "math-node" + (display ? " math-display-node" : "");
      this.dom.addEventListener("click", () => this.edit());
      this.render();
    }
    render() {
      ensureKatexCss();
      katex.render(this.node.textContent || "\\;", this.dom, { displayMode: this.display, throwOnError: false });
    }
    edit() {
      if (!this.view.editable) return;
      openTexDialog(this.node.textContent, this.display, (tex, display) => {
        const pos = this.getPos();
        if (pos == null) return;
        const node = (display ? N.math_display : N.math_inline).create(null, schema.text(tex));
        const tr = this.view.state.tr;
        if (display === this.display) tr.replaceWith(pos, pos + this.node.nodeSize, node);
        else {
          tr.delete(pos, pos + this.node.nodeSize);
          tr.setSelection(TextSelection.near(tr.doc.resolve(Math.min(pos, tr.doc.content.size)))).replaceSelectionWith(node);
        }
        this.view.dispatch(tr);
        this.view.focus();
      });
    }
    stopEvent() { return true; }
    ignoreMutation() { return true; }
    update(node) { if (node.type !== this.node.type) return false; this.node = node; this.render(); return true; }
  }

  const findKey = new PluginKey("find");
  function findMatches(doc, term, caseSensitive) {
    const res = [];
    if (!term) return res;
    const q = caseSensitive ? term : term.toLowerCase();
    doc.descendants((node, pos) => {
      if (!node.isText) return;
      const text = caseSensitive ? node.text : node.text.toLowerCase();
      let i = 0;
      while ((i = text.indexOf(q, i)) !== -1) { res.push({ from: pos + i, to: pos + i + q.length }); i += q.length; }
    });
    return res;
  }
  const findPlugin = new Plugin({
    key: findKey,
    state: {
      init: () => ({ term: "", caseSensitive: false, matches: [], current: -1, deco: DecorationSet.empty }),
      apply(tr, val, _old, ns) {
        const meta = tr.getMeta(findKey);
        if (!meta && !tr.docChanged) return val;
        const next = { ...val, ...(meta || {}) };
        const rescan = tr.docChanged || next.term !== val.term || next.caseSensitive !== val.caseSensitive;
        const matches = rescan ? findMatches(ns.doc, next.term, next.caseSensitive) : val.matches;
        let current = next.current;
        if (current >= matches.length) current = matches.length ? 0 : -1;
        if (current < 0 && matches.length) current = 0;
        const deco = DecorationSet.create(ns.doc, matches.map((m, i) => Decoration.inline(m.from, m.to, { class: "search-hit" + (i === current ? " current" : "") })));
        return { ...next, matches, current, deco };
      },
    },
    props: { decorations: (st) => findKey.getState(st).deco },
  });

  const pendingKey = new PluginKey("pendingComment");
  const pendingPlugin = new Plugin({
    key: pendingKey,
    state: {
      init: () => null,
      apply(tr, val) {
        const meta = tr.getMeta(pendingKey);
        if (meta !== undefined) return meta;
        if (!val) return val;
        const from = tr.mapping.map(val.from), to = tr.mapping.map(val.to);
        return from < to ? { from, to } : null;
      },
    },
    props: {
      decorations(st) {
        const p = pendingKey.getState(st);
        return p ? DecorationSet.create(st.doc, [Decoration.inline(p.from, p.to, { class: "pending-comment" })]) : null;
      },
    },
  });

  const activeKey = new PluginKey("activeComment");
  let activeCache = { doc: null, id: null, set: null };
  const activePlugin = new Plugin({
    key: activeKey,
    state: { init: () => null, apply: (tr, val) => { const m = tr.getMeta(activeKey); return m !== undefined ? m : val; } },
    props: {
      decorations(st) {
        const id = activeKey.getState(st);
        if (!id) return null;
        if (activeCache.doc !== st.doc || activeCache.id !== id) {
          const decos = [];
          st.doc.descendants((node, pos) => {
            if (node.isInline && node.marks.some((m) => m.type === MK.comment && m.attrs.id === id)) decos.push(Decoration.inline(pos, pos + node.nodeSize, { class: "active-comment" }));
          });
          activeCache = { doc: st.doc, id, set: DecorationSet.create(st.doc, decos) };
        }
        return activeCache.set;
      },
    },
  });

  const placeholderPlugin = new Plugin({
    props: {
      decorations(st) {
        if (S.mode !== "edit") return null;
        const d = st.doc, decos = [];
        const empty = (n) => n && n.isTextblock && !n.content.size;
        const first = d.firstChild;
        if (first.type === N.title && empty(first)) decos.push(Decoration.node(0, first.nodeSize, { class: "ph", "data-placeholder": "Title" }));
        const body = d.childCount === 1 ? first : first.type === N.title && d.childCount === 2 ? d.child(1) : null;
        if (body && empty(body) && body.type === N.paragraph) {
          const at = d.childCount === 1 ? 0 : first.nodeSize;
          decos.push(Decoration.node(at, at + body.nodeSize, { class: "ph", "data-placeholder": "Start writing…" }));
        }
        return decos.length ? DecorationSet.create(d, decos) : null;
      },
    },
  });

  const ancestor = ($pos, ...types) => {
    for (let d = $pos.depth; d > 0; d--) if (types.includes($pos.node(d).type)) return { node: $pos.node(d), pos: $pos.before(d) };
    return null;
  };
  const listOf = ($pos) => ancestor($pos, N.bullet_list, N.ordered_list);
  const itemOf = ($pos) => ancestor($pos, N.list_item);
  const kindOf = (list) => (!list ? null : list.node.firstChild.attrs.checked != null ? "task" : list.node.type === N.ordered_list ? "ordered" : "bullet");
  const listKind = () => kindOf(listOf(S.view.state.selection.$from));

  function setListKind(kind) {
    return (state, dispatch) => {
      const cur = listOf(state.selection.$from);
      const wantType = kind === "ordered" ? N.ordered_list : N.bullet_list;
      if (!cur) {
        const wrap = L.wrapInList(wantType);
        if (!wrap(state)) return false;
        if (dispatch) wrap(state, (tr) => {
          const list = kind === "task" && listOf(tr.selection.$from);
          if (list) list.node.forEach((item, off) => tr.setNodeMarkup(list.pos + 1 + off, null, { checked: false }));
          dispatch(tr.scrollIntoView());
        });
        return true;
      }
      if (kindOf(cur) === kind) return L.liftListItem(N.list_item)(state, dispatch);
      if (dispatch) {
        const tr = state.tr;
        if (cur.node.type !== wantType) tr.setNodeMarkup(cur.pos, wantType);
        cur.node.forEach((item, off) => tr.setNodeMarkup(cur.pos + 1 + off, null, { checked: kind === "task" ? (item.attrs.checked ?? false) : null }));
        dispatch(tr.scrollIntoView());
      }
      return true;
    };
  }
  const splitItem = (state, dispatch) => {
    const item = itemOf(state.selection.$from);
    if (!item || item.node.attrs.checked == null) return L.splitListItem(N.list_item)(state, dispatch);
    return L.splitListItem(N.list_item, { checked: false })(state, dispatch);
  };
  const enterLead = (state, dispatch) => {
    const { $from, empty } = state.selection;
    if ($from.parent.type !== N.title && $from.parent.type !== N.subtitle) return false;
    if (C.splitBlockAs(() => ({ type: N.paragraph }))(state, dispatch)) return true;
    if (!empty || $from.parentOffset !== $from.parent.content.size) return hardBreak(state, dispatch);
    if (dispatch) dispatch(state.tr.setSelection(TextSelection.near(state.doc.resolve($from.after() + 1))).scrollIntoView());
    return true;
  };
  function toggleTask(pos) {
    const node = S.view.state.doc.nodeAt(pos);
    if (!node || node.type !== N.list_item || node.attrs.checked == null) return;
    S.view.dispatch(S.view.state.tr.setNodeMarkup(pos, null, { checked: !node.attrs.checked }));
  }
  const hardBreak = (state, dispatch) => {
    if (state.selection.$from.parent.type.spec.code) { if (dispatch) dispatch(state.tr.insertText("\n").scrollIntoView()); return true; }
    if (dispatch) dispatch(state.tr.replaceSelectionWith(N.hard_break.create()).scrollIntoView());
    return true;
  };

  function buildInputRules() {
    const rules = [...smartQuotes, ellipsis];
    rules.push(textblockTypeInputRule(/^(#{1,4})\s$/, N.heading, (m) => ({ level: m[1].length })));
    rules.push(wrappingInputRule(/^\s*>\s$/, N.blockquote));
    rules.push(wrappingInputRule(/^\s*([-*+])\s$/, N.bullet_list));
    rules.push(wrappingInputRule(/^(\d+)\.\s$/, N.ordered_list, (m) => ({ order: +m[1] }), (m, node) => node.childCount + node.attrs.order === +m[1]));
    rules.push(new InputRule(/^\[( |x)?\]\s$/i, (state, match, start, end) => {
      const checked = (match[1] || "").toLowerCase() === "x";
      const tr = state.tr.delete(start, end);
      const $s = tr.doc.resolve(start);
      const inItem = itemOf($s);
      if (inItem) return tr.setNodeMarkup(inItem.pos, null, { checked });
      const range = $s.blockRange();
      const wrapping = range && findWrapping(range, N.bullet_list);
      if (!wrapping) return null;
      tr.wrap(range, wrapping);
      const item = itemOf(tr.doc.resolve(tr.mapping.map(start)));
      if (item) tr.setNodeMarkup(item.pos, null, { checked });
      return tr;
    }));
    rules.push(textblockTypeInputRule(/^```$/, N.code_block));
    rules.push(new InputRule(/^(?:---|___|\*\*\*)$/, (state, match, start) => {
      const $s = state.doc.resolve(start);
      if ($s.parent.type !== N.paragraph || $s.depth !== 1) return null;
      const before = $s.before();
      const tr = state.tr.replaceRangeWith(before, $s.after(), N.horizontal_rule.create());
      tr.insert(before + 1, N.paragraph.create());
      return tr.setSelection(TextSelection.create(tr.doc, before + 2));
    }));
    rules.push(M.makeInlineMathInputRule(M.REGEX_INLINE_MATH_DOLLARS, N.math_inline));
    rules.push(M.makeBlockMathInputRule(M.REGEX_BLOCK_MATH_DOLLARS, N.math_display));
    return inputRules({ rules });
  }

  const ACTIONS = {};
  const can = (id) => !!ACTIONS[id] && (!ACTIONS[id].enabled || !!ACTIONS[id].enabled());
  const run = (id) => { if (can(id)) ACTIONS[id].run(); return true; };
  let leaving = false;
  const editing = () => S.mode === "edit" && !RO && !leaving;
  const freeze = (on) => { leaving = on; S.view.setProps({ editable: () => editing() }); };
  const bindingsFor = (ids) => Object.fromEntries(ids.filter((id) => ACTIONS[id].kbd).map((id) => [ACTIONS[id].kbd, () => run(id)]));

  const imageFiles = (list) => [...(list || [])].filter((f) => f.type.startsWith("image/"));
  const readDataUrl = (file) => new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = () => reject(r.error); r.readAsDataURL(file); });
  async function insertImages(files, pos) {
    for (const f of files) {
      if (f.size > 15 * 1024 * 1024) { toast(`${f.name} is larger than 15 MB. Use a smaller image.`, { ms: 5000 }); continue; }
      const node = N.image.create({ src: await readDataUrl(f), alt: f.name.replace(/\.[^.]+$/, "") });
      const tr = S.view.state.tr;
      if (pos != null) tr.insert(pos, node); else tr.replaceSelectionWith(node);
      S.view.dispatch(tr.scrollIntoView());
    }
  }

  function mountEditor(doc) {
    const editorKeys = {
      "Mod-y": redo,
      "Enter": C.chainCommands(enterLead, splitItem),
      "Tab": C.chainCommands(T.goToNextCell(1), L.sinkListItem(N.list_item), () => true),
      "Shift-Tab": C.chainCommands(T.goToNextCell(-1), L.liftListItem(N.list_item), () => true),
      "Backspace": C.chainCommands(M.mathBackspaceCmd, C.deleteSelection, C.joinBackward, C.selectNodeBackward),
      "Mod-Enter": C.chainCommands(C.exitCode, hardBreak),
      "Shift-Enter": hardBreak,
      ...bindingsFor(Object.keys(ACTIONS)),
    };
    S.view = new EditorView($("editor"), {
      state: EditorState.create({
        doc,
        plugins: [
          buildInputRules(), keymap(editorKeys), keymap(C.baseKeymap),
          dropCursor({ color: false, class: "drop-cursor" }), gapCursor(), history(),

    else if (untitled) { text = "Draft"; el.title = "Kept in your Docs library until you save it to a folder"; }
    else if (S.rev !== S.savedRev) text = "Edited";
    else if (S.lastSaved) { ic = "check"; text = "Saved"; el.title = "Saved at " + new Date(S.lastSaved).toLocaleTimeString(); }
    el.innerHTML = (ic ? svg(ic) : "") + `<span>${esc(text)}</span>`;
  }
  function changed() {
    S.rev++;
    S.saveError = "";
    refreshSaveState();
    if (!RO && !S.conflict) {
      clearTimeout(S.saveTimer);
      S.saveTimer = setTimeout(() => save("auto"), 900);
    }
  }
  async function save(kind) {
    if (RO) {
      if (kind === "manual") toast("This file is read-only. Save a copy to keep your changes.", { action: { label: "Save a copy", run: () => saveAs(false) } });
      return;
    }
    if (untitled && kind === "manual") { await flushSave(); return saveAs(true); }
    if (S.conflict && kind !== "force") { if (kind === "manual") showConflict(); return; }
    if (S.saving) return S.saving;
    clearTimeout(S.saveTimer);
    if (S.rev === S.savedRev && kind !== "force") {
      if (kind === "manual") { S.lastSaved = S.lastSaved || Date.now(); refreshSaveState(); toast("All changes are saved."); }
      return;
    }
    S.saving = drainSaves(kind === "force");
    refreshSaveState();
    try { await S.saving; } finally { S.saving = null; refreshSaveState(); }
  }
  async function drainSaves(force) {
    while (force || S.rev !== S.savedRev) {
      const rev = S.rev;
      try {
        const out = await py({ action: "save", file: FILE, html: exportHtml(S.view.state.doc, { comments: IS_DOCX, styled: true }), expected_mtime: force ? "" : String(S.mtime ?? "") });
        if (out.conflict) { S.conflict = true; showConflict(); return; }
        S.mtime = out.mtime;
        S.savedRev = rev;
        S.lastSaved = Date.now();
        if (S.conflict) { S.conflict = false; $("banner").classList.add("hidden"); }
        renderStamp();
      } catch (e) {
        if (/read-only/i.test(e.message)) applyReadonly("Read-only", RO_TOOLTIP);
        else {
          S.saveError = e.message;
          toast("Couldn't save: " + e.message, { action: { label: "Retry", run: () => save("manual") }, ms: 7000 });
        }
        return;
      }
      force = false;
    }
  }
  async function flushSave() {
    clearTimeout(S.saveTimer);
    if (S.saving) await S.saving;
    if (S.rev !== S.savedRev && !RO && !S.conflict) await save("auto");
    return S.rev === S.savedRev;
  }
  function showConflict() {
    $("banner").replaceChildren(h("span", { html: svg("warn") }),
      h("div", { class: "banner-msg" }, h("b", { text: "This file was changed outside the editor." }), h("span", { text: "Your latest edits aren't saved. Reload to see the other version, or keep yours." })),
      h("button", { class: "btn sm", text: "Reload", onclick: () => location.reload() }),
      h("button", { class: "btn sm primary", text: "Keep my version", onclick: () => { save("force"); S.view.focus(); } }));
    $("banner").classList.remove("hidden");
    refreshSaveState();
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && S.rev !== S.savedRev) save("auto"); });
  window.addEventListener("pagehide", () => { if (S.rev !== S.savedRev) save("auto"); });

  const RO_TOOLTIP = "The file is read-only. Its permissions don't allow writing, so it can't be edited here.";
  function applyReadonly(message, tooltip) {
    if (RO) return;
    RO = true;
    clearTimeout(S.saveTimer);
    fusedRoBadge.update($("ro"), message || "Read-only", tooltip || RO_TOOLTIP);
    $("btnMode").disabled = true;
    $("btnMode").title = tooltip || RO_TOOLTIP;
    $("docTitle").classList.remove("renamable");
    applyParams();
    refreshSaveState();
  }

  async function ensureTool(tool, title, text) {
    const st = await py({ action: tool + "_status" }).catch(() => ({ available: false }));
    if (st.available) return true;
    return new Promise((resolve) => {
      let done = false;
      const bar = h("div", { class: "progress hidden" }, h("div"));
      const detail = h("div", { class: "modal-text", style: "font-size:12px;word-break:break-word" });
      const finish = (ok) => { if (done) return; done = true; closeModal(); resolve(ok); };
      const actions = [{ label: "Cancel", run: () => finish(false) }, { label: "Download", primary: true, run: async () => {
        actions[1].el.disabled = true;
        bar.classList.remove("hidden");
        try { await py({ action: tool + "_install" }); }
        catch (e) { detail.textContent = e.message; actions[1].el.disabled = false; return false; }
        const poll = async () => {
          if (done) return;
          const s = await py({ action: tool + "_status" }).catch(() => null);
          if (done) return;
          const p = (s && s.progress) || {};
          if (s && s.available) { toast(`${tool} is installed.`); finish(true); return; }
          if (p.error) { detail.textContent = p.error; actions[1].el.disabled = false; return; }
          bar.firstElementChild.style.width = (p.pct || 0) + "%";
          detail.textContent = p.detail || p.stage || "Downloading…";
          setTimeout(poll, 800);
        };
        poll();
        return false;
      } }];
      modal({ title, body: [h("div", { class: "modal-text", text }), bar, detail], actions, onClose: () => { if (!done) { done = true; resolve(false); } } });
    });
  }

  async function doExport(fmt) {
    if (fmt === "pdf" && !(await ensureTool("typst", "PDF export needs the typst compiler", "The first PDF export downloads the typst compiler (about 30 MB). This happens once."))) return;
    toast(`Preparing ${fmt.toUpperCase()}…`, { ms: 20000 });
    try {
      const out = await py({ action: "export", file: FILE, title: displayName(), html: exportHtml(S.view.state.doc, { comments: fmt === "docx", styled: fmt === "docx" || fmt === "odt" }), fmt });
      if (out.error) { toast("Couldn't export: " + out.error, { ms: 6000 }); return; }
      h("a", { href: fused.rawUrl(out.path), download: out.name }).click();
      toast("Downloaded " + out.name);
    } catch (e) { toast("Couldn't export: " + e.message, { ms: 6000 }); }
  }
  window.addEventListener("beforeprint", () => { printing = true; rootEl.setAttribute("data-theme", "light"); rootEl.style.colorScheme = "light"; });
  window.addEventListener("afterprint", () => { printing = false; paintTheme(); });
  async function newDocument() {
    if (!(await flushSave()) && !RO) { toast("Save your changes before creating a new document."); return; }
    try { openPath((await py({ action: "new", title: "Untitled document" })).path); }
    catch (e) { toast("Couldn't create a document: " + e.message, { ms: 6000 }); }
  }

  let title = "";
  const firstLine = () => {
    let t = "";
    S.view.state.doc.descendants((n) => { if (t) return false; if (n.isTextblock && n.textContent.trim()) { t = n.textContent.trim(); return false; } return true; });
    return t.replace(/[\\/:*?"<>|]+/g, "").replace(/\s+/g, " ").slice(0, 60).trim();
  };
  const displayName = () => title || (untitled && S.view && firstLine()) || STEM;
  function renderTitle() {
    $("docTitle").textContent = displayName();
    document.title = displayName();
  }
  function startRename() {
    if (RO) return;
    const dt = $("docTitle");
    dt.contentEditable = "true";
    dt.focus();
    const range = document.createRange();
    range.selectNodeContents(dt);
    getSelection().removeAllRanges();
    getSelection().addRange(range);
  }
  async function commitRename(cancel) {
    const dt = $("docTitle");
    if (dt.contentEditable !== "true") return;
    dt.contentEditable = "false";
    const name = dt.textContent.replace(/\s+/g, " ").trim().replace(/[\\/:*?"<>|]+/g, "");
    if (cancel || !name || name === displayName()) { renderTitle(); return; }
    if (untitled) { title = name; renderTitle(); return; }
    if (!(await flushSave())) { toast("Save your changes before renaming."); renderTitle(); return; }
    freeze(true);
    try { openPath((await py({ action: "rename", file: FILE, title: name })).path); }
    catch (e) { freeze(false); toast("Couldn't rename: " + e.message, { ms: 6000 }); renderTitle(); }
  }

  async function saveAs(firstSave) {
    const fileDir = FILE.slice(0, FILE.lastIndexOf("/"));
    const start = await py({ action: "listdir", path: firstSave ? "~/Documents" : fileDir }).catch(() => null);
    let dir = start ? start.path : firstSave ? "" : fileDir;
    const homeDir = start ? start.home : "";
    const pretty = (d) => (homeDir && (d === homeDir || d.startsWith(homeDir + "/")) ? "~" + d.slice(homeDir.length) : d);
    const nameIn = h("input", { value: firstSave ? displayName() : `Copy of ${displayName()}`, spellcheck: "false" });
    const pathEl = h("span", { class: "path", text: pretty(dir), title: dir });
    const where = h("div", { class: "where" }, h("span", { html: svg("folder") }), pathEl,
      h("button", { class: "btn sm", text: "Choose…", type: "button", onclick: async () => {
        const pick = await window.fusedFolderPicker.open({ start: dir || "/", title: "Choose a folder", confirmLabel: "Choose" }).catch(() => null);
        if (pick && pick.dir) { dir = pick.dir; pathEl.textContent = pretty(dir); pathEl.title = dir; }
      } }));
    modal({ title: firstSave ? "Save document" : "Save a copy", width: 480,
      body: [field("Name", h("div", { class: "field-row" }, nameIn, h("span", { text: ".docx", style: "color:var(--fg-faint);font-weight:400" }))), field("Where", where)],
      actions: [{ label: "Cancel" }, { label: "Save", primary: true, run: async () => {
        const name = nameIn.value.trim().replace(/\.(docx|odt)$/i, "").replace(/[\\/:*?"<>|]+/g, "").trim();
        if (!name) { nameIn.focus(); return false; }
        const listing = await py({ action: "listdir", path: dir }).catch(() => null);
        if (listing && listing.files.some((f) => f.toLowerCase() === `${name}.docx`.toLowerCase())) {
          const replace = await new Promise((resolve) => modal({ title: `“${name}.docx” already exists`, width: 420,
            body: [h("div", { class: "modal-text", text: "Replacing it overwrites the file in that folder." })],
            actions: [{ label: "Cancel", run: () => resolve(false) }, { label: "Replace", primary: true, run: () => resolve(true) }], onClose: () => resolve(false) }));
          if (!replace) return;
        }
        try {
          if (firstSave) {
            await flushSave();
            freeze(true);
            const out = await py({ action: "save_new", html: exportHtml(S.view.state.doc, { comments: true, styled: true }), path: name, directory: dir, file: FILE }).catch((e) => { freeze(false); throw e; });
            S.savedRev = S.rev;
            openPath(out.path);
            return;
          }
          const out = await py({ action: "save_as", html: exportHtml(S.view.state.doc, { comments: true, styled: true }), path: name, directory: dir });
          toast("Saved a copy to " + out.path, { action: { label: "Open", run: () => openPath(out.path) }, ms: 6000 });
        } catch (e) { toast("Couldn't save: " + e.message, { ms: 6000 }); }
      } }] });
  }

  const pageKeys = keydownHandler(bindingsFor(Object.keys(ACTIONS)));
  const inputKeys = keydownHandler(bindingsFor(["save", "saveCopy", "find", "replace", "print", "shortcuts", "wordCount"]));
  document.addEventListener("keydown", (e) => {
    if (e.defaultPrevented || modalEl || e.isComposing || !S.view) return;
    if (e.key === "Escape" && !$("findbar").classList.contains("hidden")) { e.preventDefault(); closeFind(); return; }
    if (S.view.dom.contains(e.target)) return;
    const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable;
    if ((typing ? inputKeys : pageKeys)(S.view, e)) { e.preventDefault(); return; }
    if (!typing && !editing() && !e.altKey && !e.ctrlKey && !e.metaKey && e.key.length === 1) hintEdit();
  });

  $("btnOutline").innerHTML = svg("sidebar");
  $("btnOutlineClose").innerHTML = svg("close");
  $("btnCommentsClose").innerHTML = svg("close");
  $("btnDownload").innerHTML = `${svg("download")}<span>Download</span>`;
  $("glyph").innerHTML = svg("doc");
  $("findPrev").innerHTML = svg("chevronUp");
  $("findNext").innerHTML = svg("chevron");
  $("findReplaceToggle").innerHTML = svg("replace");
  $("findClose").innerHTML = svg("close");
  $("btnOutline").addEventListener("click", () => setParam("outline", param("outline") === "1" ? "0" : "1"));
  $("btnOutlineClose").addEventListener("click", () => setParam("outline", "0"));
  $("btnComments").addEventListener("click", togglePanel);
  $("btnCommentsClose").addEventListener("click", closePanel);
  $("btnMode").addEventListener("click", (e) => toggleMenu(e.currentTarget, MODE_ITEMS, { side: "end", keyboard: e.detail === 0 }));
  $("btnDownload").addEventListener("click", (e) => toggleMenu(e.currentTarget, downloadMenu, { side: "end", keyboard: e.detail === 0 }));
  $("findInput").addEventListener("input", doFind);
  $("findInput").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); findNav(e.shiftKey ? -1 : 1); } });
  $("replaceInput").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); replaceOne(); } });
  $("findPrev").addEventListener("click", () => findNav(-1));
  $("findNext").addEventListener("click", () => findNav(1));
  $("findClose").addEventListener("click", closeFind);
  $("findCase").addEventListener("click", () => {
    const on = $("findCase").getAttribute("aria-pressed") !== "true";
    $("findCase").setAttribute("aria-pressed", String(on));
    $("findCase").classList.toggle("on", on);
    S.view.dispatch(S.view.state.tr.setMeta(findKey, { caseSensitive: on }));
    updateFindUI(true);
  });
  $("findReplaceToggle").addEventListener("click", () => {
    const row = $("findbar").querySelector(".replace-row");
    row.classList.toggle("hidden");
    if (!row.classList.contains("hidden")) $("replaceInput").focus();
  });
  $("btnReplace").addEventListener("click", replaceOne);
  $("btnReplaceAll").addEventListener("click", replaceAll);
  $("scroll").addEventListener("scroll", () => { spyOutline(); if (addBtn && !addBtn.classList.contains("hidden")) positionCommentButton(); }, { passive: true });
  $("sheet").addEventListener("mousedown", (e) => {
    if (!editing() || (e.target !== $("sheet") && e.target !== $("editor"))) return;
    if (e.clientY <= S.view.dom.getBoundingClientRect().bottom) return;
    e.preventDefault();
    const tr = S.view.state.tr;
    if (tr.doc.lastChild.type !== N.paragraph || tr.doc.lastChild.content.size) tr.insert(tr.doc.content.size, N.paragraph.create());
    S.view.dispatch(tr.setSelection(TextSelection.atEnd(tr.doc)).scrollIntoView());
    S.view.focus();
  });
  $("editor").addEventListener("contextmenu", (e) => {
    if (!editing() || !e.target.closest("td, th")) return;
    e.preventDefault();
    const pos = S.view.posAtCoords({ left: e.clientX, top: e.clientY });
    if (pos && S.view.state.selection.empty) S.view.dispatch(S.view.state.tr.setSelection(TextSelection.near(S.view.state.doc.resolve(pos.pos))));
    openMenu(null, TABLE_MENU, { rect: { left: e.clientX, right: e.clientX, top: e.clientY, bottom: e.clientY } });
  });
  $("docTitle").addEventListener("click", () => { if ($("docTitle").classList.contains("renamable") && $("docTitle").contentEditable !== "true") startRename(); });
  $("docTitle").addEventListener("keydown", (e) => {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === "Enter") { e.preventDefault(); $("docTitle").blur(); }
    else if (e.key === "Escape") { e.preventDefault(); commitRename(true); }
  });
  $("docTitle").addEventListener("blur", () => commitRename(false));

  let res = await importing;
  if (res.missing_pandoc) {
    $("boot").classList.add("hidden");
    res = (await ensureTool("pandoc", "Opening documents needs pandoc", "The first document you open downloads pandoc (about 40 MB), the converter this editor reads and writes files with. This happens once."))
      ? await load() : { error: "pandoc is not installed, so this document can't be opened." };
  }
  if (res.error) { fatal(`Couldn't open ${BASENAME}: ${res.error}`); return; }

  let imported;
  try { imported = importHtml(res.html); }
  catch (e) { fatal(`Couldn't read ${BASENAME}: ${e.message}`); return; }
  S.meta = imported.meta;
  S.mtime = res.mtime;
  untitled = !!res.library;
  defaultMode = untitled ? "edit" : "view";
  const blankDraft = untitled && !imported.doc.textContent.trim();
  defaultOutline = innerWidth >= 1100 ? "1" : "0";
  let doc = imported.doc;
  if (untitled && !doc.textContent.trim() && doc.childCount <= 1 && doc.firstChild.type === N.paragraph) doc = N.doc.create(null, [N.title.create(), N.paragraph.create()]);

  $("boot").classList.add("hidden");
  $("app").classList.remove("hidden");
  buildMenubar();
  buildToolbar();
  mountEditor(doc);
  renderTitle();
  renderStamp();
  if (res.editable !== false) $("docTitle").classList.add("renamable");
  $("docTitle").title = untitled ? "Name this document" : "Rename";
  if (res.editable === false) applyReadonly(res.readonly_message, res.readonly_tooltip);
  applyParams();
  setParam("mode", blankDraft && !RO ? "edit" : S.mode);
  setParam("panel", param("panel") === "comments" ? "comments" : "");
  buildFootnotes();
  renderComments();
  refreshSaveState();
  refreshChrome();
  if (blankDraft) {
    S.view.dispatch(S.view.state.tr.setSelection(TextSelection.atStart(S.view.state.doc)));
    S.view.focus();
  }
  if (imported.revisions) toast("This document has tracked changes. They're shown accepted, and saving an edit writes the accepted version.", { ms: 8000 });
  fallbackFocus = () => { if (editing()) focusView(); };
  if (fused.params.onChange) fused.params.onChange(applyParams);
})();
</script>
</body>
</html>
