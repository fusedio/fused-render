    let candidatesPending = null;
    let candidatesNotice = "";  // why there are none, when there are none
    const CANDIDATES_TTL_MS = 5000;

    // A failed or absent scan is cached exactly as hard as a successful one, and
    // the REASON is kept. Both matter: an uncached null re-ran the action on
    // every keystroke down the one path where it can never succeed (a
    // mount-backed root, which graph.py refuses by design, MD-11), and a
    // reasonless null left every source silently bailing — which the popup drew
    // as "no matches" (MD-11a: unknown is not missing).
    async function ensureCandidates() {
      if (Date.now() - candidatesAt < CANDIDATES_TTL_MS) return candidates;
      if (candidatesPending) return candidatesPending;
      candidatesPending = (async () => {
        candidates = null;
        candidatesNotice = "";
        const root = notes ? notes.root : (fused.params.get("root") || "");
        if (!root) {
          candidatesNotice = UNRESOLVED_HERE;
        } else {
          try {
            // `file` is sent so graph.py can validate every inserted form from
            // THIS note (MD-14): resolution tier 1 is relative to the containing
            // note's folder, so a form validated from the root is not validated
            // for a note in a subfolder.
            const data = await fused.runPython("./graph.py",
              { action: "candidates", root, file }, { key: "md-candidates" });
            if (data.error) candidatesNotice = data.message || UNRESOLVED_HERE;
            else candidates = data;
          } catch (err) {
            candidatesNotice = "The folder scan failed: " + (err.message || String(err));
          }
        }
        candidatesAt = Date.now();
        return candidates;
      })();
      try { return await candidatesPending; } finally { candidatesPending = null; }
    }

    // One informational row instead of an empty popup, in graph.py's own words
    // where it had any — so a mount refusal, a note outside its root and a
    // crashed scan each read as themselves, exactly as the sidebar does.
    // Non-selectable: `apply` deliberately inserts nothing, and `filter: false`
    // keeps the row from being typed away into an empty list again.
    function scanNoticeOptions(from, message) {
      return {
        from,
        filter: false,
        options: [{
          label: message || candidatesNotice || UNRESOLVED_HERE,
          type: "text",
          apply: () => {},
        }],
      };
    }

    // Where a row DISPLAYS something other than what it inserts, CM refuses to
    // guess where the typed characters landed and highlights nothing at all
    // (`sortOptions`: a `displayLabel` with no `getMatch` gets an empty match) —
    // which on these lists silenced the one signal that says why a row survived
    // the filter, since every path row and every heading row displays a form of
    // its own. So the mapping is supplied: the characters CM matched IN THE
    // LABEL, found again as a subsequence of what the row shows. A character the
    // display deliberately drops (a heading's `#`, a `%20`'s escape) is skipped
    // rather than fudged, so the emphasis is always on real matched text or
    // absent — never a range slid sideways over the wrong letters.
    function displayMatch(completion, matched) {
      const shown = completion.displayLabel;
      // No display form of its own, or nothing matched (an unfiltered list calls
      // this with no ranges at all): the label's own ranges are already right.
      if (!shown || !matched) return matched || [];
      const lower = shown.toLowerCase();
      let typed = "";
      for (let i = 0; i < matched.length; i += 2) {
        typed += completion.label.slice(matched[i], matched[i + 1]);
      }
      const out = [];
      let at = 0;
      for (const ch of typed) {
        const found = lower.indexOf(ch.toLowerCase(), at);
        if (found === -1) continue;
        if (out.length && out[out.length - 1] === found) out[out.length - 1] = found + 1;
        else out.push(found, found + 1);
        at = found + 1;
      }
      return out;
    }

    // NESTING depth over the levels actually present, not the raw level: a note
    // that starts at `##` is not an indented note, and `#` → `###` is one step in
    // rather than two. Shared by the two surfaces that draw the same note's
    // headings — the completion popup and the sidebar outline — because "the popup
    // indents the way the outline does" (MD-14) is only true if it is one rule and
    // not two that agree on the notes we happened to look at.
    function withDepth(headings) {
      const stack = [];
      return headings.map((h) => {
        while (stack.length && stack[stack.length - 1] >= h.level) stack.pop();
        stack.push(h.level);
        return { ...h, depth: stack.length - 1 };
      });
    }

    // A heading row says its nesting the way the SIDEBAR's outline says it —
    // indentation, plus the level as a dimmed marker in the detail column (MD-14,
    // MD-19b). Printing `### ` into the label was a third visual language for the
    // one thing this template already renders twice: the same note's headings.
    function headingOptions(headings, prefix, encode) {
      return withDepth(headings).map((h) => ({
        label: prefix + "#" + (encode ? encodeTarget(h.text) : h.text),
        displayLabel: "  ".repeat(h.depth) + h.text,
        detail: "H" + h.level,
        type: "text",
      }));
    }

    // ---- a path, as the target of an inline link (MD-14) -------------------
    // The candidates payload already carries every note AND every non-note file
    // under the root, both root-relative POSIX, so path completion needs no new
    // Python action — only the string work below. `resolvePath` goes the other
    // way (join to an fs-absolute path) and so has nothing reusable here; this
    // stays pure string manipulation for the same reason it does, and it never
    // rebuilds a path from segments, so the Windows drive form `C:/…` (which
    // must NOT gain a leading slash) passes through untouched.

    // The open note's own folder, root-relative, "" when it sits at the root —
    // and null when the note is not under the root at all, which is a thing to
    // say rather than an empty popup.
    function vaultRelDir(root) {
      const base = (root || "").replace(/\/+$/, "");
      if (!file || !base || !file.startsWith(base + "/")) return null;
      const rel = file.slice(base.length + 1);
      const cut = rel.lastIndexOf("/");
      return cut === -1 ? "" : rel.slice(0, cut);
    }

    // `rel` (root-relative) as written from `dir` (root-relative). A file beside
    // the note comes out as `img.png` and one below it as `sub/img.png`; `../`
    // appears only where the target really is above the note, because climbing
    // to the root and back down is noise nobody would type.
    function relativeTarget(dir, rel) {
      const from = dir ? dir.split("/") : [];
      const to = rel.split("/");
      let shared = 0;
      while (shared < from.length && shared < to.length - 1
             && from[shared] === to[shared]) shared++;
      return "../".repeat(from.length - shared) + to.slice(shared).join("/");
    }

    // `[x](my file.png)` is not a link to the GFM parser at all, so the
    // human-readable path is the one thing that must NOT be inserted: it would
    // put a target in the document that Live Preview cannot render and the click
    // handler never sees. Encoded per segment so `/` and `..` survive, and
    // parentheses go too since one of them closes the target early. The readable
    // form is what the row DISPLAYS (`displayLabel`), so the escapes only ever
    // exist in the document — where MD-4a's widget decodes them again.
    function encodeTarget(path) {
      return path.split("/")
        .map((segment) => (segment === ".." || segment === "."
          ? segment
          : encodeURIComponent(segment).replace(/\(/g, "%28").replace(/\)/g, "%29")))
        .join("/");
    }

    // Only an image renders in `![…](…)`, so that trigger offers only images.
    const IMAGE_EXT_RE = /\.(png|jpe?g|gif|webp|svg|avif|bmp|ico)$/i;

    // Relative to the note's own folder, which is `resolve_link`'s FIRST tier
    // (MD-4) — so the form the popup inserts is the form the graph follows back
    // to this exact file, with no basename ambiguity to lose to. It is also a
    // real relative path, which is what the shell navigates by (MD-4a) even
    // where no scan ever ran.
    function pathOptions(data, dir, imagesOnly) {
      // An asset row is `{ rel, embed }`; only `rel` matters here, because this
      // context's form is computed as a relative path below rather than taken
      // from the payload.
      const assetRels = data.assets.map((asset) => asset.rel);
      const rels = imagesOnly
        ? assetRels.filter((rel) => IMAGE_EXT_RE.test(rel))
        : data.notes.map((note) => note.rel).concat(assetRels);
      return rels.map((rel) => {
        const readable = relativeTarget(dir, rel);
        return {
          label: encodeTarget(readable),
          displayLabel: readable,
          // No `detail`: it carried `rel`, which for the common case (a target
          // in or under the note's own folder) is the readable path the row
          // already shows — the row read `docs/other.mddocs/other.md`. The
          // detail column is for something the label does not say, and here
          // there is nothing (MD-14).
          type: isNote(rel) ? "class" : "text",
        };
      });
    }

    const OUTSIDE_ROOT =
      "Paths are not offered here — this note is not under the scanned folder.";

    // ---- `[[…` and `![[…` --------------------------------------------------
    async function wikilinkCompletions(context) {
      const before = context.state.doc.sliceString(
        Math.max(0, context.pos - 240), context.pos);
      const wiki = /\[\[([^\[\]\n]*)$/.exec(before);
      if (!wiki) return null;
      const typed = wiki[1];
      const from = context.pos - typed.length;
      const data = await ensureCandidates();
      if (!data) return scanNoticeOptions(from);
      const hash = typed.indexOf("#");
      if (hash === -1) {
        // `![[image.png]]` is the common Obsidian embed, and an embed resolves
        // through the ASSET index while a plain `[[…]]` resolves through the note
        // index (graph.py `_resolved_links`). So the two contexts read two
        // different validated forms off the same rows: `embed` here, `link`
        // there. A row whose form is **null** has no form that resolves back to
        // it from this note, and is dropped rather than inserted as a path the
        // resolver would read as a ghost or as another file — the page still
        // invents no form of its own (MD-3/MD-14).
        const embedding = before[wiki.index - 1] === "!";
        const options = [];
        for (const note of data.notes) {
          const form = embedding ? note.embed : note.link;
          if (form) options.push({ label: form, detail: note.title, type: "class" });
        }
        if (embedding) {
          for (const asset of data.assets) {
            if (asset.embed) {
              options.push({ label: asset.embed, detail: "embed", type: "text" });
            }
          }
        }
        return { from, options, validFor: /^[^\[\]#\n]*$/ };
      }
      const notePart = typed.slice(0, hash);
      // Matched against BOTH forms: whichever popup offered the note is the form
      // sitting in the document now, and `[[a/B#` must find B's headings either
      // way. Null forms simply never match.
      const headings = notePart
        ? ((data.notes.find((n) => [n.link, n.embed].some(
              (form) => form && form.toLowerCase() === notePart.toLowerCase()))
            || {}).headings || [])
        : (notes ? notes.headings : []);
      return { from, options: headingOptions(headings, notePart), getMatch: displayMatch };
    }

    // ---- `](…` — an inline link's or image's target -------------------------
    async function inlinePathCompletions(context) {
      const before = context.state.doc.sliceString(
        Math.max(0, context.pos - 240), context.pos);
      const inline = /(!?)\[[^\]\n]*\]\(([^)\s]*)$/.exec(before);
      if (!inline) return null;
      const typed = inline[2];
      if (typed.startsWith("#")) return null;  // headingAnchorCompletions' case
      const from = context.pos - typed.length;
      const data = await ensureCandidates();
      if (!data) return scanNoticeOptions(from);
      const dir = vaultRelDir(data.root);
      if (dir === null) return scanNoticeOptions(from, OUTSIDE_ROOT);
      return {
        from,
        options: pathOptions(data, dir, inline[1] === "!"),
        // Keystrokes filter the list locally instead of re-running the source —
        // the same reason `[[` carries one.
        validFor: /^[^)\s]*$/,
        // The row displays the readable path and inserts the encoded one, so the
        // typed-substring emphasis needs the mapping between them.
        getMatch: displayMatch,
      };
    }

    // ---- `](#…` — an anchor inside this note --------------------------------
    // The same headings `[[#` offers, from the note payload, so this context
    // needs no candidate scan of its own — but it does need the note payload,
    // and where that failed the answer is graph.py's reason, not an empty list.
    async function headingAnchorCompletions(context) {
      const before = context.state.doc.sliceString(
        Math.max(0, context.pos - 240), context.pos);
      const anchor = /\]\((#[^)\s]*)$/.exec(before);
      if (!anchor) return null;
      const from = context.pos - anchor[1].length;
      if (!notes) return scanNoticeOptions(from, scanNotice || UNRESOLVED_HERE);
      return {
        from,
        options: headingOptions(notes.headings, "", true),
        validFor: /^#[^)\s]*$/,
        getMatch: displayMatch,
      };
    }

    // ---- the popup's presentation (MD-14) ----------------------------------
    // Through CM's OWN theme mechanism, not page CSS, for one concrete reason:
    // an appearance flip dispatches `StateEffect.reconfigure` over the extension
    // array (buildEditor), so a theme extension IN that array is reinstalled with
    // everything else, while a page rule has to keep out-specifying whatever
    // oneDark reinstates. And every colour is a var() token read off <html> at
    // paint time, so ONE theme is right in both palettes — there is no dark copy
    // of these rules to keep in sync (D192).
    // The list is long by nature (every note plus every asset in the vault), so
    // the shape is the SIDEBAR's list, not a code editor's: prose font, one row
    // per line, a dimmed right-hand detail column, and a selected row that reads
    // like `.bl:hover` (--bg on the --bg-alt panel) plus an accent left edge and
    // bold weight — two non-colour signals, so the selection survives without it.
    // ---- fenced code: real per-language highlighting (6b.1/6b.2) -----------
    // `CM.markdown({ codeLanguages })` accepts a function `(info) => Language
    // | LanguageSupport | null`, which is simpler than building an array of
    // `LanguageDescription` and needs nothing extra from the bundle. The
    // aliases are the usual short forms a fence's info string carries.
    // Every one of these factories (CM.python/javascript/json/yaml/html/css)
    // returns a LanguageSupport, not a Language — and `codeLanguages`'s
    // function form is documented to return `Language | LanguageDescription |
    // null`. A LanguageSupport silently satisfies neither shape inside
    // @codemirror/lang-markdown's `getCodeParser`: it is truthy, so it falls
    // into the `else if (found) return found.parser` branch, and a
    // LanguageSupport has no `.parser` of its own — only `.language.parser` —
    // so nesting silently no-ops. The fence still got a FencedCode/CodeText
    // shell with no language-specific children at all: "no highlighting, no
    // error", found by resolving a position inside a fenced block and
    // walking the parent chain in both shapes and diffing them — `.language`
    // produces `import < ImportStatement < Script < FencedCode`, where the
    // bare LanguageSupport produced only `CodeText < FencedCode`.
    // `shellLang`/`tomlLang` are already `Language` instances
    // (`StreamLanguage.define`), not LanguageSupport, so they need no `.language`.
    const CODE_LANG_MAP = {
      python: () => CM.python().language, py: () => CM.python().language,
      javascript: () => CM.javascript().language, js: () => CM.javascript().language,
      jsx: () => CM.javascript({ jsx: true }).language,
      typescript: () => CM.javascript({ typescript: true }).language,
      ts: () => CM.javascript({ typescript: true }).language,
      tsx: () => CM.javascript({ jsx: true, typescript: true }).language,
      json: () => CM.json().language,
      yaml: () => CM.yaml().language, yml: () => CM.yaml().language,
      html: () => CM.html().language,
      css: () => CM.css().language,
      shell: () => CM.shellLang, sh: () => CM.shellLang,
      bash: () => CM.shellLang, zsh: () => CM.shellLang,
      toml: () => CM.tomlLang,
    };
    function codeLanguageFor(info) {
      const name = (info || "").trim().toLowerCase().split(/\s+/)[0];
      const make = CODE_LANG_MAP[name];
      return make ? make() : null;
    }
    // Every fence's language name, for the chip (6b.3) — the info string as
    // typed, not normalised, so `Python` on the fence shows `PYTHON` and a
    // language with no mapped highlighter still gets its chip.
    function fenceInfoText(state, fromLine) {
      const text = state.doc.line(fromLine).text;
      return (/^ {0,3}(?:`{3,}|~{3,})[ \t]*([^\s]*)/.exec(text) || [])[1] || "";
    }

    // `oneDark` (dark mode) already ships its own token colours; light mode
    // had none, so fences there stayed flat grey until this. FIRST DRAFT built
    // the palette out of the UI token set (`--accent`/`--fg`/`--fg-muted`) and
    // that was the wrong source: light mode has exactly ONE accent, so every
    // accent-ish class (keyword, control keyword, number, bool) converged on
    // the same olive-green, which is "bold some words", not syntax colour, and
    // it disagreed with dark mode about what a string looks like (green there,
    // grey here). A syntax palette needs several hues that are BOTH mutually
    // distinguishable and readable on the page, which is a different
    // requirement from "matches the app" — so code gets its own small palette,
    // `--code-keyword`/`--code-string`/`--code-number`/`--code-function`,
    // declared in both `:root` blocks (never a literal here, or
    // test_tier_one_template_has_no_colour_literals_outside_its_palettes
    // fails). Comments and plain text/punctuation stay on the UI tokens
    // (`--fg-muted` italic, `--fg`) — those two are meant to read as quieter
    // than code, in both palettes, which is the one place reusing a UI token
    // is still the right call. The dark block sets the same four names to
    // oneDark's OWN produced colours (unused today — dark still renders
    // through oneDark's own HighlightStyle, not this one — but declared so a
    // future unification has the right values already, and so the two
    // palettes agree on what each token family means).
    const lightCodeHighlight = CM.HighlightStyle.define([
      { tag: [CM.tags.keyword, CM.tags.controlKeyword, CM.tags.operatorKeyword,
              CM.tags.definitionKeyword, CM.tags.moduleKeyword],
        color: "var(--code-keyword)", fontWeight: "600" },
      { tag: [CM.tags.string, CM.tags.special(CM.tags.string)], color: "var(--code-string)" },
      { tag: [CM.tags.comment, CM.tags.lineComment, CM.tags.blockComment],
        color: "var(--fg-muted)", fontStyle: "italic" },
      { tag: [CM.tags.number, CM.tags.bool, CM.tags.atom, CM.tags.null],
        color: "var(--code-number)" },
      { tag: [CM.tags.typeName, CM.tags.className, CM.tags.namespace],
        color: "var(--code-function)", fontWeight: "600" },
      { tag: [CM.tags.propertyName, CM.tags.attributeName], color: "var(--fg-muted)" },
      { tag: [CM.tags.function(CM.tags.variableName), CM.tags.definition(CM.tags.variableName)],
        color: "var(--code-function)", fontWeight: "600" },
      { tag: [CM.tags.variableName, CM.tags.self], color: "var(--fg)" },
      { tag: [CM.tags.operator, CM.tags.punctuation, CM.tags.bracket, CM.tags.meta],
        color: "var(--fg-muted)" },
      { tag: CM.tags.invalid, color: "var(--error)" },
    ]);
    // A stable reference, so the theme-flip reconfigure below can filter it
    // out by identity exactly as it already does for `CM.oneDark`.
    const lightHighlightExt = CM.syntaxHighlighting(lightCodeHighlight);

    const completionTheme = CM.EditorView.theme({
      // `.cm-tooltip.cm-tooltip-autocomplete` rather than the single class: the
      // page's generic `.cm-editor .cm-tooltip` rule is equal-specificity and
      // earlier in <head> (StyleModule mounts first), so the popup's own rules
      // have to out-specify it rather than tie with it.
      ".cm-tooltip.cm-tooltip-autocomplete": {
        border: "1px solid var(--border)",
        borderRadius: "8px",
        background: "var(--bg-alt)",
        color: "var(--fg)",
        boxShadow: "0 6px 24px rgba(0, 0, 0, 0.28)",
        overflow: "hidden",
      },
      ".cm-tooltip.cm-tooltip-autocomplete > ul": {
        margin: "0",
        padding: "4px",
        // Not monospace: these rows are paths and heading text, which is what the
        // rest of this view sets in the body font.
        fontFamily: "inherit",
        fontSize: "13px",
        minWidth: "16em",
        maxWidth: "34em",
        // Tidy scrolling for a vault-sized list instead of a popup the height of
        // the window.
        maxHeight: "16em",
        overflow: "hidden auto",
        scrollbarWidth: "thin",
      },
      ".cm-tooltip.cm-tooltip-autocomplete > ul > li": {
        display: "flex",
        alignItems: "baseline",
        columnGap: "8px",
        padding: "4px 7px",
        borderRadius: "5px",
        // The accent edge's slot, transparent until the row is the selected one,
        // so selecting a row does not shift its text.
        borderLeft: "2px solid transparent",
        lineHeight: "1.35",
        cursor: "pointer",
      },
      ".cm-tooltip.cm-tooltip-autocomplete > ul > li[aria-selected]": {
        background: "var(--bg)",
        color: "var(--fg)",
        borderLeftColor: "var(--accent)",
        fontWeight: "600",
      },
      ".cm-tooltip.cm-tooltip-autocomplete > ul > li:hover:not([aria-selected])": {
        background: "var(--bg)",
      },
      // `white-space: pre` is load-bearing: a heading row says its level with
      // leading spaces, and HTML would collapse them.
      ".cm-tooltip-autocomplete .cm-completionLabel": {
        flex: "0 1 auto",
        minWidth: "0",
        overflow: "hidden",
        textOverflow: "ellipsis",
        whiteSpace: "pre",
      },
      // The typed substring. Emphasised, because in a list this long the matched
      // characters are the only thing telling you why a row is still here.
      ".cm-tooltip-autocomplete .cm-completionMatchedText": {
        textDecoration: "none",
        color: "var(--accent)",
        fontWeight: "700",
      },
      // Its own dimmed column, pushed right — `docs/other.mddocs/other.md` and
      // `a.pngembed` were the label and the detail with nothing between them.
      ".cm-tooltip-autocomplete .cm-completionDetail": {
        marginLeft: "auto",
        flex: "none",
        paddingLeft: "12px",
        fontStyle: "normal",
        fontSize: "11px",
        color: "var(--fg-muted)",
      },
    });

    function editorExtensions() {
      const base = [
        completionTheme,
        CM.basicSetup,
        // Dark gets oneDark's own token colours; light gets this view's own
        // token-based HighlightStyle, since oneDark is dark-only (6b.2).
        ...(wantsDark() ? [CM.oneDark] : [lightHighlightExt]),
        CM.markdown({ base: CM.markdownLanguage, codeLanguages: codeLanguageFor }),
        CM.EditorView.lineWrapping,
        // Above basicSetup's default keymap: Enter must continue the list
        // marker rather than plain-indent, and Tab must indent the list item.
        CM.Prec.high(CM.keymap.of(CM.markdownKeymap.concat(editorKeymap))),
        renumberFilter,
        // One source per context, not one function with a chain of regexes: CM
        // runs every source and merges what they return, so each stays a single
        // trigger with a single answer. `override` still replaces the default
        // sources wholesale, and still at high precedence.
        CM.Prec.high(CM.autocompletion({
          override: [
            wikilinkCompletions, inlinePathCompletions, headingAnchorCompletions,
            slashMenuCompletions,
          ],
          // No icon column (D192). CM renders the `type` field as a glyph, and
          // its glyph for `text` is the literal string "abc" — on every path
          // row, which is not what any of these rows are. The row itself already
          // names its kind (an extension, `.md` or not; an indented heading; the
          // `embed` detail), so the column could only spend width to repeat it —
          // or, with two type values across four contexts, to blur it.
          icons: false,
        })),
        pasteHandler,
        livePreviewField,
        CM.EditorView.updateListener.of((update) => {
          if (update.docChanged) {
            setDirty(true);
            armAutosave();
            // The outline's only trigger: headings change as you type, and this
            // is the event that says the document did (MD-19b — no timer, no
            // poll).
            renderOutline();
          }
          if (update.docChanged || update.selectionSet) updateFmtBubble(update.view);
        }),
      ];
      if (!writable) {
        // An UNWRITABLE file (MD-15): the server refuses the write anyway, and
        // opening disabled is what makes the UI honest up front — on an rclone
        // mount with CacheMode=full a doomed write even succeeds locally and
        // only 403s later on upload, so this reads the shell's persisted
        // read_only flag through stat.writable rather than os.access. A
        // writable note is otherwise always editable (MD-1a): there is no mode
        // to gate this a second way.
        base.push(CM.EditorView.editable.of(false));
        base.push(CM.EditorState.readOnly.of(true));
      }
      return base;
    }

    function buildEditor(body) {
      const previous = view;
      const selection = previous ? previous.state.selection.main.head : cursorMemory();
      const scroll = previous ? previous.scrollDOM.scrollTop : 0;
      previous?.destroy();
      editorWrapEl.innerHTML = "";
      const extensions = editorExtensions();
      view = new CM.EditorView({ doc: body, extensions, parent: editorWrapEl });
      const at = Math.min(selection, view.state.doc.length);
      view.dispatch({ selection: { anchor: at } });
      view.scrollDOM.scrollTop = scroll;
      // Every path that replaces the document comes through here — the first
      // load, an external reload, switching note, switching mode — and each of
      // them can change the headings, so the outline is redrawn from the new doc.
      outlineKey = null;
      renderOutline();
      // The active-heading marker's only trigger besides typing (MD-19b/§2):
      // the editor's own scroll event, never a timer. `buildEditor` replaces
      // the DOM wholesale, so this is reattached each time rather than once.
      // The format bubble also dismisses on scroll (6c) — same event, no new
      // event source.
      view.scrollDOM.addEventListener("scroll", () => {
        updateActiveHeading();
        hideFmtBubble();
      }, { passive: true });

      // A live appearance change reconfigures the RUNNING view — rebuilding it
      // would throw away unsaved edits, the caret and the scroll position.
      themeObserver?.disconnect();
      themedDark = wantsDark();
      themeObserver = new MutationObserver(() => {
        const next = wantsDark();
        if (next === themedDark || !view) return;
        themedDark = next;
        try {
          view.dispatch({
            effects: CM.StateEffect.reconfigure.of(
              extensions.filter((e) => e !== CM.oneDark && e !== lightHighlightExt)
                .concat(next ? [CM.oneDark] : [lightHighlightExt])),
          });
        } catch (err) { /* cosmetic only — keep the current editor theme */ }
      });
      themeObserver.observe(document.documentElement,
        { attributes: true, attributeFilter: ["data-theme"] });
    }

    // Cursor position per file, so switching away and back lands where you were
    // (Obsidian remembers this; sessionStorage is the right lifetime for it).
    function cursorKey() { return "fused-md-cursor:" + file; }
    function cursorMemory() {
      try { return parseInt(sessionStorage.getItem(cursorKey()) || "0", 10) || 0; }
      catch (e) { return 0; }
    }
    function rememberCursor() {
      if (!view) return;
      try { sessionStorage.setItem(cursorKey(), String(view.state.selection.main.head)); }
      catch (e) { /* private mode — the memory is a nicety */ }
    }

    // `?heading=` is how a `[[Note#Heading]]` link arrives. There are no
    // rendered headings to scan any more, so the doc itself is the index:
    // scroll the matching ATX line into view without moving the caret onto it,
    // which would un-render that line the moment you arrived.
    //
    // The argument is for `[[#Heading]]`, an anchor into THIS note: same jump,
    // no navigation and no param, because the document is already open.
    function scrollToHeading(heading) {
      const wanted = (heading === undefined
        ? fused.params.get("heading") || "" : heading).trim().toLowerCase();
      if (!wanted || !view) return;
      const doc = view.state.doc;
      for (let n = 1; n <= doc.lines; n++) {
        const match = /^#{1,6}\s+(.*)$/.exec(doc.line(n).text);
        if (match && match[1].trim().toLowerCase() === wanted) {
          scrollToLine(n);
          return;
        }
      }
    }

    // A GitHub-style in-page anchor, `[label](#some-heading)` — different from
    // `[[#Heading]]` (`scrollToHeading`, exact text): the convention there is
    // a SLUGGED heading id (lowercased, non-word characters stripped, spaces
    // to hyphens), not the heading's literal text, and the two must not be
    // conflated into one function — `scrollToHeading` is also what
    // `?heading=` navigation and every wikilink anchor rely on, and loosening
    // its match to "or slugged" risks a heading that merely slugs to the same
    // string as another stealing the jump. Exact text is tried first
    // regardless (a note that literally titles a heading with a slug-shaped
    // string should still win), slug second.
    function slugifyHeading(text) {
      return text.toLowerCase().trim().replace(/[^\w\s-]/g, "").replace(/\s+/g, "-");
    }
    function scrollToAnchorHash(hash) {
      const wanted = decodeMaybe(String(hash).replace(/^#/, "")).trim();
      if (!wanted || !view) return;
      const doc = view.state.doc;
      const wantedSlug = slugifyHeading(wanted);
      let slugLine = -1;
      for (let n = 1; n <= doc.lines; n++) {
        const match = /^#{1,6}\s+(.*)$/.exec(doc.line(n).text);
        if (!match) continue;
        const text = match[1].trim();
        if (text.toLowerCase() === wanted.toLowerCase()) { scrollToLine(n); return; }
        if (slugLine === -1 && slugifyHeading(text) === wantedSlug) slugLine = n;
      }
      if (slugLine !== -1) scrollToLine(slugLine);
    }

    // MD-4b's rule in one place, so every heading jump obeys it: scroll the line
    // into view and leave the caret alone. The outline (below) scrolls by LINE
    // rather than by text because it built the row from that line — matching by
    // text would re-search the document and hand the second `## Notes` to the
    // first one.
    function scrollToLine(n) {
      if (!view || !(n >= 1) || n > view.state.doc.lines) return;
      view.dispatch({
        effects: CM.EditorView.scrollIntoView(view.state.doc.line(n).from, { y: "start" }),
      });
    }

    // ---- the outline, in the same sidebar (MD-19b) --------------------------
    // Read from the LIVE document, never from `notes.headings`: the payload only
    // re-parses on save (MD-9), so a payload-fed outline would lag every heading
    // you type by up to one autosave interval — and a stale outline is the one
    // thing an outline may not be. The document is already the index for
    // `?heading=` (MD-4b), so this is the same source of truth read the same way,
    // and it needs no timer: the editor's existing docChanged listener is the
    // only trigger this has (nothing in this template polls — MD-17).
    //
    // Frontmatter and fenced code are masked exactly as graph.py's `_mask_code`
    // masks them, because `# not a heading` inside a fenced block appears in no
    // other heading surface (the `[[#` popup, the graph payload) and must not
    // appear here either. ATX only, which is all `_HEADING` and `scrollToHeading`
    // know. Not the syntax tree, tempting as it is: `syntaxTree(state)` is parsed
    // only as far as CM has got, so on a long note the tail headings would
    // silently be missing from the outline.
    function documentHeadings() {
      if (!view) return [];
      const doc = view.state.doc;
      const rows = [];
      let fence = null;         // the opening run while inside a fenced block
      // The closer is found BEFORE anything is skipped, which is the whole point:
      // an UNCLOSED `---` is not frontmatter, it is a horizontal rule someone is
      // still typing under. Marking it open and skipping to the end of the
      // document blanked the entire outline from the keystroke that opened the
      // block until the one that closed it, while graph.py's `_frontmatter_span`
      // and the decoration scan above both kept those headings — three surfaces
      // for the same note disagreeing (MD-19b, and MD-18a for the same rule).
      let frontmatterEnd = 0;
      if (doc.lines > 1 && doc.line(1).text.trim() === "---") {
        for (let n = 2; n <= doc.lines; n++) {
          if (/^(---|\.\.\.)[ \t]*$/.test(doc.line(n).text)) { frontmatterEnd = n; break; }
        }
      }
      for (let n = frontmatterEnd + 1; n <= doc.lines; n++) {
        const text = doc.line(n).text;
        const opener = /^ {0,3}(`{3,}|~{3,})/.exec(text);
        if (fence !== null) {
          // Inside a fence everything is code, including the closing line.
          if (opener && opener[1][0] === fence[0] && opener[1].length >= fence.length) {
            fence = null;
          }
          continue;
        }
        if (opener) { fence = opener[1]; continue; }
        const match = /^(#{1,6})[ \t]+(.+?)[ \t]*#*[ \t]*$/.exec(text);
        if (match) rows.push({ level: match[1].length, text: match[2], line: n });
      }
      return rows;
    }

    // The last outline drawn, so an unchanged one is not redrawn. Load-bearing,
    // not an optimisation: this runs on every keystroke, and rewriting the list's
    // innerHTML while someone types inside a heading would reset the outline's
    // own scroll position and drop the row under their pointer.
    let outlineKey = null;
    let outlineRows = [];  // the last rows drawn, for the active-heading marker

    function renderOutline() {
      const listEl = document.getElementById("outline");
      if (!outlineOn()) {
        // The rail is collapsed; there is nothing to draw and this is the hot path.
        outlineKey = null;
        return;
      }
      const rows = documentHeadings();
      const key = rows.map((r) => `${r.line}:${r.level}:${r.text}`).join("\n");
      if (key === outlineKey) { updateActiveHeading(); return; }
      outlineKey = key;
      outlineRows = rows;

      const drawn = withDepth(rows);

      // No count in the head (owner: a bare numeral right after "Outline"
      // reads as an ordinal, not a count — and the list is visible anyway).
      listEl.innerHTML = drawn.length
        ? drawn.map((row) => `
            <button class="bl ol" style="--ol-depth: ${row.depth}"
                    data-line="${row.line}" title="${escapeHtml(row.text)}">
              <span class="ol-text">${escapeHtml(row.text)}</span>
            </button>`).join("")
        // Same voice as the backlinks empty state: state the absence as a fact
        // about this note, rather than hiding the section.
        : `<div class="bl-empty">No headings yet.</div>`;
      updateActiveHeading();
    }

    // The signature element (§2): a 2px accent bar on the row for the heading
    // currently at (or just above) the top of the viewport. No timer — driven
    // off the editor's own scroll and update events, the same poll-free
    // discipline MD-17 already holds this template to. The last heading whose
    // line top has scrolled past the viewport's top edge is "current",
    // matching how a table of contents tracks reading position elsewhere.
    function updateActiveHeading() {
      if (!view) return;
      const listEl = document.getElementById("outline");
      let current = null;
      if (outlineRows.length) {
        const top = view.scrollDOM.scrollTop;
        for (const row of outlineRows) {
          if (row.line > view.state.doc.lines) continue;
          const block = view.lineBlockAt(view.state.doc.line(row.line).from);
          if (block.top <= top + 4) current = row.line;
          else break;
        }
      }
      for (const el of listEl.querySelectorAll(".ol.current")) el.classList.remove("current");
      if (current !== null) {
        const el = listEl.querySelector(`[data-line="${current}"]`);
        if (el) el.classList.add("current");
      }
    }

    // ---- backlinks, in the sidebar ------------------------------------------
    function renderSidebar() {
      const linksEl = document.getElementById("links");
      const listEl = document.getElementById("bl-list");
      const noticeEl = document.getElementById("notice");
      if (!notes) {
        // Say WHY rather than hiding the section. An empty backlinks panel reads
        // as "nothing links here", which is an answer we never computed — the
        // same mistake the ghost rendering used to make (MD-11).
        linksEl.hidden = false;
        listEl.innerHTML = "";
        linksCountEl.textContent = "";
        // graph.py's own words for why, so a mount refusal, a note outside its
        // root and a failed scan each read as themselves.
        noticeEl.textContent = "Backlinks need a folder scan. " + scanNotice;
        noticeEl.hidden = false;
        return;
      }
      linksEl.hidden = false;

      // One row per LINKING NOTE, not per link: a note that references this one
      // three times rendered as three identical rows, which read as three
      // different notes until the paths were compared. The multiplicity is
      // real information — it just belongs in a count on the one row, and the
      // header keeps counting notes, since "how many notes point here" is the
      // question a backlinks panel answers.
      const byPath = new Map();
      for (const row of notes.backlinks || []) {
        const seen = byPath.get(row.path);
        if (seen) seen.count += 1;
        else byPath.set(row.path, { ...row, count: 1 });
      }
      const rows = [...byPath.values()];
      // A PILL, not text appended to the label (`.panel-count` — never
      // "Backlinks 3", which reads as an ordinal): genuinely informative
      // here, unlike the outline's, because the list can be capped or
      // scrolled and the number says something the visible rows do not.
      linksCountEl.textContent = rows.length ? String(rows.length) : "";
      listEl.innerHTML = rows.length
        ? rows.map((row) => `
            <button class="bl" data-path="${escapeHtml(row.path)}">
              <span class="bl-title">${escapeHtml(row.title)}</span>
              <span class="bl-path">${escapeHtml(row.rel)}</span>
              ${row.count > 1 ? `<span class="bl-count">×${row.count}</span>` : ""}
            </button>`).join("")
        : `<div class="bl-empty">No other note under ${escapeHtml(notes.root)}
             links here.</div>`;

      // Caps are reported, never silently applied (MD-10).
      const notices = [];
      if (notes.truncated) {
        // Any cap can set `truncated` — notes, assets, or the walk's total-entry
        // budget — so the wording says a cap fired without claiming which.
        notices.push(`Partial scan: ${notes.notes} note(s) under
          ${escapeHtml(notes.root)} were indexed before the walk hit a cap, so some
          backlinks or embeds may be missing.`);
      }
      noticeEl.innerHTML = notices.join("<br />");
      noticeEl.hidden = !notices.length;
    }

    async function refreshLinks() {
      const root = fused.params.get("root") || "";
      try {
        const data = await fused.runPython("./graph.py",
          { action: "note", file, root }, { key: "md-note" });
        if (data.error) {
          // A mount-backed root, or a note outside its root: the document still
          // renders and stays editable, the link layer just has nothing to say
          // (MD-11). Reading and writing one file never needed the walk. Note
          // `resolved = null` means UNKNOWN, not "nothing resolved" — every
          // wikilink renders inert rather than as a ghost.
          notes = null;
          resolved = null;
          scanNotice = data.message || UNRESOLVED_HERE;
        } else {
          notes = data;
          scanNotice = "";
          resolved = new Map();
          for (const link of data.links) {
            if (!resolved.has(link.target)) resolved.set(link.target, link);
          }
        }
      } catch (err) {
        notes = null;
        resolved = null;
        scanNotice = "The folder scan failed: " + (err.message || String(err));
      }
      renderSidebar();
      updateGraphSection();
      // Every ghost may just have become a real link (or the reverse), and the
      // decorations were built against the old answer.
      view?.dispatch({ effects: relinkEffect.of(null) });
      return notes;
    }

    // ---- the graph, conditional (§5) -----------------------------------------
    // Drawn only when the note actually has links — an outbound one this scan
    // resolved, or a backlink. Otherwise the section is ABSENT, not an empty
    // canvas: an empty graph would tell you the note is an orphan a second
    // time, with a canvas, after the backlinks list already told you once.
    // On the no-scan path the section stays absent too, and the backlinks
    // notice already says why in graph.py's own words — "nobody looked" is not
    // "there is nothing" (MD-11a), and that distinction belongs to one surface,
    // not two.
    // `notes.links` carries EVERY authored link in this note, resolved or not
    // (an entry for a ghost still has an offset, a target and a null `path`) —
    // so `.length > 0` was true for a note whose every link is an unresolved
    // ghost, which drew the graph section over a note that, by plan §5's own
    // words ("a resolved outbound link"), has none. `link.path` is truthy only
    // once graph.py has actually resolved it against a real file (MD-4/MD-6),
    // so that is the field this checks — not mere presence in the array.
    function hasLinks() {
      return !!notes && (
        (notes.links && notes.links.some((link) => !!link.path))
        || (notes.backlinks && notes.backlinks.length > 0));
    }
    function updateGraphSection() {
      document.getElementById("graph-sec").hidden = !hasLinks();
    }

    // Clicking an unresolved link creates the note — Obsidian's behaviour, and
    // only possible because this template writes.
    async function createGhost(target) {
      if (!notes) return;
      const clean = String(target).replace(/\\/g, "/").replace(/^(\.\/)+/, "");
      const name = /\.(md|markdown)$/i.test(clean) ? clean : clean + ".md";
      // Belt and braces against a degenerate target (a directory link used to
      // produce a file called literally `.md`): graph.py no longer makes a ghost
      // for one, and this refuses to act on one if it ever arrives anyway.
      if (!name.replace(/\.(md|markdown)$/i, "").split("/").pop()) return;
      // WHERE it lands has to be decided the way graph.py's `resolve_link`
      // decides it, or this creates a note the graph that offered it will never
      // look for. That is the same divergence MD-3 exists to prevent, here in
      // the one place the page computes a path of its own. The resolver tries the
      // linking note's OWN FOLDER first and the vault root second, so an
      // explicitly relative target means "from this note" and a plain
      // `folder/note` means "from the root" — Obsidian's convention.
      const relative = /(^|\/)\.\.(\/|$)/.test(clean);
      const base = relative || !clean.includes("/") ? noteDir() : notes.root;
      const path = resolvePath(base, name);
      // A note created outside the scan root is invisible to the graph that
      // offered to create it, so the offer would be incoherent — and `..` in a
      // target is exactly how a write escapes upwards. The boundary slash keeps
      // a sibling folder with a shared prefix out.
      const root = notes.root.replace(/\/+$/, "");
      if (path !== root && !path.startsWith(root + "/")) {
        saveStateEl.textContent =
          "Won't create " + name + ": that is outside " + root + ".";
        saveStateEl.classList.add("error");
        return;
      }
      // CREATE-ONLY, and the server decides (`create: true` → 409 on an
      // existing path). This is load-bearing and must not be "simplified" back
      // to a plain write, nor to stat-then-write: a ghost is not proof the
      // target is missing. `resolved` holds only the LAST scan's answers, so a
      // link you just typed is a ghost until the next scan lands, and an
      // ambiguous target is a ghost by design (graph.py's `_only`) — the very
      // case where a real note sits at this path. An unconditional write there
      // replaced someone's note with a one-line stub.
      //
      // So: absent → created; already there → we navigate to it, which is what
      // clicking a link that turned out to be real should do anyway; anything
      // else (a directory at the path, an unwritable file or parent) is
      // reported. Note what is NOT here: a swallowed error. Treating every
      // failure as "absent" is how the clobber hid.
      try {
        await fused.writeFile(path, "# " + name.replace(/\.(md|markdown)$/i, "") + "\n",
          { create: true });
      } catch (err) {
        if (err.type !== "exists") {
          saveStateEl.textContent = "Could not create " + name + ": " + (err.message || "");
          saveStateEl.classList.add("error");
          return;
        }
      }
      openNote(path, "");
    }

    // One delegated handler for every link surface: wikilink and markdown-link
    // widgets and backlink rows all carry data-path; ghosts carry data-create.
    // ---- opening a `[label](url)`/bare-URL link (D620 follow-up) -----------
    // The note surface used to open read-only by default, and inside a
    // NON-editable CM view a plain `<a>` activates natively (the browser
    // handles the click). Now that a writable note is always editable
    // (MD-1a), the surface is `contenteditable`, and a click inside
    // `contenteditable` never follows a link — the browser places the caret
    // instead, which is standard behaviour, not a CodeMirror quirk. So every
    // link here needs EXPLICIT JS activation; native `href` alone is dead.
    // `window.open(url, "_blank", "noopener")` is the same idiom
    // `claude/template.html`'s artifact rows already use for an outbound
    // link from inside this app's iframes — not a new mechanism.
    function openLinkHref(href) {
      if (href.startsWith("#")) { scrollToAnchorHash(href); return; }
      try { window.open(href, "_blank", "noopener"); }
      catch (e) { /* popup blocked or similar — nothing else to fall back to */ }
    }

    document.addEventListener("click", (event) => {
      // `[[#Heading]]`: the target note IS this one, so this is a scroll, not a
      // navigation. Checked first — its data attribute is the narrowest.
      const anchor = event.target.closest("[data-anchor]");
      if (anchor) {
        event.preventDefault();
        scrollToHeading(anchor.getAttribute("data-anchor"));
        return;
      }
      // An outline row: it knows the line it was built from, so it scrolls to
      // that line instead of re-finding the heading by text (see scrollToLine).
      const outlined = event.target.closest("[data-line]");
      if (outlined) {
        event.preventDefault();
        scrollToLine(parseInt(outlined.getAttribute("data-line"), 10));
        return;
      }
      const create = event.target.closest("[data-create]");
      if (create) {
        event.preventDefault();
        void createGhost(create.getAttribute("data-create"));
        return;
      }
      const el = event.target.closest("[data-path]");
      if (el) {
        event.preventDefault();
        openNote(el.getAttribute("data-path"), el.getAttribute("data-heading") || "");
        return;
      }
      // `markdownLinkWidget`'s external/absolute/mailto/bare-`#anchor` branch
      // and `pushUrl`'s bare-URL mark both land here — anything already
      // handled above (a resolved vault link) carries `data-path` and
      // returned first. `.lp-bare-link` (pushUrl) is a MARK over live,
      // editable text, unlike the WIDGET `[label](url)` produces — a widget
      // is opaque to CodeMirror's own pointer handling (the caret cannot
      // land on it regardless), but a mark is ordinary prose the caret
      // legitimately belongs in, so a plain click there must keep editing,
      // matching "do not intercept anything that is not a rendered link
      // widget". Only Ctrl/Cmd-click opens a bare URL; a `[label](url)`
      // widget opens on a plain click, same as a vault link always has.
      const link = event.target.closest("a.lp-link[href]");
      if (link) {
        if (link.classList.contains("lp-bare-link") && !(event.metaKey || event.ctrlKey)) return;
        event.preventDefault();
        openLinkHref(link.getAttribute("href"));
      }
    });

    // Middle-click ("auxclick", not "click" — a plain `click` listener never
    // sees it) opening a link is standard browser behaviour this surface lost
    // the same way a plain click did; restored here for both link shapes,
    // since a middle-click's whole point is "open without touching the
    // caret", so `.lp-bare-link` does not need the Ctrl/Cmd gate a `click`
    // does.
    document.addEventListener("auxclick", (event) => {
      if (event.button !== 1) return;
      const link = event.target.closest("a.lp-link[href]");
      if (!link) return;
      event.preventDefault();
      openLinkHref(link.getAttribute("href"));
    });

    document.getElementById("reload").addEventListener("click", () => void reloadFromDisk());
    document.getElementById("keep").addEventListener("click", () => void keepMine());

    // ---- the image lightbox (6a) ---------------------------------------------
    // An overlay + key handler over the already-rendered `<img class="lp-img">`
    // widgets (imageWidget) — not a rendering change. Navigation walks the
    // SOURCE in document order (`collectDocImages`), not the DOM: CodeMirror
    // only renders the current viewport, so a DOM query would miss every
    // image outside it on a long note.
    const lightboxEl = document.getElementById("lightbox");
    const lbImgEl = document.getElementById("lb-img");
    const lbCaptionEl = document.getElementById("lb-caption");
    const lbCloseEl = document.getElementById("lb-close");
    const lbPrevEl = document.getElementById("lb-prev");
    const lbNextEl = document.getElementById("lb-next");
    let lbImages = [];
    let lbIndex = -1;

    // Videos are excluded — they already play in place with native controls,
    // and a lightbox adds nothing there.
    function collectDocImages() {
      if (!view) return [];
      const doc = view.state.doc.toString();
      const re = /!\[([^\]]*)\]\(([^()\s]*)\)/g;
      const out = [];
      let match;
      while ((match = re.exec(doc))) {
        const src = match[2];
        if (VIDEO_EXT.test(src.split(/[?#]/)[0])) continue;
        const url = /^[a-z][a-z0-9+.-]*:/i.test(src) ? src
          : src.startsWith("/") ? fused.rawUrl(src)
          : fused.rawUrl(resolvePath(noteDir(), decodeMaybe(src)));
        out.push({ pos: match.index, alt: match[1], url });
      }
      return out;
    }

    function showLightboxAt(index) {
      if (!lbImages.length) return;
      lbIndex = ((index % lbImages.length) + lbImages.length) % lbImages.length;
      const image = lbImages[lbIndex];
      lbImgEl.src = image.url;
      lbImgEl.alt = image.alt || "";
      lbCaptionEl.textContent = image.alt || "";
      const multiple = lbImages.length > 1;
      lbPrevEl.hidden = !multiple;
      lbNextEl.hidden = !multiple;
      lightboxEl.hidden = false;
    }

    // A modal that leaves the surface behind it live is not modal: opening
    // the lightbox over an ALWAYS-EDITABLE document (MD-1a) previously left
    // focus in the CM editor, so typing while an image was open still edited
    // the note (and the 2s idle autosave committed it), and the arrow keys
    // raced CodeMirror's own keymap — the window-level listener below fired
    // in the BUBBLE phase, strictly after CM's own contentDOM handlers had
    // already run. Two independent fixes, not one: focus genuinely MOVES
    // into the overlay on open (the browser only ever routes keydown to the
    // focused element, so this alone stops the bleed-through in the normal
    // case) and back to the editor on close; the keydown listener is also
    // re-registered in the CAPTURE phase and calls `stopPropagation()`
    // unconditionally while open, so it is authoritative even if focus ever
    // lands somewhere unexpected — defense in depth, not a substitute for
    // moving focus.
    function lightboxFocusables() {
      return [lbCloseEl, lbPrevEl, lbNextEl].filter((el) => !el.hidden);
    }
    // A dialog traps Tab within itself rather than leaking focus back into
    // the document behind it.
    function cycleLightboxFocus(backwards) {
      const items = lightboxFocusables();
      if (!items.length) return;
      const at = items.indexOf(document.activeElement);
      const next = backwards
        ? (at <= 0 ? items.length - 1 : at - 1)
        : (at === -1 || at === items.length - 1 ? 0 : at + 1);
      items[next].focus();
    }

    function openLightbox(pos) {
      lbImages = collectDocImages();
      const at = lbImages.findIndex((image) => image.pos === pos);
      showLightboxAt(at === -1 ? 0 : at);
      lbCloseEl.focus();
    }

    function closeLightbox() {
      lightboxEl.hidden = true;
      lbImgEl.src = "";
      lbImages = [];
      lbIndex = -1;
      // Hand the caret back to the document, not wherever focus happens to
      // land by default (the <body>) — the user was editing before this
      // opened, and closing it should not silently drop them out of it.
      if (view) view.focus();
    }

    lbCloseEl.addEventListener("click", closeLightbox);
    lbPrevEl.addEventListener("click", () => showLightboxAt(lbIndex - 1));
    lbNextEl.addEventListener("click", () => showLightboxAt(lbIndex + 1));
    // A click on the backdrop closes it; a click on the image or the buttons
    // must not, which `e.target === lightboxEl` tells apart.
    lightboxEl.addEventListener("click", (event) => {
      if (event.target === lightboxEl) closeLightbox();
    });
    window.addEventListener("keydown", (event) => {
      if (lightboxEl.hidden) return;
      if (event.key === "Escape") { event.preventDefault(); closeLightbox(); }
      else if (event.key === "ArrowLeft") { event.preventDefault(); showLightboxAt(lbIndex - 1); }
      else if (event.key === "ArrowRight") { event.preventDefault(); showLightboxAt(lbIndex + 1); }
      else if (event.key === "Tab") { event.preventDefault(); cycleLightboxFocus(event.shiftKey); }
      // Authoritative while open (see the comment above `openLightbox`): every
      // key stops here, whether or not the lightbox itself uses it, so none
      // of them ever reach the editable document underneath.
      event.stopPropagation();
    }, true);

    // ---- the selection format bubble (6c) ------------------------------------
    // Positioned by hand from `view.coordsAtPos`, not CM's tooltip API (not
    // bundled, and the plan says stay out of that rebuild). Every button calls
    // the SAME command the keyboard shortcut does — `toggleWrap`/`insertLink`
    // — so there is no second definition of what bold means.
    const fmtBubbleEl = document.getElementById("fmt-bubble");
    const fmtTurnBtnEl = document.getElementById("fmt-turn-btn");
    const fmtTurnMenuEl = document.getElementById("fmt-turn-menu");
    const FMT_MARKERS = { bold: "**", italic: "*", strike: "~~", code: "`" };

    // "Turn into" reuses the same BLOCK_TYPES the `/` menu draws from, minus
    // the kinds a per-line RETROACTIVE conversion cannot express (table,
    // divider, callout are insertions with nothing to turn existing text
    // into).
    const TURN_INTO_KINDS = ["p", "h1", "h2", "h3", "quote", "bullet", "number", "task", "code"];
    fmtTurnMenuEl.innerHTML = BLOCK_TYPES
      .filter((t) => TURN_INTO_KINDS.includes(t.kind))
      .map((t) => `<button type="button" data-kind="${t.kind}">${escapeHtml(t.label)}</button>`)
      .join("");

    function closeTurnMenu() { fmtTurnMenuEl.hidden = true; }

    function hideFmtBubble() {
      fmtBubbleEl.hidden = true;
      closeTurnMenu();
    }

    // A mark already applied shows pressed — `**word**` with the caret inside
    // reads as Bold already ON — using the same pre/post wrap test `toggleWrap`
    // itself uses to decide whether to unwrap.
    function markActive(state, marker) {
      const { from, to } = state.selection.main;
      const pre = state.sliceDoc(Math.max(0, from - marker.length), from);
      const post = state.sliceDoc(to, Math.min(state.doc.length, to + marker.length));
      return pre === marker && post === marker;
    }

    function updateFmtBubble(editorView) {
      if (!editorView || editorView.state.readOnly) { hideFmtBubble(); return; }
      const sel = editorView.state.selection.main;
      if (sel.empty) { hideFmtBubble(); return; }
      const start = editorView.coordsAtPos(sel.from);
      const end = editorView.coordsAtPos(sel.to);
      if (!start || !end) { hideFmtBubble(); return; }
      for (const [cmd, marker] of Object.entries(FMT_MARKERS)) {
        const btn = document.getElementById("fmt-" + cmd);
        if (btn) btn.setAttribute("aria-pressed", String(markActive(editorView.state, marker)));
      }
      const linkBtn = document.getElementById("fmt-link");
      if (linkBtn) {
        linkBtn.setAttribute("aria-pressed",
          String(!!enclosingLinkTarget(editorView.state, sel.to)));
      }
      fmtBubbleEl.hidden = false;
      const top = Math.min(start.top, end.top);
      const bottom = Math.max(start.bottom, end.bottom);
      const left = Math.min(start.left, end.left);
      const right = Math.max(start.right, end.right);
      const bw = fmtBubbleEl.offsetWidth;
      const bh = fmtBubbleEl.offsetHeight;
      let x = (left + right) / 2 - bw / 2;
      x = Math.max(8, Math.min(window.innerWidth - bw - 8, x));
      // Flips BELOW the selection when there is no room above — "near the top
      // of the viewport" is exactly the case that needs it. The 10px gap
      // (rather than a bare few px) keeps the bubble from sitting flush on
      // the line above the selection, which otherwise reads as covering it.
      let y = top - bh - 10;
      if (y < 8) y = bottom + 10;
      fmtBubbleEl.style.left = x + "px";
      fmtBubbleEl.style.top = y + "px";
    }

    // Clicking the bubble must not steal the editor's selection — the browser
    // collapses a text selection on mousedown elsewhere by default.
    fmtBubbleEl.addEventListener("mousedown", (event) => event.preventDefault());
    fmtBubbleEl.addEventListener("click", (event) => {
      if (!view) return;
      const cmdBtn = event.target.closest("[data-cmd]");
      if (cmdBtn) {
        const marker = FMT_MARKERS[cmdBtn.dataset.cmd];
        if (marker) toggleWrap(view, marker);
        else if (cmdBtn.dataset.cmd === "link") insertLink(view);
        view.focus();
        updateFmtBubble(view);
        return;
      }
      if (event.target === fmtTurnBtnEl || fmtTurnBtnEl.contains(event.target)) {
        fmtTurnMenuEl.hidden = !fmtTurnMenuEl.hidden;
        return;
      }
      const turnItem = event.target.closest("[data-kind]");
      if (turnItem) {
        convertLines(turnItem.dataset.kind);
        closeTurnMenu();
        hideFmtBubble();
      }
    });
    // Dismissed on Escape, on scroll, and on blur (6c) — the scroll hook rides
    // the same `scrollDOM` listener the active-heading marker uses, so this
    // adds no new event source, just another handler on it.
    window.addEventListener("keydown", (event) => {
      if (fmtBubbleEl.hidden) return;
      if (event.key === "Escape") { event.preventDefault(); hideFmtBubble(); }
    });
    window.addEventListener("blur", hideFmtBubble);

    // Cmd/Ctrl+S forces the flush early — it is not "the save", because the
    // idle timer and the blur hook already saved. There is no Cmd/Ctrl+E: with
    // one surface there is nothing to toggle to (MD-1).
    window.addEventListener("keydown", (event) => {
      if (!(event.metaKey || event.ctrlKey)) return;
      if (event.key.toLowerCase() !== "s") return;
      event.preventDefault();
      void save();
    });

    // Flush on focus loss and on tab switch, then look for an external change
    // when we come back (see checkExternalChange).
    window.addEventListener("blur", () => { rememberCursor(); void save(); });
    window.addEventListener("pagehide", () => { rememberCursor(); void save(); });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") {
        rememberCursor();
        void save();
      } else {
        void checkExternalChange();
      }
    });
    window.addEventListener("focus", () => { void checkExternalChange(); });

    // Flush hook for the shell: anything that remounts this iframe (a mode
    // switch) would silently discard edits newer than the last autosave.
    window.__fusedFlushEdits = async () => {
      if (!view || !dirty) return { ok: true };
      if (conflictEl.style.display === "flex") return { ok: false };
      await save();
      return { ok: !dirty && conflictEl.style.display !== "flex" };
    };

    // ---- the sidebar's graph (MD-19) ---------------------------------------
    // The canvas, the sim and every interaction rule live in
    // /template-shared/graph-canvas.js, shared with the folder-level `graph`
    // mode — one implementation, so the two surfaces cannot drift apart.
    const sideEl = document.getElementById("side");
    // The panel's own toggle now lives IN it (owner: "follow a structure
    // similar to the left one") — no more floating corner button. `-collapse`
    // sits in the panel's own head row; `-reopen` is the collapsed edge chip,
    // mirroring the rail's pair exactly (`.panel-collapse-btn`/
    // `.panel-reopen-btn`, shared classes — see the CSS).
    const sideCollapseEl = document.getElementById("side-collapse");
    const sideReopenEl = document.getElementById("side-reopen");
    const linksCountEl = document.getElementById("links-count");
    const canvasEl = document.getElementById("graph-canvas");
    const graphCountEl = document.getElementById("graph-count");
    const graphNoteEl = document.getElementById("graph-note");
    const depthEl = document.getElementById("depth");

    const canvas = fusedGraph.create({
      canvas: canvasEl,
      onOpenNote: (path) => openNote(path, ""),
      onCreateGhost: (label) => void createGhost(label),
    });

    // ---- the panels' widths ---------------------------------------------
    // Persisted in localStorage and deliberately NOT in fused.params. Params are
    // the view state a shared URL should reproduce (MD-20) — which note, which
    // heading, sidebar open, graph depth — not which panel is open. How wide
    // someone dragged their panel is personal window furniture, and inheriting
    // it from a link would be a bug, not a feature.
    //
    // Two panels, one document, ONE joint clamp (layoutPanels, below): a width
    // clamped only against its OWN min/max — which is what applySideWidth and
    // applyRailWidth compute here — is the DESIRED width, not the rendered
    // one. Rendering is `layoutPanels`'s job, because whether the document has
    // room for both panels at their desired widths cannot be answered by
    // either panel looking only at itself. `desiredRailPx`/`desiredSidePx`
    // hold that desire; each panel's own drag/keyboard handlers only ever
    // update their own variable and call `layoutPanels()`.
    //
    // THE INVARIANT (stated once, because this template has now conflated
    // "what currently fits" with "what the user asked for" three separate
    // times — `graph=0` written into the URL by a layout-driven close,
    // `#side-reopen` shipping `hidden` backwards, and a drag/keyboard resize
    // reading the rendered, comfort-clamped box back into the stored width):
    // A PERSISTED PREFERENCE — `localStorage`, a `fused.params` write, an
    // element's default visibility — MAY ONLY EVER BE WRITTEN FROM THE
    // USER'S OWN GESTURE, expressed as the size/state they are actually
    // asking for, and NEVER read back out of a clamped or otherwise
    // presentation-only DOM measurement (`getBoundingClientRect`,
    // `style.display`, `style.width`). Concretely here: a drag or an arrow
    // key computes its next value from `desiredSidePx`/`desiredRailPx` (the
    // last INTENT), never from `sideEl`/`railEl`'s current rendered
    // `getBoundingClientRect().width` — that box can be narrower than the
    // desire right now (the comfort target, or the hard floor) without the
    // desire itself having changed, and basing a resize off it would silently
    // adopt the clamp's number as the new preference the moment the user so
    // much as nudges the grip while it is clamped.
    const gripEl = document.getElementById("side-grip");
    const SIDE_KEY = "fused-md-side-width";
    const SIDE_MIN = 15 * 16;   // 15rem — narrower and the backlink rows wrap badly
    const SIDE_MAX = 45 * 16;   // 45rem — wider and the note itself is squeezed
    // 18rem, not the drag range's old 21rem default (owner: "the 2 sidebars
    // are taking a lot of space" — 36rem of chrome against a 46rem document
    // measure was the wrong split). The drag RANGE is untouched — anyone who
    // wants more still has 45rem to go to — only the default moved.
    let desiredSidePx = 18 * 16; // the CSS default (#side's own width: 18rem)

    function applySideWidth(px, persist) {
      desiredSidePx = Math.min(SIDE_MAX, Math.max(SIDE_MIN, Math.round(px)));
      if (persist) {
        try { localStorage.setItem(SIDE_KEY, String(desiredSidePx)); }
        catch (e) { /* private mode — the width is a nicety */ }
      }
      layoutPanels();
    }

    function storedSideWidth() {
      try {
        const raw = parseInt(localStorage.getItem(SIDE_KEY) || "", 10);
        return Number.isFinite(raw) ? raw : 0;
      } catch (e) { return 0; }
    }

    gripEl.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      const startX = event.clientX;
      // `desiredSidePx`, not `sideEl.getBoundingClientRect().width` — see
      // THE INVARIANT above.
      const startWidth = desiredSidePx;
      gripEl.setPointerCapture(event.pointerId);
      // Dragging LEFT widens: the panel is on the right, so its width grows as
      // the pointer moves away from it.
      const onMove = (move) => applySideWidth(startWidth + (startX - move.clientX), false);
      const onUp = () => {
        gripEl.removeEventListener("pointermove", onMove);
        gripEl.removeEventListener("pointerup", onUp);
        gripEl.removeEventListener("pointercancel", onUp);
        // Persists whatever the last `onMove` already set `desiredSidePx`
        // to — re-clamped against its own MIN/MAX, which is a no-op here
        // since it already was.
        applySideWidth(desiredSidePx, true);
      };
      gripEl.addEventListener("pointermove", onMove);
      gripEl.addEventListener("pointerup", onUp);
      gripEl.addEventListener("pointercancel", onUp);
    });

    gripEl.addEventListener("keydown", (event) => {
      const step = event.key === "ArrowLeft" ? 16 : event.key === "ArrowRight" ? -16 : 0;
      if (!step) return;
      event.preventDefault();
      applySideWidth(desiredSidePx + step, true);
    });

    // ---- the outline rail (MD-19a/MD-19b) ------------------------------------
    // Open by default: absent means open, only an explicit "0" closes it — the
    // rule `graph` and `depth` already follow (MD-20). Width lives in
    // localStorage, like the right panel's, and is clamped so it cannot
    // squeeze the document — jointly with the right panel, see `layoutPanels`.
    const railEl = document.getElementById("outline-rail");
    const railGripEl = document.getElementById("rail-grip");
    const railReopenEl = document.getElementById("rail-reopen");
    const railCollapseEl = document.getElementById("rail-collapse");
    const RAIL_KEY = "fused-md-outline-width";
    const RAIL_MIN = 12 * 16;  // 12rem
    const RAIL_MAX = 30 * 16;  // 30rem
    // The default now EQUALS the floor (owner: "the 2 sidebars are taking a
    // lot of space"). The rail's own rows already ellipsise well before
    // 15rem ("The freeze mechanism: Godot…"), so the extra 3rem the old
    // default spent was buying wider truncated labels, not full ones — a
    // width nobody was actually reading. The drag RANGE is unchanged.
    let desiredRailPx = 12 * 16; // the CSS default (#outline-rail's own width: 12rem)

    function outlineOn() { return fused.params.get("outline") !== "0"; }

    function applyRailWidth(px, persist) {
      desiredRailPx = Math.min(RAIL_MAX, Math.max(RAIL_MIN, Math.round(px)));
      if (persist) {
        try { localStorage.setItem(RAIL_KEY, String(desiredRailPx)); }
        catch (e) { /* private mode — the width is a nicety */ }
      }
      layoutPanels();
    }

    function storedRailWidth() {
      try {
        const raw = parseInt(localStorage.getItem(RAIL_KEY) || "", 10);
        return Number.isFinite(raw) ? raw : 0;
      } catch (e) { return 0; }
    }

    // The document's own HARD floor (MD-19a/MD-19b): 20rem narrower and the
    // prose wraps to a word or two per line — the catastrophic case. Both
    // panels are measured against this ONE number, together, in
    // `layoutPanels` — a panel's own MIN/MAX only says what that panel alone
    // will tolerate, never what the document needs.
    const DOC_FLOOR_PX = 20 * 16;
    // The document's COMFORT target (owner: "the 2 sidebars are taking a lot
    // of space" — 36rem of chrome against a 46rem measure was the wrong
    // split, even though neither panel was anywhere near ITS OWN minimum).
    // This is the ordinary case, not the catastrophic one: before either
    // panel gets its full default width, the document gets first claim on a
    // genuinely readable measure. 35rem, the middle of the owner's suggested
    // 34–36rem — comfortably inside the 46rem cap, so it never competes with
    // the cap itself, and still leaves real room to negotiate above the hard
    // floor. Below this the panels shrink toward their MINIMUMS (not yet
    // closed — that is still the hard floor's job, below).
    const DOC_COMFORT_PX = 35 * 16;

    // The one place either panel's width actually reaches the DOM. Reads the
    // two DESIRED widths (not the last-RENDERED ones — reading those back
    // would ratchet the panels narrower forever on a shrinking window and
    // never recover on a widening one). A narrow window is not the only way
    // to get here: the shell's own Claude-panel iframe can leave this
    // template's `#split` at a fraction of the outer window's width with no
    // navigation and no reload, which is why this is re-run on `resize`
    // (below), not only on open/drag.
    //
    // TWO layers, spent in order, both preferring the RIGHT panel to give
    // ground first (owner's call: the rail is open by default):
    //   1. COMFORT — shrink toward MIN so the document keeps `DOC_COMFORT_PX`
    //      whenever the two panels' DEFAULTS would eat into it. On a wide
    //      window (`room` well past defaults + comfort + the document's
    //      46rem cap) this spends nothing at all: the panels are only ever
    //      taking space the document was never going to use as prose anyway,
    //      which is the whole point — chrome is free above the document's
    //      cap and costs only in the middle range where a note actually gets
    //      read next to an open panel.
    //   2. HARD FLOOR — past MIN, a panel CLOSES outright rather than
    //      rendering a sliver too narrow to read; this view never shows a
    //      squeeze below a panel's own minimum. Presentational only, both
    //      layers: everything here sets `style.display`/`style.width`
    //      directly, which beats both the `.on` class and the `hidden`
    //      attribute on specificity without touching either param, so the
    //      moment there is room again both panels reappear exactly as the
    //      user left them.
    function layoutPanels() {
      const room = document.getElementById("split").getBoundingClientRect().width;
      const railWantsOpen = !railEl.hidden;      // the `outline` param's state
      const sideWantsOpen = sideEl.classList.contains("on"); // the `graph` param's state
      let railOpen = railWantsOpen;
      let sideOpen = sideWantsOpen;
      let railW = railOpen ? desiredRailPx : 0;
      let sideW = sideOpen ? desiredSidePx : 0;

      // Layer 1: the comfort target. Only ever shrinks toward MIN — never
      // closes a panel — so a window just barely tight for the comfort
      // target still shows both panels, merely narrower than their defaults.
      let short = (railW + sideW) - (room - DOC_COMFORT_PX);
      if (short > 0 && sideOpen) {
        const give = Math.min(short, sideW - SIDE_MIN);
        sideW -= give; short -= give;
      }
      if (short > 0 && railOpen) {
        const give = Math.min(short, railW - RAIL_MIN);
        railW -= give; short -= give;
      }

      // Layer 2: the hard floor. Whatever Layer 1 left (already at or above
      // each panel's own MIN) is measured against the stricter, smaller
      // `DOC_FLOOR_PX` — and only past THAT does a panel close outright
      // rather than squeeze further (it cannot squeeze further; it is
      // already at MIN by construction).
      const spareFor = (rw, sw) => room - DOC_FLOOR_PX - rw - sw;
      if (sideOpen && spareFor(railW, sideW) < 0) { sideOpen = false; sideW = 0; }
      if (railOpen && spareFor(railW, sideW) < 0) { railOpen = false; railW = 0; }

      railEl.style.display = railOpen ? "" : "none";
      if (railOpen) railEl.style.width = Math.round(Math.max(RAIL_MIN, railW)) + "px";
      sideEl.style.display = sideOpen ? "" : "none";
      if (sideOpen) {
        sideEl.style.width = Math.round(Math.max(SIDE_MIN, sideW)) + "px";
        // A canvas is a fixed-size bitmap: its backing store only follows its
        // CSS box when something tells it to, and nudge() is that (it
        // re-measures and re-runs the sim, which also re-frames the graph).
        canvas.nudge();
      }
    }
    // The shell's Claude panel opening or closing resizes THIS iframe with no
    // navigation and no reload (§ above) — an ordinary `resize` on this
    // window, since an iframe's box is its own nested viewport. Not a poll:
    // it fires only when the box genuinely changes, the same discipline
    // MD-17 already holds this template to elsewhere.
    window.addEventListener("resize", () => layoutPanels());

    function applyRail() {
      const on = outlineOn();
      railEl.hidden = !on;
      railReopenEl.hidden = on;
      if (on) {
        const stored = storedRailWidth();
        if (stored) desiredRailPx = Math.min(RAIL_MAX, Math.max(RAIL_MIN, stored));
        // renderOutline draws nothing while the rail is collapsed, so opening
        // it is the moment to draw what the document says now.
        outlineKey = null;
        renderOutline();
      }
      layoutPanels();
    }

    // `event.isTrusted` guards every writer here (this pair, and the matching
    // side-panel pair below): the param records what the user WANTS, and
    // only a genuine user click may change that — the layout clamp
    // (`layoutPanels`) may only ever affect PRESENTATION
    // (`style.display`/`style.width`), never the param, precisely so a panel
    // the user asked to keep open reappears on its own the moment there is
    // room again, rather than staying closed because a transient narrow width
    // overwrote the preference. `isTrusted` is the browser's own distinction
    // between a real user gesture and any script-dispatched event, so this
    // holds even against a future mistake that calls `.click()` on one of
    // these buttons instead of touching `style.*`.
    railCollapseEl.addEventListener("click", (event) => {
      if (!event.isTrusted) return;
      fused.params.set("outline", "0");
    });
    railReopenEl.addEventListener("click", (event) => {
      if (!event.isTrusted) return;
      fused.params.set("outline", "1");
    });

    railGripEl.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      const startX = event.clientX;
      // `desiredRailPx`, not `railEl.getBoundingClientRect().width` — see
      // THE INVARIANT above.
      const startWidth = desiredRailPx;
      railGripEl.setPointerCapture(event.pointerId);
      // The rail is on the LEFT, so dragging right (away from the document)
      // widens it — the opposite sense from the right panel's grip.
      const onMove = (move) => applyRailWidth(startWidth + (move.clientX - startX), false);
      const onUp = () => {
        railGripEl.removeEventListener("pointermove", onMove);
        railGripEl.removeEventListener("pointerup", onUp);
        railGripEl.removeEventListener("pointercancel", onUp);
        applyRailWidth(desiredRailPx, true);
      };
      railGripEl.addEventListener("pointermove", onMove);
      railGripEl.addEventListener("pointerup", onUp);
