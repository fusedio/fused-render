[project]
name = "google-docs-tabs"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client",
    "google-auth-httplib2",
]

[tool.uv]
package = false

[tool.fused-render.bot]
name = "Google Docs Tabs"
description = "Connects to the user's Google Docs and manages document tabs and comments: list tabs, create a tab with content, append to or overwrite a tab, read a tab, list/add/reply/resolve/delete comments, or run a plain-English command against a doc."
triggers = ["google doc", "google docs", "doc tab", "create a tab", "add a tab", "docs tabs", "doc comment", "comment on the doc"]
