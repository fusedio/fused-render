<!DOCTYPE html>
<html data-fused-theme="shell">
<head>
<meta charset="utf-8" />
<title>Git</title>
<style>
  /* Appearance (SPEC §30/AP-9, D134). The dark block below IS this view's
     palette; every colour a rule uses is a token from it, because a literal is
     a colour light mode cannot repaint (tests/test_theme.py enforces both the
     opt-in on <html> and the two blocks defining the SAME token set).
     `data-theme` is written onto <html> by the injected runtime, which acts only
     because this document opted in via `data-fused-theme`. */
  :root {
    color-scheme: dark;
    --bg: #131417;
    --surface: #1b1d21;
    --surface-2: #22252b;
    --line: #2a2d33;
    --line-strong: #3a3e46;
    --line-hover: #454a53;
    --ink: #e8eaed;
    --ink-2: #9aa0a6;
    --ink-3: #868d94;
    --accent: #E5FF44;
    --accent-dim: #b8cc36;
    --on-accent: #131417;
    --grid-dot: #1e2126;
    --skel-shine: #2f333c;
    /* status letters: added / modified / deleted / renamed / untracked */
    --st-add: #7ec97e;
    --st-mod: #d9b34a;
    --st-del: #e08585;
    --st-ren: #7fb4e0;
    --st-new: #9aa0a6;
    /* clean vs dirty light in the header */
    --clean: #7ec97e;
    --dirty: #d9b34a;
    /* diff gutter + hunk colours */
    --diff-add-bg: #16241a;
    --diff-add-fg: #a8dfa8;
    --diff-del-bg: #251618;
    --diff-del-fg: #efb0b0;
    --diff-hunk-fg: #86a7c4;
    --diff-meta-fg: #9aa0a6;
    /* empty state + truncation notice */
    --note-line: #5c4a1f;
    --note-bg: #1b1913;
    --note-fg: #e8d8ac;
  }
  /* The brand lime is unreadable as text on white, so light mode uses
     shell.css's same-hue deep olive — one token still serving text, focus ring
     and the selected-row edge. */
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff;
    --surface: #f4f5f7;
    --surface-2: #eceef0;
    --line: #d8dade;
    --line-strong: #c4c8ce;
    --line-hover: #b4b9c0;
    --ink: #1f2023;
    --ink-2: #61656c;
    --ink-3: #6f747c;
    --accent: #5f7300;
    --accent-dim: #4e5f00;
    --on-accent: #ffffff;
    --grid-dot: #e8eaed;
    --skel-shine: #dfe2e7;
    --st-add: #2f7d32;
    --st-mod: #8a6410;
    --st-del: #a32828;
    --st-ren: #1f5f96;
    --st-new: #61656c;
    --clean: #2f7d32;
    --dirty: #8a6410;
    --diff-add-bg: #e8f6e8;
    --diff-add-fg: #1f5f22;
    --diff-del-bg: #fdecec;
    --diff-del-fg: #8f2020;
    --diff-hunk-fg: #2b5f88;
    --diff-meta-fg: #61656c;
    --note-line: #e0cd94;
    --note-bg: #fdf7e6;
    --note-fg: #6b5316;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--bg);
    background-image: radial-gradient(circle, var(--grid-dot) 1px, transparent 1px);
    background-size: 28px 28px;
    /* The page body NEVER scrolls horizontally — wide content (diffs) scrolls
       inside its own container instead. */
    overflow-x: hidden;
  }
  #root {
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 24px 80px;
    min-width: 0;
  }
  a { color: var(--accent-dim); }

  /* ================= header ================= */
  .head { margin-bottom: 4px; }
  .head h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.2;
    word-break: break-all;
  }
  .head h1 .branch { color: var(--ink-3); font-weight: 400; }
  .vitals {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 14px;
    margin-top: 10px;
    color: var(--ink-2);
    font-size: 12px;
  }
  .vitals .state { display: inline-flex; align-items: center; gap: 6px; }
  .vitals .light { width: 7px; height: 7px; border-radius: 50%; background: var(--clean); }
  .vitals .light.is-dirty { background: var(--dirty); }
  .vitals .scope { color: var(--ink); word-break: break-all; }
  .vitals .detached {
    padding: 1px 7px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    color: var(--ink-2);
  }

  /* ================= panes ================= */
  .cols {
    display: grid;
    grid-template-columns: minmax(0, 380px) minmax(0, 1fr);
    gap: 20px;
    margin-top: 24px;
    align-items: start;
  }
  .cols.no-diff { grid-template-columns: minmax(0, 1fr); }
  @media (max-width: 900px) {
    .cols, .cols.no-diff { grid-template-columns: minmax(0, 1fr); }
  }
  .col { min-width: 0; }

  section { margin: 0 0 22px; }
  section > h2 {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 0 0 10px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  section > h2 .n { color: var(--ink-2); font-weight: 400; letter-spacing: 0; }

  /* ================= rows ================= */
  .rows {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    overflow: hidden;
  }
  .row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    width: 100%;
    padding: 8px 12px;
    border: 0;
    border-top: 1px solid var(--line);
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: background-color 120ms cubic-bezier(0.2, 0, 0, 1);
  }
  .row:first-child { border-top: 0; }
  .row:hover { background: var(--surface-2); }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .row[aria-current="true"] {
    background: var(--surface-2);
    box-shadow: inset 3px 0 0 0 var(--accent);
  }
  .row[aria-current="true"] .subject, .row[aria-current="true"] .path { font-weight: 700; }
  .row .sha {
    flex: none;
    color: var(--accent-dim);
    font-variant-numeric: tabular-nums;
  }
  .row .subject, .row .path {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row .meta {
    flex: none;
    color: var(--ink-3);
    font-size: 11px;
    max-width: 40%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row .code {
    flex: none;
    width: 2ch;
    white-space: pre;
    font-weight: 700;
    color: var(--st-new);
  }
  .row .code.is-A { color: var(--st-add); }
  .row .code.is-M, .row .code.is-T { color: var(--st-mod); }
  .row .code.is-D { color: var(--st-del); }
  .row .code.is-R, .row .code.is-C { color: var(--st-ren); }
  .row .where {
    flex: none;
    padding: 0 6px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    color: var(--ink-3);
    font-size: 10px;
    letter-spacing: 0.04em;
  }

  .more {
    display: block;
    width: 100%;
    padding: 9px 12px;
    border: 0;
    border-top: 1px solid var(--line);
    background: transparent;
    color: var(--ink-2);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .more:hover { color: var(--ink); background: var(--surface-2); }
  .more:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .more[disabled] { color: var(--ink-3); cursor: default; background: transparent; }

  .none { padding: 12px; color: var(--ink-3); font-size: 12px; }

  /* ================= diff pane ================= */
  .pane {
    position: sticky;
    top: 0;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    overflow: hidden;
  }
  .pane-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--surface-2);
  }
  .pane-head .title {
    flex: 1;
    min-width: 0;
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pane-head .sub { color: var(--ink-3); font-size: 11px; }
  .close {
    flex: none;
    padding: 2px 8px;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    background: transparent;
    color: var(--ink-2);
    font: inherit;
    font-size: 11px;
    cursor: pointer;
  }
  .close:hover { color: var(--ink); border-color: var(--line-hover); }
  .close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* The one place wide content lives: its OWN scroll container, so the page
     body never gains a horizontal scrollbar (a diff line is arbitrarily long). */
  .diff {
    margin: 0;
    padding: 0;
    max-height: 70vh;
    overflow: auto;
    font-size: 12px;
    line-height: 1.45;
    tab-size: 4;
  }
  .diff .ln {
    display: block;
    padding: 0 12px;
    white-space: pre;
    color: var(--ink);
  }
  .diff .ln.add { background: var(--diff-add-bg); color: var(--diff-add-fg); }
  .diff .ln.del { background: var(--diff-del-bg); color: var(--diff-del-fg); }
  .diff .ln.hunk { color: var(--diff-hunk-fg); }
  .diff .ln.meta { color: var(--diff-meta-fg); }

  .note {
    margin: 0;
    padding: 9px 12px;
    border-top: 1px solid var(--note-line);
    background: var(--note-bg);
    color: var(--note-fg);
    font-size: 11px;
  }

  /* ================= empty / error state ================= */
  .empty {
    margin-top: 36px;
    padding: 28px 24px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    text-align: center;
  }
  .empty .glyph { color: var(--ink-3); }
  .empty h2 { margin: 12px 0 6px; font-size: 15px; font-weight: 700; }
  .empty p { margin: 0 auto; max-width: 46ch; color: var(--ink-2); font-size: 12px; }

  /* ================= skeleton =================
     Laid out at the real thing's dimensions, so nothing jumps when data lands. */
  .skel-bar {
    border-radius: 4px;
    background: linear-gradient(90deg, var(--surface-2) 25%, var(--skel-shine) 50%, var(--surface-2) 75%);
    background-size: 200% 100%;
    animation: skel-shimmer 1.3s ease-in-out infinite;
  }
  @keyframes skel-shimmer {
    0% { background-position: 100% 0; }
    100% { background-position: -100% 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .skel-bar { animation: none; }
    .row, .more, .close { transition: none; }
  }
  .skel-title { height: 26px; width: 42%; }
  .skel-vitals { height: 12px; width: 280px; max-width: 70%; margin-top: 14px; }
  .skel-h2 { height: 11px; width: 120px; margin: 0 0 10px; }
  .skel-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--line); }
  .skel-row:first-child { border-top: 0; }
  .skel-cell { height: 12px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
<div id="root">
  <div id="skeleton">
    <div class="head">
      <div class="skel-bar skel-title"></div>
      <div class="skel-bar skel-vitals"></div>
    </div>
    <div class="cols no-diff">
      <div class="col">
        <section>
          <div class="skel-bar skel-h2"></div>
          <div class="rows">
            <div class="skel-row"><span class="skel-bar skel-cell" style="width:2ch"></span><span class="skel-bar skel-cell" style="width:44%"></span></div>
            <div class="skel-row"><span class="skel-bar skel-cell" style="width:2ch"></span><span class="skel-bar skel-cell" style="width:32%"></span></div>
          </div>
        </section>
        <section>
          <div class="skel-bar skel-h2" style="width:90px"></div>
          <div class="rows">
            <div class="skel-row"><span class="skel-bar skel-cell" style="width:7ch"></span><span class="skel-bar skel-cell" style="width:48%"></span><span class="skel-bar skel-cell" style="width:70px;margin-left:auto"></span></div>
            <div class="skel-row"><span class="skel-bar skel-cell" style="width:7ch"></span><span class="skel-bar skel-cell" style="width:36%"></span><span class="skel-bar skel-cell" style="width:70px;margin-left:auto"></span></div>
            <div class="skel-row"><span class="skel-bar skel-cell" style="width:7ch"></span><span class="skel-bar skel-cell" style="width:54%"></span><span class="skel-bar skel-cell" style="width:70px;margin-left:auto"></span></div>
            <div class="skel-row"><span class="skel-bar skel-cell" style="width:7ch"></span><span class="skel-bar skel-cell" style="width:41%"></span><span class="skel-bar skel-cell" style="width:70px;margin-left:auto"></span></div>
          </div>
        </section>
      </div>
    </div>
  </div>
  <div id="view" hidden></div>
</div>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ------------------------------------------------------------------ state
 * Params ARE the state (the house pattern): every piece of UI state — which
 * commit is selected, which uncommitted entry is selected, how many pages of
 * log are loaded — lives in the URL, so a refresh or a bookmark reproduces the
 * exact view, including an open diff pane.
 *
 *   pages=<n>     how many log pages are loaded (1-based; the "load more" count)
 *   sel=<sha>     the selected commit  }  mutually exclusive: at most one diff
 *   wt=<relpath>  the selected change  }  target at a time, so setting one
 *                                         clears the other
 */
const PAGE_SIZE = 30;
const READER = "./log.py";

const file = fused.params.get("_file") || "";
const skeleton = document.getElementById("skeleton");
const view = document.getElementById("view");
const live = document.getElementById("live");

/* Serial guard: concurrent runPython calls can resolve out of order, and a
 * stale overview landing after a fresh one would repaint the wrong data. */
let seq = 0;
/* The last good overview, kept so selecting a commit repaints the pane without
 * refetching the log. */
let snapshot = null;

const num = (key, fallback) => {
  const raw = parseInt(fused.params.get(key) || "", 10);
  return Number.isFinite(raw) && raw > 0 ? raw : fallback;
};

function setParams(patch) {
  for (const [key, value] of Object.entries(patch)) {
    fused.params.set(key, value === null ? "" : String(value));
  }
}

const el = (tag, props, ...kids) => {
  const node = Object.assign(document.createElement(tag), props || {});
  for (const kid of kids.flat()) {
    if (kid !== null && kid !== undefined && kid !== false) node.append(kid);
  }
  return node;
};

/* ------------------------------------------------------------------ chrome */

function icon(paths, size) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("width", size || 28);
  svg.setAttribute("height", size || 28);
  svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor");
  svg.setAttribute("stroke-width", "1.6");
  svg.setAttribute("stroke-linecap", "round");
  svg.setAttribute("aria-hidden", "true");
  for (const d of paths) {
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", d);
    svg.append(p);
  }
  return svg;
}

const BRANCH_GLYPH = ["M6 6v12", "M18 9a9 9 0 0 1-9 9", "M6 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4z",
                      "M18 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4z", "M6 22a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"];

function emptyState(title, message) {
  return el("div", { className: "empty" },
    el("div", { className: "glyph" }, icon(BRANCH_GLYPH, 30)),
    el("h2", { textContent: title }),
    el("p", { textContent: message }));
}

/* ------------------------------------------------------------------ header */

function header(repo) {
  const branch = repo.detached
    ? (repo.head || "detached")
    : (repo.branch || "no branch");
  const scope = repo.rel || "the whole repository";

  const vitals = el("div", { className: "vitals" },
    el("span", { className: "state" },
      el("span", { className: "light" + (repo.dirty ? " is-dirty" : "") }),
      el("span", { textContent: repo.dirty ? "uncommitted changes" : "clean" })),
    repo.detached && el("span", { className: "detached", textContent: "detached HEAD" }),
    !repo.has_commits && el("span", { textContent: "no commits yet" }),
    el("span", null, "scoped to ", el("span", { className: "scope", textContent: scope })));

  return el("div", { className: "head" },
    el("h1", null,
      repo.name,
      el("span", { className: "branch", textContent: "  " + branch })),
    vitals);
}

/* ------------------------------------------------- uncommitted + commit lists */

function changeRow(change, selected) {
  const letter = change.untracked ? "?" : (change.x !== " " ? change.x : change.y);
  const where = change.untracked ? "untracked"
    : (change.staged && change.unstaged) ? "staged + unstaged"
    : change.staged ? "staged" : "unstaged";
  const label = change.orig
    ? change.orig + " -> " + change.path
    : change.path;
  const row = el("button", {
    className: "row",
    type: "button",
    title: (change.label || where) + " — " + label,
  },
    el("span", { className: "code is-" + letter, textContent: change.status }),
    el("span", { className: "path", textContent: label }),
    el("span", { className: "where", textContent: where }));
  if (selected) row.setAttribute("aria-current", "true");
  row.addEventListener("click", () => setParams({ wt: change.path, sel: null }));
  return row;
}

function commitRow(commit, selected) {
  const row = el("button", {
    className: "row",
    type: "button",
    title: commit.subject + "\n" + commit.author + " — " + commit.date,
  },
    el("span", { className: "sha", textContent: commit.short }),
    el("span", { className: "subject", textContent: commit.subject || "(no subject)" }),
    el("span", { className: "meta", textContent: commit.author + " · " + commit.relative }));
  if (selected) row.setAttribute("aria-current", "true");
  row.addEventListener("click", () => setParams({ sel: commit.sha, wt: null }));
  return row;
}

function listSection(title, count, rows, emptyText, footer) {
  const body = el("div", { className: "rows" });
  if (rows.length) {
    for (const row of rows) body.append(row);
  } else {
    body.append(el("div", { className: "none", textContent: emptyText }));
  }
  if (footer) body.append(footer);
  return el("section", null,
    el("h2", null, title, count !== null
      ? el("span", { className: "n", textContent: String(count) }) : null),
    body);
}

/* ------------------------------------------------------------------ diff pane */

const LINE_CLASS = (line) => {
  if (line.startsWith("@@")) return "hunk";
  if (line.startsWith("+++") || line.startsWith("---")) return "meta";
  if (line.startsWith("+")) return "add";
  if (line.startsWith("-")) return "del";
  if (line.startsWith("diff ") || line.startsWith("index ")
      || line.startsWith("similarity ") || line.startsWith("rename ")
      || line.startsWith("new file") || line.startsWith("deleted file")
      || line.startsWith("old mode") || line.startsWith("new mode")
      || line.startsWith("Binary files")) return "meta";
  return "";
};

function diffBody(text) {
  const pre = el("pre", { className: "diff", tabIndex: 0 });
  /* One element per line rather than one big text node: a diff needs per-line
     backgrounds, and a stack of styled spans is what gives it them without a
     syntax highlighter. */
  const frag = document.createDocumentFragment();
  for (const line of text.split("\n")) {
    frag.append(el("span", { className: "ln " + LINE_CLASS(line), textContent: line || " " }));
  }
  pre.append(frag);
  return pre;
}

function diffPane(title, sub, payload) {
  const close = el("button", { className: "close", type: "button", textContent: "Close" });
  close.addEventListener("click", () => setParams({ sel: null, wt: null }));

  const pane = el("div", { className: "pane" },
    el("div", { className: "pane-head" },
      el("span", { className: "title", textContent: title }),
      sub ? el("span", { className: "sub", textContent: sub }) : null,
      close));

  if (payload === "loading") {
    pane.append(el("div", { className: "rows" },
      el("div", { className: "skel-row" },
        el("span", { className: "skel-bar skel-cell", style: "width:70%" })),
      el("div", { className: "skel-row" },
        el("span", { className: "skel-bar skel-cell", style: "width:45%" })),
      el("div", { className: "skel-row" },
        el("span", { className: "skel-bar skel-cell", style: "width:60%" }))));
    return pane;
  }
  if (!payload.ok) {
    pane.append(el("div", { className: "none", textContent: payload.message || "Could not read that diff." }));
    return pane;
  }
  if (payload.empty) {
    pane.append(el("div", { className: "none",
      textContent: "Nothing in this commit touched the path this view is scoped to." }));
    return pane;
  }
  pane.append(diffBody(payload.diff));
  if (payload.truncated) {
    pane.append(el("p", { className: "note", textContent:
      "Diff truncated at " + payload.shown_lines + " lines (cap: "
      + payload.max_lines + " lines / " + Math.round(payload.max_bytes / 1024)
      + " KB). Open the file in git for the rest." }));
  }
  return pane;
}

/* ------------------------------------------------------------------ render */

function show(node) {
  view.replaceChildren(node);
  skeleton.hidden = true;
  view.hidden = false;
}

function announce(text) {
  live.textContent = text;
}

function renderRefusal(payload) {
  const titles = {
    "not-a-repo": "Not a git repository",
    "missing": "Nothing to show",
    "mount": "Not available on remote mounts",
    "no-git": "git is not available",
    "timeout": "git did not answer in time",
    "git-failed": "git could not read this repository",
    "bad-op": "Unsupported request",
  };
  show(el("div", null,
    emptyState(titles[payload.reason] || "Nothing to show",
               payload.message || "There is no git history for this path.")));
  announce(titles[payload.reason] || "No git history");
}

function render(data, diff) {
  const pages = num("pages", 1);
  const sel = fused.params.get("sel") || "";
  const wt = fused.params.get("wt") || "";

  const changeRows = data.changes.map((c) => changeRow(c, c.path === wt));
  const commitRows = data.commits.map((c) => commitRow(c, c.sha === sel));

  const loadMore = data.has_more
    ? el("button", { className: "more", type: "button",
                     textContent: "Load " + PAGE_SIZE + " more commits" })
    : (data.commits.length
        ? el("button", { className: "more", type: "button", disabled: true,
                         textContent: "End of history for this path" })
        : null);
  if (loadMore && !loadMore.disabled) {
    loadMore.addEventListener("click", () => setParams({ pages: pages + 1 }));
  }

  const left = el("div", { className: "col" },
    listSection("Uncommitted", data.changes.length, changeRows,
      data.repo.dirty
        ? "No uncommitted changes under this path."
        : "Working tree is clean.",
      data.changes_truncated
        ? el("p", { className: "note", textContent:
            "Only the first " + data.changes.length + " changes are listed." })
        : null),
    listSection("History", data.commits.length, commitRows,
      data.repo.has_commits
        ? "No commits have touched this path yet."
        : "This repository has no commits yet.",
      loadMore));

  const cols = el("div", { className: "cols" + (diff ? "" : " no-diff") }, left);
  if (diff) cols.append(el("div", { className: "col" }, diff));

  show(el("div", null, header(data.repo), cols));
}

/* ------------------------------------------------------------------ loading */

async function loadDiff(data) {
  const sel = fused.params.get("sel") || "";
  const wt = fused.params.get("wt") || "";
  if (sel) {
    const known = data.commits.find((c) => c.sha === sel);
    const payload = await fused.runPython(READER, { file, op: "commit", sha: sel })
      .catch((err) => ({ ok: false, message: err.message }));
    const meta = payload.ok ? payload.commit : known;
    return diffPane(
      (meta && meta.short ? meta.short + "  " : "") + (meta ? meta.subject : sel),
      data.repo.rel ? "scoped to " + data.repo.rel : null,
      payload);
  }
  if (wt) {
    const payload = await fused.runPython(READER, { file, op: "worktree", entry: wt })
      .catch((err) => ({ ok: false, message: err.message }));
    return diffPane(wt,
      payload.ok && payload.untracked ? "untracked — whole file" : "working tree vs HEAD",
      payload);
  }
  return null;
}

async function draw() {
  const mine = ++seq;
  const pages = num("pages", 1);
  const sel = fused.params.get("sel") || "";
  const wt = fused.params.get("wt") || "";

  if (!file) {
    renderRefusal({ reason: "missing", message: "No file or folder was selected." });
    return;
  }

  /* Repaint from the snapshot first when only the SELECTION changed: the log
     and the change list are unchanged, so refetching them would blank a list
     the user is looking at. The diff then arrives into an already-laid-out
     pane. */
  const reuse = snapshot && snapshot.pages === pages;
  let data = reuse ? snapshot.data : null;

  if (data) {
    render(data, (sel || wt) ? diffPane(sel || wt, null, "loading") : null);
  }

  if (!data) {
    let payload;
    try {
      payload = await fused.runPython(READER, {
        file, op: "overview", limit: PAGE_SIZE * pages, page: 0,
      });
    } catch (err) {
      /* A crash in the reader is still an empty state here, not the red
         traceback overlay: the overlay is a debugging affordance for a view's
         own bug, and "this folder has no git" is not one. */
      renderRefusal({ reason: "git-failed", message: err.message });
      return;
    }
    if (mine !== seq) return;
    if (!payload.ok) {
      snapshot = null;
      renderRefusal(payload);
      return;
    }
    data = payload;
    snapshot = { pages, data };
    render(data, (sel || wt) ? diffPane(sel || wt, null, "loading") : null);
    announce(data.commits.length + " commits, " + data.changes.length
             + " uncommitted changes");
  }

  if (!sel && !wt) return;
  const diff = await loadDiff(data);
  if (mine !== seq) return;
  render(data, diff);
}

/* Escape closes the diff pane — the one shortcut this view needs beyond the
   native tab/enter that every row already has as a <button>. */
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && (fused.params.get("sel") || fused.params.get("wt"))) {
    event.preventDefault();
    setParams({ sel: null, wt: null });
  }
});

fused.params.onChange(draw);
draw();
</script>
</body>
</html>
