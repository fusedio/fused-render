<!DOCTYPE html>
<html data-fused-theme="shell">
<head>
<meta charset="utf-8" />
<title>Text preview</title>
<style>
  /* Appearance (SPEC §30, D134). The dark block below IS this view's
     historical palette, value for value; the light block is the new one.
     `data-theme` is written onto <html> by the injected runtime, which acts
     only because this document opted in via `data-fused-theme` on <html>
     (see fused_render/static/runtime.js) — dark stays the default for any
     document that never gets the attribute. */
  :root {
    color-scheme: dark;
    --fg: #e8eaed;
    --fg-muted: #9aa0a6;
    --bg: #131417;
    --accent: #E5FF44;
    --skel-base: rgba(154, 160, 166, 0.08);
    --skel-shine: rgba(154, 160, 166, 0.20);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --fg: #1f2023;
    --fg-muted: #61656c;
    --bg: #ffffff;
    --accent: #5f7300;
    --skel-base: rgba(97, 101, 108, 0.10);
    --skel-shine: rgba(97, 101, 108, 0.22);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--fg);
    background: var(--bg);
  }
  pre {
    margin: 0;
    padding: 16px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #status {
    padding: 24px;
    color: var(--fg-muted);
  }
  #status a {
    color: var(--accent);
  }
  .skeleton {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .skel-line {
    height: 13px;
    border-radius: 3px;
    background: linear-gradient(
      90deg,
      var(--skel-base) 25%,
      var(--skel-shine) 37%,
      var(--skel-base) 63%
    );
    background-size: 400% 100%;
    animation: skel-shimmer 1.4s ease-in-out infinite;
  }
  @keyframes skel-shimmer {
    0% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
</style>
</head>
<body>
  <div id="root"><div class="skeleton" aria-hidden="true">
    <div class="skel-line" style="width: 92%"></div>
    <div class="skel-line" style="width: 78%"></div>
    <div class="skel-line" style="width: 85%"></div>
    <div class="skel-line" style="width: 60%"></div>
    <div class="skel-line" style="width: 95%"></div>
    <div class="skel-line" style="width: 45%"></div>
    <div class="skel-line" style="width: 88%"></div>
    <div class="skel-line" style="width: 70%"></div>
  </div></div>
  <script>
    const MAX_BYTES = 2 * 1024 * 1024;

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function load() {
      const root = document.getElementById("root");
      const file = fused.params.get("_file");
      if (!file) {
        root.innerHTML = `<div id="status">No file selected (missing _file param).</div>`;
        return;
      }
      const rawUrl = fused.rawUrl(file);
      try {
        const stat = await fused.stat(file);
        if (stat.size !== null && stat.size !== undefined && stat.size > MAX_BYTES) {
          root.innerHTML = `<div id="status">File is too large to preview inline (${stat.size.toLocaleString()} bytes).
            <a href="${rawUrl}" target="_blank" rel="noopener">Open raw</a></div>`;
          return;
        }
        const text = await fused.readFile(file);
        root.innerHTML = `<pre>${escapeHtml(text)}</pre>`;
      } catch (err) {
        root.innerHTML = `<div id="status">Failed to load file: ${escapeHtml(err.message)}</div>`;
      }
    }

    load();
  </script>
</body>
</html>
