<!DOCTYPE html>
<!-- The canvas WIDGET template (SPEC §53.3): one widget (`<node>.json`) or
     HTML node (`<node>.html`) of a cloned canvas, drawn live by the hosted
     workbench's NODE PAGE in a frame:

       <base>/embed/node/<canvas>/<node>?fused_embed_auth=1&fused_embed_v=3

     That page is the share page's sibling: it loads the saved canvas once,
     by name, with the bearer this page hands it, mounts only this node, and
     runs only the UDFs the node reads. It is not the workbench, and no sync
     engine is started for it.

     What this page does:
       - asks the server what the file is (shared/canvas-node.js);
       - frames the node page and answers its token requests;
       - sends the file's text as it stands on disk, and again on every
         change, so an edit shows before it is pushed;
       - keeps the canvas's sync engine running, so edits to the folder are
         pushed as they are made, and tells the frame after each push: what
         the node reads from OTHER nodes is the canvas as Fused has it
         saved, and the frame then loads that again.

     The frame writes nothing back. With the local SQL engine installed, and
     the frame not loaded through the embed proxy, it is also offered that
     engine: this page relays its `fused-embed-sql` messages to the loopback
     `/api/sql/` routes (SPEC §53.3 NW-7), and runs UDFs of this node's own
     canvas for it, answering with a result handle (SPEC §53.3 NW-9). The
     frame is also handed the canvas as Fused last had it saved, so it can
     draw at once, and again whenever the sync stores a different one (SPEC
     §53.3 NW-8). This page must not import fused_render (SPEC PY-15). -->
<html data-fused-theme="shell">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Canvas widget</title>
<script src="/template-shared/canvas-node.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #131417; --panel: #1a1c20; --fg: #e8eaed; --fg-muted: #9aa0a6;
    --line: #2a2d33; --accent: #f5a623; --on-accent: #1a1300; --error: #ff6b6b;
    --ok: #57c08a; --hover: #24272d;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff; --panel: #f6f7f9; --fg: #1f2023; --fg-muted: #61656c;
    --line: #dfe2e7; --accent: #b86e00; --on-accent: #ffffff; --error: #c62828;
    --ok: #1e7d4f; --hover: #eceef1;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--fg); background: var(--bg); overflow: hidden;
    display: flex; flex-direction: column;
  }
  .strip {
    flex: none; display: flex; align-items: center; gap: 10px;
    min-height: 36px; padding: 0 12px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  /* Narrow panes: the buttons keep their words on one line, the title keeps
     a readable minimum, and the status lines are what gives way. */
  .strip .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 72px; }
  .strip button, .strip label { flex: none; white-space: nowrap; }
  .strip .kind, .strip .canvas { flex: none; }
  .strip .status { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .strip .kind, .strip .canvas, .strip .status, .strip .sync { color: var(--fg-muted); font-size: 12px; white-space: nowrap; }
  .strip .sync { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .strip .status.error, .strip .sync.error { color: var(--error); }
  .strip .status.ok { color: var(--ok); }
  .strip .spacer { flex: 1; }
  button {
    font: inherit; color: var(--fg); background: transparent;
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer;
  }
  button:hover { background: var(--hover); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .stage { position: relative; flex: 1; min-height: 0; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
  .message {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    padding: 24px; text-align: center; color: var(--fg-muted); background: var(--bg);
  }
  .message .error { color: var(--error); white-space: pre-wrap; max-width: 640px; }
  .message .actions { display: flex; gap: 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="strip" id="strip" hidden>
  <span class="title" id="title"></span>
  <span class="kind" id="kind"></span>
  <span class="canvas" id="canvas"></span>
  <span class="spacer"></span>
  <span class="status" id="status"></span>
  <span class="sync" id="sync"></span>
  <button type="button" id="reload" title="Load the saved canvas again">Reload</button>
  <button type="button" id="open">Open in canvas</button>
</div>
<div class="stage">
  <iframe id="frame" hidden allow="clipboard-read; clipboard-write" referrerpolicy="origin"></iframe>
  <div class="message" id="message">Loading…</div>
</div>
<script>
  // This page pushes the file's text itself; a reload would rebuild the
  // frame (and re-run its UDFs) on every keystroke saved.
  fused.autoReload(false);

  const FILE = fused.params.get("_file");
  // How long the frame may take, once loaded, to say it is the node page
  // before this page concludes the deployment has none (an older workbench answers 404, which
  // a cross-origin frame cannot be asked about).
  const NODE_READY_WAIT_MS = 10000;
  // …and how long the frame's document may take to load before that.
  const FRAME_LOAD_WAIT_MS = 30000;
  const SOURCE_RECHECK_MS = 1500;
  const KIND_LABEL = { widget: "Widget", html: "HTML" };
  const STATUS_TEXT = { loading: "Loading…", ready: "", missing: "Not in the saved canvas", error: "Could not load" };

  const $ = (id) => document.getElementById(id);
  const frame = $("frame");
  const message = $("message");

  let node = null;          // GET /api/canvases/node's answer
  let wb = null;            // CanvasNode.workbench's answer
  let pageReady = false;    // the frame said it is the node page
  let readyTimer = null;
  let lastSent = null;      // the text last posted, so a no-op save posts nothing
  let sourceSeq = 0;        // the newest read (or frame): an older read posts nothing
  let pendingPush = null;   // a push that landed before the frame was ready
  let frameGen = 0;         // one per frame load: a reply to an older document is dropped
  let sqlOffered = false;   // the current document was offered the SQL engine
  let canvasSeed = null;    // this document's fetch of the saved canvas text (NW-8), or null
  let canvasSent = null;    // the saved canvas text this document was last sent
  let canvasReady = false;  // the first message of this document went out
  let canvasStale = false;  // a change was heard before it did
  let canvasReading = false; // a re-read is in flight
  let canvasAgain = false;  // a change was heard during it
  let udfOffered = false;   // the current document was offered the UDF relay (NW-9)

  function showMessage(build) {
    message.replaceChildren();
    build(message);
    message.hidden = false;
  }
  function text(tag, value, cls) {
    const el = document.createElement(tag);
    el.textContent = value;
    if (cls) el.className = cls;
    return el;
  }
  function button(label, onClick, primary) {
    const el = document.createElement("button");
    el.type = "button";
    el.textContent = label;
    if (primary) el.className = "primary";
    el.addEventListener("click", onClick);
    return el;
  }
  function actions(...buttons) {
    const row = document.createElement("div");
    row.className = "actions";
    row.append(...buttons);
    return row;
  }
  function fail(what, error) {
    showMessage((el) => {
      el.append(text("div", what + ": " + (error && error.message ? error.message : String(error)), "error"));
      const row = [button("Try again", () => location.reload(), true)];
      if (node) row.push(button("Open in canvas", () => CanvasNode.openCanvas(node)));
      el.append(actions(...row));
    });
  }
  function setStatus(value, tone) {
    const el = $("status");
    el.textContent = value || "";
    el.className = "status" + (tone ? " " + tone : "");
  }

  // The canvas's sync engine runs while this page is open (shared/
  // canvas-node.js, NT-7), so edits to the folder are pushed as they are made.
  function setSync(value, tone) {
    const el = $("sync");
    el.textContent = value || "";
    el.className = "sync" + (tone ? " " + tone : "");
  }

  function post(payload, transfer) {
    const win = frame.contentWindow;
    if (!win || !wb) return false;
    // Exact targetOrigin, never "*": the token rides this channel.
    win.postMessage(payload, wb.origin, transfer || []);
    return true;
  }

  // `fresh`: the frame just said it is ready (not a token refresh). Only then
  // is the saved canvas posted, once per document (NW-8).
  async function sendToken(fresh) {
    const gen = frameGen;
    const seed = fresh ? canvasSeed : null;
    try {
      const accessToken = await CanvasNode.token(node.env);
      // `caps: []`: the node page writes nothing, so it is offered no channel,
      // except the local SQL engine when it is installed. Never through
      // the embed proxy: that frame's origin is a loopback listener.
      const offer = !!wb.sqlEngine && wb.origin === wb.publicOrigin;
      const payload = { type: "fused-embed-auth-token", accessToken, caps: [], publicOrigin: wb.publicOrigin };
      if (offer) {
        payload.caps = ["sql", "udf", "udf-read"];
        payload.sqlEngine = { name: wb.sqlEngine.name, version: wb.sqlEngine.version };
      }
      // The saved canvas is data the page could fetch with its token, so it is
      // offered through the embed proxy too.
      payload.caps = [...payload.caps, "canvas"];
      sqlOffered = offer;
      udfOffered = offer;
      post(payload);
      if ($("status").classList.contains("error")) setStatus("");
    } catch (error) {
      setStatus("Could not sign the workbench in: " + error.message, "error");
      return;
    }
    if (seed) {
      const json = await seed;
      // A reply to an older document gets nothing.
      if (gen === frameGen) {
        canvasSent = json;
        post({ type: "fused-embed-canvas", canvas: node.name, json });
        canvasReady = true;
        if (canvasStale) {
          canvasStale = false;
          void refreshCanvas();
        }
      }
    }
  }

  // The sync stored a different saved canvas, or this host pushed (NW-8):
  // read it again and post it when it is not the text this document already
  // has. One read at a time; a change heard during one makes exactly one
  // more. The text is never logged.
  async function refreshCanvas() {
    if (!canvasReady) {
      canvasStale = true;
      return;
    }
    if (canvasReading) {
      canvasAgain = true;
      return;
    }
    canvasReading = true;
    const gen = frameGen;
    try {
      do {
        canvasAgain = false;
        const json = await CanvasNode.saved(node.env, node.name);
        if (gen !== frameGen) return;
        if (json !== null && json !== canvasSent) {
          canvasSent = json;
          post({ type: "fused-embed-canvas", canvas: node.name, json });
        }
      } while (canvasAgain);
    } finally {
      if (gen === frameGen) canvasReading = false;
    }
  }

  async function sendSource(force) {
    if (!pageReady) return;
    // Reads can finish out of order (a burst of saves, a Reload between):
    // only the newest one's text is posted.
    const seq = ++sourceSeq;
    let source;
    try {
      source = await fused.readFile(FILE);
    } catch (_) {
      if (seq !== sourceSeq) return;
      // Deleted or unreadable: the node goes back to the saved canvas.
      lastSent = null;
      post({ type: "fused-embed-node-source", node: node.node, kind: node.kind, text: null });
      return;
    }
    if (seq !== sourceSeq || (!force && source === lastSent)) return;
    lastSent = source;
    post({ type: "fused-embed-node-source", node: node.node, kind: node.kind, text: source });
  }

  // LOCAL SQL ENGINE RELAY (SPEC §53.3 NW-7). The frame has no route to
  // /api/sql/*: each `fused-embed-sql` message is checked, mapped to one
  // guarded loopback call, and answered with `fused-embed-sql-result`. The
  // session's scope is this node's environment, never anything from the frame.
  const SQL_NAME_RE = /^[A-Za-z0-9._-]{1,128}$/;
  const SQL_TABLE_RE = /^[A-Za-z_][A-Za-z0-9_]{0,127}$/;
  const SQL_CODES = [
    "invalid_args",
    "not_found",
    "cancelled",
    "engine_error",
    "too_large",
    "unsupported",
  ];
  const SQL_KEEPALIVE_MS = 5 * 60 * 1000;
  const SQL_GUARD = { "X-Fused": "1" };
  let sqlSession = null; // promise of the session id, shared by concurrent first messages
  let sqlId = null; // the session id once created
  let sqlTimer = null; // the keepalive

  class SqlError extends Error {
    constructor(code, message, status) {
      super(message);
      this.code = code;
      this.status = status || 0;
    }
  }

  function sqlName(value) {
    return (
      typeof value === "string" &&
      SQL_NAME_RE.test(value) &&
      value !== "." &&
      value !== ".."
    );
  }
  function sqlArgs(ok) {
    if (!ok) throw new SqlError("invalid_args", "invalid arguments");
  }

  function sqlForget(id) {
    if (id !== undefined && id !== sqlId) return;
    sqlSession = null;
    sqlId = null;
    clearInterval(sqlTimer);
    sqlTimer = null;
  }

  async function sqlFetch(url, init) {
    let res;
    try {
      res = await fetch(url, {
        ...init,
        headers: { ...SQL_GUARD, ...(init.headers || {}) },
      });
    } catch (_) {
      throw new SqlError("engine_error", "the SQL engine could not be reached");
    }
    if (res.ok) return res;
    let body = null;
    try {
      body = await res.json();
    } catch (_) {
      body = null;
    }
    const code =
      body && SQL_CODES.includes(body.code) ? body.code : "engine_error";
    const message =
      body && typeof body.message === "string"
        ? body.message
        : "HTTP " + res.status;
    throw new SqlError(code, message, res.status);
  }

  function sqlSessionId() {
    if (!sqlSession) {
      const made = sqlFetch("/api/sql/session", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ scope: node.env }),
      })
        .then((res) => res.json())
        .then((data) => {
          if (!data || typeof data.session !== "string")
            throw new SqlError("engine_error", "no SQL session");
          sqlId = data.session;
          sqlTimer = setInterval(sqlKeepalive, SQL_KEEPALIVE_MS);
          return data.session;
        });
      sqlSession = made;
      made.catch(() => {
        if (sqlSession === made) sqlSession = null;
      });
    }
    return sqlSession;
  }

  function sqlKeepalive() {
    const id = sqlId;
    if (!id) return;
    sqlFetch("/api/sql/session/" + encodeURIComponent(id) + "/keepalive", {
      method: "POST",
    }).catch((error) => {
      if (error.status === 404) sqlForget(id);
    });
  }

  // One call on the session. A 404 for the session itself ("no such
  // session": the engine went away) forgets it, so the next message makes a
  // new one; a 404 for a file passes through as `not_found`.
  async function sqlCall(path, init) {
    const id = await sqlSessionId();
    try {
      return await sqlFetch(
        "/api/sql/session/" + encodeURIComponent(id) + path,
        init,
      );
    } catch (error) {
      if (error.status === 404 && error.message === "no such session") {
        sqlForget(id);
        throw new SqlError("not_found", "the SQL session ended");
      }
      throw error;
    }
  }

  const sqlJson = (body) => ({
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });

  // Returns the reply's extra fields; throws SqlError.
  async function sqlOp(m) {
    switch (m.op) {
      case "query": {
        sqlArgs(typeof m.sql === "string");
        const res = await sqlCall(
          "/query",
          sqlJson({ sql: m.sql, query_id: m.req }),
        );
        return { ipc: await res.arrayBuffer() };
      }
      case "register": {
        sqlArgs(sqlName(m.name));
        const path = "/file/" + encodeURIComponent(m.name);
        if (m.bytes instanceof ArrayBuffer) {
          await sqlCall(path, {
            method: "PUT",
            headers: { "Content-Type": "application/octet-stream" },
            body: m.bytes,
          });
        } else if (typeof m.text === "string") {
          await sqlCall(path, {
            method: "PUT",
            headers: { "Content-Type": "text/plain; charset=utf-8" },
            body: m.text,
          });
        } else {
          sqlArgs(typeof m.handle === "string");
          await sqlCall(path + "/link", sqlJson({ handle: m.handle }));
        }
        return {};
      }
      case "drop":
        sqlArgs(sqlName(m.name));
        await sqlCall("/file/" + encodeURIComponent(m.name), {
          method: "DELETE",
        });
        return {};
      case "export": {
        sqlArgs(sqlName(m.name));
        const res = await sqlCall("/file/" + encodeURIComponent(m.name), {
          method: "GET",
        });
        return { bytes: await res.arrayBuffer() };
      }
      case "insert":
        sqlArgs(
          typeof m.table === "string" &&
            SQL_TABLE_RE.test(m.table) &&
            m.ipc instanceof ArrayBuffer &&
            typeof m.create === "boolean",
        );
        await sqlCall(
          "/arrow/" +
            encodeURIComponent(m.table) +
            "?create=" +
            (m.create ? 1 : 0),
          {
            method: "POST",
            headers: { "Content-Type": "application/vnd.apache.arrow.stream" },
            body: m.ipc,
          },
        );
        return {};
      case "cancel":
        sqlArgs(typeof m.target === "string" && SQL_NAME_RE.test(m.target));
        // Nothing runs without a session: there is nothing to cancel.
        if (sqlSession) await sqlCall("/cancel", sqlJson({ query_id: m.target }));
        return {};
      case "reset": {
        const id = sqlId;
        sqlForget();
        if (id) {
          try {
            await sqlFetch("/api/sql/session/" + encodeURIComponent(id), {
              method: "DELETE",
            });
          } catch (error) {
            if (error.status !== 404) throw error;
          }
        }
        return {};
      }
      default:
        throw new SqlError("invalid_args", "unknown operation");
    }
  }

  async function sqlMessage(m) {
    if (typeof m.req !== "string" || !SQL_NAME_RE.test(m.req)) return;
    const gen = frameGen;
    let reply;
    try {
      reply = { ok: true, ...(await sqlOp(m)) };
    } catch (error) {
      const known = error instanceof SqlError;
      reply = {
        ok: false,
        error: {
          code: known ? error.code : "engine_error",
          message: known ? error.message : "the SQL engine failed",
        },
      };
    }
    if (gen !== frameGen) return;
    const transfer = [reply.ipc, reply.bytes].filter(
      (b) => b instanceof ArrayBuffer,
    );
    post({ type: "fused-embed-sql-result", req: m.req, ...reply }, transfer);
  }

  // UDF RELAY (SPEC §53.3 NW-9). The frame asks this page to run a UDF of
  // THIS node's canvas and gets back a handle for the result, which it can
  // register with the SQL engine instead of carrying the bytes. The canvas and
  // environment are this node's own, never the frame's; the runtime's own
  // dialogs (batch runs, large results) are shown as for any page.
  const UDF_TOKEN_RE = /^(?:[0-9a-f]{64}|t[0-9a-f]{32})$/;
  const udfJobs = new Map(); // req -> the run, for the current document
  // Tokens of the results this page handed the CURRENT frame document: the
  // only ones it can read back (fused-embed-udf-read). Reset in loadFrame.
  const udfIssued = new Set();
  const UDF_FORMATS = ["parquet", "png", "json", "html"];

  function udfToken(url) {
    const m = /^\/api\/udf\/results\/([^/?#]+)(?:[?#]|$)/.exec(typeof url === "string" ? url : "");
    return m && UDF_TOKEN_RE.test(m[1]) ? m[1] : null;
  }
  function udfVersion(r) {
    try {
      const v = Number(new URL(r.url, location.href).searchParams.get("v"));
      if (Number.isFinite(v)) return v;
    } catch (_) {
      /* no usable url: fall back to the saved-at time */
    }
    return r.savedAt instanceof Date ? r.savedAt.getTime() : 0;
  }
  function udfAbort() {
    const runs = [...udfJobs.values()];
    udfJobs.clear();
    for (const run of runs) {
      try {
        run.cancel();
      } catch (_) {
        /* already over */
      }
    }
  }

  function udfMessage(m) {
    if (typeof m.req !== "string" || !SQL_NAME_RE.test(m.req) || udfJobs.has(m.req)) return;
    const req = m.req;
    const gen = frameGen;
    const reply = (extra) => {
      if (gen === frameGen) post({ type: "fused-embed-udf-result", req, ...extra });
    };
    const fail = (code, message) => reply({ ok: false, error: { code, message } });
    const params = m.params === undefined ? {} : m.params;
    if (
      typeof m.name !== "string" || !m.name || m.name.includes("/") || m.name.endsWith(".py") ||
      Object.prototype.toString.call(params) !== "[object Object]" ||
      (m.fresh !== undefined && typeof m.fresh !== "boolean") ||
      (m.format !== undefined && !UDF_FORMATS.includes(m.format))
    ) {
      fail("invalid_args", "invalid arguments");
      return;
    }
    let tile;
    if (m.tile !== undefined) {
      const t = m.tile;
      if (
        Object.prototype.toString.call(t) !== "[object Object]" ||
        ![t.x, t.y, t.z].every((n) => Number.isInteger(n) && n >= 0) || t.z > 30
      ) {
        fail("invalid_args", "invalid arguments");
        return;
      }
      tile = { x: t.x, y: t.y, z: t.z };
    }
    let run;
    try {
      const udf = fused.workbench.udf({ canvas: node.name, name: m.name, env: node.env });
      const opts = { format: m.format || "parquet" };
      if (m.fresh === true) opts.cache = "fresh";
      if (tile) opts.tile = tile;
      run = udf.run(params, opts);
    } catch (error) {
      fail((error && error.code) || "failed", (error && error.message) || "the UDF could not be run");
      return;
    }
    udfJobs.set(req, run);
    let finished = false;
    const answer = (r, final) => {
      const token = udfToken(r && r.url);
      if (!token) return false;
      udfIssued.add(token);
      reply({
        ok: true, handle: "udf:" + token, size: r.size, contentType: r.contentType,
        version: udfVersion(r), cached: r.source !== "fresh", final,
      });
      return true;
    };
    const over = () => {
      finished = true;
      if (udfJobs.get(req) === run) udfJobs.delete(req);
    };
    // The saved answer, before the run ends, so the frame can draw at once.
    run.saved.then((r) => {
      if (r && !finished) answer(r, false);
    });
    run.result.then(
      (r) => {
        over();
        if (!answer(r, true)) fail("failed", "the result could not be registered");
      },
      (error) => {
        over();
        fail((error && error.code) || "failed", (error && error.message) || "the UDF failed");
      },
    );
  }
  // fused-embed-udf-read: the bytes of a result this page issued to the
  // current frame document, from this app's own results route.
  async function udfRead(m) {
    if (typeof m.req !== "string" || !SQL_NAME_RE.test(m.req)) return;
    const req = m.req;
    const gen = frameGen;
    const reply = (extra, transfer) => {
      if (gen === frameGen) post({ type: "fused-embed-udf-read-result", req, ...extra }, transfer);
    };
    const fail = (code, message) => reply({ ok: false, error: { code, message } });
    const match = typeof m.handle === "string" ? /^udf:([0-9a-f]{64}|t[0-9a-f]{32})$/.exec(m.handle) : null;
    if (!match) {
      fail("invalid_args", "invalid arguments");
      return;
    }
    const token = match[1];
    if (!udfIssued.has(token)) {
      fail("not_found", "no such result");
      return;
    }
    try {
      const res = await fetch("/api/udf/results/" + token, { cache: "no-store" });
      if (!res.ok) {
        fail("not_found", "this result is no longer available");
        return;
      }
      const bytes = await res.arrayBuffer();
      reply({ ok: true, bytes, contentType: res.headers.get("content-type") || "" }, [bytes]);
    } catch (error) {
      fail("failed", (error && error.message) || "the result could not be read");
    }
  }
  function udfCancel(m) {
    if (typeof m.req !== "string" || !SQL_NAME_RE.test(m.req)) return;
    const run = udfJobs.get(m.req);
    if (run) run.cancel();
  }

  // End the session now rather than at the engine's idle timeout: when this
  // page leaves, and when the frame loads a new document (which starts with
  // none of the last one's temporary tables). Registered files stay for the
  // engine's life.
  function sqlEnd() {
    const id = sqlId;
    sqlForget();
    if (id) {
      fetch("/api/sql/session/" + encodeURIComponent(id), {
        method: "DELETE",
        keepalive: true,
        headers: SQL_GUARD,
      }).catch(() => {});
    }
  }
  window.addEventListener("pagehide", sqlEnd);
  window.addEventListener("pagehide", udfAbort);

  window.addEventListener("message", (event) => {
    if (!wb || event.origin !== wb.origin || event.source !== frame.contentWindow) return;
    const data = event.data;
    if (!data || typeof data.type !== "string") return;
    if (data.type === "fused-embed-auth-ready" || data.type === "fused-embed-auth-refresh") {
      void sendToken(data.type === "fused-embed-auth-ready");
    } else if (data.type === "fused-embed-node-ready" && data.node === node.node) {
      pageReady = true;
      clearTimeout(readyTimer);
      // Also for a page that answered after the wait gave up on it.
      frame.hidden = false;
      message.hidden = true;
      // A fresh document holds no text yet, whatever was sent to the last one.
      void sendSource(true);
      // The canvas was pushed while this page was loading (the engine's
      // first push lands then): it may have read the canvas before it.
      if (pendingPush !== null) {
        post({ type: "fused-embed-pushed", push_seq: pendingPush });
        pendingPush = null;
      }
      // A save that landed while the file watch was still coming up made no
      // event: look once more (nothing is posted when the text is the same).
      setTimeout(() => void sendSource(false), SOURCE_RECHECK_MS);
    } else if (data.type === "fused-embed-sql") {
      if (sqlOffered) void sqlMessage(data);
    } else if (data.type === "fused-embed-udf") {
      if (udfOffered) udfMessage(data);
    } else if (data.type === "fused-embed-udf-read") {
      if (udfOffered) void udfRead(data);
    } else if (data.type === "fused-embed-udf-cancel") {
      if (udfOffered) udfCancel(data);
    } else if (data.type === "fused-embed-node-state" && data.node === node.node) {
      const status = typeof data.status === "string" ? data.status : "";
      const detail = status === "error" && typeof data.message === "string" ? ": " + data.message : "";
      setStatus((STATUS_TEXT[status] || "") + detail, status === "error" ? "error" : "");
    }
  });

  function loadFrame() {
    pageReady = false;
    lastSent = null;
    sourceSeq++;
    pendingPush = null;
    frameGen++;
    sqlOffered = false;   // a new document is offered again with its own token
    udfOffered = false;
    udfIssued.clear();
    udfAbort();           // the old document's runs are abandoned (its replies are dropped by frameGen)
    canvasSent = null;
    canvasReady = false;
    canvasStale = false;
    canvasReading = false;
    canvasAgain = false;
    // Fetched once per document, in parallel with the token.
    canvasSeed = CanvasNode.saved(node.env, node.name);
    sqlEnd();
    setStatus(STATUS_TEXT.loading);
    showMessage((el) => el.append(text("div", "Loading " + node.title + "…")));
    // The wait for the page to say it is there runs from the frame's LOAD (a
    // slow network is not a missing page), with a longer one from here in
    // case the frame never loads at all.
    armReadyWait(FRAME_LOAD_WAIT_MS);
    frame.hidden = false;
    frame.title = "Workbench: " + node.title;
    frame.src = wb.base + "/embed/node/" + encodeURIComponent(node.name) + "/" +
      encodeURIComponent(node.node) + "?fused_embed_auth=1&fused_embed_v=3";
  }

  function armReadyWait(ms) {
    clearTimeout(readyTimer);
    readyTimer = setTimeout(() => {
      if (pageReady) return;
      frame.hidden = true;
      setStatus("");
      showMessage((el) => {
        el.append(text("div", "This environment's workbench cannot show a single node here yet."));
        el.append(actions(button("Open in canvas", () => CanvasNode.openCanvas(node), true)));
      });
    }, ms);
  }
  frame.addEventListener("load", () => {
    if (wb && !pageReady && !frame.hidden) armReadyWait(NODE_READY_WAIT_MS);
  });

  async function boot() {
    if (!FILE) {
      showMessage((el) => el.append(text("div", "No file to show.")));
      return;
    }
    try {
      node = await CanvasNode.info(FILE);
    } catch (error) {
      fail("Could not read this node", error);
      return;
    }
    if (!node || !node.enabled || !node.node) {
      node = null;
      showMessage((el) => el.append(text("div", "This file is not a node of a canvas you work on.")));
      return;
    }
    $("title").textContent = node.title;
    $("kind").textContent = KIND_LABEL[node.kind] || node.kind;
    $("canvas").textContent = node.name;
    $("open").addEventListener("click", () => CanvasNode.openCanvas(node));
    $("reload").addEventListener("click", () => { if (wb) loadFrame(); });
    $("strip").hidden = false;
    if (!node.signed_in) {
      showMessage((el) => {
        el.append(text("div", "Sign in to Fused to show " + node.title + " live."));
        el.append(actions(button("Open Canvases to sign in", () => CanvasNode.openCanvases(), true)));
      });
      return;
    }
    try {
      wb = await CanvasNode.workbench(node.env);
    } catch (error) {
      fail("Could not reach the workbench", error);
      return;
    }
    loadFrame();
    CanvasNode.sync(node, {
      status: setSync,
      // The saved canvas moved (this node, or one it reads): the frame loads
      // it again, in place.
      pushed: (seq) => {
        if (pageReady) post({ type: "fused-embed-pushed", push_seq: seq });
        else pendingPush = seq;
        void refreshCanvas();
      },
      // The sync stored a different saved canvas (a remote change, a pull or
      // merge): the frame gets it too, when it differs from what it has.
      saved: () => void refreshCanvas(),
    });
    // Another writer's save (the Code mode, an agent): the frame gets the new
    // text, with no reload of either page.
    // (This page watches its own file only.)
    fused.onFileChanged(() => void sendSource(false));
  }

  void boot();
</script>
</body>
</html>
