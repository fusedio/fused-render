name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (created at the current commit if it doesn't exist yet)"
        required: true
      platforms:
        description: "Which OS builds to run"
        required: true
        default: all
        type: choice
        options:
          - all
          - macos
          - linux

jobs:
  # Creates the GitHub Release every OS build job uploads into, so the
  # builds run in parallel instead of serializing behind the DMG job.
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # previous-tag lookup needs all tags

      - name: Resolve release tag
        id: resolve
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # A dispatch can name an existing tag pointing at a different
          # commit — never publish artifacts that don't match the tagged source.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_SHA="$(git rev-parse "$TAG^{commit}")"
            RUN_SHA="$(git rev-parse "${{ github.sha }}^{commit}")"
            if [ "$TAG_SHA" != "$RUN_SHA" ]; then
              echo "::error::tag $TAG points at $TAG_SHA but this run builds $RUN_SHA — refusing to publish mismatched artifacts"
              exit 1
            fi
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, reusing it."
            exit 0
          fi
          # GitHub's own previous-tag auto-detection has proven unreliable
          # here — pin it explicitly (empty on the very first release).
          PREV_TAG="$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -n1 || true)"
          gh release create "$TAG" --target "${{ github.sha }}" \
            --title "FusedRender $TAG" \
            --generate-notes ${PREV_TAG:+--notes-start-tag "$PREV_TAG"}

  # The PyPI wheel, built on its own runner rather than lifted out of the DMG
  # job, so a signing or notarization failure never holds back (or partially
  # ships) the pip release. Wheel only: there is no sdist include list, and a
  # default hatch sdist would carry the whole repo (ios/, prototypes/, specs).
  build-pypi:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The hatch build hook (scripts/hatch_build.py) runs `npm run build` to
      # bake the React shell into fused_render/static/shell-dist.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v9.0.0

      - name: Build wheel
        env:
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          uv build --wheel
          uvx twine check --strict dist/*.whl
          WHL="$(ls dist/fused_render-*.whl)"
          # PyPI versions are permanent: refuse a wheel whose version is not
          # the tag being released.
          case "$(basename "$WHL")" in
            "fused_render-${TAG#v}-"*) ;;
            *) echo "::error::$WHL does not match tag $TAG"; exit 1 ;;
          esac
          unzip -l "$WHL" | grep -q "fused_render/static/shell-dist/index.html" \
            || { echo "::error::wheel is missing the built React shell"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/*.whl
          if-no-files-found: error

  publish-pypi:
    needs: build-pypi
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI's publisher for fused-render names this
    # workflow file and this environment, so no API token is stored.
    environment:
      name: pypi
      url: https://pypi.org/p/fused-render
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1

  build-sign-notarize-release:
    needs: prepare-release
    if: github.event_name == 'push' || github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'macos'
    # macos-26, the NEWEST image: the apple tier's Swift helper (D700) links
    # FoundationModels and Speech, which exist only in the macOS 26 SDK, and it
    # is built in place by build_dmg.sh step 4e. D468 had pinned this job to
    # macos-14 because build_dmg.sh bundled Homebrew's python@3.12 — a per-OS
    # bottle whose C extensions link the BUILD host's system libraries (the
    # v0.4.49-v0.4.51 pyexpat/libexpat launch failure on macOS 14). That pin
    # is lifted by changing the interpreter, not by trusting the runner: the
    # build now uses the python.org-style framework `setup-python` installs
    # (old deployment target, own libexpat/OpenSSL) and refuses Homebrew's for
    # a release, and step 4f fails the build if ANY bundled Mach-O carries a
    # minos above 13.0 — bottles and newer-tagged wheels alike.
    runs-on: macos-26
    outputs:
      version: ${{ steps.artifacts.outputs.version }}
      dmg_sha256: ${{ steps.artifacts.outputs.dmg_sha256 }}
      dmg_url: ${{ steps.artifacts.outputs.dmg_url }}
      wheel_url: ${{ steps.artifacts.outputs.wheel_url }}
      pkg_url: ${{ steps.artifacts.outputs.pkg_url }}
    permissions:
      contents: write # needed to attach the DMG to a GitHub Release
      id-token: write # needed to assume the AWS role via OIDC
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
      KEYCHAIN_PATH: ${{ github.workspace }}/ci-signing.keychain-db
      NOTARY_PROFILE: ci-notary
      AWS_DEFAULT_REGION: us-west-2
      S3_BUCKET: fused-render
      # CloudFront distribution fronting the fused-render bucket (provisioned in
      # Fused's infrastructure config). Flip to render.fused.io once its alias +
      # cert have applied — release-note and latest.json links pick it up here.
      CDN_DOMAIN: d2ic19jpchjovp.cloudfront.net
      CLOUDFRONT_DISTRIBUTION_ID: E393B7TS7Y3EDS
    steps:
      - uses: actions/checkout@v5

      # Two jobs at once: build_dmg.sh's own version check needs `str | None`
      # syntax (py>=3.10), and — the load-bearing one — on macOS arm64 this
      # installs a python.org-style FRAMEWORK build under /Library/Frameworks,
      # which is the interpreter build_dmg.sh step 1 bundles (see runs-on).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Select an Xcode with the macOS 26 SDK (apple tier helper)
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [[ -n "$XCODE" ]]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      # build_dmg.sh copies the host's uv INTO the bundle: the macOS app ships no
      # `venv`, `ensurepip` or `pip` module, so the install loader (SPEC PY-18) has
      # no other way to build a script venv there (D176). The Linux build
      # script already requires uv on the host the same way; macOS runners
      # do not have it preinstalled, so the build fails loudly without this.
      - uses: astral-sh/setup-uv@v9.0.0

      # The Chromium engine is built into the bundle (build_dmg.sh 4e-bis,
      # D1415) from the ~200 MB CEF distribution the manifest pins; keep the
      # tarball between runs (build.sh re-verifies its sha1 every time).
      - name: Cache the CEF binary distribution
        uses: actions/cache@v4
        with:
          path: fused_render/chromium/native/.cef-cache
          key: cef-arm64-${{ hashFiles('fused_render/chromium/manifest.json') }}

      - name: Import signing cert + notary credentials into ephemeral keychain
        env:
          CODESIGN_CERT_P12: ${{ secrets.CODESIGN_CERT_P12 }}
          CODESIGN_CERT_PASSWORD: ${{ secrets.CODESIGN_CERT_PASSWORD }}
          INSTALLER_CERT_P12: ${{ secrets.INSTALLER_CERT_P12 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.INSTALLER_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/codesign-cert.p12"
          echo "$CODESIGN_CERT_P12" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 14400 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CODESIGN_CERT_PASSWORD" -T /usr/bin/codesign
          # The installer certificate (Developer ID INSTALLER, a different type
          # from the application one above) signs the .pkg network installer
          # (scripts/build_pkg.sh). Optional: without it the pkg is built
          # unsigned and not published, and the release is unaffected.
          if [[ -n "${INSTALLER_CERT_P12:-}" ]]; then
            INSTALLER_CERT_PATH="$RUNNER_TEMP/installer-cert.p12"
            echo "$INSTALLER_CERT_P12" | base64 --decode -o "$INSTALLER_CERT_PATH"
            security import "$INSTALLER_CERT_PATH" -k "$KEYCHAIN_PATH" -P "$INSTALLER_CERT_PASSWORD" \
              -T /usr/bin/productbuild -T /usr/bin/productsign
            rm -f "$INSTALLER_CERT_PATH"
          fi
          # Without this, codesign blocks on a keychain-access UI prompt that
          # can never be answered in CI (see docs/signing.md's CI notes).
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # notarytool profiles live in a keychain too; store into the same
          # ephemeral one so it's gone with the runner, nothing persists.
          # App Store Connect API key: no personal Apple ID tied to CI, and
          # unlike an app-specific password it doesn't expire.
          API_KEY_PATH="$RUNNER_TEMP/notary-api-key.p8"
          printf '%s' "$NOTARY_API_KEY_P8" > "$API_KEY_PATH"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$API_KEY_PATH" --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"
          rm -f "$API_KEY_PATH"

          rm -f "$CERT_PATH"

      - name: Build, sign, notarize, staple DMG
        env:
          FUSED_RENDER_CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          FUSED_RENDER_CODESIGN_KEYCHAIN: ${{ env.KEYCHAIN_PATH }}
          FUSED_RENDER_NOTARY_PROFILE: ${{ env.NOTARY_PROFILE }}
        run: bash scripts/build_dmg.sh

      # The network installer: a tiny .pkg whose postinstall downloads the DMG
      # built above from the CDN and verifies the sha256 pinned here. Built
      # from the FINAL (stapled) DMG bytes, under the URL the upload step
      # below publishes them at, and while the ephemeral keychain still holds
      # the installer identity + notary profile. Signed only when the
      # INSTALLER_* secrets exist; the upload step publishes it only then.
      - name: Build, sign, notarize, staple installer pkg
        env:
          FUSED_RENDER_INSTALLER_IDENTITY: ${{ secrets.INSTALLER_IDENTITY }}
          FUSED_RENDER_CODESIGN_KEYCHAIN: ${{ env.KEYCHAIN_PATH }}
          FUSED_RENDER_NOTARY_PROFILE: ${{ env.NOTARY_PROFILE }}
        run: |
          set -euo pipefail
          DMG_PATH="$(ls dist/*.dmg)"
          bash scripts/build_pkg.sh "$DMG_PATH" "https://${CDN_DOMAIN}/fused-render-dmgs/$(basename "$DMG_PATH")"

      - name: Delete ephemeral keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::926411091187:role/github_fused_render_role
          role-session-name: GithubFusedRenderRelease
          aws-region: us-west-2

      - name: Upload DMG + wheel to S3
        id: artifacts
        run: |
          set -euo pipefail
          # Not `brew install awscli`: GH's macOS images don't have the
          # `aws/tap` cask pre-trusted, and Homebrew's tap-trust gate fails
          # the install outright. Apple's own .pkg installer sidesteps
          # Homebrew (and its taps) entirely.
          if ! command -v aws >/dev/null; then
            curl -fsSL "https://awscli.amazonaws.com/AWSCLIV2.pkg" -o "$RUNNER_TEMP/AWSCLIV2.pkg"
            sudo installer -pkg "$RUNNER_TEMP/AWSCLIV2.pkg" -target /
          fi
          DMG_PATH="$(ls dist/*.dmg)"
          DMG_SHA256="$(shasum -a 256 "$DMG_PATH" | cut -d' ' -f1)"
          WHL_PATH="$(ls dist/*.whl)"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
          echo "DMG_SHA256=$DMG_SHA256" >> "$GITHUB_ENV"
          echo "WHL_PATH=$WHL_PATH" >> "$GITHUB_ENV"
          # Consumed by the download-page step; served via CloudFront.
          echo "DMG_URL=https://${CDN_DOMAIN}/fused-render-dmgs/$(basename "$DMG_PATH")" >> "$GITHUB_ENV"
          echo "WHL_URL=https://${CDN_DOMAIN}/fused-render-wheels/$(basename "$WHL_PATH")" >> "$GITHUB_ENV"
          aws s3 cp "$DMG_PATH" "s3://${S3_BUCKET}/fused-render-dmgs/$(basename "$DMG_PATH")"
          aws s3 cp "$WHL_PATH" "s3://${S3_BUCKET}/fused-render-wheels/$(basename "$WHL_PATH")"
          # The installer pkg, only when signed: Gatekeeper refuses an
          # unsigned pkg from the internet, so an unsigned one (no INSTALLER_*
          # secrets yet) stays off the page and the Release. Same prefix as
          # the DMG it installs: covered by the CI role's policy and by the
          # invalidation below. The fixed-name copy is the link to hand
          # around; it always holds the latest release's installer.
          PKG_PATH="$(ls dist/*.pkg 2>/dev/null || true)"
          if [[ -n "$PKG_PATH" ]] && pkgutil --check-signature "$PKG_PATH" | grep -q "Status: signed"; then
            aws s3 cp "$PKG_PATH" "s3://${S3_BUCKET}/fused-render-dmgs/$(basename "$PKG_PATH")"
            aws s3 cp "$PKG_PATH" "s3://${S3_BUCKET}/fused-render-dmgs/FusedRender-Installer.pkg" \
              --cache-control no-cache
            echo "PKG_PATH=$PKG_PATH" >> "$GITHUB_ENV"
            echo "pkg_url=https://${CDN_DOMAIN}/fused-render-dmgs/$(basename "$PKG_PATH")" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::installer pkg is unsigned or missing — not published (see docs/signing.md, Installer package)"
          fi
          # Exposed as job outputs for the split-out bump-homebrew job and the
          # publish-download-page job (which needs every platform's URL at
          # once to write a single merged manifest). Written only after the
          # uploads above succeed: publish-download-page runs under
          # always() and would otherwise be able to pick up a dmg_url/
          # wheel_url for a file that never actually made it to S3.
          echo "version=$(basename "$DMG_PATH" .dmg | sed 's/^FusedRender-//')" >> "$GITHUB_OUTPUT"
          echo "dmg_sha256=$DMG_SHA256" >> "$GITHUB_OUTPUT"
          echo "dmg_url=https://${CDN_DOMAIN}/fused-render-dmgs/$(basename "$DMG_PATH")" >> "$GITHUB_OUTPUT"
          echo "wheel_url=https://${CDN_DOMAIN}/fused-render-wheels/$(basename "$WHL_PATH")" >> "$GITHUB_OUTPUT"

      - name: Publish signed macOS update manifest
        # The in-app updater (fused_render/update/mac.py) polls this fixed
        # name — same signing scheme and script as the Linux manifest
        # (docs/LINUX_AUTO_UPDATE_SPEC.md). The manifest
        # URL points at the already-uploaded DMG, so this runs strictly after
        # the S3 upload above.
        env:
          FUSED_RENDER_UPDATE_SIGNING_KEY: ${{ secrets.FUSED_RENDER_UPDATE_SIGNING_KEY }}
          MACOS_PREFIX: fused-render-macos
        run: |
          set -euo pipefail
          VERSION="$(basename "$DMG_PATH" .dmg | sed 's/^FusedRender-//')"
          uv run --no-project --with cryptography \
            scripts/generate_update_manifest.py \
            "$VERSION" "$DMG_PATH" "https://${CDN_DOMAIN}/fused-render-dmgs" \
            dist/macos-latest.json
          # no-cache: the updater polls this fixed name; a stale CDN copy
          # would mask a release.
          aws s3 cp dist/macos-latest.json "s3://${S3_BUCKET}/${MACOS_PREFIX}/latest.json" \
            --cache-control no-cache

      - name: Invalidate CloudFront
        # The root download page (index.html/latest.json/og-image.png) is
        # published once, after every platform build, by the
        # publish-download-page job below — not here, so its manifest can
        # carry the Linux link too instead of racing those jobs to
        # read-modify-write the same S3 object.
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/fused-render-dmgs/*" "/fused-render-wheels/*" "/fused-render-macos/*"

      - name: Upload DMG + wheel to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$DMG_PATH" "$WHL_PATH" ${PKG_PATH:+"$PKG_PATH"} --clobber

  # FusedRender.app for Intel Macs: the render job above with
  # FUSED_RENDER_ARCH=x86_64 on an Intel runner. A plain copy, like the bot job
  # below. Not wired into publish-download-page or bump-homebrew yet: the Intel
  # DMG ships through the GitHub Release, S3 and its own update manifest only,
  # and the cask still installs the arm64 DMG. What differs, and why:
  #   - macos-15-intel: build_dmg.sh cannot cross-compile (py2app bundles the
  #     interpreter it runs under, pip picks wheels for that interpreter's
  #     arch), so the build runs natively on Intel. No Xcode 26 step: the
  #     x86_64 build ships no Apple helper (build_dmg.sh step 4e) — the apple
  #     tier and every local AI runner are off on Intel (ai/registry.py
  #     `local_ai_disabled`). Step 4f still holds the bundle to minos 13.0.
  #   - DMG only: the wheel is pure Python and identical; the render job
  #     uploads it.
  #   - Its own update manifest, fused-render-macos-x86_64/latest.json, which
  #     update/mac.py polls when the app runs as x86_64. The two manifests are
  #     signed with the same key and context; each names its own DMG.
  # FusedBot has no Intel build.
  build-sign-notarize-release-intel:
    needs: prepare-release
    if: github.event_name == 'push' || github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'macos'
    runs-on: macos-15-intel
    permissions:
      contents: write # needed to attach the DMG to a GitHub Release
      id-token: write # needed to assume the AWS role via OIDC
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
      KEYCHAIN_PATH: ${{ github.workspace }}/ci-signing.keychain-db
      NOTARY_PROFILE: ci-notary
      AWS_DEFAULT_REGION: us-west-2
      S3_BUCKET: fused-render
      CDN_DOMAIN: d2ic19jpchjovp.cloudfront.net
      CLOUDFRONT_DISTRIBUTION_ID: E393B7TS7Y3EDS
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # build_dmg.sh bundles a python.org-style FRAMEWORK python from
      # /Library/Frameworks (step 1) and refuses Homebrew's for a release.
      # setup-python's macOS 3.12 is normally that framework; if this image's
      # is not, install python.org's universal2 3.12 pkg (3.12.10 is the last
      # 3.12 with a binary installer) so step 1 has one.
      - name: Ensure a python.org framework Python 3.12
        run: |
          set -euo pipefail
          FW=/Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12
          if [[ ! -x "$FW" ]] || [[ -z "$("$FW" -c 'import sysconfig; print(sysconfig.get_config_var("PYTHONFRAMEWORK") or "")')" ]]; then
            curl -fsSL "https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg" -o "$RUNNER_TEMP/python.pkg"
            sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target /
          fi
          "$FW" -c 'import platform, sys; print(sys.version, platform.machine())'

      # build_dmg.sh copies the host's uv INTO the bundle (D176); on this Intel
      # runner setup-uv installs an x86_64 uv, which step 4d-bis checks.
      - uses: astral-sh/setup-uv@v9.0.0

      - name: Import signing cert + notary credentials into ephemeral keychain
        env:
          CODESIGN_CERT_P12: ${{ secrets.CODESIGN_CERT_P12 }}
          CODESIGN_CERT_PASSWORD: ${{ secrets.CODESIGN_CERT_PASSWORD }}
          INSTALLER_CERT_P12: ${{ secrets.INSTALLER_CERT_P12 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.INSTALLER_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/codesign-cert.p12"
          echo "$CODESIGN_CERT_P12" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 14400 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CODESIGN_CERT_PASSWORD" -T /usr/bin/codesign
          # The installer certificate (Developer ID INSTALLER, a different type
          # from the application one above) signs the .pkg network installer
          # (scripts/build_pkg.sh). Optional: without it the pkg is built
          # unsigned and not published, and the release is unaffected.
          if [[ -n "${INSTALLER_CERT_P12:-}" ]]; then
            INSTALLER_CERT_PATH="$RUNNER_TEMP/installer-cert.p12"
            echo "$INSTALLER_CERT_P12" | base64 --decode -o "$INSTALLER_CERT_PATH"
            security import "$INSTALLER_CERT_PATH" -k "$KEYCHAIN_PATH" -P "$INSTALLER_CERT_PASSWORD" \
              -T /usr/bin/productbuild -T /usr/bin/productsign
            rm -f "$INSTALLER_CERT_PATH"
          fi
          # Without this, codesign blocks on a keychain-access UI prompt that
          # can never be answered in CI (see docs/signing.md's CI notes).
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          API_KEY_PATH="$RUNNER_TEMP/notary-api-key.p8"
          printf '%s' "$NOTARY_API_KEY_P8" > "$API_KEY_PATH"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$API_KEY_PATH" --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"
          rm -f "$API_KEY_PATH"

          rm -f "$CERT_PATH"

      - name: Build, sign, notarize, staple DMG
        env:
          FUSED_RENDER_CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          FUSED_RENDER_CODESIGN_KEYCHAIN: ${{ env.KEYCHAIN_PATH }}
          FUSED_RENDER_NOTARY_PROFILE: ${{ env.NOTARY_PROFILE }}
          FUSED_RENDER_ARCH: x86_64
        run: bash scripts/build_dmg.sh

      # Same installer as the arm64 job's, pinned to the Intel DMG; ships
      # through S3 and the Release like the Intel DMG (not the download page).
      - name: Build, sign, notarize, staple installer pkg
        env:
          FUSED_RENDER_INSTALLER_IDENTITY: ${{ secrets.INSTALLER_IDENTITY }}
          FUSED_RENDER_CODESIGN_KEYCHAIN: ${{ env.KEYCHAIN_PATH }}
          FUSED_RENDER_NOTARY_PROFILE: ${{ env.NOTARY_PROFILE }}
        run: |
          set -euo pipefail
          DMG_PATH="$(ls dist/*-x86_64.dmg)"
          bash scripts/build_pkg.sh "$DMG_PATH" "https://${CDN_DOMAIN}/fused-render-dmgs/$(basename "$DMG_PATH")"

      - name: Delete ephemeral keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::926411091187:role/github_fused_render_role
          role-session-name: GithubFusedRenderReleaseIntel
          aws-region: us-west-2

      - name: Upload DMG to S3
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null; then
            curl -fsSL "https://awscli.amazonaws.com/AWSCLIV2.pkg" -o "$RUNNER_TEMP/AWSCLIV2.pkg"
            sudo installer -pkg "$RUNNER_TEMP/AWSCLIV2.pkg" -target /
          fi
          DMG_PATH="$(ls dist/*-x86_64.dmg)"
          # FusedRender-<version>-x86_64.dmg -> <version>
          VERSION="$(basename "$DMG_PATH" .dmg | sed -E 's/^FusedRender-//; s/-x86_64$//')"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          aws s3 cp "$DMG_PATH" "s3://${S3_BUCKET}/fused-render-dmgs/$(basename "$DMG_PATH")"
          PKG_PATH="$(ls dist/*-x86_64.pkg 2>/dev/null || true)"
          if [[ -n "$PKG_PATH" ]] && pkgutil --check-signature "$PKG_PATH" | grep -q "Status: signed"; then
            aws s3 cp "$PKG_PATH" "s3://${S3_BUCKET}/fused-render-dmgs/$(basename "$PKG_PATH")"
            echo "PKG_PATH=$PKG_PATH" >> "$GITHUB_ENV"
          else
            echo "::warning::Intel installer pkg is unsigned or missing — not published"
          fi

      # Before the manifest, unlike the arm64 job: the manifest writes a NEW
      # prefix (fused-render-macos-x86_64/), and if the CI role's IAM policy
      # (terraform iam_github.tf in the application repo) does not cover it yet,
      # that step fails — the Release attachment must not hang on it.
      - name: Upload DMG to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$DMG_PATH" ${PKG_PATH:+"$PKG_PATH"} --clobber

      - name: Publish signed macOS (Intel) update manifest
        env:
          FUSED_RENDER_UPDATE_SIGNING_KEY: ${{ secrets.FUSED_RENDER_UPDATE_SIGNING_KEY }}
          MACOS_PREFIX: fused-render-macos-x86_64
        run: |
          set -euo pipefail
          uv run --no-project --with cryptography \
            scripts/generate_update_manifest.py \
            "$VERSION" "$DMG_PATH" "https://${CDN_DOMAIN}/fused-render-dmgs" \
            dist/macos-x86_64-latest.json
          aws s3 cp dist/macos-x86_64-latest.json "s3://${S3_BUCKET}/${MACOS_PREFIX}/latest.json" \
            --cache-control no-cache

      - name: Invalidate CloudFront
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/fused-render-dmgs/*" "/fused-render-macos-x86_64/*"

  # FusedBot.app: the same repo, build script and signing path with
  # FUSED_RENDER_FLAVOR=bot (fused_render/_flavor.py) — its own bundle id,
  # icon, URL scheme, S3 prefixes and update manifest. A plain copy of the
  # render job above rather than a matrix: the render job's outputs feed
  # publish-download-page and bump-homebrew, and the bot has neither a
  # download-page slot nor a cask.
  build-sign-notarize-release-bot:
    needs: prepare-release
    if: github.event_name == 'push' || github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'macos'
    # Runner + interpreter rationale: see build-sign-notarize-release.
    runs-on: macos-26
    permissions:
      contents: write # needed to attach the DMG to a GitHub Release
      id-token: write # needed to assume the AWS role via OIDC
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
      KEYCHAIN_PATH: ${{ github.workspace }}/ci-signing.keychain-db
      NOTARY_PROFILE: ci-notary
      AWS_DEFAULT_REGION: us-west-2
      S3_BUCKET: fused-render
      # CloudFront distribution fronting the fused-render bucket (provisioned in
      # Fused's infrastructure config). Flip to render.fused.io once its alias +
      # cert have applied — release-note and latest.json links pick it up here.
      CDN_DOMAIN: d2ic19jpchjovp.cloudfront.net
      CLOUDFRONT_DISTRIBUTION_ID: E393B7TS7Y3EDS
    steps:
      - uses: actions/checkout@v5

      # Two jobs at once: build_dmg.sh's own version check needs `str | None`
      # syntax (py>=3.10), and — the load-bearing one — on macOS arm64 this
      # installs a python.org-style FRAMEWORK build under /Library/Frameworks,
      # which is the interpreter build_dmg.sh step 1 bundles (see runs-on).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Select an Xcode with the macOS 26 SDK (apple tier helper)
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [[ -n "$XCODE" ]]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      # build_dmg.sh copies the host's uv INTO the bundle: the macOS app ships no
      # `venv`, `ensurepip` or `pip` module, so the install loader (SPEC PY-18) has
      # no other way to build a script venv there (D176). The Linux build
      # script already requires uv on the host the same way; macOS runners
      # do not have it preinstalled, so the build fails loudly without this.
      - uses: astral-sh/setup-uv@v9.0.0

      # The Chromium engine is built into the bundle (build_dmg.sh 4e-bis,
      # D1415) from the ~200 MB CEF distribution the manifest pins; keep the
      # tarball between runs (build.sh re-verifies its sha1 every time).
      - name: Cache the CEF binary distribution
        uses: actions/cache@v4
        with:
          path: fused_render/chromium/native/.cef-cache
          key: cef-arm64-${{ hashFiles('fused_render/chromium/manifest.json') }}

      - name: Import signing cert + notary credentials into ephemeral keychain
        env:
          CODESIGN_CERT_P12: ${{ secrets.CODESIGN_CERT_P12 }}
          CODESIGN_CERT_PASSWORD: ${{ secrets.CODESIGN_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/codesign-cert.p12"
          echo "$CODESIGN_CERT_P12" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 14400 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CODESIGN_CERT_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign blocks on a keychain-access UI prompt that
          # can never be answered in CI (see docs/signing.md's CI notes).
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # notarytool profiles live in a keychain too; store into the same
          # ephemeral one so it's gone with the runner, nothing persists.
          # App Store Connect API key: no personal Apple ID tied to CI, and
          # unlike an app-specific password it doesn't expire.
          API_KEY_PATH="$RUNNER_TEMP/notary-api-key.p8"
          printf '%s' "$NOTARY_API_KEY_P8" > "$API_KEY_PATH"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$API_KEY_PATH" --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"
          rm -f "$API_KEY_PATH"

          rm -f "$CERT_PATH"

      - name: Build, sign, notarize, staple DMG
        env:
          FUSED_RENDER_CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          FUSED_RENDER_CODESIGN_KEYCHAIN: ${{ env.KEYCHAIN_PATH }}
          FUSED_RENDER_NOTARY_PROFILE: ${{ env.NOTARY_PROFILE }}
          FUSED_RENDER_FLAVOR: bot
        run: bash scripts/build_dmg.sh

      - name: Delete ephemeral keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::926411091187:role/github_fused_render_role
          role-session-name: GithubFusedRenderReleaseBot
          aws-region: us-west-2

      - name: Upload DMG + wheel to S3
        id: artifacts
        run: |
          set -euo pipefail
          # Not `brew install awscli`: GH's macOS images don't have the
          # `aws/tap` cask pre-trusted, and Homebrew's tap-trust gate fails
          # the install outright. Apple's own .pkg installer sidesteps
          # Homebrew (and its taps) entirely.
          if ! command -v aws >/dev/null; then
            curl -fsSL "https://awscli.amazonaws.com/AWSCLIV2.pkg" -o "$RUNNER_TEMP/AWSCLIV2.pkg"
            sudo installer -pkg "$RUNNER_TEMP/AWSCLIV2.pkg" -target /
          fi
          DMG_PATH="$(ls dist/*.dmg)"
          DMG_SHA256="$(shasum -a 256 "$DMG_PATH" | cut -d' ' -f1)"
          WHL_PATH="$(ls dist/*.whl)"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
          echo "DMG_SHA256=$DMG_SHA256" >> "$GITHUB_ENV"
          echo "WHL_PATH=$WHL_PATH" >> "$GITHUB_ENV"
          # No DMG_URL/WHL_URL here: the bot has no download-page slot, so
          # nothing downstream reads them.
          aws s3 cp "$DMG_PATH" "s3://${S3_BUCKET}/fused-bot-dmgs/$(basename "$DMG_PATH")"
          aws s3 cp "$WHL_PATH" "s3://${S3_BUCKET}/fused-bot-wheels/$(basename "$WHL_PATH")"

      - name: Publish signed macOS update manifest
        # The bot's in-app updater polls this fixed name under its own
        # prefix (_flavor.release_prefix() = fused-bot); same signing scheme
        # and script as the render manifest above.
        env:
          FUSED_RENDER_UPDATE_SIGNING_KEY: ${{ secrets.FUSED_RENDER_UPDATE_SIGNING_KEY }}
          # fused_render/update/common.py SIGNING_CONTEXT for the bot flavor.
          FUSED_RENDER_UPDATE_SIGNING_CONTEXT: fused-bot-update
          MACOS_PREFIX: fused-bot-macos
        run: |
          set -euo pipefail
          VERSION="$(basename "$DMG_PATH" .dmg | sed 's/^FusedBot-//')"
          uv run --no-project --with cryptography \
            scripts/generate_update_manifest.py \
            "$VERSION" "$DMG_PATH" "https://${CDN_DOMAIN}/fused-bot-dmgs" \
            dist/macos-latest.json
          # no-cache: the updater polls this fixed name; a stale CDN copy
          # would mask a release.
          aws s3 cp dist/macos-latest.json "s3://${S3_BUCKET}/${MACOS_PREFIX}/latest.json" \
            --cache-control no-cache

      - name: Invalidate CloudFront
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/fused-bot-dmgs/*" "/fused-bot-wheels/*" "/fused-bot-macos/*"

      - name: Upload DMG to GitHub Release
        # DMG only. The bot wheel has the SAME filename as the render wheel
        # (fused_render-<ver>-py3-none-any.whl — the flavor is baked inside,
        # not in the name), so uploading it here would clobber whichever
        # job's wheel landed first. S3 keeps them apart by prefix.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$DMG_PATH" --clobber

  build-linux-release:
    needs: prepare-release
    if: github.event_name == 'push' || github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'linux'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.artifacts.outputs.version }}
      appimage_url: ${{ steps.artifacts.outputs.appimage_url }}
    permissions:
      contents: write # attach the AppImage to the GitHub Release
      id-token: write # assume the AWS role via OIDC
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
      AWS_DEFAULT_REGION: us-west-2
      S3_BUCKET: fused-render
      CDN_DOMAIN: d2ic19jpchjovp.cloudfront.net
      CLOUDFRONT_DISTRIBUTION_ID: E393B7TS7Y3EDS
      LINUX_PREFIX: fused-render-linux
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v9.0.0

      # desktop-file-utils provides desktop-file-validate, which appimagetool
      # runs against the bundled .desktop file — same prerequisite the CI smoke
      # installs. node (the wheel build's hatch hook runs npm) is preinstalled
      # on ubuntu-latest; uv provides the relocatable CPython the script bundles.
      #
      # libgirepository1.0-dev + libcairo2-dev + pkg-config + gcc are BUILD-time
      # only: PyGObject (the [linux-desktop] extra, for the native windows) has
      # no manylinux wheel and compiles from its sdist against these headers.
      # Nothing from them is copied into the AppImage — WebKitGTK, GTK and
      # libgirepository stay the user's own system libraries (the script asserts
      # that), and a machine without them just opens browser tabs.
      - name: Install desktop-file-utils and the PyGObject build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils \
            libgirepository1.0-dev libcairo2-dev pkg-config gcc

      - name: Build the AppImage
        run: bash scripts/build_linux_appimage.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::926411091187:role/github_fused_render_role
          role-session-name: GithubFusedRenderReleaseLinux
          aws-region: us-west-2

      - name: Publish AppImage + attach to release
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APPIMAGE="$(ls dist/FusedRender-*-x86_64.AppImage)"
          # Version from the built artifact, not the tag — same rule as the DMG.
          VERSION="$(basename "$APPIMAGE" | sed -E 's/^FusedRender-(.*)-x86_64\.AppImage$/\1/')"
          echo "Publishing FusedRender $VERSION Linux AppImage"
          aws s3 cp "$APPIMAGE" "s3://${S3_BUCKET}/${LINUX_PREFIX}/$(basename "$APPIMAGE")"
          # Exposed as job outputs for the publish-download-page job, right
          # after the one command that makes appimage_url actually true —
          # not after the CloudFront/release steps below, which are
          # unrelated to whether this URL is live (an unrelated failure
          # there must not withhold an otherwise-good link).
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "appimage_url=https://${CDN_DOMAIN}/${LINUX_PREFIX}/$(basename "$APPIMAGE")" >> "$GITHUB_OUTPUT"
          # Consumed by the "Publish signed Linux update manifest" step below,
          # the same way $DMG_PATH carries across into the macOS manifest step.
          echo "APPIMAGE=$APPIMAGE" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          gh release upload "$RELEASE_TAG" "$APPIMAGE" --clobber

      - name: Publish signed Linux update manifest
        # The in-app updater (fused_render/update/linux.py) polls this fixed
        # name — same signing scheme and script as the macOS manifest
        # (docs/LINUX_AUTO_UPDATE_SPEC.md). The
        # manifest URL points at the already-uploaded AppImage, so this runs
        # strictly after the S3 upload above.
        env:
          FUSED_RENDER_UPDATE_SIGNING_KEY: ${{ secrets.FUSED_RENDER_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          uv run --no-project --with cryptography \
            scripts/generate_update_manifest.py \
            "$VERSION" "$APPIMAGE" "https://${CDN_DOMAIN}/${LINUX_PREFIX}" \
            dist/linux-latest.json
          # no-cache: the updater polls this fixed name; a stale CDN copy
          # would mask a release.
          aws s3 cp dist/linux-latest.json "s3://${S3_BUCKET}/${LINUX_PREFIX}/latest.json" \
            --cache-control no-cache

      - name: Invalidate CloudFront
        # Runs after BOTH uploads above (the AppImage and the manifest that
        # points at it), same shape as the macOS job's "Invalidate
        # CloudFront" step: an invalidation issued before the manifest is
        # live would only cover the AppImage path, leaving a window where a
        # request for latest.json could re-cache the previous release's
        # manifest. The manifest upload's own --cache-control no-cache means
        # that window is already survivable without this ordering, but the
        # ordering removes it rather than merely surviving it.
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/${LINUX_PREFIX}/*"

  publish-download-page:
    # Runs once, after both OS builds, so the manifest can carry every
    # platform's link at the same time — a single writer avoids the platform
    # jobs racing to read-modify-write the same S3 object.
    # `!cancelled()` (rather than a hard `needs` success check) so a
    # workflow_dispatch that only rebuilds one platform, or a platform build
    # that fails, still publishes a manifest — merged against the live one
    # via EXISTING_MANIFEST_PATH so untouched/failed platforms keep whatever
    # link is already live instead of losing it. Deliberately NOT always():
    # that also runs on a manually cancelled run, which could rewrite the
    # live page from only whichever platform jobs happened to finish first.
    needs: [prepare-release, build-sign-notarize-release, build-linux-release]
    if: ${{ !cancelled() && needs.prepare-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # needed for actions/checkout
      id-token: write # needed to assume the AWS role via OIDC
    env:
      AWS_DEFAULT_REGION: us-west-2
      S3_BUCKET: fused-render
      CDN_DOMAIN: d2ic19jpchjovp.cloudfront.net
      CLOUDFRONT_DISTRIBUTION_ID: E393B7TS7Y3EDS
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::926411091187:role/github_fused_render_role
          role-session-name: GithubFusedRenderReleaseDownloadPage
          aws-region: us-west-2

      - name: Publish download page + version manifest
        env:
          VERSION: >-
            ${{ needs.build-sign-notarize-release.outputs.version ||
            needs.build-linux-release.outputs.version }}
          DMG_URL: ${{ needs.build-sign-notarize-release.outputs.dmg_url }}
          DMG_SHA256: ${{ needs.build-sign-notarize-release.outputs.dmg_sha256 }}
          PKG_URL: ${{ needs.build-sign-notarize-release.outputs.pkg_url }}
          WHL_URL: ${{ needs.build-sign-notarize-release.outputs.wheel_url }}
          LINUX_URL: ${{ needs.build-linux-release.outputs.appimage_url }}
        run: |
          set -euo pipefail
          # Only a genuine "no object yet" (404 - first-ever publish) is safe
          # to treat as an empty merge base. Any other failure here (an IAM
          # regression, a network blip, ...) must NOT fall through to an empty
          # base — that would silently republish a manifest missing every
          # platform this run didn't touch, exactly what the merge exists to
          # prevent. So a non-404 failure hard-exits, failing the job instead
          # of publishing a bad manifest.
          if aws s3 cp "s3://${S3_BUCKET}/latest.json" "$RUNNER_TEMP/existing-latest.json" 2>"$RUNNER_TEMP/s3-get.err"; then
            :
          elif grep -q "(404)" "$RUNNER_TEMP/s3-get.err"; then
            echo "no existing latest.json yet (first publish) — starting from an empty manifest"
          else
            cat "$RUNNER_TEMP/s3-get.err" >&2
            echo "::error::failed to fetch the live latest.json for merging (not a 404) — refusing to publish a manifest that could blank out other platforms' links"
            exit 1
          fi
          EXISTING_MANIFEST_PATH="$RUNNER_TEMP/existing-latest.json" \
            python3 scripts/download_page/write_manifest.py > "$RUNNER_TEMP/latest.json"
          cat "$RUNNER_TEMP/latest.json"
          # assets/ goes up in one pass per extension: `--content-type` is one
          # value for the whole command, and the hero video shipped as image/jpeg
          # when everything went through a single pass. The jpg pass is a sync;
          # the others are `cp --recursive` (a handful of files) because sync
          # skips unchanged objects and would leave the ones already uploaded
          # with the old image/jpeg type.
          # Order matters: everything index.html links to (assets, about.html,
          # ai.html) must land before index.html itself — the && chain
          # short-circuits, so a failed dependency upload leaves the OLD page
          # live instead of publishing a new page with missing images/links.
          if aws s3 cp "$RUNNER_TEMP/latest.json" "s3://${S3_BUCKET}/latest.json" \
               --content-type "application/json" --cache-control "max-age=300" \
             && aws s3 cp scripts/download_page/og-image.png "s3://${S3_BUCKET}/og-image.png" \
               --content-type "image/png" --cache-control "max-age=86400" \
             && aws s3 sync scripts/download_page/assets "s3://${S3_BUCKET}/assets" \
               --exclude "*" --include "*.jpg" --include "*.jpeg" \
               --content-type "image/jpeg" --cache-control "max-age=86400" \
             && aws s3 cp --recursive scripts/download_page/assets "s3://${S3_BUCKET}/assets" \
               --exclude "*" --include "*.png" \
               --content-type "image/png" --cache-control "max-age=86400" \
             && aws s3 cp --recursive scripts/download_page/assets "s3://${S3_BUCKET}/assets" \
               --exclude "*" --include "*.gif" \
               --content-type "image/gif" --cache-control "max-age=86400" \
             && aws s3 cp --recursive scripts/download_page/assets "s3://${S3_BUCKET}/assets" \
               --exclude "*" --include "*.mp4" \
               --content-type "video/mp4" --cache-control "max-age=86400" \
             && aws s3 cp scripts/download_page/about.html "s3://${S3_BUCKET}/about.html" \
               --content-type "text/html; charset=utf-8" --cache-control "max-age=300" \
             && aws s3 cp scripts/download_page/ai.html "s3://${S3_BUCKET}/ai.html" \
               --content-type "text/html; charset=utf-8" --cache-control "max-age=300" \
             && aws s3 cp scripts/download_page/index.html "s3://${S3_BUCKET}/index.html" \
               --content-type "text/html; charset=utf-8" --cache-control "max-age=300"; then
            echo "download page + latest.json published"
            aws cloudfront create-invalidation \
              --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
              --paths "/index.html" "/about.html" "/ai.html" "/latest.json" "/og-image.png" "/assets/*" "/"
          else
            echo "::error::download page/manifest upload failed — see the aws s3 cp/sync output above for which key was denied"
            exit 1
          fi

  bump-homebrew:
    # Separate job so a tap-push failure can't fail the DMG job after the
    # Release already published.
    needs: build-sign-notarize-release
    runs-on: ubuntu-latest
    permissions: {} # uses the tap PAT only; no GITHUB_TOKEN scopes needed
    steps:
      - name: Bump homebrew-tap cask
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
          # From the DMG that was actually built+hashed, not the git tag.
          VERSION: ${{ needs.build-sign-notarize-release.outputs.version }}
          DMG_SHA256: ${{ needs.build-sign-notarize-release.outputs.dmg_sha256 }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/fusedio/homebrew-tap.git" /tmp/homebrew-tap
          cd /tmp/homebrew-tap
          sed -i \
            -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"${DMG_SHA256}\"/" \
            Casks/fused-render.rb
          git config user.name "fused-render-ci"
          git config user.email "ci@fused.io"
          git add Casks/fused-render.rb
          git commit -m "fused-render ${VERSION}"
          git push origin main
