<!DOCTYPE html>
<!-- The .fused app-file template (SPEC §43, AF-5/AF-14). Opening a .fused IS
     the ordinary template path: /explorer/view/<path>.fused and
     /explorer/embed/<path>.fused (what a Finder double-click, a deeplink
     download and the CLI map to via the view-URL codec) resolve to this
     template on stat. The INSTALL PAGE itself is the shell's React page
     (frontend apps/marketplace FusedFilePage), which the shell renders IN
     PLACE of this template at those URLs for every `.fused` open. What this
     template still does:

     - A card peek / thumbnail (`_preview=1`, a reserved shell param): the
       icon tile and the name, from the light probe (GET /api/appfile/install
       ?light=1 — no hashing of the installed copy, never an extraction, never
       an install; D396 / D301).
     - A bare load as the WHOLE WINDOW (a /render URL typed by hand): hands
       the window to the React install page. Framed, it never redirects — a
       shell that framed it (a snapshot, a thumbnail) meant it.

     Nothing in the file runs here, and this page must not import
     fused_render (SPEC PY-15). -->
<html data-fused-theme="shell">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fused app</title>
<style>
  :root {
    color-scheme: dark;
    --fg: #e8eaed; --fg-muted: #9aa0a6; --bg: #131417; --error: #ff6b6b; --tile: #24272d;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --fg: #1f2023; --fg-muted: #61656c; --bg: #ffffff; --error: #c62828; --tile: #eceef1;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--fg); background: var(--bg); overflow: auto;
  }
  .page { max-width: 720px; margin: 0 auto; padding: 48px 24px 96px; }
  .hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }
  /* The mark is the Marketplace's icon tile (AppIcon): a ~22.5% squircle. */
  .mark { width: 72px; height: 72px; border-radius: 16px; object-fit: contain; background: var(--tile); }
  .mark.ph { display: flex; align-items: center; justify-content: center; color: var(--fg-muted);
             font-size: 22px; font-weight: 700; letter-spacing: .01em; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -.022em; margin: 0; line-height: 1.15; }
  .meta { color: var(--fg-muted); font-size: .9em; margin: -4px 0 2px; }
  .sub { color: var(--fg-muted); font-size: .85em; }
  .error { color: var(--error); white-space: pre-wrap; }
  /* A card peek / thumbnail (`_preview=1`): the icon tile and the name, as a
     small card. */
  .preview .page { padding: 16px; }
  .preview .hero { gap: 10px; }
  .preview .mark { width: 56px; height: 56px; border-radius: 13px; }
  .preview .mark.ph { font-size: 18px; }
  .preview h1 { font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
  .preview .meta { font-size: 12px; margin: -2px 0 0; }
</style>
</head>
<body>
<div class="page" id="page"><div class="sub">Reading app file…</div></div>
<script>
  const page = document.getElementById("page");
  const FILE = fused.params.get("_file");
  const isPreview = new URLSearchParams(location.search).get("_preview") === "1";
  if (isPreview) document.body.classList.add("preview");

  const human = (n) => {
    const u = ["B", "KB", "MB", "GB"]; let i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return (i === 0 ? n : n.toFixed(1)) + " " + u[i];
  };
  const api = (q) => "/api/appfile/" + q + "?path=" + encodeURIComponent(FILE);
  // The export stamp is UTC ISO-8601 with seconds; shown as the viewer's
  // local date and time. A stamp the browser cannot parse is shown as
  // written; none is null.
  const fmtStamp = (s) => {
    if (!s || !/^\d{4}-\d{2}-\d{2}/.test(s)) return null;
    const d = new Date(s);
    if (isNaN(d.getTime())) return s;
    return d.toLocaleString(undefined, {
      year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit",
    });
  };

  function fail(msg) {
    page.innerHTML = "";
    const h = document.createElement("h1"); h.textContent = "Could not read app file";
    const pre = document.createElement("div"); pre.className = "error"; pre.textContent = msg;
    page.append(h, pre);
  }

  function placeholderMark(name) {
    const words = String(name || "").replace(/[_-]+/g, " ").split(/\s+/).filter(Boolean);
    const ini = words.length > 1 ? words[0][0] + words[1][0] : (words[0] || ".f").slice(0, 2);
    const d = document.createElement("div"); d.className = "mark ph"; d.textContent = ini.toUpperCase(); return d;
  }

  function render(t) {
    page.innerHTML = "";
    const hero = document.createElement("div"); hero.className = "hero";
    if (t.has_icon) {
      const img = document.createElement("img"); img.className = "mark"; img.alt = ""; img.src = api("icon");
      img.onerror = () => { img.replaceWith(placeholderMark(t.name)); };
      hero.appendChild(img);
    } else hero.appendChild(placeholderMark(t.name));
    const h1 = document.createElement("h1"); h1.textContent = t.name; hero.appendChild(h1);
    const meta = document.createElement("div"); meta.className = "meta";
    const bits = [t.files.length + " files", human(t.bytes)];
    if (fmtStamp(t.exported_at)) bits.push("exported " + fmtStamp(t.exported_at));
    meta.textContent = bits.join(" · ");
    hero.appendChild(meta);
    page.appendChild(hero);
  }

  // The whole window: hand it to the React install page (`embed=1`:
  // chrome-free, like the bare page this load asked for). Framed or a
  // preview, stay — the shell that framed this meant it.
  function handOffToInstallPage() {
    if (isPreview || !FILE || window.top !== window) return false;
    location.replace("/marketplace/file?path=" + encodeURIComponent(FILE) + "&embed=1");
    return true;
  }

  async function load() {
    if (!FILE) return fail("No .fused file selected.");
    if (handOffToInstallPage()) return;
    let resp, data;
    try {
      resp = await fetch(api("install") + "&light=1");
      data = await resp.json();
    } catch (e) {
      return fail("Could not read the app file: " + e);
    }
    if (!resp.ok) return fail((data && data.error) || "Not a valid .fused file.");
    render(data);
  }
  load();
</script>
</body>
</html>
