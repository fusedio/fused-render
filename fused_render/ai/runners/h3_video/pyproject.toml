# The h3_video runner's environment (SPEC §40, PY-16).
#
# The one AI runner that does not load a model into its own interpreter — H3
# runs as `antirez/h3.c`, a bundled Metal binary the app stages the same way
# it stages rclone (`build_dmg.sh`, D103's pattern; `registry.h3_bin()`
# mirrors `rcd.py::rclone_bin()`). `worker.py` here spawns that binary as a
# subprocess and speaks its stdout, so this folder's ONLY job is to supply
# what the subprocess needs and cannot bring itself: an ffmpeg executable.
#
# **Why ffmpeg has to come from THIS venv rather than the system or the app
# payload.** h3.c needs a real ffmpeg EXECUTABLE to mux the rendered frames
# and the generated audio into one mp4 — PyAV's libraries are libraries, not
# an executable on a PATH, and `-o '' --frames-dir` (writing raw frames with
# no mux step) drops the audio entirely, which is H3's headline feature.
# Bundling a whole static ffmpeg into the macOS payload was rejected (see
# SPEC's decision beside this one) in favor of a wheel that already carries a
# platform binary: `imageio-ffmpeg` ships a real, statically-linked ffmpeg
# executable per platform and exposes its path via
# `imageio_ffmpeg.get_ffmpeg_exe()`. `worker.py` points `H3_FFMPEG` at that
# path before spawning the binary, so the subprocess never has to find one on
# its own PATH (which, for a supervisor child, may not have one at all).
#
# **A single, pure-Python-plus-bundled-binary wheel — no source build, no
# compiler.** `imageio-ffmpeg` publishes a prebuilt wheel for every platform
# this app ships on; there is no sdist path this folder's `uv sync` should
# ever have to take, which is the whole of what "wheels-only" means here —
# unlike the diffusers folders, there is no separate CUDA/ROCm/CPU wheel
# index to pick between, because the ffmpeg binary inside the wheel has
# nothing to do with which accelerator this machine has.
#
# Bounded per this folder's own rule (`tests/test_ai_runtime.py::test_every_
# runner_BOUNDS_its_model_runtimes`): the floor is the version installed when
# this folder was written, the ceiling is the next major — an ffmpeg build
# swap is exactly the kind of change that wants a render behind it before it
# ships to every user's machine.
[project]
name = "fused-render-runner-h3-video"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "imageio-ffmpeg>=0.5,<1",
]

# Not a distribution — a folder of scripts, not something to build and install.
[tool.uv]
package = false
