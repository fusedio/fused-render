// What travels is what the page cannot know and this template always does: the
// FOLDER it is bound to, the words already in the box, and the conversation they
// were written in. What does NOT travel is how this chat is configured — model,
// effort, approvals — because a task runs unattended and the page owns those
// answers for its own reasons. The rule the deleted pill carried is one of them:
// "ask every time" cannot work with nobody watching (nothing polls `decide`, so
// the first tool call parks until the permission timeout denies it), and that is
// now the Schedule page's to apply rather than this row's to substitute.
//
// `new=1` is what makes the hop feel like one control rather than two: it opens
// the form immediately, so the click lands on a filled-in dialog instead of a
// page with a button to press next. Scheduled.tsx consumes the params and clears
// them (history.replaceState), so a reload of the resulting URL is just the
// Schedule page.
//
// A TOP-WINDOW write, deliberately, and it is the same standard-break the
// markdown/graph templates make for shell navigation (their `navigateShell`,
// which this mirrors): the target is a shell ROUTE, not a param on this view
// and not an fs path, and this page sets no param boundary — so fused.params
// addresses the shell's query string but has nothing to say about its path.
// pushState + "fused:navigate" is the in-app hop the React shell listens for
// (platform/lib/router.ts navigateUrl does the same two lines); the href
// assignment underneath is the fallback for a cross-origin or absent parent,
// where reading `top.location.href` throws.
const SCHEDULE_URL = "/tasks";

// Where "Back to chat" has to land. The TOP window's path when it is readable,
// this document's otherwise — the same split every other navigation in this file
// makes, for the same reason: framed by the React shell, `location` here is the
// view's own inner URL, and a Back button pointing at it would return the reader
// to a bare template outside the app they left from.
function backHere() {
  try {
    const host = window.top;
    return host.location.pathname + host.location.search;
  } catch (err) {
    return location.pathname + location.search;
  }
}

// `draft` is whatever is typed right now, and an EMPTY one is fine: the page's
// form is where the description gets written, and arriving there with a blank
// field is exactly what "+ New task" already does. Nothing is validated here —
// this navigates, it does not create.
//
// `editId` is the deep link's second errand: open the form ON an entry that
// already exists rather than on a new one. It rides the SAME `?new=1&…` link
// rather than a route of its own, because the destination is one form either way
// and the params it already consumes (target, message, session, back) are exactly
// what an edit needs too — `edit` only says which stored entry the form is
// editing, and the Tasks page is what reads it.
//
// NO CALLER IN THIS TEMPLATE passes it any more. The blocked-composer banner used
// to, as its "Edit schedule" control, and that control is gone: its row lands on
// the task where Edit lives with its full popover instead (Akshil, 2026-08-17 —
// two doors to one room, and the banner's did not unblock). The parameter stays
// because it is the deep link's shape, not this template's private argument.
function openScheduler(draft, editId) {
  // The draft SURVIVES the trip: leaving for the schedule page unloads this
  // document, and coming back rebuilt the composer empty — the message the
  // user had half-written was gone (Akshil, 2026-08-16). sessionStorage, not
  // local: a draft is a fact about this tab's errand, not about the machine.
  try { sessionStorage.setItem("fused:chatdraft:" + FILE, draft || ""); }
  catch (err) { /* storage denied — the draft just doesn't survive the trip */ }
  const url = SCHEDULE_URL + "?new=1"
    + (editId ? "&edit=" + encodeURIComponent(editId) : "")
    + "&target=" + encodeURIComponent(FILE)
    + "&message=" + encodeURIComponent(draft || "")
    // The chat this task was thought of in, so the page can offer to continue it.
    // "" on the landing page, which is correct rather than missing: there is no
    // session yet, and the store reads "" as "start a new one".
    + "&session_id=" + encodeURIComponent(fused.params.get("session_id") || "")
    + "&back=" + encodeURIComponent(backHere());
  try {
    const host = window.top;
    void host.location.href;   // throws when cross-origin
    host.history.pushState(null, "", url);
    host.dispatchEvent(new Event("fused:navigate"));
    return;
  } catch (err) { /* fall through to a real navigation */ }
  try { window.top.location.href = url; } catch (err) { location.href = url; }
}

// ── the confirm in front of it ──
//
// The button sits 34px from Send and the click LEAVES the conversation, so a
// miss is expensive in a way a mistyped pill never was. One short question, and
// a sub-line naming what rides along — the two things the icon cannot say.
//
// Modelled on .selpop's dismissal contract (outside press, Escape, window blur)
// rather than on a modal's: this is a note pinned to a button, and dimming a
// chat the reader may be about to come straight back to would be the heavier
// gesture of the two.
const schedPop = document.getElementById("schedpop");
// Which composer's button opened it — the draft comes from that composer's box,
// read at CONTINUE time and not at open time, so a paste made with the confirm
// already up still travels.
let schedPopFor = null;

function closeSchedConfirm() {
  if (!schedPopFor) return;
  schedPop.hidden = true;
  schedPopFor = null;
}

function openSchedConfirm(btn) {
  schedPopFor = btn;
  // Laid out before it is measured: the height decides which side it opens on.
  schedPop.style.left = "0px";
  schedPop.style.top = "0px";
  schedPop.hidden = false;
  const r = btn.getBoundingClientRect();
  const h = schedPop.offsetHeight;
  const w = schedPop.offsetWidth;
  // ABOVE by default, like every other popup here: the composer is pinned to the
  // bottom of the pane, so below is usually off screen. Flip down only when there
  // is no room up there, and clamp either way.
  const up = r.top - h - 6;
  const top = up >= 4 ? up : Math.min(r.bottom + 6, window.innerHeight - h - 4);
  schedPop.style.top = `${Math.max(4, top)}px`;
  // Right-aligned to the button, not left: it hangs off the last control before
  // Send, and a 260px box growing rightwards from there leaves the pane.
  schedPop.style.left = `${Math.max(4, Math.min(r.right - w, window.innerWidth - w - 4))}px`;
  document.getElementById("schedpop-go").focus({ preventScroll: true });
}

document.querySelectorAll(".schedbtn").forEach((btn) => {
  btn.addEventListener("click", () => {
    // A pending scheduled message shuts this door as well as the composer's:
    // a session that is already holding queued work takes no further input, and
    // a task is input the same way a typed reply is (see applyComposerBlockState,
    // which is what actually disables the button). Guarded here anyway, the same
    // discipline `submitChat` keeps — disabled for the eye, guarded for the hand.
    if (schedBlocked()) return;
    // A second press on the same button closes, rather than closing on the
    // document handler below and reopening here.
    const same = schedPopFor === btn;
    closeSchedConfirm();
    if (!same) openSchedConfirm(btn);
  });
});

document.getElementById("schedpop-go").addEventListener("click", () => {
  // The confirm can OUTLIVE the press that opened it: the 15s schedule poll may
  // block this chat while the question is still on screen, and this is the only
  // caller of openScheduler — so the last word on whether a task may be made from
  // here is read here, not at open time. The block also closes the confirm
  // (applyComposerBlockState), which makes this the race and not the ordinary path.
  if (schedBlocked()) return;
  // The box belonging to the composer that was clicked, not "the visible one":
  // only one composer is on screen at a time, but reading the button's own form
  // is what keeps that a fact about the layout rather than an assumption here.
  const host = schedPopFor && schedPopFor.closest("#card");
  const draft = (host ? homebox : box).value.trim();
  closeSchedConfirm();
  openScheduler(draft);
});
// The other half of the round trip: a draft stashed by openScheduler is put
// back the moment the composer exists again — into an EMPTY box only, never
// over something newer — and the stash is spent either way.
try {
  const savedDraft = sessionStorage.getItem("fused:chatdraft:" + FILE);
  if (savedDraft !== null) {
    sessionStorage.removeItem("fused:chatdraft:" + FILE);
    if (savedDraft) {
      if (box && !box.value) box.value = savedDraft;
      if (homebox && !homebox.value) homebox.value = savedDraft;
    }
  }
} catch (err) { /* storage denied — nothing to restore */ }

document.getElementById("schedpop-no").addEventListener("click", () => {
  const btn = schedPopFor;
  closeSchedConfirm();
  // Focus goes back where the reader was, not where the confirm was: the draft is
  // the thing they were in the middle of.
  focusBox(btn && btn.closest("#card") ? homebox : box);
});
document.addEventListener("pointerdown", (ev) => {
  if (schedPopFor && !schedPop.contains(ev.target) && !ev.composedPath().includes(schedPopFor)) {
    closeSchedConfirm();
  }
});
// Capture phase, and the event is CONSUMED — same discipline as .selpop's
// Escape: the document-level binding kills a live run, and dismissing a confirm
// must not also do that.
document.addEventListener("keydown", (ev) => {
  if (ev.key !== "Escape" || !schedPopFor) return;
  ev.stopPropagation();
  ev.preventDefault();
  closeSchedConfirm();
}, true);
// A click into the preview iframe never reaches this document but does blur this
// window, and with a pane on screen that is the ordinary case.
window.addEventListener("blur", closeSchedConfirm);
// Nothing repositions an open popup: a scroll or resize under it would leave it
// pointing at a button that has moved, so it goes away instead.
window.addEventListener("resize", closeSchedConfirm);

// An appearance:none select keeps the width of its WIDEST option, so a short
// value renders in a wide pill ("fable" inside a "sonnet"-wide pill) with dead
// space before the next pill — the row's gaps looked uneven. Hug the selected
// label instead: measure it off-DOM and set an explicit width. Padding,
// borders (and with them the caret gutter) come off the computed style so the
// .pill CSS stays the single source of truth for them.
const _fitCtx = document.createElement("canvas").getContext("2d");
function fitSelect(el) {
  const opt = el.selectedOptions[0];
  if (!opt) return; // value not in options — keep the last fitted width
  const s = getComputedStyle(el);
  _fitCtx.font = `${s.fontStyle} ${s.fontWeight} ${s.fontSize} ${s.fontFamily}`;
  const chrome = parseFloat(s.paddingLeft) + parseFloat(s.paddingRight) +
    parseFloat(s.borderLeftWidth) + parseFloat(s.borderRightWidth);
  el.style.width = `${Math.ceil(_fitCtx.measureText(opt.textContent).width + chrome)}px`;
}

function syncSelects() {
  document.querySelectorAll(".model-sel").forEach((el) => { el.value = curModel(); });
  document.querySelectorAll(".effort-sel").forEach((el) => { el.value = curEffort(); });
  const perm = fused.params.get("permission");
  const chosen = PERMISSION_MODES.includes(perm) ? perm : DEFAULT_PERMISSION;
  // Every mode is offered, always. The disabling that used to live here belonged
  // to a DEFERRED send ("ask every time" cannot work with nobody watching) and
  // went with the pill: this row now only ever describes a run the user is
  // sitting in front of, and the unattended case is the Schedule page's to rule
  // on — where the answer is picked for a task rather than borrowed from a chat.
  document.querySelectorAll(".perm-sel").forEach((el) => { el.value = chosen; });
  document.querySelectorAll(".model-sel, .effort-sel, .perm-sel").forEach(fitSelect);
  // A value change is a WIDTH change ("ask every time" → "Claude decides"), so the
  // row's fit is stale the moment a pill is picked. Hoisted declaration, defined
  // below with the rest of the measuring.
  fitComposerChrome();
}
document.querySelectorAll(".model-sel").forEach((el) =>
  el.addEventListener("change", () => { fused.params.set("model", el.value); syncSelects(); }));
document.querySelectorAll(".effort-sel").forEach((el) =>
  el.addEventListener("change", () => { fused.params.set("effort", el.value); syncSelects(); }));
document.querySelectorAll(".perm-sel").forEach((el) =>
  el.addEventListener("change", () => {
    fused.params.set("permission", el.value);
    syncSelects();
  }));

// ── the composer's chrome fits, shortens, or folds: measured, never a width ──
//
// WHAT WAS BROKEN. The sidebar column's floor is 380px (explorer/lib/side-width.ts
// raised it from 280 for exactly this row), and at 380 — and again at ~440, which
// is where the column actually opens — the control row did not fit: three select
// pills, the screenshot and calendar buttons and Send came to more than the
// column, `flex-wrap` did the only thing it can, and the result was a stack of
// nearly-empty lines with one control on each. Akshil, 2026-08-20, looking at a
// 440px column: "I don't see the change in size. Nor do I see the change in UI to
// show or hide things." Both halves of that are the same complaint — a wider floor
// alone cannot fix a row that never says what it does when it runs out of room.
//
// THE ORDER THINGS GIVE, and it is chosen rather than emergent:
//   1. everything fits            one line, full labels — the wide layout, unchanged.
//   2. `.compact`                 approvals shortens to one word (PERMISSION_SHORT).
//                                 The other two pills are already one word, and the
//                                 menu still spells all four modes out, so this
//                                 costs a label and no vocabulary.
//   3. `.tight`                   the line gets DENSER instead of longer: 3px
//                                 gaps, trimmed pill insets, carets pulled in —
//                                 every control stays on the one line, exactly
//                                 where it sits at every other width (Akshil,
//                                 2026-08-20: the fold read as controls "not in
//                                 single line").
//   4. `.stack`                   last resort, at widths below even the dense
//                                 line: the row folds ONCE, at the spacer —
//                                 selects on one line, draft controls on the
//                                 next, flush right. Never the ragged wrap.
// Reachable in that order and no further: below ~300px (the listing preview pane
// floors at 220, see #anntools) even three pills exceed the line and the browser's
// own wrap takes over, which is the honest end of the ladder rather than a fourth
// idea.
//
// MEASURED, following annFitStrip one pane over (Akshil, 2026-08-19: a fixed
// breakpoint dropped labels while there was still room). The verdict is recomputed
// from scratch every time — classes off, ask the row what it needs, put back only
// what is warranted — so widening undoes itself with no state to get stale, and
// the probe runs inside observer callbacks (before paint) so nothing flashes.
const composerRows = [...document.querySelectorAll(".composer-row")];
const footEl = document.getElementById("footnote");

// What the row needs on ONE line, summed by hand. NOT scrollWidth: on a flex row
// it is floored at clientWidth, and this row also wraps, so an overflowing row
// quietly gets taller and reports no overflow at all — the exact failure that made
// this invisible to CSS. The spacer is skipped because it is slack and not
// content (flex-basis 0 while the row fits, the line break once it does not).
function composerRowNeed(row) {
  const cs = getComputedStyle(row);
  let need = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  let kids = 0;
  for (const c of row.children) {
    if (c.classList.contains("spacer") || !c.offsetWidth) continue;  // hidden child, no seat
    need += c.offsetWidth;
    kids += 1;
  }
  if (kids > 1) need += (parseFloat(cs.columnGap) || 0) * (kids - 1);
  return need;
}

// Stage 2, and it is a DOM write rather than a class doing the work: what shortens
// is the selected option's text, which is the only thing an appearance:none select
// paints. Every option is rewritten, not just the selected one, so the pill is
// right whichever mode is picked next — `dataset.full` (fillSelect) is what keeps
// the MENU spelling the sentences out either way. fitSelect after, because the
// pill's width is explicitly fitted to its label and a shortened label inside the
// old box would leave exactly the dead space fitSelect exists to remove.
function setRowCompact(row, on) {
  row.classList.toggle("compact", on);
  for (const sel of row.querySelectorAll(".perm-sel")) {
    for (const o of sel.options) {
      o.textContent = on ? (PERMISSION_SHORT[o.value] || o.dataset.full) : o.dataset.full;
    }
    fitSelect(sel);
    permPopupGuard(sel, row);
  }
}

// The one reader of the OPTIONS the rewrite above cannot fool: the NATIVE
// popup. Pointer opens the custom menu, which spells everything out from
// `dataset.full` — but keyboard (Space, Enter, the arrows) opens the select's
// own list, and that list paints the options' live textContent, so a compact
// row offered `ask / edits / decides` as the actual choices (bugbot, #685).
// The full spellings are restored on the keydown that is about to open the
// popup — synchronously, before the default action — and the short forms come
// back on change/blur, the two ways a popup ends. fitSelect is deliberately
// NOT re-run: the pill's box keeps its fitted width, so nothing in the row
// moves; the longer selected text can clip inside that box only while the
// popup is open, which is exactly when nobody is looking at the pill.
// mousedown is guarded too, for any path where the custom menu does not
// intercept the pointer.
function permPopupGuard(sel, row) {
  if (sel.dataset.popguard) return;
  sel.dataset.popguard = "1";
  const full = () => {
    for (const o of sel.options) o.textContent = o.dataset.full;
  };
  const short = () => {
    if (!row.classList.contains("compact")) return;
    for (const o of sel.options) o.textContent = PERMISSION_SHORT[o.value] || o.dataset.full;
  };
  sel.addEventListener("keydown", (e) => {
    if (e.key === " " || e.key === "Enter" || e.key === "ArrowDown" || e.key === "ArrowUp") full();
  });
  sel.addEventListener("mousedown", full);
  sel.addEventListener("change", short);
  sel.addEventListener("blur", short);
}

function fitComposerRow(row) {
  const box = row.clientWidth;
  if (!box) return;   // the other view's composer: no box, nothing to decide yet
  const refit = () => {
    for (const sel of row.querySelectorAll(".model-sel, .effort-sel, .perm-sel")) fitSelect(sel);
  };
  row.classList.remove("stack");
  const wasTight = row.classList.contains("tight");
  row.classList.remove("tight");
  setRowCompact(row, false);
  // setRowCompact refits only the approvals pill; leaving .tight refits ALL the
  // selects, whose fitted widths baked the tight paddings in.
  if (wasTight) refit();
  if (composerRowNeed(row) > box) {
    setRowCompact(row, true);
    if (composerRowNeed(row) > box) {
      row.classList.add("tight");
      refit();
      if (composerRowNeed(row) > box) row.classList.add("stack");
    }
  }
  // Line two's right-hand anchor, decided here because the stylesheet cannot name
  // it: the first control after the spacer is Send when there is no pane (the
  // screenshot button is [hidden] then, and in the narrow layout), and the
  // screenshot button whenever there is one. Cleared on every pass — an anchor
  // left on a control that has since been hidden pins the wrong thing.
  let lead = null;
  if (row.classList.contains("stack")) {
    let past = false;
    for (const c of row.children) {
      if (c.classList.contains("spacer")) { past = true; continue; }
      if (past && c.offsetWidth) { lead = c; break; }
    }
  }
  for (const c of row.children) c.classList.toggle("lead2", c === lead);
}

// The footnote's own verdict: two lines is its budget, and the second sentence is
// what pays when the pair will not fit (see #footnote.tight for why that sentence
// and not an ellipsis). Measured in LINES rather than at a width, because the
// sentence's length is the other variable — it names the target's kind, so the
// same column fits it for a file and not for a long folder name.
function fitFootnote() {
  footEl.classList.remove("tight");
  if (!footEl.offsetWidth) return;   // hidden (the landing page has no footnote)
  const cs = getComputedStyle(footEl);
  const lh = parseFloat(cs.lineHeight);
  const text = footEl.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if (lh > 0 && text > lh * 2 + 1) footEl.classList.add("tight");
}

// The second sentence, put back after setTargetNoun's write clears the node. The
// text lives HERE and in the markup and nowhere else — the markup ships it so the
// first paint is already measurable, this rebuilds it for every later noun.
function footnoteTail() {
  const more = document.createElement("span");
  more.className = "fn-more";
  more.textContent = " Approvals control what runs without asking.";
  footEl.appendChild(more);
  fitFootnote();
}

// The landing page's title, same posture as the row above it: it keeps its full
// 26px until the NAME it is showing collides with the column, and then it takes
// exactly the size that fits on one line. What the screenshot showed at 440px was
// a folder name set as a two-line 26px headline — the loudest thing on a page
// whose subject is the composer under it.
//
// Not a formula on the column's width, which would have to guess at the name: the
// name is MEASURED — off-DOM, through fitSelect's canvas, which is the one way
// this file prices a single line of text. NOT scrollWidth with a nowrap probe,
// which is what this reached for first: scrollWidth reads clientWidth back on a
// block that has no scroller (the trap annFitStrip documents one pane over), and
// it silently left a 31-character folder name at 26px over two lines. Canvas
// ignores `letter-spacing`, so the number comes out a hair WIDE on a negatively
// tracked headline — an error in the direction of shrinking one step early, which
// is the harmless direction.
//
// The steps are the STYLESHEET's (.t-mid / .t-min); this only picks the largest
// one the name fits on, and picks none at all when the full 26px fits. Ratios,
// not a re-measure per step: text width scales with font-size, so one canvas pass
// prices all three candidates.
const HOME_TITLE_STEPS = [[26, ""], [21, "t-mid"], [17, "t-min"]];
const homeTitleEl = document.querySelector(".home-title");
function fitHomeTitle() {
  if (!homeTitleEl.offsetWidth) return;   // landing page not on screen
  const box = homeTitleEl.clientWidth;
  if (!box) return;
  // Measured at the BASE size, with any step class off, so the reading is the
  // same one whatever the last verdict was.
  homeTitleEl.classList.remove("t-mid", "t-min");
  const s = getComputedStyle(homeTitleEl);
  _fitCtx.font = `${s.fontStyle} ${s.fontWeight} ${s.fontSize} ${s.fontFamily}`;
  // The spark is part of the title's own text, so the one thing the text width
  // misses is the margin holding it off the name.
  const spark = homeTitleEl.querySelector(".spark");
  const need = _fitCtx.measureText(homeTitleEl.textContent).width +
    (spark ? parseFloat(getComputedStyle(spark).marginRight) || 0 : 0);
  const base = parseFloat(s.fontSize) || HOME_TITLE_STEPS[0][0];
  for (const [px, cls] of HOME_TITLE_STEPS) {
    if (need * px / base <= box) {
      if (cls) homeTitleEl.classList.add(cls);
      return;
    }
  }
  // Nothing fits on one line: the smallest step, wrapping. A heading over two
  // short lines at 17px is a heading; the same name at 26px was a billboard.
  homeTitleEl.classList.add("t-min");
}

function fitComposerChrome() {
  for (const row of composerRows) fitComposerRow(row);
  fitHomeTitle();
  fitFootnote();
}

// ONE ResizeObserver, and it watches the COLUMN rather than the rows. Deliberate:
// what these verdicts write (a class on the row, a class on the footnote, option
// text) changes the composer's HEIGHT, so an observer on the row would be
// re-triggered by its own answer — settling, since the verdict is recomputed from
// scratch, but only after a round of "ResizeObserver loop" noise in the console.
// The column's box is the actual input to all of this and nothing here can move it.
new ResizeObserver(fitComposerChrome).observe(chatEl);
{
  // Two content changes the box observer cannot see, both of them CLASS flips a
  // long way from this row: `#chat.home` swaps which composer is on screen (the
  // one that was hidden has no measurable box until it is shown), and the narrow
  // layout's `body.view-*` hides the screenshot button, which is a seat leaving
  // the row while the column stands still.
  const mo = new MutationObserver(fitComposerChrome);
  for (const el of [document.body, chatEl]) {
    mo.observe(el, { attributes: true, attributeFilter: ["class"] });
  }
  // And the seat coming and going on its own account: shotBtns() are hidden
  // whenever there is no pane to photograph. Attributes only, filtered to
  // `hidden` — this function writes `class` down here, and observing what it
  // writes is how an observer starts scheduling itself.
  for (const row of composerRows) {
    mo.observe(row, { subtree: true, attributes: true, attributeFilter: ["hidden"] });
  }
  // And the title's own CONTENT, because what it has to fit is the name: boot
  // writes it long after this runs (#home-file), and a target with a longer name
  // is a new collision at the same width. Content only — no `attributes` — for
  // the reason the rows above are watched the same way: the step this decides is
  // a CLASS on this very node, and an observer watching what it writes schedules
  // itself forever.
  mo.observe(homeTitleEl, { subtree: true, childList: true, characterData: true });
}
// The pills' first paint, and with it the row's first verdict (syncSelects ends in
// fitComposerChrome). It runs HERE, after the measuring is defined, and not up with
// the change listeners: `composerRows` is a const, so a boot-time syncSelects above
// this block would reach it before it exists.
syncSelects();

// ── The pills' dropdown: our own menu over a real <select> ──
//
// The <select> stays the state holder — it owns `.value`, it fires `change`, and
// fillSelect / syncSelects / fitSelect above keep working on it untouched. What
// is replaced is only the PLATFORM POPUP, by cancelling the pointerdown that
// would open it: the OS menu is the one surface in this composer the template
// cannot skin (a light, rounded macOS menu in the middle of a dark row), and
// every other approach — a <div> listbox like #leftmodepop, a hidden input —
// would have meant re-implementing the four things the select already does.
// Cancelling pointerdown also keeps the value where every existing caller looks
// for it, so a selection here is indistinguishable from a native one.
//
// KEYBOARD is deliberately still the select's: a focused pill moves through its
// values on the arrows and fires `change` for each, with no menu involved, and
// Space still gets the platform popup. This menu is the POINTER path only, which
// is why the cancelled pointerdown does not hand focus over either — a focus
// ring appearing on a click nobody made with the keyboard is its own wart.
let selPop = null;   // the one popup, built on first open and reused
let selPopFor = null; // the select it currently belongs to; null = closed

function closeSelPop() {
  if (!selPopFor) return;
  selPop.hidden = true;
  selPopFor = null;
}

function openSelPop(sel) {
  if (!selPop) {
    selPop = document.createElement("div");
    selPop.className = "selpop";
    selPop.hidden = true;
    // On <body>, not beside the pill: a fixed box inside the composer's own
    // stacking/clipping context is not reliably above the log, and one popup
    // shared by all six pills cannot live inside any one of them.
    document.body.appendChild(selPop);
  }
  selPopFor = sel;
  selPop.replaceChildren();
  selPop.setAttribute("aria-label", sel.getAttribute("aria-label") || "");
  // The optgroup label is the list's NAME (see fillSelect), so it is a heading
  // and never a row: the pill shows the current value and nothing else, and
  // without this the menu is three bare words with no subject.
  const group = sel.querySelector("optgroup");
  if (group && group.label) {
    const head = document.createElement("div");
    head.className = "selpop-head";
    head.textContent = group.label;
    selPop.appendChild(head);
  }
  for (const opt of sel.options) {
    const row = document.createElement("button");
    row.type = "button";
    row.className = "selpop-opt" + (opt.value === sel.value ? " on" : "");
    const lbl = document.createElement("span");
    // `dataset.full` and not `textContent`: the pill's own label may be the
    // shortened one (fitComposerRow), and this menu is where the full sentence
    // has to be — it is the only place the four approvals modes are spelled out.
    lbl.textContent = opt.dataset.full || opt.textContent;
    row.appendChild(lbl);
    // Write the value, then let the select's own `change` listeners do the rest
    // (param write, syncSelects, width refit) — this menu knows nothing about
    // what a model or an approvals mode means. Fired even when the value is
    // unchanged: picking the value detection guessed is how the user PINS it,
    // which is the param write, not a no-op.
    row.onclick = () => {
      closeSelPop();
      sel.value = opt.value;
      sel.dispatchEvent(new Event("change"));
    };
    selPop.appendChild(row);
  }
  // Floor the menu to the pill it hangs off (the shell's mode menu does the
  // same); content may push it wider. Measured only once it is laid out, since
  // the height decides which side it opens on.
  const r = sel.getBoundingClientRect();
  selPop.style.minWidth = `${Math.round(r.width)}px`;
  selPop.style.left = "0px";
  selPop.style.top = "0px";
  selPop.hidden = false;
  const h = selPop.offsetHeight;
  const w = selPop.offsetWidth;
  // ABOVE by default: the composer is pinned to the bottom of the pane, so below
  // is usually off-screen. Flip down only when there is no room up there, and
  // clamp either way.
  const up = r.top - h - 6;
  const top = up >= 4 ? up : Math.min(r.bottom + 6, window.innerHeight - h - 4);
  selPop.style.top = `${Math.max(4, top)}px`;
  selPop.style.left = `${Math.max(4, Math.min(r.left, window.innerWidth - w - 4))}px`;
}

document.querySelectorAll(".model-sel, .effort-sel, .perm-sel").forEach((el) => {
  el.addEventListener("pointerdown", (ev) => {
    ev.preventDefault();  // kills the native popup AND the focus it would take
    // A second press on the same pill closes, rather than closing on the
    // document handler below and reopening here.
    const same = selPopFor === el;
    closeSelPop();
    if (!same) openSelPop(el);
  });
  // Belt and braces: on engines where the popup is a MOUSEDOWN default action and
  // a cancelled pointerdown does not suppress the compatibility event, this is
  // what stops the platform menu.
  el.addEventListener("mousedown", (ev) => ev.preventDefault());
});
// Outside press, Escape, and window blur — the last one because a click landing
// in the preview iframe never reaches this document but does blur this window,
// and with a pane on screen that is the ordinary case, not the exotic one.
document.addEventListener("pointerdown", (ev) => {
  if (selPopFor && !selPop.contains(ev.target) && ev.target !== selPopFor) closeSelPop();
});
// Capture phase, and the event is CONSUMED when it closes a menu: the
// document-level Escape binding kills a live run (and annotate has its own
// exit), and dismissing a dropdown must not also do either. Same discipline
// as the annotate composer's stopPropagation on its Escape.
document.addEventListener("keydown", (ev) => {
  if (ev.key !== "Escape" || !selPopFor) return;
  ev.stopPropagation();
  ev.preventDefault();
  closeSelPop();
}, true);
window.addEventListener("blur", closeSelPop);
// Nothing repositions an open menu: a scroll or resize under it would leave it
// pointing at a pill that has moved, so it goes away instead.
window.addEventListener("resize", closeSelPop);

// Detection is async and best-effort: the selects show the fallback until it
// lands, then snap to the real config — unless a pane param already pinned a
// choice, which curModel/curEffort rank higher. Values are validated against
// the selector's own lists so a config this build doesn't know stays fallback.
fused.runPython(AGENT, { action: "defaults", file: FILE }, { key: null }).then((d) => {
  if (d && d.model && MODELS.includes(d.model)) detectedModel = d.model;
  if (d && d.effort && EFFORTS.includes(d.effort)) detectedEffort = d.effort;
  if (detectedModel || detectedEffort) syncSelects();
}).catch(() => {});

// The default-model preference, on the same best-effort footing as detection:
// it lands whenever it lands, and syncSelects() re-reads curModel() so
// whichever of the two arrives second simply re-renders the same ranking.
// Validated against MODELS for the same reason detection is — a name this
// build's selector doesn't have can't be shown as selected.
fetch("/api/prefs").then((r) => r.json()).then((p) => {
  const m = p && p.model && p.model.default;
  if (m && MODELS.includes(m)) { prefModel = m; syncSelects(); }
}).catch(() => {});

// The split param changes on drag too — applySplit on every change is cheap
// and idempotent. The other two view-state params ride the same handler:
// `leftmode` (which view the left pane frames) and `paneview` (which of the two
// views the narrow layout shows) are each written by their control and applied
// only here, so a click, a reload with the param already set, and any later
// change all take one path. Both appliers no-op when nothing moved — applyLeftMode
// compares against the mode actually framed, so it cannot reload the iframe just
// because `split` changed.
fused.params.onChange(() => { applySplit(); applyLeftMode(); applyNarrowView(); renderAnn(); });

// ── the name in the header ──────────────────────────────────────────────────
//
// A session IS a task, 1:1 (tasks_store), and the name that task answers to
// everywhere else in this app — the List row, the calendar chip, the composer
// block a few hundred lines below — is TASK-nnn. This corner used to print the
// first eight characters of the session uuid, which names the same object in a
// vocabulary nothing else on screen speaks: a reader could not carry `a3f91c0d`
// to the Tasks page, and could not quote it to anyone, because no other surface
// prints it. TASK-023 is a DESIGNED identifier — allocated once, never reused —
// and it is what the header shows now.
//
// The numbers are allocated per project by tasks_store and only /api/tasks
// hands them out, so this is a fetch. Cached per session id and never
// refetched for one: a number does not change once allocated, so a poll would
// buy nothing. The hash paints first and stays up until the number lands,
// which also makes the answer to a slow listing "the old label", not a gap.
//
// FAILS OPEN to the hash, like everything else that reads this listing: an
// unreadable /api/tasks, or a session so new the listing has not seen it yet,
// costs the better name and never the cell. Nothing is cached on that path, so
// the next showSession tries again.
const taskIds = new Map();
let taskIdBusy = "";

function showSession() {
  const id = fused.params.get("session_id");
  sessionEl.textContent = (id && taskIds.get(id)) || (id ? id.slice(0, 8) : "");
  // The full session id stays reachable for the reader who actually wants it
  // (a log line, a bug report) without spending header width on it.
  sessionEl.title = id || "";
  if (id) loadTaskId(id);
}

async function loadTaskId(id) {
  if (taskIds.has(id) || taskIdBusy === id) return;
  taskIdBusy = id;
  try {
    const res = await fetch("/api/tasks");
    if (!res.ok) throw new Error(String(res.status));
    const data = await res.json();
    const task = ((data && data.tasks) || []).find((t) => t && t.key === id);
    const num = task && task.task_id ? String(task.task_id) : "";
    if (!num) return;
    taskIds.set(id, num);
    // The session may have changed while this was in flight; showSession reads
    // the CURRENT one, so a stale answer paints nothing.
    showSession();
  } catch (err) {
    /* the hash stands */
  } finally {
    if (taskIdBusy === id) taskIdBusy = "";
  }
}
showSession();

// ── following the tail ──────────────────────────────────────────────────────
// Whether the transcript follows new output is READER STATE, and it now lives in
// one flag. It used to be re-derived from geometry (`nearBottom()`) at every
// write site, including inside the typer's rAF — which made the stream fight the
// reader: a scroll up of less than 60px was answered, in that same frame, by a
// write of scrollTop back to the bottom, and a programmatic scrollTop write also
// kills the gesture's inertia. Escaping meant clearing 60px inside one frame, so
// whether "scroll up" worked at all came down to how hard the reader flicked —
// the reported symptom, and the reason it was never reproducible on demand.
//
// Geometry was wrong in the other direction too: anything that SHRANK the
// viewport mid-run (the artifact strip appearing, the composer growing as the
// reader types) widens the gap past 60 on its own, so the follow stopped for
// good with the reader parked short of the bottom and new text arriving
// off-screen. A flag survives a resize; a threshold does not.
let followTail = true;
const scrollBottom = () => { logwrap.scrollTop = logwrap.scrollHeight; };
const nearBottom = () => logwrap.scrollHeight - logwrap.scrollTop - logwrap.clientHeight < 60;
// What STREAMING output uses. Everything the reader did not ask for goes through
// here, so it can never yank someone who has scrolled away to read. The reader's
// own actions (sending a message, opening a chat) still call scrollBottom.
const followBottom = () => { if (followTail) scrollBottom(); };
// A wheel/trackpad flick upward is an unambiguous "let me read", so it drops the
// follow with NO distance threshold — that is what makes it impossible for the
// next frame's write to out-race the gesture.
logwrap.addEventListener("wheel", (e) => { if (e.deltaY < 0) followTail = false; }, { passive: true });
// A finger dragging DOWN scrolls the content up, which is the same "let me read"
// as a wheel flick and gets the same threshold-free answer. Tracked across
// touchmove events rather than read off the scrollport, because asking geometry
// here (`followTail = nearBottom()`) reintroduced exactly the race this file
// removes: a 20px drag stays inside the 60px window, so the touch RE-ARMED the
// follow it was trying to break and the next frame scrolled the reader back.
let touchY = null;
logwrap.addEventListener("touchstart", (e) => {
  touchY = e.touches[0] ? e.touches[0].clientY : null;
}, { passive: true });
logwrap.addEventListener("touchmove", (e) => {
  const y = e.touches[0] ? e.touches[0].clientY : null;
  if (y !== null && touchY !== null && y > touchY + 2) followTail = false;
  touchY = y;
}, { passive: true });
// Everything else that moves the scrollport — scrollbar drag, keyboard, a
// scrollIntoView, our own writes — arrives as a scroll event. `lastTop`/
// `lastHeight` are here to tell a reader moving UP apart from the browser
// CLAMPING scrollTop because content got shorter (the typer clamps `shown` back
// when authoritative text is shorter, chips resolve to smaller images, the
// working line is removed at run end). A clamp is not a gesture, and reading it
// as one was the other way the follow died mid-turn.
let lastTop = 0, lastHeight = 0;
logwrap.addEventListener("scroll", () => {
  const top = logwrap.scrollTop, h = logwrap.scrollHeight;
  if (h >= lastHeight && top < lastTop - 1) followTail = false;
  else if (nearBottom()) followTail = true;
  lastTop = top; lastHeight = h;
}, { passive: true });

// ── scroll to one message (?msg=<transcript record uuid>) ──────────────────
//
// The Tasks list links a MESSAGE, not just a session. Its rows carry the uuid of
// the transcript record the server read that prompt out of, and the link is
//
//     /explorer/view/<path>?_side=claude&session_id=<id>&msg=<uuid>
//
// so the click both opens the right conversation and says which turn in it the
// reader was pointing at (spec §7 — that click is also what marks the message
// read, which the list does on its own side). Read through `fused.params`, not
// `location.search`: this page sets no `_fusedParamBoundary`, so its params live
// on the SHELL's url, which is where the list wrote this one. `chat_only` is the
// counter-example a few hundred lines up and the distinction is the same one —
// that param describes the iframe, this one describes the navigation.
//
// EVERYTHING here degrades to silence, deliberately. No param, a uuid from some
// other transcript, a uuid whose record this page does not render (a slash
// command, an app-state-only send), a transcript that fails to restore at all —
// each ends with the chat exactly as it would have been without the param,
// because landing at the bottom of the right conversation is a far better
// failure than a chat that throws on a stale link.
const MESSAGE_ANCHOR = fused.params.get("msg") || "";

// Long enough to be seen after the scroll settles, short enough that it is
// plainly a flare and not a mode. Matches the anchor-flare keyframes.
const ANCHOR_FLARE_MS = 1600;

// WHY THERE IS NO OBSERVER HERE, because "wait for the turn to appear" is the
// obvious shape for this and it is the wrong one.
//
// Only ONE caller ever renders an anchorable turn: `loadHistory`, which is the
// only `addUser` call site that passes a uuid — every other one (a live send,
// `resumeRun`'s three repair branches) is a turn this frame is making up as it
// goes, with no transcript record behind it and therefore no id an anchor could
// ever match. And `loadHistory` renders its whole transcript in a single
// synchronous loop before it yields, so there is no moment at which the turn
// exists but has not been looked for: the call at the end of that loop sees
// every turn there will be. A MutationObserver watching #log would fire only on
// appends that can never match, and the page already pins itself to exactly one
// observer (annObserveTarget, which watches the PREVIEWED APP's document, not
// this one — so it could not be reused for this either).
//
// What genuinely does arrive late is LAYOUT, not turns: a restored transcript's
// pictures load through /api/fs/raw after their turn is on screen, and every one
// of them above the anchor pushes it off centre. That is the real "scrolled to
// the wrong place" failure, and `settleAnchor` below is what answers it.

// Spent on the first turn it matches, and held as state rather than re-read from
// the url each time: a later session switch renders a DIFFERENT transcript, and
// re-firing an anchor there would flare whichever turn happened to collide.
let anchorPending = MESSAGE_ANCHOR;

/** The rendered turn carrying this uuid, or null. Compared as a string against
 * what the render wrote rather than built into a selector — a uuid off a url is
 * untrusted input, and `[data-msg="..."]` with a quote in it throws. */
function anchoredTurn() {
  if (!anchorPending) return null;
  for (const el of log.querySelectorAll(".turn[data-msg]"))
    if (el.dataset.msg === anchorPending) return el;
  return null;
}

function scrollToAnchor(el, still) {
  try {
    el.scrollIntoView({ behavior: still ? "auto" : "smooth", block: "center" });
  } catch (e) {
    el.scrollIntoView();  // an engine that takes no options object
  }
}

/**
 * Hold the anchored turn in view while the transcript finishes settling.
 *
 * A restored turn's pictures are `<img>` elements pointed at /api/fs/raw, and
 * they have no intrinsic height until they load. Every one that lands ABOVE the
 * anchor grows the document under it, which slides the turn we just centred off
 * the screen — so the link that worked in a text-only chat quietly lands in the
 * wrong place in one with screenshots, which is most of them.
 *
 * Re-centres at a few decaying points rather than continuously, and only when
 * the turn has actually drifted OUT of view: a turn that is merely off-centre
 * has already done its job, and re-scrolling it would be the page tugging at a
 * reader who has started reading. Any deliberate scroll cancels the rest
 * outright — once the reader has taken the wheel, nothing here may take it back.
 */
const ANCHOR_SETTLE_MS = [120, 400, 1000];

function settleAnchor(el, still) {
  const timers = [];
  const stop = () => {
    for (const t of timers) clearTimeout(t);
    timers.length = 0;
    for (const ev of ["wheel", "touchstart", "pointerdown", "keydown"])
      logwrap.removeEventListener(ev, stop);
  };
  for (const ev of ["wheel", "touchstart", "pointerdown", "keydown"])
    logwrap.addEventListener(ev, stop, { passive: true });
  for (const delay of ANCHOR_SETTLE_MS) {
    timers.push(setTimeout(() => {
      if (!el.isConnected) return stop();
      // Out of the scroller's box, not merely off its centre.
      const box = logwrap.getBoundingClientRect();
      const seen = el.getBoundingClientRect();
      if (seen.bottom <= box.top || seen.top >= box.bottom) scrollToAnchor(el, still);
      if (delay === ANCHOR_SETTLE_MS[ANCHOR_SETTLE_MS.length - 1]) stop();
    }, delay));
  }
}

/** Land on the anchored turn if it is on screen. True when it did, so callers
 * can fall back to their own scroll when it did not. */
function revealAnchor() {
  const el = anchoredTurn();
  if (!el) return false;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  scrollToAnchor(el, still);
  settleAnchor(el, still);
  el.classList.add("is-anchored");
  setTimeout(() => el.classList.remove("is-anchored"), ANCHOR_FLARE_MS);
  return true;
}

/**
 * One attempt at the anchor, after which it is spent whether it landed or not.
 *
 * THE GIVE-UP CONDITION, and it is a state change rather than a deadline
 * because nothing here is waiting on a clock: `loadHistory` is the only caller
 * that can render an anchorable turn (see above), and by the time it calls this
 * the whole transcript is on screen. So one attempt is every attempt there will
 * ever be — the anchor names a turn in the conversation the link opened, and if
 * it is not in THIS transcript it is not anywhere.
 *
 * Disarming on the miss is the part that matters. Left armed, a uuid that
 * matched nothing here would sit waiting for the next `loadHistory` and flare
 * whichever turn of a DIFFERENT conversation happened to carry that id — a
 * stale link quietly pointing at the wrong message in the wrong chat, which is
 * a worse failure than the link doing nothing at all.
 */
function consumeAnchor() {
  const landed = revealAnchor();
  if (anchorPending) {
    anchorPending = "";
    // Spent, so it comes OFF the url — `null`, not `""`. Absent is the spelling
    // for "no anchor" (there is no such message as the empty one), and
    // `set(k, "")` writes `k=`: the reader lands on their message, and the
    // address bar they then copy from carries a dangling `&msg=` that means
    // nothing to the page receiving it. `{default: ""}` cannot reach this — it
    // only drops a write that would have changed nothing, and here the param is
    // genuinely present, which is the one case it does not cover.
    //
    // `replace`, because arriving on the message is not a place anyone
    // navigated to twice, and a Back that re-fired the flare would be a history
    // entry nobody made. Left behind it would also re-scroll a reload the
    // reader has since scrolled away from.
    fused.params.set("msg", null, { history: "replace" });
  }
  return landed;
}

// Back to chats: the landing is both "start a new chat" and "open a past one".
// Clear the session param so a reload lands on the landing page,
// wipe the visible transcript, and rebuild the session list.
document.getElementById("back").onclick = () => {
  // Live even mid-turn (Akshil, 2026-08-19 — "when it is working I can't
  // click back"). The old `if (sending) return` guarded against orphaning the
  // streaming run's UI, but the architecture already survives leaving: the
  // run id rides in `?run=`, the subprocess keeps going, and resumeRun
  // re-attaches from the session list. Bumping the log generation is what
  // actually retires the streaming loop — it bails on the next poll instead
  // of writing into the wiped transcript below.
  logGen += 1;
  // Whether this leave abandons a LIVE turn, read before the lines below erase
  // the evidence: `activeRun` is a streaming loop, `sending` is a turn still in
  // its start, and the `run` param is a resumed run this frame may not have
  // polled yet. `loadRecent` below needs to know — see the retries beside it.
  const leftLive = !!(activeRun || sending || fused.params.get("run"));
  // The landing must not inherit the turn's chrome (Bugbot, PR #653): with
  // activeRun still set, the home composer wore the Stop square and its
  // submit CANCELLED the run this button deliberately leaves running. The
  // loop's own finally repeats this cleanup harmlessly when it bails.
  activeRun = null;
  activeWorking = null;
  setRunningUi(false);
  // Parked follow-ups belong to the conversation being left. Their
  // sessionStorage mirror keeps them for the session's next open — persistQueue
  // is deliberately NOT called (the params below are about to be cleared, and
  // persisting an empty list under the leaving session's key would erase the
  // mirror this is counting on). The bubbles are removed here by hand: #queue
  // is a SIBLING of #log, so the transcript wipe below never touches them, and
  // a bubble that outlived its entry reappeared on the next enterChat,
  // detached from everything (Bugbot, PR #653).
  for (const q of queuedMsgs) q.el.remove();
  queuedMsgs.length = 0;
  // The abandoned turn's sendMessage/resumeRun still holds `sending` until its
  // loop bails (one poll away) — long enough for the landing composer's submit
  // to hit `if (sending) return` and drop the click (Bugbot, PR #653). The
  // landing is a new life for the flag, so it releases HERE; the old loop's
  // cleanup is ownership-guarded, so its late finally cannot strip a run this
  // page starts in the meantime.
  sending = false;
  // `{default: ""}`, because this button is live on a chat that has no session
  // yet — "New chat" enters the chat view and `session_id` is not written until
  // the first turn's poll answers. Clearing an already-absent param is a
  // semantic no-op that is NOT a textual one (`set(k, "")` appends `k=`), so it
  // changed the URL, and the first param write on a pristine entry is the one
  // that buys a `pushState` (D8/PR-3): leaving an empty new chat minted a
  // history entry for a landing the page had already navigated to imperatively,
  // and the Back that undid it did nothing visible. Neither of these two is a
  // true default worth stamping — a session id is an identifier and `run` is
  // in-flight bookkeeping — so absent stays the spelling for "none".
  fused.params.set("session_id", "", { default: "" });
  // `run` additionally takes `{history: "replace"}` where `session_id` does not:
  // a run id is in-flight bookkeeping, never a place anyone navigated to, so
  // clearing a REAL one (this button is live on a resumed mid-run session) must
  // not buy the entry — it would leave a Back that restores a dead run id.
  fused.params.set("run", "", { history: "replace", default: "" });
  showSession();
  log.innerHTML = "";
  permCards.clear();  // the cards went with the log; don't keep handles to them
  notedSkills.clear();  // and the skill rows; a rebuilt log re-announces them
  resetCardPolicy();  // ...and the collapse overrides: that transcript is gone
  chatEl.classList.add("home");
  document.getElementById("recentlist").innerHTML = "";
  // Deliberately NOT awaited in sequence with the mount below: these are two
  // independent reads and neither should hold the other's section blank. What
  // makes that safe is that `loadRecent` repaints the run headings itself once it
  // has names — see the tail of that function — rather than this call site being
  // ordered so it happens to win.
  // The two counts are deliberately NOT reset here, unlike the log above: both
  // reads are about to run again and land within a few hundred ms, and clearing
  // them first would take the tab bar off screen and put it back for the trip —
  // a stale count for a moment is quieter than a section that blinks. Boot is
  // the only place the "not read yet" state is real.
  loadRecent();
  // A chat left MID-TURN may not be in that list yet (Akshil, 2026-08-19 — "the
  // chat doesn't show in recent chats until the run completes"): the list is
  // the transcripts in the cwd's project dir (agent.py `_sessions`), and a
  // brand-new session's transcript appears only once the CLI has written its
  // first rows — seconds after this read, on a leave this quick. Not a poll
  // loop: two more looks a few seconds apart cover the write, and after that
  // the list is what it honestly is. Gated on still being ON the landing —
  // re-entering a chat makes the repaint someone else's business — and
  // loadRecent's own skeleton guard keeps these from blinking rows that are
  // already up.
  if (leftLive) {
    for (const wait of [2500, 6000]) {
      setTimeout(() => {
        if (chatEl.classList.contains("home")) loadRecent();
      }, wait);
    }
  }
  // The chips belonged to the conversation being left; the section below the
  // composer is the cross-session view and is re-read from the index instead.
  clearArtStrip();
  loadArtifacts();
  // The snapshots panel belongs to the LANDING page, so it is offered on every
  // path onto it — not just the boot with no session. A page opened straight
  // into a resumed chat (`?session_id=`) never ran the boot's landing branch, so
  // without this the panel could never appear for the rest of that page's life —
  // and that is also the one path on which this mount is the FIRST snapshots read
  // of the page's life rather than a cached repaint.
  mountSnapshots();
  focusBox(homebox);
};

function enterChat() {
  chatEl.classList.remove("home");
  // The strip belongs to ONE conversation. Chips from the previous chat are
  // hidden on the home screen but still in the map — a new chat must not
  // inherit them (nor a late poll's leftovers).
  clearArtStrip();
  focusBox(box);
}

// ── more options (⋮): hand the session to a real terminal ──────────────
// One menu item that copies a paste-ready shell command: `claude --resume
// <id>` from the target's workdir when a session is on the URL, a fresh
// `claude` from the same ground when there isn't. The command comes from
// agent.py (action "terminal_command") because only it knows the workdir
// rule, the plugin dir and the copy-on-resume transcript move — the page
// just puts the string on the clipboard.
const kebabBtn = document.getElementById("kebabbtn");
const kebabPop = document.getElementById("kebabpop");
const terminalOpt = document.getElementById("terminalopt");
function kebabClose() {
  kebabPop.hidden = true;
  kebabBtn.setAttribute("aria-expanded", "false");
}
function kebabOpen() {
  // Named at open time: the session param changes without a reload (back
  // button, first turn of a new chat), so a label written once would lie.
  terminalOpt.textContent = fused.params.get("session_id")
    ? "Continue in terminal" : "New session in terminal";
  terminalOpt.disabled = false;
  kebabPop.hidden = false;
  kebabBtn.setAttribute("aria-expanded", "true");
  // preventScroll, and it is load-bearing: the popup hangs BELOW the strip,
  // and in the narrow Preview view the strip is all of #chat — a plain focus
  // asks the browser to bring the item into #chat's 43px box, which cannot
  // hold it, so #chat scrolled to its limit and took every strip control off
  // screen: an open menu floating under an empty white row.
  terminalOpt.focus({ preventScroll: true });
}
kebabBtn.addEventListener("click", () => {
  if (kebabPop.hidden) kebabOpen(); else kebabClose();
});
// Same dismissal contract as the view picker: outside click or Escape. The
// frame's own mousedown can't bubble here, but entering the frame means
// leaving the menu, and the pane sits outside this subtree, so the document
// listener covers it.
document.addEventListener("mousedown", (e) => {
  if (!kebabPop.hidden && !e.composedPath().includes(document.getElementById("kebab"))) {
    kebabClose();
  }
});
kebabPop.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { e.stopPropagation(); kebabClose(); kebabBtn.focus(); }
});
terminalOpt.addEventListener("click", async () => {
  const label = terminalOpt.textContent;
  terminalOpt.disabled = true;
  try {
    const out = await fused.runPython(AGENT, {
      action: "terminal_command",
      file: FILE,
      session_id: fused.params.get("session_id") || "",
    }, { key: null });
    if (out.error) throw new Error(out.error);
    await navigator.clipboard.writeText(out.command);
    // The copied state shows INSIDE the item, then the menu goes away on its
    // own: the click's whole job was the clipboard, there is nothing further
    // to do in an open menu.
    terminalOpt.textContent = "Copied — paste in your terminal";
    setTimeout(() => { kebabClose(); terminalOpt.textContent = label; }, 900);
  } catch (err) {
    terminalOpt.disabled = false;
    terminalOpt.textContent = "Copy failed — " + (err && err.message || err);
    setTimeout(() => { terminalOpt.textContent = label; }, 2500);
  }
});

// ── log rendering ──
// `uuid` — the transcript record this turn was restored from, when the caller
// knows it (only `loadHistory` does; a turn typed in this frame has no record
// yet). It is what a `?msg=` link addresses, so it goes on the element BEFORE
// the append: the anchor watcher fires on that append, and a turn whose id
// lands a tick later is a turn the watcher looks straight past.
function addUser(text, uuid) {
  const d = document.createElement("div");
  d.className = "turn user";
  if (uuid) d.dataset.msg = uuid;
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  d.appendChild(b);
  log.appendChild(d);
  // Sending is the reader asking for the tail again: it re-arms the follow that
  // scrolling up turned off, so the answer to what they just asked streams in
  // front of them without their having to chase it back down.
  followTail = true;
  scrollBottom();
}

function addAssistant(text) {
  const d = document.createElement("div");
  d.className = "turn assistant";
  const dot = document.createElement("span");
  dot.className = "dot";
  dot.textContent = "✻";
  const body = document.createElement("span");
  body.className = "body";
  body.textContent = text;
  d.append(dot, body);
  log.appendChild(d);
  followBottom();
  return d;
}

// One FINISHED assistant turn, from whatever the payload carries: its
// `segments` when it has them — the authoritative transcript, tool chips and
// all — and its flat `text` otherwise (an error path, or a transcript recorded
// before segments existed). Never both: the text segments join back to exactly
// that string, so rendering both would print the reply twice.
//
// Four callers — history restore, the two re-attach repair branches, and the
// poll loop's typer-less tail — all rendering a turn nobody is streaming, which
// is why there is no typer here and why every segment renders statically.
// Callers run attachCodeCopy themselves (history does one pass over the whole
// log, the others one per turn). This is the ONLY function outside makeTyper,
// buildTextView, buildThinkingView and buildPlanCard that may put renderMd
// output into an innerHTML; a test enumerates that list (D246).
function addAssistantTurn(text, segments) {
  const turn = addAssistant("");
  const segs = Array.isArray(segments) ? segments : [];
  if (segs.length) renderSegments(turn.lastChild, segs, {});
  else turn.lastChild.innerHTML = renderMd(text || "");
  return turn;
}

// WHEN THE FAILURE IS CLAUDE ITSELF (SPEC §42). This is the surface a user
// reaches for when they want to use Claude, so "claude CLI not found" landing
// here as a red line is the exact complaint the trouble card exists to answer:
// it names a CLI in our vocabulary and leaves the reader with nowhere to go.
//
// TWIN of frontend/src/platform/lib/trouble.ts, and duplicated ON PURPOSE: this
// page is served standalone and shares no module with the shell. The strings
// that must match are pinned by tests/test_trouble_parity.py, so the two cannot
// drift quietly — which is the only honest way to keep a copy.
const TROUBLE_ABOUT_CLAUDE = /claude/i;
const TROUBLE_NAMED = [
  ["login", /please run \/login|invalid api key/i],
  ["limit", /usage limit|session limit/i],
  ["notfound", /claude code isn'?t installed|claude cli not found|claude not found/i],
];
const TROUBLE_SHAPES = [
  ["login", /not (?:signed|logged) in|oauth|authenticat/i],
  ["limit", /rate.?limit|quota/i],
  ["notfound", /couldn'?t be found|command not found|enoent|no such file/i],
];
const TROUBLE_SAID = {
  notfound: ["The app can't find Claude Code",
    "Fused Render uses Claude Code on this computer to build and fix things, " +
    "and it could not find it. Either it was never installed, or it is " +
    "somewhere the app cannot see."],
  login: ["Claude Code isn't signed in",
    "Claude Code is installed but not signed in to your account yet, so " +
    "nothing can run. Signing in happens in a terminal, once."],
  limit: ["Your Claude usage limit was reached",
    "Nothing is broken — your plan includes a set amount of use and it is " +
    "spent for now. The message below says when it resets."],
};
const CLAUDE_INSTALL_COMMAND = "curl -fsSL https://claude.ai/install.sh | bash";

function troubleKind(text) {
  const t = String(text || "");
  for (const [kind, re] of TROUBLE_NAMED) if (re.test(t)) return kind;
  if (TROUBLE_ABOUT_CLAUDE.test(t)) {
    for (const [kind, re] of TROUBLE_SHAPES) if (re.test(t)) return kind;
  }
  return "raw";
}

// A brief for an AGENT, as opposed to troubleReport's description for a person.
// Twin of troubleInstructions in lib/trouble.ts — see the parity test.
const TROUBLE_STEPS = {
  notfound: [
    "Check whether the CLI exists and where: `which claude`, and look in ~/.local/bin and /opt/homebrew/bin.",
    "If it is missing, install it: `curl -fsSL https://claude.ai/install.sh | bash`.",
    "If it exists but the app cannot see it, the app's PATH is the problem — a GUI app on macOS does not inherit a shell's PATH. Say which shell profile sets it and what the app would need instead.",
    "Confirm with `claude --version`, then tell me to quit Fused Render and reopen it.",
  ],
  login: [
    "Confirm the CLI runs: `claude --version`.",
    "Sign in: run `claude`, then `/login`, and complete it in the browser.",
    "Confirm the session works, then tell me to retry in Fused Render.",
  ],
  limit: [
    "Confirm this is a plan limit rather than a fault — the message should say when it resets.",
    "Tell me when it resets and whether anything else is worth doing in the meantime.",
    "Do not change any configuration for this: nothing is broken.",
  ],
  raw: [
    "Work out what this error is actually about before changing anything.",
    "If the app's own server is what failed (a fetch error, a 5xx, a refused connection), check whether fused-render is still running and read the log named above before assuming the app itself is broken.",
    "If it names a path, check whether that path exists and is writable.",
    "Tell me the smallest change that would fix it, and what to check afterwards.",
  ],
};

// Twin of FIND_INSTALL_COMMANDS / USER_DATA_DIR / LOG_LIST_COMMAND in
// lib/trouble.ts. This page never knows where the app is installed — it is a
// template rendered inside it — so the brief always has to say how to find it.
const TROUBLE_FIND_INSTALL = [
  "ls -d /Applications/FusedRender.app ~/Applications/FusedRender.app",
  "ls -d /Applications/FusedRender.app/Contents/Resources/lib/python3.*/fused_render   # the code a fix edits",
  "brew list --cask fused-render   # if this answers, Homebrew manages that copy",
  'dir "%LOCALAPPDATA%\\Programs\\FusedRenderPy"   # Windows',
];
const TROUBLE_USER_DATA_DIR = "~/.fused-render";
const TROUBLE_LOG_LIST = 'ls -t "${TMPDIR:-/tmp}"/fused-render-*.log | head -3';

function troubleWhereToLook() {
  const lines = ["Where to look on this machine:",
    "- I do not know where the app is installed, and little else here is",
    "  actionable without it. Find it first, and say which command answered:"];
  TROUBLE_FIND_INSTALL.forEach((cmd) => lines.push("    " + cmd));
  lines.push(
    "- Settings, the template registry and the staged core templates: " + TROUBLE_USER_DATA_DIR,
    "  (a different place from the installation — a reinstall does not touch it)",
    "- This session's log: " + TROUBLE_LOG_LIST,
    "");
  return lines;
}

function troubleInstructions(what, error) {
  const kind = troubleKind(error);
  const lines = [
    "I am using Fused Render (a local file explorer / app builder) and something",
    "around it is broken. Please diagnose and fix it on this machine.",
    "",
    "What the app was doing: " + what,
    "",
    "The exact error it reported:",
    String(error || "(no message)").trim(),
    "",
  ];
  if (FILE) lines.push("Chat target: " + FILE, "");
  lines.push.apply(lines, troubleWhereToLook());
  lines.push("Please:");
  TROUBLE_STEPS[kind].forEach((step, i) => lines.push((i + 1) + ". " + step));
  lines.push("",
    "Explain what you find in plain language before you change anything, and tell",
    "me what to check in the app once you are done.");
  return lines.join("\n");
}

function troubleReport(what, error) {
  const lines = ["Fused Render — problem report", "",
                 "What the app was doing: " + what, "",
                 "Error:", String(error || "(no message)").trim(), ""];
  if (FILE) lines.push("Chat target: " + FILE);
  lines.push("Page: " + location.pathname + location.search, "");
  lines.push("Help: https://render.fused.io/#troubleshooting-" + troubleKind(error));
  return lines.join("\n");
}

function copyButton(text, label) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "trouble-btn";
  b.textContent = label;
  b.onclick = async () => {
    try { await navigator.clipboard.writeText(text); } catch { return; }
    b.textContent = "Copied";
    setTimeout(() => { b.textContent = label; }, 2000);
  };
  return b;
}

// The rich card, for the three failures a user can actually do something about.
function troubleCard(kind, text) {
  const [title, explain] = TROUBLE_SAID[kind];
  const d = document.createElement("div");
  d.className = "turn trouble";

  const h = document.createElement("div");
  h.className = "trouble-title";
  h.textContent = title;
  const p = document.createElement("p");
  p.className = "trouble-explain";
  p.textContent = explain;
  // VERBATIM. Rewording it makes it unsearchable, and searching it is the first
  // thing anyone does.
  const pre = document.createElement("pre");
  pre.className = "trouble-error";
  pre.textContent = String(text || "").trim();
  d.append(h, p, pre);

  if (kind === "notfound") {
    const cmd = document.createElement("div");
    cmd.className = "trouble-cmd";
    const code = document.createElement("code");
    code.textContent = CLAUDE_INSTALL_COMMAND;
    cmd.append(code, copyButton(CLAUDE_INSTALL_COMMAND, "Copy"));
    const hint = document.createElement("p");
    hint.className = "trouble-explain";
    hint.textContent = "Run it in a terminal, then quit Fused Render and open it again.";
    d.append(cmd, hint);
  }

  const acts = document.createElement("div");
  acts.className = "trouble-actions";
  const doing = "using the chat on " + (FILE || "this folder");
  acts.append(copyButton(troubleReport(doing, text), "Copy the details"));
  acts.append(copyButton(troubleInstructions(doing, text), "Copy Claude Code instructions"));
  const a = document.createElement("a");
  a.className = "trouble-btn";
  a.href = "https://render.fused.io/#troubleshooting-" + kind;
  a.target = "_blank";
  a.rel = "noreferrer";
  a.textContent = "How to fix this \u2197";
  acts.append(a);
  d.append(acts);
  return d;
}

function addError(text) {
  const kind = troubleKind(text);
  // `raw` keeps the plain red row: it is a real answer for "some other error",
  // and dressing every failed turn as a troubleshooting card would bury the
  // ones a user can act on.
  const d = kind === "raw" ? (() => {
    const el = document.createElement("div");
    el.className = "turn error";
    el.textContent = text;
    return el;
  })() : troubleCard(kind, text);
  log.appendChild(d);
  scrollBottom();
}

// A one-line note for something that happened beside the conversation: the agent
// reading the app state on its own (◍), or the user ending a turn (⏹). Not a
// card — there is nothing to decide. `working`, when given, keeps the note above
// the still-running status line.
function addNote(text, working, glyph) {
  const d = document.createElement("div");
  d.className = "turn note";
  const eye = document.createElement("span");
  eye.className = "eye";
  eye.textContent = glyph || "◍";
  const body = document.createElement("span");
  body.textContent = text;
  d.append(eye, body);
  if (working && working.el && working.el.isConnected) log.insertBefore(d, working.el);
  else log.appendChild(d);
  followBottom();
}

// ── permission cards ──────────────────────────────────────────
// Headless claude cannot open a terminal prompt, so agent.py points its
// --permission-prompt-tool at an MCP server that parks each request on disk;
// poll hands them here and these buttons write the answer back. Until one is
// clicked the subprocess is genuinely blocked — the card IS the prompt.
const permCards = new Map();  // request id -> card handle, cleared with the log

// Tools where "allow all of these for the rest of the reply" is a
// proportionate offer. Everything else — Bash, web tools, Task, unknown/MCP —
// gets Allow/Deny only (see the claude template for the full rationale).
const WHOLE_TOOL_GRANTABLE = new Set([
  "Edit", "Write", "Read", "Glob", "Grep", "NotebookEdit",
]);

// Modes a card may switch the RUNNING session to. Mirrors SWITCHABLE_MODES in
// agent.py (which drops anything else before it is latched) and in
// permission_server.py (which re-validates before the CLI is told); a test holds
// all four copies together. Read here by the plan card, which sends the picker's
// current mode as the one the session should LAND in once the plan is approved —
// so it has to know which of them the bridge will actually honour, and
// `bypassPermissions` is absent from this list for the same reason it is absent
// from the picker.
const SWITCHABLE_MODES = new Set(["acceptEdits", "auto"]);

// The two tools whose cards are not approvals — see buildQuestionCard (an answer,
// not a verdict) and buildPlanCard (a plan to approve or send back). Both mirror
// agent.py's constants, which are where the special handling is enforced.
const PLAN_TOOL = "ExitPlanMode";
const ANSWERABLE_TOOL = "AskUserQuestion";

// Mirrors agent.py's NOTE_LIMIT — set as the note textarea's `maxLength`, so an
// honest user typing a note never reaches the server-side cut at all; a test
// holds the two numbers together (D146).
const PLAN_NOTE_LIMIT = 2000;

// An Edit's `old_string`/`new_string` as one `-`/`+` marked block — the shape a
// diff is read in. TWO call sites and therefore its own function: the approval
// card (below) asks "shall I make this change", the transcript's Edit chip says
// "this change was made", and the two showing the same edit differently would
// be a bug that only ever surfaces as confusion. Non-strings are JSON-encoded
// rather than coerced, same rule as `str` in summarizePermission: a stray
// object must read as its contents, never as "[object Object]".
function formatEditDiff(input) {
  const inp = input && typeof input === "object" ? input : {};
  const str = (v) => (typeof v === "string" ? v : v === undefined || v === null ? "" : JSON.stringify(v));
  const mark = (v, ch) => str(v).split("\n").map((line) => ch + " " + line).join("\n");
  return mark(inp.old_string, "-") + "\n" + mark(inp.new_string, "+");
}

// A tool's name as a HUMAN reads it. An MCP tool arrives on the wire as
// `mcp__<server>__<tool>` — three underscores of protocol in a row whose useful
// half is the last segment, and in a narrow column the prefix is what gets the
// space while the verb is what gets clipped. Rendered "<server>: <tool>", with
// the tool half's underscores back to spaces. Everything else is returned
// untouched: the CLI's own tools are already the names the user knows.
//
// TWO call sites (the transcript's chip and the approval card) on purpose: the
// same call named two different things on one screen is a bug that only ever
// shows up as confusion. The RAW wire name is never LOST at either site — it
// rides along as the element's `title`, because the wire name is what an Allow
// actually authorises, and both cards still print the whole input verbatim.
function prettyToolName(name) {
  const raw = String(name === undefined || name === null ? "" : name);
  const m = /^mcp__(.+?)__(.+)$/.exec(raw);
  if (!m) return raw;
  return m[1].replace(/_+/g, " ") + ": " + m[2].replace(/_+/g, " ");
}

// What the user is actually being asked to allow. Every field goes in through
// textContent — tool input is model-authored text, never parsed as markup.
// NOTHING here truncates: an Allow hands the tool its input verbatim, so a
// card that rendered only a prefix would ask the user to approve bytes they
// never saw. `covered` is derived from what was actually RENDERED (non-empty),
// and buildPermCard dumps whatever is left over, so no key can be invisible.
function summarizePermission(tool, input) {
  const inp = input && typeof input === "object" ? input : {};
  const str = (v) => (typeof v === "string" ? v : v === undefined || v === null ? "" : JSON.stringify(v));

  const used = [];
  const show = (k) => {
    const v = str(inp[k]);
    if (v) used.push(k);
    return v;
  };
  const pick = (...keys) => {           // an alternation: record only the winner
    for (const k of keys) if (inp[k]) { used.push(k); return str(inp[k]); }
    return "";
  };
  const out = (sub, body) => ({ sub, body, covered: used });

  switch (tool) {
    case "Bash":
      return out(show("description"), show("command"));
    case "Edit": {
      const path = show("file_path");
      show("replace_all");  // rendered as the annotation below, so it is covered
      // Marked as covered here, rendered by formatEditDiff — which reads the
      // raw input, so `show`'s only job on these two is the bookkeeping that
      // keeps them out of the leftover dump.
      show("old_string");
      show("new_string");
      return out(path + (inp.replace_all ? "  (every occurrence)" : ""),
                 formatEditDiff(inp));
    }
    case "Write":
      return out(show("file_path"), show("content"));
    case "NotebookEdit":
      return out(show("notebook_path"), show("new_source"));
    case "Read":
      return out(pick("file_path", "path"), "");
    case "Glob":
    case "Grep": {
      const where = show("path");
      const glob = show("glob");
      return out([where, glob ? "in " + glob : ""].filter(Boolean).join("  "),
                 show("pattern"));
    }
    case "WebFetch":
    case "WebSearch":
      return out(pick("url", "query"), show("prompt"));
  }
  // Unknown tool: the whole object is the body, so every key is covered.
  const keys = Object.keys(inp);
  used.push(...keys);
  return out("", keys.length ? JSON.stringify(inp, null, 2) : "");
}

// Whatever summarizePermission did not render — shown verbatim, never dropped.
// Object.fromEntries, not `{}` + assignment: res.json() DEFINES an own
// `__proto__` key; assignment would silently lose it while updatedInput still
// authorises it.
function leftoverInput(input, covered) {
  const seen = covered || [];
  const rest = Object.keys(input || {}).filter((k) => seen.indexOf(k) < 0);
  return rest.length ? Object.fromEntries(rest.map((k) => [k, input[k]])) : null;
}

// The buttons a card offers. `liveMode` is the mode the run is ACTUALLY in, as
// reported by poll — never the picker's `permission` param (the picker applies
// to the next spawn).
function permChoices(tool, label, liveMode) {
  const choices = [["Allow", "allow", "once", "", "primary"]];
  if (WHOLE_TOOL_GRANTABLE.has(tool)) {
    choices.push(["Allow all " + label + " in this reply", "allow", "session", "", ""]);
  }
  // Never on an ordinary card while the run is still PLANNING: this button's
  // whole job is to loosen a strict mode via `setMode`, and doing that from a
  // side-door tool card would leave plan mode through a door that is not the
  // plan card itself — the one place that is actually supposed to decide it.
  // (Whether an ordinary card can even appear mid-plan is the CLI's call, not
  // verified here — see PLAN_TOOL's comment; this guard holds either way.)
  if ((liveMode || DEFAULT_PERMISSION) !== "auto" && liveMode !== "plan") {
    choices.push(["Allow, and let Claude decide from here", "allow", "once", "auto", ""]);
  }
  choices.push(["Deny", "deny", "once", "", ""]);
  return choices;
}

function buildPermCard(p, run_id, liveMode) {
  // A question is not a permission: there is nothing to allow, only something to
  // answer. A plan is a third thing again — one to approve or send back. Same
  // handle ({el, resolve}) for all three, so syncPermissions cannot tell them
  // apart — the difference is entirely in what the card can send.
  if (p.tool === ANSWERABLE_TOOL) return buildQuestionCard(p, run_id);
  if (p.tool === PLAN_TOOL) return buildPlanCard(p, run_id);
  const toolName = p.tool || "a tool";
  // The DISPLAY name is humanized (see prettyToolName); the wire name stays on
  // the element as its title, and the payload below is untouched either way.
  const pretty = prettyToolName(toolName);
  const label = pretty.length > 28 ? pretty.slice(0, 27) + "…" : pretty;

  const el = document.createElement("div");
  el.className = "turn perm";
  const head = document.createElement("div");
  head.className = "perm-head";
  const tool = document.createElement("span");
  tool.className = "tool";
  tool.textContent = pretty;
  if (pretty !== toolName) tool.setAttribute("title", toolName);
  head.append("Claude wants to use ", tool);
  el.appendChild(head);
