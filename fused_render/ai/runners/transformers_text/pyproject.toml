# The transformers text runner's environment — the CPU variant (SPEC §40, PY-16).
#
# The cross-platform half of text generation. `mlx_text` is Metal-only, so on a
# Windows or Linux machine the app's flagship local capability was something to
# read about rather than use — the same complaint AI-10 makes about transcription
# and answers with CTranslate2. This answers it with torch, which is the one
# runtime that publishes wheels for every platform this app ships on.
#
# **This is one of THREE folders that install the same runner.** `torch` is the
# only line that differs between them: here it comes from
# `download.pytorch.org/whl/cpu`, in `transformers_text_cuda/` from PyPI (whose
# torch IS the CUDA build), in `transformers_text_rocm/` from
# `download.pytorch.org/whl/rocm7.1`. The code they run is `runners/torch_text.py`
# — one file, shared, because a token loop does not know what it is multiplying on.
#
# **Why three folders and not one manifest with a switch.** `_env_install_worker`
# runs a BARE `uv sync --no-default-groups --python <exe>` with cwd set to the
# runner folder, and that is deliberate (PY-18): a user never types a uv command,
# so there is no place to pass `--index` or `--extra` from. Everything about an
# environment must be expressible in the `pyproject.toml` beside it — which makes
# "three ways to install torch" mean literally three folders, each a whole
# declaration, each with its own venv key. The Engines tab is where the user picks.
#
# **CPU is the DEFAULT, and that is the change this folder carries.** Before the
# split, torch came from PyPI for everyone: a Linux machine got the CUDA build and
# paid several GB of `nvidia-*` wheels whether or not it owned a card, while a
# Windows machine got the 122MB CPU build and could not use its card at all. Both
# halves were wrong, and neither was something the user could see, let alone
# choose. Now the default install is small and works everywhere, and a GPU is an
# opt-in that says what it costs.
#
# `whl/cpu` and not merely "PyPI minus the extras": the CPU index is where PyTorch
# publishes the `+cpu` local-version wheels that have no `nvidia-*` requirements
# at all, so this resolution is small because nothing large is in the graph —
# rather than large-but-unused. On macOS that index carries the ordinary
# `2.13.0` wheel (no local version), which is the same file PyPI ships and has MPS
# compiled in: Apple Silicon keeps its GPU here, which matters because this runner
# is the MPS fallback for a Mac whose MLX runner is unavailable (`_placement`).
#
# **`explicit = true` is the whole of the confinement.** Without it the CPU index
# becomes a candidate for EVERY requirement, and transformers, accelerate, numpy
# and the rest would be resolved from a mirror that only mirrors what PyTorch
# builds. With it the override reaches exactly the names listed under
# `[tool.uv.sources]` and nothing else — verified against a real resolution: of
# the 45 packages locked here, 42 come from PyPI and only torch comes from the
# mirror (as two entries, `2.13.0+cpu` and the darwin `2.13.0`).
#
# **Every dependency here must be installable as a WHEEL** (AI-2a), and that rule
# is what ruled out llama.cpp: `llama-cpp-python` publishes an sdist and nothing
# else on PyPI, so declaring it would put cmake and a C++ toolchain between a user
# and the Download button — on Windows, MSVC. Its prebuilt wheels live on a
# private index, which is a second thing to trust and a second thing to go down.
#
# The device this environment actually got is reported by `torch_text.load()`
# calling `worker_base.set_state(device=…)` — the field `/health` carries and the
# page draws (see `worker_base.STATE`). Which is not redundant with the variant the
# user picked: a CUDA install on a machine whose driver is too old still runs, on
# the CPU, and the only honest source for that is the process holding the weights.
#
# **The runtime lines carry CEILINGS**, for the reason
# `mflux_image/pyproject.toml` states at length: no lockfile is committed beside
# these manifests and `uv sync` runs bare, so an unbounded requirement is
# re-resolved from PyPI on every new venv key and a major bump lands on users
# with no commit behind it. `transformers` keeps its `>=4.51` floor and gains
# only `<6` — the installed version is 5.x, but raising the floor to it would
# forbid the 4.x this runner is currently happy on, which is a change to what is
# allowed TODAY rather than protection against tomorrow. The floor's job (stated
# below) is qwen3 support; the ceiling's job is the next rewrite.
#
# What each earns:
#   torch           the tensors and the device (CUDA / MPS / CPU). `<3` — the
#                   major is the whole ABI and every wheel behind it.
#   transformers    the model classes, the chat templates and TextIteratorStreamer.
#                   `>=4.51` because that is the release that knows what a
#                   `qwen3` is, and three of the four models this runner's
#                   catalog suggests are Qwen3 — an older resolution installs
#                   perfectly and then fails every one of those Downloads with
#                   `KeyError: 'qwen3'`, which reads as a broken model rather
#                   than an environment a version too old. A floor is the only
#                   place that can be said once for all of them.
#   accelerate      `device_map` and the low-memory load path for a big checkpoint
#   sentencepiece   the tokenizer format some instruct models still ship
#   protobuf        sentencepiece's model format needs it at load time
#   huggingface_hub downloads
#   psutil          answers "how much memory is this costing"
[project]
name = "fused-render-runner-transformers-text"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.13,<3",
    "transformers>=4.51,<6",
    "accelerate>=1.14,<2",
    "sentencepiece",
    "protobuf",
    "huggingface_hub",
    "psutil",
]

# Not a distribution — a folder of scripts, not something to build and install.
[tool.uv]
package = false

# The CPU wheels. `explicit` keeps this index out of every other requirement's
# candidate list — see the header.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
