<!DOCTYPE html>
<html data-fused-theme="shell">
<head>
<meta charset="utf-8" />
<title>Git</title>
<style>
  /* Appearance (SPEC §30/AP-9, D134). The dark block below IS this view's
     palette; every colour a rule uses is a token from it, because a literal is
     a colour light mode cannot repaint (tests/test_theme.py enforces both the
     opt-in on <html> and the two blocks defining the SAME token set).
     `data-theme` is written onto <html> by the injected runtime, which acts only
     because this document opted in via `data-fused-theme`. */
  :root {
    color-scheme: dark;
    --bg: #131417;
    --surface: #1b1d21;
    --surface-2: #22252b;
    --line: #2a2d33;
    --line-strong: #3a3e46;
    --line-hover: #454a53;
    --ink: #e8eaed;
    --ink-2: #9aa0a6;
    --ink-3: #868d94;
    --accent: #E5FF44;
    --accent-dim: #b8cc36;
    --on-accent: #131417;
    --grid-dot: #1e2126;
    --skel-shine: #2f333c;
    /* status letters: added / modified / deleted / renamed / untracked */
    --st-add: #7ec97e;
    --st-mod: #d9b34a;
    --st-del: #e08585;
    --st-ren: #7fb4e0;
    --st-new: #9aa0a6;
    /* diff gutter + hunk colours */
    --diff-add-bg: #16241a;
    --diff-add-fg: #a8dfa8;
    --diff-del-bg: #251618;
    --diff-del-fg: #efb0b0;
    --diff-hunk-fg: #86a7c4;
    --diff-meta-fg: #9aa0a6;
    /* empty state + truncation notice */
    --note-line: #5c4a1f;
    --note-bg: #1b1913;
    --note-fg: #e8d8ac;
    /* Anything that can LOSE WORK wears these, and only those things do — a
       discard, a stash drop, and the confirmation step in front of each. The
       point is that the colour is a promise: if it is red here, it is one of the
       three ops the module marks destructive. */
    --danger: #e08585;
    --danger-bg: #241618;
    --danger-line: #5e2f33;
    /* A mutation that landed, and one that did not. */
    --good-fg: #a8dfa8;
    --good-bg: #16241a;
    --good-line: #2c4a31;
    --bad-fg: #efb0b0;
    --bad-bg: #251618;
    --bad-line: #5e2f33;
  }
  /* The brand lime is unreadable as text on white, so light mode uses
     shell.css's same-hue deep olive — one token still serving text, focus ring
     and the selected-row edge. */
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff;
    --surface: #f4f5f7;
    --surface-2: #eceef0;
    --line: #d8dade;
    --line-strong: #c4c8ce;
    --line-hover: #b4b9c0;
    --ink: #1f2023;
    --ink-2: #61656c;
    --ink-3: #6f747c;
    --accent: #5f7300;
    --accent-dim: #4e5f00;
    --on-accent: #ffffff;
    --grid-dot: #e8eaed;
    --skel-shine: #dfe2e7;
    --st-add: #2f7d32;
    --st-mod: #8a6410;
    --st-del: #a32828;
    --st-ren: #1f5f96;
    --st-new: #61656c;
    --diff-add-bg: #e8f6e8;
    --diff-add-fg: #1f5f22;
    --diff-del-bg: #fdecec;
    --diff-del-fg: #8f2020;
    --diff-hunk-fg: #2b5f88;
    --diff-meta-fg: #61656c;
    --note-line: #e0cd94;
    --note-bg: #fdf7e6;
    --note-fg: #6b5316;
    --danger: #a32828;
    --danger-bg: #fdecec;
    --danger-line: #e6b6b6;
    --good-fg: #1f5f22;
    --good-bg: #e8f6e8;
    --good-line: #bcdcbc;
    --bad-fg: #8f2020;
    --bad-bg: #fdecec;
    --bad-line: #e6b6b6;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--bg);
    background-image: radial-gradient(circle, var(--grid-dot) 1px, transparent 1px);
    background-size: 28px 28px;
    /* The page body NEVER scrolls horizontally — wide content (diffs) scrolls
       inside its own container instead. */
    overflow-x: hidden;
  }
  #root {
    max-width: 1080px;
    margin: 0 auto;
    padding: 20px 24px 80px;
    min-width: 0;
  }
  a { color: var(--accent-dim); }

  /* ================= panes ================= */
  .cols {
    display: grid;
    grid-template-columns: minmax(0, 420px) minmax(0, 1fr);
    gap: 20px;
    margin-top: 18px;
    align-items: start;
  }
  .cols.no-diff { grid-template-columns: minmax(0, 1fr); }
  @media (max-width: 900px) {
    .cols, .cols.no-diff { grid-template-columns: minmax(0, 1fr); }
    /* Stacked, the diff goes ABOVE the lists. Otherwise clicking a commit
       appends a pane thirty rows below the fold and reads as "nothing
       happened" — the response to a click has to be where the eye already is. */
    .cols > .col:last-child:not(:first-child) { order: -1; }
    .pane { position: static; }
    .diff { max-height: 50vh; }
  }
  .col { min-width: 0; }

  section { margin: 0 0 18px; }
  section > h2 {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  section > h2 .n { color: var(--ink-2); font-weight: 400; letter-spacing: 0; }
  section > h2 .spacer { flex: 1; }
  /* An unborn/detached HEAD rides the section label rather than a header band:
     it is DATA, and normal case, letter-spacing reset because it is not a label. */
  section > h2 .state {
    color: var(--accent-dim);
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  section > h2 .sep { color: var(--ink-3); font-weight: 400; }

  /* ================= toolbar ================= */
  /* ONE line, always. A wrapped toolbar reads as two toolbars — the chip alone
     on top, the remote ops stranded underneath — and it moves the buttons
     vertically the moment a branch name grows, which is exactly the kind of
     re-arrangement clipping the name was meant to stop. So the bar never wraps;
     the squeeze is absorbed inside it instead (see `.bar > .btn` below), and
     once even that is not enough the labels drop off Fetch/Pull/Push (see the
     372px query further down, where the number is derived). */
  .bar {
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    gap: 6px;
    padding: 6px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
  }
  /* The bar holds two clusters, not one row of controls: the branch chip says
     WHERE you are, the remote group acts on it. `margin-left: auto` on the group
     is what splits them, and it sits on a real group element rather than on a
     spacer between loose buttons: grouped, the three remote ops are one
     indivisible block that stays hard right and keeps its own 6px rhythm.
     `flex: none` says the block is NOT what gives when the bar runs out of
     room — a control that shrinks toward its own icon while you read it is
     worse than a name that shortens, and these three are the width the
     breakpoint is derived from. */
  .bar .remote {
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
    flex: none;
    margin-left: auto;
  }
  /* The branch chip is the one element that absorbs a narrow pane. `0 1 auto`,
     not `1 1 auto`: it must SHRINK but never GROW, because growing would make
     it eat the bar's whole free width on a wide pane and leave a mostly-empty
     button with a 24ch name adrift at its left edge (flex-grow resolves before
     auto margins, so a growing chip would also cancel `.remote`'s `margin-left:
     auto`). Sized by its name, then squeezed. `min-width: 0` overrides the
     `min-width: auto` every flex item gets, which is the rule that otherwise
     pins the button at its content width and never lets the ellipsis inside
     engage at all; the real floor lives on `.branch-name` instead, where it can
     be stated in characters of NAME rather than in chip chrome. */
  .bar > .btn {
    flex: 0 1 auto;
    min-width: 0;
  }

  /* One button shape for every action in the view; the variants only change
     colour, never geometry, so a row of them lines up whatever they do. */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex: none;
    padding: 4px 9px;
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    background: transparent;
    color: var(--ink-2);
    font: inherit;
    font-size: 12px;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 120ms cubic-bezier(0.2, 0, 0, 1),
                border-color 120ms cubic-bezier(0.2, 0, 0, 1),
                color 120ms cubic-bezier(0.2, 0, 0, 1);
  }
  .btn:hover:not([disabled]) { color: var(--ink); border-color: var(--line-hover); background: var(--surface-2); }
  /* A press has to answer, not just a hover: the toolbar's slow ops (fetch,
     pull, push) go `busy` a beat after the click, and with nothing between the
     two the button looked like it had missed the click. */
  .btn:active:not([disabled]) { color: var(--ink); border-color: var(--line-hover); background: var(--line); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Disabled is its own resting state rather than a dimmed copy of the live
     one. `opacity: 0.45` alone read as "the same button, slightly faded", which
     is exactly the reading to avoid when the difference is whether the control
     does anything at all — Fetch/Pull/Push are dead without a remote, and every
     control is dead while an op is in flight. Muted ink, a border dropped back
     to the plain `--line`, and `not-allowed` say it in three ways at once, and
     no hover or active rule matches, so the pointer confirms it. */
  .btn[disabled] {
    color: var(--ink-3);
    border-color: var(--line);
    background: transparent;
    opacity: 0.7;
    cursor: not-allowed;
  }
  .btn[disabled] .count { background: var(--surface); color: var(--ink-3); }
  .btn.primary[disabled] { background: var(--surface-2); border-color: var(--line); color: var(--ink-3); }
  .btn.danger[disabled] { color: var(--ink-3); border-color: var(--line); }
  .btn[aria-expanded="true"] { color: var(--ink); background: var(--surface-2); border-color: var(--line-hover); }
  /* A TOGGLE that is on — today just the commit rows' "show the file as of this
     commit". Accented rather than merely darker, because the state it reports is
     not in this column at all: the pane it changed is on the other side of the
     sidebar, so the row is the only place that can say which commit is driving
     it. */
  .btn[aria-pressed="true"] { color: var(--accent); background: var(--surface-2); border-color: var(--accent-dim); }
  /* An SVG glyph in a button is a BOX, not a character: inline it would sit on
     the text baseline and ride a descender's worth high, so it is taken off the
     baseline and left to the flex centring `.btn` already declares. */
  .btn svg { display: block; flex: none; }
  /* The caret marks a control that OPENS A PANEL, so it turns with the panel —
     driven off the same `aria-expanded` the button already carries, which is
     what keeps the picture and the a11y flag from ever disagreeing. */
  .btn .caret { color: var(--ink-3); transition: transform 120ms cubic-bezier(0.2, 0, 0, 1); }
  /* A branch name has no length limit; the rest of the toolbar does. So the name
     is the one thing in the bar that is bounded at BOTH ends, in `ch` rather
     than px so both bounds track the font size and the browser's zoom instead
     of baking in one character count at one size:

       max-width: 24ch  — the CAP. Past two dozen characters a branch name is
         not being read, it is being recognised, and the leading segment does
         that; letting the chip keep growing only buys empty bar. On a pane wide
         enough for the whole name the chip simply stops here (it cannot grow —
         see `.bar > .btn`), and the extra width stays as the gap between the
         two clusters, which is where a reader expects slack to go.
       min-width: 8ch   — the FLOOR. Squeezing is what keeps the bar on one
         line, but a chip squeezed to `g…` names nothing; eight characters is
         about where a branch name stops being identifiable at a glance
         ("git-temp…" against "feat/log…"). At the floor the chip is 8ch plus
         its chrome, and it is that floor the icon-only breakpoint is derived
         from. Below the width where floor + full-text cluster fit, the labels
         go rather than the name.

     Only the TEXT clips. The caret is the "this opens a panel" affordance, and
     `.btn svg { flex: none }` above already keeps it at full size, hard against
     the right edge of the button, however short the name in front of it gets. */
  .btn .branch-name {
    min-width: 8ch;
    max-width: 24ch;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* Fetch / Pull / Push go ICON-ONLY in a narrow pane. The breakpoint is not a
     round number, it is the width at which the bar stops fitting, added up from
     the parts (12px UI font, so `ch` ≈ 6.7px):

       one button   = 18px padding + 2px border            = 20px chrome
       Fetch  20 + 14 glyph + 6 gap + ~32 text             =  72px
       Pull   20 + 14 + 6 + ~26 text + 6 gap + ~16 badge   =  88px
       Push   20 + 14 + 6 + ~27 text + 6 gap + ~16 badge   =  89px
       + two 6px gaps inside the cluster                   =  12px
       remote cluster, labelled, both counts showing       = 261px
       chip at floor: 20px chrome + 12px caret + 6px gap
                      + 8ch (~54px) of name                =  92px
       bar's own 6px padding and 1px border, both sides    =  14px
       the 6px gap between the two clusters                =   6px
       ------------------------------------------------------------
       everything fits down to                             = 373px

     so 372px and below is where it no longer does, and the labels come off:
     the cluster drops to 158px and the chip gets ~40px of name back rather
     than the ellipsis it would otherwise be reduced to. Only the LABEL hides —
     the count badge is a sibling span, untouched, because "3 commits to push"
     is the most informative thing on that button and the whole point of the
     degradation is to keep the informative parts. The glyph and the badge are
     the two survivors; `aria-label` and `title` (set in `toolbar`) carry the
     word for a screen reader and for a hover. */
  @media (max-width: 372px) {
    .bar .remote .btn-label { display: none; }
  }
  .btn[aria-expanded="true"] .caret { color: inherit; transform: rotate(180deg); }
  .btn.primary {
    border-color: var(--accent-dim);
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 700;
  }
  .btn.primary:hover:not([disabled]) { background: var(--accent-dim); color: var(--on-accent); }
  .btn.danger { color: var(--danger); border-color: var(--danger-line); }
  .btn.danger:hover:not([disabled]) { color: var(--danger); background: var(--danger-bg); border-color: var(--danger); }
  .btn .count {
    padding: 0 5px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--ink);
    font-size: 10px;
  }
  /* A tiny square button for the per-row +/-/revert affordances. Icon-only, so
     it carries its meaning in aria-label rather than in text. */
  /* A single-glyph button is centred by its BOX, not by padding. Sized as a
     square with no padding at all, so the glyph is placed by the flex centring
     `.btn` already declares (`align-items: center` + `justify-content` here)
     rather than by arithmetic that has to come out even.
     It did not: `padding: 1px 6px` with `line-height: 1.3` made a 15.6px line
     box inside a 20px button, and the leftover half-pixel landed on one side —
     measured 1px above the glyph and 2.6px below it, so every +/−/↩ in the
     lists rode visibly high. `line-height: 1` keeps the line box from carrying
     its own uneven leading into that centring. (The revert button now carries an
     SVG rather than a glyph, so it is centred as a box either way — the +/− ones
     are still text and still need this.) */
  .btn.icon {
    width: 22px;
    height: 22px;
    padding: 0;
    justify-content: center;
    font-size: 12px;
    line-height: 1;
  }

  /* ================= commit box ================= */
  .commit { margin-top: 10px; }
  .commit textarea {
    display: block;
    width: 100%;
    min-height: 62px;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    resize: vertical;
  }
  .commit textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  .commit textarea::placeholder { color: var(--ink-3); }
  .commit-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  /* The AI sparkle. Quiet by default — it is an offer, not the action this box
     is for — and it announces WORK by pulsing rather than by swapping in a
     spinner glyph, so its box never changes size mid-generation and the row
     does not reflow while text is streaming into the textarea above it. */
  .btn.ai { color: var(--ink-3); }
  .btn.ai:hover:not([disabled]) { color: var(--accent); }
  .btn.ai.working { opacity: 1; color: var(--accent); animation: ai-pulse 1.2s ease-in-out infinite; }
  @keyframes ai-pulse {
    0%, 100% { opacity: 0.45; }
    50% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn.ai.working { animation: none; }
  }

  /* ================= notices ================= */
  .note {
    margin: 0;
    padding: 9px 12px;
    border-top: 1px solid var(--note-line);
    background: var(--note-bg);
    color: var(--note-fg);
    font-size: 11px;
  }
  .warn {
    margin: 8px 0 0;
    padding: 8px 11px;
    border: 1px solid var(--note-line);
    border-radius: 8px;
    background: var(--note-bg);
    color: var(--note-fg);
    font-size: 11px;
  }
  .warn ul { margin: 4px 0 0; padding-left: 18px; }
  /* The result of the LAST mutation, good or bad. A failure is rendered here
     and never as the runtime's red traceback overlay: a git refusal is an
     ordinary answer, not a bug in this view. */
  .flash {
    margin: 0 0 10px;
    padding: 8px 11px;
    border: 1px solid var(--good-line);
    border-radius: 8px;
    background: var(--good-bg);
    color: var(--good-fg);
    font-size: 12px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .flash.bad { border-color: var(--bad-line); background: var(--bad-bg); color: var(--bad-fg); }

  /* ================= confirmation ================= */
  /* In-view and inline, never `window.confirm`: this document renders inside an
     iframe, where a native dialog is at best chrome the user cannot place and at
     worst suppressed entirely. Inline also puts the question next to the row it
     is about, which is the whole reason it is being asked. */
  .confirm {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 8px 12px;
    border-top: 1px solid var(--danger-line);
    background: var(--danger-bg);
    color: var(--danger);
    font-size: 12px;
  }
  .confirm .q { flex: 1; min-width: 12ch; }

  /* ================= dropdown panels ================= */
  .panel {
    margin-top: 8px;
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    background: var(--surface);
    overflow: hidden;
  }
  .panel-head {
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink-3);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .panel-form {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 9px 12px;
    border-top: 1px solid var(--line);
  }
  .panel-form input[type="text"] {
    flex: 1;
    min-width: 12ch;
    padding: 4px 8px;
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    background: var(--bg);
    color: var(--ink);
    font: inherit;
    font-size: 12px;
  }
  .panel-form input[type="text"]:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  .panel-form label { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); font-size: 12px; }
  .panel-form input[type="checkbox"] { accent-color: var(--accent-dim); }
  /* Inside a panel, rows are a SECTION of it and not a card of their own. The
     panel already draws the border, the radius and the background, so a nested
     `.rows` box doubled all three and stood its rows off the panel's own edges —
     the field above lined up with nothing. Stripped back to a single hairline
     rule, the panel reads as one stack: head, field, list, create row. */
  .panel > .rows {
    border: 0;
    border-top: 1px solid var(--line);
    border-radius: 0;
    background: transparent;
  }
  /* Only the branch ROWS scroll. A checkout with hundreds of local branches
     turned this dropdown into a page you had to scroll past to reach anything
     else, and the field above it is the one control that must never leave the
     screen — you reach for it precisely when the list is too long to scan. The
     panel's own chrome (the field, the create row, the truncation note) is
     therefore outside this box and stays put. */
  .panel .branch-list {
    max-height: 264px;
    overflow-y: auto;
  }
  /* The create row MAKES something; every row above it only moves between
     things that already exist. So it does not wear their neutral styling: the
     accent ink and the leading `+` are the vocabulary "+ Stage all" already uses
     for "this adds", which is why no new colour is needed to say it. It is a
     plain section of the panel like the list — one rule above it, the same left
     edge, no card of its own. */
  .panel .branch-create { border-top: 1px solid var(--line); }
  .panel .branch-create .row { color: var(--accent-dim); font-weight: 700; }
  .panel .branch-create .row:hover:not([disabled]) { background: var(--surface-2); }
  .panel .branch-create .row[disabled] {
    color: var(--ink-3);
    font-weight: 400;
    cursor: not-allowed;
  }
  /* The only tag this row ever carries is the refusal, so it is coloured as
     one — and it sits on a row that is already disabled, where a pill cannot be
     mistaken for something to click. */
  .panel .branch-create .where { border-color: var(--danger-line); color: var(--danger); }

  /* ================= rows ================= */
  .rows {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    overflow: hidden;
  }
  .line {
    display: flex;
    align-items: center;
    gap: 8px;
    border-top: 1px solid var(--line);
  }
  .line:first-child { border-top: 0; }
  .line:hover { background: var(--surface-2); }
  .line[aria-current="true"] {
    background: var(--surface-2);
    box-shadow: inset 3px 0 0 0 var(--accent);
  }
  .line .acts { display: flex; gap: 4px; flex: none; padding-right: 8px; }
  .row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex: 1;
    min-width: 0;
    padding: 7px 12px;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  div.row { cursor: default; }
  .line[aria-current="true"] .subject, .line[aria-current="true"] .path { font-weight: 700; }
  .row .sha {
    flex: none;
    color: var(--accent-dim);
    font-variant-numeric: tabular-nums;
  }
  .row .subject, .row .path {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* Two trailing columns rather than one "author · date" string: in a 420px
     list the single string truncated from the RIGHT, which ate the date — the
     one field you actually scan a log by. So the date is `flex: none` and never
     truncates, and the author is the field that gives way. */
  .row .who {
    flex: none;
    max-width: 12ch;
    color: var(--ink-3);
    font-size: 11px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row .when {
    flex: none;
    color: var(--ink-3);
    font-size: 11px;
    white-space: nowrap;
  }
  .row .code {
    flex: none;
    width: 2ch;
    white-space: pre;
    font-weight: 700;
    color: var(--st-new);
  }
  .row .code.is-A { color: var(--st-add); }
  .row .code.is-M, .row .code.is-T { color: var(--st-mod); }
  .row .code.is-D { color: var(--st-del); }
  .row .code.is-R, .row .code.is-C { color: var(--st-ren); }
  .row .where.is-moved { border-color: var(--st-ren); color: var(--st-ren); }
  .row .where {
    flex: none;
    padding: 0 6px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    color: var(--ink-3);
    font-size: 10px;
    letter-spacing: 0.04em;
  }
  .row .where.is-current { border-color: var(--accent-dim); color: var(--accent-dim); }

  .more {
    display: block;
    width: 100%;
    padding: 9px 12px;
    border: 0;
    border-top: 1px solid var(--line);
    background: transparent;
    color: var(--ink-2);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .more:hover { color: var(--ink); background: var(--surface-2); }
  .more:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .more[disabled] { color: var(--ink-3); cursor: default; background: transparent; }

  .none { padding: 12px; color: var(--ink-3); font-size: 12px; }
  .hint { color: var(--ink-3); font-size: 11px; }

  /* ================= diff pane ================= */
  .pane {
    position: sticky;
    top: 0;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    overflow: hidden;
  }
  .pane-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--surface-2);
  }
  .pane-head .title {
    flex: 1;
    min-width: 0;
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pane-head .sub { color: var(--ink-3); font-size: 11px; }
  /* The identity of whatever the pane is showing, on its own line under the
     title. It exists because the LIST no longer carries it: a commit row is a
     subject and a relative time, so the sha, the author and the exact date are
     shown here, where the reader has already chosen this commit and the fields
     can be whole rather than truncated into a 12ch column. Wraps rather than
     truncates for the same reason — this is the place that answers "which
     commit exactly?", so it must not be the place that hides half of it. */
  .pane-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    /* A tight column gap because the fields are dot-separated: 10px either side
       of a `·` is 20px of nothing between two short greys. */
    gap: 4px 6px;
    padding: 7px 12px;
    border-bottom: 1px solid var(--line);
    color: var(--ink-3);
    font-size: 11px;
  }
  .pane-meta .sha { color: var(--accent-dim); font-variant-numeric: tabular-nums; }
  .pane-meta .who { color: var(--ink-2); }

  /* The one place wide content lives: its OWN scroll container, so the page
     body never gains a horizontal scrollbar (a diff line is arbitrarily long). */
  .diff {
    margin: 0;
    padding: 0;
    max-height: 70vh;
    overflow: auto;
    font-size: 12px;
    line-height: 1.45;
    tab-size: 4;
  }
  .diff .ln {
    display: block;
    padding: 0 12px;
    white-space: pre;
    color: var(--ink);
  }
  .diff .ln.add { background: var(--diff-add-bg); color: var(--diff-add-fg); }
  .diff .ln.del { background: var(--diff-del-bg); color: var(--diff-del-fg); }
  .diff .ln.hunk { color: var(--diff-hunk-fg); }
  .diff .ln.meta { color: var(--diff-meta-fg); }

  /* ================= empty / error state ================= */
  .empty {
    margin-top: 36px;
    padding: 28px 24px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    text-align: center;
  }
  .empty .glyph { color: var(--ink-3); }
  .empty h2 { margin: 12px 0 6px; font-size: 15px; font-weight: 700; }
  .empty p { margin: 0 auto; max-width: 46ch; color: var(--ink-2); font-size: 12px; }

  /* ================= skeleton =================
     Laid out at the real thing's dimensions, so nothing jumps when data lands. */
  .skel-bar {
    border-radius: 4px;
    background: linear-gradient(90deg, var(--surface-2) 25%, var(--skel-shine) 50%, var(--surface-2) 75%);
    background-size: 200% 100%;
    animation: skel-shimmer 1.3s ease-in-out infinite;
  }
  @keyframes skel-shimmer {
    0% { background-position: 100% 0; }
    100% { background-position: -100% 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .skel-bar { animation: none; }
    .row, .more, .btn, .btn .caret { transition: none; }
  }
  .skel-h2 { height: 11px; width: 120px; margin: 0 0 10px; }
  .skel-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--line); }
  .skel-row:first-child { border-top: 0; }
  .skel-cell { height: 12px; }
  .skel-bar.skel-toolbar { height: 32px; width: 100%; border-radius: 10px; margin-bottom: 10px; }
  .skel-bar.skel-box { height: 62px; width: 100%; border-radius: 10px; margin-bottom: 18px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
<div id="root">
  <div id="skeleton">
    <div class="skel-bar skel-toolbar"></div>
    <div class="skel-bar skel-box"></div>
    <div class="cols no-diff">
      <div class="col">
        <section>
          <div class="skel-bar skel-h2"></div>
          <div class="rows">
            <div class="skel-row"><span class="skel-bar skel-cell" style="width:2ch"></span><span class="skel-bar skel-cell" style="width:44%"></span></div>
            <div class="skel-row"><span class="skel-bar skel-cell" style="width:2ch"></span><span class="skel-bar skel-cell" style="width:32%"></span></div>
          </div>
        </section>
        <section>
          <div class="skel-bar skel-h2" style="width:90px"></div>
          <div class="rows">
            <div class="skel-row"><span class="skel-bar skel-cell" style="width:7ch"></span><span class="skel-bar skel-cell" style="width:48%"></span><span class="skel-bar skel-cell" style="width:76px;margin-left:auto"></span></div>
            <div class="skel-row"><span class="skel-bar skel-cell" style="width:7ch"></span><span class="skel-bar skel-cell" style="width:36%"></span><span class="skel-bar skel-cell" style="width:76px;margin-left:auto"></span></div>
            <div class="skel-row"><span class="skel-bar skel-cell" style="width:7ch"></span><span class="skel-bar skel-cell" style="width:54%"></span><span class="skel-bar skel-cell" style="width:76px;margin-left:auto"></span></div>
          </div>
        </section>
      </div>
    </div>
  </div>
  <div id="view" hidden></div>
</div>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ------------------------------------------------------------------ state
 * This view is COMMIT MANAGEMENT: what is staged, what changed, what is
 * untracked, what is stashed, plus the toolbar's branch/remote actions, the
 * commit box — and, under them, the commits those acts PRODUCE. The working-
 * tree sections and the Commits section are the same story either side of a
 * commit, scoped to the same path, which is why they belong in one column.
 *
 * Params ARE the state (the house pattern): every piece of UI state lives in
 * the URL, so a refresh or a bookmark reproduces the exact view — including an
 * open diff pane, an open dropdown, a half-typed commit message and a pending
 * destructive confirmation.
 *
 *   pages=<n>     how many log windows are loaded (1-based; the "load more" count)
 *   panel=branch|stash   which toolbar dropdown is open
 *   msg=<text>    the commit message draft
 *   ask=<key>     the destructive action awaiting confirmation, e.g.
 *                 "discard:pkg/mod.py", "discard_all", "stash_drop:0"
 *
 * `msg` and `ask` are the two additions that are easy to argue against and
 * belong here anyway. A commit message is the most expensive thing in this view
 * to retype, so losing it to a refresh is the worst small bug it could have; and
 * a confirmation that survives a refresh cannot be bypassed by one.
 *
 * TWO PIECES OF STATE THAT ARE NOT PARAMS, and they are different things:
 *
 *   `selection`  the RIGHT-HAND PANE's subject — a commit's diff or a working-tree
 *                change's diff (see `select`).
 *   `previewed`  which commit the EXPLORER's CONTENT PANE, on the other side of
 *                this sidebar, is showing the open file as of (see `preview`).
 *
 * `selection` used to be two params, `rev=<sha>` and `wt=<relpath>`, mutually
 * exclusive because the pane has ONE subject, with the exclusion held up by a
 * convention: every writer of one cleared the other. One variable holding kind +
 * value replaces both, for two independent reasons, either of which would be
 * enough:
 *
 *   ONE SLOT, STRUCTURALLY. A variable that holds one thing cannot hold two, so
 *   "the pane cannot have two masters" stops being something four call sites have
 *   to remember and becomes something they cannot get wrong. Precedent in this
 *   same file: `branchQuery` is module-level and deliberately not a param.
 *
 *   A SHA MUST NOT REACH THE SHELL'S ADDRESS BAR. A param written here mirrors up
 *   into the explorer's URL (that is what makes `?_side=git&panel=branch` a
 *   working deep link), and up there a revision is actively harmful: a path change
 *   preserves the query verbatim, so a sha picked from THIS file's commit list
 *   would be carried onto the next file; the session sidecar PUTs the whole query
 *   string and replays it on the next bare open, so it would outlive a restart;
 *   and bookmarks store the search too. So `previewed` travels to the shell as an
 *   ancestor-window call instead (`window._fusedSelectRev`, see `hopRev`), the
 *   same idiom `_fusedFsChanged` uses, and leaves nothing behind.
 *
 * The cost, accepted: neither survives a refresh any more. That is the right trade
 * for both — they are READING surfaces, reconstructed in one click, and every
 * piece of state that is expensive to retype (`msg`) or unsafe to lose (`ask`) is
 * still a param.
 */
/* One click of "load more" widens the window by this much. It is the reader's
   own DEFAULT_LOG_LIMIT — the page grows `limit`, it does not page. */
const PAGE_SIZE = 30;
const READER = "./log.py";
const OPS = "./ops.py";

/* The ops that can lose uncommitted work. Mirrors ops.py's DESTRUCTIVE_OPS, and
 * the mirroring is the safety property: an op named here gets the inline
 * confirmation step, and one that is not gets called on the first click. */
const DESTRUCTIVE = new Set(["discard", "discard_all", "stash_drop"]);

const file = fused.params.get("_file") || "";
const skeleton = document.getElementById("skeleton");
const view = document.getElementById("view");
const live = document.getElementById("live");

/* Serial guard: concurrent runPython calls can resolve out of order, and a
 * stale overview landing after a fresh one would repaint the wrong data. Every
 * mutation bumps it too, so an in-flight overview cannot repaint OVER the fresh
 * one a mutation just asked for. */
let seq = 0;
/* The last good overview + stash list, kept so selecting a commit repaints the
 * pane without refetching the lists. */
let snapshot = null;
/* Which structural param combination the DOM currently shows. A `msg` keystroke
 * changes the URL but not the structure, so comparing this is what keeps typing
 * from tearing the textarea out from under the cursor on every character. */
let drawn = null;
/* The op currently in flight (a string key), and the result of the last one.
 * Both live in memory rather than the URL: an in-flight call cannot survive a
 * refresh, and a result that outlived its action would be a lie. */
let busy = null;
let flash = null;

/* WHAT THE RIGHT-HAND PANE IS SHOWING: `null`, or ONE of
 *   { kind: "rev", value: <full sha> }        a commit
 *   { kind: "wt",  value: <repo-relative> }   a working-tree change
 * One variable, so the pane's one-subject rule is structural rather than
 * conventional — see the state header for why this is not a param.
 */
let selection = null;
const selectedRev = () => (selection && selection.kind === "rev" ? selection.value : "");
const selectedWt = () => (selection && selection.kind === "wt" ? selection.value : "");

/* The ONE writer of `selection`. Every row, the Close button and Escape come
 * through here, which is what makes the repaint impossible to forget: a param
 * write used to trigger `draw` through `onChange`, and this does it explicitly —
 * `draw(true)`, the same path that write produced, forced past the `structural()`
 * short-circuit and repainting from the held snapshot rather than refetching the
 * lists (see `draw`).
 *
 * A no-op is dropped, so a second click on a row that is already selected cannot
 * cost a repaint (the same skip `setParams` makes for a no-op write).
 */
function select(kind, value) {
  const next = kind && value ? { kind, value } : null;
  const same = (!selection && !next)
    || (selection && next && selection.kind === next.kind
        && selection.value === next.value);
  if (same) return;
  selection = next;
  void draw(true);
}

/* ------------------------------------------------- previewing a commit's file
 *
 * A SECOND, INDEPENDENT thing, and it is worth being clear about which is which:
 *
 *   `selection`  what THIS column's right-hand pane shows — a diff.
 *   `previewed`  which commit the EXPLORER's content pane, on the other side of
 *                this sidebar, is rendering the open file as of. Read-only,
 *                resolved out of the object database on read; nothing is written
 *                to disk for it.
 *
 * They are deliberately not one piece of state. Reading a commit's diff and
 * putting that commit's version of a file in the pane next door are different
 * requests, and collapsing them would mean a click meant for one always performs
 * the other — including on surfaces where the second is not even possible.
 *
 * The sha travels through the runtime's ancestor-window hop (`_fusedSelectRev` —
 * the `_fusedFsChanged` idiom), never through a param, so it cannot reach the
 * shell's address bar, its session sidecar or a bookmark. See the state header.
 */
let previewed = null;

/* Whether there is a content pane to drive AT ALL — a CAPABILITY HANDSHAKE with
 * the host, not a guess about where this page is running.
 *
 * This template renders in two places. In the file preview's sidebar there is a
 * content pane beside it and a revision has somewhere to go. In a folder's
 * LISTING PREVIEW PANE there is no such frame, so a preview control there would
 * be a button that does nothing — the exact affordance-for-nothing the claude
 * template's annotate switch already refuses to be.
 *
 * The host answers by MARKING the frame it can drive (`data-fused-rev-target`,
 * Preview.tsx). A mark, not a position: it cannot be fooled by a layout change,
 * and it does not care how many frames the host keeps mounted. Every failure is
 * the same answer — no parent (opened directly), a cross-origin parent
 * (`parent.document` THROWS), a host that marks nothing — and that answer is
 * "no", never an error.
 *
 * POLLED, exactly as the claude template polls its own mark, and for the same
 * reason: the mark ARRIVES and DEPARTS after this page has mounted (the host's
 * mode switcher moves it, a listing removes it), and a MutationObserver held on
 * someone else's document for the life of the session is not worth the one cheap
 * read it would replace. On focus, plus a slow timer.
 */
const REV_TARGET_POLL_MS = 750;
function revMarkedFrame() {
  try {
    const host = window.parent;
    if (!host || host === window) return null;
    const el = host.document.querySelector("[data-fused-rev-target]");
    return el && el.tagName === "IFRAME" ? el : null;
  } catch (err) {
    return null;
  }
}
let canPreview = false;

/* The ONE writer of `previewed`, and the only thing that speaks to the shell.
 * Refuses while the capability is absent, so the state cannot be set by anything
 * the user cannot see the result of. */
function preview(sha) {
  const next = (canPreview && sha) ? sha : null;
  if (previewed === next) return;
  previewed = next;
  hopRev();
  void draw(true);
}

/* Guarded: a page opened outside the app's shell — or under the hosted runtime,
   which has no revision route — simply has no hop, and no pane it would drive. */
function hopRev() {
  if (typeof window._fusedSelectRev === "function") {
    window._fusedSelectRev(previewed);
  }
}

function pollRevTarget() {
  const has = !!revMarkedFrame();
  if (has === canPreview) return;
  canPreview = has;
  /* A capability that has GONE takes the preview with it: the frame that was
     showing the revision is not there any more (a mode switch, a navigation),
     so continuing to claim one would be describing a pane nobody can see. The
     hop still fires, because the shell may yet be holding the sha. */
  if (!has && previewed !== null) {
    previewed = null;
    hopRev();
  }
  /* Repaint either way: the rows gain or lose their preview control. */
  void draw(true);
}

const num = (key, fallback) => {
  const raw = parseInt(fused.params.get(key) || "", 10);
  return Number.isFinite(raw) && raw > 0 ? raw : fallback;
};
const param = (key) => fused.params.get(key) || "";

/* `fused.params` has no delete — an empty string is how a param is cleared, and
 * it leaves `key=` behind in the URL. So a no-op write is SKIPPED: clearing `ask`
 * after acting on it is the common case, and writing it when it is already clear
 * would stamp a bare `&ask=` onto every URL the view produces. It also keeps
 * `onChange` (hence `draw`) from firing for a write that changed nothing.
 *
 * `opts` is passed straight through to `fused.params.set` for the writes that
 * must not spend the visit's one history push (PR-3/D268) — see `run`. */

/* `msg` is the one key here that is NOT a step the user took. It is the commit
 * DRAFT, written on every keystroke and on every AI chunk purely so the text
 * survives a repaint or a refresh — so it always REPLACES (D271), never pushes.
 * Two things go wrong if it does not. A keystroke IS a gesture, so the first
 * character typed would spend the visit's push on an entry whose only content is
 * half a word; and because `msg` is deliberately outside `structural()`, Back
 * across that entry clears the param while `draw` short-circuits and leaves the
 * typed text on screen — the URL and the textarea then disagree until something
 * else forces a repaint. `panel`, `pages` and `ask` are real navigation and keep
 * the push. */
const DRAFT_KEYS = new Set(["msg"]);

function setParams(patch, opts) {
  for (const [key, value] of Object.entries(patch)) {
    const next = value === null ? "" : String(value);
    if ((fused.params.get(key) || "") === next) continue;
    /* Spread rather than substitute: a caller's `opts` and the draft rule must
       compose, or a future `{default: …}` would be dropped in silence for
       exactly the keys that most need it. */
    fused.params.set(key, next, DRAFT_KEYS.has(key) ? { ...opts, history: "replace" } : opts);
  }
}

const el = (tag, props, ...kids) => {
  const node = Object.assign(document.createElement(tag), props || {});
  for (const kid of kids.flat()) {
    if (kid !== null && kid !== undefined && kid !== false) node.append(kid);
  }
  return node;
};

const plural = (n, one, many) => n + " " + (n === 1 ? one : (many || one + "s"));

/* ------------------------------------------------------------------ chrome */

function icon(paths, size) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("width", size || 28);
  svg.setAttribute("height", size || 28);
  svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor");
  svg.setAttribute("stroke-width", "1.6");
  svg.setAttribute("stroke-linecap", "round");
  svg.setAttribute("stroke-linejoin", "round");
  svg.setAttribute("aria-hidden", "true");
  for (const d of paths) {
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", d);
    svg.append(p);
  }
  return svg;
}

const BRANCH_GLYPH = ["M6 6v12", "M18 9a9 9 0 0 1-9 9", "M6 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4z",
                      "M18 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4z", "M6 22a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"];

/* A counter-clockwise circular arrow — "roll this file back to where it was".
   The `↩` glyph it replaces reads as "return"/"enter" (or as a reply arrow in
   mail), which is the wrong promise for a control that destroys work; a full
   restore-history loop says "revert" without needing the tooltip. */
const REVERT_GLYPH = ["M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8", "M3 3v5h5"];

/* The toolbar's remote ops used to wear `⟳`, `↓` and `↑` as text. A glyph set at
   the label's own 12px is a small character next to a word, not an icon, and the
   arrows in particular sat on the baseline looking like punctuation. These are
   drawn at the same weight as every other icon in the view and placed as boxes,
   which is what makes them read as controls. */
const FETCH_GLYPH = ["M21 4v6h-6", "M3 20v-6h6",
                     "M18.5 9A8 8 0 0 0 6 6.3L3 9", "M5.5 15A8 8 0 0 0 18 17.7l3-2.7"];
const PULL_GLYPH = ["M12 3v12", "M7 10l5 5 5-5", "M4 20h16"];
const PUSH_GLYPH = ["M12 21V9", "M7 14l5-5 5 5", "M4 4h16"];

/* The caret that separates "this opens a panel" from "this does a thing". Only
   the panel toggles carry one; an action button with a caret would be promising
   a menu it does not have. The flip is CSS off `aria-expanded` (see `.caret`). */
const CARET_GLYPH = ["M6 9l6 6 6-6"];

/* An eye: "look at the file as it was at this commit". Deliberately NOT a
   rewind/clock/circular arrow — this control writes nothing, it only changes
   what the content pane shows, and a restore symbol sitting in a row next to
   the real mutating actions (stage, unstage, revert) reads as "reset to here".
   The lens is two mirrored curves that meet exactly at (3,12) and (21,12) so it
   closes into a lens rather than a broken pair of arcs at 14px. The same glyph
   the shell's revision badge wears (Preview.tsx RevisionPill), so the control
   and the state it produces read as one thing across the two surfaces. */
const PREVIEW_GLYPH = ["M3 12c2.4-3.6 5.4-5.4 9-5.4s6.6 1.8 9 5.4",
                       "M21 12c-2.4 3.6-5.4 5.4-9 5.4s-6.6-1.8-9-5.4",
                       "M12 9a3 3 0 1 0 0 6 3 3 0 1 0 0-6"];

function caret() {
  const svg = icon(CARET_GLYPH, 12);
  svg.setAttribute("class", "caret");
  return svg;
}

/* A button's word, wrapped so CSS can take it away. The wrapper exists purely so
   there is something to `display: none` when the toolbar goes icon-only: a bare
   text node cannot be hidden without hiding the glyph and the count with it. */
function btnLabel(text) {
  return el("span", { className: "btn-label", textContent: text });
}

function emptyState(title, message) {
  return el("div", { className: "empty" },
    el("div", { className: "glyph" }, icon(BRANCH_GLYPH, 30)),
    el("h2", { textContent: title }),
    el("p", { textContent: message }));
}

/* A button that runs an op. `key` is what `busy` holds while the call is in
 * flight, so exactly the control that was clicked is the one that disables —
 * the whole view staying live is what keeps a slow `push` from feeling like a
 * freeze. */
function action(key, label, opts) {
  const settings = opts || {};
  const btn = el("button", {
    className: "btn" + (settings.className ? " " + settings.className : ""),
    type: "button",
    disabled: busy !== null || settings.disabled === true,
    title: settings.title || "",
  }, label);
  if (settings.label) btn.setAttribute("aria-label", settings.label);
  if (settings.count !== undefined && settings.count !== null) {
    btn.append(el("span", { className: "count", textContent: String(settings.count) }));
  }
  if (settings.expanded !== undefined) {
    btn.setAttribute("aria-expanded", String(settings.expanded));
  }
  btn.addEventListener("click", (event) => {
    event.preventDefault();
    if (busy !== null) return;
    settings.onClick(key);
  });
  return btn;
}

/* A destructive action is never called from its own button: the button asks,
 * and the confirmation calls. `ask` lives in the URL so the pending question
 * survives a refresh rather than being silently dropped by one. */
function confirmable(key, label, question, opts) {
  return action(key, label, Object.assign({}, opts, {
    onClick: () => setParams({ ask: key }),
    className: ((opts && opts.className) ? opts.className + " " : "") + "danger",
    title: question,
  }));
}

function confirmBar(question, run) {
  const bar = el("div", { className: "confirm", role: "alertdialog" },
    el("span", { className: "q", textContent: question }));
  bar.append(action("confirm", "Yes, do it", {
    className: "danger", onClick: () => { setParams({ ask: null }); run(); },
  }));
  bar.append(action("cancel", "Cancel", { onClick: () => setParams({ ask: null }) }));
  return bar;
}

/* ------------------------------------------------------- repository state text
 *
 * A template renders INSIDE the shell's chrome — breadcrumb, preview header, mode
 * switcher — so it does not own a header of its own (owner ruling: "a template is
 * not the same as app, it does not require any headers"). Anything the shell
 * already says (the repo's name, the path this view is scoped to) is therefore not
 * repeated at all. The toolbar below is not a header: every item in it is a
 * CONTROL, and the branch name is on it because it is the thing you click to
 * change branches, not because it is a title.
 */

function headState(repo) {
  if (repo.detached) return "detached at " + (repo.head || "unknown commit");
  return repo.branch || "no branch";
}

/* ------------------------------------------------------------------ toolbar */

function toolbar(data) {
  const repo = data.repo;
  const panel = param("panel");
  const bar = el("div", { className: "bar" });

  /* The name is CLIPPED when it is long (`.branch-name`), so the whole of it
     has to stay reachable both ways: `label` is the accessible name, `title`
     the pointer's tooltip — the same sentence, because a mouse user reading a
     truncated chip needs exactly what a screen reader is already told. */
  const head = "Branch: " + headState(repo) + " — switch or create a branch";
  bar.append(action("panel-branch",
                    [el("span", { className: "branch-name",
                                  textContent: headState(repo) }), caret()], {
    label: head,
    title: head,
    expanded: panel === "branch",
    onClick: () => {
      /* A filter term belongs to one visit to the panel: coming back later to
         look for something else should not start inside the last search. */
      if (panel !== "branch") branchQuery = "";
      setParams({ panel: panel === "branch" ? null : "branch" });
    },
  }));

  const remote = repo.remote;
  const group = el("div", { className: "remote" });
  /* The three remote ops are ONE markup for two shapes: glyph + label + count
     wide, glyph + count narrow, with CSS hiding `.btn-label` under the
     breakpoint (see the 372px query). Deliberately not two builds chosen at a
     JS-measured width — CSS re-decides for free on every resize, a measurement
     would have to be re-taken and re-rendered, and the two would drift.
     Because the word can be absent, each carries an explicit `label`
     (`aria-label`) and a `title`: the name for a screen reader and the same
     thing for a hover. The label REPEATS the count rather than leaning on the
     badge, because setting `aria-label` at all replaces the button's contents
     as its accessible name — the badge would otherwise go unread exactly in
     the state where it is the only text left. */
  group.append(action("fetch", [icon(FETCH_GLYPH, 14), btnLabel("Fetch")], {
    label: "Fetch",
    disabled: !remote,
    title: remote ? "git fetch --prune " + remote
                  : "This repository has no remote to fetch from.",
    onClick: () => run("fetch", { op: "fetch" }),
  }));
  group.append(action("pull", [icon(PULL_GLYPH, 14), btnLabel("Pull")], {
    label: repo.behind ? "Pull " + plural(repo.behind, "commit") : "Pull",
    disabled: !remote,
    count: repo.behind || null,
    title: repo.behind
      ? plural(repo.behind, "commit") + " to pull (fast-forward only)"
      : "git pull --ff-only",
    onClick: () => run("pull", { op: "pull" }),
  }));
  /* One word for both acts, because the label is also a WIDTH: "Publish branch"
     made this button half again as wide as its neighbours and shifted the whole
     toolbar whenever a branch gained an upstream. The distinction is real —
     without one this CREATES the remote branch and records it — so it is kept
     where it costs no geometry, in the tooltip. */
  const ahead = repo.upstream ? (repo.ahead || null) : null;
  group.append(action("push", [icon(PUSH_GLYPH, 14), btnLabel("Push")], {
    label: ahead ? "Push " + plural(ahead, "commit") : "Push",
    disabled: !remote || repo.detached,
    count: ahead,
    /* Every branch of this tooltip has to start by saying PUSH: with the word
       gone from the face of the button, the tooltip is the only place a hover
       learns which of the three glyphs it is on, and "Create x on origin and
       track it" named the side effect without naming the act. */
    title: repo.detached ? "HEAD is detached — there is no branch to push."
      : repo.upstream ? "git push to " + repo.upstream
      : "git push — create " + (repo.branch || "this branch") + " on "
        + (remote || "the remote") + " and track it",
    onClick: () => run("push", { op: "push" }),
  }));
  bar.append(group);

  const wrap = el("div", null, bar);
  if (panel === "branch") wrap.append(branchPanel(data));
  return wrap;
}

/* ------------------------------------------------------------ branch panel */

/* The branch list is fetched only when the panel is open. It is the one read in
   this view that is NOT scoped to the open path — a branch is a repository
   concept, so checking one out is inherently repo-wide (GT-13), and pretending
   otherwise would be the lie. */
let branchCache = null;

/* The filter term, and the ONE piece of this view's state that is deliberately
   not in the URL. Every other control writes a param and lets `draw` repaint,
   but a param write rebuilds the panel — and an input rebuilt under a typist
   loses the focus and the caret on every keystroke. (`msg` survives in the URL
   only because `structural()` leaves it out, and a half-written commit message
   is worth persisting across a refresh; a filter term is not — it belongs to one
   visit to this panel.) Module scope rather than a local, so the term outlives
   the repaints a `run` mutation forces. */
let branchQuery = "";

/* A cheap pre-filter, NOT a validator. ops.py asks git's own `check-ref-format`
   and that stays the authority — anything this misses still comes back as a red
   flash rather than as silence. What it earns is the half-typed name: a term
   that is only a space, or one starting with `-` (which git would read as an
   option, and which ops.py refuses outright), should not sit there as a live
   button advertising a call that cannot succeed. */
const BAD_BRANCH = /^-|\s|[~^:?*[\\]|\.\.|@\{|\/\/|^\/|[/.]$|\.lock$/;

/* Focus the panel's field once it is actually in the document. The panel is
   rebuilt wholesale on every repaint, so "focus it when it opens" and "put the
   focus back after a repaint" are the same act — and the node is still detached
   when `branchPanel` returns, which is why this waits a frame and re-checks
   rather than calling `focus()` on the spot. */
function focusSoon(input) {
  requestAnimationFrame(() => {
    if (!input.isConnected || input.disabled) return;
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  });
}

function branchPanel(data) {
  const panel = el("div", { className: "panel" },
    el("div", { className: "panel-head", textContent: "Branches" }));

  if (!branchCache) {
    panel.append(el("div", { className: "none", textContent: "Reading branches…" }));
    return panel;
  }
  if (!branchCache.ok) {
    panel.append(el("div", { className: "none",
                             textContent: branchCache.message || "Could not read branches." }));
    return panel;
  }

  /* One field for both acts, which is why it says so: the thing you type to
     look for a branch is the thing you type to name a new one, and asking for
     the same string in two boxes was the panel's real awkwardness. */
  const filter = el("input", { type: "text", placeholder: "Find or create a branch…",
                               value: branchQuery, disabled: busy !== null });
  filter.setAttribute("aria-label", "Find or create a branch");
  panel.append(el("div", { className: "panel-form" }, filter));

  const rows = el("div", { className: "rows branch-list" });
  /* No `.rows`/`.line` wrapper around the create button: those exist to draw a
     list, and this is one control. Wrapped, it came out as a second bordered
     card under the first with a gutter between them. */
  const offer = el("div", { className: "branch-create" });
  panel.append(rows, offer);

  if (branchCache.truncated) {
    /* The cap is the READ's, so it bounds the filter too — a term that matches
       nothing here has not been told there is no such branch, only that there
       is none among these. Saying so is the difference between a list that is
       bounded and one that quietly lies. */
    panel.append(el("p", { className: "note", textContent:
      "Only the " + branchCache.branches.length + " most recently updated "
      + "branches are listed, and the filter searches those." }));
  }

  const branchLine = (branch) => {
    const line = el("div", { className: "line" });
    const row = el("button", {
      className: "row", type: "button",
      disabled: busy !== null || branch.current,
      title: branch.upstream ? "tracks " + branch.upstream : "no upstream",
    },
      el("span", { className: "path", textContent: branch.name }),
      branch.upstream && (branch.ahead || branch.behind)
        ? el("span", { className: "where",
                       textContent: "↑" + branch.ahead + " ↓" + branch.behind })
        : null,
      branch.current ? el("span", { className: "where is-current", textContent: "current" }) : null);
    row.addEventListener("click", () => run("checkout:" + branch.name, {
      op: "branch_checkout", name: branch.name,
    }));
    line.append(row);
    if (!branch.current) {
      /* `branch -d` and never `-D`: it refuses a branch whose commits are
         reachable from nowhere else, so it cannot lose work and needs no
         confirmation — git's own refusal IS the safety step. */
      line.append(el("div", { className: "acts" }, action("del:" + branch.name, "✕", {
        className: "icon", label: "Delete branch " + branch.name,
        title: "Delete " + branch.name + " (refused if it is not fully merged)",
        onClick: () => run("del:" + branch.name, { op: "branch_delete", name: branch.name }),
      })));
    }
    return line;
  };

  /* ONE op and one outcome: creating a branch here always lands you on it, so
     `checkout` is always true. ops.py runs that as `switch -c`, which means
     there is no window in which the branch exists and HEAD is still on the old
     one. The failure path is the ordinary one — `run` turns git's refusal into
     the flash — which is what makes it safe for the row below to offer a name
     git may well reject. */
  const create = (name) => run("create", {
    op: "branch_create", name, checkout: true,
  });

  /* "and switch" used to ride the right edge of this row as a pill, in the slot
     a button had just vacated, so it read as a second control on a row that has
     exactly one act. The tooltip says it instead. */
  const createRow = (name) => {
    const bad = BAD_BRANCH.test(name);
    const row = el("button", {
      className: "row", type: "button",
      disabled: busy !== null || bad,
      title: bad ? "git will not accept that as a branch name."
                 : "Create " + name + " from HEAD and switch to it",
    },
      el("span", { className: "path", textContent: "+ Create branch " + name }),
      bad ? el("span", { className: "where", textContent: "invalid name" }) : null);
    row.addEventListener("click", () => create(name));
    return row;
  };

  /* The create row appears on an EXACT miss, not on an empty filter result:
     typing `fix` while `fix/typo` exists still matches a row, and still means
     there is no branch called `fix` to switch to. */
  const missing = (name) => name !== ""
    && !branchCache.branches.some((branch) => branch.name === name);

  const paint = () => {
    const query = branchQuery.trim();
    const needle = query.toLowerCase();
    const matches = branchCache.branches.filter(
      (branch) => branch.name.toLowerCase().includes(needle));
    rows.replaceChildren(...matches.map(branchLine));
    /* An empty list says nothing worth a line of its own. "No branch matches x"
       directly above "Create branch x" was the same sentence twice, and the
       block it sat in left a bordered box around a single grey apology. Gone,
       the panel answers a miss with the one thing you can do about it. */
    rows.hidden = !matches.length;
    offer.replaceChildren();
    offer.hidden = !missing(query);
    if (!offer.hidden) offer.append(createRow(query));
  };

  /* Typing repaints the ROWS and nothing else. Going through `setParams` +
     `draw` — the way every other control in this view changes what is on screen
     — would rebuild the panel, and with it this input, on every keystroke,
     taking the focus and the caret along with it. */
  filter.addEventListener("input", () => { branchQuery = filter.value; paint(); });
  filter.addEventListener("keydown", (event) => {
    if (event.key !== "Enter") return;
    event.preventDefault();
    /* Enter is the create row, reached from the keyboard — same call, same
       conditions. It never checks out an existing branch: acting on "the one
       remaining match" would put a working-tree change on a keystroke aimed at
       whatever the filter happened to leave behind. */
    const name = branchQuery.trim();
    if (missing(name) && !BAD_BRANCH.test(name)) create(name);
  });

  paint();
  focusSoon(filter);
  return panel;
}

/* ------------------------------------------------------------- stash panel */

function stashPanel(data) {
  const scope = data.repo.rel || "this repository";
  const panel = el("div", { className: "panel" },
    el("div", { className: "panel-head", textContent: "Stash changes in " + scope }));
  const message = el("input", { type: "text", placeholder: "message (optional)",
                                disabled: busy !== null });
  const untracked = el("input", { type: "checkbox", disabled: busy !== null });
  const push = () => run("stash_push", {
    op: "stash_push", message: message.value, include_untracked: untracked.checked,
  });
  message.addEventListener("keydown", (event) => {
    if (event.key === "Enter") { event.preventDefault(); push(); }
  });
  panel.append(el("div", { className: "panel-form" }, message,
    el("label", null, untracked, "include untracked"),
    action("stash_push", "Stash", { onClick: push })));
  return panel;
}

/* ------------------------------------------------------------- commit box */

/* Null when there is nothing to commit.
 *
 * The box is an affordance for an action that cannot be taken with an empty
 * index, and a permanently disabled button that says "nothing staged" is a
 * control teaching you it does not work — it occupied the top of the view in
 * the state the view spends most of its time in (a clean tree), pushing the
 * lists that DO have something to say further down.
 *
 * The test is what a commit would actually RECORD, which is the index and not
 * this scope: `staged` counts what is staged under the open path and
 * `outside.count` what is staged elsewhere (GT-14). Gating on `staged` alone
 * would hide the box while `git commit` still had work to do, which is the
 * same dishonesty in the other direction — so a scope with nothing staged of
 * its own still shows the box when the index is non-empty, carrying the
 * warning below that says whose changes those are. */
function commitBox(data) {
  const staged = data.changes.filter((c) => c.staged).length;
  const outside = data.staged_outside || { count: 0, paths: [] };
  const total = staged + outside.count;
  if (!total) return null;
  const message = param("msg");

  const box = el("textarea", {
    id: "msg",
    value: message,
    placeholder: "Message (Ctrl+Enter to commit)",
    disabled: busy !== null,
  });
  box.setAttribute("aria-label", "Commit message");
  /* Written to the URL on every keystroke, but `draw` ignores a change that
     only touches `msg` — otherwise each character would repaint the textarea
     out from under the caret. */
  box.addEventListener("input", () => setParams({ msg: box.value }));
  box.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
      event.preventDefault();
      commit(box.value);
    }
  });

  const actions = el("div", { className: "commit-actions" },
    /* No staged-count gate on `disabled`: the box does not exist unless the
       index has something in it, so the only thing that can disable this
       button is a call already in flight (`action` applies `busy` itself). */
    action("commit", "✓ Commit", {
      className: "primary",
      count: total,
      title: "Commit everything that is staged",
      onClick: () => commit(box.value),
    }),
    generateButton(),
    el("span", { className: "hint",
                 textContent: plural(total, "staged change") + " will be committed" }));

  const wrap = el("div", { className: "commit" }, box, actions);

  /* GT-14, the honesty rule. `git commit` records the INDEX — that is what the
     word means — so a commit made from a view scoped to `pkg/` also carries
     whatever is staged elsewhere. The alternative (`git commit -- <paths>`)
     would commit the WORKING TREE for those paths and bypass the index, which
     is a silent data surprise rather than a fix. So the view says it instead. */
  if (outside.count) {
    const warn = el("div", { className: "warn" },
      el("strong", { textContent: "⚠ " + plural(outside.count, "staged change")
                                  + " outside this scope will also be committed." }));
    const list = el("ul");
    for (const path of outside.paths) list.append(el("li", { textContent: path }));
    warn.append(list);
    if (outside.count > outside.paths.length) {
      warn.append(el("div", { textContent: "… and "
        + (outside.count - outside.paths.length) + " more." }));
    }
    wrap.append(warn);
  }
  return wrap;
}

/* ------------------------------------------------- AI commit message (GT-18)
 *
 * The sparkle writes the message the user was about to type, from the diff the
 * commit would record. Everything about it is deliberately narrow: it fills a
 * TEXTAREA and never commits, it is one button with no options, and what it
 * produces is a draft the user edits and sends — Ctrl+Enter still commits
 * whatever is in the box, generated or typed.
 */

const SPARK_GLYPH = ["M11 3.5l1.7 4.3 4.3 1.7-4.3 1.7L11 15.5 9.3 11.2 5 9.5l4.3-1.7z",
                     "M17.5 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"];

/* Written as a SYSTEM prompt rather than folded into the diff message, so the
   rules are not one more thing the model has to notice inside 80 KB of patch.
   Every clause here is a failure mode of the naive version: a preamble ("Here
   is a commit message:"), a code fence around it, a subject that runs past what
   `git log --oneline` shows, and a three-paragraph body explaining a one-line
   change. */
const AI_SYSTEM = [
  "You write git commit messages. Reply with the commit message ONLY —",
  "no preamble, no explanation, no code fences, no surrounding quotes.",
  "Line 1 is a summary in the imperative mood ('add', not 'added'/'adds'),",
  "at most 72 characters, no trailing period. Use a conventional-commit",
  "prefix (feat/fix/docs/refactor/test/chore) when one clearly applies.",
  "Add a body ONLY when the change genuinely needs one: separate it with a",
  "blank line, wrap at 72 columns, and say WHY rather than restating the diff.",
  "Most changes need no body at all. Never invent an issue number.",
].join(" ");

/* True while a generation is in flight. Module-level rather than a closure over
   the button, because a repaint (any mutation elsewhere in the view) rebuilds
   the button — reading the flag at BUILD time is what keeps the rebuilt button
   disabled instead of handing the user a second click into the same stream. */
let aiBusy = false;

function generateButton() {
  return action("ai", icon(SPARK_GLYPH, 14), {
    className: "icon ai" + (aiBusy ? " working" : ""),
    disabled: aiBusy,
    label: "Generate a commit message with AI",
    title: aiBusy ? "Writing a commit message…"
                  : "Write a commit message from the staged changes",
    onClick: generateMessage,
  });
}

/* The one writer of the box during generation, and it re-finds the node every
   time rather than closing over it: a mutation elsewhere in the view repaints
   between two chunks, and the textarea the stream started in is by then
   detached. Writing `msg` as well is what makes that survivable — the rebuilt
   box is filled from the param, so the text picks up where it left off. */
function setMessage(text) {
  const box = document.getElementById("msg");
  if (box) box.value = text;
  setParams({ msg: text });
}

/* The model is asked not to fence its answer (AI_SYSTEM), so this is the belt
   to that braces: a stray ``` wrapper is stripped rather than committed. */
function cleanMessage(text) {
  const trimmed = (text || "").trim();
  const fenced = trimmed.match(/^```[a-z]*\n([\s\S]*?)\n?```$/i);
  return (fenced ? fenced[1] : trimmed).trim();
}

function aiPrompt(payload) {
  const parts = [payload.kind === "staged"
    ? "These changes are STAGED — they are exactly what the next commit will record."
    : "NOTHING is staged yet; these are the uncommitted changes in the working tree."];
  if (payload.branch) parts.push("Branch: " + payload.branch);
  if (payload.scope) parts.push("The view is scoped to: " + payload.scope);
  if (payload.files.length) {
    parts.push("Files changed:\n" + payload.files.map((f) => "- " + f).join("\n")
      + (payload.files_truncated ? "\n- (more files than are listed here)" : ""));
  }
  if (payload.diff) {
    parts.push("Diff:\n```diff\n" + payload.diff + "\n```"
      + (payload.truncated
         ? "\n(The diff was cut off at this view's size cap — describe what is "
           + "shown and do not guess at the rest.)"
         : ""));
  }
  parts.push("Write the commit message.");
  return parts.join("\n\n");
}

/* A failure is a `flash`, exactly like a failed mutation: an AI that is not
   configured on this server, or a model that errored, is an ordinary answer
   this view reports in its own words — never the red traceback overlay. */
function aiFailed(message) {
  aiBusy = false;
  flash = { ok: false, message };
  announce(message);
  draw(true);
}

async function generateMessage() {
  if (aiBusy || busy !== null) return;
  aiBusy = true;
  flash = null;
  draw(true);                       // repaint with the sparkle pulsing

  let payload;
  try {
    payload = await fused.runPython(READER, { file, op: "pending" }, chan("pending"));
  } catch (err) {
    payload = { ok: false, message: err && err.message ? err.message : String(err) };
  }
  if (!payload.ok) {
    aiFailed("Could not read the changes: " + (payload.message || "git refused that."));
    return;
  }
  if (payload.empty) {
    aiFailed("There is nothing to describe — no changes were found.");
    return;
  }

  /* Cleared on click, VS Code's behaviour: the button REPLACES the draft rather
     than appending to it, so what streams in is readable as it arrives. The
     previous text is kept for the failure path — losing a typed message to a
     server that has no AI configured would be the worst outcome here. */
  const box = document.getElementById("msg");
  const before = box ? box.value : param("msg");
  let received = "";
  setMessage("");
  try {
    const result = await fused.ai(aiPrompt(payload), {
      systemPrompt: AI_SYSTEM,
      effort: "low",              // a commit message is not a thinking problem
      onChunk: (text) => {
        received += text;
        setMessage(cleanMessage(received));
      },
    });
    const message = cleanMessage(result.text);
    if (!message) throw new Error("The AI returned an empty message.");
    aiBusy = false;
    setMessage(message);
    announce("Commit message written. Review it, then commit.");
    draw(true);
    const written = document.getElementById("msg");
    if (written) written.focus();
  } catch (err) {
    if (!received) setMessage(before);
    aiFailed(err && err.type === "ai_unavailable"
      ? "AI is not available on this server."
      : "Could not write a commit message: "
        + ((err && err.message) || "the request failed."));
  }
}

function commit(message) {
  if (!message.trim()) {
    flash = { ok: false, message: "Write a commit message before committing." };
    draw(true);
    return;
  }
  run("commit", { op: "commit", message }, () => { setParams({ msg: null }); });
}

/* ------------------------------------------------- uncommitted change lists */

/* Whether `ops.py` would let this row be CHANGED — the mirror of that module's
   `_in_scope`, and it has to be a mirror rather than an approximation, because a
   button that is always refused is worse than no button: it advertises an action
   ("delete this whole directory") the module is guaranteed to decline.

   Two rows the reader deliberately lists fail this. A rename with only one side
   in the scope is shown because "this file left the folder you are looking at"
   is the change a scoped view exists for — but its path is elsewhere. And a
   wholly-untracked directory git collapsed to `dir/` can be an ANCESTOR of the
   scope, so it covers files outside it and discarding it would reach them. Both
   still open their diff; neither offers an action. */
function writable(repo, path) {
  if (!repo.rel) return true;                     // the whole repo is the scope
  const rel = path.replace(/\/+$/, "");           // a collapsed `dir/` row
  if (rel === repo.rel) return true;
  return repo.is_dir && rel.startsWith(repo.rel + "/");
}

function changeLine(repo, change, selected, kind) {
  const letter = change.untracked ? "?" : (change.x !== " " ? change.x : change.y);
  const label = change.orig ? change.orig + " -> " + change.path : change.path;
  const line = el("div", { className: "line" });
  const row = el("button", {
    className: "row",
    type: "button",
    title: (change.label || kind) + " — " + label,
  },
    el("span", { className: "code is-" + letter, textContent: change.status }),
    el("span", { className: "path", textContent: label }),
    /* A rename with only one side in the open scope is a MOVE relative to it,
       and the direction is the fact worth reading — "renamed" says nothing about
       a file that left the folder you are looking at. */
    change.moved
      ? el("span", { className: "where is-moved", textContent: "moved " + change.moved })
      : null);
  /* An out-of-scope row's `path` is outside the scope, but the diff is
     `-- <path>` against HEAD and git resolves it from the repo ROOT, so the row
     still opens the right diff: the pathspec is repo-relative, not
     scope-relative. Its ACTIONS are a different matter — see `writable`. */
  row.addEventListener("click", () => select("wt", change.path));
  if (selected) line.setAttribute("aria-current", "true");
  line.append(row);

  const acts = el("div", { className: "acts" });
  const path = change.path;
  if (writable(repo, path)) {
    if (kind === "staged") {
      acts.append(action("unstage:" + path, "−", {
        className: "icon", label: "Unstage " + path,
        onClick: () => run("unstage:" + path, { op: "unstage", paths: [path] }),
      }));
      /* The section is in the KEY, not derived from the entry later. An `MM`
         file is in both lists and both rows would otherwise build the identical
         `discard:<path>`, so the confirmation could not tell which revert was
         clicked — it re-derived "staged" from the entry, and the CHANGES row's
         revert, whose question says only "discard changes in <path>", quietly
         threw away the staged version as well. */
      acts.append(confirmable("discard:staged:" + path, icon(REVERT_GLYPH, 14),
        "Unstage and discard " + path + "? Both the staged version and the "
        + "working-tree version go. This cannot be undone.",
        { className: "icon", label: "Unstage and discard " + path }));
    } else {
      acts.append(action("stage:" + path, "+", {
        className: "icon", label: "Stage " + path,
        onClick: () => run("stage:" + path, { op: "stage", paths: [path] }),
      }));
      acts.append(confirmable("discard:worktree:" + path, icon(REVERT_GLYPH, 14),
        (change.untracked ? "Delete the untracked file " + path + "?"
                          : "Discard the unstaged changes in " + path
                            + "? Anything staged for it is kept.")
        + " This cannot be undone.",
        { className: "icon", label: "Discard " + path }));
    }
  }
  line.append(acts);
  return line;
}

/* A row in the Commits section: the SUBJECT, and how long ago. Nothing else.
   The reader returns four fields and the first version of this row drew all
   four — sha, subject, author, relative — which turned a list you skim into a
   table you parse: the eye has to cross an id it did not ask for to reach the
   sentence, and the author column is the same name on every row in most
   repositories. The identity (short sha, full author, exact date) is what you
   want once you have PICKED a commit, so it lives in the selected state, where
   there is room to show it whole instead of truncated to 12ch.

   The density is the one the removed per-path timeline mode used — subject
   first, one quiet line of metadata behind it — but none of its markup: its
   `.commit`, `.subject` and `.meta` were different rules under the same names,
   and borrowing them would have imported a second styling vocabulary into a file
   that already has one. This is a `.row` with `.subject` and `.when`, exactly
   like every other list row here.

   The dropped fields are still on the row as its `title`, because a tooltip is
   not density — it is the answer to "which commit is this?" without a click.
