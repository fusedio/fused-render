   Clicking the selected row again clears the selection. A row that only ever
   selects leaves the pane with no way back except the Close button, and the row
   the user just clicked is the thing their pointer is already on.

   THE SECOND CONTROL, in the row's action cluster like every other per-row verb
   in this view: show the OPEN FILE as of this commit, in the explorer's content
   pane next door. It is a separate button and not the row's own click because it
   is a separate request — the row reads this commit's diff, this reads the file —
   and because it is CONDITIONAL in a way the row is not: it exists only where
   there is a pane to drive (`canPreview`). In a folder's listing preview pane
   there is none, and then there is no button, rather than one that does nothing.
   Hidden, not disabled, for the reason the claude template's annotate switch is:
   a control that cannot do anything is not a promise worth keeping on screen. */
function commitLine(entry, selected) {
  const line = el("div", { className: "line" });
  const row = el("button", {
    className: "row",
    type: "button",
    title: entry.short + "  " + entry.subject + "\n" + entry.author + " — " + entry.date,
  },
    el("span", { className: "subject", textContent: entry.subject || "(no subject)" }),
    el("span", { className: "when", textContent: entry.relative }));
  if (selected) line.setAttribute("aria-current", "true");
  /* The FULL object name, never the abbreviation the row displays: this value is
     what the shell resolves the content pane's bytes with (`_fusedSelectRev` ->
     /api/git/show), and an abbreviation is a display form that would have to be
     re-resolved to be used. Nothing here clears a working-tree selection — one
     variable holds the pane's subject, so writing a commit into it IS clearing
     the other kind. */
  row.addEventListener("click",
    () => select("rev", selected ? null : entry.sha));
  line.append(row);

  if (canPreview) {
    const on = previewed === entry.sha;
    const btn = action("preview:" + entry.sha, icon(PREVIEW_GLYPH, 14), {
      className: "icon",
      label: (on ? "Stop showing" : "Show") + " the open file as of " + entry.short,
      title: on
        ? "Showing the open file as of " + entry.short + " — click to go back to "
          + "the current file"
        : "Show the open file as of " + entry.short + " in the pane (read-only). "
          + "Views that read the file through a Python reader may still show its "
          + "current content.",
      /* Toggle: the button that turned the pane into a revision is the way back
         out of one, which is what keeps "Live" in the shell's own bar from being
         the only exit. */
      onClick: () => preview(on ? null : entry.sha),
    });
    /* `aria-pressed`, not `aria-expanded`: this is a two-state toggle, not a
       disclosure — nothing here opens. (`expanded` is what the panel buttons in
       the toolbar carry, and it drives the caret rotation, which this has not
       got.) */
    btn.setAttribute("aria-pressed", String(on));
    line.append(el("div", { className: "acts" }, btn));
  }
  return line;
}

function stashLine(stash) {
  const line = el("div", { className: "line" });
  line.append(el("div", { className: "row" },
    el("span", { className: "sha", textContent: stash.ref }),
    el("span", { className: "path", textContent: stash.message }),
    stash.branch ? el("span", { className: "where", textContent: stash.branch }) : null,
    el("span", { className: "when", textContent: stash.relative })));
  /* Every stash call carries the entry's COMMIT ID as well as its index.
     `stash@{n}` is a position, and a `stash push` from anywhere — this view,
     another tab, a terminal — renumbers every entry, so an index alone can
     address a different, still-wanted stash by the time the call lands. That is
     survivable for apply and unrecoverable for drop, which is why the id travels
     with all three and ops.py verifies it before touching anything. */
  line.append(el("div", { className: "acts" },
    action("apply:" + stash.index, "apply", {
      title: "Apply " + stash.ref + " and keep it",
      onClick: () => run("apply:" + stash.index,
                         { op: "stash_apply", index: stash.index, sha: stash.sha }),
    }),
    action("pop:" + stash.index, "pop", {
      title: "Apply " + stash.ref + " and remove it",
      onClick: () => run("pop:" + stash.index,
                         { op: "stash_pop", index: stash.index, sha: stash.sha }),
    }),
    confirmable("stash_drop:" + stash.index + ":" + stash.sha, "drop",
      "Drop " + stash.ref + "? The stashed changes are gone for good.",
      { label: "Drop " + stash.ref })));
  return line;
}

/* A section with a header, an action cluster on the right of the header, rows,
   and — when this section owns the pending confirmation — the confirm bar
   directly under the rows it is about. */
function listSection(title, count, controls, rows, emptyText, footer, state) {
  const body = el("div", { className: "rows" });
  if (rows.length) {
    for (const row of rows) body.append(row);
  } else {
    body.append(el("div", { className: "none", textContent: emptyText }));
  }
  if (footer) body.append(footer);
  return el("section", null,
    el("h2", null, title,
      count !== null ? el("span", { className: "n", textContent: count }) : null,
      state ? el("span", { className: "sep", textContent: "·" }) : null,
      state ? el("span", { className: "state", textContent: state }) : null,
      el("span", { className: "spacer" }),
      controls || []),
    body);
}

/* ------------------------------------------------------------------ diff pane */

const LINE_CLASS = (line) => {
  if (line.startsWith("@@")) return "hunk";
  if (line.startsWith("+++") || line.startsWith("---")) return "meta";
  if (line.startsWith("+")) return "add";
  if (line.startsWith("-")) return "del";
  if (line.startsWith("diff ") || line.startsWith("index ")
      || line.startsWith("similarity ") || line.startsWith("rename ")
      || line.startsWith("new file") || line.startsWith("deleted file")
      || line.startsWith("old mode") || line.startsWith("new mode")
      || line.startsWith("Binary files")) return "meta";
  return "";
};

function diffBody(text) {
  const pre = el("pre", { className: "diff", tabIndex: 0 });
  /* One element per line rather than one big text node: a diff needs per-line
     backgrounds, and a stack of styled spans is what gives it them without a
     syntax highlighter. */
  const frag = document.createDocumentFragment();
  for (const line of text.split("\n")) {
    frag.append(el("span", { className: "ln " + LINE_CLASS(line), textContent: line || " " }));
  }
  pre.append(frag);
  return pre;
}

/* The selected commit's identity, for the pane. This is the half of the reader's
   log record the ROW deliberately stops drawing, shown once a commit has been
   picked: the abbreviated id, who wrote it, and when — the relative time the row
   showed, plus the absolute one it could never fit.
 *
 * There is no file list here. `op="commit"` returns the patch and not a
 * name-status roll-up (that is `op="pending"`'s shape), and the patch already
 * names every file it touches a few pixels below this line — a second list
 * would be a second git fork to repeat what is already on screen.
 */
function commitMeta(entry, sha) {
  const short = entry && entry.short ? entry.short : (sha || "").slice(0, 7);
  const bits = [el("span", { className: "sha", textContent: short })];
  if (entry && entry.author) bits.push(el("span", { className: "who", textContent: entry.author }));
  if (entry && entry.relative) bits.push(el("span", { textContent: entry.relative }));
  /* The exact timestamp, in the reader's own locale, and NEVER instead of the
     relative one: "3 days ago" is the fact you read, the datestamp is the fact
     you quote. A date git gave us that this environment cannot parse is shown
     verbatim rather than as "Invalid Date". */
  if (entry && entry.date) {
    const when = new Date(entry.date);
    bits.push(el("span", { textContent: Number.isNaN(when.getTime())
      ? entry.date : when.toLocaleString() }));
  }
  /* Dotted, not just gapped: four fields of similar length in one grey line run
     together without a separator. */
  const dotted = [];
  for (const bit of bits) {
    if (dotted.length) dotted.push(el("span", { className: "dot", textContent: "·" }));
    dotted.push(bit);
  }
  return el("div", { className: "pane-meta" }, dotted);
}

/* The right-hand pane, for BOTH kinds of selection. `meta` is an optional node
   the caller builds — the commit selection's identity line — and it is a
   parameter rather than a branch inside here on purpose: this function renders a
   diff and knows nothing about what was selected to produce one, so changing
   what a commit selection SHOWS (phase 2's open question) is a change to the
   caller and not to this. */
function diffPane(title, sub, payload, meta) {
  /* Both, always: the pane has one subject but two possible owners, and Close
     means "nothing is selected" whichever of them put it there. */
  const close = action("close", "Close", {
    onClick: () => select(null, null),
  });

  const pane = el("div", { className: "pane" },
    el("div", { className: "pane-head" },
      el("span", { className: "title", textContent: title }),
      sub ? el("span", { className: "sub", textContent: sub }) : null,
      close));
  if (meta) pane.append(meta);

  if (payload === "loading") {
    pane.append(el("div", { className: "rows" },
      el("div", { className: "skel-row" },
        el("span", { className: "skel-bar skel-cell", style: "width:70%" })),
      el("div", { className: "skel-row" },
        el("span", { className: "skel-bar skel-cell", style: "width:45%" })),
      el("div", { className: "skel-row" },
        el("span", { className: "skel-bar skel-cell", style: "width:60%" }))));
    return pane;
  }
  if (!payload.ok) {
    pane.append(el("div", { className: "none", textContent: payload.message || "Could not read that diff." }));
    return pane;
  }
  /* An untracked DIRECTORY has no diff — git collapsed it to one `dir/` row, so
     its honest answer is what is inside it. Each file clicks through to its own
     whole-file diff. */
  if (payload.kind === "untracked-dir") {
    if (!payload.files.length) {
      pane.append(el("div", { className: "none", textContent:
        "This directory is untracked and holds nothing git would add "
        + "(it may contain only ignored files)." }));
      return pane;
    }
    const rows = el("div", { className: "rows" });
    for (const name of payload.files) {
      const row = el("button", { className: "row", type: "button", title: name },
        el("span", { className: "code is-?", textContent: "??" }),
        el("span", { className: "path", textContent: name }));
      row.addEventListener("click", () => select("wt", name));
      rows.append(el("div", { className: "line" }, row));
    }
    pane.append(rows);
    if (payload.truncated) {
      pane.append(el("p", { className: "note", textContent:
        "Only the first " + payload.files.length + " untracked files in this "
        + "directory are listed." }));
    }
    return pane;
  }
  if (payload.empty) {
    /* Two different situations wore the commit sentence. A worktree entry that
       diffs to nothing is not "a commit that missed the scope" — it is a file
       whose content matches HEAD (mode-only change, or already reverted). */
    pane.append(el("div", { className: "none", textContent: payload.kind === "diff"
      ? "Nothing to show: this file's contents already match HEAD."
      : "Nothing in this commit touched the path this view is scoped to." }));
    return pane;
  }
  pane.append(diffBody(payload.diff));
  if (payload.truncated) {
    pane.append(el("p", { className: "note", textContent:
      "Diff truncated at " + payload.shown_lines + " lines (cap: "
      + payload.max_lines + " lines / " + Math.round(payload.max_bytes / 1024)
      + " KB). Open the file in git for the rest." }));
  }
  return pane;
}

/* ------------------------------------------------------------------ render */

function show(node) {
  /* Restore the caret if the commit box had it: a mutation repaints the whole
     view, and a message half-typed when someone clicks "stage" must not lose
     its cursor. */
  const focused = document.activeElement;
  const restore = focused && focused.id === "msg"
    ? { start: focused.selectionStart, end: focused.selectionEnd } : null;
  view.replaceChildren(node);
  skeleton.hidden = true;
  view.hidden = false;
  if (restore) {
    const box = document.getElementById("msg");
    if (box) {
      box.focus();
      try { box.setSelectionRange(restore.start, restore.end); } catch (_) { /* no-op */ }
    }
  }
}

function announce(text) {
  live.textContent = text;
}

function renderRefusal(payload) {
  /* Whole-VIEW refusals only — the reasons `_locate` can produce. A per-entry
     or per-op refusal never reaches here: it comes back from `run` or `loadDiff`
     and is rendered next to the control that caused it, which is where it
     belongs. */
  const titles = {
    "not-a-repo": "Not a git repository",
    "missing": "Nothing to show",
    "mount": "Not available on remote mounts",
    "no-git": "git is not available",
    "timeout": "git did not answer in time",
    "git-failed": "git could not read this repository",
    "bad-op": "Unsupported request",
  };
  show(el("div", null,
    emptyState(titles[payload.reason] || "Nothing to show",
               payload.message || "There is no git history for this path.")));
  announce(titles[payload.reason] || "No git history");
}

/* The pending confirmation, if any, rendered inside the section it belongs to.
 *
 * `ask` is a key the button wrote and this reads back, so the URL never carries
 * a callable. Its GRAMMAR is the fix for two bugs that were both "the key did
 * not say enough", so it now says everything the question needs:
 *
 *   discard_all
 *   discard:staged:<path>      the row in STAGED CHANGES
 *   discard:worktree:<path>    the row in CHANGES or UNTRACKED
 *   stash_drop:<index>:<sha>
 *
 * The section is IN the key rather than re-derived from the entry, because an
 * `MM` file appears in both lists and the two rows were building the same key.
 * The stash's commit id is in the key for the same reason ops.py wants it: a
 * confirmation can sit in the URL indefinitely, and a `stash push` in the
 * meantime renumbers every entry.
 *
 * Fields are split off the FRONT, never with a plain `split(":")`, because the
 * last field is a path and a path may contain a colon.
 */
function pendingConfirm(data) {
  const ask = param("ask");
  if (!ask) return null;
  const cut = ask.indexOf(":");
  const op = cut === -1 ? ask : ask.slice(0, cut);
  const rest = cut === -1 ? "" : ask.slice(cut + 1);
  if (!DESTRUCTIVE.has(op)) {
    /* A hand-written `ask=` for a non-destructive op is not a confirmation of
       anything; drop it rather than render a question about it. */
    return null;
  }
  if (op === "discard_all") {
    return {
      where: "changes",
      node: confirmBar(
        "Discard every change under " + (data.repo.rel || "this repository")
        + "? Modified files go back to the index and untracked files are deleted. "
        + "Ignored files are never touched. This cannot be undone.",
        () => run("discard_all", { op: "discard_all" })),
    };
  }
  if (op === "stash_drop") {
    const split = rest.indexOf(":");
    if (split === -1) return null;
    const index = parseInt(rest.slice(0, split), 10);
    const sha = rest.slice(split + 1);
    if (!Number.isFinite(index) || !sha) return null;
    return {
      where: "stashes",
      node: confirmBar("Drop stash@{" + index + "}? The stashed changes are gone "
                       + "for good.",
                       () => run("stash_drop", { op: "stash_drop", index, sha })),
    };
  }
  const split = rest.indexOf(":");
  if (split === -1) return null;
  const which = rest.slice(0, split);
  const path = rest.slice(split + 1);
  if (which !== "staged" && which !== "worktree") return null;
  const entry = data.changes.find((c) => c.path === path);
  return {
    where: which === "staged" ? "staged"
      : (entry && entry.untracked ? "untracked" : "changes"),
    node: confirmBar(
      which === "staged"
        ? "Unstage and discard " + path + "? Both the staged version and the "
          + "working-tree version go. This cannot be undone."
        : (entry && entry.untracked)
          ? "Delete the untracked file " + path + "? This cannot be undone."
          : "Discard the unstaged changes in " + path + "? Anything staged for "
            + "it is kept. This cannot be undone.",
      () => {
        /* Two calls for the staged row, deliberately. `discard` restores from
           the INDEX, so a staged change has to leave the index first or the
           discard silently restores the very content being thrown away. Each
           half is its own addressable op in ops.py — the view composes them
           behind ONE confirmation, it does not ask the backend for a compound
           verb. The CHANGES row does exactly one of them, which is why the two
           rows can no longer share a key. */
        if (which === "staged") {
          run("discard:" + path, { op: "unstage", paths: [path] }, () => {
            run("discard:" + path, { op: "discard", paths: [path] },
                null, "The change was unstaged, but discarding it failed");
            return true;
          });
        } else {
          run("discard:" + path, { op: "discard", paths: [path] });
        }
      }),
  };
}

function render(data, stashes, diff) {
  const wt = selectedWt();
  const rev = selectedRev();
  const pages = num("pages", 1);
  const ask = pendingConfirm(data);

  const staged = data.changes.filter((c) => c.staged);
  const unstaged = data.changes.filter((c) => c.unstaged && !c.untracked);
  const untracked = data.changes.filter((c) => c.untracked);

  const truncNote = data.changes_truncated
    /* One flag, two causes (MAX_CHANGES or the status byte cap), so the wording
       has to be true of both — "the first N" is a lie when the cap fired before
       N entries were even in scope. */
    ? el("p", { className: "note", textContent:
        "This list is truncated: the repository has more uncommitted changes "
        + "than this view will read." })
    : null;

  /* Each block is built only when it has something to say. An empty "Staged
     changes / Changes / Untracked / Stashes" quartet is four headings telling
     the reader the same nothing, and on a clean tree it pushed the one line
     that mattered off the top. A section still renders while empty when it is
     CARRYING something — a pending confirmation lives inside its section
     (`ask.where`), and the truncation note hangs off Changes — because hiding
     the block would hide the prompt with it. */
  const sections = [];
  const askIn = (where) => (ask && ask.where === where ? ask.node : null);
  /* The footer slot takes one node, but two things can want it at once (a
     pending confirmation and the open stash panel), so they go in together as a
     fragment rather than one silently shadowing the other. */
  const footer = (...nodes) => {
    const kept = nodes.filter(Boolean);
    if (kept.length < 2) return kept[0] || null;
    const frag = document.createDocumentFragment();
    frag.append(...kept);
    return frag;
  };

  const stagedAsk = askIn("staged");
  const showStaged = staged.length || stagedAsk;
  const changesAsk = askIn("changes");
  const showChanges = unstaged.length || changesAsk || truncNote;

  /* Stash is a section control, not a toolbar one — it acts on the changes it
     sits next to. Which section owns it cannot simply be Changes, though:
     `git stash push` takes the STAGED work along with the unstaged, and with
     everything staged the Changes section is not drawn at all, so the control
     would vanish while there was still something to stash. It rides Changes
     when Changes is drawn and falls back to Staged changes when it is not. When
     neither is drawn there is nothing stashable and no control, which is the
     honest answer — `git stash` on a clean tree does nothing. */
  const stashOpen = param("panel") === "stash";
  const stashHost = showChanges ? "changes" : showStaged ? "staged" : null;
  const stashButton = (where) => (where === stashHost
    ? action("panel-stash", ["Stash", caret()], {
        label: "Stash the changes under this path",
        expanded: stashOpen,
        onClick: () => setParams({ panel: stashOpen ? null : "stash" }),
      })
    : null);
  const stashForm = (where) => (where === stashHost && stashOpen ? stashPanel(data) : null);

  if (showStaged) sections.push(listSection(
    "Staged changes", String(staged.length),
    [staged.length ? action("unstage_all", "− Unstage all", {
      onClick: () => run("unstage_all", { op: "unstage_all" }),
    }) : null,
     stashButton("staged")],
    staged.map((c) => changeLine(data.repo, c, c.path === wt, "staged")),
    "Nothing is staged under this path.",
    footer(stagedAsk, stashForm("staged")),
    headState(data.repo) + (data.repo.has_commits ? "" : " · no commits yet")));

  if (showChanges) sections.push(listSection(
    "Changes", String(unstaged.length),
    [...(unstaged.length ? [
      action("stage_all", "+ Stage all", {
        onClick: () => run("stage_all", { op: "stage_all" }),
      }),
      confirmable("discard_all", "↩ Discard all",
                  "Discard every change under this path?", {}),
    ] : []),
     stashButton("changes")],
    unstaged.map((c) => changeLine(data.repo, c, c.path === wt, "changes")),
    data.repo.dirty ? "No unstaged changes under this path."
                    : "Working tree is clean.",
    footer(changesAsk || truncNote, stashForm("changes"))));

  /* This one section stages an explicit path LIST rather than the scope
     pathspec, so it has to apply `writable` itself — one out-of-scope row in the
     list would make ops.py refuse the whole call, taking the in-scope ones with
     it. */
  const stageableUntracked = untracked.filter((c) => writable(data.repo, c.path));
  const untrackedAsk = askIn("untracked");
  if (untracked.length || untrackedAsk) sections.push(listSection(
    "Untracked", String(untracked.length),
    stageableUntracked.length ? action("stage_untracked", "+ Stage all", {
      onClick: () => run("stage_untracked", {
        op: "stage", paths: stageableUntracked.map((c) => c.path),
      }),
    }) : null,
    untracked.map((c) => changeLine(data.repo, c, c.path === wt, "untracked")),
    "Nothing untracked under this path.",
    untrackedAsk));

  const stashAsk = askIn("stashes");
  if (stashes.length || stashAsk) sections.push(listSection(
    "Stashes", String(stashes.length), null,
    stashes.map(stashLine),
    "Nothing stashed.",
    stashAsk));

  /* The COMMITS section: the same scope the lists above use, on the other side
     of `git commit`. `_pathspec(rel)` bounds it exactly as it bounds the status
     read, so a view opened on `pkg/` lists the commits that touched `pkg/` and
     nothing else — the section is the history OF THIS PATH, not of the
     repository, and that is what makes it belong next to the working tree: the
     repo-wide timeline is what `git log` in a terminal is for.
     Recent-first, because that is the order `git log` answers in and the order
     the question "what just happened here?" is asked in. */
  const commits = data.commits || [];

  /* Three terminal states, not two. The page grows its WINDOW (`limit =
     PAGE_SIZE * pages`) rather than paging, so the reader's ceiling on that
     window has to be visible here: `has_more` stays honestly true once the clamp
     bites, and offering "load more" on it would refetch the identical rows
     forever. So `capped` — not `has_more` — decides whether another click can do
     anything, and when it has bitten the section SAYS so, in the same note the
     Changes list uses to admit its own truncation. */
  const loadMore = (data.has_more && !data.capped)
    /* Disabled while an op is in flight, like every other control here: a
       mutation is about to refetch these very rows, and widening the window
       under it would put a second read on the same channel. */
    ? el("button", { className: "more", type: "button", disabled: busy !== null,
                     textContent: "Load " + PAGE_SIZE + " more commits" })
    : (data.has_more && data.capped)
      ? el("p", { className: "note", textContent:
          "Showing the most recent " + commits.length + " commits for this path — "
          + "this view will not read further back. Use git for deeper history." })
      : (commits.length
          ? el("button", { className: "more", type: "button", disabled: true,
                           textContent: "End of history for this path" })
          : null);
  if (loadMore && loadMore.tagName === "BUTTON" && !loadMore.disabled) {
    loadMore.addEventListener("click", () => setParams({ pages: pages + 1 }));
  }

  /* Hidden when empty, like every list above it — an empty Commits heading on a
     path nothing has ever committed is a heading telling the reader nothing. A
     repository with NO commits at all is not that case and must not read as one:
     `has_commits` is false there, the section is simply absent, and the
     all-empty fallback below says "no commits yet" in words.
     The empty line below it is therefore unreachable today, and is written
     truthfully anyway: unlike the working-tree sections nothing else can carry
     this one open (no confirmation lives here), but the day something does, the
     sentence it shows should already be the right one. */
  /* No count on this heading, and `null` rather than "" so `listSection` omits
     the pill instead of drawing an empty one. Every other section's number is a
     TOTAL — that is all the staged/changed/untracked/stashed entries there are —
     but this list is one WINDOW of a history whose length nobody has measured
     (`limit = PAGE_SIZE * pages`), so a number here is the window size wearing a
     total's clothes: it reads "12 commits touched this path" and means "12 rows
     are loaded", and it grows by 30 every time you click load more. A true count
     is a separate `git rev-list --count` per path, which is a fork nobody asked
     for. Better no number than a confident wrong one. */
  if (commits.length) sections.push(listSection(
    "Commits", null, null,
    commits.map((c) => commitLine(c, c.sha === rev)),
    "No commits have touched this path yet.",
    loadMore));

  /* Every block empty is itself a state worth naming — the reader gets one
     honest line instead of a blank column. Reaching here now also means the
     Commits section is empty, so the sentence covers that too: a path with a
     clean tree AND no commits is a path git has never heard of, which is a
     different fact from "this repository is brand new". */
  if (!sections.length) {
    sections.push(el("section", null, el("div", { className: "rows" },
      el("div", { className: "none", textContent: data.repo.has_commits
        ? "Nothing staged, changed, untracked or stashed under this path, and no "
          + "commit has touched it."
        : "Nothing to commit — this repository has no commits yet." }))));
  }

  const left = el("div", { className: "col" }, ...sections);

  const cols = el("div", { className: "cols" + (diff ? "" : " no-diff") }, left);
  if (diff) cols.append(el("div", { className: "col" }, diff));

  const page = el("div", null);
  if (flash) {
    page.append(el("div", { className: "flash" + (flash.ok ? "" : " bad"),
                            textContent: flash.message }));
  }
  page.append(toolbar(data));
  /* Guarded, not appended blind: `commitBox` returns null when nothing is
     staged, and `Node.append(null)` inserts the literal text "null". */
  const box = commitBox(data);
  if (box) page.append(box);
  page.append(cols);
  show(page);
}

/* ------------------------------------------------------------------ mutations */

/* The runPython CHANNEL for one operation, and the reason this view names them.
 *
 * `fused.runPython` supersedes by channel, and the default channel is the .py
 * PATH — so two calls to the same reader are the same channel whether or not
 * they ask it different questions. Superseding is not a cancel: the older call
 * gets a promise that NEVER SETTLES (runtime.js: "hang forever so the stale
 * continuation never runs"), which is right for a stale repaint and fatal for a
 * concurrent one. This view reads the same log.py several ways, so on the
 * default channel `Promise.all([overview, stashes])` deadlocks — the stashes
 * call supersedes the overview, the overview never resolves, and the page sits
 * on its skeleton forever with both HTTP requests answered 200.
 *
 * One channel per OP is what this view actually wants: a newer overview still
 * supersedes an older overview (the staleness guard, kept), while overview and
 * stashes no longer collide (the deadlock, gone). */
const chan = (op) => ({ key: READER + "#" + op });

/* One path for every write. A mutation is: disable the control, call ops.py,
 * record what happened, then REFETCH the overview and repaint — never patch the
 * DOM from the op's own reply, because git is the authority on what the
 * repository now looks like and a locally-guessed state is how a UI drifts out
 * of sync with the repo it claims to show. */
async function run(key, args, then, context) {
  if (busy !== null) return;
  busy = key;
  flash = null;
  draw(true);                       // repaint with the control disabled
  let payload;
  try {
    payload = await fused.runPython(OPS, Object.assign({ file }, args));
  } catch (err) {
    /* A crash in ops.py is still a message in this view, not the red traceback
       overlay: the overlay is a debugging affordance for a view's own bug. */
    payload = { ok: false, message: err && err.message ? err.message : String(err) };
  }
  busy = null;
  /* `context` is what the caller already did before this call. The staged
     discard is two ops behind one confirmation, and when the second fails the
     first has still HAPPENED — reporting only "discard failed" would leave the
     user believing nothing moved when the file is now unstaged. The lists below
     do show the truth; the sentence has to as well. */
  flash = { ok: payload.ok === true,
            message: payload.ok ? (payload.detail || "Done.")
                                : (context ? context + ": " : "")
                                  + (payload.message || "git refused that.") };
  announce(flash.message);
  /* Bump the serial BEFORE refetching so any overview still in flight from
     before the mutation cannot repaint stale data over the fresh one. */
  seq += 1;
  snapshot = null;
  branchCache = null;
  /* The question has been answered — by acting on it. Leaving `ask` set would
     re-render the confirmation over the fresh lists, and (for a stash) leave a
     stale index/sha pair sitting in the URL for the next click to act on.
     REPLACE, because this write lands behind an `await` and the gesture gate is
     read when it LANDS (PT-17): by then the click that started the op has opened
     it, so an unqualified write here can take the visit's push. Usually this is
     a no-op — the confirmation clears `ask` before calling `run` — but a page
     REFRESHED with `?ask=…` still in the URL (which is the point of putting it
     there) arrives with the question pending and the entry pristine, and any
     other action clicked from that state clears it here for real. Pushing would
     put the answered question one Back press away, sitting over a repository
     that has since changed. */
  setParams({ ask: null }, { history: "replace" });
  // A continuation that returns `true` owns the repaint (the staged-discard
  // chain, which repaints at the end of its SECOND call). Anything else falls
  // through to the repaint here — which the commit path needs, because clearing
  // `msg` is not a structural param change and so triggers no draw of its own.
  if (payload.ok && then && then() === true) return;
  await draw(true);
}

/* ------------------------------------------------------------------ loading */

/* The pane as it looks while its diff is still being read. It is built from what
   the LIST already knows, so a commit's heading and identity line are correct
   before the read lands and do not change under the reader when it does — only
   the body below them fills in. Without it the placeholder was titled with the
   40-character sha, which then swapped for the subject a moment later. */
function pendingPane(data) {
  const rev = selectedRev();
  const wt = selectedWt();
  if (rev) {
    const known = (data && data.commits ? data.commits : []).find((c) => c.sha === rev);
    return diffPane(known ? (known.subject || "(no subject)") : rev.slice(0, 7),
                    data && data.repo.rel ? "scoped to " + data.repo.rel : null,
                    "loading", commitMeta(known, rev));
  }
  if (wt) return diffPane(wt, null, "loading");
  return null;
}

async function loadDiff(data) {
  const wt = selectedWt();
  const rev = selectedRev();
  /* A selected commit fills the SAME pane as a selected change, through the same
     `diffPane` — one renderer, because a diff is a diff and the only thing that
     differs is its heading. `op="commit"` restricts the patch to this view's
     pathspec, so the pane shows what that commit did HERE, matching the section
     the row was clicked in.
     Its own channel: `chan` exists because runPython supersedes by channel and a
     superseded call never settles, so a commit read must not share one with the
     worktree read. */
  if (rev) {
    const payload = await fused.runPython(READER, { file, op: "commit", sha: rev },
                                          chan("commit"))
      .catch((err) => ({ ok: false, message: err.message }));
    /* The row's own fields are the fallback: a failed read still knows which
       commit was clicked, and "abc1234 — could not read that diff" is a better
       answer than a pane titled with a 40-character sha. */
    const known = (data.commits || []).find((c) => c.sha === rev);
    const meta = payload.ok ? payload.commit : known;
    return diffPane(
      meta ? (meta.subject || "(no subject)") : rev,
      data.repo.rel ? "scoped to " + data.repo.rel : null,
      payload,
      commitMeta(meta, rev));
  }
  if (wt) {
    const payload = await fused.runPython(READER, { file, op: "worktree", entry: wt },
                                          chan("worktree"))
      .catch((err) => ({ ok: false, message: err.message }));
    const sub = !payload.ok ? null
      : payload.kind === "untracked-dir" ? "untracked directory — contents"
      : payload.untracked ? "untracked — whole file"
      : "working tree vs HEAD";
    return diffPane(wt, sub, payload);
  }
  return null;
}

/* The branch list is a second read, and only when the panel is open — the
   toolbar's own label comes from the overview, so an unopened panel costs
   nothing. */
async function loadBranches(mine) {
  if (param("panel") !== "branch" || branchCache) return false;
  const payload = await fused.runPython(READER, { file, op: "branches" },
                                        chan("branches"))
    .catch((err) => ({ ok: false, message: err.message }));
  if (mine !== seq) return false;
  branchCache = payload;
  return true;
}

/* Everything the DOM's shape depends on THAT LIVES IN THE URL. A `msg` keystroke
   is deliberately NOT in here: it changes the URL and must not repaint the view.
   Neither is the pane's selection, and for a different reason — it is not a param
   at all any more, so no `onChange` will ever announce it; `select` calls
   `draw(true)` itself, which forces past the comparison this feeds. */
const structural = () => [param("pages"), param("panel"),
                          param("ask")].join("\u0000");

async function draw(force) {
  const key = structural();
  if (!force && drawn !== null && key === drawn) return;
  drawn = key;

  const mine = ++seq;
  const pages = num("pages", 1);
  /* Whether the right-hand pane has a subject at all, whichever KIND it is. One
     variable holds it, so there is nothing to merge and no pair to keep exclusive;
     what the pane is FOR is decided in one place (`pendingPane`/`loadDiff`) rather
     than here. */
  const target = selection !== null;

  if (!file) {
    renderRefusal({ reason: "missing", message: "No file or folder was selected." });
    return;
  }

  /* Repaint from the snapshot first when only the SELECTION changed: the lists
     are unchanged, so refetching them would blank a list the user is looking at.
     The diff then arrives into an already-laid-out pane. Keyed by the log
     WINDOW, because "load more" is the one change here that leaves the held
     lists genuinely short — it has to fall through to a refetch. */
  const reuse = snapshot && snapshot.pages === pages;
  let data = reuse ? snapshot.data : null;
  let stashes = reuse ? snapshot.stashes : [];

  if (data) {
    render(data, stashes, pendingPane(data));
  }

  if (!data) {
    let payload;
    let stashPayload;
    try {
      /* Two reads, one round of latency: the overview is the view, and the
         stash list is a section of it.
         Concurrently, so they MUST be on different channels — see `chan`. Run
         on the default channel this deadlocks: the second call supersedes the
         first, the first then hangs forever by design, and `Promise.all` waits
         on it for the life of the page. */
      [payload, stashPayload] = await Promise.all([
        /* The overview carries the log as well as the status, so the Commits
           section costs no extra round trip. The window GROWS (`limit`) rather
           than pages — `page: 0` always — which is what keeps the rows already
           on screen in place when "load more" widens it. */
        fused.runPython(READER, { file, op: "overview",
                                  limit: String(PAGE_SIZE * pages), page: "0" },
                        chan("overview")),
        fused.runPython(READER, { file, op: "stashes" }, chan("stashes")),
      ]);
    } catch (err) {
      /* A crash in the reader is still an empty state here, not the red
         traceback overlay: the overlay is a debugging affordance for a view's
         own bug, and "this folder has no git" is not one. */
      renderRefusal({ reason: "git-failed", message: err.message });
      return;
    }
    if (mine !== seq) return;
    if (!payload.ok) {
      snapshot = null;
      renderRefusal(payload);
      return;
    }
    data = payload;
    stashes = (stashPayload && stashPayload.ok) ? stashPayload.stashes : [];
    snapshot = { pages, data, stashes };
    render(data, stashes, pendingPane(data));
    announce(data.changes.length + " uncommitted changes, "
             + (data.commits || []).length + " commits under this path");
  }

  if (await loadBranches(mine)) {
    if (mine !== seq) return;
    render(data, stashes, pendingPane(data));
  }

  if (!target) return;
  const diff = await loadDiff(data);
  if (mine !== seq) return;
  render(data, stashes, diff);
}

/* Escape closes whatever is open, innermost first: a pending confirmation, then
   a dropdown, then the pane. A commit selection and a change selection unwind at
   the same depth and in the same call because they are ONE piece of state — the
   ordering here is unchanged by that state leaving the URL, since `ask` and
   `panel` are still read from it and the pane is still the outermost thing this
   handler closes. Everything else is native — every row and every control is a
   real <button>, so tab/enter already work. */
document.addEventListener("keydown", (event) => {
  if (event.key !== "Escape") return;
  if (param("ask")) { event.preventDefault(); setParams({ ask: null }); return; }
  if (param("panel")) { event.preventDefault(); setParams({ panel: null }); return; }
  if (selection) {
    event.preventDefault();
    select(null, null);
    return;
  }
  /* Outermost, and only once this column has nothing of its own open: the
     previewed revision is the one thing Escape closes that is NOT on this side of
     the sidebar, so it unwinds last. It is also reachable from two other places
     (the row's own toggle, and "Live" in the shell's bar), which is why it sits
     below every step that had no second exit. */
  if (previewed) {
    event.preventDefault();
    preview(null);
  }
});

/* Announce the empty preview once at load. `previewed` is memory, so a reload of
   this frame — the runtime's auto-reload after a file change, the user's own
   refresh, a re-mount by the shell — starts with nothing previewed; a shell still
   holding the previous sha would leave the content pane on a revision no row here
   claims. Saying "live" on the way in is what keeps the two ends from disagreeing,
   and it is a no-op when the shell holds nothing. */
hopRev();

/* The capability, read once BEFORE the first paint — as a plain assignment and
   not through `pollRevTarget`, which would ask for a repaint of a view that has
   not drawn yet and put a second overview read on a channel the first would then
   never settle on. From here on it is polled: on every focus and on a slow timer,
   because the host's mark arrives and departs long after this page has mounted
   (its mode switcher moves it; a listing removes it). Same discipline as the
   claude template's annotate target, and for the same reason. */
canPreview = !!revMarkedFrame();
window.addEventListener("focus", () => pollRevTarget());
setInterval(() => pollRevTarget(), REV_TARGET_POLL_MS);

fused.params.onChange(() => draw());
draw(true);
</script>
</body>
</html>
