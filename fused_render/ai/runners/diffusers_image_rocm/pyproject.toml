# The diffusers image runner's environment — the ROCm variant (SPEC §40, PY-16).
#
# Identical to `diffusers_image/pyproject.toml` except for where torch comes from
# and the one extra line that follows from it. Read that file first — it carries the
# reasoning for the dependency list, the ceilings, `explicit = true`, the
# wheels-only rule and the three-folder shape.
#
# AMD cards on Linux. The wheels live only on
# `download.pytorch.org/whl/rocm7.1`; there is no ROCm torch on PyPI, and none for
# macOS or Windows anywhere, so this variant is a Linux one by construction and the
# registry offers it there.
#
# **`triton-rocm` is declared, and deleting it breaks the install.**
# `torch 2.13.0+rocm7.1` carries `Requires-Dist: triton-rocm==3.7.1` — note the
# rename; it was `pytorch-triton-rocm` through the 2.x series — and that
# distribution is published ONLY on the ROCm index. `[tool.uv.sources]` governs
# declared dependencies, not transitive ones, so with the line removed uv looks for
# `triton-rocm` on PyPI, finds nothing, and the whole sync fails with
#
#     there is no version of triton-rocm==3.7.1
#
# which reads like a broken pin rather than a missing index. Declaring it is what
# brings it under the source rule. It is deliberately UNBOUNDED: torch's own `==`
# pin is the version, and a ceiling here could only ever contradict it — the same
# argument `faster_whisper/pyproject.toml` makes for `sherpa-onnx-core`, and it
# needs the same exemption in `UNBOUNDED_RUNNER_DEPENDENCIES`
# (`tests/test_ai_runtime.py`).
#
# The `sys_platform == 'linux'` marker is not decoration. A universal resolution
# considers macOS and Windows too, and there is no `triton-rocm` wheel for either;
# without the marker uv has to satisfy a requirement that cannot be satisfied on
# platforms this variant was never for.
#
# **What `explicit = true` buys here is larger than on the CPU index.** The ROCm
# mirror carries its own copies of numpy, pillow, sympy and more — several of which
# this runner declares directly. Left implicit it would win them by being listed
# first, and this venv would quietly differ from every other runner's in packages
# that have nothing to do with AMD. Explicit means the two names below come from the
# mirror and the other 50 of the 53 packages locked here come from PyPI.
#
# Nothing in `runners/torch_image.py` knows about any of this, and its `_placement()`
# is unchanged on purpose: ROCm torch reports through `torch.cuda.is_available()`
# and wants the device string `"cuda"`. So `/health` says `cuda` on an AMD card —
# torch's own naming, since HIP presents the CUDA API surface, and correcting it
# here would mean a device string the rest of the code does not recognise.
#
# **`bitsandbytes` is declared here for the same reason as the CPU and CUDA
# folders — see that file's header — and was verified on THIS hardware rather
# than assumed.** PyPI publishes bitsandbytes as one generic wheel per platform
# (`py3-none-manylinux_2_24_x86_64.whl`, no ROCm or CUDA tag), unlike torch
# above, so there is no separate ROCm index to add and no `[tool.uv.sources]`
# entry needed — the ordinary PyPI resolution already gets the wheel that
# carries HIP kernels. Confirmed rather than assumed: `--no-deps` installed
# into a live ROCm runner venv (torch 2.13.0+rocm7.1, HIP 7.1.52802, AMD Navi
# 44 / RX 9060 XT) and an NF4 round trip — `F.quantize_4bit(x,
# quant_type='nf4')` into `F.dequantize_4bit` — ran on-device and returned a max
# abs error of 0.42 against a randn bf16 input, the expected magnitude for a
# 4-bit format. **A non-fatal noise source worth knowing before chasing it in a
# log:** bnb prints `Could not detect ROCm GPU architecture: [Errno 2] No such
# file or directory: 'rocminfo'` followed by `ROCm GPU architecture detection
# failed despite ROCm being available.` on import, because its arch probe
# shells out to the `rocminfo` binary and this app bundles rclone, not the
# ROCm userspace tools. The kernels above ran correctly anyway — bnb's arch
# detection is only degraded, not load-bearing for the operations this app
# calls — so the warning is expected and not a sign the wheel is broken.
[project]
name = "fused-render-runner-diffusers-image-rocm"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.13,<3",
    "triton-rocm; sys_platform == 'linux'",
    "diffusers>=0.39,<0.40",
    "transformers<6",
    "accelerate>=1.14,<2",
    "sentencepiece",
    "protobuf",
    "gguf",
    "torchao>=0.15,<0.18",
    "bitsandbytes>=0.46.1,<1",
    "pillow",
    "huggingface_hub",
    "psutil",
]

# Not a distribution — a folder of scripts, not something to build and install.
[tool.uv]
package = false

# The ROCm wheels. `explicit` keeps this index out of every other requirement's
# candidate list — see the header.
[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.1"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
triton-rocm = { index = "pytorch-rocm" }
