<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Map Viewer</title>
<style>
  /* ---- Felt-inspired light theme ---------------------------------------- */
  :root {
    color-scheme: light;
    --bg: #f3f4f6;
    --panel: #ffffff;
    --panel-2: #f5f6f8;
    --panel-3: #eceef1;
    --border: #e5e7eb;
    --border-2: #d1d5db;
    --text: #1f2937;
    --muted: #6b7280;
    --faint: #9ca3af;
    --accent: #5f7300;
    --accent-soft: #5f730018;
    --good: #1a7f37;
    --warn: #8f6a10;
    --bad: #c62828;
    --r: 12px;
    --shadow: 0 4px 16px rgba(0,0,0,.12);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font); font-size: 13.5px; color: var(--text);
    background: var(--bg); -webkit-font-smoothing: antialiased;
  }
  #app { display: flex; height: 100%; }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: #b9bec7; }

  /* ---------------- floating left panel ---------------- */
  #panel {
    position: absolute; top: 12px; left: 12px; z-index: 7; width: 300px;
    max-height: calc(100% - 24px); display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--r);
    box-shadow: var(--shadow); overflow: hidden;
  }
  .panel-head {
    display: flex; align-items: center; gap: 9px; padding: 11px 12px;
    border-bottom: 1px solid var(--border); flex: none;
  }
  .panel-head .logo {
    width: 22px; height: 22px; border-radius: 6px; flex: none;
    background: linear-gradient(135deg, var(--accent), #a3c400);
    display: flex; align-items: center; justify-content: center;
  }
  .panel-head .title { font-weight: 640; font-size: 14px; letter-spacing: -.01em; flex: 1; }
  .panel-head .title small { color: var(--faint); font-weight: 500; }
  .ph-btn { background: transparent; border: 0; color: var(--faint); display: flex; padding: 3px; border-radius: 6px; }
  .ph-btn:hover { color: var(--text); background: var(--panel-2); }

  .panel-scroll { overflow-y: auto; min-height: 0; flex: 1; }
  .sec-head {
    display: flex; align-items: center; gap: 7px; padding: 10px 12px 6px;
    font-size: 11px; font-weight: 640; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); user-select: none;
  }
  .sec-head .chev { display: flex; color: var(--faint); transition: transform .15s; }
  .sec-head .sec-sub { margin-left: auto; font-family: var(--mono); font-size: 10.5px; font-weight: 500;
    text-transform: none; letter-spacing: 0; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
  #layercards { padding: 4px 10px 10px; }
  .lp-empty { color: var(--faint); font-size: 12px; padding: 14px 6px 16px; line-height: 1.6; text-align: center; }

  .lc {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 6px; cursor: pointer; transition: border-color .12s, box-shadow .12s;
  }
  .lc:hover { border-color: var(--border-2); }
  .lc.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .lc.bad-tint { background: #fef2f2; border-color: #fecaca; }
  .lc.warn-tint { background: #fffbeb; border-color: #fde68a; }
  .lc-h { display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
  .lc-swatch { width: 14px; height: 14px; border-radius: 4px; flex: none; border: 1px solid rgba(0,0,0,.10); }
  .lc-nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; font-weight: 560; }
  .lc.off .lc-nm, .lc.off .lc-swatch { opacity: .4; }
  .lc-badge { font-size: 9.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--faint); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; flex: none; }
  .lc-badge:empty { display: none; }
  .lc-eye, .lc-dots { background: transparent; border: 0; color: var(--muted); display: flex; padding: 2px; border-radius: 5px; flex: none; opacity: 0; transition: opacity .12s; }
  .lc:hover .lc-eye, .lc:hover .lc-dots, .lc-eye.off { opacity: 1; }
  .lc-eye:hover, .lc-dots:hover { color: var(--text); background: var(--panel-2); }
  .lc-eye.off { color: var(--faint); }
  .lc-msg { font-size: 11px; color: var(--muted); padding: 0 10px 8px 32px; line-height: 1.45; word-break: break-word; }
  .lc-progress { display: flex; align-items: center; gap: 8px; }
  .lc-progress span { flex: 1; min-width: 0; }
  .lc-progress button { border: 0; background: transparent; color: var(--accent); font: inherit; padding: 0; cursor: pointer; white-space: nowrap; }
  .lc-confirm { display: flex; flex-direction: column; gap: 6px; }
  .lc-confirm button { border: 1px solid var(--accent); background: var(--panel-2); color: var(--accent); font: inherit; border-radius: 7px; padding: 5px 8px; cursor: pointer; text-align: left; }
  .lc-confirm button:hover:not(:disabled) { background: var(--accent); color: #fff; }
  .lc-confirm button:disabled { opacity: 0.6; cursor: default; }
  .lc .spin { width: 13px; height: 13px; border: 2px solid #00000014; border-top-color: var(--accent); border-radius: 50%; flex: none; animation: spin .7s linear infinite; }

  #lmenu {
    position: fixed; z-index: 40; min-width: 156px; padding: 4px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: var(--shadow);
  }
  #lmenu button {
    display: block; width: 100%; text-align: left; background: none; border: 0;
    padding: 7px 10px; border-radius: 6px; font-size: 12.5px; color: var(--text);
  }
  #lmenu button:hover { background: var(--panel-2); }
  #lmenu button.danger:hover { background: #fef2f2; color: var(--bad); }

  .side-tools { padding: 0 12px 8px; display: flex; flex-direction: column; gap: 7px; }
  .field {
    display: flex; align-items: center; gap: 7px; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 9px; padding: 0 9px;
    transition: border-color .15s;
  }
  .field:focus-within { border-color: var(--accent); }
  .field svg { color: var(--faint); flex: none; }
  .field input {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
    color: var(--text); padding: 8px 0; font-size: 13px;
  }
  .field input::placeholder { color: var(--faint); }
  .field .mini {
    background: transparent; border: 0; color: var(--faint); padding: 3px;
    border-radius: 5px; display: flex;
  }
  .field .mini:hover { color: var(--text); background: var(--panel-3); }

  .source-actions { border-top: 1px solid var(--border); padding: 2px 12px 10px; display: grid; gap: 8px; }
  .browse-button {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 8px 10px; border: 1px solid var(--border-2); border-radius: 9px;
    background: var(--panel); color: var(--text); font-size: 12.5px; font-weight: 560;
  }
  .browse-button:hover { border-color: var(--accent); background: var(--accent-soft); }
  .import-add { border: 0; border-left: 1px solid var(--border); background: transparent; color: var(--accent);
    padding: 4px 0 4px 8px; font-size: 11.5px; font-weight: 650; }

  .file {
    display: flex; align-items: center; gap: 9px; padding: 6px 8px;
    border-radius: 8px; cursor: pointer; user-select: none;
    border: 1px solid transparent; transition: background .12s;
  }
  .file:hover { background: var(--panel-2); }
  .file.selected { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
  .file.loading { opacity: .6; }
  .file .ic { width: 20px; height: 20px; flex: none; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .file.selected .ic { color: var(--accent); }
  .file .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .file .kd { font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; }
  .file .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .file .spin { width: 13px; height: 13px; border: 2px solid #00000014; border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  .file.parent { color: var(--muted); }
  .file.parent .nm { font-family: var(--mono); letter-spacing: .08em; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty-note { color: var(--faint); font-size: 12px; padding: 14px 12px; line-height: 1.6; text-align: center; }

  /* system-style file browser modal */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 80; display: grid; place-items: center;
    padding: 24px; background: rgba(17,24,39,.48); backdrop-filter: blur(2px);
  }
  .file-dialog {
    width: min(920px, 96vw); height: min(680px, 88vh); min-height: 430px;
    display: grid; grid-template-rows: auto auto minmax(0,1fr) auto;
    overflow: hidden; background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: 0 24px 70px rgba(0,0,0,.28);
  }
  .fb-head { display: flex; align-items: center; gap: 10px; padding: 13px 16px;
    border-bottom: 1px solid var(--border); }
  .fb-title { flex: 1; font-size: 15px; font-weight: 670; }
  .fb-close { border: 0; border-radius: 7px; background: transparent; color: var(--muted);
    width: 30px; height: 30px; font-size: 20px; line-height: 1; }
  .fb-close:hover { background: var(--panel-2); color: var(--text); }
  .fb-toolbar { display: grid; grid-template-columns: auto auto minmax(0,1fr) auto auto;
    align-items: center; gap: 7px; padding: 9px 12px; border-bottom: 1px solid var(--border);
    background: var(--panel-2); }
  .fb-tool, .fb-go {
    height: 32px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--panel); color: var(--muted); padding: 0 9px;
  }
  .fb-tool:hover, .fb-go:hover { color: var(--text); border-color: var(--border-2); }
  .fb-tool:disabled { opacity: .4; cursor: default; }
  #fb-path { min-width: 0; height: 32px; border: 1px solid var(--border-2); border-radius: 7px;
    background: var(--panel); color: var(--text); padding: 0 10px; outline: 0;
    font: 11.5px var(--mono); }
  #fb-path:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .fb-main { min-height: 0; display: grid; grid-template-columns: 168px minmax(0,1fr); }
  .fb-places { overflow-y: auto; padding: 10px 8px; border-right: 1px solid var(--border);
    background: var(--panel-2); }
  .fb-place { width: 100%; display: flex; align-items: center; gap: 8px; border: 0;
    border-radius: 7px; padding: 7px 9px; background: transparent; color: var(--text);
    text-align: left; font-size: 12.5px; }
  .fb-place:hover, .fb-place.on { background: var(--panel); }
  .fb-browser { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto auto minmax(0,1fr); }
  .fb-search-wrap { padding: 9px 12px; border-bottom: 1px solid var(--border); }
  #fb-search { width: 100%; height: 32px; border: 1px solid var(--border); border-radius: 8px;
    padding: 0 10px; background: var(--panel-2); color: var(--text); outline: 0; }
  #fb-search:focus { border-color: var(--accent); background: var(--panel); }
  #fb-error { min-height: 0; padding: 0 12px; color: var(--bad); font-size: 11.5px; }
  #fb-list { overflow: auto; padding: 6px 8px 12px; }
  #fb-list .file { min-height: 34px; }
  #fb-list .file.disabled { opacity: .48; cursor: default; }
  #fb-list .file.disabled:hover { background: transparent; }
  #fb-list .file.folder .kd { font-size: 15px; }
  .fb-footer { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 8px;
    align-items: center; padding: 11px 14px; border-top: 1px solid var(--border);
    background: var(--panel-2); }
  #fb-selection { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--muted); font: 11.5px var(--mono); }
  .fb-action { min-width: 82px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border-2);
    background: var(--panel); color: var(--text); }
  .fb-action.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
  .fb-action:disabled { opacity: .45; cursor: default; }
  @media (max-width: 650px) {
    .modal-backdrop { padding: 8px; }
    .file-dialog { width: 100%; height: 94vh; }
    .fb-main { grid-template-columns: 112px minmax(0,1fr); }
    .fb-toolbar { grid-template-columns: auto auto minmax(0,1fr) auto; }
    #fb-refresh { display: none; }
  }

  /* basemap switch */
  #basemaprow { border-top: 1px solid var(--border); padding: 10px 12px; flex: none; }
  .seg { display: flex; background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px; overflow: hidden; padding: 2px; gap: 2px; }
  .seg button { flex: 1; background: transparent; border: 0; color: var(--muted); padding: 5px 4px; font-size: 11.5px; border-radius: 7px; }
  .seg button.on { background: var(--panel); color: var(--text); font-weight: 560; box-shadow: 0 1px 3px rgba(0,0,0,.10); }

  /* show-panel button (when panel hidden) */
  #btn-panel {
    position: absolute; top: 12px; left: 12px; z-index: 6;
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--panel); box-shadow: var(--shadow); color: var(--muted);
    display: flex; align-items: center; justify-content: center;
  }
  #btn-panel:hover { color: var(--text); }

  /* ---------------- map ---------------- */
  #mapwrap { position: relative; flex: 1; min-width: 0; background: #e5e7eb; }
  #map { position: absolute; inset: 0; }
  #map canvas { outline: none; }
  .maplibregl-ctrl-attrib { font-size: 10px !important; }

  /* floating right controls */
  #ctrls {
    position: absolute; top: 12px; right: 12px; z-index: 6;
    display: flex; flex-direction: column; gap: 8px;
  }
  .fab {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--panel); box-shadow: 0 2px 8px rgba(0,0,0,.10); color: var(--muted);
    display: flex; align-items: center; justify-content: center; transition: all .14s;
  }
  .fab:hover { color: var(--text); border-color: var(--border-2); }
  .fab.on { color: var(--accent); border-color: #5f730055; background: var(--accent-soft); }

  /* geocode box */
  #geobox {
    position: absolute; top: 12px; right: 62px; z-index: 8; width: 320px;
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--r);
    box-shadow: var(--shadow); overflow: hidden;
  }
  #geobox .field { border: 0; border-radius: 0; border-bottom: 1px solid var(--border); background: var(--panel); }
  #georesults { max-height: 280px; overflow-y: auto; }
  .geores { padding: 9px 12px; cursor: pointer; border-bottom: 1px solid var(--panel-2); }
  .geores:hover { background: var(--panel-2); }
  .geores .g1 { font-size: 13px; }
  .geores .g2 { font-size: 11.5px; color: var(--muted); }
  .geores.none { color: var(--faint); cursor: default; }

  /* style controls */
  .ctl { margin-top: 11px; }
  .ctl-lbl { font-size: 11px; color: var(--muted); margin-bottom: 5px; display: flex; justify-content: space-between; }
  .ctl-lbl b { color: var(--text); font-weight: 560; font-family: var(--mono); font-size: 10.5px; }
  .ctl-pair { display: flex; gap: 6px; }
  .ctl-pair input, .ctl > input[type=text] { flex: 1; min-width: 0; width: 100%; border: 1px solid var(--border); border-radius: 7px; padding: 5px 7px; background: var(--panel-2); color: var(--text); font-size: 11.5px; font-family: var(--mono); }
  .ctl-pair input:focus, .ctl > input[type=text]:focus { outline: none; border-color: var(--accent); }
  .ctl-action { width:100%; border:1px solid var(--border); border-radius:8px; padding:7px 9px; background:var(--panel-2); color:var(--text); font-size:11.5px; text-align:left; }
  .ctl-action:hover { border-color:var(--accent); }
  .row { display: flex; align-items: center; gap: 8px; }
  input[type=range] { -webkit-appearance: none; width: 100%; height: 4px; background: var(--panel-3); border-radius: 3px; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  input[type=color] { -webkit-appearance: none; width: 30px; height: 26px; border: 1px solid var(--border-2); border-radius: 6px; background: none; padding: 0; cursor: pointer; }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
  input[type=color]::-webkit-color-swatch { border: 0; border-radius: 4px; }
  select {
    width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--border-2);
    border-radius: 7px; padding: 6px 8px; font-size: 12px; outline: none;
  }
  .num { width: 70px; background: var(--panel); color: var(--text); border: 1px solid var(--border-2); border-radius: 6px; padding: 5px 7px; font-size: 11.5px; font-family: var(--mono); }
  .stat { font-size: 11px; color: var(--muted); line-height: 1.7; margin-top: 8px; font-family: var(--mono); white-space: pre-wrap; }
  .warnline { font-size: 11px; color: var(--warn); margin-top: 8px; line-height: 1.5; }

  .legend { margin-top: 10px; }
  .legend .bar { height: 10px; border-radius: 5px; }
  .legend .ends { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); font-family: var(--mono); margin-top: 3px; }
  .swatchrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .swatch { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .swatch i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .catlist { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; max-height: 260px; overflow-y: auto; }
  .catrow { display: flex; align-items: center; gap: 7px; }
  .catrow input[type=color] { width: 22px; height: 22px; flex: none; }
  .catrow input[type=text] {
    flex: 1; min-width: 0; border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 7px; font-size: 11.5px; color: var(--text); background: var(--panel-2);
  }
  .catrow .catcount { flex: none; font-size: 10px; color: var(--faint); font-family: var(--mono); }

  /* multidim dataset section (variable + dim selectors) */
  .md-section.busy { opacity: .6; }
  .md-btn {
    flex: none; width: 26px; height: 24px; border: 1px solid var(--border-2);
    border-radius: 6px; background: var(--panel); color: var(--muted); padding: 0;
    font-size: 10px; display: flex; align-items: center; justify-content: center;
  }
  .md-btn:hover { color: var(--text); border-color: var(--accent); }
  .md-btn.on { color: var(--accent); border-color: #5f730055; background: var(--accent-soft); }
  .md-btn:disabled { opacity: .45; cursor: default; }
  .md-dim select { margin-bottom: 6px; }
  .md-row { gap: 4px; align-items: center; }
  .md-row input[type=range] { flex: 1; min-width: 0; }
  .md-axes { margin-top: 10px; font-size: 11px; color: var(--muted); font-family: var(--mono); }

  /* right-docked style panel */
  #stylepanel {
    flex: none; width: 320px; min-width: 0; background: var(--panel);
    border-left: 1px solid var(--border); display: flex; flex-direction: column;
    min-height: 0; position: relative;
  }
  #stylepanel.hidden { display: none !important; }
  .sp-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .sp-head .sp-nm { font-weight: 620; font-size: 13px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sp-head .x, .cp-head .x { background: transparent; border: 0; color: var(--faint); font-size: 18px; line-height: 1; }
  .sp-head .x:hover, .cp-head .x:hover { color: var(--text); }
  .sp-body { flex: 1; overflow-y: auto; min-height: 0; padding: 4px 14px 16px; }
  .sp-empty { color: var(--faint); text-align: center; padding: 24px 14px; font-size: 12.5px; line-height: 1.6; }

  /* right-docked code editor */
  #codepanel {
    flex: none; width: 460px; min-width: 0; background: var(--panel);
    border-left: 1px solid var(--border); display: flex; flex-direction: column;
    min-height: 0; position: relative;
  }
  #codepanel.hidden { display: none !important; }
  .cp-head { display: flex; align-items: center; gap: 8px; padding: 11px 14px; border-bottom: 1px solid var(--border); }
  .cp-head .fn { font-family: var(--mono); font-size: 12px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cp-head .lang { font-size: 9.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); border: 1px solid var(--border-2); border-radius: 5px; padding: 1px 5px; }
  .cp-head .lang:empty { display: none; }
  .cp-body { flex: 1; overflow: auto; min-height: 0; }
  .cp-empty, .cp-note { color: var(--faint); padding: 22px 16px; font-size: 12.5px; line-height: 1.6; }
  .cp-note { color: var(--muted); font-family: var(--mono); white-space: pre-wrap; word-break: break-all; }
  .cp-code { display: flex; min-width: min-content; }
  .cp-code .gutter { flex: none; text-align: right; padding: 12px 8px 12px 12px; color: var(--faint); font-family: var(--mono); font-size: 12px; line-height: 1.55; white-space: pre; user-select: none; border-right: 1px solid var(--border); background: var(--panel); position: sticky; left: 0; }
  .cp-code pre { margin: 0; }
  .cp-code code { font-family: var(--mono); font-size: 12px; line-height: 1.55; display: block; padding: 12px 14px; tab-size: 4; background: transparent; color: var(--text); }
  /* light highlight.js palette (replaces the dark vendor theme) */
  .hljs { background: transparent; color: var(--text); }
  .hljs-comment, .hljs-quote { color: #9ca3af; font-style: italic; }
  .hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-section { color: #7c3aed; }
  .hljs-string, .hljs-regexp, .hljs-addition { color: #15803d; }
  .hljs-number, .hljs-symbol, .hljs-bullet { color: #b45309; }
  .hljs-title, .hljs-name, .hljs-function .hljs-title { color: #2563eb; }
  .hljs-built_in, .hljs-type, .hljs-class .hljs-title { color: #0e7490; }
  .hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable { color: #b91c1c; }
  .hljs-meta, .hljs-deletion { color: #6b7280; }
  /* drag handle to resize a right-anchored panel */
  .resizer { position: absolute; top: 0; left: -3px; width: 8px; height: 100%; cursor: col-resize; z-index: 8; }
  .resizer:hover { background: linear-gradient(90deg, transparent, #5f730033); }

  /* attribution + coords + toast */
  #attr {
    position: absolute; left: 12px; bottom: 10px; z-index: 5; font-size: 11px; color: var(--faint);
    background: rgba(255,255,255,.75); padding: 3px 9px; border-radius: 6px; pointer-events: none;
  }
  #attr b { color: var(--muted); }
  #coordpill {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 5;
    background: rgba(255,255,255,.85); border: 1px solid var(--border); border-radius: 999px;
    padding: 3px 11px; font-family: var(--mono); font-size: 11px; color: var(--muted);
    pointer-events: none; white-space: nowrap;
  }
  #toast {
    position: absolute; left: 50%; bottom: 48px; transform: translateX(-50%); z-index: 20;
    max-width: 560px; background: var(--panel); border: 1px solid var(--border);
    border-left: 3px solid var(--accent); border-radius: 10px; padding: 11px 14px;
    box-shadow: var(--shadow); font-size: 12.5px; line-height: 1.5;
    display: flex; gap: 10px; align-items: flex-start;
  }
  #toast.warn { border-left-color: var(--warn); }
  #toast.bad { border-left-color: var(--bad); }
  #toast .tx { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  #toast .tx b { display: block; margin-bottom: 2px; }
  #toast .tclose { flex: none; background: transparent; border: 0; color: var(--faint); font-size: 16px; line-height: 1; cursor: pointer; }
  .hidden { display: none !important; }
  .mono { font-family: var(--mono); }
  #boot-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; z-index: 30; }

  #dropzone {
    position: absolute; inset: 10px; z-index: 40; display: flex; align-items: center; justify-content: center;
    border: 2px dashed var(--accent); border-radius: var(--r); background: rgba(95,115,0,.08);
    color: var(--accent); font-size: 15px; font-weight: 600; pointer-events: none;
  }
  #dropzone.hidden { display: none; }

  /* ---- additions for the document-driven viewer ------------------------- */
  .fm-hidden-control { display: none !important; }
  .lidar-control-panel { display: none !important; }
  .pc-classes { display: flex; flex-direction: column; max-height: 220px; overflow: auto; }
  .pc-classes .chk { margin-top: 6px; }
  .pc-sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .pc-allnone { gap: 6px; margin-top: 8px; }
  .pc-allnone button, .pc-tilt { flex: 1; width: auto; height: 26px; padding: 0 10px; font-size: 12px; }
  .pc-tilt { width: 100%; margin-top: 12px; }
  .lc-msg.bad { color: var(--bad); }
  .lc-msg.note { color: var(--faint); }
  .chk { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text); margin-top: 10px; }
  .chk input { margin: 0; accent-color: var(--accent); }
  .sp-sec { margin-top: 16px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 10.5px; font-weight: 640; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .sp-sec:first-child { border-top: 0; margin-top: 6px; }
  .band-row { display: flex; gap: 6px; }
  .band-row select { flex: 1; min-width: 0; }
  .maplibregl-popup-content { font: 12px var(--font); padding: 8px 10px; max-height: 260px; overflow: auto; }
  .px-table { border-collapse: collapse; font: 11px var(--mono); }
  .px-table td { padding: 1px 6px 1px 0; }
  .px-table td:first-child { color: var(--muted); }
</style>

  <main id="mapwrap">

    <div id="dropzone" class="hidden">Drop files to add as layers</div>

        </span>

<!-- The map document and its commands — the twin of map_doc.py, kept free of
     the DOM so tests/test_map_doc_parity.py can run it under node against the
     same cases as the Python. Edit the two together. -->
<script id="map-doc-core">
"use strict";
(function (root) {
  const DOC_TYPE = "fused-map", DOC_VERSION = 1;
  const BASEMAPS = ["light", "dark", "sat", "none"];
  const KINDS = ["auto", "raster", "vector", "zarr", "pmtiles", "pointcloud"];
  const STYLE_KEYS = {
    raster: {
      mode: "enum:rgb|single|palette|index", bands: "int[]", colormap: "str",
      reversed: "bool", rescale: "range", nodata: "nodata", gamma: "num",
      stretch: "enum:linear|sqrt|log",
    },
    vector: {
      fill_color: "color", fill_opacity: "unit", line_color: "color",
      line_width: "num", circle_color: "color", circle_radius: "num",
      circle_opacity: "unit", point_mode: "enum:circle|heatmap|cluster",
      color_by: "str", color_mode: "enum:graduated|categorized",
      colormap: "str", label_field: "str",
    },
    zarr: { colormap: "str", reversed: "bool", clim: "range" },
    pmtiles: {
      fill_color: "color", fill_opacity: "unit", line_color: "color",
      line_width: "num", circle_color: "color", circle_radius: "num",
    },
    pointcloud: {
      color_scheme: "enum:elevation|intensity|classification|rgb", colormap: "str",
      point_size: "num", clim: "range", elevation_range: "range", hidden_classes: "codes",
      z_offset: "num",
    },
  };
  const OPTION_KEYS = { variable: "str", selector: "dict", source_layer: "str", crs: "str" };
  const HEX = /^#[0-9a-fA-F]{6}([0-9a-fA-F]{2})?$/;

  class MapDocError extends Error {}
  const fail = message => { throw new MapDocError(message); };
  const isNum = v => typeof v === "number" && Number.isFinite(v);
  const isObj = v => v !== null && typeof v === "object" && !Array.isArray(v);
  const clone = v => JSON.parse(JSON.stringify(v));

  function newDoc(title = "") {
    return { type: DOC_TYPE, version: DOC_VERSION, title, basemap: "light",
             view: { center: [0, 20], zoom: 1.5, bearing: 0, pitch: 0 }, layers: [] };
  }
  const isDoc = v => isObj(v) && v.type === DOC_TYPE;

  function check(where, rule, value) {
    let ok = false;
    const pair = v => Array.isArray(v) && v.length === 2 && v.every(isNum) && v[0] < v[1];
    if (rule === "str") ok = typeof value === "string" && value !== "";
    else if (rule === "bool") ok = typeof value === "boolean";
    else if (rule === "num") ok = isNum(value);
    else if (rule === "unit") ok = isNum(value) && value >= 0 && value <= 1;
    else if (rule === "color") ok = typeof value === "string" && HEX.test(value);
    else if (rule === "int[]") ok = Array.isArray(value) && value.length >= 1 && value.length <= 4
      && value.every(v => Number.isInteger(v) && v >= 1);
    else if (rule === "codes") ok = Array.isArray(value) && value.length <= 256
      && value.every(v => Number.isInteger(v) && v >= 0 && v <= 255);
    else if (rule === "range") ok = pair(value) || (Array.isArray(value) && value.length >= 1
      && value.length <= 4 && value.every(pair));
    else if (rule === "nodata") ok = value === "auto" || value === "off" || isNum(value);
    else if (rule === "dict") ok = isObj(value);
    else if (rule.startsWith("enum:")) ok = rule.slice(5).split("|").includes(value);
    if (!ok) {
      const expected = rule.startsWith("enum:") ? rule.slice(5).split("|").join(" or ") : rule;
      fail(`${where}: ${JSON.stringify(value)} is not a valid ${expected}`);
    }
    return value;
  }

  function merge(where, current, patch, rules) {
    if (!isObj(patch)) fail(`${where} must be an object`);
    const out = Object.assign({}, current);
    for (const [key, value] of Object.entries(patch)) {
      if (!(key in rules)) fail(`${where}: unknown key ${JSON.stringify(key)} (known: ${Object.keys(rules).sort().join(", ")})`);
      if (value === null) delete out[key];
      else out[key] = check(`${where}.${key}`, rules[key], value);
    }
    return out;
  }

  function styleRules(kind) {
    if (kind !== "auto") return STYLE_KEYS[kind];
    return Object.assign({}, ...Object.values(STYLE_KEYS));
  }

  // A URL's query and fragment are dropped first, so a signed URL's token
  // never becomes part of a layer's name or id (map_doc._basename agrees).
  const basename = text => {
    let s = String(text);
    if (s.includes("://")) s = s.split(/[?#]/)[0];
    return s.replace(/[\\/]+$/, "").split(/[\\/]/).pop() || s;
  };
  function slug(text) {
    const base = basename(text).replace(/\.[A-Za-z0-9]+$/, "");
    const s = base.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "")
      .slice(0, 40).replace(/^-+|-+$/g, "");
    return s || "layer";
  }
  function uniqueId(doc, wanted) {
    const taken = new Set(doc.layers.map(l => l.id));
    if (!taken.has(wanted)) return wanted;
    let n = 2;
    while (taken.has(`${wanted}-${n}`)) n += 1;
    return `${wanted}-${n}`;
  }
  function find(doc, id) {
    const index = doc.layers.findIndex(l => l.id === id);
    if (index < 0) fail(`no layer ${JSON.stringify(id)} (layers: ${doc.layers.map(l => l.id).join(", ") || "none"})`);
    return index;
  }

  function viewPatch(view, cmd) {
    const out = Object.assign({}, view);
    if ("bounds" in cmd) {
      const b = cmd.bounds;
      if (!(Array.isArray(b) && b.length === 4 && b.every(isNum) && b[0] < b[2] && b[1] < b[3]))
        fail("bounds must be [west, south, east, north]");
      out.bounds = b.slice();
    }
    if ("center" in cmd) {
      const c = cmd.center;
      if (!(Array.isArray(c) && c.length === 2 && c.every(isNum) && c[0] >= -180 && c[0] <= 180
            && c[1] >= -90 && c[1] <= 90)) fail("center must be [longitude, latitude]");
      out.center = c.slice();
      delete out.bounds;
    }
    for (const [key, lo, hi] of [["zoom", 0, 24], ["bearing", -360, 360], ["pitch", 0, 85]]) {
      if (key in cmd) {
        const v = cmd[key];
        if (!(isNum(v) && v >= lo && v <= hi)) fail(`${key} must be a number in [${lo}, ${hi}]`);
        out[key] = v;
        if (key === "zoom") delete out.bounds;
      }
    }
    return out;
  }

  const COMMANDS = {
    add_layer(doc, cmd) {
      let source = cmd.source;
      if (typeof source !== "string" || !source.trim()) fail("add_layer needs a source (a file path or URL)");
      source = source.trim();
      const kind = cmd.kind ?? "auto";
      if (!KINDS.includes(kind)) fail(`kind must be one of ${KINDS.join(", ")}`);
      const name = cmd.name || basename(source);
      if (typeof name !== "string") fail("name must be a string");
      let id;
      if (cmd.id != null) {
        if (!(typeof cmd.id === "string" && /^[a-z0-9][a-z0-9-]{0,63}$/.test(cmd.id)))
          fail("id must be lowercase letters, digits and dashes");
        if (doc.layers.some(l => l.id === cmd.id)) fail(`a layer ${JSON.stringify(cmd.id)} already exists`);
        id = cmd.id;
      } else id = uniqueId(doc, slug(name));
      const layer = {
        id, name, source, kind, visible: true, opacity: 1,
        style: merge("style", {}, cmd.style ?? {}, styleRules(kind)),
        options: merge("options", {}, cmd.options ?? {}, OPTION_KEYS),
      };
      if ("visible" in cmd) layer.visible = check("visible", "bool", cmd.visible);
      if ("opacity" in cmd) layer.opacity = check("opacity", "unit", cmd.opacity);
      doc.layers.push(layer);
      return { id };
    },
    remove_layer(doc, cmd) {
      doc.layers.splice(find(doc, cmd.id), 1);
      return { id: cmd.id };
    },
    update_layer(doc, cmd) {
      const layer = doc.layers[find(doc, cmd.id)];
      if ("kind" in cmd) {
        if (!KINDS.includes(cmd.kind)) fail(`kind must be one of ${KINDS.join(", ")}`);
        layer.kind = cmd.kind;
        const rules = styleRules(layer.kind);
        layer.style = Object.fromEntries(Object.entries(layer.style).filter(([k]) => k in rules));
      }
      if ("name" in cmd) layer.name = check("name", "str", cmd.name);
      if ("visible" in cmd) layer.visible = check("visible", "bool", cmd.visible);
      if ("opacity" in cmd) layer.opacity = check("opacity", "unit", cmd.opacity);
      if ("style" in cmd) layer.style = merge("style", layer.style, cmd.style, styleRules(layer.kind));
      if ("options" in cmd) layer.options = merge("options", layer.options, cmd.options, OPTION_KEYS);
      return { id: layer.id };
    },
    move_layer(doc, cmd) {
      const index = find(doc, cmd.id), last = doc.layers.length - 1;
      let target;
      if ("index" in cmd) {
        if (!Number.isInteger(cmd.index)) fail("index must be an integer (0 = bottom)");
        target = Math.max(0, Math.min(last, cmd.index));
      } else if (["top", "bottom", "up", "down"].includes(cmd.to)) {
        target = { top: last, bottom: 0, up: Math.min(last, index + 1), down: Math.max(0, index - 1) }[cmd.to];
      } else fail("move_layer needs index, or to: top|bottom|up|down");
      const [layer] = doc.layers.splice(index, 1);
      doc.layers.splice(target, 0, layer);
      return { id: layer.id, index: target };
    },
    set_view(doc, cmd) {
      if (!["center", "zoom", "bearing", "pitch", "bounds"].some(k => k in cmd))
        fail("set_view needs center, zoom, bearing, pitch or bounds");
      doc.view = viewPatch(doc.view, cmd);
      return { view: doc.view };
    },
    set_basemap(doc, cmd) {
      if (!BASEMAPS.includes(cmd.basemap)) fail(`basemap must be one of ${BASEMAPS.join(", ")}`);
      doc.basemap = cmd.basemap;
      return { basemap: cmd.basemap };
    },
    set_title(doc, cmd) {
      if (typeof cmd.title !== "string") fail("title must be a string");
      doc.title = cmd.title;
      return { title: cmd.title };
    },
    clear_layers(doc) {
      const removed = doc.layers.length;
      doc.layers = [];
      return { removed };

/* ---- reconcile ------------------------------------------------------------------ */

/* ---- camera ---------------------------------------------------------------------- */

/* ---- persistence ------------------------------------------------------------------ */

  if (p.total_files > 1) return `Downloading ${p.done_files.toLocaleString()} of ${p.total_files.toLocaleString()} files · ${formatBytes(p.done_bytes)}`;

                  options: layer.options, status: r.status || "loading", loaded_as: r.engine || null,

/* ---- inspect on click ------------------------------------------------------------------ */
// A vector feature opens the vector engine's own popup; otherwise report the
// value under the cursor from the top visible raster or Zarr layer.
let pixelPopup = null;
map.on("click", async event => {
  const vectorIds = new Set();
  for (const r of runtime.values()) if (r.engine === "vector" && r.status === "ready") ownedLayerIds(r).forEach(id => vectorIds.add(id));
  const hit = vectorIds.size && map.queryRenderedFeatures(event.point).some(f => vectorIds.has(f.layer.id));
  if (hit) return;
  const { lng, lat } = event.lngLat;
  for (const layer of doc.layers.slice().reverse()) {
    const r = runtime.get(layer.id);
    if (!layer.visible || !r || r.status !== "ready") continue;
    const b = ENGINES[r.engine].bounds(r);
    if (b && (lng < b[0] || lng > b[2] || lat < b[1] || lat > b[3])) continue;
    let rows = null;
    try {
      if (r.engine === "raster") {
        const rl = raster.info(r);
        const reading = rl && rl.geotiff && await M.readPixelValues(rl.geotiff, [lng, lat], { bandNames: rl.bandNames });
        if (reading) rows = reading.bands.map(bd => [bd.name || `Band ${bd.index}`, bd.isNodata ? "nodata" : fmtNum(bd.value)]);
      } else if (r.engine === "zarr" && r.zl.queryData) {
        const out = await r.zl.queryData({ type: "Point", coordinates: [lng, lat] });
        const v = out && (Array.isArray(out) ? out[0] : out[r.variable] ?? Object.values(out)[0]);
        const value = Array.isArray(v) ? v[0] : v;
        if (value != null) rows = [[r.variable, fmtNum(value)]];
      }
    } catch (error) { console.warn("[map] inspect", error); }
    if (!rows) continue;
    if (pixelPopup) pixelPopup.remove();
    pixelPopup = new maplibregl.Popup({ closeButton: true, maxWidth: "280px" })
      .setLngLat([lng, lat])
      .setHTML(`<b>${esc(layer.name)}</b><table class="px-table">${rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table>`)
      .addTo(map);
    return;
  }
});

const state = { dir: P.get("dir") || "" };
function addSource(value, name) {
  const source = normalizeTarget(value);
  if (!source) return null;
  const existing = doc.layers.find(l => l.source === source);
  if (existing) { selectLayer(existing.id); fitLayer(existing.id); return existing.id; }
  const result = tryExecute({ op: "add_layer", source, ...(name ? { name } : {}) }, { fit: true });
  if (result) { refreshCode(); showStylePanel(); }
  return result && result.id;
}

// `pick` is set while the browser is choosing a folder (a download's
// destination) rather than a file to open: { resolve, label }.
const browserState = { dir: "", parent: "", entries: [], roots: [], selected: null, history: [], historyIndex: -1, pick: null };
function renderBrowserFooter() {
  const pick = browserState.pick;
  if (pick) {
    qs("fb-selection").textContent = browserState.dir ? `${pick.label} → ${browserState.dir}` : "Choose a folder.";
    qs("fb-open").textContent = "Download here";
    qs("fb-open").disabled = !browserState.dir;
  } else {
    qs("fb-selection").textContent = browserState.selected ? browserState.selected.path : "Select a supported data file.";
    qs("fb-open").textContent = "Open";
    qs("fb-open").disabled = !browserState.selected;
  }
}
function renderBrowserNavigation() {
  qs("fb-path").value = browserState.dir || "";
  qs("fb-back").disabled = browserState.historyIndex <= 0;
  qs("fb-up").disabled = !browserState.parent || browserState.parent === browserState.dir;
}
function renderBrowserPlaces() {
  const box = qs("fb-places");
  box.innerHTML = "";
  for (const place of browserState.roots) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "fb-place" + (place.path === browserState.dir ? " on" : "");
    b.innerHTML = `<span>${place.kind === "home" ? "⌂" : place.kind === "drive" ? "▣" : "◫"}</span><span>${esc(place.name)}</span>`;
    b.onclick = () => browseTo(place.path);
    box.appendChild(b);
  }
}
function selectBrowserEntry(entry) {
  if (!entry || !entry.selectable || browserState.pick) return;
  browserState.selected = entry;
  renderBrowserFooter();
  renderBrowserEntries();
}
function openBrowserSelection() {
  if (browserState.pick) {
    const { resolve } = browserState.pick, dir = browserState.dir;
    browserState.pick = null;
    closeFileBrowser();
    resolve(dir || null);
    return;
  }
  const entry = browserState.selected;
  if (!entry || !entry.selectable) return;
  closeFileBrowser();
  openEntry(entry.path, entry.name);
}
// A .fmap picked in the browser opens AS the map; anything else is a layer.
function openEntry(path, name) {
  if (extOf(path) === ".fmap") { openDocument(path); return; }
  addSource(path, name);
}
function renderBrowserEntries() {
  if (qs("file-modal").classList.contains("hidden")) return;
  const box = qs("fb-list");
  const filter = qs("fb-search").value.trim().toLowerCase();
  box.innerHTML = "";
  const items = browserState.entries.filter(e => !filter || e.name.toLowerCase().includes(filter));
  if (!items.length) {
    box.innerHTML = `<div class="empty-note">${filter ? "No matching files or folders." : "This folder is empty."}</div>`;
    return;
  }

    const onMap = doc.layers.some(l => l.source === entry.path);
    const row = document.createElement("div");
    const chosen = browserState.selected && browserState.selected.path === entry.path;
    // Choosing a folder: files are shown for orientation but can't be picked.
    const inert = browserState.pick && entry.kind !== "dir";
    row.className = "file" + (entry.kind === "dir" ? " folder" : "") + (chosen ? " selected" : "") + (inert ? " disabled" : "");
    row.setAttribute("role", "option");
    row.tabIndex = 0;
    row.title = entry.path;
    const detail = entry.kind === "dir" ? "›" : onMap ? "on map" : formatBytes(entry.size) || entry.ext;
    row.innerHTML = `<span class="ic">${KIND_ICON[entry.kind] || KIND_ICON.other}</span><span class="nm"></span><span class="kd">${esc(detail)}</span>`;
    row.querySelector(".nm").textContent = entry.name;
    const activate = () => entry.kind === "dir" ? browseTo(entry.path)
      : inert ? null : (selectBrowserEntry(entry), openBrowserSelection());
    row.onclick = () => { if (entry.kind !== "dir") selectBrowserEntry(entry); };
    row.ondblclick = activate;

}
// Listings can overlap (the opening listing of the start folder is still in
// flight when someone types a path and hits Go); only the latest may land.
let browseSeq = 0;
async function browseTo(rawPath, addHistory = true) {
  const requested = normalizeTarget(rawPath);
  if (isRemote(requested)) {
    if (browserState.pick) { qs("fb-error").textContent = "Choose a folder on this machine."; return false; }
    closeFileBrowser(); addSource(requested); return true;
  }
  qs("fb-error").textContent = "";
  const ticket = ++browseSeq;
  try {
    const result = await fused.runPython("./discover.py", { dir: requested });
    if (ticket !== browseSeq) return false;
    browserState.roots = result.roots || browserState.roots;
    if (result.error) { qs("fb-error").textContent = result.error; renderBrowserPlaces(); return false; }
    Object.assign(browserState, { dir: result.dir, parent: result.parent, entries: result.entries || [], selected: null });
    state.dir = result.dir;
    P.set("dir", result.dir);
    qs("fb-search").value = "";
    renderBrowserFooter();
    if (addHistory && browserState.history[browserState.historyIndex] !== result.dir) {
      browserState.history = browserState.history.slice(0, browserState.historyIndex + 1);
      browserState.history.push(result.dir);
      browserState.historyIndex = browserState.history.length - 1;
    }
    renderBrowserNavigation(); renderBrowserPlaces(); renderBrowserEntries();
    if (result.selected) {
      if (browserState.pick) {
        qs("fb-error").textContent = "That is a file — choose the folder to download into.";
        return false;
      }
      if ((result.selected_kind || "other") === "other") {
        qs("fb-error").textContent = "This file type is not supported by Map Viewer.";
        return false;
      }
      closeFileBrowser();
      openEntry(result.selected);
    }
    return true;
  } catch (error) {
    if (ticket !== browseSeq) return false;
    qs("fb-error").textContent = `Could not browse this location: ${error.message}`;
    return false;
  }
}
async function openFileBrowser() {
  qs("fb-title").textContent = browserState.pick ? browserState.pick.title : "Open data file";
  qs("file-modal").classList.remove("hidden");
  renderBrowserFooter();
  await browseTo(state.dir || "", browserState.history.length === 0);
  qs("fb-path").focus(); qs("fb-path").select();
}
function closeFileBrowser() {
  qs("file-modal").classList.add("hidden");
  browserState.selected = null;
  // Closed without choosing: a pending folder pick resolves to nothing.
  if (browserState.pick) { const { resolve } = browserState.pick; browserState.pick = null; resolve(null); }
}
// The file browser as a folder chooser. Resolves to the chosen directory, or
// null when the browser is closed.
function pickFolder(title, label) {
  if (browserState.pick) browserState.pick.resolve(null);
  return new Promise(resolve => {
    browserState.pick = { resolve, title, label };
    openFileBrowser();
  });
}

qs("btn-browse-files").onclick = () => { if (browserState.pick) closeFileBrowser(); openFileBrowser(); };

qs("fb-back").onclick = async () => {

qs("btn-code").onclick = () => { const show = qs("codepanel").classList.contains("hidden"); setPanel("codepanel", "btn-code", show); if (show) refreshCode(); };
qs("cp-close").onclick = () => setPanel("codepanel", "btn-code", false);
qs("btn-style").onclick = () => { const show = qs("stylepanel").classList.contains("hidden"); setPanel("stylepanel", "btn-style", show); if (show) renderStyleDock(); };
qs("sp-close").onclick = () => setPanel("stylepanel", "btn-style", false);
function refreshCode() {
  if (!qs("codepanel").classList.contains("hidden")) updateCodeViewer();
}
async function updateCodeViewer() {
  const body = qs("cp-body"), fnEl = qs("cp-fn"), langEl = qs("cp-lang");
  const layer = selected && docLayer(selected);
  if (!layer) {
    // No layer picked: show the map document itself — the thing an agent edits.
    fnEl.textContent = docPath ? MapDoc.basename(docPath) : "map";
    langEl.textContent = "json";
    body.innerHTML = "";
    body.appendChild(codeBlock(docText(), "json"));
    return;
  }
  const path = layer.source, name = MapDoc.basename(path);
  fnEl.textContent = name; fnEl.title = path;
  const ext = extOf(path).slice(1);
  const r = runtime.get(layer.id);
  if (!TEXT_EXT.includes(ext) || isRemote(path) || (r && r.engine && ext !== "py")) {
    langEl.textContent = (r && r.engine) || ext || "data";
    body.innerHTML = `<div class="cp-note"></div>`;
    body.firstChild.textContent = JSON.stringify(layerFacts(layer), null, 2);
    return;
  }
  langEl.textContent = ext;
  body.innerHTML = `<div class="cp-empty">Loading…</div>`;
  try {
    const text = await fused.readFile(path);
    body.innerHTML = "";
    body.appendChild(codeBlock(text.length > 400000 ? text.slice(0, 400000) + "\n…" : text, LANG_ALIAS[ext] || ext));
  } catch (error) {
    body.innerHTML = `<div class="cp-note"></div>`;
    body.firstChild.textContent = "Couldn't read file:\n" + error.message;
  }
}
function codeBlock(text, lang) {
  const code = document.createElement("code");
  code.className = "language-" + lang;
  code.textContent = text;
  if (window.hljs && text.length < 200000) { try { window.hljs.highlightElement(code); } catch (_) {} }
  const wrap = document.createElement("div"); wrap.className = "cp-code";
  const gutter = document.createElement("div"); gutter.className = "gutter";
  gutter.textContent = Array.from({ length: text.split("\n").length }, (_, i) => i + 1).join("\n");
  const pre = document.createElement("pre"); pre.appendChild(code);
  wrap.append(gutter, pre);
  return wrap;
}
function makeResizable(panel, handle, rightEdge, min, max) {
  let dragging = false;
  handle.addEventListener("pointerdown", e => { dragging = true; try { handle.setPointerCapture(e.pointerId); } catch (_) {} document.body.style.cursor = "col-resize"; e.preventDefault(); });
  handle.addEventListener("pointermove", e => { if (!dragging) return; panel.style.width = Math.max(min, Math.min(max, rightEdge() - e.clientX)) + "px"; map.resize(); });
  const end = e => { if (!dragging) return; dragging = false; try { handle.releasePointerCapture(e.pointerId); } catch (_) {} document.body.style.cursor = ""; map.resize(); };
  handle.addEventListener("pointerup", end);
  handle.addEventListener("pointercancel", end);
}
makeResizable(qs("codepanel"), qs("cp-resizer"), () => window.innerWidth, 320, 900);
makeResizable(qs("stylepanel"), qs("sp-resizer"), () => qs("stylepanel").getBoundingClientRect().right, 260, 560);

let geoTimer = null;
qs("geoinput").oninput = e => {
  clearTimeout(geoTimer);
  const q = e.target.value.trim();

async function geocode(q) {
  const box = qs("georesults");
  box.innerHTML = `<div class="geores none">Searching…</div>`;
  try {
    const response = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=6`);
    const features = (await response.json()).features || [];
    if (!features.length) { box.innerHTML = `<div class="geores none">No matches.</div>`; return; }
    box.innerHTML = "";
    for (const f of features) {
      const p = f.properties || {}, c = f.geometry.coordinates;
      const row = document.createElement("div"); row.className = "geores";
      row.innerHTML = `<div class="g1">${esc(p.name || p.street || p.city || "Result")}</div><div class="g2">${esc([p.city, p.state, p.country].filter(Boolean).join(", "))}</div>`;
      row.onclick = () => {
        if (p.extent) { const [w, n, e2, s] = p.extent; map.fitBounds([[w, s], [e2, n]], { padding: 60, maxZoom: 15, duration: 900 }); }
        else map.flyTo({ center: c, zoom: 13, duration: 900 });
        qs("geobox").classList.add("hidden"); qs("btn-search").classList.remove("on");
      };
      box.appendChild(row);
    }
  } catch (_) { box.innerHTML = `<div class="geores none">Geocoding failed (offline?).</div>`; }
}
const coordText = (lat, lng) => `${lat.toFixed(4)}, ${lng.toFixed(4)}  z${map.getZoom().toFixed(1)}`;
map.on("mousemove", e => { qs("coords").textContent = coordText(e.lngLat.lat, e.lngLat.lng); });
map.on("mouseout", () => { const c = map.getCenter(); qs("coords").textContent = coordText(c.lat, c.lng); });

/* ---- drag and drop ------------------------------------------------------------------ */
// Dropped files are uploaded next to the folder being browsed, or into a
// private staging directory (discover.py prunes it) when none is.
let dropsDirPromise = null;
async function resolveUploadDir() {
  if (state.dir) return state.dir;
  if (!dropsDirPromise) {
    dropsDirPromise = fused.runPython("./discover.py", { action: "drops_dir" })
      .then(result => { if (result.error) throw new Error(result.error); return result.dir || ""; })
      .catch(error => { dropsDirPromise = null; throw error; });
  }
  return dropsDirPromise;
}
const joinPath = (dir, name) => dir.replace(/[\\/]+$/, "") + (dir.includes("\\") && !dir.includes("/") ? "\\" : "/") + name;
const SIDECARS = [".shx", ".dbf", ".prj", ".cpg", ".sbn", ".sbx", ".shp.xml", ".qix", ".qpj", ".aux.xml", ".ovr", ".tfw", ".tifw", ".wld"];
const isSidecar = name => SIDECARS.some(ext => name.toLowerCase().endsWith(ext));
// Split at the FIRST dot so farms.shp and farms.shx keep sharing a stem when a
// collision suffix goes in.
const splitName = name => { const dot = name.indexOf(".", 1); return dot > 0 ? [name.slice(0, dot), name.slice(dot)] : [name, ""]; };
async function isFree(path) { try { await fused.stat(path); return false; } catch (_) { return true; } }
async function destinations(dir, group) {
  let candidate = group.map(f => joinPath(dir, f.name));
  for (let i = 1; i <= 100; i++) {
    if ((await Promise.all(candidate.map(isFree))).every(Boolean)) break;
    candidate = group.map(f => { const [stem, rest] = splitName(f.name); return joinPath(dir, `${stem} (${i})${rest}`); });
  }
  return candidate;
}
async function importDropped(files) {
  let dir;
  try { dir = await resolveUploadDir(); } catch (error) { toast("bad", "Couldn't drop files", error.message); return; }
  if (!dir) { toast("bad", "Couldn't drop files", "No destination folder available."); return; }
  const groups = new Map();
  for (const f of files) {
    const key = splitName(f.name)[0].toLowerCase();
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(f);
  }
  for (const group of groups.values()) {
    try {
      const dests = await destinations(dir, group);
      for (let i = 0; i < group.length; i++) await fused.uploadFile(dests[i], group[i]);
      group.forEach((f, i) => { if (!isSidecar(f.name)) openEntry(dests[i]); });
    } catch (error) {
      toast("bad", "Couldn't add " + group.map(f => f.name).join(", "), error.message);
    }
  }
}
{
  const wrap = qs("mapwrap"), zone = qs("dropzone");
  let depth = 0;
  const hasFiles = e => e.dataTransfer && e.dataTransfer.types.includes("Files");
  wrap.addEventListener("dragenter", e => { if (!hasFiles(e)) return; e.preventDefault(); depth++; zone.classList.remove("hidden"); });
  wrap.addEventListener("dragover", e => { if (hasFiles(e)) e.preventDefault(); });
  wrap.addEventListener("dragleave", () => { depth = Math.max(0, depth - 1); if (!depth) zone.classList.add("hidden"); });
  wrap.addEventListener("drop", e => {
    if (!hasFiles(e)) return;
    e.preventDefault(); depth = 0; zone.classList.add("hidden");
    importDropped([...e.dataTransfer.files]);
  });
}

/* ---- toast ------------------------------------------------------------------ */
let toastTimer = null;
function toast(kind, title, message) {
  const t = qs("toast");
  t.className = kind === "warn" ? "warn" : kind === "bad" ? "bad" : "";
  t.innerHTML = `<div class="tx"><b>${esc(title)}</b>${message ? `<span>${esc(String(message).slice(0, 300))}</span>` : ""}</div><button class="tclose">×</button>`;
  t.querySelector(".tclose").onclick = () => t.classList.add("hidden");
  clearTimeout(toastTimer);
  if (kind !== "bad") toastTimer = setTimeout(() => t.classList.add("hidden"), 6000);
}

/* ---- boot ------------------------------------------------------------------ */
async function openDocument(path) {
  docPath = path;
  // The file is polled and reconciled in place; a full-page reload on every
  // change (ours included) would throw away the live map for nothing.
  fused.autoReload(false);
  P.set("doc", path);
  P.set("map", "");
  try {
    await pullDoc();
  } catch (error) {
    if (!/HTTP 404|not found|no such file/i.test(error.message)) {
      toast("bad", "Couldn't open the map document", error.message);
    }
    doc = MapDoc.newDoc(MapDoc.basename(path).replace(/\.fmap$/i, ""));
    lastSavedText = "";
    docMtime = null;
    requestReconcile();
  }
}
{
  const file = normalizeTarget(P.get("_file"));
  const savedDoc = P.get("doc");
  if (file && extOf(file) === ".fmap") {
    await openDocument(file);
  } else if (savedDoc) {
    await openDocument(savedDoc);
  } else {
    const saved = P.get("map");
    if (saved) {
      try { doc = MapDoc.normalize(JSON.parse(saved)); } catch (error) { console.warn("[map] ignoring saved map", error); }
    } else {
      // The previous viewer's URL state: `open` (targets, bottom first),
      // `cam` (lat,lng,zoom) and `base`.
      const base = P.get("base");
      if (MapDoc.BASEMAPS.includes(base)) doc.basemap = base;
      const cam = (P.get("cam") || "").split(",").map(Number);
      if (cam.length === 3 && cam.every(Number.isFinite)) doc.view = { center: [cam[1], cam[0]], zoom: cam[2], bearing: 0, pitch: 0 };
      for (const encoded of (P.get("open") || "").split("~").filter(Boolean)) {
        try { doc = MapDoc.apply(doc, { op: "add_layer", source: decodeURIComponent(encoded) })[0]; } catch (_) {}
      }
      // A link that names layers but no camera should land on the data.
      if (doc.layers.length && !(cam.length === 3 && cam.every(Number.isFinite)))
        pendingFit.add(doc.layers[doc.layers.length - 1].id);
    }
    requestReconcile();
    if (file) addSource(file);
  }
  renderUi();
}

})().catch(error => {
  const el = document.getElementById("boot-msg");

});
