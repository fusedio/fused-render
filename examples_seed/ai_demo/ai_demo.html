<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Ask AI</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    max-width: 720px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e8eaed;
    background: #131417;
  }
  #ask {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  #prompt {
    flex: 1;
    padding: 8px 10px;
    font: inherit;
    color: inherit;
    background: #1b1d21;
    border: 1px solid #2a2d33;
    border-radius: 8px;
  }
  button {
    padding: 8px 16px;
    font: inherit;
    color: #131417;
    background: #e8eaed;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #answer {
    padding: 14px;
    min-height: 60px;
    white-space: pre-wrap;
    background: #1b1d21;
    border: 1px solid #2a2d33;
    border-radius: 8px;
  }
  #answer.error { color: #ff9b9b; border-color: #6b2a2a; }
  #meta { margin-top: 8px; color: #9aa0a6; font-size: 12px; }
</style>
</head>
<body>
  <form id="ask">
    <input id="prompt" type="text" placeholder="Ask anything…" autofocus />
    <button id="go" type="submit">Ask</button>
  </form>
  <div id="answer">The answer will appear here.</div>
  <div id="meta"></div>

  <script>
    const form = document.getElementById("ask");
    const promptEl = document.getElementById("prompt");
    const go = document.getElementById("go");
    const answer = document.getElementById("answer");
    const meta = document.getElementById("meta");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const prompt = promptEl.value.trim();
      if (!prompt) return;
      go.disabled = true;
      answer.classList.remove("error");
      answer.textContent = "Thinking…";
      meta.textContent = "";
      try {
        const res = await fused.ai(prompt, {
          systemPrompt: "Answer in a few sentences.",
          effort: "low",
        });
        answer.textContent = res.text;
        meta.textContent = res.model +
          (res.usage ? " · " + res.usage.completion_tokens + " tokens out" : "");
      } catch (err) {
        answer.classList.add("error");
        // "ai_unavailable" means the local AI proxy isn't running — the
        // message from the server names the URL it tried.
        answer.textContent = (err.type || "error") + ": " + err.message;
      } finally {
        go.disabled = false;
      }
    });
  </script>
</body>
</html>
