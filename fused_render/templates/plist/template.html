<!DOCTYPE html>
<html data-fused-theme="shell">
<head>
<meta charset="utf-8" />
<title>Property list preview</title>
<style>
  /* Appearance (SPEC §30, D134). The dark block below IS this view's
     historical palette, value for value; the light block is the new one.
     `data-theme` is written onto <html> by the injected runtime, which acts
     only because this document opted in via `data-fused-theme` on <html>
     (see fused_render/static/runtime.js) — dark stays the default for any
     document that never gets the attribute. */
  :root {
    color-scheme: dark;
    --fg: #e8eaed;
    --fg-muted: #9aa0a6;
    --bg: #131417;
    --error: #ff6b6b;
    --fg-dim: #6b7075;
    --skel-dot: #3a3d42;
    --skel-base: #23282e;
    --skel-shine: #2f353d;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --fg: #1f2023;
    --fg-muted: #61656c;
    --bg: #ffffff;
    --error: #c62828;
    --fg-dim: #7b8088;
    --skel-dot: #c9ccd2;
    --skel-base: #e7e9ed;
    --skel-shine: #dbdee4;
  }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 13px;
    color: var(--fg);
    background: var(--bg);
  }
  #frame { width: 100%; height: 100%; border: 0; display: block; }
  #status { padding: 24px; color: var(--fg-muted); }
  #status.error { color: var(--error); }
  /* Loading skeleton: shape mirrors the property-list tree the reader is about
     to render (indented key/value rows), since the real content is another
     template's JSON tree view embedded via iframe once conversion finishes. */
  .skel-tree { display: flex; flex-direction: column; gap: 11px; margin-bottom: 16px; }
  .skel-row { display: flex; align-items: center; gap: 8px; padding-left: calc(var(--indent, 0) * 18px); }
  .skel-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--skel-dot); flex: none; }
  .skel-bar {
    height: 11px;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--skel-base) 25%, var(--skel-shine) 50%, var(--skel-base) 75%);
    background-size: 200% 100%;
    animation: skel-shimmer 1.2s ease-in-out infinite;
    flex: none;
  }
  .skel-val { opacity: 0.7; }
  .skel-label { font-size: 12px; color: var(--fg-dim); }
  @keyframes skel-shimmer {
    from { background-position: 200% 0; }
    to { background-position: -200% 0; }
  }
</style>
</head>
<body>
  <div id="status">
    <div class="skel-tree" aria-hidden="true">
      <div class="skel-row" style="--indent:0">
        <span class="skel-dot"></span><span class="skel-bar" style="width:64px"></span>
        <span class="skel-bar skel-val" style="width:140px"></span>
      </div>
      <div class="skel-row" style="--indent:1">
        <span class="skel-dot"></span><span class="skel-bar" style="width:90px"></span>
        <span class="skel-bar skel-val" style="width:50px"></span>
      </div>
      <div class="skel-row" style="--indent:1">
        <span class="skel-dot"></span><span class="skel-bar" style="width:70px"></span>
        <span class="skel-bar skel-val" style="width:100px"></span>
      </div>
      <div class="skel-row" style="--indent:2">
        <span class="skel-dot"></span><span class="skel-bar" style="width:60px"></span>
        <span class="skel-bar skel-val" style="width:40px"></span>
      </div>
      <div class="skel-row" style="--indent:1">
        <span class="skel-dot"></span><span class="skel-bar" style="width:100px"></span>
        <span class="skel-bar skel-val" style="width:130px"></span>
      </div>
      <div class="skel-row" style="--indent:0">
        <span class="skel-dot"></span><span class="skel-bar" style="width:50px"></span>
        <span class="skel-bar skel-val" style="width:90px"></span>
      </div>
      <div class="skel-row" style="--indent:1">
        <span class="skel-dot"></span><span class="skel-bar" style="width:80px"></span>
        <span class="skel-bar skel-val" style="width:60px"></span>
      </div>
    </div>
    <div class="skel-label">Converting property list…</div>
  </div>
  <script>
    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // A plist (binary or XML) has no native browser renderer, so the reader
    // converts it to a temp JSON file; we then reuse the app's own JSON tree
    // viewer by stat-ing that file and embedding its /render, exactly like the
    // archive templates preview their inner files.
    async function load() {
      const statusEl = document.getElementById("status");
      const file = fused.params.get("_file");
      if (!file) {
        statusEl.className = "error";
        statusEl.textContent = "No file selected (missing _file param).";
        return;
      }
      try {
        const res = await fused.runPython("./reader.py", { file, action: "convert" });
        const tmp = res.path;
        const st = await fused.stat(tmp);
        const t = st.templates && st.templates[0];
        const src = !t || t.mode === "_render"
          ? `/render?path=${encodeURIComponent(tmp)}`
          : `/render?path=${encodeURIComponent(t.path)}&_file=${encodeURIComponent(tmp)}`;
        const frame = document.createElement("iframe");
        frame.id = "frame";
        frame.src = src;
        document.body.innerHTML = "";
        document.body.appendChild(frame);
      } catch (err) {
        statusEl.className = "error";
        statusEl.innerHTML = `<strong>${escapeHtml(err.type || "Error")}</strong>: ${escapeHtml(err.message || "")}`;
      }
    }

    load();
  </script>
</body>
</html>
