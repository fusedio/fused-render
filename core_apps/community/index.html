<!DOCTYPE html>
<html data-fused-theme="shell">
<head>
<meta charset="utf-8">
<title>Community</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #131417; --panel: #1b1d21; --text: #e8eaed; --muted: #9aa0a6;
    --line: #2a2d33; --accent: #E5FF44; --hover: #26282c; --on-accent: #10131a;
    --ok: #3fb950; --warn: #d9a679; --danger: #e58a80; --chip: #26282c;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff; --panel: #f4f5f7; --text: #1f2023; --muted: #61656c;
    --line: #d8dade; --accent: #5f7300; --hover: #e5e6e8; --on-accent: #ffffff;
    --ok: #1a7f37; --warn: #a15c1f; --danger: #b3261e; --chip: #e9eaec;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.5 -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 20px 24px 48px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  header h1 { font-size: 17px; margin: 0 auto 0 0; }
  .sub { color: var(--muted); margin: 0 0 14px; }
  input[type=search] { background: var(--panel); border: 1px solid var(--line);
    color: var(--text); border-radius: 7px; padding: 6px 10px; width: 240px; font: inherit; }
  button { background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 7px; padding: 5px 12px; font: inherit; cursor: pointer; }
  button:hover { background: var(--hover); }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button:disabled { opacity: 0.5; cursor: default; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 16px; }
  .chip { background: var(--chip); border: 1px solid transparent; border-radius: 999px;
    padding: 2px 11px; cursor: pointer; color: var(--muted); }
  .chip.on { border-color: var(--accent); color: var(--text); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px; cursor: pointer; display: flex; gap: 12px; align-items: flex-start; }
  .card:hover { background: var(--hover); }
  .card img { width: 36px; height: 36px; border-radius: 8px; flex: none; }
  .card .fallback-icon { width: 36px; height: 36px; border-radius: 8px; flex: none;
    background: var(--chip); display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: var(--muted); }
  .card h3 { margin: 0 0 2px; font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
  .card p { margin: 0; color: var(--muted); }
  .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .badge { font-size: 10.5px; border-radius: 999px; padding: 1px 8px; font-weight: 600; }
  .badge.installed { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .badge.update { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .badge.yanked { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }
  .state { color: var(--muted); padding: 60px 0; text-align: center; }
  .error { color: var(--danger); }
  /* detail page */
  .back-row { margin: 0 0 14px; }
  .detail { max-width: 760px; }
  .detail-head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 8px; }
  .detail-head img { width: 44px; height: 44px; border-radius: 10px; }
  .detail-head h2 { margin: 0; font-size: 16px; }
  .detail-head .by { color: var(--muted); }
  .actions { display: flex; gap: 8px; margin: 14px 0 18px; flex-wrap: wrap; align-items: center; }
  .readme { border-top: 1px solid var(--line); padding-top: 16px; overflow-wrap: break-word; }
  .readme h1, .readme h2, .readme h3 { font-size: 14.5px; margin: 18px 0 6px; }
  .readme h1:first-child { margin-top: 0; }
  .readme pre { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; }
  .readme code { background: var(--panel); border-radius: 4px; padding: 0 4px; }
  .readme pre code { background: none; padding: 0; }
  .readme img { max-width: 100%; }
  .readme a { color: var(--accent); }
  .readme blockquote { border-left: 3px solid var(--line); margin: 8px 0; padding: 2px 12px; color: var(--muted); }
  .fineprint { color: var(--muted); font-size: 11.5px; margin-top: 14px; }
  /* modal */
  .modal { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 60%, transparent);
    display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal .box { background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    max-width: 460px; padding: 20px 22px; }
  .modal h3 { margin: 0 0 8px; font-size: 14px; }
  .modal p { color: var(--muted); margin: 0 0 8px; }
  .modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="browse-chrome">
    <header>
      <h1>Community apps</h1>
      <input id="q" type="search" placeholder="Search apps…">
      <button id="installed-toggle">Installed</button>
      <button id="refresh">Refresh</button>
    </header>
    <p class="sub">Apps shared by the community — browse, read, and install into your Fused folder.
      <a id="repo-link" href="https://github.com/fusedio/fused-render-community-apps" target="_blank" rel="noreferrer">Publish yours ↗</a></p>
    <div class="chips" id="chips"></div>
  </div>
  <div id="content"><div class="state">Loading…</div></div>
</div>
<script>
"use strict";
const PY = "./community.py";
const content = document.getElementById("content");
const browseChrome = document.getElementById("browse-chrome");
const chipsEl = document.getElementById("chips");
const qEl = document.getElementById("q");

let catalog = null;        // last good catalog payload
let busy = false;          // a write (install/update/uninstall) in flight

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// --- tiny dependency-free markdown (headings, fences, inline code, bold,
// --- italic, links, images, lists, blockquotes, paragraphs) ---------------
function md(src, baseDir) {
  const inline = (t) => esc(t)
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, alt, url) =>
      `<img alt="${alt}" src="${resolveUrl(url, baseDir)}">`)
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, txt, url) =>
      `<a href="${resolveUrl(url, baseDir)}" target="_blank" rel="noreferrer">${txt}</a>`)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|\W)\*([^*\n]+)\*(?=\W|$)/g, "$1<em>$2</em>");
  const lines = String(src).split(/\r?\n/);
  const out = [];
  let list = null, para = [], fence = null;
  const flushPara = () => { if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; } };
  const flushList = () => { if (list) { out.push(`<${list.tag}>` + list.items.map(i => `<li>${inline(i)}</li>`).join("") + `</${list.tag}>`); list = null; } };
  for (const raw of lines) {
    if (fence !== null) {
      if (/^\s*```/.test(raw)) { out.push(`<pre><code>${esc(fence.join("\n"))}</code></pre>`); fence = null; }
      else fence.push(raw);
      continue;
    }
    if (/^\s*```/.test(raw)) { flushPara(); flushList(); fence = []; continue; }
    const h = raw.match(/^(#{1,4})\s+(.*)/);
    if (h) { flushPara(); flushList(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    const li = raw.match(/^\s*[-*]\s+(.*)/);
    const ol = raw.match(/^\s*\d+\.\s+(.*)/);
    if (li || ol) {
      flushPara();
      const tag = li ? "ul" : "ol";
      if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; }
      list.items.push((li || ol)[1]);
      continue;
    }
    if (/^\s*>/.test(raw)) { flushPara(); flushList(); out.push(`<blockquote>${inline(raw.replace(/^\s*>\s?/, ""))}</blockquote>`); continue; }
    if (/^\s*$/.test(raw)) { flushPara(); flushList(); continue; }
    // continuation of a list item ("  wrapped text")
    if (list && /^\s{2,}\S/.test(raw)) { list.items[list.items.length - 1] += " " + raw.trim(); continue; }
    para.push(raw.trim());
  }
  flushPara(); flushList();
  if (fence) out.push(`<pre><code>${esc(fence.join("\n"))}</code></pre>`);
  return out.join("\n");
}
function resolveUrl(url, baseDir) {
  if (/^[a-z][a-z0-9+.-]*:|^\/\//i.test(url)) return esc(url);   // absolute http(s) etc.
  return fused.rawUrl(baseDir + "/" + url.replace(/^\.\//, ""));
}

// --- params-driven state ---------------------------------------------------
const state = () => ({
  q: fused.params.get("q") || "",
  tag: fused.params.get("tag") || "",
  installedOnly: fused.params.get("installed") === "1",
  open: fused.params.get("app") || "",
});

function iconUrl(app) {
  return catalog && catalog.cache_root && !app.yanked
    ? fused.rawUrl(`${catalog.cache_root}/${app.slug}/icon.svg`)
    : null;
}

function badge(app) {
  if (app.yanked) return `<span class="badge yanked">removed upstream</span>`;
  if (app.update_available) return `<span class="badge update">update</span>`;
  if (app.installed) return `<span class="badge installed">installed</span>`;
  return "";
}

function renderChips() {
  const { tag } = state();
  const tags = [...new Set((catalog?.apps || []).flatMap(a => a.tags || []))].sort();
  chipsEl.innerHTML = tags.map(t =>
    `<button class="chip${t === tag ? " on" : ""}" data-tag="${esc(t)}">${esc(t)}</button>`).join("");
}

// One dispatch: the `app` param decides which page renders — grid or detail.
function render() {
  const { open } = state();
  browseChrome.style.display = open ? "none" : "";
  if (open) renderDetail(open);
  else { renderChips(); renderGrid(); }
}

function renderGrid() {
  const { q, tag, installedOnly } = state();
  if (qEl.value !== q) qEl.value = q;   // don't reset the cursor mid-typing
  document.getElementById("installed-toggle").classList.toggle("primary", installedOnly);
  if (!catalog) return;
  const needle = q.toLowerCase();
  const apps = (catalog.apps || []).filter(a => {
    if (installedOnly && !a.installed) return false;
    if (tag && !(a.tags || []).includes(tag)) return false;
    if (!needle) return true;
    return [a.name, a.description, a.slug, ...(a.tags || [])].join(" ").toLowerCase().includes(needle);
  });
  if (!apps.length) { content.innerHTML = `<div class="state">No apps match.</div>`; return; }
  content.innerHTML = `<div class="grid">` + apps.map(a => {
    const icon = iconUrl(a);
    return `<div class="card" data-slug="${esc(a.slug)}">
      ${icon ? `<img src="${icon}" alt="">` : `<div class="fallback-icon">${esc((a.name || a.slug)[0].toUpperCase())}</div>`}
      <div>
        <h3>${esc(a.name || a.slug)} ${badge(a)}</h3>
        <p>${esc(a.description || "")}</p>
        <div class="meta">${esc(a.author?.name || "")}${a.version ? " · v" + esc(a.version) : ""}</div>
      </div>
    </div>`;
  }).join("") + `</div>`;
}

// --- detail page --------------------------------------------------------
async function renderDetail(slug) {
  content.innerHTML = `<div class="back-row"><button data-act="close">← All apps</button></div>
    <div class="state">Loading ${esc(slug)}…</div>`;
  content.querySelector("[data-act=close]").addEventListener("click", closeDetail);
  let d;
  try {
    d = await fused.runPython(PY, { action: "detail", slug }, { key: "detail" });
  } catch (err) { showError(err.message); return; }
  if (d.status === "error") { showError(d.message); return; }
  if (state().open !== slug) return;   // user navigated away while loading
  const entry = d.entry || {};
  const icon = catalog?.cache_root ? fused.rawUrl(`${d.folder}/icon.svg`) : null;
  const previewHref = "/explorer/embed" + encodeFsPath(d.preview_entry);
  const buttons = [];
  if (!d.installed) buttons.push(`<button class="primary" data-act="install">Install</button>`);
  if (d.installed) buttons.push(`<button class="primary" data-act="open">Open</button>`);
  if (d.installed && d.update_available) buttons.push(`<button data-act="update">Update</button>`);
  buttons.push(`<a href="${previewHref}" target="_blank" rel="noreferrer"><button>Preview ↗</button></a>`);
  if (d.installed) buttons.push(`<button class="danger" data-act="uninstall">Uninstall</button>`);
  content.innerHTML = `<div class="back-row"><button data-act="close">← All apps</button></div>
    <div class="detail">
    <div class="detail-head">
      ${icon ? `<img src="${icon}" alt="">` : ""}
      <div>
        <h2>${esc(entry.name || slug)}</h2>
        <div class="by">${esc(entry.author?.name || "")}${entry.version ? " · v" + esc(entry.version) : ""}
          ${(entry.tags || []).map(t => `· ${esc(t)}`).join(" ")}</div>
      </div>
    </div>
    <p>${esc(entry.description || "")}</p>
    <div class="actions">${buttons.join("")}</div>
    <div class="readme">${md(d.readme || "*no readme*", d.folder)}</div>
    <p class="fineprint">Preview renders the app from the local catalog cache — it already runs the
      app's JavaScript with the same trust as installing it. Anything a previewed app saves is
      discarded on the next catalog refresh; install it to keep state.</p>
  </div>`;
  content.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => act(b.dataset.act, slug, d)));
}

function encodeFsPath(p) {
  return p.split("/").map(encodeURIComponent).join("/");
}

function closeDetail() { fused.params.set("app", ""); }

function showError(message) {
  content.innerHTML = `<div class="state error">${esc(message)}</div>` + content.innerHTML;
}

// --- actions ----------------------------------------------------------------
function confirmModal({ title, body, okLabel, okClass = "primary", extra = "" }) {
  return new Promise((resolve) => {
    const el = document.createElement("div");
    el.className = "modal";
    el.innerHTML = `<div class="box"><h3>${esc(title)}</h3>${body}${extra}
      <div class="row"><button data-r="no">Cancel</button>
      <button class="${okClass}" data-r="yes">${esc(okLabel)}</button></div></div>`;
    document.body.appendChild(el);
    el.addEventListener("click", (e) => {
      const r = e.target?.dataset?.r;
      if (r || e.target === el) { el.remove(); resolve(r === "yes"); }
    });
  });
}

async function act(action, slug, d) {
  if (action === "close") return closeDetail();
  if (action === "open") {
    window.top.location.href = "/apps/community/" + encodeURIComponent(d.path.split("/").pop());
    return;
  }
  if (busy) return;
  const entry = d.entry || {};
  if (action === "install") {
    const ok = await confirmModal({
      title: `Install ${entry.name || slug}?`,
      body: `<p>By ${esc(entry.author?.name || "unknown")} · from the community repo.</p>
        <p>Installed apps run with the <strong>same trust as your own files</strong>${entry.requires_python ? ", including running Python on this machine" : ""}.
        Every app enters the catalog through a reviewed pull request, but install only what you trust.</p>
        <p>It will be copied to <code>Fused/community/${esc(slug)}</code> — yours to edit from there.</p>`,
      okLabel: "Install",
    });
    if (!ok) return;
    await write({ action: "install", slug }, "installed");
    return;
  }
  if (action === "update") {
    let res = await write({ action: "update", slug }, null);
    if (res && res.status === "dirty") {
      const ok = await confirmModal({
        title: "You've edited this app",
        body: `<p>Your copy has local changes. Updating first commits your current
          state to the app's git history ("Local edits before community update"),
          then applies the new version on top — nothing is lost, but your edits
          won't be in the running files any more.</p>`,
        okLabel: "Update anyway",
      });
      if (!ok) return;
      res = await write({ action: "update", slug, force: "true" }, "updated");
    }
    return;
  }
  if (action === "uninstall") {
    const ok = await confirmModal({
      title: `Uninstall ${entry.name || slug}?`,
      body: `<p>Moves <code>Fused/community/${esc(slug)}</code> to the Trash —
        including any edits you made and their git history.</p>`,
      okLabel: "Uninstall", okClass: "danger",
    });
    if (!ok) return;
    await write({ action: "uninstall", slug }, "uninstalled");
    closeDetail();
  }
}

// Writes opt out of stale-cancel ({key:null}): a refresh must never abort a
// half-done install.
async function write(params, expect) {
  busy = true;
  try {
    const res = await fused.runPython(PY, params, { key: null });
    if (res.status === "error") { showError(res.message); return null; }
    if (expect && res.status !== expect && res.status !== "already-installed" && res.status !== "up-to-date") {
      showError(`unexpected result: ${res.status}`);
    }
    await loadCatalog(false);   // re-join install state
    return res;
  } catch (err) { showError(err.message); return null; }
  finally { busy = false; }
}

// --- catalog loading --------------------------------------------------------
async function loadCatalog(allowRefresh) {
  let res;
  try {
    res = await fused.runPython(PY, { action: "catalog" }, { key: "catalog" });
  } catch (err) { content.innerHTML = `<div class="state error">${esc(err.message)}</div>`; return; }
  if (res.status === "no-cache") {
    if (!allowRefresh) return;
    content.innerHTML = `<div class="state">Fetching the community catalog…</div>`;
    return refresh();
  }
  catalog = res;
  render();
}

async function refresh() {
  const btn = document.getElementById("refresh");
  btn.disabled = true; btn.textContent = "Refreshing…";
  try {
    const res = await fused.runPython(PY, { action: "refresh" }, { key: "catalog" });
    if (res.status === "error") { content.innerHTML = `<div class="state error">${esc(res.message)}</div>`; return; }
    catalog = res;
    render();
  } catch (err) {
    content.innerHTML = `<div class="state error">${esc(err.message)}</div>`;
  } finally { btn.disabled = false; btn.textContent = "Refresh"; }
}

// --- wiring -----------------------------------------------------------------
qEl.addEventListener("input", () => fused.params.set("q", qEl.value));
document.getElementById("installed-toggle").addEventListener("click", () =>
  fused.params.set("installed", state().installedOnly ? "" : "1"));
document.getElementById("refresh").addEventListener("click", refresh);
chipsEl.addEventListener("click", (e) => {
  const t = e.target?.dataset?.tag;
  if (t !== undefined) fused.params.set("tag", state().tag === t ? "" : t);
});
content.addEventListener("click", (e) => {
  const card = e.target.closest?.(".card");
  if (card) fused.params.set("app", card.dataset.slug);
});

fused.params.onChange(render);

loadCatalog(true).then(() => {
  // Stale-while-revalidate: catalog painted from disk; quietly re-sync in the
  // background and repaint if it moved.
  if (catalog) {
    fused.runPython(PY, { action: "refresh" }, { key: "background-refresh" })
      .then((res) => {
        if (res.status === "ok" && res.commit !== catalog.commit) {
          catalog = res;
          if (!state().open) render();   // don't yank a detail page mid-read
        } else if (res.status === "ok") {
          catalog = res;   // fresh install-state join, no visual change needed
        }
      })
      .catch(() => {});    // background sync failure is not an error state
  }
});
</script>
</body>
</html>
