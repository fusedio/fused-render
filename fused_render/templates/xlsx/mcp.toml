# MCP tools for this app, curated in fused-render's MCP panel.
# `fused app serve <this folder>` publishes one tool per [[tool]] table.

[[tool]]
name = "xlsx_sheets"
description = "List the sheets of an .xlsx workbook with row counts and typed columns. Start here: sheet names are the table names xlsx_query accepts."
file = "reader.py"
entrypoint = "sheets"
signature = "sheets(file: str)"

[[tool]]
name = "xlsx_describe"
description = "Summary statistics for each column of a sheet: count, nulls, distinct; min/max/mean/median/std/sum for numbers; min/max for dates; most common values for text. Formula cells count by their computed value."
file = "reader.py"
entrypoint = "describe"
signature = "describe(file: str, sheet: str='', columns: str='')"

[[tool]]
name = "xlsx_query"
description = "Run read-only DuckDB SQL over an .xlsx workbook; every sheet is a table named after it (quote names with spaces), columns come from its header row. Returns at most `limit` rows."
file = "reader.py"
entrypoint = "query"
signature = "query(file: str, sql: str, limit: int=1000)"

[[tool]]
name = "xlsx_cells"
description = "Read an A1 range (\"B5\", \"A1:D10\", \"'Sheet 2'!A1:C3\") of an .xlsx workbook: each cell's value and its formula."
file = "reader.py"
entrypoint = "cells"
signature = "cells(file: str, ref: str, sheet: str='')"

[[tool]]
name = "xlsx_page"
description = "Rows offset..offset+limit of one sheet of an .xlsx workbook as {column: value} objects, formula cells showing their value."
file = "reader.py"
entrypoint = "page"
signature = "page(file: str, sheet: str='', offset: int=0, limit: int=100)"
