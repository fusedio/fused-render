name: app-check

# Written for fusedio/fused-render-community-apps and committed there by
# hand — see skills/fused-render-app-doctor/SKILL.md. This repo is a folder
# of app folders, not a single app, and `fused-render doctor` (see
# fused_render/app_doctor.py) only knows how to review ONE app folder — it
# has no idea the repo it lives in exists. So this workflow does the
# iteration itself: one pass over every top-level folder that carries a
# metadata.json, running the doctor and that app's own tests inside the
# same loop, and failing the job if either step fails for any app.

on:
  push:
    branches: [main]
  pull_request: {}

concurrency:
  # Mirrors fused-render's own test.yml: a PR number is unique repo-wide,
  # unlike head_ref, so two branches that happen to share a name never land
  # in the same group and cancel each other's runs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install fused-render and pytest
        run: pip install fused-render pytest

      - name: Review each app and run its own tests
        # One loop, two checks per app:
        #
        #   1. `fused-render doctor --check "$app"` — the same engine and
        #      the same severity rule the CLI uses locally, pointed at just
        #      this one app folder.
        #   2. That app's own tests, when it has any — gated on an actual
        #      test_*.py/*_test.py existing somewhere under the app, not
        #      merely on a `tests/` directory existing. Install that app's
        #      declared dependencies first if a pyproject.toml exists; pip
        #      parses and installs them. If the install fails, log a warning
        #      naming the app, skip that app's tests, and continue. Exit 5
        #      from pytest is "no tests collected" — reachable even after
        #      the test_files gate (every matching file skipped), and means
        #      nothing failed, only that there was nothing to run.
        run: |
          set -e
          status=0
          for app in */; do
            app="${app%/}"
            [ -f "$app/metadata.json" ] || continue

            echo "::group::doctor $app"
            fused-render doctor --check "$app" || status=1
            echo "::endgroup::"

            test_files=$(find "$app" \( -name 'test_*.py' -o -name '*_test.py' \) -type f 2>/dev/null)
            if [ -z "$test_files" ]; then
              continue
            fi

            echo "::group::pytest $app"
            if [ -f "$app/pyproject.toml" ]; then
              if ! pip install -e "$app"; then
                echo "::warning::could not install $app's declared dependencies — skipping its tests"
                echo "::endgroup::"
                status=1
                continue
              fi
            fi

            set +e
            python -m pytest "$app" -q
            rc=$?
            set -e
            # Exit 5 is pytest's "no tests were collected" — reachable even
            # after the test_files gate above (every matching file skipped,
            # or empty), and it means nothing failed, only that there was
            # nothing to run.
            if [ "$rc" != 0 ] && [ "$rc" != 5 ]; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"
