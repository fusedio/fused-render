<!DOCTYPE html>
<html data-fused-theme="shell">
<head>
<meta charset="utf-8">
<title>Community</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #131417; --panel: #1b1d21; --text: #e8eaed; --muted: #9aa0a6;
    --line: #2a2d33; --accent: #E5FF44; --hover: #26282c; --on-accent: #10131a;
    --ok: #3fb950; --warn: #d9a679; --danger: #e58a80; --chip: #26282c;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff; --panel: #f4f5f7; --text: #1f2023; --muted: #61656c;
    --line: #d8dade; --accent: #5f7300; --hover: #e5e6e8; --on-accent: #ffffff;
    --ok: #1a7f37; --warn: #a15c1f; --danger: #b3261e; --chip: #e9eaec;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.5 -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 20px 24px 48px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  header h1 { font-size: 17px; margin: 0 auto 0 0; }
  header h1 .hcount { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 7px; }
  header .publish { color: var(--muted); font-size: 12px; text-decoration: none; }
  header .publish:hover { color: var(--text); }
  /* Prominent centered search with tag autocomplete */
  .searchbar { display: flex; justify-content: center; margin: 16px 0 14px; }
  .searchbox { position: relative; display: flex; align-items: center; gap: 7px;
    width: 100%; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 13px; }
  .searchbox:focus-within { border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
  .searchbox .icon { flex: 0 0 auto; color: var(--muted); display: flex; }
  .searchbox input { flex: 1 1 auto; min-width: 60px; background: none; border: none;
    outline: none; color: var(--text); font: inherit; padding: 0; }
  .token { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px;
    background: var(--chip); border: 1px solid var(--accent); border-radius: 999px;
    padding: 1px 9px; font-size: 12px; }
  .token button { border: none; background: none; padding: 0; color: var(--muted);
    cursor: pointer; font-size: 13px; line-height: 1; }
  .token button:hover { background: none; color: var(--text); }
  .ac { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 10;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden; box-shadow: 0 8px 24px color-mix(in srgb, #000 30%, transparent); }
  .ac .opt { display: flex; align-items: baseline; gap: 8px; padding: 7px 13px; cursor: pointer; }
  .ac .opt.sel, .ac .opt:hover { background: var(--hover); }
  .ac .opt .kind { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .ac .opt .n { color: var(--muted); margin-left: auto; font-size: 11.5px; }
  button { background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 7px; padding: 5px 12px; font: inherit; cursor: pointer; }
  button:hover { background: var(--hover); }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button:disabled { opacity: 0.5; cursor: default; }
  select { background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 7px; padding: 5px 8px; font: inherit; cursor: pointer; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 16px; }
  .chip { background: var(--chip); border: 1px solid transparent; border-radius: 999px;
    padding: 2px 11px; cursor: pointer; color: var(--muted); }
  .chip.on { border-color: var(--accent); color: var(--text); }
  .chip .n { opacity: 0.65; font-size: 11px; margin-left: 3px; }
  .chip.more { background: none; border: 1px dashed var(--line); }
  .updates { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    background: color-mix(in srgb, var(--warn) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent);
    border-radius: 10px; padding: 8px 12px; margin: 0 0 16px; }
  .updates .lead { color: var(--warn); font-weight: 600; margin-right: 2px; }
  .section-title { display: flex; align-items: baseline; gap: 8px;
    font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--muted); margin: 22px 0 10px; }
  .section-title:first-child { margin-top: 0; }
  .section-title .n { font-weight: 400; }
  .resultcount { color: var(--muted); margin: 0 0 12px; }
  .state .row { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
  /* Preview cards — same shape as the app builder's .app-pcard (apps.css):
     text body on top, 16:10 thumbnail below, hover lift. The thumbnail here
     is a static preview.png from the catalog cache, not a live iframe. */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
  .card { display: flex; flex-direction: column; min-width: 0; padding: 0;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden; cursor: pointer;
    transition: border-color 0.12s ease, box-shadow 0.12s ease, transform 0.12s ease; }
  .card:hover { border-color: color-mix(in srgb, var(--muted) 40%, var(--line));
    box-shadow: 0 4px 18px color-mix(in srgb, #000 25%, transparent);
    transform: translateY(-1px); }
  .card-body { display: flex; flex-direction: column; gap: 5px; padding: 12px 14px 12px; min-width: 0; }
  .card h3 { margin: 0; font-size: 14.5px; font-weight: 650;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card p { margin: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { display: flex; align-items: center; gap: 8px; min-width: 0;
    color: var(--muted); font-size: 11.5px; }
  .meta .pill { flex: 0 0 auto; padding: 1px 8px;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px;
    border: 1px solid var(--line); border-radius: 999px; }
  .meta .slug { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta .end { flex: 0 0 auto; margin-left: auto; }
  .card-thumb { position: relative; display: block; aspect-ratio: 16 / 10;
    background: var(--bg); border-top: 1px solid var(--line); overflow: hidden; }
  .card-thumb img { position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: top; }
  .card-thumb .monogram { position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 44px; font-weight: 700; color: var(--muted);
    background: color-mix(in srgb, currentColor 9%, transparent); }
  .badge { font-size: 10.5px; border-radius: 999px; padding: 1px 8px; font-weight: 600; }
  .badge.installed { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .badge.update { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .badge.yanked { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }
  .state { color: var(--muted); padding: 60px 0; text-align: center; }
  .error { color: var(--danger); }
  /* detail page */
  .back-row { margin: 0 0 14px; }
  .detail { max-width: 760px; }
  .detail-head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 8px; }
  .detail-head h2 { margin: 0; font-size: 16px; }
  .detail-preview { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover;
    object-position: top; border: 1px solid var(--line); border-radius: 12px;
    background: var(--bg); margin: 0 0 18px; }
  .detail-head .by { color: var(--muted); }
  .actions { display: flex; gap: 8px; margin: 14px 0 18px; flex-wrap: wrap; align-items: center; }
  .readme { border-top: 1px solid var(--line); padding-top: 16px; overflow-wrap: break-word; }
  .readme h1, .readme h2, .readme h3 { font-size: 14.5px; margin: 18px 0 6px; }
  .readme h1:first-child { margin-top: 0; }
  .readme pre { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; }
  .readme code { background: var(--panel); border-radius: 4px; padding: 0 4px; }
  .readme pre code { background: none; padding: 0; }
  .readme img { max-width: 100%; }
  .readme a { color: var(--accent); }
  .readme blockquote { border-left: 3px solid var(--line); margin: 8px 0; padding: 2px 12px; color: var(--muted); }
  .fineprint { color: var(--muted); font-size: 11.5px; margin-top: 14px; }
  /* modal */
  .modal { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 60%, transparent);
    display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal .box { background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    max-width: 460px; padding: 20px 22px; }
  .modal h3 { margin: 0 0 8px; font-size: 14px; }
  .modal p { color: var(--muted); margin: 0 0 8px; }
  .modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="browse-chrome">
    <header>
      <h1>Community apps<span class="hcount" id="hcount"></span></h1>
      <a class="publish" href="https://github.com/fusedio/fused-render-community-apps" target="_blank" rel="noreferrer">Publish yours ↗</a>
      <select id="sort" title="Sort apps">
        <option value="">Catalog order</option>
        <option value="opened">Recently opened</option>
        <option value="name">Name A–Z</option>
      </select>
      <button id="installed-toggle" title="Apps you've cloned">Cloned</button>
      <button id="refresh">Refresh</button>
    </header>
    <div class="searchbar">
      <div class="searchbox">
        <span class="icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg></span>
        <span id="tag-token"></span>
        <input id="q" type="search" autocomplete="off" spellcheck="false"
          placeholder="Search apps, or type a tag to filter…  ( / )">
        <div class="ac" id="ac" hidden></div>
      </div>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div id="content"><div class="state">Loading…</div></div>
</div>
<script>
"use strict";
const PY = "./community.py";
const content = document.getElementById("content");
const browseChrome = document.getElementById("browse-chrome");
const chipsEl = document.getElementById("chips");
const qEl = document.getElementById("q");

let catalog = null;        // last good catalog payload
let busy = false;          // a write (install/update/uninstall) in flight

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// --- tiny dependency-free markdown (headings, fences, inline code, bold,
// --- italic, links, images, lists, blockquotes, paragraphs) ---------------
function md(src, baseDir) {
  const inline = (t) => esc(t)
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, alt, url) =>
      `<img alt="${alt}" src="${resolveUrl(url, baseDir)}">`)
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, txt, url) =>
      `<a href="${resolveUrl(url, baseDir)}" target="_blank" rel="noreferrer">${txt}</a>`)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|\W)\*([^*\n]+)\*(?=\W|$)/g, "$1<em>$2</em>");
  const lines = String(src).split(/\r?\n/);
  const out = [];
  let list = null, para = [], fence = null;
  const flushPara = () => { if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; } };
  const flushList = () => { if (list) { out.push(`<${list.tag}>` + list.items.map(i => `<li>${inline(i)}</li>`).join("") + `</${list.tag}>`); list = null; } };
  for (const raw of lines) {
    if (fence !== null) {
      if (/^\s*```/.test(raw)) { out.push(`<pre><code>${esc(fence.join("\n"))}</code></pre>`); fence = null; }
      else fence.push(raw);
      continue;
    }
    if (/^\s*```/.test(raw)) { flushPara(); flushList(); fence = []; continue; }
    const h = raw.match(/^(#{1,4})\s+(.*)/);
    if (h) { flushPara(); flushList(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    const li = raw.match(/^\s*[-*]\s+(.*)/);
    const ol = raw.match(/^\s*\d+\.\s+(.*)/);
    if (li || ol) {
      flushPara();
      const tag = li ? "ul" : "ol";
      if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; }
      list.items.push((li || ol)[1]);
      continue;
    }
    if (/^\s*>/.test(raw)) { flushPara(); flushList(); out.push(`<blockquote>${inline(raw.replace(/^\s*>\s?/, ""))}</blockquote>`); continue; }
    if (/^\s*$/.test(raw)) { flushPara(); flushList(); continue; }
    // continuation of a list item ("  wrapped text")
    if (list && /^\s{2,}\S/.test(raw)) { list.items[list.items.length - 1] += " " + raw.trim(); continue; }
    para.push(raw.trim());
  }
  flushPara(); flushList();
  if (fence) out.push(`<pre><code>${esc(fence.join("\n"))}</code></pre>`);
  return out.join("\n");
}
function resolveUrl(url, baseDir) {
  // `url` was already extracted from `inline`'s esc(t) pass, so it's already
  // HTML-escaped — escaping it again here would turn "&amp;" into "&amp;amp;"
  // and break any link whose query string has a "&".
  if (/^(https?:|mailto:|\/\/)/i.test(url)) return url;
  // Any other scheme (javascript:, data:, vbscript:, …) in a community readme
  // is hostile — never render it as a live href.
  if (/^[a-z][a-z0-9+.-]*:/i.test(url)) return "#";
  return fused.rawUrl(baseDir + "/" + url.replace(/^\.\//, ""));
}

// --- params-driven state ---------------------------------------------------
const state = () => ({
  q: fused.params.get("q") || "",
  tag: fused.params.get("tag") || "",
  clonedOnly: fused.params.get("cloned") === "1",
  sort: fused.params.get("sort") || "",
  open: fused.params.get("app") || "",
});

function previewUrl(app) {
  return catalog && catalog.cache_root && !app.yanked
    ? fused.rawUrl(`${catalog.cache_root}/${app.slug}/preview.png`)
    : null;
}

// Monogram behind the image: if preview.png is missing (yanked app, older
// catalog cache) the <img> removes itself on error and the letter shows.
function thumb(app) {
  const url = previewUrl(app);
  const letter = esc((app.name || app.slug)[0].toUpperCase());
  return `<span class="card-thumb"><span class="monogram">${letter}</span>` +
    (url ? `<img src="${url}" alt="" loading="lazy" onerror="this.remove()">` : "") +
    `</span>`;
}

function badge(app) {
  if (app.yanked) return `<span class="badge yanked">removed upstream</span>`;
  if (app.update_available) return `<span class="badge update">update</span>`;
  if (app.installed) return `<span class="badge installed">cloned</span>`;
  return "";
}

let chipsExpanded = false;   // ephemeral view state, deliberately not a param
const CHIP_LIMIT = 8;

function tagCounts() {
  const counts = {};
  for (const a of catalog?.apps || [])
    for (const t of a.tags || []) counts[t] = (counts[t] || 0) + 1;
  return counts;
}

function renderChips() {
  const { tag } = state();
  const apps = catalog?.apps || [];
  const counts = tagCounts();
  // Popular tags first: the long tail of 1-count tags hides behind "more".
  const tags = Object.keys(counts)
    .sort((a, b) => counts[b] - counts[a] || a.localeCompare(b));
  let shown = chipsExpanded ? tags : tags.slice(0, CHIP_LIMIT);
  if (tag && !shown.includes(tag)) shown = [...shown, tag];   // active tag always visible
  const hidden = tags.length - shown.length;
  document.getElementById("hcount").textContent = apps.length ? String(apps.length) : "";
  chipsEl.innerHTML =
    `<button class="chip${tag ? "" : " on"}" data-tag="">All<span class="n">${apps.length}</span></button>` +
    shown.map(t =>
      `<button class="chip${t === tag ? " on" : ""}" data-tag="${esc(t)}">${esc(t)}<span class="n">${counts[t]}</span></button>`).join("") +
    (hidden > 0 ? `<button class="chip more" data-more>+${hidden} more</button>`
      : tags.length > CHIP_LIMIT ? `<button class="chip more" data-more>less</button>` : "");
}

// Active tag shows as a removable token inside the search box.
function renderToken() {
  const { tag } = state();
  const el = document.getElementById("tag-token");
  el.innerHTML = tag
    ? `<span class="token">${esc(tag)}<button title="Clear tag filter" data-untag>×</button></span>`
    : "";
}

// One dispatch: the `app` param decides which page renders — grid or detail.
function render() {
  const { open } = state();
  browseChrome.style.display = open ? "none" : "";
  if (open) renderDetail(open);
  else { renderToken(); renderChips(); renderGrid(); }
}

// Body mirrors the app builder's preview card: title, then a meta row of
// mono pill + slug + right-aligned author/version, thumbnail below.
function cardHtml(a) {
  return `<div class="card" data-slug="${esc(a.slug)}">
      <div class="card-body">
        <h3>${esc(a.name || a.slug)}</h3>
        <p>${esc(a.description || "")}</p>
        <div class="meta">
          <span class="pill">community</span>
          ${badge(a)}
          <span class="slug">${esc(a.slug)}</span>
          <span class="end">${esc(a.author?.name || "")}${a.version ? " · v" + esc(a.version) : ""}</span>
        </div>
      </div>
      ${thumb(a)}
    </div>`;
}

function sortApps(apps, sort) {
  if (sort === "name")
    return [...apps].sort((a, b) => (a.name || a.slug).localeCompare(b.name || b.slug));
  if (sort === "opened")
    // Never-opened apps keep catalog order after the opened ones.
    return [...apps].sort((a, b) => (b.opened_at || 0) - (a.opened_at || 0));
  return apps;   // catalog order
}

function updatesStrip(apps) {
  const pending = apps.filter(a => a.installed && a.update_available && !a.yanked);
  if (!pending.length) return "";
  return `<div class="updates"><span class="lead">${pending.length} update${pending.length > 1 ? "s" : ""} available</span>` +
    pending.map(a => `<button data-update="${esc(a.slug)}">Update ${esc(a.name || a.slug)}</button>`).join("") +
    `</div>`;
}

function renderGrid() {
  const { q, tag, clonedOnly, sort } = state();
  if (qEl.value !== q) qEl.value = q;   // don't reset the cursor mid-typing
  const sortEl = document.getElementById("sort");
  if (sortEl.value !== sort) sortEl.value = sort;
  document.getElementById("installed-toggle").classList.toggle("primary", clonedOnly);
  if (!catalog) return;
  const all = catalog.apps || [];
  const needle = q.toLowerCase();
  const filtering = !!(needle || tag || clonedOnly);
  const apps = sortApps(all.filter(a => {
    if (clonedOnly && !a.installed) return false;
    if (tag && !(a.tags || []).includes(tag)) return false;
    if (!needle) return true;
    return [a.name, a.description, a.slug, a.author?.name, ...(a.tags || [])]
      .join(" ").toLowerCase().includes(needle);
  }), sort);
  if (!apps.length) {
    content.innerHTML = `<div class="state">No apps match${q ? ` “${esc(q)}”` : ""}${tag ? ` in ${esc(tag)}` : ""}${clonedOnly ? " among your cloned apps" : ""}.
      <div class="row"><button data-clear>Show all apps</button></div></div>`;
    content.querySelector("[data-clear]").addEventListener("click", clearFilters);
    return;
  }
  // Strip pins to the browse and cloned views; mid-search it would be noise.
  let html = (needle || tag) ? "" : updatesStrip(all);
  if (clonedOnly)
    html += `<div class="section-title">Cloned apps <span class="n">${apps.length}</span></div>`;
  else if (apps.length !== all.length)
    html += `<div class="resultcount">${apps.length} of ${all.length} apps</div>`;
  html += `<div class="grid">` + apps.map(cardHtml).join("") + `</div>`;
  content.innerHTML = html;
  content.querySelectorAll("[data-update]").forEach(b =>
    b.addEventListener("click", (e) => {
      e.stopPropagation();   // don't open the card underneath
      updateFromGrid(b.dataset.update);
    }));
}

function clearFilters() {
  fused.params.set("q", "");
  fused.params.set("tag", "");
  fused.params.set("cloned", "");
}

// Inline update from the strip — same dirty-copy handshake as the detail page.
async function updateFromGrid(slug) {
  if (busy) return;
  const app = (catalog?.apps || []).find(a => a.slug === slug);
  let res = await write({ action: "update", slug }, null);
  if (res && res.status === "dirty") {
    const ok = await confirmModal({
      title: "You've edited this app",
      body: `<p>Your copy of ${esc(app?.name || slug)} has local changes. Updating first
        commits your current state to the app's git history ("Local edits before
        community update"), then applies the new version on top — nothing is lost,
        but your edits won't be in the running files any more.</p>`,
      okLabel: "Update anyway",
    });
    if (!ok) return;
    await write({ action: "update", slug, force: "true" }, "updated");
  }
}

// --- detail page --------------------------------------------------------
async function renderDetail(slug) {
  content.innerHTML = `<div class="back-row"><button data-act="close">← All apps</button></div>
    <div class="state">Loading ${esc(slug)}…</div>`;
  content.querySelector("[data-act=close]").addEventListener("click", closeDetail);
  let d;
  try {
    d = await fused.runPython(PY, { action: "detail", slug }, { key: "detail" });
  } catch (err) {
    if (state().open === slug) showError(err.message);   // navigated away → stale, drop it
    return;
  }
  if (state().open !== slug) return;   // user navigated away while loading
  if (d.status === "error") { showError(d.message); return; }
  const entry = d.entry || {};
  const preview = catalog?.cache_root && d.folder ? fused.rawUrl(`${d.folder}/preview.png`) : null;
  const previewHref = d.preview_entry ? "/explorer/view/" + encodeFsPath(d.preview_entry) : null;
  const buttons = [];
  if (!d.installed) buttons.push(`<button class="primary" data-act="install">Clone</button>`);
  if (d.installed) buttons.push(`<button class="primary" data-act="open">Open</button>`);
  if (d.installed && d.update_available) buttons.push(`<button data-act="update">Update</button>`);
  // Yanked apps are gone from the cache repo — there's nothing left to preview.
  if (previewHref) buttons.push(`<a href="${previewHref}" target="_blank" rel="noreferrer" data-act="preview"><button>Preview ↗</button></a>`);
  if (d.installed) buttons.push(`<button class="danger" data-act="uninstall">Remove clone</button>`);
  content.innerHTML = `<div class="back-row"><button data-act="close">← All apps</button></div>
    <div class="detail">
    <div class="detail-head">
      <div>
        <h2>${esc(entry.name || slug)}</h2>
        <div class="by">${esc(entry.author?.name || "")}${entry.version ? " · v" + esc(entry.version) : ""}
          ${(entry.tags || []).map(t => `· ${esc(t)}`).join(" ")}</div>
      </div>
    </div>
    <p>${esc(entry.description || "")}</p>
    <div class="actions">${buttons.join("")}</div>
    ${preview ? `<img class="detail-preview" src="${preview}" alt="" onerror="this.remove()">` : ""}
    ${d.yanked
      ? `<p class="fineprint">This app was removed from the community catalog upstream. Your clone
          still works as-is — Open it or remove the clone.</p>`
      : `<div class="readme">${md(d.readme || "*no readme*", d.folder)}</div>
    <p class="fineprint">Preview renders the app from the local catalog cache — it already runs the
      app's JavaScript with the same trust as installing it. Anything a previewed app saves is
      discarded on the next catalog refresh; install it to keep state.</p>`}
  </div>`;
  content.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => act(b.dataset.act, slug, d)));
}

// Mirror of the shell's urlForFsPath (router.ts): normalize backslashes only
// on drive-letter paths (POSIX filenames may legally contain "\"), strip the
// leading slash, and join encoded segments — so a Windows path becomes
// /explorer/view/C%3A/Users/… instead of a one-segment mangled URL.
function encodeFsPath(p) {
  const rest = fsSlash(p).replace(/^\/+/, "");
  return rest.split("/").filter(Boolean).map(encodeURIComponent).join("/");
}

function fsSlash(p) {
  return /^[A-Za-z]:[\\/]/.test(p) ? String(p).replace(/\\/g, "/") : String(p);
}

function closeDetail() { fused.params.set("app", ""); }

function showError(message) {
  content.innerHTML = `<div class="state error">${esc(message)}</div>` + content.innerHTML;
}

// --- actions ----------------------------------------------------------------
function confirmModal({ title, body, okLabel, okClass = "primary", extra = "" }) {
  return new Promise((resolve) => {
    const el = document.createElement("div");
    el.className = "modal";
    el.innerHTML = `<div class="box"><h3>${esc(title)}</h3>${body}${extra}
      <div class="row"><button data-r="no">Cancel</button>
      <button class="${okClass}" data-r="yes">${esc(okLabel)}</button></div></div>`;
    document.body.appendChild(el);
    el.addEventListener("click", (e) => {
      const r = e.target?.dataset?.r;
      if (r || e.target === el) { el.remove(); resolve(r === "yes"); }
    });
  });
}

async function act(action, slug, d) {
  if (action === "close") return closeDetail();
  if (action === "preview") {
    // Best-effort, same contract as Open below: previewed (usually
    // uninstalled) apps should sort by "Recently opened" too. Doesn't
    // preventDefault — the anchor's own navigation still happens.
    fused.runPython(PY, { action: "touch", slug }, { key: null }).catch(() => {});
    return;
  }
  if (action === "open") {
    // Best-effort: record the open so "Recently opened" sorting (here and in
    // the apps hub) sees it; never delay the navigation on it.
    fused.runPython(PY, { action: "touch", slug }, { key: null }).catch(() => {});
    // The cloned folder opens in the explorer's listing — the /apps/<tag>/<name>
    // app route is retired (D262); a folder listing is the only destination.
    window.top.location.href = "/explorer/view/" + encodeFsPath(d.path);
    return;
  }
  if (busy) return;
  const entry = d.entry || {};
  if (action === "install") {
    const ok = await confirmModal({
      title: `Clone ${entry.name || slug}?`,
      body: `<p>By ${esc(entry.author?.name || "unknown")} · from the community repo.</p>
        <p>Installed apps run with the <strong>same trust as your own files</strong>${entry.requires_python ? ", including running Python on this machine" : ""}.
        Every app enters the catalog through a reviewed pull request, but install only what you trust.</p>
        <p>It will be copied to <code>Fused/local/${esc(slug)}</code> — yours to edit from there.</p>`,
      okLabel: "Clone",
    });
    if (!ok) return;
    await write({ action: "install", slug }, "installed");
    return;
  }
  if (action === "update") {
    let res = await write({ action: "update", slug }, null);
    if (res && res.status === "dirty") {
      const ok = await confirmModal({
        title: "You've edited this app",
        body: `<p>Your copy has local changes. Updating first commits your current
          state to the app's git history ("Local edits before community update"),
          then applies the new version on top — nothing is lost, but your edits
          won't be in the running files any more.</p>`,
        okLabel: "Update anyway",
      });
      if (!ok) return;
      res = await write({ action: "update", slug, force: "true" }, "updated");
    }
    return;
  }
  if (action === "uninstall") {
    const ok = await confirmModal({
      title: `Remove your clone of ${entry.name || slug}?`,
      body: `<p>Moves <code>${esc(d.path ? fsSlash(d.path).split("/").slice(-3).join("/") : "Fused/local/" + slug)}</code> to the Trash —
        including any edits you made and their git history.</p>`,
      okLabel: "Remove", okClass: "danger",
    });
    if (!ok) return;
    await write({ action: "uninstall", slug }, "uninstalled");
    closeDetail();
  }
}

// Writes opt out of stale-cancel ({key:null}): a refresh must never abort a
// half-done install.
async function write(params, expect) {
  busy = true;
  try {
    const res = await fused.runPython(PY, params, { key: null });
    if (res.status === "error") { showError(res.message); return null; }
    if (expect && res.status !== expect && res.status !== "already-installed" && res.status !== "up-to-date") {
      showError(`unexpected result: ${res.status}`);
    }
    await loadCatalog(false);   // re-join install state
    return res;
  } catch (err) { showError(err.message); return null; }
  finally { busy = false; }
}

// --- catalog loading --------------------------------------------------------
async function loadCatalog(allowRefresh) {
  let res;
  try {
    res = await fused.runPython(PY, { action: "catalog" }, { key: "catalog" });
  } catch (err) { content.innerHTML = `<div class="state error">${esc(err.message)}</div>`; return; }
  if (res.status === "no-cache") {
    if (!allowRefresh) return;
    content.innerHTML = `<div class="state">Fetching the community catalog…</div>`;
    return refresh();
  }
  catalog = res;
  render();
}

async function refresh() {
  const btn = document.getElementById("refresh");
  btn.disabled = true; btn.textContent = "Refreshing…";
  try {
    const res = await fused.runPython(PY, { action: "refresh" }, { key: "catalog" });
    if (res.status === "error") { content.innerHTML = `<div class="state error">${esc(res.message)}</div>`; return; }
    catalog = res;
    render();
  } catch (err) {
    content.innerHTML = `<div class="state error">${esc(err.message)}</div>`;
  } finally { btn.disabled = false; btn.textContent = "Refresh"; }
}

// --- wiring -----------------------------------------------------------------
// --- search autocomplete: typing suggests tags; picking one applies the
// --- tag filter (as a token) and clears the text query -----------------------
const acEl = document.getElementById("ac");
let acIndex = -1;

function acSuggestions() {
  const { tag } = state();
  const needle = qEl.value.trim().toLowerCase();
  if (!needle) return [];
  const counts = tagCounts();
  return Object.keys(counts)
    .filter(t => t !== tag && t.toLowerCase().includes(needle))
    .sort((a, b) => counts[b] - counts[a] || a.localeCompare(b))
    .slice(0, 6)
    .map(t => ({ t, n: counts[t] }));
}

function renderAc() {
  const opts = acSuggestions();
  if (!opts.length) { acEl.hidden = true; acEl.innerHTML = ""; acIndex = -1; return; }
  if (acIndex >= opts.length) acIndex = opts.length - 1;
  acEl.innerHTML = opts.map((o, i) =>
    `<div class="opt${i === acIndex ? " sel" : ""}" data-ac="${esc(o.t)}">
      <span class="kind">tag</span>${esc(o.t)}<span class="n">${o.n} app${o.n > 1 ? "s" : ""}</span></div>`).join("");
  acEl.hidden = false;
}

function applyTag(t) {
  fused.params.set("tag", t);
  fused.params.set("q", "");
  acEl.hidden = true; acEl.innerHTML = ""; acIndex = -1;
  qEl.focus();
}

qEl.addEventListener("input", () => { fused.params.set("q", qEl.value); acIndex = -1; renderAc(); });
qEl.addEventListener("focus", renderAc);
qEl.addEventListener("blur", () => setTimeout(() => { acEl.hidden = true; }, 0));
qEl.addEventListener("keydown", (e) => {
  const opts = acEl.querySelectorAll(".opt");
  if (e.key === "Backspace" && !qEl.value && state().tag) { fused.params.set("tag", ""); return; }
  if (!opts.length) return;
  if (e.key === "ArrowDown") { e.preventDefault(); acIndex = (acIndex + 1) % opts.length; renderAc(); }
  // acIndex starts at -1 (nothing selected): the naive (acIndex - 1 + len) % len
  // lands on len-2, skipping the last option. Special-case "nothing selected
  // yet" the same as "wrap past the first" — both should land on the last.
  else if (e.key === "ArrowUp") { e.preventDefault(); acIndex = acIndex <= 0 ? opts.length - 1 : acIndex - 1; renderAc(); }
  else if (e.key === "Enter" && acIndex >= 0) { e.preventDefault(); applyTag(opts[acIndex].dataset.ac); }
  else if (e.key === "Escape") { e.preventDefault(); acEl.hidden = true; acIndex = -1; }
});
// mousedown, not click: fires before the input's blur hides the list.
acEl.addEventListener("mousedown", (e) => {
  const opt = e.target.closest?.("[data-ac]");
  if (opt) { e.preventDefault(); applyTag(opt.dataset.ac); }
});
document.getElementById("tag-token").addEventListener("click", (e) => {
  if (e.target.closest?.("[data-untag]")) fused.params.set("tag", "");
});
document.getElementById("sort").addEventListener("change", (e) =>
  fused.params.set("sort", e.target.value));
document.getElementById("installed-toggle").addEventListener("click", () =>
  fused.params.set("cloned", state().clonedOnly ? "" : "1"));
document.getElementById("refresh").addEventListener("click", refresh);
chipsEl.addEventListener("click", (e) => {
  if (e.target.closest?.("[data-more]")) { chipsExpanded = !chipsExpanded; renderChips(); return; }
  const chip = e.target.closest?.("[data-tag]");
  if (!chip) return;
  const t = chip.dataset.tag;
  fused.params.set("tag", t && state().tag === t ? "" : t);
});
document.addEventListener("keydown", (e) => {
  // The search box is hidden on the detail page (browseChrome display:none) —
  // stealing "/" there blocks Firefox's own quick-find for no benefit, since
  // focus()/select() on a display:none input is a no-op anyway.
  if (e.key === "/" && !e.metaKey && !e.ctrlKey && !e.altKey && !state().open
      && !/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName || "")) {
    e.preventDefault();
    qEl.focus();
    qEl.select();
  }
});
content.addEventListener("click", (e) => {
  const card = e.target.closest?.(".card");
  if (card) fused.params.set("app", card.dataset.slug);
});

fused.params.onChange(render);

loadCatalog(true).then(() => {
  // Stale-while-revalidate: catalog painted from disk; quietly re-sync in the
  // background and repaint if it moved.
  if (catalog) {
    fused.runPython(PY, { action: "refresh" }, { key: "background-refresh" })
      .then((res) => {
        if (res.status === "ok" && res.commit !== catalog.commit) {
          catalog = res;
          if (!state().open) render();   // don't yank a detail page mid-read
        } else if (res.status === "ok") {
          catalog = res;   // fresh install-state join, no visual change needed
        }
      })
      .catch(() => {});    // background sync failure is not an error state
  }
});
</script>
</body>
</html>
