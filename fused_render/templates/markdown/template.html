            // click resolver walks past it to the `<code>` element and
            // every click inside a code span lands on the opening fence.
            if (code.firstChild) {
              spans.push({
                node: code.firstChild,
                from: base + m.index + m[1].length + (body === m[2] ? 0 : 1),
              });
            }
          }
        } else if (/^!?\[\[/.test(m[0])) {
          const node = wikilinkWidget(m[0]).build();
          parent.appendChild(node);
          if (spans) spans.push({ node, from: base + m.index });
        } else if (m[4] !== undefined) {
          const a = document.createElement("a");
          a.className = "lp-link";
          a.textContent = unescapeInline(m[3]) || m[4];
          applyLinkTarget(a, m[4]);
          parent.appendChild(a);
          if (spans) {
            spans.push({ node: a, from: base + m.index });
            // Only a label that came through unescaped and non-empty sits
            // at a known source offset (one past the `[`); an unescaped or
            // url-substituted label has no character-for-character mapping,
            // and a click in it resolves to the link's own start instead.
            if (a.firstChild && a.textContent === m[3]) {
              spans.push({ node: a.firstChild, from: base + m.index + 1 });
            }
          }
        } else if (m[5] !== undefined) {
          // `base + m.index + 2`: past the opening `~~`, at the body's own
          // source offset, so a click landing in the recursed text resolves
          // to where that text actually starts, not to the strike marker.
          parent.appendChild(inlineSpan("lp-strike", m[5], spans, base + m.index + 2));
        } else if (m[7] !== undefined) {
          // Underscore emphasis does not fire intraword: `snake_case_word`
          // must stay literal. Asterisk emphasis has no such restriction.
          if (m[6][0] === "_" && /\w/.test(text[m.index - 1] || "")) {
            const node = document.createTextNode(m[0]);
            parent.appendChild(node);
            if (spans) spans.push({ node, from: base + m.index });
          } else {
            parent.appendChild(inlineSpan("lp-bold", m[7], spans, base + m.index + m[6].length));
          }
        } else if (m[9] !== undefined) {
          if (m[8][0] === "_" && /\w/.test(text[m.index - 1] || "")) {
            const node = document.createTextNode(m[0]);
            parent.appendChild(node);
            if (spans) spans.push({ node, from: base + m.index });
          } else {
            parent.appendChild(inlineSpan("lp-italic", m[9], spans, base + m.index + m[8].length));
          }
        } else {
          const node = document.createElement("br");
          parent.appendChild(node);
          if (spans) spans.push({ node, from: base + m.index });
        }
      }
      if (last < text.length) {
        const node = document.createTextNode(unescapeInline(text.slice(last)));
        parent.appendChild(node);
        if (spans) spans.push({ node, from: base + last });
      }
      return parent;
    }

    // Column offsets into `line`, one per cell — what a committed cell edit
    // writes through, so only one cell's range is replaced and the rest of
    // the row's spacing is untouched. A `|` is a boundary except right after
    // a `\`, which is how an escaped pipe survives as cell text. The leading
    // bar is dropped when everything before it is blank, and the trailing
    // bar when everything after it is blank — a row with no bars at all, or
    // a lone `|`, falls out of the same logic without ever producing a
    // `start > end` range.
    function splitRow(line) {
      const bars = [];
      for (let i = 0; i < line.length; i++) {
        if (line[i] === "\\") { i++; continue; }
        if (line[i] === "|") bars.push(i);
      }
      const bounds = [-1, ...bars, line.length];
      const cells = [];
      for (let i = 0; i < bounds.length - 1; i++) {
        cells.push({ start: bounds[i] + 1, end: bounds[i + 1] });
      }
      if (cells.length && line.slice(cells[0].start, cells[0].end).trim() === "") {
        cells.shift();
      }
      if (cells.length && line.slice(cells[cells.length - 1].start, cells[cells.length - 1].end).trim() === "") {
        cells.pop();
      }
      return cells;
    }

    // The delimiter row (`| --- | :-: |`) is structure, not content: it sets
    // per-column alignment and is never itself rendered as a table row. Null
    // unless every cell is a bare dash run with optional colons.
    function rowAlignment(line) {
      const cells = splitRow(line);
      if (!cells.length) return null;
      const aligns = [];
      for (const { start, end } of cells) {
        const cell = line.slice(start, end).trim();
        if (!/^:?-+:?$/.test(cell)) return null;
        const left = cell.startsWith(":");
        const right = cell.endsWith(":");
        aligns.push(left && right ? "center" : right ? "right" : left ? "left" : "");
      }
      return aligns;
    }

    // A pipe table rendered as a table, with its own inline renderer (above)
    // so `` `code` ``, links and emphasis show inside cells. Opaque: CM
    // handles no events from inside the widget, so a click on a cell does not
    // put the caret in the source, which would reveal the whole table as pipe
    // markup. Editing instead happens through a `contenteditable` island scoped
    // to one cell at a time — a DOM mutation confined to a widget's own root
    // is invisible to CM's observer, and focusing that cell does not move the
    // document selection either, so the rest of the table stays rendered
    // while one cell shows raw source.
    function tableWidget(source) {
      return new DomWidget("tb:" + source, (editorView) => {
        const lines = source.split("\n");
        // The alignment row sits BELOW the header it aligns, so it is read in
        // a pass of its own: the header's cells are built before the row loop
        // would reach it, and a column whose body is right-aligned under a
        // left-aligned heading is not what the delimiter row asked for.
        const align = lines.reduce(
          (found, line) => found || (line.trim() ? rowAlignment(line) : null), null);
        const table = document.createElement("table");
        table.className = "lp-table" + (writable ? " lp-table-live" : "");
        let rowIndex = 0;
        const order = [];

        function renderCell(td, raw) {
          td.textContent = "";
          // A plain JS property, not a dataset entry: this holds live DOM
          // nodes (the click handler's source map, resolved in `wireCell`
          // below), and `dataset` only ever holds strings.
          td._cellSpans = [];
          if (raw) renderInline(raw, td, td._cellSpans, 0);
          // A no-break space, not a plain one: an empty cell whose only
          // content collapses has no box to aim a click at.
          else td.appendChild(document.createTextNode("\u00a0"));
        }

        // Never an offset captured at build time — an edit above the table
        // moves it, so the table's own position is re-resolved on every use,
        // the same way `taskWidget` addresses its checkbox.
        function cellRange(td) {
          const tableStart = editorView.posAtDOM(table);
          const lineNo = editorView.state.doc.lineAt(tableStart).number + Number(td.dataset.cellRow);
          if (lineNo > editorView.state.doc.lines) return null;
          const line = editorView.state.doc.line(lineNo);
          const cells = splitRow(line.text);
          const col = Number(td.dataset.cellCol);
          if (col >= cells.length) return null;
          const cell = cells[col];
          return { from: line.from + cell.start, to: line.from + cell.end };
        }

        function placeCaret(el, offset) {
          const node = el.firstChild || el;
          const range = document.createRange();
          if (node.nodeType === Node.TEXT_NODE) {
            const len = node.nodeValue.length;
            range.setStart(node, offset === undefined ? len : Math.max(0, Math.min(offset, len)));
          } else {
            range.setStart(node, 0);
          }
          range.collapse(true);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
        }

        function beginEdit(td, offset) {
          if (!writable || td.isContentEditable) return;
          const range = cellRange(td);
          if (!range) return;
          const raw = editorView.state.sliceDoc(range.from, range.to).trim();
          if (raw !== td.dataset.cellRaw) return; // the table moved out from under us
          td.textContent = raw;
          td.classList.add("lp-cell-edit");
          td.contentEditable = "plaintext-only";
          if (td.contentEditable !== "plaintext-only") td.contentEditable = "true";
          td.spellcheck = false;
          td.focus();
          placeCaret(td, offset === undefined ? undefined : Math.min(offset, raw.length));
        }

        // `next` is the index in `order` of the cell to open once this one
        // is done with — a Tab's neighbour, or the cell a click landed in
        // while this one was still open — or null to just close.
        function finishEdit(td, commit, next) {
          if (!td.isContentEditable) return;
          const typed = td.innerText.replace(/\s+/g, " ").trim();
          // Turned off and un-classed FIRST: the `blur` a subsequent focus
          // move fires must be a no-op, not a second commit.
          td.contentEditable = "false";
          td.classList.remove("lp-cell-edit");
          const range = cellRange(td);
          if (!commit || !range || typed === td.dataset.cellRaw) {
            renderCell(td, td.dataset.cellRaw);
            // Nothing was dispatched, so no rebuild is coming and the next
            // cell is opened in the DOM that is already here.
            if (next !== null && order[next]) beginEdit(order[next]);
            return;
          }
          const { from, to } = range;
          // A bare pipe in the typed text would split the row; an already
          // escaped one is left alone.
          const text = " " + typed.replace(/\\?\|/g, "\\|") + " ";
          if (next !== null) {
            const tableStart = editorView.posAtDOM(table);
            pendingCellEdit = {
              source: source.slice(0, from - tableStart) + text + source.slice(to - tableStart),
              index: next,
            };
          }
          editorView.dispatch({ changes: { from, to, insert: text } });
          // Consumed synchronously by the rebuild this dispatch triggers —
          // clearing it here stops a stale entry from stealing focus later.
          pendingCellEdit = null;
          void save();
        }

        function wireCell(td) {
          // A link inside a cell keeps working through the document-level
          // delegated click handler — it must not be swallowed here.
          td.addEventListener("mousedown", (event) => {
            if (event.target.closest("a")) return;
            // `stopPropagation` always: nothing outside the widget — CM's own
            // pointer handling included — should react to a press inside it,
            // open or not. `preventDefault` is conditional, though: for a
            // cell that is NOT yet open it stops the browser from starting a
            // native selection/caret in a widget that has no caret to place
            // (that would-be selection is what `beginEdit` replaces with the
            // deliberate `placeCaret` call once the island exists). Once the
            // cell IS `contenteditable`, preventing default here would block
            // the very thing that island exists for — the browser placing the
            // caret and drag-selecting inside it — leaving only the arrow
            // keys able to move the caret, so this branch lets the browser's
            // ordinary mousedown behaviour run.
            if (!td.isContentEditable) event.preventDefault();
            event.stopPropagation();
          });
          td.addEventListener("click", (event) => {
            if (event.target.closest("a")) return;
            // The click hit is measured in RENDERED text, but `beginEdit`
            // places the result in the RAW source string, so counting
            // rendered characters (as `td.textContent`) would land the caret
            // at the wrong offset whenever the cell has any markup —
            // resolved instead through `_cellSpans`, the source map
            // `renderInline`/`renderCell` built alongside the DOM.
            let offset = td.dataset.cellRaw.length;
            try {
              // Two spellings of the same question — Firefox answers only
              // the second, every other engine only the first.
              const hit = document.caretRangeFromPoint
                ? document.caretRangeFromPoint(event.clientX, event.clientY)
                : document.caretPositionFromPoint(event.clientX, event.clientY);
              const hitOffset = hit && (hit.startOffset !== undefined ? hit.startOffset : hit.offset);
              // Walk from the exact node the browser hit up to whichever
              // ancestor `_cellSpans` recorded — a widget's inner DOM has no
              // entry of its own, so a click inside one resolves through the
              // recorded element a level up, to that construct's start.
              // Stops at `td` itself: nothing above the cell's own children
              // is this cell's source.
              let resolved = null;
              for (let node = hit && (hit.startContainer || hit.offsetNode);
                   node && node !== td; node = node.parentNode) {
                const entry = td._cellSpans.find((s) => s.node === node);
                if (!entry) continue;
                // A text node's offset is added to its recorded start — but
                // that start is a RAW offset while the node's own text is
                // UNESCAPED, so an escape (`\*` etc.) inside the run is two
                // source characters collapsed to one rendered one. A click
                // past an escape in a run that has one can therefore land up
                // to one character off per escape — bounded and rare, unlike
                // the whole-marker skew this replaces.
                resolved = node.nodeType === Node.TEXT_NODE
                  ? entry.from + Math.min(hitOffset || 0, (node.nodeValue || "").length)
                  : entry.from;
                break;
              }
              if (resolved !== null) offset = resolved;
            } catch (e) {
              // Fall back to end-of-source.
            }
            // A click straight from one open cell into another: the open
            // cell commits first, and its dispatch rebuilds this whole table,
            // so the clicked cell is opened by index on the OTHER side of that
            // rebuild rather than in this now-doomed DOM.
            const open = order.find((cell) => cell.isContentEditable);
            if (open && open !== td) {
              finishEdit(open, true, Number(td.dataset.cellIndex));
              return;
            }
            beginEdit(td, offset);
          });
          td.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
              finishEdit(td, false, null);
            } else if (event.key === "Enter") {
              event.preventDefault();
              finishEdit(td, true, null);
            } else if (event.key === "Tab") {
              event.preventDefault();
              finishEdit(td, true, Number(td.dataset.cellIndex) + (event.shiftKey ? -1 : 1));
            }
          });
          td.addEventListener("blur", () => finishEdit(td, true, null));
          // For browsers without `plaintext-only`, where a raw paste could
          // otherwise drop rich markup into the cell.
          td.addEventListener("paste", (event) => {
            event.preventDefault();
            const text = (event.clipboardData || window.clipboardData)
              .getData("text/plain").replace(/\s+/g, " ");
            document.execCommand("insertText", false, text);
          });
        }

        lines.forEach((line, lineIdx) => {
          if (!line.trim()) return;
          if (rowAlignment(line) !== null) return;
          const tr = document.createElement("tr");
          splitRow(line).forEach((cell, col) => {
            const td = document.createElement(rowIndex === 0 ? "th" : "td");
            const raw = line.slice(cell.start, cell.end).trim();
            // Namespaced as `cell*` (`data-cell-row` etc.), not the bare
            // `line`/`col`/`raw`/`index` this cell's own code would otherwise
            // reach for: the document-level delegated click handler already
            // claims a bare `[data-line]` as an outline row, and a widget's
            // internal bookkeeping must not answer to a selector it does not
            // own.
            td.dataset.cellRow = String(lineIdx);
            td.dataset.cellCol = String(col);
            td.dataset.cellRaw = raw;
            td.dataset.cellIndex = String(order.length);
            if (align && align[col]) td.style.textAlign = align[col];
            renderCell(td, raw);
            wireCell(td);
            order.push(td);
            tr.appendChild(td);
          });
          table.appendChild(tr);
          rowIndex++;
        });

        // The build runs inside the dispatch a Tab-triggered commit caused,
        // so the focus move onto the neighbour cell has to wait a frame.
        if (pendingCellEdit && pendingCellEdit.source === source) {
          const target = order[pendingCellEdit.index];
          pendingCellEdit = null;
          if (target) requestAnimationFrame(() => beginEdit(target));
        }

        return table;
      }, true);
    }

    // A fence's language chip + copy button (6b.3/6b.4), anchored to the
    // opening line as a zero-width WIDGET (not a replacement) at that line's
    // end — the fence markers stay visible (MD-18a), this only adds a small
    // floating toolbar over them. Opaque: a click on the chip or the copy
    // button must not move the caret or count as an edit.
    // The enclosing FencedCode node for a document position — one function,
    // so the copy button (below) and anything else that ever needs "which
    // fence is this" ask the tree the same way `within`/`enclosingLinkTarget`
    // already do for their own node kinds.
    function enclosingFence(state, pos) {
      const tree = CM.syntaxTree(state);
      for (let node = tree.resolveInner(pos, 1); node; node = node.parent) {
        if (node.name === "FencedCode") return node;
      }
      return null;
    }

    function fenceChipWidget(lang, body) {
      // `body` names the widget (the key), but the CLICK HANDLER below does
      // NOT close over it — see the comment there for why.
      const key = "fc:" + lang + "|" + body.length + "|" + body.slice(0, 40);
      return new DomWidget(key, (editorView) => {
        const wrap = document.createElement("span");
        wrap.className = "lp-fence-chip";
        if (lang) {
          const label = document.createElement("span");
          label.className = "lp-lang-label";
          label.textContent = lang;
          wrap.appendChild(label);
        }
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "lp-copy-btn";
        btn.textContent = "Copy";
        btn.title = "Copy code";
        btn.addEventListener("mousedown", (e) => e.stopPropagation());
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (!navigator.clipboard || !navigator.clipboard.writeText) return;
          // Reads the CURRENT document at click time rather than closing over
          // a snapshot: CM reuses a widget's DOM whenever `key` matches
          // across a rebuild (the fast path, so an untouched fence is not
          // rebuilt on every keystroke elsewhere in the note), and an edit
          // that happens to leave this fence's length and first 40 characters
          // unchanged — appending well past that point, or editing a LATER
          // fence, is enough — reuses the OLD widget with the OLD closure, so
          // a captured `body` string would silently copy stale code, the
          // worst failure mode for a copy button (nothing looks wrong).
          // `posAtDOM`, not the closed-over node/position either — that is
          // the SAME idiom `taskWidget` already uses to find its own current
          // position from its own DOM node, which self-heals across content
          // ABOVE this fence shifting its absolute offset, not only content
          // inside it changing.
          const pos = editorView.posAtDOM(wrap);
          const fence = enclosingFence(editorView.state, pos);
          const currentBody = fence
            ? fenceLangAndBody(editorView.state, fence)[1] : body;
          navigator.clipboard.writeText(currentBody).then(() => {
            btn.textContent = "Copied";
            setTimeout(() => { btn.textContent = "Copy"; }, 1200);
          }).catch(() => {});
        });
        wrap.appendChild(btn);
        return wrap;
      }, true);
    }

    // The fence's language, off its info string (the text right after the
    // opening ``` / ~~~), and its body with the marker lines stripped — what
    // the copy button actually copies.
    function fenceLangAndBody(state, node) {
      const first = state.doc.lineAt(node.from).number;
      const lang = (/^ {0,3}(?:`{3,}|~{3,})[ \t]*(\S*)/.exec(state.doc.line(first).text) || [])[1] || "";
      const lines = state.doc.sliceString(node.from, node.to).split("\n");
      const closesWithFence = lines.length > 1
        && /^ {0,3}(`{3,}|~{3,})[ \t]*$/.test(lines[lines.length - 1]);
      const body = lines.length <= 1 ? ""
        : lines.slice(1, closesWithFence ? -1 : undefined).join("\n");
      return [lang, body];
    }

    // ---- the decoration set -------------------------------------------------

    const WIKILINK_RE = /!?\[\[([^\[\]\n]+?)\]\]/g;

    function within(tree, pos, names) {
      for (let node = tree.resolveInner(pos, 1); node; node = node.parent) {
        if (names.has(node.name)) return true;
      }
      return false;
    }

    // Takes a STATE, not a view, and walks the whole document — see the
    // StateField below for why it cannot be a view plugin, and therefore has no
    // viewport to narrow the walk to. The bound on that walk is `MAX_BYTES`
    // above: this surface never opens a file it did not agree to load, so 2 MB
    // is the worst case. (This comment used to cite the graph's 256 KB per-note
    // cap, which never bounded THIS walk — the editor's ceiling has always been
    // its own — and that cap is now gone.) Whole-document also removes the
    // viewport/height feedback loop that made scrolling jitter.
    function buildDecorations(state) {
      const lines = selectedLines(state);
      const tree = CM.syntaxTree(state);
      const out = [];
      // CM rejects overlapping replacements, so every replaced range is
      // recorded as it is made and the regex passes below skip anything that
      // would land inside one. Decorations are built as Ranges via
      // `.range(from, to)`, the shape Decoration.set takes. A replacement here
      // MAY span line breaks (the table widget does) — but only because these
      // come from a StateField: CM throws "Decorations that replace line breaks
      // may not be specified via plugins" for the same range out of a
      // ViewPlugin. `block: true` would additionally demand exact line
      // boundaries and throw without them.
      const blocked = [];
      function pushMark(from, to, cls) {
        if (from >= to) return;
        out.push(CM.Decoration.mark({ class: cls }).range(from, to));
      }
      function pushHide(from, to) {
        if (from >= to) return;
        out.push(CM.Decoration.replace({}).range(from, to));
        blocked.push([from, to]);
      }
      function pushWidget(from, to, widget) {
        out.push(CM.Decoration.replace({ widget }).range(from, to));
        blocked.push([from, to]);
      }
      const isBlocked = (from, to) => blocked.some(([a, b]) => from < b && to > a);

      // A bare `https://…` or the inside of an angle `<https://…>` (MD-24).
      // A MARK carrying its own `<a>`, not a replacement widget: the range's
      // display text ALREADY equals its target, so a widget would replace those
      // characters with an element rendering the identical characters — no
      // visible gain, and the caret loses the ability to sit inside the URL and
      // edit it. Nothing is rewritten on disk either (D200), which is what makes
      // this repair URLs in notes that were written long before it existed.
      function pushUrl(from, to) {
        const raw = state.doc.sliceString(from, to);
        // GFM's autolink extension matches three shapes, and only one of them
        // is already a URL: `www.x.com` and `me@x.com` are URL nodes too, and
        // an href of "www.x.com" resolves against this page rather than the web.
        // `www.` is tested BEFORE the `@`: a www autolink may carry an `@` in
        // its path or query (`www.x.com/u@h`), and treating that as an address
        // would hand it to a mail client instead of a browser.
        const href = /^[a-z][a-z0-9+.-]*:/i.test(raw) ? raw
          : /^www\./i.test(raw) ? "https://" + raw
          : raw.includes("@") ? "mailto:" + raw
          : "https://" + raw;
        // `lp-bare-link` (6b follow-up, D620 link-activation fix): this is a
        // MARK over live document text, not a widget — the caret can and
        // should still land here on an ordinary click (it is editable prose,
        // unlike a `[label](url)` widget). So a plain click here EDITS, same
        // as clicking anywhere else in the line; only Ctrl/Cmd-click or
        // middle-click OPENS it — see the delegated click handler.
        out.push(CM.Decoration.mark({
          class: "lp-link lp-bare-link",
          tagName: "a",
          attributes: { href, target: "_blank", rel: "noopener" },
        }).range(from, to));
      }

      // Frontmatter is not part of the vendored grammar, and what the grammar
      // makes of it instead is actively wrong: `---` opens as a HorizontalRule
      // and `title: x\n---` closes as a SetextHeading2, so a YAML block would
      // render as a rule followed by a large heading. It is therefore matched
      // by a line scan, decorated as dim monospace, and — the part that
      // matters — every tree decoration inside it is suppressed below.
      // Dimmed rather than hidden: a properties table is separate work
      // (MD-18b), and a silently invisible block is worse than a plain one.
      let frontmatterEnd = -1;
      if (state.doc.lines > 1 && state.doc.line(1).text.trim() === "---") {
        for (let n = 2; n <= state.doc.lines; n++) {
          if (state.doc.line(n).text.trim() === "---") {
            frontmatterEnd = state.doc.line(n).to;
            break;
          }
        }
        if (frontmatterEnd !== -1) {
          out.push(...lineClass(state, 0, frontmatterEnd, "lp-fm-line"));
        }
      }

      tree.iterate({
        enter: (node) => {
          const name = node.name;
          // Inside frontmatter the grammar's answer is wrong (see above), so
          // nothing it says about this range is acted on.
          if (name !== "Document" && node.to <= frontmatterEnd) return false;
          const open = touched(state, lines, node.from, node.to);

          if (HEADINGS[name]) {
            pushMark(node.from, node.to, "lp-h" + HEADINGS[name]);
            // The size is an inline mark, but space above and below is not
            // something an inline mark can carry — a line decoration is the only
            // place vertical margin can live (MD-26). Unconditional, like the
            // size mark beside it: spacing that appeared when the caret arrived
            // would shift the document under the cursor as you arrow through it.
            // `edges`, because a Setext heading spans TWO lines — its title and
            // its `===` underline — and a top margin on both would split the
            // underline away from the text it underlines.
            out.push(...lineClass(
              state, node.from, node.to, "lp-h" + HEADINGS[name] + "-line", true));
            return true; // descend: the HeaderMark child is hidden below
          }
          if (name === "HeaderMark") {
            const parent = node.node.parent;
            if (!parent || !HEADINGS[parent.name]) return false;
            if (touched(state, lines, parent.from, parent.to)) {
              pushMark(node.from, node.to, "lp-mark");
              return false;
            }
            // Swallow the space after `##` too, or the text starts indented.
            const after = state.doc.sliceString(node.to, node.to + 1);
            pushHide(node.from, node.to + (after === " " ? 1 : 0));
            return false;
          }
          if (EMPHASIS[name]) {
            pushMark(node.from, node.to, EMPHASIS[name]);
            return true;
          }
          if (EMPHASIS_MARKS.has(name)) {
            if (open) pushMark(node.from, node.to, "lp-mark");
            else pushHide(node.from, node.to);
            return false;
          }
          if (name === "InlineCode") {
            pushMark(node.from, node.to, "lp-code");
            return true;
          }
          if (name === "CodeMark") {
            const parent = node.node.parent;
            // Only an inline span's backticks vanish; a fence keeps its
            // markers, exactly as Obsidian does.
            if (!parent || parent.name !== "InlineCode") return false;
            if (open) pushMark(node.from, node.to, "lp-mark");
            else pushHide(node.from, node.to);
            return false;
          }
          if (name === "FencedCode" || name === "CodeBlock") {
            out.push(...lineClass(
              state, node.from, node.to, "lp-fence-line", true));
            // The chip only makes sense for a real FENCE (it reads the info
            // string), and only where that opening line is not itself the
            // point the caret is currently on — matching the treatment every
            // other block-level widget in this builder gives a touched line.
            if (name === "FencedCode") {
              const firstLine = state.doc.lineAt(node.from);
              const [lang, body] = fenceLangAndBody(state, node);
              out.push(CM.Decoration.widget({
                widget: fenceChipWidget(lang, body), side: 1,
              }).range(firstLine.to));
            }
            return true; // let the embedded language highlight inside
          }
          if (name === "Blockquote") {
            out.push(...lineClass(
              state, node.from, node.to, "lp-quote-line", true));
            return true;
          }
          // A list is spaced as one block, not per row: margin on every item
          // would space the rows apart from each other, which is the opposite of
          // how a list should read (MD-26). Only the outermost list is tagged —
          // a nested one is inside its parent's range and must not add a second
          // gap — which `LISTS[parent]` below is checking for.
          if (LISTS[name]) {
            const parent = node.node.parent;
            const nested = parent && (LISTS[parent.name] || parent.name === "ListItem");
            if (!nested) {
              out.push(...lineClass(
                state, node.from, node.to, "lp-list-line", true));
            }
            return true;
          }
          if (name === "QuoteMark") {
            if (open) pushMark(node.from, node.to, "lp-mark");
            else {
              const after = state.doc.sliceString(node.to, node.to + 1);
              pushHide(node.from, node.to + (after === " " ? 1 : 0));
            }
            return false;
          }
          if (name === "ListMark") {
            pushMark(node.from, node.to, "lp-bullet");
            return false;
          }
          if (name === "TaskMarker") {
            // Rendered even with the caret on its line — as in Obsidian, a
            // checkbox is a control, not markup you edit by hand.
            const checked = /[xX]/.test(state.doc.sliceString(node.from, node.to));
            pushWidget(node.from, node.to, taskWidget(checked));
            return false;
          }
          if (name === "HorizontalRule") {
            if (open) return false;
            pushWidget(node.from, node.to, hrWidget());
            return false;
          }
          if (name === "Table") {
            if (open) return true;
            pushWidget(node.from, node.to,
              tableWidget(state.doc.sliceString(node.from, node.to)));
            return false;
          }
          if (name === "Image" || name === "Link") {
            if (open) return true;
            // The badge shape: `[![alt](imgsrc)](url)`, an outer Link whose
            // entire label is one Image — asked of the TREE, not grown into
            // the regex below as bracket-balancing, because the tree already
            // knows this shape and a hand-rolled balancer is exactly the kind
            // of "is this code?" reimplementation that has bitten the link
            // layer twice before (MD-3). This cannot mistake a `[[wikilink]]`
            // for one: those wrap their double brackets in a single Link or
            // Image node directly, never a genuine Image NESTED inside a
            // Link, so no extra guard is needed to keep the two apart.
            if (name === "Link") {
              const child = node.node.getChild("Image");
              if (child && child.from === node.from + 1) {
                const tail = state.doc.sliceString(child.to, node.to);
                const tailMatch = /^\]\((\S*)\)$/.exec(tail);
                const innerRaw = state.doc.sliceString(child.from, child.to);
                const innerMatch = /^!\[([^\]]*)\]\((\S*)\)$/.exec(innerRaw);
                if (tailMatch && innerMatch) {
                  pushWidget(node.from, node.to,
                    linkedImageWidget(innerMatch[1], innerMatch[2], tailMatch[1]));
                  return false;
                }
              }
            }
            const raw = state.doc.sliceString(node.from, node.to);
            // The URL group is `\S*`, not a character class excluding `()` —
            // a link destination may contain balanced parens (a Wikipedia
            // URL is the classic case, `Foo_(bar)`), and the grammar has
            // already found the construct's true end (`node.to`), so greedy
            // `\S*` backtracking exactly one char for the trailing `\)$`
            // recovers the whole destination correctly either way.
            const match = /^(!?)\[([^\]]*)\]\((\S*)\)$/.exec(raw);
            // No match means this is not a plain inline link: a reference
            // link, a titled link, or — the common case — the inner brackets
            // of a `[[wikilink]]`, which the regex pass below owns.
            if (!match) return true;
            pushWidget(node.from, node.to, match[1]
              ? imageWidget(match[2], match[3], node.from)
              : markdownLinkWidget(match[2], match[3]));
            return false;
          }
          if (name === "URL") {
            // A `[lbl](target)` link's URL is markup INSIDE a node the branch
            // above owns — either replaced whole by the link widget (and then
            // never reached, since that branch returns false) or deliberately
            // left as source, as for a titled or reference link. Decorating it
            // here would be asserting a second time about the same range.
            const parent = node.node.parent;
            if (parent && (parent.name === "Link" || parent.name === "Image")) {
              return false;
            }
            // The grammar does not emit a URL node inside a fence or a code
            // span, so this guard is belt-and-braces — but it is the SAME
            // narrow code-node set the wikilink pass uses (MD-3), rather than a
            // new "is this code?" rule, because the last one of those silently
            // stopped every wikilink from rendering.
            if (within(tree, node.from + 1, CODE_NODES)) return false;
            // No `open` check: a bare URL hides nothing, so there is nothing for
            // the caret to reveal. Its own text stays exactly as typed either
            // way, and un-styling it under the caret would only make the line
            // flicker. An Autolink's brackets DO hide, and they reveal below.
            pushUrl(node.from, node.to);
            return false;
          }
          if (name === "LinkMark") {
            // Only an angle autolink's `<`/`>` vanish. A `[lbl](target)` link's
            // marks belong to a node already replaced whole, and a wikilink's
            // inner brackets belong to the regex pass — hiding either here would
            // put a replacement inside a replacement.
            const parent = node.node.parent;
            if (!parent || parent.name !== "Autolink") return false;
            if (open) pushMark(node.from, node.to, "lp-mark");
            else pushHide(node.from, node.to);
            return false;
          }
          return true;
        },
      });

      // Wikilinks are not in the grammar, so they are matched by regex and then
      // checked AGAINST the tree: a `[[x]]` inside a fence stays literal, which
      // is the same line graph.py draws over the same text (MD-3). A `[[` inside
      // frontmatter is not a link either.
      const chunk = state.doc.toString();
      WIKILINK_RE.lastIndex = 0;
      let match;
      while ((match = WIKILINK_RE.exec(chunk))) {
        const start = match.index;
        const end = start + match[0].length;
        if (start < frontmatterEnd) continue;
        if (isBlocked(start, end) || within(tree, start + 2, CODE_NODES)) continue;
        if (touched(state, lines, start, end)) continue;
        pushWidget(start, end, wikilinkWidget(match[0]));
      }

      return CM.Decoration.set(out, true);
    }

    // A StateField, NOT a ViewPlugin — and this is load-bearing, not a style
    // preference. CM refuses a plugin-provided replacement that spans a line
    // break ("Decorations that replace line breaks may not be specified via
    // plugins", @codemirror/view), and the table widget replaces a multi-line
    // Table node with one element. As a plugin that threw during the view update
    // the instant a table scrolled into the viewport, abandoning the rest of the
    // render and leaving unpainted white regions on screen — reported as "parts
    // of the page go blank while scrolling". A state field is allowed to span
    // line breaks, so the constraint disappears rather than being worked around.
    // Do not "simplify" this back to a ViewPlugin.
    const livePreviewField = CM.StateField.define({
      create: (state) => buildDecorations(state),
      update(value, tr) {
        // The syntax tree is NOT complete when the view opens: the language
        // extension parses a first chunk and then advances in the background,
        // dispatching as it goes. A whole-document walk over a half-parsed tree
        // would leave everything past the parse frontier undecorated until the
        // next keystroke, so an advanced tree counts as a reason to rebuild.
        // Identity compare — the language field hands out a new Tree each time.
        if (tr.docChanged || tr.selection
            || CM.syntaxTree(tr.startState) !== CM.syntaxTree(tr.state)
            || tr.effects.some((e) => e.is(relinkEffect))) {
          return buildDecorations(tr.state);
        }
        // Nothing that changes what renders, and `tr.docChanged` above covers
        // every case where positions moved, so the set is reused as-is.
        return value;
      },
      provide: (field) => CM.EditorView.decorations.from(field),
    });

    // ---- saving: Obsidian's model (MD-16) ----------------------------------
    // No save button, no dirty dot, no prompt. Autosave on an idle timer, on
    // focus loss and on tab switch; Cmd/Ctrl+S only forces the flush early.
    function setDirty(next) {
      dirty = next;
      // Deliberately no dirty indicator: the absence of save ceremony IS the
      // behaviour being copied. The slot only ever carries "Saving…" or a
      // failure, both of which a user does need to see.
      if (conflictEl.style.display !== "flex" && !saving) {
        saveStateEl.textContent = "";
        saveStateEl.classList.remove("error");
      }
    }

    function armAutosave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => { void save(); }, AUTOSAVE_MS);
    }

    async function save() {
      clearTimeout(saveTimer);
      while (saving && savePromise) await savePromise;
      if (!view || !dirty || !writable) return;
      if (conflictEl.style.display === "flex") return; // never auto-overwrite
      savePromise = doSave();
      await savePromise;
    }

    async function doSave() {
      // CM's Text is immutable, so a reference compare after the await detects
      // edits that landed during the write — those must not be masked by
      // setDirty(false), or the idle timer would skip them.
      const docState = view.state.doc;
      const body = docState.toString();
      saving = true;
      saveStateEl.textContent = "Saving…";
      saveStateEl.classList.remove("error");
      try {
        const st = await fused.writeFile(file, body, { expectedMtime: mtime });
        mtime = st.mtime;
        text = body;
        hideConflict();
        if (view.state.doc === docState) {
          setDirty(false);
          saveStateEl.textContent = "";
        } else {
          setDirty(true);
          armAutosave();
        }
        // Each save re-parses exactly this note, so the ghosts, the backlinks,
        // the graph and the `[[` candidates stay current with no rebuild (MD-9).
        candidates = null;
        await refreshLinks();
        if (graphOn()) void loadGraph();
      } catch (err) {
        if (err.type === "conflict") {
          showConflict("This note changed on disk while you were editing it.");
        } else if (err.type === "readonly") {
          writable = false;
          lockEditor("This file is read-only, so your edits can't be saved.");
        } else {
          saveStateEl.textContent = "Save failed: " + (err.message || "");
          saveStateEl.classList.add("error");
        }
      } finally {
        saving = false;
      }
    }

    function showConflict(message) {
      conflictTextEl.textContent = message;
      conflictEl.style.display = "flex";
      saveStateEl.textContent = "";
    }

    function hideConflict() { conflictEl.style.display = "none"; }

    async function reloadFromDisk() {
      try {
        const st = await fused.stat(file);
        const fresh = await fused.readFile(file);
        text = fresh;
        mtime = st.mtime;
        const wasWritable = writable;
        writable = st.writable !== false;
        hideConflict();
        if (view) {
          view.dispatch({ changes: { from: 0, to: view.state.doc.length, insert: fresh } });
        }
        setDirty(false);
        // Reassigning `writable` changes nothing on its own: `editable`/
        // `readOnly` are facets chosen when the view is BUILT. Without this, a
        // file that had become read-only stayed typeable (the edits then
        // failed at save time) and one that had become writable stayed locked
        // until the iframe reloaded — and this is the silent-reload path, so
        // nothing else was going to notice. Only on a change: rebuilding
        // every reload is churn.
        if (writable !== wasWritable) {
          fusedRoBadge.update(document.getElementById("ro"),
            writable ? "" : "Read-only",
            writable ? "" : "This file can't be written, so the editor opens locked.");
          buildEditor(fresh);
        }
        await refreshLinks();
      } catch (err) {
        saveStateEl.textContent = "Reload failed: " + (err.message || "");
        saveStateEl.classList.add("error");
      }
    }

    // "Keep my version" is the one write that goes without the lock — the user
    // has been shown the conflict and chosen.
    async function keepMine() {
      if (!view) return;
      const body = view.state.doc.toString();
      try {
        const st = await fused.writeFile(file, body);
        mtime = st.mtime;
        text = body;
        hideConflict();
        setDirty(false);
        await refreshLinks();
      } catch (err) {
        saveStateEl.textContent = "Save failed: " + (err.message || "");
        saveStateEl.classList.add("error");
      }
    }

    // External changes are noticed on focus and on becoming visible rather than
    // by a stat ticker: a poll is the traffic that killed a mount once already
    // (runtime.js's fs/events note), and this view must stay mount-agnostic.
    // Clean buffer -> silent reload, exactly as Obsidian does. Dirty buffer and
    // the mtime moved -> the banner, which is the one deliberate deviation
    // (MD-17): fused-render sits on shared paths where Obsidian's
    // only-writer-in-the-vault assumption does not hold.
    async function checkExternalChange() {
      if (!file || saving) return;
      let st;
      try {
        st = await fused.stat(file);
      } catch (err) {
        return; // transient — the next focus or the next save will notice
      }
      if (st.mtime === mtime) return;
      if (!dirty) {
        await reloadFromDisk();
        return;
      }
      showConflict("This note changed on disk while you were editing it.");
    }

    function lockEditor(message) {
      clearTimeout(saveTimer);
      fusedRoBadge.update(document.getElementById("ro"), "Read-only", message);
      if (view) buildEditor(view.state.doc.toString()); // rebuild with the lock on
    }

    function wantsDark() {
      return document.documentElement.getAttribute("data-theme") !== "light";
    }

    // ---- editing behaviours (MD-18) ----------------------------------------
    // Each of these is what makes Obsidian feel like Obsidian, and each is a
    // small keymap entry rather than a feature. Smart lists, list renumbering
    // and blockquote continuation are NOT reimplemented here: they are
    // `markdownKeymap` from the markdown grammar we vendored, which is the same
    // code Obsidian's own editor runs.
    function toggleWrap(editorView, marker) {
      const state = editorView.state;
      let { from, to } = state.selection.main;
      // Obsidian's ⌘B with nothing selected wraps the WORD under the caret, not
      // an empty pair of markers, and that expansion is also what makes the
      // unwrap below reachable without a selection: the caret sits inside the
      // word it wrapped a moment ago. `state.wordAt` is the language's own idea
      // of a word, so there is no second definition of one here; it answers null
      // on whitespace and on an empty line, and there the empty pair with the
      // caret between them is still the right thing to type into.
      if (from === to) {
        const word = state.wordAt(from);
        if (word) {
          from = word.from;
          to = word.to;
        }
      }
      const pre = state.sliceDoc(Math.max(0, from - marker.length), from);
      const post = state.sliceDoc(to, Math.min(state.doc.length, to + marker.length));
      if (pre === marker && post === marker) {
        editorView.dispatch({
          changes: [
            { from: from - marker.length, to: from },
            { from: to, to: to + marker.length },
          ],
          selection: { anchor: from - marker.length, head: to - marker.length },
        });
      } else {
        editorView.dispatch({
          changes: [{ from, insert: marker }, { from: to, insert: marker }],
          selection: { anchor: from + marker.length, head: to + marker.length },
        });
      }
      return true;
    }

    // ⌘K with the caret already inside `[label](target)` has to EDIT that link,
    // not nest a second one inside it. Which ranges are links comes from the
    // tree (MD-3: no second parser here) — but the tree alone is not enough, and
    // this is the grammar trap that already bit the link layer once: the
    // vendored grammar wraps a `[[wikilink]]`'s brackets in `Link`/`Image` nodes
    // too (MD-18a). So the enclosing node must ALSO parse as a plain inline
    // link, which is the same second test the Live Preview builder applies
    // before it draws a link widget — a reference link, a titled link and a
    // wikilink all fail it and are left to be typed over as before.
    function enclosingLinkTarget(state, pos) {
      const tree = CM.syntaxTree(state);
      for (let node = tree.resolveInner(pos, 0); node; node = node.parent) {
        if (node.name !== "Link") continue;
        const raw = state.doc.sliceString(node.from, node.to);
        // `\S*`, not a `()`-excluding class — see the matching comment in
        // buildDecorations; a Wikipedia-style URL with a balanced paren must
        // select correctly here too, or ⌘K would edit a truncated target.
        const match = /^\[([^\]]*)\]\((\S*)\)$/.exec(raw);
        if (!match) continue;
        const start = node.from + match[1].length + 3;
        return { from: start, to: start + match[2].length };
      }
      return null;
    }

    function insertLink(editorView) {
      const { from, to } = editorView.state.selection.main;
      const existing = enclosingLinkTarget(editorView.state, to);
      if (existing) {
        // Selecting the target rather than rewriting anything: the next
        // keystroke replaces the URL, which is what "⌘K edits the link" is.
        editorView.dispatch({ selection: { anchor: existing.from, head: existing.to } });
        return true;
      }
      const selected = editorView.state.sliceDoc(from, to);
      const isUrl = /^[a-z][a-z0-9+.-]*:\/\/\S*$/i.test(selected);
      const inserted = isUrl ? `[](${selected})` : `[${selected}]()`;
      editorView.dispatch({
        changes: { from, to, insert: inserted },
        selection: { anchor: isUrl ? from + 1 : from + selected.length + 3 },
      });
      return true;
    }

    // Cmd+Enter toggles the task on this line, adds a checkbox to a plain list
    // item, or makes the line a task — the three states Obsidian cycles.
    function toggleCheckbox(editorView) {
      const line = editorView.state.doc.lineAt(editorView.state.selection.main.head);
      const box = /^(\s*(?:[-*+]|\d+[.)])\s+)\[([ xX])\]/.exec(line.text);
      if (box) {
        const at = line.from + box[1].length + 1;
        editorView.dispatch({
          changes: { from: at, to: at + 1, insert: box[2] === " " ? "x" : " " },
        });
        return true;
      }
      const bullet = /^(\s*(?:[-*+]|\d+[.)])\s+)/.exec(line.text);
      const indent = /^\s*/.exec(line.text)[0];
      editorView.dispatch({
        changes: bullet
          ? { from: line.from + bullet[1].length, insert: "[ ] " }
          : { from: line.from + indent.length, insert: "- [ ] " },
      });
      return true;
    }

    // ---- line/block conversion (6d) -----------------------------------------
    // Two doors into one command set: the `/` menu (an insertion, below) and
    // "Turn into" in the selection bubble (a retroactive conversion). Both
    // change what a line's markup IS, never what it says — the strip regex
    // below is the inverse of every prefix this function can apply, so
    // "Turn into Quote" on an already-bulleted line replaces the bullet
    // rather than stacking `- > `.
    const BLOCK_STRIP_RE = /^(#{1,6}[ \t]+|>[ \t]?|(?:[-*+]|\d+[.)])[ \t]+(?:\[[ xX]\][ \t]+)?)/;
    function stripBlockPrefix(text) { return text.replace(BLOCK_STRIP_RE, ""); }

    // Converts every line the selection touches (or the caret's own line, with
    // no selection) to `kind`. `code` is the one kind that is not a per-line
    // prefix — it fences the whole touched range as a single block.
    function convertLines(kind) {
      if (!view || view.state.readOnly) return;
      const state = view.state;
      const sel = state.selection.main;
      const firstLine = state.doc.lineAt(sel.from).number;
      const lastLine = state.doc.lineAt(sel.to).number;

      if (kind === "code") {
        const from = state.doc.line(firstLine).from;
        const to = state.doc.line(lastLine).to;
        const insert = "```\n" + state.sliceDoc(from, to) + "\n```";
        view.dispatch({ changes: { from, to, insert }, selection: { anchor: from + 4 } });
        view.focus();
        return;
      }

      const changes = [];
      let n = 0; // the ordered-list counter, restarting at 1 for this conversion
      for (let ln = firstLine; ln <= lastLine; ln++) {
        const line = state.doc.line(ln);
        const stripped = stripBlockPrefix(line.text);
        let prefix = "";
        if (kind === "h1") prefix = "# ";
        else if (kind === "h2") prefix = "## ";
        else if (kind === "h3") prefix = "### ";
        else if (kind === "quote") prefix = "> ";
        else if (kind === "bullet") prefix = "- ";
        else if (kind === "number") { n += 1; prefix = n + ". "; }
        else if (kind === "task") prefix = "- [ ] ";
        // kind === "p": prefix stays "" — turning into plain text IS the strip.
        if (prefix + stripped === line.text) continue; // nothing to change
        changes.push({ from: line.from, to: line.to, insert: prefix + stripped });
      }
      if (changes.length) view.dispatch({ changes });
      view.focus();
    }

    // The menu both doors share: label for the "Turn into" list, and the
    // literal text the `/` menu inserts on an empty line (which needs no
    // strip — there is nothing there to strip).
    const BLOCK_TYPES = [
      { kind: "p", label: "Text" },
      { kind: "h1", label: "Heading 1", insert: "# " },
      { kind: "h2", label: "Heading 2", insert: "## " },
      { kind: "h3", label: "Heading 3", insert: "### " },
      { kind: "quote", label: "Quote", insert: "> " },
      { kind: "bullet", label: "Bullet list", insert: "- " },
      { kind: "number", label: "Numbered list", insert: "1. " },
      { kind: "task", label: "Task", insert: "- [ ] " },
      { kind: "code", label: "Code", insert: "```\n\n```", cursorOffset: 4 },
      { kind: "table", label: "Table", insert: "| Column | Column |\n| --- | --- |\n|  |  |" },
      { kind: "divider", label: "Divider", insert: "---\n" },
      { kind: "callout", label: "Callout", insert: "> [!note] " },
    ];

    // ---- the `/` menu (6d) ---------------------------------------------------
    // A fourth source in the SAME `autocompletion({ override })` call the `[[`
    // popup already uses — no new plumbing (MD-14). Triggers only at the very
    // start of an empty line, so `/` typed mid-sentence (a path, a fraction)
    // stays plain text.
    async function slashMenuCompletions(context) {
      const line = context.state.doc.lineAt(context.pos);
      const before = line.text.slice(0, context.pos - line.from);
      const match = /^\/(\w*)$/.exec(before);
      if (!match) return null;
      const typed = match[1].toLowerCase();
      const options = BLOCK_TYPES
        .filter((t) => t.insert) // "p" (Text) has nothing to insert on a blank line
        .filter((t) => !typed || t.kind.startsWith(typed) || t.label.toLowerCase().startsWith(typed))
        .map((t) => ({
          label: "/" + t.kind,
          displayLabel: t.label,
          type: "class",
          apply: (applyView, _completion, applyFrom, applyTo) => {
            const cursor = applyFrom + (t.cursorOffset !== undefined ? t.cursorOffset : t.insert.length);
            applyView.dispatch({
              changes: { from: applyFrom, to: applyTo, insert: t.insert },
              selection: { anchor: cursor },
            });
          },
        }));
      if (!options.length) return null;
      return { from: line.from, options, validFor: /^\/\w*$/ };
    }

    // MD-1a/MD-15: read-only is the `readOnly` + `editable` facets, and
    // `editable.of(false)` is what keeps these keys from being delivered at all —
    // but neither facet FILTERS a hand-built dispatch, and every command above
    // builds its own. So each writing command asks the state instead of trusting
    // that, and swallows the key (returns true) so no browser default fires on a
    // buffer that is supposed to be inert.
    const whenWritable = (command) => (editorView) =>
      editorView.state.readOnly ? true : command(editorView);

    const editorKeymap = [
      // Tab accepts an open completion FIRST: CM's own completionKeymap binds
      // only Enter to acceptCompletion, and Tab is what a Tab-completing habit
      // reaches for. `acceptCompletion` returns false with no popup open, so
      // indenting the list item stays Tab's ordinary meaning.
      {
        key: "Tab",
        run: whenWritable((v) => CM.acceptCompletion(v) || CM.indentMore(v)),
        shift: whenWritable(CM.indentLess),
      },
      { key: "Mod-b", run: whenWritable((v) => toggleWrap(v, "**")) },
      { key: "Mod-i", run: whenWritable((v) => toggleWrap(v, "*")) },
      // Obsidian ships no default hotkey for either of these, so there is none
      // to match; both are the marker-agnostic toggleWrap, and both already
      // render in Live Preview (Strikethrough and InlineCode, MD-18a), so
      // neither costs a decoration. ⌘⇧X and ⌘⇧E are free of markdownKeymap,
      // basicSetup's default/search/closeBrackets keymaps and the completion
      // keymap. `==` highlight is deliberately absent: the grammar has no rule
      // for it and Live Preview would leave the `==` bare on the page.
      { key: "Mod-Shift-x", run: whenWritable((v) => toggleWrap(v, "~~")) },
      { key: "Mod-Shift-e", run: whenWritable((v) => toggleWrap(v, "`")) },
      { key: "Mod-k", run: whenWritable(insertLink) },
      { key: "Mod-Enter", run: whenWritable(toggleCheckbox) },
    ];

    // ---- ordered-list renumbering (MD-25) ----------------------------------
    // `markdownKeymap` renumbers on Enter only — `insertNewlineContinueMarkup`
    // calls the grammar package's own `renumberList`, which is not exported, so
    // it cannot be reused. Every OTHER way of changing a list leaves the numbers
    // stale: Backspace (`deleteMarkupBackward` does not renumber), selecting a
    // row and deleting it, ⌘X, ⌘⇧K, a paste in the middle. That is most of them,
    // which is why this hangs off a transactionFilter rather than more keys —
    // one place that sees every edit, whatever produced it.
    //
    // Text, not the syntax tree. A filter runs before the new state exists and
    // `tr.state` would force one to be built and then possibly discarded; the
    // shape being matched here (marker at the start of a line) is one the tree
    // adds nothing to. Fenced code is the one place digits-then-dot is not a
    // list, so fences are tracked explicitly below.
    const ORDERED_ITEM = /^([ \t]*)(\d{1,9})([.)])([ \t]|$)/;
    const BULLET_ITEM = /^([ \t]*)[-*+]([ \t]|$)/;
    const FENCE_LINE = /^ {0,3}(`{3,}|~{3,})/;
    const BLANK_LINE = /^[ \t]*$/;

    // Which lines sit inside a fenced block, by line number. One pass over the
    // document, because a region can start anywhere and "am I in a fence?" is
    // only answerable from the top.
    function fencedLines(doc) {
      const fenced = new Set();
      let open = null;
      for (let n = 1; n <= doc.lines; n++) {
        const text = doc.line(n).text;
        const match = FENCE_LINE.exec(text);
        if (open === null) {
          if (match) { open = match[1][0]; fenced.add(n); }
        } else {
          fenced.add(n);
          // A fence closes only on its OWN character: ``` does not close ~~~.
          if (match && match[1][0] === open) open = null;
        }
      }
      return fenced;
    }

    // A line belongs to the list around it if it is an item, an indented
    // continuation of one, or a blank line between two of those. Anything at
    // column zero that is not a marker ends the list, which is also CommonMark's
    // rule for a paragraph interrupting one.
    function listLine(text) {
      if (BLANK_LINE.test(text)) return "blank";
      if (ORDERED_ITEM.test(text) || BULLET_ITEM.test(text)) return "item";
      return /^[ \t]/.test(text) ? "continuation" : "other";
    }

    // Walk out from the edited lines to the whole list they sit in, so that
    // renumbering starts from the list's real first item — the number that item
    // carries is the start of the sequence and is deliberately preserved (a list
    // written `3.` `4.` `5.` stays that way).
    function listRegion(doc, fromLine, toLine, fenced) {
      const partOfList = (n) => {
        if (n < 1 || n > doc.lines || fenced.has(n)) return false;
        return listLine(doc.line(n).text) !== "other";
      };
      // Is there a list item on this side of line `n`, blanks skipped?
      const itemBeyond = (n, step) => {
        for (let i = n + step; partOfList(i); i += step) {
          if (listLine(doc.line(i).text) !== "blank") return true;
        }
        return false;
      };
      // What may ANCHOR a region is narrower than what may extend one. A blank
      // line is two different things: the inside of a loose list, and the gap
      // that separates a list from the prose beside it. Anchoring on every blank
      // lets an edit in that gap renumber a list it is not in; anchoring on none
      // misses the loose-list interior — clearing an item's text leaves a blank,
      // and the items below it have to follow. Items on BOTH sides tells them
      // apart: only the interior blank has one.
      const anchors = (n) => {
        if (!partOfList(n)) return false;
        if (listLine(doc.line(n).text) !== "blank") return true;
        return itemBeyond(n, -1) && itemBeyond(n, 1);
      };
      // A trailing blank line is not part of the list, so a blank only extends
      // the region when a list line follows it.
      const extend = (n, step) => {
        let last = n;
        for (let i = n + step; partOfList(i); i += step) {
          if (listLine(doc.line(i).text) !== "blank") last = i;
        }
        return last;
      };
      // The edit has to have landed ON the list. An earlier version walked to the
      // neighbouring line when it had not, which meant typing in a paragraph
      // directly above a list renumbered that list — surprising in itself, and
      // against MD-25's "only the list the edit landed in", since those changes
      // then sit in an undo step the user never made.
      let start = -1;
      let end = -1;
      for (let n = Math.max(1, fromLine); n <= Math.min(toLine, doc.lines); n++) {
        if (!anchors(n)) continue;
        if (start === -1) start = n;
        end = n;
      }
      if (start === -1) return null;
      return { start: extend(start, -1), end: extend(end, 1) };
    }

    // The whole feature, as a pure function of the document: the changes that
    // make every ordered list overlapping [fromLine, toLine] count correctly.
    // Returns [] when they already do, which is the common case and the reason
    // this can run on every keystroke.
    function renumberOrderedLists(doc, fromLine, toLine) {
      const fenced = fencedLines(doc);
      const region = listRegion(doc, fromLine, toLine, fenced);
      if (!region) return [];
      const changes = [];
      // One counter per indent depth. A deeper item pushes, a shallower one pops
      // — so `1.` `1.` `2.` nested under it restarts at the outer level's next.
      const levels = [];
      for (let n = region.start; n <= region.end; n++) {
        const line = doc.line(n);
        const bullet = BULLET_ITEM.exec(line.text);
        if (bullet) {
          // A bullet at this depth ends any ordered run at or below it: the two
          // are different lists even when they touch.
          while (levels.length && levels[levels.length - 1].indent >= bullet[1].length) levels.pop();
          continue;
        }
        const item = ORDERED_ITEM.exec(line.text);
        if (!item) continue;
        const [, indentText, digits, delim] = item;
        const indent = indentText.length;
        const number = Number(digits);
        while (levels.length && levels[levels.length - 1].indent > indent) levels.pop();
        const top = levels[levels.length - 1];
        let expected;
        if (top && top.indent === indent && top.delim === delim) {
          expected = top.next;
          top.next += 1;
        } else {
          // A new list — either a deeper level, or the same level with the other
          // delimiter, which CommonMark also treats as a new list. Its first
          // item's own number is the start, so it is never rewritten.
          if (top && top.indent === indent) levels.pop();
          levels.push({ indent, delim, next: number + 1 });
          expected = number;
        }
        if (expected !== number) {
          changes.push({
            from: line.from + indent,
            to: line.from + indent + digits.length,
            insert: String(expected),
          });
        }
      }
      return changes;
    }

    // Only edits the user made. Undo and redo are excluded on purpose — undoing
    // back to a deliberately odd numbering must not be corrected right back —
    // and so is every programmatic dispatch (a reload, a lock rebuild), which
    // carries no user event at all.
    const renumberFilter = CM.EditorState.transactionFilter.of((tr) => {
      if (!tr.docChanged) return tr;
      if (!(tr.isUserEvent("input") || tr.isUserEvent("delete")
        || tr.isUserEvent("move"))) return tr;
      const doc = tr.newDoc;
      let low = Infinity;
      let high = -1;
      tr.changes.iterChangedRanges((_fromA, _toA, fromB, toB) => {
        low = Math.min(low, fromB);
        high = Math.max(high, toB);
      });
      if (high < 0) return tr;
      const changes = renumberOrderedLists(
        doc,
        doc.lineAt(Math.min(low, doc.length)).number,
        doc.lineAt(Math.min(high, doc.length)).number,
      );
      if (!changes.length) return tr;
      // Appended to the same transaction, not dispatched after it: one undo step
      // takes the edit and its renumbering back together, and the selection maps
      // through the digit rewrites for free.
      return [tr, { changes, sequential: true }];
    });

    // ---- pasted and dropped media (MD-23) ----------------------------------
    // "Copy image" in a browser puts the image BYTES on the clipboard, not a
    // path, so a paste and a drag from Finder arrive the same way: a FileList,
    // on `clipboardData.files` or `dataTransfer.files`. The only difference is
    // where the link lands — the caret for a paste, the pointer for a drop —
    // which is why the helper below takes `pos` as a parameter rather than
    // reading the selection itself.

    // A blob's own MIME type is what the clipboard gives us (a pasted
    // screenshot has no filename at all), so the extension is derived from it.
    // Only the formats a browser can actually display are mapped; anything
    // else falls back to the file's own name, then to the MIME subtype, so an
    // unusual-but-valid type still lands on disk with a plausible extension
    // instead of none.
    // Every `video/*` value here MUST also satisfy VIDEO_EXT, or the widget
    // renders the clip as an <img> and the user gets a broken-image icon —
    // which is exactly what `video/x-m4v` did before it was mapped, falling
    // through to the subtype and producing `pasted-….x-m4v`. A source test
    // pins that agreement for every entry rather than trusting this comment.
    const MEDIA_EXT = {
      "image/png": "png", "image/jpeg": "jpg", "image/gif": "gif",
      "image/webp": "webp", "image/svg+xml": "svg", "image/avif": "avif",
      "image/bmp": "bmp", "image/tiff": "tif", "image/x-icon": "ico",
      "video/mp4": "mp4", "video/webm": "webm", "video/quicktime": "mov",
      "video/ogg": "ogv", "video/x-m4v": "m4v", "video/x-matroska": "mkv",
    };

    // Images and video only. A drag from Finder can carry anything, and a paste
    // from another app often carries an `image/*` blob ALONGSIDE the text
    // flavour — filtering here is what keeps a plain-text paste plain.
    function mediaFiles(list) {
      return Array.prototype.filter.call(
        list || [], (f) => /^(image|video)\//.test(f.type || ""));
    }

    // Did this drag carry FILES, as opposed to text being dragged within the
    // note? `dataTransfer.files` is empty during a dragover, so the type list
    // is the only thing askable that early — and `drop` has to ask the SAME
    // question, or the two disagree about which events the browser still owns.
    function dragHasFiles(event) {
      const types = (event.dataTransfer || {}).types;
      return !!types && Array.prototype.indexOf.call(types, "Files") !== -1;
    }

    // pasted-YYYYMMDD-HHMMSS.ext, in local time — the name before it is checked
    // for collisions (freeMediaName does that). The extension comes from the
    // MIME type first because a pasted screenshot has no filename at all; the
    // `x-` strip keeps an unmapped vendor type (`image/x-foo`) from producing
    // a literal `.x-foo`.
    function mediaName(file) {
      const pad = (n) => String(n).padStart(2, "0");
      const d = new Date();
      const stamp = String(d.getFullYear()) + pad(d.getMonth() + 1) + pad(d.getDate())
        + "-" + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
      const named = /\.([a-z0-9]+)$/i.exec(file.name || "");
      const ext = MEDIA_EXT[file.type] || (named && named[1].toLowerCase())
        || (file.type || "").split("/")[1].replace(/^x-/, "") || "bin";
      return "pasted-" + stamp + "." + ext;
    }

    async function mediaExists(path) {
      try {
        await fused.stat(path);
        return true;
      } catch (err) {
        // stat rejects for a path that is not there, which is the answer we
        // want rather than a failure. Any other cause (the server being down)
        // also reads as "not there" — and the upload right behind this will
        // fail loudly on its own, so nothing is hidden by being optimistic.
        return false;
      }
    }

    // The first free `pasted-…` name in `assets`.
    //
    // The timestamp alone is NOT unique: two pastes inside the same second
    // produce the same name and the upload does an unconditional replace, so
    // the first file would be silently destroyed. Probing and bumping also
    // covers several files in one gesture — each upload is awaited, so file 1
    // is already on disk by the time file 2 is named.
    async function freeMediaName(assets, file) {
      const base = mediaName(file);
      const dot = base.lastIndexOf(".");
      const stem = base.slice(0, dot);
      const ext = base.slice(dot);
      let name = base;
      // Bounded: a stat that answers "yes" to everything must not spin.
      for (let n = 2; n < 100; n++) {
        if (!(await mediaExists(assets + "/" + name))) return name;
        name = stem + "-" + n + ext;
      }
      return name;
    }

    // One place says why a paste or a drop did not land — the same status
    // element a failed save writes to, so there is a single error surface.
    function mediaNotice(message) {
      saveStateEl.textContent = message;
      saveStateEl.classList.add("error");
    }

    // Write the blobs beside the note and link them in at `pos`.
    // `to` defaults to `pos`, which is the difference between the two gestures:
    // a PASTE replaces whatever was selected, exactly as pasting text does and
    // as the URL-over-a-selection branch below already did, while a DROP lands
    // at the pointer and must leave a selection elsewhere in the note alone.
    async function insertMediaFiles(view, files, pos, to) {
      const dir = noteDir();
      if (!dir) return;
      let replaceTo = to === undefined ? pos : to;
      // The uploads below are awaited and the editor stays live while they run,
      // so by the time a link is dispatched these offsets may describe a
      // document that no longer exists — and `to` makes the dispatch a DELETE,
      // which would eat whatever the user typed meanwhile. Every insert first
      // checks the doc is still the one they were measured against (Text
      // identity, the same check doSave uses). If it is not, the link goes in at
      // the caret and replaces nothing: a paste landing in a slightly odd place
      // is recoverable, one that deletes unrelated text is not.
      let measuredAgainst = view.state.doc;
      // A shared assets/ next to the note, created on demand: the endpoint
      // deliberately never creates intermediate directories (same contract as
      // /api/fs/write), so the second paste onwards gets a typed "exists" back,
      // which is the expected case rather than a failure.
      const assets = dir + "/assets";
      try {
        try {
          await fused.mkdir(assets);
        } catch (err) {
          if (err.type !== "exists") throw err;
        }
        for (let i = 0; i < files.length; i++) {
          const name = await freeMediaName(assets, files[i]);
          // Awaited BEFORE the insert, deliberately: a link inserted first
          // could end up pointing at a file that never made it to disk. The
          // cost is that a large video takes a while to appear — typing during
          // it is fine, which is exactly why the offsets need re-checking below.
          await fused.uploadFile(assets + "/" + name, files[i]);
          if (view.state.doc !== measuredAgainst) {
            pos = view.state.selection.main.head;
            replaceTo = pos;
          }
          // Ordinary markdown through an ordinary dispatch, so undo removes it
          // in one step and every other markdown tool can still read the note.
          // Video gets the same `![](…)` — markdown has no video syntax, and
          // the live-preview widget picks the element off the extension.
          const insert = "![](assets/" + name + ")" + (files.length > 1 ? "\n" : "");
          view.dispatch({
            changes: { from: pos, to: replaceTo, insert },
            selection: { anchor: pos + insert.length },
          });
          pos += insert.length;
          // Only the FIRST file of a multi-file gesture consumes the selection;
          // the rest append after it.
          replaceTo = pos;
          measuredAgainst = view.state.doc;
        }
      } catch (err) {
        // Never swallowed: a paste that silently did nothing is
        // indistinguishable from a broken editor.
        mediaNotice("Could not add the file: " + (err.message || ""));
      }
    }

    // Pasting a URL over a selection makes a link out of it, rather than
    // replacing the words the user just chose. Pasting or dropping an image or
    // a video writes it into assets/ and links it in (MD-23).
    const pasteHandler = CM.EditorView.domEventHandlers({
      paste(event, target) {
        const media = mediaFiles(event.clipboardData && event.clipboardData.files);
        if (media.length) {
          // Read-only: fall through untouched, the same posture whenWritable
          // takes for every writing key (MD-1a/MD-15).
          if (target.state.readOnly) return false;
          event.preventDefault();
          const sel = target.state.selection.main;
          void insertMediaFiles(target, media, sel.from, sel.to);
          return true;
        }
        const url = ((event.clipboardData || {}).getData
          ? event.clipboardData.getData("text/plain") : "").trim();
        if (!/^[a-z][a-z0-9+.-]*:\/\/\S+$/i.test(url)) return false;
        const { from, to } = target.state.selection.main;
        if (from === to) return false;
        const selected = target.state.sliceDoc(from, to);
        event.preventDefault();
        target.dispatch({
          changes: { from, to, insert: `[${selected}](${url})` },
          selection: { anchor: from + selected.length + url.length + 4 },
        });
        return true;
      },

      // Not optional and easy to miss: without preventDefault here the browser
      // never fires `drop` at all and instead NAVIGATES the webview to the
      // dropped file, which looks like the whole editor vanishing. Gated to a
      // drag carrying files so CodeMirror's own text drag-and-drop is
      // untouched. It deliberately does NOT check readOnly: refusing here
      // would hand a file drop on a read-only note straight back to the
      // browser, and navigating away is not what "read-only" should mean.
      dragover(event) {
        if (!dragHasFiles(event)) return false;
        event.preventDefault();
        return false;   // not "handled": CM still draws its own drop cursor
      },

      drop(event, target) {
        // A text drag stays CodeMirror's — it moves the text, and this handler
        // must not touch it. The question is whether the drag carried FILES,
        // never whether media matched: dragover already committed to owning
        // every file drag (per-file MIME is not readable that early), so drop
        // has to honour that for all of them.
        if (!dragHasFiles(event)) return false;
        // Prevent FIRST, ask questions after. CM only calls preventDefault for
        // a handler that returns true, so any `return false` below this line
        // would hand the event back to the browser, whose default action for a
        // file drop is to navigate the webview to the dropped file — the
        // editor disappears, taking every edit since the last autosave with it
        // (pagehide fires a best-effort save that may not land).
        event.preventDefault();
        if (target.state.readOnly) {
          mediaNotice("This note is read-only, so files can't be added to it.");
          return true;
        }
        const media = mediaFiles(event.dataTransfer.files);
        if (!media.length) {
          mediaNotice("Only images and video can be added to a note.");
          return true;
        }
        // The one real difference from paste: dropping into the middle of a
        // note lands where the POINTER is, not where the caret happens to be.
        // posAtCoords answers null for a drop past the last line, which falls
        // back to the caret.
        const at = target.posAtCoords({ x: event.clientX, y: event.clientY });
        const pos = at === null || at === undefined
          ? target.state.selection.main.head : at;
        void insertMediaFiles(target, media, pos);
        return true;
      },
    });

    // ---- the completion popups (MD-14) -------------------------------------
    // Candidates come from the same scan the graph reads, so the popups are free
    // once the index exists and can never offer a note the graph disagrees
    // about. Cached briefly so a fast typist does not spawn a run per keystroke.
    let candidates = null;
    let candidatesAt = 0;
