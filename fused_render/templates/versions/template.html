<!DOCTYPE html>
<html data-fused-theme="shell">
<head>
<meta charset="utf-8" />
<title>Versions</title>
<style>
  /* Appearance (SPEC §30, D134). Dark block is the palette; light redefines
     every token. `data-theme` is written onto <html> by the injected runtime
     because this document opted in via `data-fused-theme` (runtime.js). */
  :root {
    color-scheme: dark;
    --bg: #131417;
    --surface: #1b1d21;
    --surface-2: #22252b;
    --line: #2a2d33;
    --ink: #e8eaed;
    --ink-2: #9aa0a6;
    --ink-3: #868d94;
    --accent: #E5FF44;
    --on-accent: #131417;
    --sel-bg: #23261a;
    --danger: #ff7a7a;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff;
    --surface: #f6f7f8;
    --surface-2: #eef0f2;
    --line: #e0e2e6;
    --ink: #1f2023;
    --ink-2: #61656c;
    --ink-3: #7a7f87;
    --accent: #5f7300;
    --on-accent: #ffffff;
    --sel-bg: #f2f5e2;
    --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 13px;
    color: var(--ink);
    background: var(--bg);
  }

  /* Right: the commit spine — deliberately low-detail (subject + when).
     Width comes from the shared `split` URL param (main pane %, default 70)
     via the drag divider — same view state as the claude template. */
  #side {
    min-width: 200px;
    flex: none;
    order: 3;
    display: flex;
    flex-direction: column;
    background: var(--surface);
  }
  #divider {
    flex: none;
    order: 2;
    width: 4px;
    cursor: col-resize;
    background: var(--line);
    transition: background .15s;
  }
  #divider:hover, body.dragging #divider { background: var(--accent); }
  body.dragging #frame { pointer-events: none; }
  #side-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    color: var(--ink-2);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    white-space: nowrap;
  }
  #side-head .label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  #revert {
    flex: none;
    padding: 4px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface-2);
    color: var(--ink);
    font: inherit;
    font-size: 11px;
    text-transform: none;
    letter-spacing: normal;
    cursor: pointer;
  }
  #revert:hover:enabled { border-color: var(--accent); color: var(--accent); }
  #revert:disabled { opacity: 0.45; cursor: default; }
  #commits { flex: 1; overflow-y: auto; padding: 4px 0; }
  .commit {
    padding: 7px 12px;
    cursor: pointer;
    border-left: 2px solid transparent;
  }
  .commit:hover { background: var(--surface-2); }
  .commit.selected {
    background: var(--sel-bg);
    border-left-color: var(--accent);
  }
  .commit .subject {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .commit .meta {
    margin-top: 2px;
    color: var(--ink-3);
    font-size: 11px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  /* The pager. A timeline is append-only, so there are no page numbers and no
     "back": one quiet row at the FOOT of the spine that grows the list in
     place. It is styled as chrome (the #side-head vocabulary — small, upper,
     tracked) rather than as a commit, so it never reads as a revision that can
     be selected. */
  .older {
    padding: 8px 12px;
    border-top: 1px solid var(--line);
    color: var(--ink-2);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    cursor: pointer;
  }
  .older:hover { color: var(--accent); }
  .older.loading, .older.loading:hover { color: var(--ink-3); cursor: default; }
  /* Same ink as #notice.error — a failed page is reported where it was asked
     for, so the snapshot in the other half is left alone. */
  .older-error { padding: 2px 12px 8px; color: var(--danger); font-size: 11px; }
  .badge {
    display: inline-block;
    margin-left: 6px;
    padding: 0 5px;
    border-radius: 8px;
    font-size: 10px;
    background: var(--accent);
    color: var(--on-accent);
  }

  /* Left: the target rendered at the selected revision — nothing else. */
  #main { flex: 1; order: 1; display: flex; flex-direction: column; min-width: 0; }
  #stage { flex: 1; position: relative; background: var(--bg); }
  #frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  #notice {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    color: var(--ink-2);
    background: var(--bg);
  }
  #notice.error { color: var(--danger); }
  #notice.show { display: flex; }

  /* ── Narrow hosts (D235 fallout) ──────────────────────────────────────────
     Since this mode is bound to 47 file extensions as well as `/`, it renders
     in the explorer's listing preview pane (floor 220px, default width HALF
     its split container), in freely dragged Panel panes and in /embed — not
     just full-window. Two halves side by side stop being a layout there and
     start being two unusable slivers.

     The TEMPLATE goes responsive rather than the shell hiding split-layout
     modes from narrow panes, because a pane's width is dynamic: the listing
     pane is half its container, so on a wide window it fits the split fine and
     a width filter would be wrong there. A filter would also make modes appear
     and disappear mid divider-drag and could yank the ACTIVE mode out from
     under the user, and it would need a per-template min-width field in
     registry.json / the stat API that this codebase does not have (and that
     user templates, §16, would never get for free). Plain media queries in the
     template are the house idiom for exactly this: log_studio (780), map (650),
     duckdb/sqlite (560), bundle (640).

     Breakpoint arithmetic — the columns' minimum USEFUL widths, not the point
     at which they merely stop overflowing. The original figure (560px, D236)
     was derived from the hard floor: #side 200 + divider 4 + a 320px preview
     = 524, rounded up. That floor was the wrong one to pick. The explorer's
     listing preview pane defaults to HALF its split container (about 700px on a
     1700px window), so at 560px the split engaged in a host far too narrow for
     it: a 320px frame is a viewport the framed template has already collapsed
     itself for, i.e. a preview of a preview's narrow layout. The useful sum:
         #side min-width           200px  (the commit spine: hash + date + tag)
       + #divider                    4px
       + a usable preview frame     420px  (the phone-viewport family, the same
                                            "a framed preview that is still a
                                            page" figure `claude` uses for ITS
                                            framed column)
       = 624px floor → 640px, rounded up for a scrollbar (and landing on the
         `bundle` family number). This is deliberately LOWER than `claude`'s
         800px: claude's narrower column is a 420px preview but its OTHER
         column is a 440px chat, while ours is a 200px commit spine — the
         split here stays useful in hosts claude's cannot survive, so the two
         templates no longer share a breakpoint.

     Below it: ONE view at a time. #side-head stays put as the control strip
     (it already carries Revert), so the toggle is reachable from both views,
     and the list is the default — it is what makes this mode mean anything and
     it is where a snapshot gets picked. */
  #view-toggle {
    flex: none;
    display: none;  /* wide layout shows both halves — nothing to toggle */
    padding: 4px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface-2);
    color: var(--ink-2);
    font: inherit;
    font-size: 11px;
    text-transform: none;
    letter-spacing: normal;
    cursor: pointer;
  }
  #view-toggle:hover { border-color: var(--accent); color: var(--accent); }
  @media (max-width: 640px) {
    /* Stack, so #side can be the full-width control strip + list. */
    body { flex-direction: column; }
    #divider { display: none; }  /* nothing left to resize */
    /* `width: 100% !important` is the deliberate neutralisation of the INLINE
       width applySplit()/the drag write onto #side: a media query cannot beat
       an inline style, and `!important` can. Chosen over "skip the inline write
       while narrow" because this keeps applySplit() unconditional and stateless
       — crossing the breakpoint in EITHER direction needs no JS at all, since
       the wide layout's inline width is still sitting there intact the moment
       the query stops matching. Clearing the inline value instead would leave
       the split param and the element's style as two sources of truth, and
       would need a re-apply on the way back out (and would strand a stale width
       if a drag ended while narrow). */
    #side { order: 1; flex: 1; width: 100% !important; min-width: 0; }
    #main { order: 2; display: none; }
    #view-toggle { display: inline-block; }
    /* The other view. Note the body class only ever bites inside this block, so
       returning to the wide layout restores the split with no reset needed. */
    body.narrow-preview #side { flex: none; }
    body.narrow-preview #commits { display: none; }
    body.narrow-preview #main { display: flex; }
  }

</style>
</head>
<body>
  <div id="side">
    <div id="side-head">
      <span class="label">History</span>
      <button id="view-toggle" title="Switch between the commit list and the snapshot">Preview</button>
      <button id="revert" disabled title="Revert all files to the selected version">Revert</button>
    </div>
    <div id="commits"></div>
  </div>
  <div id="divider"></div>
  <div id="main">
    <div id="stage">
      <iframe id="frame" title="Target at selected revision"></iframe>
      <div id="notice"></div>
    </div>
  </div>

<script>
// The target arrives as the read-only _file param (template contract), and the
// backend decides which of two histories it names (D235): any path inside a
// fused app resolves to the WHOLE app (so the view is identical everywhere
// inside it, and `revert` is offered), while a file in the user's own repository
// resolves to that one file's history, read-only — `can_revert: false` is how
// the payload says which, and the only difference this view has to render.
const FILE = fused.params.get("_file") || "";

const commitsEl = document.getElementById("commits");
const frameEl = document.getElementById("frame");
const noticeEl = document.getElementById("notice");
const revertBtn = document.getElementById("revert");
const toggleBtn = document.getElementById("view-toggle");

// ── narrow layout: one view at a time (see the @media block for the 640px
// arithmetic and for why this lives in the template, not the shell) ──
// The breakpoint is asked of matchMedia with the SAME query string as the CSS so
// the two can't drift, and only to keep the button's label honest — the layout
// itself is pure CSS, so a resize needs no JS to be correct.
const NARROW = window.matchMedia("(max-width: 640px)");
function showNarrow(view) {
  // `narrow-preview` is inert above the breakpoint (every rule that reads it is
  // inside the media block), so it is safe to leave set while the host is wide.
  document.body.classList.toggle("narrow-preview", view === "preview");
  toggleBtn.textContent = view === "preview" ? "History" : "Preview";
}
showNarrow("list");  // the list is the default: it is where a snapshot is picked
toggleBtn.addEventListener("click", () => {
  showNarrow(document.body.classList.contains("narrow-preview") ? "list" : "preview");
});
NARROW.addEventListener("change", () => {
  // Coming back out of narrow, drop the one-view state so the next narrowing
  // starts on the list again rather than on whatever was last looked at.
  if (!NARROW.matches) showNarrow("list");
});

// The spine is PAGED (versions.py `PAGE_SIZE`): `commits` holds every page
// fetched so far, newest first and contiguous from skip 0, which is what makes
// `commits.length` the next page's `skip`. `more` is the backend's own answer
// (it fetches one row past the page as a probe), so the page size lives in one
// place and this half never has to know it.
let commits = [];      // newest first, from versions.py `log`
let more = false;      // history continues past what is loaded
let loadingMore = false;
let moreError = "";
// Bumped by every full reload (boot, revert). A page that lands after one is
// answering a question about a list that no longer exists, so it is dropped.
let logGen = 0;
let selected = null;   // full sha

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function ago(ts) {
  if (!ts) return "";
  const s = Math.max(0, Date.now() / 1000 - ts);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  if (s < 86400 * 30) return Math.floor(s / 86400) + "d ago";
  return new Date(ts * 1000).toLocaleDateString();
}

function notice(msg, isError) {
  frameEl.removeAttribute("src");
  noticeEl.textContent = msg;
  noticeEl.className = "show" + (isError ? " error" : "");
}

function clearNotice() { noticeEl.className = ""; }

// A full repaint, and deliberately so: appending a page changes the FOOT of the
// list only, but the selected row, the `latest` badge and the pager row are all
// derived state, and one function that redraws all of it from `commits` +
// `selected` cannot leave them disagreeing. The one thing a repaint does lose is
// the scroll offset, which is exactly what a "show older" click must keep — so
// it is saved and restored around the write, and the new rows appear below the
// user's viewport instead of under it.
function renderList() {
  const scroll = commitsEl.scrollTop;
  let html = commits.map((c, i) =>
    '<div class="commit' + (c.sha === selected ? " selected" : "") +
    '" data-sha="' + c.sha + '">' +
    '<div class="subject">' + esc(c.subject || "(no subject)") +
    (i === 0 ? '<span class="badge">latest</span>' : "") + "</div>" +
    '<div class="meta">' + c.sha.slice(0, 7) + " · " + ago(c.ts) + "</div>" +
    "</div>").join("");
  if (more) {
    html += '<div class="older' + (loadingMore ? " loading" : "") + '">' +
      (loadingMore ? "Loading…" : "Show older") + "</div>";
  }
  // The row stays (so the failed page can simply be asked for again) and the
  // reason sits under it.
  if (moreError) html += '<div class="older-error">' + esc(moreError) + "</div>";
  commitsEl.innerHTML = html;
  commitsEl.scrollTop = scroll;
}

// The next page, appended. Nothing here touches `selected` or the frame: paging
// grows the timeline, it does not move the preview.
async function loadMore() {
  if (loadingMore || !more) return;
  loadingMore = true;
  moreError = "";
  renderList();
  const gen = logGen;
  try {
    const res = await fused.runPython("./versions.py",
      { action: "log", file: FILE, skip: commits.length }, { key: "log-more" });
    if (gen !== logGen) return;  // a reload replaced the list under us
    if (res.error) throw new Error(res.error);
    // De-duped by sha rather than trusted blindly: a commit landing on HEAD
    // between two pages shifts the window down by one, and a repeated row is
    // the visible symptom. Cheap to drop, and it keeps `commits.length` an
    // honest cursor for the page after this one.
    const seen = new Set(commits.map(c => c.sha));
    for (const c of (res.commits || [])) {
      if (!seen.has(c.sha)) commits.push(c);
    }
    more = !!res.more;
  } catch (err) {
    moreError = "Could not load older versions: " + err.message;
  } finally {
    if (gen === logGen) {
      loadingMore = false;
      renderList();
    }
  }
}

// The iframe src that shows `path` the way the explorer would: its own default
// view. Used for a FILE target's snapshot, where the materialised revision is a
// `.py`/`.parquet`/`.md`, not a page (D235).
//
// The default is the first non-`conditional` entry — the same rule the shell's
// own preview applies (Preview.tsx `defaultTemplate`) — asked of stat rather
// than hardcoded per extension, so a rebinding (including a user override, §16)
// is picked up here for free. `versions` itself is conditional, so this can
// never recurse into the view it is called from.
async function frameSrcForFile(path) {
  let st;
  try {
    st = await fetch("/api/fs/stat?path=" + encodeURIComponent(path)).then(r => r.json());
  } catch (err) {
    return "";
  }
  if (!st || st.error) return "";
  const t = (st.templates || []).find(e => !e.conditional);
  if (!t) return "";
  // `_render` is a shell sentinel (PT-12), not a template folder: the file
  // renders itself. Any other sentinel has no template to frame.
  if (t.mode === "_render") return "/render?path=" + encodeURIComponent(path);
  if (!t.path) return "";
  return "/render?path=" + encodeURIComponent(t.path)
    + "&_file=" + encodeURIComponent(path);
}

// The shell's chrome-free view of a DIRECTORY — its browsable listing with no
// sidebar, breadcrumb or preview header (`body.embed`). Used to frame a
// snapshot that is a tree rather than a document.
//
// The path→URL codec mirrors the shell's own (platform/lib/router.ts
// `urlForFsPath`): strip the leading separator, encode each segment, join. A
// template cannot import the shell's module, so this rule is duplicated here
// rule — four lines, and the only part of the shell's routing a template needs
// to know. The Windows normalisation is the same narrow one — ONLY a
// drive-letter path has its backslashes rewritten, because on POSIX a backslash
// is a legal filename character that must round-trip untouched.
//
// Two framing params, both the shell's own:
//
//   `preview=false` — this listing is ALREADY inside a preview column, and its
//                     own split pane (FS-9) nested in half of this view would be
//                     two previews deep and neither wide enough to read. The
//                     same param the chat template passed when it framed this
//                     same embed (D237).
//   `snapshot=1`    — a FROZEN TREE, not a live folder. It suppresses the chrome
//                     that would act on it as one: the breadcrumb (whose crumbs
//                     walk up out of the snapshot and into the cache's own
//                     internals) and the two corner chips (the mode chip offered
//                     a Claude chat ON THE EXTRACTED COPY; "Open as app" would
//                     run one). See router.ts IS_SNAPSHOT.
function embedUrl(dirPath) {
  const norm = /^[A-Za-z]:[\\/]/.test(dirPath) ? dirPath.replace(/\\/g, "/") : dirPath;
  return "/explorer/embed/" + norm.split("/").filter(Boolean)
    .map(encodeURIComponent).join("/") + "?preview=false&snapshot=1";
}

async function select(sha) {
  selected = sha;
  // URL-synced so a reload (or a shared link) lands on the same revision.
  fused.params.set("rev", sha.slice(0, 7));
  renderList();
  // `startsWith`, not equality: a deep link's `rev` is a 7-char prefix, and it
  // is selected before any page has resolved it to a full sha (below).
  const isLatest = commits.length && commits[0].sha.startsWith(sha);
  revertBtn.disabled = isLatest;

  notice("Preparing snapshot…");
  try {
    // Cancellation key per template, not per call: picking a new commit
    // cancels the previous snapshot request instead of racing it.
    const snap = await fused.runPython("./versions.py",
      { action: "snapshot", file: FILE, sha: sha }, { key: "snapshot" });
    if (snap.error) return notice(snap.error, true);
    if (sha !== selected) return; // stale — a newer selection already landed
    // Three shapes of snapshot, and the payload names which one this is rather
    // than the page inferring it from the target's kind — an app's entry page
    // can arrive mid-history, so the shape differs per COMMIT, not per target.
    //
    //   `browse` — a TREE with no page to serve: any directory target, and an
    //              app whose tree holds no html. Framed through the shell's own
    //              chrome-free listing, so the user browses the folder as it
    //              was. This used to be the dead end: a bare notice over a tree
    //              full of files that were perfectly viewable.
    //   `entry`  — a page /render can serve directly (an app's entry).
    //   `file`   — the one file a FILE target materialised; framed through its
    //              own default template unless it is itself a page, exactly the
    //              way the explorer previews it live.
    //
    // `browse` is tested FIRST because it is the only one of the three that can
    // never coexist with another: the backend sets it only when there is no
    // entry.
    let src = "";
    if (snap.browse) {
      src = embedUrl(snap.browse);
    } else if (snap.entry) {
      src = "/render?path=" + encodeURIComponent(snap.entry);
    } else if (snap.file) {
      src = await frameSrcForFile(snap.file);
      if (sha !== selected) return; // the stat above is another await point
      if (!src) return notice("No view for this file type — nothing to render.");
    } else {
      // Defensive: every snapshot payload carries one of the three above.
      return notice("Nothing to show for this revision.");
    }
    clearNotice();
    frameEl.src = src;
    // The snapshot resolved whatever was asked for into a FULL sha. Adopt it, so
    // a revision deep-linked by prefix (and therefore not on the first page)
    // highlights the moment paging reaches the row that holds it.
    if (snap.sha && snap.sha !== selected) {
      selected = snap.sha;
      renderList();
    }
  } catch (err) {
    if (sha === selected) notice("Snapshot failed: " + err.message, true);
  }
}

// The FIRST page, from scratch. Every caller (boot, and revert — whose new
// commit is the newest, so the first page is where it is) wants the list reset,
// not extended.
async function loadLog(preferSha) {
  logGen++;
  loadingMore = false;
  moreError = "";
  // THE FENCE, and it has to be here — before the first await, in the same
  // synchronous run as the `logGen` bump. `logGen` alone only fences pages
  // already IN FLIGHT: a click that lands DURING the reload's await reads the
  // NEW generation, so its own guard passes, while its `skip` was computed from
  // the stale list — its page then appends onto the fresh first page, leaving a
  // hole between them (after a revert: 20 fresh rows, then rows 40+, with 20–39
  // unreachable and `more` overwritten by that page's flag). Dropping `more`
  // takes the pager row out of the DOM for the whole reload, so there is nothing
  // to click; and because JS runs this block to completion, a click either
  // happened entirely BEFORE it (in flight, dropped by the generation check) or
  // entirely after it (refused by `!more`). No third case.
  more = false;
  renderList();
  const res = await fused.runPython("./versions.py",
    { action: "log", file: FILE, skip: 0 }, { key: "log" });
  if (res.error) return notice(res.error, true);
  // Linked apps are view-only history: versions.py refuses `revert` for them
  // (the repo is the user's own), so the button disappears rather than
  // offering an action the backend will reject. Older payloads (no
  // `can_revert` key) keep the button — workspace apps always could.
  if (res.can_revert === false) revertBtn.style.display = "none";
  commits = res.commits || [];
  more = !!res.more;
  commitsEl.scrollTop = 0;
  if (!commits.length) return notice("No commits yet.");
  // A `rev` deep link that is NOT on the first page is still honoured: the
  // prefix is handed to select() as-is (the backend resolves it), so the link
  // shows the revision it names rather than silently falling back to HEAD, and
  // select() adopts the full sha so the row highlights once paging reaches it.
  //
  // Off-page, though, it is VERIFIED first, and that is not belt-and-braces —
  // `rev` is URL state that outlives the target it was set for. In the
  // explorer's preview pane the pane's params mirror onto the explorer's own
  // URL, so selecting a DIFFERENT file in the listing reboots this template for
  // the new target with the previous file's `rev` still present. Resolved as
  // given, that commit is one the new file's history has never heard of, and the
  // first thing the user sees after a click is "this revision has nothing under
  // this folder" about a revision they never picked. So a rev that is not in
  // THIS target's log is treated as stale and falls back to the newest commit,
  // silently — the same forgiving posture the app takes for an unknown `_mode`
  // (PT-9), and for the same reason: stale URL state is the ordinary case here,
  // not an error to report. A rev that IS in the history, merely past page one,
  // keeps the deep link exactly as before.
  //
  // No second params writer comes out of this: select() is still the only thing
  // that writes `rev`, so the fallback re-points the param at the newest commit
  // through the one funnel (and a pristine entry pushes at most the one history
  // entry selecting a commit has always pushed).
  let pick = commits[0].sha;
  if (preferSha) {
    const hit = commits.find(c => c.sha.startsWith(preferSha));
    // Shape-checked before it is trusted off-page, so a junk param still falls
    // back to HEAD the way it always did rather than opening on "unknown
    // revision".
    if (hit) pick = hit.sha;
    else if (/^[0-9a-f]{7,40}$/.test(preferSha)) {
      const gen = logGen;
      let known = false;
      try {
        const probe = await fused.runPython("./versions.py",
          { action: "has_rev", file: FILE, sha: preferSha }, { key: "hasrev" });
        known = !!(probe && probe.known);
      } catch (err) {
        // The probe is a REFINEMENT of the deep link, not a gate on the view:
        // if it cannot be asked, keep the behaviour it refines rather than
        // dropping the user's own link on a transport failure.
        known = true;
      }
      // Another reload started while this was in flight — its own selection is
      // the current one, and selecting here would fight it.
      if (gen !== logGen) return;
      if (known) pick = preferSha;
    }
  }
  await select(pick);
}

commitsEl.addEventListener("click", (e) => {
  // The pager first: it is a sibling of the rows, not one of them, and it must
  // NOT flip the narrow layout to the preview — asking for more history is a
  // request to keep reading the list.
  if (e.target.closest(".older")) return loadMore();
  const row = e.target.closest(".commit");
  if (!row) return;
  // Picking a revision in the narrow layout is a request to SEE it, so reveal
  // the preview. Deliberately here and not in select(): loadLog() auto-selects
  // the newest commit on load, and doing this there would open on the preview
  // and hide the timeline nobody has looked at yet. Re-clicking the already
  // selected row still switches (no snapshot work needed — it is already framed).
  if (NARROW.matches) showNarrow("preview");
  if (row.dataset.sha !== selected) select(row.dataset.sha);
});

revertBtn.addEventListener("click", async () => {
  const c = commits.find(x => x.sha === selected);
  const label = selected.slice(0, 7) + (c ? " — " + c.subject : "");
  if (!confirm("Revert all files to " + label +
      "?\n\nHistory is kept: this adds a new commit on top.")) return;
  revertBtn.disabled = true;
  try {
    const res = await fused.runPython("./versions.py",
      { action: "revert", file: FILE, sha: selected }, { key: "revert" });
    if (res.error) {
      revertBtn.disabled = false;
      return notice(res.error, true);
    }
    // Reload the list; the new "Reverted to …" commit is now the latest.
    await loadLog();
  } catch (err) {
    notice("Revert failed: " + err.message, true);
    revertBtn.disabled = false;
  }
});

// ── resizable divider; the split ratio (main pane %) is view state, so it
// lives in the shared `split` param — same default (70) as claude. ──
const sideEl = document.getElementById("side");
const clampPct = (pct) => Math.min(80, Math.max(20, pct));
function applySplit() {
  sideEl.style.width = (100 - clampPct(parseFloat(fused.params.get("split") || "70"))) + "%";
}
applySplit();
fused.params.onChange(applySplit);

document.getElementById("divider").addEventListener("mousedown", (e) => {
  e.preventDefault();
  document.body.classList.add("dragging");
  const move = (ev) => {
    sideEl.style.width = (100 - clampPct((ev.clientX / window.innerWidth) * 100)) + "%";
  };
  const up = (ev) => {
    document.body.classList.remove("dragging");
    window.removeEventListener("mousemove", move);
    window.removeEventListener("mouseup", up);
    fused.params.set("split", clampPct((ev.clientX / window.innerWidth) * 100).toFixed(1));
  };
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
});

if (!FILE) {
  notice("No file selected (missing _file param).", true);
} else {
  loadLog(fused.params.get("rev") || "");
}
</script>
</body>
</html>
