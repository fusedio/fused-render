<!DOCTYPE html>
<html data-fused-theme="shell">
<head>
<meta charset="utf-8" />
<title>Markdown</title>
<script src="/template-assets/codemirror.bundle.js"></script>
<script src="/template-shared/ro-badge.js"></script>
<script src="/template-shared/graph-canvas.js"></script>
<style>
  /* Appearance (SPEC §30, D134). The dark block below IS this view's
     historical palette, value for value; the light block is the new one.
     `data-theme` is written onto <html> by the injected runtime, which acts
     only because this document opted in via `data-fused-theme` on <html>
     (see fused_render/static/runtime.js) — dark stays the default for any
     document that never gets the attribute. */
  :root {
    color-scheme: dark;
    --fg: #e8eaed;
    --fg-muted: #9aa0a6;
    --border: #2a2d33;
    --bg: #131417;
    --bg-alt: #1b1d21;
    --accent: #E5FF44;
    --error: #ff6b6b;
    --warn: #ffb454;
    --skel-shine: #26292f;
    --ghost: #6b7076;
    --on-accent: #131417;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --fg: #1f2023;
    --fg-muted: #61656c;
    --border: #d8dade;
    --bg: #ffffff;
    --bg-alt: #f4f5f7;
    --accent: #5f7300;
    --error: #c62828;
    --warn: #a35b00;
    --skel-shine: #e4e6ea;
    --ghost: #a3a7ad;
    --on-accent: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    color: var(--fg);
    background: var(--bg);
  }

  /* ---- the reload-or-keep banner (MD-17) --------------------------------
     The only chrome that ever occupies a row of its own, and only while a
     conflict is unresolved: there is no persistent toolbar in this view
     (MD-2a) — the shell's own breadcrumb already names the file, and
     Obsidian shows no save state at all. */
  #conflict {
    display: none;
    align-items: center;
    gap: 10px;
    flex: none;
    padding: 7px 12px;
    border-bottom: 1px solid var(--warn);
    background: var(--bg-alt);
    color: var(--warn);
    font-size: 12px;
  }
  #conflict button {
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--bg);
    color: var(--fg);
    font: inherit;
    padding: 3px 9px;
    cursor: pointer;
  }
  #conflict button:hover { border-color: var(--accent); }

  /* A failure needs to be seen; a successful save does not (MD-16). This slot
     is empty — and therefore invisible — in the ordinary case. */
  #save-state {
    position: fixed;
    right: 12px;
    bottom: 10px;
    z-index: 6;
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--bg-alt);
    color: var(--fg-muted);
    font-size: 12px;
  }
  #save-state:empty { display: none; }
  #save-state.error { color: var(--error); border-color: var(--error); }
  #ro-wrap { position: fixed; left: 12px; bottom: 10px; z-index: 6; }

  /* ---- surface ----------------------------------------------------------- */
  #split { flex: 1; display: flex; min-height: 0; position: relative; }
  #surfaces { flex: 1; min-width: 0; min-height: 0; display: flex; }
  #editor-wrap { flex: 1; min-width: 0; }
  #status { flex: 1; padding: 24px; color: var(--fg-muted); }
  #status[hidden] { display: none; }
  #status.error { color: var(--error); }
  #status a { color: var(--accent); }

  /* ---- the editor IS the document (MD-18a) ------------------------------
     One surface, always editable. No line numbers, no fold gutter and no
     active-line stripe: this is prose, and the chrome a code editor wants is
     exactly what a Live Preview must not show. */
  .cm-editor { height: 100%; font-size: 16px; }
  .cm-editor.cm-focused { outline: none; }
  .cm-editor .cm-scroller {
    overflow: auto;
    font-family: inherit;
    line-height: 1.65;
  }
  .cm-editor .cm-content {
    max-width: 46rem;
    margin: 0 auto;
    padding: 40px 24px 40vh;
    caret-color: var(--accent);
  }
  .cm-editor .cm-gutters { display: none; }
  .cm-editor .cm-activeLine { background: transparent; }
  .cm-editor .cm-activeLineGutter { background: transparent; }
  .cm-editor .cm-line { padding: 0 2px; }

  /* Live Preview marks. Every rule here styles a range of the SOURCE — there
     is no second rendered copy of the document to style. */
  .lp-h1, .lp-h2, .lp-h3, .lp-h4, .lp-h5, .lp-h6 {
    font-weight: 600;
    line-height: 1.3;
  }
  .lp-h1 { font-size: 1.9em; }
  .lp-h2 { font-size: 1.55em; }
  .lp-h3 { font-size: 1.3em; }
  .lp-h4 { font-size: 1.13em; }
  .lp-h5 { font-size: 1em; }
  .lp-h6 { font-size: 0.94em; color: var(--fg-muted); }
  .lp-bold { font-weight: 700; }
  .lp-italic { font-style: italic; }
  .lp-strike { text-decoration: line-through; color: var(--fg-muted); }
  .lp-code {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.86em;
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.1em 0.32em;
  }
  .lp-fence-line {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.86em;
    background: var(--bg-alt);
  }
  .lp-quote-line {
    border-left: 3px solid var(--border);
    padding-left: 12px;
    color: var(--fg-muted);
  }
  .lp-mark { color: var(--fg-muted); opacity: 0.6; }
  .lp-fm-line { color: var(--fg-muted); font-size: 0.86em; }
  .lp-bullet { color: var(--accent); }
  .lp-hr {
    display: inline-block;
    width: 100%;
    border: none;
    border-top: 1px solid var(--border);
    vertical-align: middle;
  }
  .lp-img { max-width: 100%; border-radius: 4px; vertical-align: middle; }
  .lp-task { vertical-align: middle; margin: 0 6px 0 0; accent-color: var(--accent); }
  .lp-table {
    border-collapse: collapse;
    font-size: 0.92em;
    margin: 2px 0;
  }
  .lp-table th, .lp-table td { border: 1px solid var(--border); padding: 5px 11px; }
  .lp-table th { background: var(--bg-alt); text-align: left; }
  .lp-link { color: var(--accent); text-decoration: none; }
  .lp-link:hover { text-decoration: underline; }

  /* Wikilinks, ghosts and tags — the link layer (SPEC §32, MD-3/MD-4). */
  .wl {
    color: var(--accent);
    cursor: pointer;
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  .wl:hover { border-bottom-color: var(--accent); }
  .wl-ghost { color: var(--ghost); border-bottom: 1px dashed var(--ghost); }
  .wl-embed-missing {
    display: inline-block;
    padding: 2px 8px;
    border: 1px dashed var(--ghost);
    border-radius: 4px;
    color: var(--ghost);
    font-size: 13px;
  }
  .tag {
    display: inline-block;
    padding: 0 6px;
    border-radius: 999px;
    background: var(--bg-alt);
    border: 1px solid var(--border);
    color: var(--fg-muted);
    font-size: 87%;
    cursor: text;
  }

  /* ---- right sidebar: backlinks + graph (MD-19) -------------------------- */
  #toggle-graph {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 5;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-alt);
    color: var(--fg-muted);
    cursor: pointer;
  }
  #toggle-graph:hover { color: var(--fg); border-color: var(--accent); }
  #toggle-graph[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
  }
  #toggle-graph svg { width: 14px; height: 14px; display: block; }
  #side {
    width: 21rem;
    flex: none;
    display: none;
    flex-direction: column;
    min-height: 0;
    border-left: 1px solid var(--border);
    background: var(--bg-alt);
  }
  #side.on { display: flex; }
  .side-head {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: none;
    padding: 7px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    color: var(--fg-muted);
  }
  .side-head .spacer { flex: 1; }
  #links-head { padding-right: 40px; } /* clear of the floating toggle */
  #links { flex: 1; min-height: 0; overflow: auto; padding: 10px; }
  #links[hidden] { display: none; }
  .bl {
    display: block;
    width: 100%;
    text-align: left;
    padding: 7px 9px;
    margin-bottom: 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .bl:hover { border-color: var(--accent); }
  .bl-title { font-weight: 600; }
  .bl-path { display: block; color: var(--fg-muted); font-size: 11px; }
  .bl-empty { color: var(--fg-muted); font-size: 12px; }
  #tags { margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  #notice {
    margin: 12px 0 0;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-left: 3px solid var(--warn);
    border-radius: 0 6px 6px 0;
    background: var(--bg);
    color: var(--fg-muted);
    font-size: 12px;
  }
  #notice[hidden] { display: none; }
  #graph-sec {
    flex: none;
    height: 45%;
    min-height: 12rem;
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--border);
  }
  #graph-canvas { flex: 1; width: 100%; display: block; cursor: grab; }
  #graph-note { flex: none; padding: 6px 10px; font-size: 11px; color: var(--fg-muted); }
  #graph-note[hidden] { display: none; }
  #graph-count { text-transform: none; letter-spacing: 0; font-weight: 400; }
  #depth {
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 5px;
    font: inherit;
    font-size: 11px;
    padding: 1px 4px;
  }

  /* ---- skeleton --------------------------------------------------------- */
  #skel { flex: 1; max-width: 46rem; margin: 0 auto; padding: 40px 24px; }
  #skel[hidden] { display: none; }
  .skel-bar {
    height: 14px;
    margin: 0 0 14px;
    border-radius: 4px;
    background: linear-gradient(100deg, var(--bg-alt) 30%, var(--skel-shine) 50%, var(--bg-alt) 70%);
    background-size: 200% 100%;
    animation: skel-shimmer 1.3s ease-in-out infinite;
  }
  .skel-h1 { height: 28px; width: 52%; margin-bottom: 24px; }
  .skel-h2 { height: 20px; width: 38%; margin-top: 10px; margin-bottom: 18px; }
  .skel-code {
    height: 70px;
    margin: 4px 0 20px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: linear-gradient(100deg, var(--bg-alt) 30%, var(--skel-shine) 50%, var(--bg-alt) 70%);
    background-size: 200% 100%;
    animation: skel-shimmer 1.3s ease-in-out infinite;
  }
  @keyframes skel-shimmer {
    from { background-position: 200% 0; }
    to { background-position: -200% 0; }
  }
</style>
</head>
<body>
  <div id="conflict">
    <span id="conflict-text">This note changed on disk while you were editing it.</span>
    <button id="reload">Reload from disk</button>
    <button id="keep">Keep my version</button>
  </div>
  <div id="split">
    <div id="surfaces">
      <div id="skel" aria-hidden="true">
        <div class="skel-bar skel-h1"></div>
        <div class="skel-bar" style="width:94%"></div>
        <div class="skel-bar" style="width:82%"></div>
        <div class="skel-bar" style="width:88%"></div>
        <div class="skel-bar skel-h2"></div>
        <div class="skel-bar" style="width:76%"></div>
        <div class="skel-bar" style="width:91%"></div>
        <div class="skel-bar" style="width:65%"></div>
        <div class="skel-code"></div>
        <div class="skel-bar" style="width:60%; margin-left:24px"></div>
        <div class="skel-bar" style="width:70%; margin-left:24px"></div>
        <div class="skel-bar" style="width:85%"></div>
      </div>
      <div id="status" hidden></div>
      <div id="editor-wrap"></div>
    </div>
    <button id="toggle-graph" aria-pressed="false" title="Backlinks and graph">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"
           stroke-linecap="round" aria-hidden="true">
        <path d="M4.6 4.9 L11 3.2 M4.9 6 L7.4 11.4" />
        <circle cx="3.6" cy="4.4" r="2" />
        <circle cx="12.4" cy="2.8" r="1.6" />
        <circle cx="8.4" cy="12.6" r="1.9" />
      </svg>
    </button>
    <aside id="side">
      <div class="side-head" id="links-head">Backlinks</div>
      <div id="links" hidden>
        <div id="tags"></div>
        <div id="bl-list"></div>
        <div id="notice" hidden></div>
      </div>
      <div id="graph-sec">
        <div class="side-head">
          <span>Graph</span>
          <span id="graph-count"></span>
          <span class="spacer"></span>
          <label>depth
            <select id="depth">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
            </select>
          </label>
        </div>
        <canvas id="graph-canvas"></canvas>
        <div id="graph-note" hidden></div>
      </div>
    </aside>
  </div>
  <div id="save-state"></div>
  <div id="ro-wrap"><span id="ro" hidden></span></div>
  <script>
    // This view owns its own saves and its own reload rule (MD-16/MD-17), so
    // the runtime's blanket reload-on-change must stay out of the way — it
    // would reload the page under the cursor, and our own autosave moves the
    // mtime on every write anyway.
    fused.autoReload(false);

    const MAX_BYTES = 2 * 1024 * 1024;
    // Obsidian's idle autosave interval. Not configurable, deliberately: the
    // whole point of copying Obsidian here is the absence of save ceremony.
    const AUTOSAVE_MS = 2000;

    const conflictEl = document.getElementById("conflict");
    const conflictTextEl = document.getElementById("conflict-text");
    const saveStateEl = document.getElementById("save-state");
    const statusEl = document.getElementById("status");
    const skelEl = document.getElementById("skel");
    const editorWrapEl = document.getElementById("editor-wrap");

    let file = null;
    let text = "";        // last text loaded from (or written to) disk
    let mtime = null;     // the optimistic-lock token
    let writable = true;  // stat.writable — the shell's persisted read_only (MD-15)
    let dirty = false;
    let saving = false;
    let savePromise = null;
    let saveTimer = null;
    let view = null;      // the live CodeMirror view, or null
    let themeObserver = null;
    let themedDark = true;

    // The note's link facts, from graph.py. Resolution happens THERE, on the
    // candidate set that exists right now (MD-6) — this page never resolves a
    // target itself, so the note view and the graph views cannot disagree.
    let notes = null;
    let resolved = null;

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Join an absolute POSIX dir with a relative path and collapse "." / ".."
    // segments — pure string work (no fs access; paths are absolute POSIX).
    function resolvePath(dir, rel) {
      const out = [];
      for (const p of dir.split("/").concat(rel.split("/"))) {
        if (p === "" || p === ".") continue;
        if (p === "..") out.pop();
        else out.push(p);
      }
      return "/" + out.join("/");
    }

    // A malformed escape ("%zz") throws rather than decoding; the authored text
    // is the best remaining guess at what the author meant.
    function decodeMaybe(value) {
      try { return decodeURIComponent(value); } catch (e) { return value; }
    }

    function noteDir() { return file ? file.slice(0, file.lastIndexOf("/")) : ""; }
    function isNote(path) { return /\.(md|markdown)$/i.test(path || ""); }

    // ---- shell navigation ---------------------------------------------------
    // Mirrors frontend/src/lib/router.ts urlForFsPath + navigate, the same way
    // history/canvas/preview each do: the prefix this session is already in,
    // every path segment encoded, then pushState + "fused:navigate" on the top
    // window so the shell re-routes without a full reload.
    function shellPrefix() {
      try {
        const p = window.top.location.pathname;
        if (p.startsWith("/embed/") || p === "/embed") return "/embed/";
      } catch (e) { /* cross-origin — assume the normal shell */ }
      return "/view/";
    }
    function urlForFsPath(fsPath, search) {
      const norm = /^[A-Za-z]:[\\/]/.test(fsPath) ? fsPath.replace(/\\/g, "/") : fsPath;
      const encoded = norm.replace(/^\/+/, "").split("/").filter(Boolean)
        .map(encodeURIComponent).join("/");
      return shellPrefix() + encoded + (search ? "?" + search : "");
    }
    async function navigateShell(fsPath, search) {
      // Leaving this note must not lose edits newer than the last autosave.
      const flushed = await window.__fusedFlushEdits();
      if (!flushed.ok) return;
      const url = urlForFsPath(fsPath, search);
      try {
        const top = window.top;
        void top.location.href; // throws when cross-origin
        top.history.pushState(null, "", url);
        top.dispatchEvent(new Event("fused:navigate"));
        return;
      } catch (e) { /* fall through */ }
      try { window.top.location.href = url; } catch (e) { location.href = url; }
    }

    // A link to `Note#Heading` navigates to the note and hands the heading over
    // as an ordinary param, so the target view can scroll to it and the URL
    // stays shareable — which is also how this view receives it (see load()).
    function openNote(path, heading) {
      navigateShell(path, heading ? "heading=" + encodeURIComponent(heading) : "");
    }

    // `Target#Heading|label` → [target, heading, label]. Both parts optional.
    function splitInner(inner) {
      const pipe = inner.indexOf("|");
      const head = pipe === -1 ? inner : inner.slice(0, pipe);
      const label = pipe === -1 ? "" : inner.slice(pipe + 1).trim();
      const hash = head.indexOf("#");
      return [
        (hash === -1 ? head : head.slice(0, hash)).trim(),
        hash === -1 ? "" : head.slice(hash + 1).trim(),
        label,
      ];
    }

    // ======================================================================
    // Live Preview (MD-18a)
    // ======================================================================
    // Obsidian's mechanism rather than an approximation of it: ONE decoration
    // set over the CM6 document. Markup is replaced by a widget or hidden
    // everywhere except the lines the selection touches, where the raw source
    // comes back so it can be edited. There is no second rendered copy of the
    // document, which is precisely what lets one surface both read and write
    // (MD-1) — no mode switch, and no caret to hand between two views.
    //
    // What a range IS comes from the vendored markdown grammar via syntaxTree,
    // so this file holds no block parser. Wikilinks and tags are not part of
    // that grammar, so they are matched by regex and then checked AGAINST the
    // tree, which is how MD-3's code-masking rule holds here without a second
    // copy of it.

    const relinkEffect = CM.StateEffect.define();

    // Node names whose text is code, and therefore never a link or a tag.
    const CODE_NODES = new Set([
      "InlineCode", "CodeText", "FencedCode", "CodeBlock", "CodeMark", "CodeInfo",
    ]);
    // A `#` inside a URL is a fragment, not a tag. This must NOT include Link
    // or Image: the grammar wraps the inner brackets of `[[Wiki]]` in a Link
    // node and of `![[embed]]` in an Image node, so treating those as
    // non-linkable would silently stop every wikilink from rendering.
    const URL_NODES = new Set(["URL", "Autolink"]);

    const HEADINGS = {
      ATXHeading1: 1, ATXHeading2: 2, ATXHeading3: 3,
      ATXHeading4: 4, ATXHeading5: 5, ATXHeading6: 6,
      SetextHeading1: 1, SetextHeading2: 2,
    };
    const EMPHASIS = {
      StrongEmphasis: "lp-bold",
      Emphasis: "lp-italic",
      Strikethrough: "lp-strike",
    };
    const EMPHASIS_MARKS = new Set(["EmphasisMark", "StrikethroughMark"]);

    // A widget is identified by `key` so CM can reuse the DOM across rebuilds
    // instead of replacing every widget on every keystroke.
    class DomWidget extends CM.WidgetType {
      constructor(key, build, opaque) {
        super();
        this.key = key;
        this.build = build;
        // `true` keeps CM's own event handling off the widget, so a click
        // reaches the delegated navigation handler instead of moving the
        // caret. `false` is what makes a widget click-to-edit: the caret
        // lands inside it, the line becomes selected, and the source shows.
        this.opaque = opaque === true;
      }
      eq(other) { return other.key === this.key; }
      toDOM(editorView) { return this.build(editorView); }
      ignoreEvent() { return this.opaque; }
    }

    function lineClass(state, from, to, cls) {
      const out = [];
      const first = state.doc.lineAt(from).number;
      const last = state.doc.lineAt(Math.min(to, state.doc.length)).number;
      for (let n = first; n <= last; n++) {
        out.push(CM.Decoration.line({ class: cls }).range(state.doc.line(n).from));
      }
      return out;
    }

    // Which lines have the caret (or a selection) on them: the reveal rule.
    // Line-level, matching Obsidian — putting the caret on a line un-renders
    // that whole line's markup, not just the one node under the cursor.
    function selectedLines(state) {
      const lines = new Set();
      for (const range of state.selection.ranges) {
        const first = state.doc.lineAt(range.from).number;
        const last = state.doc.lineAt(range.to).number;
        for (let n = first; n <= last; n++) lines.add(n);
      }
      return lines;
    }

    function touched(state, lines, from, to) {
      const first = state.doc.lineAt(from).number;
      const last = state.doc.lineAt(Math.min(to, state.doc.length)).number;
      for (let n = first; n <= last; n++) if (lines.has(n)) return true;
      return false;
    }

    // ---- widget builders ----------------------------------------------------

    // A wikilink resolved by graph.py, or a dim ghost that offers to create the
    // note. Both carry the attributes the one delegated click handler listens
    // for, so every link surface in this template navigates by one code path.
    function wikilinkWidget(raw) {
      const [target, heading, label] = splitInner(raw.replace(/^!?\[\[|\]\]$/g, ""));
      const embed = raw.startsWith("!");
      const row = resolved ? resolved.get(target) : undefined;
      const path = row ? row.path : null;
      const shown = label || target + (heading ? " > " + heading : "");
      const key = "wl:" + (embed ? "!" : "") + raw + "|" + (path || "");
      return new DomWidget(key, () => {
        if (embed && path && !isNote(path)) {
          const img = document.createElement("img");
          img.className = "lp-img";
          img.src = fused.rawUrl(path);
          img.alt = target;
          return img;
        }
        if (embed && !path) {
          const span = document.createElement("span");
          span.className = "wl-embed-missing";
          span.textContent = "Missing embed: " + target;
          return span;
        }
        const a = document.createElement("a");
        if (!path) {
          // Unresolved: a ghost, and clicking it creates the note — Obsidian's
          // behaviour, and only possible because this template writes.
          a.className = "wl wl-ghost";
          a.dataset.create = target;
          a.title = "Unresolved — click to create this note";
        } else {
          a.className = "wl";
          a.dataset.path = path;
          if (heading) a.dataset.heading = heading;
          if (row && row.title) a.title = row.title;
          a.href = urlForFsPath(path, heading ? "heading=" + encodeURIComponent(heading) : "");
        }
        // A note embedded in a note links to it rather than inlining the whole
        // document, which would need a second parse and could recurse.
        a.textContent = shown;
        return a;
      }, true);
    }

    // `[label](target)`. An in-vault relative target is resolved against the
    // note's own folder and handed `data-path`, for the reason MD-4a records:
    // this document is served at /render?path=…, so a browser-relative href
    // resolves against the server root and misses the file entirely. A real
    // href is set too, so hover preview and ⌘-click behave like normal links.
    //
    // No extension filter: the shell opens any path with its own template, so a
    // link to a .png, a .pdf or a subfolder is as navigable as one to a note.
    function markdownLinkWidget(label, href) {
      const key = "ln:" + label + "|" + href;
      return new DomWidget(key, () => {
        const a = document.createElement("a");
        a.className = "lp-link";
        a.textContent = label || href;
        // Absolute paths, any scheme (http:, mailto:, data:) and a bare
        // #anchor are not vault paths — rewriting them would break them. MD-3
        // draws this same line for what counts as an edge.
        if (/^(#|\/|[a-z][a-z0-9+.-]*:)/i.test(href)) {
          a.href = href;
          a.target = "_blank";
          a.rel = "noopener";
          return a;
        }
        const hash = href.indexOf("#");
        const target = hash === -1 ? href : href.slice(0, hash);
        if (!target) { a.href = href; return a; }
        const heading = hash === -1 ? "" : decodeMaybe(href.slice(hash + 1));
        const path = resolvePath(noteDir(), decodeMaybe(target));
        a.dataset.path = path;
        if (heading) a.dataset.heading = heading;
        a.href = urlForFsPath(path, heading ? "heading=" + encodeURIComponent(heading) : "");
        return a;
      }, true);
    }

    // `![alt](src)`. Click-to-edit rather than opaque: the caret lands in the
    // source so the path can be fixed, which is the only way to edit it now
    // that there is no separate source mode.
    function imageWidget(alt, src) {
      const key = "im:" + alt + "|" + src;
      return new DomWidget(key, () => {
        const img = document.createElement("img");
        img.className = "lp-img";
        img.alt = alt;
        if (/^[a-z][a-z0-9+.-]*:/i.test(src)) img.src = src;   // http:, data:, file:
        else if (src.startsWith("/")) img.src = fused.rawUrl(src);
        else img.src = fused.rawUrl(resolvePath(noteDir(), decodeMaybe(src)));
        return img;
      }, false);
    }

    // A task checkbox is clickable and writes back, as in Obsidian — and it
    // stays rendered even with the caret on its line, also as in Obsidian.
    // The position comes from posAtDOM at click time rather than from a count
    // of markers in the document, so an edit between render and click cannot
    // tick the wrong box.
    function taskWidget(checked) {
      return new DomWidget("task:" + checked, (editorView) => {
        const box = document.createElement("input");
        box.type = "checkbox";
        box.className = "lp-task";
        box.checked = checked;
        box.disabled = !writable;
        if (!writable) return box;
        box.addEventListener("mousedown", (e) => e.stopPropagation());
        box.addEventListener("change", () => {
          const at = editorView.posAtDOM(box);
          const line = editorView.state.doc.lineAt(at);
          const offset = line.text.indexOf("[", at - line.from);
          if (offset === -1) return;
          const inner = line.from + offset + 1;
          editorView.dispatch({
            changes: { from: inner, to: inner + 1, insert: box.checked ? "x" : " " },
          });
          void save();
        });
        return box;
      }, true);
    }

    function hrWidget() {
      return new DomWidget("hr", () => {
        const hr = document.createElement("hr");
        hr.className = "lp-hr";
        return hr;
      }, false);
    }

    // A pipe table rendered as a table. Cell text is shown verbatim — inline
    // markup inside a cell is not decorated, because a decoration cannot span
    // into a widget's DOM. Clicking the table puts the caret in the source,
    // which is where a cell is edited.
    function tableWidget(source) {
      return new DomWidget("tb:" + source, () => {
        const rows = source.split("\n")
          .map((line) => line.trim())
          .filter(Boolean)
          // The alignment row (`|---|:--:|`) is structure, not content.
          .filter((line) => !(/^[\s|:-]+$/.test(line) && line.includes("-")))
          .map((line) => line.replace(/^\|/, "").replace(/\|$/, "")
            .split("|").map((cell) => cell.trim()));
        const table = document.createElement("table");
        table.className = "lp-table";
        rows.forEach((cells, index) => {
          const tr = document.createElement("tr");
          for (const cell of cells) {
            const td = document.createElement(index === 0 ? "th" : "td");
            td.textContent = cell;
            tr.appendChild(td);
          }
          table.appendChild(tr);
        });
        return table;
      }, false);
    }

    function tagWidget(tag) {
      return new DomWidget("tg:" + tag, () => {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = "#" + tag;
        return span;
      }, false);
    }

    // ---- the decoration set -------------------------------------------------

    const WIKILINK_RE = /!?\[\[([^\[\]\n]+?)\]\]/g;
    const TAG_RE = /(^|[\s(\[])#([A-Za-z_][\w/-]*)/g;

    function within(tree, pos, names) {
      for (let node = tree.resolveInner(pos, 1); node; node = node.parent) {
        if (names.has(node.name)) return true;
      }
      return false;
    }

    // Takes a STATE, not a view, and walks the whole document — see the
    // StateField below for why it cannot be a view plugin, and therefore has no
    // viewport to narrow the walk to. Notes are small (MD-10 caps a note at
    // 256 KB), so whole-document is well inside budget, and it also removes the
    // viewport/height feedback loop that made scrolling jitter.
    function buildDecorations(state) {
      const lines = selectedLines(state);
      const tree = CM.syntaxTree(state);
      const out = [];
      // CM rejects overlapping replacements, so every replaced range is
      // recorded as it is made and the regex passes below skip anything that
      // would land inside one. Decorations are built as Ranges via
      // `.range(from, to)`, the shape Decoration.set takes. A replacement here
      // MAY span line breaks (the table widget does) — but only because these
      // come from a StateField: CM throws "Decorations that replace line breaks
      // may not be specified via plugins" for the same range out of a
      // ViewPlugin. `block: true` would additionally demand exact line
      // boundaries and throw without them.
      const blocked = [];
      function pushMark(from, to, cls) {
        if (from >= to) return;
        out.push(CM.Decoration.mark({ class: cls }).range(from, to));
      }
      function pushHide(from, to) {
        if (from >= to) return;
        out.push(CM.Decoration.replace({}).range(from, to));
        blocked.push([from, to]);
      }
      function pushWidget(from, to, widget) {
        out.push(CM.Decoration.replace({ widget }).range(from, to));
        blocked.push([from, to]);
      }
      const isBlocked = (from, to) => blocked.some(([a, b]) => from < b && to > a);

      // Frontmatter is not part of the vendored grammar, and what the grammar
      // makes of it instead is actively wrong: `---` opens as a HorizontalRule
      // and `title: x\n---` closes as a SetextHeading2, so a YAML block would
      // render as a rule followed by a large heading. It is therefore matched
      // by a line scan, decorated as dim monospace, and — the part that
      // matters — every tree decoration inside it is suppressed below.
      // Dimmed rather than hidden: a properties table is separate work
      // (MD-18b), and a silently invisible block is worse than a plain one.
      let frontmatterEnd = -1;
      if (state.doc.lines > 1 && state.doc.line(1).text.trim() === "---") {
        for (let n = 2; n <= state.doc.lines; n++) {
          if (state.doc.line(n).text.trim() === "---") {
            frontmatterEnd = state.doc.line(n).to;
            break;
          }
        }
        if (frontmatterEnd !== -1) {
          out.push(...lineClass(state, 0, frontmatterEnd, "lp-fm-line"));
        }
      }

      tree.iterate({
        enter: (node) => {
          const name = node.name;
          // Inside frontmatter the grammar's answer is wrong (see above), so
          // nothing it says about this range is acted on.
          if (name !== "Document" && node.to <= frontmatterEnd) return false;
          const open = touched(state, lines, node.from, node.to);

          if (HEADINGS[name]) {
            pushMark(node.from, node.to, "lp-h" + HEADINGS[name]);
            return true; // descend: the HeaderMark child is hidden below
          }
          if (name === "HeaderMark") {
            const parent = node.node.parent;
            if (!parent || !HEADINGS[parent.name]) return false;
            if (touched(state, lines, parent.from, parent.to)) {
              pushMark(node.from, node.to, "lp-mark");
              return false;
            }
            // Swallow the space after `##` too, or the text starts indented.
            const after = state.doc.sliceString(node.to, node.to + 1);
            pushHide(node.from, node.to + (after === " " ? 1 : 0));
            return false;
          }
          if (EMPHASIS[name]) {
            pushMark(node.from, node.to, EMPHASIS[name]);
            return true;
          }
          if (EMPHASIS_MARKS.has(name)) {
            if (open) pushMark(node.from, node.to, "lp-mark");
            else pushHide(node.from, node.to);
            return false;
          }
          if (name === "InlineCode") {
            pushMark(node.from, node.to, "lp-code");
            return true;
          }
          if (name === "CodeMark") {
            const parent = node.node.parent;
            // Only an inline span's backticks vanish; a fence keeps its
            // markers, exactly as Obsidian does.
            if (!parent || parent.name !== "InlineCode") return false;
            if (open) pushMark(node.from, node.to, "lp-mark");
            else pushHide(node.from, node.to);
            return false;
          }
          if (name === "FencedCode" || name === "CodeBlock") {
            out.push(...lineClass(state, node.from, node.to, "lp-fence-line"));
            return true; // let the embedded language highlight inside
          }
          if (name === "Blockquote") {
            out.push(...lineClass(state, node.from, node.to, "lp-quote-line"));
            return true;
          }
          if (name === "QuoteMark") {
            if (open) pushMark(node.from, node.to, "lp-mark");
            else {
              const after = state.doc.sliceString(node.to, node.to + 1);
              pushHide(node.from, node.to + (after === " " ? 1 : 0));
            }
            return false;
          }
          if (name === "ListMark") {
            pushMark(node.from, node.to, "lp-bullet");
            return false;
          }
          if (name === "TaskMarker") {
            // Rendered even with the caret on its line — as in Obsidian, a
            // checkbox is a control, not markup you edit by hand.
            const checked = /[xX]/.test(state.doc.sliceString(node.from, node.to));
            pushWidget(node.from, node.to, taskWidget(checked));
            return false;
          }
          if (name === "HorizontalRule") {
            if (open) return false;
            pushWidget(node.from, node.to, hrWidget());
            return false;
          }
          if (name === "Table") {
            if (open) return true;
            pushWidget(node.from, node.to,
              tableWidget(state.doc.sliceString(node.from, node.to)));
            return false;
          }
          if (name === "Image" || name === "Link") {
            if (open) return true;
            const raw = state.doc.sliceString(node.from, node.to);
            const match = /^(!?)\[([^\]]*)\]\(([^()\s]*)\)$/.exec(raw);
            // No match means this is not a plain inline link: a reference
            // link, a titled link, or — the common case — the inner brackets
            // of a `[[wikilink]]`, which the regex pass below owns.
            if (!match) return true;
            pushWidget(node.from, node.to, match[1]
              ? imageWidget(match[2], match[3])
              : markdownLinkWidget(match[2], match[3]));
            return false;
          }
          return true;
        },
      });

      // Wikilinks and tags are not in the grammar, so they are matched by regex
      // and then checked AGAINST the tree: a `[[x]]` inside a fence or a `#tag`
      // inside a URL stays literal, which is the same line graph.py draws over
      // the same text (MD-3). A `[[` inside frontmatter is not a link either.
      const chunk = state.doc.toString();
      WIKILINK_RE.lastIndex = 0;
      let match;
      while ((match = WIKILINK_RE.exec(chunk))) {
        const start = match.index;
        const end = start + match[0].length;
        if (start < frontmatterEnd) continue;
        if (isBlocked(start, end) || within(tree, start + 2, CODE_NODES)) continue;
        if (touched(state, lines, start, end)) continue;
        pushWidget(start, end, wikilinkWidget(match[0]));
      }
      TAG_RE.lastIndex = 0;
      while ((match = TAG_RE.exec(chunk))) {
        const start = match.index + match[1].length;
        const end = start + match[2].length + 1;
        if (start < frontmatterEnd) continue;
        if (isBlocked(start, end)) continue;
        if (within(tree, start + 1, CODE_NODES)
            || within(tree, start + 1, URL_NODES)) continue;
        if (touched(state, lines, start, end)) continue;
        pushWidget(start, end, tagWidget(match[2]));
      }

      return CM.Decoration.set(out, true);
    }

    // A StateField, NOT a ViewPlugin — and this is load-bearing, not a style
    // preference. CM refuses a plugin-provided replacement that spans a line
    // break ("Decorations that replace line breaks may not be specified via
    // plugins", @codemirror/view), and the table widget replaces a multi-line
    // Table node with one element. As a plugin that threw during the view update
    // the instant a table scrolled into the viewport, abandoning the rest of the
    // render and leaving unpainted white regions on screen — reported as "parts
    // of the page go blank while scrolling". A state field is allowed to span
    // line breaks, so the constraint disappears rather than being worked around.
    // Do not "simplify" this back to a ViewPlugin.
    const livePreviewField = CM.StateField.define({
      create: (state) => buildDecorations(state),
      update(value, tr) {
        // The syntax tree is NOT complete when the view opens: the language
        // extension parses a first chunk and then advances in the background,
        // dispatching as it goes. A whole-document walk over a half-parsed tree
        // would leave everything past the parse frontier undecorated until the
        // next keystroke, so an advanced tree counts as a reason to rebuild.
        // Identity compare — the language field hands out a new Tree each time.
        if (tr.docChanged || tr.selection
            || CM.syntaxTree(tr.startState) !== CM.syntaxTree(tr.state)
            || tr.effects.some((e) => e.is(relinkEffect))) {
          return buildDecorations(tr.state);
        }
        // Nothing that changes what renders, and `tr.docChanged` above covers
        // every case where positions moved, so the set is reused as-is.
        return value;
      },
      provide: (field) => CM.EditorView.decorations.from(field),
    });

    // ---- saving: Obsidian's model (MD-16) ----------------------------------
    // No save button, no dirty dot, no prompt. Autosave on an idle timer, on
    // focus loss and on tab switch; Cmd/Ctrl+S only forces the flush early.
    function setDirty(next) {
      dirty = next;
      // Deliberately no dirty indicator: the absence of save ceremony IS the
      // behaviour being copied. The slot only ever carries "Saving…" or a
      // failure, both of which a user does need to see.
      if (conflictEl.style.display !== "flex" && !saving) {
        saveStateEl.textContent = "";
        saveStateEl.classList.remove("error");
      }
    }

    function armAutosave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => { void save(); }, AUTOSAVE_MS);
    }

    async function save() {
      clearTimeout(saveTimer);
      while (saving && savePromise) await savePromise;
      if (!view || !dirty || !writable) return;
      if (conflictEl.style.display === "flex") return; // never auto-overwrite
      savePromise = doSave();
      await savePromise;
    }

    async function doSave() {
      // CM's Text is immutable, so a reference compare after the await detects
      // edits that landed during the write — those must not be masked by
      // setDirty(false), or the idle timer would skip them.
      const docState = view.state.doc;
      const body = docState.toString();
      saving = true;
      saveStateEl.textContent = "Saving…";
      saveStateEl.classList.remove("error");
      try {
        const st = await fused.writeFile(file, body, { expectedMtime: mtime });
        mtime = st.mtime;
        text = body;
        hideConflict();
        if (view.state.doc === docState) {
          setDirty(false);
          saveStateEl.textContent = "";
        } else {
          setDirty(true);
          armAutosave();
        }
        // Each save re-parses exactly this note, so the ghosts, the backlinks,
        // the graph and the `[[` candidates stay current with no rebuild (MD-9).
        candidates = null;
        await refreshLinks();
        if (graphOn()) void loadGraph();
      } catch (err) {
        if (err.type === "conflict") {
          showConflict("This note changed on disk while you were editing it.");
        } else if (err.type === "readonly") {
          writable = false;
          lockEditor("This file is read-only, so your edits can't be saved.");
        } else {
          saveStateEl.textContent = "Save failed: " + (err.message || "");
          saveStateEl.classList.add("error");
        }
      } finally {
        saving = false;
      }
    }

    function showConflict(message) {
      conflictTextEl.textContent = message;
      conflictEl.style.display = "flex";
      saveStateEl.textContent = "";
    }

    function hideConflict() { conflictEl.style.display = "none"; }

    async function reloadFromDisk() {
      try {
        const st = await fused.stat(file);
        const fresh = await fused.readFile(file);
        text = fresh;
        mtime = st.mtime;
        writable = st.writable !== false;
        hideConflict();
        if (view) {
          view.dispatch({ changes: { from: 0, to: view.state.doc.length, insert: fresh } });
        }
        setDirty(false);
        await refreshLinks();
      } catch (err) {
        saveStateEl.textContent = "Reload failed: " + (err.message || "");
        saveStateEl.classList.add("error");
      }
    }

    // "Keep my version" is the one write that goes without the lock — the user
    // has been shown the conflict and chosen.
    async function keepMine() {
      if (!view) return;
      const body = view.state.doc.toString();
      try {
        const st = await fused.writeFile(file, body);
        mtime = st.mtime;
        text = body;
        hideConflict();
        setDirty(false);
        await refreshLinks();
      } catch (err) {
        saveStateEl.textContent = "Save failed: " + (err.message || "");
        saveStateEl.classList.add("error");
      }
    }

    // External changes are noticed on focus and on becoming visible rather than
    // by a stat ticker: a poll is the traffic that killed a mount once already
    // (runtime.js's fs/events note), and this view must stay mount-agnostic.
    // Clean buffer -> silent reload, exactly as Obsidian does. Dirty buffer and
    // the mtime moved -> the banner, which is the one deliberate deviation
    // (MD-17): fused-render sits on shared paths where Obsidian's
    // only-writer-in-the-vault assumption does not hold.
    async function checkExternalChange() {
      if (!file || saving) return;
      let st;
      try {
        st = await fused.stat(file);
      } catch (err) {
        return; // transient — the next focus or the next save will notice
      }
      if (st.mtime === mtime) return;
      if (!dirty) {
        await reloadFromDisk();
        return;
      }
      showConflict("This note changed on disk while you were editing it.");
    }

    function lockEditor(message) {
      clearTimeout(saveTimer);
      fusedRoBadge.update(document.getElementById("ro"), "Read-only", message);
      if (view) buildEditor(view.state.doc.toString()); // rebuild with the lock on
    }

    function wantsDark() {
      return document.documentElement.getAttribute("data-theme") !== "light";
    }

    // ---- editing behaviours (MD-18) ----------------------------------------
    // Each of these is what makes Obsidian feel like Obsidian, and each is a
    // small keymap entry rather than a feature. Smart lists, list renumbering
    // and blockquote continuation are NOT reimplemented here: they are
    // `markdownKeymap` from the markdown grammar we vendored, which is the same
    // code Obsidian's own editor runs.
    function toggleWrap(editorView, marker) {
      const state = editorView.state;
      const { from, to } = state.selection.main;
      const pre = state.sliceDoc(Math.max(0, from - marker.length), from);
      const post = state.sliceDoc(to, Math.min(state.doc.length, to + marker.length));
      if (pre === marker && post === marker) {
        editorView.dispatch({
          changes: [
            { from: from - marker.length, to: from },
            { from: to, to: to + marker.length },
          ],
          selection: { anchor: from - marker.length, head: to - marker.length },
        });
      } else {
        editorView.dispatch({
          changes: [{ from, insert: marker }, { from: to, insert: marker }],
          selection: { anchor: from + marker.length, head: to + marker.length },
        });
      }
      return true;
    }

    function insertLink(editorView) {
      const { from, to } = editorView.state.selection.main;
      const selected = editorView.state.sliceDoc(from, to);
      const isUrl = /^[a-z][a-z0-9+.-]*:\/\/\S*$/i.test(selected);
      const inserted = isUrl ? `[](${selected})` : `[${selected}]()`;
      editorView.dispatch({
        changes: { from, to, insert: inserted },
        selection: { anchor: isUrl ? from + 1 : from + selected.length + 3 },
      });
      return true;
    }

    // Cmd+Enter toggles the task on this line, adds a checkbox to a plain list
    // item, or makes the line a task — the three states Obsidian cycles.
    function toggleCheckbox(editorView) {
      const line = editorView.state.doc.lineAt(editorView.state.selection.main.head);
      const box = /^(\s*(?:[-*+]|\d+[.)])\s+)\[([ xX])\]/.exec(line.text);
      if (box) {
        const at = line.from + box[1].length + 1;
        editorView.dispatch({
          changes: { from: at, to: at + 1, insert: box[2] === " " ? "x" : " " },
        });
        return true;
      }
      const bullet = /^(\s*(?:[-*+]|\d+[.)])\s+)/.exec(line.text);
      const indent = /^\s*/.exec(line.text)[0];
      editorView.dispatch({
        changes: bullet
          ? { from: line.from + bullet[1].length, insert: "[ ] " }
          : { from: line.from + indent.length, insert: "- [ ] " },
      });
      return true;
    }

    const editorKeymap = [
      { key: "Tab", run: CM.indentMore, shift: CM.indentLess },
      { key: "Mod-b", run: (v) => toggleWrap(v, "**") },
      { key: "Mod-i", run: (v) => toggleWrap(v, "*") },
      { key: "Mod-k", run: insertLink },
      { key: "Mod-Enter", run: toggleCheckbox },
    ];

    // Pasting a URL over a selection makes a link out of it, rather than
    // replacing the words the user just chose.
    const pasteHandler = CM.EditorView.domEventHandlers({
      paste(event, target) {
        const url = ((event.clipboardData || {}).getData
          ? event.clipboardData.getData("text/plain") : "").trim();
        if (!/^[a-z][a-z0-9+.-]*:\/\/\S+$/i.test(url)) return false;
        const { from, to } = target.state.selection.main;
        if (from === to) return false;
        const selected = target.state.sliceDoc(from, to);
        event.preventDefault();
        target.dispatch({
          changes: { from, to, insert: `[${selected}](${url})` },
          selection: { anchor: from + selected.length + url.length + 4 },
        });
        return true;
      },
    });

    // ---- the [[ popup (MD-14) ----------------------------------------------
    // Candidates come from the same scan the graph reads, so the popup is free
    // once the index exists and can never offer a note the graph disagrees
    // about. Cached briefly so a fast typist does not spawn a run per keystroke.
    let candidates = null;
    let candidatesAt = 0;
    const CANDIDATES_TTL_MS = 5000;

    async function ensureCandidates() {
      if (candidates && Date.now() - candidatesAt < CANDIDATES_TTL_MS) return candidates;
      const root = notes ? notes.root : (fused.params.get("root") || "");
      if (!root) return null;
      try {
        const data = await fused.runPython("./graph.py",
          { action: "candidates", root }, { key: "md-candidates" });
        if (data.error) return null;
        candidates = data;
        candidatesAt = Date.now();
        return candidates;
      } catch (err) {
        return null;
      }
    }

    function headingOptions(headings, prefix) {
      return headings.map((h) => ({
        label: prefix + "#" + h.text,
        displayLabel: "#".repeat(h.level) + " " + h.text,
        type: "text",
      }));
    }

    async function markdownCompletions(context) {
      const before = context.state.doc.sliceString(
        Math.max(0, context.pos - 240), context.pos);

      // `[[…` and `![[…` — the same popup; the `!` only changes what the link
      // means, not what can be linked to.
      const wiki = /\[\[([^\[\]\n]*)$/.exec(before);
      if (wiki) {
        const typed = wiki[1];
        const from = context.pos - typed.length;
        const data = await ensureCandidates();
        if (!data) return null;
        const hash = typed.indexOf("#");
        if (hash === -1) {
          return {
            from,
            options: data.notes.map((note) => ({
              label: note.link, detail: note.title, type: "class",
            })),
            validFor: /^[^\[\]#\n]*$/,
          };
        }
        const notePart = typed.slice(0, hash);
        const headings = notePart
          ? ((data.notes.find((n) => n.link.toLowerCase() === notePart.toLowerCase())
              || {}).headings || [])
          : (notes ? notes.headings : []);
        return { from, options: headingOptions(headings, notePart) };
      }

      // `#tag` — same guard the decoration uses, so a URL fragment is not a tag.
      const tag = /(?:^|[\s(\[])#([A-Za-z_][\w/-]*)?$/.exec(before);
      if (tag) {
        const typed = tag[1] || "";
        const data = await ensureCandidates();
        if (!data) return null;
        return {
          from: context.pos - typed.length,
          options: data.tags.map((t) => ({ label: t, type: "keyword" })),
          validFor: /^[\w/-]*$/,
        };
      }
      return null;
    }

    function editorExtensions() {
      const base = [
        CM.basicSetup,
        ...(wantsDark() ? [CM.oneDark] : []),
        CM.markdown({ base: CM.markdownLanguage }),
        CM.EditorView.lineWrapping,
        // Above basicSetup's default keymap: Enter must continue the list
        // marker rather than plain-indent, and Tab must indent the list item.
        CM.Prec.high(CM.keymap.of(CM.markdownKeymap.concat(editorKeymap))),
        CM.Prec.high(CM.autocompletion({ override: [markdownCompletions] })),
        pasteHandler,
        livePreviewField,
        CM.EditorView.updateListener.of((update) => {
          if (!update.docChanged) return;
          setDirty(true);
          armAutosave();
        }),
      ];
      if (!writable) {
        // The server refuses the write anyway; opening disabled is what makes
        // the UI honest up front. On an rclone mount with CacheMode=full a
        // doomed write even succeeds locally and only 403s later on upload, so
        // this reads the shell's persisted read_only flag through
        // stat.writable rather than os.access (MD-15). Decorations still
        // render: a locked buffer is what "reading view" is now (MD-1).
        base.push(CM.EditorView.editable.of(false));
        base.push(CM.EditorState.readOnly.of(true));
      }
      return base;
    }

    function buildEditor(body) {
      const previous = view;
      const selection = previous ? previous.state.selection.main.head : cursorMemory();
      const scroll = previous ? previous.scrollDOM.scrollTop : 0;
      previous?.destroy();
      editorWrapEl.innerHTML = "";
      const extensions = editorExtensions();
      view = new CM.EditorView({ doc: body, extensions, parent: editorWrapEl });
      const at = Math.min(selection, view.state.doc.length);
      view.dispatch({ selection: { anchor: at } });
      view.scrollDOM.scrollTop = scroll;

      // A live appearance change reconfigures the RUNNING view — rebuilding it
      // would throw away unsaved edits, the caret and the scroll position.
      themeObserver?.disconnect();
      themedDark = wantsDark();
      themeObserver = new MutationObserver(() => {
        const next = wantsDark();
        if (next === themedDark || !view) return;
        themedDark = next;
        try {
          view.dispatch({
            effects: CM.StateEffect.reconfigure.of(
              extensions.filter((e) => e !== CM.oneDark).concat(next ? [CM.oneDark] : [])),
          });
        } catch (err) { /* cosmetic only — keep the current editor theme */ }
      });
      themeObserver.observe(document.documentElement,
        { attributes: true, attributeFilter: ["data-theme"] });
    }

    // Cursor position per file, so switching away and back lands where you were
    // (Obsidian remembers this; sessionStorage is the right lifetime for it).
    function cursorKey() { return "fused-md-cursor:" + file; }
    function cursorMemory() {
      try { return parseInt(sessionStorage.getItem(cursorKey()) || "0", 10) || 0; }
      catch (e) { return 0; }
    }
    function rememberCursor() {
      if (!view) return;
      try { sessionStorage.setItem(cursorKey(), String(view.state.selection.main.head)); }
      catch (e) { /* private mode — the memory is a nicety */ }
    }

    // `?heading=` is how a `[[Note#Heading]]` link arrives. There are no
    // rendered headings to scan any more, so the doc itself is the index:
    // scroll the matching ATX line into view without moving the caret onto it,
    // which would un-render that line the moment you arrived.
    function scrollToHeading() {
      const wanted = (fused.params.get("heading") || "").trim().toLowerCase();
      if (!wanted || !view) return;
      const doc = view.state.doc;
      for (let n = 1; n <= doc.lines; n++) {
        const match = /^#{1,6}\s+(.*)$/.exec(doc.line(n).text);
        if (match && match[1].trim().toLowerCase() === wanted) {
          view.dispatch({
            effects: CM.EditorView.scrollIntoView(doc.line(n).from, { y: "start" }),
          });
          return;
        }
      }
    }

    // ---- backlinks, in the sidebar ------------------------------------------
    function renderSidebar() {
      const linksEl = document.getElementById("links");
      const listEl = document.getElementById("bl-list");
      const tagsEl = document.getElementById("tags");
      const noticeEl = document.getElementById("notice");
      if (!notes) {
        linksEl.hidden = true;
        return;
      }
      linksEl.hidden = false;
      tagsEl.innerHTML = notes.tags
        .map((t) => `<span class="tag">#${escapeHtml(t)}</span>`).join("");

      const rows = notes.backlinks || [];
      document.getElementById("links-head").textContent =
        rows.length ? `Backlinks (${rows.length})` : "Backlinks";
      listEl.innerHTML = rows.length
        ? rows.map((row) => `
            <button class="bl" data-path="${escapeHtml(row.path)}">
              <span class="bl-title">${escapeHtml(row.title)}</span>
              <span class="bl-path">${escapeHtml(row.rel)}</span>
            </button>`).join("")
        : `<div class="bl-empty">No other note under ${escapeHtml(notes.root)}
             links here.</div>`;

      // Caps are reported, never silently applied (MD-10).
      const notices = [];
      if (notes.truncated) {
        notices.push(`Only the first ${notes.notes} notes under
          ${escapeHtml(notes.root)} were scanned, so some backlinks may be missing.`);
      }
      if ((notes.skipped_large || []).length) {
        notices.push(`${notes.skipped_large.length} file(s) were too large to parse
          as notes and were skipped.`);
      }
      noticeEl.innerHTML = notices.join("<br />");
      noticeEl.hidden = !notices.length;
    }

    async function refreshLinks() {
      const root = fused.params.get("root") || "";
      try {
        const data = await fused.runPython("./graph.py",
          { action: "note", file, root }, { key: "md-note" });
        if (data.error) {
          // A mount-backed root, or a note outside its root: the document still
          // renders and stays editable, the link layer just has nothing to say
          // (MD-11). Reading and writing one file never needed the walk.
          notes = null;
          resolved = null;
        } else {
          notes = data;
          resolved = new Map();
          for (const link of data.links) {
            if (!resolved.has(link.target)) resolved.set(link.target, link);
          }
        }
      } catch (err) {
        notes = null;
        resolved = null;
      }
      renderSidebar();
      // Every ghost may just have become a real link (or the reverse), and the
      // decorations were built against the old answer.
      view?.dispatch({ effects: relinkEffect.of(null) });
      return notes;
    }

    // Clicking an unresolved link creates the note — Obsidian's behaviour, and
    // only possible because this template writes.
    async function createGhost(target) {
      if (!notes) return;
      const clean = target.replace(/\\/g, "/").replace(/^\.\//, "");
      const name = /\.(md|markdown)$/i.test(clean) ? clean : clean + ".md";
      const base = clean.includes("/") ? notes.root : noteDir();
      const path = resolvePath(base, name);
      try {
        const st = await fused.stat(path);
        if (st.writable === false) return; // read-only target: nothing to offer
      } catch (err) { /* absent, which is the normal case here */ }
      try {
        await fused.writeFile(path, "# " + name.replace(/\.(md|markdown)$/i, "") + "\n");
      } catch (err) {
        saveStateEl.textContent = "Could not create " + name + ": " + (err.message || "");
        saveStateEl.classList.add("error");
        return;
      }
      openNote(path, "");
    }

    // One delegated handler for every link surface: wikilink and markdown-link
    // widgets and backlink rows all carry data-path; ghosts carry data-create.
    document.addEventListener("click", (event) => {
      const create = event.target.closest("[data-create]");
      if (create) {
        event.preventDefault();
        void createGhost(create.getAttribute("data-create"));
        return;
      }
      const el = event.target.closest("[data-path]");
      if (!el) return;
      event.preventDefault();
      openNote(el.getAttribute("data-path"), el.getAttribute("data-heading") || "");
    });

    document.getElementById("reload").addEventListener("click", () => void reloadFromDisk());
    document.getElementById("keep").addEventListener("click", () => void keepMine());

    // Cmd/Ctrl+S forces the flush early — it is not "the save", because the
    // idle timer and the blur hook already saved. There is no Cmd/Ctrl+E: with
    // one surface there is nothing to toggle to (MD-1).
    window.addEventListener("keydown", (event) => {
      if (!(event.metaKey || event.ctrlKey)) return;
      if (event.key.toLowerCase() !== "s") return;
      event.preventDefault();
      void save();
    });

    // Flush on focus loss and on tab switch, then look for an external change
    // when we come back (see checkExternalChange).
    window.addEventListener("blur", () => { rememberCursor(); void save(); });
    window.addEventListener("pagehide", () => { rememberCursor(); void save(); });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") {
        rememberCursor();
        void save();
      } else {
        void checkExternalChange();
      }
    });
    window.addEventListener("focus", () => { void checkExternalChange(); });

    // Flush hook for the shell: anything that remounts this iframe (a mode
    // switch) would silently discard edits newer than the last autosave.
    window.__fusedFlushEdits = async () => {
      if (!view || !dirty) return { ok: true };
      if (conflictEl.style.display === "flex") return { ok: false };
      await save();
      return { ok: !dirty && conflictEl.style.display !== "flex" };
    };

    // ---- the sidebar's graph (MD-19) ---------------------------------------
    // The canvas, the sim and every interaction rule live in
    // /template-shared/graph-canvas.js, shared with the folder-level `graph`
    // mode — one implementation, so the two surfaces cannot drift apart.
    const sideEl = document.getElementById("side");
    const toggleEl = document.getElementById("toggle-graph");
    const canvasEl = document.getElementById("graph-canvas");
    const graphCountEl = document.getElementById("graph-count");
    const graphNoteEl = document.getElementById("graph-note");
    const depthEl = document.getElementById("depth");

    const canvas = fusedGraph.create({
      canvas: canvasEl,
      onOpenNote: (path) => openNote(path, ""),
      onCreateGhost: (label) => void createGhost(label),
    });

    function graphOn() { return fused.params.get("graph") === "1"; }
    function graphDepth() {
      const n = parseInt(fused.params.get("depth") || "1", 10);
      return Number.isFinite(n) && n >= 0 && n <= 3 ? n : 1;
    }

    async function loadGraph() {
      if (!graphOn() || !file) return;
      const root = fused.params.get("root") || "";
      let data;
      try {
        data = await fused.runPython("./graph.py",
          { action: "graph", file, root, depth: String(graphDepth()) },
          { key: "md-graph" });
      } catch (err) {
        data = { error: "graph_failed", message: err.message || String(err) };
      }
      if (data.error) {
        // A mount-backed root is refused outright rather than walked (MD-11);
        // say so instead of drawing an empty canvas.
        canvas.setData({ nodes: [], edges: [] });
        graphCountEl.textContent = "";
        graphNoteEl.hidden = false;
        graphNoteEl.textContent = data.message || data.error;
        return;
      }
      graphNoteEl.hidden = !data.truncated;
      if (data.truncated) graphNoteEl.textContent = "Partial: the walk hit its file cap.";
      graphCountEl.textContent = `${data.nodes.length} of ${data.total_notes} notes`;
      canvas.setData(data);
    }

    toggleEl.addEventListener("click", () => {
      fused.params.set("graph", graphOn() ? "0" : "1");
    });
    depthEl.addEventListener("change", () => fused.params.set("depth", depthEl.value));

    // One toggle for the whole sidebar: backlinks and the graph are the same
    // panel, as they are in Obsidian's right sidebar. The state lives in a
    // param, so an open sidebar is part of a shareable URL.
    function applySidebar() {
      const on = graphOn();
      sideEl.classList.toggle("on", on);
      toggleEl.setAttribute("aria-pressed", String(on));
      depthEl.value = String(graphDepth());
      if (on) {
        canvas.nudge(); // the canvas had zero size while the panel was hidden
        void loadGraph();
      }
    }

    function fail(html, isError) {
      skelEl.hidden = true;
      statusEl.hidden = false;
      statusEl.classList.toggle("error", isError === true);
      statusEl.innerHTML = html;
    }

    // ---- load --------------------------------------------------------------
    async function load() {
      file = fused.params.get("_file");
      if (!file) {
        fail("No file selected (missing _file param).", true);
        return;
      }
      const rawUrl = fused.rawUrl(file);
      try {
        const st = await fused.stat(file);
        if (st.size !== null && st.size !== undefined && st.size > MAX_BYTES) {
          fail(`File is too large to edit inline (${st.size.toLocaleString()} bytes).
            <a href="${rawUrl}" target="_blank" rel="noopener">Open raw</a>`, false);
          return;
        }
        text = await fused.readFile(file);
        mtime = st.mtime;
        writable = st.writable !== false; // absent field (older server) → editable
      } catch (err) {
        fail(`Failed to load file: ${escapeHtml(err.message)}`, true);
        return;
      }

      fusedRoBadge.update(document.getElementById("ro"),
        writable ? "" : "Read-only",
        writable ? "" : "This file can't be written, so the editor opens locked.");

      skelEl.hidden = true;
      buildEditor(text);
      scrollToHeading();
      // The link scan runs alongside the first build; a failed or refused scan
      // degrades to plain markdown rather than blocking the document, and
      // refreshLinks re-decorates once it lands.
      await refreshLinks();
      lastGraph = (fused.params.get("graph") || "0") + "/" + (fused.params.get("depth") || "1");
      applySidebar();
    }

    // Params are the state: the sidebar toggle and the depth both write params,
    // and this is the single re-render path — which is also what makes a graph
    // view URL-shareable, unlike Obsidian's.
    let lastGraph = null;
    fused.params.onChange((params) => {
      const key = (params.graph || "0") + "/" + (params.depth || "1");
      if (key !== lastGraph) {
        lastGraph = key;
        applySidebar();
      }
    });

    load();
  </script>
</body>
</html>
