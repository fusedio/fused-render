  const { sub, body, covered } = summarizePermission(p.tool, p.input);
  if (sub) {
    const d = document.createElement("div");
    d.className = "perm-sub";
    d.textContent = sub;
    el.appendChild(d);
  }
  if (body) {
    const pre = document.createElement("pre");
    pre.textContent = body;
    el.appendChild(pre);
  }
  const extra = leftoverInput(p.input, covered);
  if (extra) {
    const pre = document.createElement("pre");
    pre.textContent = JSON.stringify(extra, null, 2);
    el.appendChild(pre);
  }

  const actions = document.createElement("div");
  actions.className = "perm-actions";
  const status = document.createElement("div");
  status.className = "perm-status";
  el.append(actions, status);

  // Re-render whenever the verdict CHANGES: the click renders optimistically,
  // the polls report what landed on disk, and the file is the truth claude
  // acts on — so it has to be able to correct the label.
  let shown = "";
  function resolve(decision, scope, mode) {
    const key = decision + "/" + (scope || "") + "/" + (mode || "");
    if (key === shown) return;
    shown = key;
    actions.remove();
    el.classList.add("resolved");
    // Past tense once it is history: a card still reading "Claude wants to use"
    // above a verdict looks like a prompt that is somehow still waiting.
    head.replaceChildren("Claude wanted to use ", tool);
    if (decision === "allow") {
      status.className = "perm-status allow";
      status.textContent = mode
        ? "✓ Allowed — approvals set to “" + (PERMISSION_LABELS[mode] || mode) + "”"
        : scope === "session"
          ? "✓ Allowed — not asking again for " + label + " in this reply"
          : "✓ Allowed";
    } else if (decision === "expired") {
      status.className = "perm-status expired";
      status.textContent = "◦ Unanswered — the reply ended before you decided";
    } else {
      status.className = "perm-status deny";
      status.textContent = "✗ Denied";
    }
  }

  async function send(decision, scope, mode) {
    actions.querySelectorAll("button").forEach((b) => { b.disabled = true; });
    status.className = "perm-status";
    status.textContent = "sending…";
    try {
      const res = await fused.runPython(AGENT, {
        action: "decide", run_id, request_id: p.id, decision, scope,
        mode: mode || "",
      }, { key: null });
      if (res && res.error) throw new Error(res.error);
      // A mode switch outlives this run: carry it into the next spawn too.
      if (res && res.mode) { fused.params.set("permission", res.mode); syncSelects(); }
      // agent.py answers with what landed on disk (first writer wins).
      resolve((res && res.decision) || decision, (res && res.scope) || scope,
              (res && res.mode) || "");
    } catch (err) {
      // The subprocess is still blocked, so the buttons have to come back.
      actions.querySelectorAll("button").forEach((b) => { b.disabled = false; });
      status.className = "perm-status deny";
      status.textContent = "Could not send that: " + err.message;
    }
  }

  permChoices(p.tool, label, liveMode).forEach(([text, decision, scope, mode, cls]) => {
    const b = document.createElement("button");
    b.type = "button";
    if (cls) b.className = cls;
    b.textContent = text;
    if (mode) b.title = "Stops asking for what Claude judges safe; it still "
                      + "escalates anything it will not vouch for.";
    b.onclick = () => send(decision, scope, mode);
    actions.appendChild(b);
  });

  return { el, resolve };
}

// AskUserQuestion — the model asking the USER something, parked on the same
// bridge as an approval because the CLI routes it through the prompt tool (it is
// gated on `requiresUserInteraction`, so `auto` and `acceptEdits` do not
// auto-approve it either). What goes back is a CHOICE, not a verdict:
//
//   * every control here sends `decide` with `answers`, a record keyed by the
//     exact question text whose value is the chosen option's `label` (multiple
//     labels joined with ", "). That is the shape the CLI honours — measured;
//   * there is deliberately no plain Allow: an allow with no answers reaches the
//     model as "The user did not answer the questions", i.e. a card the user
//     answered and a model that learnt nothing. A deny carrying the text instead
//     arrives as `is_error`, so that is not the channel either;
//   * no "allow all in this reply" and no mode switch — a question is one
//     exchange, and answering it says nothing about how much to auto-approve.
//     agent.py enforces both by tool name rather than trusting this card.
//
// Every string on the card is model-authored (the question, the labels, the
// descriptions) and goes in through textContent, whole: the option labels are the
// only thing that can be sent, so an option the user cannot read properly is an
// answer they did not mean to give.
function buildQuestionCard(p, run_id) {
  const input = p.input && typeof p.input === "object" ? p.input : {};
  const raw = Array.isArray(input.questions) ? input.questions : [];
  const optionsOf = (q) => (Array.isArray(q.options) ? q.options : []).filter(
    (o) => o && typeof o === "object" && typeof o.label === "string" && o.label);
  const usable = (q) => q && typeof q === "object" && typeof q.question === "string"
                        && q.question && optionsOf(q).length > 0;
  // ALL of them, or none: the answer record is validated as a whole on the way
  // back, so one unreadable question means nothing can be sent — and a card that
  // renders the readable half only would hide that.
  const questions = raw.filter(usable);
  // Two questions with the SAME text is the third way a payload is unanswerable,
  // and the quietest: `answers` is keyed by question text, so fromEntries would
  // collapse the pair (last one wins), the validator rejects a duplicate key it
  // cannot attribute, and the request would latch a permanent deny — a card full
  // of live controls that could only ever say no.
  const answerable = questions.length > 0 && questions.length === raw.length
    && new Set(questions.map((q) => q.question)).size === questions.length;
  // One question, one choice → each option IS the button and a click answers it.
  // Otherwise an answer is only complete once every question has one, so the
  // options become tickable rows with a submit.
  const oneShot = answerable && questions.length === 1 && !questions[0].multiSelect;

  const el = document.createElement("div");
  el.className = "turn perm ask";
  const head = document.createElement("div");
  head.className = "perm-head";
  head.textContent = "Claude is asking you";
  el.appendChild(head);

  const status = document.createElement("div");
  status.className = "perm-status";
  const controls = [];   // removed once the card resolves
  const widgets = [];    // disabled while an answer is in flight
  const blocks = [];     // { question, picked() }

  async function post(fields, optimistic) {
    widgets.forEach((w) => { w.disabled = true; });
    status.className = "perm-status";
    status.textContent = "sending…";
    try {
      const res = await fused.runPython(AGENT, Object.assign({
        action: "decide", run_id, request_id: p.id, scope: "once",
      }, fields), { key: null });
      if (res && res.error) throw new Error(res.error);
      // agent.py answers with what landed on disk (first writer wins), so the
      // losing half of a double-click shows the answer the tool actually got.
      resolve((res && res.decision) || fields.decision, "", "",
              (res && res.answers) || optimistic);
    } catch (err) {
      // The subprocess is still blocked, so the controls have to come back.
      widgets.forEach((w) => { w.disabled = false; });
      status.className = "perm-status deny";
      status.textContent = "Could not send that: " + err.message;
    }
  }

  // A JSON string, not a nested object: params cross into python string-shaped,
  // the same way app_state sends its snapshot.
  const send = (answers) => post(
    { decision: "allow", answers: JSON.stringify(answers) }, answers);
  const dismiss = () => post({ decision: "deny" }, null);

  let shown = "";
  function resolve(decision, scope, mode, answers) {
    const chosen = answers && typeof answers === "object"
      ? Object.keys(answers).map((k) => answers[k]).filter((v) => typeof v === "string")
      : [];
    const key = decision + "/" + chosen.join(" · ");
    if (key === shown) return;
    shown = key;
    controls.forEach((c) => c.remove());
    el.classList.add("resolved");
    head.textContent = "Claude asked you";   // past tense: this one is history
    if (decision === "allow") {
      // NOT the allow green: an answer is not an approval (see .perm-status
      // .chose). The label recedes and the choice carries the contrast — two
      // nodes, so the colours are CSS and the text is still one string.
      status.className = "perm-status chose";
      if (chosen.length) {
        const val = document.createElement("span");
        val.className = "val";
        val.textContent = chosen.join(" · ");
        status.replaceChildren("✓ You chose: ", val);
      } else {
        status.className = "perm-status allow";
        status.textContent = "✓ Answered";
      }
    } else if (decision === "expired") {
      status.className = "perm-status expired";
      status.textContent = "◦ Unanswered — the reply ended before you answered";
    } else {
      status.className = "perm-status deny";
      status.textContent = "✗ Not answered";
    }
  }

  // label (bold) over description (small), the body of every option either way.
  function optionText(option) {
    const wrap = document.createElement("span");
    const lbl = document.createElement("span");
    lbl.className = "lbl";
    lbl.textContent = option.label;
    wrap.appendChild(lbl);
    if (typeof option.description === "string" && option.description) {
      const desc = document.createElement("span");
      desc.className = "desc";
      desc.textContent = option.description;
      wrap.appendChild(desc);
    }
    return wrap;
  }

  function submit() {
    const pairs = [];
    for (const block of blocks) {
      const labels = block.picked();
      if (!labels.length) {
        status.className = "perm-status deny";
        status.textContent = "Pick an answer for every question.";
        return;
      }
      // One string per question — the chosen labels joined with ", ", which is
      // what the CLI validates against the option list it sent.
      pairs.push([block.question, labels.join(", ")]);
    }
    // fromEntries, not assignment: a question whose text is "__proto__" would
    // vanish into the prototype setter, exactly as in leftoverInput (D161).
    send(Object.fromEntries(pairs));
  }

  if (answerable) {
    // The questions go in a scroller, and the send button stays outside it. A
    // four-question card with four options each is ~40 rows tall; unbounded, it
    // pushed its own "Send answer" off the bottom of the pane — the one control
    // that finishes the card was the one thing the user could not reach.
    const scroll = document.createElement("div");
    scroll.className = "qscroll";
    el.appendChild(scroll);
    questions.forEach((q, i) => {
      const block = document.createElement("div");
      block.className = "qblock";
      if (typeof q.header === "string" && q.header) {
        const chip = document.createElement("div");
        chip.className = "qhead";
        chip.textContent = q.header;
        block.appendChild(chip);
      }
      const text = document.createElement("div");
      text.className = "qtext";
      text.textContent = q.question;
      block.appendChild(text);

      const list = document.createElement("div");
      list.className = "qopts";
      const ticks = [];
      optionsOf(q).forEach((option) => {
        if (oneShot) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "qopt";
          b.appendChild(optionText(option));
          b.onclick = () => send(Object.fromEntries([[q.question, option.label]]));
          widgets.push(b);
          list.appendChild(b);
          return;
        }
        const row = document.createElement("label");
        row.className = "qopt";
        const box = document.createElement("input");
        box.type = q.multiSelect ? "checkbox" : "radio";
        box.name = "q-" + p.id + "-" + i;   // our own id, so it is a safe name
        row.append(box, optionText(option));
        widgets.push(box);
        ticks.push({ box, label: option.label });
        list.appendChild(row);
      });
      block.appendChild(list);
      scroll.appendChild(block);
      controls.push(list);
      blocks.push({
        question: q.question,
        picked: () => ticks.filter((t) => t.box.checked).map((t) => t.label),
      });
    });
    // Same rule as an approval card: no input key is invisible. `questions` is
    // rendered above; anything else the CLI sent (`metadata`, or a field a later
    // version adds) is printed verbatim rather than assumed unimportant — it
    // rides back out in updatedInput either way.
    const extra = leftoverInput(input, ["questions"]);
    if (extra) {
      const pre = document.createElement("pre");
      pre.textContent = JSON.stringify(extra, null, 2);
      el.appendChild(pre);
    }
  } else {
    // Nothing here can be answered, so say that and show what arrived verbatim
    // rather than offering controls that could only send an invalid answer.
    const note = document.createElement("div");
    note.className = "perm-sub";
    note.textContent = "This question did not arrive in a shape this window can "
                     + "answer — dismissing it lets the reply continue.";
    const pre = document.createElement("pre");
    pre.textContent = JSON.stringify(input, null, 2);
    el.append(note, pre);
  }

  if (!oneShot) {
    const bar = document.createElement("div");
    bar.className = "perm-actions qsend";
    const b = document.createElement("button");
    b.type = "button";
    b.className = answerable ? "primary" : "";
    b.textContent = answerable ? "Send answer" : "Dismiss";
    b.onclick = answerable ? submit : dismiss;
    widgets.push(b);
    bar.appendChild(b);
    el.appendChild(bar);
    controls.push(bar);
  }

  el.appendChild(status);
  return { el, resolve };
}

// ExitPlanMode — the model asking to stop planning and start doing the work. Not
// an ordinary approval either: what is parked is a PLAN, and the two answers are
// "go ahead" and "keep planning".
//
//   * Approve plan sends a plain `allow`. Nothing else is needed to get moving —
//     the CLI leaves plan mode itself when it sees one (spiked against 2.1.226:
//     it emits `system/status permissionMode:"default"` and the tool_result reads
//     "User has approved your plan…"). A `mode` rides along ONLY when the picker
//     already sits on a looser mode, which is then the mode the session should
//     land in; it goes through the same validated channel as the approval card's
//     escalation, so anything off SWITCHABLE_MODES (bypassPermissions included)
//     is dropped by agent.py rather than reaching the CLI;
//   * Keep planning sends a `deny` plus the optional note the user typed. The
//     SENTENCE the model reads is composed by agent.py — the note is the only
//     part this card contributes, it travels as a param, and it is never written
//     back into the page or into any tool input;
//   * there is no "allow all in this reply": there is one plan, and a session
//     grant would pre-approve the next one unseen (agent.py enforces it too —
//     ExitPlanMode is not in WHOLE_TOOL_GRANTABLE).
//
// The plan is the ONE payload on any card that is rendered as markdown, because
// it is the one that genuinely IS markdown — a tool input is bytes off a disk and
// goes in through textContent, whereas a plan is prose the model wrote for the
// user to read. It therefore goes through `renderMd` (marked + DOMPurify, the
// same funnel every reply uses) and nothing else on the card touches innerHTML.
function buildPlanCard(p, run_id) {
  const input = p.input && typeof p.input === "object" ? p.input : {};
  const plan = typeof input.plan === "string" && input.plan ? input.plan : "";

  const el = document.createElement("div");
  el.className = "turn perm plan";
  const head = document.createElement("div");
  head.className = "perm-head";
  head.textContent = "Claude has a plan";
  el.appendChild(head);

  if (plan) {
    const body = document.createElement("div");
    body.className = "plan-body";
    body.innerHTML = renderMd(plan);
    el.appendChild(body);
    attachCodeCopy(body);   // a plan quotes code; the copy buttons come with it
  }
  // The same disclosure rule as every other card: no input key is invisible.
  // `plan` is the body above when it is usable; when it is not, it falls into
  // this dump with everything else, so the card never implies a plan was read.
  const extra = leftoverInput(input, plan ? ["plan"] : []);
  if (extra) {
    const pre = document.createElement("pre");
    pre.textContent = JSON.stringify(extra, null, 2);
    el.appendChild(pre);
  }

  const note = document.createElement("textarea");
  note.className = "plan-note";
  note.rows = 2;
  // Bounded to what agent.py will actually keep (`NOTE_LIMIT`) — the server
  // still truncates and marks the cut if this is ever bypassed (pasted text
  // over the limit lands here truncated by the browser itself), but an honest
  // user typing past the limit should never be the one who finds out later.
  note.maxLength = PLAN_NOTE_LIMIT;
  note.setAttribute("aria-label", "Note for revising the plan");
  note.placeholder = "Optional: what to change (sent with “Keep planning”)";
  const actions = document.createElement("div");
  actions.className = "perm-actions";
  const status = document.createElement("div");
  status.className = "perm-status";
  const widgets = [note];

  let shown = "";
  function resolve(decision) {
    if (decision === shown) return;
    shown = decision;
    note.remove();
    actions.remove();
    el.classList.add("resolved");
    head.textContent = "Claude had a plan";   // past tense: this one is history
    if (decision === "allow") {
      status.className = "perm-status allow";
      status.textContent = "✓ Plan approved";
    } else if (decision === "expired") {
      status.className = "perm-status expired";
      status.textContent = "◦ Unanswered — the reply ended before you decided";
    } else {
      // Not a refusal — the other half of a conversation, so it does not read
      // in the deny red (see .perm.plan .perm-status.deny).
      status.className = "perm-status deny";
      status.textContent = "◦ Sent back for revision";
    }
  }

  async function send(decision, mode, text) {
    widgets.forEach((w) => { w.disabled = true; });
    status.className = "perm-status";
    status.textContent = "sending…";
    try {
      const res = await fused.runPython(AGENT, {
        action: "decide", run_id, request_id: p.id, decision, scope: "once",
        mode: mode || "", note: text || "",
      }, { key: null });
      if (res && res.error) throw new Error(res.error);
      // An approval always resolves the picker forward — never only when a
      // `setMode` rode along. The CLI leaves plan mode the instant it sees the
      // plain allow (the whole point of the spike), so if the param were left
      // on "plan" the very next per-turn spawn would silently re-enter it and
      // plan again, forever, with no card ever explaining why. Land on the
      // looser mode when the picker actually granted one (`res.mode`, gated on
      // SWITCHABLE_MODES same as always), "prompt" — the CLI default — when it
      // did not. "Keep planning" changes nothing here: the session is still
      // planning, so the picker is left exactly where the user put it, and the
      // authoritative READ of what landed (`res.decision`), not the click,
      // decides whether this ran — the losing half of a double-click must not
      // reset the picker for an approval that never actually took.
      //
      // The write is skipped when the URL ALREADY MEANS the landing mode, which
      // for the CLI default means ABSENT as well as the literal "prompt": the
      // only reader of this param is `permission_mode: get("permission") ||
      // DEFAULT_PERMISSION` on the next spawn, and syncSelects paints the same
      // default into the picker either way — but `permission` is a TRUE DEFAULT,
      // a mode the user could have picked and of which the URL is the record, so
      // the landing mode is written even when it is "prompt": the URL then says
      // which mode the next turn will spawn in, and a copied link carries it.
      //
      // `{history:"replace"}` is what makes that free. The write is a
      // CONSEQUENCE of approving a plan, not a place anyone navigated to, and it
      // lands behind `await runPython` — so the first-change-push rule (D8/PR-3)
      // would otherwise mint a history entry whose whole content is the mode the
      // session already switched into, and the Back that undid it would do
      // nothing visible. The picker's own dropdown still pushes: choosing a mode
      // by hand IS a step. (A landing mode equal to what the URL literally says
      // needs no guard — runtime.js drops byte-identical writes.)
      if ((res && res.decision) === "allow") {
        fused.params.set("permission", res.mode || "prompt", { history: "replace" });
        syncSelects();
      }
      // agent.py answers with what landed on disk (first writer wins), so a
      // double-click renders the verdict the tool actually got.
      resolve((res && res.decision) || decision);
    } catch (err) {
      // The subprocess is still blocked, so the buttons have to come back.
      widgets.forEach((w) => { w.disabled = false; });
      status.className = "perm-status deny";
      status.textContent = "Could not send that: " + err.message;
    }
  }

  // Where the session should land once planning is over: the picker's CURRENT
  // choice, and only when the bridge will honour it. Sitting on "plan first" or
  // "ask every time" sends no `setMode` at all — the plain allow already leaves
  // plan mode on its own, and tightening mid-turn is the picker's job, not a
  // card's — but the picker itself still gets moved off "plan" above, to
  // "prompt", once the approval lands.
  const landing = () => {
    const picked = fused.params.get("permission") || "";
    return SWITCHABLE_MODES.has(picked) ? picked : "";
  };

  [["Approve plan", "primary", () => send("allow", landing(), "")],
   ["Keep planning", "", () => send("deny", "", note.value)],
  ].forEach(([text, cls, onclick]) => {
    const b = document.createElement("button");
    b.type = "button";
    if (cls) b.className = cls;
    b.textContent = text;
    b.onclick = onclick;
    widgets.push(b);
    actions.appendChild(b);
  });

  el.append(note, actions, status);
  return { el, resolve };
}

// Put a permission card into the transcript AND make sure the transcript is what
// the user is looking at.
//
// A card is not progress output: it IS the prompt, and the subprocess stays
// blocked until it is answered. In the narrow layout's Preview view the whole
// chat column collapses to its #anntools strip, #log included — so a card
// appended there is a turn stalled forever behind an element nobody can see or
// click, with the strip saying nothing about a decision waiting. And Preview view
// is exactly where this happens: `annAutoSubmit` sends a real turn the moment a
// note is saved, which is the ONE way a run starts while the transcript is
// hidden.
//
// Of the three candidate fixes this is the one that keeps every promise:
//   * "don't auto-submit from Preview view" removes the feature — a saved note
//     going to Claude immediately is the point of annotating, and the user is in
//     Preview precisely because that is where notes are made;
//   * "surface it in the #anntools strip" means a second, smaller renderer for
//     the permission UI (tool name, arguments, four scope choices, the deny
//     path), i.e. a fork of the thing whose whole job is to be read carefully
//     before it is answered;
//   * leaving Preview is honest and reversible: the run cannot continue without
//     the user's attention, "Back to chat"/"Comment on preview" is one click either
//     way, and the notes and pins survive the trip (applyNarrowView re-measures
//     them). We only take the screen for a HARD BLOCK, never for ordinary
//     progress — the working line and errors still go to the hidden #log, and
//     that is correct: they are things to read afterwards, not things to answer.
//
// Writes the param rather than calling applyNarrowView, the same one-way flow
// #viewbtn uses. No-op in the wide layout (nothing is hidden) and for the no-pane
// target (`paneview` describes a collapse it never does). The Preview test is
// `narrowShown` — the view ON SCREEN — not the raw param: after a breakpoint
// crossing the preview shows on `narrowCrossView` with the param still absent,
// and the raw read left the card in the collapsed #log, a hard block with no
// visible way to answer it (Bugbot, PR #447). Same reason #viewbtn toggles off
// narrowShown.
function showPermissionCard(card, working) {
  if (working && working.el && working.el.isConnected) log.insertBefore(card.el, working.el);
  else log.appendChild(card.el);
  if (!noPane && NARROW_MQ.matches && narrowShown) {
    fused.params.set("paneview", "chat");
  }
  // One of the few places that still scrolls UNCONDITIONALLY, follow flag or
  // not: the run is blocked on this card, so a reader who has scrolled away is
  // waiting on something they cannot see. Every other mid-run write respects
  // where they left the scrollport.
  scrollBottom();
}

// An ANSWERED card belongs where it was answered. While a card is open it lives
// at the bottom of the log, right above the working line, because that is where
// a control the run is blocked on has to be — but the turn's prose and tool
// chips all render INSIDE the one streaming `reply` bubble, which sits above it.
// So every segment produced after the click appended above the card, and a
// decision the user made in the middle of a turn slid down the page and stuck to
// the bottom of the log for the rest of it: a receipt filed after everything it
// came before. (See `.perm.resolved` — the card was always meant to "keep its
// place in the transcript"; the pinning was an artifact of where it was mounted,
// not a decision.)
//
// So on resolve the card moves once, into the live turn's segment container at
// its current tail. renderSegments only ever appends its own views and removes
// its own views (tracked by index in segStates), so a foreign child at the tail
// keeps its spot and everything rendered afterwards lands below it — which is
// exactly chronological order. The container is published by pollLoop only AFTER
// the one `segBody.replaceChildren()` of the legacy→segment flip, so that sweep
// can never take a parked card with it.
//
// Two things are deliberately left alone:
//   * no live turn (a decision that landed after the run ended, or a card
//     re-attached with its verdict already on disk) leaves the card where it is,
//     i.e. today's behaviour;
//   * an errored run drops its whole bubble (keepText false) and a parked card
//     goes with it. The chip-ask tool chip is the durable record of the exchange
//     and is already in the transcript, so nothing is lost that a reload would
//     have kept.
function parkResolvedCard(card) {
  const seg = activeSegBody;
  const el = card && card.el;
  if (!seg || !seg.isConnected || !el || !el.isConnected) return;
  if (el.parentNode === seg) return;   // already filed; do not drag it to the tail again
  // The move reflows everything between the card's old and new home, so read the
  // viewport first. Following the tail is the log's own rule while a run streams
  // (see followTail); otherwise the most this may do is keep the card the user
  // was just looking at on screen — scrolling a reader who is somewhere else
  // entirely would be the move yanking the page.
  const box = el.getBoundingClientRect();
  const port = logwrap.getBoundingClientRect();
  const wasVisible = box.bottom > port.top && box.top < port.bottom;
  seg.appendChild(el);
  if (followTail) scrollBottom();
  else if (wasVisible) el.scrollIntoView({ block: "nearest" });
}

// Reconcile the poll's request list with what is on screen. Idempotent — poll
// replays the whole list every 400 ms.
function syncPermissions(list, run_id, working, liveMode) {
  for (const p of list || []) {
    if (!p || !p.id) continue;
    let card = permCards.get(p.id);
    if (!card) {
      card = buildPermCard(p, run_id, liveMode);
      permCards.set(p.id, card);
    }
    if (!card.el.isConnected) {
      showPermissionCard(card, working);
    }
    // `answers` is only ever set on a question card, and it is why poll carries
    // it: a frame that re-attaches after the click has to be able to show what
    // was chosen, not just that something was.
    if (p.decision) {
      card.resolve(p.decision, p.scope, p.mode, p.answers);
      // Filed here rather than inside the card's own click handler: `decision` on
      // the poll is the verdict that LANDED on disk, and the poll is also the only
      // thing that reports a card the run expired or a decision this frame did not
      // make. One move, from whichever of those settles the card first.
      parkResolvedCard(card);
    }
  }
}

// What a LIVE api_retry says on the status line. The status code picks the
// words, because 529 and 429 send the user looking in different places: the API
// is swamped and waiting helps, versus we are being throttled. `max_retries` is
// the CLI's budget and is only shown when it told us one.
function retryVerb(retry) {
  const what = retry.status === 429 ? "Rate limited"
             : retry.status === 529 ? "Overloaded"
             : "API error";
  const budget = retry.max_retries ? "/" + retry.max_retries : "";
  return what + " — retrying (" + retry.attempt + budget + ")";
}

function addWorking() {
  const d = document.createElement("div");
  d.className = "turn working";
  const thinkVerb = VERBS[Math.floor(Math.random() * VERBS.length)];
  const start = Date.now();
  let stats = { tokens: 0, phase: "thinking", retry: null };
  let stopping = false;
  d.innerHTML = '<span class="star">✻</span> <span class="verb"></span><span class="meta"></span>'
    // The key rides on the label, not in a hint row: same reasoning as the
    // claude template — a separate hint line grows and shrinks the chrome every
    // time a turn starts and ends, and the pane here is narrower still.
    + '<button id="stopbtn" class="stop" type="button" title="Stop this turn">stop · esc</button>';
  const verbEl = d.querySelector(".verb");
  const meta = d.querySelector(".meta");
  const stopBtn = d.querySelector(".stop");
  stopBtn.addEventListener("click", () => stopRun());
  const draw = () => {
    const secs = Math.round((Date.now() - start) / 1000);
    // A live retry outranks every phase but the user's own stop: it is the only
    // one of these that explains why nothing is happening.
    verbEl.textContent = (stopping ? "Stopping" :
                          stats.retry ? retryVerb(stats.retry) :
                          stats.phase === "awaiting" ? "Waiting for your approval" :
                          stats.phase === "composing" ? "Composing" :
                          stats.phase === "tooling" ? "Working" : thinkVerb) + "…";
    // The shimmer is the liveness signal (see .working .verb), so the one phase
    // that is NOT progress has to say so: awaiting approval is blocked on the
    // user, not on the model.
    d.classList.toggle("awaiting", !stopping && stats.phase === "awaiting");
    const effort = curEffort();
    const parts = [secs + "s"];
    if (stats.tokens) parts.push("↓ " + stats.tokens + " tokens");
    if (stats.phase === "thinking" && effort) parts.push(effort + " effort");
    meta.textContent = " (" + parts.join(" · ") + ")";
  };
  const timer = setInterval(draw, 1000);
  // BOTH writers of this line are timers — this interval and the 400ms poll
  // that calls setStats — and a browser clamps timers hard in a window that is
  // hidden, minimised or fully occluded (Chromium down to about one wake a
  // minute after a few minutes; WebKit App-Naps the whole page). So they stall
  // together and the line keeps whatever second it last drew, which is exactly
  // the "the clock stopped but the run didn't" report. One draw on the way back
  // is the whole repair: `secs` is recomputed from `start` on every draw, never
  // incremented, so it snaps to the truth instead of resuming from stale.
  const onVis = () => { if (!document.hidden) draw(); };
  document.addEventListener("visibilitychange", onVis);
  draw();
  log.appendChild(d);
  followBottom();
  return {
    el: d,
    setStats(tokens, phase, retry) { stats = { tokens, phase, retry: retry || null }; draw(); },
    // Reversible: the kill can fail, and a run that is still streaming must not
    // be left wearing a "Stopping…" line it will never honour.
    setStopping(on) { stopping = on; stopBtn.disabled = on; draw(); },
    stop: () => { clearInterval(timer); document.removeEventListener("visibilitychange", onVis); },
  };
}

// ── real markdown: vendored marked + DOMPurify (vendor/, loaded at boot —
// see loadScript below), tolerant of an unclosed fence mid-stream (the typer
// calls this on partial text every animation frame). marked never touches
// model-authored raw HTML on its own — an `<img onerror=…>` in the model's
// own reply sails through marked's parser unchanged — so DOMPurify is the
// only thing standing between marked's output and bodyEl.innerHTML, and
// every render (partial or final) goes through both, never marked alone. ──
let _md;  // configured once, lazily — marked.use() mutates shared state
function _mdSetup() {
  if (_md) return _md;
  marked.use({
    gfm: true, breaks: true,
    renderer: {
      // Positional (href, title, text) — the vendored marked@12's actual
      // renderer-override signature (checked by hand against
      // vendor/marked.min.js; some marked docs show a token-object shape
      // that belongs to a later major version and silently no-ops here).
      link(href, title, text) {
        // DOMPurify.sanitize() sanitizes HTML fragments, not URLs: fed a
        // bare string like this href, it just re-serializes it (entity-
        // encoding any `&` — double-encoding on top of the escape below)
        // and does nothing to stop a `javascript:` scheme, which comes out
        // the other side looking like ordinary, harmless text. The href's
        // real security check is the document-level DOMPurify.sanitize()
        // in _md below, which does enforce an allowed-URI check on href
        // attributes. All that's needed here is keeping the raw href from
        // breaking out of the `"..."` attribute it's interpolated into.
        const h = (href || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;");
        return `<a href="${h}" target="_blank" rel="noopener noreferrer">${text}</a>`;
      },
    },
  });
  _md = (t) => DOMPurify.sanitize(marked.parse(t), {
    FORBID_TAGS: ["style", "form", "input", "iframe"],
    ADD_ATTR: ["target", "rel"],
  });
  return _md;
}
function renderMd(text) {
  // Vendor libs failed to load (see the loader's .catch below) or haven't
  // resolved yet: a ReferenceError here would kill the typer's rAF drain
  // mid-stream with `raf` already nulled out, so it never resumes and the
  // reply is left permanently blank with nothing in the DOM to explain why.
  // `typeof x === "undefined"` never throws even for an undeclared global —
  // touching the bare identifier `marked`/`DOMPurify` directly would.
  if (typeof marked === "undefined" || typeof DOMPurify === "undefined"
      || typeof DOMPurify.sanitize !== "function") {
    return "<pre>" + text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") + "</pre>";
  }
  // Mid-stream tolerance: an odd number of ``` means a fence is still open —
  // close it so marked doesn't swallow the tail as one giant unterminated
  // code block while the reply is still arriving.
  const fences = (text.match(/```/g) || []).length;
  if (fences % 2 === 1) text += "\n```";
  return _mdSetup()(text);
}
// Copy-to-clipboard + syntax highlighting on every rendered <pre> — wired
// into the typer's finish() and every static (non-typed) render, NEVER the
// per-frame streaming path in makeTyper's tick(): hljs.highlightElement is
// real DOM work repeated ~36 times per reply, and re-guessing a partial
// fence's language on every frame flickers colors as more text arrives, so
// it only runs once a reply's text is final.
function attachCodeCopy(rootEl) {
  rootEl.querySelectorAll("pre code").forEach((el) => {
    if (!window.hljs || el.classList.contains("hljs")) return;  // idempotent
    // Only registered languages: the hljs "common" bundle is missing
    // plenty marked's `language-xxx` class routinely names (dockerfile,
    // mermaid, hcl/terraform, powershell, elixir, scala, latex, …), and
    // highlightElement console.warns once per call for anything it can't
    // find — getLanguage is the documented way to check first.
    const lang = (el.className.match(/language-(\S+)/) || [])[1];
    if (lang && hljs.getLanguage(lang)) { try { hljs.highlightElement(el); } catch {} }
  });
  // What a <pre> puts on the clipboard. Three shapes reach this and only the
  // first is a plain text node: a markdown code block (`<pre><code>`),
  // renderMd's vendor-less fallback (`<pre>` + text), and an Edit chip's diff —
  // which is one <span> PER LINE and carries no newline characters at all,
  // because the spans are `display: block` and a "\n" text node between them
  // would render as a second, empty line inside every band. Joining them back
  // here is what keeps a copied diff a diff instead of one run-together line.
  const copyText = (pre) => {
    const code = pre.querySelector("code");
    if (code) return code.textContent;
    const lines = pre.querySelectorAll(":scope > span");
    if (lines && lines.length) {
      return Array.prototype.map.call(lines, (s) => s.textContent).join("\n");
    }
    return pre.textContent;
  };
  rootEl.querySelectorAll("pre").forEach((pre) => {
    if (pre.querySelector(".copybtn")) return;
    // Read the text BEFORE the button joins the tree. `pre.textContent` with the
    // button already inside it copies the button's own label — every code block
    // with no <code> child (renderMd's vendor-less fallback, and every tool
    // chip's payload) copied its contents with a "copy" glued to the end.
    const text = copyText(pre);
    const b = document.createElement("button");
    b.className = "copybtn"; b.textContent = "copy"; b.type = "button";
    b.onclick = () => { navigator.clipboard.writeText(text); b.textContent = "copied"; setTimeout(() => (b.textContent = "copy"), 1200); };
    // The button goes in a ZERO-FOOTPRINT WRAPPER, first in flow, and never
    // straight into the pre. Two requirements meet here: inside a scrolling chip
    // pre the control has to stay in frame while the payload scrolls (so
    // something must be `position: sticky`, and a sticky box can only be held at
    // the top of a scrollport from a flow position at the top of the box), and it
    // must reserve NO space while it is invisible. The button used to satisfy the
    // first by being a sticky `float: right` — and a float shortens the first line
    // box whether or not the float is painted, so every chip's first payload line
    // was a button's width narrower than the lines under it, permanently, for a
    // control at `opacity: 0`. The wrapper is `height: 0` (no line box, no float
    // intrusion), takes the stickiness, and — being positioned — is the
    // containing block the absolutely positioned button resolves against. See
    // the .copywrap rules for why the button is not the sticky box itself.
    const wrap = document.createElement("span");
    wrap.className = "copywrap";
    wrap.appendChild(b);
    if (pre.firstChild) pre.insertBefore(wrap, pre.firstChild);
    else pre.appendChild(wrap);
  });
}

// ── typewriter: polls fill `target`; a rAF loop drains it smoothly ──
// `bodyEl` may be null — a typer built PARKED, with nothing to stream into
// yet. That is what a segment transcript needs: the reply's element exists
// before its first text segment does (the turn may open with a tool call), and
// which element the prose lands in changes DURING the turn, as new segments
// push the streaming tail along. See retarget() below; a parked typer draws
// nothing, not even its cursor.
function makeTyper(bodyEl) {
  let target = "";
  let shown = 0;
  let finished = false;
  let raf = null;
  let painted = 0;   // last paint, ms — see the throttle in tick()
  const cur = document.createElement("span");
  cur.className = "cursor";
  cur.textContent = "▋";
  if (bodyEl) bodyEl.after(cur);

  function tick() {
    raf = null;
    if (!bodyEl) return;  // parked mid-frame (retarget); nothing to draw into
    if (shown > target.length) {
      // Target got rewritten shorter (authoritative final text): without this
      // clamp nothing ever redraws and the frozen frame keeps stale text.
      shown = target.length;
      bodyEl.innerHTML = renderMd(target);
    }
    const remaining = target.length - shown;
    if (remaining > 0) {
      const step = Math.max(1, Math.ceil(remaining / 36));  // drain in ~36 frames
      shown = Math.min(target.length, shown + step);
      // renderMd re-parses the WHOLE reply so far — marked, then DOMPurify over
      // the result — so painting every frame is O(n) per frame and O(n²) across
      // a long reply. What starves is the main thread, and what shares it is
      // everything else the reader can see: the 1s elapsed counter (which drops
      // ticks rather than queueing them, so it visibly stalls and then jumps),
      // and their own scrolling. Capping the paint at ~25fps is not perceptible
      // for text arriving this way, and the frame that completes the drain
      // always paints, so the settled reply is never a frame behind.
      const now = Date.now();
      if (now - painted >= 40 || shown === target.length) {
        painted = now;
        bodyEl.innerHTML = renderMd(target.slice(0, shown));
        // followTail, not a geometry read: this runs every frame, and a
        // threshold evaluated here is what used to cancel the reader's scroll.
        followBottom();
      }
    }
    if (shown < target.length) raf = requestAnimationFrame(tick);
    else if (finished) cur.remove();
  }

  return {
    update(text) {
      if (!bodyEl) return;  // parked: the tail of this reply is not prose
      target = text;
      if (!raf) raf = requestAnimationFrame(tick);
    },
    finish(text) {
      finished = true;
      if (!bodyEl) { cur.remove(); return Promise.resolve(); }
      target = text;
      if (!raf) raf = requestAnimationFrame(tick);
      return new Promise((resolve) => {
        (function wait() {
          if (raf) { requestAnimationFrame(wait); return; }
          attachCodeCopy(bodyEl.parentElement);
          resolve();
        })();
      });
    },
    // Point the typer at a DIFFERENT element, or at nothing (`null`). Callers
    // own the old element from here: whatever fraction of its text had been
    // drawn stays drawn, so the caller must render it whole first (see
    // renderSegments, which does exactly that before every retarget). The
    // counters reset because they measure progress through the NEW element's
    // text, and the pending frame is cancelled because it would otherwise draw
    // the old text into the new element.
    retarget(el) {
      if (el === bodyEl) return;
      if (raf) { cancelAnimationFrame(raf); raf = null; }
      bodyEl = el;
      target = "";
      shown = 0;
      if (el) el.after(cur); else cur.remove();
    },
    abort() { if (raf) cancelAnimationFrame(raf); cur.remove(); },
  };
}

// ── the tool timeline: one reply's ordered transcript ─────────
// agent.py's `_segments_from_rows` returns the turn as an ordered list of
// text / thinking / tool segments (its docstring is the contract; read it
// before changing anything here). This is the renderer for that list, and the
// ONE rule that outranks every layout choice below: a tool's input and output
// are raw bytes — a file's contents, a command's stdout, an MCP server's
// answer — so they go in through textContent and nothing else, ever. Only
// `text` and `thinking` segments are prose, and only they see renderMd.
// Only the two states worth MARKING. `ok` is empty on purpose: success is what
// almost every row in a transcript is, and a column of fifteen green ticks is a
// column of decoration the eye has to filter to find the one row that failed.
// `running` is empty too — the CSS draws that one as a real spinning ring
// (.chip-status.is-running), because a rotated glyph orbits its line box's
// centre instead of its own.
const TOOL_STATUS_GLYPH = { running: "", ok: "", error: "✗" };

// ── which disclosures are open: the ones the reader opened, and no others ──
// Every collapsible card in the transcript — a tool chip, a thinking block —
// ships COLLAPSED, and that now includes the newest card and the one still
// streaming. A single turn can make twenty tool calls, and a transcript that
// opens bodies on its own is a transcript that MOVES under the reader while the
// run is live: each arriving card pushes everything above it up the screen, and
// the next arrival a second later folds it again. Closed by default makes the
// log scannable — one summary line per step, so the shape of the turn is
// readable at a glance and the reply stays where the eye left it.
//
// The user's click is therefore the ONLY thing that opens a card, and it
// STICKS: nothing auto-folds a card they opened, and nothing auto-opens one
// they closed. The override is recorded from the SUMMARY's click rather than
// the `toggle` event, because `toggle` fires asynchronously and fires for
// programmatic opens too, so it cannot tell a user's fold from a repaint's.
//
// Overrides are keyed rather than held on the element: the re-attach repair
// branches and loadHistory rebuild the <details> nodes from the payload, and an
// override living on a discarded node is one the user has to re-apply. A tool
// call's key is its `tool_use` id — stable across every re-render of that call.
// A thinking segment has no id, so it is keyed by position (its index inside a
// numbered segment container), which survives the 400 ms poll but not a rebuild
// of its turn.
const cardOverrides = new Map();  // card key -> the open state the user chose
let cardSeq = 0;                  // numbers segment containers, for position keys

// A fresh transcript is a fresh policy: a restored session must open with every
// card folded, so an override from the conversation that was on screen before
// cannot leak a card open in one the user has never touched.
function resetCardPolicy() {
  cardOverrides.clear();
}

// A card's identity for `cardOverrides` (see above for why tools and thinking
// are keyed differently).
function cardKey(st, seg, i) {
  return seg && seg.kind === "tool" && seg.id ? "tool:" + seg.id
                                             : st.seq + ":" + i;
}

// Wire one <details> to the override map and apply the standing policy: folded,
// unless this is a card the user opened. Nothing here looks at the card's
// position, so a re-render — the 400 ms poll, a repair branch, history replay —
// puts every card back exactly where the reader left it.
function registerCard(el, head, key) {
  head.addEventListener("click", () => {
    // Runs BEFORE the disclosure's own default action, so `el.open` is still
    // the state being left behind — the user is asking for its opposite.
    cardOverrides.set(key, !el.open);
  });
  el.open = cardOverrides.has(key) ? cardOverrides.get(key) : false;
}

// How many lines of a diff a chip shows before it scrolls. Held together with
// the `max-height` on `.toolchip pre.diff` (14 * 1.55em, the line height there):
// this side decides whether the block gets the bottom fade that says "there is
// more below", so the two numbers being the same is what makes the cue honest.
const CHIP_DIFF_CLIP_LINES = 14;

// Lines in a string, counting "" as zero (not one): an Edit that only adds
// text has no removed lines, and "-1" would be a lie about the change.
function segLineCount(v) {
  return typeof v === "string" && v !== "" ? v.split("\n").length : 0;
}

// The one-liner beside the tool name in the chip's summary row, in TWO halves:
// `lead`, what the call did, and `path`, the file it did it to. Split rather
// than one string because the row is one clipped line and the halves do not
// clip the same way — a command or a pattern reads left-to-right and may lose
// its tail, whereas a path's tail is its FILENAME, and a path clipped from the
// right ("/Users/…/fused-render-worktrees/claude-template…") names no file at
// all. The renderer gives `path` its own left-clipping box (.chip-path); the
// string form below is what everything else reads.
//
// Per-tool, because "what did this call DO" is a different question for every
// tool and a generic answer (the first key of the input, say) is noise for all
// of them. Always ONE line — this is the <summary> of a <details>, and a newline
// in it breaks the row — and never the whole input: the chip's BODY is what
// shows everything, and unlike an approval card (which must show every byte it
// is asking permission for) this describes a call that already happened.
function toolChipSummaryParts(seg) {
  const inp = seg && seg.input && typeof seg.input === "object" ? seg.input : {};
  const str = (v) => (typeof v === "string" ? v : v === undefined || v === null ? "" : JSON.stringify(v));
  // First line only, with an ellipsis when there was more — the clip has to be
  // visible, or a heredoc reads as a one-line command.
  const line1 = (v) => {
    const s = str(v).split("\n");
    return s[0] + (s.length > 1 ? " …" : "");
  };
  const pick = (...keys) => {
    for (const k of keys) if (inp[k]) return line1(inp[k]);
    return "";
  };
  const where = (v) => (str(v) ? "  in " + line1(v) : "");
  // A summary with no path half. The default: only the file tools have a tail
  // worth protecting, and a pattern or a URL in a left-clipping box would read
  // backwards (its own head is the part that identifies it).
  const lead = (text) => ({ lead: text, path: "" });

  switch (seg && seg.name) {
    case "Bash":
      return lead("$ " + line1(inp.command));
    case "Read":
    case "NotebookEdit":
      return { lead: "", path: pick("file_path", "path", "notebook_path") };
    case "Glob":
    case "Grep":
      return lead(line1(inp.pattern) + where(inp.path || inp.glob));
    case "Edit": {
      // +added -removed, so the SIZE of the change is legible unopened — and
      // FIRST, because a path is long enough to be clipped by the summary's
      // ellipsis and a count that only shows on short paths is a count you
      // cannot rely on. Fixed-width and always in the same place, so a run of
      // Edit rows can be scanned as a column of magnitudes.
      const counts = "+" + segLineCount(inp.new_string)
                     + " -" + segLineCount(inp.old_string);
      return { lead: counts, path: pick("file_path") };
    }
    case "Write":
      return { lead: "+" + segLineCount(inp.content), path: pick("file_path") };
    case "Task":
      return lead(pick("description", "subagent_type"));
    case "TodoWrite": {
      const todos = Array.isArray(inp.todos) ? inp.todos : [];
      const done = todos.filter((t) => t && t.status === "completed").length;
      return lead(done + "/" + todos.length + " done");
    }
    case "WebFetch":
    case "WebSearch":
      return lead(pick("url", "query"));
    case PLAN_TOOL:
      // Not the plan's first line: a plan opens with a heading or a preamble
      // ("Here is what I will do"), which describes nothing. What the row has to
      // say is that a plan HAPPENED — the body carries the plan itself.
      return lead("proposed a plan");
    case ANSWERABLE_TOOL: {
      // The first question, verbatim. It is the thing the user was asked, and
      // for the single-question case (much the commonest) it is the whole call.
      const asked = (Array.isArray(inp.questions) ? inp.questions : []).find(
        (q) => q && typeof q === "object" && typeof q.question === "string"
               && q.question);
      return lead(asked ? line1(asked.question) : "");
    }
  }
  // Unknown tool — every MCP tool, and whatever the CLI grows next. The name
  // is already in the summary row beside this, so there is nothing honest to
  // add: the body shows the whole input instead.
  return lead("");
}

// The same summary as one string: the row's `title` (so a path clipped at both
// ends is still readable on hover) and whatever else wants the whole line.
// Double-space separated, and NOT with a trailing separator when the path half
// is missing — an Edit with no file_path is a real, if odd, input, and "+0 -0  "
// reads as a truncation.
function toolChipSummary(seg) {
  const parts = toolChipSummaryParts(seg);
  if (!parts.path) return parts.lead;
  return parts.lead ? parts.lead + "  " + parts.path : parts.path;
}

// The chip's expanded body, rebuilt from the segment (never patched): a
// segment's input never changes once it is on the wire, and its output arrives
// once, so a full rebuild is both cheap and the only version that cannot go
// out of sync with the segment.
function fillToolChipBody(body, seg) {
  const inp = seg.input && typeof seg.input === "object" ? seg.input : {};
  const pre = (text, cls) => {
    const p = document.createElement("pre");
    if (cls) p.className = cls;
    p.textContent = text;   // raw tool text: textContent, never innerHTML
    body.appendChild(p);
    return p;
  };
  const label = (text, cls) => {
    const d = document.createElement("div");
    d.className = cls ? "chip-label " + cls : "chip-label";
    d.textContent = text;
    body.appendChild(d);
  };
  // The target path, WHOLE and wrapped. The summary row above carries a path too
  // and clips it — from the left, so the filename survives (see .chip-path) — but
  // a 120-character path still loses its middle there, and the middle is which
  // repo, which worktree, which package. An open chip is where the complete path
  // has to be recoverable, so this is the one repetition worth its 20 pixels.
  const pathLabel = (v) => {
    const s = typeof v === "string" ? v
              : v === undefined || v === null ? "" : JSON.stringify(v);
    if (s) label(s, "chip-label-path");
  };
  // A flag that changes what the call DID, as its own badge. Not appended to the
  // path: glued on as "(every occurrence)" it read as part of the filename, and
  // it was sitting on a second copy of a path the summary row already shows.
  const flag = (text) => {
    const d = document.createElement("div");
    d.className = "chip-flag";
    d.textContent = text;
    body.appendChild(d);
  };
  const used = [];

  switch (seg.name) {
    case "Edit": {
      used.push("file_path", "old_string", "new_string", "replace_all");
      pathLabel(inp.file_path);
      if (inp.replace_all) flag("every occurrence");
      // One span per LINE, and no "\n" text nodes between them: the spans are
      // `display: block` (that is what makes the +/- colour a full-width band),
      // so a newline character between two blocks renders as an extra empty
      // line inside every band — the diff came out double-spaced. The line
      // breaks a copy needs are put back by attachCodeCopy's copyText().
      const p = document.createElement("pre");
      const lines = formatEditDiff(inp).split("\n");
      // `clipped` only when there IS something below the fold — see
      // .toolchip pre.diff.clipped: a mask paints the box, not the overflow, so
      // an unconditional fade dissolves the last line of a two-line diff.
      p.className = lines.length > CHIP_DIFF_CLIP_LINES ? "diff clipped" : "diff";
      lines.forEach((line) => {
        const s = document.createElement("span");
        s.className = line.charAt(0) === "+" ? "diff-add"
                      : line.charAt(0) === "-" ? "diff-del" : "";
        s.textContent = line;
        p.appendChild(s);
      });
      body.appendChild(p);
      break;
    }
    case "Write":
      used.push("file_path", "content");
      pathLabel(inp.file_path);
      pre(typeof inp.content === "string" ? inp.content : "");
      break;
    case "Bash":
      used.push("command", "description");
      if (inp.description) label(String(inp.description));
      pre(typeof inp.command === "string" ? inp.command : "");
      break;
    case "TodoWrite": {
      used.push("todos");
      const todos = Array.isArray(inp.todos) ? inp.todos : [];
      todos.forEach((t) => {
        const row = document.createElement("div");
        row.className = "chip-todo";
        const done = t && t.status === "completed";
        if (done) row.classList.add("done");
        row.textContent = (done ? "☑ " : "☐ ")
                          + String((t && (t.content || t.activeForm)) || "");
        body.appendChild(row);
      });
      break;
    }
    case PLAN_TOOL: {
      // The plan, as PROSE. Both of these tools own a card (buildPlanCard,
      // buildQuestionCard) which is the surface the user acts on while the turn
      // is live — but a card is a control, and controls do not survive a reload:
      // on a restored transcript this chip is the only record that a plan was
      // ever proposed, and a raw JSON dump of `{"plan": "## Step one\n\n- ..."}`
      // is a record of the bytes rather than of the plan.
      //
      // `plan` is the ONE tool input on this page that goes through renderMd
      // instead of textContent, for the same reason it does on the card: it is
      // not bytes off a disk, it is markdown the model wrote for a human to read
      // (D248 — and the funnel is the shared marked + DOMPurify one, so this
      // adds a call SITE, not a second renderer). Kept in sync with
      // buildPlanCard deliberately: same key, same funnel, same leftover rule.
      const plan = typeof inp.plan === "string" && inp.plan ? inp.plan : "";
      if (plan) {
        used.push("plan");
        const d = document.createElement("div");
        d.className = "plan-body chip-plan";
        d.innerHTML = renderMd(plan);
        body.appendChild(d);
        attachCodeCopy(d);   // a plan quotes code; the copy buttons come with it
      }
      // ...and when it is not a usable string it stays UNUSED, so it falls into
      // the leftover dump below with everything else — a chip must never imply a
      // plan was read when there was nothing to read.
      break;
    }
    case ANSWERABLE_TOOL: {
      // What was asked, and what the options were. Structured plain text, never
      // markdown: every string here (the question, the labels, the descriptions)
      // is model-authored, the labels are what the answer is keyed by, and an
      // option that renders as anything other than its literal text is an option
      // the user cannot check against the answer they gave. So: textContent.
      const questions = Array.isArray(inp.questions) ? inp.questions : null;
      if (questions) {
        used.push("questions");
        questions.forEach((q) => {
          const item = q && typeof q === "object" ? q : {};
          label(String(item.question === undefined || item.question === null
                       ? "" : item.question), "chip-ask-q");
          (Array.isArray(item.options) ? item.options : []).forEach((o) => {
            const opt = o && typeof o === "object" ? o : {};
            const text = String(opt.label === undefined || opt.label === null
                                ? "" : opt.label);
            const desc = String(opt.description === undefined
                                || opt.description === null ? "" : opt.description);
            label("  ○ " + text + (desc ? " — " + desc : ""), "chip-ask-o");
          });
        });
      }
      break;
    }
    default:
      // No renderer for this tool, so the input IS the body: pretty JSON of
      // the whole thing. A chip that showed part of an unknown call would be a
      // chip that misdescribed what ran.
      used.push(...Object.keys(inp));
      if (Object.keys(inp).length) pre(JSON.stringify(inp, null, 2));
  }

  // Anything the branch above did not render — same rule as the approval
  // card's: a key that changes what the tool did (`run_in_background`,
  // `timeout`, a flag added after this was written) must not be invisible
  // because our renderer predates it.
  const extra = leftoverInput(inp, used);
  if (extra) pre(JSON.stringify(extra, null, 2));

  // "" is an empty result and null is "no result yet" — two different facts,
  // and only the first has anything to show.
  if (typeof seg.output === "string" && seg.output !== "") {
    pre(seg.output, "chip-out");
  }
  (Array.isArray(seg.images) ? seg.images : []).forEach((img) => {
    // The media type lands in a `data:` URL, so it is validated rather than
    // trusted: base64 payload, an image subtype, nothing else. A rejected image is
    // skipped, not coerced — inventing `image/png` for something that said it
    // was text/html would be guessing about bytes we did not read.
    const type = String((img && img.media_type) || "");
    const data = String((img && img.data) || "");
    if (!/^image\/[\w.+-]+$/.test(type) || !/^[A-Za-z0-9+/=\s]+$/.test(data)) return;
    const el = document.createElement("img");
    el.className = "chip-img";
    el.src = "data:" + type + ";base64," + data.replace(/\s+/g, "");
    el.alt = seg.name + " result image";
    body.appendChild(el);
  });
}

// One tool call. Returns a view handle rather than an element: the same call is
// re-rendered on every 400 ms poll — first `running` with no output, later
// `ok`/`error` with one — and it has to be the SAME <details> throughout, or a
// chip the user opened would snap shut under them every tick.
function buildToolChip(seg, key) {
  const el = document.createElement("details");
  el.className = "toolchip";
  const head = document.createElement("summary");
  const glyph = document.createElement("span");
  const name = document.createElement("span");
  name.className = "chip-name";
  // Humanized for reading, raw on the row's title — same rule, and the same
  // helper, as the approval card's header (see prettyToolName).
  const rawName = String(seg.name || "tool");
  const prettyName = prettyToolName(rawName);
  name.textContent = prettyName;
  if (prettyName !== rawName) head.setAttribute("title", rawName);
  const sub = document.createElement("span");
  sub.className = "chip-sub";
  // Two spans, not one string: `lead` keeps the row's fixed width (a status
  // glyph, a name, "+12 -3") and `path` is the one item allowed to shrink, so it
  // ellipsizes from the LEFT inside the space that is left and the filename
  // survives — see .chip-path, and toolChipSummaryParts for which tools have a
  // path half at all. The <bdi> is what keeps the path's own characters in
  // logical order inside that right-to-left box.
  const lead = document.createElement("span");
  lead.className = "chip-lead";
  const path = document.createElement("span");
  path.className = "chip-path";
  const pathText = document.createElement("bdi");
  path.appendChild(pathText);
  sub.append(lead, path);
  // The flex row lives INSIDE the summary: a flex summary loses its disclosure
  // triangle (the marker only exists on a `display: list-item` box).
  const row = document.createElement("span");
  row.className = "chip-row";
  row.append(glyph, name, sub);
  head.append(row);
  const body = document.createElement("div");
  body.className = "chip-body";
  el.append(head, body);
  registerCard(el, head, key);

  // What the DOM currently says, as one string. Re-rendering an unchanged chip
  // every 400 ms would drop scroll position inside a long output and fight the
  // user's own selection; this is the cheap way to not.
  //
  // `input` is deliberately NOT in the key. It cannot change under a live chip
  // — agent.py reads tool calls only from FINALIZED assistant rows, whose input
  // is complete and deduped by tool id — and a Write's `content` is uncapped,
  // so keying on it would re-stringify the whole file being written on every
  // 400 ms poll for the rest of the turn. `output` is capped (4000 chars) and
  // images contribute only their count, so what is left is cheap.
  let shown = null;
  function update(next) {
    const key = JSON.stringify([next.status, next.output,
                                (next.images || []).length]);
    if (key === shown) return;
    shown = key;
    const status = String(next.status || "running");
    // `is-` prefixed, and not the bare status word: `error` alone collided with
    // the page's own `.error` rule (a red pill with a border and 8px of padding
    // — see .turn.error), which repainted this 1-character glyph as a badge and
    // made the whole row jump taller the moment a tool failed.
    glyph.className = "chip-status is-" + status;
    // A presence check, not `||`: "" is a real glyph choice here (ok draws
    // nothing, running is drawn by CSS), so falling back on falsiness would put
    // the error glyph rule's fallback on an ok chip. hasOwnProperty, not `in`,
    // because `in` also answers yes to "toString" — an unknown status must land
    // on the running glyph, never on a function's source text.
    glyph.textContent =
      Object.prototype.hasOwnProperty.call(TOOL_STATUS_GLYPH, status)
        ? TOOL_STATUS_GLYPH[status] : TOOL_STATUS_GLYPH.running;
    const parts = toolChipSummaryParts(next);
    lead.textContent = parts.lead;
    pathText.textContent = parts.path;
    // Which half is allowed to shrink is a fact about the CONTENT, so the class
    // carries it: with a path, the lead is fixed and the path absorbs the clip;
    // without one, the lead is the whole row and ellipsizes itself.
    sub.classList.toggle("has-path", !!parts.path);
    // The whole one-liner on hover: the row clips a long path at BOTH ends
    // (the left-clip keeps its filename, the summary's own ellipsis its head),
    // and a tooltip is the cheapest way to read it without opening the chip.
    const full = toolChipSummary(next);
    if (full) sub.setAttribute("title", full);
    body.replaceChildren();
    fillToolChipBody(body, next);
  }
  update(seg);
  return { kind: "tool", el, update };
}

// Thinking. Unlabelled by content on purpose: the point of showing it at all is
// that it HAPPENED and is inspectable, and a reasoning trace summarised in the
// summary line would be a second thing to read for every one the user actually
// wanted to open. Open or folded is not this function's call — registerCard
// decides it, the same way it does for a tool chip.
function buildThinkingView(key) {
  const el = document.createElement("details");
  el.className = "thinking";
  const head = document.createElement("summary");
  head.textContent = "Thought for a moment";
  const body = document.createElement("div");
  body.className = "thinking-body";
  el.append(head, body);
  registerCard(el, head, key);
  return {
    kind: "thinking", el, text: null,
    render(t) { body.innerHTML = renderMd(t); },
  };
}

// A run of prose. Its own element rather than markdown appended to the turn,
// because the typer needs something to own: the streaming tail is one element
// whose innerHTML is rewritten per frame, and the segments around it must not
// be inside what gets rewritten.
function buildTextView() {
  const el = document.createElement("div");
  el.className = "seg-text";
  return {
    kind: "text", el, text: null,
    render(t) { el.innerHTML = renderMd(t); },
  };
}

function buildSegmentView(seg, key) {
  if (seg.kind === "tool") return buildToolChip(seg, key);
  if (seg.kind === "thinking") return buildThinkingView(key);
  return buildTextView();  // "text", and anything a newer agent.py invents
}

const segText = (seg) => (seg && typeof seg.text === "string" ? seg.text : "");
// container element -> the views rendered into it, by segment index. A WeakMap
// so a removed turn (an errored run drops its whole bubble) takes its state
// with it.
const segStates = new WeakMap();

// Render `segments` into `container`, idempotently: called on EVERY poll with
// the whole list, it builds each segment's view once at its index and
// afterwards only updates in place. `opts.typer` streams the trailing text
// segment (omit it for a finished turn — history restore — and everything
// renders statically). Returns that trailing text, which is what the caller
// hands typer.finish() when the run ends.
function renderSegments(container, segments, opts) {
  const typer = (opts && opts.typer) || null;
  const list = Array.isArray(segments) ? segments : [];
  let st = segStates.get(container);
  // `seq` numbers this container for the life of the page: it is the half of a
  // position key (cardKey) that keeps two turns' second thinking block from
  // sharing one collapse override.
  if (!st) { st = { views: [], typed: -1, seq: ++cardSeq }; segStates.set(container, st); }
  // ONLY a text segment at the very end of the list is still growing. One
  // anywhere else is finished by definition — something came after it — and a
  // typer aimed at it would re-animate settled prose on every poll.
  const tail = list.length && list[list.length - 1].kind === "text"
    ? list.length - 1 : -1;

  // The reply grew PAST the segment the typer was streaming (a tool call, or
  // more prose after one). That text is final now, and the typer may have
  // drawn only part of it — so render it whole, give it its copy buttons, and
  // let the typer go before the loop below points it anywhere new.
  if (st.typed >= 0 && st.typed !== tail) {
    const done = st.views[st.typed];
    const seg = list[st.typed];
    if (done && done.kind === "text") {
      done.text = segText(seg);
      done.render(done.text);
      attachCodeCopy(done.el);
    }
    st.typed = -1;
    if (typer) typer.retarget(null);
  }

  for (let i = 0; i < list.length; i++) {
    const seg = list[i] || {};
    let view = st.views[i];
    if (!view || view.kind !== (seg.kind === "tool" || seg.kind === "thinking"
                                ? seg.kind : "text")) {
      // A settled index never changes kind (segments only grow, and same-kind
      // neighbours merge in agent.py) — but rebuilding beats rendering a tool
      // call into a prose element if that ever stops being true.
      if (view) view.el.remove();
      view = buildSegmentView(seg, cardKey(st, seg, i));
      st.views[i] = view;
      container.appendChild(view.el);
    }
    if (view.kind === "tool") { view.update(seg); continue; }
    const text = segText(seg);
    if (i === tail && typer) {
      if (st.typed !== i) { typer.retarget(view.el); st.typed = i; }
      view.text = text;   // the typer owns this element's DOM until it moves on
      typer.update(text);
      continue;
    }
    if (view.text !== text) { view.text = text; view.render(text); }
  }

  // Defensive: within one turn the list only grows, but a container reused for
  // a shorter turn must not keep the old tail on screen.
  st.views.splice(list.length).forEach((v) => v.el.remove());
  return tail >= 0 ? segText(list[tail]) : null;
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// ── the pull channel: answer the agent's app_state reads ──────
// agent.py parks each `app_state` tool call as a file and hands the unanswered
// ones to every poll; this frame is the only thing that can see the app, so it
// is the only thing that can answer. No card and no confirmation: it is a read
// of the user's own screen, for the agent they are already talking to, and the
// tool call is BLOCKED until it is answered. The one-line note is the whole
// transparency story, and it is the right size for it.
const answeredStates = new Set();  // ids already answered; poll replays the list
// Ids whose note is already in the log. Separate from `answeredStates` because
// that one is RELEASED when an attempt fails so the next poll retries — and a
// retry must not append a second "read app state" line for one read.
const notedStates = new Set();
// Polls a request may see an empty snapshot before we stop waiting and answer
// with appStatePull's explicit sentence instead. The poll loop is 400 ms, so
// this is ~2 s — comfortably longer than a live-reload of the left pane, and far
// shorter than the tool's own timeout (minutes), which would be the alternative
// backstop and a much worse answer for the model.
const APP_STATE_NULL_POLLS = 5;
const nullStatePolls = new Map();  // req.id -> polls seen with nothing to report
// Cap on all three of the above. One entry per app_state call for the page's
// lifetime is bounded in practice and unbounded in principle; dropping the oldest
// is safe because agent.py only ever lists UNANSWERED requests, so a forgotten id
// cannot come back — and if it somehow did, the on-disk latch makes a second
// answer a no-op.
const APP_STATE_MEMO_MAX = 200;
function appStateTrim(memo) {
  while (memo.size > APP_STATE_MEMO_MAX) memo.delete(memo.keys().next().value);
}

// Skill invocations already announced in the log, by `tool_use` id. Poll replays
// every call in the file on each 400 ms tick, so without this the same skill
// would append a row per tick — the same reason `notedStates` exists next door.
// Trimmed on the shared cap: the ids are unique per run and a turn that invokes
// two hundred skills is not a thing, so the oldest can never come back.
const notedSkills = new Set();

// Which skills the model reached for, as they happen. Worth a row of its own
// because a skill silently changes how the reply was produced: without this the
// only visible difference between a session that loaded the fused-render
// authoring skill and one that did not is that the answers are better.
function noteSkills(list, working) {
  for (const call of list || []) {
    if (!call || !call.id || !call.skill || notedSkills.has(call.id)) continue;
    notedSkills.add(call.id);
    appStateTrim(notedSkills);
    // Skill names are model-authored text; addNote puts them in via textContent.
    addNote("skill · " + call.skill, working, "◆");
  }
}

async function answerAppState(list, run_id, working) {
  for (const req of list || []) {
    if (!req || !req.id || answeredStates.has(req.id)) continue;
    // Taken HERE, not at send time: the whole point of the pull channel is that
    // the pushed snapshot has gone stale.
    const state = appStateSnapshot();
    if (!state) {
      // Nothing to report YET. Almost always the pane mid-reload — and an edit
      // is exactly what triggers a reload, so this is the common case right
      // after the model edits something and then asks what happened. Leave the
      // id UNclaimed so the next poll tries again, rather than settling the tool
      // call as an error it cannot retry (see appStatePull).
      const seen = (nullStatePolls.get(req.id) || 0) + 1;
      nullStatePolls.set(req.id, seen);
      appStateTrim(nullStatePolls);
      if (seen <= APP_STATE_NULL_POLLS) continue;
      // Still nothing: this is not a reload, it is a project with no app to
      // read. Fall through and answer, so the model is told that instead of
      // waiting out the tool timeout for the same news.
    }
    answeredStates.add(req.id);   // claimed before the await: polls overlap
    appStateTrim(answeredStates);
    // Once per REQUEST, not once per attempt: the claim above is released again
    // when an attempt fails, and a retry appending another line would make the
    // log read as several reads of the app for one tool call.
    if (!notedStates.has(req.id)) {
      notedStates.add(req.id);
      appStateTrim(notedStates);
      addNote(req.reason ? "read app state — " + req.reason : "read app state", working);
    }
    let res = null;
    try {
      res = await fused.runPython(AGENT, {
        action: "app_state", run_id, request_id: req.id,
        // A JSON string, not a nested object: params cross into python
        // string-shaped, and nothing on that side reads inside the snapshot.
        // Never the bare `null` a snapshot can be — agent.py reads a non-dict as
        // a permanent failure.
        state: JSON.stringify(state || appStatePull()),
      }, { key: null });
    } catch (err) {
      // The tool call is still blocked, so this has to be retried — un-claim
      // the id and let the next poll (400 ms) have another go. Its own timeout
      // is the backstop if this keeps failing.
      answeredStates.delete(req.id);
      continue;
    }
    // A RESOLVED error is the same news as a throw when it says so. agent.py
    // flags which of its errors could ever be helped by another go: a write that
    // did not reach disk can (the window is alive, the tool is still blocked),
    // an unknown run or request never will — and retrying that one every 400 ms
    // until the run ends is worse than letting the tool's timeout settle it.
    if (res && res.error && res.retry) answeredStates.delete(req.id);
  }
}

// ── stopping a turn ───────────────────────────────────────────
// Mirrors the claude template (this chat is a fork of it): agent.py could always
// kill a run, and until the stop button nothing called it — a turn that went off
// the rails could only be waited out or escaped by navigating away, which leaves
// the detached subprocess working on. pollLoop publishes the live run so the
// button and Escape have something to aim at, which covers a re-attached run too.
let activeRun = null;
let activeWorking = null;
// The live turn's segment container, or null between turns. Published by pollLoop
// once the segment path owns the bubble, and read by parkResolvedCard — which is
// the one thing outside the loop that has to put something INTO the turn being
// streamed. Nulled in the loop's `finally`, so a decision that arrives after the
// run is over cannot file itself into a finished (or removed) bubble.
let activeSegBody = null;
// Keyed by id, not a bare boolean: it is read when a run ENDS, and a stale flag
// would label the next turn's ending as a stop too.
let stoppedRun = "";

// How a finished run ends on screen. Killing claude leaves the run dead with no
// `result` row, which `_poll` reports as an error BY DESIGN (a truncated reply
// must never read as a clean success) — but when the user asked for the stop,
// that error IS the stop, and repeating it back reads as a crash they caused. So
// it is swallowed here, and only here. Pure, and tested as such — against the
// claude template's copy, which must decide identically.
function runEnding(data, stopped) {
  if (!stopped) return { error: data.error || "", note: "", keepText: !data.error };
