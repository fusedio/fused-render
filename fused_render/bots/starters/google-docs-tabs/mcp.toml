# MCP tools for this app, curated in fused-render's MCP panel.
# `fused app serve <this folder>` publishes one tool per [[tool]] table.
# Every tool calls docs.py main(action=...); the pinned `action` must be one
# that docs.py's run() handles (see BOT.md for the full table).

[[tool]]
name = "docs_status"
description = "Check whether a Google service-account key is saved, its email, and the saved documents library (docs: [{id, name, title, url}])."
file = "docs.py"
entrypoint = "main"
signature = "main(action: str='status', doc: str='', title: str='', content: str='', tab: str='', parent: str='', key_json: str='', command: str='', comment: str='', resolved: bool=False)"

[tool.pinned]
action = "status"

[[tool]]
name = "docs_set_key"
description = "Save (and verify with Google) the service-account key JSON used for authentication. Pass the whole key file as key_json."
file = "docs.py"
entrypoint = "main"
signature = "main(action: str='status', doc: str='', title: str='', content: str='', tab: str='', parent: str='', key_json: str='', command: str='', comment: str='', resolved: bool=False)"

[tool.pinned]
action = "save_key"

# ---- saved documents library (.fused/data/docs.json)
# Every doc that is used gets saved automatically under its title. In every
# other tool, `doc` accepts a saved document's name as well as a URL or id.

[[tool]]
name = "docs_list_docs"
description = "List the saved documents the user has added to this app: [{id, name, title, url, last_used}]. Call this first when the user refers to a doc by name; pass that name (or the id/url) as `doc` to every other tool."
file = "docs.py"
entrypoint = "main"
signature = "main(action: str='status', doc: str='', title: str='', content: str='', tab: str='', parent: str='', key_json: str='', command: str='', comment: str='', resolved: bool=False)"

[tool.pinned]
action = "list_docs"

[[tool]]
name = "docs_add_doc"
description = "Save a Google Doc to the library so it can be referred to by name later. doc is a Docs URL or id; title is the friendly name (optional, defaults to the doc's own title). Verifies the doc is shared with the service account."
file = "docs.py"
entrypoint = "main"
signature = "main(action: str='status', doc: str='', title: str='', content: str='', tab: str='', parent: str='', key_json: str='', command: str='', comment: str='', resolved: bool=False)"

[tool.pinned]
action = "add_doc"

[[tool]]
name = "docs_rename_doc"
description = "Give a saved document a new friendly name. doc is the current name, id or URL; title is the new name."
file = "docs.py"
entrypoint = "main"
signature = "main(action: str='status', doc: str='', title: str='', content: str='', tab: str='', parent: str='', key_json: str='', command: str='', comment: str='', resolved: bool=False)"

[tool.pinned]
action = "rename_doc"

[[tool]]
name = "docs_remove_doc"
description = "Forget a saved document (removes it from the library only; the Google Doc is untouched). doc is its name, id or URL."
file = "docs.py"
entrypoint = "main"
signature = "main(action: str='status', doc: str='', title: str='', content: str='', tab: str='', parent: str='', key_json: str='', command: str='', comment: str='', resolved: bool=False)"

[tool.pinned]
action = "remove_doc"

