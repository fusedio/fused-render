    // anyway, so a top-level URL write is the only way to switch mode. The
    // handoff params (`claudeComments`, `claudeReturn`) ride the same write.
    document.getElementById("toclaude").addEventListener("click", async () => {
      // Nothing new to hand over: say so in the bar (the same inline note the
      // budget uses) and stay put — navigating to a chat with an empty
      // attachment list would look like the review had been sent.
      const all = load();
      const payload = sendable(all);
      if (!payload.length) {
        document.getElementById("budgetnote").textContent =
          all.length ? "nothing new to send — reopen a comment to send it again" : "no comments to send";
        return;
      }
      const flush = window.__fusedFlushEdits;
      try {
        const res = await Promise.race([
          flush(),
          new Promise((r) => setTimeout(() => r({ ok: false }), 10000)),
        ]);
        if (res && res.ok === false) return; // unsaved buffer — don't discard
      } catch (e) {
        return;
      }
      // Serialize the wire form BEFORE stamping: `sent` is an internal
      // lifecycle flag of the URL store, and formatComments (claude template)
      // hands the agent the raw JSON with every field intact — it has no
      // business reading, explaining or reasoning about our bookkeeping.
      const wire = JSON.stringify(payload);
      // Stamp and persist BEFORE navigating: save() is what writes the `comments`
      // URL param (and, via the verbatim field merge in annotate.py, the
      // `<file>.json` sidecar), and this frame is about to be torn down by the
      // mode switch — a stamp applied after the navigation would never land.
      // The payload's ids are handed to save() as off-limits for eviction: the
      // stamp is what can push the list over BUDGET, and the comments being sent
      // are then the entire sent tier (see evictTarget).
      for (const c of payload) c.sent = 1;
      const persisted = save(all, undefined, new Set(payload.map((c) => c.id)));
      const top = window.top.location;
      const full = (top.search || "").replace(/^\?/, "");
      const rest = withoutLayoutSpan(top.search);
      // Recover the raw span (the part withoutLayoutSpan removed).
      const m = /(^|&)_layout=\(/.exec(full);
      let span = null;
      if (m) {
        const start = m.index + m[1].length;
        let i = start + "_layout=(".length, depth = 1;
        while (i < full.length && depth > 0) {
          if (full[i] === "(") depth++;
          else if (full[i] === ")") depth--;
          i++;
        }
        span = full.slice(start, i);
      }
      const params = new URLSearchParams(rest);
      // D99 staleness sweep. `rest` is a RAW read of window.top's search, but
      // fused.params.set COALESCES its history write — so ANY param this page
      // owns may still sit at its pre-click value in that string, and writing it
      // back verbatim silently reverts it: the `sent` stamps (re-sending the
      // whole review next visit), and `offset`/`sheet` written by a reveal
      // within the coalescing window (returning to page 1 of a table/pdf).
      // fused.params.getAll() reads through the pending overlay, so it is the
      // live truth. Only keys the top URL ALREADY carries are touched — this
      // must not push a pane-local param onto the shell URL.
      const live = fused.params.getAll();
      for (const k of [...params.keys()]) {
        if (typeof live[k] === "string") params.set(k, live[k]);
      }
      params.set("_mode", "claude");
      params.set("claudeComments", wire);
      // The review as save() actually PERSISTED it (post-eviction) — narrower
      // than the sweep above, which cannot know that save may have dropped a
      // comment, and correct even if `comments` was absent from the top URL.
      params.set("comments", JSON.stringify(persisted));
      // Return ticket: the chat has nothing else that would ever bring the user
      // back (it turns auto-reload off and lives entirely inside its own frame),
      // so the run that carries these comments navigates the shell back to this
      // mode when it finishes. The value names the mode to return to, so the
      // chat needs no knowledge of who sent it. `view` rides along explicitly —
      // it is the annotate param that picks WHICH sibling view is framed, and
      // re-asserting it here means the round trip can't land on the default
      // view if the shell hadn't synced it yet.
      params.set("claudeReturn", "annotate");
      const view = fused.params.get("view");
      if (view) params.set("view", view);
      let search = params.toString();
      if (span) search += (search ? "&" : "") + span;
      window.top.location.href = top.pathname + (search ? "?" + search : "");
    });

    // --- version history + revert (SPEC §34) ---------------------------------
    // Backed by Claude Code's OWN file-history store, not git: it answers "what
    // did this file look like before the agent touched it", which is the
    // question a reviewer sitting in this view actually asks, and it has an
    // answer in a directory that is not a repository. All the store knowledge
    // lives in ../shared/file_history.py behind annotate.py's three actions; the
    // only rules encoded HERE are presentational, plus the one that matters:
    // a restore never lands without a confirm sheet that states what it costs.
    const histFoot = document.getElementById("histfoot");
    const revertBtn = document.getElementById("revertbtn");
    const histToggle = document.getElementById("histtoggle");
    const histList = document.getElementById("histlist");
    const histNote = document.getElementById("histnote");
    const confirmEl = document.getElementById("confirm");

    let timeline = null;    // last `history` payload
    let histOpen = false;
    // Transcript enrichment (the "file did not exist" checkpoints) is the
    // expensive half — those .jsonl files reach 5 MB+ — so it is paid for
    // exactly once, when the panel is first expanded, never on boot.
    let enriched = false;
    let busy = false;

    function ago(sec) {
      if (!sec) return "";
      const d = Math.max(0, Date.now() / 1000 - sec);
      if (d < 90) return "just now";
      if (d < 3600) return Math.round(d / 60) + "m ago";
      if (d < 86400) return Math.round(d / 3600) + "h ago";
      if (d < 172800) return "yesterday";
      if (d < 86400 * 30) return Math.round(d / 86400) + "d ago";
      return new Date(sec * 1000).toLocaleDateString();
    }

    // The +N/−M a row shows is what RESTORING it would do to the file as it is
    // now — lines it introduces, lines it takes away. `exact:false` means the
    // helper refused to diff (too big, or not text) and only net counts are
    // honest, so it says so with a tilde rather than implying a real diff.
    function deltaNodes(v) {
      const frag = document.createDocumentFragment();
      if (!v.existed) {
        const s = document.createElement("span");
        s.className = "hminus";
        s.textContent = "did not exist";
        frag.appendChild(s);
        return frag;
      }
      if (v.added == null || v.removed == null) {
        frag.appendChild(document.createTextNode("binary"));
        return frag;
      }
      if (!v.differs) {
        frag.appendChild(document.createTextNode("on disk now"));
        return frag;
      }
      const plus = document.createElement("span");
      plus.className = "hplus";
      plus.textContent = (v.exact ? "" : "~") + "+" + v.added;
      const minus = document.createElement("span");
      minus.className = "hminus";
      minus.textContent = "−" + v.removed;
      frag.appendChild(plus);
      frag.appendChild(document.createTextNode(" "));
      frag.appendChild(minus);
      return frag;
    }

    // TWO dot states, not three. `◉`/`●`/`○` over three colours put three
    // competing markers in one column, and at 11px the first two are barely
    // distinguishable — while carrying unrelated meanings. So the dot answers
    // exactly one question ("where is disk now") and the revert target moves to
    // row treatment (`.next`: accent stripe + wash). Pure function of the two
    // ids so it can be driven directly under node.
    function rowMarks(v, positionId, targetId) {
      const here = v.id === positionId;
      return {
        dot: here ? "●" : "○",
        cls: "hrow" + (v.id === targetId ? " next" : "") +
          (here ? " here" : "") + (v.differs ? "" : " same"),
      };
    }

    // --- panel state that must survive a reload -----------------------------
    // A successful revert changes the target on disk, so the shell's own
    // fs-event watch reloads the whole preview — which used to collapse the
    // panel and throw the outcome away, leaving the user staring at a fresh
    // boot state wondering whether anything happened.
    //
    // sessionStorage keyed by the target path, NOT a URL param, and the reason is
    // this template's own contract: `comments` lives in the URL precisely so the
    // review can be shared ("share it to share the review"), and the same
    // argument that kept pane geometry out of the URL in D185 applies here —
    // whether a disclosure widget is open is a workspace habit, not a fact about
    // the view worth reproducing in someone else's browser. The outcome message
    // is even less shareable: it is a transient result of one click, and a
    // bookmark carrying "Reverted to v2" forever would be a lie the moment it
    // was opened.
    const HIST_KEY = "fusedAnnotateHist:" + file;
    function histState() {
      try {
        const o = JSON.parse(sessionStorage.getItem(HIST_KEY) || "null");
        return o && typeof o === "object" ? o : {};
      } catch (e) {
        return {}; // private mode, quota, corrupt value — just don't persist
      }
    }
    function saveHistState(patch) {
      try {
        sessionStorage.setItem(HIST_KEY,
          JSON.stringify(Object.assign(histState(), patch)));
      } catch (e) { /* see above — persistence is a nicety, never a dependency */ }
    }
    // The CARRY SLOT: at most one outcome message, alive only for the gap between
    // a revert and whatever repaints the panel next — this page's own refresh, or
    // a fresh boot if the shell tore the page down first.
    //
    // Restructured rather than given a fourth guard, because this mechanism has
    // now produced three separate bugs (write-order, the count/enrich jump, and
    // lifetime) and the lifetime was the one that was not expressible: writes were
    // scattered and clears happened in one place. Now there are exactly three
    // operations and the rule reads off them — ONE writer, and both readers CLEAR:
    //
    //   carryOutcome(text)     the only writer, called once, before the refresh
    //   takeCarriedOutcome()   boot: read-and-clear
    //   dropCarriedOutcome()   in-page: spent, because it was displayed here
    //
    // Nothing writes after a read, so a torn-down page cannot resurrect a message
    // a later boot already consumed, and an outcome cannot outlive the one write
    // it describes and reappear as fresh news the next time the file is opened.
    // Only a SUCCESSFUL revert is carried: a failure changed nothing on disk, so
    // there is no reload to bridge and no reason to greet a later visit with it.
    function carryOutcome(text) {
      saveHistState({ open: histOpen, note: text });
    }
    function takeCarriedOutcome() {
      const s = histState();
      if (!s.note) return null;
      dropCarriedOutcome();
      return { text: s.note, error: false };
    }
    function dropCarriedOutcome() {
      saveHistState({ note: "" });
    }

    function setNote(text, isError) {
      histNote.className = isError ? "error" : "";
      histNote.textContent = text;
    }
    //: How long the stage toast stays up. Long enough to read a sentence, short
    //: enough that it is gone before it stops being news.
    const TOAST_MS = 4000;
    let toastTimer = 0;
    // A brief confirmation at the top of the stage, where the eye is when the
    // centered sheet closes under it. TRANSIENT on purpose: it reports the outcome
    // of one click, and a banner still sitting over the framed view minutes later
    // would be reporting history — #histnote is the durable copy, and it is still
    // written on every path.
    function showToast(text) {
      const el = document.getElementById("toast");
      el.textContent = text;
      el.hidden = false;
      clearTimeout(toastTimer);  // a second revert restarts the window, not two
      toastTimer = setTimeout(() => { el.hidden = true; }, TOAST_MS);
    }
    // One composer for both the in-page path and the post-reload path. `reloadErr`
    // is the M1 lesson generalized: a refresh that failed has already written its
    // own error here, and reporting plain success over it hides that the list
    // being shown is stale.
    function reportOutcome(text, isError, reloadErr) {
      if (reloadErr) setNote(text + " The timeline could not be reloaded — "
        + reloadErr, true);
      else setNote(text, isError);
    }

    function renderHistory() {
      if (!timeline) return;
      // No store at all means Claude Code has never run here — that is not an
      // empty state worth a panel, it is "this feature does not apply", so the
      // block stays out of the sidebar entirely. A store that exists but holds
      // nothing for THIS file does get a line of text, because there the
      // absence is a fact about the file and worth saying.
      histFoot.hidden = !timeline.available;
      revertBtn.hidden = !timeline.versions.length;
      const target = timeline.revert;
      // `at_earliest` is a terminal state, not a failure: the walk has reached
      // the start of the chain and there is nothing older. The button goes dead
      // and the note says why, because the alternative — falling back to
      // something NEWER — is exactly what made the old rule oscillate.
      //
      // But ONLY an enriched timeline may claim it. The boot timeline skips the
      // transcripts (they reach 5 MB+), so it cannot see the did-not-exist
      // boundary and reports at_earliest one step early — and believing it
      // disabled the button on a file whose remaining step back was a delete
      // that `revert_plan`, which always enriches, would have offered. Found by
      // pressing the button four times in the running app. So while unenriched,
      // a missing target leaves the button LIVE and the click asks the plan,
      // which is the authority.
      // ONE condition, because the payload already carries the one answer:
      // `revert` is published only when the automatic action may actually be
      // offered (writable, no blocking skips, not terminal), so the button and
      // the striped row below can no longer disagree with what the plan will do.
      // Three findings came from this being several conditions the view had to
      // keep in step with the plan by hand — a read-only target, an unconfirmed
      // terminal state, and a blocking skip WITH a live target, which struck a
      // row as "this is what Revert does" over a plan that always refused.
      revertBtn.disabled = busy || timeline.offer === false;
      histToggle.hidden = !timeline.versions.length;
      histList.hidden = !histOpen;
      histList.textContent = "";
      let rows = 0;
      if (histOpen) {
        for (const v of timeline.versions) {
          rows++;
          const row = document.createElement("div");
          const marks = rowMarks(v, timeline.position, target);
          const here = v.id === timeline.position;
          row.className = marks.cls;
          const dot = document.createElement("span");
          dot.className = "hdot";
          dot.textContent = marks.dot;
          if (here) row.title = "what is on disk now";
          const num = document.createElement("span");
          num.className = "hv";
          // A did-not-exist checkpoint IS a numbered version of the chain — in a
          // real store it is `version: 1`, the creation boundary — so it wears
          // its number like every row below it and "did not exist" (right-hand
          // column) explains what restoring it does. The dash is kept only for a
          // record that carried no usable number: "v0" would invent a version
          // the store never wrote.
          num.textContent = v.version >= 1 ? "v" + v.version : "—";
          const when = document.createElement("span");
          when.className = "hwhen";
          // A content version's time is its backup file's mtime; a
          // did-not-exist row's is the transcript record's own timestamp, never
          // a neighbouring row's. When that stamp could not be parsed the
          // helper reports 0 and BOTH the label and the tooltip fall silent —
          // "1970" would be a confident lie about when the file was created.
          when.textContent = v.mtime ? ago(v.mtime) : "time unknown";
          // Sessions are why two rows can both say v2 (SPEC §34/FH-3), so the
          // session's short id is the only thing that disambiguates them.
          when.title = (v.mtime
            ? new Date(v.mtime * 1000).toLocaleString() + " · "
            : "") + "session " + v.session;
          const d = document.createElement("span");
          d.className = "hd";
          d.appendChild(deltaNodes(v));
          row.append(dot, num, when, d);
          // A version identical to what is on disk is not an action: restoring
          // it would write the same bytes back, so the row is inert. So is EVERY
          // row when the target cannot be written: the main button already went
          // dead, and leaving the rows live meant a read-only file still opened
          // a destructive confirm sheet that could only fail server-side.
          if (v.differs && timeline.writable !== false) {
            row.onclick = () => askRevert(v.id);
          } else {
            row.style.cursor = "default";
          }
          histList.appendChild(row);
        }
      }
      // The count is the number of rows ACTUALLY RENDERED, and it only appears
      // once the enriched timeline has landed. Both halves matter: reading it
      // off `versions.length` while collapsed made the label say "(2)" and the
      // expanded list show 3 rows, because the did-not-exist checkpoint only
      // exists after enrichment — a number that contradicts the list it labels
      // is worse than no number, and a number that jumps on expand reads as a
      // bug even when both values are correct for their moment.
      histToggle.textContent = histOpen
        ? "▾ History (" + rows + ")"
        : "▸ History";
      // `offer_reason` is the same sentence the plan would refuse with, so the
      // reason a disabled button is disabled is already on screen — no press
      // required to find out. Writability comes through the same channel.
      // Through setNote like every other write to this element. renderHistory is
      // the BASELINE painter and setNote/reportOutcome are the overrides, but
      // "one function touches this node" is the invariant that stopped four
      // ordering bugs, so it should not have an exception carved into it.
      setNote(timeline.note || timeline.offer_reason || "", false);
    }

    // Every history/revert failure arrives as an `{error}` DICT rather than a
    // rejection (annotate.py wraps them for exactly this reason): "no versions
    // for this file" must never be a red traceback overlay. A rejection can
    // still happen — the run itself failing — so both paths land in the note.
    async function callHistory(params) {
      try {
        const out = await fused.runPython("./annotate.py",
          Object.assign({ file }, params), { key: null });
        if (out && out.error) return { error: out.error };
        return out || { error: "no response" };
      } catch (err) {
        return { error: err.message || String(err) };
      }
    }

    // Returns "" on success and the error string otherwise, so a CALLER can
    // decide what to say. Returning nothing was the same write-order bug as
    // below, one path over: the post-revert reload set histNote to its error and
    // the success message then overwrote it, so a revert that landed but whose
    // timeline could not be re-read reported unqualified success.
    async function loadHistory(enrich) {
      const out = await callHistory({ action: "history", enrich: !!enrich });
      if (out.error) {
        histFoot.hidden = false;
        // Repaint from the LAST GOOD timeline before reporting, so every label
        // and every row matches what is on screen. Skipping this is what let a
        // failed enrich leave an expanded label over an empty list.
        if (timeline) renderHistory();
        setNote(out.error, true);
        revertBtn.disabled = true;
        return out.error;
      }
      if (enrich) enriched = true;
      timeline = out;
      renderHistory();
      return "";
    }

    histToggle.addEventListener("click", async () => {
      // The flip happens AFTER the fetch, never before. Flipping first and then
      // awaiting left an open "▾" label above an empty list whenever the enrich
      // failed — the same optimistic-then-await trap as M1, and the third place
      // in this panel to have it. `loadHistory` now always repaints, so its
      // error path resyncs this label to the state that is actually on screen.
      if (!histOpen && !enriched) {
        histToggle.textContent = "▾ History…";
        if (await loadHistory(true)) return; // painted + resynced by loadHistory
      }
      histOpen = !histOpen;
      saveHistState({ open: histOpen });
      renderHistory();
    });

    let pending = null; // the plan awaiting confirmation
    function closeConfirm() {
      // A revert IN FLIGHT owns this sheet, and every close path goes through here
      // — the Cancel button, the backdrop click and Escape. `busy` is set for
      // exactly the window between the click and the call returning, and closing
      // inside it would null `pending` from under the handler that is still reading
      // it, while taking the only "something is happening" signal off screen.
      if (busy) return;
      confirmEl.classList.remove("open");
      pending = null;
      document.getElementById("confirmerr").hidden = true;
    }
    document.getElementById("confirmno").addEventListener("click", closeConfirm);
    confirmEl.addEventListener("click", (e) => {
      if (e.target === confirmEl) closeConfirm();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && confirmEl.classList.contains("open")) closeConfirm();
    });

    // Diffs at or under this many changed lines open EXPANDED. 40 is about the
    // tallest thing that still reads as a glance inside a modal; past it the sheet
    // becomes a scrolling review surface, and what is being confirmed is a click,
    // not a review — so the big ones wait behind a disclosure that says how much
    // there is.
    const DIFF_OPEN_LINES = 40;
    let diffChanged = 0; // for the toggle's label, which outlives one render

    // The confirm sheet's diff, built as NODES with classes — the same rule
    // `deltaNodes` follows and for a sharper reason here: these lines are file
    // content off the user's disk, and this template routinely annotates HTML.
    // Text nodes keep a checkpointed `<script>` inert; `innerHTML` would run it
    // inside this page, which holds the revert controls.
    function renderConfirmDiff(diff) {
      const pre = document.getElementById("confirmdiff");
      const toggle = document.getElementById("confirmdifftoggle");
      const box = document.getElementById("confirmbox");
      pre.textContent = "";
      toggle.hidden = true;
      // `reason` is file_history's one channel for every "no diff here" — over the
      // byte cap, binary either side, a version that vanished between the scan and
      // the read, a version holding exactly what is on disk. It renders WHERE the
      // diff would have been, because a sheet that silently omits the diff it
      // normally shows reads as the diff being empty.
      // A MISSING `diff` is the other case this branch covers, and it is not the
      // same thing: a refused plan (`ok: false`) carries no diff key at all, so
      // there is nothing to say and the box stays out of the sheet entirely.
      if (!diff || diff.reason) {
        if (diff && diff.reason) {
          const why = document.createElement("div");
          why.className = "cdnote";
          why.textContent = diff.reason;
          pre.appendChild(why);
        }
        pre.hidden = !pre.children.length;
        box.classList.remove("wide");
        return;
      }
      diff.lines.forEach((ln, i) => {
        const row = document.createElement("div");
        // The two file names are lines 0 and 1 BY POSITION, never by prefix: a
        // removed content line reading `--` arrives as `---` and would otherwise
        // be painted as a header instead of as the removal it is.
        row.className = i < 2 ? "cdfile"
          : ln.startsWith("@@") ? "cdhunk"
          : ln.startsWith("+") ? "cdplus"
          : ln.startsWith("-") ? "cdminus" : "";
        row.textContent = ln;
        pre.appendChild(row);
      });
      if (diff.truncated) {
        // The cut is stated with the FULL count beside it. Trailing off with no
        // note would present a prefix of the change as the whole of it — the same
        // thing the byte cap refuses to do one layer down.
        const cut = document.createElement("div");
        cut.className = "cdnote";
        cut.textContent = "… only the first " + diff.lines.length +
          " lines are shown — " + diff.changed + " lines change in total.";
        pre.appendChild(cut);
      }
      diffChanged = diff.changed;
      box.classList.add("wide");
      setDiffDisclosure(diff.changed <= DIFF_OPEN_LINES);
      toggle.hidden = diff.changed <= DIFF_OPEN_LINES;
    }

    function setDiffDisclosure(open) {
      const pre = document.getElementById("confirmdiff");
      const toggle = document.getElementById("confirmdifftoggle");
      pre.hidden = !open;
      toggle.textContent = open
        ? "▾ Hide diff"
        : "▸ Show " + diffChanged + " changed lines";
    }
    document.getElementById("confirmdifftoggle").addEventListener("click", () => {
      setDiffDisclosure(document.getElementById("confirmdiff").hidden);
    });

    // `versionId === null` means "the last change", resolved by the POSITIONAL
    // rule (SPEC §34/FH-3): where disk sits in the chain, then one step back.
    // No `enrich` is passed — deliberately. It used to be `enrich: enriched`,
    // which made the same button perform a restore before History was expanded
    // and a delete after; the plan and the write now always enrich, so only the
    // panel's own display is affected by the disclosure widget.
    async function askRevert(versionId) {
      if (busy) return;
      const plan = await callHistory({
        action: "revert_plan", version_id: versionId,
      });
      if (plan.error || plan.ok === false) {
        // A refusal is almost always a stable STATE (read-only target, terminal
        // chain, an unreadable version), so settle the panel into it — enriched,
        // because that is the only scan allowed to make a terminality claim —
        // instead of leaving a live button that will refuse identically on every
        // press. Composed through the shared reporter so a failed refresh cannot
        // hide behind the refusal.
        const reloadErr = await loadHistory(true);
        reportOutcome(plan.error || "Nothing to revert.", true, reloadErr);
        return;
      }
      // `writable` is a FIELD on a successful plan, not an error — so without
      // this the sheet opened on a read-only target and the user confirmed a
      // destructive act that could only fail server-side. Checked HERE rather
      // than only on the click affordances: this closes the class, the way the
      // bridge does for the confirm token, instead of one entry point.
      if (plan.writable === false) {
        renderHistory();
        setNote("This file cannot be reverted: " +
          (plan.writable_reason || "it is not writable") + ".", true);
        return;
      }
      pending = plan;
      // A previous failure's message must not greet the next target: this sheet is
      // one node reused for every plan.
      document.getElementById("confirmerr").hidden = true;
      const del = plan.action === "delete";
      document.getElementById("confirmtitle").textContent =
        del ? "Delete this file?" : "Revert this file?";
      const sub = document.getElementById("confirmsub");
      // `_epoch` reports 0 for a transcript stamp it could not parse, and
      // "1/1/1970" on a destructive confirm is a confident lie — the row list
      // already refuses to tell it, so the sheet must too.
      const when = plan.mtime
        ? " from " + new Date(plan.mtime * 1000).toLocaleString()
        : " (recorded at an unknown time)";
      sub.textContent = del
        ? "The file did not exist at this checkpoint — Claude created it" +
          when + ". Reverting past that point DELETES it."
        : "Restoring Claude's checkpoint v" + plan.version + when + ".";
      const facts = document.getElementById("confirmfacts");
      facts.textContent = "";
      const rows = [
        ["On disk now", plan.current.exists
          ? plan.current.size + " bytes" +
            (plan.current.lines == null ? "" : " · " + plan.current.lines + " lines")
          : "(file does not exist)"],
        [del ? "After delete" : "After revert", del
          ? "(file removed)"
          : plan.target.size + " bytes" +
            (plan.target.lines == null ? "" : " · " + plan.target.lines + " lines")],
        ["Line change", plan.added == null
          ? "unknown (not text)"
          : (plan.exact ? "" : "~") + "+" + plan.added + " / −" + plan.removed],
      ];
      for (const [k, v] of rows) {
        const dt = document.createElement("dt");
        dt.textContent = k;
        const dd = document.createElement("dd");
        dd.textContent = v;
        facts.append(dt, dd);
      }
      // Between the counts and the hazard, because that is the reading order the
      // sheet asks for: how much changes, what changes, what it costs.
      renderConfirmDiff(plan.diff);
      // The sharp hazard, stated plainly — and the SHEET NOW KNOWS whether a
      // copy will actually be kept, rather than hedging. `plan.stash` is the
      // same predicate the write itself runs, so the two cannot disagree. The
      // hedge was the bug: "a copy is kept unless too large or not text" made
      // the one genuinely unrecoverable case (content in no checkpoint AND no
      // stash) read exactly like the safe one, and the user found out in the
      // past tense, beside "Reverted to v3."
      const irreversible = !!plan.unique_current && plan.stash === false;
      const warn = document.getElementById("confirmwarn");
      warn.hidden = !plan.unique_current;
      warn.textContent = !plan.unique_current ? "" : (irreversible
        ? "What is on disk now matches no checkpoint, and NO copy of it will " +
          "be kept — " + (plan.stash_note || "the sidecar backstop is " +
          "unavailable") + ". This content will be gone permanently and " +
          "cannot be recovered from anywhere."
        : "What is on disk now matches no checkpoint, so this overwrites " +
          "content that exists nowhere else. A copy will be kept in the " +
          "file's .json sidecar (revertStash). Unsaved edits in the framed " +
          "view are not on disk and are not part of this comparison.");
      // No tick-to-confirm: the owner removed it as friction, so the warning
      // above plus this button's own wording are the entire signal. The button
      // is therefore enabled unconditionally, and the irreversible case says
      // "permanently" on the button itself so the label is not merely "Revert"
      // for an action that cannot be undone.
      warn.classList.toggle("hard", irreversible);
      const go = document.getElementById("confirmgo");
      go.textContent = irreversible
        ? (del ? "Delete permanently" : "Overwrite permanently")
        : (del ? "Delete" : "Revert");
      confirmEl.classList.add("open");
      document.getElementById("confirmno").focus();
    }

    document.getElementById("confirmgo").addEventListener("click", async () => {
      if (!pending || busy) return;
      const plan = pending;
      // The sheet STAYS OPEN for the round trip. It used to close first, so a
      // multi-hundred-ms Python call — a stash write, an os.replace, a full
      // re-enumeration of the store — ran with nothing on screen changing, and the
      // click read as having done nothing at all. `busy` does double duty: it dims
      // the controls here, and `closeConfirm` refuses while it is set, so Cancel,
      // Escape and the backdrop cannot pull the sheet (and `pending` with it) out
      // from under the call this handler is still awaiting.
      busy = true;
      revertBtn.disabled = true;
      const go = document.getElementById("confirmgo");
      const no = document.getElementById("confirmno");
      const err = document.getElementById("confirmerr");
      // The label is restored rather than recomputed: `askRevert` chose between
      // four wordings (delete/revert × permanent or not), and rebuilding that
      // decision here is how the two drift apart.
      const goLabel = go.textContent;
      go.disabled = no.disabled = true;
      go.textContent = plan.action === "delete" ? "Deleting…" : "Reverting…";
      err.hidden = true;
      // The plan's own id is echoed back — this action never picks a target —
      // and `confirm_unique` is the token the bridge demands before it will
      // destroy content that is in no checkpoint. Both are enforced in
      // annotate.py, not only here, so a second caller cannot inherit an
      // unguarded write.
      const out = await callHistory({
        action: "revert", version_id: plan.id,
        confirm_unique: !!plan.unique_current,
      });
      busy = false;
      go.disabled = no.disabled = false;
      go.textContent = goLabel;
      if (out.error || out.ok === false) {
        // renderHistory() REWRITES histNote from the timeline's own note, so it
        // has to run BEFORE the message lands — the other order set the text and
        // then wiped it, which turned every failed revert into a silent no-op
        // (found by clicking Revert in the running app and watching nothing
        // happen and nothing be said).
        renderHistory();
        setNote(out.error || "Revert failed.", true);
        // ...and the sheet stays OPEN with the reason in it. The note alone was
        // 11px, muted, at the bottom of the sidebar, and reached only by looking
        // away from the centered modal that had just vanished — so the reason a
        // destructive click was refused landed nowhere near the click. Nothing
        // changed on disk, so there is nothing to reload and no state to settle:
        // the same sheet, the same target, one more fact.
        err.textContent = out.error || "Revert failed.";
        err.hidden = false;
        return;
      }
      // Success: the target no longer exists in the form the sheet described, so
      // the sheet has nothing left to say. Closed HERE rather than before the
      // call — that ordering is the whole of the first fix above.
      closeConfirm();
      // Reload the framed view: it read the file at load, and a code editor is
      // holding a buffer that is now stale — leaving it would let its next save
      // write the pre-revert content straight back over the restore. Only the
      // frame, not this page — the frame's own load handler is per-document and
      // re-runs cleanly. (The shell may still reload the whole preview off its
      // own fs-event watch, since the target just changed on disk; that resets
      // the panel to its collapsed boot state, which is why the outcome is also
      // legible from the framed view itself rather than only from the note.)
      //
      // Covered across the reload. The framed document goes blank the instant this
      // fires and stays blank until its `load` handler runs `render()`, and the boot
      // skeleton had `remove()`d itself on the FIRST load — so the second time there
      // was no placeholder and the pins sat in stage coordinates over an empty page,
      // pointing at nothing.
      coverStage();
      try {
        frame.contentWindow.location.reload();
      } catch (e) {
        frame.src = frame.src; // torn-down frame — force it through the src
      }
      const outcome = (out.action === "delete"
        ? "File deleted."
        : "Reverted to " + plan.id.split("@")[1] + ".") +
        (out.stashed
          ? " Previous content kept in the .json sidecar."
          : " " + (out.stash_note || "No copy of the previous content was kept."));
      // Handed to the carry slot BEFORE the refresh, because the shell's
      // fs-event watch is already racing us: the target changed on disk, and the
      // whole preview can be torn down and rebooted at any moment from here on.
      // Written first, the outcome survives that; written after, it is lost
      // exactly when the reload is fastest.
      carryOutcome(outcome);
      // The fresh timeline rides back on the SAME response (computed after the
      // write, in annotate.py, from the module the bridge already holds), so the row
      // list stops showing the PRE-revert position for the length of a second round
      // trip — which is exactly the window in which the user is looking at it to see
      // whether the revert worked. It is always enriched there, hence the flag.
      //
      // `loadHistory` stays as the fallback for a field that is absent (an older
      // bridge) or a timeline computation that failed, and it keeps its own error
      // reporting: `reportOutcome(..., reloadErr)` is what says the panel on screen
      // is stale, and that sentence must not go missing just because the usual path
      // no longer needs a second call.
      let reloadErr = "";
      if (out.timeline) {
        timeline = out.timeline;
        enriched = true;
        renderHistory();
      } else {
        // The refresh must observe the POST-revert file, which it does because the
        // write completed before `callHistory` resolved — so the position marker
        // now points at the version just restored.
        //
        // `true`, not `enriched`: this stands in for a payload the bridge always
        // enriches, and `enriched` is the DISCLOSURE state — false whenever the panel
        // has not been expanded, which is the common case. An unenriched timeline
        // cannot see the did-not-exist boundary and so reports `at_earliest` a step
        // early (the same FH-3 trap the boot path documents), and the moment right
        // after a destructive write is the worst one to paint a panel that is a step
        // short of the truth. Whether a widget was open has no business deciding that.
        reloadErr = await loadHistory(true);
      }
      // loadHistory may itself have failed and written an error here. Reporting
      // plain success over it is the SAME write-order bug as the failure branch
      // above — fixed as a class, not as one instance: the outcome is real and
      // must be said, but it cannot erase the fact that the panel is now stale.
      reportOutcome(outcome, false, reloadErr);
      // ...and said once more where the eye actually is. #histnote is the durable
      // copy (and carries the stale-panel qualification above); this is the one the
      // user does not have to look away from the modal they just dismissed to find.
      showToast(outcome);
      // Displayed here, so the carry slot is spent — and nothing writes to it
      // after this point. That ordering is the whole lifetime rule: the reload
      // never arriving (an unwatched mount-backed file, the user navigating away,
      // the race simply lost) used to leave the note behind for the NEXT open of
      // the file to show as fresh news, and a failing refresh on a dying page
      // used to write it back after a newer boot had already consumed it.
      dropCarriedOutcome();
    });

    revertBtn.addEventListener("click", () => askRevert(null));

    // Boot. Without enrichment normally — filesystem-only enumeration, so this is
    // a directory listing and a few small reads, not a transcript parse — but an
    // EXPANDED panel restores expanded, and an expanded panel must be enriched or
    // its row count would disagree with the list it labels.
    //
    // This is also the far side of a revert: the shell reboots the whole preview
    // off its fs-event watch, and before this the panel came back collapsed with
    // the outcome gone, so a successful revert looked like nothing had happened.
    (async () => {
      const saved = histState();
      histOpen = !!saved.open;
      const carried = takeCarriedOutcome();
      const reloadErr = await loadHistory(histOpen);
      // Applied AFTER loadHistory, which rewrites this element from the
      // timeline's own note — the same ordering trap as everywhere else in this
      // panel, and composed through the same reporter so a failed refresh cannot
      // be hidden behind a carried success message.
      if (carried) reportOutcome(carried.text, false, reloadErr);
    })();

    window.addEventListener("resize", () => render());

    // Remount-safety relay: the shell flushes __fusedFlushEdits on the TOP
    // preview iframe before a mode switch — but in annotate mode the live
    // editor (if the framed view is the code template) sits one iframe
    // deeper. Delegate so leaving annotate can't discard unsaved edits.
    window.__fusedFlushEdits = async () => {
      try {
        const inner = frame.contentWindow && frame.contentWindow.__fusedFlushEdits;
        if (typeof inner === "function") return await inner();
      } catch (e) {
        /* cross-origin or torn-down frame — nothing to flush */
      }
      return { ok: true };
    };
    fused.params.onChange(() => {
      // A view change reframes the stage; a comments change just re-renders.
      const v = fused.params.get("view") || "";
      if (activeView && v && v !== activeView.mode) location.reload();
      else render();
    });

    // --- boot: pick which of the file's views to annotate --------------------
    (async () => {
      let stat;
      try {
        stat = await fused.stat(file);
      } catch (e) {
        document.body.innerHTML = `<div id="status" class="error">Cannot stat file.</div>`;
        return;
      }
      // Send to Claude only where the `claude` mode actually exists for this
      // file type — elsewhere the click would just fall back to the default
      // view and the review would appear to vanish. The chat view itself is
      // not an annotation surface, so it's excluded from the picker too.
      //
      // This test no longer measures what the button needs (D237). `claude` is
      // bound to every authored-file key again — it is the SURVIVING chat, the
      // former `claude_split`, renamed — so stat does report it and the button
      // is SHOWN, while the handoff's receiving half (`claudeComments` /
      // `claudeReturn`) was never built into that template: the click navigates
      // somewhere real and the review is dropped on arrival. The whole mode is
      // unreachable anyway — `annotate` holds zero registry keys since D235 —
      // which is why this is recorded here rather than repaired. Repairing it
      // means one of two things, and both are decisions: teach the chat to
      // receive a handoff, or test for a mode that *can* receive one instead of
      // for a mode that merely exists.
      const all = stat.templates || [];
      if (!all.some((t) => t.mode === "claude")) {
        document.getElementById("sidefoot").style.display = "none";
      }
      const views = all.filter((t) => t.mode !== OWN_NAME && t.mode !== "claude");
      if (!views.length) {
        document.body.innerHTML = `<div id="status" class="error">No annotatable view for this file.</div>`;
        return;
      }
      defaultViewMode = views[0].mode;
      const saved = fused.params.get("view");
      activeView = views.find((v) => v.mode === saved) || views[0];
      viewSel.innerHTML = views
        .map((v) => `<option value="${v.mode}"${v.mode === activeView.mode ? " selected" : ""}>${v.mode === "_render" ? "preview" : v.mode}</option>`)
        .join("");
      viewSel.hidden = views.length <= 1;
      viewSel.addEventListener("change", () => switchView(viewSel.value));
      frame.src =
        activeView.mode === "_render"
          ? "/render?path=" + encodeURIComponent(file)
          : "/render?path=" + encodeURIComponent(activeView.path) + "&_file=" + encodeURIComponent(file);
    })();
  </script>
</body>
</html>
