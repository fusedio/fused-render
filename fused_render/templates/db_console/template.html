<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DB Console</title>
<script src="/template-assets/codemirror.bundle.js"></script>
<script src="/template-shared/ro-badge.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #101318;
    --panel: #151920;
    --panel-2: #1a1f27;
    --rail: #12161c;
    --input: #11151a;
    --hover: #151a21;
    --detail: #12171e;
    --line: #2a303a;
    --line-soft: #202630;
    --text: #dce2ea;
    --strong: #f2f5f8;
    --muted: #8993a3;
    --faint: #5d6877;
    --accent: #55b8d2;
    --accent-dim: rgba(85, 184, 210, 0.13);
    --danger: #f06464;
    --warn: #e6b450;
    --ok: #63c088;
    --null: #6d7787;
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f7f8fa;
    --panel: #ffffff;
    --panel-2: #eef1f5;
    --rail: #f2f4f7;
    --input: #ffffff;
    --hover: #edf2f6;
    --detail: #f4f6f8;
    --line: #cfd5dd;
    --line-soft: #e1e5ea;
    --text: #202733;
    --strong: #101722;
    --muted: #5f6b7a;
    --faint: #7b8795;
    --accent: #147d99;
    --accent-dim: rgba(20, 125, 153, 0.11);
    --null: #9aa4b2;
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-size: 13px; overflow-x: hidden; }
  button, input, select, textarea { font: inherit; }
  button { color: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }

  .app { min-height: 100vh; display: grid; grid-template-columns: 268px minmax(0, 1fr); }
  .app.rail-collapsed { grid-template-columns: 44px minmax(0, 1fr); }
  .app.focus-mode { grid-template-columns: minmax(0, 1fr); }
  .app.focus-mode .rail { display: none; }
  .app.rail-collapsed .rail-inner, .app.rail-collapsed .brand-label, .app.rail-collapsed .theme-toggle { display: none; }
  .app.rail-collapsed .brand { justify-content: center; padding: 0; }

  .rail { position: sticky; top: 0; height: 100vh; overflow: auto; border-right: 1px solid var(--line); background: var(--rail); }

  .brand {
    height: 48px; display: flex; align-items: center; gap: 9px; padding: 0 14px;
    border-bottom: 1px solid var(--line); color: var(--strong);
    font-size: 11px; font-weight: 700; letter-spacing: 0.14em;
  }
  .brand-label { flex: 1; white-space: nowrap; }
  .rail-toggle, .theme-toggle {
    display: grid; place-items: center; padding: 0; border: 0; background: transparent;
    color: var(--muted); cursor: pointer;
  }
  .rail-toggle { width: 22px; height: 28px; }
  .theme-toggle { width: 26px; height: 26px; border: 1px solid var(--line); border-radius: 4px; font-size: 15px; }
  .rail-toggle:hover, .theme-toggle:hover { color: var(--accent); background: var(--accent-dim); }
  .brand-mark {
    width: 15px; height: 17px; display: block; border: 1.6px solid var(--accent);
    border-radius: 7px / 4px; position: relative;
  }
  .brand-mark::before {
    content: ""; position: absolute; left: -1.6px; right: -1.6px; top: 5px;
    height: 1.6px; background: var(--accent);
  }

  .rail-section { padding: 15px 13px; border-bottom: 1px solid var(--line-soft); }
  .rail-title {
    margin: 0 0 10px; color: var(--muted); font-size: 10px; font-weight: 700;
    letter-spacing: 0.11em; text-transform: uppercase; display: flex; align-items: center; gap: 6px;
  }
  .rail-title .spacer { flex: 1; }
  .mini-button {
    border: 1px solid var(--line); border-radius: 3px; background: var(--panel-2);
    color: var(--muted); cursor: pointer; font-size: 10px; padding: 2px 6px; letter-spacing: 0.04em;
  }
  .mini-button:hover { color: var(--accent); border-color: var(--muted); }

  .conn-list { display: grid; gap: 3px; }
  .conn-item {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px;
    width: 100%; border: 1px solid transparent; border-radius: 4px; background: transparent;
    padding: 6px 7px; cursor: pointer; text-align: left; color: var(--text);
  }
  .conn-item:hover { background: var(--hover); }
  .conn-item.active { border-color: var(--accent); background: var(--accent-dim); }
  .conn-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conn-item.active .conn-name { color: var(--strong); font-weight: 650; }
  .dialect-badge {
    font: 9px ui-monospace, monospace; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--accent); border: 1px solid var(--line); border-radius: 3px; padding: 1px 4px;
  }
  .connect-button { width: 100%; margin-top: 9px; }

  .conn-card .file-name { overflow: hidden; color: var(--strong); font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
  .conn-card .file-path { margin-top: 4px; overflow-wrap: anywhere; color: var(--faint); font-size: 11px; line-height: 1.45; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 7px 9px; margin: 12px 0 0; color: var(--muted); font-size: 11px; }
  .facts dt, .facts dd { margin: 0; }
  .facts dd { color: var(--text); text-align: right; }
  #ro-slot { margin-top: 10px; }

  .tree { display: grid; gap: 1px; }
  .tree-schema { margin-top: 4px; }
  .tree-schema:first-child { margin-top: 0; }
  .tree-schema-head {
    display: flex; align-items: center; gap: 6px; width: 100%; border: 0; background: transparent;
    color: var(--muted); cursor: pointer; padding: 4px 4px; text-align: left;
    font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .tree-schema-head:hover { color: var(--text); }
  .tree-caret { width: 9px; display: inline-block; color: var(--faint); }
  .tree-rel {
    display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 6px;
    width: 100%; border: 0; background: transparent; color: var(--text); cursor: pointer;
    padding: 4px 5px 4px 8px; text-align: left; border-radius: 3px;
  }
  .tree-rel:hover { background: var(--hover); }
  .tree-rel.active { background: var(--accent-dim); color: var(--strong); }
  .tree-icon { color: var(--faint); font: 9px ui-monospace, monospace; }
  .tree-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-count { color: var(--faint); font: 10px ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .tree-rel.view .tree-icon { color: var(--accent); }

  .workspace { min-width: 0; display: flex; flex-direction: column; height: 100vh; }

  .editor-panel { border-bottom: 1px solid var(--line); background: var(--panel); }
  .editor-bar {
    min-height: 44px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 12px;
    border-bottom: 1px solid var(--line-soft);
  }
  .editor-bar .spacer { flex: 1; }
  .editor-bar label { color: var(--muted); font-size: 11px; }
  .button {
    min-height: 30px; padding: 0 11px; border: 1px solid var(--line); border-radius: 3px;
    background: var(--panel-2); cursor: pointer; white-space: nowrap;
  }
  .button:hover:not(:disabled) { border-color: var(--muted); background: var(--hover); }
  .button:disabled { opacity: 0.38; cursor: default; }
  .run-button { border-color: #318da7; background: #287e97; color: #fff; font-weight: 600; }
  .run-button:hover:not(:disabled) { background: #3190aa; }
  .cancel-button[hidden] { display: none; }
  select.limit-select { min-height: 30px; padding: 0 6px; border: 1px solid var(--line); border-radius: 3px; background: var(--input); color: var(--text); }

  #editor { min-height: 92px; max-height: 320px; overflow: auto; }
  #editor .cm-editor { height: 100%; }
  #editor .cm-editor .cm-scroller { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; }
  :root[data-theme="light"] #editor .cm-editor { background: #fff; }

  .view-bar { height: 40px; display: flex; align-items: end; gap: 4px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .tab { height: 39px; padding: 0 12px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); cursor: pointer; }
  .tab:hover { color: var(--text); }
  .tab.active { border-bottom-color: var(--accent); color: var(--strong); }
  #result-summary { align-self: center; margin-left: auto; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .body { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  #notice-area { flex: 0 0 auto; }
  .notice {
    margin: 10px 12px 0; padding: 8px 10px; border: 1px solid #665322; border-radius: 3px;
    background: rgba(230, 180, 80, 0.08); color: #d9bf7b; font-size: 11px;
  }

  .hist-panel { flex: 0 0 auto; height: 92px; display: none; border-bottom: 1px solid var(--line); background: var(--rail); padding: 6px 10px; }
  .hist-panel.show { display: block; }
  #histogram { width: 100%; height: 100%; display: block; }

  .grid-scroll { flex: 1; min-height: 0; overflow: auto; }
  table.grid { border-collapse: collapse; width: 100%; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  table.grid th, table.grid td { border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); padding: 6px 9px; text-align: left; white-space: nowrap; max-width: 460px; overflow: hidden; text-overflow: ellipsis; }
  table.grid thead th { position: sticky; top: 0; z-index: 2; background: var(--panel-2); color: var(--strong); border-bottom: 1px solid var(--line); cursor: pointer; }
  table.grid thead th .col-type { display: block; color: var(--faint); font-size: 9px; font-weight: 400; letter-spacing: 0.03em; text-transform: uppercase; }
  table.grid thead th .sort-arrow { color: var(--accent); margin-left: 4px; }
  table.grid tbody tr:hover { background: var(--hover); }
  table.grid tbody tr.expanded { background: var(--panel-2); }
  td .cell-null { color: var(--null); font-style: italic; }
  td .cell-trunc { color: var(--warn); }
  .row-detail td { background: var(--detail); white-space: normal; max-width: none; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }

  .status { min-height: 220px; display: grid; place-content: center; gap: 10px; padding: 30px; color: var(--muted); text-align: center; }
  .status.error { color: var(--danger); }
  .status .actions { display: flex; gap: 8px; justify-content: center; }
  .status code { background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px; color: var(--accent); }

  .skel-bar { display: inline-block; border-radius: 3px; background: linear-gradient(90deg, var(--line-soft) 25%, var(--panel-2) 50%, var(--line-soft) 75%); background-size: 200% 100%; animation: skel-shimmer 1.2s ease-in-out infinite; }
  @keyframes skel-shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .skel-row td { background: var(--bg); }

  .pager { flex: 0 0 auto; min-height: 45px; display: flex; align-items: center; gap: 7px; padding: 7px 12px; border-top: 1px solid var(--line); background: var(--panel); }
  .pager[hidden] { display: none; }
  .page-position { margin-left: auto; color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Consolas, monospace; }

  .picker-overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; background: rgba(8, 11, 15, 0.55); }
  .picker-overlay[hidden] { display: none; }
  .picker { width: min(620px, 100%); display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.4); overflow: hidden; }
  .picker-head { display: flex; align-items: center; gap: 10px; padding: 13px 15px; border-bottom: 1px solid var(--line); }
  .picker-title { flex: 1; margin: 0; color: var(--strong); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .picker-close { width: 28px; height: 28px; border: 0; border-radius: 4px; background: transparent; color: var(--faint); font-size: 20px; cursor: pointer; }
  .picker-close:hover { color: var(--danger); background: var(--hover); }
  .picker-body { padding: 15px; display: grid; gap: 12px; }
  .picker-body label { color: var(--muted); font-size: 11px; display: block; margin-bottom: 5px; }
  .picker-input { width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 3px; background: var(--input); color: var(--strong); font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; }
  .picker-input::placeholder { color: var(--faint); }
  .picker-hint { color: var(--faint); font-size: 11px; line-height: 1.5; }
  .picker-error { color: var(--danger); font-size: 12px; }
  .picker-error[hidden] { display: none; }
  .picker-recent { display: grid; gap: 3px; }
  .picker-recent button { width: 100%; text-align: left; border: 1px solid var(--line-soft); border-radius: 3px; background: transparent; color: var(--text); cursor: pointer; padding: 6px 8px; font: 11px ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .picker-recent button:hover { background: var(--hover); border-color: var(--muted); }
  .picker-actions { display: flex; justify-content: flex-end; gap: 8px; }

  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    .workspace { height: auto; }
    .grid-scroll { max-height: 60vh; }
  }
</style>
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="brand">
        <button class="rail-toggle" id="rail-toggle" type="button" title="Collapse rail" aria-label="Collapse rail" aria-pressed="false">
          <span class="brand-mark" aria-hidden="true"></span>
        </button>
        <span class="brand-label">DB CONSOLE</span>
        <button class="theme-toggle" id="theme-toggle" type="button" title="Switch to dark mode" aria-label="Switch to dark mode">&#9680;</button>
      </div>
      <div class="rail-inner">
        <section class="rail-section">
          <h2 class="rail-title">Connections</h2>
          <div class="conn-list" id="conn-list"></div>
          <button class="button connect-button" id="connect-open" type="button">Connect&hellip;</button>
        </section>
        <section class="rail-section conn-card" id="conn-card" hidden>
          <h2 class="rail-title">Active connection</h2>
          <div class="file-name" id="ac-name"></div>
          <div class="file-path" id="ac-url"></div>
          <dl class="facts" id="ac-facts"></dl>
          <div id="ro-slot"><span id="ro" hidden></span></div>
        </section>
        <section class="rail-section">
          <h2 class="rail-title"><span>Schema</span><span class="spacer"></span><button class="mini-button" id="refresh-schema" type="button">Refresh</button></h2>
          <div class="tree" id="schema-tree"></div>
        </section>
      </div>
    </aside>

    <main class="workspace">
      <section class="editor-panel">
        <div class="editor-bar">
          <button class="button run-button" id="run" type="button">Run</button>
          <button class="button cancel-button" id="cancel" type="button" hidden>Cancel</button>
          <span class="spacer"></span>
          <label for="limit">Rows</label>
          <select class="limit-select" id="limit">
            <option>100</option><option>250</option><option>500</option><option>1000</option>
          </select>
        </div>
        <div id="editor"></div>
      </section>

      <nav class="view-bar" aria-label="Result view">
        <button class="tab active" id="tab-results" type="button">Results</button>
        <button class="tab" id="tab-columns" type="button">Columns</button>
        <button class="tab" id="tab-history" type="button">History</button>
        <span id="result-summary"></span>
      </nav>

      <div class="body">
        <div id="notice-area"></div>
        <section class="hist-panel" id="hist-panel"><canvas id="histogram"></canvas></section>
        <div class="grid-scroll" id="grid-scroll" aria-live="polite"></div>
        <footer class="pager" id="pager" hidden>
          <button class="button" id="prev-page" type="button">Previous</button>
          <button class="button" id="next-page" type="button">Next</button>
          <span class="page-position" id="page-position"></span>
        </footer>
      </div>
    </main>
  </div>

  <div class="picker-overlay" id="picker-overlay" hidden>
    <div class="picker" role="dialog" aria-modal="true" aria-label="Connect to a database">
      <div class="picker-head">
        <h2 class="picker-title">Connect to a database</h2>
        <button class="picker-close" id="picker-close" type="button" aria-label="Close">&times;</button>
      </div>
      <form class="picker-body" id="picker-form">
        <div>
          <label for="picker-url">Connection string</label>
          <input class="picker-input" id="picker-url" spellcheck="false" autocomplete="off" placeholder="postgresql://user:pass@host:5432/db" />
          <div class="picker-hint">Posted to the local daemon &mdash; never placed in the page URL. Postgres, MySQL, MSSQL, DuckDB and SQLite drivers are bundled.</div>
        </div>
        <div>
          <label for="picker-file">&hellip; or a file path (.dbconn / .sqlite / .duckdb)</label>
          <input class="picker-input" id="picker-file" spellcheck="false" autocomplete="off" placeholder="C:\data\app.sqlite  or  ~/db/local_demo.dbconn" />
        </div>
        <div class="picker-recent" id="picker-recent"></div>
        <div class="picker-error" id="picker-error" hidden></div>
        <div class="picker-actions">
          <button class="button run-button" type="submit">Connect</button>
        </div>
      </form>
    </div>
  </div>

<script>
  const HEX64 = /^[0-9a-f]{64}$/i;
  const SQL_MAX = 2048;

  const app = document.querySelector(".app");
  const railToggle = document.getElementById("rail-toggle");
  const themeToggle = document.getElementById("theme-toggle");
  const connList = document.getElementById("conn-list");
  const connectOpen = document.getElementById("connect-open");
  const connCard = document.getElementById("conn-card");
  const acName = document.getElementById("ac-name");
  const acUrl = document.getElementById("ac-url");
  const acFacts = document.getElementById("ac-facts");
  const schemaTree = document.getElementById("schema-tree");
  const refreshSchema = document.getElementById("refresh-schema");
  const runBtn = document.getElementById("run");
  const cancelBtn = document.getElementById("cancel");
  const limitSel = document.getElementById("limit");
  const editorHost = document.getElementById("editor");
  const tabResults = document.getElementById("tab-results");
  const tabColumns = document.getElementById("tab-columns");
  const tabHistory = document.getElementById("tab-history");
  const resultSummary = document.getElementById("result-summary");
  const noticeArea = document.getElementById("notice-area");
  const histPanel = document.getElementById("hist-panel");
  const histCanvas = document.getElementById("histogram");
  const gridScroll = document.getElementById("grid-scroll");
  const pager = document.getElementById("pager");
  const prevPage = document.getElementById("prev-page");
  const nextPage = document.getElementById("next-page");
  const pagePosition = document.getElementById("page-position");
  const pickerOverlay = document.getElementById("picker-overlay");
  const pickerClose = document.getElementById("picker-close");
  const pickerForm = document.getElementById("picker-form");
  const pickerUrl = document.getElementById("picker-url");
  const pickerFile = document.getElementById("picker-file");
  const pickerRecent = document.getElementById("picker-recent");
  const pickerError = document.getElementById("picker-error");

  let daemon = null;
  let conns = [];
  let active = null;         // active connection record
  let schema = null;
  let lastResult = null;     // { query_id, columns, types, rows, more, browse }
  let editor = null;
  let generation = 0;
  let running = false;
  let queryId = null;

  function escapeHtml(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function number(v, f = 0) { const n = Number(v); return Number.isFinite(n) ? n : f; }
  function formatCount(v) { return number(v).toLocaleString(); }
  function errorMessage(e) { return e ? (e.message || e.error || e.detail || String(e)) : "Unknown error"; }
  function looksLikePath(v) { return /[\\/]/.test(v) || /\.(dbconn|sqlite|sqlite3|db|duckdb|ddb)$/i.test(v); }

  function currentState() {
    return {
      conn: fused.params.get("conn") || fused.params.get("_file") || "",
      schema: fused.params.get("schema") || "",
      table: fused.params.get("table") || "",
      sql: fused.params.get("sql") || "",
      view: ["columns", "history"].includes(fused.params.get("view")) ? fused.params.get("view") : "results",
      page: Math.max(0, number(fused.params.get("page"), 0)),
      sort: fused.params.get("sort") || "",
      limit: [100, 250, 500, 1000].includes(number(fused.params.get("limit"))) ? number(fused.params.get("limit")) : 100,
      theme: fused.params.get("theme") === "dark" ? "dark" : "light",
      focus: fused.params.get("focus") === "1",
      rail: fused.params.get("rail") !== "0"
    };
  }
  function setParams(values) {
    for (const [k, v] of Object.entries(values)) {
      const next = String(v);
      if ((fused.params.get(k) || "") !== next) fused.params.set(k, next);
    }
  }

  // ---------------- daemon wiring ----------------
  async function ensureDaemon() {
    if (daemon && daemon.port) return daemon;
    const r = await fused.runPython("./server.py", {}).catch(() => null);
    if (r && r.port) daemon = r;
    else throw new Error((r && r.error) || "Could not start the database daemon.");
    return daemon;
  }
  function dURL(path) {
    const sep = path.includes("?") ? "&" : "?";
    return `http://127.0.0.1:${daemon.port}${path}${sep}t=${encodeURIComponent(daemon.token || "")}`;
  }
  async function apiGet(path) {
    await ensureDaemon();
    const res = await fetch(dURL(path));
    const data = await res.json();
    if (data && data.error && !data.available) throw data;
    return data;
  }
  async function apiPost(path, body) {
    await ensureDaemon();
    const res = await fetch(dURL(path), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {})
    });
    return res.json();
  }

  // ---------------- history (per display URL, localStorage) ----------------
  function historyKey() { return "dbconsole:hist:" + (active ? active.display_url : "none"); }
  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(historyKey()) || "[]"); } catch (_) { return []; }
  }
  function pushHistory(sql) {
    if (!active || !sql.trim()) return;
    const list = loadHistory().filter((s) => s !== sql);
    list.unshift(sql);
    try { localStorage.setItem(historyKey(), JSON.stringify(list.slice(0, 100))); } catch (_) {}
  }

  // ---------------- connection resolution ----------------
  async function resolveConnection(state) {
    if (!state.conn) { active = null; return; }
    if (HEX64.test(state.conn)) {
      const data = await apiGet("/conns");
      conns = data.conns || [];
      active = conns.find((c) => c.conn_id === state.conn) || null;
      return;
    }
    // conn is a file path (.dbconn / .sqlite / .duckdb) — reconnect silently.
    const result = await apiPost("/connect", { file: state.conn });
    if (result.available === false || result.error) { active = { pending: result, path: state.conn }; return; }
    await refreshConns();
    active = conns.find((c) => c.conn_id === result.conn_id) || result;
    if (fused.params.get("conn") !== result.conn_id && HEX64.test(result.conn_id)) {
      // keep the opaque id in the URL, but preserve the original _file dispatch.
      if (!fused.params.get("_file")) setParams({ conn: result.conn_id });
    }
  }
  async function refreshConns() {
    const data = await apiGet("/conns").catch(() => ({ conns: [] }));
    conns = data.conns || [];
  }

  // ---------------- rendering: rail ----------------
  function renderConns() {
    connList.innerHTML = conns.length ? conns.map((c) => `
      <button class="conn-item ${active && c.conn_id === active.conn_id ? "active" : ""}" type="button" data-conn="${escapeHtml(c.conn_id)}" title="${escapeHtml(c.display_url)}">
        <span class="conn-name">${escapeHtml(c.name || c.display_url)}</span>
        <span class="dialect-badge">${escapeHtml(c.dialect)}</span>
      </button>`).join("") : `<div class="picker-hint">No active connections.</div>`;
  }
  function renderConnCard() {
    if (!active || active.pending || !active.conn_id) { connCard.hidden = true; return; }
    connCard.hidden = false;
    acName.textContent = active.name || "(database)";
    acName.title = active.display_url || "";
    acUrl.textContent = active.display_url || "";
    const rels = schema ? schema.schemas.reduce((n, s) => n + s.relations.length, 0) : 0;
    const views = schema ? schema.schemas.reduce((n, s) => n + s.relations.filter((r) => r.kind === "view").length, 0) : 0;
    acFacts.innerHTML = `
      <dt>Dialect</dt><dd>${escapeHtml(active.dialect || "")}</dd>
      <dt>Server</dt><dd>${escapeHtml(active.server_version || "-")}</dd>
      <dt>Tables</dt><dd>${formatCount(rels - views)}</dd>
      <dt>Views</dt><dd>${formatCount(views)}</dd>`;
    fusedRoBadge.update(document.getElementById("ro"),
      active.readonly ? "Read-only" : "",
      "This connection is opened read-only. File-backed databases open read-only by default.");
  }
  function renderSchema(state) {
    if (!schema) { schemaTree.innerHTML = active ? `<div class="picker-hint">Loading schema&hellip;</div>` : ""; return; }
    schemaTree.innerHTML = schema.schemas.map((s) => {
      const open = !s.schema || s.schema === schema.default_schema || s.relations.length <= 40;
      const rows = s.relations.map((r) => {
        const isActive = state.table === r.name && (state.schema || "") === (s.schema || "");
        const count = r.rows == null ? "" : `<span class="tree-count">${formatCount(r.rows)}</span>`;
        return `<button class="tree-rel ${r.kind} ${isActive ? "active" : ""}" type="button" data-rel="${escapeHtml(r.name)}" data-schema="${escapeHtml(s.schema || "")}">
          <span class="tree-icon">${r.kind === "view" ? "◇" : "▤"}</span>
          <span class="tree-name" title="${escapeHtml(r.name)}">${escapeHtml(r.name)}</span>${count}
        </button>`;
      }).join("");
      const head = s.schema ? `<button class="tree-schema-head" type="button" data-schema-toggle="${escapeHtml(s.schema)}">
        <span class="tree-caret">${open ? "▾" : "▸"}</span>${escapeHtml(s.schema)}</button>` : "";
      return `<div class="tree-schema">${head}<div class="tree-rels" ${open ? "" : "hidden"}>${rows}</div></div>`;
    }).join("");
  }

  // ---------------- rendering: grid ----------------
  function renderCell(v) {
    if (v === null || v === undefined) return `<span class="cell-null">NULL</span>`;
    if (v && typeof v === "object" && "_trunc" in v) {
      return `${escapeHtml(v.v)}<span class="cell-trunc" title="${formatCount(v._trunc)} chars — click row to expand">…</span>`;
    }
    return escapeHtml(typeof v === "object" ? JSON.stringify(v) : v);
  }
  function sortState() { try { return JSON.parse(currentState().sort || "null"); } catch (_) { return null; } }

  function renderResults(result, state, browse) {
    lastResult = Object.assign({ browse }, result);
    const cols = result.columns || [];
    const rows = result.rows || [];
    const sort = browse ? sortState() : null;
    if (!cols.length && !rows.length) {
      gridScroll.innerHTML = `<div class="status"><strong>Statement complete</strong><span>${formatCount(result.rowcount || 0)} rows affected${result.duration_ms != null ? ` · ${result.duration_ms} ms` : ""}</span></div>`;
      pager.hidden = true;
      resultSummary.textContent = "OK";
      return;
    }
    const head = cols.map((c, i) => {
      const type = (result.types && result.types[i]) ? `<span class="col-type">${escapeHtml(result.types[i])}</span>` : "";
      const arrow = sort && sort.column === c ? `<span class="sort-arrow">${sort.dir === "desc" ? "↓" : "↑"}</span>` : "";
      return `<th data-col="${escapeHtml(c)}" title="${escapeHtml(c)}">${escapeHtml(c)}${arrow}${type}</th>`;
    }).join("");
    const body = rows.map((row, ri) => {
      const cells = row.map((v) => `<td>${renderCell(v)}</td>`).join("");
      return `<tr data-row="${ri}">${cells}</tr>`;
    }).join("");
    gridScroll.innerHTML = `<table class="grid"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;

    if (browse) {
      const total = result.total_rows || 0;
      const start = (result.offset || 0);
      resultSummary.textContent = `${formatCount(total)} rows`;
      pager.hidden = false;
      prevPage.disabled = start <= 0;
      nextPage.disabled = start + rows.length >= total;
      pagePosition.textContent = `${formatCount(start + 1)}–${formatCount(start + rows.length)} of ${formatCount(total)}`;
    } else {
      resultSummary.textContent = `${formatCount(rows.length)} rows${result.more ? "+" : ""}${result.duration_ms != null ? ` · ${result.duration_ms} ms` : ""}`;
      pager.hidden = !result.more && state.page <= 0;
      prevPage.disabled = true;
      nextPage.disabled = !result.more;
      pagePosition.textContent = result.more ? "more rows available" : "end of result";
    }
  }

  function renderColumns() {
    pager.hidden = true;
    const state = currentState();
    let cols = [];
    if (state.table && schema) {
      const s = schema.schemas.find((x) => (x.schema || "") === (state.schema || ""));
      const rel = s && s.relations.find((r) => r.name === state.table);
      if (rel) cols = rel.columns.map((c) => ({ name: c.name, type: c.type, nullable: c.nullable, pk: c.pk }));
    }
    if (!cols.length && lastResult) cols = (lastResult.columns || []).map((c, i) => ({ name: c, type: (lastResult.types || [])[i] || "", nullable: true, pk: false }));
    if (!cols.length) { gridScroll.innerHTML = `<div class="status"><span>No columns to show. Run a query or pick a table.</span></div>`; resultSummary.textContent = ""; return; }
    resultSummary.textContent = `${formatCount(cols.length)} columns`;
    const body = cols.map((c) => `<tr>
      <td>${escapeHtml(c.name)}${c.pk ? ` <span class="dialect-badge">PK</span>` : ""}</td>
      <td>${escapeHtml(c.type)}</td>
      <td>${c.nullable ? "" : "NOT NULL"}</td></tr>`).join("");
    gridScroll.innerHTML = `<table class="grid"><thead><tr><th>Column</th><th>Type</th><th>Nullable</th></tr></thead><tbody>${body}</tbody></table>`;
  }

  function renderHistory() {
    pager.hidden = true;
    const list = loadHistory();
    resultSummary.textContent = `${formatCount(list.length)} statements`;
    if (!list.length) { gridScroll.innerHTML = `<div class="status"><span>No query history for this connection yet.</span></div>`; return; }
    gridScroll.innerHTML = `<table class="grid"><tbody>${list.map((s) => `
      <tr class="hist-row" data-sql="${escapeHtml(s)}"><td style="white-space:normal;max-width:none">${escapeHtml(s)}</td></tr>`).join("")}</tbody></table>`;
  }

  function skeletonGrid() {
    const cols = lastResult && lastResult.columns ? lastResult.columns.length : 4;
    const w = ["70%", "50%", "84%", "44%", "62%"];
    const head = Array.from({ length: cols }, () => `<th><span class="skel-bar" style="width:60%;height:10px"></span></th>`).join("");
    const body = Array.from({ length: 8 }, () => `<tr class="skel-row">${Array.from({ length: cols }, (_, i) => `<td><span class="skel-bar" style="width:${w[i % w.length]};height:10px"></span></td>`).join("")}</tr>`).join("");
    gridScroll.innerHTML = `<table class="grid"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
  }

  function renderReconnect(state) {
    connCard.hidden = true;
    schemaTree.innerHTML = "";
    pager.hidden = true;
    resultSummary.textContent = "";
    const p = active && active.pending;
    if (p && p.available === false) {
      gridScroll.innerHTML = `<div class="status">
        <strong>Driver not installed</strong>
        <span>This <code>${escapeHtml(p.dialect || "")}</code> connection needs <code>${escapeHtml(p.missing)}</code>. ${escapeHtml(p.hint || "")}</span>
        <div class="actions"><button class="button run-button" id="install-driver" data-name="${escapeHtml(p.dialect)}" type="button">Install ${escapeHtml(p.missing)}</button></div></div>`;
      return;
    }
    if (p && p.error) {
      gridScroll.innerHTML = `<div class="status error"><strong>Could not connect</strong><span>${escapeHtml(errorMessage(p))}</span>
        <div class="actions"><button class="button" id="open-connect" type="button">Connect…</button></div></div>`;
      return;
    }
    gridScroll.innerHTML = `<div class="status"><strong>Connection not available</strong>
      <span>The daemon may have restarted. Reconnect to continue.</span>
      <div class="actions"><button class="button run-button" id="open-connect" type="button">Connect…</button></div></div>`;
  }

  function noConnection() {
    connCard.hidden = true;
    schemaTree.innerHTML = "";
    pager.hidden = true;
    resultSummary.textContent = "No connection";
    gridScroll.innerHTML = `<div class="status"><strong>No database connected</strong>
      <span>Use <em>Connect…</em> to paste a connection string or open a <code>.dbconn</code> / <code>.sqlite</code> / <code>.duckdb</code> file.</span>
      <div class="actions"><button class="button run-button" id="open-connect" type="button">Connect…</button></div></div>`;
  }

  // ---------------- editor ----------------
  const SQL_KEYWORDS = new Set(("select from where group by order having limit offset join left right full inner outer cross on using as and or not null is in like ilike between union all distinct insert into update delete create table view index drop alter add column primary key foreign references default values set desc asc count sum avg min max case when then else end with over partition returning cast exists").split(" "));
  function sqlMode() {
    return CM.StreamLanguage.define({
      startState() { return { block: false }; },
      token(stream, state) {
        if (state.block) { if (stream.match(/.*?\*\//)) state.block = false; else stream.skipToEnd(); return "comment"; }
        if (stream.eatSpace()) return null;
        if (stream.match(/--.*/)) return "comment";
        if (stream.match(/\/\*/)) { state.block = true; return "comment"; }
        if (stream.match(/'([^']|'')*'/)) return "string";
        if (stream.match(/"([^"]|"")*"/)) return "string";
        if (stream.match(/\d+(\.\d+)?/)) return "number";
        const w = stream.match(/[A-Za-z_][\w$]*/);
        if (w) return SQL_KEYWORDS.has(w[0].toLowerCase()) ? "keyword" : "variableName";
        stream.next();
        return null;
      }
    });
  }
  function buildEditor(initial) {
    editor = new CM.EditorView({
      doc: initial || "",
      extensions: [CM.basicSetup, CM.oneDark, sqlMode(),
        CM.EditorView.updateListener.of((u) => { if (u.docChanged) scheduleSqlSync(); })],
      parent: editorHost
    });
    editor.dom.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); runQuery(); }
    });
  }
  function editorText() { return editor ? editor.state.doc.toString() : ""; }
  function setEditorText(text) {
    if (!editor) return;
    if (editor.state.doc.toString() === text) return;
    editor.dispatch({ changes: { from: 0, to: editor.state.doc.length, insert: text || "" } });
  }
  let sqlSyncTimer = null;
  function scheduleSqlSync() {
    clearTimeout(sqlSyncTimer);
    sqlSyncTimer = setTimeout(() => {
      const text = editorText();
      if (text.length <= SQL_MAX) setParams({ sql: text }); // longer stays session-only
      else if (fused.params.get("sql")) fused.params.set("sql", "");
    }, 400);
  }

  // ---------------- query / browse ----------------
  async function runQuery() {
    if (!active || active.pending || !active.conn_id) { openPicker(); return; }
    const sql = editorText().trim();
    if (!sql) return;
    const state = currentState();
    const request = ++generation;
    queryId = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now() + Math.random());
    running = true;
    runBtn.disabled = true;
    cancelBtn.hidden = false;
    setParams({ table: "", sort: "", page: "0", view: "results" });
    skeletonGrid();
    resultSummary.textContent = "Running…";
    try {
      const data = await apiPost(`/query?c=${encodeURIComponent(active.conn_id)}`, {
        sql, limit: state.limit, query_id: queryId
      });
      if (request !== generation) return;
      if (data.cancelled) { setError({ type: data.type, message: data.message }); return; }
      if (data.error) { setError(data); return; }
      pushHistory(sql);
      renderResults(data, state, false);
      maybeHistogram(data);
    } catch (err) {
      if (request === generation) setError(err);
    } finally {
      if (request === generation) { running = false; runBtn.disabled = false; cancelBtn.hidden = true; }
    }
  }

  async function cancelQuery() {
    if (!queryId || !active) return;
    await apiPost(`/cancel?c=${encodeURIComponent(active.conn_id)}`, { query_id: queryId }).catch(() => {});
    running = false; runBtn.disabled = false; cancelBtn.hidden = true;
    resultSummary.textContent = "Cancelled";
  }

  async function loadBrowse(state) {
    const request = ++generation;
    skeletonGrid();
    resultSummary.textContent = "Loading…";
    const q = new URLSearchParams({
      c: active.conn_id, schema: state.schema, name: state.table,
      offset: String(state.page * state.limit), limit: String(state.limit),
      sort: state.sort || "null", filters: "[]"
    });
    try {
      const data = await apiGet(`/table?${q.toString()}`);
      if (request !== generation) return;
      if (data.error) { setError(data); return; }
      renderResults(data, state, true);
    } catch (err) {
      if (request === generation) setError(err);
    }
  }

  async function fetchMore() {
    if (!lastResult || lastResult.browse || !lastResult.more || !active) return;
    const data = await apiGet(`/fetch?c=${encodeURIComponent(active.conn_id)}&query_id=${encodeURIComponent(lastResult.query_id)}&n=${currentState().limit}`);
    if (data.error) { setError(data); return; }
    const cols = lastResult.columns;
    const body = (data.rows || []).map((row) => `<tr>${row.map((v) => `<td>${renderCell(v)}</td>`).join("")}</tr>`).join("");
    const tbody = gridScroll.querySelector("tbody");
    if (tbody) tbody.insertAdjacentHTML("beforeend", body);
    lastResult.rows = lastResult.rows.concat(data.rows || []);
    lastResult.more = data.more;
    nextPage.disabled = !data.more;
    resultSummary.textContent = `${formatCount(lastResult.rows.length)} rows${data.more ? "+" : ""}`;
    pagePosition.textContent = data.more ? "more rows available" : "end of result";
  }

  function setError(error) {
    pager.hidden = true;
    resultSummary.textContent = error && error.type === "timeout" ? "Cancelled" : "Query failed";
    const type = error && error.type ? `<strong>${escapeHtml(error.type)}</strong>` : "<strong>Error</strong>";
    gridScroll.innerHTML = `<div class="status error">${type}<span>${escapeHtml(errorMessage(error))}</span></div>`;
  }

  // ---------------- optional histogram ----------------
  async function maybeHistogram(result) {
    histPanel.classList.remove("show");
    const state = currentState();
    if (!state.table) return;
    const s = schema && schema.schemas.find((x) => (x.schema || "") === (state.schema || ""));
    const rel = s && s.relations.find((r) => r.name === state.table);
    const timeCol = rel && rel.columns.find((c) => /date|time|timestamp/i.test(c.type));
    if (!timeCol) return;
    const q = new URLSearchParams({ c: active.conn_id, schema: state.schema, name: state.table, column: timeCol.name });
    const data = await apiGet(`/histogram?${q.toString()}`).catch(() => null);
    if (!data || !data.available || !data.buckets || !data.buckets.length) return;
    drawHistogram(data.buckets);
    histPanel.classList.add("show");
  }
  function drawHistogram(buckets) {
    const ctx = histCanvas.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const rect = histCanvas.getBoundingClientRect();
    histCanvas.width = Math.max(1, rect.width * dpr);
    histCanvas.height = Math.max(1, rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const styles = getComputedStyle(document.documentElement);
    ctx.clearRect(0, 0, rect.width, rect.height);
    const peak = Math.max(1, ...buckets.map((b) => b.count));
    const slot = rect.width / buckets.length;
    ctx.fillStyle = styles.getPropertyValue("--accent").trim();
    buckets.forEach((b, i) => {
      const h = (b.count / peak) * (rect.height - 6);
      ctx.fillRect(i * slot + 1, rect.height - h, Math.max(1, slot - 2), h);
    });
  }

  // ---------------- connect modal ----------------
  function renderRecent() {
    let recent = [];
    try { recent = JSON.parse(localStorage.getItem("dbconsole:recent") || "[]"); } catch (_) {}
    pickerRecent.innerHTML = recent.length
      ? `<label>Recent</label>` + recent.map((r) => `<button type="button" data-recent="${escapeHtml(r.conn || r.display)}" title="${escapeHtml(r.display)}">${escapeHtml(r.display)}</button>`).join("")
      : "";
  }
  function rememberRecent(rec) {
    let recent = [];
    try { recent = JSON.parse(localStorage.getItem("dbconsole:recent") || "[]"); } catch (_) {}
    recent = recent.filter((r) => r.conn !== rec.conn);
    recent.unshift(rec);
    try { localStorage.setItem("dbconsole:recent", JSON.stringify(recent.slice(0, 12))); } catch (_) {}
  }
  function openPicker() {
    pickerOverlay.hidden = false;
    pickerUrl.value = "";
    pickerFile.value = "";
    pickerError.hidden = true;
    renderRecent();
    pickerUrl.focus();
  }
  function closePicker() { pickerOverlay.hidden = true; }
  function showPickerError(msg) { pickerError.textContent = msg; pickerError.hidden = false; }

  async function doConnect(body, displayFallback) {
    const result = await apiPost("/connect", body);
    if (result.available === false) {
      // surface the missing-driver card in the main area
      active = { pending: result, path: body.file || body.url };
      closePicker();
      setParams({ conn: body.file || "", sql: "" });
      render();
      return;
    }
    if (result.error) { showPickerError(errorMessage(result)); return; }
    await refreshConns();
    rememberRecent({ conn: body.file ? body.file : result.conn_id, display: result.display_url });
    closePicker();
    setParams({ conn: body.file ? body.file : result.conn_id, schema: "", table: "", sql: "", page: "0", view: "results" });
  }

  // ---------------- main render ----------------
  function renderChrome(state) {
    document.documentElement.dataset.theme = state.theme;
    app.classList.toggle("rail-collapsed", !state.rail);
    app.classList.toggle("focus-mode", state.focus);
    railToggle.setAttribute("aria-pressed", String(!state.rail));
    themeToggle.title = state.theme === "light" ? "Switch to dark mode" : "Switch to light mode";
    themeToggle.setAttribute("aria-label", themeToggle.title);
    limitSel.value = String(state.limit);
    tabResults.classList.toggle("active", state.view === "results");
    tabColumns.classList.toggle("active", state.view === "columns");
    tabHistory.classList.toggle("active", state.view === "history");
    runBtn.disabled = running || !active || active.pending;
    cancelBtn.hidden = !running;
  }

  function render() {
    const state = currentState();
    renderChrome(state);
    renderConns();
    if (!active) { noConnection(); return; }
    if (active.pending || !active.conn_id) { renderReconnect(state); return; }
    renderConnCard();
    renderSchema(state);
    if (state.view === "columns") { renderColumns(); return; }
    if (state.view === "history") { renderHistory(); return; }
    if (state.table) { loadBrowse(state); return; }
    if (lastResult && !lastResult.browse) { renderResults(lastResult, state, false); return; }
    gridScroll.innerHTML = `<div class="status"><span>Write SQL and press <strong>Run</strong> (or Ctrl/Cmd+Enter), or pick a table from the schema tree.</span></div>`;
    resultSummary.textContent = "";
    pager.hidden = true;
  }

  async function load() {
    const state = currentState();
    fused.autoReload(!looksLikePath(state.conn) || (fused.params.get("_file") || "") === state.conn);
    renderChrome(state);
    setEditorText(state.sql);
    try {
      await ensureDaemon();
      const prev = active && active.conn_id;
      await resolveConnection(state);
      if (active && active.conn_id && active.conn_id !== prev) {
        schema = null;
        renderConnCard();
        renderSchema(state);
        schema = await apiGet(`/schema?c=${encodeURIComponent(active.conn_id)}`).catch(() => null);
      }
      render();
    } catch (err) {
      setError(err);
    }
  }

  // ---------------- events ----------------
  railToggle.addEventListener("click", () => setParams({ rail: currentState().rail ? "0" : "1" }));
  themeToggle.addEventListener("click", () => setParams({ theme: currentState().theme === "light" ? "dark" : "light" }));
  connectOpen.addEventListener("click", openPicker);
  pickerClose.addEventListener("click", closePicker);
  pickerOverlay.addEventListener("mousedown", (e) => { if (e.target === pickerOverlay) closePicker(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !pickerOverlay.hidden) closePicker(); });

  pickerForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    pickerError.hidden = true;
    const url = pickerUrl.value.trim();
    const file = pickerFile.value.trim();
    if (!url && !file) { showPickerError("Enter a connection string or a file path."); return; }
    try { await doConnect(file ? { file } : { url }); }
    catch (err) { showPickerError(errorMessage(err)); }
  });

  pickerRecent.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-recent]");
    if (!b) return;
    const v = b.dataset.recent;
    try { await doConnect(looksLikePath(v) ? { file: v } : { url: v }); }
    catch (err) { showPickerError(errorMessage(err)); }
  });

  connList.addEventListener("click", (e) => {
    const b = e.target.closest("[data-conn]");
    if (b) setParams({ conn: b.dataset.conn, schema: "", table: "", sql: "", page: "0", view: "results" });
  });

  schemaTree.addEventListener("click", (e) => {
    const toggle = e.target.closest("[data-schema-toggle]");
    if (toggle) {
      const rels = toggle.parentElement.querySelector(".tree-rels");
      const caret = toggle.querySelector(".tree-caret");
      rels.hidden = !rels.hidden;
      caret.textContent = rels.hidden ? "▸" : "▾";
      return;
    }
    const rel = e.target.closest("[data-rel]");
    if (rel) setParams({ table: rel.dataset.rel, schema: rel.dataset.schema, page: "0", sort: "", view: "results" });
  });

  refreshSchema.addEventListener("click", async () => {
    if (!active || !active.conn_id) return;
    schema = await apiGet(`/schema?c=${encodeURIComponent(active.conn_id)}&refresh=1`).catch(() => schema);
    render();
  });

  gridScroll.addEventListener("click", (e) => {
    const install = e.target.closest("#install-driver");
    if (install) return installDriver(install.dataset.name);
    if (e.target.closest("#open-connect")) return openPicker();
    const th = e.target.closest("thead th[data-col]");
    if (th && lastResult && lastResult.browse) {
      const col = th.dataset.col;
      const sort = sortState();
      const dir = sort && sort.column === col && sort.dir === "asc" ? "desc" : "asc";
      setParams({ sort: JSON.stringify({ column: col, dir }), page: "0" });
      return;
    }
    const histRow = e.target.closest(".hist-row");
    if (histRow) { setEditorText(histRow.dataset.sql); setParams({ view: "results", sql: histRow.dataset.sql.slice(0, SQL_MAX) }); return; }
    const tr = e.target.closest("tbody tr[data-row]");
    if (tr && lastResult && !tr.classList.contains("row-detail")) toggleRowDetail(tr);
  });

  function toggleRowDetail(tr) {
    const next = tr.nextElementSibling;
    if (next && next.classList.contains("row-detail")) { next.remove(); tr.classList.remove("expanded"); return; }
    const ri = number(tr.dataset.row);
    const row = lastResult.rows[ri] || [];
    const cols = lastResult.columns || [];
    const kv = cols.map((c, i) => {
      const v = row[i];
      const disp = v && typeof v === "object" && "_trunc" in v ? escapeHtml(v.v) + "…" : renderCell(v);
      return `<dt>${escapeHtml(c)}</dt><dd>${disp}</dd>`;
    }).join("");
    tr.classList.add("expanded");
    tr.insertAdjacentHTML("afterend", `<tr class="row-detail"><td colspan="${cols.length}"><dl class="kv">${kv}</dl></td></tr>`);
  }

  async function installDriver(name) {
    const btn = document.getElementById("install-driver");
    if (btn) { btn.disabled = true; btn.textContent = "Installing…"; }
    const res = await apiPost("/install_driver", { name }).catch((e) => ({ ok: false, error: errorMessage(e) }));
    if (res.ok) { active = null; load(); }
    else if (btn) { btn.disabled = false; btn.textContent = "Install failed — retry"; showInstallError(res.error); }
  }
  function showInstallError(msg) {
    const box = document.querySelector(".status");
    if (box) box.insertAdjacentHTML("beforeend", `<div class="picker-error">${escapeHtml(msg || "install failed")}</div>`);
  }

  runBtn.addEventListener("click", runQuery);
  cancelBtn.addEventListener("click", cancelQuery);
  limitSel.addEventListener("change", () => setParams({ limit: limitSel.value }));
  tabResults.addEventListener("click", () => setParams({ view: "results" }));
  tabColumns.addEventListener("click", () => setParams({ view: "columns" }));
  tabHistory.addEventListener("click", () => setParams({ view: "history" }));
  prevPage.addEventListener("click", () => { const s = currentState(); if (lastResult && lastResult.browse) setParams({ page: String(Math.max(0, s.page - 1)) }); });
  nextPage.addEventListener("click", () => { const s = currentState(); if (lastResult && lastResult.browse) setParams({ page: String(s.page + 1) }); else fetchMore(); });

  window.addEventListener("resize", () => { if (histPanel.classList.contains("show") && lastResult) maybeHistogram(lastResult); });

  buildEditor(currentState().sql);
  fused.params.onChange(load);
  load();
</script>
</body>
</html>
