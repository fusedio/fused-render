<!DOCTYPE html>
<html data-fused-theme="shell">
<head>
<meta charset="utf-8" />
<title>Code editor</title>
<script src="/template-assets/codemirror.bundle.js"></script>
<script src="/template-shared/ro-badge.js"></script>
<style>
  /* Appearance (SPEC §30, D134). The dark block below IS this view's
     historical palette, value for value; the light block is the new one.
     `data-theme` is written onto <html> by the injected runtime, which acts
     only because this document opted in via `data-fused-theme` on <html>
     (see fused_render/static/runtime.js) — dark stays the default for any
     document that never gets the attribute. */
  :root {
    color-scheme: dark;
    --fg: #e8eaed;
    --fg-muted: #9aa0a6;
    --border: #2a2d33;
    --bg: #131417;
    --bg-alt: #1b1d21;
    --accent: #E5FF44;
    --error: #ff6b6b;
    --skel-base: #1c1f24;
    --skel-shine: #2a2f36;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --fg: #1f2023;
    --fg-muted: #61656c;
    --border: #d8dade;
    --bg: #ffffff;
    --bg-alt: #f4f5f7;
    --accent: #5f7300;
    --error: #c62828;
    --skel-base: #e9ebee;
    --skel-shine: #dcdfe4;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    background: var(--bg);
    color: var(--fg);
  }
  /* Top bar mirrors the other templates' #bar (parquet/pdf): filename left,
     status + Save right. Sans-serif to match the shell chrome. */
  #bar {
    display: none;
    flex: 0 0 auto;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-alt);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 13px;
  }
  #filename {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #bar .grow { flex: 1 1 auto; }
  #status-text { color: var(--fg-muted); }
  /* The buffer's size rides beside the save state — "433 lines │ Saved" — the
     way an editor's status bar is read: two facts, two segments, a hairline
     between them (VS Code, Cursor, Zed all segment the bar; none joins the two
     into a sentence). One span, so the bar's own 12px gap does not push them
     apart further; the divider is the status's left border and goes when
     either half is empty (the conflict banner blanks the status; an unloaded
     file has no count). */
  #state { display: inline-flex; align-items: center; white-space: nowrap; color: var(--fg-muted); }
  #lines:not(:empty) + #status-text:not(:empty) {
    margin-left: 8px;
    padding-left: 8px;
    border-left: 1px solid var(--border);
    line-height: 1.2;
  }
  #status-text.error { color: var(--error); }
  #conflict {
    display: none;
    align-items: center;
    gap: 8px;
    color: var(--error);
  }
  #bar button {
    font: inherit;
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  #bar button:disabled {
    opacity: 0.4;
    cursor: default;
  }
  #root {
    flex: 1 1 auto;
    min-height: 0;
  }
  .cm-editor { height: 100%; font-size: 13px; }
  .cm-scroller { font-family: ui-monospace, Menlo, Consolas, monospace; }
  /* Status bar (CE-3): the editor facts an IDE keeps under the buffer —
     problems on the left, caret / indentation / line endings / language /
     wrap on the right. Every item is a control, not just a label: clicking
     the caret position jumps to a line, the selects reconfigure the running
     view in place. Hidden until a file loads, like #bar. */
  #statusbar {
    display: none;
    flex: 0 0 auto;
    align-items: center;
    gap: 2px;
    min-height: 24px;
    padding: 0 8px;
    border-top: 1px solid var(--border);
    background: var(--bg-alt);
    color: var(--fg-muted);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
  }
  #statusbar .grow { flex: 1 1 auto; }
  #statusbar button, #statusbar select {
    font: inherit;
    color: inherit;
    background: transparent;
    border: 0;
    border-radius: 4px;
    padding: 2px 6px;
    cursor: pointer;
  }
  #statusbar select { appearance: none; -webkit-appearance: none; }
  #statusbar select option { color: var(--fg); background: var(--bg); }
  #statusbar button:hover, #statusbar select:hover:not(:disabled) {
    background: var(--border);
    color: var(--fg);
  }
  #statusbar select:disabled { cursor: default; }
  #statusbar button[aria-pressed="true"] { color: var(--fg); }
  #problems.has-errors { color: var(--error); }
  #status {
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 13px;
    color: var(--fg-muted);
  }
  #status.error { color: var(--error); }
  #status a { color: var(--accent); }
  /* Initial-load placeholder: shimmering line bars shaped like a code buffer
     (gutter + variable-width, variably-indented line) instead of bare text.
     Swapped out wholesale by root.innerHTML = "" once load() lands (or by an
     error/status message on the failure paths above). */
  #skel-code {
    height: 100%;
    padding: 12px 0;
    overflow: hidden;
  }
  .skel-line {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 13px;
    padding: 0 16px;
    margin-bottom: 6px;
  }
  .skel-gutter, .skel-bar {
    border-radius: 3px;
    background: linear-gradient(90deg, var(--skel-base) 25%, var(--skel-shine) 50%, var(--skel-base) 75%);
    background-size: 200% 100%;
    animation: skel-shimmer 1.2s ease-in-out infinite;
  }
  .skel-gutter { flex: 0 0 14px; height: 9px; opacity: 0.5; }
  .skel-bar { height: 9px; }
  @keyframes skel-shimmer {
    from { background-position: 200% 0; }
    to { background-position: -200% 0; }
  }
</style>
</head>
<body>
  <div id="bar">
    <span id="filename"></span>
    <span class="grow"></span>
    <span id="conflict">
      File changed on disk
      <button id="reload">Reload</button>
      <button id="overwrite">Overwrite</button>
    </span>
    <span id="ro" hidden></span>
    <span id="state"><span id="lines"></span><span id="status-text">Saved</span></span>
    <button id="save" disabled>Save</button>
  </div>
  <div id="root"><div id="skel-code" aria-hidden="true">
    <div class="skel-line"><span class="skel-gutter"></span><span class="skel-bar" style="width:28%"></span></div>
    <div class="skel-line"><span class="skel-gutter"></span><span class="skel-bar" style="width:52%"></span></div>
    <div class="skel-line"><span class="skel-gutter"></span><span class="skel-bar" style="width:38%; margin-left:20px"></span></div>
    <div class="skel-line"><span class="skel-gutter"></span><span class="skel-bar" style="width:64%; margin-left:20px"></span></div>
    <div class="skel-line"><span class="skel-gutter"></span><span class="skel-bar" style="width:46%; margin-left:40px"></span></div>
    <div class="skel-line"><span class="skel-gutter"></span><span class="skel-bar" style="width:70%; margin-left:20px"></span></div>
    <div class="skel-line"><span class="skel-gutter"></span><span class="skel-bar" style="width:20%"></span></div>
    <div class="skel-line"><span class="skel-gutter"></span><span class="skel-bar" style="width:58%"></span></div>
    <div class="skel-line"><span class="skel-gutter"></span><span class="skel-bar" style="width:33%; margin-left:20px"></span></div>
    <div class="skel-line"><span class="skel-gutter"></span><span class="skel-bar" style="width:15%"></span></div>
  </div></div>
  <div id="statusbar">
    <button id="problems" type="button" title="Problems (Mod-Shift-M)" hidden></button>
    <span class="grow"></span>
    <button id="cursor" type="button" title="Go to line (Mod-Alt-G)"></button>
    <select id="indent" title="Indentation">
      <option value="2">Spaces: 2</option>
      <option value="4">Spaces: 4</option>
      <option value="8">Spaces: 8</option>
      <option value="tab">Tabs</option>
    </select>
    <select id="eol" title="Line endings">
      <option value="lf">LF</option>
      <option value="crlf">CRLF</option>
    </select>
    <select id="lang" title="Language"></select>
    <button id="wrap" type="button" title="Word wrap (Alt-Z)" aria-pressed="false">Wrap</button>
    <button id="format" type="button" title="Format document (Shift-Alt-F)" hidden>Format</button>
  </div>
  <script>
    // The editor must not reload out from under the cursor (own autosave
    // changes mtime; SPEC LR-5). Another writer's edit — the canvas's
    // workbench editor through the body channel, Claude, a pull — arrives
    // through fused.onFileChanged instead and is REBASED into the buffer
    // around the unsaved edits (see "live sync" below); the conflict banner
    // is the last resort when even that fails.
    fused.autoReload(false);

    const MAX_BYTES = 2 * 1024 * 1024;

    const barEl = document.getElementById("bar");
    const filenameEl = document.getElementById("filename");
    const statusTextEl = document.getElementById("status-text");
    const conflictEl = document.getElementById("conflict");
    const saveBtn = document.getElementById("save");
    const linesEl = document.getElementById("lines");
    const reloadBtn = document.getElementById("reload");
    const overwriteBtn = document.getElementById("overwrite");
    const root = document.getElementById("root");
    const statusbarEl = document.getElementById("statusbar");
    const problemsBtn = document.getElementById("problems");
    const cursorBtn = document.getElementById("cursor");
    const indentSel = document.getElementById("indent");
    const eolSel = document.getElementById("eol");
    const langSel = document.getElementById("lang");
    const wrapBtn = document.getElementById("wrap");
    const formatBtn = document.getElementById("format");

    // Per-viewer convenience only (wrap is a reading preference, not a file
    // fact), so a blocked or empty storage just means "off".
    const WRAP_KEY = "fused-render:code:wrap";
    // A linter that reports one problem per line of a broken 2 MB JSONL file
    // would build a lint panel nobody can read; the count still says "100+".
    const MAX_DIAGNOSTICS = 100;

    // One Compartment per live toggle (CE-3), so the status bar reconfigures
    // the RUNNING view — rebuilding it would throw away the undo history, the
    // caret and the scroll position.
    const themeC = new CM.Compartment();
    const langC = new CM.Compartment();
    const indentC = new CM.Compartment();
    const wrapC = new CM.Compartment();

    let view = null;
    let lang = null;      // LANGUAGES entry the view is configured with (CE-1)
    let indent = "4";     // indentSel value: "2" | "4" | "8" | "tab" (CE-4)
    let eol = "lf";       // eolSel value: "lf" | "crlf" (CE-5)
    let wrap = false;
    let file = null;
    let mtime = null;   // last known on-disk mtime; the optimistic-lock token
    let writable = true; // stat.writable — false locks the buffer read-only
    let dirty = false;
    let saveTimer = null;  // pending autosave debounce (AS-1)
    let saving = false;    // a save() write is in flight
    // Live sync with disk (the same rebase the canvas's workbench editor
    // does against the host, application `code-editor/body-sync-adapter.ts`):
    //   base    — doc-space text last agreed with disk (what `mtime` stands for)
    //   sent    — ChangeSet a write is carrying, relative to base
    //   local   — ChangeSet typed since the sent doc (since base when idle)
    //   sentDoc — the text that write carries, doc-space; null when idle
    // Disk text T arriving: inc = diff(base, T) is dispatched as
    // inc.map(sent ∘ local) — after the user's edits, cursor mapped through,
    // outside the undo history — then local/sent are rebased onto T. A write
    // that meets a changed file (409 conflict) rebases the same way and
    // writes again. Mapped text-space ops never lose a keystroke or a line
    // the other writer added; two edits inside one token interleave.
    let TX = null;        // CM's Transaction class (addToHistory), off the first state
    let base = "";
    let sent = null;
    let local = null;
    let sentDoc = null;
    let syncTimer = null;
    const SYNC_EVENT = "fused.sync"; // userEvent on the rebase's own dispatches
    // `?_saveon=blur` on this frame's own URL (a host framing the editor as a
    // canvas node's code pane, apps/canvases/CanvasWorkspace): no 250 ms
    // autosave. The buffer is written when the editor loses focus — a click
    // on the canvas, a tab, the host's chrome — or on Shift+Enter, the
    // way the hosted workbench's own editor runs a UDF on blur / shortcut.
    // Every write of a node file reaches the canvas as a delta that RUNS the
    // node; saving per keystroke pause ran it per pause.
    const SAVE_ON_BLUR = new URLSearchParams(window.location.search).get("_saveon") === "blur";
    // Arm the autosave (AS-1) — a no-op under `_saveon=blur`, where the pending
    // timer, if any, is only ever cleared.
    function armAutosave() {
      clearTimeout(saveTimer);
      if (!SAVE_ON_BLUR) saveTimer = setTimeout(autosave, 250);
    }
    let themeObserver = null; // watches <html data-theme> (SPEC §30)
    let themedDark = true;    // theme the live view is currently configured for

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Legacy (CodeMirror 5) modes are wrapped into CM6 languages on first use
    // and cached, so a bundle load never builds one nobody opened.
    const legacyCache = new Map();
    const legacy = (name) => () => {
      if (!legacyCache.has(name)) {
        legacyCache.set(name, CM.StreamLanguage.define(CM.legacyModes[name]));
      }
      return legacyCache.get(name);
    };

    // CE-1: every language the editor knows, in the order the status bar's
    // picker lists them. `ext` matches the last extension, `files` a whole
    // basename (both lower-cased; `files` wins, so `CMakeLists.txt` is CMake
    // and not plain text). `words: false` marks a grammar that ships its own
    // completion source; every other one completes from the buffer's words
    // instead. `indent` is the unit used when the file itself has no
    // indentation to detect (CE-4). `lint`/`format` name the validators and
    // formatter below — only languages with a REAL validator get one: Lezer
    // grammars are error-tolerant by design, and on this repo's own valid
    // sources they report error nodes in ~46% of .tsx and ~10% of .py files,
    // so a tree-based "syntax error" linter would cry wolf constantly.
    const LANGUAGES = [
      { id: "plain", name: "Plain Text", ext: ["txt", "log", "csv", "tsv", "text"], load: () => [] },
      { id: "python", name: "Python", ext: ["py", "pyw", "pyi"], load: () => CM.python(), words: false, indent: "4" },
      { id: "javascript", name: "JavaScript", ext: ["js", "mjs", "cjs"], load: () => CM.javascript(), words: false, indent: "2" },
      { id: "jsx", name: "JavaScript JSX", ext: ["jsx"], load: () => CM.javascript({ jsx: true }), words: false, indent: "2" },
      { id: "typescript", name: "TypeScript", ext: ["ts", "mts", "cts"], load: () => CM.javascript({ typescript: true }), words: false, indent: "2" },
      { id: "tsx", name: "TypeScript JSX", ext: ["tsx"], load: () => CM.javascript({ jsx: true, typescript: true }), words: false, indent: "2" },
      { id: "json", name: "JSON", ext: ["json", "geojson", "topojson", "gltf", "webmanifest", "har", "ipynb"], load: () => CM.json(), indent: "2", lint: "json", format: "json" },
      { id: "jsonc", name: "JSON with Comments", ext: ["jsonc", "json5"], load: () => CM.json(), indent: "2" },
      { id: "jsonl", name: "JSON Lines", ext: ["jsonl", "ndjson"], load: () => CM.json(), indent: "2", lint: "jsonl", format: "jsonl" },
      { id: "html", name: "HTML", ext: ["html", "htm", "xhtml"], load: () => CM.html(), words: false, indent: "2" },
      { id: "css", name: "CSS", ext: ["css"], load: () => CM.css(), words: false, indent: "2" },
      { id: "scss", name: "SCSS", ext: ["scss"], load: () => CM.sass(), words: false, indent: "2" },
      { id: "sass", name: "Sass", ext: ["sass"], load: () => CM.sass({ indented: true }), words: false, indent: "2" },
      { id: "less", name: "Less", ext: ["less"], load: () => CM.less(), words: false, indent: "2" },
      { id: "xml", name: "XML", ext: ["xml", "svg", "plist", "xsd", "xsl", "xslt", "kml", "gpx", "rss", "atom", "csproj", "twb", "tds", "dae", "wsdl"], load: () => CM.xml(), words: false, indent: "2", lint: "xml" },
      { id: "markdown", name: "Markdown", ext: ["md", "markdown", "mdx"], load: () => CM.markdown({ base: CM.markdownLanguage }), indent: "2" },
      { id: "yaml", name: "YAML", ext: ["yaml", "yml"], load: () => CM.yaml(), indent: "2" },
      { id: "toml", name: "TOML", ext: ["toml"], load: legacy("toml") },
      { id: "ini", name: "INI / Properties", ext: ["ini", "cfg", "conf", "properties", "env", "editorconfig", "gitconfig"], files: [".env", ".gitconfig", ".editorconfig", ".npmrc", ".pypirc"], load: legacy("properties") },
      { id: "shell", name: "Shell", ext: ["sh", "bash", "zsh", "ksh", "csh", "fish", "zsh-theme", "command"], files: [".bashrc", ".bash_profile", ".zshrc", ".zprofile", ".zshenv", ".profile"], load: legacy("shell"), indent: "2" },
      { id: "powershell", name: "PowerShell", ext: ["ps1", "psm1", "psd1"], load: legacy("powerShell") },
      { id: "sql", name: "SQL", ext: ["sql"], load: () => CM.sql(), words: false, indent: "2" },
      { id: "dockerfile", name: "Dockerfile", ext: ["dockerfile"], files: ["dockerfile", "containerfile"], load: legacy("dockerFile") },
      { id: "diff", name: "Diff", ext: ["diff", "patch"], load: legacy("diff") },
      { id: "c", name: "C", ext: ["c", "h"], load: legacy("c") },
      { id: "cpp", name: "C++", ext: ["cpp", "cc", "cxx", "hpp", "hh", "hxx", "ino"], load: legacy("cpp") },
      { id: "csharp", name: "C#", ext: ["cs"], load: legacy("csharp") },
      { id: "java", name: "Java", ext: ["java"], load: legacy("java") },
      { id: "kotlin", name: "Kotlin", ext: ["kt", "kts"], load: legacy("kotlin") },
      { id: "scala", name: "Scala", ext: ["scala", "sc"], load: legacy("scala"), indent: "2" },
      { id: "dart", name: "Dart", ext: ["dart"], load: legacy("dart"), indent: "2" },
      { id: "objc", name: "Objective-C", ext: ["m", "mm"], load: legacy("objectiveC") },
      { id: "swift", name: "Swift", ext: ["swift"], load: legacy("swift") },
      { id: "go", name: "Go", ext: ["go"], load: legacy("go"), indent: "tab" },
      { id: "rust", name: "Rust", ext: ["rs"], load: legacy("rust") },
      { id: "groovy", name: "Groovy", ext: ["groovy", "gradle"], files: ["jenkinsfile"], load: legacy("groovy") },
      { id: "ruby", name: "Ruby", ext: ["rb", "rake", "gemspec"], files: ["gemfile", "rakefile"], load: legacy("ruby"), indent: "2" },
      { id: "lua", name: "Lua", ext: ["lua"], load: legacy("lua"), indent: "2" },
      { id: "perl", name: "Perl", ext: ["pl", "pm"], load: legacy("perl") },
      { id: "r", name: "R", ext: ["r"], load: legacy("r"), indent: "2" },
      { id: "julia", name: "Julia", ext: ["jl"], load: legacy("julia") },
      { id: "haskell", name: "Haskell", ext: ["hs"], load: legacy("haskell"), indent: "2" },
      { id: "latex", name: "LaTeX", ext: ["tex", "ltx", "latex", "sty", "cls"], load: legacy("stex"), indent: "2" },
      { id: "nginx", name: "Nginx", files: ["nginx.conf"], load: legacy("nginx") },
      { id: "cmake", name: "CMake", ext: ["cmake"], files: ["cmakelists.txt"], load: legacy("cmake") },
      { id: "protobuf", name: "Protocol Buffers", ext: ["proto"], load: legacy("protobuf"), indent: "2" },
    ];
    const languageById = (id) => LANGUAGES.find((l) => l.id === id) || LANGUAGES[0];

    // Path → LANGUAGES entry. JSON files that are conventionally JSONC
    // (tsconfig/jsconfig, VS Code settings, devcontainers) get the comment-
    // tolerant entry, so a valid config is never flagged by the JSON linter.
    function detectLanguage(path) {
      const base = path.split("/").pop().toLowerCase();
      if (/^(ts|js)config(\..+)?\.json$/.test(base) || /\/\.vscode\/[^/]+\.json$/i.test(path)
          || base === "devcontainer.json" || base === ".devcontainer.json") {
        return languageById("jsonc");
      }
      const byFile = LANGUAGES.find((l) => l.files && l.files.includes(base));
      if (byFile) return byFile;
      const ext = base.includes(".") ? base.split(".").pop() : "";
      return LANGUAGES.find((l) => l.ext && l.ext.includes(ext)) || languageById("plain");
    }

    // CE-4: the file's own indentation, read the way editors do — the most
    // common step between consecutive indented lines (not the smallest indent,
    // which a single odd line would decide). Tab-led lines outvoting
    // space-led ones means tabs. Returns an indentSel value, or null when the
    // file has nothing indented to go by.
    function detectIndent(text) {
      let tabs = 0, spaced = 0, prev = 0;
      const steps = new Map();
      for (const line of text.slice(0, 256 * 1024).split("\n")) {
        if (!line.trim()) continue;
        const lead = /^[ \t]*/.exec(line)[0];
        if (lead[0] === "\t") { tabs++; continue; }
        if (lead.includes("\t")) continue;
        if (lead.length) spaced++;
        const step = Math.abs(lead.length - prev);
        prev = lead.length;
        if (step >= 2 && step <= 8) steps.set(step, (steps.get(step) || 0) + 1);
      }
      if (tabs > spaced) return "tab";
      let best = 0, bestCount = 0;
      for (const [step, count] of steps) {
        if (count > bestCount || (count === bestCount && step < best)) { best = step; bestCount = count; }
      }
      if (!best) return null;
      if (best === 2 || best === 4 || best === 8) return String(best);
      return best % 4 === 0 ? "4" : best % 2 === 0 ? "2" : null;
    }

    // CE-5: CodeMirror normalizes every line break to "\n" by default, which
    // silently rewrote a CRLF file to LF on its first save. The buffer stays
    // LF-only inside the editor — so a pasted LF block in a CRLF file still
    // splits into lines (an `EditorState.lineSeparator` of "\r\n" would keep
    // its "\n"s inside one line and write them back as bare LFs) — and the
    // file's own ending is applied only when the bytes leave the editor.
    // Mixed files settle on the majority (as VS Code does); the stray breaks
    // only change if the buffer is saved.
    function detectEol(text) {
      const crlf = (text.match(/\r\n/g) || []).length;
      const lf = (text.match(/\n/g) || []).length - crlf;
      return crlf > 0 && crlf >= lf ? "crlf" : "lf";
    }
    const serialize = (state, value) =>
      state.doc.sliceString(0, state.doc.length, value === "crlf" ? "\r\n" : "\n");

    const normalizeEol = (t) => t.replace(/\r\n?/g, "\n");
    const isHighSurrogate = (c) => c >= 0xd800 && c <= 0xdbff;
    const isLowSurrogate = (c) => c >= 0xdc00 && c <= 0xdfff;
    // The smallest single replacement taking `current` to `next` (common
    // prefix and suffix kept, never ending inside a surrogate pair), or null.
    function minimalChange(current, next) {
      if (current === next) return null;
      const shorter = Math.min(current.length, next.length);
      let prefix = 0;
      while (prefix < shorter && current.charCodeAt(prefix) === next.charCodeAt(prefix)) prefix++;
      if (prefix > 0 && isHighSurrogate(current.charCodeAt(prefix - 1))) prefix--;
      let suffix = 0;
      while (suffix < shorter - prefix
             && current.charCodeAt(current.length - 1 - suffix) === next.charCodeAt(next.length - 1 - suffix)) suffix++;
      if (suffix > 0 && isLowSurrogate(current.charCodeAt(current.length - suffix))) suffix--;
      return { from: prefix, to: current.length - suffix, insert: next.slice(prefix, next.length - suffix) };
    }
    // A ChangeSet over a document holding `from` that turns it into `to`
    // (empty when equal). Built through a throwaway state: the bundle does
    // not export ChangeSet itself.
    function changeSetOf(from, to) {
      const c = minimalChange(from, to);
      return CM.EditorState.create({ doc: from }).changes(c ? c : []);
    }
    // Three-way merge by text when the sets stopped fitting: both sides as
    // one span each; non-overlapping spans both apply, overlapping keep MINE
    // (it is on screen) and the next save carries it.
    function merge3(b, theirs, mine) {
      if (mine === b) return theirs;
      if (theirs === b || theirs === mine) return mine;
      const a = minimalChange(b, theirs);
      const m = minimalChange(b, mine);
      if (!a) return mine;
      if (!m) return theirs;
      if (a.to <= m.from) return b.slice(0, a.from) + a.insert + b.slice(a.to, m.from) + m.insert + b.slice(m.to);
      if (m.to <= a.from) return b.slice(0, m.from) + m.insert + b.slice(m.to, a.from) + a.insert + b.slice(a.to);
      return mine;
    }
    // Rebuild sent/local from the texts (a new view, or sets that no longer fit).
    function reseedSync() {
      if (!view) return;
      const doc = view.state.doc.toString();
      if (sentDoc !== null) {
        sent = changeSetOf(base, sentDoc);
        local = changeSetOf(sentDoc, doc);
      } else {
        sent = changeSetOf(base, base);
        local = changeSetOf(base, doc);
      }
    }
    function dispatchSync(changes) {
      view.dispatch({
        changes,
        userEvent: SYNC_EVENT,
        annotations: TX ? TX.addToHistory.of(false) : [],
      });
    }

    // Disk moved (another writer): fold its text into the buffer around the
    // unsaved edits. False when disk still holds what `mtime` stands for (our
    // own write coming back through the feed), true when something was
    // taken in. Throws on a read failure (a deleted file): the caller lets
    // the next change retry.
    // Single-flight: the change feed and a 409'd save can both ask at once,
    // and the second must see the first's result, not a second stat that
    // reads "nothing newer" because the first already moved `mtime`.
    let rebasePromise = null;
    async function rebaseFromDisk() {
      if (rebasePromise) return rebasePromise;
      rebasePromise = rebaseFromDiskOnce();
      try { return await rebasePromise; } finally { rebasePromise = null; }
    }
    async function rebaseFromDiskOnce() {
      if (!view) return false;
      const st = await fused.stat(file);
      if (st.mtime === mtime) return false;
      const raw = await fused.readFile(file);
      const n = normalizeEol(raw);
      const diskEol = detectEol(raw);
      if (diskEol !== eol) { eol = diskEol; eolSel.value = eol; }
      mtime = st.mtime;
      const doc = view.state.doc.toString();
      if (n === doc) {
        // Already showing it: nothing here is unsaved.
        base = n; sentDoc = null; reseedSync();
        setDirty(false);
        return true;
      }
      if (sentDoc !== null && n === sentDoc) {
        // Our in-flight write, read back before its answer: the base moves,
        // what was typed since stays unsaved.
        base = n; sentDoc = null; reseedSync();
        setDirty(view.state.doc.toString() !== base);
        return true;
      }
      try {
        const all = sent.compose(local);
        const inc = changeSetOf(base, n);
        const mapped = inc.map(all);
        if (!mapped.empty) dispatchSync(mapped);
        local = local.map(inc.map(sent), true);
        sent = sent.map(inc, true);
        base = n;
        if (sentDoc !== null) sentDoc = sent.apply(CM.EditorState.create({ doc: n }).doc).toString();
      } catch (err) {
        const merged = merge3(base, n, doc);
        const c = minimalChange(view.state.doc.toString(), merged);
        if (c) dispatchSync(c);
        base = n; sentDoc = null; reseedSync();
      }
      const stillDirty = view.state.doc.toString() !== base;
      setDirty(stillDirty);
      if (stillDirty) armAutosave();
      return true;
    }

    // The change feed's debounced hand-off to rebaseFromDisk: waits out a
    // write in flight (its own mtime bump settles the compare), stands back
    // while the banner is up (the user is deciding), and lets the next
    // change retry a transient read failure.
    async function syncFromDisk() {
      if (!view) return;
      if (saving) { clearTimeout(syncTimer); syncTimer = setTimeout(syncFromDisk, 200); return; }
      if (conflictEl.style.display === "flex") return;
      try { await rebaseFromDisk(); } catch (err) { /* next change retries */ }
    }

    function indentExtension(value) {
      const unit = value === "tab" ? "\t" : " ".repeat(Number(value));
      return [
        CM.indentUnit.of(unit),
        CM.EditorState.tabSize.of(value === "tab" ? 4 : Number(value)),
      ];
    }

    // CE-6: the validators. Each is a REAL parser of the format, so a reported
    // problem is a real one. Empty buffers are never flagged — a new file is
    // not a broken one.
    function jsonLinesLinter(view) {
      const doc = view.state.doc;
      const out = [];
      for (let n = 1; n <= doc.lines && out.length < MAX_DIAGNOSTICS; n++) {
        const line = doc.line(n);
        if (!line.text.trim()) continue;
        try {
          JSON.parse(line.text);
        } catch (err) {
          out.push({ from: line.from, to: line.to, severity: "error",
            message: "Line " + n + ": " + err.message });
        }
      }
      return out;
    }

    // XML well-formedness via the browser's own XML parser. Its <parsererror>
    // names the line and column in one of two phrasings: libxml2's (Chromium,
    // WebKit) "error on line 3 at column 7: …" or Gecko's "Line Number 3,
    // Column 7". An unrecognized phrasing still reports, at the top.
    function xmlLinter(view) {
      const text = view.state.doc.toString();
      if (!text.trim()) return [];
      const parsed = new DOMParser().parseFromString(text, "application/xml");
      const err = parsed.getElementsByTagName("parsererror")[0];
      if (!err) return [];
      const detail = (err.querySelector("div") || err).textContent.trim();
      const at = /line (\d+) at column (\d+)/i.exec(detail)
        || /Line Number (\d+), Column (\d+)/i.exec(err.textContent);
      const doc = view.state.doc;
      const line = doc.line(at ? Math.min(Math.max(1, Number(at[1])), doc.lines) : 1);
      const from = at ? Math.min(line.from + Math.max(0, Number(at[2]) - 1), line.to) : line.from;
      const message = detail.replace(/^.*?line \d+ at column \d+:\s*/i, "").split("\n")[0]
        || "Malformed XML";
      return [{ from, to: Math.min(from + 1, line.to), severity: "error", message }];
    }

    const LINTERS = {
      json: (view) => (view.state.doc.length && view.state.sliceDoc().trim()
        ? CM.jsonParseLinter()(view) : []),
      jsonl: jsonLinesLinter,
      xml: xmlLinter,
    };

    // CE-7: re-indent JSON without round-tripping it through JSON.parse →
    // JSON.stringify, which would rewrite the VALUES: 1.0 → 1, 1e3 → 1000, and
    // any integer past 2^53 rounded. This walks the tokens and copies every
    // string and literal through verbatim, changing only the whitespace
    // between them. JSON.parse runs first purely as the validator, so an
    // invalid buffer is refused rather than half-formatted. `unit` null emits
    // the compact one-line form (each record of a JSON Lines file).
    function reformatJson(text, unit, nl) {
      JSON.parse(text);
      let out = "", depth = 0, i = 0;
      const pad = () => (unit === null ? "" : nl + unit.repeat(depth));
      while (i < text.length) {
        const ch = text[i];
        if (ch === '"') {
          let j = i + 1;
          while (text[j] !== '"') j += text[j] === "\\" ? 2 : 1;
          out += text.slice(i, j + 1);
          i = j + 1;
        } else if (ch === " " || ch === "\t" || ch === "\n" || ch === "\r") {
          i++;
        } else if (ch === "{" || ch === "[") {
          let j = i + 1;
          while (" \t\n\r".includes(text[j])) j++;
          if (text[j] === (ch === "{" ? "}" : "]")) { // empty container stays {} / []
            out += ch + text[j];
            i = j + 1;
          } else {
            depth++;
            out += ch + pad();
            i++;
          }
        } else if (ch === "}" || ch === "]") {
          depth--;
          out += pad() + ch;
          i++;
        } else if (ch === ",") {
          out += "," + pad();
          i++;
        } else if (ch === ":") {
          out += unit === null ? ":" : ": ";
          i++;
        } else { // number, true, false, null
          let j = i;
          while (j < text.length && !' \t\n\r,:[]{}"'.includes(text[j])) j++;
          out += text.slice(i, j);
          i = j;
        }
      }
      return out;
    }

    function formatDocument() {
      if (!view || !writable || !lang || !lang.format) return false;
      const state = view.state;
      const nl = "\n"; // the buffer's own separator, whatever the file's (CE-5)
      const text = state.sliceDoc();
      const unit = indent === "tab" ? "\t" : " ".repeat(Number(indent));
      let next;
      try {
        if (lang.format === "jsonl") {
          next = text.split(nl).map((line) => (line.trim() ? reformatJson(line, null, nl) : line)).join(nl);
        } else {
          next = reformatJson(text, unit, nl) + (text.endsWith(nl) ? nl : "");
        }
      } catch (err) {
        statusTextEl.textContent = "Can't format: " + (err.message || "invalid JSON");
        statusTextEl.classList.add("error");
        return true;
      }
      if (next !== text) {
        view.dispatch({ changes: { from: 0, to: state.doc.length, insert: next }, userEvent: "input.format" });
      }
      return true;
    }

    // Everything the language decides, as one Compartment's content: the
    // grammar, buffer-word completion where the grammar has none of its own,
    // and the validator plus its gutter where one exists.
    function languageExtension(l) {
      const exts = [l.load()];
      if (l.words !== false) {
        exts.push(CM.EditorState.languageData.of(() => [{ autocomplete: CM.completeAnyWord }]));
      }
      if (l.lint) exts.push(CM.linter(LINTERS[l.lint], { delay: 500 }), CM.lintGutter());
      return exts;
    }

    function readWrapPref() {
      try { return localStorage.getItem(WRAP_KEY) === "1"; } catch (err) { return false; }
    }

    function setWrap(on) {
      wrap = on;
      wrapBtn.setAttribute("aria-pressed", String(on));
      try { localStorage.setItem(WRAP_KEY, on ? "1" : "0"); } catch (err) { /* per-viewer nicety */ }
      if (view) view.dispatch({ effects: wrapC.reconfigure(on ? CM.EditorView.lineWrapping : []) });
    }

    function setLanguage(id) {
      lang = languageById(id);
      langSel.value = lang.id;
      formatBtn.hidden = !lang.format || !writable;
      if (view) view.dispatch({ effects: langC.reconfigure(languageExtension(lang)) });
      paintProblems();
    }

    function setIndent(value) {
      indent = value;
      indentSel.value = value;
      if (view) view.dispatch({ effects: indentC.reconfigure(indentExtension(value)) });
      paintCursor(); // Col counts a tab as tabSize columns
    }

    // Switching line endings rewrites every break on save, so it is an edit:
    // the buffer goes dirty and autosaves like any other.
    function setEol(value) {
      if (value === eol) return;
      eol = value;
      eolSel.value = value;
      setDirty(true);
      armAutosave();
    }

    // "Ln 12, Col 5", the way VS Code counts it: 1-based, a tab advancing to
    // the next tab stop, and the selection size (or count) appended.
    function paintCursor() {
      if (!view) { cursorBtn.textContent = ""; return; }
      const state = view.state;
      const main = state.selection.main;
      const line = state.doc.lineAt(main.head);
      let col = 0;
      for (const ch of line.text.slice(0, main.head - line.from)) {
        col = ch === "\t" ? col + state.tabSize - (col % state.tabSize) : col + 1;
      }
      let text = "Ln " + line.number + ", Col " + (col + 1);
      const ranges = state.selection.ranges.length;
      if (ranges > 1) text += " (" + ranges + " selections)";
      else if (!main.empty) text += " (" + (main.to - main.from) + " selected)";
      cursorBtn.textContent = text;
    }

    function paintProblems() {
      if (!view || !lang || !lang.lint) { problemsBtn.hidden = true; return; }
      let count = 0;
      CM.forEachDiagnostic(view.state, () => { count++; });
      problemsBtn.hidden = false;
      problemsBtn.classList.toggle("has-errors", count > 0);
      problemsBtn.textContent = count === 0 ? "✓ No problems"
        : "✕ " + (count >= MAX_DIAGNOSTICS ? MAX_DIAGNOSTICS + "+" : count)
          + (count === 1 ? " problem" : " problems");
    }

    for (const l of LANGUAGES) langSel.append(new Option(l.name, l.id));

    // The line count the bar prints, from the live document (CM's Text keeps it
    // as a field, so this is a read and not a scan). Painted on load and on
    // every edit that changed the doc; blank while nothing is loaded.
    function paintLines() {
      if (!linesEl) return;
      if (!view) { linesEl.textContent = ""; return; }
      const n = view.state.doc.lines;
      linesEl.textContent = n + (n === 1 ? " line" : " lines");
    }

    function setDirty(d) {
      dirty = d;
      saveBtn.disabled = !d;
      if (conflictEl.style.display !== "flex") {
        statusTextEl.textContent = d ? "Modified" : "Saved";
        statusTextEl.classList.remove("error");
      }
    }

    function showConflict() {
      conflictEl.style.display = "flex";
      statusTextEl.textContent = "";
      saveBtn.disabled = false;
    }

    function hideConflict() {
      conflictEl.style.display = "none";
    }

    // Autosave 250 ms after the last edit (AS-1). Suspends while a conflict banner
    // is up (AS-2 — never auto-overwrite); reschedules rather than stacking a
    // second write if a save is already in flight.
    function autosave() {
      if (!dirty) return;
      if (conflictEl.style.display === "flex") return;
      if (saving) {
        saveTimer = setTimeout(autosave, 250);
        return;
      }
      save();
    }

    // Single-flight save: concurrent callers (autosave timer, Save button,
    // Cmd+S, __fusedFlushEdits) must never issue two writeFile calls for the
    // same buffer — later callers wait out the in-flight write, then re-check
    // dirty (the finished write usually cleared it).
    let savePromise = null;

    async function save() {
      clearTimeout(saveTimer); // manual Save / Cmd+S cancels a pending autosave (AS-1)
      while (saving && savePromise) await savePromise;
      if (!view || !dirty) return;
      savePromise = doSave();
      await savePromise;
    }

    // A write that meets a file another writer changed (409 conflict) takes
    // the disk text in (rebaseFromDisk) and writes again, this many times,
    // before the banner — which is now only for a file that keeps changing
    // faster than it can be read.
    const CONFLICT_REBASES = 3;

    async function doSave() {
      saveBtn.disabled = true;
      statusTextEl.textContent = "Saving…";
      statusTextEl.classList.remove("error");
      saving = true;
      try {
        for (let attempt = 0; ; attempt++) {
          // Snapshot the doc we are writing. CM's Text is immutable, so a plain
          // reference compare after the await detects edits that landed while
          // the write was in flight — those must NOT be masked by
          // setDirty(false), or "Saved" lies and the 250ms autosave (which
          // checks dirty) skips them.
          const docState = view.state.doc;
          // Joined with the FILE's line ending, not the buffer's "\n" (CE-5).
          const doc = serialize(view.state, eol);
          // A line-ending switch is an edit the doc compare cannot see (CE-5).
          const eolWritten = eol;
          // Live sync: this write carries everything typed so far.
          if (local) {
            const text = docState.toString();
            try { sent = sent.compose(local); } catch (err) { sent = changeSetOf(base, text); }
            local = changeSetOf(text, text);
            sentDoc = text;
          }
          // The lock token this write names; a rebase that lands while the
          // write is in flight moves `mtime`, and a 409 is then already
          // answered (the buffer holds the other writer's text).
          const mtimeAtWrite = mtime;
          try {
            const st = await fused.writeFile(file, doc, { expectedMtime: mtimeAtWrite });
            mtime = st.mtime;
            if (sentDoc !== null) { base = sentDoc; sentDoc = null; sent = changeSetOf(base, base); }
            hideConflict();
            if (view.state.doc === docState && eol === eolWritten) {
              setDirty(false);
            } else {
              // Newer edits arrived during the write: stay dirty, re-arm autosave
              // (under `_saveon=blur` they wait for the next blur / Shift+Enter).
              setDirty(true);
              armAutosave();
            }
            return;
          } catch (err) {
            if (err.type === "conflict") {
              // Disk moved under the lock token: take it in and write again —
              // unless a concurrent syncFromDisk already did (`mtime` moved
              // while the write was out), in which case just write again.
              let rebased = mtime !== mtimeAtWrite;
              if (!rebased && attempt < CONFLICT_REBASES) {
                try { rebased = await rebaseFromDisk(); } catch (e) { rebased = false; }
              }
              if (rebased) {
                if (view.state.doc.toString() === base) { setDirty(false); return; } // nothing left to write
                continue;
              }
              showConflict();
            } else {
              statusTextEl.textContent = "Save failed: " + (err.message || "");
              statusTextEl.classList.add("error");
              saveBtn.disabled = false;
            }
            return;
          }
        }
      } finally {
        saving = false;
      }
    }

    // Reload discards local edits and re-arms the lock from disk.
    async function reloadFromDisk() {
      try {
        const st = await fused.stat(file);
        if ((st.writable !== false) !== writable) {
          // Writability flipped on disk (e.g. chmod while the conflict banner
          // was up). The read-only facets live in the view's extensions, so
          // rebuild the editor from scratch — reload discards local edits
          // anyway, and load() re-reads the file and re-applies the lock/badge.
          // The banner stays up until the rebuild lands: its visibility is
          // what holds off queued autosaves (AS-2), and a failed load() must
          // keep the Reload/Overwrite escape hatch on screen.
          clearTimeout(saveTimer);
          if (await load()) hideConflict();
          return;
        }
        const raw = await fused.readFile(file);
        // The disk copy may have changed line endings too (CE-5).
        eol = detectEol(raw);
        eolSel.value = eol;
        view.dispatch({ changes: { from: 0, to: view.state.doc.length, insert: raw } });
        mtime = st.mtime;
        base = view.state.doc.toString(); sentDoc = null; reseedSync();
        hideConflict();
        setDirty(false); // after dispatch, whose docChanged had flipped us dirty
      } catch (err) {
        statusTextEl.textContent = "Reload failed: " + (err.message || "");
        statusTextEl.classList.add("error");
      }
    }

    // Overwrite forces the write with no lock, then re-arms from the response.
    async function overwrite() {
      const doc = serialize(view.state, eol);
      try {
        const st = await fused.writeFile(file, doc);
        mtime = st.mtime;
        base = view.state.doc.toString(); sentDoc = null; reseedSync();
        hideConflict();
        setDirty(false);
      } catch (err) {
        statusTextEl.textContent = "Save failed: " + (err.message || "");
        statusTextEl.classList.add("error");
      }
    }

    async function load() {
      file = fused.params.get("_file");
      if (!file) {
        root.innerHTML = `<div id="status" class="error">No file selected (missing _file param).</div>`;
        return false;
      }
      const rawUrl = fused.rawUrl(file);
      let text;
      try {
        const stat = await fused.stat(file);
        if (stat.size !== null && stat.size !== undefined && stat.size > MAX_BYTES) {
          root.innerHTML = `<div id="status">File is too large to edit inline (${stat.size.toLocaleString()} bytes).
            <a href="${rawUrl}" target="_blank" rel="noopener">Open raw</a></div>`;
          return false;
        }
        text = await fused.readFile(file);
        mtime = stat.mtime;
        writable = stat.writable !== false; // absent field (older server) → editable
      } catch (err) {
        root.innerHTML = `<div id="status" class="error">Failed to load file: ${escapeHtml(err.message)}</div>`;
        return false;
      }

      lang = detectLanguage(file);
      indent = detectIndent(text) || lang.indent || "4";
      eol = detectEol(text);
      wrap = readWrapPref();
      // The editor surface follows the shell's appearance (SPEC §30). oneDark
      // is the only theme in the vendored bundle, so light mode simply leaves
      // it out and basicSetup's own default (light) highlight style applies.
      const wantsDark = () => document.documentElement.getAttribute("data-theme") !== "light";
      const extensions = [
        CM.basicSetup,
        themeC.of(wantsDark() ? CM.oneDark : []),
        langC.of(languageExtension(lang)),
        indentC.of(indentExtension(indent)),
        wrapC.of(wrap ? CM.EditorView.lineWrapping : []),
        CM.indentationMarkers({
          thickness: 1,
          colors: { dark: "#2c3038", activeDark: "#4a505b", light: "#e6e8eb", activeLight: "#c4c8ce" },
        }),
        // CE-2: Tab indents the selection (Shift-Tab dedents) instead of
        // leaving the editor — Escape then Tab still moves focus on — but an
        // open completion takes Tab first, the way every IDE accepts one.
        CM.keymap.of([
          { key: "Tab", run: CM.acceptCompletion },
          CM.indentWithTab,
          { key: "Alt-z", run: () => { setWrap(!wrap); return true; } },
          { key: "Shift-Alt-f", run: formatDocument },
        ]),
        // `_saveon=blur`: Shift+Enter saves. Highest precedence, because
        // basicSetup's default keymap (listed first above) binds Shift-Enter to
        // insertNewlineAndIndent and would take the key first.
        SAVE_ON_BLUR
          ? CM.Prec.highest(CM.keymap.of([
              { key: "Shift-Enter", run: () => { save(); return true; } },
            ]))
          : [],
        // docChanged fires on any user edit → mark the buffer modified.
        CM.EditorView.updateListener.of((update) => {
          // Live sync: every document change that is not the rebase's own
          // dispatch composes into the unsaved set (whatever its intent —
          // the set tracks the DOCUMENT against the base).
          const syncOnly = update.transactions.length > 0
            && update.transactions.every((tr) => tr.isUserEvent(SYNC_EVENT));
          if (update.docChanged && local) {
            for (const tr of update.transactions) {
              if (tr.isUserEvent(SYNC_EVENT) || tr.changes.empty) continue;
              try { local = local.compose(tr.changes); } catch (err) { reseedSync(); }
            }
          }
          if (update.docChanged) {
            paintLines();
            // The rebase's own dispatch sets dirty itself (from doc vs base).
            if (!syncOnly) {
              setDirty(true);
              armAutosave();
            }
          }
          if (update.docChanged || update.selectionSet) paintCursor();
          // Lint results land as their own transaction, after the delay.
          if (update.transactions.length) paintProblems();
        }),
      ];
      // Read-only file: lock the buffer, so dirty can never flip and no save
      // path (autosave, Cmd+S, flush hook) ever fires. The server refuses the
      // write anyway (403 readonly); this makes the UI honest up front. Both
      // facets: editable=false locks the DOM (caret, typing), readOnly=true
      // rejects the transactions synthesized input can still smuggle past it.
      if (!writable) {
        extensions.push(CM.EditorView.editable.of(false));
        extensions.push(CM.EditorState.readOnly.of(true));
      }

      root.innerHTML = "";
      view?.destroy(); // a rebuild (reloadFromDisk after a chmod) replaces the old view
      view = new CM.EditorView({ doc: text, extensions, parent: root });
      // Live sync: the loaded text is the base; CM's Transaction class
      // (for addToHistory) is reached through a no-op update, since the
      // bundle does not export it.
      base = view.state.doc.toString();
      sentDoc = null;
      reseedSync();
      TX = view.state.update({}).constructor;
      langSel.value = lang.id;
      indentSel.value = indent;
      eolSel.value = eol;
      eolSel.disabled = !writable;
      wrapBtn.setAttribute("aria-pressed", String(wrap));
      formatBtn.hidden = !lang.format || !writable;
      paintLines();
      paintCursor();
      paintProblems();
      // A live appearance change (the shell's menu, or the OS flipping while
      // the setting is System) reconfigures the RUNNING view — rebuilding it
      // would throw away unsaved edits, the caret and the scroll position.
      // The runtime writes `data-theme` on <html>, so that attribute is the
      // signal. Best-effort: a reconfigure that somehow fails leaves the
      // editor exactly as it is rather than breaking it.
      themeObserver?.disconnect();
      themeObserver = new MutationObserver(() => {
        const next = wantsDark();
        if (next === themedDark) return;
        themedDark = next;
        try {
          view.dispatch({ effects: themeC.reconfigure(next ? CM.oneDark : []) });
        } catch (err) {
          /* keep the current editor theme — cosmetic only */
        }
      });
      themedDark = wantsDark();
      themeObserver.observe(document.documentElement, {
        attributes: true,
        attributeFilter: ["data-theme"],
      });
      filenameEl.textContent = file.split("/").pop();
      barEl.style.display = "flex";
      statusbarEl.style.display = "flex";
      setDirty(false);
      if (!writable) {
        saveBtn.hidden = true;
        statusTextEl.textContent = "";
        fusedRoBadge.update(document.getElementById("ro"), "Read-only",
          "The file's permissions don't allow writing, so it can't be edited here.");
      } else {
        // A rebuild (reloadFromDisk after a chmod +w) must undo the lock UI.
        saveBtn.hidden = false;
        fusedRoBadge.update(document.getElementById("ro"), "", "");
      }
      return true;
    }

    saveBtn.addEventListener("click", save);
    reloadBtn.addEventListener("click", reloadFromDisk);
    overwriteBtn.addEventListener("click", overwrite);
    problemsBtn.addEventListener("click", () => { if (view) CM.openLintPanel(view); });
    cursorBtn.addEventListener("click", () => { if (view) CM.gotoLine(view); });
    indentSel.addEventListener("change", () => { setIndent(indentSel.value); view?.focus(); });
    eolSel.addEventListener("change", () => { if (view) { setEol(eolSel.value); view.focus(); } });
    langSel.addEventListener("change", () => { setLanguage(langSel.value); view?.focus(); });
    wrapBtn.addEventListener("click", () => { setWrap(!wrap); view?.focus(); });
    formatBtn.addEventListener("click", () => { formatDocument(); view?.focus(); });

    // Bound at the window rather than in the editor's keymap, so Cmd/Ctrl+S
    // saves (and the browser's Save dialog is swallowed) even while focus is
    // on the bar or the status bar.
    window.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && (e.key === "s" || e.key === "S")) {
        e.preventDefault();
        save();
      }
    });

    // `_saveon=blur`: focus leaving THIS FRAME — a click on the canvas, a
    // host tab, another window — writes the buffer. The window's blur, not
    // CodeMirror's: a click on the editor's own bar (Reload, Problems,
    // indent, wrap) moves focus within this document and must not save —
    // Reload in particular is "discard my edits", and a save there would
    // keep them. Edits made while unfocused (Format) wait for the next blur.
    if (SAVE_ON_BLUR) {
      window.addEventListener("blur", () => {
        if (dirty) save();
      });
      // The frame torn down with a dirty buffer (the host left the canvas,
      // a pane the host did not flush first): one last write that outlives
      // the document. Fire-and-forget — nothing is left to show a result —
      // and single-flight save() is not used: it awaits, and there is no
      // later. The lock token still rides along, so a stale buffer cannot
      // overwrite a newer file.
      window.addEventListener("pagehide", () => {
        if (!view || !dirty || !writable) return;
        if (conflictEl.style.display === "flex") return;
        fused.writeFile(file, serialize(view.state, eol), { expectedMtime: mtime, keepalive: true })
          .catch(() => {});
      });
    }

    window.addEventListener("beforeunload", (e) => {
      if (dirty) {
        e.preventDefault();
        e.returnValue = "";
      }
    });

    // Flush hook for the shell: anything that remounts this iframe (a mode
    // switch) would silently discard edits newer than the last autosave (or a
    // conflict-suspended buffer). A caller invokes this first and refuses the
    // remount on {ok:false} (save failure / unresolved conflict).
    window.__fusedFlushEdits = async () => {
      if (!view || !dirty) return { ok: true };
      if (conflictEl.style.display === "flex") return { ok: false };
      await save();
      return { ok: !dirty && conflictEl.style.display !== "flex" };
    };

    // Live sync: the change feed for this file (fused.onFileChanged keeps
    // the socket up although reloading is off). Debounced, since a write is
    // a burst of events; a change for another watched path is not ours.
    fused.onFileChanged(({ path }) => {
      if (!view || !file || path !== file) return;
      clearTimeout(syncTimer);
      syncTimer = setTimeout(syncFromDisk, 150);
    });

    load();
  </script>
</body>
</html>
