# XcodeGen spec for the FusedRender iOS app — `xcodegen generate` in this
# folder writes FusedRender.xcodeproj (gitignored). A thin native shell around
# the local-network listener (fused_render/lan.py): Bonjour finds the computer,
# a QR scan pairs, a WKWebView shows the same grid and apps a phone browser
# would — with the native pieces a browser on plain http cannot offer.
#
# Two targets share Shared/: the app, and a WidgetKit extension that puts
# individual Fused apps on the Home Screen (one configurable widget per app,
# tap → deep link into the app). They talk through the App Group container.
name: FusedRender
options:
  bundleIdPrefix: io.fused
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The Fused developer team (Apple Development identity in the keychain):
    # signs simulator and device builds alike; the App Group entitlement the
    # widget needs is provisioned against it.
    DEVELOPMENT_TEAM: L5CL3594R4
    CODE_SIGN_STYLE: Automatic
    # SIMULATOR CAVEAT: Xcode ad-hoc signs simulator builds with no team
    # whatever identity is asked for, and AppIntents' linkd then rejects the
    # widget extension ("Unable to get teamId from io.fused.render.widgets …
    # requiresValidBundle") — so editing a widget's chosen app never persists
    # in the simulator. Not a code path we control; verify on a device.
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  FusedRender:
    type: application
    platform: iOS
    sources:
      - path: FusedRender
      - path: Shared
    dependencies:
      - target: FusedRenderWidgets
        embed: true
    entitlements:
      path: FusedRender/FusedRender.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.fused.render
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.fused.render
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # No generated scene manifest: the one under `info:` names
        # SceneDelegate, which quick actions (long-press the icon) arrive through.
        INFOPLIST_KEY_CFBundleDisplayName: Fused Render
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: FusedRender/Info.plist
      properties:
        CFBundleDisplayName: Fused Render
        UILaunchScreen: {}
        # No scene configurations here on purpose: under the SwiftUI lifecycle
        # the scene delegate is handed over by AppDelegate (SceneDelegate.swift).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # fusedrender://open?host=…&port=…&path=… — what widgets and quick
        # actions open (Shared/AppManifest.swift builds and parses it).
        CFBundleURLTypes:
          - CFBundleURLName: io.fused.render.open
            CFBundleURLSchemes:
              - fusedrender
        # The listener speaks plain http on the LAN (lan.py explains why).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
        # Bonjour browsing for the listener's _http._tcp record.
        NSBonjourServices:
          - _http._tcp
        NSLocalNetworkUsageDescription: Fused finds your computer on this Wi-Fi to open the apps you build there.
        NSCameraUsageDescription: The camera reads the pairing code shown in Fused Render's Preferences.
        NSMicrophoneUsageDescription: Apps you open can record audio with your permission.
        UIViewControllerBasedStatusBarAppearance: true
        ITSAppUsesNonExemptEncryption: false

  FusedRenderWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: FusedRenderWidgets
      - path: Shared
    entitlements:
      path: FusedRenderWidgets/FusedRenderWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.fused.render
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.fused.render.widgets
        INFOPLIST_KEY_CFBundleDisplayName: Fused apps
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
    info:
      path: FusedRenderWidgets/Info.plist
      properties:
        CFBundleDisplayName: Fused apps
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
