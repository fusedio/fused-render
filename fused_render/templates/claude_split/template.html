<!DOCTYPE html>
<html data-fused-theme="shell">
<head>
<meta charset="utf-8">
<title>Claude split</title>
<style>
  /* Chat pane styled like a modern assistant app (claude.ai / v0 / ChatGPT):
     sans-serif UI, a centered message column, right-aligned user bubbles,
     full-width assistant prose behind a spark avatar, and a floating rounded
     composer. Backend and behavior are the claude template's 1:1 — only the
     skin differs. Every colour is a token; the light block repaints all of
     them (SPEC §30). */
  :root {
    color-scheme: dark;
    --bg: #191a1e;
    --panel: #1e2025;
    --surface: #26282f;          /* composer, cards */
    --surface-2: #2d3038;        /* hover, user bubble */
    --bubble-user: #2f3239;
    --fg: #ececf1;
    --fg-strong: #ffffff;
    --dim: #9a9fa9;
    --faint: #6b7079;
    --border: #34363e;
    --border-strong: #4a4d57;
    --accent: #d97757;
    --on-accent: #1a1a1a;
    --error: #f26d6d;
    --ok: #6cc07a;
    --code-bg: #2a2c33;
    --code-fg: #e8c07d;
    --pre-bg: #141519;
    --pre-fg: #d4d4d8;
    --link: #7aa8ff;
    --shadow: rgba(0, 0, 0, .4);
    --scrollbar: #3a3d45;
    --handle-hover: #4a4d57;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff;
    --panel: #fafafa;
    --surface: #f4f4f6;
    --surface-2: #ebebef;
    --bubble-user: #f0f0f3;
    --fg: #1f2023;
    --fg-strong: #000000;
    --dim: #61656c;
    --faint: #9a9ea6;
    --border: #e3e4e8;
    --border-strong: #c9cbd2;
    --accent: #b8542f;
    --on-accent: #ffffff;
    --error: #c62828;
    --ok: #2e7d32;
    --code-bg: #f0f1f3;
    --code-fg: #8a5a12;
    --pre-bg: #f7f8f9;
    --pre-fg: #33363c;
    --link: #1c5fb8;
    --shadow: rgba(0, 0, 0, .10);
    --scrollbar: #cdd0d6;
    --handle-hover: #a8adb6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.65;
    display: flex;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  code, pre, .mono { font-family: "SF Mono", Menlo, Monaco, "Cascadia Mono", monospace; }

  /* ── split layout ─────────────────────────────── */
  #left { position: relative; min-width: 200px; display: flex; flex-direction: column; }
  /* The iframe's box, and the offset parent for everything that floats over the
     app — the annotate button, the pins, the highlight, the composer. `min-height:
     0` because a flex child's default `min-height: auto` would let the iframe
     refuse to shrink. */
  #leftview { position: relative; flex: 1; min-height: 0; }
  #leftview iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: var(--bg);
  }
  #divider {
    flex-shrink: 0;
    width: 4px;
    cursor: col-resize;
    background: var(--border);
    transition: background .15s;
  }

  /* ── annotation layer over the left iframe ─────── */
  /* Two labelled sliding switches, stacked outside the pane in the chat pane's
     left header margin: annotate mode (#annbtn) and pin visibility (#annvis).
     Outside the pane they cover zero pixels of the app, and the margin space is
     otherwise empty — so a label and a switch track cost nothing and say plainly
     what each control governs, where the previous 26px unlabelled circles had to
     encode their state in a fill alone. Size and position are IDENTICAL in both
     states of each switch: the active state may only repaint (plus the knob
     sliding INSIDE its fixed track), so toggling can never reflow the iframe's
     box — pins and `annStageRect` are in frame viewport coordinates and stay
     put. */
  /* A labelled sliding switch, not a bare icon: the control anchors by its LEFT
     edge just past the divider (`left: calc(100% + 14px)`) and grows rightward
     into the chat pane's empty header margin — so a label and a track cost the
     app zero pixels, and the state ("Annotating" / "Annotate") is spelled out
     instead of encoded in a fill an unlabelled 26px glyph had to carry alone.
     Nothing clips it — neither `#left` nor `#leftview` sets `overflow`, and
     `#chat`'s own `overflow: hidden` cannot clip a box that is not its
     descendant. Idle tints (accent on panel), armed FILLS the whole pill —
     annotate mode swallows the app's clicks, so its on-state is the loudest. */
  #annbtn {
    position: absolute;
    top: 10px;
    left: calc(100% + 14px);
    z-index: 4;
    height: 26px;
    padding: 0 8px 0 10px;
    display: flex;
    align-items: center;
    gap: 7px;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    border: 1px solid var(--accent);
    border-radius: 999px;
    background: var(--panel);
    color: var(--accent);
    cursor: pointer;
    box-shadow: 0 2px 8px var(--shadow);
    transition: color .12s, border-color .12s, background .12s, filter .12s;
  }
  /* The same hover-vs-active rule as `.pill` in the composer, stated the same way:
     the neutral hover excludes the active state, and the active state hovers within
     its accent. See the comment on `.pill:hover`. */
  /* `display: block` kills the inline baseline gap that would push the glyph off
     centre. Same rule as `.viewshot svg`. */
  #annbtn svg { display: block; }
  #annbtn:hover:not(.on) { background: var(--surface-2); }
  #annbtn.on {
    background: var(--accent);
    color: var(--on-accent);
  }
  #annbtn.on:hover { filter: brightness(1.1); }
  /* The slider: knob left = off, knob right = on. Drawn in currentColor so it
     follows the pill's own idle/armed palette; the on-state inverts it so the
     knob stays visible on the accent-filled pill. */
  #annbtn .track {
    position: relative;
    width: 28px;
    height: 16px;
    border-radius: 999px;
    border: 1px solid currentColor;
    flex-shrink: 0;
    transition: background .15s;
  }
  #annbtn .knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: currentColor;
    transition: left .15s, background .15s;
  }
  #annbtn.on .track { background: var(--on-accent); }
  #annbtn.on .knob { left: 14px; background: var(--accent); }
  /* The pins-visibility switch: a labelled left-right sliding toggle under the
     annotate icon. Anchored by its LEFT edge just past the divider (`left:
     calc(100% + 14px)`) so growing wider extends into the chat pane's empty
     header margin, never leftward over the app. On = knob right, accent track. */
  #annvis {
    position: absolute;
    top: 44px;
    left: calc(100% + 14px);
    z-index: 4;
    height: 26px;
    padding: 0 10px 0 6px;
    display: flex;
    align-items: center;
    gap: 7px;
    font: inherit;
    font-size: 12px;
    line-height: 1;
    white-space: nowrap;
    border: 1px solid var(--accent);
    border-radius: 999px;
    background: var(--panel);
    color: var(--accent);
    cursor: pointer;
    box-shadow: 0 2px 8px var(--shadow);
    transition: color .12s, border-color .12s, background .12s, filter .12s;
  }
  #annvis:hover { background: var(--surface-2); }
  #annvis .track {
    position: relative;
    width: 28px;
    height: 16px;
    border-radius: 999px;
    border: 1px solid var(--accent);
    background: transparent;
    transition: background .15s;
    flex-shrink: 0;
  }
  #annvis .knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    transition: left .15s, background .15s;
  }
  #annvis.on .track { background: var(--accent); }
  #annvis.on .knob { left: 14px; background: var(--on-accent); }
  #annpins { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
  .annpin {
    position: absolute;
    transform: translate(-50%, -50%);
    min-width: 22px;
    height: 22px;
    padding: 0 4px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--on-accent);
    border: 1.5px solid var(--panel);
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    cursor: default;
    user-select: none;
    box-shadow: 0 1px 4px var(--shadow);
  }
  .annpin.sent { opacity: .55; }
  #annhl {
    position: absolute;
    z-index: 1;
    display: none;
    pointer-events: none;
    border: 1.5px solid var(--accent);
    border-radius: 4px;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
  }
  #annpop {
    position: absolute;
    z-index: 5;
    display: none;
    width: 280px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 6px 24px var(--shadow);
  }
  #annpop textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--fg);
    font: inherit;
    font-size: 13px;
    padding: 7px 9px;
    resize: none;
    outline: none;
  }
  #annpop .hint { color: var(--faint); font-size: 11px; margin-top: 5px; display: flex; align-items: center; }
  #annauto {
    display: flex;
    align-items: center;
    gap: 3px;
    margin-left: auto;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  #annauto input { margin: 0; accent-color: var(--accent); cursor: pointer; }
  #anndel {
    margin-left: 8px;
    border: 0;
    background: transparent;
    color: var(--error);
    font: inherit;
    font-size: 11px;
    cursor: pointer;
    padding: 0 2px;
  }
  .annpin:not(.sent) { cursor: pointer; }

  /* pending-annotation chips above the composer */
  .annchips { display: flex; flex-wrap: wrap; gap: 6px; }
  .annchips:not(:empty) { padding: 0 0 8px; }
  .annchip {
    display: flex;
    align-items: center;
    gap: 6px;
    max-width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 6px 3px 10px;
    font-size: 12px;
    color: var(--fg);
  }
  .annchip .txt {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 240px;
  }
  .annchip .pinlbl { color: var(--accent); font-weight: 600; flex-shrink: 0; }
  .annchip button {
    border: 0;
    background: transparent;
    color: var(--dim);
    cursor: pointer;
    font-size: 12px;
    padding: 0 3px;
    border-radius: 50%;
  }
  .annchip button:hover { color: var(--fg); }
  #divider:hover, body.dragging #divider { background: var(--handle-hover); }
  body.dragging #leftview iframe { pointer-events: none; }
  #msg { margin: auto; color: var(--dim); text-align: center; padding: 24px; }

  /* ── chat pane ─────────────────────────────── */
  #chat {
    flex: 1;
    min-width: 340px;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    overflow: hidden;
  }
  #chat.home #topbar, #chat.home #logwrap, #chat.home #composer-chat { display: none; }
  #chat:not(.home) #home { display: none; }

  /* top bar */
  #topbar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
  }
  #topbar .spark { color: var(--accent); font-size: 15px; }
  #topbar .tb-title {
    font-weight: 600;
    font-size: 13px;
    color: var(--fg-strong);
    white-space: nowrap;
  }
  #topbar .tb-file {
    color: var(--faint);
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  #session {
    color: var(--faint);
    font-size: 11px;
    letter-spacing: .3px;
  }
  #back {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--dim);
    font: inherit;
    font-size: 12px;
    padding: 4px 10px;
    cursor: pointer;
    flex-shrink: 0;
    transition: color .12s, border-color .12s, background .12s;
  }
  #back:hover { color: var(--fg); border-color: var(--border-strong); background: var(--surface); }

  /* message log */
  #logwrap { flex: 1; overflow-y: auto; }
  #logwrap::-webkit-scrollbar { width: 8px; }
  #logwrap::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }
  #log {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 20px 12px;
  }
  .turn { margin: 0 0 20px; animation: rise .18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .turn { animation: none; } }

  .user { display: flex; flex-direction: column; align-items: flex-end; }
  /* annotations a sent message carried — subtle receipt under the bubble */
  .annsum {
    max-width: 82%;
    margin-top: 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .annsum .annsum-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 11.5px;
    color: var(--dim);
    justify-content: flex-end;
  }
  .annsum .annsum-lbl { color: var(--accent); font-weight: 600; flex-shrink: 0; }
  .annsum .annsum-el { color: var(--faint); flex-shrink: 0; font-size: 11px; }
  /* The crop that rode with this note. Small on purpose — it is a receipt, not a
     viewer; hovering shows the path the agent was given. */
  .annsum .annsum-shot {
    flex-shrink: 0;
    height: 28px;
    max-width: 64px;
    object-fit: cover;
    border: 1px solid var(--border);
    border-radius: 3px;
    align-self: center;
  }
  .annsum .annsum-txt {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  /* The push channel's receipt: this message carried a description of the app
     the user is looking at, and they should be able to see that it did. */
  .user .attach { margin-top: 4px; font-size: 11px; color: var(--faint); }
  /* The per-message pane-shot toggle. Pressed state has to be unmistakable: it
     resets after every send, so a user who cannot see whether it is on will
     either not use it or expect it to have stayed on.

     Its content is a monochrome inline svg on `currentColor`, not the colour emoji
     it used to be: `.pill` paints only `color`, so its three neighbours are quiet
     dim TEXT and a saturated multicolour glyph was the one loud thing in the row.
     Inheriting `color` also gets the hover colour and the pressed accent applied to
     the icon for free — an emoji cannot be recoloured at all. Icon-only, and no
     word beside it: the row already carries three selects and a send button and
     wraps in a narrow chat pane, so every extra millimetre costs a line.

     It deliberately does NOT override `.pill`'s padding. The pill box is the shared
     visual language of that row, and while every background is transparent a
     different box is invisible — it only appears once hover paints one, as a pill
     that is taller and narrower than the selects beside it. So the icon is centred
     inside the pill's own box instead: `min-height` is the pills' text line box
     (their font-size × the inherited line-height), which is what gives a text pill
     its height. */
  .viewshot {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 1.65em;
  }
  .viewshot svg { display: block; }
  .viewshot[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
  }
  .user .bubble {
    background: var(--bubble-user);
    border-radius: 18px 18px 4px 18px;
    padding: 9px 14px;
    max-width: 82%;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .assistant { display: flex; gap: 10px; }
  .assistant .dot {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--accent);
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 2px;
  }
  .assistant .body {
    min-width: 0;
    white-space: pre-wrap;
    word-break: break-word;
    padding-top: 2px;
  }
  .error {
    color: var(--error);
    background: color-mix(in srgb, var(--error) 8%, transparent);
    border: 1px solid color-mix(in srgb, var(--error) 30%, transparent);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* working indicator */
  .working { display: flex; align-items: baseline; gap: 8px; color: var(--dim); font-size: 13px; }
  .working .star { color: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .working .star { animation: none; } }
  .working .verb { color: var(--fg); }
  .working .meta { color: var(--faint); font-size: 12px; }
  /* The stop control rides ON the working line, which exists for exactly as long
     as a run is interruptible — so the button cannot outlive what it cancels. */
  .working .stop {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--dim);
    font: inherit;
    font-size: 12px;
    padding: 1px 7px;
    cursor: pointer;
  }
  .working .stop:hover:not(:disabled) { color: var(--fg); border-color: var(--faint); }
  .working .stop:disabled { opacity: .55; cursor: default; }

  /* A one-liner for something that happened beside the conversation: the agent
     reading the app state on its own, or the user ending a turn. */
  .note { display: flex; gap: 8px; font-size: 12px; color: var(--faint); }
  .note .eye { color: var(--dim); }

  /* ── permission cards (the approval bridge) ── */
  .perm {
    border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
    border-radius: 14px;
    background: var(--surface);
    padding: 12px 14px;
    box-shadow: 0 4px 16px var(--shadow);
  }
  .perm.resolved { border-color: var(--border); box-shadow: none; }
  .perm .perm-head { font-size: 13px; color: var(--dim); }
  .perm .perm-head .tool { color: var(--accent); font-weight: 600; }
  .perm .perm-sub { color: var(--dim); word-break: break-word; font-size: 12px; margin-top: 2px; }
  .perm pre {
    background: var(--pre-bg);
    color: var(--pre-fg);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin: 8px 0 0;
    padding: 8px 10px;
    max-height: 190px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 12px;
  }
  .perm .perm-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .perm button {
    font: inherit;
    font-size: 12.5px;
    font-weight: 500;
    padding: 5px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: transparent;
    color: var(--fg);
    cursor: pointer;
    transition: background .12s, border-color .12s, filter .12s;
  }
  .perm button:hover:not(:disabled) { border-color: var(--border-strong); background: var(--surface-2); }
  .perm button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
  }
  .perm button.primary:hover:not(:disabled) { filter: brightness(1.1); background: var(--accent); }
  .perm button:disabled { opacity: .55; cursor: default; }
  .perm .perm-status { margin-top: 10px; font-size: 13px; }
  .perm .perm-status.allow { color: var(--ok); }
  .perm .perm-status.deny { color: var(--error); }
  .perm .perm-status.expired { color: var(--dim); }

  /* ── composer (shared by home + chat) ── */
  .composer {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 12px 14px 10px;
    box-shadow: 0 6px 24px var(--shadow);
    transition: border-color .15s;
  }
  .composer:focus-within { border-color: var(--border-strong); }
  .composer textarea {
    width: 100%;
    background: transparent;
    border: 0;
    outline: none;
    resize: none;
    color: var(--fg);
    font: inherit;
    font-size: 14px;
    line-height: 1.5;
    max-height: 200px;
    padding: 2px 2px 6px;
  }
  .composer textarea::placeholder { color: var(--faint); }
  .composer-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .composer-row .spacer { flex: 1; }
  .pill {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 999px;
    color: var(--dim);
    font: inherit;
    font-size: 12px;
    padding: 3px 8px;
    cursor: pointer;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    transition: background .12s, color .12s, filter .12s;
  }
  /* THE ONE RULE about hover and an active state, shared with #annbtn in the left
     pane's banner: a neutral hover never applies to a control that is switched on,
     and an on control hovers WITHIN its accent.
     Spelled out in the selectors on purpose. `.pill:hover` and
     `.viewshot[aria-pressed="true"]` are both specificity (0,2,0), so a plain
     `.pill:hover` won on source order alone and repainted an ARMED pane-shot toggle
     neutral — the "this send carries a picture" receipt disappeared under the
     cursor, at exactly the moment the user was deciding whether to click. Relying on
     rule order for that is one reshuffle away from the bug coming back. */
  .pill:hover:not([aria-pressed="true"]) { background: var(--surface-2); color: var(--fg); }
  .pill[aria-pressed="true"]:hover { filter: brightness(1.1); }
  .pill option { background: var(--bg); color: var(--fg); }
  .send {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: var(--on-accent);
    border: 0;
    border-radius: 50%;
    padding: 0;
    cursor: pointer;
    flex-shrink: 0;
    transition: filter .12s, transform .12s, opacity .12s;
  }
  .send:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .send:active { transform: none; }
  /* While a run is live the send buttons become stop buttons: the arrow hides and
     a stop square shows. Clicking then kills the run (same as Escape). */
  .send .ic-stop { display: none; }
  body.running .send .ic-send { display: none; }
  body.running .send .ic-stop { display: block; }

  #composer-chat {
    flex-shrink: 0;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    padding: 8px 20px 6px;
  }
  #footnote {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px 10px;
    text-align: center;

  /* markdown inside assistant turns */
  .assistant b, .assistant strong { color: var(--fg-strong); font-weight: 600; }
  .assistant em { font-style: italic; }
  .assistant code {
    background: var(--code-bg);

  .assistant pre code { background: transparent; color: var(--pre-fg); padding: 0; }
  .assistant .h { color: var(--fg-strong); font-weight: 600; font-size: 15px; }
  .assistant .bullet { color: var(--accent); }
  .assistant a { color: var(--link); text-decoration: none; }
  .assistant a:hover { text-decoration: underline; }
  .cursor { color: var(--accent); animation: blink 1s step-end infinite; }
  @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

  /* ── home view ── */
  #home {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 14vh;

  #home .inner { width: 100%; max-width: 620px; padding: 0 24px; }

    font-size: 26px;

  /* ── skeleton loading placeholders ── */

<body>

           Enter/Space work and `aria-pressed` announces the state to a screen

           and therefore outside the iframe, so it can never land in a capture. -->
      <!-- A comment bubble, not a pencil: a pencil means "edit this", which is what
           CLAUDE does to the app — this button lets the user leave a note ON the app,
           and the marks it produces are numbered comment pins. Inline SVG stroked in
           `currentColor` like the composer's pane-shot icon, so it follows the accent
           tint while idle and is knocked out to `--on-accent` when armed; a text
           glyph could do neither and rendered at a different weight per platform. -->
      <button id="annbtn" type="button" aria-pressed="false" aria-label="Annotate the app"
              title="Annotate the app, then send the notes to Claude"><svg width="13" height="13"
        viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2.3" y="2.8" width="11.4"
        height="8.4" rx="2.2" stroke="currentColor" stroke-width="1.4"/><path d="M5.6 11.2v2.6l3-2.6"
        stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span
        class="lbl">Annotate</span><span class="track" aria-hidden="true"><span class="knob"></span></span></button>
      <!-- Visibility switch for the annotation pins, stacked under the annotate
           button. A real sliding switch WITH a label — the margin under the 26px
           icon column runs into the chat pane's empty header space, so the label

      <button id="annvis" type="button" role="switch" aria-checked="true"

          <button id="anndel" type="button" hidden>Delete</button></div>

            <button id="hviewshot" class="pill viewshot" type="button" aria-pressed="false"
                    aria-label="Attach a screenshot of the app pane to this message"
                    title="Attach a screenshot of the whole app pane to this message (for layout problems that are not about one element)"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2.2" y="3.2" width="11.6" height="9.6" rx="2.2" stroke="currentColor" stroke-width="1.4"/><path d="M2.9 11.4 6 8.3a1.2 1.2 0 0 1 1.7 0l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10.6" cy="6.3" r="1.1" fill="currentColor"/></svg></button>
            <span class="spacer"></span>
            <button class="send" type="submit" aria-label="Send">
              <svg class="ic-send" width="14" height="14" viewBox="0 0 16 16" fill="none">
                <path d="M8 13V3M8 3L3.5 7.5M8 3l4.5 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

<script>
// The claude template's chat, 1:1, as the right pane of a split view — same
// backend (../claude/agent.py: start/poll/decide/history/sessions), same
// permission cards, same run/session params, same resume semantics. The only
// claude-template feature deliberately absent is the annotate comment handoff
// (claudeComments/claudeReturn): annotate hands off to `_mode=claude`, not to
// this view, and the return-trip exists to show the edited file — which the
// left pane already does.
//
// A chat must never reload out from under a live conversation: the runtime
// watches _file (LR-1), so Claude's own edit to the target would reload THIS
// frame mid-stream — killing the poll loop and orphaning the run. The left
// preview iframe is its own document and keeps live-reloading on its own.
fused.autoReload(false);

// The agent is this template's own copy (forked from the claude template —
// templates are self-contained, no cross-template imports).
const AGENT = "./agent.py";

const log = document.getElementById("log");
const logwrap = document.getElementById("logwrap");
const box = document.getElementById("box");
const chatEl = document.getElementById("chat");
const sessionEl = document.getElementById("session");
const homebox = document.getElementById("homebox");

// The target file arrives as the read-only _file param (template contract).
const FILE = fused.params.get("_file") || "";
const BASENAME = FILE.split("/").pop();

if (!FILE) {
  document.body.innerHTML = '<div id="msg">No file selected (missing _file param).</div>';
  throw new Error("claude_split template: missing _file");
}

document.getElementById("banner-sub").textContent = BASENAME;
document.getElementById("home-file").textContent = BASENAME;
document.getElementById("home-path").textContent = FILE;
document.title = "Claude split — " + BASENAME;

// ── live app state: what the agent can SEE of the running app ──
// Without this the agent is editing a page it cannot look at: it has no way to
// tell whether its own change rendered, whether the console filled with errors,
// or whether the page went blank. Two channels close that, and both are served
// from here:
//
//   push — appStateSnapshot() rides along with each message (appStateBlock).
//   pull — the agent's `app_state` MCP tool, answered from the poll loop, for
//          after it edits something and the snapshot has gone stale.
//
// It is deliberately TEXT ONLY — structure, own-text, params, console lines —
// for the same reason the annotation anchors are (#372): a description Claude
// can map straight back to the app's HTML source beats pixels it has to guess
// from. Nothing here is allowed to break the chat: the framed document can be
// mid-navigation, absent (no app entry — see the loader below) or cross-origin,
// so every access is guarded and a failure degrades to LESS state, never to a
// thrown send.
const APP_STATE_MAX_LOGS = 50;    // ring buffer: a live-reloading page logs forever
const APP_STATE_MAX_TEXT = 300;   // per console line / text snippet
const APP_STATE_MAX_NODES = 60;   // elements in the DOM outline
const APP_STATE_MAX_DEPTH = 4;    // how deep the outline descends
// Text per OUTLINED element, deliberately tighter than a console line: this one
// is paid 60 times over, and the whole snapshot is meant to be a few KB rather
// than a transcription of the page's copy.
const APP_STATE_MAX_NODE_TEXT = 120;
// ── caps on annotation screenshots ──
// Same spirit as the outline caps above: a crop is an ATTACHMENT to an anchor,
// not the anchor itself, so it is allowed to cost a little and never a lot.
// Longest edge of a crop. 640 is enough to read a label or see that a chart drew
// nothing, and small enough that the agent's own image budget is not the story.
const SHOT_MAX_EDGE = 640;
// Encoded bytes per crop. Over budget, the crop is halved and re-encoded (PNG has
// no quality dial) — and if it is STILL over, no crop is better than one that
// dominates the turn.
const SHOT_MAX_BYTES = 300 * 1024;
// Crops per send. The pane is captured once however many notes there are, so this
// caps the ENCODING and the uploads, which is where the time goes.
const SHOT_MAX_COUNT = 6;
// px² below which there is nothing to look at — a 0x0 rect (display:none), or a
// hairline border. Cheaper to say so than to write a file nobody can read.
const SHOT_MIN_AREA = 64;
// The whole capture's budget. Past it the send goes out WITHOUT shots: a user
// losing their message because a screenshot was slow is not a trade we make.
const SHOT_TIMEOUT_MS = 6000;
// Elements whose computed style the capture will inline before it gives up. Each
// one costs a getComputedStyle plus ~340 property reads and adds a few KB to the
// serialized SVG, so this is the cap that keeps a big app from turning the send
// into a freeze. Past it the capture is finished with what it has and every crop
// says so.
const SHOT_MAX_ELEMENTS = 3000;
// Elements between yields to the event loop during that walk. The reason it is a
// number and not "never": a synchronous walk cannot be interrupted by a timer, so
// without these yields SHOT_TIMEOUT_MS below could not fire and the chat UI froze
// for the whole capture. Small enough that a frame is never missed by much, large
// enough that the yields themselves are not the cost.
const SHOT_STYLE_CHUNK = 200;
// ── the opt-in full-pane shot ──
// A crop answers "what does THIS element look like". It cannot answer "the whole
// layout is wrong", "these two panels overlap", "everything shifted down" — none
// of which has a single element as its subject, and for which a crop actively hides
// the answer. So the composer has a per-message toggle for a picture of the whole
// visible pane, which is ONE extra encode of a bitmap shotPane already made.
//
// Its own caps, and the edge cap is emphatically not SHOT_MAX_EDGE: a whole pane
// squeezed into 640px is unreadable, which defeats the only reason to send one.
// 1600 is ~6x the pixels of a 640px crop, which is why WebP's quality dial matters
// here more than anywhere else (see shotEncode).
const SHOT_VIEW_EDGE = 1600;
const SHOT_VIEW_BYTES = 900 * 1024;
// Fraction of an annotated element's own area that may sit over an unreadable
// canvas before the crop is suppressed instead of annotated. Half is the line
// between "a picture of the thing, with a hole in a corner" (worth sending, with
// a note) and "a picture of blank backdrop with a control floating on it" (worth
// refusing — see shotBlankCover).
const SHOT_BLANK_BLOCK = 0.5;
// The block's delimiter, duplicated in agent.py (which strips it back out of
// everything user-facing) and in stripAppStateBlock below — a test holds the
// three together, because a drift is invisible until the chat starts showing
// the user a screenful of JSON they never typed (D146).
const APP_STATE_TAG = "live-app-state";
// The pane shot's own block delimiter. A separate, tag-delimited block rather than
// a field on the annotation JSON for two reasons: `shot`/`shotNote` are per-anchor
// and the pane belongs to no anchor (hanging it off one annotation would be a
// category error, and repeating it on all of them a lie), and a pane shot can ride
// a message with NO annotations, where there is no annotation block to put it in.
// Tag-delimited like the app-state block so its strip is position-independent —
// the annotation block's is not, and only one such fragile strip is affordable.
const PANE_SHOT_TAG = "pane-shot";
// Why there is nothing to say about the app. ONE const because two callers say
// it: the snapshot itself, and the pull channel's fallback answer (appStatePull)
// — a divergence there would tell the model two different stories about the same
// condition (D146: the duplicated rule gets a test, not a comment).
const APP_STATE_UNREADABLE = "the app's document could not be read (the project "
  + "may have no app entry, or the pane has not finished loading), so nothing is "
  + "known about its title, url or DOM right now";
// {level, text, source?, line?, ts}. PARENT-side, deliberately: the buffer has
// to outlive the framed app's own reloads, which is exactly what makes "that
// error was already there before my edit" answerable.
const appLogs = [];
let appEntry = "";                // the entry html the pane is rendering
let appLoads = 0;                 // loads seen, so a RELOAD can be told apart

function clipText(value, max) {
  const s = value === null || value === undefined ? "" : String(value);
  return s.length > max ? s.slice(0, max) + "…" : s;
}

function pushAppLog(level, text, source, line) {
  const entry = { level, text: clipText(text, APP_STATE_MAX_TEXT),
                  ts: Math.round(Date.now() / 1000) };
  if (source) entry.source = clipText(source, 200);
  if (line) entry.line = line;
  appLogs.push(entry);
  while (appLogs.length > APP_STATE_MAX_LOGS) appLogs.shift();
}

// console.error's arguments are anything at all, including cross-realm objects
// (the frame's Error is not this realm's Error, so `instanceof` is useless here).
function fmtLogArg(v) {
  if (typeof v === "string") return v;
  if (v && typeof v.message === "string") return v.message;
  try {
    const json = JSON.stringify(v);
    return json === undefined ? String(v) : json;
  } catch (err) {
    return String(v);  // circular, or a throwing toJSON
  }
}

// The window the app runs in — #leftframe's OWN, with no descent. #372 moved
// the pane from /embed/<app> (fused-render's React shell, with the app nested
// one iframe deeper) to /render?path=<entry>, the raw rendered document: the
// frame's contentDocument IS the app's document now, so the frame-walking layer
// that used to live here is gone rather than merely unused.
//
// Returns null — never this chat's own window — in the three cases that are
// genuinely "no app":
//   * the project has no app entry, so the loader below REMOVED the iframe;
//   * about:blank, the placeholder before the first real document;
//   * unreachable (cross-origin, or mid-navigation).
function appWindow() {
  try {
    if (!annFrame || !annFrame.isConnected) return null;
    const win = annFrame.contentWindow;
    if (!win || !win.document) return null;
    if (String(win.location.href) === "about:blank") return null;
    return win;
  } catch (err) {
    return null;
  }
}

// Wrap one window's console + error events. Returns true when THIS document was
// newly wrapped, which is also how a reload is detected (see watchApp).
function watchWindow(win) {
  try {
    const doc = win && win.document;
    // Marked on the DOCUMENT, not the window: a same-origin navigation keeps the
    // window proxy but replaces the global, so a flag there would survive as
    // little as the wrapper itself does — and re-wrapping is exactly what a
    // reload needs.
    if (!doc || doc.__fusedAppWatched) return false;
    doc.__fusedAppWatched = true;
    // console.log is deliberately NOT wrapped: an app's chatter is not news, and
    // 50 ring-buffer slots spent on it would push out the errors that are.
    for (const level of ["error", "warn"]) {
      const original = win.console && win.console[level];
      if (typeof original !== "function") continue;
      win.console[level] = function (...args) {
        try { pushAppLog(level, args.map(fmtLogArg).join(" ")); } catch (err) { /* never */ }
        // Call through: the app's own logging (and the devtools output the user
        // may be reading) must behave exactly as it did uninstrumented.
        return original.apply(win.console, args);
      };
    }
    win.addEventListener("error", (ev) => {
      pushAppLog("error", (ev && (ev.message || (ev.error && ev.error.message)))
                 || "script error", ev && ev.filename, ev && ev.lineno);
    });
    win.addEventListener("unhandledrejection", (ev) => {
      const reason = ev && ev.reason;
      pushAppLog("error", "unhandled promise rejection: " + fmtLogArg(reason));
    });
    return true;
  } catch (err) {
    // Cross-origin, navigating, or already torn down. The snapshot simply has
    // no console entries to report; the chat is unaffected.
    return false;
  }
}

// Called from #leftframe's `load` (beside the annotation rewiring) and once at
// boot. That is enough BECAUSE of the /render framing: a live-reload replaces
// the frame's own document, so `load` fires again — under the old /embed nesting
// it was the INNER frame that navigated and only a timer could see it.
//
// The one thing this cannot win is the race against the app's FIRST inline
// script, which runs before `load`: logging from there is still missed. The DOM
// outline shows what that script did or failed to do, and everything from the
// next tick onwards is captured.
function watchApp() {
  const win = appWindow();
  if (!win) return;
  if (!watchWindow(win)) return;
  appLoads++;
  // Mark the reload IN the buffer rather than clearing it: "these three errors
  // were there before, this one appeared after your edit" is the single most
  // useful thing the buffer can tell the agent, and clearing it destroys that.
  if (appLoads > 1) pushAppLog("reload", "the app reloaded (a file it uses changed)");
}

// The app's params from its URL, for before its runtime has booted.
function searchParamsOf(search) {
  const out = {};
  new URLSearchParams(search || "").forEach((v, k) => { out[k] = v; });
  return out;
}

// This page sets no `_fusedParamBoundary`, so the pane's runtime treats OUR URL
// as its param target (D46/D72) and its `getAll()` hands back the app's params
// merged with this chat's own bookkeeping. Dropped by name: telling the model
// that the app is "running with" session_id and split is worse than telling it
// nothing about params at all.
// `path` is in here for a different reason: it is /render's own plumbing (the
// pane is /render?path=<entry>), so it is on every rendered page and is never
// something the app itself defined. `annotations` likewise — those are the
// user's notes, already sent in their own block.
const CHAT_PARAMS = new Set(["_file", "_mode", "session_id", "run", "split",
                             "model", "effort", "permission", "annotations",
                             "path"]);

function appParamsOf(all) {
  const out = {};
  for (const key of Object.keys(all || {})) {
    if (!CHAT_PARAMS.has(key)) out[key] = clipText(all[key], 200);
  }
  return out;
}

// Elements whose text is code, not content: listed, never quoted from.
const QUIET_TAGS = new Set(["script", "style", "noscript", "template"]);

// A structural outline of the body — tag, id/class, own text — NOT outerHTML,
// which for a real app is tens of KB of markup that would dominate every turn.
//
// Every node also carries `path`: annPathOf's identifier, the SAME one the
// annotation anchors use. That is the point of routing through annPathOf rather
// than growing a second path builder — the element the user pinned and the node
// the agent reads in the outline are then literally the same name, so it can act
// on a pin without guessing, and annResolve round-trips either one. A second
// implementation of the scheme is precisely what D146 forbids.
//
// `budget` is shared across the whole walk so the total node count is capped,
// not just each level's, and any elision is reported (`truncated`): truncation
// the agent cannot see is a lie about the page, since it would read an elided
// element as an absent one.
function outlineNode(el, depth, budget, doc) {
  budget = budget || { left: APP_STATE_MAX_NODES };
  const out = { tag: String(el.tagName || "?").toLowerCase() };
  if (el.id) out.id = clipText(el.id, 80);
  const path = doc ? annPathOf(el, doc) : null;
  if (path) out.path = clipText(path, 400);
  const cls = typeof el.className === "string" ? el.className.trim() : "";
  if (cls) out.class = clipText(cls, 120);
  const kids = el.children || [];
  // Own text only (the element's direct text nodes): textContent on a container
  // is the whole subtree, which would repeat the entire page at every level.
  // Script/style bodies are excluded: their "text" is source the agent can read
  // in the file properly, and a clipped 120 chars of it in a structural outline
  // is noise at best and a misleading fragment at worst (measured against a real
  // app, whose outline came back carrying the first line of its own script).
  const own = [];
  if (!QUIET_TAGS.has(out.tag)) {
    for (const node of el.childNodes || []) {
      if (node.nodeType === 3 && node.nodeValue && node.nodeValue.trim()) {
        own.push(node.nodeValue.trim());
      }
    }
  }
  let text = own.join(" ");
  if (!text && !kids.length && !QUIET_TAGS.has(out.tag) && el.textContent) {
    text = String(el.textContent).trim();
  }
  if (text) out.text = clipText(text, APP_STATE_MAX_NODE_TEXT);
  if (!kids.length) return out;
  if (depth >= APP_STATE_MAX_DEPTH) {
    out.truncated = kids.length + " deeper element(s) not shown";
    return out;
  }
  out.children = [];
  for (const kid of kids) {
    if (budget.left <= 0) {
      out.truncated = (kids.length - out.children.length) + " sibling(s) not shown";
      break;
    }
    budget.left--;
    out.children.push(outlineNode(kid, depth + 1, budget, doc));
  }
  return out;
}

// What the user is looking at, right now, as a compact JSON-serialisable
// object. Returns null when we learned NOTHING — a turn with nothing to say
// about the app must look exactly like a turn from before this feature.
function appStateSnapshot() {
  const state = {};
  if (appEntry) state.entry = appEntry;
  let known = false;
  // Resolved fresh on every call: the pane reloads on its own, so the document
  // that was the app a moment ago may be a different one now.
  const win = appWindow();
  if (!win) {
    // No document to describe. `unreadable` is set but does NOT count as
    // knowledge on its own: a frame that simply has not loaded yet is not worth
    // a block. It DOES ride along once there is something else to say — and the
    // console usually says why (the loader logs a failed open), which is the
    // case where this sentence earns its place.
    state.unreadable = APP_STATE_UNREADABLE;
  } else {
    try {
      const doc = win.document;
      if (doc.title) state.title = clipText(doc.title, 200);
      if (doc.body) { state.dom = outlineNode(doc.body, 0, null, doc); }
      state.url = clipText(String(win.location.pathname + win.location.search), 500);
      // The app's OWN view of its params (its runtime does the merging and
      // defaulting), falling back to its query string before it has booted.
      const params = appParamsOf(win.fused && win.fused.params && win.fused.params.getAll
        ? win.fused.params.getAll() : searchParamsOf(win.location.search));
      if (Object.keys(params).length) state.params = params;
      known = true;
    } catch (err) {
      state.unreadable = "could not read the app's document: " + err.message;
    }
  }
  if (appLogs.length) { state.console = appLogs.slice(); known = true; }
  return known ? state : null;
}

// The PULL channel's view of the same snapshot. Push and pull read one snapshot
// function and disagree about what `null` means, on purpose:
//
//   push — null is "not worth a block". A turn taken while the pane reloads must
//          look exactly like a turn from before this feature, not carry a
//          <live-app-state> block whose entire content is "still loading".
//   pull — null is not an answer at all. The MODEL asked, its tool call is
//          BLOCKED on the reply, and agent.py turns a non-dict into the
//          permanent decision "the window could not read the app's state" — a
//          hard error, for a condition that is usually over in a few hundred ms.
//
// So the pull side never hands `null` down: answerAppState retries a null for a
// bounded number of polls (the mid-reload case, which resolves), and then falls
// back to THIS — an explicit, non-fatal sentence the model can act on (the
// no-app-entry case, which never resolves and must not spin to the tool timeout).
//
// `entry` rides along when known; `title`/`url`/`params`/`dom` deliberately do
// NOT. We could not read the app's window, so there is no honest source for
// them — and the one wrong answer here is describing THIS chat's window as the
// app's.
function appStatePull() {
  const state = appStateSnapshot();
  if (state) return state;
  const out = { unreadable: APP_STATE_UNREADABLE };
  if (appEntry) out.entry = appEntry;
  return out;
}

// The block prepended to the user's message. Delimited and labelled, because
// the model has to be able to tell the user's words from a machine-written
// description of their screen. No trailing separator — composeOutgoing owns the
// joining, so there is exactly one place that decides the message's shape.
function appStateBlock(state) {
  if (!state) return "";
  // `dom_path` where the outline was written to a file (appStateFile), `dom`
  // where it had to stay inline. The preamble has to describe whichever one
  // actually arrived, or the model goes looking for a key that is not there.
  const outline = state.dom_path
    ? "The DOM outline is the JSON file at `dom_path` — read it when you need "
      + "the structure. "
    : "";
  return "<" + APP_STATE_TAG + ">\n"
    + "A snapshot of the app the user is looking at in the left pane, taken as "
    + "they sent this message. " + outline
    + "`path` on each node is the same anchorPath the "
    + "annotations use, so a pin and an outline node name the same element. It "
    + "goes stale the moment you edit anything — call the app_state tool for a "
    + "fresh read.\n"
    + JSON.stringify(state) + "\n</" + APP_STATE_TAG + ">";
}

// Distinct names within the same millisecond; two sends cannot share a file.
let appStateSeq = 0;

// The snapshot with its DOM outline moved OUT to a file, or unchanged if that
// could not be done.
//
// The outline is by far the largest thing the page sends, and composeOutgoing
// puts it in the MESSAGE — so the CLI keeps it in its own session transcript and
// re-reads it on every later turn of the session. A ten-message conversation
// carried ten full outlines in context permanently, all but the newest already
// stale, and the block's own preamble says as much. A path costs the model one
// Read when it actually wants the tree and nothing at all when it does not.
//
// It goes in the screenshot directory, which is the same kind of artifact under
// the same argument: a private, short-lived record of what was on the user's
// screen, handed to the agent and junk once the turn is over. That directory is
// already 0700-enforced, already pruned on a TTL and a count, and already the
// one path `--allowed-tools` lets Read touch without raising a card — none of
// which is worth a second copy of for a second kind of file.
//
// Falls back to the inline outline rather than dropping it: no directory, or a
// failed write, must not leave the agent knowing LESS about the user's screen
// than it did before this existed.
async function appStateFile(state) {
  if (!state || !state.dom) return state;
  try {
    const dir = await shotDirPath();
    const path = shotJoin(dir, "appstate-" + Date.now() + "-"
                               + (++appStateSeq) + ".json");
    await fused.uploadFile(path, new Blob([JSON.stringify(state.dom)],
                                          { type: "application/json" }));
    const out = Object.assign({}, state, { dom_path: path });
    delete out.dom;
    return out;
  } catch (err) {
    console.warn("app-state outline kept inline:", err && err.message);
    return state;
  }
}

// ── left pane: the file's ordinary preview ─────────────────────
(async () => {
  try {
    // The left pane renders the APP, not the folder: the project's entry
    // html (index.html, or its single top-level html — same rule as the
    // shell's "Open as app" button). Framed via /render — the RAW rendered
    // document, same as the annotate template — NOT /embed: /embed serves
    // the React shell, which nests the app one iframe deeper, putting its
    // document out of the annotation layer's reach (the anchor listeners
    // would wire the shell document and never see a click).
    const { entry } = await fused.runPython("./app.py", { dir: FILE });
    if (!entry) throw new Error("no app entry (index.html or a single top-level .html) in " + FILE);
    appEntry = entry;
    document.getElementById("leftframe").src = "/render?path=" + encodeURIComponent(entry);
  } catch (err) {
    // Swap only the iframe for the message — #leftview also hosts the annotation
    // layer (button, pins, highlight, popover), and wiping it would leave JS
    // driving detached nodes. No app, nothing to annotate: hide the toggle.
    document.getElementById("leftframe").remove();
    document.getElementById("annbtn").style.display = "none";
    const d = document.createElement("div");
    d.id = "msg";
    d.textContent = "Could not open preview: " + err.message;
    document.getElementById("leftview").prepend(d);
    // Tell Claude too: "the pane is showing an error instead of your app" is the
    // most important thing the state channel can carry, and from here the iframe
    // is gone (appWindow returns null forever) so nothing else will report it.
    pushAppLog("error", "the left pane could not open the app: " + err.message);
  }
})();

// ── resizable divider; the split ratio is view state, so it lives in a param ──
const leftEl = document.getElementById("left");
const clampPct = (pct) => Math.min(80, Math.max(20, pct));
function applySplit() {
  leftEl.style.width = clampPct(parseFloat(fused.params.get("split") || "70")) + "%";
}
applySplit();

document.getElementById("divider").addEventListener("mousedown", (e) => {
  e.preventDefault();
  document.body.classList.add("dragging");
  const move = (ev) => {
    leftEl.style.width = clampPct((ev.clientX / window.innerWidth) * 100) + "%";
    renderAnn();  // pins are positioned in #leftview coordinates — track the drag
  };
  const up = (ev) => {
    document.body.classList.remove("dragging");
    window.removeEventListener("mousemove", move);
    window.removeEventListener("mouseup", up);
    fused.params.set("split", clampPct((ev.clientX / window.innerWidth) * 100).toFixed(1));
  };
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
});

// ── annotations: element-anchored notes on the left app, sent with the ──
// next chat message. The anchor model is the annotate template's (anchorId
// when the element has an id, else a tag:nth-of-type path from <body>; iu/iv
// content-box fractions on images/canvas/video) — element-level, never
// screenshots or raw coordinates, so Claude can map each note straight back
// to the app's HTML source. Lifecycle: pending → `sent` (stamped when a
// message carries it; pin dims) → gone (auto-resolved when that run finishes
// cleanly). The list is persisted in the pane-local `annotations` param so a
// reload mid-review keeps the pins; it never rides the shell URL.
const annBtn = document.getElementById("annbtn");
const annPins = document.getElementById("annpins");
const annHl = document.getElementById("annhl");
const annPop = document.getElementById("annpop");
const annTa = annPop.querySelector("textarea");
const annChipsEls = [
  document.getElementById("annchips-home"),
  document.getElementById("annchips-chat"),
];
const annFrame = document.getElementById("leftframe");

let annOn = false;
let annDraft = null;    // anchor of a NEW note being composed
let annEditing = null;  // id of an existing pending note being edited
// Pins visible over the app. Default ON: an unset param means shown, and only an
// explicit "0" (the user toggled it off) hides them. Chips above the composer are
// the send payload and stay visible either way.
let annShow = fused.params.get("annshow") !== "0";

function annLoad() {
  try {
    const arr = JSON.parse(fused.params.get("annotations") || "[]");
    return Array.isArray(arr) ? arr.filter((c) => c && typeof c === "object") : [];
  } catch (e) { return []; }
}
let annotations = annLoad();
const annPending = () => annotations.filter((c) => !c.sent);

function annSave() {
  fused.params.set("annotations", JSON.stringify(annotations));
  renderAnn();
}

// tag:nth-of-type chain from <body> — same shape the annotate template stores,
// resolvable with a plain querySelector against the app's source HTML.
function annPathOf(el, doc) {
  const segs = [];
  let node = el;
  while (node && node !== doc.body && node.nodeType === 1) {
    let n = 1, sib = node.previousElementSibling;
    while (sib) { if (sib.tagName === node.tagName) n++; sib = sib.previousElementSibling; }
    segs.unshift(node.tagName.toLowerCase() + ":nth-of-type(" + n + ")");
    node = node.parentElement;
  }
  return node === doc.body ? segs.join(">") : null;
}
function annResolve(c, doc) {
  if (!doc || !doc.body) return null;
  if (c.anchorId) {
    const el = doc.getElementById(c.anchorId);
    if (el) return el;
  }
  if (!c.anchorPath) return null;
  let node = doc.body;
  for (const seg of c.anchorPath.split(">")) {
    const m = /^([a-z0-9-]+):nth-of-type\((\d+)\)$/i.exec(seg);
    if (!m) return null;
    let count = 0, found = null;
    for (const child of node.children) {
      // case-insensitive: HTML tagNames are uppercase, SVG ones stay lowercase
      if (child.tagName.toLowerCase() === m[1].toLowerCase() && ++count === parseInt(m[2], 10)) { found = child; break; }
    }
    if (!found) return null;
    node = found;
  }
  return node === doc.body ? null : node;
}
// Pixel surfaces: a click on an image/canvas/video records iu/iv — fractions
// of the painted content box — so the note marks the exact spot.
function annIntrinsic(el) {
  if (!el || !el.tagName) return null;
  if (el.tagName === "IMG" && el.naturalWidth > 0) return { w: el.naturalWidth, h: el.naturalHeight };
  if (el.tagName === "VIDEO" && el.videoWidth > 0) return { w: el.videoWidth, h: el.videoHeight };
  if (el.tagName === "CANVAS" && el.width > 0) return { w: el.width, h: el.height };
  return null;
}
function annContentBox(el) {
  const r = el.getBoundingClientRect();
  const nat = annIntrinsic(el);
  if (!nat || !r.width || !r.height) return r;
  const fit = el.ownerDocument.defaultView.getComputedStyle(el).objectFit || "fill";
  if (fit !== "contain" && fit !== "cover" && fit !== "scale-down") return r;
  let s = fit === "cover" ? Math.max(r.width / nat.w, r.height / nat.h) : Math.min(r.width / nat.w, r.height / nat.h);
  if (fit === "scale-down") s = Math.min(s, 1);
  const w = nat.w * s, h = nat.h * s;
  return { left: r.left + (r.width - w) / 2, top: r.top + (r.height - h) / 2, width: w, height: h };
}
// Element rect in #leftview coordinates: the iframe fills #leftview, so the
// element's viewport rect inside the frame is already the stage rect. (The control
// strip is a sibling ABOVE #leftview, so it does not enter this coordinate space.)
function annStageRect(el) {
  const r = el.getBoundingClientRect();
  return { left: r.left, top: r.top, width: r.width, height: r.height };
}

function annLabelFor(i) {
  let s = ""; i = i + 1;
  while (i > 0) { s = String.fromCharCode(65 + ((i - 1) % 26)) + s; i = Math.floor((i - 1) / 26); }
  return s;
}

function renderAnn() {
  // pins over the frame
  annPins.innerHTML = "";
  annPins.style.display = annShow ? "" : "none";
  const doc = annShow ? annFrame.contentDocument : null;
  // #leftview, not #left: pins are placed in FRAME viewport coordinates, so their
  // host must be the box the iframe fills — #left also holds the control strip,
  // and measuring that would put every pin the strip's height too high.
  const host = document.getElementById("leftview");
  annotations.forEach((c, i) => {
    const el = doc ? annResolve(c, doc) : null;
    if (!el) return;  // detached / frame not loaded: the chip still shows it
    let x, y;
    if (c.iu != null && c.iv != null && annIntrinsic(el)) {
      const b = annContentBox(el);
      x = b.left + c.iu * b.width; y = b.top + c.iv * b.height;
    } else {
      const r = el.getBoundingClientRect();
      x = r.right; y = r.top;
    }
    // Scrolled out of the framed viewport: no pin this frame — the chip stays.
    if (y < 0 || y > host.clientHeight || x < 0) return;
    const pin = document.createElement("div");
    pin.className = "annpin" + (c.sent ? " sent" : "");
    pin.style.left = Math.min(host.clientWidth - 14, Math.max(14, x)) + "px";
    pin.style.top = Math.max(14, y) + "px";
    pin.textContent = c.sent ? "✓" : annLabelFor(i);
    pin.title = c.sent ? "Sent to Claude: " + c.content : c.content + " — click to edit";
    if (!c.sent) pin.onclick = () => annOpenEditor(c, parseFloat(pin.style.left), parseFloat(pin.style.top));
    annPins.appendChild(pin);
  });
  // pending chips above both composers
  const pending = annPending();
  annChipsEls.forEach((box) => {
    if (!box) return;
    box.innerHTML = "";
    pending.forEach((c) => {
      const chip = document.createElement("div");
      chip.className = "annchip";
      const lbl = document.createElement("span");
      lbl.className = "pinlbl";
      lbl.textContent = annLabelFor(annotations.indexOf(c));
      const txt = document.createElement("span");
      txt.className = "txt";
      txt.textContent = c.content;
      txt.title = c.content + " — click to edit";
      txt.style.cursor = "pointer";
      // Edit from the chip too: the popup lives over the left pane, so place
      // it at the note's pin when it resolves, else roughly centered.
      txt.onclick = () => {
        const el2 = annFrame.contentDocument ? annResolve(c, annFrame.contentDocument) : null;
        const r = el2 && el2.getBoundingClientRect();
        annOpenEditor(c, r ? r.right : host.clientWidth / 3, r ? r.top : host.clientHeight / 3);
      };
      const x = document.createElement("button");
      x.type = "button";
      x.setAttribute("aria-label", "Remove annotation");
      x.textContent = "✕";
      x.onclick = () => {
        // If this note's editor is open, close it — otherwise the popover
        // lingers with annEditing pointing at a deleted id.
        if (annEditing === c.id) annCloseComposer();
        annotations = annotations.filter((a) => a.id !== c.id);
        annSave();
      };
      chip.append(lbl, txt, x);
      box.appendChild(chip);
    });
  });
}

const annDelBtn = document.getElementById("anndel");
function annPlacePop(x, y) {
  const host = document.getElementById("leftview");   // see renderAnn
  annPop.style.display = "block";
  annPop.style.left = Math.min(host.clientWidth - 292, Math.max(0, x + 10)) + "px";
  annPop.style.top = Math.min(host.clientHeight - 110, Math.max(0, y + 10)) + "px";
  annTa.focus();
}
function annOpenComposer(x, y, anchor) {
  annDraft = anchor;
  annEditing = null;
  annDelBtn.hidden = true;
  annTa.value = "";
  annPlacePop(x, y);
}
// Reopen a PENDING note for editing (a sent one is already in the transcript
// and can't be recalled — its pin is inert). The anchor stays as captured;
// only the text is editable.
function annOpenEditor(c, x, y) {
  // Toggle: clicking the same note's marker while its editor is open closes it.
  if (annEditing === c.id && annPop.style.display === "block") {
    annCloseComposer();
    return;
  }
  annDraft = null;
  annEditing = c.id;
  annDelBtn.hidden = false;
  annTa.value = c.content;
  annPlacePop(x, y);
  // Cursor at the end, nothing selected — a stray keypress must append, not
  // wipe the note.
  annTa.setSelectionRange(annTa.value.length, annTa.value.length);
}
function annCloseComposer() {
  annPop.style.display = "none";
  annDraft = null;
  annEditing = null;
}
// A fresh note usually precedes a "go apply it" message: seed the visible
// composer so sending is one keypress. Only when it's empty — never clobber
// typed text. Auto-send (the popover's checkbox, default on) then submits it.
function annPrefillComposer() {
  const home = chatEl.classList.contains("home");
  const el = home ? homebox : box;
  if (el.value.trim()) return false;  // a typed draft is the user's — hands off
  el.value = "apply the comments";
  (home ? growHome : growBox)();
  return true;
}
// Click anywhere outside the popover dismisses it. mousedown, not click, so
// it fires before the target's own handlers; pins and chips are exempt — their
// click handlers own the toggle/reopen behavior and a mousedown-close here
// would make the pin's toggle reopen instead.
document.addEventListener("mousedown", (e) => {
  if (annPop.style.display !== "block") return;
  const t = e.target;
  if (annPop.contains(t) || (t.closest && (t.closest(".annpin") || t.closest(".annchip")))) return;
  annCloseComposer();
});
annDelBtn.addEventListener("click", () => {
  if (annEditing) annotations = annotations.filter((a) => a.id !== annEditing);
  annSave();
  annCloseComposer();
});
annTa.addEventListener("keydown", (e) => {
  // stopPropagation, because the document-level Escape binding also kills a live
  // run: without it, closing the composer would end the turn as well (this
  // handler runs first and would leave the popover already hidden, so the
  // precedence check up there could not see it).
  if (e.key === "Escape") { e.stopPropagation(); annCloseComposer(); }
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    const content = annTa.value.trim();
    const isNew = !!(content && annDraft);
    let filled = false;
    if (isNew) {
      annotations.push({ id: crypto.randomUUID(), content, createdAt: Date.now(), ...annDraft });
      annSave();
      filled = annPrefillComposer();
    } else if (content && annEditing) {
      const c = annotations.find((a) => a.id === annEditing);
      if (c && !c.sent) { c.content = content; annSave(); }
    }
    annCloseComposer();

// ── annotation screenshots: a PNG crop of what the user pointed at ──
// The anchors above stay primary — they are what Claude edits FROM, and they map
// onto the app's HTML source. A crop is an attachment to an anchor, for the cases
// a path cannot express: "this is misaligned", "this chart drew nothing", "the
// wrong colour". It rides as a FILESYSTEM PATH, not inline base64, so it costs
// nothing until the agent decides the visual matters and reads it.
//
// ONE pane capture, cropped N times — never N standalone subtree serializations.
// A flex child serialized alone renders without its parent's layout: it collapses
// to its content width and stops looking like the thing the user clicked. So the
// visible pane is rasterised once and each note's crop is cut out of that bitmap
// at its own on-screen rect, which is exactly the rect the pin already uses.
//
// The bitmap is the VISIBLE pane, not the whole scrollable document: bounded by
// construction, and an element scrolled out of view gets no crop — the same
// condition that already hides its pin.

// Where crops go: our own 0700 temp dir, asked for once and cached. NOT the
// user's project — a screenshot is not their file. Fetched lazily rather than at
// boot so a chat that never annotates never makes the directory; a failure
// clears the cache so the next send tries again instead of degrading forever.

  if (!shotDirPromise) {
    shotDirPromise = fused.runPython(AGENT, { action: "shots_dir" }, { key: null })
      .then((r) => {

        return r.dir;

      .catch((err) => { shotDirPromise = null; throw err; });

// Always "/", never a guessed platform separator: agent.py hands this directory
// back through `_wire_path`, which spells it with forward slashes on every
// platform, and spells the `Read(//.../**)` allow-rule from the SAME
// normalisation. The CLI matches that rule as text, so a path this function
// joined with a backslash on Windows would sit outside its own pre-approval and
// card every crop. Windows takes "/" for both the upload and a Read, so one
// spelling covers all three.

// `<style>` rules do not travel with a serialized element, so every computed
// property is copied onto the clone's inline style. This is what makes the
// capture look like the app instead of like unstyled HTML.
//
// It is also, by a wide margin, the expensive part of a capture: one
// getComputedStyle plus a read of every longhand (~340) PER ELEMENT, which on a
// few-thousand-element app is order 10⁶ property reads. As one synchronous
// recursion that made SHOT_TIMEOUT_MS a promise the capture could not keep — a
// timer cannot fire while synchronous code runs — so the send stalled and the
// whole chat UI froze for however long the walk took, on every annotated send.
//
// Hence two limits, and both are load-bearing:
//   YIELDS every SHOT_STYLE_CHUNK elements, which is what makes the budget's
//     timer able to fire at all (and keeps typing responsive meanwhile).
//   STOPS at SHOT_MAX_ELEMENTS or past `deadline`, so a huge page costs a
//     partly-styled capture instead of an unbounded one — that also bounds the
//     serialized SVG, which grows by a few KB of inline style per element.
//
// Breadth-first rather than depth-first BECAUSE it can stop early: the elements
// nearest <body> are the layout containers, so a truncated capture still has the
// page's overall shape rather than one fully-styled subtree and nothing else.
//
// ── and the price of yielding: the source is LIVE ──
//
// The synchronous walk was slow but ATOMIC. Yielding bought boundedness and gave
// up atomicity: `src` is the app's own tree, `dst` a clone taken before the walk
// began, and between chunks the app can re-render — which is not exotic, an
// interval that re-renders a list is enough. Three things then go wrong, and the
// worst of them was silent:
//   a queued source node can leave the document, where getComputedStyle returns
//     nothing usable (verified in a real browser: a detached subtree enumerates
//     ZERO properties), so reading it writes an authoritative "no styling" —
//   `defaultView` can be null once the frame navigates, which was a TypeError out
//     of the middle of a capture rather than a degradation —
//   and `s.children` / `d.children` can stop corresponding, so `a[i]`/`b[i]`
//     pairs a live node with the WRONG clone node and every style past that point
//     lands on the wrong element. Measured before this guard existed, on a page
//     mutating mid-capture: 375 clone nodes wearing another element's computed
//     style, with nothing reported.
//
// Atomicity is not recoverable here (see shotPane for why the clone cannot be
// styled from its own document), so the property kept instead is: NEVER write a
// style we are not sure belongs to that node, and always report when we could
// not. A missing style degrades a picture; a wrong one lies about it.
//
// Note WHERE the mispairing comes from, because it decides the fix: a queued pair
// holds direct node references, so a pair formed BEFORE a re-render stays correct
// however the live tree is shuffled afterwards. Only pairs formed AFTER it are
// wrong — the clone's child list no longer lines up with the live one. So the rule
// is not "abandon the capture", it is "never descend into a parent whose children
// have moved since the clone was taken".
//
// Detected two ways, both needed:
//   a MutationObserver on the source root names every element whose child list
//     changed. That covers the case no structural check can see — a list rebuilt
//     or reordered with the SAME number of children — and it is half of what a
//     real re-render does. Measured: with only the count check below, a page
//     rotating one child per row still mispaired 225 nodes (reported, but wrong).
//   a child-count comparison is the floor for anything the observer misses (and it
//     is proof of a re-render on its own: the clone came from this very tree).
//     Where MutationObserver does not exist a same-shape reorder can still
//     mispair; every browser that can run this template has had it for a decade.
//
// Reported, not retried. A retry from a fresh clone doubles the cost inside a
// budget that is already tight, and an app re-rendering on an interval will just
// mutate again — so the honest note is worth more than another attempt.
//
// Returns `{styled, incomplete}`: one cause, never a set of booleans that can
// disagree, because the caller turns it into one sentence. Precedence when
// several apply — a re-render may have made styles WRONG anywhere in the capture,
// while a cap only leaves them MISSING past a point, and the reader is an agent
// deciding whether to trust the picture. So correctness news outranks budget news.
async function shotInlineStyles(src, dst, deadline) {
  let styled = 0, stopped = "", detached = false, mutated = false;
  // Elements whose child list has changed since the clone was taken, so descending
  // into them would pair the wrong nodes.
  const reshaped = new Set();
  const absorb = (records) => {
    for (const r of records || []) {
      mutated = true;
      if (r.type === "childList") reshaped.add(r.target);
    }
  };
  // The observer watches the SOURCE only; our own writes go to the clone, so the
  // walk cannot trip its own alarm.
  const view0 = src.ownerDocument && src.ownerDocument.defaultView;
  const MO = view0 && view0.MutationObserver;
  let observer = null;
  if (MO) {
    try {
      observer = new MO(absorb);
      // childList ONLY, deliberately. What this walk can get WRONG is pairing,
      // and only a changed child list breaks that. An attribute or text change
      // mid-walk misattributes nothing — every style still belongs to the node it
      // is written on — it just means the picture was taken of a page that moved,
      // as any photograph is. Observing those too would put the note (which tells
      // the agent to distrust the crop) on every capture of a page with a clock or
      // a spinner in it, which is most of them, and a warning that fires always
      // carries no information.
      observer.observe(src, { subtree: true, childList: true });
    } catch (err) {
      observer = null;   // no observer is a loss of precision, not of correctness
    }
  }
  // Records are drained at every yield rather than left to the observer's own
  // callback: a mutation can only happen while we are yielded (this is one
  // thread), so draining on the way back in is what guarantees the reshaped set is
  // complete BEFORE any further pairing is done with it.
  const drain = () => {
    if (!observer) return;
    try { absorb(observer.takeRecords()); } catch (err) { /* frame gone */ }
  };
  try {
    const queue = [[src, dst]];
    while (queue.length) {
      if (styled >= SHOT_MAX_ELEMENTS) { stopped = stopped || "elements"; break; }
      if (Date.now() > deadline) { stopped = stopped || "deadline"; break; }
      const [s, d] = queue.shift();
      // Re-checked per node, not once up front: the whole point is that this can
      // change between chunks.
      const view = s.isConnected ? (s.ownerDocument && s.ownerDocument.defaultView)
                                 : null;
      if (!view) { detached = true; continue; }
      const cs = view.getComputedStyle(s);
      let css = "";
      for (const prop of cs) css += prop + ":" + cs.getPropertyValue(prop) + ";";
      d.setAttribute("style", css);
      const a = s.children, b = d.children;
      if (reshaped.has(s) || a.length !== b.length) {
        // This parent's children have moved since the clone was taken, so `a[i]`
        // and `b[i]` are no longer the same element. Dropping the subtree costs
        // its styling; pairing it anyway would put one element's appearance on
        // another and call it a photograph.
        mutated = true;
      } else {
        for (let i = 0; i < a.length; i++) queue.push([a[i], b[i]]);
      }
      if (++styled % SHOT_STYLE_CHUNK === 0) {
        await new Promise((r) => setTimeout(r, 0));
        drain();
      }
    }
  } finally {
    // One last drain: the callback is a microtask, so a mutation during the final
    // chunk may not have been delivered anywhere else.
    drain();
    if (observer) { try { observer.disconnect(); } catch (err) { /* gone */ } }
  }
  const incomplete = mutated ? "mutated" : (detached ? "detached" : stopped);
  return { styled, incomplete };
}

// The one sentence a crop carries about what its capture could NOT do, or "" when
// the capture was whole. Every cause shotInlineStyles can report is worded here
// and nowhere else: the old single `truncated` boolean was set by either the

// might act on by simplifying a page that is not big.

        + "the capture budget allows (it stopped after " + styled + "), so some of "
        + "what you see may render without its CSS rather than as the user saw it";
    case "deadline":
      return "part of this capture is unstyled: it ran out of time after " + styled
        + " elements, so some of what you see may render without its CSS rather "
        + "than as the user saw it. This is about capture speed, not page size";
    case "detached":
      return "part of this capture is unstyled: the app removed elements while the "
        + "capture was running, so some of what you see may render without its CSS";
    case "mutated":
      return "the app re-rendered while the capture was running, so this picture "
        + "may not match what was on screen: some elements are missing their "
        + "styling and the layout may be a blend of before and after";

// The closing instruction a caveated shot carries: what to DO about the doubt, as
// against shotPaneNote's description of what went wrong. Two jobs, two functions —
// saying "trust the anchor over this crop" in both put one rule in two places.
//
// Chosen by the WORST doubt present, because a reader takes the caveats as ONE
// instruction. The two kinds are genuinely different:
//   a blank WebGL region is BOUNDED — shotBlankRegions names its rectangles — so
//     "ignore that area, the rest is the app" is exactly right.
//   anything the style walk reports is UNBOUNDED: it could be any element, and a
//     `mutated` capture can look perfectly plausible while being a blend of two
//     moments. Closing THAT with "the rest of the crop is what the user saw" told
//     the agent to distrust the picture and to trust it in the same breath, which
//     cancels to nothing and leaves it acting on a blended image.

// corroboration. Used by both the crop note and the pane-shot note so one capture
// cannot ask for two different levels of trust in its two attachments.

    ? "Do not act on this image alone — check anything you read from it against "
      + "the element's anchor and the DOM outline first."
    : "The rest of the image is what the user saw.";

// Whether a canvas read back nothing we can use.
//
// This is the mandatory check, not a nicety. maplibre and deck.gl create their
// WebGL context with `preserveDrawingBuffer: false`, so the browser is free to
// discard the drawing buffer after each frame and `toDataURL` hands back a fully
// TRANSPARENT image of the right size. Shipping that would tell the agent the map
// rendered nothing — and an agent that believes the app is blank spends a whole
// debugging loop on a bug that does not exist.
//
// Compared against a same-size EMPTY canvas's encoding rather than by walking
// pixels: PNG of a fully-transparent WxH is deterministic, so equality is the
// test, and it costs one extra encode instead of a getImageData scan.
//
// "Cannot tell" is unreadable, not fine: an empty readback (toDataURL threw, or
// the canvas is tainted) and a missing probe both mean we must not claim these
// pixels are what is on screen.

  return !url || !blankUrl || url === blankUrl;
}

// Replace each <canvas> in the clone with an <img> of its own pixels: a <canvas>
// serializes as an empty element, so without this every chart and map in the
// capture is a hole. Returns the SOURCE canvases whose pixels were not readable,
// for the annotations that point at them.
function shotRasterise(src, dst) {
  const cs = src.querySelectorAll("canvas"), cd = dst.querySelectorAll("canvas");
  const blanks = [];
  const probe = src.ownerDocument.createElement("canvas");
  for (let i = 0; i < cs.length && i < cd.length; i++) {
    let url = "";
    try { url = cs[i].toDataURL("image/png"); } catch (err) { url = ""; }
    let blankUrl = "";
    try {
      probe.width = cs[i].width; probe.height = cs[i].height;
      blankUrl = probe.toDataURL("image/png");
    } catch (err) { blankUrl = ""; }
    if (shotReadbackIsBlank(url, blankUrl)) {
      // Left as a <canvas> in the clone, which serializes empty — the same hole
      // it would have been anyway. The annotation is what reports it.
      blanks.push(cs[i]);
      continue;
    }
    const img = dst.ownerDocument.createElement("img");
    img.setAttribute("src", url);
    img.setAttribute("style", cd[i].getAttribute("style") || "");
    cd[i].replaceWith(img);
  }
