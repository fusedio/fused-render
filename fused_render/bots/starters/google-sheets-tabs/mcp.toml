# ---- styling (styling.py). One spreadsheets.batchUpdate per call. doc, tab and an
# A1 range as above; every one changes the sheet, so all are marked [approval].

[[tool]]
name = "sheets_format_range"
description = "[approval] Format cells in an A1 range of a worksheet. doc is a Sheets URL, id or saved name; tab a worksheet title or gid; range e.g. 'A1:D10', 'B:B', '2:2' (empty = whole tab). Only the args you give change: bg_color / text_color (hex like #ff0000 or names like red, lightblue, darkgreen; 'none' removes), bold / italic / underline / strikethrough ('true'/'false'), font_size (pt), font_family (e.g. 'Roboto Mono'), h_align (left/center/right), v_align (top/middle/bottom), wrap (wrap/overflow/clip), number_format (number, integer, percent, currency, date, time, datetime, text, automatic, or a Sheets pattern like '#,##0.0')."
file = "styling.py"
entrypoint = "main"
signature = "main(action: str='format_range', doc: str='', tab: str='', range: str='', bg_color: str='', text_color: str='', bold: str='', italic: str='', underline: str='', strikethrough: str='', font_size: int=0, font_family: str='', h_align: str='', v_align: str='', wrap: str='', number_format: str='', style: str='solid', color: str='#000000', sides: str='all', unmerge: bool=False, merge_type: str='all', pixel_size: int=0, auto_fit: bool=False, dimension: str='', rows: int=-1, cols: int=-1, condition: str='', value: str='', basic_filter: bool=False)"

[tool.pinned]
