<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fused" />
  <title>Fused apps</title>
  <!-- Same pre-paint theme bootstrap as index.html (SPEC §30, D134): the
       resolved appearance goes on <html> before the first paint. -->
  <script>
    (function () {
      var pref = null;
      try {
        pref = localStorage.getItem("fused-render:theme");
      } catch (e) {}
      var theme;
      if (pref === "light" || pref === "dark") {
        theme = pref;
      } else {
        try {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        } catch (e) {
          theme = "dark";
        }
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    html { color-scheme: dark; background: #0a0a0a; }
    html[data-theme="light"] { color-scheme: light; background: #ffffff; }
    body { margin: 0; background: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/lan/main.tsx"></script>
</body>
</html>
