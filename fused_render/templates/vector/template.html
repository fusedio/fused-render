<!DOCTYPE html>
<html data-fused-theme="shell">
<head>
<meta charset="utf-8" />
<title>Vector preview</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<style>
  /* Appearance (SPEC §30, D134). The dark block below IS this view's
     historical palette, value for value; the light block is the new one.
     `data-theme` is written onto <html> by the injected runtime, which acts
     only because this document opted in via `data-fused-theme` on <html>
     (see fused_render/static/runtime.js) — dark stays the default for any
     document that never gets the attribute. */
  :root {
    color-scheme: dark;
    --fg: #e8eaed;
    --fg-muted: #9aa0a6;
    --border: #2a2d33;
    --bg: #131417;
    --bg-alt: #1b1d21;
    --panel-bg: rgba(19,20,23,.92);
    --status-bg: rgba(19,20,23,.9);
    --popup-bg: rgba(19,20,23,.97);
    --tip-bg: rgba(12,13,15,.94);
    --tip-border: #3a3d44;
    --btn-bg: #2b5fd9;
    --btn-hover: #3a6ee8;
    --ghost-hover-border: #4a4d55;
    --ok-bg: #1f7a4c;
    --ok-hover: #269159;
    --err-fg: #ff7b72;
    --link: #8ab4ff;
    --row-line: #1e2025;
    --cell-line: #23262c;
    --th-bg: #17181c;
    --sz-fg: #6b7178;
    --crumb-sep: #4b5058;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --fg: #1f2023;
    --fg-muted: #61656c;
    --border: #d8dade;
    --bg: #ffffff;
    --bg-alt: #f4f5f7;
    --panel-bg: rgba(255,255,255,.94);
    --status-bg: rgba(255,255,255,.92);
    --popup-bg: rgba(255,255,255,.97);
    --tip-bg: rgba(255,255,255,.96);
    --tip-border: #c9ccd2;
    --btn-bg: #2f6fd0;
    --btn-hover: #2560bb;
    --ghost-hover-border: #b6bac1;
    --ok-bg: #1f7a4c;
    --ok-hover: #17693f;
    --err-fg: #c62828;
    --link: #1c5fb8;
    --row-line: #e9ebef;
    --cell-line: #e4e7eb;
    --th-bg: #eceef1;
    --sz-fg: #7b8088;
    --crumb-sep: #a8adb5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--fg); background: var(--bg); font-size: 13px; }
  #map { position: absolute; inset: 0; }
  .panel { position: absolute; background: var(--panel-bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(6px); z-index: 10; }
  #topbar { top: 10px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #topbar label { color: var(--fg-muted); margin: 0 2px 0 6px; }
  input[type=text], select { font: inherit; color: var(--fg); background: var(--bg-alt);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
  #path { flex: 1; min-width: 200px; }
  button { font: inherit; color: var(--fg); background: var(--btn-bg); border: 1px solid var(--btn-bg);
    border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { background: var(--btn-hover); }
  button.ghost { background: transparent; border-color: var(--border); color: var(--fg-muted); }
  button.ghost:hover { color: var(--fg); border-color: var(--ghost-hover-border); }
  button.accent { background: var(--ok-bg); border-color: var(--ok-bg); }
  button.accent:hover { background: var(--ok-hover); }
  button:disabled { opacity: .5; cursor: default; }
  #status { position: absolute; left: 50%; top: 64px; transform: translateX(-50%);
    background: var(--status-bg); border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 14px; color: var(--fg-muted); z-index: 20; display: none; max-width: 80%; }
  #status.err { color: var(--err-fg); display: block; }
  #status.loading { animation: statusPulse 1.4s ease-in-out infinite; }
  @keyframes statusPulse { 0%, 100% { opacity: .6; } 50% { opacity: 1; } }
  #status a { color: var(--link); }
  /* Slim indeterminate progress bar under the topbar — fires while a vector
     file (or a GeoParquet conversion) is in flight. 2px so toggling it never
     shifts layout; the map/basemap underneath stays visible the whole time. */
  #loadbar { position: absolute; left: 10px; right: 10px; top: 54px; height: 2px;
    overflow: hidden; z-index: 15; pointer-events: none; }
  #loadbar::before { content: ""; display: block; height: 100%; width: 35%; border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--btn-bg), transparent);
    transform: translateX(-120%); opacity: 0; }
  #loadbar.active::before { opacity: 1; animation: loadbar-slide 1.1s ease-in-out infinite; }
  @keyframes loadbar-slide { from { transform: translateX(-120%); } to { transform: translateX(320%); } }
  /* Shimmering skeleton bar reused by the explorer row list, and the info/
     attribute-table side panels while their data hasn't landed yet. */
  .sk-bar { display: inline-block; vertical-align: middle; border-radius: 3px;
    background: linear-gradient(90deg, var(--row-line) 25%, var(--border) 50%, var(--row-line) 75%);
    background-size: 200% 100%; animation: vec-shimmer 1.2s ease-in-out infinite; }
  @keyframes vec-shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  #metaPanel { right: 10px; top: 58px; width: 360px; max-height: 62vh; overflow: auto; display: none; }
  #metaPanel h2, #tablePanel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--fg-muted); margin: 0 0 6px; display: flex; justify-content: space-between; align-items: center; }
  #metaPanel table, #tablePanel table { border-collapse: collapse; width: 100%; font-size: 12px; }
  #metaPanel td, #tablePanel td, #tablePanel th { padding: 3px 6px; border-bottom: 1px solid var(--cell-line);
    vertical-align: top; word-break: break-word; text-align: left; }
  #metaPanel td:first-child { color: var(--fg-muted); white-space: nowrap; }
  #tablePanel { left: 10px; bottom: 26px; right: 370px; max-height: 32vh; overflow: auto; display: none; }
  #tablePanel th { color: var(--fg-muted); position: sticky; top: -10px; background: var(--th-bg); }
  #mapTip { position: fixed; pointer-events: none; z-index: 40; display: none;
    background: var(--tip-bg); border: 1px solid var(--tip-border); border-radius: 6px;
    padding: 6px 9px; font-size: 11px; font-variant-numeric: tabular-nums;
    max-width: 300px; color: var(--fg); }
  #mapTip .t { color: var(--link); font-weight: 600; margin-bottom: 2px; }
  #mapTip td { padding: 1px 5px 1px 0; vertical-align: top; }
  #mapTip td:first-child { color: var(--fg-muted); white-space: nowrap; }
  .maplibregl-popup-content { background: var(--popup-bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px; font-size: 12px; max-height: 40vh;
    overflow: auto; padding: 10px 12px; font-family: inherit; }
  .maplibregl-popup-content table { border-collapse: collapse; }
  .maplibregl-popup-content td { padding: 2px 8px 2px 0; border-bottom: 1px solid var(--cell-line); }
  .maplibregl-popup-content td:first-child { color: var(--fg-muted); white-space: nowrap; }
  .maplibregl-popup-close-button { color: var(--link); font-size: 16px; }
  .maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: var(--border); }
  .maplibregl-popup-anchor-top .maplibregl-popup-tip { border-bottom-color: var(--border); }
  #explorer { left: 10px; top: 58px; width: 420px; max-height: 65vh; display: none; z-index: 30; }
  #crumbs { font-size: 12px; margin-bottom: 8px; color: var(--fg-muted); }
  #crumbs a { color: var(--link); cursor: pointer; }
  #explorerList { max-height: 48vh; overflow: auto; border: 1px solid var(--cell-line); border-radius: 6px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 5px 10px; cursor: pointer;
    font-size: 13px; border-bottom: 1px solid var(--row-line); }
  .row:hover { background: var(--cell-line); }
  .row .ic { width: 18px; text-align: center; }
  .row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sz { color: var(--sz-fg); font-size: 11px; }
  input[type=range] { vertical-align: middle; width: 90px; }
</style>
</head>
<body>
  <div id="map"></div>

  <div class="panel" id="topbar">
    <button id="browse" class="ghost">📁</button>
    <input type="text" id="path" placeholder="/absolute/path/to/file.shp · .geojson · .gpkg · .kml…" />
    <button id="load">Load</button>
    <span><label for="colorBy">color by</label><select id="colorBy"><option value="">— single color —</option></select></span>
    <span><label for="opacity">opacity</label><input type="range" id="opacity" min="0" max="100" value="70" /></span>
    <span><label for="basemap">basemap</label><input type="checkbox" id="basemap" checked /></span>
    <button id="tableBtn" class="ghost">table</button>
    <button id="metaBtn" class="ghost">info</button>
    <button id="fitBtn" class="ghost">⤢ fit</button>
    <button id="convertBtn" class="accent" title="Write a GeoParquet copy next to the source file (full file, all features)">⇢ GeoParquet</button>
  </div>

  <div id="loadbar"></div>
  <div id="status"></div>

  <div class="panel" id="explorer">
    <div id="crumbs"></div>
    <div id="explorerList"></div>
    <label style="display:block;margin-top:8px;color:var(--fg-muted);font-size:12px">
      <input type="checkbox" id="showAll" /> show all files</label>
  </div>

  <div class="panel" id="metaPanel"><h2>Layer info <a id="metaClose" style="cursor:pointer;color:var(--link)">×</a></h2><div id="metaBody"></div></div>
  <div class="panel" id="tablePanel"><h2>Attributes (first rows) <a id="tableClose" style="cursor:pointer;color:var(--link)">×</a></h2><div id="tableBody"></div></div>
  <div id="mapTip"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const els = ['path','load','colorBy','opacity','basemap','tableBtn','metaBtn','metaPanel','metaBody',
  'metaClose','tablePanel','tableBody','tableClose','fitBtn','convertBtn','status','mapTip',
  'browse','explorer','crumbs','explorerList','showAll','loadbar']
  .reduce((o, k) => (o[k] = $(k), o), {});

const P = {
  file: () => fused.params.get('file') || fused.params.get('_file') || '',
  colorBy: () => fused.params.get('colorby') || '',
  dir:  () => fused.params.get('dir') || (P.file() ? P.file().replace(/\/[^/]*$/, '') : '~'),
  showAll: () => fused.params.get('showall') === '1',
};
const esc = v => String(v).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const human = n => n > 1e9 ? (n/1e9).toFixed(2)+' GB' : n > 1e6 ? (n/1e6).toFixed(1)+' MB' : Math.round(n/1e3)+' KB';
const fmt = n => Number(n).toLocaleString();
// loading=true keeps the topbar's slim progress bar sliding and gives the
// status pill a soft pulse; both switch off the instant a non-loading call
// (success, error, or empty message) lands.
function status(msg, err, loading){
  els.status.textContent = msg || '';
  els.status.style.display = msg ? 'block' : 'none';
  els.status.className = err ? 'err' : (loading ? 'loading' : '');
  els.loadbar.classList.toggle('active', !!loading);
}
function isPreview(){
  try {
    for (let w = window; ; w = w.parent){
      if (new URLSearchParams(w.location.search).get('_preview') === '1') return true;
      if (w.parent === w) return false;
    }
  } catch (e) { return false; }
}
const failed = e => ({error: String(e.message || e)});
const call = params => fused.daemon.run(params)
  .catch(e => { if (e && e.type) throw e; return fused.runPython('./vector_reader.py', params, {key: null}); })
  .then(r => r || {error: 'read failed'}, failed);
function skeletonRows(n){
  return Array.from({length: n}, (_, i) => {
    const w = 45 + (i * 17) % 40;
    return `<div class="row" style="cursor:default">
      <span class="ic"><span class="sk-bar" style="width:14px;height:14px;border-radius:4px"></span></span>
      <span class="nm"><span class="sk-bar" style="height:11px;width:${w}%"></span></span>
      <span class="sz"><span class="sk-bar" style="height:9px;width:26px"></span></span>
    </div>`;
  }).join('');
}

const CAT_COLORS = ['#5c9dff','#ff6b6b','#51cf66','#ffd43b','#cc5de8','#20c997','#ff922b','#94d82d',
                    '#f06595','#4dabf7','#e8590c','#40c057'];

// ---------------- map ----------------
// Esri's ArcGIS Online raster tiles are plain public REST endpoints, unlike
// CARTO's vector basemap styles which now sit behind an API key.
const DARK = {
  version: 8,
  sources: {
    base: { type: "raster", tileSize: 256, maxzoom: 16,
            tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}"],
            attribution: "Esri, HERE, Garmin, © OpenStreetMap contributors" },
    label: { type: "raster", tileSize: 256, maxzoom: 16,
             tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}"] },
  },
  layers: [
    { id: "base", type: "raster", source: "base" },
    { id: "label", type: "raster", source: "label" },
  ],
};
const map = new maplibregl.Map({ container: 'map', style: DARK, center: [0, 20], zoom: 1.2,
  attributionControl: {compact: true}, fadeDuration: 80 });
map.addControl(new maplibregl.NavigationControl({showCompass: false}), 'bottom-left');
map.addControl(new maplibregl.ScaleControl({unit: 'metric'}), 'bottom-right');
async function styleReady(){
  map.resize();
  for (let i = 0; i < 200 && !map.isStyleLoaded(); i++)
    await new Promise(r => setTimeout(r, 50));
  map.resize();
}

let data = null, source = '', chunks = [], colors = null, hover = null, loaded = 0, streaming = false;
const attrs = new Map();
const isKind = list => ['match', ['geometry-type'], list, true, false];
const POLY = isKind(['Polygon', 'MultiPolygon']), DOTS = isKind(['Point', 'MultiPoint']);
const LAYERS = {fill: [POLY, /Polygon/], line: [['!', DOTS], /Line|Polygon/], circle: [DOTS, /Point/]};
const layerIds = () => chunks.flatMap(c => c.layers);

function decode(b64, T){
  if (Uint8Array.fromBase64) return new T(Uint8Array.fromBase64(b64).buffer);
  const s = atob(b64), u = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
  return new T(u.buffer);
}
function features(p){
  const ids = decode(p.ids, Uint32Array);
  const feat = (i, geometry) => ({type: 'Feature', id: ids[i], properties: {}, geometry});
  if (p.kind === 'geojson') return p.geoms.map((g, i) => feat(i, JSON.parse(g)));
  const c = decode(p.coords, Float64Array), o = p.offsets.map(s => decode(s, Int32Array)), out = new Array(ids.length);
  const at = (d, i) => {
    if (d < 0) return [c[2 * i], c[2 * i + 1]];
    const a = o[d][i], r = new Array(o[d][i + 1] - a);
    for (let k = 0; k < r.length; k++) r[k] = at(d - 1, a + k);
    return r;
  };
  for (let i = 0; i < ids.length; i++) out[i] = feat(i, {type: p.kind, coordinates: at(o.length - 1, i)});
  return out;
}

// ---------------- styling ----------------
function colorExpr(col, values){
  const present = values.filter(v => v !== null && v !== undefined);
  if (!present.length) return '#5c9dff';
  if (present.every(v => typeof v === 'number')){
    const lo = present.reduce((a, b) => Math.min(a, b)), hi = present.reduce((a, b) => Math.max(a, b));
    if (hi > lo) return ['interpolate', ['linear'], ['to-number', ['get', col], lo],
      lo, '#440154', lo + (hi-lo)*0.25, '#3b528b', lo + (hi-lo)*0.5, '#21918c',
      lo + (hi-lo)*0.75, '#5ec962', hi, '#fde725'];
  }
  const counts = new Map();
  for (const v of present) counts.set(String(v), (counts.get(String(v)) || 0) + 1);
  const top = [...counts].sort((a, b) => b[1] - a[1]).slice(0, 12);
  return ['match', ['to-string', ['get', col]], ...top.flatMap(([v], i) => [v, CAT_COLORS[i]]), '#6b7178'];
}
function paints(){
  const op = +els.opacity.value / 100, color = colors ? colors.expr : '#5c9dff';
  const hot = ['boolean', ['feature-state', 'hover'], false];
  return {
    fill: {'fill-color': color, 'fill-opacity': ['case', hot, Math.min(1, op + .25), op]},
    line: {'line-color': ['case', POLY, '#dfe3e8', color], 'line-opacity': ['case', POLY, 0.35, Math.min(1, op + .2)],
           'line-width': ['case', POLY, 0.6, ['case', hot, 4, 2]]},
    circle: {'circle-color': color, 'circle-opacity': op, 'circle-radius': ['case', hot, 7, 4.5],
             'circle-stroke-color': '#fff', 'circle-stroke-width': ['case', hot, 1.5, 0]},
  };
}
function restyle(){
  const p = paints();
  for (const id of layerIds())
    for (const [prop, value] of Object.entries(p[id.split('-').pop()])) map.setPaintProperty(id, prop, value);
}
function clearChunks(){
  for (const {src, layers} of chunks){ layers.forEach(id => map.removeLayer(id)); map.removeSource(src); }
  chunks = []; hover = null; loaded = 0;
  attrs.clear();
  if (popup){ popup.remove(); popup = null; }
}
function addChunk(r){
  loaded = r.next ?? data.count;
  if (!r.parts.length) return;
  const fc = {type: 'FeatureCollection', features: r.parts.flatMap(features)};
  if (colors) for (const f of fc.features) f.properties[colors.col] = colors.values[f.id];
  const src = `vec-${chunks.length}`, p = paints(), firstLine = layerIds().find(id => id.endsWith('-line'));
  const types = Object.keys(LAYERS).filter(t => r.parts.some(q => q.kind === 'geojson' || LAYERS[t][1].test(q.kind)));
  map.addSource(src, {type: 'geojson', data: fc});
  for (const type of types) map.addLayer({id: `${src}-${type}`, type, source: src, filter: LAYERS[type][0],
    paint: p[type]}, type === 'fill' ? firstLine : undefined);
  chunks.push({src, fc, layers: types.map(t => `${src}-${t}`)});
}

function fitToData(instant){
  const b = data && data.bounds4326;
  if (!b) return;
  map.fitBounds([[b[0], b[1]], [b[2], b[3]]],
    {padding: 60, duration: instant === false ? 400 : 0, maxZoom: 15});
}

// ---------------- hover / click ----------------
function readRow(id){
  if (!attrs.has(id)) attrs.set(id, call({file: source, op: 'row', start: String(id)}).then(r => {
    if (r.error){ attrs.delete(id); throw new Error(r.error); }
    return r.props;
  }));
  return attrs.get(id);
}
function featHTML(props){
  return '<table>' + Object.entries(props).map(([k, v]) =>
    `<tr><td>${esc(k)}</td><td>${esc(v ?? '—')}</td></tr>`).join('') + '</table>';
}
const TIP_MAX_ROWS = 6;
function tipHTML(id, props){
  const keys = Object.keys(props);
  const lead = P.colorBy() && keys.includes(P.colorBy()) ? [P.colorBy()] : [];
  const rest = keys.filter(k => !lead.includes(k)).slice(0, TIP_MAX_ROWS - lead.length);
  const more = keys.length - lead.length - rest.length;
  return `<div class="t">Feature #${fmt(id)}</div><table>` +
    [...lead, ...rest].map(k => `<tr><td>${esc(k)}</td><td>${esc(props[k] ?? '—')}</td></tr>`).join('') +
    '</table>' + (more > 0 ? `<div style="color:var(--sz-fg)">… ${more} more — click for all</div>` : '');
}
const featureAt = point => chunks.length ? map.queryRenderedFeatures(point, {layers: layerIds()})[0] : null;
let tipTimer = null;
map.on('mousemove', e => {
  const f = featureAt(e.point);
  if (hover && (!f || f.id !== hover.id || f.source !== hover.source)){
    map.setFeatureState(hover, {hover: false});
    hover = null;
  }
  map.getCanvas().style.cursor = f ? 'pointer' : '';
  if (!f){ clearTimeout(tipTimer); els.mapTip.style.display = 'none'; return; }
  if (!hover){
    hover = {source: f.source, id: f.id};
    map.setFeatureState(hover, {hover: true});
    els.mapTip.innerHTML = tipHTML(f.id, f.properties);
    clearTimeout(tipTimer);
    tipTimer = setTimeout(() => readRow(f.id).then(props => {
      if (hover && hover.id === f.id) els.mapTip.innerHTML = tipHTML(f.id, props);
    }, () => {}), 100);
  }
  els.mapTip.style.display = 'block';
  const pad = 14;
  const x = Math.min(e.originalEvent.clientX + pad, window.innerWidth - 310);
  const y = Math.min(e.originalEvent.clientY + pad, window.innerHeight - els.mapTip.offsetHeight - 10);
  els.mapTip.style.left = x + 'px';
  els.mapTip.style.top = y + 'px';
});
map.getContainer().addEventListener('mouseleave', () => els.mapTip.style.display = 'none');

// click -> full attribute popup pinned to the feature
let popup = null;
map.on('click', e => {
  const f = featureAt(e.point);
  if (popup){ popup.remove(); popup = null; }
  if (!f) return;
  const head = `<div style="color:var(--link);font-weight:600;margin-bottom:4px">Feature #${fmt(f.id)}</div>`;
  const p = popup = new maplibregl.Popup({maxWidth: '340px'})
    .setLngLat(e.lngLat).setHTML(head + featHTML(f.properties)).addTo(map);
  readRow(f.id).then(props => popup === p && p.setHTML(head + featHTML(props)),
    err => popup === p && p.setHTML(head + `<span style="color:var(--err-fg)">${esc(err.message)}</span>`));
});

// ---------------- panels ----------------
function featureCount(){
  const n = fmt(data.count), drawn = chunks.reduce((sum, c) => sum + c.fc.features.length, 0);
  if (streaming) return `${fmt(loaded)} of ${n} loaded…`;
  if (loaded < data.count) return `${n} (showing first ${fmt(loaded)})`;
  return drawn < loaded ? `${n} (${fmt(loaded - drawn)} without geometry)` : n;
}
function renderMeta(){
  if (!data) return;
  const rows = [
    ['file', P.file().split('/').pop()],
    ['size (all sidecars)', human(data.file_size)],
    ['features', featureCount()],
    ['geometry', data.geometry_types.join(', ')],
    ['CRS', data.crs.epsg ? `EPSG:${data.crs.epsg} — ${data.crs.name}` : (data.crs.name || 'unknown')],
    ['fields', data.schema.map(s => s.name).join(', ')],
  ];
  if (data.layers.length > 1) rows.push(['layers', data.layers.join(', ')]);
  if (data.native_bounds)
    rows.push(['native bounds', data.native_bounds.map(v => +v.toFixed(2)).join(', ')]);
  els.metaBody.innerHTML = '<table>' + rows.map(([k, v]) =>
    `<tr><td>${k}</td><td>${esc(v ?? '—')}</td></tr>`).join('') + '</table>' +
    '<h2 style="margin-top:10px">Schema</h2><table>' +
    data.schema.map(s => `<tr><td>${esc(s.name)}</td><td>${esc(s.dtype)}</td></tr>`).join('') + '</table>';
}
function renderTable(){
  if (!data || !data.table.length){ els.tableBody.innerHTML = '<span style="color:var(--sz-fg)">no attributes</span>'; return; }
  const cols = data.schema.map(s => s.name);
  els.tableBody.innerHTML = '<table><tr>' + cols.map(c => `<th>${esc(c)}</th>`).join('') + '</tr>' +
    data.table.map(r => '<tr>' + cols.map(c => `<td>${esc(r[c] ?? '—')}</td>`).join('') + '</tr>').join('') + '</table>';
}
els.metaBtn.onclick = () => { els.metaPanel.style.display = els.metaPanel.style.display === 'block' ? 'none' : 'block'; };
els.metaClose.onclick = () => els.metaPanel.style.display = 'none';
els.tableBtn.onclick = () => { els.tablePanel.style.display = els.tablePanel.style.display === 'block' ? 'none' : 'block'; };
els.tableClose.onclick = () => els.tablePanel.style.display = 'none';
els.fitBtn.onclick = () => fitToData(false);

// ---------------- convert to GeoParquet ----------------
els.convertBtn.onclick = async () => {
  if (!P.file()) return;
  clearTimeout(noteTimer);
  els.convertBtn.disabled = true;
  status('Converting to GeoParquet…', false, true);
  // key:null — convert_parquet.py writes GeoParquet; never cancel it mid-write (D114).
  const r = await fused.runPython('./convert_parquet.py', {file: P.file()}, { key: null })
    .catch(e => ({error: String(e.message || e)}));
  els.convertBtn.disabled = false;
  if (!r || r.error){ status('Convert failed: ' + ((r && r.error) || '?'), true); return; }
  status(`✓ wrote ${r.path.split('/').pop()}: ${r.rows.toLocaleString()} rows, ` +
         `${human(r.size)} (from ${human(r.src_size)}) in ${r.seconds}s `);
  const reveal = Object.assign(document.createElement('a'), {textContent: 'reveal'});
  reveal.style.cursor = 'pointer';
  reveal.onclick = () => fetch('/api/fs/reveal', {method: 'POST',
    headers: {'Content-Type': 'application/json', 'X-Fused': '1'}, body: JSON.stringify({path: r.path})});
  els.status.append(reveal);
  setTimeout(() => { if (!els.status.className) status(''); }, 15000);
};

// ---------------- controls ----------------
function syncControls(){
  els.path.value = P.file();
  if (!data) return;
  els.colorBy.innerHTML = '<option value="">— single color —</option>' +
    data.schema.map(s => `<option value="${esc(s.name)}" ${s.name === P.colorBy() ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
}
// These write ONLY WHEN THE URL DOES NOT ALREADY MEAN THE NEW VALUE (SPEC
// PT-15) — pressing Load on the path already loaded, or re-picking the colour-by
// column already in force, is not a navigation step, and under the runtime's
// first-change-push rule (PR-3) an unguarded no-op still costs a Back press.
// Both sit behind a click or a change event, so the runtime's own no-gesture
// guard cannot absorb them. `{default: ''}` states the part the runtime cannot
// know: an ABSENT param MEANS '' here (no file loaded, "— single color —"), so
// writing '' over an absence is dropped rather than appending `k=`. Neither is a
// true default worth stamping — a path and a column name have no default value
// the URL should carry when the reader has chosen nothing.
els.load.onclick = () => els.path.value.trim() === P.file() ? loadFile()
  : fused.params.set('file', els.path.value.trim(), { default: '' });
els.path.addEventListener('keydown', e => { if (e.key === 'Enter') els.load.click(); });
els.colorBy.onchange = () => fused.params.set('colorby', els.colorBy.value, { default: '' });
els.opacity.oninput = restyle;
els.basemap.onchange = () => {
  const show = els.basemap.checked ? 'visible' : 'none';
  for (const l of map.getStyle().layers)
    if (!l.id.startsWith('vec-')) map.setLayoutProperty(l.id, 'visibility', show);
};

// ---------------- explorer ----------------
els.browse.onclick = async () => {
  const open = els.explorer.style.display === 'block';
  els.explorer.style.display = open ? 'none' : 'block';
  if (!open) refreshExplorer();
};
els.showAll.onchange = () => { fused.params.set('showall', els.showAll.checked ? '1' : ''); refreshExplorer(); };
async function refreshExplorer(dir){
  dir = dir || P.dir();
  const prevCrumbs = els.crumbs.innerHTML, prevList = els.explorerList.innerHTML;
  els.explorerList.innerHTML = skeletonRows(6);
  const r = await fused.runPython('./browse.py', { dir, exts: '.shp,.kml,.kmz,.gpx,.geojson,.gpkg,.fgb,.parquet', show_all: P.showAll() ? 'true' : 'false' }).catch(() => null);
  if (!r || r.error){ els.crumbs.innerHTML = prevCrumbs; els.explorerList.innerHTML = prevList; return; }
  els.crumbs.innerHTML = r.crumbs.map(c =>
    `<a data-p="${esc(c.path)}">${esc(c.label || '/')}</a>`).join('<span style="color:var(--crumb-sep)"> / </span>');
  els.crumbs.querySelectorAll('a').forEach(a => a.onclick = () => refreshExplorer(a.dataset.p));
  const entries = [...(r.dirs || []), ...(r.files || [])];
  els.explorerList.innerHTML = entries.map(e =>
    `<div class="row" data-p="${esc(e.path)}" data-d="${e.is_dir ? 1 : 0}">
       <span class="ic">${e.is_dir ? '📁' : '🗂'}</span><span class="nm">${esc(e.name)}</span>
       <span class="sz">${e.size ? human(e.size) : ''}</span></div>`).join('') || '<div class="row" style="color:var(--sz-fg)">empty</div>';
  els.explorerList.querySelectorAll('.row[data-p]').forEach(row => row.onclick = () => {
    if (row.dataset.d === '1') refreshExplorer(row.dataset.p);
    else { fused.params.set('file', row.dataset.p); els.explorer.style.display = 'none'; }
  });
}

// ---------------- load ----------------
let loadedFile = null, loadSeq = 0, doneSeq = 0, noteTimer;

async function applyColorBy(){
  const col = P.colorBy(), file = loadedFile;
  if (!data || (colors ? colors.col === col : !col)) return;
  if (!col){ colors = null; restyle(); return; }
  status(`Reading "${col}" for every feature…`, false, true);
  const r = await call({file: source, op: 'column', column: col});
  if (P.colorBy() !== col || loadedFile !== file) return;
  if (r.error){ status('color by failed: ' + r.error, true); return; }
  colors = {col, values: r.values, expr: colorExpr(col, r.values)};
  for (const {src, fc} of chunks){
    for (const f of fc.features) f.properties = {[col]: r.values[f.id]};
    map.getSource(src).setData(fc);
  }
  restyle();
  status(streaming ? `Loading features… ${featureCount()}` : '', false, streaming);
}

async function loadFile(){
  const file = P.file(), seq = ++loadSeq;
  clearTimeout(noteTimer);
  if (!file){ status('no file — use Browse or enter a vector file path'); return; }
  const streamed = /^s3:\/\//i.test(file);
  els.browse.hidden = streamed;
  els.convertBtn.hidden = streamed || /\.parquet$/i.test(file);
  status('Reading vector file…', false, true);
  let src;
  const [r] = await Promise.all([(streamed ? fused.s3.sign(file).then(s => s.url) : Promise.resolve(file))
    .then(s => seq === loadSeq ? call({file: src = s, op: 'meta'}) : null, failed), styleReady()]);
  if (seq !== loadSeq) return;
  doneSeq = seq;
  if (r.error){ status(r.error, true); return; }
  clearChunks();
  const {first, ...meta} = r;
  data = meta; source = src; loadedFile = file; colors = null; streaming = !isPreview();
  const fetchNext = c => streaming && c.next != null ? call({file: source, op: 'chunk', start: String(c.next)}) : null;
  let pending = fetchNext(first), err = '';
  syncControls();
  renderTable();
  addChunk(first);
  fitToData();
  renderMeta();
  applyColorBy();
  while (pending){
    status(`Loading features… ${featureCount()}`, false, true);
    const c = await pending;
    if (seq !== loadSeq) return;
    if (c.error){ err = c.error; break; }
    pending = fetchNext(c);
    addChunk(c);
    if (els.metaPanel.style.display === 'block') renderMeta();
  }
  streaming = false;
  renderMeta();
  status(err ? `stopped after ${fmt(loaded)} features: ${err}` : `features: ${featureCount()}`, !!err);
  if (!err) noteTimer = setTimeout(() => status(''), 4000);
}

function onParamsChanged(){
  if (P.file() !== loadedFile){ loadFile(); return; }
  if (doneSeq !== loadSeq){ doneSeq = ++loadSeq; status(''); }
  syncControls();
  applyColorBy();
}
fused.params.onChange(onParamsChanged);

els.metaBody.innerHTML = els.tableBody.innerHTML = '<span class="sk-bar" style="height:10px;width:60%"></span>';

loadFile();
</script>
</body>
</html>
