  // The stop landed. Whatever streamed before the kill is real work and stays.
  if (data.error) return { error: "", note: "Stopped.", keepText: true };
  // The stop did NOT land: the reply completed between the click and the signal.
  return { error: "", note: "The turn finished before the stop landed.", keepText: true };
}

async function stopRun() {
  const run_id = activeRun;
  if (!run_id || stoppedRun === run_id) return;  // nothing live, or already going
  stoppedRun = run_id;
  // Detach the queue BEFORE the await — a drain racing the cancel must find it
  // empty — but move nothing to the composer until the stop actually lands:
  // a failed cancel leaves the run live, and the queue (bubbles untouched, the
  // array put back) has to keep auto-draining when that run really ends.
  const held = queuedMsgs.splice(0);
  if (activeWorking) activeWorking.setStopping(true);
  try {
    await fused.runPython(AGENT, { action: "cancel", run_id }, { key: null });
    unqueueAll(held);
  } catch (err) {
    // The kill never reached the backend, so the run is still going and the poll
    // loop is still streaming it. Take the claim back: leaving it set would
    // relabel this run's real ending as a stop the user never got.
    stoppedRun = "";
    // unshift, not push: anything queued DURING the await went to the array's
    // tail, and its bubble sits below the held ones — the held entries go back
    // to the front so drain order keeps matching both typed and screen order.
    queuedMsgs.unshift(...held.filter((q) => !q.dead));
    // The mirror was deliberately NOT cleared at the splice above: the detach is
    // provisional until the cancel lands, and a frame that died mid-cancel would
    // otherwise come back to a live run with the queue erased. So the store
    // still holds these; re-persisting is what folds in whatever was queued
    // during the await and re-states the order they were just put back in.
    persistQueue();
    if (activeWorking) activeWorking.setStopping(false);
    addError("Could not stop the run: " + err.message);
  }
}

// Escape has four claimants in this pane: the screenshot viewer, the annotation
// composer, annotate mode, and a live run. Ordered least-destructive first —
// closing a picture undoes nothing at all, dismissing a popover is small and
// repeatable, leaving annotate mode costs one click to undo, killing a turn costs
// the turn. So a user reaching for Escape with a text box in front of them means
// the text box, and one reaching for it while annotating means annotate mode, not
// the run they may also have going. Split out as a pure decision so the
// precedence is a tested rule and not an ordering accident.
//
// The viewer goes FIRST for a stronger reason than cheapness: it is MODAL. It
// covers the composer and the pane, so every other claimant is behind it, and an
// Escape that stopped a run the user could not even see would be the worst
// outcome this key can produce.
function escapeAction(viewerOpen, composerOpen, annotating, runId) {
  if (viewerOpen) return "close-viewer";
  if (composerOpen) return "close-composer";
  if (annotating) return "exit-annotate";
  return runId ? "stop-run" : "";
}

// Gated on there being something to do, so the binding is inert the rest of the
// time — this page sits in an iframe and must not swallow Escape from the shell
// around it for nothing.
function onEscape(e) {
  if (e.key !== "Escape") return;
  // The textarea's own Escape handler stops propagation, so what reaches here
  // with the popover open is an Escape pressed with focus somewhere else.
  const act = escapeAction(!shotView.hidden, annPop.style.display === "block",
                           annOn, activeRun);
  if (!act) return;
  e.preventDefault();
  if (act === "close-viewer") shotViewClose();
  else if (act === "close-composer") annCloseComposer();
  else if (act === "exit-annotate") annSetMode(false);
  else stopRun();
}

// Bound on BOTH documents. Annotate mode is driven with the pointer over the
// iframe, so that is where the keydown lands, and a keydown in the frame's
// document does not bubble across the boundary to this one — the same reason the
// mousedown/mousemove/click handlers all hang off `doc`. The frame-side binding
// is (re)attached on every frame load; see the load handler.
document.addEventListener("keydown", onEscape);

// ── message queue: text typed while a run is live ──
// Mirrored into sessionStorage (see QUEUE_STORE below) so a teardown does not
// eat it, text-only by design: annotations and a captured pane shot are folded in
// at SEND time, so whatever is pending when a queued message actually goes
// out rides that send — which is also the desirable reading for the app-state
// snapshot (fresh state after the previous turn's edits, not a stale one from
// queue time). Each entry renders as a dashed placeholder bubble in #queue —
// a SIBLING after #log, not inside it, so queued messages always sit below
// every turn, including turns appended to the log while they wait; the ×
// unqueues it back into the composer.
//
// Sited BELOW stopRun (which calls into it — fine, the calls happen at click
// time) because test_claude_stop_run.py extracts `runEnding` as "everything up
// to `async function stopRun`" and runs it under node: anything between the
// two that touches `document` breaks that extraction.
// The queue's mirror. sessionStorage, not localStorage: the queue belongs to
// this tab's trip through this conversation — a mode switch, a navigation, a
// reload — and must not surface in a second window that happens to be looking
// at the same file, nor outlive the tab. One record — but NOT because one frame
// is one conversation: a tab can hold several of these pages at once now (the
// explorer's preview pane renders one for whatever row is selected, beside a
// full-screen chat), and they share this key. So a page may only ever write or
// delete the record it can prove is ITS OWN; see queueOwnedBy.
const QUEUE_STORE = "fused-render:claude-queue";

// The record for a queue, or null when there is nothing worth keeping. Pure so
// the identity rule is a tested decision rather than an accident of where the
// setItem call happens to sit.
//
// BOTH ids go in, and the restore matches on EITHER (see queueRestore), because
// they drift on purpose: `run` is set the moment a turn launches, while
// `session_id` only lands when the first poll reports it — so a message parked
// in that window knows only the run, and the boot that re-attaches to that run
// knows both. Storing the pair is what lets the two views of the same
// conversation recognise each other.
function queueRecord(sessionId, runId, texts) {
  if (!texts.length) return null;          // drained/unqueued to nothing
  if (!sessionId && !runId) return null;   // nothing a later boot could match on
  return { session: sessionId || "", run: runId || "", texts };
}

// The texts a stored record hands back to THIS boot — [] unless the record was
// written for the conversation now booting. That check is the whole guard
// against resurrection: a record from a finished or unrelated chat names ids
// this page does not have, and a brand-new chat names no ids at all, so neither
// can pull a previous conversation's words into the composer's place. Damage
// (hand-edited storage, a half-written record, a shape from an older build) is
// treated as absence rather than thrown: losing the queue is the bug we are
// fixing, but a red overlay on boot would be a worse one.
// Is the stored record THIS boot's own? The identity rule, on its own, because
// two questions need it and they must not answer differently: what may be
// restored, and — the dangerous one — what may be DELETED.
//
// A page that cannot match the record has no standing over it. sessionStorage is
// per TAB, not per frame, and the preview pane means a second claude page is
// mounted for any row that previews in claude mode: id-less, matching nothing,
// and (before this) deleting on sight the queue that a live conversation in the
// same tab had parked behind a running turn. Silently, and exactly in the
// scenario the queue was built for.
function queueOwnedBy(raw, sessionId, runId) {
  let rec;
  try { rec = JSON.parse(raw || "null"); } catch (err) { return false; }
  if (!rec) return false;
  return !!((rec.session && sessionId && rec.session === sessionId)
         || (rec.run && runId && rec.run === runId));
}

function queueRestore(raw, sessionId, runId) {
  let rec;
  try { rec = JSON.parse(raw || "null"); } catch (err) { return []; }
  if (!rec || !Array.isArray(rec.texts)) return [];
  if (!queueOwnedBy(raw, sessionId, runId)) return [];
  return rec.texts.filter((t) => typeof t === "string" && t);
}

// Write the CURRENT queue. Called from every place queuedMsgs changes — the
// enqueue, the ×, the drain, the hand-back — because a mirror that is only
// written on the way in re-sends messages that already went out, which is a
// worse failure than the one this replaces. Cheap enough to do eagerly: the
// queue is a handful of short strings.
//
// Returns whether the queue is safely stored, which is what the teardown hook
// answers with. A refused write (quota, a locked-down profile) is a real
// failure and says so; an empty queue is nothing to lose and says ok.
//
// The DELETE is gated by queueOwnedBy, exactly as restoreQueue's is, and for
// the same reason: an empty queue is not evidence the stored record is this
// page's. The pane's claude frame has no ids and no queue, and it reaches here
// on every mode switch — the shell awaits `__fusedFlushEdits` before it
// remounts anything — so an ungated removeItem let selecting a row bin the
// queue a live conversation elsewhere in the same tab had parked behind a
// running turn. The identical bug the restore side already had; both sites now
// ask the one question, which is why the rule is a function and not an inline
// comparison.
function persistQueue() {
  const sessionId = fused.params.get("session_id") || "";
  const runId = fused.params.get("run") || "";
  const texts = queuedMsgs.map((q) => q.text);
  const rec = queueRecord(sessionId, runId, texts);
  try {
    if (rec) sessionStorage.setItem(QUEUE_STORE, JSON.stringify(rec));
    else if (!texts.length) {
      // Nothing of ours to keep — so bin the record only if it IS ours. A
      // record we cannot name is left alone: it dies with the tab anyway, and
      // it may well be a running chat's.
      const raw = sessionStorage.getItem(QUEUE_STORE);
      if (raw && queueOwnedBy(raw, sessionId, runId)) sessionStorage.removeItem(QUEUE_STORE);
    }
    else return false;  // queued text with no id to key it by — see queueRecord
    return true;
  } catch (err) {
    console.warn("the message queue could not be saved:", err.message);
    // An EMPTY queue still says ok, whichever storage call threw. The hook's
    // {ok:false} exists to stop a teardown eating the user's TEXT, and there is
    // none here — the failed call was the removal of a record we no longer
    // need. Refusing the mode switch over that would strand the reader in a
    // pane to protect nothing. It read `return false` while the doc comment
    // above said the opposite, which held only because nothing had made a
    // locked-down store refuse a removal.
    return !texts.length;
  }
}

// Put a saved queue back on screen. Rebuilt through queueMessage, so restored
// entries are indistinguishable from freshly parked ones — same bubble, same ×,
// same array — and each append re-persists under the ids this boot has, which
// is how a record written with only a run id acquires its session id.
//
// The record is dropped only when this boot OWNS it and it has nothing left in
// it. It used to be dropped whenever it failed to match, on the reasoning that
// a record this page cannot adopt is a dead chat's leftovers — which was true
// while a tab held one of these pages. It no longer does: an id-less preview in
// the pane matches nothing by construction, so "does not match me" became "is
// almost certainly someone else's", and the sweep deleted live queues. A
// record nobody claims is harmless — it is keyed to ids no future boot will
// have, and sessionStorage dies with the tab.
function restoreQueue(sessionId, runId) {
  let raw = null;
  try { raw = sessionStorage.getItem(QUEUE_STORE); } catch (err) { return; }
  if (!raw) return;
  const texts = queueRestore(raw, sessionId, runId);
  for (const t of texts) queueMessage(t);
  if (!texts.length && queueOwnedBy(raw, sessionId, runId)) {
    try { sessionStorage.removeItem(QUEUE_STORE); } catch (err) {}
  }
}

// The shell's remount-safety hook, same contract as the code template's editor
// (Preview.tsx awaits it before switching modes, with a 10 s bound, and aborts
// the switch on {ok:false}). The queue is written on every mutation already, so
// this is a belt-and-braces re-save covering anything that changed the array
// without going through those paths — and, more importantly, the one place that
// can REFUSE to let the frame go when the queue genuinely cannot be stored.
// Never {ok:false} merely because a queue exists: a user with messages parked
// behind a run must still be able to change modes.
window.__fusedFlushEdits = async () => {
  return { ok: persistQueue() };
};

const queueEl = document.getElementById("queue");
const queuedMsgs = [];  // [{ text, el }]

function queueMessage(text) {
  const d = document.createElement("div");
  d.className = "turn queued";
  const b = document.createElement("div");
  b.className = "qbubble";
  b.textContent = text;
  const meta = document.createElement("div");
  meta.className = "qmeta";
  const lbl = document.createElement("span");
  lbl.textContent = "queued";
  const x = document.createElement("button");
  x.type = "button";
  x.className = "qx";
  x.textContent = "remove";
  x.title = "Unqueue: put this message back in the input box";
  const entry = { text, el: d };
  x.onclick = () => {
    const i = queuedMsgs.indexOf(entry);
    if (i >= 0) queuedMsgs.splice(i, 1);
    entry.dead = 1;  // may be detached in stopRun's `held` right now — see below
    persistQueue();
    d.remove();
    // Back into the composer, not the void — appended so a draft in progress
    // is never clobbered.
    box.value = box.value ? box.value.replace(/\s*$/, "\n\n") + text : text;
    growBox();
    focusBox(box);
  };
  meta.append(lbl, x);
  d.append(b, meta);
  queueEl.appendChild(d);
  scrollBottom();
  queuedMsgs.push(entry);
  persistQueue();
}

// Fire the next queued message once nothing is live. Called from the tails of
// sendMessage AND resumeRun — a message queued against a re-attached run has
// to drain too. Draining after an errored turn is deliberate (the user queued
// it knowing less than we do now, but un-sending their words is worse); a
// STOPPED turn is the exception, handled in stopRun above.
function drainQueue() {
  if (sending || activeRun || !queuedMsgs.length) return;
  const next = queuedMsgs.shift();
  // Out of the store as it leaves the array, not after the send resolves: from
  // here the text's fate is sendMessage's (a real user bubble, and on failure
  // an error beside it), and a mirror still holding it would re-park a message
  // the next boot can already see in the log.
  persistQueue();
  next.el.remove();  // sendMessage adds the real user bubble
  sendMessage(next.text);
}

// Stop means halt: give queued text back to the composer instead of firing it
// at the session a second after the user said stop. Takes the entries rather
// than reading queuedMsgs, because stopRun detaches them first.
function unqueueAll(entries) {
  for (const q of entries) {  // head first: composer keeps typed order
    if (q.dead) continue;  // × was clicked while this entry was detached
    q.el.remove();
    box.value = box.value ? box.value.replace(/\s*$/, "\n\n") + q.text : q.text;
  }
  growBox();
  // The entries are in the composer now and gone from the array, so the mirror
  // has to let them go too — otherwise a reload would show them BOTH parked
  // below the log and typed in the box, and send the copy nobody edited.
  persistQueue();
}

// ── send one message: start detached claude, poll + stream ──
// One turn at a time: concurrent turns would share the session_id param and
// launch parallel claude runs against the same resumed session.
let sending = false;
// Which action OWNS `sending`, and which loop owns the running chrome. Both
// are monotonic seats: a finally that wakes late (its action was abandoned by
// the back button, or superseded by a re-attach to the same run id) proves it
// is still the newest holder before it releases anything — equality on the
// flag, or even on the run id, is not proof (Bugbot, PR #653: a reopened chat
// re-attaches to the SAME run_id, and the abandoned loop's finally stripped
// the new loop's Stop chrome; a new send's gate was wiped the same way).
let sendSeq = 0;
let loopSeq = 0;
// The generation of the visible log. The back button bumps it when it wipes
// the transcript, and a streaming pollLoop that wakes to a bumped number
// bails before touching the DOM or the URL params — the run itself keeps
// going server-side, and resumeRun re-attaches to it from the session list.
let logGen = 0;

// Stream one run into the log. The `run` URL param marks the run as in-flight
// for the page's whole life — if this frame dies mid-loop, the subprocess
// keeps going and the next boot re-attaches via resumeRun.
async function pollLoop(run_id, gen = logGen) {
  const seat = ++loopSeq;
  const w = addWorking();
  // This run is now the one the stop button and Escape aim at. Set here, the one
  // place a run is ever in flight, which covers a re-attached run for free.
  activeRun = run_id;
  activeWorking = w;
  setRunningUi(true);
  // `gen` is the log generation this loop is allowed to write, and it is the
  // CALLER'S sample, not one taken here (Bugbot, PR #653): sendMessage and
  // resumeRun sample it before their own awaited start/probe, so a Back that
  // lands during those awaits already outdates the number this loop compares
  // against — sampled here instead, the loop would adopt the wiped landing as
  // its log and re-write the very params (session_id) the leave just cleared.
  noteChatActivity();
  let reply = null;
  let typer = null;
  let segBody = null;    // the element the segment views are rendered into
  let segMode = false;   // this turn returned segments, so they are the truth
  let tailText = null;   // the trailing text segment, for typer.finish()
  // Ticks of THIS loop, so the artifacts read below is one in every eight polls
  // (~3.2s) rather than one every 400ms: a publish is a rare event in a turn and
  // a transcript read is an open() of a file that is being appended to.
  let tick = 0;
  try {
    while (true) {
      const data = await fused.runPython(AGENT, { action: "poll", run_id, file: FILE }, { key: null });
      if (logGen !== gen) break;  // the reader left; the run continues without this page
      if (data.session_id) { fused.params.set("session_id", String(data.session_id)); showSession(); }
      // Not awaited, for the same reason the app-state answer below is not: a
      // strip of chips may never hold up the streaming reply by a single frame.
      if (tick++ % 8 === 0) pollArtifacts();
      // usage arrives only at message end; estimate from streamed text meanwhile
      const tokens = Math.max(data.tokens || 0, Math.round((data.text || "").length / 4));
      w.setStats(tokens, data.phase || "thinking", data.retry);
      syncPermissions(data.permissions, run_id, w, data.mode);
      noteSkills(data.skills, w);
      // Not awaited: a snapshot must never hold up the streaming reply, and the
      // answered-set makes a second poll arriving mid-answer a no-op.
      if (data.app_state && data.app_state.length) answerAppState(data.app_state, run_id, w);
      // `segments` is the authoritative transcript of the turn (text,
      // thinking, tool calls, in order — see _segments_from_rows). `data.text`
      // is the flat legacy field and is NOT rendered as well when segments
      // exist: on a run that carried stream deltas the text segments join back
      // to exactly that string, so rendering both prints the reply twice.
      const segs = Array.isArray(data.segments) ? data.segments : [];
      if (segs.length || data.text) {
        if (!reply) {
          reply = addAssistant("");
          log.insertBefore(reply, w.el);  // status line stays below the streaming reply
          segBody = reply.lastChild;
          // Parked when there are segments: renderSegments points the typer at
          // the trailing text segment, which may not exist yet (a turn can open
          // with a tool call) and changes as the turn grows.
          typer = makeTyper(segs.length ? null : segBody);
        }
        if (segs.length) {
          if (!segMode) {
            // A first poll with text but no segments yet (no assistant row on
            // disk) started this turn on the legacy path — take it back before
            // the segments render, or the flat text stays behind them.
            segMode = true;
            typer.retarget(null);
            segBody.replaceChildren();
            // Published only NOW, and this is the reason: the line above is the
            // one and only sweep this container ever sees, so a resolved card
            // parked into it afterwards (parkResolvedCard) can never be swept
            // away. Before the flip there is nothing to park into anyway.
            activeSegBody = segBody;
          }
          tailText = renderSegments(segBody, segs, { typer });
        } else if (!data.done) typer.update(data.text);
      }
      if (data.done) {
        fused.params.set("run", "", { history: "replace", default: "" });
        w.stop(); w.el.remove();
        // The run this frame sent (or re-attached to) is over: annotations it
        // carried are handled — auto-resolve them. Kept even on error? No: an
        // errored run may not have acted on them, but they were already
        // stamped `sent` and folded into the transcript, so they resolve
        // either way — re-annotating is one click, silently re-sending isn't.
        annResolveSent();
        // The turn may have edited the file, and Claude Code checkpoints what it
        // edits — so the snapshots panel's cached timeline is now behind.
        snapInvalidate();
        // One last read: a page published in the final seconds of the turn would
        // otherwise sit unmentioned until the user went back to the landing page.
        pollArtifacts();
        const end = runEnding(data, stoppedRun === run_id);
        if (!end.keepText) {
          if (typer) typer.abort();
          if (reply) reply.remove();
        } else if (segMode) {
          // Drain the trailing prose (`null` when the turn ended on a tool
          // call — finish() then just retires the cursor), then one
          // highlight/copy pass over the whole finished transcript: the text
          // segments, and every <pre> the tool chips added.
          await typer.finish(tailText || "");
          attachCodeCopy(reply);
        } else if (typer) {
          await typer.finish(data.text);
        } else if (data.text) {
          // A run whose text only ever arrived on the poll that ENDED it, so no
          // typer was ever pointed at anything. Through addAssistantTurn like
          // the other finished-turn renders (D246's one-renderer rule): this
          // used to hand-roll `innerHTML = renderMd(...)`, which meant a payload
          // that carried segments here rendered its flat text instead of them.
          attachCodeCopy(addAssistantTurn(data.text, data.segments));
        }
        if (end.error) addError(end.error);
        if (end.note) addNote(end.note, null, "⏹");
        break;
      }
      await sleep(400);
    }
  } catch (err) {
    // Kill the rAF loop and drop the partial bubble so a failed run never
    // leaves a half-streamed reply behind. The `run` param is deliberately
    // NOT cleared: a poll that died with the page being torn down should
    // still re-attach on the next boot.
    if (typer) typer.abort();
    if (reply) reply.remove();
    addError(err.message);
  } finally {
    // stop() unconditionally, remove() only if it is still in the log: the
    // guard used to cover both, so a working line that had already been
    // detached (the run-end branch above, a history wipe) left its 1s interval
    // running forever, holding the whole closure — one leaked timer per turn.
    w.stop();
    if (w.el.isConnected) w.el.remove();
    // Nothing is interruptible any more. Cleared even when the loop threw: an
    // Escape landing after this must not cancel a finished run and then mislabel
    // the NEXT turn's ending as a stop. OWNERSHIP-GUARDED (Bugbot, PR #653),
    // and ownership means being the NEWEST loop, not matching the run id: a
    // chat left mid-turn and reopened re-attaches to the SAME run_id, and the
    // abandoned loop's late finally matched it and stripped the new loop's
    // Stop square and Escape target.
    if (loopSeq === seat) {
      activeRun = null;
      activeWorking = null;
      activeSegBody = null;
      setRunningUi(false);
    }
    // Turn boundary either way — the tasks surfaces should hear about it even
    // when a newer loop owns the chrome (the ACTIVITY is real regardless).
    noteChatActivity();
  }
}

// Tell every OTHER document on this origin that a turn just started or ended
// here. Interactive turns make no sys:schedule job, so nothing else tells the
// tasks surfaces about them: the shell's tasks store (frontend
// tasksPulse.CHAT_ACTIVITY_KEY) listens for this stamp's `storage` event and
// re-reads /api/tasks, so the Tasks page and the sidebar flip to In Progress /
// unread the moment a follow-up goes out rather than on their next 20-30s poll
// (Akshil, 2026-08-19: "the task's unread status does not update"). A storage
// event only fires on a CHANGED value and never in the writing document, which
// is exactly the shape needed: this frame has nothing to update, and the clock
// plus a nonce means two panes stamping in the same millisecond cannot swallow
// each other's poke. Best-effort — a blocked store (private mode, locked-down
// webview) costs the poke, never the turn; the polls still cover it.
function noteChatActivity() {
  try {
    localStorage.setItem("fused-render:chat-activity",
      Date.now() + ":" + Math.random().toString(36).slice(2));
  } catch (err) { /* the 20-30s polls remain the fallback */ }
}

// The composer's send buttons double as stop buttons while a run is live: the
// arrow swaps for a stop square (CSS on body.running) and a click aims at the
// run, same as Escape. Labels follow so a screen reader hears the real action.
function setRunningUi(on) {
  document.body.classList.toggle("running", on);
  document.querySelectorAll(".send").forEach((b) => {
    b.setAttribute("aria-label", on ? "Stop" : "Send");
    // No "(Esc)" hint: Escape's first claim is the annotation composer, then
    // annotate mode (default ON) — during a normal run it disarms annotating,
    // not the turn. Advertising it here would teach a keystroke that usually
    // does something else; the working line's own stop control stays the
    // keyboard-adjacent path.
    b.title = on ? "Stop this turn" : "";
  });
}

async function sendMessage(message) {
  if (sending) return;
  sending = true;
  const seat = ++sendSeq;
  // Sampled before anything is awaited: a Back landing mid-start outdates this
  // number, and everything below that touches the page (the run param, the
  // streaming loop, the queue drain) checks it first (Bugbot, PR #653).
  const gen = logGen;
  // Fold pending annotations into the outgoing message and stamp them `sent`.
  // If the start below never launches a run, the stamp (and the receipt) are
  // rolled back so the notes stay editable and re-sendable.
  const pending = annPending();
  // Taken and CLEARED here, at the top and before anything is waited on: the
  // pictures belong to ONE message, so a second send fired while this one is still
  // running must not inherit them. The chips go at the same moment, which is what
  // a user reads as "they went with that one".
  // `pics`, not `shots`: `shots` is taken further down by the annotation CROPS,
  // and two collections of pictures under one name in one function is exactly the
  // shadowing the receipt loop below already had to be warned about once.
  const pics = shotAttached;
  if (pics.length) { shotAttached = []; renderAnn(); }
  if (!message && !pending.length && !pics.length) { sending = false; return; }
  // Both composer entry points come through here, so the snapshot is taken in
  // exactly one place — at SEND time, which is the moment whose state the user is
  // describing when they type.
  const state = appStateSnapshot();
  // The bubble goes up BEFORE the screenshot capture below, which is the one slow
  // step on this path: the user's words appearing instantly is worth more than a
  // receipt and a bubble arriving together.
  let bareTurn = null;
  if (message) {
    addUser(message);
  } else {
    // annotation- or screenshot-only send: a bubble-less user turn to hang the
    // receipt on
    bareTurn = document.createElement("div");
    bareTurn.className = "turn user";
    log.appendChild(bareTurn);
  }
  // Labels first, THEN the capture: the letter burned into the overview and the
  // `label` the wire carries must be the same string, and annotations.indexOf
  // can shift between now and any later read (notes resolve, notes are added) —
  // so the label is computed once here and stored on the note.
  pending.forEach((c) => { c.label = annLabelFor(annotations.indexOf(c)); });
  // ONE screenshot of the whole pane with every pending note's badge burned in.
  // Awaited because composeOutgoing needs the path, and bounded and swallowing,
  // because no screenshot is worth losing the user's message over (annOverview).
  const overview = pending.length ? await annOverview(pending) : null;
  annApplyOverview(pending, overview);
  // Write the DOM outline to a file and send its path instead of its bytes. Here
  // rather than inside composeOutgoing because that function is sync and pure —
  // it is the exact inverse of stripBlocks, and both halves have to stay that way.
  const sentState = await appStateFile(state);
  // Each picture goes on the wire as its path, its note, its kind and its name and
  // nothing else: `thumb` is a blob URL belonging to THIS page, which is a dead
  // link everywhere else and unreadable to the agent. They are not folded into the
  // annotations either — a picture is not an anchor's property, it is never
  // persisted, and so it has no stale-path case to clear.
  const wireViews = pics.map((s) => {
    const wire = { kind: s.kind || "pane", view: s.view || null };
    if (s.viewNote) wire.viewNote = s.viewNote;
    if (s.name && s.kind === "image") wire.name = s.name;
    return wire;
  });
  // The overview rides the same pictures block the user's own attachments do —
  // one writer, one reader (paneShotIn), so a restored turn shows it too. First
  // in the list: it is the picture the annotations block tells the model to read.
  if (overview) {
    const wire = { kind: "overview", view: overview.view || null };
    if (overview.viewNote) wire.viewNote = overview.viewNote;
    wireViews.unshift(wire);
  }
  const outgoing = composeOutgoing(message, pending, sentState, wireViews);
  if (pending.length) {
    for (const c of pending) c.sent = 1;
    annSave();
  }
  // Subtle receipt under the bubble: which annotations rode this message, and
  // which pictures did. Built whenever there is EITHER, since a picture-only send
  // attaches a file too and nothing is attached invisibly.
  let receipt = null;
  if (pending.length || pics.length) {
    const turns = log.querySelectorAll(".turn.user");
    const turn = turns[turns.length - 1];
    const sum = document.createElement("div");
    receipt = sum;
    sum.className = "annsum";
    // The overview first — it is the one picture every annotation row refers
    // to — then the user's own attachments, then the labelled rows.
    if (overview) shotReceipt(sum, { ...overview, kind: "overview" });
    for (const pic of pics) shotReceipt(sum, pic);
    // One row per comment, through the same builder a restored turn uses.
    for (const c of pending) sum.appendChild(annReceiptRow(c));
    // The full story, on demand: clicking any comment row — or, when comments
    // ride the message, any of its screenshot thumbs — opens the popup with
    // exactly what went to the agent — the composed text, the pictures, every
    // comment with its context. A picture-only send is NOT wired: its thumb
    // keeps the plain full-size viewer, there being no comments to show.
    if (pending.length) {
      sentPopWire(sum, { outgoing, overview, pics,
                         notes: pending.map((c) => ({ ...c })) });
    }
    turn.appendChild(sum);
    scrollBottom();
  }
  // The push channel's own receipt. A sibling of the bubble, not a wrapper around
  // it: the re-attach probe matches on `.user .bubble`'s textContent, and folding
  // this line inside would make every such turn stop matching.
  let attach = null;
  if (state) {
    const turns = log.querySelectorAll(".turn.user");
    attach = document.createElement("div");
    attach.className = "attach";
    attach.textContent = "app state attached";
    turns[turns.length - 1].appendChild(attach);
    scrollBottom();
  }
  let started = false;
  try {
    const { run_id, error } = await fused.runPython(AGENT, {
      action: "start",
      file: FILE,
      message: outgoing,
      session_id: fused.params.get("session_id") || "",
      model: curModel(),
      effort: curEffort(),
      permission_mode: fused.params.get("permission") || DEFAULT_PERMISSION,
      // WHETHER THERE IS A PANE IS THIS PAGE'S ANSWER TO GIVE, and it is sent on
      // every turn. `noPane` is the layout flag enterNoPane sets, so this is a
      // report of what is on screen — the only thing that can be — rather than a
      // second guess at what is on disk. agent.py used to re-resolve it per turn,
      // which drifted the moment a session scaffolded an app into an ordinary
      // folder: turn 2 offered `app_state` against a chat with no pane, and the
      // model got APP_STATE_UNREADABLE back, which the invariant beside that
      // constant says can never be the answer to it. See agent.py `_has_pane`.
      has_pane: noPane ? "0" : "1",
      // key:null — all agent calls opt out of default per-file cancellation
      // (D114): start/poll/history/sessions share one file, and superseding an
      // awaited poll would leave it pending and hang the streaming loop.
    }, { key: null });
    if (error) throw new Error(error);
    started = true;
    // A run id is in-flight bookkeeping — what the page re-attaches to after a
    // reload — and never a place the reader navigated to, so no `run` write of
    // any kind buys the visit's one entry (PR-3): the push belongs to the first
    // thing the user actually does, and a Back onto a finished run's id is a
    // history entry that restores nothing.
    if (logGen === gen) {
      fused.params.set("run", run_id, { history: "replace" });
      await pollLoop(run_id, gen);
    }
    // else: the reader left during start — the run continues server-side and
    // resumeRun/adoptLiveRun can re-attach; the landing gains no run param.
  } catch (err) {
    // The run never launched, so the agent never saw the annotations: give
    // them back as pending (and pull the receipt) so they can be re-sent.
    if (!started) {
      // Same for the app-state receipt: nothing was attached to anything.
      if (attach) attach.remove();
      if (pending.length) {
        for (const c of pending) c.sent = 0;
        annSave();
      }
      // Outside the pending check: a screenshot-only send has a receipt and a
      // ghost row to clean up too, with no annotations at all.
      if (receipt) receipt.remove();
      if (bareTurn) bareTurn.remove();  // no bubble either — drop the ghost row
      // Removing the receipt detaches the only <img> holding the overview's
      // thumbnail blob URL, and an unrevoked one pins its Blob for the life of
      // the page. A retried send captures a fresh overview anyway.
      shotRevoke(overview);
      // The attached pictures are the opposite case and must NOT be revoked: they
      // are handed back to the composer as pending chips, which show those very
      // thumbnails. The user attached them deliberately — a capture of a moment
      // that has passed, or a file they went and found — and a failed send is not
      // a reason to make them do it again, nor could they, if what they
      // photographed is gone. Prepended, so a picture attached WHILE the send was
      // in flight keeps its place after the ones that were already waiting.
      if (pics.length) { shotAttached = pics.concat(shotAttached); renderAnn(); }
    }
    addError(err.message);
  } finally {
    if (sendSeq === seat) sending = false;
  }
  scrollBottom();
  focusBox(box);
  // Same-generation only: after a Back, the parked follow-ups belong to the
  // conversation that was left — firing them from the landing would launch a
  // hidden new chat (Bugbot, PR #653). Their sessionStorage mirror survives,
  // so reopening the session restores them, still queued.
  if (logGen === gen) drainQueue();
}

// Re-attach to a run that was streaming when this page last unloaded (mode
// switch / reload): only the poll loop died with the frame — the detached
// claude subprocess kept working. The poll replays the WHOLE turn's text, so
// any partial rows the history restore already rendered are trimmed first.
// ── a scheduled send firing while this chat is open ───────────────────────
//
// The gap this closes: a scheduled message is spawned by the SERVER, so nothing
// here ever set `activeRun` and the turn happened entirely off-screen. A chat
// left open past its own scheduled time sat on "Scheduled for 12:20" while the
// session ran, finished, and edited files — with the page's only route to the
// truth being a reload. Reported from use, and it outlived the composer pill that
// prompted it: a task made on the Schedule page for THIS folder still fires into
// this conversation, and a chat left open is still where the user watches it.
//
// `resumeRun` already does the hard half. It is written for exactly this shape —
// a run this frame did not start and may have missed the end of — and handles
// both cases: still live (render the user line, then `pollLoop` streams the rest)
// and already finished (repair the transcript from the poll payload).
// TWO sets, because "already on screen" and "already mentioned" are different
// questions. ATTACHED stops a run being rendered twice. NOTED stops the same
// "ran in another session" line being repeated every 15s while the reader sits on
// a different session — it is not a claim that the run can never be adopted here.
//
// Adoption is `loadHistory`'s job, not this poller's: switching to that session
// re-renders the transcript FROM history, which already contains the turn. That is
// also why both sets are cleared there (see scheduleResetForNewTranscript) — an
// earlier version left a foreign run unmarked so a later switch could attach it,
// which appended a second copy on top of the one history had just restored.
const SCHEDULE_ATTACHED = new Set();
const SCHEDULE_NOTED = new Set();
let scheduleBaselined = false;
const SCHEDULE_POLL_MS = 15000;

// Whether a fired entry's turn belongs in the transcript ON THIS SCREEN. Getting
// this wrong is worse than not attaching at all: splicing another conversation's
// turn into this one would be a page telling a lie about what was said where.
function scheduledRunIsOurs(entry) {
  const mine = fused.params.get("session_id") || "";
  const ran = entry.claude_session_id || "";
  // With a session on screen, only that same conversation counts — whether the
  // entry named it up front (`session_id`, a follow-up scheduled from here) or
  // reported it once the run started (`claude_session_id`).
  if (mine) return entry.session_id === mine || ran === mine;
  // With no session yet, a send that resumed nothing created one this frame can
  // adopt; one that resumed someone else's belongs on their screen, not here.
  return !entry.session_id;
}

// Called by `loadHistory` whenever the visible conversation is REPLACED. The
// freshly restored transcript is the record of everything that has already fired,
// so nothing fired before this moment may attach — it is either on screen already
// or belongs to a session this frame is not showing. Re-baselining is what makes
// `neverShown` true by construction for the attaches that remain: a run that gets
// through fired AFTER this render, so it cannot be in it.
//
// A run firing DURING the history round trip is baselined away and will not
// attach. That window is one request wide, and it fails in the recoverable
// direction — a turn that needs a reload to appear, rather than one shown twice.
function scheduleResetForNewTranscript() {
  SCHEDULE_ATTACHED.clear();
  SCHEDULE_NOTED.clear();
  scheduleBaselined = false;
  // The block belongs to the conversation that WAS on screen, so it goes with it
  // rather than hanging over the next one for up to a poll interval. Unblocking
  // is the safe direction to be briefly wrong in (see applyComposerBlock), and
  // the poll fired underneath re-establishes it for this session immediately.
  clearComposerBlock();
  pollScheduledRuns();
}

// ── the composer block: a pending scheduled message owns this thread ────────
//
// A task IS a session, so a message scheduled to run in THIS conversation will
// read whatever is in it when it fires. Typing here first is not getting ahead —
// it is CONTEXT POLLUTION: the run answers a conversation the person who
// scheduled it never wrote, and nothing can take those words back out of the
// context once the turn has read them.
//
// So the composer closes for as long as the schedule holds a pending message for
// this session, and NOT for a window. An hour was offered first and is arbitrary
// in the wrong direction (Akshil, 2026-08-17 — "why can't we block it until the
// next task is scheduled? why only one hour?"): a message due tomorrow pollutes
// exactly as much as one due in ten minutes, so the block is the pendency, not
// the proximity.
//
// A BANNER, not a modal: the transcript stays readable and the session list
// stays reachable. It carries ONE action, and that action is whichever one
// actually reopens the box — which is not the same control in the two cases:
//
//   * a one-off pending message: cancelling it unblocks, full stop;
//   * a REPEAT: cancelling the occurrence unblocks nothing, because
//     `_materialize` arms the next one and it blocks again. The only thing that
//     reopens the box is stopping the repeat itself — `schedule.cancel(template_id)`,
//     which already means "no further runs" and takes the pending occurrence
//     with it.
//
// The banner used to offer "Cancel this run" and "Reschedule" for both, and both
// were wrong for a repeat: rescheduling leaves the message pending, so the block
// survives it, and cancelling one run only moved the block to the next one — the
// old copy said so in its own body, which was an admission that its own button
// did not work (Akshil, 2026-08-17). A control whose only outcome leaves the user
// still blocked does not belong in a notice about being blocked.
//
// WHAT IT SHOWS is the Tasks list view's own row — a status ring, TASK-nnn, the
// name, and the state and time at the right end — because the second shape was
// still wrong (Akshil, 2026-08-17 — "this UI is not good... it does not give me
// what I want"): it explained the block in prose and then dumped the message
// underneath as bare left-aligned text. A reader who knows the Tasks page already
// knows how to read this row, and reusing that vocabulary is what makes the
// banner a view of the schedule rather than a paragraph about it.
//
// Not on the row: the FOLDER and the SESSION ID. "You will not show the folder
// because you are already in that folder, you are not showing the session ID
// because you are already there" (Akshil, 2026-08-17). The list view carries both
// because it spans projects; inside the conversation they are the context, not
// news. The row's click is the way to everything the banner therefore leaves out.
const schedBlockEl = document.getElementById("schedblock");
const schedBlockWhen = schedBlockEl.querySelector(".sb-when");
const schedBlockRow = document.getElementById("sb-row");
const schedBlockRing = schedBlockEl.querySelector(".sb-ring");
const schedBlockId = schedBlockEl.querySelector(".sb-id");
const schedBlockName = schedBlockEl.querySelector(".sb-name");
const schedBlockMeta = schedBlockEl.querySelector(".sb-meta");
const schedBlockNote = schedBlockEl.querySelector(".sb-note");
const schedBlockStop = document.getElementById("sb-stop");
// THE CHAT COMPOSER'S CALENDAR BUTTON, which goes dead with the box it sits in
// (Akshil, 2026-08-17 — "when we have a blocked panel we don't allow to type…
// we should not allow to schedule the task as well"). A session already holding
// pending scheduled work takes no further input of ANY kind: queuing a second
// message into a context that is spoken for is the same pollution the block
// exists to prevent, one step later. See applyComposerBlockState.
//
// The HOME card's copy (#hschedbtn) is deliberately not touched, for the same
// reason `homebox` is not: there is no session on the landing page, so nothing
// can be pending in the conversation it is about to start (schedPendingHere
// returns [] without one) and a handle to it here would be dead wiring.
const schedBtn = document.getElementById("schedbtn");
const BOX_PLACEHOLDER = box.placeholder;
// The pristine wording, read off the markup rather than retyped, which is what
// BOX_PLACEHOLDER above is doing too: the button's own attributes stay the one
// place its name lives, so a re-word there cannot leave this file restoring a
// tooltip nobody writes any more.
const SCHED_BTN_TITLE = schedBtn.title;
const SCHED_BTN_LABEL = schedBtn.getAttribute("aria-label");

// The pending messages that would land in this conversation, soonest first.
// EMPTY is the only state in which the composer works — and it is also the state
// a schedule that could not be read leaves behind (applyComposerBlock).
let schedBlockers = [];
// The entry whose cancel came back refused (it was already away). Kept by ID so
// the sentence belongs to a message rather than to the banner — see
// renderSchedBlock.
let schedStopRefused = "";
// The entry whose STOP has been pressed once. Stopping a repeat loses every
// future run and nothing on this page can put them back, so it takes two presses
// — the template's own idiom (see snapAction, and the ✕ / "Back to chat" pair),
// where the button becomes the question in place rather than raising a dialog.
//
// Page state and keyed by ID, not a class on the button, for the reason
// schedStopRefused is: the 15s poll re-renders this card, and an armed button
// that quietly disarmed itself a few seconds after the press would be worse than
// no confirm at all. A DIFFERENT entry arriving in front clears it — that press
// was aimed at the repeat that was on screen.
let schedStopArmed = "";

function schedBlocked() { return schedBlockers.length > 0; }

// Which pending messages are aimed at THIS conversation. `session_id` is the
// input ("resume this one") and `claude_session_id` is what a run reported it
// landed in; either naming the session on screen means the same thing here —
// this thread is where those words are going. With no session on the URL nothing
// can be pending in it (the landing page's conversation does not exist yet), so
// the home composer is never blocked.
function schedPendingHere(entries) {
  const mine = fused.params.get("session_id") || "";
  if (!mine) return [];
  const ours = (entries || []).filter((e) => e && e.state === "pending"
    && (e.session_id === mine || e.claude_session_id === mine));
  ours.sort((a, b) => String(a.due || "").localeCompare(String(b.due || "")));
  return ours;
}

// Local calendar days apart, computed from midnights rather than by dividing a
// millisecond gap: on the two DST days of the year a day is 23 or 25 hours long,
// and "tomorrow" is a calendar fact, not an 86_400_000ms one.
function schedDayGap(then, now) {
  const a = new Date(then.getFullYear(), then.getMonth(), then.getDate());
  const b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((a - b) / 86400000);
}

// When it goes, in the ROW's vocabulary — "14:00 tomorrow", the shape tasks-lib.ts
// `messageTime` writes into the list view's time cell: a 24-hour clock, a space,
// and a relative day word. TWENTY-FOUR HOUR and not the locale's clock, which is
// the one place this row departs from the rest of the template: a 12-hour locale
// renders "02:00 PM", three characters wider in a cell that has to stay readable
// in a 340px pane, and it would not match the time on the page this row is
// quoting. Past due is "any moment now" and not a time in the past — a queued
// message is waiting for the next sweep, so the stamp on it stopped being the
// answer to "when?".
function schedPad2(n) { return String(n).padStart(2, "0"); }

function schedWhenText(iso) {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "at its scheduled time";
  if (d.getTime() <= Date.now()) return "any moment now";
  const at = schedPad2(d.getHours()) + ":" + schedPad2(d.getMinutes());
  const gap = schedDayGap(d, new Date());
  if (gap <= 0) return at + " today";
  if (gap === 1) return at + " tomorrow";
  if (gap < 7) return at + " " + d.toLocaleDateString([], { weekday: "short" });
  return at + " " + d.toLocaleDateString();
}

// The scheduled message on one line — the row's NAME when the tasks listing has
// no title of its own to give (see schedTaskRec).
//
// Whitespace COLLAPSES rather than the first line winning: a prompt that opens
// "Read the following and:" would otherwise preview as its own preamble. The CSS
// ellipses whatever does not fit, so nothing is cut at a fixed character count
// that a 340px pane and a 720px one would both get wrong.
function schedMsgLine(entry) {
  const text = String((entry && entry.message) || "").replace(/\s+/g, " ").trim();
  return text || "A scheduled message";
}

// ── the task behind the blocker ────────────────────────────────────────────
//
// TASK-nnn, the task's name and its state are NOT in /api/schedule — the numbers
// are allocated per project by tasks_store and only /api/tasks hands them out.
// So the row is filled from two reads: the schedule says what is pending and
// when (and is the only thing the BLOCK depends on), the tasks listing says what
// to call it.
//
// Cached against the blocking entry's id and refetched only when that changes,
// because the listing carries every task on the machine and this poll runs every
// 15 seconds: what it is fetched for — a number and a name — does not change
// while one message sits pending. `state` can go stale by a poll, which is the
// cheaper of the two mistakes.
let schedTaskRow = null;
let schedTaskRowFor = "";
let schedTaskRowBusy = false;

// The five states the shell's board defines (schedule-lib.ts BOARD_COLUMNS), and
// the words it puts on them. Unknown is "Upcoming" here rather than the shell's
// "Done": every entry this banner can be looking at is PENDING, so a state that
// does not parse is a listing that has not answered yet, not a finished job.
const SB_STATES = {
  upcoming: "Upcoming",
  in_progress: "In Progress",
  done: "Done",
  failed: "Failed",
  archived: "Archive",
};

// The listing row for the message holding this box shut. Three ways in, cheapest
// first: a task keyed by THIS session (a scheduled entry naming a session is
// folded into that session's task — routers/tasks.py `_collect`), a task keyed
// `pending:<entry id>` (the entry has no session yet), and failing both a scan
// for the message itself. The scan is last because the listing carries only each
// task's three newest messages, so it is the one that can legitimately miss.
function schedFindTask(tasks, entry) {
  const id = String((entry && entry.id) || "");
  const mine = fused.params.get("session_id") || "";
  const pending = "pending:" + id;
  let byMessage = null;
  for (const task of (tasks || [])) {
    if (!task) continue;
    if ((mine && task.key === mine) || task.key === pending) return task;
    if (!byMessage && (task.messages || []).some((m) => m && m.entry_id === id)) {
      byMessage = task;
    }
  }
  return byMessage;
}

// What the row knows about this entry, or null. Keyed by id so a cache belonging
// to the message that WAS blocking cannot label the one that is.
function schedTaskRec(entry) {
  return entry && schedTaskRowFor === String(entry.id) ? schedTaskRow : null;
}

// FAILS OPEN, like everything else here: an unreadable listing costs the number
// and the state, never the row and never the block — the schedule already said
// this message is pending, and that is the fact the composer is shut on. No
// `schedTaskRowFor` is recorded on a failure, so the next poll tries again.
async function schedLoadTaskRow(entry) {
  const id = String((entry && entry.id) || "");
  if (!id || schedTaskRowBusy || schedTaskRowFor === id) return;
  schedTaskRowBusy = true;
  try {
    const res = await fetch("/api/tasks");
    if (!res.ok) throw new Error(String(res.status));
    const data = await res.json();
    schedTaskRow = schedFindTask(data.tasks, entry);
    schedTaskRowFor = id;
    // The entry may have been stopped while this was in flight; renderSchedBlock
    // reads the CURRENT blocker, so a stale answer paints nothing.
    renderSchedBlock();
  } catch (err) {
    schedTaskRow = null;
  } finally {
    schedTaskRowBusy = false;
  }
}

// Where the row LANDS: the Tasks page, on the calendar, which is the view that
// answers the question a blocked chat is asking — "when does this let go?".
//
// The view is chosen by writing the shell's own remembered-view row rather than
// by a param, because Scheduled.tsx reads that preference on mount and has no URL
// param for it. Writing it is the same gesture as pressing the page's Calendar
// button, and a denied store just means the page opens on whichever view the
// reader last used — one press from the right one, never a dead end.
//
// It cannot scroll the calendar to this task's chip: nothing in the page's URL
// addresses a chip, and the week it opens on is its own. The reader lands on the
// calendar with the task's own week in front of them, which is where Edit, Skip
// and the whole rule live.
const SCHEDULE_VIEW_KEY = "fused-render:scheduled-view";

function openTaskOnCalendar() {
  try {
    window.top.localStorage.setItem(SCHEDULE_VIEW_KEY, "calendar");
  } catch (err) { /* denied or cross-origin — the page keeps its own last view */ }
  // The same top-window hop openScheduler makes, and for the same reason: the
  // target is a shell ROUTE, so pushState + "fused:navigate" is the in-app move
  // and a real navigation is the fallback for an absent or foreign parent.
  try {
    const host = window.top;
    void host.location.href;   // throws when cross-origin
    host.history.pushState(null, "", SCHEDULE_URL);
    host.dispatchEvent(new Event("fused:navigate"));
    return;
  } catch (err) { /* fall through to a real navigation */ }
  try { window.top.location.href = SCHEDULE_URL; }
  catch (err) { location.href = SCHEDULE_URL; }
}

// A pending OCCURRENCE of a repeat carries `template_id`; a template itself
// carries `repeats` or `rule`. Either way the honest word is "repeats", and the
// banner has to say what that costs — see below.
function schedIsRepeat(entry) {
  return !!(entry && (entry.template_id || entry.repeats || entry.rule));
}

// What id, posted to /api/schedule/cancel, actually reopens this box. For a
// repeat that is the TEMPLATE — the occurrence is replaced the moment it is
// skipped, so cancelling it moves the block rather than lifting it.
function schedStopTarget(entry) {
  return schedIsRepeat(entry) && entry.template_id
    ? String(entry.template_id) : String((entry && entry.id) || "");
}

// WHY THE BOX IS SHUT, in one sentence, and it has one author. The banner shows
// it as its only line of prose and the calendar button carries it as its tooltip
// and its spoken name — the two things the block switches off — so a reader
// refused by the button reads the same words as the card six pixels above it.
// Two literals would be two things to re-word, and the one that got missed would
// be the one under the pointer.
//
// The repeat gets its own wording because the ESCAPE differs (see schedStopTarget):
// "scheduled" is a message you can cancel, "repeating" is a job you have to stop.
function schedBlockReason(entry) {
  return schedIsRepeat(entry)
    ? "Blocked — a repeating message runs in this chat."
    : "Blocked — a scheduled message runs in this chat.";
}

function renderSchedBlock() {
  const next = schedBlockers[0];
  // Nothing blocking: hide it, and put the button back cold. A hidden card left
  // holding an armed press is a destructive control one poll away from being on
  // screen again — the class goes with the state that justified it.
  if (!next) {
    schedBlockEl.hidden = true;
    schedStopArmed = "";
    schedBlockStop.classList.remove("armed");
    return;
  }
  const others = schedBlockers.length - 1;
  const repeat = schedIsRepeat(next);
  // ONE SHORT REASON, and nothing else in words: the state and the time moved onto
  // the row below, where the list view keeps them. The old line spent a sentence
  // explaining context pollution, which described the block instead of showing
  // what was doing it (Akshil, 2026-08-17 — "use less words", and then "this UI
  // does not make sense to me").
  //
  // The SOONEST is named by the row and the rest are counted here, because naming
  // one is what answers "what is coming?" and a list of five would be the Tasks
  // page in a strip above a chat.
  let why = schedBlockReason(next);
  if (others > 0) why += " " + others + " more after it.";
  schedBlockWhen.textContent = why;
  // ── the row ──
  //
  // Exactly four facts: which task, what it is called, what state it is in, and
  // when it runs. NOT the folder and NOT the session — the reader is standing in
  // both (Akshil, 2026-08-17: "you will not show the folder because you are
  // already in that folder, you are not showing the session ID because you are
  // already there"). The list view shows them because it has to tell projects
  // apart; here they would be the page repeating itself back.
  const rec = schedTaskRec(next);
  const state = (rec && SB_STATES[rec.status] ? rec.status : "upcoming");
  const label = (rec && rec.failed) ? "Failed" : SB_STATES[state];
  schedBlockRing.className = "sb-ring sb-ring--"
    + ((rec && rec.failed) ? "failed" : state);
  schedBlockId.textContent = (rec && rec.task_id) || "";
  // The task's own name when the listing gave one, the scheduled words otherwise:
  // a task keyed by this session is titled by the conversation, and a message with
  // no session yet is titled by what it says.
  schedBlockName.textContent = (rec && rec.title) || schedMsgLine(next);
  schedBlockMeta.textContent = label + " · " + schedWhenText(next.due);
  // What the row DOES, on the row — the one title in this card, and it describes
  // the hop rather than repeating text that is already on screen. The old card put
  // the message on a title as well as in the body, so a short message rendered
  // twice the moment the pointer rested on it.
  schedBlockRow.title = "Open "
    + ((rec && rec.task_id) || "this task") + " on the Tasks calendar";
  // A refusal has to survive the re-render the same click asks for. Written from
  // page state keyed to the ENTRY, not straight onto the node, so the poll that
  // reconciles the store cannot quietly wipe the one sentence the user needs —
  // and a different message coming up next clears it.
  schedBlockNote.textContent = schedStopRefused === next.id
    ? (repeat ? "The repeat is still on — it may already be running."
              : "Still scheduled — it may already be running.")
    : "";
  // The armed press belongs to the entry it was made against.
  if (schedStopArmed && schedStopArmed !== next.id) schedStopArmed = "";
  const armed = schedStopArmed === next.id;
  // Say what the control DOES, and for the repeat say what it costs on the press
  // that spends it. "Stop the repeat" is the only label here that is true: it is
  // the one action that reopens this box, and the second press names the loss
  // because no control on this page can put those runs back.
  schedBlockStop.textContent = repeat
    ? (armed ? "Cancel every future run" : "Stop the repeat")
    : "Cancel this message";
  schedBlockStop.title = repeat
    ? "Stops the repeating task: this chat reopens and no further runs are scheduled"
    : "Cancels this scheduled message, and this chat reopens";
  schedBlockStop.classList.toggle("armed", armed);
  // A title belongs to the text that was measured, and this render just replaced
  // it — schedNameTitle writes the next one, when there is a pointer to write it
  // for.
  schedBlockName.removeAttribute("title");
  schedBlockEl.hidden = false;
}

// THE STRAY SECOND COPY, and its fix. The old card wrote the message onto a
// `title` unconditionally, so a message short enough to fit rendered once in the
// row and again in the native tooltip the moment the pointer rested on it — the
// small boxed duplicate in the screenshot. Now the full name is offered only when
// the cell actually clipped it.
//
// MEASURED WHEN THE POINTER ARRIVES, not when the row is drawn. At render time the
// pane may still be laying out — the first paint reports every cell as clipped —
// and a title written then would outlive the layout that justified it, which is
// exactly the bug again with an extra step. Hover and focus are also the only two
// moments the answer can matter.
function schedNameTitle() {
  if (schedBlockName.scrollWidth > schedBlockName.clientWidth + 1) {
    schedBlockName.title = schedBlockName.textContent;
  } else {
    schedBlockName.removeAttribute("title");
  }
}

schedBlockRow.addEventListener("pointerenter", schedNameTitle);
schedBlockRow.addEventListener("focus", schedNameTitle);

// Paint the block and shut the box. The box is disabled rather than merely
// guarded so the state is visible where the hands are; `submitChat` guards
// anyway, because an annotation- or screenshot-only send needs no typing at all
// and would otherwise walk straight past a disabled textarea.
//
// The SEND BUTTON is deliberately left alone: while a run is live it is the STOP
// button, and a chat that cannot stop its own running turn is a worse state than
// the one this feature prevents.
function applyComposerBlockState() {
  // THE LAYOUT SHIFT, handled rather than reserved. The card sits directly above
  // the composer, so the one thing it must never do is move the box a reader is
  // reaching for — and it does not: #logwrap is the only `flex: 1` child of
  // #chat, so the height the card takes is height the TRANSCRIPT gives up and
  // the composer stays exactly where it was. Nothing is animated and no space is
  // reserved; an empty strip above every unblocked composer would be a permanent
  // cost paid for a rare state.
  //
  // What DOES move is the transcript's last line, by the card's height, so a
  // reader who was at the bottom is put back at the bottom. Measured before the
  // render, applied only on the hidden → shown edge: on the way out the log grows
  // downward and there is nothing to correct.
  const wasHidden = schedBlockEl.hidden;
  const pinned = wasHidden && nearBottom();
  renderSchedBlock();
  if (pinned && !schedBlockEl.hidden) scrollBottom();
  const blocked = schedBlocked();
  box.disabled = blocked;
  // Short, because this box is 300px wide in the side pane and a longer line is
  // simply clipped. The banner above carries the explanation; this only has to
  // say the box is not broken.
  box.placeholder = blocked ? "Waiting on a scheduled message…" : BOX_PLACEHOLDER;
  // THE CALENDAR BUTTON GOES WITH THE BOX, off the SAME `blocked` — not off a
  // second read of the schedule. A parallel notion of "is this session blocked"
  // is two answers to one question, and the day they disagree one of them is
  // lying to the user about what their chat is doing.
  //
  // The real `disabled` attribute rather than a class that merely looks it: it
  // stops the pointer AND the keyboard in one stroke, since a disabled <button>
  // fires no click for Enter or Space either — a control that paints itself dead
  // and still navigates is worse than one that never dimmed. The click handler
  // guards as well, the same belt-and-braces `submitChat` uses.
  const why = blocked ? schedBlockReason(schedBlockers[0]) : "";
  schedBtn.disabled = blocked;
  schedBtn.title = blocked ? why : SCHED_BTN_TITLE;
  // And the SPOKEN name says it too, the way the box's placeholder does above:
  // `disabled` takes the button out of tab order, so the title is unreachable by
  // keyboard and the name is all a reader browsing this row will hear. The name
  // stays first — what the control is, then why it is off — so the button is
  // still identifiable while it is refusing.
  schedBtn.setAttribute("aria-label", blocked ? SCHED_BTN_LABEL + " — " + why
                                              : SCHED_BTN_LABEL);
  // A confirm can already be up when the poll lands: "Schedule this as a task?"
  // is a question about a button that has just died, and its Continue would hit
  // the guard and do nothing visible. Take it down instead, so what the reader
  // ends up looking at is the banner. Only on the way IN — closing a confirm the
  // user opened the moment the block lifted would be the block reaching past its
  // own end.
  if (blocked) closeSchedConfirm();
  // The row's number and name, fetched AFTER the card is on screen and never
  // before the block: what shuts the composer is the schedule, and the listing
  // only decorates the row (see schedLoadTaskRow). Guarded there against refetching
  // for the same entry, so the 15s poll costs one read per blocking message.
  if (blocked) schedLoadTaskRow(schedBlockers[0]);
}

function applyComposerBlock(entries) {
  schedBlockers = schedPendingHere(entries);
  applyComposerBlockState();
}

// A schedule that could not be read blocks NOTHING. A chat that locks itself
// because one fetch failed is worse than the pollution the lock prevents — the
// user loses a working composer over a network blip, and the schedule is the
// only thing that could ever tell them why.
function clearComposerBlock() {
  schedBlockers = [];
  applyComposerBlockState();
}

schedBlockStop.addEventListener("click", async () => {
  const next = schedBlockers[0];
  if (!next || !next.id) return;
  const repeat = schedIsRepeat(next);
  const target = schedStopTarget(next);
  if (!target) return;
  // TWO PRESSES for a repeat, and only for a repeat. The write below stops the
  // recurring task, which spends every run it would ever have made, and nothing
  // on this page can restore them — so the first press only arms, and the label
  // it arms into names that loss ("Cancel every future run"). A one-off is a
  // single press: cancelling it loses one message the user can schedule again,
  // and a confirm on that would be ceremony.
  //
  // The button becomes the question, in place, which is this template's idiom
  // (snapAction's "Really go back?", the ✕ / "Back to chat" pair) rather than a
  // dialog over a chat the reader may be about to keep using.
  if (repeat && schedStopArmed !== next.id) {
    schedStopArmed = String(next.id);
    applyComposerBlockState();
    return;
  }
  schedStopArmed = "";
  schedBlockStop.disabled = true;
  try {
    // The one write this template makes to the schedule store, and it exists
    // because the block it lifts is this template's own. X-Fused is the guard
    // every mutating schedule POST requires (D3) — a header a foreign page
    // cannot send without a preflight we never answer.
    //
    // `target` is the TEMPLATE's id for a repeat and the entry's own for a
    // one-off — see schedStopTarget. `schedule.cancel` already reads a template
    // id as "no further runs" and cancels the materialized occurrence with it,
    // so one endpoint serves both cases.
    const res = await fetch("/api/schedule/cancel", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Fused": "1" },
      body: JSON.stringify({ id: target }),
    });
    if (!res.ok) throw new Error(String(res.status));
    // Applied locally so the box opens on the click rather than on the next poll
    // — 15 seconds of dead composer after a successful cancel reads as a button
    // that did nothing. The poll below is still the source of truth.
    //
    // A stopped repeat takes EVERY blocker that belongs to it, not just the first:
    // the template is cancelled, so an occurrence of it left in the list would
    // have the banner naming a run the server has already dropped.
    schedStopRefused = "";
    schedBlockers = repeat
      ? schedBlockers.filter((e) => schedStopTarget(e) !== target)
      : schedBlockers.slice(1);
    applyComposerBlockState();
  } catch (err) {
    // A cancel that raced the send is refused, not silently swallowed: the entry
    // is away, the composer stays shut, and that is the true state. Recorded
    // against the ENTRY so the reconciling poll below re-renders it rather than
    // wiping it (renderSchedBlock).
    schedStopRefused = String(next.id);
    applyComposerBlockState();
  } finally {
    schedBlockStop.disabled = false;
  }
  pollScheduledRuns();
});

// THE ROW IS THE LINK, and it replaced "Edit schedule" rather than joining it
// (Akshil, 2026-08-17). The banner used to carry an Edit control so a schedule
// could be changed without losing the message; the row now lands on the task
// where Edit lives with its whole popover, so the two were two doors to one room
// — and the banner's door was the one that could not unblock.
//
// It does NOT reopen the composer and does not pretend to: leaving a blocked chat
// to look at the thing blocking it is a different errand from unblocking it, and
// the button beside it is still the only control that does the second.
schedBlockRow.addEventListener("click", () => {
  if (!schedBlockers[0]) return;
  openTaskOnCalendar();
});

// ── the way back out of an armed stop ──
//
// There is no second button to be the "Keep it" any more, so the escape is the
// gesture instead — .selpop's own dismissal contract (a press outside, Escape),
// which is what the rest of this template teaches a reader to expect. Disarming
// is always the safe direction to be wrong in: the cost of a lost arm is one more
// press, and the cost of a stale one is every future run of a task.
function schedDisarmStop() {
  if (!schedStopArmed) return;
  schedStopArmed = "";
  applyComposerBlockState();
}

document.addEventListener("pointerdown", (ev) => {
  if (schedStopArmed && !schedBlockEl.contains(ev.target)) schedDisarmStop();
});
// Capture phase and the event is CONSUMED — the same discipline the schedule
// confirm takes: the document-level Escape binding kills a live run, and backing
// out of a half-pressed confirm must not also do that.
document.addEventListener("keydown", (ev) => {
  if (ev.key !== "Escape" || !schedStopArmed) return;
  ev.stopPropagation();
  ev.preventDefault();
  schedDisarmStop();
}, true);

async function pollScheduledRuns() {
  let data;
  try {
    const res = await fetch("/api/schedule");
    if (!res.ok) { clearComposerBlock(); return; }
    data = await res.json();
  } catch (e) {
    // Fail OPEN, both halves: no turn to attach and no block to impose. See
    // clearComposerBlock — a composer that shuts itself over an unreadable
    // schedule is a worse failure than the pollution the block prevents.
    clearComposerBlock();
    return;  // a blip; the next tick tries again
  }
  // The composer block reads the SAME payload this watcher already fetches — a
  // pending message is one of the entries in it — so the feature costs no second
  // poll and no endpoint of its own. It is applied before the home-view return
  // below, and before the baseline: a block is a fact about the schedule, not
  // about what this frame has rendered.
  applyComposerBlock(data.entries || []);
  if (chatEl.classList.contains("home")) return;  // nothing to render into
  const fired = (data.entries || []).filter((e) => e.target === FILE && e.run_id);
  // The FIRST pass is a silent baseline: every run already recorded happened
  // before this frame existed, and the transcript restore has accounted for the
  // ones that belong here, so attaching them would re-render old turns.
  //
  // It runs at LOAD, not one interval later. Baselining on the first *interval*
  // meant anything firing in the opening 15s was written off as predating a frame
  // it had in fact fired inside — and that window is exactly when a reader opens
  // the chat, because the note told them to leave it open to watch the send.
  if (!scheduleBaselined) {
    scheduleBaselined = true;
    for (const entry of fired) SCHEDULE_ATTACHED.add(entry.run_id);
    return;
  }
  for (const entry of fired) {
    if (SCHEDULE_ATTACHED.has(entry.run_id)) continue;
    if (!scheduledRunIsOurs(entry)) {
      // Noted once, never marked attached — see SCHEDULE_NOTED.
      if (!SCHEDULE_NOTED.has(entry.run_id)) {
        SCHEDULE_NOTED.add(entry.run_id);
        addNote("A scheduled message for this folder just ran in another session.",
                null, "◷");
      }
      continue;
    }
    // The live-turn guard sits HERE, adjacent to the call with nothing awaited in
    // between, rather than at the top of the function. Checked before the fetch, it
    // could go stale across that await: `sending` flipping true meanwhile made
    // `resumeRun` return immediately while this had already written the id off as
    // handled, so the turn never appeared at all. Returning instead leaves the
    // entry unmarked for the next tick.
    if (activeRun || sending) return;
    addNote("Your scheduled message is running now.", null, "◷");
    SCHEDULE_ATTACHED.add(entry.run_id);
    // The run goes on the URL for the same reason `sendMessage` puts it there: a
    // reload, or a mode switch that remounts this frame, re-attaches from the
    // param. Without it the stream was simply lost, and the next frame's baseline
    // then wrote the same run off as predating it.
    fused.params.set("run", entry.run_id, { history: "replace" });
    // neverShown: this frame has never had the turn on screen, so nothing already
    // in the log is this run's line — append it, and never repair over a turn that
    // merely says the same words.
    await resumeRun(entry.run_id, { neverShown: true });
    return;  // one at a time; the next tick picks up anything behind it
  }
}
// Baseline immediately (see above), then watch.
pollScheduledRuns();
setInterval(pollScheduledRuns, SCHEDULE_POLL_MS);

// `opts.neverShown` — this frame has never had THIS run's turn on screen, which is
// something only the caller can know. It does one thing, and doing it in one place
// is why it is safe: it turns OFF the `matches` heuristic below.
//
// The default (false) is the reload case this function was written for, where the
// restored transcript may already contain the turn. There, matching the last user
// bubble is how the repair avoids duplicating it, and appending blindly would show
// the turn twice.
//
// A scheduled send is the opposite situation: it fired after this frame rendered,
// so its turn cannot be on screen. Two bugs came of getting this wrong, and the
// second is why the flag suppresses matching rather than just adding an append
// branch. (1) Without any flag, a finished scheduled turn fell through every branch
// — a non-empty log and no match — and appeared nowhere, while the composer's note
// promised it would. (2) With an append branch but `matches` still preferred, a
// prompt sent twice ("run the tests" now, the same words scheduled for later) made
// the earlier identical bubble match: the repair then stripped everything after it,
// DELETING that turn's real reply, and hung the scheduled run's answer there. The
// same coincidence hits the live path, which strips partial rows on a match — so
// the flag has to kill matching for both, not just for `done`.
// A chat can be OPENED while the turn it started is still streaming, and arrive
// with no idea that it is: the run id lives on the URL (`run`), and the two ways
// in that do not carry it are the session list (a click, not a navigation) and a
// boot whose URL has only `session_id`. Both used to render the mid-flight
// transcript — which legitimately ends at the user's own message, because the
// reply has not been written yet — and stop there, with no working line and no
// output, while the detached claude process kept streaming into a run dir
// nothing was watching. Reaching the same chat with Back worked only because
// that history entry still had `run` on it.
//
// So ask the server, which is the only party that still knows: `live_run`
// answers with the id of a run for this chat that is still alive. resumeRun has
// always been able to adopt a run this frame did not start (the scheduled-send
// path does exactly this); it just was never given the id.
//
// A WATCH, not a one-shot question (Akshil, 2026-08-19 — the reopened chat "does
// not show me the streaming thing"). The one-shot version had two silent
// give-ups, and each was a live turn the chat never showed again:
//
//   * `if (sending || activeRun) return` — the gate can be HELD at the one
//     instant this fires (a second click's loadHistory mid-flight, an abandoned
//     turn's finally a poll away from releasing), and "held right now" was read
//     as "nothing to do, ever". The gate clears within a tick; the answer to it
//     is to look again, not to leave.
//   * a `live_run` that answers "" — which is the truth for an idle chat, but
//     also what the server says while the run this very reopen is chasing is
//     still being SPAWNED (Back landed during `start`; the run dir gains its
//     pid a beat later). One answer, two meanings, and only time tells them
//     apart: a short watch at the poll cadence covers the spawn window, and an
//     idle chat costs a few cheap lookups that all agree before it goes quiet.
//
// Gen-guarded like every other loop that outlives an await: leaving the chat
// bumps logGen and the watch dies with the transcript it was watching.
async function adoptLiveRun(session_id) {
  const gen = logGen;
  // ~3s of looking: one tick is the common case (the reopen itself), the tail
