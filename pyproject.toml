[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fused-render"
dynamic = ["version"]
description = "Local file explorer with Python-powered renderable HTML previews"
readme = "README.md"
# license: intentionally unset pending the public-launch licensing decision —
# add it (plus the matching classifier and a LICENSE file) before any PyPI
# publish.
requires-python = ">=3.11"
keywords = ["file-explorer", "preview", "data-viz", "duckdb", "geospatial", "html"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # The base install is what `pip install fused-render && fused-render open
    # <github-url>` needs, and nothing more: a lean server that renders one app
    # in embed mode and runs its `runPython` calls, including through a project
    # venv built from the app's own pyproject.toml. Everything the desktop file
    # explorer adds on top lives in the extras below, and `fused-render serve`
    # refuses to start without `[all]` (fused_render/extras.py). A route whose
    # feature is not installed answers 503 with `missing_extra` naming the extra
    # to install instead of crashing.
    #
    # Adding a line here is a cost every `open` user pays on first install.
    # The bar is "the embed page or `/api/run` cannot work without it".
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # /api/fs/events is a WebSocket (D74); plain uvicorn has no WS protocol
    # implementation, so the ws library is a hard dependency.
    "websockets>=12",
    # FastAPI raises at route registration for any endpoint that takes
    # multipart form/file uploads (/api/templates/import among them) when
    # python-multipart is absent, so the app cannot even be built without it.
    "python-multipart>=0.0.9",
    # server.py imports httpx at module top for the pooled raw-proxy client, and
    # fastapi.testclient needs it too.
    "httpx",
    # PEP 508 requirement/specifier parsing, for deciding whether the app
    # interpreter already satisfies a script's PEP 723 header
    # (engine.app_satisfies: a header it already meets runs with no venv at
    # all).
    # Declared rather than borrowed: without it every header silently falls
    # back to building its own venv, a permanent slowdown with no failing test.
    "packaging>=22",
    # The venv builder behind project apps (SPEC PY-16/PY-18). `fused`'s
    # installer prefers `uv venv` + `uv pip install` and falls back to
    # `<python> -m venv`, which is several times slower and absent from the
    # macOS bundle. envinstall.uv_bin() looks beside the interpreter before PATH,
    # which is exactly where this wheel puts the binary, so a pip install with no
    # system uv still builds project venvs with uv. The packaged builds copy
    # their own uv next to the interpreter; this one is for pip installs.
    "uv>=0.5",
    # The execution engine (D69): with it, /api/run builds a pyproject app's
    # own venv and runs its scripts there; without it only the built-in
    # executor exists, which has no venv machinery and fails every project app
    # with "install [fused]". Plain `fused`, no extras: its core carries the
    # local compute backend and nothing heavier (no boto3, pyarrow, pandas,
    # cryptography or mcp). The `[fused]` extra below adds what the desktop's
    # deploy, share and MCP features need on top. The version must match that
    # extra's pin (tests/test_bundle_contents.py checks it), so the base
    # engine and the full one are the same build.
    "fused==2.9.3b10",
]

[project.optional-dependencies]
# Test/dev tooling. `pip install -e ".[dev]"` then `pytest`.
dev = [
    "pytest",
    # Parallel test runs (see [tool.pytest.ini_options] addopts -n auto). The
    # suite is xdist-safe via process isolation: conftest re-points
    # FUSED_RENDER_HOME/DIR per worker, tests use tmp_path + monkeypatch, and
    # servers bind 127.0.0.1:0. Process-based only — os.chdir / importlib.reload
    # would race under a threaded runner. ONE documented exception, which
    # process isolation cannot cover because the resource is machine-global:
    # the macOS pasteboard round-trips in tests/test_pasteboard_darwin.py.
    # There is a single NSPasteboard per login session, so those four tests
    # serialise themselves on a cross-process file lock — see the comment
    # there before adding any other test that drives a system-wide resource.
    "pytest-xdist",
    # Coverage reporting (pytest --cov=fused_render). Combines per-worker data
    # under -n auto (xdist) automatically — no extra config needed there.
    "pytest-cov",
    # The Windows updater's tests (tests/test_win_supervisor_update.py) are
    # mock-based and cross-platform, but importorskip("cryptography") skips them
    # in CI unless it's installed here — it's win32-only in windows-desktop.
    #
    # Platform-conditional ceiling (LEAN_WHEEL_SPEC.md item 1): cryptography
    # dropped x86_64 macOS wheels (even the universal2 fat binary) after
    # 48.0.1 — verified against https://pypi.org/pypi/cryptography/json on
    # 2026-09-23: 48.0.2/48.0.3 shipped no macOS wheel at all, and 49.0.0+
    # ship only macosx_11_0_arm64. Without a ceiling, a contributor/CI
    # install of `[dev]` on an Intel Mac falls back to a source build.
    "cryptography<=48.0.1 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "cryptography ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # A TEST dependency since D276, not a shipped one. The notebook kernel turns
    # a cell's open figures into inline PNGs (`kernel_body.py`), which is real
    # behaviour with two tests on it — and matplotlib left `[bundled]`, so
    # nothing installed it for the suite any more. The unit test's
    # importorskip would then have skipped silently for good, and
    # tests/test_notebook_e2e.py's figure cell had no skip at all and would
    # simply have gone red. Declared here rather than skipped, because
    # "does the kernel render figures" is worth keeping covered, and the
    # honest description of matplotlib now is that this repo tests with it and
    # does not ship it. No packaged build installs `[dev]`
    # (build_dmg.sh / build_linux_appimage.sh / build_windows_installer.ps1 all
    # install `[bundled,...]`), and the macOS force-list is derived by walking
    # `[bundled]`'s own requirements, so nothing here can reach the bundle.
    "matplotlib",
    # A TEST dependency for the same reason matplotlib is one above, and a
    # narrower case of it: `runners/llama_text.py` renders a GGUF's own
    # chat template with real Jinja2 (SPEC AI-11), and unlike torch or mlx —
    # which every runner test FAKES, because fused-render's own venv must
    # never grow one (`registry.py`'s first architectural claim) — Jinja2 is a
    # small, pure-Python templating library with no build step and no
    # accelerator concerns, so faking its control-flow engine to test real
    # template logic would validate the fake rather than the renderer. Never
    # shipped: `llamacpp_text/pyproject.toml` declares its own copy for the
    # runner's actual venv, and this one exists only so
    # `tests/test_ai_llamacpp_worker.py` can exercise real `{% for %}`/`{{ }}`
    # rendering rather than a hand-rolled stand-in.
    "jinja2",
    # Every feature extra, so the suite runs against the whole product.
    "fused-render[all]",
]
# Baked into the bundled CPython of the .app (SPEC DM-2): users of the packaged
# app cannot pip install, so the interpreter ships with the popular data stack.
# Dev installs: pip install -e ".[bundled]"
#
# This list is a SIZE BUDGET, not a wish list (D276). Every entry is carried by
# every user of every platform build, forever, whether or not they ever open a
# file that needs it — so a distribution earns its place here by being needed
# from a cold start across many templates, not by being useful once. Anything
# that serves one or two templates belongs in THOSE FOLDERS' `pyproject.toml`
# (SPEC PY-16): the app then installs it on first render, under the PY-18
# progress flow, only for the users who open that kind of file. Measured on
# macOS/arm64/py3.12, moving five groups out took the installed set from
# 954 MB to 398 MB.
bundled = [
    "numpy",
    "pandas",
    "requests",
    "pillow",
    "openpyxl",
    # REMOVED (D276): polars (197 MB — `polars` + the `polars-runtime-32` wheel
    # that carries the actual engine). It was the single largest thing in this
    # extra and NOTHING in the product imports it: no template, no core app, no
    # server code. It was here purely as an advertised convenience for user
    # `runPython` code, which is not worth a fifth of the download to everyone.
    # A user who wants it declares it in their own folder's `pyproject.toml`,
    # which is the supported way to get anything else too (PY-16).
    #
    # REMOVED (D276): scipy (70 MB). Its one consumer is
    # `netcdf/grid_tile_server.py`, which already installs it into the daemon
    # venv it manages itself (DAEMON_DEPS, D174) — so on a packaged app it was
    # shipped once and downloaded again, and the shipped copy was never imported.
    #
    # REMOVED (D276): matplotlib (25 MB with contourpy/cycler/kiwisolver). Two
    # consumers, neither of which needed it HERE: `map/geo_classify.py` (gone
    # since the map template draws in the browser) and
    # `notebook/kernel_body.py`, which only harvests figures the user's own cell
    # created and does nothing at all when matplotlib is absent.

    # Preview-template backends. pandoc, typst and usd-core are intentionally
    # absent — they are large per-platform binaries fetched on demand at
    # runtime (see docs/docs.py, docs/install_worker.py, latex/engine.py,
    # usd/convert_worker.py's _ensure_pxr — D119).
    "python-pptx",
    "msgpack>=1.0",
    # KEPT, against the first cut of D276, and the reason is PY-16's SCOPE. A
    # declaration governs the whole FOLDER, so moving fpdf2 out put `excel` and
    # `slides` entirely behind a project venv: opening any .xlsx, any .csv in
    # Excel mode, or any .pptx would block on a first-render install of
    # duckdb + pyarrow + openpyxl / python-pptx + pillow — ~150 MB of packages
    # the app ALREADY SHIPS — to add 1.5 MB for an export path most users never
    # touch. The export is not separable from the folder, so the choice was
    # "everyone carries 14 MB" versus "two everyday templates get an install
    # gate", and 14 MB is the cheaper answer. Measured marginal cost: fpdf2 is
    # 1.5 MB and drags fonttools (12.6) + defusedxml (0.1), and fonttools has no
    # other user left now matplotlib is gone.
    "fpdf2>=2.8.7",
    # REMOVED (D276): pymupdf (56 MB) and pikepdf (13 MB), the two largest
    # single wheels this extra ever had. They serve `pdf_studio` alone, which is
    # a whole-folder tool — every action in it is a PDF action — so the PY-16
    # scope argument that KEPT fpdf2 above runs the other way here: the venv it
    # gets is the venv it needs. Declared in
    # fused_render/templates/pdf_studio/pyproject.toml. Note the plain `pdf`
    # template is untouched: it renders in the browser (pdf.js) and imports
    # none of this.
    #
    # REMOVED (D276): the geo stack — geopandas, rasterio, rio-tiler, shapely
    # and zarr, 180 MB once their exclusive transitives go with them (pyogrio
    # 77, pyproj 18, numcodecs, morecantile, the pystac-ext-* fan-out). They are
    # the deepest per-user cost in the extra and they serve four templates:
    # `map`, `vector`, `geometry_editor` and — through venvs those files already
    # manage themselves — `geotiff`, `netcdf`, `zarr_aoi` and `pyramid`. The
    # first three now declare them (SPEC PY-16); the rest always installed their
    # own, so the bundled copy was pure duplication there. The zarr floor that
    # used to live here (`zarr>=3.0.8`, v3 store API) survives where it is
    # actually read, in `zarr_aoi/tile_server.py`'s DAEMON_DEPS.

    "drain3>=0.9.11",
    # Every feature extra, so the packaged interpreter carries the index, the
    # native integrations, the cloud credential chains and the full engine: DMG
    # users cannot pip install, so a feature missing here is missing for good.
    # setup_py2app.py expands this self-reference into the extras it names
    # before deriving the macOS force-list, so everything `[all]` brings is
    # forced into the bundle the same way a direct entry here would be.
    "fused-render[all]",
]
# ---------------------------------------------------------------------------
# Feature extras. Each one lights up a group of desktop features; without it
# those routes answer 503 with `missing_extra` set to its name
# (fused_render/extras.py holds the extra -> import-name map the guards use).
# `[all]` is every one of them, and is what `fused-render serve` requires.
# ---------------------------------------------------------------------------
#
# The file index (fused_render/index/): scanning folders into parquet, the
# duckdb queries behind file search, /api/index/*, /api/search/files, the
# homepage's Repos tab and the exported-apps listing, plus the live watcher
# that keeps the index honest between scans (server/index_watch.py). pyarrow
# writes the index; duckdb reads it; watchfiles is the watcher.
index = [
    "duckdb>=1.1",
    "pyarrow>=14",
    "watchfiles>=1.0",
]
# The app interpreter's columnar library, for header-less `runPython` scripts
# that read or write Arrow/parquet without declaring it (a script with a PEP 723
# header or a pyproject.toml gets its own venv and declares its own). Separate
# from `[index]` so wanting pyarrow does not also install the indexer.
data = [
    "pyarrow>=14",
]
# The native OS integrations the desktop shell uses. None of them is on the
# path of rendering or running an app, which is why they are not base.
#   * zeroconf: mDNS advertising of render.fused.local for local-network app
#     sharing (fused_render/lan.py). Without it the listener still binds; the
#     friendly name just does not resolve. zeroconf ships no x86_64 macOS wheel
#     after 0.148.0 (verified against https://pypi.org/pypi/zeroconf/json on
#     2026-09-23; 0.149.0+ ship only macosx_11_0_arm64), so Intel Macs get a
#     ceiling instead of a source build.
#   * pyobjc-framework-Cocoa: the macOS half of the OS clipboard bridge
#     (shell/pasteboard/_darwin.py reads and writes NSPasteboard file URLs).
#     Without it the clipboard route reports `supported: false`.
#   * pyobjc ScreenCaptureKit + AVFoundation, pillow and dbus-fast: native
#     capture (SPEC §45). macOS records through ScreenCaptureKit and
#     AVFoundation; the Windows still is a `BitBlt` that pillow encodes; the
#     Linux still goes through the `org.freedesktop.portal.Screenshot` D-Bus
#     call (dbus-fast, pure Python, no GTK) and pillow crops or converts what
#     the portal wrote. Without them `fused.capture` reports
#     `available: false`. pillow also backs the TIFF/HEIC attachment converter
#     (server/image_convert.py), which keeps the original file when it is
#     absent.
desktop = [
    "zeroconf>=0.130,<=0.148.0 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "zeroconf>=0.130 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
    "pyobjc-framework-ScreenCaptureKit; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation; sys_platform == 'darwin'",
    "pillow; sys_platform == 'win32'",
    "pillow; sys_platform == 'linux'",
    "dbus-fast; sys_platform == 'linux'",
]
# The Hugging Face login in Preferences (routers/hf_auth.py, D402). The token
# is hf's to store, not ours: the button drives hf's own device-code browser
# login and hf persists the result, so this app holds no credential. The floor
# is 1.28 because `utils._oauth_device` (the device flow) and
# `_login._save_oauth_token` (persisting it with its refresh token) are what
# hf_auth.py drives. Local AI runners do not need this: each declares
# `huggingface_hub` for its own venv.
hf = [
    "huggingface_hub>=1.28,<2",
]
# Private-cloud credential chains for mounted buckets. botocore buys the AWS
# provider chain (SSO / credential_process / assume-role / IMDS) for s3sign's
# resolver rung; google-auth buys the GCS bearer-token chain (SA key / ADC) for
# gcssign. requests is google-auth's refresh transport. The signing math stays
# in-repo (s3sign/gcssign are pure stdlib), so without this extra public
# buckets still work and private ones do not.
cloud = [
    "botocore",
    "google-auth",
    "requests",
]
# The full engine: the deploy CLI, canvas share/push and the MCP server the
# MCP panel registers. The base install already has `fused` itself (see
# `dependencies`); this asks for its extras on the same version:
#   * `aws` = boto3 + `pyjwt[crypto]` + fused's `data` group (pyarrow, pandas,
#     numpy). The macOS build force-lists boto3/botocore/s3transfer/jmespath
#     (setup_py2app.py), and a force-listed name must be installed.
#   * `mcp` = `mcp>=1.8.0,<2`. The MCP panel registers `<this venv's fused>
#     app serve <folder>` as a global Claude MCP server (SPEC MC-5), and
#     `app serve` imports mcp. The `<2` ceiling lives upstream (mcp 2.x removed
#     `mcp.server.fastmcp`).
# Not `verify`: that extra is `anthropic` + `ty`, and `ty` stays unshipped (a
# Rust binary console script py2app cannot carry). `anthropic` is declared
# directly instead, with the floor `fused[verify]` itself declares. pip only
# WARNS on an unknown extra, so tests/test_bundle_contents.py checks that every
# extra named here is one the installed `fused` provides.
fused = [
    'fused[aws,mcp]==2.9.3b10 ; python_version >= "3.11"',
    'anthropic>=0.40.0 ; python_version >= "3.11"',
    # Platform-conditional ceiling (LEAN_WHEEL_SPEC.md item 1). fused-render
    # does not use cryptography itself, but `pyjwt[crypto]` from both
    # `fused[aws]` and mcp pulls in an unmarked one, and cryptography ships no
    # x86_64 macOS wheel after 48.0.1 (the `[dev]` entry above has the
    # verification). pip's resolver intersects this direct entry with the
    # transitive requirement, so it constrains the resolve without overriding
    # the version those packages need.
    'cryptography<=48.0.1 ; python_version >= "3.11" and sys_platform == "darwin" and platform_machine == "x86_64"',
]
# Every feature extra. What `fused-render serve` (the desktop file explorer)
# requires, and what every packaged build and `[dev]` include.
# WhatsApp as a bot channel (bots/channels/whatsapp.py, POC): neonize wraps whatsmeow (Go,
# shipped as a dylib in the wheel) and needs libmagic on the host (`brew install libmagic`).
# Opt-in, never in [all] or a packaged build yet.
whatsapp = [
    "neonize",
]
all = [
    "fused-render[index,data,desktop,hf,cloud,fused]",
]
# ---------------------------------------------------------------------------
# Packaged-build extras. Each includes `[all]`, so a build script's install line
# names only its platform's extra plus `[bundled]`.
# ---------------------------------------------------------------------------
#
# Menu-bar app shell (SPEC DM-3/DM-7). macOS-only; installed by the packaged
# .app build alone (scripts/build_dmg.sh).
# Both entries carry a darwin marker as well, so `pip install "fused-render[app]"`
# on Linux or Windows resolves to nothing instead of trying to build pyobjc/rumps there.
app = [
    "rumps ; sys_platform == 'darwin'",
    # Pinned view (SPEC §25, D97): WKWebView inside the status-item popover.
    "pyobjc-framework-WebKit ; sys_platform == 'darwin'",
    "fused-render[all]",
]
# Windows desktop supervisor backend (fused_render/supervisor/_win32,
# docs/DESKTOP_SUPERVISOR.md). Windows-only; installed by the packaged desktop
# build alone (scripts/build_windows_installer.ps1).
windows-desktop = [
    'pywin32>=306 ; sys_platform == "win32"',
    'pystray>=0.19 ; sys_platform == "win32"',
    'pillow ; sys_platform == "win32"',
    # Verifies the ed25519-signed update manifest (supervisor/_win32/update.py).
    'cryptography ; sys_platform == "win32"',
    "fused-render[all]",
]
# Linux desktop supervisor backend (fused_render/supervisor/_linux,
# docs/LINUX_DESKTOP_SPEC.md). Linux-only; installed by the packaged AppImage
# build alone (scripts/build_linux_appimage.sh). The tray is a native
# StatusNotifierItem exported over D-Bus via dbus-fast (pure Python, manylinux
# wheels, no GTK/X11); the icon is absent only where no StatusNotifier host
# runs (stock GNOME without the extension), an accepted degraded mode. pillow
# repacks the icon into the SNI ARGB32 pixmap.
#
# PyGObject drives the native app windows (supervisor/_linux/window_host.py:
# GTK3 + WebKitGTK 4.1 in a child process, D1314). It is the only entry here that
# is NOT pure Python: there is no manylinux wheel, so it compiles from the sdist
# against the BUILD machine's libgirepository + cairo headers (release.yml
# installs them), and the resulting `_gi*.so` links the USER's libgirepository
# at run time. WebKitGTK/GTK themselves are never bundled: they come from the
# user's distro (gir1.2-webkit2-4.1 on Ubuntu, webkit2gtk-4.1 on Arch), and a
# machine without them keeps opening browser tabs as before.
#
# The range is deliberate. PyGObject 3.51+ moved to girepository-2.0 (glib
# >= 2.80), a runtime library Ubuntu 22.04 does not have and that no 24.04
# desktop package is guaranteed to pull in; 3.50.x still links
# libgirepository-1.0, which every desktop that ships python3-gi (all the
# Ubuntu and Debian GNOME/KDE desktops) already has, and which Arch provides
# through gobject-introspection-runtime. 3.48 is the floor because it is what
# Ubuntu 24.04 ships and it supports CPython 3.12 (the bundled one).
# Raising the ceiling to 3.51+ means moving the CI build dep to
# libgirepository-2.0-dev AND dropping Ubuntu 22.04 support: do both or neither.
linux-desktop = [
    'dbus-fast ; sys_platform == "linux"',
    'pillow ; sys_platform == "linux"',
    'PyGObject>=3.48,<3.51 ; sys_platform == "linux"',
    "fused-render[all]",
]

[project.urls]
Homepage = "https://github.com/fusedio/fused-render"
Repository = "https://github.com/fusedio/fused-render"
Releases = "https://github.com/fusedio/fused-render/releases"

[project.scripts]
fused-render = "fused_render.cli:main"
fused-render-app = "fused_render.app:main"

# No-console launcher for the Explorer "Open with" registration; a dedicated
# exe because the Open With dialog displays a pythonw.exe command as "Python".
[project.gui-scripts]
fused-render-open = "fused_render.winopen:main"

# Run the suite in parallel by default (needs pytest-xdist, in the dev extra).
# -n auto spawns one worker per CPU; the suite is xdist-safe (see the dev-extra
# comment, including its one machine-global exception, which self-serialises
# rather than needing a scheduling flag here) and no test needs --dist loadgroup.
# `-m "not integration"` deselects tests marked `integration` by default — a
# test that reaches a real external tool (uv, a real network fetch) rather
# than a fake is non-deterministic on both sides (offline, a warm cache, a
# slow CI runner) and asserts an EXTERNAL tool's behaviour rather than this
# repo's, neither of which belongs in the default run. Opt in explicitly:
# `pytest -m integration`.
# To debug a single test serially, override: `pytest -n0 -x path::test`.
[tool.pytest.ini_options]
addopts = "-n auto -m \"not integration and not perf_large\""
markers = [
    "integration: hits a real external tool/service rather than a fake (opt-in only: `pytest -m integration`).",
    "perf_large: runs the indexing perf harness over a large (multi-minute) synthetic corpus rather than the default fast-CI size (opt-in only: `pytest -m perf_large`).",
]

[tool.coverage.run]
source = ["fused_render"]
# Store paths relative to the repo root rather than absolute, so coverage.xml
# stays meaningful if it's read from a different checkout path than the one
# that produced it (e.g. a CI runner vs. a contributor's machine).
relative_files = true

[tool.coverage.report]
# Defensive-only lines that a normal test run can't reach (platform guards,
# "this should never happen" branches) — excluding them keeps the percentage
# meaningful instead of chasing untestable lines.
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# Single source of truth for the version: fused_render/__init__.py's
# __version__. Bump it there only — hatchling reads it at build time for the
# wheel metadata, and the runtime importers (server.py, core_templates.py,
# logs.py) all resolve to the same value.
[tool.hatch.version]
path = "fused_render/__init__.py"

[tool.hatch.metadata]
# Kept enabled so a direct URL requirement (e.g. pinning a pre-release wheel
# instead of a PyPI version) can be dropped in without a metadata error —
# hatchling refuses direct references unless explicitly allowed.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["fused_render"]
# The Vite-built shell is gitignored (D54) but must ship in the wheel;
# `artifacts` overrides hatchling's VCS-based exclusion for it. The starter
# kit's authoring skills are copied in at build time from skills/ (D106) — also
# gitignored, also shipped here, together with the flat plugin.json that
# skill_plugin.py (D212) turns back into a .claude-plugin/ manifest. Nothing
# under a dot-prefixed path is listed here on purpose: see hatch_build.py's
# _copy_starter_skills.
artifacts = [
    "fused_render/static/shell-dist/**",
    "fused_render/skills/**",
    # The Bots starter apps' locks (fused_render/bots/starters/<key>/uv.lock):
    # negated in .gitignore like the templates' own, listed here as well so a
    # change to that negation cannot silently drop them from the wheel.
    "fused_render/bots/starters/**/uv.lock",
]

# Builds frontend/ -> fused_render/static/shell-dist/ at package-build time
# (wheel and the DMG pipeline, which pip-installs this repo). Editable
# installs skip it — see scripts/hatch_build.py.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "scripts/hatch_build.py"
