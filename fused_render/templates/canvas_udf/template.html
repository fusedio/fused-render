<!DOCTYPE html>
<!-- The canvas UDF template (SPEC §53.5): one UDF (`<node>.py`) of a cloned
     canvas, run in Fused and shown here.

     A shared UDF's link (`…/<token>.html`, `.png`) is one request: Fused
     runs the UDF and serialises what it returned — a table as a
     self-contained page, an HTML string as itself, a raster as a PNG. This
     page asks for exactly that, with the user's own sign-in and the file as
     it stands on disk (fused.workbench.udf, SPEC §54), so the canvas need
     not be shared and an edit shows before it is pushed. No workbench is
     framed and no canvas is hydrated.

     What this page does:
       - asks the server what the file is (shared/canvas-node.js);
       - shows the last answer fused-render saved for this file at once,
         then runs it and shows the fresh answer (format "view": the value,
         not Fused's page of it): a table in ag-Grid, an image, text, a
         UDF's own HTML in a sandboxed frame, or the error with its line and
         the run's output; the same bytes again are not redrawn;
       - runs it again when the file changes on disk (unless "Auto-run" is
         off), or on Run;
       - a batch job, batch work or a map is asked about first by the
         runtime (the workbench's own rules), and so is a very large result;
         on open, with a saved answer on screen, such a UDF is not asked
         about: it waits for Run;
       - keeps the canvas's sync engine running, so edits to the folder are
         pushed as they are made.

     What the UDF loads from OTHER nodes is the canvas as Fused has it saved.
     This page must not import fused_render (SPEC PY-15). -->
<html data-fused-theme="shell">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Canvas UDF</title>
<script src="/template-shared/canvas-node.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #131417; --panel: #1a1c20; --fg: #e8eaed; --fg-muted: #9aa0a6;
    --line: #2a2d33; --accent: #f5a623; --on-accent: #1a1300; --error: #ff6b6b;
    --hover: #24272d; --code: #0e0f12; --result-bg: #ffffff; --scrim: rgba(0, 0, 0, 0.5);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff; --panel: #f6f7f9; --fg: #1f2023; --fg-muted: #61656c;
    --line: #dfe2e7; --accent: #b86e00; --on-accent: #ffffff; --error: #c62828;
    --hover: #eceef1; --code: #f1f3f5; --result-bg: #ffffff; --scrim: rgba(20, 24, 31, 0.35);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--fg); background: var(--bg); overflow: hidden;
    display: flex; flex-direction: column;
  }
  .strip {
    flex: none; display: flex; align-items: center; gap: 10px;
    min-height: 36px; padding: 0 12px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  /* Narrow panes: the buttons keep their words on one line, the title keeps
     a readable minimum, and the status lines are what gives way. */
  .strip .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 72px; }
  .strip button, .strip label { flex: none; white-space: nowrap; }
  .strip .kind, .strip .canvas { flex: none; }
  .strip .status { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .strip .kind, .strip .canvas, .strip .status, .strip .sync { color: var(--fg-muted); font-size: 12px; white-space: nowrap; }
  .strip .sync { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .strip .status.error, .strip .sync.error { color: var(--error); }
  .strip .spacer { flex: 1; }
  .strip label { display: flex; align-items: center; gap: 5px; color: var(--fg-muted); font-size: 12px; white-space: nowrap; }
  button {
    font: inherit; color: var(--fg); background: transparent;
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer;
  }
  button:hover { background: var(--hover); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .stage { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .result { position: relative; flex: 1; min-height: 0; overflow: auto; }
  /* A served page (a table, a UDF's own HTML) is authored for a white
     document; it gets one in both themes. */
  .result iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--result-bg); }
  .result img { display: block; max-width: 100%; margin: 16px auto; image-rendering: auto; }
  .result pre, .log pre {
    margin: 0; padding: 12px 14px; white-space: pre-wrap; overflow-wrap: anywhere;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  /* A table result: ag-Grid (vendored, the build Fused's own UDF tables
     use), themed from this page's tokens. The grid fills the stage. */
  .grid-wrap { display: flex; flex-direction: column; height: 100%; }
  .grid-wrap .grid { flex: 1; min-height: 0; }
  .grid-foot { flex: none; padding: 4px 10px; color: var(--fg-muted); font-size: 12px; border-top: 1px solid var(--line); }
  .result .error-head { padding: 12px 14px 0; color: var(--error); font-weight: 600; }
  .result pre.error { color: var(--error); }
  .message {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    padding: 24px; text-align: center; color: var(--fg-muted); background: var(--bg);
  }
  .message .error { color: var(--error); white-space: pre-wrap; max-width: 640px; }
  .log { flex: none; max-height: 35%; overflow: auto; border-top: 1px solid var(--line); background: var(--code); }
  .log summary { padding: 4px 12px; cursor: pointer; color: var(--fg-muted); font-size: 12px; }
  /* A run in flight: a moving bar under the strip. The last result stays as
     it is underneath (not dimmed: a greyed table reads as disabled, not as
     "being replaced"), and the strip says it is the previous one. */
  .progress { position: absolute; top: 0; left: 0; right: 0; height: 3px; overflow: hidden; z-index: 2; }
  .progress::before {
    content: ""; position: absolute; top: 0; bottom: 0; width: 35%;
    background: var(--accent); animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide { from { left: -35%; } to { left: 100%; } }
  @media (prefers-reduced-motion: reduce) {
    .progress::before { animation: none; left: 0; width: 100%; opacity: 0.6; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="strip" id="strip" hidden>
  <span class="title" id="title"></span>
  <span class="kind">UDF</span>
  <span class="canvas" id="canvas"></span>
  <span class="spacer"></span>
  <span class="status" id="status"></span>
  <span class="sync" id="sync"></span>
  <label title="Run when the file opens and whenever it is saved">
    <input type="checkbox" id="autorun" checked /> Auto-run
  </label>
  <button type="button" class="primary" id="run">Run</button>
  <button type="button" id="open">Open in canvas</button>
</div>
<div class="stage">
  <div class="progress" id="progress" hidden></div>
  <div class="result" id="result"></div>
  <details class="log" id="log" hidden>
    <summary id="log-summary">Output</summary>
    <pre id="log-text"></pre>
  </details>
  <div class="message" id="message">Loading…</div>
</div>
<script>
  // The page re-runs the file itself; a reload would drop the last result.
  fused.autoReload(false);

  const FILE = fused.params.get("_file");
  // Several saves in a row (an agent writing, an editor's autosave) are one run.
  const RERUN_DEBOUNCE_MS = 600;
  const RECHECK_MS = 1500;
  const AUTORUN_KEY = "autorun";

  const $ = (id) => document.getElementById(id);
  const result = $("result");
  const message = $("message");
  let node = null;
  let udf = null;           // fused.workbench.udf handle on FILE
  let running = false;
  let queued = false;       // a change landed during a run: run once more after
  let rerunTimer = null;
  let runTicker = null;
  let shownFrom = null;     // what the result on screen is: "saved" | "fresh" | null
  let shownHash = null;     // sha256 of the bytes on screen: the same bytes are not drawn again
  let runGen = 0;           // bumped by every run: a saved copy is drawn only for the latest

  function el(tag, value, cls) {
    const out = document.createElement(tag);
    if (value !== undefined) out.textContent = value;
    if (cls) out.className = cls;
    return out;
  }
  function showMessage(build) {
    message.replaceChildren();
    build(message);
    message.hidden = false;
  }
  function setStatus(value, isError) {
    const status = $("status");
    status.textContent = value || "";
    status.className = "status" + (isError ? " error" : "");
  }
  // The canvas's sync engine runs while this page is open (shared/
  // canvas-node.js, NT-7), so edits to the folder are pushed as they are made.
  function setSync(value, tone) {
    const el = $("sync");
    el.textContent = value || "";
    el.className = "sync" + (tone ? " " + tone : "");
  }

  function setLog(stdout, stderr) {
    const parts = [];
    if (stdout) parts.push(stdout.replace(/\n+$/, ""));
    if (stderr) parts.push(stderr.replace(/\n+$/, ""));
    $("log-text").textContent = parts.join("\n");
    $("log").hidden = parts.length === 0;
  }
  function humanBytes(n) {
    const units = ["B", "KB", "MB", "GB"];
    let i = 0;
    while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
    return (i === 0 ? n : n.toFixed(1)) + " " + units[i];
  }
  function ago(date) {
    if (!date) return "";
    const s = Math.max(0, Math.round((Date.now() - date.getTime()) / 1000));
    if (s < 60) return "just now";
    if (s < 3600) return Math.round(s / 60) + " min ago";
    if (s < 86400) return Math.round(s / 3600) + " h ago";
    return Math.round(s / 86400) + " d ago";
  }

  // Fused's page for a table is an ag-Grid in a `<div id="myGrid">` that is
  // given no height, and a grid sizes itself to its container: on its own it
  // draws as a 2px line with every row inside it. That page, and only that
  // page, is given the frame's height; a UDF's own HTML is left as returned.
  function sizedTablePage(html) {
    const isTablePage = html.includes('<div id="myGrid"></div>') && html.includes("ag-grid-community");
    if (!isTablePage) return html;
    const sizing = "#myGrid{height:calc(100vh - 16px);width:100%}";
    return "<" + "style>" + sizing + "</" + "style>" + html;
  }

  // A `view` table ({columns, rows, total}) in ag-Grid, configured as the
  // hosted workbench does its UDF tables: themeQuartz (colorSchemeDark in a
  // dark theme) with the page's own colours, every community module, a
  // filter on each column, numbers right-aligned. The library is vendored
  // (/template-assets) and loaded only when a table is drawn.
  const TABLE_TYPE = "application/vnd.fused-render.table+json";
  let agGrid = null;
  function loadAgGrid() {
    if (!agGrid) {
      agGrid = import("/template-assets/ag-grid-community.esm.min.mjs").then((ag) => {
        ag.ModuleRegistry.registerModules([ag.AllCommunityModule]);
        return ag;
      });
    }
    return agGrid;
  }
  function gridTheme(ag) {
    const css = getComputedStyle(document.documentElement);
    const v = (name) => css.getPropertyValue(name).trim();
    const dark = document.documentElement.getAttribute("data-theme") !== "light";
    return (dark ? ag.themeQuartz.withPart(ag.colorSchemeDark) : ag.themeQuartz).withParams({
      backgroundColor: v("--bg"),
      foregroundColor: v("--fg"),
      headerBackgroundColor: v("--panel"),
      borderColor: v("--line"),
      accentColor: v("--accent"),
      fontFamily: getComputedStyle(document.body).fontFamily,
      fontSize: 12,
    });
  }
  let gridApi = null;
  let themeWatch = null;
  async function tableNode(data) {
    const ag = await loadAgGrid();
    const columns = Array.isArray(data.columns) ? data.columns : [];
    const rows = Array.isArray(data.rows) ? data.rows : [];
    const total = typeof data.total === "number" ? data.total : rows.length;
    const rowData = rows.map((row) => {
      const out = {};
      columns.forEach((c, i) => { out[c] = row[i]; });
      return out;
    });
    const numeric = (c) => rows.length > 0 && rows.every((r) => r[columns.indexOf(c)] === null || typeof r[columns.indexOf(c)] === "number");
    const columnDefs = columns.map((c) => Object.assign(
      { field: String(c), headerName: String(c), filter: true, minWidth: 135 },
      numeric(c) ? { type: "numericColumn" } : {}
    ));
    const wrap = el("div", undefined, "grid-wrap");
    const host = el("div", undefined, "grid");
    wrap.append(host);
    if (total > rows.length) {
      wrap.append(el("div", "Showing the first " + rows.length.toLocaleString() + " of " +
        total.toLocaleString() + " rows.", "grid-foot"));
    }
    wrap._grid = ag.createGrid(host, {
      columnDefs,
      rowData,
      theme: gridTheme(ag),
      suppressFieldDotNotation: true,
      enableCellTextSelection: true,
      ensureDomOrder: true,
    });
    // The app's theme can flip while the page is open: the grid on screen
    // (`gridApi`, set when the table is put on the stage) follows.
    if (!themeWatch) {
      themeWatch = new MutationObserver(() => {
        if (gridApi && !gridApi.isDestroyed()) gridApi.setGridOption("theme", gridTheme(ag));
      });
      themeWatch.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme", "style"] });
    }
    return wrap;
  }

  function showError(err) {
    result.replaceChildren();
    if (gridApi && !gridApi.isDestroyed()) gridApi.destroy();
    gridApi = null;
    setLog(err.stdout, err.stderr);
    const head = typeof err.line === "number" ? "Error on line " + err.line : "Error";
    result.append(el("div", head, "error-head"), el("pre", err.message || "the run failed", "error"));
    // An error's output is why one is reading it.
    $("log").open = true;
    shownFrom = null;
    shownHash = null;
    setStatus("Failed", true);
  }

  // One result (fused.workbench.udf's Result) onto the stage. Its bytes are
  // at `answer.url`; HTML there is sandboxed by the server too.
  async function showAnswer(answer, stillWanted) {
    const type = (answer.contentType || "").split(";")[0].trim().toLowerCase();
    // The same bytes are already on screen (a fresh answer equal to the saved
    // one): nothing is drawn again, only the strip changes.
    const same = answer.hash && answer.hash === shownHash && result.hasChildNodes();
    const nodes = [];
    if (same) {
      // keep the stage as it is
    } else if (answer.size === 0) {
      nodes.push(el("pre", "This UDF returned nothing."));
    } else if (type === "text/html") {
      // Fused's own page for the result (a table viewer, or the UDF's HTML).
      // Its scripts run, in a frame with no access to this origin.
      const frame = document.createElement("iframe");
      frame.title = "Result of " + node.title;
      frame.setAttribute("sandbox", "allow-scripts allow-popups allow-popups-to-escape-sandbox allow-downloads");
      frame.srcdoc = sizedTablePage(await answer.text());
      nodes.push(frame);
    } else if (type === TABLE_TYPE) {
      nodes.push(await tableNode(await answer.json()));
    } else if (type.startsWith("image/")) {
      const img = document.createElement("img");
      img.alt = "Result of " + node.title;
      img.src = answer.url;
      nodes.push(img);
    } else if (type === "application/json" || type.startsWith("text/")) {
      let shown = await answer.text();
      if (type === "application/json") {
        try { shown = JSON.stringify(JSON.parse(shown), null, 2); } catch (_) { /* as sent */ }
      }
      nodes.push(el("pre", shown));
    } else {
      nodes.push(el("pre", "This result (" + (type || "unknown type") + ", " + humanBytes(answer.size) +
        ") has no preview here. Open the node in its canvas to see it."));
    }
    const grid = nodes.length && nodes[0]._grid ? nodes[0]._grid : null;
    if (stillWanted && !stillWanted()) {
      if (grid) grid.destroy();
      return;
    }
    if (!same) {
      result.replaceChildren(...nodes);
      // The grid that was on screen is gone with its node: release it.
      if (gridApi && gridApi !== grid && !gridApi.isDestroyed()) gridApi.destroy();
      gridApi = grid;
    }
    shownHash = answer.hash || null;
    message.hidden = true;
    setLog(answer.stdout, answer.stderr);
    shownFrom = answer.source === "saved" ? "saved" : "fresh";
    if (answer.source === "saved") {
      setStatus("Saved · " + ago(answer.savedAt));
      return;
    }
    const took = typeof answer.seconds === "number" ? answer.seconds.toFixed(1) + " s" : "";
    setStatus([answer.source === "fused-cache" ? "Cached" : "", took].filter(Boolean).join(" · "));
  }

  // What a run in flight looks like: the bar, the button saying so, and the
  // strip counting the seconds — and, over a result already on screen, that
  // it is the previous (or saved) one until the new one replaces it.
  function setRunning(on) {
    clearInterval(runTicker);
    $("progress").hidden = !on;
    $("run").disabled = on;
    $("run").textContent = on ? "Running…" : "Run";
    if (!on) return;
    const startedAt = Date.now();
    const tick = () => {
      const secs = Math.floor((Date.now() - startedAt) / 1000);
      const behind = shownFrom === "saved" ? " · saved result shown"
        : shownFrom === "fresh" ? " · previous result shown" : "";
      setStatus("Running… " + secs + " s" + behind);
    };
    tick();
    runTicker = setInterval(tick, 1000);
  }

  // What the stage says when there is no result to leave on it.
  function idle(text) {
    if (!result.hasChildNodes()) showMessage((host) => host.append(el("div", text)));
  }

  // One run (SPEC §53.5, §54). The runtime asks the user before a batch job,
  // batch work or a map, and before a very large result. `opts.onOpen`: the
  // run that opening the page starts; with a saved answer on screen, a UDF
  // the workbench never runs on its own is not asked about then (`confirm:
  // false`) — it waits for Run.
  async function run(opts) {
    opts = opts || {};
    if (!node || !udf) return;
    if (running) {
      queued = true;
      return;
    }
    running = true;
    queued = false;
    const handle = udf.run(undefined, { format: "view", confirm: opts.onOpen ? false : undefined });
    // The saved copy is drawn only until something newer owns the stage:
    // this run's fresh answer or its UDF error (`settled`), or a later run
    // (`gen`). A decline or a failure to run leaves it eligible — on open, a
    // batch/map UDF with a saved answer is meant to show that answer.
    // `shownFrom` cannot say this — an error resets it to null.
    const gen = ++runGen;
    let settled = false;
    const savedWanted = () => !settled && gen === runGen;
    if (opts.onOpen) {
      handle.saved.then((saved) => {
        if (saved && savedWanted()) void showAnswer(saved, savedWanted);
      });
    }
    setRunning(true);
    try {
      const fresh = await handle;
      settled = true;
      await showAnswer(fresh);
    } catch (error) {
      if (error.code === "udf_error") {
        settled = true;
        showError(error);
      } else if (error.code === "declined" && error.execution_type) {
        // A batch job / batch work / map not run. Decided on whether a saved
        // copy EXISTS, not on whether it has finished drawing: the worker's
        // answer can beat its bytes.
        if (opts.onOpen && !(await handle.saved)) {
          // Nothing saved to show: ask now, as a save or Run would.
          queued = true;
        } else {
          setStatus(error.reason || "Not run");
          idle((error.reason || "This UDF was not run") + ". Press Run to run it.");
        }
      } else if (error.code === "declined") {
        // "Don't load" on a large result: nothing runs again for it.
        setStatus("Not loaded");
        idle(error.message.charAt(0).toUpperCase() + error.message.slice(1) + ".");
      } else {
        // The run never happened or never arrived (signed out, a timeout):
        // nothing of the last result is thrown away for it.
        setStatus(error.message, true);
        if (!result.hasChildNodes()) {
          showMessage((host) => {
            host.append(el("div", "Could not run " + node.title + ": " + error.message, "error"));
          });
        }
      }
    } finally {
      running = false;
      setRunning(false);
      if (shownFrom === "saved") {
        // The run ended without a fresh answer: the strip says again what
        // is on screen.
        const s = $("status").textContent;
        if (!s || s.startsWith("Running")) setStatus("Saved result");
      }
    }
    if (queued) void run();
  }

  async function boot() {
    if (!FILE) {
      showMessage((host) => host.append(el("div", "No file to show.")));
      return;
    }
    try {
      node = await CanvasNode.info(FILE);
    } catch (error) {
      showMessage((host) => host.append(el("div", "Could not read this node: " + error.message, "error")));
      return;
    }
    if (!node || !node.enabled || !node.node) {
      node = null;
      showMessage((host) => host.append(el("div", "This file is not a node of a canvas you work on.")));
      return;
    }
    $("title").textContent = node.title;
    $("canvas").textContent = node.name;
    udf = fused.workbench.udf({ file: FILE });
    $("open").addEventListener("click", () => CanvasNode.openCanvas(node));
    $("run").addEventListener("click", () => void run());
    const autorun = $("autorun");
    autorun.checked = fused.params.get(AUTORUN_KEY) !== "0";
    autorun.addEventListener("change", () => {
      fused.params.set(AUTORUN_KEY, autorun.checked ? null : "0");
      // Off means off: a save's run still waiting to start does not start.
      if (!autorun.checked) {
        clearTimeout(rerunTimer);
        queued = false;
      }
    });
    $("strip").hidden = false;
    if (!node.signed_in) {
      showMessage((host) => {
        host.append(el("div", "Sign in to Fused to run " + node.title + "."));
        const go = el("button", "Open Canvases to sign in", "primary");
        go.type = "button";
        go.addEventListener("click", () => CanvasNode.openCanvases());
        host.append(go);
      });
      return;
    }
    const onChanged = () => {
      if (!autorun.checked) {
        setStatus("File changed — Run to update");
        return;
      }
      clearTimeout(rerunTimer);
      rerunTimer = setTimeout(() => void run(), RERUN_DEBOUNCE_MS);
    };
    fused.onFileChanged(onChanged);
    CanvasNode.sync(node, { status: setSync });
    // A save that landed while the file watch was still coming up made no
    // event: compare the file's time once, against the one this run started
    // from.
    const mtimeOf = () => fused.stat(FILE).then((st) => st.mtime, () => null);
    const startedFrom = await mtimeOf();
    setTimeout(async () => {
      const now = await mtimeOf();
      if (now !== null && now !== startedFrom) onChanged();
    }, RECHECK_MS);
    // Auto-run off: nothing runs until Run, on open as on a save.
    if (!autorun.checked) {
      setStatus("Auto-run is off");
      idle("Auto-run is off. Press Run to run " + node.title + ".");
      return;
    }
    showMessage((host) => host.append(el("div", "Running " + node.title + "…")));
    await run({ onOpen: true });
  }

  void boot();
</script>
</body>
</html>
