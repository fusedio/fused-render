# The latex template's environment (SPEC PY-16). daemon.py is the runPython
# entrypoint (it serves engine.py's actions over a localhost HTTP daemon that
# runs in THIS venv); install_worker.py and warm_worker.py are spawned beside
# them and are stdlib-only.
#
# `pypandoc-binary`, NOT `pypandoc`: the two are the same import name and the
# same version, but the plain wheel is 0.0 MB of pure Python with NO pandoc
# executable, while pypandoc-binary is ~41 MB and ships one. engine.py runs
# that binary — so with the plain distribution the venv builds cleanly and then
# fails at RUNTIME on any machine without a system pandoc. This is why the
# completeness invariant cannot rest on "is it importable".
[project]
name = "fused-render-template-latex"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pypandoc-binary ; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

# Not a distribution — this folder is a set of scripts, not something to build
# and install. Without this uv would try to build the "project" itself and fail.
[tool.uv]
package = false
