<!DOCTYPE html>
<html data-fused-theme="shell">
<head>
<meta charset="utf-8" />
<title>Bare Demo — Home</title>
<style>
  :root {
    color-scheme: dark;
    --fg: #e8eaed; --fg-muted: #9aa0a6; --bg: #131417; --accent: #E5FF44;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --fg: #1f2023; --fg-muted: #61656c; --bg: #ffffff; --accent: #5f7300;
  }
  body {
    margin: 0; padding: 40px; height: 100vh; box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--fg); background: var(--bg);
  }
  h1 span { color: var(--accent); }
  p { color: var(--fg-muted); max-width: 36rem; line-height: 1.6; }
  a { color: var(--accent); cursor: pointer; }
</style>
</head>
<body>
  <h1><span>Bare</span> Demo App — Home</h1>
  <p>
    This app sets <code>"nav": "none"</code> in fused_app.json: no sidebar,
    the page fills the frame, and navigation is the app's own job.
  </p>
  <p><a id="to-detail">Go to Detail →</a></p>
  <script>
    document.getElementById("to-detail").addEventListener("click", () => {
      fused.navigate("/detail").catch((e) => alert(e.message));
    });
  </script>
</body>
</html>
