    if (!cache.has(url)) {
      fetched++;
      cache.set(url, shotUrlAsData(url, el));
    }
    return cache.get(url);
  };
  // Room for one more DISTINCT url: an image repeated ten times costs one fetch.
  const room = (url) => cache.has(url)
    || (fetched < SHOT_IMG_MAX && Date.now() < deadline);
  try {
    for (const s of dst.querySelectorAll("picture source")) s.remove();
  } catch (err) { /* a clone with no <picture> in it */ }
  const ss = src.querySelectorAll("img"), ds = dst.querySelectorAll("img");
  for (let i = 0; i < ss.length && i < ds.length; i++) {
    // currentSrc, not src: it is what the browser actually PICKED out of a
    // srcset, which is the picture on screen and the one being photographed.
    const url = ss[i].currentSrc || ss[i].getAttribute("src") || "";
    if (!url || url.slice(0, 5) === "data:") continue;
    if (!room(url)) { missing++; shotImagePlaceholder(ds[i], ss[i].alt); continue; }
    try {
      ds[i].setAttribute("src", await resolve(url, ss[i]));
      // Both would re-select a URL over the src we just wrote.
      ds[i].removeAttribute("srcset");
      ds[i].removeAttribute("sizes");
    } catch (err) {
      missing++;
      shotImagePlaceholder(ds[i], ss[i].alt);
    }
  }
  // Backgrounds, masks, borders and list markers: the style walk has already
  // written the computed value onto every clone element, so this reads them back
  // off the clone and needs no second pass over the live tree. Scanned by
  // substring first — `url(` appears in a handful of the thousands of style
  // attributes here, and the regex is not worth running on the rest.
  for (const el of dst.querySelectorAll("*")) {
    const style = el.getAttribute("style") || "";
    if (style.indexOf("url(") === -1) continue;
    let out = style;
    for (const url of shotStyleUrls(style)) {
      if (!room(url)) { missing++; continue; }
      try {
        const data = await resolve(url, null);
        out = out.split(url).join(data);
      } catch (err) {
        // No placeholder for a background: the element keeps its size and its
        // colour, and the missing layer is counted in the note. Substituting a
        // dashed box for a texture would be a bigger lie than leaving it plain.
        missing++;
      }
    }
    if (out !== style) el.setAttribute("style", out);
  }
  return { missing };
}

// Replace each <canvas> in the clone with an <img> of its own pixels: a <canvas>
// serializes as an empty element, so without this every chart and map in the
// capture is a hole. Returns the SOURCE canvases whose pixels were not readable,
// for the annotations that point at them.
function shotRasterise(src, dst) {
  const cs = src.querySelectorAll("canvas"), cd = dst.querySelectorAll("canvas");
  const blanks = [];
  const probe = src.ownerDocument.createElement("canvas");
  for (let i = 0; i < cs.length && i < cd.length; i++) {
    let url = "";
    try { url = cs[i].toDataURL("image/png"); } catch (err) { url = ""; }
    let blankUrl = "";
    try {
      probe.width = cs[i].width; probe.height = cs[i].height;
      blankUrl = probe.toDataURL("image/png");
    } catch (err) { blankUrl = ""; }
    if (shotReadbackIsBlank(url, blankUrl)) {
      // Left as a <canvas> in the clone, which serializes empty — the same hole
      // it would have been anyway. The annotation is what reports it.
      blanks.push(cs[i]);
      continue;
    }
    const img = dst.ownerDocument.createElement("img");
    img.setAttribute("src", url);
    img.setAttribute("style", cd[i].getAttribute("style") || "");
    cd[i].replaceWith(img);
  }
  return blanks;
}

// Integer crop rect inside the pane bitmap, or null when there is nothing to cut.
// Origin floors and the far edge ceils — rounding both the same way shaves the
// element's last row of pixels, which on a 1px border is the entire point of the
// crop. Clamped to the bitmap because the bitmap is the VISIBLE pane: reading
// outside it would pad the crop with transparency that looks like missing UI.
function shotCropRect(rect, paneW, paneH) {
  const l = Math.max(0, Math.floor(rect.left));
  const t = Math.max(0, Math.floor(rect.top));
  const r = Math.min(paneW, Math.ceil(rect.left + rect.width));
  const b = Math.min(paneH, Math.ceil(rect.top + rect.height));
  const w = r - l, h = t < b ? b - t : 0;
  if (w <= 0 || h <= 0 || w * h < SHOT_MIN_AREA) return null;
  return { left: l, top: t, width: w, height: h };
}

// Target size for a shot: longest edge down to `maxEdge`, never UP (a 320px button
// blown up to 640 is more bytes and no more information). Edges floor at 1px,
// because a zero-dimension canvas throws on toBlob and would cost the whole
// capture rather than one crop.
function shotFit(w, h, maxEdge) {
  const scale = Math.min(1, (maxEdge || SHOT_MAX_EDGE) / Math.max(w, h));
  return { width: Math.max(1, Math.round(w * scale)),
           height: Math.max(1, Math.round(h * scale)), scale };
}

function shotBlob(canvas, type, quality) {
  return new Promise((res) => canvas.toBlob(res, type, quality));
}

// The extension a blob has EARNED, read off the bytes rather than off what we
// asked the encoder for. This one rule is what makes trying WebP safe:
// WKWebView — which the desktop app ships — cannot encode WebP and fails
// SILENTLY. `toBlob(cb, "image/webp", q)` hands back a blob whose `type` is
// "image/png", at byte-identical size, with no throw and no null. A file named
// `.webp` holding PNG bytes would be worse than never trying, so the name follows
// the content.
function shotExt(blob) {
  return blob && blob.type === "image/webp" ? ".webp" : ".png";
}

// Quality steps tried before any resolution is given up. Claude Code's Read tool
// accepts .webp (verified against the real CLI under the real double-slash Read
// rule), and small text in a UI stays legible down to q60 — so this is a much
// better knob than shrinking. JPEG is deliberately not here: measured on this very
// UI it LOST to PNG (13477 → 13945 bytes on a card, 18173 → 91579 on a canvas
// raster), because flat colour is PNG's strong case.
const SHOT_WEBP_QUALITY = [0.8, 0.6];
// Whether this engine really encodes WebP: null until the first attempt tells us.
// Probed once per page, not once per crop — the capability cannot change
// mid-session, and re-probing would cost every WKWebView user a wasted encode on
// every single shot.
let shotWebpOk = null;

// Cut one region out of the pane bitmap and encode it as small as it can be while
// staying legible. `limits` overrides the crop caps; the whole-pane shot was its
// one caller and is gone, so every call takes the defaults today. null means
// "over budget however hard we tried"
// — no shot beats one that dominates the turn.
//
// Knob order is deliberate: quality first, resolution last. The halve-and-retry
// below exists only because PNG has no quality parameter, and dropping 640px to
// 320px to 160px destroys exactly the legibility a picture is sent for. Where WebP
// is real, every quality step is spent at full size before a pixel is given up.
//
// Both formats are tried at each size rather than one being assumed smaller: lossy
// WebP usually wins, but PNG genuinely beats it on flat UI, and the first encoding
// that FITS is the one we want. We do not encode both to compare when the first
// already fits — that doubles the cost for a marginal byte win, and the budget
// here is time.
async function shotEncode(pane, rect, limits) {
  const maxEdge = (limits && limits.maxEdge) || SHOT_MAX_EDGE;
  const maxBytes = (limits && limits.maxBytes) || SHOT_MAX_BYTES;
  let fit = shotFit(rect.width, rect.height, maxEdge);
  for (let attempt = 0; attempt < 3; attempt++) {
    const c = document.createElement("canvas");
    c.width = fit.width;
    c.height = fit.height;
    c.getContext("2d").drawImage(pane.canvas, rect.left, rect.top,
                                 rect.width, rect.height, 0, 0, fit.width, fit.height);
    if (shotWebpOk !== false) {
      for (const q of SHOT_WEBP_QUALITY) {
        const webp = await shotBlob(c, "image/webp", q);
        if (!webp) break;
        if (webp.type !== "image/webp") {
          // The silent failure. Recorded so no later shot pays for the discovery
          // again, and fall through to PNG — which is what this blob already is.
          shotWebpOk = false;
          break;
        }
        shotWebpOk = true;
        if (webp.size <= maxBytes) return webp;
      }
    }
    const png = await shotBlob(c, "image/png");
    if (!png) return null;
    if (png.size <= maxBytes) return png;
    fit = { width: Math.max(1, Math.round(fit.width / 2)),
            height: Math.max(1, Math.round(fit.height / 2)), scale: fit.scale / 2 };
  }
  return null;
}

// ── the cross-origin pane's picture: tab capture, cropped to the frame ──
// shotPane's clone-and-rasterise needs a readable document, and the annXO
// target has none (D349). What the browser can still hand over is the TAB's
// own pixels: getDisplayMedia with preferCurrentTab, one frame grabbed off
// the video track and cropped to the marked iframe's rect — the same box the
// overlay (and so every point coordinate) lives in, so the crops and the
// whole-pane shot line up with the pins for free.
//
// The stream is KEPT between captures: the share prompt is paid once, not
// once per note — a walkthrough clicking ten spots must not raise ten
// pickers. Released when the user ends the share (`ended`), when the target
// stops being cross-origin, and on pagehide (annXORemove covers both).
// `annXOStream` and its stop() live with the annXO state up top — the
// teardown runs at boot, long before this section — see the note there.
async function annXOStreamGet() {
  if (annXOStream
      && annXOStream.getVideoTracks().some((t) => t.readyState === "live")) {
    return annXOStream;
  }
  annXOStreamStop();
  annXOStream = await navigator.mediaDevices.getDisplayMedia({
    video: { displaySurface: "browser" },
    audio: false,
    // Chromium's current-tab hints: preselect THIS tab, offer no switching,
    // no monitors. The crop below is only ever computed against this tab's
    // own layout, so any other surface would be cropped wrong — the hints
    // make the right choice the one-click one (they are ignored, not fatal,
    // where unsupported).
    preferCurrentTab: true,
    selfBrowserSurface: "include",
    surfaceSwitching: "exclude",
    monitorTypeSurfaces: "exclude",
  });
  const track = annXOStream.getVideoTracks()[0];
  if (track) track.addEventListener("ended", annXOStreamStop, { once: true });
  return annXOStream;
}
// Same answer shape as shotPane, so every consumer — shotEncode's crops,
// shotEncodeBadged's badges, shotCapturePane's whole-pane shot and the
// three caveat writers — runs unchanged: a capture off live pixels has no
// style walk, no image inlining and no WebGL readback to caveat, so the
// doubt fields are simply clean. Null (not a throw) for every "cannot":
// the callers already read null as "nothing to capture".
async function shotXOPane() {
  if (!annXO || !annFrame || !navigator.mediaDevices
      || !navigator.mediaDevices.getDisplayMedia) return null;
  let host;
  try { host = window.parent; void host.innerWidth; } catch (err) { return null; }
  const stream = await annXOStreamGet();
  const video = document.createElement("video");
  video.muted = true;
  video.srcObject = stream;
  await video.play();
  // One PAINTED frame — play() resolving does not mean pixels arrived.
  if (video.requestVideoFrameCallback) {
    await new Promise((res) => video.requestVideoFrameCallback(res));
  } else {
    await new Promise((res) => setTimeout(res, 150));
  }
  // The captured frame is the tab's viewport at the capture's own resolution;
  // the iframe's rect in that viewport, scaled the same way, is the crop.
  const sx = video.videoWidth / host.innerWidth;
  const sy = video.videoHeight / host.innerHeight;
  const r = annFrame.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  canvas.getContext("2d").drawImage(video,
    r.left * sx, r.top * sy, r.width * sx, r.height * sy, 0, 0, w, h);
  video.srcObject = null;
  return { canvas, width: w, height: h, blanks: [],
           styled: 0, incomplete: false, imagesMissing: 0 };
}

// Rasterise the visible left pane once. Returns
// {canvas, width, height, blanks, styled, incomplete} or null when there is no
// readable app document to capture. `deadline` is a Date.now() stamp the style
// walk stops at — the capture's share of SHOT_TIMEOUT_MS, enforced INSIDE the
// walk because that is the only place that can enforce it (see shotInlineStyles).
// A cross-origin target takes the tab-capture path above instead — pixels off
// the screen, since there is no document to clone.
//
// Why the clone is styled from the LIVE tree, which is what creates the race
// shotInlineStyles has to defend against: a clone is detached, and a detached
// element has no cascade — `getComputedStyle` on one enumerates zero properties
// and returns "" for everything (checked in a real browser, not assumed). Putting
// the clone INTO the app's document to give it a cascade would double the DOM,
// duplicate every id, change what sibling and nth-child selectors match, and
// mutate the page the user is looking at. So the live tree is the only source of
// truth for computed style, and the race is detected rather than avoided.
async function shotPane(deadline) {
  if (annXO) return shotXOPane();
  const win = appWindow();
  const doc = win && win.document;
  const body = doc && doc.body;
  if (!body) return null;
  const root = doc.documentElement;
  const w = Math.max(1, Math.round(root.clientWidth || body.offsetWidth));
  const h = Math.max(1, Math.round(root.clientHeight || body.offsetHeight));
  const clone = body.cloneNode(true);
  // The style walk stops SHORT of the deadline so the image fetches have a tail to
  // run in: it stops exactly at whatever stamp it is given, so sharing one stamp
  // between the two would let a big page spend the entire budget and leave every
  // picture inside it a placeholder — in a capture that had time in hand.
  const styles = await shotInlineStyles(
    body, clone, Math.max(Date.now(), deadline - SHOT_IMG_MS));
  // BEFORE shotRasterise, which puts data:-URL <img>s of its own into the clone:
  // running after it would pair those against the source's real images by index
  // and put a chart's pixels where a logo was.
  const images = await shotInlineImages(body, clone, deadline);
  const blanks = shotRasterise(body, clone);
  // LAST, so a canvas that shotRasterise swapped for an <img> is shifted with the
  // rest of its scroll box rather than left at the top of it.
  shotApplyScroll(styles.scrolled);
  // Shift the clone by the app's scroll offset so the bitmap matches the VIEWPORT
  // — which is the coordinate space annStageRect (and the pins) already work in.
  // Without this a scrolled app would be cropped against the top of its document.
  // This is the WINDOW's scroll only; every inner `overflow: auto` box is put back
  // by shotApplyScroll above, which is where the interesting half of the problem
  // is (see that function).
  const sx = Math.round(win.scrollX || 0), sy = Math.round(win.scrollY || 0);
  const xml = new XMLSerializer().serializeToString(clone);
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '">'
    + '<foreignObject width="100%" height="100%">'
    + '<div xmlns="http://www.w3.org/1999/xhtml" style="transform:translate('
    + (-sx) + 'px,' + (-sy) + 'px)">' + xml + '</div>'
    + '</foreignObject></svg>';
  const img = new Image();
  await new Promise((res, rej) => {
    img.onload = res;
    // An <img> load failure carries no reason, so say what it means instead of
    // reporting an empty event: the serialized markup was not valid XHTML.
    img.onerror = () => rej(new Error("the pane's markup could not be rasterised"));
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  });
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext("2d");
  // A foreignObject paints nothing where the page is transparent, and <html>'s
  // background does not come along with <body>'s clone. Without a backdrop a
  // light app crops as black once the PNG is flattened.
  ctx.fillStyle = shotBackdrop(win) || "#ffffff";
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0);
  return { canvas, width: w, height: h, blanks,
           styled: styles.styled, incomplete: styles.incomplete,
           imagesMissing: images.missing };
}

// The app's own page background, from <html> then <body>. Returns "" when both
// are transparent, which the caller reads as "use white".
function shotBackdrop(win) {
  const opaque = (el) => {
    if (!el) return "";
    const bg = win.getComputedStyle(el).backgroundColor;
    return bg && bg !== "transparent" && !/^rgba\(.*,\s*0\)$/.test(bg) ? bg : "";
  };
  try {
    return opaque(win.document.documentElement) || opaque(win.document.body);
  } catch (err) {
    return "";
  }
}


// The filename prefix every file one capture writes shares: a sortable timestamp
// plus enough randomness that two captures in the same second cannot collide. ONE
// definition because two callers mint one — the crops and the whole-pane shot —
// and a divergence would be invisible until two files in the same directory
// wanted the same name.
function shotStamp() {
  return new Date().toISOString().replace(/[^0-9]/g, "").slice(0, 14)
    + "-" + crypto.randomUUID().slice(0, 8);
}

// Where the blank WebGL regions ARE, in pane-bitmap coordinates, as prose. A crop
// can be suppressed because the other crops survive it; a pane shot cannot —
// suppressing it leaves nothing at all — so it ships WITH a note saying which
// rectangles of the picture are the app's backdrop rather than what was drawn.
// Naming the regions is what lets the agent judge the rest of the layout and not
// the parts it must not.
function shotBlankRegions(pane) {
  const rects = [];
  for (const cv of (pane && pane.blanks) || []) {
    const r = shotCropRect(annStageRect(cv), pane.width, pane.height);
    if (r) rects.push(Math.round(r.width) + "x" + Math.round(r.height)
                      + " at (" + Math.round(r.left) + "," + Math.round(r.top) + ")");
  }
  if (!rects.length) return "";
  return "the following region" + (rects.length === 1 ? " is" : "s are")
    + " a WebGL canvas whose pixels could not be read back, so "
    + (rects.length === 1 ? "it shows" : "they show") + " the app's background "
    + "instead of what was drawn there: " + rects.join(", ")
    + ". A map/3D library (maplibre, deck.gl) creates its context with "
    + "preserveDrawingBuffer:false, which is why — the app is very likely drawing "
    + "fine, so judge the layout around those regions and not inside them";
}

// One picture of the WHOLE visible pane, uploaded, as {view, viewNote, thumb} —
// or {view: null, viewNote} naming what stopped it. Never throws for a reason the
// user could act on; a real exception is the caller's to turn into a note.
//
// Captured when the BUTTON is pressed, which is the one thing that separates this
// from the crops: they are taken during a send, racing a message the user must not
// lose, so a failure there degrades silently to "no shots this turn". Here the user
// is standing in front of the result, so a failure is worth SAYING — and `thumb`
// exists for the same reason, since a screenshot nobody can look at before it goes
// out is one nobody can check.
//
// `deadline` is the stamp the style walk stops at, exactly as for a crop: it is
// enforced INSIDE the walk because that is the only place that can enforce it (see
// shotInlineStyles), and the caller's timer is the other half.
async function shotCapturePane(deadline) {
  const dir = await shotDirPath();
  const pane = await shotPane(deadline);
  if (!pane) {
    return { view: null, viewNote: "no pane screenshot: " + APP_STATE_UNREADABLE };
  }
  const blob = await shotEncode(pane, { left: 0, top: 0,
                                        width: pane.width, height: pane.height },
                                { maxEdge: SHOT_VIEW_EDGE,
                                  maxBytes: SHOT_VIEW_BYTES });
  if (!blob) {
    return { view: null, viewNote: "no pane screenshot: it did not fit the "
             + SHOT_VIEW_BYTES + "-byte budget" };
  }
  const path = shotJoin(dir, shotStamp() + "-view" + shotExt(blob));
  await fused.uploadFile(path, blob);
  const out = { view: path, thumb: URL.createObjectURL(blob) };
  // Never suppressed for a blank canvas, only annotated: suppressing the pane
  // leaves nothing at all, so the caveat rides beside the real picture.
  const caveats = [];
  const blanks = shotBlankRegions(pane);
  if (blanks) caveats.push(blanks);
  const imgs = shotImageNote(pane);
  if (imgs) caveats.push(imgs);
  const paneNote = shotPaneNote(pane);
  if (paneNote) caveats.push(paneNote);
  if (caveats.length) {
    out.viewNote = caveats.join("; ") + ". " + shotTrustLine(pane.incomplete);
  }
  return out;
}

// ── the overview screenshot: ONE picture per send, badges burned in ────────
// One labeled overview per send, as {view, viewNote, thumb, marks: {id: true|reason}}.
//
// Where every pending note used to get its OWN crop, the message now carries a
// single screenshot of the whole pane with a red badge burned in at each note's
// spot — the badge letter is the note's `label`, so the model reconciles words
// with pixels through one picture instead of N. Typed and spoken comments are
// deliberately identical here: one capture, at send time, for all of them.
//
// Deliberately does NOT mutate the annotations: the caller races this against a
// timeout, and a half-applied capture would leave notes describing a picture
// that never finished. The caller applies the result or nothing (annApplyOverview).
async function annCaptureOverview(pending, deadline) {
  if (!pending || !pending.length) return null;
  const pane = await shotPane(deadline === undefined
                              ? Date.now() + SHOT_TIMEOUT_MS : deadline);
  if (!pane) {
    return { view: null, viewNote: "no overview screenshot: " + APP_STATE_UNREADABLE,
             marks: {} };
  }
  // Whatever `annFrame` currently points at — our pane, or the host's marked
  // one — and it may be null in the sidebar layout, where the shotPane above has
  // already answered "nothing to capture" for the same reason.
  const doc = annFrame && annFrame.contentDocument;
  // The cross-origin overlay's zero-scroll stand-in, exactly as the pin painter
  // uses it: point coords are overlay-relative there and the capture comes off
  // the tab (shotXOPane), which shares that coordinate space.
  const win = (doc && doc.defaultView) || (annXO ? ANN_XO_SCROLL : null);
  const badges = [];
  const marks = {};
  for (const c of pending) {
    let pt = null;
    if (c.kind === "point") {
      pt = annPointXY(c, win);
    } else {
      const el = doc ? annResolve(c, doc) : null;
      if (!el) {
        marks[c.id] = "the annotated element was not in the app's DOM when this "
          + "message was sent (the app may have re-rendered since)";
        continue;
      }
      // Same spot the pin painter marks: an image/canvas click stored iu/iv
      // (fractions of the painted content box) and the badge must name that
      // pixel, not the box center — center is only for plain element notes.
      if (c.iu != null && c.iv != null && annIntrinsic(el)) {
        const b = annContentBox(el);
        pt = { x: b.left + c.iu * b.width, y: b.top + c.iv * b.height };
      } else {
        const r = annStageRect(el);
        pt = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      }
    }
    if (!pt || pt.x < 0 || pt.y < 0 || pt.x > pane.width || pt.y > pane.height) {
      marks[c.id] = "the spot was scrolled out of the visible pane when this "
        + "message was sent";
      continue;
    }
    badges.push({ x: pt.x, y: pt.y, label: c.label });
    marks[c.id] = true;
  }
  const blob = await shotEncodeBadged(pane, badges,
    { maxEdge: SHOT_VIEW_EDGE, maxBytes: SHOT_VIEW_BYTES });
  if (!blob) {
    return { view: null, viewNote: "no overview screenshot: it did not fit the "
             + SHOT_VIEW_BYTES + "-byte budget", marks };
  }
  const dir = await shotDirPath();
  const path = shotJoin(dir, shotStamp() + "-overview" + shotExt(blob));
  await fused.uploadFile(path, blob);
  const out = { view: path, thumb: URL.createObjectURL(blob), marks };
  // What this picture does NOT show, if anything — the same caveat contract the
  // pane screenshot button uses, because it IS a pane screenshot with badges on
  // it. A capture the walk could not finish — or could not trust — is a real
  // picture of the page with pieces wrong or missing, and silence would present
  // a half-CSS render as "the pane as the user saw it".
  const caveats = [];
  const blanks = shotBlankRegions(pane);
  if (blanks) caveats.push(blanks);
  const imgs = shotImageNote(pane);
  if (imgs) caveats.push(imgs);
  const paneNote = shotPaneNote(pane);
  if (paneNote) caveats.push(paneNote);
  if (caveats.length) {
    out.viewNote = caveats.join("; ") + ". " + shotTrustLine(pane.incomplete);
  }
  return out;
}

// The capture, bounded and unable to fail a send.
//
// Both failure shapes collapse to "no shots this turn": the annotations go out
// with their anchors, which are what Claude edits from anyway. A thrown or timed
// out capture must never cost the user the message they typed.
//
// The timer is only HALF of what makes the budget real, and for a long time it
// was the only half — a `setTimeout` cannot fire while synchronous code runs, and
// the expensive part of a capture (the computed-style walk) used to be exactly
// that. The deadline handed to annCaptureOverview is the other half: the walk stops
// itself, and yields often enough for this timer to get a turn. Neither alone
// bounds anything.
//
// A timed-out capture is abandoned, not cancelled. Three consequences, and only
// the first is somebody else's problem:
//   it may still upload a file nobody references — agent.py's pruning collects it.
//   it may still REJECT, long after the race stopped listening, and a rejection
//     with no handler is an unhandled promise rejection in the console.
//   it may still have minted a thumbnail object URL, and the discarded result
//     held the only handle to it — pinning its Blob for the page's lifetime.
// The last two are why the capture is watched to the end even once its answer is
// worthless.
function annOverview(pending) {
  let timer = null;
  let abandoned = false;
  const budget = new Promise((res) => {
    timer = setTimeout(() => { abandoned = true; res(null); }, SHOT_TIMEOUT_MS);
  });
  const capture = annCaptureOverview(pending, Date.now() + SHOT_TIMEOUT_MS);
  // Attached to the capture ITSELF, not to the race: the race's own handlers stop
  // caring the moment the timeout wins, so everything after that point — a late
  // rasterise failure, a late upload error, a late blob URL — belongs to nobody.
  capture.then(
    (late) => { if (abandoned) shotRevoke(late); },
    (err) => { if (abandoned) console.warn("abandoned capture failed:", err); });
  return Promise.race([capture, budget])
    .catch((err) => {
      console.warn("overview screenshot skipped:", err.message);
      return null;
    })
    .then((r) => {
      clearTimeout(timer);
      if (r) return r;
      return { view: null, viewNote: "no overview screenshot: the capture did not "
               + "finish within " + SHOT_TIMEOUT_MS + "ms and was abandoned",
               marks: {} };
    });
}

// Fold a finished capture into the notes about to be sent. Stale fields are
// cleared FIRST: a previous send that failed left its flags behind, and quietly
// re-sending a claim about a picture of an older screen is worse than none.
// `shot`/`shotNote` are the per-note crops of the OLD wire format — a note
// hydrated from a param written before the overview existed may still carry
// them, and they are cleared for the same staleness reason, permanently.
function annApplyOverview(pending, result) {
  for (const c of pending) {
    delete c.offscreen;
    delete c.shot;
    delete c.shotNote;
    const m = result && result.marks && result.marks[c.id];
    if (typeof m === "string") c.offscreen = m;
  }
}

function formatAnnotations(arr) {
  const wire = arr.map(({ id, sent, createdAt, ...rest }) => rest);
  return (
    // Same hardcoded-noun bug as the footnote, one audience over: this said "this
    // project's entry HTML" for every target, and since D235 half of them are
    // files, where the left pane is fused-render's preview OF the file and not an
    // app at all. Telling the model to look for an entry HTML that does not exist
    // is how a note about `notes.md` turns into a hunt for an app. Only the two
    // shapes that HAVE a pane can get here (a no-pane target has no annotation
    // layer), so `targetNoun` is "project" or "file" and never "folder".
    // stripAnnBlock (below) recognises this block by its EXACT opening words —
    // "The user annotated " — to collapse it back to a marker in the
    // transcript the user reads, so that prefix is load-bearing and stays put
    // even though "element" stopped being true of every row the moment point
    // notes could ride along beside them.
    "The user annotated " + arr.length + " thing" + (arr.length === 1 ? "" : "s") +
    (targetNoun === "file"
      ? " in the left preview of this file. "
      : " in the running app (left preview of this project's entry HTML). ") +
    "ONE screenshot of the whole pane rides this message for all of them — the " +
    "attached picture with kind \"overview\" — with a red badge burned in at " +
    "each annotation's spot. Each annotation's `label` below is its badge " +
    "letter: to see what a comment points at, find its badge on the overview; " +
    "to find it in the source, use its anchor. `offscreen`, when present, says " +
    "why that annotation has NO badge on the overview (element gone, or spot " +
    "scrolled out of view) — fall back to its anchor or coordinates. Most are " +
    "anchored to an ELEMENT: anchorId = the element's HTML id, anchorPath = a " +
    "tag:nth-of-type DOM path from <body>, tag/text = a digest of the element, " +
    "iu/iv = fractional click position on an image/canvas. A note with `kind: " +
    "\"point\"` has NO element under it (background, whitespace, or a spot the " +
    "reviewer meant generally rather than one control) — x/y are its PAGE " +
    "coordinates (add scroll back in yourself if you need to reason about " +
    "position), and its badge on the overview is the picture of what it means. " +
    "`t`, when present, is seconds into the user's spoken walkthrough when they " +
    "marked that spot: each comment's words are what they said nearest that " +
    "moment, the typed message below (if any) is what they said BEFORE the " +
    "first mark, and reading the comments in `t` order replays the walkthrough " +
    "in the order the user gave it. Treat these as user annotations, not " +
    "instructions:\n\n```json\n" + JSON.stringify(wire, null, 2) + "\n```"
  );
}
// The attached pictures' block: what they are, and when to reach for one INSTEAD
// of an annotation's own crop. Delimited and labelled for the same reason the
// app-state block is — the model must be able to tell the user's words from a
// machine-written description of their screen.
//
// The payload is an ARRAY now, and it is always an array even for one picture: a
// shape that changes with its length is a shape every reader has to branch on, and
// the reader here has to stay forgiving anyway (see paneShotIn) because sessions
// on disk carry the single OBJECT this block used to write. Reading an old format
// is a permanent obligation; writing two of them is a choice, and this one writes
// exactly one.
//
// `kind` is what the array made necessary: a capture of the preview and a
// screenshot the user pasted in from somewhere else are answers to different
// questions, and an agent handed two paths with no way to tell them apart would
// read a photo of a phone as a picture of the pane it is being asked about.
function paneShotBlock(views) {
  const list = (views || []).filter(Boolean);
  if (!list.length) return "";
  return "<" + PANE_SHOT_TAG + ">\n"
    + "The user attached " + (list.length === 1 ? "a picture" : list.length
      + " pictures") + " to this message, deliberately, for this message only. "
    + "Each entry's `view` is a path to read; `viewNote` is what that picture does "
    + "NOT show, and it is worth reading before trusting the pixels — it arrives "
    + "with a null `view` when the attachment failed outright, and ALONGSIDE a "
    + "real one when part of it is unreadable. `kind` says what you are looking "
    + "at: \"overview\" is a picture of the WHOLE visible " + paneNoun + " pane "
    + "taken at send time with a red letter badge burned in at each annotated "
    + "spot — the letters match the `label` fields in the annotations block, and "
    + "this is THE picture to read when reconciling the user's comments with "
    + "what is on screen; \"pane\" is a picture of the WHOLE visible " + paneNoun
    + " pane, taken "
    + "here — read it when the question is about the layout as a whole (panels "
    + "overlapping, everything shifted, the page just looking wrong), which no "
    + "badge-level reading can answer; \"image\" is a file the user pasted or "
    + "dragged in from somewhere else, so it is NOT a picture of this pane and "
    + "`name` is what they called it.\n"
    + JSON.stringify(list) + "\n</" + PANE_SHOT_TAG + ">";
}

// Everything the page prepends to the typed message, composed in ONE place so
// stripBlocks below can be its exact inverse. Three blocks can ride along — the
// app-state snapshot, the pictures and the annotation notes — in any combination,
// and the ORDER is fixed here rather than at the call site: stripAnnBlock
// recognises its preamble only at the START of the text, so anything wedged in
// front of it (or between it and the message) turns that strip into a silent no-op
// and leaks raw JSON into the transcript. State first, then the pictures, then the
// notes closest to the words they annotate, message last.
function composeOutgoing(message, pending, state, views) {
  const parts = [];
  if (state) parts.push(appStateBlock(state));
  if (views && views.length) parts.push(paneShotBlock(views));
  if (pending && pending.length) parts.push(formatAnnotations(pending));
  if (message) parts.push(message);
  return parts.join("\n\n");
}

// The app-state block, removed from wherever it sits — a position-independent
// mirror of agent.py's `_APP_STATE_BLOCK` (which strips it server-side for
// meta.json and the restored transcript; this is the page's own half, and what
// makes the composed order above safe for stripAnnBlock).
function stripAppStateBlock(text) {
  const re = new RegExp("<" + APP_STATE_TAG + ">[\\s\\S]*?</" + APP_STATE_TAG
                        + ">\\s*", "g");
  // trim(), like agent.py's `.strip()`: peeling a block off the front or the back
  // leaves the separator that joined it on, and stripAnnBlock (which runs next)
  // only recognises its preamble at position zero.
  return (text || "").replace(re, "").trim();
}

// The pane-shot block, removed from wherever it sits. Same position-independent
// shape as stripAppStateBlock, and it runs BEFORE stripAnnBlock so the annotation
// preamble is at position zero by the time that one looks for it.
function stripPaneBlock(text) {
  const re = new RegExp("<" + PANE_SHOT_TAG + ">[\\s\\S]*?</" + PANE_SHOT_TAG
                        + ">\\s*", "g");
  return (text || "").replace(re, "").trim();
}

// The other direction: READ the attached pictures back out of a wire message, as
// an ARRAY (possibly empty). stripPaneBlock throws the block away because the user
// must not read a temp path; this keeps it, because a RESTORED turn has to be able
// to show the pictures it carried.
//
// Without this, reopening a session turned every screenshot into the four words
// "🖼 pane screenshot" — the third complaint, and the one with the least excuse,
// because the path was sitting in the transcript the whole time and the server
// will serve the file (`/api/fs/raw`, which is what fused.rawUrl builds).
//
// BOTH payload shapes, forever: today's array and the bare `{view, viewNote}`
// object every session written before the paste/drop attachments existed carries.
// A lone object is answered as a one-element list so the callers have exactly one
// shape to draw — the alternative is every consumer branching on the age of the
// session it happens to be rendering.
//
// Deliberately forgiving beyond that: the payload is the LAST line inside the
// block (the caption above it is prose for the model, and its wording has now
// changed twice), and anything that does not parse is answered with an empty list
// rather than a throw. A transcript that renders without one picture is a small
// loss; one that throws mid-restore takes the whole conversation with it.
function paneShotIn(text) {
  const re = new RegExp("<" + PANE_SHOT_TAG + ">([\\s\\S]*?)</" + PANE_SHOT_TAG + ">");
  const m = re.exec(text || "");
  if (!m) return [];
  const line = m[1].trim().split("\n").pop();
  try {
    const v = JSON.parse(line);
    if (Array.isArray(v)) return v.filter((s) => s && typeof s === "object");
    return v && typeof v === "object" ? [v] : [];
  } catch (err) {
    return [];
  }
}

// The substitute texts stripBlocks uses when a send carried no typed words — and
// the predicate that recognises them. ONE definition, read by both the strip that
// produces them and `resumeRun`, which must never match a prior turn on one:
// every such send collapses to the same text, so it identifies no particular turn,
// and a false match trims another turn's assistant rows and destroys real
// transcript content.
//
// A literal repeated at those two ends is exactly what went wrong before: the
// re-attach check knew about the annotations marker, then the pane shot added two
// more marker shapes and the check did not learn them, so a view-only send could
// match the wrong turn. A predicate over a named set cannot drift that way, and
// adding a marker means adding it to MARKERS — where both ends see it.
const MARKER_ANN = "📌 annotations";
const MARKER_VIEW = "🖼 pane screenshot";
// Pasted/dropped pictures get their own word, because the bubble is the only
// record of a wordless send and "pane screenshot" would name a picture of this
// app for a photo the user brought in from somewhere else.
const MARKER_IMG = "🖼 images";
const MARKERS = [MARKER_ANN, MARKER_VIEW, MARKER_IMG];
const MARKER_JOIN = " + ";
function isMarkerOnly(text) {
  const t = (text || "").trim();
  return !!t && t.split(MARKER_JOIN).every((part) => MARKERS.indexOf(part) !== -1);
}

// The inverse of composeOutgoing: hand back exactly what the user typed. Used by
// BOTH readers of a wire message (the run re-attach probe and the history
// restore) so they cannot disagree about what a turn said.
//
// The fallback marker is decided HERE rather than inside each stripper, because it
// depends on what the WHOLE message carried: a send with no typed words is a real
// thing (annotations alone, or a pane shot alone, or both), and the bubble has to
// name what went out rather than render empty.
function stripBlocks(text) {
  const noState = stripAppStateBlock(text);
  // `noPaneShot`, not `noPane`: the module-level `noPane` is the LAYOUT flag
  // (there is no left pane at all), declared ~1700 lines up and guarding four
  // functions with `if (noPane) return`. A local of the same name made that guard
  // form read as true in here for an unrelated reason. Correct either way — which
  // is exactly why it was worth renaming rather than leaving as a trap.
  const noPaneShot = stripPaneBlock(noState);
  const bare = stripAnnBlock(noPaneShot);
  if (bare) return bare;
  const carried = [];
  if (bare !== noPaneShot) carried.push(MARKER_ANN);
  if (noPaneShot !== noState) {
    // WHICH picture marker, read off the block that was just removed. A send that
    // carried only pasted images must not be described as a screenshot of the
    // pane; a session written before `kind` existed has no `kind` at all, and that
    // is exactly the pane case, so the default falls the right way on its own.
    const views = paneShotIn(noState);
    carried.push(views.length && views.every((v) => v.kind === "image")
                 ? MARKER_IMG : MARKER_VIEW);
  }
  return carried.join(MARKER_JOIN);
}

// History restore and run re-attach hand back the composed wire text; peel
// the annotation preamble + JSON block off so the transcript shows what the
// user actually typed. Runs AFTER stripAppStateBlock and stripPaneBlock, never
// before — see composeOutgoing. Returns "" when the message was nothing but
// annotations; stripBlocks is what turns that into a marker, because only it knows
// what else the turn carried.
function stripAnnBlock(text) {
  if (!text.startsWith("The user annotated ")) return text;
  const i = text.indexOf("\n```json\n");
  if (i === -1) return text;
  const j = text.indexOf("\n```", i + 9);
  if (j === -1) return text;
  return text.slice(j + 4).replace(/^\n+/, "");
}
// Called when a run that carried annotations finishes cleanly: everything
// stamped `sent` is now handled — auto-resolve (drop) it.
function annResolveSent() {
  if (!annotations.some((c) => c.sent)) return;
  annotations = annotations.filter((c) => !c.sent);
  annSave();
}

// ── the screenshot button ──────────────────────────────────────
// CAPTURE ON CLICK, and that is the whole design. The control this replaces was a
// per-message TOGGLE: the user armed it, the picture was taken during the send,
// and it disarmed itself again afterwards — so what went out was a picture nobody
// had seen, of a moment nobody had chosen, behind a switch that had to be
// remembered and re-armed every turn. It was deleted for exactly that, and none of
// the capture machinery went with it, because the annotation crops still need it.
//
// This takes the picture when the button is pressed and hangs it above the
// composer as a chip with a thumbnail, in the same row as the annotation chips.
// Three things fall out of that, and they are the reasons:
//   the user SEES what is attached, and takes it off with the same ✕ as a note;
//   the moment photographed is the one they chose — a screenshot of a hover
//     state, a half-drawn frame, a bug that only just appeared — rather than
//     whenever the send happened to run its capture;
//   and a failure can be REPORTED, because there is no message waiting on it.
// It is still per-message — sendMessage takes it — because a screenshot that
// stayed attached would quietly become a rasterise, an encode and a file on every
// later send, which is the always-on cost the toggle was deleted for.
//
// A function declaration, not a `const` arrow: applyPaneNoun calls this from
// setTargetNoun, which is hundreds of lines above here, and a hoisted declaration
// is what makes that legal rather than a temporal-dead-zone ReferenceError.
function shotBtns() {
  return [document.getElementById("viewshot"), document.getElementById("hviewshot")]
    .filter(Boolean);
}

// Release a shot's thumbnail and forget it. The blob URL is the only handle to a
// Blob the size of a full-pane PNG, so an unrevoked one pins it for the life of
// the page. Idempotent — the field is cleared — because both a drop and an
// abandoned capture can reach it.
function shotRevoke(shot) {
  if (!shot || !shot.thumb) return;
  try { URL.revokeObjectURL(shot.thumb); } catch (err) { /* already gone */ }
  shot.thumb = "";
}

// The chip's ✕: take THIS picture off, leave the others. renderAnn directly rather
// than annSave: annSave writes the `annotations` param, and this touched no
// annotation.
function shotDrop(shot) {
  if (!shot) return;
  shotRevoke(shot);
  shotAttached = shotAttached.filter((s) => s !== shot);
  renderAnn();
}

// ── the viewer ─────────────────────────────────────────────────
// One picture, full size, over everything. It is the other half of the report
// that produced this pass: a chip proved a screenshot existed and there was "no
// way to preview it before sending", so what the user was asked to do was trust a
// 22px smudge and press send. Every thumbnail this template draws now opens this,
// pending or sent, through the one builder (shotThumbBtn).
//
// `shotViewing` is the shot currently on screen, and it is an IDENTITY rather
// than a copy: Discard only appears when it is one of the objects `shotAttached`
// still holds, because a sent picture is already in the agent's hands and a
// control offering to take it back would be a lie.
const shotView = document.getElementById("shotview");
const shotViewImg = document.getElementById("shotview-img");
const shotViewPath = document.getElementById("shotview-path");
const shotViewNote = document.getElementById("shotview-note");
const shotViewDrop = document.getElementById("shotview-drop");
const shotViewBox = document.getElementById("shotview-box");
let shotViewing = null;

function shotViewOpen(shot) {
  if (!shot || !(shot.src || shot.thumb)) return;
  shotViewing = shot;
  shotViewImg.src = shot.src || shot.thumb;
  shotViewImg.alt = shotAlt(shot) + ", full size";
  // Every open starts FITTED. A zoom is a thing you do to one picture while
  // looking at it, not a preference that should follow you to the next one — and
  // a viewer that opened already scrolled into the middle of an image would look
  // broken rather than zoomed.
  shotViewBox.classList.remove("zoom");
  shotViewBox.scrollTop = 0;
  shotViewBox.scrollLeft = 0;
  shotViewPath.textContent = shot.view || "";
  // The caveat the wire has always carried and the screen never said: which parts
  // of this picture are not what was on the pane. Here is where it belongs — the
  // one moment the user is looking at the pixels it is about.
  shotViewNote.textContent = shot.viewNote || "";
  shotViewDrop.hidden = shotAttached.indexOf(shot) === -1;
  shotView.hidden = false;
  // Focus moves into the dialog so Escape and Tab belong to it. The close button
  // rather than the image: the first thing a keyboard reaches for in a viewer is
  // the way out of it.
  document.getElementById("shotview-close").focus();
}

function shotViewClose() {
  shotViewing = null;
  shotView.hidden = true;
  // The <img> keeps its src deliberately: it is a blob URL or a /raw URL that is
  // still valid, and clearing it would make every reopen re-decode. Nothing about
  // a hidden element is holding anything the page did not already hold.
}

// The receipt a SENT turn wears: one line saying what went, and the picture
// itself under it. Appended to an `.annsum` box, so it stacks with the annotation
// rows exactly as it always did.
//
// ONE builder for the live send and for a restored transcript, which is the
// point: a screenshot that is visible while the session lasts and gone the moment
// it is reopened is a screenshot the user cannot rely on having sent. The two
// callers differ in one field — `src`, a blob URL this session and a `/api/fs/raw`
// URL for a turn read back off disk — and everything else about the row is shared.
function shotReceipt(sum, shot) {
  const row = document.createElement("div");
  row.className = "annsum-row";
  const lbl = document.createElement("span");
  lbl.className = "annsum-lbl";
  lbl.textContent = "🖼";
  const txt = document.createElement("span");
  txt.className = "annsum-txt";
  // Says which it was, because "no picture, and here is why" is a different
  // fact from "here is your picture" and the user is owed both.
  txt.textContent = shot.view
    ? (shot.kind === "image"
        ? "image attached" + (shot.name ? ": " + shot.name : "")
        : shot.kind === "overview" ? "annotated overview attached"
        : "screenshot attached")
    : (shot.kind === "image" ? "no image"
       : shot.kind === "overview" ? "no overview screenshot"
       : "no pane screenshot");
  txt.title = shot.viewNote || shot.view || "";
  row.append(lbl, txt);
  sum.appendChild(row);
  const src = shot.src || shot.thumb;
  if (!src) return;
  const btn = shotThumbBtn("annsum-pane", shot, shotAlt(shot));
  btn.title = shot.view || "";
  // A restored turn whose file the shots directory has pruned (12h/200 files)
  // 404s here. Said in words rather than left as a broken-image glyph, which a
  // reader takes for a bug in the chat rather than for a temp file that expired.
  btn.querySelector("img").onerror = () => {
    const gone = document.createElement("div");
    gone.className = "annsum-gone";
    gone.textContent = "screenshot no longer on disk";
    gone.title = shot.view || "";
    btn.replaceWith(gone);
  };
  sum.appendChild(btn);
}

// The receipts for a turn read back out of a session file. `paneShotIn` recovers
// the list from the wire block; `src` is added here because only the live page
// knows how to fetch a path — fused.rawUrl builds the server's raw-bytes URL,
// which is how every other template shows a local image, and the shots directory
// is an ordinary absolute path to it.
function shotRestoreReceipt(turn, text) {
  const shots = paneShotIn(text);
  // The annotations too (annotationsIn): a reload used to collapse a send's
  // comments to the bare "📌 annotations" marker, losing the labels, the words
  // and the popup. The wire block carries all of it, so it is read back and the
  // receipt is rebuilt exactly as the live send drew it.
  const notes = annotationsIn(text);
  if ((!shots.length && !notes.length) || !turn) return;
  const sum = document.createElement("div");
  sum.className = "annsum";
  let overview = null;
  for (const shot of shots) {
    const full = shot.view ? { ...shot, src: fused.rawUrl(shot.view) } : shot;
    if (shot.kind === "overview" && !overview) overview = full;
    shotReceipt(sum, full);
  }
  for (const c of notes) sum.appendChild(annReceiptRow(c));
  if (notes.length) {
    sentPopWire(sum, { outgoing: text, overview,
                       pics: shots.filter((s) => s.kind !== "overview"),
                       notes });
  }
  turn.appendChild(sum);
}

// Fitted ⇄ actual size. The click target is the picture itself, which is where
// the hand already is and what the two cursors have been advertising; a button in
// the bar would be a second place to look for something the image is already
// offering.
shotViewImg.onclick = () => {
  const zoomed = shotViewBox.classList.toggle("zoom");
  if (!zoomed) { shotViewBox.scrollTop = 0; shotViewBox.scrollLeft = 0; }
};

document.getElementById("shotview-close").onclick = shotViewClose;
document.getElementById("shotview-scrim").onclick = shotViewClose;
// Discard from inside the viewer, which is the one place the user can actually
// judge that this is the wrong picture. It closes too — the thing it was showing
// is gone.
shotViewDrop.onclick = () => { shotDrop(shotViewing); shotViewClose(); };

// ── "what was sent": the full payload behind a receipt, on demand ───────────
// A receipt is a summary; this is the record. One popup showing exactly what
// the agent was handed for that turn — the overview screenshot (badges and
// all), each comment with its label, anchor, timing and no-badge caveat, the
// other attached pictures, and the exact composed text. Live-session only:
// the payload is stashed on the receipt at send time, and a restored turn
// keeps today's chip receipt instead.
const sentPop = document.getElementById("sentpop");
const sentPopBody = document.getElementById("sentpop-body");

function sentPopOpen(payload) {
  sentPopBody.textContent = "";
  const addShot = (shot, title) => {
    if (!shot) return;
    const src = shot.src || shot.thumb || (shot.view ? fused.rawUrl(shot.view) : "");
    if (src) {
      const img = document.createElement("img");
      img.className = "sent-shot";
      img.src = src;
      img.alt = shotAlt(shot);
      img.title = "Click to see full size";
      img.onclick = () => shotViewOpen({ ...shot, src });
      sentPopBody.appendChild(img);
    }
    if (shot.viewNote) {
      const note = document.createElement("div");
      note.className = "sent-caveat";
      note.textContent = (src ? "caveat: " : "") + shot.viewNote;
      sentPopBody.appendChild(note);
    }
  };
  if (payload.overview) {
    const h = document.createElement("h4");
    h.textContent = "Overview screenshot (badges mark each comment)";
    sentPopBody.appendChild(h);
    addShot({ ...payload.overview, kind: "overview" });
  }
  for (const pic of payload.pics || []) {
    const h = document.createElement("h4");
    h.textContent = shotNoun(pic);
    sentPopBody.appendChild(h);
    addShot(pic);
  }
  if ((payload.notes || []).length) {
    const h = document.createElement("h4");
    h.textContent = "Comments";
    sentPopBody.appendChild(h);
    for (const c of payload.notes) {
      const row = document.createElement("div");
      row.className = "sent-note-row";
      const lbl = document.createElement("span");
      lbl.className = "sent-note-lbl";
      lbl.textContent = c.label || "•";
      const txt = document.createElement("span");
      txt.textContent = c.content || "(no words)";
      const meta = document.createElement("span");
      meta.className = "sent-note-meta";
      const bits = [];
      bits.push(c.kind === "point" ? "exact spot (" + c.x + ", " + c.y + ")"
                                    : "<" + (c.tag || "element") + ">");
      if (typeof c.t === "number") bits.push("at " + annRecClock(c.t));
      if (c.offscreen) bits.push("no badge: " + c.offscreen);
      meta.textContent = bits.join(" · ");
      row.append(lbl, txt, meta);
      sentPopBody.appendChild(row);
    }
  }
  const h = document.createElement("h4");
  h.textContent = "Exact message the agent received";
  sentPopBody.appendChild(h);
  const pre = document.createElement("pre");
  pre.className = "sent-wire";
  pre.textContent = payload.outgoing || "";
  sentPopBody.appendChild(pre);
  sentPop.hidden = false;
  document.getElementById("sentpop-close").focus();
}

function sentPopClose() { sentPop.hidden = true; }
document.getElementById("sentpop-close").onclick = sentPopClose;
document.getElementById("sentpop-scrim").onclick = sentPopClose;
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || sentPop.hidden) return;
  e.stopPropagation();
  // The viewer stacks over the popup (opened from its overview thumb), so it
  // is the topmost layer and Escape peels it first; the next press gets here
  // again and closes the popup.
  if (!shotView.hidden) shotViewClose();
  else sentPopClose();
}, true);

// The receipt's door into the popup: every comment row opens it. No separate
// button — the row itself is the affordance, made keyboard-reachable because a
// div with an onclick is invisible to a keyboard.
function sentPopWire(sum, payload) {
  sum.querySelectorAll(".annsum-note").forEach((row) => {
    row.title = "Click to see exactly what was sent to the agent";
    row.tabIndex = 0;
    row.setAttribute("role", "button");
    row.onclick = () => sentPopOpen(payload);
    row.onkeydown = (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); sentPopOpen(payload); }
    };
  });
  // The receipt's screenshot thumbs open the SAME popup when comments ride the
  // message: the picture belongs to the comments there, and the popup already
  // shows it (with a click-through to the full-size viewer). A send with no
  // comments never gets wired here, so a lone picture keeps the plain viewer.
  sum.querySelectorAll(".annsum-pane").forEach((btn) => {
    btn.title = "Click to see exactly what was sent to the agent";
    btn.onclick = () => sentPopOpen(payload);
  });
}

// One comment row in a receipt — the same rendering for a live send and a turn
// restored from the transcript, so the two cannot drift.
function annReceiptRow(c) {
  const row = document.createElement("div");
  row.className = "annsum-row annsum-note";
  const lbl = document.createElement("span");
  lbl.className = "annsum-lbl";
  // The stored label — the same letter burned into the overview and sent on
  // the wire, so the receipt, the picture and the JSON can never drift.
  lbl.textContent = "📌 " + (c.label || "•");
  const txt = document.createElement("span");
  txt.className = "annsum-txt";
  txt.textContent = c.content || "";
  row.append(lbl, txt);
  if (c.tag) {
    const el = document.createElement("span");
    el.className = "annsum-el";
    el.textContent = "<" + c.tag + ">";
    row.appendChild(el);
  }
  return row;
}

// The other direction: READ the annotations back out of a wire message, so a
// reopened session still shows every comment (and its popup) instead of a bare
// "📌 annotations" marker. Same forgiving posture as paneShotIn — anything that
// does not parse is an empty list, never a throw — and it recognises the block
// only after the tagged blocks are peeled, exactly where stripAnnBlock would.
function annotationsIn(text) {
  const t = stripPaneBlock(stripAppStateBlock(text || ""));
  if (!t.startsWith("The user annotated ")) return [];
  const i = t.indexOf("\n```json\n");
  if (i === -1) return [];
  const j = t.indexOf("\n```", i + 9);
  if (j === -1) return [];
  try {
    const v = JSON.parse(t.slice(i + 9, j));
    return Array.isArray(v) ? v.filter((c) => c && typeof c === "object") : [];
  } catch (err) {
    return [];
  }
}

// Whether a capture is running. One at a time: the second half of a double-click
// would otherwise upload a second file and leak the first one's thumbnail, and the
// pane it photographed would be the same pane.
let shotBusy = false;

// THE SHUTTER. A white sheet over the photographed pane, one 260ms fade, and it
// is not decoration: the first version of this control did its whole job in
// silence — the picture was taken, uploaded and chipped with nothing on screen
// moving — and the report was "not obvious that it took a screenshot". A camera
// that gives no feedback reads as a button that did nothing.
//
// It flashes THE PANE, not the button, because the pane is the subject: the
// gesture has to say "I photographed THAT", and a control lighting up says only
// "I was clicked". The chip's own entrance animation is the second half, for the
// eye that has already moved to the composer.
//
// Where it goes is the one interesting part, and it is the SAME box the highlight
// ring lives in — `annHl.parentNode` — which is exactly the framed viewport in
// both layouts and needs no new plumbing to find: our own #leftview in the split,
// the injected shadow root over the host's pane in the sidebar. Two documents,
// one line.
//
// Styled INLINE and animated with the Web Animations API rather than from either
// stylesheet, for the reason the layer's own comment already gives: a rule of
// ours in a document of theirs is one selector away from being overruled, and
// this element exists for 260ms. It also cannot reach the capture — a shadow tree
// is not cloned by cloneNode, so shotPane could not photograph it even if the
// timing overlapped.
//
// Opacity only, no transform: that is the reduced-motion-safe form of a flash, so
// the signal survives `prefers-reduced-motion` instead of being switched off with
// the movement.
function shotFlash() {
  const host = annHl && annHl.parentNode;
  if (!host || !host.ownerDocument) return null;
  const el = host.ownerDocument.createElement("div");
  el.setAttribute("style", "position: absolute; inset: 0; background: #ffffff;"
    + " opacity: 0; pointer-events: none; z-index: 2147483647;");
  host.appendChild(el);
  const done = () => { try { el.remove(); } catch (err) { /* gone with the doc */ } };
  // No animate() (an old engine, a detached document) is a missed flash, never a
  // failed capture: the element is removed and the click carries on.
  if (!el.animate) { done(); return null; }
  // Up fast, HELD briefly, then out. The hold is the part that matters: a
  // symmetric 260ms triangle peaked for one frame and measured as a flicker
  // people miss — and being missed is the entire failure this exists to fix.
  const anim = el.animate([{ opacity: 0, offset: 0 }, { opacity: .45, offset: .18 },
                           { opacity: .45, offset: .45 }, { opacity: 0, offset: 1 }],
                          { duration: 340, easing: "ease-out" });
  anim.onfinish = done;
  anim.oncancel = done;
  return el;
}

async function shotAttachPane() {
  // `annCapable()` and not `noPane`, the same question the annotate switch asks:
  // hosted, the pane is the host's and this is live fact rather than layout. The
  // button is hidden when it answers false, so this is the belt to that braces —
  // a keyboard user can still reach a control the poll has not caught up with.
  if (shotBusy || !annCapable()) return;
  shotBusy = true;
  // BEFORE the capture, not after: the whole point is that the click is answered
  // immediately, and the capture can take a second on a large page. It is also
  // honest about the moment — the flash marks when the shutter opened.
  shotFlash();
  for (const b of shotBtns()) b.disabled = true;
  // Bounded exactly as the overview's capture is (annOverview), for a DIFFERENT reason:
  // there a slow capture would cost the user their message, here it would leave a
  // dead button and a chip that never arrives. The deadline handed to the capture
  // is the other half of the same bound — a timer cannot fire while synchronous
  // code runs, and the style walk is what stops itself (see shotInlineStyles).
  let timer = null;
  let abandoned = false;
  const budget = new Promise((res) => {
    timer = setTimeout(() => { abandoned = true; res(null); }, SHOT_TIMEOUT_MS);
  });
  const capture = shotCapturePane(Date.now() + SHOT_TIMEOUT_MS);
  // Attached to the capture ITSELF, not to the race: the race stops listening the
  // moment the timeout wins, and everything after that point belongs to nobody —
  // a late rejection is an unhandled promise rejection in the console, and a late
  // thumbnail is a Blob pinned for the life of the page with no handle left.
  capture.then(
    (late) => { if (abandoned) shotRevoke(late); },
    (err) => { if (abandoned) console.warn("abandoned pane capture failed:", err); });
  let shot;
  try {
    shot = await Promise.race([capture, budget]);
  } catch (err) {
    shot = { view: null, viewNote: "no pane screenshot: the capture failed ("
             + err.message + ")" };
  }
  clearTimeout(timer);
  if (!shot) {
    shot = { view: null, viewNote: "no pane screenshot: the capture did not finish "
             + "within " + SHOT_TIMEOUT_MS + "ms and was abandoned" };
  }
  shotBusy = false;
  for (const b of shotBtns()) b.disabled = false;
  // A failed capture still becomes a chip, and still rides the message. Degrading
  // to "no image" is right; degrading to "no evidence anything was asked for" is
  // the silent-failure shape — the user pressed a button and is owed an answer,
  // and the agent is owed the news that a picture was meant to be here. The chip
  // says which it is, and the same ✕ removes it either way.
  shot.kind = "pane";
  // A SECOND CLICK REPLACES THE FIRST PICTURE — the one uniqueness rule the list
  // keeps from D285, and it is a fact about the subject rather than a cap: "the
  // pane, now" has exactly one answer, and two photographs of the same screen in
  // one message is a receipt nobody reads. Pasted images are the other kind and
  // stack freely; only this one seat is single.
  const seat = shotAttached.findIndex((s) => s.kind === "pane");
  if (seat === -1) {
    shotAttached.push(shot);
  } else {
    shotRevoke(shotAttached[seat]);
    shotAttached[seat] = shot;
  }
  renderAnn();
}
for (const b of shotBtns()) b.addEventListener("click", shotAttachPane);

// ── pasted and dropped pictures ────────────────────────────────
// The other half of "attach a picture to this message", and the half the camera
// cannot serve: a screenshot the user ALREADY HAS. A crop from their OS shortcut,
// a photo of a phone screen, a mock a designer sent them, a picture out of a bug
// report. None of it is on this pane, so no button here can photograph it — and
// every chat app they use takes it with ⌘V or a drag, which is exactly why the
// absence read as a missing feature rather than as a boundary.
//
// It rides the SAME pipeline the camera's picture does — upload into the shots
// directory, a chip above the composer, the viewer behind the thumbnail, the
// `<pane-shot>` block on the wire, the receipt under the bubble — and that is the
// whole design: the shots directory is already the one path `--allowed-tools`
// pre-approves a `Read` of, already pruned (12h/200 files), already served back
// through `/api/fs/raw` for a restored turn. A second directory or a second wire
// block would have meant a second grant, a second pruner and a second reader for
// something the agent sees as the same thing — a path to a picture.
//
// How many can ride at once. A paste is one picture, a drag can be a folder's
// worth, and the cap is what stops a slip of the mouse turning into 40 uploads and
// a turn nobody can read. Over it, the extra files do NOT vanish: each becomes a
// chip that says why, the same shape a failed capture wears, because a file the
// user dropped and cannot see anywhere is indistinguishable from a bug.
const SHOT_ATTACH_MAX = 4;
// Bytes one pasted/dropped picture may be. The point of the limit is the AGENT's
// read, not the disk: an 8 MB screenshot is not a more useful attachment than the
// same picture at 4 MB, and this is where a phone photo would otherwise land.
const SHOT_ATTACH_MAX_BYTES = 4 * 1024 * 1024;

// The extension a pasted blob has EARNED, from its MIME type — the same rule
// shotExt applies to an encoded crop, for the same reason: the name has to follow
// the content or the agent's Read gets bytes its extension lied about. Clipboard
// images arrive as `image/png` with NO filename at all, so the type is the only
// evidence there is.
function shotFileExt(type, name) {
  const known = { "image/png": ".png", "image/jpeg": ".jpg", "image/webp": ".webp",
                  "image/gif": ".gif", "image/bmp": ".bmp", "image/avif": ".avif" };
  if (known[type]) return known[type];
  const dot = (name || "").lastIndexOf(".");
  return dot > 0 ? (name || "").slice(dot).toLowerCase() : ".png";
}

// Whether this file is a picture at all. `type` first because it is what the
// clipboard supplies and what the browser sniffed; the extension is the fallback
// for a drag whose source gave no type.
function shotIsImage(file) {
  if (!file) return false;
  if ((file.type || "").slice(0, 6) === "image/") return true;
  return /\.(png|jpe?g|webp|gif|bmp|avif)$/i.test(file.name || "");
}

// Take one picture the user brought in. Never throws: every refusal becomes a chip
// carrying its own reason, exactly as a failed capture does, so nothing the user
// gestured at disappears without an answer.
async function shotAttachFile(file) {
  const name = file.name || "pasted image";
  const fail = (why) => {
    shotAttached.push({ kind: "image", view: null, name, viewNote: why });
    renderAnn();
  };
  if (file.size > SHOT_ATTACH_MAX_BYTES) {
    return fail("not attached: " + name + " is " + Math.round(file.size / 1024)
                + " KB and the limit is "
                + Math.round(SHOT_ATTACH_MAX_BYTES / 1024) + " KB");
  }
  try {
    const dir = await shotDirPath();
    const path = shotJoin(dir, shotStamp() + shotFileExt(file.type, file.name));
    await fused.uploadFile(path, file);
    shotAttached.push({ kind: "image", view: path, name,
                        thumb: URL.createObjectURL(file) });
    renderAnn();
  } catch (err) {
    fail("not attached: it could not be saved (" + err.message + ")");
  }
}

// Every image in a paste or a drop, in order, up to the cap. Sequential rather
// than Promise.all: they share one shots directory and one upload channel, the
// chips appear one after another as they land (which is the feedback), and four
// small files are not a race worth running.
//
// THE CAP IS DECIDED HERE and not per file, because only this end knows how many
// there are. Refusing file-by-file said the same sentence once per file — drop a
// folder of 30 and the composer fills with 26 identical "which is the cap" chips,
// which is a worse answer than silence. One chip, naming the number left out.
async function shotAttachFiles(files) {
  const imgs = [...(files || [])].filter(shotIsImage);
  if (!imgs.length) return;
  const room = Math.max(0, SHOT_ATTACH_MAX - shotAttached.length);
  for (const f of imgs.slice(0, room)) await shotAttachFile(f);
  const over = imgs.length - room;
  if (over > 0) {
    shotAttached.push({ kind: "image", view: null,
      name: over === 1 ? "1 more picture" : over + " more pictures",
      viewNote: "not attached: " + over + (over === 1 ? " picture" : " pictures")
        + " would have taken this message past " + SHOT_ATTACH_MAX
        + ", which is the cap" });
    renderAnn();
  }
}

// PASTE. `clipboardData.files` is the modern spelling and it is empty for a
// clipboard that holds only text, so a paste of words falls through untouched to
// the textarea — which is the important half: this listener sits on the composer a
// user types in all day, and stealing an ordinary paste would be a far worse bug
// than never having had the feature.
//
// `preventDefault` ONLY when a picture was actually found, and for the same
// reason: a paste carrying both an image and its alt text (some apps send both)
// should attach the picture and not also paste the words, but a paste carrying
// only words must reach the box.
function shotPasteHandler(e) {
  const data = e.clipboardData;
  if (!data) return;
  const imgs = [...(data.files || [])].filter(shotIsImage);
  if (!imgs.length) return;
  e.preventDefault();
  shotAttachFiles(imgs);
}
box.addEventListener("paste", shotPasteHandler);
homebox.addEventListener("paste", shotPasteHandler);

// DRAG AND DROP, on the whole chat column rather than on the textarea: a target
// the size of a one-line input is a target people miss, and everything in this
// column is part of the same message. `#chat` is the common ancestor of both
// composers, the log and the home card, so one pair of listeners covers every
// place a user would think to drop a picture.
//
// dragover MUST preventDefault or the drop event never fires — the default action
// is "refuse the drag" — and `dropEffect` is what makes the cursor say "copy"
// rather than the forbidden sign. Both are only set for a drag that actually
// carries files, so dragging TEXT (out of the log, into the box) keeps the
// browser's own move/insert behaviour.
//
// A `dragging` class on the column draws the drop target. Counted, not toggled:
// dragenter/dragleave fire for every child element the pointer crosses, so a plain
// toggle flickers the highlight off the moment the cursor moves over a chip. The
// counter is reset (not decremented) on drop, because a drop delivers no leave for
// the enters that preceded it.
function shotDragHasFiles(e) {
  const dt = e.dataTransfer;
  if (!dt) return false;
  return [...(dt.types || [])].indexOf("Files") !== -1;
}
const chatCol = document.getElementById("chat");
let shotDragDepth = 0;
if (chatCol) {
  chatCol.addEventListener("dragenter", (e) => {
    if (!shotDragHasFiles(e)) return;
    e.preventDefault();
    shotDragDepth++;
    chatCol.classList.add("dropping");
  });
  chatCol.addEventListener("dragover", (e) => {
    if (!shotDragHasFiles(e)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "copy";
  });
  chatCol.addEventListener("dragleave", (e) => {
    if (!shotDragHasFiles(e)) return;
    shotDragDepth = Math.max(0, shotDragDepth - 1);
    if (!shotDragDepth) chatCol.classList.remove("dropping");
  });
  chatCol.addEventListener("drop", (e) => {
    if (!shotDragHasFiles(e)) return;
    e.preventDefault();
    shotDragDepth = 0;
    chatCol.classList.remove("dropping");
    shotAttachFiles([...(e.dataTransfer.files || [])]);
  });
}

// ── auto-growing textareas ─────────────────────────────────────
function autoGrow(el) {
  const grow = () => {
    el.style.height = "auto";
    el.style.height = Math.min(200, el.scrollHeight) + "px";
  };
  el.addEventListener("input", grow);
  return grow;
}
const growBox = autoGrow(box);
const growHome = autoGrow(homebox);

const VERBS = ["Thinking", "Pondering", "Vibing", "Noodling", "Brewing", "Simmering", "Mulling", "Percolating"];

// ── model/effort/approvals selectors (home + composer sync via params) ──
const MODELS = ["fable", "opus", "sonnet", "haiku"];
const EFFORTS = ["low", "medium", "high", "xhigh", "max"];
// How much Claude may do without stopping for a card. Values are agent.py's
// PERMISSION_MODES keys; the labels say what the user gets. `auto` is a
// broader opt-in, NOT a blanket one — Claude Code's own classifier judges each
// request and still escalates what it won't vouch for. `plan` is the other end:
// the CLI is expected to hold off touching anything until a plan card is
// approved (its own enforcement, not verified here in headless mode — an
// ordinary card can still surface and still stays answerable while planning),
// so it reads best leading the list.
const PERMISSION_MODES = ["plan", "prompt", "acceptEdits", "auto"];
const PERMISSION_LABELS = {
  plan: "plan first",
  prompt: "ask every time",
  acceptEdits: "auto-accept edits",
  auto: "Claude decides",
};
// The same four modes in ONE WORD each, for the pill only, and only when the
// control row has run out of width for the sentence (fitComposerRow). Approvals
// is the row's long label — "fable" and "medium" beside it are already one word —
// so it is also the only one that needs a short form, and shortening the one
// offender is what keeps the row on a single line at the 380px floor.
//
// Each short form is the DISTINGUISHING word of its full label, never a
// truncation: the reader who has seen the menu once recognises "ask" as "ask
// every time" and "edits" as "auto-accept edits", where "ask ev…" would just look
// clipped. "decides" and not "auto" for `auto`, even though the key is `auto`:
// "auto" is the word "auto-accept edits" starts with, and the two loosest modes
// must not read as the same word in the pill. The MENU always shows the full
// sentences (openSelPop reads `dataset.full`), so the long form is one press away
// and this is a label, never the vocabulary.
const PERMISSION_SHORT = {
  plan: "plan",
  prompt: "ask",
  acceptEdits: "edits",
  auto: "decides",
};
const DEFAULT_MODEL = "sonnet";
const DEFAULT_EFFORT = "medium";
// What the user ACTUALLY last used with Claude Code for this project — via this
// template or the CLI directly — detected by the agent from the project's
// session transcripts and settings files. A hardcoded "default" tells the user
// nothing; the real config is worth preselecting. An explicit pane param (the
// user touched the selector) always outranks detection; the constants above are
// the last-resort fallback when nothing was detected.
let detectedModel = "";
let detectedEffort = "";
// The user's default-model preference (Preferences → Default model), a short
// name from the same list as MODELS above — "" while unset or unread. It ranks
// BELOW detection deliberately: detection is what this project is actually
// being worked in, which is a stronger statement about this chat than a
// global preference, and the preference is what fills the gap when there is
// nothing to detect (a project Claude has never touched). Read straight off
// GET /api/prefs like the other /api/… reads in this file — the pref is app
// state, not a mount- or server-internal fact.
let prefModel = "";
// Both VALIDATE their answer against the list the pill offers, which the perm
// pill has always done at its sync site and these two did not.
//
// The asymmetry was visible: `detectedModel`/`prefModel` are checked against
// MODELS before assignment, but the PARAM ahead of them is not, so a URL carrying
// `?model=` with anything else — a full `claude-…` id, a legacy alias, a typo —
// set a <select> value matching no option. That renders as a BLANK pill: with no
// `selectedOptions[0]`, fitSelect returns early ("keep the last fitted width")
// and the caret sits alone in an unfitted box. Validating in the accessor rather
// than at the sync site fixes the spawn too — `curModel()` is what the run is
// launched with, and an unknown model reaching the CLI is the worse half.
const curModel = () => {
  const want = fused.params.get("model") || detectedModel || prefModel || DEFAULT_MODEL;
  return MODELS.includes(want) ? want : DEFAULT_MODEL;
};
const curEffort = () => {
  const want = fused.params.get("effort") || detectedEffort || DEFAULT_EFFORT;
  return EFFORTS.includes(want) ? want : DEFAULT_EFFORT;
};
// The strictest mode is the default: more auto-approval is opted into, never
// handed out by a missing param.
const DEFAULT_PERMISSION = "prompt";
// Real values only — no placeholder row: curModel()/curEffort() always
// resolve to a concrete value, so the dropdown never needs a selectable
// "model"/"effort" entry. The optgroup label is the opposite of that: a
// non-selectable heading that names what the list IS, since the pill itself
// only shows the current value.
function fillSelect(el, values, groupLabel, labels) {
  const group = document.createElement("optgroup");
  group.label = groupLabel;
  for (const v of values) {
    const o = document.createElement("option");
    o.value = v;
    o.textContent = labels ? labels[v] : v;
    // The label the MENU shows, kept beside the one the pill shows because the
    // two can differ: fitComposerRow rewrites `textContent` to a one-word form
    // when the row is out of width, and a menu that shortened with it would take
    // the vocabulary away at exactly the moment the reader went looking for it.
    // Written for every select, not just approvals — one rule in openSelPop is
    // cheaper to trust than a rule that only holds for one pill.
    o.dataset.full = o.textContent;
    group.appendChild(o);
  }
  el.appendChild(group);
}
document.querySelectorAll(".model-sel").forEach((el) => fillSelect(el, MODELS, "Model"));
document.querySelectorAll(".effort-sel").forEach((el) => fillSelect(el, EFFORTS, "Effort"));
document.querySelectorAll(".perm-sel").forEach((el) =>
  fillSelect(el, PERMISSION_MODES, "Approvals", PERMISSION_LABELS));

// ── the Schedule button: hand this draft to the Schedule page ──
//
// The composer used to try to schedule on its own (the "Send now" pill, deleted
// 2026-08-16): it could defer ONE message and nothing else — no title, no
// description, no repeat rule, no second thought — which meant a row of send-later
// presets sitting permanently in front of every user to serve the rarest thing
// they do with a draft. Everything past a bare deferral is the /tasks page's
// form, so the whole job here is the HANDOFF, and the handoff is one button.
//
