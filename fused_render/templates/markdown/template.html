<!DOCTYPE html>
<html data-fused-theme="shell">
<head>
<meta charset="utf-8" />
<title>Markdown</title>
<script src="/template-assets/codemirror.bundle.js"></script>
<script src="/template-shared/ro-badge.js"></script>
<script src="/template-shared/graph-canvas.js"></script>
<style>
  /* Appearance (SPEC §30, D134). The NEUTRALS come from the app shell itself
     (`frontend/src/styles/tokens.css`), so the note surface is literally the
     same colour as the app around it — Obsidian's own editor is the same
     colour as the app around IT, which is the argument D159 already used to
     strip oneDark's surface, and this palette carries it one step further:
     the shell's cool blue-tinted neutrals, not a dead-neutral grey approximated
     from Obsidian's published theme. A dead grey next to the shell's blue-
     tinted one reads as a warm brown slab on a cool page (found by looking at
     it, 2026-08-28) — which is what an Obsidian-sourced scale was doing here.
     Obsidian stays the reference for this template's BEHAVIOUR (SPEC §32);
     it is no longer the reference for its colour.

     `--accent` is unchanged and is not from either source: fused-render's own
     yellow, used sparingly and mostly on links. `--on-accent` is dark, because
     the accent is light.

     One other deviation: light `--warn` is darkened from Obsidian's l=46% to
     36% (same hue and saturation, kept from the original palette pass). Its
     light orange is 2.8:1 on white and it carries the conflict banner, the one
     message in this view that must be read (4.3:1 after, on `--bg-alt`).

     `data-theme` is written onto <html> by the injected runtime, which acts only
     because this document opted in via `data-fused-theme` on <html> (see
     fused_render/static/runtime.js) — dark stays the default for any document
     that never gets the attribute. */
  :root {
    color-scheme: dark;
    --fg: #e8eaed;
    --fg-muted: #9aa0a6;
    --border: #2a2d33;
    --bg: #131417;
    --bg-alt: #1b1d21;
    --accent: #E5FF44;
    --error: #fb464c;
    --warn: #e9973f;
    --skel-shine: #2a2d33;
    --ghost: #666666;
    --on-accent: #1e1e1e;
    /* The shell's own `--sel`, not a re-derived alpha wash: a wash tuned
       against the old grey read too warm on the shell's cooler ground. */
    --selection: #2b3a52;
    /* Elevation for a floating surface (the format bubble, its "Turn into"
       menu) — the shell's own `--shadow-ink`, not an invented alpha. */
    --shadow-ink: rgba(0, 0, 0, 0.4);
    /* THE SCRIM SET (frontend/src/styles/tokens.css) — deliberately IDENTICAL
       in both palette blocks below. These are for controls that sit on
       ARBITRARY PIXELS (the lightbox's image), where the surface underneath
       is not this view's own and the theme says nothing about it:
       white-on-dark-wash reads over anything, and a token that flipped with
       the theme would put light ink on a light photo half the time. */
    --scrim-veil: rgba(0, 0, 0, 0.72);
    --scrim-bg: rgba(0, 0, 0, 0.55);
    --scrim-bg-hover: rgba(0, 0, 0, 0.75);
    --scrim-border: rgba(255, 255, 255, 0.25);
    --scrim-fg: #ffffff;
    /* Code's OWN palette (6b.2, D620 follow-up) — distinct from the four UI
       tokens above on purpose: a syntax palette needs several MUTUALLY
       DISTINGUISHABLE hues, which "reuse the app's one accent" cannot give
       it. Unused here — dark mode still renders through oneDark's own
       HighlightStyle — but declared to oneDark's OWN produced colours, so a
       future unification starts from values that already agree, and so this
       block and the light one below name the same token for the same
       family. */
    --code-keyword: #c678dd;
    --code-string: #98c379;
    --code-number: #d19a66;
    --code-function: #61afef;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --fg: #1f2023;
    --fg-muted: #61656c;
    --border: #d8dade;
    --bg: #ffffff;
    --bg-alt: #f4f5f7;
    --accent: #5f7300;
    --error: #e93147;
    --warn: #b85b00;
    --skel-shine: #d8dade;
    --ghost: #ababab;
    --on-accent: #ffffff;
    --selection: #cfe0f7;
    /* Lighter than dark's, same reason `--shadow-md` is lighter in light mode
       shell-wide: a near-opaque shadow reads as dirt on a light page. */
    --shadow-ink: rgba(0, 0, 0, 0.1);
    /* Identical to dark's — see the dark block's comment: these sit on a
       photo, not on this view's own surface, so they do not follow the theme. */
    --scrim-veil: rgba(0, 0, 0, 0.72);
    --scrim-bg: rgba(0, 0, 0, 0.55);
    --scrim-bg-hover: rgba(0, 0, 0, 0.75);
    --scrim-border: rgba(255, 255, 255, 0.25);
    --scrim-fg: #ffffff;
    /* Code's own palette, ACTUALLY USED here (lightCodeHighlight, below in
       the script) — chosen for two things at once: recognisably the same hue
       family as oneDark's dark-mode colours (purple/green/orange/blue), and
       readable on `--bg-alt` the way `--accent` itself had to be redarkened
       for (this view's light `--accent` is already a deep olive rather than
       the brand lime, for the identical reason). Checked against WCAG
       contrast on both `--bg` (#fff) and `--bg-alt` (#f4f5f7): keyword
       7.34:1 / 6.73:1, string 7.39:1 / 6.78:1, number 7.39:1 / 6.77:1,
       function 7.59:1 / 6.96:1 — all comfortably past the 4.5:1 body-text
       floor, most past the 7:1 AAA one. */
    --code-keyword: #6639ba;
    --code-string: #116329;
    --code-number: #953800;
    --code-function: #0550ae;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    color: var(--fg);
    background: var(--bg);
  }

  /* ---- the reload-or-keep banner (MD-17) --------------------------------
     The only chrome that ever occupies a row of its own, and only while a
     conflict is unresolved: there is no persistent toolbar in this view
     (MD-2a) — the shell's own breadcrumb already names the file, and
     Obsidian shows no save state at all. */
  #conflict {
    display: none;
    align-items: center;
    gap: 10px;
    flex: none;
    padding: 7px 12px;
    border-bottom: 1px solid var(--warn);
    background: var(--bg-alt);
    color: var(--warn);
    font-size: 12px;
  }
  #conflict button {
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--bg);
    color: var(--fg);
    font: inherit;
    padding: 3px 9px;
    cursor: pointer;
  }
  #conflict button:hover { border-color: var(--accent); }

  /* A failure needs to be seen; a successful save does not (MD-16). This slot
     is empty — and therefore invisible — in the ordinary case. */
  #save-state {
    position: fixed;
    right: 12px;
    bottom: 10px;
    z-index: 6;
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--bg-alt);
    color: var(--fg-muted);
    font-size: 12px;
  }
  #save-state:empty { display: none; }
  #save-state.error { color: var(--error); border-color: var(--error); }
  #ro-wrap { position: fixed; left: 12px; bottom: 10px; z-index: 6; }

  /* ---- surface ----------------------------------------------------------- */
  #split { flex: 1; display: flex; min-height: 0; position: relative; }
  #surfaces { flex: 1; min-width: 0; min-height: 0; display: flex; }
  #editor-wrap { flex: 1; min-width: 0; }
  #status { flex: 1; padding: 24px; color: var(--fg-muted); }
  #status[hidden] { display: none; }
  #status.error { color: var(--error); }
  #status a { color: var(--accent); }

  /* ---- the editor IS the document (MD-18a) ------------------------------
     One surface, editable or not (MD-1a). No line numbers, no fold gutter and no
     active-line stripe: this is prose, and the chrome a code editor wants is
     exactly what a Live Preview must not show. */
  .cm-editor { height: 100%; font-size: 16px; }
  .cm-editor.cm-focused { outline: none; }

  /* ---- the editing surface belongs to the page --------------------------
     CM's `oneDark` ships its own surface — background #282c34, a blue cursor,
     a blue-grey selection — which rendered the editor as a second, lighter,
     bluer dark slab sitting inside this one, with the accent clashing against
     it. Obsidian's editor is the SAME colour as the app around it, and that
     unified surface is much of why it reads as calm. So oneDark is kept only
     for what it is good at (colouring fenced code in the dark), and every
     surface colour is taken back to this view's tokens.
     CM inserts its stylesheet as the FIRST child of <head> (StyleModule), so
     these rules win at equal specificity purely by source order. */
  .cm-editor { background: var(--bg); color: var(--fg); }
  .cm-editor .cm-cursor, .cm-editor .cm-dropCursor { border-left-color: var(--accent); }
  .cm-editor.cm-focused > .cm-scroller > .cm-selectionLayer .cm-selectionBackground,
  .cm-editor .cm-selectionBackground,
  .cm-editor .cm-content ::selection { background: var(--selection); }
  .cm-editor .cm-panels {
    background: var(--bg-alt);
    color: var(--fg);
    border-color: var(--border);
  }
  .cm-editor .cm-tooltip {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-alt);
    color: var(--fg);
  }
  /* The completion popup's own presentation is NOT here — it is a CM theme
     extension (`completionTheme`, MD-14), so it rides through the
     `StateEffect.reconfigure` theme swap with the rest of the extension array
     instead of racing oneDark's rules from the page. This slot used to hold a
     full-bleed `background: var(--accent)` selected row, which was the loudest
     thing on screen; see D192. */

  /* oneDark also colours markdown SYNTAX like source code: headings red, every
     `#`/`*`/`>` marker green, URLs cyan. Obsidian does none of that — a heading
     is body-coloured and a marker is faint — and the Live Preview already knows
     what each range MEANS, so `inherit` hands the colour back to the decoration
     that does. Fenced code is excluded, because there the syntax colouring is
     exactly the point; so are our own widgets and marks, which carry `lp-`,
     or `wl-` classes (a highlight span's class is generated, e.g. `ͼ4`). */
  .cm-content .cm-line:not(.lp-fence-line)
      span:not([class*="lp-"]):not([class*="wl"]) {
    color: inherit;
    text-decoration: inherit;
  }
  .cm-editor .cm-scroller {
    overflow: auto;
    font-family: inherit;
    line-height: 1.65;
  }
  .cm-editor .cm-content {
    max-width: 46rem;
    margin: 0 auto;
    padding: 40px 24px 40vh;
    caret-color: var(--accent);
  }
  .cm-editor .cm-gutters { display: none; }
  .cm-editor .cm-activeLine { background: transparent; }
  .cm-editor .cm-activeLineGutter { background: transparent; }
  .cm-editor .cm-line { padding: 0 2px; }

  /* Live Preview marks. Every rule here styles a range of the SOURCE — there
     is no second rendered copy of the document to style. */
  /* Heading scale and weights are Obsidian's defaults (--h1-size … --h6-size,
     --h1-weight 700 and 600 below it). Colour is deliberately absent: a heading
     is body-coloured there, which is also why oneDark's red had to go. */
  .lp-h1, .lp-h2, .lp-h3, .lp-h4, .lp-h5, .lp-h6 {
    font-weight: 600;
    line-height: 1.3;
  }
  .lp-h1 { font-size: 1.802em; font-weight: 700; }
  .lp-h2 { font-size: 1.602em; }
  .lp-h3 { font-size: 1.424em; }
  .lp-h4 { font-size: 1.266em; }
  .lp-h5 { font-size: 1.125em; }
  .lp-h6 { font-size: 1em; }
  .lp-bold { font-weight: 700; }
  .lp-italic { font-style: italic; }
  .lp-strike { text-decoration: line-through; color: var(--fg-muted); }
  /* Tinted, not boxed: Obsidian gives code a background and no border, and a
     border around every inline span is noise at prose density. */
  .lp-code {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.86em;
    background: var(--bg-alt);
    border-radius: 4px;
    padding: 0.1em 0.32em;
  }
  /* A block, not striped lines (6b.3): a left/right border on every line of
     the fence plus a top/bottom border only on its edges reads as one panel,
     because the lines sit flush against each other with no gap. */
  .lp-fence-line {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.86em;
    background: var(--bg-alt);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  .lp-quote-line {
    border-left: 3px solid var(--border);
    padding-left: 12px;
    color: var(--fg-muted);
  }

  /* ---- vertical rhythm (MD-26) ------------------------------------------
     Spacing lives on LINE decorations, and every one of them is applied whether
     or not the caret is on the line. That is the whole rule here: this editor
     un-renders the line the caret is on, so any spacing that differed between
     the rendered and the revealed state would make the document jump under the
     cursor on every arrow-down.

     The other constraint is that markdown's own blank separator line is already
     a full line-height of space. So the bottom side is small or absent — the
     blank line after a heading does that job — and these rules mostly add the
     space markdown has no way to express: above a heading, and around a block.

     PADDING, NEVER MARGIN. This is not a style preference, it is the one way
     these rules can be written at all. CodeMirror keeps its own height map and
     measures each line from the element's bounding rect, which padding is
     inside of and margin is outside of — and adjacent margins additionally
     collapse into each other. A margin therefore makes CM believe a line is
     shorter than the space it occupies, and every coordinate-based operation
     built on that map (`posAtCoords`, so mouse clicks AND arrow up/down) lands
     on the wrong line, further off with each heading further down the note.
     That is exactly what shipped in the first draft of MD-26 and had to be
     reverted to padding.

     Specificity is deliberate: `.cm-editor .cm-line` sets `padding: 0 2px`, and
     a bare `.lp-*` class would lose to it. The longhands used here leave that
     horizontal padding alone. */
  /* On the block's EDGES, not on every line of it: a Setext heading is two
     lines (its text and its `===` underline), and top space on the second
     would split the underline away from what it underlines. */
  .cm-editor .lp-h1-line-top, .cm-editor .lp-h2-line-top { padding-top: 1.6em; }
  .cm-editor .lp-h3-line-top, .cm-editor .lp-h4-line-top { padding-top: 1.3em; }
  .cm-editor .lp-h5-line-top, .cm-editor .lp-h6-line-top { padding-top: 1.1em; }
  .cm-editor .lp-h1-line-bot, .cm-editor .lp-h2-line-bot,
  .cm-editor .lp-h3-line-bot, .cm-editor .lp-h4-line-bot,
  .cm-editor .lp-h5-line-bot, .cm-editor .lp-h6-line-bot {
    padding-bottom: 0.15em;
  }
  /* A note that opens on a heading should not open with a gap above it. */
  .cm-editor .cm-content > .cm-line:first-child { padding-top: 0; }

  /* Padding only where the block starts and ends, so the tint is one panel
     rather than a stack of tinted rows with gaps. Note that for the fence this
     also means the space is INSIDE the tint — which is the panel look wanted
     here, and the separation from the prose above comes from the blank line
     markdown already requires before a fence. */
  .cm-editor .lp-fence-line-top {
    padding-top: 0.5em; border-radius: 6px 6px 0 0;
    border-top: 1px solid var(--border);
    position: relative; /* anchors the language chip (6b) */
  }
  .cm-editor .lp-fence-line-bot {
    padding-bottom: 0.5em; border-radius: 0 0 6px 6px;
    border-bottom: 1px solid var(--border);
  }
  .cm-editor .lp-quote-line-top { padding-top: 0.35em; }
  .cm-editor .lp-quote-line-bot { padding-bottom: 0.35em; }
  /* The list is spaced as a block; the rows stay tight against each other. */
  .cm-editor .lp-list-line-top { padding-top: 0.6em; }
  .cm-editor .lp-list-line-bot { padding-bottom: 0.6em; }
  /* Faint (--text-faint), not a dimmed muted grey: at 0.6 opacity on top of a
     muted grey these were all but invisible in the dark, and a marker you cannot
     see is a marker you cannot tell you are about to edit. */
  .lp-mark { color: var(--ghost); }
  .lp-fm-line { color: var(--fg-muted); font-size: 0.86em; }
  /* Faint, not accent: a page of yellow bullets is not what sparing means. */
  .lp-bullet { color: var(--ghost); }
  .lp-hr {
    display: inline-block;
    width: 100%;
    border: none;
    border-top: 1px solid var(--border);
    vertical-align: middle;
  }
  .lp-img { max-width: 100%; border-radius: 4px; vertical-align: middle; }
  /* A player, not a poster: it needs a floor height or an unloaded clip
     collapses to nothing, and a ceiling so it cannot fill the note. */
  .lp-video { max-width: 100%; max-height: 60vh; min-height: 3rem;
    border-radius: 4px; vertical-align: middle; }
  .lp-task { vertical-align: middle; margin: 0 6px 0 0; accent-color: var(--accent); }
  .lp-table {
    border-collapse: collapse;
    font-size: 0.92em;
    margin: 2px 0;
  }
  .lp-table th, .lp-table td { border: 1px solid var(--border); padding: 5px 11px; }
  .lp-table th { background: var(--bg-alt); text-align: left; }
  /* A text cursor only on a writable table — a read-only note's table is as
     inert as everything else in it, so no cell invites a click. */
  .lp-table-live th, .lp-table-live td { cursor: text; }
  /* One cell open as raw source in a focus ring while every other cell in
     the table stays rendered. */
  .lp-cell-edit { outline: 1px solid var(--accent); outline-offset: -1px; white-space: pre-wrap; }
  .lp-link { color: var(--accent); text-decoration: none; }
  .lp-link:hover { text-decoration: underline; }

  /* Wikilinks and ghosts — the link layer (SPEC §32, MD-3/MD-4). */
  .wl {
    color: var(--accent);
    cursor: pointer;
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  .wl:hover { border-bottom-color: var(--accent); }
  /* Dashed and faint: "scanned, and this target is not there". Kept visibly
     distinct from the solid-underlined grey of "not scanned, unknown" below. */
  .wl-ghost { color: var(--ghost); border-bottom: 1px dashed var(--ghost); }
  /* Unknown, not missing (MD-11): no scan ran, so this link is inert. Muted and
     underlined like a link that is simply not clickable — deliberately NOT the
     dashed ghost, which means "scanned, and this target is not there". */
  .wl-unknown {
    color: var(--fg-muted);
    cursor: default;
    border-bottom: 1px solid var(--border);
  }
  .wl-unknown:hover { border-bottom-color: var(--border); }
  .wl-embed-missing, .wl-embed-unknown {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 13px;
  }
  .wl-embed-missing { border: 1px dashed var(--ghost); color: var(--ghost); }
  .wl-embed-unknown { border: 1px solid var(--border); color: var(--fg-muted); }

  /* ---- panel chrome, shared by the left rail and the right panel ---------
     ONE set of classes for both panels' head row, collapse chevron and
     collapsed edge button (owner: "follow a structure similar to the left
     one"; D620 follow-up). There is no floating corner cluster any more —
     each panel's own toggle lives IN that panel, at its INNER edge (the edge
     nearest the document), which is also what removes the two bugs a
     floating button had: it sat on top of the panel's own head when open,
     and on top of the document when closed.
     `.panel-head` carries the type register (11px uppercase, 0.08em
     tracking, `--ghost`) both panels' heads use — including the GRAPH
     sub-head inside the right panel, which shares the register but has no
     button of its own. `.mirror` is the one modifier, and it moves ONLY the
     button, not the whole row: `flex-direction: row-reverse` was tried first
     and reversed the LABEL too, pushing "BACKLINKS" to the panel's outer
     edge — wrong on two counts, both panels read left-to-right so the label
     belongs at the reading (left) edge in either one, and it disagreed with
     every other left-aligned line in the panel below it. `order: -1` on just
     the button is the fix: the button jumps to the front of the row (the
     panel's inner edge) while the label, count and spacer stay in their
     normal left-to-right order right behind it — chevron nearest the
     document in both panels, label always reading from the left, same
     `padding-left` in both. */
  .panel-head {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: none;
    padding: 7px 8px 7px 10px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
    color: var(--ghost);
  }
  .panel-head.mirror .panel-collapse-btn { order: -1; }
  .panel-head .spacer { flex: 1; }
  /* A count that could be misread as an ORDINAL right after a label ("outline
     1", "backlinks 3" reading as "#1"/"#3") is not allowed to be a bare
     numeral beside the text — it is set apart as its own pill: a different
     background, rounded, smaller, no tracking. Empty and collapses to
     nothing rather than an empty pill when there is nothing to count. */
  .panel-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 1.2em;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--bg);
    color: var(--fg-muted);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0;
    text-transform: none;
  }
  .panel-count:empty { display: none; }
  .panel-collapse-btn {
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: none;
    border-radius: 4px;
    background: transparent;
    color: var(--ghost);
    cursor: pointer;
  }
  .panel-collapse-btn:hover { color: var(--fg); background: var(--bg-alt); }
  .panel-collapse-btn svg { width: 12px; height: 12px; display: block; }
  /* The collapsed edge button: a 26px chip at the page edge, identical for
     both panels — only which edge (`left`/`right`) differs, via the
     `.right` modifier. */
  .panel-reopen-btn {
    position: absolute;
    top: 8px;
    z-index: 5;
    width: 26px;
    height: 26px;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-alt);
    color: var(--fg-muted);
    cursor: pointer;
  }
  .panel-reopen-btn[hidden] { display: none; }
  .panel-reopen-btn:not([hidden]) { display: flex; }
  .panel-reopen-btn:hover { color: var(--fg); border-color: var(--accent); }
  .panel-reopen-btn svg { width: 13px; height: 13px; display: block; }
  .panel-reopen-btn.left { left: 8px; }
  .panel-reopen-btn.right { right: 8px; }
  #side {
    position: relative;
    width: 18rem;
    flex: none;
    display: none;
    flex-direction: column;
    min-height: 0;
    border-left: 1px solid var(--border);
    background: var(--bg-alt);
  }
  #side.on { display: flex; }
  /* The drag handle. Sits ON the border rather than taking a column of its own,
     so the panel's usable width is what the user set. */
  #side-grip {
    position: absolute;
    left: -3px;
    top: 0;
    bottom: 0;
    width: 7px;
    z-index: 6;
    padding: 0;
    border: none;
    background: transparent;
    cursor: col-resize;
    touch-action: none;
  }
  #side-grip:hover, #side-grip:focus-visible {
    background: var(--accent);
    opacity: 0.4;
    outline: none;
  }
  /* `.panel-head` carries the type register (declared above, shared with
     the rail) — the bottom hairline here is scoped to this panel with its
     own id rule, since it stacks several sections and needs the separator a
     single-section panel (the rail) does not. */
  #links-head { border-bottom: 1px solid var(--border); }
  /* Sized by its content, not by the leftover space: a handful of backlinks
     should not reserve half the panel while the graph's labels collide. The
     cap keeps a long list scrolling here instead of starving #graph-sec, so
     flex: none is load-bearing — flex: 1 is what made the list mostly empty. */
  #links { flex: none; max-height: 42%; min-height: 0; overflow: auto; padding: 8px; }
  #links[hidden] { display: none; }

  /* ---- the outline rail (MD-19a/MD-19b) ----------------------------------
     A left margin, not a second panel: `--bg`, same as the document, with one
     hairline border. Open by default (the `outline` param defaults open,
     MD-20) — a note always has structure, so this is permanent chrome rather
     than something whose subject might not exist. */
  #outline-rail {
    position: relative;
    width: 12rem;
    flex: none;
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-right: 1px solid var(--border);
    background: var(--bg);
  }
  #outline-rail[hidden] { display: none; }
  #rail-grip {
    position: absolute;
    right: -3px;
    top: 0;
    bottom: 0;
    width: 7px;
    z-index: 6;
    padding: 0;
    border: none;
    background: transparent;
    cursor: col-resize;
    touch-action: none;
  }
  #rail-grip:hover, #rail-grip:focus-visible {
    background: var(--accent);
    opacity: 0.4;
    outline: none;
  }
  #outline { flex: 1; min-height: 0; overflow: auto; padding: 4px 8px 12px; }
  /* The signature element: a 2px accent bar on the row for the heading you are
     currently reading, driven off scroll — the one accent-coloured thing in
     the rail. `::before` rather than a border, so it does not shift the row's
     own left padding. */
  .ol.current { color: var(--fg); }
  .ol.current::before {
    content: "";
    position: absolute;
    left: 0;
    top: 3px;
    bottom: 3px;
    width: 2px;
    border-radius: 1px;
    background: var(--accent);
  }
  .ol { position: relative; }
  /* A list, not a table of cards: no row border and no row fill, so the four
     backlinks of a typical note read as four lines of text. The rhythm has to
     come from the margin now that no border draws the edges. */
  .bl {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    column-gap: 7px;
    width: 100%;
    text-align: left;
    padding: 4px 7px;
    margin-bottom: 4px;
    border: none;
    border-radius: 5px;
    background: none;
    color: var(--fg);
    font: inherit;
    font-size: 12px;
    line-height: 1.35;
    cursor: pointer;
  }
  /* --bg, not --bg-alt: the panel itself is already --bg-alt, so hovering to
     that colour would be a no-op. Keyboard focus gets the outline instead of a
     fill, because with the border gone a hover-coloured row is the only other
     signal and the two must not look alike. */
  .bl:hover { background: var(--bg); }
  .bl:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  /* The rel path sits right after the title, not flush right: it is what tells
     two same-titled notes apart, so it belongs next to the title rather than a
     ragged gutter away. It wraps to a second line when the pair no longer fits
     — flex-wrap breaks on content width before it shrinks anything — which is
     kinder on a narrow panel than ellipsizing both halves into uselessness.
     Both still clip rather than wrap again, so a row is at most two lines. */
  .bl-title,
  .bl-path { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bl-title { flex: 0 1 auto; font-weight: 600; }
  .bl-path { flex: 0 1 auto; max-width: 100%; color: var(--fg-muted); font-size: 11px; }
  /* "×3" when one note links here three times: the list shows each linking
     note once, so the multiplicity has to survive somewhere. Muted like the
     path — it qualifies the row, it is not the row. */
  .bl-count { flex: none; color: var(--fg-muted); font-size: 11px; }
  /* The rail's own empty-state register: micro-copy, not a sentence — "No headings yet." and "No other note … links here." read the same way. */
  .bl-empty { color: var(--fg-muted); font-size: 11px; line-height: 1.5; }
  /* An outline row IS a backlink row (it carries `bl` as well) — one row style
     for one panel — plus the indent that carries the nesting. Declared after
     `.bl` so its padding-left wins, and the step comes from the depth the
     renderer computed rather than from the heading level, so a note whose
     headings all start at `##` is not a uniformly indented note. */
  .ol { padding-left: calc(7px + var(--ol-depth, 0) * 13px); }
  .ol-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* A caveat about SCAN COVERAGE, not a warning about the note — --warn is
     reserved for the conflict banner, the one message here that must be read
     (§2). One muted line in the same register as everything else in this
     panel, not a bordered box: a truncated-walk notice is real information,
     but it is not more important than the note itself. */
  #notice {
    margin: 6px 0 0;
    padding: 0 10px;
    color: var(--fg-muted);
    font-size: 11px;
    line-height: 1.5;
  }
  #notice[hidden] { display: none; }
  /* Takes everything the backlinks list does not use: the canvas is the one
     thing here that gets better with more room, since the force layout spreads
     its labels out instead of stacking them. */
  #graph-sec {
    flex: 1;
    min-height: 12rem;
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--border);
  }
  /* Load-bearing, not decorative: `#graph-sec { display: flex }` above beats
     the UA stylesheet's `[hidden] { display: none }` on specificity alone (an
     ID selector outranks an attribute selector), so without this rule setting
     `.hidden = true` in JS (§5/MD-19c) drew the header, the depth stepper and
     an empty canvas anyway — the section LOOKED conditional in the code and
     was not conditional on screen. */
  #graph-sec[hidden] { display: none; }
  #graph-canvas { flex: 1; width: 100%; display: block; cursor: grab; }
  #graph-note { flex: none; padding: 6px 10px; font-size: 11px; color: var(--fg-muted); }
  #graph-note[hidden] { display: none; }
  #graph-count { text-transform: none; letter-spacing: 0; font-weight: 400; }
  #depth {
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 5px;
    font: inherit;
    font-size: 11px;
    padding: 1px 4px;
  }

  /* ---- code block chrome: language chip + copy (6b.3, 6b.4) --------------
     One small floating toolbar, anchored to the fence's opening line (which
     carries `position: relative` above), not to every line of the block —
     that is what lets it sit in one corner instead of repeating per line. */
  .lp-fence-chip {
    position: absolute;
    top: 6px;
    right: 8px;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .lp-lang-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--fg-muted);
    user-select: none;
  }
  .lp-copy-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 2px 7px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--bg);
    color: var(--fg-muted);
    font-size: 11px;
    letter-spacing: 0.02em;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.1s ease;
  }
  .lp-fence-chip:hover .lp-copy-btn,
  .lp-fence-chip.hover-show .lp-copy-btn { opacity: 1; }
  .lp-copy-btn:hover { color: var(--fg); border-color: var(--accent); }
  .lp-copy-btn svg { width: 11px; height: 11px; display: block; }

  /* ---- the selection format bubble (6c) -----------------------------------
     Positioned by hand from `view.coordsAtPos`, not via CM's tooltip API
     (that would need `showTooltip`/`Tooltip`, which are not bundled — MD-13
     stays as it is). Chrome for a subject that exists: hidden while there is
     no non-empty selection. A TOOL, not a card: ~30px tall (3px padding + a
     24px row), 4px gaps, 6px radius, one hairline border, `--shadow-ink` for
     lift — no heavy rounding and no padding beyond what the icons need. */
  #fmt-bubble {
    position: fixed;
    z-index: 7;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 3px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-alt);
    box-shadow: 0 4px 14px var(--shadow-ink);
  }
  #fmt-bubble[hidden] { display: none; }
  /* One icon system, one size, one stroke weight (see the HTML): every mark
     button is a monochrome SVG glyph, `--fg-muted` at rest, `--fg` on hover,
     and `--accent` ONLY for a mark already applied to the selection — the
     bubble's one deliberate spot of colour, and it means something specific
     rather than decorating the row. */
  #fmt-bubble button {
    width: 26px;
    height: 24px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    border: none;
    border-radius: 4px;
    background: transparent;
    color: var(--fg-muted);
    cursor: pointer;
  }
  #fmt-bubble button svg { width: 14px; height: 14px; display: block; }
  /* Letters, not icons, for bold/italic/strike (see the HTML comment) — set
     explicitly rather than inherited, so they cannot drift if the page's own
     body stack ever changes independently of this bubble. Sized by EYE
     against the link icon's 14px, not at its own nominal 14px: a plain-weight
     14px letter reads lighter than a 2px-stroke 14px icon sitting beside it,
     so the glyphs go to 15px, and italic/strike pick up `font-weight: 600` —
     bold does not need the same push, since 700 already carries enough
     weight on its own. */
  .fmt-glyph {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1;
  }
  .fmt-glyph-bold { font-weight: 700; }
  .fmt-glyph-italic { font-style: italic; font-weight: 600; }
  .fmt-glyph-strike { text-decoration: line-through; font-weight: 600; }
  /* The inline-code button IS its own result: a small chip in the same idiom
     `.lp-code` uses (border, rounded corners) around the backtick pair that
     actually produces it — `border: currentColor` so it rides the button's
     own colour states (rest/hover/pressed) for free, with no separate rule. */
  .fmt-code-chip {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 4px;
    border: 1px solid currentColor;
    border-radius: 3px;
  }
  #fmt-bubble button:hover { color: var(--fg); }
  #fmt-bubble button[aria-pressed="true"] {
    background: var(--accent);
    color: var(--on-accent);
  }
  .fmt-sep { width: 1px; align-self: stretch; margin: 1px 0; background: var(--border); }
  .fmt-turn { position: relative; }
  /* `#fmt-bubble #fmt-turn-btn`, NOT the bare id: `#fmt-bubble button` above
     is (1 id, 1 type) = 0,1,0,1, and a bare `#fmt-turn-btn` is (1 id) =
     0,1,0,0 — LOWER specificity, so the base rule's `width: 26px` silently
     won over this rule's `width: auto` (found by the owner reading the CSS,
     not by looking at the page: the symptom was the label clipping against
     a fixed 26px box with no wrap). Prefixing the ancestor id makes this
     0,2,0,0, which beats it outright. Exactly the same shape of bug as the
     `#graph-sec[hidden]` one (MD-19c) — an id-scoped base rule silently
     outranking a later, less specific override, no error, just a control
     that looks wrong. */
  #fmt-bubble #fmt-turn-btn {
    width: auto;
    padding: 0 6px;
    font-size: 11px;
    white-space: nowrap;
  }
  #fmt-turn-btn svg { width: 10px; height: 10px; }
  #fmt-turn-menu {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    z-index: 8;
    min-width: 9rem;
    padding: 4px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-alt);
    box-shadow: 0 4px 14px var(--shadow-ink);
  }
  #fmt-turn-menu[hidden] { display: none; }
  /* Full-width text rows, not icon buttons — overrides `#fmt-bubble button`'s
     fixed square size. `#fmt-bubble #fmt-turn-menu button` rather than the
     bare `#fmt-turn-menu button`: the bare form is only EQUAL specificity to
     `#fmt-bubble button` (0,1,0,1 each) and depended on winning by source
     order alone — exactly the fragile shape the `#fmt-turn-btn` bug (below)
     turned out to be real, so this is hardened the same way rather than left
     to keep winning by luck of position. */
  #fmt-bubble #fmt-turn-menu button {
    display: block;
    width: 100%;
    height: auto;
    text-align: left;
    padding: 5px 8px;
    color: var(--fg);
    font-size: 12px;
  }
  #fmt-bubble #fmt-turn-menu button:hover { background: var(--bg); color: var(--fg); }

  /* ---- the image lightbox (6a) --------------------------------------------
     A backdrop overlay, not a rendering change: the underlying `<img
     class="lp-img">`/`<video>` widgets are untouched (imageWidget). */
  #lightbox {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4vh 4vw;
    /* --scrim-veil, not --scrim: this dims the whole viewport to make one
       picture the only thing in the room, which is heavier than an ordinary
       modal backdrop — the same distinction the shell's own lightbox tokens
       draw (frontend/src/styles/tokens.css). */
    background: var(--scrim-veil);
  }
  #lightbox[hidden] { display: none; }
  #lb-img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 4px;
    object-fit: contain;
  }
  /* The scrim set, not --fg/--bg-alt: these controls sit on ARBITRARY PIXELS
     (the photo itself), where the app's theme says nothing about the surface
     underneath — white-on-dark-wash reads over anything, and a token that
     flipped with the theme would put light ink on a light photo half the
     time. Same reasoning and the same token names as the shell's own scrim
     set. */
  #lb-close, #lb-prev, #lb-next {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--scrim-border);
    border-radius: 999px;
    background: var(--scrim-bg);
    color: var(--scrim-fg);
    cursor: pointer;
  }
  #lb-close svg, #lb-prev svg, #lb-next svg { display: block; }
  #lb-close { top: 16px; right: 16px; width: 34px; height: 34px; }
  #lb-close svg { width: 15px; height: 15px; }
  #lb-prev, #lb-next { top: 50%; transform: translateY(-50%); width: 44px; height: 44px; }
  #lb-prev svg, #lb-next svg { width: 18px; height: 18px; }
  #lb-prev { left: 16px; }
  #lb-next { right: 16px; }
  #lb-close:hover, #lb-prev:hover, #lb-next:hover { background: var(--scrim-bg-hover); }
  #lb-prev[hidden], #lb-next[hidden] { display: none; }
  #lb-caption {
    position: absolute;
    left: 20px;
    bottom: 16px;
    max-width: 60%;
    color: var(--scrim-fg);
    font-size: 13px;
  }
  #lb-caption:empty { display: none; }

  /* ---- skeleton --------------------------------------------------------- */
  #skel { flex: 1; max-width: 46rem; margin: 0 auto; padding: 40px 24px; }
  #skel[hidden] { display: none; }
  .skel-bar {
    height: 14px;
    margin: 0 0 14px;
    border-radius: 4px;
    background: linear-gradient(100deg, var(--bg-alt) 30%, var(--skel-shine) 50%, var(--bg-alt) 70%);
    background-size: 200% 100%;
    animation: skel-shimmer 1.3s ease-in-out infinite;
  }
  .skel-h1 { height: 28px; width: 52%; margin-bottom: 24px; }
  .skel-h2 { height: 20px; width: 38%; margin-top: 10px; margin-bottom: 18px; }
  .skel-code {
    height: 70px;
    margin: 4px 0 20px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: linear-gradient(100deg, var(--bg-alt) 30%, var(--skel-shine) 50%, var(--bg-alt) 70%);
    background-size: 200% 100%;
    animation: skel-shimmer 1.3s ease-in-out infinite;
  }
  @keyframes skel-shimmer {
    from { background-position: 200% 0; }
    to { background-position: -200% 0; }
  }
</style>
</head>
<body>
  <div id="conflict">
    <span id="conflict-text">This note changed on disk while you were editing it.</span>
    <button id="reload">Reload from disk</button>
    <button id="keep">Keep my version</button>
  </div>
  <div id="split">
    <!-- The outline is a left rail in the page (MD-19a/MD-19b), open by
         default: a note always has structure, so this is permanent chrome
         rather than a section behind a toggle. -->
    <aside id="outline-rail">
      <!-- No count here (owner: "what is outline 1? how can you even have
           multiple outlines?") — a bare numeral right after a label reads as
           an ORDINAL, not a count, and the outline is a visible list anyway
           (the eye already reports how long it is). Obsidian shows none for
           the same reason. -->
      <div class="panel-head">
        <span>Outline</span>
        <span class="spacer"></span>
        <button id="rail-collapse" type="button" class="panel-collapse-btn"
                aria-label="Collapse outline">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 3.5 L11 8 L6 12.5" transform="rotate(180 8 8)" />
          </svg>
        </button>
      </div>
      <div id="outline"></div>
      <button id="rail-grip" type="button" aria-label="Resize outline"></button>
    </aside>
    <button id="rail-reopen" type="button" class="panel-reopen-btn left"
            aria-label="Show outline" hidden>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 3.5 L11 8 L6 12.5" />
      </svg>
    </button>
    <div id="surfaces">
      <div id="skel" aria-hidden="true">
        <div class="skel-bar skel-h1"></div>
        <div class="skel-bar" style="width:94%"></div>
        <div class="skel-bar" style="width:82%"></div>
        <div class="skel-bar" style="width:88%"></div>
        <div class="skel-bar skel-h2"></div>
        <div class="skel-bar" style="width:76%"></div>
        <div class="skel-bar" style="width:91%"></div>
        <div class="skel-bar" style="width:65%"></div>
        <div class="skel-code"></div>
        <div class="skel-bar" style="width:60%; margin-left:24px"></div>
        <div class="skel-bar" style="width:70%; margin-left:24px"></div>
        <div class="skel-bar" style="width:85%"></div>
      </div>
      <div id="status" hidden></div>
      <div id="editor-wrap"></div>
      <!-- The selection format bubble (6c). Hidden while there is no
           selection — chrome for a subject that exists (§2). Positioned by
           hand from the selection's coordinates, in JS. -->
      <!-- Letters are TYPE, pictures are ICONS — a hollow traced-outline `B`
           does not read as bold at 14-16px, it reads as a damaged shape. Bold/
           italic/strike are rendered as real characters carrying the actual
           formatting (`font-weight`/`font-style`/`text-decoration`), so the
           control demonstrates its own effect — self-describing in a way no
           icon can be, the same reason Notion and Bear do this. Link stays an
           SVG (it has no letterform of its own). Inline code gets the one
           thing that IS its result: a small chip in the `.lp-code` idiom
           (border + rounded corners) around the backtick pair that actually
           produces it — not an abstract outline shape. -->
      <div id="fmt-bubble" hidden>
        <button id="fmt-bold" data-cmd="bold" title="Bold (⌘B)">
          <span class="fmt-glyph fmt-glyph-bold">B</span>
        </button>
        <button id="fmt-italic" data-cmd="italic" title="Italic (⌘I)">
          <span class="fmt-glyph fmt-glyph-italic">I</span>
        </button>
        <button id="fmt-strike" data-cmd="strike" title="Strikethrough (⌘⇧X)">
          <span class="fmt-glyph fmt-glyph-strike">S</span>
        </button>
        <button id="fmt-code" data-cmd="code" title="Inline code (⌘⇧E)">
          <span class="fmt-glyph fmt-code-chip">``</span>
        </button>
        <button id="fmt-link" data-cmd="link" title="Link (⌘K)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
          </svg>
        </button>
        <span class="fmt-sep"></span>
        <div id="fmt-turn" class="fmt-turn">
          <button id="fmt-turn-btn" type="button">
            <span>Turn into</span>
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 6 L8 10 L12 6" />
            </svg>
          </button>
          <div id="fmt-turn-menu" hidden></div>
        </div>
      </div>
    </div>
    <!-- No `hidden` here, unlike the rail's own reopen button: the RAIL
         defaults OPEN (so its reopen chip correctly starts hidden), but this
         panel defaults CLOSED — before applySidebar() has run even once, the
         reopen chip belongs on screen, not hidden and then un-hidden a beat
         later. -->
    <button id="side-reopen" type="button" class="panel-reopen-btn right"
            aria-label="Show panel">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 3.5 L11 8 L6 12.5" transform="rotate(180 8 8)" />
      </svg>
    </button>
    <aside id="side">
      <button id="side-grip" type="button" aria-label="Resize side panel"></button>
      <!-- Mirrored from the rail's head (owner: "follow a structure similar
           to the left one") — same DOM order (label, count, spacer, button),
           `.mirror` alone flips which edge the button lands on via
           `row-reverse`, so the collapse chevron sits at THIS panel's inner
           (left) edge, matching the rail's at its own inner (right) edge.
           Unlike the outline, a backlinks COUNT is genuinely informative —
           the list can be scrolled or capped, so the number says something
           the visible rows do not — but it is never a bare numeral beside
           the label: `.panel-count` sets it apart as its own pill so it
           cannot be misread as "backlinks #3". -->
      <div class="panel-head mirror" id="links-head">
        <span>Backlinks</span>
        <span class="panel-count" id="links-count"></span>
        <span class="spacer"></span>
        <button id="side-collapse" type="button" class="panel-collapse-btn"
                aria-label="Collapse panel">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 3.5 L11 8 L6 12.5" />
          </svg>
        </button>
      </div>
      <div id="links" hidden>
        <div id="bl-list"></div>
        <div id="notice" hidden></div>
      </div>
      <!-- The graph section only exists when the note has links (§5): drawn
           by JS, not hidden by CSS, so an absent graph never reserves space
           or a "no links" placeholder. Shares the same head register
           (`.panel-head`) as the panel head above it, with no button of its
           own — collapsing the whole PANEL lives one level up. -->
      <div id="graph-sec" hidden>
        <div class="panel-head">
          <span>Graph</span>
          <span id="graph-count"></span>
          <span class="spacer"></span>
          <label>depth
            <select id="depth">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <!-- The whole vault, focus still highlighted: graph.py reads a
                   negative depth as "skip the neighbourhood filter" (MD-20). -->
              <option value="-1">all</option>
            </select>
          </label>
        </div>
        <canvas id="graph-canvas"></canvas>
        <div id="graph-note" hidden></div>
      </div>
    </aside>
  </div>
  <div id="save-state"></div>
  <div id="ro-wrap"><span id="ro" hidden></span></div>
  <!-- The image lightbox (6a): overlay + key handler over the already-rendered
       <img class="lp-img">/<video> widgets, not a rendering change. -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
    <!-- Monochrome SVG on currentColor, the same idiom the corner button uses
       — no typographic character standing in for an icon anywhere (✕/‹/› all
       render at a different weight and optical size than a drawn glyph, and
       inherit font fallback this view does not control). -->
    <button id="lb-close" type="button" aria-label="Close">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" aria-hidden="true">
        <path d="M3.5 3.5 L12.5 12.5" />
        <path d="M12.5 3.5 L3.5 12.5" />
      </svg>
    </button>
    <button id="lb-prev" type="button" aria-label="Previous image">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9.5 3.5 L5 8 L9.5 12.5" />
      </svg>
    </button>
    <img id="lb-img" alt="" />
    <button id="lb-next" type="button" aria-label="Next image">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6.5 3.5 L11 8 L6.5 12.5" />
      </svg>
    </button>
    <div id="lb-caption"></div>
  </div>
  <script>
    // This view owns its own saves and its own reload rule (MD-16/MD-17), so
    // the runtime's blanket reload-on-change must stay out of the way — it
    // would reload the page under the cursor, and our own autosave moves the
    // mtime on every write anyway.
    fused.autoReload(false);

    const MAX_BYTES = 2 * 1024 * 1024;
    // Obsidian's idle autosave interval. Not configurable, deliberately: the
    // whole point of copying Obsidian here is the absence of save ceremony.
    const AUTOSAVE_MS = 2000;

    const conflictEl = document.getElementById("conflict");
    const conflictTextEl = document.getElementById("conflict-text");
    const saveStateEl = document.getElementById("save-state");
    const statusEl = document.getElementById("status");
    const skelEl = document.getElementById("skel");
    const editorWrapEl = document.getElementById("editor-wrap");

    let file = null;
    let text = "";        // last text loaded from (or written to) disk
    let mtime = null;     // the optimistic-lock token
    let writable = true;  // stat.writable — the shell's persisted read_only (MD-15)
    let dirty = false;
    let saving = false;
    let savePromise = null;
    let saveTimer = null;
    let view = null;      // the live CodeMirror view, or null
    let themeObserver = null;
    let themedDark = true;

    // The note's link facts, from graph.py. Resolution happens THERE, on the
    // candidate set that exists right now (MD-6) — this page never resolves a
    // target itself, so the note view and the graph views cannot disagree.
    // `resolved` is a three-state: a Map when a scan answered, and null when no
    // scan ran — which means resolution is UNKNOWN, not "nothing resolved".
    let notes = null;
    let resolved = null;
    let scanNotice = "";  // graph.py's reason, when it had one

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Join an absolute POSIX dir with a relative path and collapse "." / ".."
    // segments — pure string work (no fs access; paths are absolute POSIX).
    // A leading "/" is right for a POSIX path and WRONG for a Windows one: the
    // shell's canonical form there is the drive path `C:/Users/…` with no
    // leading slash, so prefixing one produced `/C:/…` — which then failed the
    // scan-root boundary check in createGhost and refused every create on
    // Windows. Same guard the docs, excel and slides templates carry.
    function resolvePath(dir, rel) {
      const out = [];
      for (const p of dir.split("/").concat(rel.split("/"))) {
        if (p === "" || p === ".") continue;
        if (p === "..") out.pop();
        else out.push(p);
      }
      const joined = out.join("/");
      return /^[A-Za-z]:$/.test(out[0] || "") ? joined : "/" + joined;
    }

    // A malformed escape ("%zz") throws rather than decoding; the authored text
    // is the best remaining guess at what the author meant.
    function decodeMaybe(value) {
      try { return decodeURIComponent(value); } catch (e) { return value; }
    }

    function noteDir() { return file ? file.slice(0, file.lastIndexOf("/")) : ""; }
    function isNote(path) { return /\.(md|markdown)$/i.test(path || ""); }

    // ---- read-only (MD-1a) --------------------------------------------------
    // No mode: a writable note is editable, full stop. `writable` — read off
    // the shell's persisted `stat.writable` (MD-15) — is the only gate, so a
    // genuinely unwritable file (a snapshot, a read-only file) still opens
    // locked with its floating read-only badge; that path is unchanged.

    // ---- shell navigation ---------------------------------------------------
    // Mirrors frontend/src/lib/router.ts urlForFsPath + navigate, the same way
    // history/canvas/preview each do: the prefix this session is already in,
    // every path segment encoded, then pushState + "fused:navigate" on the top
    // window so the shell re-routes without a full reload.
    function shellPrefix() {
      try {
        const p = window.top.location.pathname;
        if (p.startsWith("/explorer/embed/") || p === "/explorer/embed") return "/explorer/embed/";
      } catch (e) { /* cross-origin — assume the normal shell */ }
      return "/explorer/view/";
    }
    function urlForFsPath(fsPath, search) {
      const norm = /^[A-Za-z]:[\\/]/.test(fsPath) ? fsPath.replace(/\\/g, "/") : fsPath;
      const encoded = norm.replace(/^\/+/, "").split("/").filter(Boolean)
        .map(encodeURIComponent).join("/");
      return shellPrefix() + encoded + (search ? "?" + search : "");
    }
    async function navigateShell(fsPath, search) {
      // Leaving this note must not lose edits newer than the last autosave.
      const flushed = await window.__fusedFlushEdits();
      if (!flushed.ok) return;
      const url = urlForFsPath(fsPath, search);
      try {
        const top = window.top;
        void top.location.href; // throws when cross-origin
        top.history.pushState(null, "", url);
        top.dispatchEvent(new Event("fused:navigate"));
        return;
      } catch (e) { /* fall through */ }
      try { window.top.location.href = url; } catch (e) { location.href = url; }
    }

    // A link to `Note#Heading` navigates to the note and hands the heading over
    // as an ordinary param, so the target view can scroll to it and the URL
    // stays shareable — which is also how this view receives it (see load()).
    function openNote(path, heading) {
      navigateShell(path, heading ? "heading=" + encodeURIComponent(heading) : "");
    }

    // `Target#Heading|label` → [target, heading, label]. Both parts optional.
    function splitInner(inner) {
      const pipe = inner.indexOf("|");
      const head = pipe === -1 ? inner : inner.slice(0, pipe);
      const label = pipe === -1 ? "" : inner.slice(pipe + 1).trim();
      const hash = head.indexOf("#");
      return [
        (hash === -1 ? head : head.slice(0, hash)).trim(),
        hash === -1 ? "" : head.slice(hash + 1).trim(),
        label,
      ];
    }

    // ======================================================================
    // Live Preview (MD-18a)
    // ======================================================================
    // Obsidian's mechanism rather than an approximation of it: ONE decoration
    // set over the CM6 document. Markup is replaced by a widget or hidden
    // everywhere except the lines the selection touches, where the raw source
    // comes back so it can be edited. There is no second rendered copy of the
    // document, which is precisely what lets one surface both read and write
    // (MD-1) — no mode switch, and no caret to hand between two views.
    //
    // What a range IS comes from the vendored markdown grammar via syntaxTree,
    // so this file holds no block parser. Wikilinks are not part of that
    // grammar, so they are matched by regex and then checked AGAINST the tree,
    // which is how MD-3's code-masking rule holds here without a second copy
    // of it.

    const relinkEffect = CM.StateEffect.define();

    // Shown on every link when no scan ran (see wikilinkWidget). One sentence,
    // and it says what is unknown rather than what is wrong.
    const UNRESOLVED_HERE =
      "Link targets are not resolved here — this note's folder was not scanned.";

    // Node names whose text is code, and therefore never a link.
    const CODE_NODES = new Set([
      "InlineCode", "CodeText", "FencedCode", "CodeBlock", "CodeMark", "CodeInfo",
    ]);

    const HEADINGS = {
      ATXHeading1: 1, ATXHeading2: 2, ATXHeading3: 3,
      ATXHeading4: 4, ATXHeading5: 5, ATXHeading6: 6,
      SetextHeading1: 1, SetextHeading2: 2,
    };
    const LISTS = { BulletList: true, OrderedList: true };
    const EMPHASIS = {
      StrongEmphasis: "lp-bold",
      Emphasis: "lp-italic",
      Strikethrough: "lp-strike",
    };
    const EMPHASIS_MARKS = new Set(["EmphasisMark", "StrikethroughMark"]);

    // A widget is identified by `key` so CM can reuse the DOM across rebuilds
    // instead of replacing every widget on every keystroke.
    class DomWidget extends CM.WidgetType {
      constructor(key, build, opaque) {
        super();
        this.key = key;
        this.build = build;
        // `true` keeps CM's own event handling off the widget, so a click
        // reaches the delegated navigation handler instead of moving the
        // caret. `false` is what makes a widget click-to-edit: the caret
        // lands inside it, the line becomes selected, and the source shows.
        this.opaque = opaque === true;
      }
      eq(other) { return other.key === this.key; }
      toDOM(editorView) { return this.build(editorView); }
      ignoreEvent() { return this.opaque; }
    }

    // `edges` also tags the first and last line of the range with `cls-top` and
    // `cls-bot`, which is what lets a multi-line block carry padding and a
    // rounded corner only where it actually begins and ends (MD-26). A single
    // decoration per line carrying both classes, rather than two decorations:
    // CM keeps line decorations separate and a second one would have to be
    // merged by hand anyway.
    function lineClass(state, from, to, cls, edges) {
      const out = [];
      const first = state.doc.lineAt(from).number;
      const last = state.doc.lineAt(Math.min(to, state.doc.length)).number;
      for (let n = first; n <= last; n++) {
        let name = cls;
        if (edges && n === first) name += " " + cls + "-top";
        if (edges && n === last) name += " " + cls + "-bot";
        out.push(CM.Decoration.line({ class: name }).range(state.doc.line(n).from));
      }
      return out;
    }

    // Which lines have the caret (or a selection) on them: the reveal rule.
    // Line-level, matching Obsidian — putting the caret on a line un-renders
    // that whole line's markup, not just the one node under the cursor.
    function selectedLines(state) {
      const lines = new Set();
      // An unwritable file reveals nothing, ever (MD-1a/MD-15). `editable.of(false)`
      // leaves no caret so there is usually nothing to reveal — but a browser
      // text selection inside a non-editable view still reaches the state's
      // selection, and swiping over a heading would un-render it. One guard
      // makes this deterministic instead of dependent on that.
      if (!writable) return lines;
      for (const range of state.selection.ranges) {
        const first = state.doc.lineAt(range.from).number;
        const last = state.doc.lineAt(range.to).number;
        for (let n = first; n <= last; n++) lines.add(n);
      }
      return lines;
    }

    function touched(state, lines, from, to) {
      const first = state.doc.lineAt(from).number;
      const last = state.doc.lineAt(Math.min(to, state.doc.length)).number;
      for (let n = first; n <= last; n++) if (lines.has(n)) return true;
      return false;
    }

    // ---- widget builders ----------------------------------------------------

    // A wikilink resolved by graph.py, a dim ghost that offers to create the
    // note, or — when no scan ran at all — an inert link that claims nothing.
    // The resolved ones carry the attributes the one delegated click handler
    // listens for, so every link surface in this template navigates by one code
    // path.
    //
    // THREE states, not two (MD-11). "Scanned, and this target did not resolve"
    // is a ghost: dashed, and clicking it creates the note. "Not scanned, so
    // resolution is unknown" is neither — on a remote mount, or after a refused
    // or failed scan, `resolved` is null and nothing was ever looked up. Drawing
    // a ghost there asserts the target does not exist when we never looked, and
    // offers to create a note that may be sitting right next to this one.
    function wikilinkWidget(raw) {
      const [target, heading, label] = splitInner(raw.replace(/^!?\[\[|\]\]$/g, ""));
      const embed = raw.startsWith("!");
      const known = resolved !== null;
      const row = known ? resolved.get(target) : undefined;
      const path = row ? row.path : null;
      // `[[#Heading]]` has no target: it points inside THIS note. Reading as
      // "#Heading" rather than " > Heading" (an empty name and a separator) is
      // the whole of what it needs to say.
      const anchorOnly = !target && !!heading;
      const shown = label
        || (anchorOnly ? "#" + heading : target + (heading ? " > " + heading : ""));
      // `known` belongs in the key: widgets are reused across rebuilds by key,
      // so an inert link has to be replaced when a scan finally lands (MD-9).
      const key = "wl:" + (embed ? "!" : "") + raw + "|" + (path || "")
        + (known ? "|k" : "|u");
      return new DomWidget(key, () => {
        if (embed && path && !isNote(path)) {
          const img = document.createElement("img");
          img.className = "lp-img";
          img.src = fused.rawUrl(path);
          img.alt = target;
          return img;
        }
        // `!anchorOnly`: `![[#Heading]]` names no file, so "Missing embed" would
        // be answering a question nobody asked. It degrades to the anchor link
        // below (embedding a section of this same note is not supported).
        if (embed && !path && !anchorOnly) {
          const span = document.createElement("span");
          // Unknown reads as "we did not look", not as "it is missing".
          span.className = known ? "wl-embed-missing" : "wl-embed-unknown";
          span.textContent = known
            ? "Missing embed: " + target : "Embed: " + target;
          if (!known) span.title = UNRESOLVED_HERE;
          return span;
        }
        const a = document.createElement("a");
        if (anchorOnly) {
          // An anchor into this same note is a LINK, and it needs no scan to be
          // one — the target document is the one already open. It rendered as a
          // dead ghost instead: no scan resolves an empty target (graph.py's
          // `_resolved_links` skips them, correctly — it is not an edge), so the
          // scanned branch below drew the create-me affordance with
          // `data-create=""`, and an empty attribute VALUE still matches
          // closest("[data-create]"), so clicking it ran createGhost("") and
          // died at the degenerate-name guard.
          a.className = "wl";
          a.dataset.anchor = heading;
          a.title = "Jump to " + heading + " in this note";
        } else if (!known) {
          // Inert: no ghost styling, no data-create, nothing to click.
          a.className = "wl wl-unknown";
          a.title = UNRESOLVED_HERE;
        } else if (!path) {
          // Unresolved: a ghost, and clicking it creates the note — Obsidian's
          // behaviour, and only possible because this template writes.
          a.className = "wl wl-ghost";
          a.dataset.create = target;
          a.title = "Unresolved — click to create this note";
        } else {
          a.className = "wl";
          a.dataset.path = path;
          if (heading) a.dataset.heading = heading;
          if (row && row.title) a.title = row.title;
          a.href = urlForFsPath(path, heading ? "heading=" + encodeURIComponent(heading) : "");
        }
        // A note embedded in a note links to it rather than inlining the whole
        // document, which would need a second parse and could recurse.
        a.textContent = shown;
        return a;
      }, true);
    }

    // `[label](target)`. An in-vault relative target is resolved against the
    // note's own folder and handed `data-path`, for the reason MD-4a records:
    // this document is served at /render?path=…, so a browser-relative href
    // resolves against the server root and misses the file entirely. A real
    // href is set too, so hover preview and ⌘-click behave like normal links.
    //
    // No extension filter: the shell opens any path with its own template, so a
    // link to a .png, a .pdf or a subfolder is as navigable as one to a note.
    // What a `[label](target)` link's TARGET means — one function, so a
    // nested image-in-link (`linkedImageWidget`, below) resolves its outer
    // target exactly the same way an ordinary text link does, rather than a
    // second copy of this rule drifting from it.
    function applyLinkTarget(a, href) {
      // Absolute paths, any scheme (http:, mailto:, data:) and a bare
      // #anchor are not vault paths — rewriting them would break them. MD-3
      // draws this same line for what counts as an edge.
      if (/^(#|\/|[a-z][a-z0-9+.-]*:)/i.test(href)) {
        a.href = href;
        a.target = "_blank";
        a.rel = "noopener";
        return;
      }
      const hash = href.indexOf("#");
      const target = hash === -1 ? href : href.slice(0, hash);
      if (!target) { a.href = href; return; }
      const heading = hash === -1 ? "" : decodeMaybe(href.slice(hash + 1));
      const path = resolvePath(noteDir(), decodeMaybe(target));
      a.dataset.path = path;
      if (heading) a.dataset.heading = heading;
      a.href = urlForFsPath(path, heading ? "heading=" + encodeURIComponent(heading) : "");
    }

    function markdownLinkWidget(label, href) {
      const key = "ln:" + label + "|" + href;
      return new DomWidget(key, () => {
        const a = document.createElement("a");
        a.className = "lp-link";
        a.textContent = label || href;
        applyLinkTarget(a, href);
        return a;
      }, true);
    }

    // `![alt](src)`. Click-to-edit rather than opaque: the caret lands in the
    // source so the path can be fixed, which is the only way to edit it now
    // that there is no separate source mode.
    // A dropped or pasted video is written as `![](clip.mp4)` too (MD-23) —
    // markdown has no video syntax, and emitting a raw <video> tag would show
    // as literal text in every other markdown tool. So the ELEMENT is chosen
    // off the extension here: without this a clip renders as an <img> with a
    // source no browser can decode, i.e. a broken-image icon.
    // Every extension MEDIA_EXT can produce for a `video/*` blob must be in
    // here, or a pasted clip renders as a broken <img>. A container the
    // browser cannot decode (mkv) still belongs: a player reporting it cannot
    // play the file says far more than a broken-image icon.
    const VIDEO_EXT = /\.(mp4|webm|mov|m4v|ogv|mkv)$/i;

    // `pos` is the widget's own position in the source (the `Image` node's
    // `from`) — the lightbox (6a) uses it to find this exact image again in
    // `collectDocImages()`'s regex scan, rather than trusting DOM order,
    // which CodeMirror only renders for the current viewport.
    // What a `![alt](src)` image/video's SOURCE resolves to — factored out so
    // a nested badge image (`linkedImageWidget`, below) resolves its own
    // `src` the identical way a standalone image does.
    function resolveMediaSrc(el, src) {
      if (/^[a-z][a-z0-9+.-]*:/i.test(src)) el.src = src;   // http:, data:, file:
      else if (src.startsWith("/")) el.src = fused.rawUrl(src);
      else el.src = fused.rawUrl(resolvePath(noteDir(), decodeMaybe(src)));
    }

    function imageWidget(alt, src, pos) {
      const key = "im:" + alt + "|" + src;
      // The extension is read off the source BEFORE the scheme/absolute
      // branching below, so a `file:` URL or an absolute path to a clip
      // picks the player just as a relative one does.
      const isVideo = VIDEO_EXT.test(src.split(/[?#]/)[0]);
      // Images open the lightbox and are therefore OPAQUE (a click must not
      // move the caret or count as an edit, per §6a); video keeps its old
      // click-to-edit posture, since a native player already owns clicks on it.
      return new DomWidget(key, () => {
        const el = document.createElement(isVideo ? "video" : "img");
        if (isVideo) {
          el.className = "lp-video";
          // controls so it is playable in place; preload="metadata" so a note
          // full of clips fetches poster frames, not whole videos.
          el.controls = true;
          el.muted = true;
          el.preload = "metadata";
        } else {
          el.className = "lp-img";
          el.alt = alt;
        }
        resolveMediaSrc(el, src);
        if (!isVideo) {
          el.style.cursor = "zoom-in";
          el.addEventListener("mousedown", (e) => e.stopPropagation());
          el.addEventListener("click", (e) => {
            e.preventDefault();
            openLightbox(pos);
          });
        }
        return el;
      }, !isVideo);
    }

    // `[![alt](imgsrc)](url)` — a badge/shield pattern (GitHub CI badges are
    // the common case): an outer LINK whose entire label is a single IMAGE.
    // Built as one widget, an anchor wrapping an image, rather than as the
    // plain-link/plain-image widgets composing on their own — the image does
    // NOT open the lightbox here (a badge's whole point is that clicking it
    // goes to `url`, exactly what GitHub itself renders), so it gets none of
    // `imageWidget`'s own click handling, only `resolveMediaSrc`'s `src`
    // resolution and `applyLinkTarget`'s target resolution, the same two
    // rules a plain image and a plain link already use.
    function linkedImageWidget(alt, src, href) {
      const key = "li:" + alt + "|" + src + "|" + href;
      const isVideo = VIDEO_EXT.test(src.split(/[?#]/)[0]);
      return new DomWidget(key, () => {
        const a = document.createElement("a");
        a.className = "lp-link";
        applyLinkTarget(a, href);
        const media = document.createElement(isVideo ? "video" : "img");
        if (isVideo) {
          media.className = "lp-video";
          media.controls = true;
          media.muted = true;
          media.preload = "metadata";
        } else {
          media.className = "lp-img";
          media.alt = alt;
        }
        resolveMediaSrc(media, src);
        a.appendChild(media);
        return a;
      }, true);
    }

    // A task checkbox is clickable and writes back, as in Obsidian — and it
    // stays rendered even with the caret on its line, also as in Obsidian.
    // The position comes from posAtDOM at click time rather than from a count
    // of markers in the document, so an edit between render and click cannot
    // tick the wrong box.
    function taskWidget(checked) {
      return new DomWidget("task:" + checked, (editorView) => {
        const box = document.createElement("input");
        box.type = "checkbox";
        box.className = "lp-task";
        box.checked = checked;
        box.disabled = !writable;
        if (!writable) return box;
        box.addEventListener("mousedown", (e) => e.stopPropagation());
        box.addEventListener("change", () => {
          const at = editorView.posAtDOM(box);
          const line = editorView.state.doc.lineAt(at);
          const offset = line.text.indexOf("[", at - line.from);
          if (offset === -1) return;
          const inner = line.from + offset + 1;
          editorView.dispatch({
            changes: { from: inner, to: inner + 1, insert: box.checked ? "x" : " " },
          });
          void save();
        });
        return box;
      }, true);
    }

    function hrWidget() {
      return new DomWidget("hr", () => {
        const hr = document.createElement("hr");
        hr.className = "lp-hr";
        return hr;
      }, false);
    }

    // Carries a Tab/Shift-Tab across the rebuild that a committed cell edit's
    // own dispatch causes: the widget's DOM is torn down and rebuilt before
    // the caret can move into the neighbour cell, so the move is recorded
    // here and replayed once the new build lands (see the end of
    // `tableWidget`, below). One entry is enough — only one cell is ever open
    // for editing at a time.
    let pendingCellEdit = null;

    // A deliberately narrow inline-markup renderer for table cells: a tree
    // decoration addresses document positions, so it cannot reach into a
    // widget's DOM, and a cell renders its own markup instead of going
    // through `buildDecorations`. This is not a second markdown parser —
    // syntax it does not recognize is left as literal text.
    // The url alternative (g4) allows exactly one level of balanced parens —
    // `((?:[^()\s]|\([^()\s]*\))*)` — so a Wikipedia-shaped destination like
    // `Foo_(bar)` (SPEC.md MD-31b) matches instead of stopping at the inner
    // `(`. This is NOT the prose link decorator's `\S*` (see the URL-group
    // comment near `fenceLangAndBody`, above `buildDecorations`): that one is
    // safe only because the grammar has already found the construct's true
    // end and `\S*` merely backtracks to it. This renderer has no such
    // bound — a bare greedy `\S*` over `[a](x)[b](y` would swallow all the
    // way to the end of `y`, stealing a second link's destination, so the
    // nesting has to be bounded explicitly instead. The extra parens above
    // are non-capturing, so g4 is still the whole url and the `\6`/`\8`
    // backreferences later in this alternation are unaffected.
    const INLINE_SRC = [
      "(`+)([\\s\\S]*?)\\1",                 // g1 fence, g2 code body
      "!?\\[\\[[^\\]]*\\]\\]",               // [[wikilink]] / ![[embed]] — no group
      "\\[([^\\]]*)\\]\\(((?:[^()\\s]|\\([^()\\s]*\\))*)\\)", // g3 label, g4 url
      "~~(?=\\S)([\\s\\S]*?\\S)~~",          // g5
      "(\\*\\*|__)(?=\\S)([\\s\\S]*?\\S)\\6",// g6 marker, g7 body
      "(\\*|_)(?=\\S)([\\s\\S]*?\\S)\\8",    // g8 marker, g9 body
      "<br\\s*/?>",                          // no group
    ].join("|");

    // `\|` is how a literal pipe survives inside a cell — `splitRow` (below)
    // treats an escaped bar as text, not a column boundary — so the
    // backslash is markup, not content, and is stripped here along with
    // every other inline escape.
    function unescapeInline(text) {
      return text.replace(/\\([\\`*_~|[\]()<>#+.!-])/g, "$1");
    }

    // An emphasis body recurses back through `renderInline`, so
    // `**bold `code`**` renders the code span inside the bold span. `spans`
    // and `base` are threaded straight through to the recursive call — see
    // `renderInline` below for what they mean — so a click inside a nested
    // span still resolves to a source offset.
    function inlineSpan(cls, body, spans, base) {
      const span = document.createElement("span");
      span.className = cls;
      renderInline(body, span, spans, base);
      return span;
    }

    // `spans` and `base` build a source map alongside the DOM, for the click
    // handler below to resolve a rendered hit back to a RAW offset: `spans`
    // is an array the caller collects into (append-only, so recursive calls
    // share one array across the whole cell), and `base` is the source
    // offset of `text` within that cell's raw string (0 for the top-level
    // call). Every node this function appends gets an entry, `{node, from}`
    // — `from` is `base + m.index` for a markup node (the click resolver
    // needs the node's own start, not its body's) and `base + last` for a
    // plain text run. A code span and a plain-label link add a second entry
    // for their inner text node, since that text is a verbatim slice of the
    // source and so resolves per character rather than to the construct's
    // start. Both parameters are optional and default to
    // "don't bother" (no `spans` array, `base` 0), so the existing 2-argument
    // call sites (recursing into `<code>`'s siblings is never needed, since a
    // code span's contents are never re-parsed) keep working unchanged.
    //
    // A NEW RegExp per call: emphasis recurses into this function for its own
    // body text, and a shared `lastIndex` on a module-level regex would
    // corrupt whichever call is in progress higher up the recursion.
    function renderInline(text, parent, spans, base) {
      base = base || 0;
      const re = new RegExp(INLINE_SRC, "g");
      let last = 0;
      let m;
      while ((m = re.exec(text))) {
        if (m.index > last) {
          const node = document.createTextNode(unescapeInline(text.slice(last, m.index)));
          parent.appendChild(node);
          if (spans) spans.push({ node, from: base + last });
        }
        last = re.lastIndex;
        if (m[2] !== undefined) {
          const code = document.createElement("code");
          code.className = "lp-code";
          // GFM strips one leading and one trailing space, but only as a
          // matched pair, and only when the body is not all whitespace.
          let body = m[2];
          if (body.length > 1 && body[0] === " " && body[body.length - 1] === " " && body.trim() !== "") {
            body = body.slice(1, -1);
          }
          code.textContent = body;
          parent.appendChild(code);
          if (spans) {
            spans.push({ node: code, from: base + m.index });
            // The body is a verbatim slice of the source — `textContent`,
            // never unescaped — so its text node maps character for
            // character and earns an entry of its own. Without one the
