        <button id="annrec" type="button" aria-pressed="false"
                aria-label="Record a spoken walkthrough"
                title="Record a spoken walkthrough — talk while you click, and each click becomes a note"><svg class="rec-mic" viewBox="0 0 16 16" aria-hidden="true"><rect x="6" y="1.5" width="4" height="7.5" rx="2"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0"/><line x1="8" y1="12" x2="8" y2="14.5"/></svg><span class="lbl rec-word">Record</span></button>
      </div>
      <!-- More options (⋮), beside the annotate switch. One item today: hand
           this session to a real terminal. The LABEL is decided at open time
           (kebabOpen) because it names what the copied command will do —
           "Continue in terminal" when a session id is on the URL, "New session
           in terminal" from the landing page — and the id is a param that
           changes without a reload. -->
      <div id="kebab">
        <button id="kebabbtn" type="button" aria-haspopup="menu" aria-expanded="false"
                aria-label="More options" title="More options">⋮</button>
        <!-- Scheduling was briefly a second item here (Akshil, 2026-08-14) and is
             back in the composer as a button of its own (2026-08-16): the menu
             could offer the FOLDER and nothing else, so the user retyped on the
             Schedule page the message they had already written. The composer
             holds the draft, so the composer is what can hand it over. -->
        <div id="kebabpop" role="menu" aria-label="More options" hidden>
          <button id="terminalopt" type="button" role="menuitem" class="kebab-opt"></button>
        </div>
      </div>
      <!-- Which view the LEFT pane frames. The popup ships EMPTY and the whole
           control `hidden`: the options are the target's own preview modes,
           which only the stat call in paneURL() knows, and there is no picker to
           show at all unless that call found more than one of them
           (buildLeftPicker). The rows carry each template's own icon.svg, which
           is why this is a listbox and not a <select> — see the stylesheet.
           It SHIPS here and lives here in the NARROW layout, where this strip is
           the one row both views keep and there is no persistent left column to
           put a bar on. In the split layout placeLeftPicker moves this same
           element up into #leftbar, onto the pane it controls. Ships here rather
           than there because this is the position that needs no JS to be right:
           a picker in an unbuilt left bar would be a control in a bar that may
           never be shown. -->
      <div id="leftmode" hidden>
        <button id="leftmodebtn" type="button" aria-haspopup="listbox" aria-expanded="false"
                aria-label="Preview pane view" title="Which view the preview pane shows">
          <span class="mode-ic" aria-hidden="true"></span>
          <span class="mode-lbl"></span>
          <span class="mode-chev" aria-hidden="true">▾</span>
        </button>
        <div id="leftmodepop" role="listbox" aria-label="Preview pane view" hidden></div>
      </div>
      <!-- Chat ⇄ Preview, for the narrow single-view layout only (hidden by CSS
           until the 800px media query reveals it). It sits in THIS strip
           because the strip is the one row that both views keep on screen. -->
      <button id="viewbtn" type="button" aria-label="Comment on preview"
              title="Switch between the chat and the preview pane, where the annotation tools are">Comment on preview</button>
    </div>
    <!-- chat view -->
    <div id="topbar">
      <span class="spark">✻</span>
      <span class="tb-title">Claude</span>
      <span class="tb-file" id="banner-sub"></span>
      <span id="session" class="mono"></span>
    </div>
    <div id="logwrap"><div id="log"></div><div id="queue"></div></div>
    <!-- A scheduled message pending IN THIS SESSION closes the composer, and this
         is the notice that says why (Akshil, 2026-08-17). The reason is CONTEXT
         POLLUTION, not politeness: a task is a session, so anything typed before
         a scheduled message fires ends up inside that task's context — the run
         reads a conversation the person who scheduled it never wrote.

         DIRECTLY ABOVE THE COMPOSER, not above the log: it explains a box that
         will not type, and a notice about a dead control belongs against the
         control. It used to sit under the top bar, one pane-height away from the
         thing it was about (Akshil, 2026-08-17). Arriving here costs the reader
         nothing, because #logwrap is #chat's only `flex: 1` child — the height
         this takes comes out of the TRANSCRIPT and the composer does not move.

         A banner and not a modal: the transcript stays readable and the chat
         stays navigable, which is the whole difference between "you cannot type
         here" and "you cannot use this page". `hidden` until a pending entry
         names this session — the block is a fact about the schedule, so a
         schedule that cannot be read shows nothing and blocks nothing (see
         applyComposerBlock).

         The BODY IS A TASK ROW, and it is the Tasks LIST view's row rather than a
         shape invented here (Akshil, 2026-08-17 — "this UI does not make sense to
         me, it does not give me what I want"): a status ring, TASK-nnn, the name,
         and when it runs at the right end. The reason above it is ONE short line,
         because a paragraph explaining context pollution described the block
         instead of showing what is doing it.

         What the row does NOT carry is the folder and the session id, and that is
         the user's own reasoning: "you will not show the folder because you are
         already in that folder, you are not showing the session ID because you
         are already there." Both are true of the page the reader is standing on,
         so on this row they are noise where the list view needs them to tell two
         projects apart.

         The row is the LINK — it goes to the task on the Tasks calendar — and it
         comes before the destructive button in the DOM so it comes first in tab
         order too. Geometry copied from frontend/src/styles/tasks.css, never
         linked: a template cannot import the shell's stylesheet. -->
    <div id="schedblock" hidden>
      <div class="sb-card" role="status">
        <div class="sb-why"><span class="sb-ic" aria-hidden="true">⏱</span><span class="sb-when"></span></div>
        <!-- One row, one hop. `sb-grow` is the list view's single spacer: a second
             `margin-left: auto` anywhere in here would centre the right-hand cell
             instead of pinning it (tasks.css says so in its own header). -->
        <button id="sb-row" class="sb-row" type="button">
          <span class="sb-ring" aria-hidden="true"></span>
          <span class="sb-id"></span>
          <span class="sb-name"></span>
          <span class="sb-grow"></span>
          <span class="sb-meta"></span>
        </button>
        <div class="sb-note"></div>
        <!-- Exactly ONE control, and it is the one that actually reopens the box —
             cancel for a one-off, stop-the-repeat for a repeat. "Edit schedule"
             used to sit beside it and is GONE: the row now lands on the task where
             Edit lives with its full popover, so the banner was two doors to one
             room and its own door did not unblock (Akshil, 2026-08-17). The label
             is written by renderSchedBlock, which is the only place that knows
             which of the two cases this is. -->
        <div class="sb-acts">
          <button id="sb-stop" type="button"></button>
        </div>
      </div>
    </div>
    <!-- `display: contents` is in the stylesheet, deliberately not here: an inline
         declaration cannot be overridden by the narrow layout's collapse, and
         the CSS force flag (`important`) is forbidden in this file (D146).
         See the #inputbox rule. -->
    <form id="inputbox" class="composer">
      <div id="composer-chat">
        <div class="annchips" id="annchips-chat"></div>
        <div class="composer">
          <textarea id="box" rows="1" placeholder="Reply to Claude…" spellcheck="false"
                    data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false"></textarea>
          <div class="composer-row">
            <!-- aria-label, not title: the OS tooltip a title attr produces reads as
                 unpolished chrome next to the pills, and the caret + visible value
                 already say what each pill is. Screen readers keep the name. -->
            <select id="model" class="pill model-sel" aria-label="Model"></select>
            <select id="effort" class="pill effort-sel" aria-label="Effort"></select>
            <select id="perm" class="pill perm-sel" aria-label="How much Claude may do without asking"></select>
            <span class="spacer"></span>
            <!-- Takes the picture NOW and hangs it above the composer as a chip;
                 see the shotAttachPane section. The spoken strings are rewritten
                 by applyPaneNoun once the target's kind is known, so the markup
                 ships the neutral noun rather than a wrong one.

                 AFTER the spacer, beside Send, and that position is the fix for
                 "not intuitive": grouped with the pills it read as a fourth
                 SETTING, sitting among three dropdowns that all describe how the
                 run behaves. Next to Send it reads as what it is — something you
                 do TO this message, in the seat every chat app puts an attach
                 control in. A camera, not a landscape photo: the glyph names the
                 verb ("take a picture of what I am looking at") rather than a
                 file type ("insert an image"), which is what the old one said. -->
            <button id="viewshot" class="pill viewshot" type="button"
                    aria-label="Screenshot the preview and attach it to this message"
                    title="Screenshot the preview and attach it to this message"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.6 5.4h2.1l1-1.6h4.6l1 1.6h2.1a1 1 0 0 1 1 1v5.6a1 1 0 0 1-1 1H2.6a1 1 0 0 1-1-1V6.4a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><circle cx="8" cy="9" r="2.4" stroke="currentColor" stroke-width="1.3"/></svg></button>
            <!-- IMMEDIATELY LEFT OF SEND, and that seat is the whole idea: these
                 two are the ways this draft leaves the box — now, or as a task —
                 so they sit together, after the spacer, apart from the three
                 selects that only describe how a run behaves.
                 A calendar and not a clock: what it opens is a task with a date
                 on it, not a delay on this message (see openScheduler for what
                 the composer stopped trying to do on its own).

                 The title and aria-label here are the PRISTINE pair, and they are
                 also the only place this button's wording lives: a pending
                 scheduled message disables it along with the textarea and swaps
                 both for the banner's reason, then puts these back when the block
                 lifts (applyComposerBlockState reads them at boot). -->
            <button id="schedbtn" class="pill schedbtn" type="button"
                    aria-label="Schedule this as a task"
                    title="Schedule this as a task"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2" y="3.2" width="12" height="10.6" rx="1.6" stroke="currentColor" stroke-width="1.3"/><path d="M2 6.6h12M5.4 1.8v2.6M10.6 1.8v2.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
            <button class="send" type="submit" aria-label="Send">
              <svg class="ic-send" width="14" height="14" viewBox="0 0 16 16" fill="none">
                <path d="M8 13V3M8 3L3.5 7.5M8 3l4.5 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <svg class="ic-stop" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <rect x="4" y="4" width="8" height="8" rx="1.5" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </form>
    <!-- Pages published during this conversation, above the footnote so a chip
         appearing never moves the composer the user is typing into. Empty (and
         `hidden`) until a publish is seen — see the #artstrip rule for why the
         attribute and not a style. -->
    <div id="artstrip" hidden aria-label="Pages Claude published in this chat"></div>
    <!-- The second piece of chrome that names the target (the composer
         placeholder is the first), and it ships the kind-FREE wording for the
         same reason: the kind is not known until stat answers, and a sentence
         that flips from a wrong noun to a right one is worse than one that gains
         a noun. setTargetNoun writes both.
         The SECOND sentence is wrapped in its own span, in the markup as well as
         in setTargetNoun's rewrite, because it is the half a narrow column drops
         (fitFootnote) — and it ships that way rather than being wrapped later so
         the very first paint is already measurable. -->
    <div id="footnote">Claude can read and edit files here.<span class="fn-more"> Approvals control what runs without asking.</span></div>

    <!-- home view -->
    <div id="home">
      <div class="inner">
        <div class="home-title"><span class="spark">✻</span><span id="home-file"></span></div>
        <div class="home-sub" id="home-path"></div>
        <div class="annchips" id="annchips-home"></div>
        <form id="card" class="composer">
          <!-- The placeholder names WHAT the chat is about, and that depends on
               the target's KIND, which only paneURL() knows (see setTargetNoun).
               The markup ships the kind-free wording so the box is never empty
               and never wrong: "this project" was hardcoded here and lied about
               every file and every ordinary folder this mode is bound to. -->
          <textarea id="homebox" rows="2" placeholder="Ask Claude…" spellcheck="false"
                    data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false"></textarea>
          <div class="composer-row">
            <select id="hmodel" class="pill model-sel" aria-label="Model"></select>
            <select id="heffort" class="pill effort-sel" aria-label="Effort"></select>
            <select id="hperm" class="pill perm-sel" aria-label="How much Claude may do without asking"></select>
            <span class="spacer"></span>
            <!-- The home card's copy, in the same seat beside Send. Both composers
                 carry one because the chips row above them is the same row
                 (#annchips-home / #annchips-chat), and one list of attached
                 pictures is shared state behind both (shotAttached). -->
            <button id="hviewshot" class="pill viewshot" type="button"
                    aria-label="Screenshot the preview and attach it to this message"
                    title="Screenshot the preview and attach it to this message"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.6 5.4h2.1l1-1.6h4.6l1 1.6h2.1a1 1 0 0 1 1 1v5.6a1 1 0 0 1-1 1H2.6a1 1 0 0 1-1-1V6.4a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><circle cx="8" cy="9" r="2.4" stroke="currentColor" stroke-width="1.3"/></svg></button>
            <!-- The chat composer's copy, in the same seat. Both rows carry one
                 for the reason both carry a screenshot button: a FIRST message is
                 exactly as schedulable as a follow-up, and which of the two you
                 are writing must not decide whether the control exists. The
                 difference is what rides along — there is no session yet here, so
                 the hop carries an empty `session_id` and the task starts a chat
                 of its own. -->
            <button id="hschedbtn" class="pill schedbtn" type="button"
                    aria-label="Schedule this as a task"
                    title="Schedule this as a task"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2" y="3.2" width="12" height="10.6" rx="1.6" stroke="currentColor" stroke-width="1.3"/><path d="M2 6.6h12M5.4 1.8v2.6M10.6 1.8v2.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
            <button class="send" type="submit" aria-label="Send">
              <svg class="ic-send" width="14" height="14" viewBox="0 0 16 16" fill="none">
                <path d="M8 13V3M8 3L3.5 7.5M8 3l4.5 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <svg class="ic-stop" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <rect x="4" y="4" width="8" height="8" rx="1.5" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </form>
        <!-- The two cross-session lists for this target, in ONE block: past
             chats and every page published from here. Both are read as the
             landing page mounts, so switching between them is a class change
             and never a round trip.
             The TAB BAR only exists when both lists have something in them
             (syncLists) — with one list it would be a single tab, which is a
             heading that can be clicked, and the plain .head below is the
             honest version of that. -->
        <div id="lists">
          <div id="listtabs" hidden role="tablist" aria-label="Past chats and published pages">
            <button class="list-tab" type="button" role="tab" id="tab-recent"
                    aria-selected="true" aria-controls="recent">Recent chats</button>
            <button class="list-tab" type="button" role="tab" id="tab-artifacts"
                    aria-selected="false" aria-controls="artifacts">Artifacts<span
                    class="tab-count" id="tabartcount"></span></button>
          </div>
          <!-- Both ship `hidden`: which of them shows (and whether either does)
               is not known until the two reads answer, and a section that
               appears and then empties is worse than one that arrives late. -->
          <div id="recent" hidden>
            <div class="head">Recent chats</div>
            <div id="recentlist"></div>
          </div>
          <!-- Every page Claude has published from this target's working
               directory, across every past session — the one product of a chat
               that outlives it and is not on disk. -->
          <div id="artifacts" hidden>
            <div class="head">
              <span>Artifacts</span>
              <span id="artifactscount"></span>
            </div>
            <div id="artifactslist"></div>
          </div>
        </div>
        <!-- Claude Code's own file-history checkpoints for this file (SPEC
             §34). Ported from the superseded `annotate` template, whose reader
             (shared/file_history.py) was written annotate-agnostic for exactly
             this adoption. FILE targets only — the store keys on one absolute
             file path, so a folder has no chain. LISTED on arrival: the read is
             ~6 ms with neither enrichment nor exact deltas (see loadSnapshots),
             so there is nothing left worth hiding behind a click. -->
        <div id="snaps" hidden>
          <div class="head" id="snapshead">
            <span>Claude snapshots</span>
            <!-- Only ever shown after a failed read: it is the retry, and a
                 "try again" for something that has not failed is a control for
                 nothing. -->
            <button id="snapsretry" type="button" hidden>try again</button>
          </div>
          <div id="snapsbody">
            <div id="snapslist"></div>
            <div id="snapsnote"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- The screenshot viewer: the answer to "I cannot tell what I am about to
       send". A 22px chip thumbnail proves a picture EXISTS; it cannot show what
       is IN it, and a screenshot the user cannot read before sending is one they
       cannot check. Click any thumbnail — the pending chip's, or a sent turn's —
       and the picture opens here at full size.

       A sibling of the whole layout rather than a child of #chat, because #chat
       sets `overflow: hidden`: a viewer living inside it would be clipped by the
       column it is meant to cover. Out here it fills the template's viewport in
       every layout, split or sidebar.

       `hidden` is the ONE answer to "is the viewer open" — no second flag to
       disagree with it — but the hiding itself has to be spelled out in the
       stylesheet, which is the same trap #annbtn and .viewshot each fell into and
       this one fell into as well: the rule below sets `display: flex` to centre
       the picture, that beats the UA's `[hidden] { display: none }` on
       specificity, and the "hidden" viewer sat over the whole pane swallowing
       every click. Caught in the browser, never in the source — a full-bleed
       scrim looks like the app when the app is what is behind it. -->
  <!-- The Schedule button's confirm. ONE of them for both composers, a sibling of
       the layout rather than a child of either: #chat sets `overflow: hidden`, so
       a popup living inside it would be clipped by the column it hangs over, and
       only one composer is ever on screen anyway (openSchedConfirm anchors it to
       whichever button was pressed).
       Not a <dialog>: this is a 260px note pinned to a 32px button, and a modal
       would dim a chat the user is about to be shown again if they say Cancel. -->
  <div id="schedpop" class="schedpop" role="dialog" aria-modal="false"
       aria-labelledby="schedpop-title" hidden>
    <div class="schedpop-title" id="schedpop-title">Schedule this as a task?</div>
    <div class="schedpop-sub">This task will be scheduled to run at a specific time.</div>
    <div class="schedpop-row">
      <button id="schedpop-no" class="schedpop-btn" type="button">Cancel</button>
      <button id="schedpop-go" class="schedpop-btn go" type="button">Continue</button>
    </div>
  </div>

  <div id="shotview" hidden>
    <div id="shotview-scrim"></div>
    <figure id="shotview-box">
      <img id="shotview-img" alt="">
      <div id="shotview-note"></div>
      <figcaption id="shotview-bar">
        <span id="shotview-path" class="mono"></span>
        <span class="spacer"></span>
        <!-- Shown only for a PENDING shot: a sent picture is already in the
             agent's hands, and a Discard that cannot un-send it would be a lie. -->
        <button id="shotview-drop" type="button" class="pill">Discard</button>
        <button id="shotview-close" type="button" class="pill">Close</button>
      </figcaption>
    </figure>
  </div>

  <!-- What was sent: the composed message a receipt stands for, on demand —
       the overview screenshot with its badges, every comment with its label,
       anchor, timing and caveats, and the exact text the agent was handed. -->
  <div id="sentpop" hidden>
    <div id="sentpop-scrim"></div>
    <div id="sentpop-box" role="dialog" aria-label="What was sent to the agent">
      <div id="sentpop-bar">
        <span>What was sent</span>
        <span class="spacer"></span>
        <button id="sentpop-close" type="button" class="pill">Close</button>
      </div>
      <div id="sentpop-body"></div>
    </div>
  </div>

<script>
// THE chat: ./agent.py behind it
// (start/poll/decide/history/sessions), permission cards, run/session params,
// resume semantics. It is the RIGHT pane of a split for a file and for an app
// folder, and the WHOLE window for an ordinary folder, which has no pane at all
// (D239) — so "the right pane of a split view", which this comment used to say,
// is true of two of its three shapes and the layout is paneURL's business, not
// this description's.
// It began as a 1:1 fork of the `claude` template's chat and
// is now the only one — `claude` is deleted, this mode is offered on files and
// on every directory, and the one feature that never came across is the annotate
// comment handoff (claudeComments/claudeReturn): annotate hands off to
// `_mode=claude`, which no longer resolves, and the return-trip existed to show
// the edited file — which the left pane already does.
//
// A chat must never reload out from under a live conversation: the runtime
// watches _file (LR-1), so Claude's own edit to the target would reload THIS
// frame mid-stream — killing the poll loop and orphaning the run. The left
// preview iframe is its own document and keeps live-reloading on its own.
fused.autoReload(false);

// The agent is this template's own copy (templates are self-contained, no
// cross-template imports).
const AGENT = "./agent.py";

// ── vendored markdown libs (marked/DOMPurify/hljs), same relative-path style
// as tableau/template.html:364 — templates render at /render?path=…, so a
// relative <script src> here would resolve against /render, not this
// template's own directory; folding this template's own absolute directory
// into the path (fused.rawUrl(BASE_DIR + rel) instead of a bare relative rel)
// is what makes it resolve correctly regardless.
const HTML_PATH = new URLSearchParams(window.location.search).get("path") || "";
const BASE_DIR = HTML_PATH.slice(0, Math.max(HTML_PATH.lastIndexOf("/"), HTML_PATH.lastIndexOf("\\")) + 1);
const loadScript = (rel) => new Promise((ok, bad) => {
  const s = document.createElement("script");
  s.src = fused.rawUrl(BASE_DIR + rel);
  s.onload = ok; s.onerror = () => bad(new Error("failed to load " + rel));
  document.head.appendChild(s);
});
{
  const hljsTheme = document.createElement("link");
  hljsTheme.rel = "stylesheet";
  hljsTheme.href = fused.rawUrl(BASE_DIR + "vendor/hljs.css");
  document.head.appendChild(hljsTheme);
}
// Fire-and-forget, not gating anything below: nothing in this file calls
// renderMd() synchronously at boot — every call site sits downstream of an
// `await fused.runPython(...)` round trip (the poll loop, resumeRun, the
// boot-time run probe), which dwarfs the time to load three small
// same-origin files. Unlike tableau/usd this script isn't wrapped in its own
// async boot IIFE to `await` this — that would mean restructuring the whole
// file, out of scope here.
//
// A failed load must not fail SILENTLY: renderMd()'s own fallback (see
// below) keeps a reply from going blank, but the user still needs to know
// markdown is degraded — addError() is a plain function declaration,
// hoisted, so it's callable here even though it's defined later in the file.
(async () => {
  try {
    await loadScript("vendor/marked.min.js");
    await loadScript("vendor/purify.min.js");
    await loadScript("vendor/highlight.min.js");
  } catch (err) {
    addError("Markdown libraries failed to load (" + err.message + ") — replies will show as plain text.");
  }
})();

const log = document.getElementById("log");
const logwrap = document.getElementById("logwrap");
const box = document.getElementById("box");
const chatEl = document.getElementById("chat");
const sessionEl = document.getElementById("session");
const homebox = document.getElementById("homebox");

// Focus a composer — unless this page is a PREVIEW IN THE EXPLORER'S PANE.
//
// The pane is a same-origin iframe, so an input that focuses itself here takes
// document focus away from the shell, and the listing's arrow keys stand down
// the moment focus leaves it: previewing a file stopped the user browsing file
// to file from the keyboard. `window.__fusedNoAutofocus` is the shell's signal
// (runtime.js, from `_nofocus=1` on this frame's URL) and it goes false the
// instant the reader touches this page — so clicking into the pane, or opening
// this chat full-screen, focuses exactly as it always did. A standalone page
// never sees the flag at all.
//
// Every composer focus goes through this, not only the boot ones: after the
// first gesture it is a plain .focus(), so there is nothing to gain from
// keeping two spellings and one obvious way for the next boot-path focus to
// re-break the pane.
function focusBox(el) {
  if (window.__fusedNoAutofocus) return;
  el.focus();
}

// The target file arrives as the read-only _file param (template contract).
const FILE = fused.params.get("_file") || "";
const BASENAME = FILE.split("/").pop();

// Chat-only host: this document is framed as a SIDEBAR beside the shell's own
// preview of the same target (the explorer's `_side` split — Preview.tsx and
// PreviewSidebar.tsx), so our own left half would be that file previewed twice
// in one window, the inner copy a few hundred pixels wide. The host says so with
// `chat_only=1`, and we take the pane away: no second preview, no divider, and
// the chat column runs full width.
//
// The ANNOTATE SWITCH is the one thing that does not go with the pane, and it
// used to: the pane was what a note pointed at, so removing the pane removed the
// feature, and #456 shipped a sidebar from which nothing could be annotated at
// all. The switch is kept and RETARGETED instead — at the host's own content
// pane, the middle column, which is the preview this chat is beside and the one
// the reader is actually looking at. That target is found by mark, not by
// arrangement: the shell stamps `data-fused-annotate-target` on the content
// iframe it is showing (Preview.tsx) and we read it back through
// `window.parent.document`, same-origin, no postMessage (D3/D4). A host that
// marks nothing — a foreign embedder, a cross-origin parent, or our own shell
// on a surface with no content pane — leaves the switch hidden and this page
// degrades to exactly the chat it was. See the annotate target seam below.
//
// A HOST fact, not view state, which is why it is read once into a const and
// never written: nothing in here toggles it, and someone who reaches this URL
// without the param wants the full split. The teardown is the template's
// existing NO-PANE path (enterNoPane, below) — the same designed absence a
// folder with no app entry gets — so this adds a reason to enter that state
// rather than a second layout to maintain.
//
// Read off THIS FRAME'S OWN URL, not through fused.params, and that distinction
// is the whole difference between a host fact and view state. This page sets no
// `_fusedParamBoundary`, so its param target is the SHELL's URL (D46/D72) —
// which is exactly right for `split`, `session_id`, `annotations` and the rest
// (they belong in the shell URL, and so in a bookmark), and exactly wrong for
// this: the host chose the layout when it built the iframe src, and putting that
// choice on the shell URL would let it outlive the host that made it. `_file`
// rides the same way for the same reason, and is special-cased in the runtime
// to prove it; a leading underscore is reserved (unreadable through
// fused.params), so this one is read directly.
const CHAT_ONLY = new URLSearchParams(location.search).get("chat_only") === "1";

if (!FILE) {
  document.body.innerHTML = '<div id="msg">No file selected (missing _file param).</div>';
  throw new Error("claude template: missing _file");
}

document.getElementById("banner-sub").textContent = BASENAME;
document.getElementById("home-file").textContent = BASENAME;
document.getElementById("home-path").textContent = FILE;
document.title = "Claude — " + BASENAME;

// ── live app state: what the agent can SEE of the running app ──
// Without this the agent is editing a page it cannot look at: it has no way to
// tell whether its own change rendered, whether the console filled with errors,
// or whether the page went blank. Two channels close that, and both are served
// from here:
//
//   push — appStateSnapshot() rides along with each message (appStateBlock).
//   pull — the agent's `app_state` MCP tool, answered from the poll loop, for
//          after it edits something and the snapshot has gone stale.
//
// It is deliberately TEXT ONLY — structure, own-text, params, console lines —
// for the same reason the annotation anchors are (#372): a description Claude
// can map straight back to the app's HTML source beats pixels it has to guess
// from. Nothing here is allowed to break the chat: the framed document can be
// mid-navigation, absent (no app entry — see the loader below) or cross-origin,
// so every access is guarded and a failure degrades to LESS state, never to a
// thrown send.
const APP_STATE_MAX_LOGS = 50;    // ring buffer: a live-reloading page logs forever
const APP_STATE_MAX_TEXT = 300;   // per console line / text snippet
const APP_STATE_MAX_NODES = 60;   // elements in the DOM outline
const APP_STATE_MAX_DEPTH = 4;    // how deep the outline descends
// Text per OUTLINED element, deliberately tighter than a console line: this one
// is paid 60 times over, and the whole snapshot is meant to be a few KB rather
// than a transcription of the page's copy.
const APP_STATE_MAX_NODE_TEXT = 120;
// ── caps on annotation screenshots ──
// Same spirit as the outline caps above: a crop is an ATTACHMENT to an anchor,
// not the anchor itself, so it is allowed to cost a little and never a lot.
// Longest edge of a crop. 640 is enough to read a label or see that a chart drew
// nothing, and small enough that the agent's own image budget is not the story.
const SHOT_MAX_EDGE = 640;
// Encoded bytes per crop. Over budget, the crop is halved and re-encoded (PNG has
// no quality dial) — and if it is STILL over, no crop is better than one that
// dominates the turn.
const SHOT_MAX_BYTES = 300 * 1024;
// px² below which there is nothing to look at — a 0x0 rect (display:none), or a
// hairline border. Cheaper to say so than to write a file nobody can read.
const SHOT_MIN_AREA = 64;
// The whole capture's budget. Past it the send goes out WITHOUT shots: a user
// losing their message because a screenshot was slow is not a trade we make.
const SHOT_TIMEOUT_MS = 6000;
// Elements whose computed style the capture will inline before it gives up. Each
// one costs a getComputedStyle plus ~340 property reads and adds a few KB to the
// serialized SVG, so this is the cap that keeps a big app from turning the send
// into a freeze. Past it the capture is finished with what it has and every crop
// says so.
const SHOT_MAX_ELEMENTS = 3000;
// Elements between yields to the event loop during that walk. The reason it is a
// number and not "never": a synchronous walk cannot be interrupted by a timer, so
// without these yields SHOT_TIMEOUT_MS below could not fire and the chat UI froze
// for the whole capture. Small enough that a frame is never missed by much, large
// enough that the yields themselves are not the cost.
const SHOT_STYLE_CHUNK = 200;
// ── pictures inside the picture ──
// An `<svg>` loaded through an `<img>` renders in a mode with NO external resource
// loading — no network, at all, whatever the origin — so every `<img src="http…">`
// and every `background-image: url(http…)` inside the foreignObject draws as a
// broken glyph. The only src such an image can follow is a `data:` one, so the
// capture fetches each URL and rewrites it before serializing (shotInlineImages).
// Distinct URLs resolved per capture. Each one is a fetch and a base64 string in
// the serialized SVG, so this is the cap that keeps a gallery from turning one
// screenshot into a megabyte of markup and a second of network.
const SHOT_IMG_MAX = 30;
// Bytes past which a fetched image is re-encoded down to the size it is DRAWN at
// rather than embedded whole. base64 costs a third on top, and a 4 MB hero photo
// displayed at 600px wide is 5.5 MB of markup for 600px of picture.
const SHOT_IMG_MAX_BYTES = 256 * 1024;
// The tail of the capture's budget reserved for those fetches. Without a reserve
// the style walk — which stops exactly AT the deadline — could spend all of it and
// leave every image a placeholder in a capture that had time to spare.
const SHOT_IMG_MS = 1500;
// ── the whole-pane shot ──
// A crop answers "what does THIS element look like". It cannot answer "the whole
// layout is wrong", "these two panels overlap", "everything shifted down" — none
// of which has a single element as its subject, and for which a crop actively
// hides the answer by cutting away the relationship that IS the bug. So both
// composers carry a button for a picture of the whole visible pane, which is ONE
// encode of a bitmap shotPane already knows how to make.
//
// Its own caps, and the edge cap is emphatically not SHOT_MAX_EDGE: a whole pane
// squeezed into 640px is unreadable, which defeats the only reason to send one.
// 1600 is ~6x the pixels of a 640px crop, which is why WebP's quality dial matters
// here more than anywhere else (see shotEncode).
const SHOT_VIEW_EDGE = 1600;
const SHOT_VIEW_BYTES = 900 * 1024;
// The block's delimiter, duplicated in agent.py (which strips it back out of
// everything user-facing) and in stripAppStateBlock below — a test holds the
// three together, because a drift is invisible until the chat starts showing
// the user a screenful of JSON they never typed (D146).
const APP_STATE_TAG = "live-app-state";
// The whole-pane screenshot's block delimiter. A separate, tag-delimited block
// rather than a field on the annotation JSON for two reasons: a picture of the
// whole pane belongs to the MESSAGE, not to any one anchor (the overview badges
// all of them at once), and a pane shot can ride a message with NO annotations,
// where there is no annotation block to put it in. Tag-delimited like the app-state block so its strip is
// position-independent — the annotation block's is not, and only one such fragile
// strip is affordable.
//
// The writer went away once (the per-message toggle was deleted) and the READER
// never did, because sessions already on disk carry these blocks and a restored
// transcript has to peel one off rather than render a screenful of JSON nobody
// typed. The screenshot button writes this same shape again rather than inventing
// a second one: every reader of it — stripPaneBlock, MARKER_VIEW, isMarkerOnly,
// the re-attach probe — already exists and already agrees.
const PANE_SHOT_TAG = "pane-shot";
// Why there is nothing to say about the app. ONE const because two callers say
// it: the snapshot itself, and the pull channel's fallback answer (appStatePull)
// — a divergence there would tell the model two different stories about the same
// condition (D146: the duplicated rule gets a test, not a comment).
// It enumerates CAUSES, so it may only name conditions that can actually
// produce it. "A project may have no app entry" used to be one and is not any
// more: a folder with no app entry has no pane at all now (D239), and no pane
// means no `app_state` tool in the run's roster — the model cannot ask, so this
// sentence can never be the answer to it. Naming that case here would have the
// snapshot explain a structural absence as a failed read.
//
// That invariant holds only because THIS PAGE is what tells the run whether there
// is a pane: `has_pane` rides every start call (see the start payload in
// submitChat) and agent.py takes it as given. While the server re-resolved the
// kind from disk per turn it was false in precisely the case that matters — a
// session that scaffolds an app INTO an ordinary folder has an app folder on disk
// by turn 2 and still no pane on screen, so the tool was offered, called, and
// answered with this very sentence.
const APP_STATE_UNREADABLE = "the left pane's document could not be read (a "
  + "file may have no preview view, or the pane has not finished loading), so "
  + "nothing is known about its title, url or DOM right now";
// {level, text, source?, line?, ts}. PARENT-side, deliberately: the buffer has
// to outlive the framed app's own reloads, which is exactly what makes "that
// error was already there before my edit" answerable.
const appLogs = [];
let appEntry = "";                // the entry html the pane is rendering
let appLoads = 0;                 // loads seen, so a RELOAD can be told apart

function clipText(value, max) {
  const s = value === null || value === undefined ? "" : String(value);
  return s.length > max ? s.slice(0, max) + "…" : s;
}

function pushAppLog(level, text, source, line) {
  const entry = { level, text: clipText(text, APP_STATE_MAX_TEXT),
                  ts: Math.round(Date.now() / 1000) };
  if (source) entry.source = clipText(source, 200);
  if (line) entry.line = line;
  appLogs.push(entry);
  while (appLogs.length > APP_STATE_MAX_LOGS) appLogs.shift();
}

// console.error's arguments are anything at all, including cross-realm objects
// (the frame's Error is not this realm's Error, so `instanceof` is useless here).
function fmtLogArg(v) {
  if (typeof v === "string") return v;
  if (v && typeof v.message === "string") return v.message;
  try {
    const json = JSON.stringify(v);
    return json === undefined ? String(v) : json;
  } catch (err) {
    return String(v);  // circular, or a throwing toJSON
  }
}

// The window the app runs in — #leftframe's OWN, with no descent. #372 moved
// the pane from /embed/<app> (fused-render's React shell, with the app nested
// one iframe deeper) to /render?path=<entry>, the raw rendered document: the
// frame's contentDocument IS the app's document now, so the frame-walking layer
// that used to live here is gone rather than merely unused.
//
// There is no third pane shape to describe here any more. An ordinary folder had
// one — /embed, the file browser, whose DOM this used to report — and D239 took
// the pane away entirely, which also took away the whole question of whether a
// reading of OUR UI could be mistaken for a reading of the user's code: for that
// target the `app_state` tool is not in the run's roster at all (agent.py), so
// nothing calls this.
//
// Returns null — never this chat's own window — in the three cases that are
// genuinely "no app":
//   * the pane could not open its preview, so the loader below REMOVED the frame
//     (and the no-pane target removed the whole column);
//   * about:blank, the placeholder before the first real document;
//   * unreachable (cross-origin, or mid-navigation).
function appWindow() {
  try {
    if (!annFrame || !annFrame.isConnected) return null;
    const win = annFrame.contentWindow;
    if (!win || !win.document) return null;
    if (String(win.location.href) === "about:blank") return null;
    return win;
  } catch (err) {
    return null;
  }
}

// Wrap one window's console + error events. Returns true when THIS document was
// newly wrapped, which is also how a reload is detected (see watchApp).
function watchWindow(win) {
  try {
    const doc = win && win.document;
    // Marked on the DOCUMENT, not the window: a same-origin navigation keeps the
    // window proxy but replaces the global, so a flag there would survive as
    // little as the wrapper itself does — and re-wrapping is exactly what a
    // reload needs.
    if (!doc || doc.__fusedAppWatched) return false;
    doc.__fusedAppWatched = true;
    // console.log is deliberately NOT wrapped: an app's chatter is not news, and
    // 50 ring-buffer slots spent on it would push out the errors that are.
    for (const level of ["error", "warn"]) {
      const original = win.console && win.console[level];
      if (typeof original !== "function") continue;
      win.console[level] = function (...args) {
        try { pushAppLog(level, args.map(fmtLogArg).join(" ")); } catch (err) { /* never */ }
        // Call through: the app's own logging (and the devtools output the user
        // may be reading) must behave exactly as it did uninstrumented.
        return original.apply(win.console, args);
      };
    }
    win.addEventListener("error", (ev) => {
      pushAppLog("error", (ev && (ev.message || (ev.error && ev.error.message)))
                 || "script error", ev && ev.filename, ev && ev.lineno);
    });
    win.addEventListener("unhandledrejection", (ev) => {
      const reason = ev && ev.reason;
      pushAppLog("error", "unhandled promise rejection: " + fmtLogArg(reason));
    });
    return true;
  } catch (err) {
    // Cross-origin, navigating, or already torn down. The snapshot simply has
    // no console entries to report; the chat is unaffected.
    return false;
  }
}

// Called from #leftframe's `load` (beside the annotation rewiring) and once at
// boot. That is enough BECAUSE of the /render framing: a live-reload replaces
// the frame's own document, so `load` fires again — under the old /embed nesting
// it was the INNER frame that navigated and only a timer could see it.
//
// The one thing this cannot win is the race against the app's FIRST inline
// script, which runs before `load`: logging from there is still missed. The DOM
// outline shows what that script did or failed to do, and everything from the
// next tick onwards is captured.
function watchApp() {
  const win = appWindow();
  if (!win) return;
  if (!watchWindow(win)) return;
  appLoads++;
  // Mark the reload IN the buffer rather than clearing it: "these three errors
  // were there before, this one appeared after your edit" is the single most
  // useful thing the buffer can tell the agent, and clearing it destroys that.
  if (appLoads > 1) pushAppLog("reload", "the pane reloaded (a file it uses changed)");
}

// The app's params from its URL, for before its runtime has booted.
function searchParamsOf(search) {
  const out = {};
  new URLSearchParams(search || "").forEach((v, k) => { out[k] = v; });
  return out;
}

// This page sets no `_fusedParamBoundary`, so the pane's runtime treats OUR URL
// as its param target (D46/D72) and its `getAll()` hands back the app's params
// merged with this chat's own bookkeeping. Dropped by name: telling the model
// that the app is "running with" session_id and split is worse than telling it
// nothing about params at all.
// `path` is in here for a different reason: it is /render's own plumbing (the
// pane is /render?path=<entry>), so it is on every rendered page and is never
// something the app itself defined. `annotations` likewise — those are the
// user's notes, already sent in their own block.
// `leftmode` and `paneview` are in here for the `split` reason: they are this
// chat's own layout bookkeeping (which view the left pane frames, which of the
// two views a narrow host shows), and reporting them to the model as params the
// APP is running with would be describing our chrome as its state. `chat_only`
// is the extreme case of that: it describes THIS DOCUMENT'S HOST (see
// CHAT_ONLY), and there is no pane for it to be a param of.
// `msg` is here for the `session_id` reason: it is this chat's own bookkeeping
// (which turn a Tasks-list link asked to land on), and reporting it to the model
// as a param the APP is running with describes our navigation as its state.
const CHAT_PARAMS = new Set(["_file", "_mode", "session_id", "run", "split",
                             "model", "effort", "permission", "annotations",
                             "annmode", "leftmode", "paneview", "chat_only",
                             "path", "msg"]);

function appParamsOf(all) {
  const out = {};
  for (const key of Object.keys(all || {})) {
    if (!CHAT_PARAMS.has(key)) out[key] = clipText(all[key], 200);
  }
  return out;
}

// Elements whose text is code, not content: listed, never quoted from.
const QUIET_TAGS = new Set(["script", "style", "noscript", "template"]);

// A structural outline of the body — tag, id/class, own text — NOT outerHTML,
// which for a real app is tens of KB of markup that would dominate every turn.
//
// Every node also carries `path`: annPathOf's identifier, the SAME one the
// annotation anchors use. That is the point of routing through annPathOf rather
// than growing a second path builder — the element the user pinned and the node
// the agent reads in the outline are then literally the same name, so it can act
// on a pin without guessing, and annResolve round-trips either one. A second
// implementation of the scheme is precisely what D146 forbids.
//
// `budget` is shared across the whole walk so the total node count is capped,
// not just each level's, and any elision is reported (`truncated`): truncation
// the agent cannot see is a lie about the page, since it would read an elided
// element as an absent one.
function outlineNode(el, depth, budget, doc) {
  budget = budget || { left: APP_STATE_MAX_NODES };
  const out = { tag: String(el.tagName || "?").toLowerCase() };
  if (el.id) out.id = clipText(el.id, 80);
  const path = doc ? annPathOf(el, doc) : null;
  if (path) out.path = clipText(path, 400);
  const cls = typeof el.className === "string" ? el.className.trim() : "";
  if (cls) out.class = clipText(cls, 120);
  const kids = el.children || [];
  // Own text only (the element's direct text nodes): textContent on a container
  // is the whole subtree, which would repeat the entire page at every level.
  // Script/style bodies are excluded: their "text" is source the agent can read
  // in the file properly, and a clipped 120 chars of it in a structural outline
  // is noise at best and a misleading fragment at worst (measured against a real
  // app, whose outline came back carrying the first line of its own script).
  const own = [];
  if (!QUIET_TAGS.has(out.tag)) {
    for (const node of el.childNodes || []) {
      if (node.nodeType === 3 && node.nodeValue && node.nodeValue.trim()) {
        own.push(node.nodeValue.trim());
      }
    }
  }
  let text = own.join(" ");
  if (!text && !kids.length && !QUIET_TAGS.has(out.tag) && el.textContent) {
    text = String(el.textContent).trim();
  }
  if (text) out.text = clipText(text, APP_STATE_MAX_NODE_TEXT);
  if (!kids.length) return out;
  if (depth >= APP_STATE_MAX_DEPTH) {
    out.truncated = kids.length + " deeper element(s) not shown";
    return out;
  }
  out.children = [];
  for (const kid of kids) {
    // Our own pin layer is not part of the app. In the sidebar layout it is
    // injected into the app's own <body> (annInjectLayer), so unlike every other
    // piece of this UI it CAN be reached from here — and an element describing
    // the reader's annotations, presented to the agent as part of the page it is
    // editing, is a lie about the source. Skipped without spending budget: it is
    // one empty div, and its shadow tree is not walkable from here anyway.
    // The attribute is spelled out rather than read from ANN_LAYER_MARK because
    // that const is declared a thousand lines below this one, and the walk has
    // no business depending on the annotation section having been reached.
    if (kid.hasAttribute && kid.hasAttribute("data-fused-annotate")) continue;
    if (budget.left <= 0) {
      out.truncated = (kids.length - out.children.length) + " sibling(s) not shown";
      break;
    }
    budget.left--;
    out.children.push(outlineNode(kid, depth + 1, budget, doc));
  }
  return out;
}

// What the user is looking at, right now, as a compact JSON-serialisable
// object. Returns null when we learned NOTHING — a turn with nothing to say
// about the app must look exactly like a turn from before this feature.
function appStateSnapshot() {
  const state = {};
  if (appEntry) state.entry = appEntry;
  let known = false;
  // Resolved fresh on every call: the pane reloads on its own, so the document
  // that was the app a moment ago may be a different one now.
  const win = appWindow();
  if (!win) {
    // No document to describe. `unreadable` is set but does NOT count as
    // knowledge on its own: a frame that simply has not loaded yet is not worth
    // a block. It DOES ride along once there is something else to say — and the
    // console usually says why (the loader logs a failed open), which is the
    // case where this sentence earns its place.
    state.unreadable = APP_STATE_UNREADABLE;
  } else {
    try {
      const doc = win.document;
      if (doc.title) state.title = clipText(doc.title, 200);
      if (doc.body) { state.dom = outlineNode(doc.body, 0, null, doc); }
      state.url = clipText(String(win.location.pathname + win.location.search), 500);
      // The app's OWN view of its params (its runtime does the merging and
      // defaulting), falling back to its query string before it has booted.
      const params = appParamsOf(win.fused && win.fused.params && win.fused.params.getAll
        ? win.fused.params.getAll() : searchParamsOf(win.location.search));
      if (Object.keys(params).length) state.params = params;
      known = true;
    } catch (err) {
      state.unreadable = "could not read the pane's document: " + err.message;
    }
  }
  if (appLogs.length) { state.console = appLogs.slice(); known = true; }
  return known ? state : null;
}

// The PULL channel's view of the same snapshot. Push and pull read one snapshot
// function and disagree about what `null` means, on purpose:
//
//   push — null is "not worth a block". A turn taken while the pane reloads must
//          look exactly like a turn from before this feature, not carry a
//          <live-app-state> block whose entire content is "still loading".
//   pull — null is not an answer at all. The MODEL asked, its tool call is
//          BLOCKED on the reply, and agent.py turns a non-dict into the
//          permanent decision "the window could not read the app's state" — a
//          hard error, for a condition that is usually over in a few hundred ms.
//
// So the pull side never hands `null` down: answerAppState retries a null for a
// bounded number of polls (the mid-reload case, which resolves), and then falls
// back to THIS — an explicit, non-fatal sentence the model can act on (the
// no-app-entry case, which never resolves and must not spin to the tool timeout).
//
// `entry` rides along when known; `title`/`url`/`params`/`dom` deliberately do
// NOT. We could not read the app's window, so there is no honest source for
// them — and the one wrong answer here is describing THIS chat's window as the
// app's.
function appStatePull() {
  const state = appStateSnapshot();
  if (state) return state;
  const out = { unreadable: APP_STATE_UNREADABLE };
  if (appEntry) out.entry = appEntry;
  return out;
}

// The block prepended to the user's message. Delimited and labelled, because
// the model has to be able to tell the user's words from a machine-written
// description of their screen. No trailing separator — composeOutgoing owns the
// joining, so there is exactly one place that decides the message's shape.
function appStateBlock(state) {
  if (!state) return "";
  // `dom_path` where the outline was written to a file (appStateFile), `dom`
  // where it had to stay inline. The preamble has to describe whichever one
  // actually arrived, or the model goes looking for a key that is not there.
  const outline = state.dom_path
    ? "The DOM outline is the JSON file at `dom_path` — read it when you need "
      + "the structure. "
    : "";
  return "<" + APP_STATE_TAG + ">\n"
    + "A snapshot of the " + paneNoun + " the user is looking at in the left "
    + "pane, taken as "
    + "they sent this message. " + outline
    + "`path` on each node is the same anchorPath the "
    + "annotations use, so a pin and an outline node name the same element. It "
    + "goes stale the moment you edit anything — call the app_state tool for a "
    + "fresh read.\n"
    + JSON.stringify(state) + "\n</" + APP_STATE_TAG + ">";
}

// Distinct names within the same millisecond; two sends cannot share a file.
let appStateSeq = 0;

// The snapshot with its DOM outline moved OUT to a file, or unchanged if that
// could not be done.
//
// The outline is by far the largest thing the page sends, and composeOutgoing
// puts it in the MESSAGE — so the CLI keeps it in its own session transcript and
// re-reads it on every later turn of the session. A ten-message conversation
// carried ten full outlines in context permanently, all but the newest already
// stale, and the block's own preamble says as much. A path costs the model one
// Read when it actually wants the tree and nothing at all when it does not.
//
// It goes in the screenshot directory, which is the same kind of artifact under
// the same argument: a private, short-lived record of what was on the user's
// screen, handed to the agent and junk once the turn is over. That directory is
// already 0700-enforced, already pruned on a TTL and a count, and already the
// one path `--allowed-tools` lets Read touch without raising a card — none of
// which is worth a second copy of for a second kind of file.
//
// Falls back to the inline outline rather than dropping it: no directory, or a
// failed write, must not leave the agent knowing LESS about the user's screen
// than it did before this existed.
async function appStateFile(state) {
  if (!state || !state.dom) return state;
  try {
    const dir = await shotDirPath();
    const path = shotJoin(dir, "appstate-" + Date.now() + "-"
                               + (++appStateSeq) + ".json");
    await fused.uploadFile(path, new Blob([JSON.stringify(state.dom)],
                                          { type: "application/json" }));
    const out = Object.assign({}, state, { dom_path: path });
    delete out.dom;
    return out;
  } catch (err) {
    console.warn("app-state outline kept inline:", err && err.message);
    return state;
  }
}

// The chat mode, which the pane must never frame: `claude` is THIS view,
// and framing it would nest the split view inside its own left pane,
// recursively. It is not a preview of the target, which is the only thing the
// pane is for. A single-element set rather than a bare `e.mode !== "claude"`
// because it is the shape the exclusion has always had and the next chat-ish
// mode joins it by adding a name. A sibling file-scoped chat mode used to be
// listed here too; it is deleted (there is one chat template now, and it is
// this one), and a dead name in a filter that reads stat's entries is worse
// than no name — it implies a mode that can still come back from stat, and it
// can't.
const PANE_SKIP_MODES = new Set(["claude"]);

// What the left pane should frame. TWO shapes and a NO-PANE case (D235, D239):
//
//   * an APP FOLDER — the app's entry html (its first top-level page carrying
//     `<meta name="fused-app">`, D301 — the same rule as the shell's "Open as
//     app" button), resolved by ./app.py;
//   * a FILE — the file in its OWN default view, i.e. exactly what the
//     explorer's preview pane would show it in: `.py` in `code`, `.parquet`
//     in `duckdb`, an `.html` page rendered as itself. That is what makes the
//     annotation tools usable while editing a standalone file, which is the
//     whole point of binding this mode to the file keys (D235).
//   * an ORDINARY FOLDER — NO PANE. The chat is full width; paneURL answers
//     `null` and the loader below removes the column, the divider and the whole
//     control strip. See enterNoPane for why that is a designed state rather
//     than a missing element, and D239 for why the pane it replaces was not
//     worth its width: framing /embed there put fused-render's own file browser
//     beside the chat, and nothing flowed BACK from it — no postMessage, no
//     listener, so a click in it attached nothing, fed nothing to the composer
//     and changed no agent context.
//
// Framed via /render, never /embed: /embed serves the React shell, which nests
// the target one iframe deeper, putting its document out of the annotation
// layer's reach (the anchor listeners would wire the shell document and never
// see a click). With the folder embed gone there is no exception left.
//
// The view is also SWITCHABLE for a file target (`leftmode`): a `.md` file's
// default is the markdown view, and "show me the source instead" is an ordinary
// thing to want mid-conversation. The candidates come from the one stat call
// below and nowhere else — see paneOfferable / buildLeftPicker.

// stat's entries that this pane may offer, in stat's own order. Two exclusions:
//   * the chat modes (PANE_SKIP_MODES above);
//   * `conditional` entries, whose gate verdict lives behind /api/fs/conditions
//     and is deliberately NOT fetched here (CT-12: an unresolved gate reads as
//     "not offered"). Offering one would mean offering a view that may not
//     apply to this file at all, and resolving one would mean a second network
//     round trip before the pane can show anything.
// The first element is therefore the DEFAULT — the shell's `defaultTemplate`
// rule, unchanged by the picker.
const paneOfferable = (entries) =>
  (entries || []).filter((e) => !e.conditional && !PANE_SKIP_MODES.has(e.mode));

// Resolved once by paneURL() and reused by the picker and by every later swap.
// A second /api/fs/stat just to fill the <select> would pay the call twice on
// open and could disagree with what the pane is actually framing if a binding
// changed in between — and a hardcoded extension → modes table would drift from
// the registry on the next rebinding and ignore a user override entirely (§16),
// which is the same mistake the default-mode rule above exists to avoid.
let paneEntries = [];
let paneRemote = false;
let framedMode = null;   // the mode #leftframe is showing right now
// True once enterNoPane has run: this target has no left pane at all, the column
// and its whole control strip are out of the document, and every function that
// would otherwise write to them (or to a param describing a layout that no
// longer exists) checks this and returns. See enterNoPane.
let noPane = false;

// The chosen entry: `leftmode` if it names one that is present and offerable,
// else the default. Unknown / no-longer-offered falls back SILENTLY, the same
// forgiving rule the shell applies to an unknown `_mode` (SPEC PT-9) — a param
// left over from a renamed template, or carried across to a file of another
// type, must not turn the pane into an error page.
function curLeftEntry() {
  const want = fused.params.get("leftmode") || "";
  return paneEntries.find((e) => e.mode === want) || paneEntries[0] || null;
}

// One stat entry → the iframe src. Split out of paneURL so a picker switch can
// re-derive the URL from the entry list it already has, with no re-stat.
function paneSrcFor(t) {
  // `_render` is a shell sentinel (PT-12), not a template folder: it means "the
  // file renders itself", which is a bare /render on the file.
  if (t.mode === "_render") return "/render?path=" + encodeURIComponent(FILE);
  if (!t.path) throw new Error("the default view for this file has no template (" + t.mode + ")");
  // `_remote=1` forwards stat's remote flag exactly as the shell's own iframe
  // does, so a template that prefers ranged HTTP reads over local file I/O
  // still gets the hint here.
  return "/render?path=" + encodeURIComponent(t.path)
    + "&_file=" + encodeURIComponent(FILE)
    + (paneRemote ? "&_remote=1" : "");
}

// EVERY piece of chrome that names the target goes through here, and the noun has
// to match the target's KIND — the same three shapes, decided by the same
// predicate, as the system prompt (agent.py `_split_system_prompt`, keyed on
// whether shared/app_entry resolves an entry html): an app folder is a "project",
// a folder with no entry is a "folder", a file is a "file". Saying "project" over
// ~/Downloads is the same lie in the placeholder as it is in the prompt.
//
// TWO pieces of chrome, not one, and that is the point of routing them through a
// single function. The composer placeholder was made kind-derived and the
// FOOTNOTE under it was missed, so a chat about `notes.md` still read "files in
// this project" the moment it left the home view. A second, independent kind
// lookup would have been a second thing to forget; one writer cannot disagree
// with itself. A test asserts no user-visible noun is hardcoded in the markup.
//
// Called from paneURL's three branches rather than computed up front because the
// kind is not known until stat has answered (and, for a directory, until ./app.py
// has said whether an entry resolves) — which is exactly the work paneURL is
// already doing, so this costs no extra round trip. Until then the markup's
// kind-free "Ask Claude…" and "files here" stand.
//
// `targetNoun` is exported to the rest of the page as the ONE answer to "what
// kind of thing is this chat about", so nothing else re-derives it. "" until
// paneURL answers.
let targetNoun = "";
// What to CALL the left pane's document, which is a different question from what
// to call the target and is the half that was missed twice. For an app folder the
// pane is the user's own running app and "the app" is the honest word; for a file
// it is fused-render's preview OF their file, where "the app" is a plain lie —
// there is no app, and `_system_prompt` has meanwhile told the model that pane is
// OUR viewer and never to edit it. So the two halves of a single turn contradicted
// each other, with an edit to `templates/code/template.html` as the invited
// action. "preview" is the kind-free word and is true of both, so it is also the
// value the markup ships and the value this holds until stat answers.
let paneNoun = "preview";

// Everything that names the pane, rewritten in ONE place. Called from
// setTargetNoun (never on its own) so the noun and the chrome that speaks it
// cannot get out of step, and it covers exactly the sinks a person or the model
// reaches: two spoken attributes on the annotate switch, four on the two
// screenshot buttons (there are two composers, home and chat, and both carry one),
// and — live, because they are built per message — the chip's label, the receipt
// thumbnail's `alt` and the two block preambles further down.
function applyPaneNoun() {
  // Gated like the title below (Bugbot, PR #665): while a mode is on the seat
  // IS Done (or the stop clock), and a noun resolving mid-mode must not make
  // assistive tech announce Comment over a Done face. The armed writers own
  // the armed names; annSetMode's disarm re-runs the idle one with the noun
  // this function just stored.
  if (!annOn) annBtn.setAttribute("aria-label", "Comment on the " + paneNoun);
  // Not written directly: annSetMode rewrites this title on every disarm, so the
  // idle wording has to have exactly one definition or the noun comes back wrong
  // the first time the user toggles the switch off. That is how it broke here.
  if (!annOn) annBtn.title = annIdleTitle();
  // ONE sentence, and it leads with the VERB. The first version's tooltip opened
  // with "Take a screenshot of the whole … pane" and then spent a parenthesis
  // explaining when to use it, which is the shape of a manual rather than of a
  // label — and it was attached to a button whose picture-frame glyph read as
  // "insert an image". The complaint was that the control was not intuitive; the
  // fix is that its name is now what it does, in the order it does it.
  for (const b of shotBtns()) {
    const say = "Screenshot the " + paneNoun + " and attach it to this message";
    b.setAttribute("aria-label", say);
    b.title = say;
  }
}

const setTargetNoun = (noun) => {
  targetNoun = noun;
  homebox.placeholder = "Ask Claude about this " + noun + "…";
  // A file is the subject itself, so "files in this file" is not a sentence —
  // and "and the assets it references" is not decoration, it is exactly the
  // reach `_system_prompt` gives the agent for a file target. A folder and a
  // project both CONTAIN the files, so they share the shape.
  // ONE write for the sentence that depends on the kind, exactly as before —
  // and it clears the node, so the second sentence is put back after it by
  // footnoteTail(). The second sentence is its own ELEMENT (not part of this
  // string) because a narrow column drops it whole rather than ellipsising the
  // pair; see #footnote.tight and fitFootnote.
  document.getElementById("footnote").textContent =
    (noun === "file" ? "Claude can read and edit this file and the assets it references."
                     : "Claude can read and edit files in this " + noun + ".");
  footnoteTail();
  // A project's pane is the user's own app; a file's is our preview of their file.
  // "folder" never reaches the pane chrome at all — that target has no pane, and
  // applyPaneNoun's nodes are gone by then — but it resolves to the kind-free word
  // rather than to nothing, so a future caller cannot get an empty noun.
  paneNoun = noun === "project" ? "app" : "preview";
  applyPaneNoun();
};

async function paneURL() {
  const st = await fetch("/api/fs/stat?path=" + encodeURIComponent(FILE))
    .then((r) => r.json());
  if (st.error) throw new Error(st.error);

  if (st.is_dir) {
    const { entry } = await fused.runPython("./app.py", { dir: FILE });
    if (entry) {
      setTargetNoun("project");   // an app folder — the prompt says so too
      // Chat-only host (see CHAT_ONLY): the pane is the host's, not ours. The
      // NOUN is still set — it describes the target, and the system prompt and
      // the placeholders need it either way — but `appEntry` is not: it names
      // "the entry html the pane is rendering", and from here nothing is. Same
      // as the no-pane folder below, which leaves it empty for the same reason.
      if (CHAT_ONLY) return null;
      appEntry = entry;
      return "/render?path=" + encodeURIComponent(entry);
    }
    // An ordinary folder, not a project: NO PANE (D239). `null` is the answer,
    // and it is a distinct answer rather than a thrown error — a folder that is
    // not an app is the ordinary case, not a failure, which is what the original
    // `throw` here got wrong (it left a permanent error panel beside a working
    // chat).
    //
    // What this replaces, and why: D237 framed `/explorer/embed/<dir>` here —
    // fused-render's own file browser, so "what's in here?" was answerable by
    // looking. Nothing flowed back from it. This template has no postMessage and
    // no message listener, so selecting a file in that pane attached nothing, fed
    // nothing to the composer and changed no agent context; annotate was
    // hard-disabled over it (nothing in a file listing is a thing a note could
    // point at); and the `leftmode` picker was inert for it. So it was half the
    // width of a folder chat spent on a view that reported to nobody, and the
    // agent already has the ordinary file tools for the same question. The one
    // thing genuinely given up is the `state.url` backchannel: because embed
    // navigation rewrote the iframe's path, `app_state` could tell the agent
    // which folder or file the user had walked into. That was the only signal
    // that flowed back, and it goes.
    setTargetNoun("folder");
    return null;
  }

  // The file's views, by the same rule the shell applies (Preview.tsx
  // `defaultTemplate`): stat's entries, minus the ones this pane cannot offer,
  // first one is the default. Reusing the rule rather than naming a template per
  // extension is what keeps the pane honest when a binding changes — including a
  // user's own override (§16), which stat has already resolved by the time we
  // see it.
  setTargetNoun("file");
  // Chat-only host (see CHAT_ONLY) — before the entry lookup below, on purpose:
  // the "no preview view for this file" throw is about a pane WE have to fill,
  // and in this layout there is no pane to fail at filling. A file the host
  // frames a chat for must not open with an error panel over a working chat.
  if (CHAT_ONLY) return null;
  paneEntries = paneOfferable(st.templates);
  paneRemote = !!st.remote;
  const t = curLeftEntry();
  if (!t) throw new Error("no preview view for this file");
  // The target IS the document being annotated, so app_state reports the file
  // itself where a folder target reports the app's entry page.
  appEntry = FILE;
  framedMode = t.mode;
  return paneSrcFor(t);
}

// ── the left-view picker ────────────────────────────────────────────────
const leftSel = document.getElementById("leftmode");        // the whole control
const leftBtn = document.getElementById("leftmodebtn");     // its trigger
const leftPop = document.getElementById("leftmodepop");     // its listbox

// The shell's `modeTitle` (lib/mode-name.ts), reimplemented in four lines: a
// template is a standalone document and cannot import the shell's TS. Worth the
// duplication because the picker's labels must read the same as the explorer's
// mode switcher does for the same file — "Render" for the `_render` sentinel,
// and a capitalized folder name otherwise, since a folder name is chosen for the
// filesystem, not for a label. (`_listing` never appears in a FILE's entries and
// the two chat modes are already filtered out, so they are not here.)
//
// `app`/`_app` are named for what the shell calls the surface, not for the
// registry key: by the time this label is on screen the user is already inside
// the app, so "App" says nothing — it is the app's own preview, as against its
// history (History) or its build surface. The key stays `app` everywhere it is
// not a display string. A label that disagreed with the mode switcher one strip
// away would read as two different views.
function paneModeLabel(mode) {
  if (mode === "_render") return "Render";
  // No `history` row: the mode key IS the word, so the capitalize below
  // already produces "History" — the same string the shell's humanizer gives
  // it. It earned an explicit row only while the key was spelled `versions`.
  return ({ git: "Source Control",
            app: "Preview", _app: "Preview" })[mode]
    || mode.charAt(0).toUpperCase() + mode.slice(1);
}

// The template's own icon.svg, which stat already resolved to an absolute path
// on the `templates` entry (`_icon_for`, PT-11) — so this needs no new endpoint
// and no second call: it is served by /api/fs/raw, the locator every other
// template in this repo builds the same way. Drawn as a MASK filled with
// currentColor, which is exactly what the shell does with the same file
// (`templateModeIcon` / .mode-icon-mask), so a selected row's glyph takes the
// accent along with its label. No icon (a template folder that ships none, and
// the `_render` sentinel, which is not a folder) → the shell's own fallback, a
// lettered box, rather than a hole in the column.
function paneModeIcon(e) {
  const el = document.createElement("span");
  el.className = "mode-ic";
  el.setAttribute("aria-hidden", "true");
  if (!e.icon) {
    el.classList.add("letter");
    el.textContent = paneModeLabel(e.mode).charAt(0).toUpperCase();
    return el;
  }
  const url = 'url("' + location.origin + "/api/fs/raw?path="
    + encodeURIComponent(e.icon) + '")';
  el.style.webkitMaskImage = url;
  el.style.maskImage = url;
  return el;
}

// The trigger and the rows both show icon + name, and the rows say which one is
// current. Called on every swap, so a `leftmode` change from anywhere — a click,
// a reload, a later param write — leaves the control agreeing with the frame.
function syncLeftPicker(entry) {
  if (leftSel.hidden || !entry) return;
  const ic = paneModeIcon(entry);
  leftBtn.replaceChild(ic, leftBtn.querySelector(".mode-ic"));
  leftBtn.querySelector(".mode-lbl").textContent = paneModeLabel(entry.mode);
  for (const o of leftPop.querySelectorAll(".mode-opt")) {
    o.setAttribute("aria-selected", o.dataset.mode === entry.mode ? "true" : "false");
  }
}

function openLeftPop() {
  leftPop.hidden = false;
  leftBtn.setAttribute("aria-expanded", "true");
}
function closeLeftPop(refocus) {
  if (leftPop.hidden) return;
  leftPop.hidden = true;
  leftBtn.setAttribute("aria-expanded", "false");
  // Only when the close was the user's own keystroke: stealing focus back on an
  // outside click would yank it off whatever they actually clicked.
  if (refocus) leftBtn.focus();
}

function buildLeftPicker() {
  // Nothing to pick, no control. An APP FOLDER has exactly one thing to frame —
  // the app entry resolved by app.py, which is not a stat entry, so paneEntries
  // stays empty — an ORDINARY folder has no pane at all (and never reaches here,
  // since the loader returns before calling this), and a file with a single
  // offerable view has no choice either. A one-item picker is chrome that
  // cannot do anything.
  if (paneEntries.length < 2) return;
  for (const e of paneEntries) {
    // A real <button>, so focus, Enter and Space are the platform's job and the
    // only keys this file owns are the arrows and Escape.
    const o = document.createElement("button");
    o.type = "button";
    o.className = "mode-opt";
    o.setAttribute("role", "option");
    o.setAttribute("aria-selected", "false");
    o.dataset.mode = e.mode;
    const lbl = document.createElement("span");
    lbl.className = "mode-lbl";
    lbl.textContent = paneModeLabel(e.mode);
    o.append(paneModeIcon(e), lbl);
    // The picker writes the PARAM and nothing else; applyLeftMode (driven from
    // params.onChange, exactly like applySplit) is the only thing that touches
    // the iframe. One code path for a user click, a reload with `leftmode`
    // already set, and any later param change.
    o.onclick = () => { closeLeftPop(true); fused.params.set("leftmode", e.mode); };
    leftPop.appendChild(o);
  }
  leftSel.hidden = false;
  syncLeftPicker(curLeftEntry());
  leftBtn.addEventListener("click", () => {
    leftPop.hidden ? openLeftPop() : closeLeftPop(false);
  });
  leftSel.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { closeLeftPop(true); return; }
    if (ev.key !== "ArrowDown" && ev.key !== "ArrowUp") return;
    ev.preventDefault();
    if (leftPop.hidden) openLeftPop();
    const opts = Array.from(leftPop.querySelectorAll(".mode-opt"));
    const at = opts.indexOf(document.activeElement);
    const down = ev.key === "ArrowDown";
    // From the TRIGGER (nothing in the list is focused, `at === -1`) Down
    // enters at the top and Up at the bottom; from inside the list the move
    // wraps. Written as two cases rather than one modulo, because the modulo
    // that handles -1 correctly is the kind nobody can read.
    const next = at === -1 ? (down ? 0 : opts.length - 1)
                           : (at + (down ? 1 : -1) + opts.length) % opts.length;
    opts[next].focus();
  });
  // Mousedown rather than click, so it beats the trigger's own click and a
  // second press on the trigger toggles instead of closing-then-reopening.
  document.addEventListener("mousedown", (ev) => {
    if (!leftPop.hidden && !leftSel.contains(ev.target)) closeLeftPop(false);
  });
}

// ── WHERE the picker lives, which is a layout question, not a state one ──
//
// SPLIT layout: #leftbar, a row across the top of the left column — the control
// that chooses what that pane frames, sitting on that pane. It spent a while in
// #anntools, across the divider, which put a control for one column on the other
