# Build the on-demand Chromium engine (fused_render/chromium/native) for both
# Mac architectures and attach the zips to the GitHub release named by
# fused_render/chromium/manifest.json's base_url (chromium-engine-<engine_version>).
#
# Manual: the engine changes rarely and ships out of band from app releases.
# After a successful run, pin it:
#
#   gh release download chromium-engine-<v> -p '*.json' -D /tmp/engine
#   scripts/publish_chromium_engine.py /tmp/engine/*.json
#
# and land the manifest change on main; until then the preference reports
# the engine as unpublished.
name: Chromium engine

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the zips to the chromium-engine-<version> release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache the CEF binary distribution
        uses: actions/cache@v4
        with:
          path: fused_render/chromium/native/.cef-cache
          key: cef-${{ matrix.arch }}-${{ hashFiles('fused_render/chromium/manifest.json') }}

      - name: Build the engine
        env:
          FUSED_RENDER_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          # No identity in the secrets → ad hoc; the app's hardened runtime
          # disables library validation, and a downloaded engine is never
          # quarantined, so either signature loads.
          if [ -z "$FUSED_RENDER_CODESIGN_IDENTITY" ]; then unset FUSED_RENDER_CODESIGN_IDENTITY; fi
          bash fused_render/chromium/native/build.sh ${{ matrix.arch }} "$RUNNER_TEMP/engine"

      - name: Smoke test the artifact with the Python unpacker
        run: |
          python3 - "$RUNNER_TEMP/engine" <<'EOF'
          import json, os, sys, tempfile
          sys.path.insert(0, os.getcwd())
          from fused_render import chromium
          out = sys.argv[1]
          info = json.load(open([os.path.join(out, f) for f in os.listdir(out) if f.endswith(".json")][0]))
          art = chromium.Artifact(info["engine_version"], info["cef_version"], info["arch"],
                                  "https://unused/" + info["file"], info["sha256"], info["size"])
          chromium.verify_artifact(os.path.join(out, info["file"]), art)
          with tempfile.TemporaryDirectory() as d:
              chromium.safe_extract(os.path.join(out, info["file"]), d)
              root = chromium._locate_framework_root(d)
              chromium.check_engine_info(os.path.join(root, chromium.ENGINE_INFO), art)
              assert os.path.isfile(os.path.join(root, "FusedChromium.framework/FusedChromium"))
              assert os.path.isdir(os.path.join(root, "FusedRender Helper (Renderer).app"))
          print("artifact verifies and unpacks")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: FusedChromium-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/engine/*.zip
            ${{ runner.temp }}/engine/*.json

      - name: Upload to the engine release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(python3 -c 'import json;print(json.load(open("fused_render/chromium/manifest.json"))["engine_version"])')"
          tag="chromium-engine-$v"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Chromium engine $v" \
            --notes "On-demand Chromium (CEF) engine for the macOS app windows, engine version $v. Downloaded by the app when the experimental preference is on; not for manual installation." --prerelease
          gh release upload "$tag" "$RUNNER_TEMP"/engine/*.zip "$RUNNER_TEMP"/engine/*.json --clobber
