<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Recording</title>
<!-- The floating recording pill (src/recpill/recpill.ts): served at /recording-pill by the in-process server and hosted
     in a non-activating WKWebView panel by fused_render/recording_pill_panel.py (bridge:
     window.webkit.messageHandlers.recpill). A plain browser tab works too for development (?cid=<recording id>). -->
<style>
  :root {
    color-scheme: light dark;
    --pill-bg: #ffffff;
    --pill-fg: #1c1c1e;
    --pill-dim: rgba(28,28,30,.55);
    --pill-hover: rgba(0,0,0,.07);
    --bar: #a1a1a6;
    --bar-live: #1c1c1e;
    --stop-bg: #fde8e7;
    --stop-bg-hover: #fbd9d7;
    --stop-fg: #e5534b;
    --shadow: 0 0 0 0.5px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.08), 0 6px 16px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --pill-bg: #2c2c2e;
      --pill-fg: #f2f2f5;
      --pill-dim: rgba(242,242,245,.6);
      --pill-hover: rgba(255,255,255,.12);
      --bar: rgba(242,242,245,.55);
      --bar-live: #f2f2f5;
            --stop-bg: rgba(255,69,58,.22);
      --stop-bg-hover: rgba(255,69,58,.32);
      --stop-fg: #ff453a;
      --shadow: 0 0 0 0.5px rgba(255,255,255,.12), 0 2px 6px rgba(0,0,0,.35), 0 6px 16px rgba(0,0,0,.25);
    }
  }
  html, body { margin: 0; padding: 0; background: transparent; width: 100%; height: 100%; overflow: hidden; }
  body {
    font: 11px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, sans-serif;
    color: var(--pill-fg); -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none; cursor: default;
  }
  body.dev { background: #d9dde3; }
  /* The window is the pill plus a 14px margin that holds the shadow; its height follows the pill (the page reports it). */
  #pill {
    position: absolute; left: 14px; top: 14px; width: 44px; height: auto; box-sizing: border-box;
    border-radius: 22px; background: var(--pill-bg); box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px;
    padding: 10px 0;
  }
  #pill[hidden] { display: none; }
  #apps { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .app {
    position: relative; width: 24px; height: 24px; flex: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .app .art { width: 100%; height: 100%; border-radius: 6px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .app img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
  .app.home img { width: var(--home-scale, 113.7%); height: var(--home-scale, 113.7%); max-width: none; object-fit: cover; }
  .app.paused { opacity: .45; }
  .chip {
    width: 24px; height: 24px; flex: none; border-radius: 6px; background: var(--pill-hover); color: var(--pill-dim);
    font-weight: 600; font-size: 10px; display: flex; align-items: center; justify-content: center;
  }
  .badge {
    position: absolute; top: -5px; right: -7px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--stop-fg); box-shadow: 0 0 0 1.5px var(--pill-bg); display: none;
    align-items: center; justify-content: center; cursor: pointer;
  }
  .badge i { display: block; width: 6px; height: 6px; border-radius: 1px; background: #fff; }
  #pill.multi .app:hover .badge { display: flex; }
  #meter { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
  #meter i {
    display: block; width: 2px; height: 2px; border-radius: 1px; background: var(--bar);
    transition: width 80ms linear, background-color 150ms linear;
  }
  #meter.live i { background: var(--bar-live); }
  #pill.paused #meter i { opacity: .35; }
  button {
    appearance: none; border: 0; padding: 0; margin: 0; cursor: pointer;
    width: 28px; height: 28px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  }
  button svg { width: 12px; height: 12px; display: block; }
  #stop { background: var(--stop-bg); }
  #stop:hover { background: var(--stop-bg-hover); }
  #stop i { display: block; width: 9px; height: 9px; border-radius: 2px; background: var(--stop-fg); }
  @media (prefers-reduced-motion: reduce) { #meter i { transition: none; } }
</style>
</head>
<body>
<div id="pill" hidden>
  <div id="apps"></div>
  <div id="meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <button id="stop" type="button" title="Stop and save"><i></i></button>
</div>
<script type="module" src="/src/recpill/recpill.ts"></script>
</body>
</html>
