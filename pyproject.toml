[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fused-render"
dynamic = ["version"]
description = "Local file explorer with Python-powered renderable HTML previews"
readme = "README.md"
# license: intentionally unset pending the public-launch licensing decision —
# add it (plus the matching classifier and a LICENSE file) before any PyPI
# publish.
requires-python = ">=3.10"
keywords = ["file-explorer", "preview", "data-viz", "duckdb", "geospatial", "html"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # /api/fs/events is a WebSocket (D74); plain uvicorn has no WS protocol
    # implementation, so the ws library is a hard dependency, not an extra.
    "websockets>=12",
    "pyarrow>=14",
    # The duckdb template reads AND edits every tabular file format (parquet,
    # csv/tsv, json) through one engine, so it's a core dependency, not an
    # optional extra — a plain `pip install fused-render` ships the viewer.
    "duckdb>=1.1",
    # FastAPI's /api/templates/import endpoint accepts multipart form/file
    # uploads, which requires python-multipart at import time (FastAPI raises
    # at route registration otherwise).
    "python-multipart>=0.0.9",
    # server.py hard-imports httpx at module top for the pooled raw-proxy client
    # (TASK F) — and fastapi.testclient needs it too — so a plain
    # `pip install fused-render` is broken without it. Core, not an extra.
    "httpx",
    # PEP 723 header parsing (engine.script_requirements). tomllib is 3.11+
    # stdlib, requires-python is >=3.10, and the deferred `import tomllib` only
    # avoided the crash for scripts with NO header — any script that HAD one
    # raised ModuleNotFoundError on 3.10. Since headers are now the mechanism by
    # which a template declares deps the app doesn't ship (PY-16), that was the
    # main path, not a corner. Core rather than an extra: the parser runs on
    # every /api/run under either engine.
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Test/dev tooling. `pip install -e ".[dev]"` then `pytest`.
dev = [
    "pytest",
    # Parallel test runs (see [tool.pytest.ini_options] addopts -n auto). The
    # suite is xdist-safe via process isolation: conftest re-points
    # FUSED_RENDER_HOME/DIR per worker, tests use tmp_path + monkeypatch, and
    # servers bind 127.0.0.1:0. Process-based only — os.chdir / importlib.reload
    # would race under a threaded runner.
    "pytest-xdist",
    # Coverage reporting (pytest --cov=fused_render). Combines per-worker data
    # under -n auto (xdist) automatically — no extra config needed there.
    "pytest-cov",
    # The Windows updater's tests (tests/test_win_supervisor_update.py) are
    # mock-based and cross-platform, but importorskip("cryptography") skips them
    # in CI unless it's installed here — it's win32-only in windows-desktop.
    "cryptography",
]
# Baked into the bundled CPython of the .app (SPEC DM-2): users of the packaged
# app cannot pip install, so the interpreter ships with the popular data stack.
# Dev installs: pip install -e ".[bundled]"
bundled = [
    "numpy",
    "pandas",
    "requests",
    "polars",
    "matplotlib",
    "scipy",
    "pillow",
    "openpyxl",
    "shapely",
    "geopandas",
    # Preview-template backends. pandoc, typst and usd-core are intentionally
    # absent — they are large per-platform binaries fetched on demand at
    # runtime (see docs/docs.py, docs/install_worker.py, latex/engine.py,
    # usd/convert_worker.py's _ensure_pxr — D119).
    "python-pptx",
    "fpdf2>=2.8.7",
    "msgpack>=1.0",
    "rasterio",
    # Matches zarr_aoi/tile_server.py's header (and its DAEMON_DEPS): it reads
    # v3 stores through the 3.x API, so a bare pin could resolve to 2.x here.
    # Marked 3.11+ like the `fused` pins below: every zarr 3.x requires
    # Python>=3.11 (3.2+ wants 3.12), so an unmarked floor makes this extra
    # unresolvable on the 3.10 that `requires-python` still promises — which is
    # not a hypothetical, it broke v0.3.13's Windows installer build (the
    # project-level `uv run` in scripts/build_windows_installer.ps1 resolves
    # every version split, not just the bundle's 3.12). The desktop bundles all
    # ship 3.12, so they still get zarr; a 3.10 pip install loses the zarr_aoi
    # template's in-process path and falls back to its own daemon venv.
    'zarr>=3.0.8 ; python_version >= "3.11"',
    "pymupdf>=1.25",
    "pikepdf>=9",
    "drain3>=0.9.11",
    # Private-cloud credential chains (the [cloud-auth] extra), folded into the
    # bundled app: DMG users cannot pip install, and the feature's promise —
    # "an authenticated aws/gcloud CLI ⇒ your private buckets just work" — is
    # hollow for them otherwise. botocore adds ~80 MB installed; this line is
    # the size-tradeoff approval point — strip it here if that's unacceptable
    # (public buckets still work: the signers are pure stdlib). requests is
    # already above; google-auth's refresh transport reuses it.
    "botocore",
    "google-auth",
    # The execution engine and the deploy CLI (D69, D79, SPEC §19 DP-3). It is
    # here — not only in the `[fused]` extra below — so that the macOS bundle's
    # force-list DERIVES it (scripts/setup_py2app.py's bundled_force_lists) and
    # the "ships, or excluded with a measured cost, never just absent"
    # reconciliation in tests/test_bundle_contents.py covers it. It used to be a
    # hand-written entry in that script's `packages` list, i.e. the one thing
    # whose silent disappearance would strip the engine and the in-bundle CLI
    # from the DMG without turning a single test red (D177's standing rule:
    # derive, or make divergence a test failure).
    #
    # The requirement string must stay byte-identical to `[fused]`'s — see the
    # comment there and
    # tests/test_bundle_contents.py::test_the_bundled_and_fused_extras_pin_the_same_wheel.
    'fused==2.9.3b2 ; python_version >= "3.11"',
]
# Private-cloud credential chains (optional). botocore buys the AWS provider
# chain (SSO / credential_process / assume-role / IMDS) for s3sign's resolver
# rung; google-auth buys the GCS bearer-token chain (SA key / ADC) for gcssign.
# requests is google-auth's refresh transport. The signing math stays in-repo
# (s3sign/gcssign are pure stdlib), so a plain install still serves public
# buckets with the libs absent — this extra only lights up private ones.
cloud-auth = [
    "botocore",
    "google-auth",
    "requests",
]
# Menu-bar app shell (SPEC DM-3/DM-7). macOS-only; not a core dependency so
# `pip install fused-render` stays cross-platform. Only the packaged .app
# build (scripts/build_dmg.sh) installs this extra.
app = [
    "rumps",
    # Pinned view (SPEC §25, D97): WKWebView inside the status-item popover.
    "pyobjc-framework-WebKit",
]
# Optional execution engine (D69): when installed, /api/run runs code through
# the fused local compute backend; absent, the built-in executor runs. Pinned
# to the same release the managed Fused service serves hosted pages from, so local and
# hosted execution stay on one build. The engine needs 3.11+; on 3.10 the
# marker skips it and the built-in executor runs.
# The version pin must match deploy.PINNED_FUSED_REQUIREMENT (the Deploy modal's
# one-click install, SPEC DP-4) — a test pins the two together.
#
# This extra is KEPT even though the same requirement now also sits in
# `[bundled]` above, and the two must be updated together (a test asserts they
# are byte-identical). They serve different callers: `[bundled]` is what the
# packaging derivation and the platform installers read, while `[fused]` is the
# documented light path to the engine — `pip install "fused-render[fused]"`
# (README, docs/usage.md) and CI's `fused-engine` job (`.[dev,fused]`), both of
# which want the engine WITHOUT the ~650 MB scientific stack.
fused = [
    'fused==2.9.3b2 ; python_version >= "3.11"',
]
# Windows desktop supervisor backend (fused_render/supervisor/_win32,
# docs/DESKTOP_SUPERVISOR.md). Windows-only; not a core dependency so
# `pip install fused-render` stays cross-platform. Only the packaged desktop
# build (scripts/build_windows_installer.ps1) installs this extra.
windows-desktop = [
    'pywin32>=306 ; sys_platform == "win32"',
    'pystray>=0.19 ; sys_platform == "win32"',
    'pillow ; sys_platform == "win32"',
    # Verifies the ed25519-signed update manifest (supervisor/_win32/update.py).
    'cryptography ; sys_platform == "win32"',
]
# Linux desktop supervisor backend (fused_render/supervisor/_linux,
# docs/LINUX_DESKTOP_SPEC.md). Linux-only; installed only by the packaged
# AppImage build (scripts/build_linux_appimage.sh). The tray is a native
# StatusNotifierItem exported over D-Bus via dbus-fast (pure-Python, manylinux
# wheels → bundles cleanly, no GTK/X11); the icon is absent only where no
# StatusNotifier host runs (stock GNOME w/o extension) — an accepted degraded
# mode (gate (c)). pillow repacks the icon into the SNI ARGB32 pixmap.
linux-desktop = [
    'dbus-fast ; sys_platform == "linux"',
    'pillow ; sys_platform == "linux"',
]

[project.urls]
Homepage = "https://github.com/fusedio/fused-render"
Repository = "https://github.com/fusedio/fused-render"
Releases = "https://github.com/fusedio/fused-render/releases"

[project.scripts]
fused-render = "fused_render.cli:main"
fused-render-app = "fused_render.app:main"

# No-console launcher for the Explorer "Open with" registration; a dedicated
# exe because the Open With dialog displays a pythonw.exe command as "Python".
[project.gui-scripts]
fused-render-open = "fused_render.winopen:main"

# Run the suite in parallel by default (needs pytest-xdist, in the dev extra).
# -n auto spawns one worker per CPU; the suite is xdist-safe (see the dev-extra
# comment). To debug a single test serially, override: `pytest -n0 -x path::test`.
[tool.pytest.ini_options]
addopts = "-n auto"

[tool.coverage.run]
source = ["fused_render"]
# Store paths relative to the repo root rather than absolute, so coverage.xml
# stays meaningful if it's read from a different checkout path than the one
# that produced it (e.g. a CI runner vs. a contributor's machine).
relative_files = true

[tool.coverage.report]
# Defensive-only lines that a normal test run can't reach (platform guards,
# "this should never happen" branches) — excluding them keeps the percentage
# meaningful instead of chasing untestable lines.
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# Single source of truth for the version: fused_render/__init__.py's
# __version__. Bump it there only — hatchling reads it at build time for the
# wheel metadata, and the runtime importers (server.py, core_templates.py,
# logs.py) all resolve to the same value.
[tool.hatch.version]
path = "fused_render/__init__.py"

[tool.hatch.metadata]
# Kept enabled so a direct URL requirement (e.g. pinning a pre-release wheel
# instead of a PyPI version) can be dropped in without a metadata error —
# hatchling refuses direct references unless explicitly allowed.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["fused_render"]
# The Vite-built shell is gitignored (D54) but must ship in the wheel;
# `artifacts` overrides hatchling's VCS-based exclusion for it. The starter
# kit's authoring skills are copied in at build time from skills/ (D106) — also
# gitignored, also shipped here.
artifacts = [
    "fused_render/static/shell-dist/**",
    "fused_render/skills/**",
]

# Builds frontend/ -> fused_render/static/shell-dist/ at package-build time
# (wheel and the DMG pipeline, which pip-installs this repo). Editable
# installs skip it — see scripts/hatch_build.py.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "scripts/hatch_build.py"

# Seed examples live at the repo root (examples_seed/) but ship inside the
# package at fused_render/examples_seed/ so seed.py finds them in an
# installed wheel. Editable installs skip force-include; seed.py falls back
# to the repo-root copy.
[tool.hatch.build.targets.wheel.force-include]
"examples_seed" = "fused_render/examples_seed"
