<!DOCTYPE html>
<html data-fused-theme="shell">
<head>
<meta charset="utf-8" />
<title>Bare Demo — Detail</title>
<style>
  :root {
    color-scheme: dark;
    --fg: #e8eaed; --fg-muted: #9aa0a6; --bg: #131417; --accent: #E5FF44;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --fg: #1f2023; --fg-muted: #61656c; --bg: #ffffff; --accent: #5f7300;
  }
  body {
    margin: 0; padding: 40px; height: 100vh; box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--fg); background: var(--bg);
  }
  p { color: var(--fg-muted); }
  a { color: var(--accent); cursor: pointer; }
</style>
</head>
<body>
  <h1>Detail</h1>
  <p>The detail page of the bare app.</p>
  <p><a id="to-home">← Back home</a></p>
  <script>
    document.getElementById("to-home").addEventListener("click", () => {
      fused.navigate("/").catch((e) => alert(e.message));
    });
  </script>
</body>
</html>
