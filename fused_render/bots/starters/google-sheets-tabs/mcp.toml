# ---- tab management. Both change the Google Sheet's structure, so both are
# marked [approval].

[[tool]]
name = "sheets_rename_tab"
description = "[approval] Rename a worksheet tab. tab is the current worksheet id (gid) or title; title is the new name (must not match another tab)."
file = "sheets.py"
entrypoint = "main"
signature = "main(action: str='status', doc: str='', title: str='', content: str='', tab: str='', range: str='', key_json: str='', raw: bool=False, limit: int=1000, resolved: bool=False)"

[tool.pinned]
action = "rename_tab"

[[tool]]
name = "sheets_delete_tab"
description = "[approval] Permanently delete a worksheet tab and all its data (Sheets batchUpdate deleteSheet). tab must be the worksheet id (gid) or its exact title (no substring matching). Refuses to delete the last remaining tab, or the last visible one."
file = "sheets.py"
entrypoint = "main"
signature = "main(action: str='status', doc: str='', title: str='', content: str='', tab: str='', range: str='', key_json: str='', raw: bool=False, limit: int=1000, resolved: bool=False)"

