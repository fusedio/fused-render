<!DOCTYPE html>
<html data-fused-theme="shell">
<head>
<meta charset="utf-8" />
<title>Markdown</title>
<script src="/template-assets/codemirror.bundle.js"></script>
<script src="/template-shared/ro-badge.js"></script>
<script src="/template-shared/graph-canvas.js"></script>
<style>
  /* Appearance (SPEC §30, D134). Both palettes are **Obsidian's own default
     theme**, taken from its published CSS-variable reference rather than
     approximated: the `--color-base-*` neutral scale, `--color-red` and
     `--color-orange`, and the default accent `hsl(254, 80%, 68%)`. Obsidian is
     already the reference for this template's read/write behaviour (SPEC §32),
     so it should be the reference for its appearance too.

       --bg      = --background-primary        (--color-base-00)
       --bg-alt  = --background-secondary      (--color-base-20)
       --border  = --background-modifier-border(--color-base-30)
       --fg      = --text-normal               (--color-base-100)
       --fg-muted= --text-muted                (--color-base-70)
       --ghost   = --text-faint                (--color-base-50)

     The NEUTRALS are Obsidian's; the ACCENT is not. Obsidian's default accent is
     a violet (`hsl(254, 80%, 68%)`), and against these greys it read as off —
     so the accent stays fused-render's own yellow, used sparingly and mostly on
     links. That is the whole point of borrowing a neutral scale: it is neutral,
     so it carries any accent. `--on-accent` is therefore dark, because the
     accent is light.

     One other deviation: light `--warn` is darkened from Obsidian's l=46% to
     36% (same hue and saturation). Its light orange is 2.8:1 on white and it
     carries the conflict banner, the one message in this view that must be read
     (4.3:1 after, on `--bg-alt`).

     `data-theme` is written onto <html> by the injected runtime, which acts only
     because this document opted in via `data-fused-theme` on <html> (see
     fused_render/static/runtime.js) — dark stays the default for any document
     that never gets the attribute. */
  :root {
    color-scheme: dark;
    --fg: #dadada;
    --fg-muted: #bababa;
    --border: #363636;
    --bg: #1e1e1e;
    --bg-alt: #262626;
    --accent: #E5FF44;
    --error: #fb464c;
    --warn: #e9973f;
    --skel-shine: #363636;
    --ghost: #666666;
    --on-accent: #1e1e1e;
    /* Neutral, not accent-tinted: a wash of acid yellow over a paragraph is not
       a selection anyone can read through. */
    --selection: rgba(255, 255, 255, 0.16);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --fg: #222222;
    --fg-muted: #5a5a5a;
    --border: #e0e0e0;
    --bg: #ffffff;
    --bg-alt: #f6f6f6;
    --accent: #5f7300;
    --error: #e93147;
    --warn: #b85b00;
    --skel-shine: #e0e0e0;
    --ghost: #ababab;
    --on-accent: #ffffff;
    --selection: rgba(0, 0, 0, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    color: var(--fg);
    background: var(--bg);
  }

  /* ---- the reload-or-keep banner (MD-17) --------------------------------
     The only chrome that ever occupies a row of its own, and only while a
     conflict is unresolved: there is no persistent toolbar in this view
     (MD-2a) — the shell's own breadcrumb already names the file, and
     Obsidian shows no save state at all. */
  #conflict {
    display: none;
    align-items: center;
    gap: 10px;
    flex: none;
    padding: 7px 12px;
    border-bottom: 1px solid var(--warn);
    background: var(--bg-alt);
    color: var(--warn);
    font-size: 12px;
  }
  #conflict button {
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--bg);
    color: var(--fg);
    font: inherit;
    padding: 3px 9px;
    cursor: pointer;
  }
  #conflict button:hover { border-color: var(--accent); }

  /* A failure needs to be seen; a successful save does not (MD-16). This slot
     is empty — and therefore invisible — in the ordinary case. */
  #save-state {
    position: fixed;
    right: 12px;
    bottom: 10px;
    z-index: 6;
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--bg-alt);
    color: var(--fg-muted);
    font-size: 12px;
  }
  #save-state:empty { display: none; }
  #save-state.error { color: var(--error); border-color: var(--error); }
  #ro-wrap { position: fixed; left: 12px; bottom: 10px; z-index: 6; }

  /* ---- surface ----------------------------------------------------------- */
  #split { flex: 1; display: flex; min-height: 0; position: relative; }
  #surfaces { flex: 1; min-width: 0; min-height: 0; display: flex; }
  #editor-wrap { flex: 1; min-width: 0; }
  #status { flex: 1; padding: 24px; color: var(--fg-muted); }
  #status[hidden] { display: none; }
  #status.error { color: var(--error); }
  #status a { color: var(--accent); }

  /* ---- the editor IS the document (MD-18a) ------------------------------
     One surface, editable or not (MD-1a). No line numbers, no fold gutter and no
     active-line stripe: this is prose, and the chrome a code editor wants is
     exactly what a Live Preview must not show. */
  .cm-editor { height: 100%; font-size: 16px; }
  .cm-editor.cm-focused { outline: none; }

  /* ---- the editing surface belongs to the page --------------------------
     CM's `oneDark` ships its own surface — background #282c34, a blue cursor,
     a blue-grey selection — which rendered the editor as a second, lighter,
     bluer dark slab sitting inside this one, with the accent clashing against
     it. Obsidian's editor is the SAME colour as the app around it, and that
     unified surface is much of why it reads as calm. So oneDark is kept only
     for what it is good at (colouring fenced code in the dark), and every
     surface colour is taken back to this view's tokens.
     CM inserts its stylesheet as the FIRST child of <head> (StyleModule), so
     these rules win at equal specificity purely by source order. */
  .cm-editor { background: var(--bg); color: var(--fg); }
  .cm-editor .cm-cursor, .cm-editor .cm-dropCursor { border-left-color: var(--accent); }
  .cm-editor.cm-focused > .cm-scroller > .cm-selectionLayer .cm-selectionBackground,
  .cm-editor .cm-selectionBackground,
  .cm-editor .cm-content ::selection { background: var(--selection); }
  .cm-editor .cm-panels {
    background: var(--bg-alt);
    color: var(--fg);
    border-color: var(--border);
  }
  .cm-editor .cm-tooltip {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-alt);
    color: var(--fg);
  }
  /* The completion popup's own presentation is NOT here — it is a CM theme
     extension (`completionTheme`, MD-14), so it rides through the
     `StateEffect.reconfigure` theme swap with the rest of the extension array
     instead of racing oneDark's rules from the page. This slot used to hold a
     full-bleed `background: var(--accent)` selected row, which was the loudest
     thing on screen; see D192. */

  /* oneDark also colours markdown SYNTAX like source code: headings red, every
     `#`/`*`/`>` marker green, URLs cyan. Obsidian does none of that — a heading
     is body-coloured and a marker is faint — and the Live Preview already knows
     what each range MEANS, so `inherit` hands the colour back to the decoration
     that does. Fenced code is excluded, because there the syntax colouring is
     exactly the point; so are our own widgets and marks, which carry `lp-`,
     or `wl-` classes (a highlight span's class is generated, e.g. `ͼ4`). */
  .cm-content .cm-line:not(.lp-fence-line)
      span:not([class*="lp-"]):not([class*="wl"]) {
    color: inherit;
    text-decoration: inherit;
  }
  .cm-editor .cm-scroller {
    overflow: auto;
    font-family: inherit;
    line-height: 1.65;
  }
  .cm-editor .cm-content {
    max-width: 46rem;
    margin: 0 auto;
    padding: 40px 24px 40vh;
    caret-color: var(--accent);
  }
  .cm-editor .cm-gutters { display: none; }
  .cm-editor .cm-activeLine { background: transparent; }
  .cm-editor .cm-activeLineGutter { background: transparent; }
  .cm-editor .cm-line { padding: 0 2px; }

  /* Live Preview marks. Every rule here styles a range of the SOURCE — there
     is no second rendered copy of the document to style. */
  /* Heading scale and weights are Obsidian's defaults (--h1-size … --h6-size,
     --h1-weight 700 and 600 below it). Colour is deliberately absent: a heading
     is body-coloured there, which is also why oneDark's red had to go. */
  .lp-h1, .lp-h2, .lp-h3, .lp-h4, .lp-h5, .lp-h6 {
    font-weight: 600;
    line-height: 1.3;
  }
  .lp-h1 { font-size: 1.802em; font-weight: 700; }
  .lp-h2 { font-size: 1.602em; }
  .lp-h3 { font-size: 1.424em; }
  .lp-h4 { font-size: 1.266em; }
  .lp-h5 { font-size: 1.125em; }
  .lp-h6 { font-size: 1em; }
  .lp-bold { font-weight: 700; }
  .lp-italic { font-style: italic; }
  .lp-strike { text-decoration: line-through; color: var(--fg-muted); }
  /* Tinted, not boxed: Obsidian gives code a background and no border, and a
     border around every inline span is noise at prose density. */
  .lp-code {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.86em;
    background: var(--bg-alt);
    border-radius: 4px;
    padding: 0.1em 0.32em;
  }
  .lp-fence-line {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.86em;
    background: var(--bg-alt);
  }
  .lp-quote-line {
    border-left: 3px solid var(--border);
    padding-left: 12px;
    color: var(--fg-muted);
  }
  /* Faint (--text-faint), not a dimmed muted grey: at 0.6 opacity on top of a
     muted grey these were all but invisible in the dark, and a marker you cannot
     see is a marker you cannot tell you are about to edit. */
  .lp-mark { color: var(--ghost); }
  .lp-fm-line { color: var(--fg-muted); font-size: 0.86em; }
  /* Faint, not accent: a page of yellow bullets is not what sparing means. */
  .lp-bullet { color: var(--ghost); }
  .lp-hr {
    display: inline-block;
    width: 100%;
    border: none;
    border-top: 1px solid var(--border);
    vertical-align: middle;
  }
  .lp-img { max-width: 100%; border-radius: 4px; vertical-align: middle; }
  /* A player, not a poster: it needs a floor height or an unloaded clip
     collapses to nothing, and a ceiling so it cannot fill the note. */
  .lp-video { max-width: 100%; max-height: 60vh; min-height: 3rem;
    border-radius: 4px; vertical-align: middle; }
  .lp-task { vertical-align: middle; margin: 0 6px 0 0; accent-color: var(--accent); }
  .lp-table {
    border-collapse: collapse;
    font-size: 0.92em;
    margin: 2px 0;
  }
  .lp-table th, .lp-table td { border: 1px solid var(--border); padding: 5px 11px; }
  .lp-table th { background: var(--bg-alt); text-align: left; }
  .lp-link { color: var(--accent); text-decoration: none; }
  .lp-link:hover { text-decoration: underline; }

  /* Wikilinks and ghosts — the link layer (SPEC §32, MD-3/MD-4). */
  .wl {
    color: var(--accent);
    cursor: pointer;
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  .wl:hover { border-bottom-color: var(--accent); }
  /* Dashed and faint: "scanned, and this target is not there". Kept visibly
     distinct from the solid-underlined grey of "not scanned, unknown" below. */
  .wl-ghost { color: var(--ghost); border-bottom: 1px dashed var(--ghost); }
  /* Unknown, not missing (MD-11): no scan ran, so this link is inert. Muted and
     underlined like a link that is simply not clickable — deliberately NOT the
     dashed ghost, which means "scanned, and this target is not there". */
  .wl-unknown {
    color: var(--fg-muted);
    cursor: default;
    border-bottom: 1px solid var(--border);
  }
  .wl-unknown:hover { border-bottom-color: var(--border); }
  .wl-embed-missing, .wl-embed-unknown {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 13px;
  }
  .wl-embed-missing { border: 1px dashed var(--ghost); color: var(--ghost); }
  .wl-embed-unknown { border: 1px solid var(--border); color: var(--fg-muted); }

  /* ---- the corner cluster: mode + sidebar (MD-1a, MD-19) ------------------
     The only persistent chrome in this view. Two 26px buttons in one corner,
     never a toolbar row (MD-2a). */
  #corner {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 5;
    display: flex;
    gap: 6px;
  }
  .corner-btn {
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-alt);
    color: var(--fg-muted);
    cursor: pointer;
  }
  .corner-btn:hover { color: var(--fg); border-color: var(--accent); }
  .corner-btn[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
  }
  .corner-btn:disabled {
    cursor: not-allowed;
    opacity: 0.45;
  }
  .corner-btn:disabled:hover { color: var(--fg-muted); border-color: var(--border); }
  .corner-btn svg { width: 14px; height: 14px; display: block; }
  /* `aria-pressed` tracks EDITING — the non-default state now that a note opens
     read-only — so the accent marks the surface you can actually change. The
     glyph names the CURRENT mode either way: padlock while read-only, pencil
     while editing. */
  #toggle-edit .icon-edit { display: none; }
  #toggle-edit[aria-pressed="true"] .icon-edit { display: block; }
  #toggle-edit[aria-pressed="true"] .icon-lock { display: none; }
  #side {
    position: relative;
    width: 21rem;
    flex: none;
    display: none;
    flex-direction: column;
    min-height: 0;
    border-left: 1px solid var(--border);
    background: var(--bg-alt);
  }
  #side.on { display: flex; }
  /* The drag handle. Sits ON the border rather than taking a column of its own,
     so the panel's usable width is what the user set. */
  #side-grip {
    position: absolute;
    left: -3px;
    top: 0;
    bottom: 0;
    width: 7px;
    z-index: 6;
    padding: 0;
    border: none;
    background: transparent;
    cursor: col-resize;
    touch-action: none;
  }
  #side-grip:hover, #side-grip:focus-visible {
    background: var(--accent);
    opacity: 0.4;
    outline: none;
  }
  .side-head {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: none;
    padding: 7px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    color: var(--fg-muted);
  }
  .side-head .spacer { flex: 1; }
  /* Whichever section is FIRST has to clear the floating corner cluster, and
     that is the outline now (MD-19b). */
  #outline-head { padding-right: 72px; }
  /* Content-sized and scrolling, exactly as #links is and for the same reason:
     a fifty-heading note must not push the canvas out of the panel. The two
     caps together still leave #graph-sec its min-height. */
  #outline { flex: none; max-height: 30%; min-height: 0; overflow: auto; padding: 8px; }
  /* Sized by its content, not by the leftover space: a handful of backlinks
     should not reserve half the panel while the graph's labels collide. The
     cap keeps a long list scrolling here instead of starving #graph-sec, so
     flex: none is load-bearing — flex: 1 is what made the list mostly empty. */
  #links { flex: none; max-height: 42%; min-height: 0; overflow: auto; padding: 8px; }
  #links[hidden] { display: none; }
  /* A list, not a table of cards: no row border and no row fill, so the four
     backlinks of a typical note read as four lines of text. The rhythm has to
     come from the margin now that no border draws the edges. */
  .bl {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    column-gap: 7px;
    width: 100%;
    text-align: left;
    padding: 4px 7px;
    margin-bottom: 4px;
    border: none;
    border-radius: 5px;
    background: none;
    color: var(--fg);
    font: inherit;
    font-size: 12px;
    line-height: 1.35;
    cursor: pointer;
  }
  /* --bg, not --bg-alt: the panel itself is already --bg-alt, so hovering to
     that colour would be a no-op. Keyboard focus gets the outline instead of a
     fill, because with the border gone a hover-coloured row is the only other
     signal and the two must not look alike. */
  .bl:hover { background: var(--bg); }
  .bl:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  /* The rel path sits right after the title, not flush right: it is what tells
     two same-titled notes apart, so it belongs next to the title rather than a
     ragged gutter away. It wraps to a second line when the pair no longer fits
     — flex-wrap breaks on content width before it shrinks anything — which is
     kinder on a narrow panel than ellipsizing both halves into uselessness.
     Both still clip rather than wrap again, so a row is at most two lines. */
  .bl-title,
  .bl-path { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bl-title { flex: 0 1 auto; font-weight: 600; }
  .bl-path { flex: 0 1 auto; max-width: 100%; color: var(--fg-muted); font-size: 11px; }
  /* "×3" when one note links here three times: the list shows each linking
     note once, so the multiplicity has to survive somewhere. Muted like the
     path — it qualifies the row, it is not the row. */
  .bl-count { flex: none; color: var(--fg-muted); font-size: 11px; }
  .bl-empty { color: var(--fg-muted); font-size: 12px; }
  /* An outline row IS a backlink row (it carries `bl` as well) — one row style
     for one panel — plus the indent that carries the nesting. Declared after
     `.bl` so its padding-left wins, and the step comes from the depth the
     renderer computed rather than from the heading level, so a note whose
     headings all start at `##` is not a uniformly indented note. */
  .ol { padding-left: calc(7px + var(--ol-depth, 0) * 13px); }
  .ol-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #notice {
    margin: 12px 0 0;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-left: 3px solid var(--warn);
    border-radius: 0 6px 6px 0;
    background: var(--bg);
    color: var(--fg-muted);
    font-size: 12px;
  }
  #notice[hidden] { display: none; }
  /* Takes everything the backlinks list does not use: the canvas is the one
     thing here that gets better with more room, since the force layout spreads
     its labels out instead of stacking them. */
  #graph-sec {
    flex: 1;
    min-height: 12rem;
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--border);
  }
  #graph-canvas { flex: 1; width: 100%; display: block; cursor: grab; }
  #graph-note { flex: none; padding: 6px 10px; font-size: 11px; color: var(--fg-muted); }
  #graph-note[hidden] { display: none; }
  #graph-count { text-transform: none; letter-spacing: 0; font-weight: 400; }
  #depth {
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 5px;
    font: inherit;
    font-size: 11px;
    padding: 1px 4px;
  }

  /* ---- skeleton --------------------------------------------------------- */
  #skel { flex: 1; max-width: 46rem; margin: 0 auto; padding: 40px 24px; }
  #skel[hidden] { display: none; }
  .skel-bar {
    height: 14px;
    margin: 0 0 14px;
    border-radius: 4px;
    background: linear-gradient(100deg, var(--bg-alt) 30%, var(--skel-shine) 50%, var(--bg-alt) 70%);
    background-size: 200% 100%;
    animation: skel-shimmer 1.3s ease-in-out infinite;
  }
  .skel-h1 { height: 28px; width: 52%; margin-bottom: 24px; }
  .skel-h2 { height: 20px; width: 38%; margin-top: 10px; margin-bottom: 18px; }
  .skel-code {
    height: 70px;
    margin: 4px 0 20px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: linear-gradient(100deg, var(--bg-alt) 30%, var(--skel-shine) 50%, var(--bg-alt) 70%);
    background-size: 200% 100%;
    animation: skel-shimmer 1.3s ease-in-out infinite;
  }
  @keyframes skel-shimmer {
    from { background-position: 200% 0; }
    to { background-position: -200% 0; }
  }
</style>
</head>
<body>
  <div id="conflict">
    <span id="conflict-text">This note changed on disk while you were editing it.</span>
    <button id="reload">Reload from disk</button>
    <button id="keep">Keep my version</button>
  </div>
  <div id="split">
    <div id="surfaces">
      <div id="skel" aria-hidden="true">
        <div class="skel-bar skel-h1"></div>
        <div class="skel-bar" style="width:94%"></div>
        <div class="skel-bar" style="width:82%"></div>
        <div class="skel-bar" style="width:88%"></div>
        <div class="skel-bar skel-h2"></div>
        <div class="skel-bar" style="width:76%"></div>
        <div class="skel-bar" style="width:91%"></div>
        <div class="skel-bar" style="width:65%"></div>
        <div class="skel-code"></div>
        <div class="skel-bar" style="width:60%; margin-left:24px"></div>
        <div class="skel-bar" style="width:70%; margin-left:24px"></div>
        <div class="skel-bar" style="width:85%"></div>
      </div>
      <div id="status" hidden></div>
      <div id="editor-wrap"></div>
    </div>
    <div id="corner">
      <!-- `aria-pressed` tracks EDITING, not read-only: a note opens read-only
           (MD-1a), and accenting the default would leave the corner permanently
           lit and say nothing. The accent marks the state worth noticing — the
           file is writable right now — and the glyph names the current mode:
           padlock while read-only, pencil while editing. -->
      <button id="toggle-edit" class="corner-btn" aria-pressed="false"
              aria-label="Editing" title="Read-only — click to edit">
        <svg class="icon-edit" viewBox="0 0 16 16" fill="none" stroke="currentColor"
             stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="M10.6 2.6 L13.4 5.4 L6 12.8 L3 13.6 L3.8 10.6 Z" />
          <path d="M9.2 4 L12 6.8" />
        </svg>
        <svg class="icon-lock" viewBox="0 0 16 16" fill="none" stroke="currentColor"
             stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <rect x="3.4" y="7" width="9.2" height="6.6" rx="1.4" />
          <path d="M5.6 7 V5.2 a2.4 2.4 0 0 1 4.8 0 V7" />
        </svg>
      </button>
      <button id="toggle-graph" class="corner-btn" aria-pressed="false"
              aria-label="Toggle side panel" title="Toggle side panel">
        <!-- A panel, not a graph: the sidebar holds backlinks AND the graph, and
             the nodes-and-edges glyph this replaced was unreadable at 14px. The
             right column is filled so the shape says "panel open on the right"
             at a glance; both strokes and the fill inherit currentColor, so the
             aria-pressed accent state and both themes come for free. -->
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"
             stroke-linejoin="round" aria-hidden="true">
          <rect x="1.6" y="2.6" width="12.8" height="10.8" rx="1.8" />
          <path d="M10.2 2.6 V13.4" />
          <path d="M10.2 3.4 H13.6 V12.6 H10.2 Z" fill="currentColor" stroke="none" />
        </svg>
      </button>
    </div>
    <aside id="side">
      <button id="side-grip" type="button" aria-label="Resize side panel"></button>
      <!-- The outline goes at the TOP of the one right sidebar (MD-19b): it is
           about the note in front of you, while backlinks and the graph are
           about the rest of the vault, so it sits nearest the document — which
           is also where Obsidian puts it. Not a second panel and not a second
           toggle: MD-19a forbids the first and MD-2a the second. -->
      <div class="side-head" id="outline-head">Outline</div>
      <div id="outline"></div>
      <div class="side-head" id="links-head">Backlinks</div>
      <div id="links" hidden>
        <div id="bl-list"></div>
        <div id="notice" hidden></div>
      </div>
      <div id="graph-sec">
        <div class="side-head">
          <span>Graph</span>
          <span id="graph-count"></span>
          <span class="spacer"></span>
          <label>depth
            <select id="depth">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <!-- The whole vault, focus still highlighted: graph.py reads a
                   negative depth as "skip the neighbourhood filter" (MD-20). -->
              <option value="-1">all</option>
            </select>
          </label>
        </div>
        <canvas id="graph-canvas"></canvas>
        <div id="graph-note" hidden></div>
      </div>
    </aside>
  </div>
  <div id="save-state"></div>
  <div id="ro-wrap"><span id="ro" hidden></span></div>
  <script>
    // This view owns its own saves and its own reload rule (MD-16/MD-17), so
    // the runtime's blanket reload-on-change must stay out of the way — it
    // would reload the page under the cursor, and our own autosave moves the
    // mtime on every write anyway.
    fused.autoReload(false);

    const MAX_BYTES = 2 * 1024 * 1024;
    // Obsidian's idle autosave interval. Not configurable, deliberately: the
    // whole point of copying Obsidian here is the absence of save ceremony.
    const AUTOSAVE_MS = 2000;

    const conflictEl = document.getElementById("conflict");
    const conflictTextEl = document.getElementById("conflict-text");
    const saveStateEl = document.getElementById("save-state");
    const statusEl = document.getElementById("status");
    const skelEl = document.getElementById("skel");
    const editorWrapEl = document.getElementById("editor-wrap");

    let file = null;
    let text = "";        // last text loaded from (or written to) disk
    let mtime = null;     // the optimistic-lock token
    let writable = true;  // stat.writable — the shell's persisted read_only (MD-15)
    let dirty = false;
    let saving = false;
    let savePromise = null;
    let saveTimer = null;
    let view = null;      // the live CodeMirror view, or null
    let themeObserver = null;
    let themedDark = true;

    // The note's link facts, from graph.py. Resolution happens THERE, on the
    // candidate set that exists right now (MD-6) — this page never resolves a
    // target itself, so the note view and the graph views cannot disagree.
    // `resolved` is a three-state: a Map when a scan answered, and null when no
    // scan ran — which means resolution is UNKNOWN, not "nothing resolved".
    let notes = null;
    let resolved = null;
    let scanNotice = "";  // graph.py's reason, when it had one

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Join an absolute POSIX dir with a relative path and collapse "." / ".."
    // segments — pure string work (no fs access; paths are absolute POSIX).
    // A leading "/" is right for a POSIX path and WRONG for a Windows one: the
    // shell's canonical form there is the drive path `C:/Users/…` with no
    // leading slash, so prefixing one produced `/C:/…` — which then failed the
    // scan-root boundary check in createGhost and refused every create on
    // Windows. Same guard the docs, excel and slides templates carry.
    function resolvePath(dir, rel) {
      const out = [];
      for (const p of dir.split("/").concat(rel.split("/"))) {
        if (p === "" || p === ".") continue;
        if (p === "..") out.pop();
        else out.push(p);
      }
      const joined = out.join("/");
      return /^[A-Za-z]:$/.test(out[0] || "") ? joined : "/" + joined;
    }

    // A malformed escape ("%zz") throws rather than decoding; the authored text
    // is the best remaining guess at what the author meant.
    function decodeMaybe(value) {
      try { return decodeURIComponent(value); } catch (e) { return value; }
    }

    function noteDir() { return file ? file.slice(0, file.lastIndexOf("/")) : ""; }
    function isNote(path) { return /\.(md|markdown)$/i.test(path || ""); }

    // ---- read-only vs editing (MD-1a) --------------------------------------
    // A mode, not a second surface: the SAME decorations over the same document,
    // with CM's two read-only facets on or off. It changes writability and
    // nothing about appearance — no different typography, no second render
    // pipeline. A note OPENS READ-ONLY: opening a note is a read, and a stray
    // keystroke on a freshly opened file must not silently rewrite it — editing
    // is one click away and stays in the URL once asked for.
    //
    // The preference lives in a param, like `graph` and `depth` (MD-20), so it
    // survives a refresh and travels in a shared URL. It is layered ON TOP of
    // the file's real writability and can never override it: an unwritable file
    // (MD-15) is read-only whatever the param says, which is also why a
    // read-only file and read-only mode are one mechanism rather than two.
    function editWanted() { return fused.params.get("edit") === "1"; }
    function editing() { return writable && editWanted(); }

    // ---- shell navigation ---------------------------------------------------
    // Mirrors frontend/src/lib/router.ts urlForFsPath + navigate, the same way
    // history/canvas/preview each do: the prefix this session is already in,
    // every path segment encoded, then pushState + "fused:navigate" on the top
    // window so the shell re-routes without a full reload.
    function shellPrefix() {
      try {
        const p = window.top.location.pathname;
        if (p.startsWith("/embed/") || p === "/embed") return "/embed/";
      } catch (e) { /* cross-origin — assume the normal shell */ }
      return "/view/";
    }
    function urlForFsPath(fsPath, search) {
      const norm = /^[A-Za-z]:[\\/]/.test(fsPath) ? fsPath.replace(/\\/g, "/") : fsPath;
      const encoded = norm.replace(/^\/+/, "").split("/").filter(Boolean)
        .map(encodeURIComponent).join("/");
      return shellPrefix() + encoded + (search ? "?" + search : "");
    }
    async function navigateShell(fsPath, search) {
      // Leaving this note must not lose edits newer than the last autosave.
      const flushed = await window.__fusedFlushEdits();
      if (!flushed.ok) return;
      const url = urlForFsPath(fsPath, search);
      try {
        const top = window.top;
        void top.location.href; // throws when cross-origin
        top.history.pushState(null, "", url);
        top.dispatchEvent(new Event("fused:navigate"));
        return;
      } catch (e) { /* fall through */ }
      try { window.top.location.href = url; } catch (e) { location.href = url; }
    }

    // A link to `Note#Heading` navigates to the note and hands the heading over
    // as an ordinary param, so the target view can scroll to it and the URL
    // stays shareable — which is also how this view receives it (see load()).
    function openNote(path, heading) {
      navigateShell(path, heading ? "heading=" + encodeURIComponent(heading) : "");
    }

    // `Target#Heading|label` → [target, heading, label]. Both parts optional.
    function splitInner(inner) {
      const pipe = inner.indexOf("|");
      const head = pipe === -1 ? inner : inner.slice(0, pipe);
      const label = pipe === -1 ? "" : inner.slice(pipe + 1).trim();
      const hash = head.indexOf("#");
      return [
        (hash === -1 ? head : head.slice(0, hash)).trim(),
        hash === -1 ? "" : head.slice(hash + 1).trim(),
        label,
      ];
    }

    // ======================================================================
    // Live Preview (MD-18a)
    // ======================================================================
    // Obsidian's mechanism rather than an approximation of it: ONE decoration
    // set over the CM6 document. Markup is replaced by a widget or hidden
    // everywhere except the lines the selection touches, where the raw source
    // comes back so it can be edited. There is no second rendered copy of the
    // document, which is precisely what lets one surface both read and write
    // (MD-1) — no mode switch, and no caret to hand between two views.
    //
    // What a range IS comes from the vendored markdown grammar via syntaxTree,
    // so this file holds no block parser. Wikilinks are not part of that
    // grammar, so they are matched by regex and then checked AGAINST the tree,
    // which is how MD-3's code-masking rule holds here without a second copy
    // of it.

    const relinkEffect = CM.StateEffect.define();

    // Shown on every link when no scan ran (see wikilinkWidget). One sentence,
    // and it says what is unknown rather than what is wrong.
    const UNRESOLVED_HERE =
      "Link targets are not resolved here — this note's folder was not scanned.";

    // Node names whose text is code, and therefore never a link.
    const CODE_NODES = new Set([
      "InlineCode", "CodeText", "FencedCode", "CodeBlock", "CodeMark", "CodeInfo",
    ]);

    const HEADINGS = {
      ATXHeading1: 1, ATXHeading2: 2, ATXHeading3: 3,
      ATXHeading4: 4, ATXHeading5: 5, ATXHeading6: 6,
      SetextHeading1: 1, SetextHeading2: 2,
    };
    const EMPHASIS = {
      StrongEmphasis: "lp-bold",
      Emphasis: "lp-italic",
      Strikethrough: "lp-strike",
    };
    const EMPHASIS_MARKS = new Set(["EmphasisMark", "StrikethroughMark"]);

    // A widget is identified by `key` so CM can reuse the DOM across rebuilds
    // instead of replacing every widget on every keystroke.
    class DomWidget extends CM.WidgetType {
      constructor(key, build, opaque) {
        super();
        this.key = key;
        this.build = build;
        // `true` keeps CM's own event handling off the widget, so a click
        // reaches the delegated navigation handler instead of moving the
        // caret. `false` is what makes a widget click-to-edit: the caret
        // lands inside it, the line becomes selected, and the source shows.
        this.opaque = opaque === true;
      }
      eq(other) { return other.key === this.key; }
      toDOM(editorView) { return this.build(editorView); }
      ignoreEvent() { return this.opaque; }
    }

    function lineClass(state, from, to, cls) {
      const out = [];
      const first = state.doc.lineAt(from).number;
      const last = state.doc.lineAt(Math.min(to, state.doc.length)).number;
      for (let n = first; n <= last; n++) {
        out.push(CM.Decoration.line({ class: cls }).range(state.doc.line(n).from));
      }
      return out;
    }

    // Which lines have the caret (or a selection) on them: the reveal rule.
    // Line-level, matching Obsidian — putting the caret on a line un-renders
    // that whole line's markup, not just the one node under the cursor.
    function selectedLines(state) {
      const lines = new Set();
      // Read-only mode reveals nothing, ever (MD-1a). `editable.of(false)`
      // leaves no caret so there is usually nothing to reveal — but a browser
      // text selection inside a non-editable view still reaches the state's
      // selection, and swiping over a heading would un-render it. One guard
      // makes the mode deterministic instead of dependent on that.
      if (!editing()) return lines;
      for (const range of state.selection.ranges) {
        const first = state.doc.lineAt(range.from).number;
        const last = state.doc.lineAt(range.to).number;
        for (let n = first; n <= last; n++) lines.add(n);
      }
      return lines;
    }

    function touched(state, lines, from, to) {
      const first = state.doc.lineAt(from).number;
      const last = state.doc.lineAt(Math.min(to, state.doc.length)).number;
      for (let n = first; n <= last; n++) if (lines.has(n)) return true;
      return false;
    }

    // ---- widget builders ----------------------------------------------------

    // A wikilink resolved by graph.py, a dim ghost that offers to create the
    // note, or — when no scan ran at all — an inert link that claims nothing.
    // The resolved ones carry the attributes the one delegated click handler
    // listens for, so every link surface in this template navigates by one code
    // path.
    //
    // THREE states, not two (MD-11). "Scanned, and this target did not resolve"
    // is a ghost: dashed, and clicking it creates the note. "Not scanned, so
    // resolution is unknown" is neither — on a remote mount, or after a refused
    // or failed scan, `resolved` is null and nothing was ever looked up. Drawing
    // a ghost there asserts the target does not exist when we never looked, and
    // offers to create a note that may be sitting right next to this one.
    function wikilinkWidget(raw) {
      const [target, heading, label] = splitInner(raw.replace(/^!?\[\[|\]\]$/g, ""));
      const embed = raw.startsWith("!");
      const known = resolved !== null;
      const row = known ? resolved.get(target) : undefined;
      const path = row ? row.path : null;
      // `[[#Heading]]` has no target: it points inside THIS note. Reading as
      // "#Heading" rather than " > Heading" (an empty name and a separator) is
      // the whole of what it needs to say.
      const anchorOnly = !target && !!heading;
      const shown = label
        || (anchorOnly ? "#" + heading : target + (heading ? " > " + heading : ""));
      // `known` belongs in the key: widgets are reused across rebuilds by key,
      // so an inert link has to be replaced when a scan finally lands (MD-9).
      const key = "wl:" + (embed ? "!" : "") + raw + "|" + (path || "")
        + (known ? "|k" : "|u");
      return new DomWidget(key, () => {
        if (embed && path && !isNote(path)) {
          const img = document.createElement("img");
          img.className = "lp-img";
          img.src = fused.rawUrl(path);
          img.alt = target;
          return img;
        }
        // `!anchorOnly`: `![[#Heading]]` names no file, so "Missing embed" would
        // be answering a question nobody asked. It degrades to the anchor link
        // below (embedding a section of this same note is not supported).
        if (embed && !path && !anchorOnly) {
          const span = document.createElement("span");
          // Unknown reads as "we did not look", not as "it is missing".
          span.className = known ? "wl-embed-missing" : "wl-embed-unknown";
          span.textContent = known
            ? "Missing embed: " + target : "Embed: " + target;
          if (!known) span.title = UNRESOLVED_HERE;
          return span;
        }
        const a = document.createElement("a");
        if (anchorOnly) {
          // An anchor into this same note is a LINK, and it needs no scan to be
          // one — the target document is the one already open. It rendered as a
          // dead ghost instead: no scan resolves an empty target (graph.py's
          // `_resolved_links` skips them, correctly — it is not an edge), so the
          // scanned branch below drew the create-me affordance with
          // `data-create=""`, and an empty attribute VALUE still matches
          // closest("[data-create]"), so clicking it ran createGhost("") and
          // died at the degenerate-name guard.
          a.className = "wl";
          a.dataset.anchor = heading;
          a.title = "Jump to " + heading + " in this note";
        } else if (!known) {
          // Inert: no ghost styling, no data-create, nothing to click.
          a.className = "wl wl-unknown";
          a.title = UNRESOLVED_HERE;
        } else if (!path) {
          // Unresolved: a ghost, and clicking it creates the note — Obsidian's
          // behaviour, and only possible because this template writes.
          a.className = "wl wl-ghost";
          a.dataset.create = target;
          a.title = "Unresolved — click to create this note";
        } else {
          a.className = "wl";
          a.dataset.path = path;
          if (heading) a.dataset.heading = heading;
          if (row && row.title) a.title = row.title;
          a.href = urlForFsPath(path, heading ? "heading=" + encodeURIComponent(heading) : "");
        }
        // A note embedded in a note links to it rather than inlining the whole
        // document, which would need a second parse and could recurse.
        a.textContent = shown;
        return a;
      }, true);
    }

    // `[label](target)`. An in-vault relative target is resolved against the
    // note's own folder and handed `data-path`, for the reason MD-4a records:
    // this document is served at /render?path=…, so a browser-relative href
    // resolves against the server root and misses the file entirely. A real
    // href is set too, so hover preview and ⌘-click behave like normal links.
    //
    // No extension filter: the shell opens any path with its own template, so a
    // link to a .png, a .pdf or a subfolder is as navigable as one to a note.
    function markdownLinkWidget(label, href) {
      const key = "ln:" + label + "|" + href;
      return new DomWidget(key, () => {
        const a = document.createElement("a");
        a.className = "lp-link";
        a.textContent = label || href;
        // Absolute paths, any scheme (http:, mailto:, data:) and a bare
        // #anchor are not vault paths — rewriting them would break them. MD-3
        // draws this same line for what counts as an edge.
        if (/^(#|\/|[a-z][a-z0-9+.-]*:)/i.test(href)) {
          a.href = href;
          a.target = "_blank";
          a.rel = "noopener";
          return a;
        }
        const hash = href.indexOf("#");
        const target = hash === -1 ? href : href.slice(0, hash);
        if (!target) { a.href = href; return a; }
        const heading = hash === -1 ? "" : decodeMaybe(href.slice(hash + 1));
        const path = resolvePath(noteDir(), decodeMaybe(target));
        a.dataset.path = path;
        if (heading) a.dataset.heading = heading;
        a.href = urlForFsPath(path, heading ? "heading=" + encodeURIComponent(heading) : "");
        return a;
      }, true);
    }

    // `![alt](src)`. Click-to-edit rather than opaque: the caret lands in the
    // source so the path can be fixed, which is the only way to edit it now
    // that there is no separate source mode.
    // A dropped or pasted video is written as `![](clip.mp4)` too (MD-23) —
    // markdown has no video syntax, and emitting a raw <video> tag would show
    // as literal text in every other markdown tool. So the ELEMENT is chosen
    // off the extension here: without this a clip renders as an <img> with a
    // source no browser can decode, i.e. a broken-image icon.
    // Every extension MEDIA_EXT can produce for a `video/*` blob must be in
    // here, or a pasted clip renders as a broken <img>. A container the
    // browser cannot decode (mkv) still belongs: a player reporting it cannot
    // play the file says far more than a broken-image icon.
    const VIDEO_EXT = /\.(mp4|webm|mov|m4v|ogv|mkv)$/i;

    function imageWidget(alt, src) {
      const key = "im:" + alt + "|" + src;
      return new DomWidget(key, () => {
        // The extension is read off the source BEFORE the scheme/absolute
        // branching below, so a `file:` URL or an absolute path to a clip
        // picks the player just as a relative one does.
        const isVideo = VIDEO_EXT.test(src.split(/[?#]/)[0]);
        const el = document.createElement(isVideo ? "video" : "img");
        if (isVideo) {
          el.className = "lp-video";
          // controls so it is playable in place; preload="metadata" so a note
          // full of clips fetches poster frames, not whole videos.
          el.controls = true;
          el.muted = true;
          el.preload = "metadata";
        } else {
          el.className = "lp-img";
          el.alt = alt;
        }
        if (/^[a-z][a-z0-9+.-]*:/i.test(src)) el.src = src;   // http:, data:, file:
        else if (src.startsWith("/")) el.src = fused.rawUrl(src);
        else el.src = fused.rawUrl(resolvePath(noteDir(), decodeMaybe(src)));
        return el;
      }, false);
    }

    // A task checkbox is clickable and writes back, as in Obsidian — and it
    // stays rendered even with the caret on its line, also as in Obsidian.
    // The position comes from posAtDOM at click time rather than from a count
    // of markers in the document, so an edit between render and click cannot
    // tick the wrong box.
    function taskWidget(checked) {
      return new DomWidget("task:" + checked, (editorView) => {
        const box = document.createElement("input");
        box.type = "checkbox";
        box.className = "lp-task";
        box.checked = checked;
        box.disabled = !editing();
        if (!editing()) return box;
        box.addEventListener("mousedown", (e) => e.stopPropagation());
        box.addEventListener("change", () => {
          const at = editorView.posAtDOM(box);
          const line = editorView.state.doc.lineAt(at);
          const offset = line.text.indexOf("[", at - line.from);
          if (offset === -1) return;
          const inner = line.from + offset + 1;
          editorView.dispatch({
            changes: { from: inner, to: inner + 1, insert: box.checked ? "x" : " " },
          });
          void save();
        });
        return box;
      }, true);
    }

    function hrWidget() {
      return new DomWidget("hr", () => {
        const hr = document.createElement("hr");
        hr.className = "lp-hr";
        return hr;
      }, false);
    }

    // A pipe table rendered as a table. Cell text is shown verbatim — inline
    // markup inside a cell is not decorated, because a decoration cannot span
    // into a widget's DOM. Clicking the table puts the caret in the source,
    // which is where a cell is edited.
    function tableWidget(source) {
      return new DomWidget("tb:" + source, () => {
        const rows = source.split("\n")
          .map((line) => line.trim())
          .filter(Boolean)
          // The alignment row (`|---|:--:|`) is structure, not content.
          .filter((line) => !(/^[\s|:-]+$/.test(line) && line.includes("-")))
          .map((line) => line.replace(/^\|/, "").replace(/\|$/, "")
            .split("|").map((cell) => cell.trim()));
        const table = document.createElement("table");
        table.className = "lp-table";
        rows.forEach((cells, index) => {
          const tr = document.createElement("tr");
          for (const cell of cells) {
            const td = document.createElement(index === 0 ? "th" : "td");
            td.textContent = cell;
            tr.appendChild(td);
          }
          table.appendChild(tr);
        });
        return table;
      }, false);
    }

    // ---- the decoration set -------------------------------------------------

    const WIKILINK_RE = /!?\[\[([^\[\]\n]+?)\]\]/g;

    function within(tree, pos, names) {
      for (let node = tree.resolveInner(pos, 1); node; node = node.parent) {
        if (names.has(node.name)) return true;
      }
      return false;
    }

    // Takes a STATE, not a view, and walks the whole document — see the
    // StateField below for why it cannot be a view plugin, and therefore has no
    // viewport to narrow the walk to. The bound on that walk is `MAX_BYTES`
    // above: this surface never opens a file it did not agree to load, so 2 MB
    // is the worst case. (This comment used to cite the graph's 256 KB per-note
    // cap, which never bounded THIS walk — the editor's ceiling has always been
    // its own — and that cap is now gone.) Whole-document also removes the
    // viewport/height feedback loop that made scrolling jitter.
    function buildDecorations(state) {
      const lines = selectedLines(state);
      const tree = CM.syntaxTree(state);
      const out = [];
      // CM rejects overlapping replacements, so every replaced range is
      // recorded as it is made and the regex passes below skip anything that
      // would land inside one. Decorations are built as Ranges via
      // `.range(from, to)`, the shape Decoration.set takes. A replacement here
      // MAY span line breaks (the table widget does) — but only because these
      // come from a StateField: CM throws "Decorations that replace line breaks
      // may not be specified via plugins" for the same range out of a
      // ViewPlugin. `block: true` would additionally demand exact line
      // boundaries and throw without them.
      const blocked = [];
      function pushMark(from, to, cls) {
        if (from >= to) return;
        out.push(CM.Decoration.mark({ class: cls }).range(from, to));
      }
      function pushHide(from, to) {
        if (from >= to) return;
        out.push(CM.Decoration.replace({}).range(from, to));
        blocked.push([from, to]);
      }
      function pushWidget(from, to, widget) {
        out.push(CM.Decoration.replace({ widget }).range(from, to));
        blocked.push([from, to]);
      }
      const isBlocked = (from, to) => blocked.some(([a, b]) => from < b && to > a);

      // A bare `https://…` or the inside of an angle `<https://…>` (MD-24).
      // A MARK carrying its own `<a>`, not a replacement widget: the range's
      // display text ALREADY equals its target, so a widget would replace those
      // characters with an element rendering the identical characters — no
      // visible gain, and the caret loses the ability to sit inside the URL and
      // edit it. Nothing is rewritten on disk either (D200), which is what makes
      // this repair URLs in notes that were written long before it existed.
      function pushUrl(from, to) {
        const raw = state.doc.sliceString(from, to);
        // GFM's autolink extension matches three shapes, and only one of them
        // is already a URL: `www.x.com` and `me@x.com` are URL nodes too, and
        // an href of "www.x.com" resolves against this page rather than the web.
        const href = /^[a-z][a-z0-9+.-]*:/i.test(raw) ? raw
          : raw.includes("@") ? "mailto:" + raw
          : "https://" + raw;
        out.push(CM.Decoration.mark({
          class: "lp-link",
          tagName: "a",
          attributes: { href, target: "_blank", rel: "noopener" },
        }).range(from, to));
      }

      // Frontmatter is not part of the vendored grammar, and what the grammar
      // makes of it instead is actively wrong: `---` opens as a HorizontalRule
      // and `title: x\n---` closes as a SetextHeading2, so a YAML block would
      // render as a rule followed by a large heading. It is therefore matched
      // by a line scan, decorated as dim monospace, and — the part that
      // matters — every tree decoration inside it is suppressed below.
      // Dimmed rather than hidden: a properties table is separate work
      // (MD-18b), and a silently invisible block is worse than a plain one.
      let frontmatterEnd = -1;
      if (state.doc.lines > 1 && state.doc.line(1).text.trim() === "---") {
        for (let n = 2; n <= state.doc.lines; n++) {
          if (state.doc.line(n).text.trim() === "---") {
            frontmatterEnd = state.doc.line(n).to;
            break;
          }
        }
        if (frontmatterEnd !== -1) {
          out.push(...lineClass(state, 0, frontmatterEnd, "lp-fm-line"));
        }
      }

      tree.iterate({
        enter: (node) => {
          const name = node.name;
          // Inside frontmatter the grammar's answer is wrong (see above), so
          // nothing it says about this range is acted on.
          if (name !== "Document" && node.to <= frontmatterEnd) return false;
          const open = touched(state, lines, node.from, node.to);

          if (HEADINGS[name]) {
            pushMark(node.from, node.to, "lp-h" + HEADINGS[name]);
            return true; // descend: the HeaderMark child is hidden below
          }
          if (name === "HeaderMark") {
            const parent = node.node.parent;
            if (!parent || !HEADINGS[parent.name]) return false;
            if (touched(state, lines, parent.from, parent.to)) {
              pushMark(node.from, node.to, "lp-mark");
              return false;
            }
            // Swallow the space after `##` too, or the text starts indented.
            const after = state.doc.sliceString(node.to, node.to + 1);
            pushHide(node.from, node.to + (after === " " ? 1 : 0));
            return false;
          }
          if (EMPHASIS[name]) {
            pushMark(node.from, node.to, EMPHASIS[name]);
            return true;
          }
          if (EMPHASIS_MARKS.has(name)) {
            if (open) pushMark(node.from, node.to, "lp-mark");
            else pushHide(node.from, node.to);
            return false;
          }
          if (name === "InlineCode") {
            pushMark(node.from, node.to, "lp-code");
            return true;
          }
          if (name === "CodeMark") {
            const parent = node.node.parent;
            // Only an inline span's backticks vanish; a fence keeps its
            // markers, exactly as Obsidian does.
            if (!parent || parent.name !== "InlineCode") return false;
            if (open) pushMark(node.from, node.to, "lp-mark");
            else pushHide(node.from, node.to);
            return false;
          }
          if (name === "FencedCode" || name === "CodeBlock") {
            out.push(...lineClass(state, node.from, node.to, "lp-fence-line"));
            return true; // let the embedded language highlight inside
          }
          if (name === "Blockquote") {
            out.push(...lineClass(state, node.from, node.to, "lp-quote-line"));
            return true;
          }
          if (name === "QuoteMark") {
            if (open) pushMark(node.from, node.to, "lp-mark");
            else {
              const after = state.doc.sliceString(node.to, node.to + 1);
              pushHide(node.from, node.to + (after === " " ? 1 : 0));
            }
            return false;
          }
          if (name === "ListMark") {
            pushMark(node.from, node.to, "lp-bullet");
            return false;
          }
          if (name === "TaskMarker") {
            // Rendered even with the caret on its line — as in Obsidian, a
            // checkbox is a control, not markup you edit by hand.
            const checked = /[xX]/.test(state.doc.sliceString(node.from, node.to));
            pushWidget(node.from, node.to, taskWidget(checked));
            return false;
          }
          if (name === "HorizontalRule") {
            if (open) return false;
            pushWidget(node.from, node.to, hrWidget());
            return false;
          }
          if (name === "Table") {
            if (open) return true;
            pushWidget(node.from, node.to,
              tableWidget(state.doc.sliceString(node.from, node.to)));
            return false;
          }
          if (name === "Image" || name === "Link") {
            if (open) return true;
            const raw = state.doc.sliceString(node.from, node.to);
            const match = /^(!?)\[([^\]]*)\]\(([^()\s]*)\)$/.exec(raw);
            // No match means this is not a plain inline link: a reference
            // link, a titled link, or — the common case — the inner brackets
            // of a `[[wikilink]]`, which the regex pass below owns.
            if (!match) return true;
            pushWidget(node.from, node.to, match[1]
              ? imageWidget(match[2], match[3])
              : markdownLinkWidget(match[2], match[3]));
            return false;
          }
          if (name === "URL") {
            // A `[lbl](target)` link's URL is markup INSIDE a node the branch
            // above owns — either replaced whole by the link widget (and then
            // never reached, since that branch returns false) or deliberately
            // left as source, as for a titled or reference link. Decorating it
            // here would be asserting a second time about the same range.
            const parent = node.node.parent;
            if (parent && (parent.name === "Link" || parent.name === "Image")) {
              return false;
            }
            // The grammar does not emit a URL node inside a fence or a code
            // span, so this guard is belt-and-braces — but it is the SAME
            // narrow code-node set the wikilink pass uses (MD-3), rather than a
            // new "is this code?" rule, because the last one of those silently
            // stopped every wikilink from rendering.
            if (within(tree, node.from + 1, CODE_NODES)) return false;
            // No `open` check: a bare URL hides nothing, so there is nothing for
            // the caret to reveal. Its own text stays exactly as typed either
            // way, and un-styling it under the caret would only make the line
            // flicker. An Autolink's brackets DO hide, and they reveal below.
            pushUrl(node.from, node.to);
            return false;
          }
          if (name === "LinkMark") {
            // Only an angle autolink's `<`/`>` vanish. A `[lbl](target)` link's
            // marks belong to a node already replaced whole, and a wikilink's
            // inner brackets belong to the regex pass — hiding either here would
            // put a replacement inside a replacement.
            const parent = node.node.parent;
            if (!parent || parent.name !== "Autolink") return false;
            if (open) pushMark(node.from, node.to, "lp-mark");
            else pushHide(node.from, node.to);
            return false;
          }
          return true;
        },
      });

      // Wikilinks are not in the grammar, so they are matched by regex and then
      // checked AGAINST the tree: a `[[x]]` inside a fence stays literal, which
      // is the same line graph.py draws over the same text (MD-3). A `[[` inside
      // frontmatter is not a link either.
      const chunk = state.doc.toString();
      WIKILINK_RE.lastIndex = 0;
      let match;
      while ((match = WIKILINK_RE.exec(chunk))) {
        const start = match.index;
        const end = start + match[0].length;
        if (start < frontmatterEnd) continue;
        if (isBlocked(start, end) || within(tree, start + 2, CODE_NODES)) continue;
        if (touched(state, lines, start, end)) continue;
        pushWidget(start, end, wikilinkWidget(match[0]));
      }

      return CM.Decoration.set(out, true);
    }

    // A StateField, NOT a ViewPlugin — and this is load-bearing, not a style
    // preference. CM refuses a plugin-provided replacement that spans a line
    // break ("Decorations that replace line breaks may not be specified via
    // plugins", @codemirror/view), and the table widget replaces a multi-line
    // Table node with one element. As a plugin that threw during the view update
    // the instant a table scrolled into the viewport, abandoning the rest of the
    // render and leaving unpainted white regions on screen — reported as "parts
    // of the page go blank while scrolling". A state field is allowed to span
    // line breaks, so the constraint disappears rather than being worked around.
    // Do not "simplify" this back to a ViewPlugin.
    const livePreviewField = CM.StateField.define({
      create: (state) => buildDecorations(state),
      update(value, tr) {
        // The syntax tree is NOT complete when the view opens: the language
        // extension parses a first chunk and then advances in the background,
        // dispatching as it goes. A whole-document walk over a half-parsed tree
        // would leave everything past the parse frontier undecorated until the
        // next keystroke, so an advanced tree counts as a reason to rebuild.
        // Identity compare — the language field hands out a new Tree each time.
        if (tr.docChanged || tr.selection
            || CM.syntaxTree(tr.startState) !== CM.syntaxTree(tr.state)
            || tr.effects.some((e) => e.is(relinkEffect))) {
          return buildDecorations(tr.state);
        }
        // Nothing that changes what renders, and `tr.docChanged` above covers
        // every case where positions moved, so the set is reused as-is.
        return value;
      },
      provide: (field) => CM.EditorView.decorations.from(field),
    });

    // ---- saving: Obsidian's model (MD-16) ----------------------------------
    // No save button, no dirty dot, no prompt. Autosave on an idle timer, on
    // focus loss and on tab switch; Cmd/Ctrl+S only forces the flush early.
    function setDirty(next) {
      dirty = next;
      // Deliberately no dirty indicator: the absence of save ceremony IS the
      // behaviour being copied. The slot only ever carries "Saving…" or a
      // failure, both of which a user does need to see.
      if (conflictEl.style.display !== "flex" && !saving) {
        saveStateEl.textContent = "";
        saveStateEl.classList.remove("error");
      }
    }

    function armAutosave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => { void save(); }, AUTOSAVE_MS);
    }

    async function save() {
      clearTimeout(saveTimer);
      while (saving && savePromise) await savePromise;
      if (!view || !dirty || !writable) return;
      if (conflictEl.style.display === "flex") return; // never auto-overwrite
      savePromise = doSave();
      await savePromise;
    }

    async function doSave() {
      // CM's Text is immutable, so a reference compare after the await detects
      // edits that landed during the write — those must not be masked by
      // setDirty(false), or the idle timer would skip them.
      const docState = view.state.doc;
      const body = docState.toString();
      saving = true;
      saveStateEl.textContent = "Saving…";
      saveStateEl.classList.remove("error");
      try {
        const st = await fused.writeFile(file, body, { expectedMtime: mtime });
        mtime = st.mtime;
        text = body;
        hideConflict();
        if (view.state.doc === docState) {
          setDirty(false);
          saveStateEl.textContent = "";
        } else {
          setDirty(true);
          armAutosave();
        }
        // Each save re-parses exactly this note, so the ghosts, the backlinks,
        // the graph and the `[[` candidates stay current with no rebuild (MD-9).
        candidates = null;
        await refreshLinks();
        if (graphOn()) void loadGraph();
      } catch (err) {
        if (err.type === "conflict") {
          showConflict("This note changed on disk while you were editing it.");
        } else if (err.type === "readonly") {
          writable = false;
          lockEditor("This file is read-only, so your edits can't be saved.");
        } else {
          saveStateEl.textContent = "Save failed: " + (err.message || "");
          saveStateEl.classList.add("error");
        }
      } finally {
        saving = false;
      }
    }

    function showConflict(message) {
      conflictTextEl.textContent = message;
      conflictEl.style.display = "flex";
      saveStateEl.textContent = "";
    }

    function hideConflict() { conflictEl.style.display = "none"; }

    async function reloadFromDisk() {
      try {
        const st = await fused.stat(file);
        const fresh = await fused.readFile(file);
        text = fresh;
        mtime = st.mtime;
        const wasWritable = writable;
        writable = st.writable !== false;
        hideConflict();
        if (view) {
          view.dispatch({ changes: { from: 0, to: view.state.doc.length, insert: fresh } });
        }
        setDirty(false);
        // Reassigning `writable` changes nothing on its own: `editable`/
        // `readOnly` are facets chosen when the view is BUILT, and the corner
        // button's state comes from applyEditMode. Without this, a file that had
        // become read-only stayed typeable (the edits then failed at save time)
        // and one that had become writable stayed locked until the iframe
        // reloaded — and this is the silent-reload path, so nothing else was
        // going to notice. Only on a change: rebuilding every reload is churn.
        if (writable !== wasWritable) {
          fusedRoBadge.update(document.getElementById("ro"),
            writable ? "" : "Read-only",
            writable ? "" : "This file can't be written, so the editor opens locked.");
          applyEditMode(true);
        }
        await refreshLinks();
      } catch (err) {
        saveStateEl.textContent = "Reload failed: " + (err.message || "");
        saveStateEl.classList.add("error");
      }
    }

    // "Keep my version" is the one write that goes without the lock — the user
    // has been shown the conflict and chosen.
    async function keepMine() {
      if (!view) return;
      const body = view.state.doc.toString();
      try {
        const st = await fused.writeFile(file, body);
        mtime = st.mtime;
        text = body;
        hideConflict();
        setDirty(false);
        await refreshLinks();
      } catch (err) {
        saveStateEl.textContent = "Save failed: " + (err.message || "");
        saveStateEl.classList.add("error");
      }
    }

    // External changes are noticed on focus and on becoming visible rather than
    // by a stat ticker: a poll is the traffic that killed a mount once already
    // (runtime.js's fs/events note), and this view must stay mount-agnostic.
    // Clean buffer -> silent reload, exactly as Obsidian does. Dirty buffer and
    // the mtime moved -> the banner, which is the one deliberate deviation
    // (MD-17): fused-render sits on shared paths where Obsidian's
    // only-writer-in-the-vault assumption does not hold.
    async function checkExternalChange() {
      if (!file || saving) return;
      let st;
      try {
        st = await fused.stat(file);
      } catch (err) {
        return; // transient — the next focus or the next save will notice
      }
      if (st.mtime === mtime) return;
      if (!dirty) {
        await reloadFromDisk();
        return;
      }
      showConflict("This note changed on disk while you were editing it.");
    }

    function lockEditor(message) {
      clearTimeout(saveTimer);
      fusedRoBadge.update(document.getElementById("ro"), "Read-only", message);
      if (view) buildEditor(view.state.doc.toString()); // rebuild with the lock on
      // The file just turned out to be unwritable, so the mode button has to
      // stop offering editing (MD-1a) — false because buildEditor already ran.
      applyEditMode(false);
    }

    function wantsDark() {
      return document.documentElement.getAttribute("data-theme") !== "light";
    }

    // ---- editing behaviours (MD-18) ----------------------------------------
    // Each of these is what makes Obsidian feel like Obsidian, and each is a
    // small keymap entry rather than a feature. Smart lists, list renumbering
    // and blockquote continuation are NOT reimplemented here: they are
    // `markdownKeymap` from the markdown grammar we vendored, which is the same
    // code Obsidian's own editor runs.
    function toggleWrap(editorView, marker) {
      const state = editorView.state;
      let { from, to } = state.selection.main;
      // Obsidian's ⌘B with nothing selected wraps the WORD under the caret, not
      // an empty pair of markers, and that expansion is also what makes the
      // unwrap below reachable without a selection: the caret sits inside the
      // word it wrapped a moment ago. `state.wordAt` is the language's own idea
      // of a word, so there is no second definition of one here; it answers null
      // on whitespace and on an empty line, and there the empty pair with the
      // caret between them is still the right thing to type into.
      if (from === to) {
        const word = state.wordAt(from);
        if (word) {
          from = word.from;
          to = word.to;
        }
      }
      const pre = state.sliceDoc(Math.max(0, from - marker.length), from);
      const post = state.sliceDoc(to, Math.min(state.doc.length, to + marker.length));
      if (pre === marker && post === marker) {
        editorView.dispatch({
          changes: [
            { from: from - marker.length, to: from },
            { from: to, to: to + marker.length },
          ],
          selection: { anchor: from - marker.length, head: to - marker.length },
        });
      } else {
        editorView.dispatch({
          changes: [{ from, insert: marker }, { from: to, insert: marker }],
          selection: { anchor: from + marker.length, head: to + marker.length },
        });
      }
      return true;
    }

    // ⌘K with the caret already inside `[label](target)` has to EDIT that link,
    // not nest a second one inside it. Which ranges are links comes from the
    // tree (MD-3: no second parser here) — but the tree alone is not enough, and
    // this is the grammar trap that already bit the link layer once: the
    // vendored grammar wraps a `[[wikilink]]`'s brackets in `Link`/`Image` nodes
    // too (MD-18a). So the enclosing node must ALSO parse as a plain inline
    // link, which is the same second test the Live Preview builder applies
    // before it draws a link widget — a reference link, a titled link and a
    // wikilink all fail it and are left to be typed over as before.
    function enclosingLinkTarget(state, pos) {
      const tree = CM.syntaxTree(state);
      for (let node = tree.resolveInner(pos, 0); node; node = node.parent) {
        if (node.name !== "Link") continue;
        const raw = state.doc.sliceString(node.from, node.to);
        const match = /^\[([^\]]*)\]\(([^()\s]*)\)$/.exec(raw);
        if (!match) continue;
        const start = node.from + match[1].length + 3;
        return { from: start, to: start + match[2].length };
      }
      return null;
    }

    function insertLink(editorView) {
      const { from, to } = editorView.state.selection.main;
      const existing = enclosingLinkTarget(editorView.state, to);
      if (existing) {
        // Selecting the target rather than rewriting anything: the next
        // keystroke replaces the URL, which is what "⌘K edits the link" is.
        editorView.dispatch({ selection: { anchor: existing.from, head: existing.to } });
        return true;
      }
      const selected = editorView.state.sliceDoc(from, to);
      const isUrl = /^[a-z][a-z0-9+.-]*:\/\/\S*$/i.test(selected);
      const inserted = isUrl ? `[](${selected})` : `[${selected}]()`;
      editorView.dispatch({
        changes: { from, to, insert: inserted },
        selection: { anchor: isUrl ? from + 1 : from + selected.length + 3 },
      });
      return true;
    }

    // Cmd+Enter toggles the task on this line, adds a checkbox to a plain list
    // item, or makes the line a task — the three states Obsidian cycles.
    function toggleCheckbox(editorView) {
      const line = editorView.state.doc.lineAt(editorView.state.selection.main.head);
      const box = /^(\s*(?:[-*+]|\d+[.)])\s+)\[([ xX])\]/.exec(line.text);
      if (box) {
        const at = line.from + box[1].length + 1;
        editorView.dispatch({
          changes: { from: at, to: at + 1, insert: box[2] === " " ? "x" : " " },
        });
        return true;
      }
      const bullet = /^(\s*(?:[-*+]|\d+[.)])\s+)/.exec(line.text);
      const indent = /^\s*/.exec(line.text)[0];
      editorView.dispatch({
        changes: bullet
          ? { from: line.from + bullet[1].length, insert: "[ ] " }
          : { from: line.from + indent.length, insert: "- [ ] " },
      });
      return true;
    }

    // MD-1a/MD-15: read-only is the `readOnly` + `editable` facets, and
    // `editable.of(false)` is what keeps these keys from being delivered at all —
    // but neither facet FILTERS a hand-built dispatch, and every command above
    // builds its own. So each writing command asks the state instead of trusting
    // that, and swallows the key (returns true) so no browser default fires on a
    // buffer that is supposed to be inert.
    const whenWritable = (command) => (editorView) =>
      editorView.state.readOnly ? true : command(editorView);

    const editorKeymap = [
      // Tab accepts an open completion FIRST: CM's own completionKeymap binds
      // only Enter to acceptCompletion, and Tab is what a Tab-completing habit
      // reaches for. `acceptCompletion` returns false with no popup open, so
      // indenting the list item stays Tab's ordinary meaning.
      {
        key: "Tab",
        run: whenWritable((v) => CM.acceptCompletion(v) || CM.indentMore(v)),
        shift: whenWritable(CM.indentLess),
      },
      { key: "Mod-b", run: whenWritable((v) => toggleWrap(v, "**")) },
      { key: "Mod-i", run: whenWritable((v) => toggleWrap(v, "*")) },
      // Obsidian ships no default hotkey for either of these, so there is none
      // to match; both are the marker-agnostic toggleWrap, and both already
      // render in Live Preview (Strikethrough and InlineCode, MD-18a), so
      // neither costs a decoration. ⌘⇧X and ⌘⇧E are free of markdownKeymap,
      // basicSetup's default/search/closeBrackets keymaps and the completion
      // keymap. `==` highlight is deliberately absent: the grammar has no rule
      // for it and Live Preview would leave the `==` bare on the page.
      { key: "Mod-Shift-x", run: whenWritable((v) => toggleWrap(v, "~~")) },
      { key: "Mod-Shift-e", run: whenWritable((v) => toggleWrap(v, "`")) },
      { key: "Mod-k", run: whenWritable(insertLink) },
      { key: "Mod-Enter", run: whenWritable(toggleCheckbox) },
    ];

    // ---- pasted and dropped media (MD-23) ----------------------------------
    // "Copy image" in a browser puts the image BYTES on the clipboard, not a
    // path, so a paste and a drag from Finder arrive the same way: a FileList,
    // on `clipboardData.files` or `dataTransfer.files`. The only difference is
    // where the link lands — the caret for a paste, the pointer for a drop —
    // which is why the helper below takes `pos` as a parameter rather than
    // reading the selection itself.

    // A blob's own MIME type is what the clipboard gives us (a pasted
    // screenshot has no filename at all), so the extension is derived from it.
    // Only the formats a browser can actually display are mapped; anything
    // else falls back to the file's own name, then to the MIME subtype, so an
    // unusual-but-valid type still lands on disk with a plausible extension
    // instead of none.
    // Every `video/*` value here MUST also satisfy VIDEO_EXT, or the widget
    // renders the clip as an <img> and the user gets a broken-image icon —
    // which is exactly what `video/x-m4v` did before it was mapped, falling
    // through to the subtype and producing `pasted-….x-m4v`. A source test
    // pins that agreement for every entry rather than trusting this comment.
    const MEDIA_EXT = {
      "image/png": "png", "image/jpeg": "jpg", "image/gif": "gif",
      "image/webp": "webp", "image/svg+xml": "svg", "image/avif": "avif",
      "image/bmp": "bmp", "image/tiff": "tif", "image/x-icon": "ico",
      "video/mp4": "mp4", "video/webm": "webm", "video/quicktime": "mov",
      "video/ogg": "ogv", "video/x-m4v": "m4v", "video/x-matroska": "mkv",
    };

    // Images and video only. A drag from Finder can carry anything, and a paste
    // from another app often carries an `image/*` blob ALONGSIDE the text
    // flavour — filtering here is what keeps a plain-text paste plain.
    function mediaFiles(list) {
      return Array.prototype.filter.call(
        list || [], (f) => /^(image|video)\//.test(f.type || ""));
    }

    // Did this drag carry FILES, as opposed to text being dragged within the
    // note? `dataTransfer.files` is empty during a dragover, so the type list
    // is the only thing askable that early — and `drop` has to ask the SAME
    // question, or the two disagree about which events the browser still owns.
    function dragHasFiles(event) {
      const types = (event.dataTransfer || {}).types;
      return !!types && Array.prototype.indexOf.call(types, "Files") !== -1;
    }

    // pasted-YYYYMMDD-HHMMSS.ext, in local time — the name before it is checked
    // for collisions (freeMediaName does that). The extension comes from the
    // MIME type first because a pasted screenshot has no filename at all; the
    // `x-` strip keeps an unmapped vendor type (`image/x-foo`) from producing
    // a literal `.x-foo`.
    function mediaName(file) {
      const pad = (n) => String(n).padStart(2, "0");
      const d = new Date();
      const stamp = String(d.getFullYear()) + pad(d.getMonth() + 1) + pad(d.getDate())
        + "-" + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
      const named = /\.([a-z0-9]+)$/i.exec(file.name || "");
      const ext = MEDIA_EXT[file.type] || (named && named[1].toLowerCase())
        || (file.type || "").split("/")[1].replace(/^x-/, "") || "bin";
      return "pasted-" + stamp + "." + ext;
    }

    async function mediaExists(path) {
      try {
        await fused.stat(path);
        return true;
      } catch (err) {
        // stat rejects for a path that is not there, which is the answer we
        // want rather than a failure. Any other cause (the server being down)
        // also reads as "not there" — and the upload right behind this will
        // fail loudly on its own, so nothing is hidden by being optimistic.
        return false;
      }
    }

    // The first free `pasted-…` name in `assets`.
    //
    // The timestamp alone is NOT unique: two pastes inside the same second
    // produce the same name and the upload does an unconditional replace, so
    // the first file would be silently destroyed. Probing and bumping also
    // covers several files in one gesture — each upload is awaited, so file 1
    // is already on disk by the time file 2 is named.
    async function freeMediaName(assets, file) {
      const base = mediaName(file);
      const dot = base.lastIndexOf(".");
      const stem = base.slice(0, dot);
      const ext = base.slice(dot);
      let name = base;
      // Bounded: a stat that answers "yes" to everything must not spin.
      for (let n = 2; n < 100; n++) {
        if (!(await mediaExists(assets + "/" + name))) return name;
        name = stem + "-" + n + ext;
      }
      return name;
    }

    // One place says why a paste or a drop did not land — the same status
    // element a failed save writes to, so there is a single error surface.
    function mediaNotice(message) {
      saveStateEl.textContent = message;
      saveStateEl.classList.add("error");
    }

    // Write the blobs beside the note and link them in at `pos`.
    async function insertMediaFiles(view, files, pos) {
      const dir = noteDir();
      if (!dir) return;
      // A shared assets/ next to the note, created on demand: the endpoint
      // deliberately never creates intermediate directories (same contract as
      // /api/fs/write), so the second paste onwards gets a typed "exists" back,
      // which is the expected case rather than a failure.
      const assets = dir + "/assets";
      try {
        try {
          await fused.mkdir(assets);
        } catch (err) {
          if (err.type !== "exists") throw err;
        }
