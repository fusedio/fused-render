  // exists for the spawn window above. Each miss waits one poll interval, so
  // the working row appears within ~400ms of the run becoming visible.
  for (let tries = 0; tries < 8; tries++) {
    if (tries) await sleep(400);
    if (logGen !== gen) return;       // the reader left; nothing here is ours
    if (activeRun) return;            // a turn is attached — adopted, or the user's own
    if (sending) continue;            // gate held THIS tick; look again, don't give up
    let live = null;
    try {
      live = await fused.runPython(AGENT, {
        action: "live_run", file: FILE, session_id: session_id || "",
      }, { key: null });
    } catch (e) {
      return;   // a failed lookup leaves the transcript exactly as it rendered
    }
    // Both can have changed across the await; re-check before acting on the
    // answer — adopting into a wiped log, or over a turn the user started
    // meanwhile, is worse than the miss this watch exists to fix.
    if (logGen !== gen || activeRun) return;
    const id = live && live.run_id;
    if (!id) continue;
    if (sending) continue;            // taken mid-lookup — same answer as above
    // Same `replace` posture as every other `run` write: it is bookkeeping about
    // the frame's state, not a step the reader took, so it must not cost an entry.
    fused.params.set("run", id, { history: "replace" });
    // resumeRun can itself bail on a gate grabbed between these two lines — the
    // loop, not this call, is the guarantee: a bailed attempt comes back around,
    // and the `activeRun` check above ends the watch once anyone has attached.
    await resumeRun(id);
    // resumeRun resolves at the END of the turn, so a completed call means the
    // run was handled — its done branch cleared the param. The one call that
    // resolves with the param still reading `id` is the bail above, and only
    // that one earns another lap.
    if (fused.params.get("run") !== id) return;
  }
}

async function resumeRun(run_id, opts) {
  const neverShown = !!(opts && opts.neverShown);
  const retryUnknown = !!(opts && opts.retryUnknown);
  if (sending) return;
  sending = true;
  const seat = ++sendSeq;
  // Sampled before the probe, same reason as sendMessage's (Bugbot, PR #653):
  // a Back landing during the awaited probe must outdate the loop's number.
  const gen = logGen;
  try {
    let probe = await fused.runPython(AGENT, { action: "poll", run_id, file: FILE }, { key: null });
    if (logGen !== gen) return;  // the reader left mid-probe; nothing here is theirs to redraw
    if (probe.error === "unknown run_id" && retryUnknown) {
      // A frame handed a run id by its EMBEDDER (the canvases workspace's
      // "Fix with Claude" navigates this iframe with ?run= the moment the
      // spawn call returns) can boot before the freshly created run dir is
      // visible to the agent — a race, not a stale bookmark. A few short
      // retries tell the two apart; only then is the id written off.
      for (let i = 0; i < 5 && probe.error === "unknown run_id"; i++) {
        await new Promise((r) => setTimeout(r, 700));
        probe = await fused.runPython(AGENT, { action: "poll", run_id, file: FILE }, { key: null });
      }
    }
    if (probe.error === "unknown run_id" || probe.error === "run is for another target") {
      // stale param — a bookmarked mid-run URL, a pruned tmp, or a run id that
      // survived onto a DIFFERENT target's page (the agent refuses those now,
      // same recovery) — nothing to attach to, and nothing to hand annotations
      // back to: resolve any stragglers
      fused.params.set("run", "", { history: "replace", default: "" });
      annResolveSent();
      return;
    }
    const probeMsg = stripBlocks(probe.message || "");
    const users = log.querySelectorAll(".user .bubble");
    const lastUser = users[users.length - 1];
    const lastTurn = lastUser && lastUser.parentElement;
    // A marker-only message never counts as a match: every such send collapses to
    // the same text, so it can't identify a specific turn — and a false match
    // trims another turn's assistant rows. Worst case for refusing: a duplicated
    // marker row, which is harmless by comparison. `isMarkerOnly` rather than a
    // literal, so a marker added to stripBlocks cannot leave this check behind.
    // `neverShown` first: with it, identical text is a COINCIDENCE (the same
    // prompt sent twice), never this run's own line, so no match is legitimate.
    const matches = !neverShown && !!lastUser && !isMarkerOnly(probeMsg)
                    && lastUser.textContent === probeMsg;
    if (probe.done) {
      // Run finished with no frame attached: only repair what the restored
      // transcript can provably be missing (see the claude template).
      fused.params.set("run", "", { history: "replace", default: "" });
      annResolveSent();  // the run this frame missed still handled its notes
      snapInvalidate();  // ...and may have edited the file while we were away
      if (probe.error) {
        if (matches || !users.length) {
          addError(probe.error);
        } else if (neverShown) {
          // The turn is not on screen and never was, so the failure needs its own
          // user line to hang under — otherwise the error reads as belonging to
          // whatever the reader last said.
          if (probeMsg) addUser(probeMsg);
          addError(probe.error);
        }
        return;
      }
      // `probe` is a poll payload, so it carries the turn's segments too — the
      // repair has to render what pollLoop would have, or a run that finished
      // while this frame was away loses its whole tool timeline until the next
      // history restore puts it back.
      if (matches) {
        while (lastTurn.nextElementSibling) lastTurn.nextElementSibling.remove();
        if (probe.text || (probe.segments || []).length) {
          attachCodeCopy(addAssistantTurn(probe.text, probe.segments));
        }
      } else if ((!users.length || neverShown) && probeMsg) {
        // Appended, never matched: either the log is empty, or the caller has told
        // us this run's turn was never on screen (a scheduled send that fired and
        // finished between polls). Both render the whole turn — user line plus the
        // assistant rows and their tool timeline from the poll payload.
        addUser(probeMsg);
        if (probe.text || (probe.segments || []).length) {
          attachCodeCopy(addAssistantTurn(probe.text, probe.segments));
        }
      }
      scrollBottom();
      return;
    }
    if (matches) {
      // In flight and this turn's user line is on screen: keep it, drop the
      // partial assistant rows — pollLoop re-streams the whole turn.
      while (lastTurn.nextElementSibling) lastTurn.nextElementSibling.remove();
    } else if (probeMsg) {
      addUser(probeMsg);
    }
    await pollLoop(run_id, gen);
  } catch (err) {
    console.warn("run re-attach failed:", err.message);
  } finally {
    if (sendSeq === seat) sending = false;
    focusBox(box);
  }
  // Same-generation only — see sendMessage's tail (Bugbot, PR #653).
  if (logGen === gen) drainQueue();
}

function submitChat() {
  // Nothing leaves this composer while a scheduled message is pending in this
  // session — not a typed line, not a queued one, not an annotation-only send.
  // The guard sits above the queue branch on purpose: parking text for the turn
  // to drain puts it in the same context the block exists to keep clean.
  if (schedBlocked()) return;
  // Send is a send, always. Deferral used to be decided HERE, above the queue
  // branch, and the whole question left the composer with the When pill — so what
  // this key does no longer depends on a dropdown two controls away, which was
  // most of what that pill cost to read. Scheduling is the calendar button beside
  // it now, and it navigates rather than sending anything.
  //
  // A live run queues instead of refusing: the text is parked and fired when
  // the turn ends. Gated on activeRun, NOT `sending` — `sending` is also held
  // by loadHistory and resumeRun's probe, and a message typed while browsing
  // an old session must not be parked with no run to drain it after.
  if (activeRun) {
    const message = box.value.trim();
    if (!message) return;  // text-only queue; annotation-only sends can't park
    box.value = "";
    growBox();
    queueMessage(message);
    return;
  }
  if (sending) return;
  const message = box.value.trim();
  // notes alone are sendable, and so is a bare picture (captured, pasted or
  // dropped) with no words at all
  if (!message && !annPending().length && !shotAttached.length) return;
  box.value = "";
  growBox();
  sendMessage(message);
}
// The submit event is the send BUTTON's path (Enter in the box is handled below
// and never reaches here): while a run is live the button is a stop button.
document.getElementById("inputbox").onsubmit = (e) => {
  e.preventDefault();
  if (activeRun) { stopRun(); return; }
  submitChat();
};
box.addEventListener("keydown", (e) => {
  // Enter never stops a run — a user drafting the next message mid-run must not
  // kill the turn with a keystroke meant to queue text. Only the button (now a
  // stop square) and Escape do.
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submitChat(); }
});

// ── home: big input + this file's past sessions ──
document.getElementById("card").onsubmit = (e) => {
  e.preventDefault();
  if (activeRun) { stopRun(); return; }
  if (sending) return;
  const message = homebox.value.trim();
  // notes alone are sendable, and so is a bare picture (captured, pasted or
  // dropped) with no words at all
  if (!message && !annPending().length && !shotAttached.length) return;
  homebox.value = "";
  growHome();
  enterChat();
  sendMessage(message);
};
homebox.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    document.getElementById("card").requestSubmit();
  }
});

function ago(ts) {
  const s = Math.max(0, Date.now() / 1000 - ts);
  if (s < 60) return "now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  if (s < 172800) return "yesterday";
  return Math.floor(s / 86400) + "d ago";
}

// Content-shaped placeholder for a restoring transcript.
function renderLogSkeleton() {
  log.innerHTML = "";
  const user = document.createElement("div");
  user.className = "turn skel-turn skel-turn-user";
  user.innerHTML = '<div class="skel-bar"></div>';
  const assistant = document.createElement("div");
  assistant.className = "turn skel-turn skel-turn-assistant";
  assistant.innerHTML =
    '<span class="skel-dot-a"></span><span class="skel-lines">' +
    '<span class="skel-bar" style="width:88%"></span>' +
    '<span class="skel-bar" style="width:72%"></span>' +
    '<span class="skel-bar" style="width:50%"></span></span>';
  log.append(user, assistant);
}

async function loadHistory(session_id) {
  // Reuse the `sending` gate: a message sent during the await would be
  // appended first and the older history turns dumped after it.
  if (sending) return;
  sending = true;
  const seat = ++sendSeq;
  permCards.clear();
  notedSkills.clear();
  resetCardPolicy();  // ...and the overrides: every card of the restored transcript starts folded
  // Same reason as the two clears above: this transcript is about to be REPLACED,
  // so every per-transcript record has to go with it — including which scheduled
  // runs are on screen (scheduleResetForNewTranscript).
  scheduleResetForNewTranscript();
  renderLogSkeleton();  // replace the visible conversation, don't append to it
  try {
    const { turns } = await fused.runPython(AGENT, { action: "history", file: FILE, session_id }, { key: null });
    log.innerHTML = "";  // drop the skeleton now that real turns are ready
    for (const t of turns) {
      // Assistant turns carry `segments`; USER turns have no such key at all,
      // which addAssistantTurn's Array.isArray tolerates (a truthiness test on
      // a missing key would too, but this says out loud that the key is
      // optional). A restored turn renders through the same renderSegments the
      // live stream uses — no typer, because nothing is arriving.
      if (t.role === "user") {
        // `t.uuid` is the transcript record's own id — the same value the Tasks
        // list carries as a message's `anchor`, which is what makes `?msg=`
        // resolvable here. Optional: a payload without it renders exactly as
        // before and simply cannot be anchored to.
        addUser(stripBlocks(t.text), t.uuid);
        // ...and the picture it carried, if it carried one. addUser appends the
        // turn, so the last `.turn.user` in the log is the one just made — the
        // same way sendMessage finds the turn to hang its own receipt on.
        const turns = log.querySelectorAll(".turn.user");
        shotRestoreReceipt(turns[turns.length - 1], t.text);
      } else addAssistantTurn(t.text, t.segments);
    }
    attachCodeCopy(log);  // one pass over the whole restored transcript
    // The transcript is now on screen, so this is both the first moment a
    // `?msg=` link can be honoured and the last one worth trying: the loop
    // above rendered every turn there will be, synchronously. Falls through to
    // the bottom when there is no anchor, or when the anchor names a turn this
    // transcript does not contain.
    if (!consumeAnchor()) scrollBottom();
  } catch (err) {
    log.innerHTML = "";
    console.warn("history restore failed:", err.message);
  } finally {
    if (sendSeq === seat) sending = false;
  }
}

// What a session row (and a snapshot heading) is LABELLED with. The stored
// preview is the head of the first user message, and a message that carried a
// screenshot, an app-state snapshot or annotations begins with a machine-written
// block — so the chat list read "<pane-shot> The user attached a pi…" and "The
// user annotated 1 element in the l…": the page's own wire, addressed to the
// model, quoted back at the human as the name of their conversation.
//
// `stripBlocks` is the real inverse and it cannot do this job alone, for a reason
// worth stating: the preview is TRUNCATED, so the closing tag every strip matches
// on is usually not in the string at all. Hence the second pass — cut from any
// surviving opener, and from the annotation block's tag-less preamble — and then
// the marker as the last resort, which is the same word the bubble would show for
// a send with no typed words. Never blank: a row with no title is a row nobody
// can pick out of a list.
const BLOCK_OPENERS = [
  ["<" + APP_STATE_TAG + ">", ""],
  ["<" + PANE_SHOT_TAG + ">", MARKER_VIEW],
  // Tag-less by construction (see stripAnnBlock) — matched on the one sentence
  // formatAnnotations always opens with.
  ["The user annotated ", MARKER_ANN],
];
function sessionTitle(s) {
  const raw = (s && s.preview) || "";
  let text = stripBlocks(raw);
  const carried = [];
  for (const [open, marker] of BLOCK_OPENERS) {
    const i = text.indexOf(open);
    if (i === -1) continue;
    text = text.slice(0, i).trim();
    if (marker) carried.push(marker);
  }
  return text || carried.join(MARKER_JOIN) || (s && s.id) || "";
}

// One row for one past chat — every transcript in this cwd's project dir,
// whether it started in this page or in a terminal (agent.py `_sessions`).
// A row is resumable because its transcript is in this cwd's project dir,
// which is precisely where `_cli_sessions` found it — so the SAME `history`
// read and the same `--resume` on the next send work on it untouched.
function addChatRow(list, s) {
  const row = document.createElement("div");
  row.className = "chat-row";
  row.setAttribute("role", "button");
  row.tabIndex = 0;
  row.innerHTML = '<span class="dot">⏺</span><span class="row-title"></span>' +
                  '<span class="row-sub"></span>';
  row.querySelector(".row-title").textContent = sessionTitle(s);
  row.querySelector(".row-sub").textContent = ago(s.last_used || s.created_at || 0);
  const open = async () => {
    fused.params.set("session_id", s.id);
    showSession();
    enterChat();
    await loadHistory(s.id);
    // ...and if that chat's last turn is STILL RUNNING, pick it back up. Opening
    // a row is one of the two arrivals that carry no `run` param (see
    // adoptLiveRun), and without this the transcript stops at the user's
    // message as though the turn had never been sent.
    await adoptLiveRun(s.id);
  };
  row.onclick = open;
  row.onkeydown = (e) => { if (e.key === "Enter") open(); };
  list.appendChild(row);
}

// Content-shaped placeholder for the session list.
function renderRecentSkeleton(list) {
  list.innerHTML = "";
  [72, 58, 44].forEach((pct) => {
    const row = document.createElement("div");
    row.className = "skel-row";
    row.innerHTML =
      '<span class="skel-dot"></span>' +
      '<span class="skel-bar title" style="max-width:' + pct + '%"></span>' +
      '<span class="skel-bar sub"></span>';
    list.appendChild(row);
  });
}

// ── the landing page's two cross-session lists, and the tab bar over them ──
//
// #recent and #artifacts answer the same question about the same target — what
// has happened here before — from two different stores, so they share one block
// and, when both have something to say, one tab bar. Neither is the page's
// subject (the composer is), so the whole thing is allowed to be absent.
//
// The counts are the state: `null` means the read has not answered yet, which is
// NOT the same as zero — a skeleton is drawn into #recent while the sessions
// read is in flight, and it has to be on screen to be a skeleton of anything.
let recentCount = null;
let artCount = null;
// Which list is showing, and it is the BLOCK's state rather than the page's:
// leaving for a chat and coming back keeps the tab you were on.
let listTab = "recent";

function syncLists() {
  // Tabs only when BOTH lists really have rows: one tab is a heading with a
  // pointer cursor, and the plain .head each section carries is the honest
  // version of it.
  const tabbed = recentCount > 0 && artCount > 0;
  document.getElementById("lists").classList.toggle("tabbed", tabbed);
  document.getElementById("listtabs").hidden = !tabbed;
  // `null > 0` is false, which is why the loading case is spelled out: unread
  // recent chats still show (the skeleton), unread artifacts do not (there is
  // nothing to stand in for, and the section may well never exist).
  document.getElementById("recent").hidden =
    tabbed ? listTab !== "recent" : !(recentCount === null || recentCount > 0);
  document.getElementById("artifacts").hidden =
    tabbed ? listTab !== "artifacts" : !(artCount > 0);
  for (const [name, id] of [["recent", "tab-recent"], ["artifacts", "tab-artifacts"]]) {
    const tab = document.getElementById(id);
    tab.setAttribute("aria-selected", listTab === name ? "true" : "false");
    // Only the selected tab is in the tab order, which is what a tablist means:
    // Tab enters the bar, arrows move inside it.
    tab.tabIndex = listTab === name ? 0 : -1;
  }
}

function selectListTab(name) {
  listTab = name;
  syncLists();
}
for (const [name, id] of [["recent", "tab-recent"], ["artifacts", "tab-artifacts"]]) {
  const tab = document.getElementById(id);
  tab.onclick = () => selectListTab(name);
  tab.onkeydown = (e) => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault();
    const other = name === "recent" ? "artifacts" : "recent";
    selectListTab(other);
    document.getElementById(other === "recent" ? "tab-recent" : "tab-artifacts").focus();
  };
}

let recentSeq = 0;
async function loadRecent() {
  // Reads overlap by design now (the back handler retries over a just-left
  // run's spawn window), so only the NEWEST call may write: a slower older
  // read finishing late would clobber the fresher list — including the very
  // row the retry existed to add (Bugbot, PR #653). Same seat idiom as
  // sendSeq/loopSeq: take a number, and prove it is still the latest before
  // touching anything after the await.
  const seat = ++recentSeq;
  const list = document.getElementById("recentlist");
  // The skeleton stands in for rows we do not have yet — never for rows that
  // are already up. A re-read over a drawn list (the back handler's mid-turn
  // retries) repaints in place; blinking good rows into placeholder bars would
  // make every retry look like the list lost the chats it is about to reprint.
  if (!list.querySelector(".chat-row")) renderRecentSkeleton(list);
  syncLists();  // the skeleton needs its section shown
  try {
    const { sessions, error } = await fused.runPython(AGENT, { action: "sessions", file: FILE }, { key: null });
    if (recentSeq !== seat) return;  // a newer read owns the list now
    if (error) throw new Error(error);
    list.innerHTML = "";  // drop the skeleton now that we know the real state
    // Name the snapshot runs from the SAME strings these rows are labelled with,
    // even for an empty list: a file can have chains in the store and no chats
    // in its project dir, and the reverse — an empty session list is still an
    // answer the snapshots panel wants (it means "name nothing"), not a reason
    // to skip.
    let named = false;
    for (const s of sessions) {
      // The SAME string the row is labelled with (sessionTitle, not the raw
      // preview): the comment above says these two must match, and a heading
      // reading "<pane-shot> The user attached a pi…" while its row reads the
      // user's own words would break that in the most visible way there is.
      const title = sessionTitle(s);
      if (title && snapNames.get(s.id) !== title) {
        snapNames.set(s.id, title);
        named = true;
      }
    }
    // REPAINT the headings, because this read RACES the snapshots read rather than
    // preceding it. Boot awaits us first, but the "Back to chats" path fires both
    // at once, and on a page opened straight into a resumed chat (`?session_id=`)
    // that path is the panel's FIRST read — so whichever of the two round trips
    // lands first decides whether the headings have names, and nothing else would
    // ever come back to fix them. Guarded on `named` so the ordinary case (no new
    // names, or no panel yet) costs nothing, and it repaints from the cached
    // timeline rather than re-reading anything.
    if (named && snapTimeline) renderSnapshots(snapTimeline);
    if (!sessions.length) {
      // Empty is an answer, not an error — but there is nothing to draw, and
      // the count is what hides the section (syncLists; hidden/classes, never
      // an inline display write).
      recentCount = 0;
      syncLists();
      return;
    }
    recentCount = sessions.length;
    for (const s of sessions) addChatRow(list, s);
  } catch (err) {
    // The seat check above never runs when the read itself REJECTS, so a
    // stale retry that died late must be caught here too — its failure says
    // nothing about the list a newer read already drew (Bugbot, PR #653).
    if (recentSeq !== seat) return;
    list.innerHTML = "";
    // A list that could not be read is not a list with nothing in it, but it
    // renders the same way here: no heading, no empty state, no error.
    recentCount = 0;
    console.warn("session list failed:", err.message);
  }
  syncLists();
}

// ── Artifacts: the pages Claude published from this target ──
//
// TWO views of one thing, from one backend (./artifacts.py):
//   * the landing page's #artifacts section — every artifact ever published from
//     this target's workdir, from the server's cross-session index ("list");
//   * the live #artstrip during a turn — the CURRENT session's transcript, read
//     straight off disk ("live"), so a page announces itself seconds after it is
//     published instead of at the next landing.
// Neither is load-bearing: every failure below is a console warning and an
// absent section, never the error overlay. A chat whose artifacts cannot be
// listed is still a working chat.
const ARTIFACTS = "./artifacts.py";

// Mirrors the shell codec (router.ts urlForFsPath), same as the peer templates
// that link out to the explorer: normalize ONLY drive-letter paths, because a
// backslash is a legal POSIX filename char and must round-trip.
function artOpenHref(path) {
  const norm = /^[A-Za-z]:[\\/]/.test(path) ? String(path).replace(/\\/g, "/") : String(path);
  const segs = norm.replace(/^\/+/, "").split("/").filter(Boolean).map(encodeURIComponent);
  return "/explorer/view/" + segs.join("/");
}

// The title the page published under, falling back to the file's basename: a
// publish that let the HTML's own <title> name it gets nothing echoed back, and
// an untitled row is worse than a filename.
function artLabel(a) {
  return a.title || String(a.file_path || "").split(/[\\/]/).pop() || a.remote_url;
}

function addArtifactRow(list, a) {
  const row = document.createElement("div");
  row.className = "art-row";
  row.innerHTML =
    '<span class="art-ic"></span><span class="art-title"></span>' +
    '<span class="art-when"></span>' +
    '<a class="art-go" target="_blank" rel="noopener noreferrer" title="Open the published page" aria-label="Open the published page">' +
    '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/>' +
    '<path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></a>';
  // Emoji, not markup: the favicon is author-chosen text from a transcript, so
  // it goes in through textContent like every other field on this row.
  row.querySelector(".art-ic").textContent = a.favicon || "◻";
  row.querySelector(".art-title").textContent = artLabel(a);
  row.querySelector(".art-when").textContent = ago(a.updated_at || a.created_at || 0);
  row.querySelector(".art-go").href = a.remote_url;
  // The ↗ is the ONE place the hosted page opens; a click on it must not also
  // count as a click on the row (which opens the local file instead).
  row.querySelector(".art-go").onclick = (e) => e.stopPropagation();
  // The row's own subject is the LOCAL file — the thing this window can show.
  // `list` drops the KNOWN-gone, so what reaches here is exists true (a real
  // local file) or exists null: a mount-backed path the server refuses to
  // stat, where the hosted page is the one door that cannot hang. The press
  // follows that split; either way a row is always pressable.
  const local = a.exists === true && a.file_path;
  if (local || a.remote_url) {
    row.setAttribute("role", "button");
    row.tabIndex = 0;
    row.title = local ? a.file_path : a.remote_url;
    // A new tab, not this frame: this window is a chat (often a pane of a
    // split), and navigating it away would end the conversation.
    const open = () => window.open(
      local ? artOpenHref(a.file_path) : a.remote_url, "_blank", "noopener");
    row.onclick = open;
    row.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } };
  }
  list.appendChild(row);
}

// The landing page's read. Called on every path ONTO the landing page (boot and
// the back button), not once per page life: a turn that just published a page
// must be able to leave it behind here.
//
// Whether the rows end up under a heading or behind a tab is syncLists's call —
// this function only ever reports how many there are. It never collapses them:
// the read is one localhost call made with the landing page, so by the time
// there is anything to draw it is already paid for.
async function loadArtifacts() {
  const list = document.getElementById("artifactslist");
  try {
    const { artifacts, error } = await fused.runPython(
      ARTIFACTS, { action: "list", file: FILE }, { key: null });
    if (error) throw new Error(error);
    list.innerHTML = "";
    // Nothing published from here is the common case — so no heading, no tab, no
    // empty state, no row saying so. The section simply is not there.
    artCount = (artifacts || []).length;
    for (const a of artifacts || []) addArtifactRow(list, a);
    const count = "· " + artCount;
    document.getElementById("artifactscount").textContent = count;
    // The tab carries the count too, because in the tabbed case the heading that
    // used to carry it is not drawn.
    document.getElementById("tabartcount").textContent = " " + count;
  } catch (err) {
    // No visible failure: an unreachable index is not news on a landing page
    // whose subject is the composer above it.
    console.warn("artifacts list failed:", err.message);
    artCount = 0;
  }
  syncLists();
}

// ── the live strip ──
//
// ACCUMULATING, keyed by url: the poll below reads the transcript of whichever
// session is current, and a chip must not vanish because a turn ended or a
// later read raced. Cleared only by leaving for the landing page (a different
// conversation's pages are not this one's) or by a reload.
const artChips = new Map();

function renderArtStrip() {
  const strip = document.getElementById("artstrip");
  strip.replaceChildren();
  for (const a of artChips.values()) {
    const chip = document.createElement("a");
    chip.className = "art-chip";
    chip.href = a.remote_url;
    chip.target = "_blank";
    chip.rel = "noopener noreferrer";
    chip.title = "Open " + artLabel(a);
    chip.innerHTML = '<span class="art-ic"></span><span class="art-chip-lbl"></span>' +
                     '<span class="art-chip-go">↗</span>';
    chip.querySelector(".art-ic").textContent = a.favicon || "◻";
    chip.querySelector(".art-chip-lbl").textContent = artLabel(a);
    strip.appendChild(chip);
  }
  strip.hidden = artChips.size === 0;
}

function clearArtStrip() {
  artChips.clear();
  renderArtStrip();
}

// One transcript read. Deliberately dumb: re-absorb the whole returned list
// every time and let the Map dedupe, rather than tracking what was already
// seen — the list is a handful of entries and a publish that arrives twice must
// be idempotent anyway (a redeploy reports the same url again).
async function pollArtifacts() {
  const session_id = fused.params.get("session_id");
  if (!session_id) return;  // no session yet: nothing has been written to read
  try {
    const { artifacts } = await fused.runPython(
      ARTIFACTS, { action: "live", session_id, file: FILE }, { key: null });
    // The await straddles navigation: Back may have cleared the strip (and the
    // session param) while this read was in flight, and a fresh chat may even
    // be underway. A stale answer must evaporate, not repopulate the strip.
    if (fused.params.get("session_id") !== session_id) return;
    if (!artifacts || !artifacts.length) return;
    // Change detection is by CONTENT, not by count: the favicon/title join can
    // land a poll or two after the frame-link (the tool_use streams later in
    // the transcript), so an already-seen url can gain metadata without the
    // set growing. Still no rebuild when nothing changed — this runs every few
    // seconds beside a streaming reply, and rebuilding an unchanged strip
    // would drop the user's mid-click on a chip.
    const sig = (m) => Array.from(m.values(), (a) =>
      a.remote_url + "\u0000" + (a.title || "") + "\u0000" + (a.favicon || "")).join("\u0001");
    const before = sig(artChips);
    for (const a of artifacts) artChips.set(a.remote_url, a);
    if (sig(artChips) !== before) renderArtStrip();
  } catch (err) {
    // A poll for decoration must never interrupt the poll for the reply.
    console.warn("artifacts poll failed:", err.message);
  }
}

// ── Claude snapshots: the file-history checkpoint chain (SPEC §34) ──
//
// Ported from the superseded `annotate` template. What moved is the OFFER —
// `shared/file_history.py` is unchanged and is still the one reader for this
// store, which stays strictly read-only (it is Claude Code's data, and the very
// edit history the feature exists to protect).
//
// The panel is INTERACTIVE: a list you can only look at answers no question the
// user actually has ("can I get that back?"). A row expands in place to the diff
// between it and the file as it is now, and carries the one action that makes
// the list mean anything — going back to it.
//
// It is LISTED on arrival rather than hidden behind a control: the read is ~6 ms
// once it declines enrichment and the exact deltas, which is the whole argument
// in `mountSnapshots` / `loadSnapshots` below (with the caching rule).
//
// And it is GROUPED BY SESSION, because the version numbers restart in every one
// (semantic 4 / SPEC FH-4): five chats that edited this file give five chains
// each beginning at v1, and a flat merged list therefore shows "v2" three times
// and reads as duplicate rows — "why do we have multiple snapshots of the same
// version". The number is real and per-chain, so the fix is to draw the chain it
// belongs to rather than to drop or globally renumber it.
//
// The two-call contract is annotate's, unchanged, because it is the reason the
// write is safe: `snapshot_plan` describes (diff, counts, whether a copy of the
// current bytes will be kept), `snapshot_revert` only ever applies the id the
// plan handed back. The page never names a version to the write itself. The
// confirm is inline — the row's button turns into "Really go back?" — rather
// than a sheet: one destructive action, one click to arm it, and the diff the
// user is confirming stays on screen the whole time.

// What restoring a version would do to the file AS IT IS NOW.
//
// TWO shapes, because `exact: false` is not a hedged version of the same answer.
// An exact delta is a PAIR — difflib counted lines going in and lines going out,
// and both are real. An inexact one is a NET, which is a single number by
// construction: `_delta`'s cheap branch is `max(0, ver − cur)` against
// `max(0, cur − ver)`, so at most one side can ever be non-zero. Printing it as a
// pair was the first attempt and the app settled the question — a column of
// "~+0 −43" down every row of a file that has only grown, where the "+0" is not a
// measurement but the shape of the arithmetic. So the net renders as ONE signed
// term, and the tilde still says it is not a diff.
function snapDelta(v) {
  const frag = document.createDocumentFragment();
  const span = (cls, text) => {
    const el = document.createElement("span");
    el.className = cls;
    el.textContent = text;
    return el;
  };
  if (!v.existed) return span("snap-minus", "did not exist");
  if (v.added == null || v.removed == null) return document.createTextNode("binary");
  if (!v.differs) return document.createTextNode("on disk now");
  if (!v.exact) {
    // Same line COUNT, different bytes — an edit that replaced as many lines as it
    // removed, which is most edits. The net has nothing to report, so the honest
    // thing is the one fact it does establish: this is not what is on disk. (Both
    // sides non-zero cannot come from a net, but an exact-shaped pair would still
    // be printable, so the fall-through below covers it rather than asserting.)
    if (!v.added && !v.removed) return document.createTextNode("changed");
    if (!v.removed) return span("snap-plus", "~+" + v.added);
    if (!v.added) return span("snap-minus", "~−" + v.removed);
  }
  frag.append(span("snap-plus", (v.exact ? "" : "~") + "+" + v.added),
              document.createTextNode(" "),
              span("snap-minus", "−" + v.removed));
  return frag;
}

function snapAgo(sec) {
  if (!sec) return "time unknown";
  const d = Math.max(0, Date.now() / 1000 - sec);
  if (d < 90) return "just now";
  if (d < 3600) return Math.round(d / 60) + "m ago";
  if (d < 86400) return Math.round(d / 3600) + "h ago";
  if (d < 172800) return "yesterday";
  if (d < 86400 * 30) return Math.round(d / 86400) + "d ago";
  return new Date(sec * 1000).toLocaleDateString();
}

// The timeline the panel is painted from, and the row expanded right now. Page
// state rather than DOM state, because a revert repaints the whole list from the
// timeline the write returned and both facts have to survive that.
let snapTimeline = null;
let snapOpenId = null;
// sessionId → the name that session's chat goes by, filled from the session
// list by `loadRecent` and read by `snapRunHead`. A Map rather than a lookup through the
// session list itself, because the snapshots panel must not depend on that list
// having been fetched, or on its order.
const snapNames = new Map();

function renderSnapshots(timeline) {
  const list = document.getElementById("snapslist");
  const note = document.getElementById("snapsnote");
  if (!list) return;
  snapTimeline = timeline;
  list.textContent = "";
  // Every absence is answered with the reader's own sentence rather than by
  // taking the section away. The panel is now something the user OPENED, and a
  // heading that vanishes under the click that opened it reads as a bug; the
  // reader already distinguishes "no store on this machine" from "a store with
  // nothing for this file" in `note`, so the honest thing is to say which.
  if (!timeline.available) {
    note.textContent = timeline.note || "No Claude Code file history on this machine.";
    return;
  }
  // One box per RUN, so a chain is drawn as a chain. The rows inside are in the
  // order the timeline handed them over, untouched — see `snapRuns`.
  for (const run of snapRuns(timeline.versions)) {
    const box = document.createElement("div");
    box.className = "snap-runbox";
    box.append(snapRunHead(run));
    for (const v of run.versions) box.append(snapItem(v, timeline));
    list.appendChild(box);
  }
  note.textContent = timeline.note || "";
}

// One row, plus its expansion when it is the open one.
function snapItem(v, timeline) {
  // The row and its expansion share one box, so the open body is visibly part
  // of the row it belongs to rather than a panel floating under the list.
  const item = document.createElement("div");
  item.className = "snap-item";
  const row = document.createElement("div");
  const here = v.id === timeline.position;
  const open = v.id === snapOpenId;
  row.className = "snap-row" + (here ? " here" : "") + (open ? " open" : "");
  row.setAttribute("role", "button");
  row.setAttribute("aria-expanded", open ? "true" : "false");
  row.tabIndex = 0;
  const toggle = () => {
    snapOpenId = open ? null : v.id;
    renderSnapshots(snapTimeline);
  };
  row.onclick = toggle;
  row.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } };
  if (here) row.title = "what is on disk now";
  const dot = document.createElement("span");
  dot.className = "snap-dot";
  dot.textContent = here ? "●" : "○";
  const num = document.createElement("span");
  num.className = "snap-v";
  // A did-not-exist checkpoint IS a numbered version of the chain (v1, the
  // creation boundary), so it wears its number. The dash is only for a record
  // that carried no usable number — "v0" would invent one the store never
  // wrote.
  num.textContent = v.version >= 1 ? "v" + v.version : "—";
  const when = document.createElement("span");
  when.className = "snap-when";
  when.textContent = snapAgo(v.mtime);
  // The exact time, and the session as well — the run heading above names the
  // chain, but a row dragged out of context (a screenshot, a scrolled list) still
  // has to be able to say which "v2" it is.
  when.title = (v.mtime ? new Date(v.mtime * 1000).toLocaleString() + " · " : "")
    + "session " + v.session;
  const d = document.createElement("span");
  d.className = "snap-d";
  d.append(snapDelta(v));
  const caret = document.createElement("span");
  caret.className = "snap-caret";
  caret.textContent = open ? "▾" : "▸";
  row.append(dot, num, when, d, caret);
  item.append(row);
  if (open) item.append(snapExpand(v));
  return item;
}

// ── runs: why the list is grouped, and why it is not a group-by ──
//
// Version numbers RESTART in every session (semantic 4 / SPEC FH-4): the store
// is `file-history/<sessionId>/<hash>@vN`, so five chats that edited this file
// give five chains each beginning at v1. Merged and ordered by time — which is
// the only order comparable across sessions — the flat list showed "v2" three
// times and read as duplicate rows. The number is real, it is just meaningless
// outside its own chain, so the chain gets drawn.
//
// CONTIGUOUS RUNS, not a `group by session`. The row order is load-bearing:
// `_locate` walks the merged timeline positionally to decide where a revert
// lands, and this function must therefore not reorder, merge or re-sort anything
// — it only inserts boundaries. The visible consequence is deliberate: a session
// that edited the file, went away, and came back later gets TWO headings, which
// is what actually happened, rather than having its rows pulled together across
// somebody else's checkpoints.
function snapRuns(versions) {
  const runs = [];
  for (const v of versions) {
    const open = runs[runs.length - 1];
    if (open && open.session === v.session) open.versions.push(v);
    else runs.push({ session: v.session, versions: [v] });
  }
  return runs;
}

// The heading over one run: WHOSE chain this is, and how long.
//
// The name comes from the session list — the very same `preview` string
// the "Recent chats" rows above are labelled with (`addChatRow`), so a chain the
// user had in this app is named by what they asked for in it, and the two sections
// agree. `loadRecent()` fills that map, and because it RACES this panel's read
// rather than reliably preceding it, it repaints the headings when it finishes
// (see there). This function therefore never waits for anything: it names what is
// known at paint time and gets called again if that changes.
//
// A MISS is ordinary rather than a bug: the file-history store records every
// Claude Code session that touched the file, including ones from another
// folder's page, whose transcripts are not in this cwd's project dir. So the
// fallback says only what is certain — that it was
// another chat — and puts the session's short id beside the count, because that id
// is the one handle that distinguishes two unnamed chains.
function snapRunHead(run) {
  const el = document.createElement("div");
  el.className = "snap-run";
  const name = document.createElement("span");
  name.className = "snap-run-name";
  const known = snapNames.get(run.session);
  // "chat", not "another chat": on a file whose chains all come from outside
  // this app — a common case — that
  // word repeats down the whole panel, and five headings saying "another chat" is
  // noise pretending to be information. The distinguishing fact is the id, and it
  // sits in the quiet half of the line beside the count.
  name.textContent = known || "chat";
  const sub = document.createElement("span");
  sub.className = "snap-run-sub";
  const n = run.versions.length;
  sub.textContent = (known ? "" : run.session.slice(0, 8) + " · ")
    + n + (n === 1 ? " checkpoint" : " checkpoints");
  el.title = "session " + run.session;
  el.append(name, sub);
  return el;
}

function snapNote(text) {
  const el = document.createElement("div");
  el.className = "snap-note";
  el.textContent = text;
  return el;
}

function snapErr(text) {
  const el = document.createElement("div");
  el.className = "snap-err";
  el.textContent = text;
  return el;
}

// The expanded row: what going back to this version WOULD do, then the action.
//
// The plan is fetched fresh on every expansion and never cached: it is a
// statement about the file as it is right now, and a stale one is exactly how a
// user confirms one diff and gets a different one. A refusal (unwritable file, a
// version the store can no longer resolve) is rendered IN the row — the row is a
// real thing that exists, and hiding it would read as a bug rather than as an
// answer.
function snapExpand(v) {
  const body = document.createElement("div");
  body.className = "snap-body";
  body.append(snapNote("reading this snapshot…"));
  fused.runPython(AGENT, { action: "snapshot_plan", file: FILE, version_id: v.id }, { key: null })
    .then((plan) => {
      body.textContent = "";
      if (!plan.ok) {
        body.append(snapErr(plan.error || "this snapshot cannot be restored"));
        return;
      }
      body.append(snapDiff(plan), snapAction(plan));
    })
    .catch((err) => {
      body.textContent = "";
      body.append(snapErr(err.message));
    });
  return body;
}

// The change itself, because the counts on the row answer how MUCH and never
// WHAT — and on the one destructive action here the second is the question being
// confirmed. `reason` is the helper's single channel for every "no diff", the
// genuinely empty one included, so a missing diff always says why rather than
// rendering a blank block that reads as broken.
function snapDiff(plan) {
  const wrap = document.createElement("div");
  const d = plan.diff || {};
  if (!d.lines || !d.lines.length) {
    wrap.append(snapNote(d.reason || "There is no diff to show for this snapshot."));
    return wrap;
  }
  const pre = document.createElement("pre");
  pre.className = "snap-diff";
  for (const ln of d.lines) {
    const el = document.createElement("span");
    // The `---`/`+++` file headers before the `+`/`-` test: they open with the
    // same characters and colouring them as added and removed lines is how a
    // two-line header reads as part of the change.
    el.className =
      ln.startsWith("---") || ln.startsWith("+++") ? "dl-head"
      : ln.startsWith("@@") ? "dl-hunk"
      : ln.startsWith("+") ? "dl-add"
      : ln.startsWith("-") ? "dl-del" : "";
    el.textContent = ln + "\n";
    pre.append(el);
  }
  wrap.append(pre);
  if (d.truncated) {
    wrap.append(snapNote("Showing part of " + d.changed + " changed lines."));
  }
  return wrap;
}

// One button, armed by a click rather than acting on it. The confirm is inline
// so the diff being confirmed stays on screen underneath it, and the cost is
// stated BEFORE the click: when the bytes on disk are in no snapshot this write
// destroys the only copy.
function snapAction(plan) {
  const bar = document.createElement("div");
  bar.className = "snap-act";
  const gone = plan.action === "delete";
  const risk = !plan.unique_current ? ""
    : "What is on disk now is in no snapshot — going back destroys the only "
      + "copy of it.";
  const arm = document.createElement("button");
  arm.type = "button";
  arm.className = "snap-go";
  // No kind noun in any of this copy: the panel is files-only, but a literal
  // "file" in a spoken string is the sink this page has regressed on three
  // times (see test_claude_kind), so the wording simply makes no claim.
  arm.textContent = gone ? "Go back to before it existed"
                         : "Go back to this snapshot";
  arm.onclick = () => {
    bar.textContent = "";
    const ask = document.createElement("span");
    ask.className = "snap-ask";
    ask.textContent = gone ? "Really delete it?" : "Really go back?";
    const yes = document.createElement("button");
    yes.type = "button";
    yes.className = "snap-go";
    yes.textContent = "Yes";
    yes.onclick = () => snapGoBack(plan, bar);
    const no = document.createElement("button");
    no.type = "button";
    no.className = "snap-no";
    no.textContent = "No";
    no.onclick = () => { bar.textContent = ""; bar.append(arm); if (risk) bar.append(snapNote(risk)); };
    bar.append(ask, yes, no);
    if (risk) bar.append(snapNote(risk));
  };
  bar.append(arm);
  if (risk) bar.append(snapNote(risk));
  return bar;
}

// The write. It is handed the id the PLAN returned and nothing else — the page
// never names a version to this action itself, which is the whole of the
// two-call contract the module also enforces.
async function snapGoBack(plan, bar) {
  bar.textContent = "";
  bar.append(snapNote("going back…"));
  try {
    const out = await fused.runPython(AGENT, {
      action: "snapshot_revert", file: FILE, version_id: plan.id,
      // Sent only for the case the user was actually shown the loss for: a
      // token passed on every call is a token nobody reads.
      confirm_unique: plan.unique_current ? "1" : "",
    }, { key: null });
    if (out.error) throw new Error(out.error);
    // Repaint from the timeline the write returned rather than following with a
    // second round trip, for the length of which the list would go on showing
    // the pre-revert position — precisely when the user is staring at it to find
    // out whether it worked.
    snapOpenId = null;
    if (out.timeline) renderSnapshots(out.timeline); else await loadSnapshots();
    document.getElementById("snapsnote").textContent =
      (out.action === "delete"
        ? "Removed — that is how it was at this snapshot."
        : "Back at this snapshot.");
  } catch (err) {
    bar.textContent = "";
    bar.append(snapErr(err.message));
  }
}

// ── the section itself: listed as soon as the target is known to be a file ──
//
// This read was deferred behind a click for one revision, on the theory that a
// timeline is a round trip most file opens never want. The theory was right about
// the round trip and wrong about which part of it cost anything. Measured on this
// very file (453 KB, 12 checkpoints): 292 ms, of which `difflib` inside
// `file_history._delta` is 290 — two numbers per row — while reading all twelve
// versions is 7 ms and enumerating them out of the store is 0.2 ms. So the call
// declines the exact deltas (`deltas: "0"`, and enrichment as before), the read
// lands in ~6 ms, and a list that costs six milliseconds does not need a door in
// front of it. The rows still open into a real diff, computed for that one
// version by the plan behind the click.
//
// The list is cached for the life of the page — the target file never changes
// under it — so returning from a chat repaints rather than refetching. What
// invalidates that cache is a WRITE: `snapGoBack` repaints from the post-revert
// timeline the write itself returned, and a finished turn drops it
// (`snapInvalidate`). A failed read caches nothing, so the retry on the heading
// (and the next landing) asks again rather than leaving the section stuck on the
// failure for the life of the page.
let snapLoaded = false;
// Has this page a panel at all? FALSE for every folder and app-folder target,
// where `mountSnapshots` returns without revealing anything — and the flag exists
// because `snapInvalidate` fires from the end of EVERY turn, including those. The
// hidden section would swallow the render, but the round trip would still be
// spent and `agent.py` would still refuse a folder, once per turn, for ever.
let snapMounted = false;

// A FINISHED TURN is the other way this chain grows. Claude edits the file, and
// Claude Code checkpoints what it edits — exactly what a revert does, and the
// panel has no way to see it: the cache is keyed to nothing but the page, so a
// landing page reached after a turn showed the pre-turn position, stale deltas
// and none of the new versions. Called from every place a run ENDS (the poll
// loop's `done` branch, and resumeRun's, for a turn this frame was not attached
// to), beside `annResolveSent` — the same "that turn is over" moment.
//
// It refetches and repaints NOW rather than only dropping the cache, for the
// reason the revert path repaints rather than waiting: the list is on screen from
// the moment the panel mounts, and a list left up saying the wrong thing is worse
// than one that costs a round trip. (While the panel was collapsed this branch
// was conditional on its being open — with nothing to leave stale, the cheaper
// half was to read nothing at all.) A page with no panel spends nothing: see
// `snapMounted`.
//
// The expanded ROW is left open on purpose: `snapExpand` fetches its plan fresh
// on every render, so it re-reads against the new bytes rather than going stale,
// and closing it under the user would lose the thing they were reading.
//
// Hoisted past its own `let`s, like the rest of this section: every caller is an
// async continuation that cannot run until the script has finished executing.
function snapInvalidate() {
  if (!snapMounted) return;
  snapLoaded = false;
  loadSnapshots();
}

// Reveal the section and fill it. Called on every path onto the landing page,
// and the CACHE is what makes that free after the first: a user who read the
// history, entered a chat and came back is looking at the same file, so the
// second mount repaints the timeline it already has.
async function mountSnapshots() {
  // FILES only, and `targetNoun` is the page's ONE answer to what the target is
  // (set by paneURL from the stat). Reusing it rather than re-probing is what
  // keeps this panel from ever disagreeing with the rest of the page — and
  // awaiting `paneReady` first is what makes the answer available: both boot
  // IIFEs start together, so reading the noun without the wait raced the stat
  // and read "" on every open. Note it is `targetNoun`, not `paneNoun` — the
  // latter names the left pane's DOCUMENT ("preview"/"app") and is never
  // "file", so gating on it would have hidden the panel permanently.
  //
  // The backend refuses a folder too (agent.py `_snapshots`): the gate is the
  // UX, the module is the guarantee (MD-11).
  await paneReady;
  if (targetNoun !== "file") return;
  snapMounted = true;
  document.getElementById("snaps").hidden = false;
  // Already read once on this page: repaint what we have rather than spend the
  // round trip again. The list is on screen either way by the time this returns.
  if (snapLoaded && snapTimeline) { renderSnapshots(snapTimeline); return; }
  loadSnapshots();
}

const snapRetryBtn = document.getElementById("snapsretry");
snapRetryBtn.onclick = () => loadSnapshots();

// The read. Only ever reached with the panel mounted (`mountSnapshots`, the retry
// beside its heading, an invalidated turn, or a revert whose write did not hand
// back a timeline), so it is free to assume the target is a file.
//
// The WAIT is a note where the rows will be, not a spinner and not a layout jump:
// the section is already on screen, so the one honest thing to put in it is a
// sentence saying it is being read.
async function loadSnapshots() {
  const note = document.getElementById("snapsnote");
  const list = document.getElementById("snapslist");
  note.textContent = "";
  snapRetryBtn.hidden = true;
  // Only on a FIRST paint. A refetch (a finished turn, a retry) leaves the rows
  // it already has up: replacing a good list with "reading…" is a flicker that
  // makes the panel look like it lost the history it is about to reprint.
  if (!list.firstChild) list.append(snapNote("reading the version history…"));
  try {
    // Neither knob: enrichment reads session transcripts (5 MB+), and the exact
    // deltas are `difflib` per version — 290 ms of a 292 ms read on this file, for
    // two numbers a row (see the section comment). The unenriched timeline cannot
    // see the creation boundary, which is why this panel never claims a chain is
    // complete; the undiffed one softens its counts to net lines, which is why
    // `snapDelta` renders them with a "~".
    const timeline = await fused.runPython(
      AGENT, { action: "snapshots", file: FILE, deltas: "0" }, { key: null });
    if (timeline.error) throw new Error(timeline.error);
    snapLoaded = true;
    renderSnapshots(timeline);
  } catch (err) {
    // An ordinary absence, never the red overlay: a file Claude has never
    // touched is the common case, not a bug in this view. `snapLoaded` stays
    // false, and the retry appears on the heading — a failure the user can do
    // something about, rather than a section stuck on it for the life of the page.
    console.warn("snapshots failed:", err.message);
    list.textContent = "";
    snapRetryBtn.hidden = false;
    note.textContent = "The snapshots could not be read (" + err.message + ").";
  }
}

// ── boot: resume from URL, or show the landing page ──
(async () => {
  const session_id = fused.params.get("session_id");
  const run_id = fused.params.get("run");
  if (session_id || run_id) {
    // A bare `run` param (frame died before the first poll saw the session id)
    // still means an in-flight conversation — enter chat and re-attach.
    enterChat();
    // BEFORE both awaits, and that ordering is the feature. resumeRun's tail
    // calls drainQueue, so entries restored after it would sit below the log
    // untouched until some later turn happened to end. Restoring first also
    // means the bubbles are on screen for the whole of the history load and the
    // re-attach probe, which is exactly what the user left behind — rather than
    // appearing seconds later as if the page had thought better of it.
    // Cheap and synchronous (a storage read and a few nodes), so it costs the
    // re-attach nothing.
    restoreQueue(session_id, run_id);
    if (session_id) await loadHistory(session_id);
    // The chips this session already earned. The poll loop rebuilds them while a
    // run streams, but a resumed conversation with nothing in flight never
    // reaches that loop — and its pages are no less published for it.
    if (session_id) pollArtifacts();
    if (run_id) await resumeRun(run_id, { retryUnknown: true });
    // No `run` on the URL is not proof that nothing is running: a reload after
    // the param was dropped, a bookmark of the bare chat, or a mode switch all
    // land here with a live turn still streaming server-side. Ask before
    // settling for the transcript (see adoptLiveRun).
    else if (session_id) await adoptLiveRun(session_id);
    // The run this queue was parked behind may have finished while no frame was
    // attached (`resumeRun` takes the done branch and never polls), and then
    // nothing else will ever call drainQueue for it. Firing here sends what the
    // live page would have sent the moment that turn ended; a no-op when the
    // queue is empty or resumeRun already drained it.
    drainQueue();
  } else {
    // No conversation to belong to, so nothing to restore — and nothing to
    // clean up either. This boot owns no record by definition (it has no ids to
    // match one with), and the tab's storage may well belong to a chat that is
    // still running in another frame: the preview pane mounts one of these for
    // any row previewed in claude mode. Touching the store from here is exactly
    // how a live conversation's parked messages used to disappear.
    focusBox(homebox);
    await loadRecent();
    await mountSnapshots();
    // Last of the three landing reads, and unawaited by nothing above it on
    // purpose: it is the only one that leaves the machine (a localhost call to
    // the artifacts index), so it must not sit in front of the session list.
    loadArtifacts();
  }
})();
</script>
</body>
</html>
