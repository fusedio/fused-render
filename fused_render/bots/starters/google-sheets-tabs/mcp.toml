# MCP tools for this app, curated in fused-render's MCP panel.
# `fused app serve <this folder>` publishes one tool per [[tool]] table.
# Every tool calls sheets.py main(action=...); the pinned `action` must be one
# that sheets.py's run() handles (see BOT.md for the full table).

# ---- auth

[[tool]]
name = "sheets_status"
description = "Check whether a Google service-account key is saved, its email, and the saved spreadsheets library (docs: [{id, name, title, url}])."
file = "sheets.py"
entrypoint = "main"
signature = "main(action: str='status', doc: str='', title: str='', content: str='', tab: str='', range: str='', key_json: str='', raw: bool=False, limit: int=1000, resolved: bool=False)"

[tool.pinned]
action = "status"

[[tool]]
name = "sheets_set_key"
description = "Save (and verify with Google) the service-account key JSON used for authentication. Pass the whole key file as key_json. The same key as the Google Docs Tabs app works."
file = "sheets.py"
entrypoint = "main"
signature = "main(action: str='status', doc: str='', title: str='', content: str='', tab: str='', range: str='', key_json: str='', raw: bool=False, limit: int=1000, resolved: bool=False)"

[tool.pinned]
action = "save_key"

# ---- saved spreadsheets library (.fused/data/sheets.json)
# Every spreadsheet that is used gets saved automatically under its title. In
# every other tool, `doc` accepts a saved spreadsheet's name as well as a URL or id.

[[tool]]
name = "sheets_list_docs"
description = "List the saved spreadsheets the user has added to this app: [{id, name, title, url, last_used}]. Call this first when the user refers to a spreadsheet by name; pass that name (or the id/url) as `doc` to every other tool."
file = "sheets.py"
entrypoint = "main"
signature = "main(action: str='status', doc: str='', title: str='', content: str='', tab: str='', range: str='', key_json: str='', raw: bool=False, limit: int=1000, resolved: bool=False)"

[tool.pinned]
action = "list_docs"

[[tool]]
name = "sheets_add_doc"
description = "Save a Google Sheet to the library so it can be referred to by name later. doc is a Sheets URL or id; title is the friendly name (optional, defaults to the spreadsheet's own title). Verifies the spreadsheet is shared with the service account."
file = "sheets.py"
entrypoint = "main"
signature = "main(action: str='status', doc: str='', title: str='', content: str='', tab: str='', range: str='', key_json: str='', raw: bool=False, limit: int=1000, resolved: bool=False)"

[tool.pinned]
action = "add_doc"

[[tool]]
name = "sheets_rename_doc"
description = "Give a saved spreadsheet a new friendly name. doc is the current name, id or URL; title is the new name."
file = "sheets.py"
entrypoint = "main"
signature = "main(action: str='status', doc: str='', title: str='', content: str='', tab: str='', range: str='', key_json: str='', raw: bool=False, limit: int=1000, resolved: bool=False)"

[tool.pinned]
action = "rename_doc"

[[tool]]
name = "sheets_remove_doc"
description = "Forget a saved spreadsheet (removes it from the library only; the Google Sheet is untouched). doc is its name, id or URL."
file = "sheets.py"
entrypoint = "main"
signature = "main(action: str='status', doc: str='', title: str='', content: str='', tab: str='', range: str='', key_json: str='', raw: bool=False, limit: int=1000, resolved: bool=False)"

[tool.pinned]
action = "remove_doc"

