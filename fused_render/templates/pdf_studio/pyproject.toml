# The pdf_studio template's environment (SPEC PY-16). `pdf.py` is the runPython
# entrypoint; `inspector.py` is imported beside it and shares this venv.
#
# pymupdf and pikepdf are the reason this folder declares anything at all — they
# left `[bundled]` (D275) as the two largest single wheels in it (56 MB and
# 13 MB), and they exist for this template alone. pikepdf (qpdf) does the
# structural work — merge, split, rotate, linearize, encryption inspection —
# and PyMuPDF does text extraction, in-place editing and rasterization. Both are
# lazy imports inside the actions rather than module-level ones, which is what
# lets `main()`'s cheap actions still answer on a machine where the venv is
# still building; it does NOT make them optional.
#
# openpyxl is still on the app's interpreter and is declared anyway because this
# declaration is the COMPLETE list (D172): pdf.py writes extracted tables out as
# .xlsx through it, and an undeclared import is simply absent from the venv.
[project]
name = "fused-render-template-pdf-studio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.25",
    "pikepdf>=9",
    "openpyxl",
]

# Not a distribution — this folder is a set of scripts, not something to build
# and install. Without this uv would try to build the "project" itself and fail.
[tool.uv]
package = false
