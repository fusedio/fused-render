<!DOCTYPE html>
<html data-fused-theme="shell">
<head>
<meta charset="utf-8" />
<title>Workflow</title>
<style>
  /* Appearance (SPEC §30/AP-9, D134). The dark block below IS this view's
     palette; every colour a rule uses is a token from it, because a literal is
     a colour light mode cannot repaint (tests/test_theme.py enforces both the
     opt-in on <html> and the two blocks defining the SAME token set). The token
     set is the `mcp` panel's, deliberately: this mode sits directly beside that
     one — one authors an app's tools, this one chains them — and two adjacent
     surfaces with two palettes read as two products. */
  :root {
    color-scheme: dark;
    --bg: #131417;
    --surface: #1b1d21;
    --surface-2: #22252b;
    --line: #2a2d33;
    --line-strong: #3a3e46;
    --line-hover: #454a53;
    --ink: #e8eaed;
    --ink-2: #9aa0a6;
    --ink-3: #868d94;
    --accent: #E5FF44;
    --accent-dim: #b8cc36;
    --on-accent: #131417;
    --grid-dot: #1e2126;
    --note-line: #4a4326;
    --note-bg: #221f14;
    --note-fg: #d9c98a;
    --good-fg: #a8dfa8;
    --good-bg: #16241a;
    --good-line: #2c452f;
    --bad-fg: #efb0b0;
    --bad-bg: #251618;
    --bad-line: #4a2b2e;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff;
    --surface: #f4f5f7;
    --surface-2: #eceef0;
    --line: #d8dade;
    --line-strong: #c4c8ce;
    --line-hover: #b4b9c0;
    --ink: #1f2023;
    --ink-2: #61656c;
    --ink-3: #6f747c;
    --accent: #5f7300;
    --accent-dim: #4e5f00;
    --on-accent: #ffffff;
    --grid-dot: #e8eaed;
    --note-line: #e0cd94;
    --note-bg: #fdf7e6;
    --note-fg: #6b5316;
    --good-fg: #1f5f22;
    --good-bg: #e8f6e8;
    --good-line: #bcdcbc;
    --bad-fg: #8f2020;
    --bad-bg: #fdecec;
    --bad-line: #e6b6b6;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    flex: 0 0 auto;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  #wf-name {
    font-weight: 600;
    flex: 1 1 220px;
    min-width: 120px;
  }
  .bar { display: flex; gap: 6px; align-items: center; }

  .btn {
    font: inherit;
    color: var(--ink-2);
    background: var(--surface-2);
    border: 1px solid var(--line-strong);
    border-radius: 5px;
    padding: 3px 9px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover:not([disabled]) { color: var(--ink); border-color: var(--line-hover); }
  .btn.primary {
    color: var(--on-accent);
    background: var(--accent);
    border-color: var(--accent-dim);
  }
  .btn.primary:hover:not([disabled]) { background: var(--accent-dim); }
  /* A disabled control says so three ways — dimmed ink, the plain line, and the
     cursor — because one of the three is the one a given user notices. */
  .btn[disabled] {
    color: var(--ink-3);
    background: var(--surface);
    border-color: var(--line);
    cursor: not-allowed;
  }
  .btn.danger:hover:not([disabled]) { color: var(--bad-fg); border-color: var(--bad-line); }
  .btn.retry { margin-left: 8px; padding: 0 6px; font-size: 11px; }

  input, textarea, select {
    font: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    padding: 2px 6px;
    min-width: 0;
  }
  input:focus, textarea:focus, select:focus {
    outline: 1px solid var(--accent);
    border-color: var(--accent);
  }

  main { flex: 1 1 auto; display: flex; min-height: 0; }

  /* ---- the two side panels ---- */
  aside {
    flex: 0 0 236px;
    min-width: 236px;
    overflow: auto;
    background: var(--surface);
    padding: 8px 10px 30px;
  }
  #palette { border-right: 1px solid var(--line); }
  #inspector { border-left: 1px solid var(--line); flex-basis: 292px; min-width: 292px; }
  aside h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--ink-3);
    margin: 0 0 6px;
    font-weight: 600;
  }
  .app-group { margin-bottom: 10px; }
  .app-group > .app-title { color: var(--ink-2); font-size: 11px; margin-bottom: 3px; }
  .app-group > .app-note { color: var(--note-fg); font-size: 11px; }
  .pal-tool {
    display: block;
    width: 100%;
    text-align: left;
    font: inherit;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 4px 7px;
    margin-bottom: 3px;
    cursor: grab;
  }
  .pal-tool:hover { border-color: var(--line-hover); }
  .pal-tool .d { color: var(--ink-3); font-size: 11px; display: block; }
  /* The prompt step is not discovered from any `mcp.toml` — it is this editor's
     own primitive — so it is a FIXED entry and says so by wearing the same note
     palette its node does. */
  .pal-tool.pal-prompt { border-color: var(--note-line); background: var(--note-bg); color: var(--note-fg); }
  .pal-tool.pal-prompt .d { color: var(--note-fg); opacity: .8; }

  /* ---- the canvas ---- */
  #stage {
    flex: 1 1 auto;
    position: relative;
    overflow: hidden;
    background: var(--bg);
    background-image: radial-gradient(circle, var(--grid-dot) 1px, transparent 1px);
    background-size: 28px 28px;
    cursor: grab;
  }
  #stage.panning { cursor: grabbing; }
  #stage.linking { cursor: crosshair; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  /* A ZERO-SIZED SVG with `overflow: visible`. `#world` is a transform container
     whose children are all absolutely positioned, so it has no size of its own
     for an SVG to fill — and a percentage size would resolve against nothing.
     Wires are drawn in `#world`'s coordinate space and simply overflow the box,
     which is what keeps them registered with the nodes at any pan or zoom. */
  #wires { position: absolute; left: 0; top: 0; width: 1px; height: 1px;
           overflow: visible; pointer-events: none; }
  #wires path { fill: none; stroke: var(--line-strong); stroke-width: 1.6; }
  #wires path.conditional { stroke-dasharray: 5 4; stroke: var(--note-line); }
  #wires path.hot { stroke: var(--accent); }
  #wires .hit { stroke: transparent; stroke-width: 14px; pointer-events: stroke; cursor: pointer; }

  .node {
    position: absolute;
    width: 212px;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    padding: 6px 8px 7px;
    cursor: grab;
    user-select: none;
  }
  /* A PROMPT STEP READS AS A DIFFERENT KIND OF THING, not as a tool node with an
     odd label. It calls nothing the user curated and its content is a SENTENCE
     rather than a set of arguments, so it borrows the note palette and a dashed
     edge — the same pair a conditional wire uses to say "this part is prose".
     Placed BEFORE `.sel` and the `.st-*` rules so selection and run state still
     win on the border colour; only the dash and the fill are the kind's. */
  .node.prompt { border-color: var(--note-line); border-style: dashed; background: var(--note-bg); }
  .node.prompt .n-label { color: var(--note-fg); }
  .node .n-prompt {
    font-size: 11px;
    color: var(--ink-2);
    margin-top: 4px;
    border-top: 1px solid var(--line);
    padding-top: 3px;
    /* Three lines of the author's text, clipped. The node is a glance; the
       whole prompt is one click away in the inspector. */
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .node.sel { border-color: var(--accent); }
  .node.dragging { cursor: grabbing; }
  .node .n-label { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node .n-tool { color: var(--ink-3); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node .n-inputs { margin-top: 4px; border-top: 1px solid var(--line); padding-top: 3px; }
  .node .n-in { font-size: 11px; color: var(--ink-2); display: flex; gap: 5px; }
  .node .n-in b { color: var(--ink-3); font-weight: 400; flex: 0 0 auto; }
  .node .n-in span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node .n-in.prev span { color: var(--accent-dim); }
  .node .n-none { font-size: 11px; color: var(--ink-3); margin-top: 4px; }
  .node .plug {
    position: absolute;
    right: -9px;
    top: 50%;
    margin-top: -8px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--surface-2);
    border: 1px solid var(--line-strong);
    cursor: crosshair;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-3);
    font-size: 11px;
    line-height: 1;
  }
  .node .plug:hover { border-color: var(--accent); color: var(--accent); }
  .node .step-no {
    position: absolute;
    left: -9px;
    top: -9px;
    min-width: 18px;
    height: 18px;
    border-radius: 9px;
    background: var(--surface-2);
    border: 1px solid var(--line-strong);
    color: var(--ink-3);
    font-size: 11px;
    text-align: center;
    line-height: 16px;
    padding: 0 4px;
  }
  /* Run state. The border and the pill say the same thing, because the node may
     be scrolled so only its edge is on screen. */
  .node.st-running { border-color: var(--accent); }
  .node.st-done { border-color: var(--good-line); }
  .node.st-error { border-color: var(--bad-line); }
  .pill {
    float: right;
    font-size: 10px;
    border-radius: 3px;
    padding: 0 4px;
    border: 1px solid var(--line);
    color: var(--ink-3);
  }
  .pill.running { color: var(--on-accent); background: var(--accent); border-color: var(--accent-dim); }
  .pill.done { color: var(--good-fg); background: var(--good-bg); border-color: var(--good-line); }
  .pill.error { color: var(--bad-fg); background: var(--bad-bg); border-color: var(--bad-line); }

  /* ---- the inspector ---- */
  .field { margin-bottom: 8px; }
  .field > label { display: block; color: var(--ink-3); font-size: 11px; margin-bottom: 2px; }
  .field > input, .field > textarea, .field > select { width: 100%; }
  textarea { resize: vertical; min-height: 2.6em; }
  .params { border-top: 1px solid var(--line); padding-top: 6px; margin-top: 8px; }
  .param { display: flex; gap: 5px; align-items: center; margin-top: 3px; }
  .param > label { flex: 1 1 auto; display: flex; gap: 5px; align-items: center; min-width: 0; }
  .param .pname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .param.on .pname { color: var(--accent); }
  .param .ptype { color: var(--ink-3); font-size: 11px; flex: 0 0 auto; }
  .param-row { display: flex; gap: 5px; margin: 2px 0 5px 18px; }
  .param-row select { flex: 0 0 88px; }
  .param-row input { flex: 1 1 auto; min-width: 0; }
  .edge-row { border-top: 1px solid var(--line); padding-top: 6px; margin-top: 8px; }
  .out { white-space: pre-wrap; word-break: break-all; font-size: 11px; color: var(--ink-2);
         background: var(--bg); border: 1px solid var(--line); border-radius: 4px;
         padding: 4px 6px; max-height: 180px; overflow: auto; }
  .out.bad { color: var(--bad-fg); border-color: var(--bad-line); }
  .out-note { color: var(--note-fg); font-size: 11px; margin-bottom: 3px; }

  /* ---- a result, rendered as what it IS ----
     A tool result was one `white-space: pre-wrap` blob of up to 8000 characters,
     which is what `search_mail`'s JSON looks like: a wall. When the text parses
     as JSON it is drawn as a tree instead, and an array of uniform objects as a
     table — the two shapes an MCP tool actually answers with. Anything that does
     not parse (prose, or a result the 8000-character cap cut mid-object) keeps
     the blob, which is the honest rendering of text that is text. */
  .jsonv { font-size: 11px; background: var(--bg); border: 1px solid var(--line);
           border-radius: 4px; padding: 4px 6px; max-height: 260px; overflow: auto; }
  .jsonv details { padding-left: 11px; }
  .jsonv > details { padding-left: 0; }
  .jsonv summary { cursor: pointer; color: var(--ink-3); }
  .jsonv summary:hover { color: var(--ink-2); }
  .jsonv summary b { color: var(--ink-2); font-weight: 400; }
  .jsonv .kv { display: flex; gap: 6px; padding-left: 11px; }
  .jsonv .k { color: var(--ink-3); flex: 0 0 auto; }
  .jsonv .v { color: var(--ink-2); white-space: pre-wrap; word-break: break-word; min-width: 0; }
  .jsonv .v.num { color: var(--accent-dim); }
  .jsonv .v.nul { color: var(--ink-3); }
  .jsonv .more { color: var(--ink-3); padding-left: 11px; }
  .jtable { border-collapse: collapse; width: 100%; }
  .jtable th { text-align: left; font-weight: 600; color: var(--ink-3);
               border-bottom: 1px solid var(--line-strong); padding: 2px 8px 2px 0;
               white-space: nowrap; }
  .jtable td { border-bottom: 1px solid var(--line); padding: 2px 8px 2px 0;
               color: var(--ink-2); max-width: 200px; overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap; }

  /* ---- the output surface ----
     A terminal step's result WAS reachable only by clicking the node after the
     run: the one thing a workflow is for was the one thing the canvas did not
     show. So a step with no outgoing edge carries its result on the canvas, in a
     card hung under the node — absolutely positioned, so the node's own box (and
     therefore every wire endpoint) is unchanged. */
  .out-card {
    position: absolute;
    left: 0;
    top: 100%;
    margin-top: 10px;
    width: 320px;
    background: var(--surface);
    border: 1px solid var(--good-line);
    border-radius: 7px;
    padding: 5px 7px 7px;
    cursor: default;
    user-select: text;
  }
  .out-card.bad { border-color: var(--bad-line); }
  .oc-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--ink-3);
    display: block;
  }
  .oc-shape { font-size: 11px; color: var(--ink-3); margin-bottom: 3px; }

  /* The run's closing paragraph — the one thing that read the WHOLE run. It sits
     on the stage rather than in `#world`, because it belongs to the run and not
     to any one node, and a card that panned off with the graph would be a card
     nobody finds again. */
  #summary {
    position: absolute;
    left: 12px;
    bottom: 12px;
    width: 400px;
    max-width: calc(100% - 24px);
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    padding: 6px 8px 8px;
  }
  #summary .sum-head { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
  #summary .sum-head .oc-title { flex: 1 1 auto; }

  .note {
    border: 1px solid var(--note-line);
    background: var(--note-bg);
    color: var(--note-fg);
    border-radius: 5px;
    padding: 6px 8px;
    margin-bottom: 8px;
    font-size: 11px;
  }
  .note.bad { border-color: var(--bad-line); background: var(--bad-bg); color: var(--bad-fg); }
  .note .btn { margin-top: 5px; }
  .empty { color: var(--ink-3); padding: 12px 0; font-size: 12px; }

  #hint {
    position: absolute;
    left: 50%;
    top: 40%;
    transform: translate(-50%, -50%);
    color: var(--ink-3);
    text-align: center;
    pointer-events: none;
    max-width: 340px;
  }

  footer {
    flex: 0 0 auto;
    padding: 5px 12px;
    border-top: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-3);
    min-height: 26px;
    display: flex;
    align-items: center;
  }
  footer.bad { color: var(--bad-fg); }
</style>
</head>
<body>
<header>
  <input id="wf-name" placeholder="Untitled workflow" />
  <div class="bar">
    <!-- THREE verbs, and they are the three things a workflow is for: write it
         down, run it, stop it. Everything that acts on ONE node lives in the
         inspector beside that node, and everything that adds a node lives in
         the palette the node comes from — the same placement rule the `mcp`
         panel's toolbar follows (MC-11).

         Disabled in the MARKUP, not just by render(): Save writes a document
         that has not been read yet and Run compiles one, so a click before the
         first load has nothing to act on. -->
    <button class="btn" id="save" disabled>Save</button>
    <button class="btn primary" id="run" disabled>Run</button>
    <button class="btn danger" id="cancel" hidden>Stop</button>
  </div>
</header>

<main>
  <aside id="palette"><h2>Tools</h2><div id="palette-body" class="empty">Loading…</div></aside>
  <div id="stage">
    <div id="world">
      <!-- role="group", not the default: Chrome maps a bare <svg> to a single
           `image` node and PRUNES its descendants, so every connection — each
           an activatable control carrying a branch condition — was invisible
           to the accessibility tree and to the keyboard. -->
      <svg id="wires" role="group" aria-label="Connections between steps"></svg>
      <div id="nodes"></div>
    </div>
    <div id="hint"></div>
    <!-- The run's closing paragraph. On the stage, not in `#world`: it describes
         the run rather than a node, and it must not pan away. -->
    <div id="summary" hidden></div>
  </div>
  <aside id="inspector"><h2>Step</h2><div id="inspector-body" class="empty">Nothing selected.</div></aside>
</main>

<footer id="status"></footer>

<script>
// The MCP workflow canvas (SPEC §44 / D401). A `.workflow.json` document is a
// chain of curated MCP tools; this page is its editor and its run readout.
//
// Three backends, and the split mirrors the `mcp` panel's:
//
//   1. `discover.py` — one READ of the machine: every `[[tool]]` in every
//      `mcp.toml` the file index, the workspace and registered_apps.json can
//      show, with each tool's parameters derived from its signature snapshot.
//   2. `run.py` — the WRITE-shaped half: compile the graph into an MCP config
//      and a prompt, spawn one headless claude over it, and read per-node
//      progress back out of the run's `tool_use`/`tool_result` records.
//   3. `fused.readFile` / `fused.writeFile` — the document itself. It is an
//      ordinary user file opened from the explorer, so the page reads and
//      writes it directly; no Python is needed to move JSON around.
//
// THE DOCUMENT LIVES IN A JS OBJECT, NOT IN URL PARAMS. Params are for view
// state a refresh must reproduce; this is a document being edited, and a graph
// in the address bar would be both unreadable and (at a few hundred bytes a
// node) unsurvivable — the same call the `mcp` panel makes about its tool list.
// The consequence is stated on screen: unsaved edits are lost on reload, and
// Save is the only durable step.
//
// The ONE thing that IS a param is the selection: which step you had open is
// exactly the state a refresh should bring back, and it is eight characters.
// Pan and zoom deliberately are not — they change continuously under a drag,
// and writing the URL per frame would fill the history with a gesture.

const TARGET = fused.params.get("_file") || "";

// The parsed document. `null` until the first read; `dirty` is what Save reads.
let doc = null;
let dirty = false;
// The mtime the document was last read/written at — the optimistic lock's arm.
// Null means "no lock to arm" (the file was empty or absent), in which case a
// Save writes unconditionally, which is correct for a document nothing else
// has ever written.
let mtime = null;
// The palette, straight from discover.py. Kept whole rather than flattened, so
// a node can find its tool's parameter list by (app, tool) at any time.
let catalog = null;
let catalogError = "";
// Which node the inspector is showing, and which node an edge is being drawn
// from. Separate: a selection survives a cancelled link.
let selected = fused.params.get("sel") || "";
let linkFrom = "";
// The live run. `runNodes` is keyed by node id and comes from run.py's poll —
// never from anything this page infers about what "should" be happening.
let runId = "";
let runNodes = {};
let runDone = false;
// Whether THIS RUN has taught the document anything — an observed output shape
// it did not have. Per RUN, not per tick: a shape is learned on the tick its
// tool answers, which is almost never the tick that reports the run finished,
// so a per-tick flag left the closing message silent about the one thing the
// user then has to Save.
let runLearned = false;
// The run's closing paragraph, from `poll`'s `summary`. Held here rather than
// merged into the document: it describes ONE run, and the document describes the
// workflow — `observedOutput` is the only thing a run teaches the file (WC-6).
let runSummary = "";
let runSummaryTruncated = false;
let summaryDismissed = false;
// The selected node's run state as last DRAWN by the inspector. `renderInspector`
// re-syncs it, so any full render (a selection change, an edit) counts as drawn
// and the poll loop only redraws on a real change. See the poll loop.
let inspectorRunSig = "";
let polling = null;
// WHICH POLL LOOP IS THE LIVE ONE. Clearing the timer is not enough to stop a
// loop: a tick already awaiting `runPython` resumes afterwards, overwrites the
// status line, and re-arms itself. Start a new run before that lands and there
// are two chains both re-arming through one `polling` handle, so the next Stop
// can only ever clear one of them and the survivor polls forever. A generation
// counter is the whole guard — `run` and `cancel` bump it, and a tick that
// comes back holding a stale one drops out silently.
let pollGen = 0;
let busy = false;

// The canvas transform. Plain numbers, applied to one element.
let view = { x: 40, y: 40, z: 1 };

const el = (id) => document.getElementById(id);
const stage = el("stage");
const world = el("world");
const wires = el("wires");
const nodesEl = el("nodes");
const statusEl = el("status");

function say(text, bad) {
  statusEl.textContent = text;
  statusEl.className = bad ? "bad" : "";
}

// A failure a re-read could clear says so and offers the re-read. The
// affordance rides the message it belongs to rather than living permanently in
// the chrome — there is no Reload button here for the same reason the `mcp`
// panel has none (MC-11).
function sayWithRetry(text, action) {
  say(text, true);
  const again = document.createElement("button");
  again.className = "btn retry";
  again.textContent = "retry";
  again.addEventListener("click", action);
  statusEl.appendChild(again);
}

function mark() {
  dirty = true;
  el("save").textContent = "Save •";
}

// ------------------------------------------------------------------ helpers

function uid(prefix) {
  // Enough entropy that two nodes added in the same millisecond differ, and
  // short enough to read in the document. Ids are internal — edges reference
  // them — so they never need to be meaningful.
  return prefix + Math.random().toString(36).slice(2, 8);
}

function nodeById(id) {
  return (doc.nodes || []).find((n) => n.id === id) || null;
}

// A node with no `kind` is a TOOL node. Every document written before prompt
// steps existed is exactly that, so the absent value has to mean the old
// behaviour — the discriminator is the whole format delta (run.py agrees).
function isPrompt(node) {
  return !!node && node.kind === "prompt";
}

// What to call a node in prose. A prompt step has no `tool` to fall back on, so
// a bare `label || tool` reads as "undefined" the moment its label is cleared.
function nameOf(node) {
  return (node && (node.label || node.tool)) || (isPrompt(node) ? "prompt step" : "step");
}

// The catalog entry for a node, or null when the tool has gone. Matched on the
// same (app folder, tool name) pair `run.py` compiles against, so a node the
// canvas draws as unresolved is exactly a node Run would refuse.
function toolOf(node) {
  // A prompt step has no catalog entry by construction: the tool behind it is
  // the run's own `step_note`, which no `mcp.toml` declares. Answered here
  // rather than falling through to the loop, so "null" cannot be read as "the
  // tool has gone" by a caller that draws a warning for that.
  if (isPrompt(node)) return null;
  if (!catalog) return null;
  for (const app of catalog.apps || []) {
    if (app.folder !== node.app) continue;
    return (app.tools || []).find((t) => t.name === node.tool) || null;
  }
  return null;
}

function paramsOf(node) {
  const tool = toolOf(node);
  return tool ? tool.params || [] : [];
}

function inputsOf(node) {
  return Array.isArray(node.inputs) ? node.inputs : (node.inputs = []);
}

function edgesInto(id) {
  return (doc.edges || []).filter((e) => e.to === id);
}

// ------------------------------------------------------------------- loading

async function loadDocument() {
  let text = "";
  try {
    const st = await fused.stat(TARGET);
    mtime = st ? st.mtime : null;
  } catch (err) {
    mtime = null;
  }
  try {
    text = await fused.readFile(TARGET);
  } catch (err) {
    // A file the explorer just listed and this page cannot read is a real
    // failure, not an empty document — saying "new workflow" here would offer
    // to overwrite whatever is actually in there.
    doc = null;
    sayWithRetry("Could not read the workflow: " + (err.message || err), () => guard(load));
    return false;
  }
  // AN EMPTY FILE IS A NEW WORKFLOW. That is the shape the explorer's generic
  // New File… leaves behind, and it is this mode's whole creation path
  // (condition.py) — treating it as a parse error would mean there was no way
  // to make one.
  if (!text.trim()) {
    doc = { version: 1, name: "", nodes: [], edges: [] };
    return true;
  }
  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch (err) {
    doc = null;
    sayWithRetry("This file does not parse as JSON (" + err.message +
      "). Fix it in the code view — starting over here would discard it.",
      () => guard(load));
    return false;
  }
  // EVERY KEY THIS EDITOR DOES NOT OWN IS PRESERVED. `.workflow.json` is a
  // plain file the user may hand-edit and other tooling may share, so
  // re-serializing only the four keys understood here would silently delete a
  // `description`, a `$schema`, or somebody's annotations on the first Save.
  // Same rule as `mcp/manifest.py`'s write, which replaces the `[[tool]]` array
  // and nothing else; the spread goes FIRST so the owned keys below win.
  doc = {
    ...parsed,
    version: parsed.version || 1,
    name: typeof parsed.name === "string" ? parsed.name : "",
    nodes: Array.isArray(parsed.nodes) ? parsed.nodes.filter((n) => n && n.id) : [],
    edges: Array.isArray(parsed.edges) ? parsed.edges.filter((e) => e && e.from && e.to) : [],
  };
  return true;
}

async function loadCatalog() {
  try {
    const out = await fused.runPython("./discover.py", { action: "tools" });
    if (!out.ok) {
      catalog = null;
      catalogError = out.message || "the tool list could not be read.";
      return;
    }
    catalog = out;
    catalogError = "";
  } catch (err) {
    catalog = null;
    catalogError = (err.type || "error") + ": " + err.message;
  }
}

async function load() {
  say("Loading…");
  // The document first and the catalog second, but BOTH before the first paint:
  // a node cannot be drawn without its tool's parameters, so painting between
  // them would show every node as unresolved and then correct itself.
  const okDoc = await loadDocument();
  await loadCatalog();
  if (!okDoc) {
    renderPalette();
    return;
  }
  el("wf-name").value = doc.name || "";
  el("save").disabled = false;
  el("save").textContent = "Save";
  dirty = false;
  renderAll();
  say(catalogError ? "Tools could not be listed: " + catalogError : "");
}

// ------------------------------------------------------------------ palette

function renderPalette() {
  const body = el("palette-body");
  body.innerHTML = "";
  body.className = "";
  // THE FIXED ENTRY FIRST, AND BEFORE THE CATALOG CHECK. A prompt step is this
  // editor's own primitive rather than something discovered on the machine, so
  // it is available even when the tool list could not be read at all — which is
  // exactly when a graph of pure reasoning steps is still buildable.
  const fixed = document.createElement("div");
  fixed.className = "app-group";
  fixed.appendChild(text("div", "app-title", "Steps"));
  const promptBtn = document.createElement("button");
  promptBtn.className = "pal-tool pal-prompt";
  promptBtn.draggable = true;
  promptBtn.appendChild(text("span", "", "Prompt step"));
  promptBtn.appendChild(text("span", "d",
    "A sentence for Claude to work out between tool calls."));
  promptBtn.title = "Adds a reasoning step. It calls no app tool; its conclusion " +
    "becomes this step's output.";
  promptBtn.addEventListener("click", () => addPromptNode(null));
  promptBtn.addEventListener("dragstart", (e) => {
    e.dataTransfer.setData("text/plain", JSON.stringify({ kind: "prompt" }));
    e.dataTransfer.effectAllowed = "copy";
  });
  fixed.appendChild(promptBtn);
  body.appendChild(fixed);
  if (!catalog) {
    body.appendChild(note(catalogError ||
      "The tool list could not be read.", true, "retry", () => guard(reloadCatalog)));
    return;
  }
  // THE READINESS RULE, on the palette. An empty tool list means two entirely
  // different things — nothing is curated, or the index has not been built —
  // and drawing the second as the first is the silent lie the whole index
  // surface is designed around. `discover.py` keeps them apart in the payload;
  // this is where that distinction reaches a person.
  const idx = catalog.index || {};
  if (idx.message) {
    body.appendChild(note(idx.message, false, "scan now", () => guard(rescan)));
  }
  if (!(catalog.apps || []).length) {
    body.appendChild(text("div", "empty",
      idx.available === false
        ? "No app folders found yet."
        : "No app declares any MCP tools. Curate one in an app folder's MCP panel first."));
    return;
  }
  for (const app of catalog.apps) {
    const group = document.createElement("div");
    group.className = "app-group";
    group.appendChild(text("div", "app-title", app.name));
    if (app.error) {
      group.appendChild(text("div", "app-note", app.error));
    }
    for (const tool of app.tools || []) {
      const btn = document.createElement("button");
      btn.className = "pal-tool";
      btn.draggable = true;
      btn.appendChild(text("span", "", tool.name));
      if (tool.description) btn.appendChild(text("span", "d", tool.description));
      btn.title = app.folder + " · " + tool.file + ":" + tool.entrypoint;
      // Click adds at a free spot; drag drops where the pointer lands. Both,
      // because a click is what works when the canvas is empty and a drag is
      // what a person reaches for once it is not.
      btn.addEventListener("click", () => addNode(app, tool, null));
      btn.addEventListener("dragstart", (e) => {
        e.dataTransfer.setData("text/plain", JSON.stringify(
          { folder: app.folder, tool: tool.name }));
        e.dataTransfer.effectAllowed = "copy";
      });
      group.appendChild(btn);
    }
    body.appendChild(group);
  }
}

async function reloadCatalog() {
  say("Reading tools…");
  await loadCatalog();
  renderAll();
  say(catalogError ? "Tools could not be listed: " + catalogError : "");
}

async function rescan() {
  say("Asking for a file-index scan…");
  const out = await fused.runPython("./discover.py", { action: "rescan" });
  if (!out.ok) { say(out.message, true); return; }
  // Deliberately not a progress bar: the scan runs in the server and takes as
  // long as the disk takes. The honest thing to offer is the re-read, once.
  say("Scan started. Re-read the tool list once it has had a moment.");
}

// -------------------------------------------------------------- editing ops

// Where a new node lands: the drop point when there is one, otherwise the next
// cell of a four-wide grid so a run of clicks does not stack every node on one
// spot. Shared by both kinds — placement is not a property of what a step is.
function spotFor(at) {
  if (at) return { x: Math.round(at.x), y: Math.round(at.y) };
  return { x: 40 + (doc.nodes.length % 4) * 250,
           y: 40 + Math.floor(doc.nodes.length / 4) * 150 };
}

function place(node) {
  doc.nodes.push(node);
  select(node.id);
  mark();
  renderAll();
}

// A PROMPT STEP — a sentence, with no app tool behind it. It compiles to "do
// this, then call `step_note` with your conclusion" (run.py), so it is observed
// from a real tool call like every other step and its conclusion flows into a
// downstream node's "from previous" input like every other step's output.
// It carries no `inputs`: there is no signature to expose parameters from.
function addPromptNode(at) {
  const spot = spotFor(at);
  place({ id: uid("n"), kind: "prompt", prompt: "", label: "Prompt",
          x: spot.x, y: spot.y });
}

function addNode(app, tool, at) {
  // A fresh node exposes NOTHING. That is the whole point of the `inputs` list:
  // `send_mail` has 22 parameters and every one of them has a default, so a
  // node that pre-exposed them would be a 22-row form nobody fills in. The
  // author picks the two or three this step is actually about, in the
  // inspector, and everything unpicked keeps the tool's own default.
  const spot = spotFor(at);
  place({
    id: uid("n"),
    app: app.folder,
    tool: tool.name,
    label: tool.name,
    x: spot.x,
    y: spot.y,
    inputs: [],
  });
}

function removeNode(id) {
  doc.nodes = doc.nodes.filter((n) => n.id !== id);
  // Edges to or from a deleted node go with it. A dangling edge would compile
  // into a condition about a step that is not in the plan.
  doc.edges = doc.edges.filter((e) => e.from !== id && e.to !== id);
  if (selected === id) select("");
  mark();
  renderAll();
}

function connect(from, to) {
  if (!from || !to || from === to) return;
  if (doc.edges.some((e) => e.from === from && e.to === to)) return;
  doc.edges.push({ id: uid("e"), from: from, to: to, condition: "" });
  mark();
  renderAll();
}

function select(id) {
  selected = id;
  // `set`, not `replace`: the selection is a step in the user's browsing of
  // this document, and Back should walk it.
  if (id) fused.params.set("sel", id); else fused.params.set("sel", "");
}

// ---------------------------------------------------------------- rendering

function text(tag, cls, content) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (content !== undefined) node.textContent = content;
  return node;
}

function note(message, bad, actionLabel, action) {
  const box = text("div", "note" + (bad ? " bad" : ""), message);
  if (actionLabel) {
    const btn = text("button", "btn", actionLabel);
    btn.addEventListener("click", action);
    box.appendChild(document.createElement("br"));
    box.appendChild(btn);
  }
  return box;
}

// ------------------------------------------------------- rendering a result

// How much of a JSON document is drawn. A tool result is capped at 8000
// characters by run.py, which is still a few thousand tree rows for a deeply
// nested one; this is what stops a poll tick from spending its frame building
// DOM nobody scrolls to.
const TREE_MAX_ROWS = 600;
const TREE_MAX_DEPTH = 8;
// Rows past this in one array or object are summarised as "+N more" instead of
// drawn. An output card is evidence, not a data viewer.
const TREE_MAX_CHILDREN = 60;
const TREE_MAX_COLUMNS = 12;
const CELL_CAP = 160;

// WHICH DISCLOSURES THE READER OPENED, ACROSS RE-RENDERS. `renderNodes` runs on
// every poll tick, so a tree rebuilt from scratch would slam shut every second
// while the run is still going. Keyed by a stable path (node id + the JSON path
// to the value), and only DEVIATIONS from the default are stored, so the sets
// stay small and a graph that is never touched records nothing.
const treeOpened = new Set();
const treeClosed = new Set();

function jsonScalarClass(value) {
  if (value === null) return "v nul";
  if (typeof value === "number" || typeof value === "boolean") return "v num";
  return "v";
}

function jsonScalarText(value) {
  if (value === null) return "null";
  if (typeof value === "string") return value;
  return String(value);
}

function cellText(value) {
  const raw = (value !== null && typeof value === "object")
    ? JSON.stringify(value) : jsonScalarText(value);
  return raw.length > CELL_CAP ? raw.slice(0, CELL_CAP) + "…" : raw;
}

// The columns of an array of UNIFORM objects, or null. Uniform means every entry
// is a plain object with the same key set — the shape `search_mail` answers with,
// and the one case where a table says more than a tree. Anything ragged falls
// back to the tree rather than being forced into a grid with holes in it.
function uniformColumns(value) {
  if (!Array.isArray(value) || !value.length) return null;
  let columns = null;
  for (const row of value.slice(0, TREE_MAX_CHILDREN)) {
    if (!row || typeof row !== "object" || Array.isArray(row)) return null;
    const keys = Object.keys(row);
    if (!keys.length || keys.length > TREE_MAX_COLUMNS) return null;
    if (columns === null) { columns = keys; continue; }
    if (keys.length !== columns.length) return null;
    for (const key of keys) if (!columns.includes(key)) return null;
  }
  return columns;
}

function jsonTable(value, columns) {
  const wrap = text("div", "");
  const table = text("table", "jtable");
  // THEAD/TBODY explicitly. A `<tr>` appended straight onto a `<table>` through
  // the DOM is not the same thing the HTML parser builds, and the row-grouping
  // it lands in is not something to leave to the browser.
  const thead = document.createElement("thead");
  const head = document.createElement("tr");
  for (const column of columns) head.appendChild(text("th", "", column));
  thead.appendChild(head);
  table.appendChild(thead);
  const tbody = document.createElement("tbody");
  const rows = value.slice(0, TREE_MAX_CHILDREN);
  for (const row of rows) {
    const tr = document.createElement("tr");
    for (const column of columns) {
      const cell = text("td", "", cellText(row[column]));
      cell.title = cell.textContent;
      tr.appendChild(cell);
    }
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  wrap.appendChild(table);
  if (value.length > rows.length) {
    wrap.appendChild(text("div", "more", "+" + (value.length - rows.length) + " more rows"));
  }
  return wrap;
}

function jsonBranch(key, value, path, depth, budget) {
  const isArray = Array.isArray(value);
  const entries = isArray
    ? value.map((v, i) => [String(i), v])
    : Object.keys(value).map((k) => [k, value[k]]);
  const columns = isArray ? uniformColumns(value) : null;

  const details = document.createElement("details");
  // Default: the top level open, everything below it closed. A reader's own
  // toggle wins over the default and survives the next poll tick.
  const open = treeOpened.has(path) ? true
    : (treeClosed.has(path) ? false : depth === 0);
  details.open = open;
  details.addEventListener("toggle", () => {
    if (details.open) { treeOpened.add(path); treeClosed.delete(path); }
    else { treeClosed.add(path); treeOpened.delete(path); }
  });
  const summary = document.createElement("summary");
  if (key !== null) summary.appendChild(text("b", "", key + " "));
  summary.appendChild(document.createTextNode(
    isArray ? "[ " + value.length + (value.length === 1 ? " item ]" : " items ]")
            : "{ " + entries.length + (entries.length === 1 ? " key }" : " keys }")));
  details.appendChild(summary);
  if (columns && columns.length) {
    details.appendChild(jsonTable(value, columns));
    return details;
  }
  const shown = entries.slice(0, TREE_MAX_CHILDREN);
  for (const [childKey, childValue] of shown) {
    if (budget.rows <= 0) break;
    details.appendChild(jsonRow(childKey, childValue, path + "/" + childKey,
      depth + 1, budget));
  }
  if (entries.length > shown.length) {
    details.appendChild(text("div", "more",
      "+" + (entries.length - shown.length) + " more"));
  }
  return details;
}

function jsonRow(key, value, path, depth, budget) {
  budget.rows -= 1;
  const nested = value !== null && typeof value === "object";
  if (nested && depth < TREE_MAX_DEPTH && budget.rows > 0) {
    return jsonBranch(key, value, path, depth, budget);
  }
  const row = text("div", "kv");
  if (key !== null) row.appendChild(text("span", "k", key));
  row.appendChild(text("span", nested ? "v" : jsonScalarClass(value),
    nested ? cellText(value) : jsonScalarText(value)));
  return row;
}

// One tool result, drawn as what it is. `opts.truncated` is the field run.py
// sets when its 8000-character cap actually bit: a capped JSON payload is almost
// never valid JSON, and "truncated" is the true thing to say about it where a
// parse error would blame the tool for the cap.
function renderOutput(box, value, opts) {
  opts = opts || {};
  const raw = String(value === null || value === undefined ? "" : value);
  const blob = () => box.appendChild(
    text("div", "out" + (opts.bad ? " bad" : ""), raw));
  if (opts.truncated) {
    box.appendChild(text("div", "out-note",
      "Truncated — this is the first " + raw.length.toLocaleString() +
      " characters, as text."));
    blob();
    return;
  }
  let parsed;
  try {
    parsed = JSON.parse(raw);
  } catch (err) {
    blob();
    return;
  }
  if (parsed === null || typeof parsed !== "object") {
    // A bare number or string is JSON, and a tree of one row says less about it
    // than the text does.
    blob();
    return;
  }
  const tree = text("div", "jsonv");
  tree.appendChild(jsonBranch(null, parsed, opts.path || "r", 0, { rows: TREE_MAX_ROWS }));
  box.appendChild(tree);
}

// The `observedOutput` shape line — `run.py::_observed`'s summary, which is the
// part that gets SAVED into the document. Shared by the inspector and the canvas
// card so the two cannot drift.
function shapeLine(observed) {
  return text("div", "oc-shape", observed.kind +
    (observed.keys && observed.keys.length
      ? " { " + observed.keys.join(", ") + " }" : "") +
    (observed.count ? " · " + observed.count : ""));
}

// THE RUN'S CLOSING PARAGRAPH. `run.py` used to read the `result` row only when
// it carried an error and throw it away otherwise, so on every successful run
// the one piece of text that had read the whole run — which steps ran, which
// were skipped and why — was discarded. It is now kept, and this is where it
// lands: a card on the stage, dismissible, because it belongs to the run rather
// than to the document and the next Run replaces it.
function renderSummary() {
  const box = el("summary");
  box.innerHTML = "";
  if (!runSummary || summaryDismissed) { box.hidden = true; return; }
  box.hidden = false;
  const head = text("div", "sum-head");
  head.appendChild(text("span", "oc-title", "Run summary"));
  const close = text("button", "btn", "×");
  close.title = "Dismiss";
  close.setAttribute("aria-label", "Dismiss the run summary");
  close.addEventListener("click", () => { summaryDismissed = true; renderSummary(); });
  head.appendChild(close);
  box.appendChild(head);
  renderOutput(box, runSummary, { truncated: runSummaryTruncated, path: "summary" });
}

function renderAll() {
  renderPalette();
  renderNodes();
  renderInspector();
  renderSummary();
  updateButtons();
}

function applyView() {
  world.style.transform =
    "translate(" + view.x + "px," + view.y + "px) scale(" + view.z + ")";
}

function renderNodes() {
  nodesEl.innerHTML = "";
  const hint = el("hint");
  if (!doc || !doc.nodes.length) {
    hint.textContent = catalog && (catalog.apps || []).length
      ? "Click a tool on the left to add the first step."
      : "No tools to build with yet.";
    wires.innerHTML = "";
    applyView();
    return;
  }
  hint.textContent = "";

  // The step number a node carries is the position `run.py` will put it in.
  // Derived here by the SAME rule — a topological order, stable on document
  // order — so the canvas and the prompt cannot disagree about what step 2 is.
  const order = executionOrder();
  // A TERMINAL step is one nothing runs after, and its result is the workflow's
  // answer. A graph can have several — a branch that fans out ends in more than
  // one — so this is a set and every one of them gets a card.
  const feedsSomething = new Set(doc.edges.map((e) => e.from));
  doc.nodes.forEach((node) => {
    const div = text("div", "node");
    div.dataset.id = node.id;
    // A node is an activatable control, so it says so and takes focus. Not a
    // <button>: a button swallows the pointer gestures this thing is mostly
    // for (drag to move, drag from the plug to connect), and role+tabindex buys
    // the keyboard and the screen reader without giving those up.
    div.setAttribute("role", "button");
    div.setAttribute("tabindex", "0");
    div.addEventListener("keydown", (event) => {
      // ONLY THE NODE'S OWN KEYS. The output card hangs inside this element and
      // holds focusable `<summary>` disclosures; without this guard, Space on
      // one of them would be swallowed here and re-select the node instead of
      // opening the branch the reader was on.
      if (event.target !== div) return;
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      select(node.id);
      renderAll();
    });
    if (node.id === selected) div.classList.add("sel");
    const state = runNodes[node.id];
    if (state) div.classList.add("st-" + state.status);
    div.style.left = (node.x || 0) + "px";
    div.style.top = (node.y || 0) + "px";

    const step = order.indexOf(node.id);
    div.appendChild(text("div", "step-no", step >= 0 ? String(step + 1) : "?"));

    if (state) {
      const pill = text("span", "pill " + state.status, state.status);
      div.appendChild(pill);
    }
    const prompt = isPrompt(node);
    if (prompt) div.classList.add("prompt");
    const tool = toolOf(node);
    div.appendChild(text("div", "n-label",
      node.label || (prompt ? "Prompt" : node.tool)));
    if (prompt) {
      div.appendChild(text("div", "n-tool", "prompt step · no tool"));
      const written = String(node.prompt || "").trim();
      div.appendChild(written
        ? text("div", "n-prompt", written)
        : text("div", "n-none", "nothing written yet"));
    } else {
      const sub = text("div", "n-tool",
        (tool ? "" : "⚠ ") + shortApp(node.app) + " · " + node.tool);
      if (!tool) sub.title = "This tool is no longer declared in that app's mcp.toml.";
      div.appendChild(sub);

      const shown = inputsOf(node).filter((i) => i && i.name);
      if (shown.length) {
        const list = text("div", "n-inputs");
        for (const input of shown.slice(0, 6)) {
          const row = text("div", "n-in" + (input.source === "previous" ? " prev" : ""));
          row.appendChild(text("b", "", input.name));
          row.appendChild(text("span", "",
            input.source === "previous" ? "← previous step" : String(input.value ?? "")));
          list.appendChild(row);
        }
        if (shown.length > 6) {
          list.appendChild(text("div", "n-in", "+" + (shown.length - 6) + " more"));
        }
        div.appendChild(list);
      } else {
        div.appendChild(text("div", "n-none", "defaults only"));
      }
    }

    const plug = text("div", "plug", "→");
    plug.title = "Drag to the next step";
    plug.setAttribute("role", "button");
    plug.setAttribute("aria-label", "Connect " + (node.label || node.tool || "step") +
      " to the next step");
    plug.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      startLink(node.id);
    });
    div.appendChild(plug);

    div.setAttribute("aria-label", "Step " + (step + 1) + ": " +
      (node.label || node.tool || "Prompt") + " — " +
      (prompt ? "prompt step" : node.tool) +
      (state ? " (" + state.status + ")" : ""));
    if (!feedsSomething.has(node.id) && state && (state.output || state.error)) {
      div.appendChild(outputCard(node, state));
    }
    div.addEventListener("pointerdown", (e) => onNodePointerDown(e, node));
    nodesEl.appendChild(div);
  });
  applyView();
  // Wires need the nodes' MEASURED heights, which only exist once they are in
  // the document — a node's height depends on how many inputs it shows. So the
  // wire pass runs after layout rather than guessing a box size.
  requestAnimationFrame(renderWires);
}

// The card a terminal step wears once it has answered. A child of the node so it
// travels with it under a drag; absolutely positioned so the node's own box —
// and therefore every wire endpoint — is unchanged by it.
function outputCard(node, state) {
  const card = text("div", "out-card" + (state.error ? " bad" : ""));
  card.appendChild(text("span", "oc-title", state.error ? "Failed with" : "Output"));
  if (!state.error && node.observedOutput) card.appendChild(shapeLine(node.observedOutput));
  renderOutput(card, state.error || state.output, {
    bad: !!state.error,
    truncated: !state.error && !!state.truncated,
    path: "card:" + node.id,
  });
  // The card is TEXT, not a handle. Without this, selecting a line of the result
  // drags the node out from under the pointer — and a click that missed the
  // node would fall through to the stage and start a pan.
  card.addEventListener("pointerdown", (event) => event.stopPropagation());
  return card;
}

function shortApp(folder) {
  const parts = String(folder || "").replace(/[\\/]+$/, "").split(/[\\/]/);
  return parts[parts.length - 1] || folder;
}

function boxOf(id) {
  const div = nodesEl.querySelector('[data-id="' + CSS.escape(id) + '"]');
  const node = nodeById(id);
  if (!div || !node) return null;
  return { x: node.x || 0, y: node.y || 0, w: div.offsetWidth, h: div.offsetHeight };
}

function renderWires() {
  wires.innerHTML = "";
  if (!doc) return;
  for (const edge of doc.edges) {
    const a = boxOf(edge.from), b = boxOf(edge.to);
    if (!a || !b) continue;
    const x1 = a.x + a.w, y1 = a.y + a.h / 2;
    const x2 = b.x, y2 = b.y + b.h / 2;
    // A horizontal-tangent cubic: the control offset grows with the gap so a
    // long edge bows rather than cutting through whatever is between.
    const dx = Math.max(40, Math.abs(x2 - x1) / 2);
    const d = "M" + x1 + "," + y1 + " C" + (x1 + dx) + "," + y1 + " " +
      (x2 - dx) + "," + y2 + " " + x2 + "," + y2;
    const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
    line.setAttribute("d", d);
    // A DASHED edge carries a condition and a solid one does not. That is the
    // only difference the graph has that a reader must be able to see without
    // clicking: a conditional edge may not be taken at all.
    if ((edge.condition || "").trim()) line.setAttribute("class", "conditional");
    if (edge.from === selected || edge.to === selected) {
      line.setAttribute("class", (line.getAttribute("class") || "") + " hot");
    }
    wires.appendChild(line);
    // A fat transparent copy is the click target: a 1.6px stroke is not
    // something anyone can hit, and edges are how a condition is reached.
    const hit = document.createElementNS("http://www.w3.org/2000/svg", "path");
    hit.setAttribute("d", d);
    hit.setAttribute("class", "hit");
    // POINTERDOWN + stopPropagation, not `click` — the same shape a node uses,
    // and for a reason `click` cannot survive. `click` only fires after
    // pointerup, and this element does not live that long: the pointerdown
    // bubbles to `stage` first, which clears the selection and calls
    // renderAll(), whose rAF rebuilds every path from scratch. By pointerup the
    // element the gesture started on is detached, so the browser retargets the
    // click to `#stage`. The net effect was that clicking a wire to edit its
    // condition cleared the selection and started a pan instead — the one
    // gesture the edge exists for was the one that could not work.
    // An edge is an activatable control — it carries the condition that decides
    // whether its target step runs at all — so it says so and takes focus. Until
    // this, an edge's condition was reachable ONLY by landing a mouse on a
    // 14px-wide invisible stroke: no keyboard path, and nothing in the
    // accessibility tree naming it. Same treatment as a node, and for the same
    // reason.
    const from = nodeById(edge.from), to = nodeById(edge.to);
    const label = (from ? nameOf(from) : edge.from) + " to " +
      (to ? nameOf(to) : edge.to) +
      ((edge.condition || "").trim() ? ", conditional" : "");
    hit.setAttribute("role", "button");
    hit.setAttribute("tabindex", "0");
    hit.setAttribute("aria-label", "Connection: " + label);
    const open = () => { select(edge.to); renderAll(); };
    hit.addEventListener("pointerdown", (event) => {
      event.stopPropagation();
      open();
    });
    hit.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      open();
    });
    wires.appendChild(hit);
  }
}

// The same linearisation `run.py::_order` computes, for the step numbers on the
// canvas. Duplicated in JS deliberately rather than round-tripped through
// Python: it is called on every render, including mid-drag, and a subprocess
// per frame to number three boxes is not a trade worth making. The two are
// pinned to each other by being the same algorithm — Kahn, ready nodes taken in
// document order — and the canvas only ever uses it to LABEL, never to decide.
function executionOrder() {
  const ids = doc.nodes.map((n) => n.id);
  // `Object.create(null)`, NOT `{}`. These are keyed by node ids out of a
  // hand-editable file, and on a plain object `incoming["toString"]` is
  // Object.prototype.toString rather than undefined — so a stale edge naming
  // `constructor`, `toString` or `__proto__` sails past the guard below and
  // `outgoing[edge.from].push(...)` throws on a value that is not an array.
  // That throws inside render, which leaves a BLANK CANVAS with no banner,
  // while `run.py::_order` (real dicts, exact `in`) runs the same file
  // perfectly — so the workflow works and only the editor is broken. A
  // null-prototype object has no inherited keys to collide with.
  const incoming = Object.create(null), outgoing = Object.create(null);
  ids.forEach((i) => { incoming[i] = 0; outgoing[i] = []; });
  for (const edge of doc.edges) {
    if (incoming[edge.to] === undefined || incoming[edge.from] === undefined) continue;
    incoming[edge.to] += 1;
    outgoing[edge.from].push(edge.to);
  }
  let ready = ids.filter((i) => incoming[i] === 0);
  const out = [];
  while (ready.length) {
    const current = ready.shift();
    out.push(current);
    for (const next of outgoing[current]) {
      if (--incoming[next] === 0) ready.push(next);
    }
    ready.sort((a, b) => ids.indexOf(a) - ids.indexOf(b));
  }
  // A cycle leaves nodes unplaced. They keep a number here (Run refuses the
  // graph outright) rather than showing "?" for every node in the loop with no
  // explanation of why.
  for (const id of ids) if (!out.includes(id)) out.push(id);
  return out;
}

// -------------------------------------------------------------- inspector

// The selected node's polled state, as a comparable string. `null` when
// nothing is selected or the run has nothing to say about it yet — both of
// which are stable values, so an idle poll redraws nothing.
function inspectorSig() {
  return JSON.stringify((selected && runNodes[selected]) || null);
}

// THE PARAMETER PICKER — the reason the document has an `inputs` list at all.
// Every parameter of a dispatcher entrypoint has a default, so the tool's own
// schema says "22 optional properties" and nothing more; the author's choice
// of which ones this step is about is information that exists nowhere else,
// and this is where it is made. A filter box, because 22 rows is a scroll.
//
// Its own function only so the inspector reads as the four things a step has —
// a name, what it does, what feeds it, what it returned — with this one of them
// absent for a prompt step.
function renderParamPicker(body, node, tool) {
  const params = tool ? tool.params || [] : [];
  const picker = text("div", "params");
  picker.appendChild(text("label", "", "Inputs (" + inputsOf(node).length +
    " of " + params.length + " exposed)"));
  if (!params.length) {
    picker.appendChild(text("div", "empty", tool
      ? "This tool takes no parameters beyond the ones its manifest pins."
      : "No parameters to show."));
  } else {
    const filter = document.createElement("input");
    filter.placeholder = "filter parameters…";
    picker.appendChild(filter);
    const list = text("div", "");
    picker.appendChild(list);
    const draw = () => {
      list.innerHTML = "";
      const needle = filter.value.trim().toLowerCase();
      for (const param of params) {
        const input = inputsOf(node).find((i) => i.name === param.name);
        // A filtered-out parameter that IS exposed stays visible: hiding a
        // value the step actually sends would make the filter a way to lose
        // track of what this node does.
        if (needle && !param.name.toLowerCase().includes(needle) && !input) continue;
        const row = text("div", "param" + (input ? " on" : ""));
        const lab = document.createElement("label");
        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = !!input;
        box.addEventListener("change", () => {
          if (box.checked) {
            inputsOf(node).push({ name: param.name, source: "literal", value: "" });
          } else {
            node.inputs = inputsOf(node).filter((i) => i.name !== param.name);
          }
          mark();
          draw();
          renderNodes();
        });
        lab.appendChild(box);
        lab.appendChild(text("span", "pname", param.name));
        row.appendChild(lab);
        if (param.annotation || param.default) {
          row.appendChild(text("span", "ptype",
            (param.annotation || "") + (param.default ? " = " + param.default : "")));
        }
        list.appendChild(row);
        if (!input) continue;

        const detail = text("div", "param-row");
        const source = document.createElement("select");
        for (const [value, text_] of [["literal", "value"], ["previous", "from previous"]]) {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = text_;
          source.appendChild(option);
        }
        source.value = input.source === "previous" ? "previous" : "literal";
        const valueInput = document.createElement("input");
        valueInput.value = input.value ?? "";
        valueInput.placeholder = param.default ? "default: " + param.default : "value";
        const sync = () => {
          // A "from previous" input has no value to type: the whole point is
          // that Claude derives it from the step before, and a stale literal
          // left in the box would be written into a document that does not use
          // it — a lie the next reader of this file would believe.
          valueInput.hidden = source.value === "previous";
        };
        source.addEventListener("change", () => {
          input.source = source.value;
          if (input.source === "previous") input.value = "";
          sync();
          mark();
          renderNodes();
        });
        valueInput.addEventListener("input", () => {
          input.value = valueInput.value;
          mark();
          renderNodes();
        });
        sync();
        detail.appendChild(source);
        detail.appendChild(valueInput);
        list.appendChild(detail);
      }
    };
    filter.addEventListener("input", draw);
    draw();
  }
  body.appendChild(picker);
}

function renderInspector() {
  const body = el("inspector-body");
  // Recorded on every draw, not just the poll loop's, so a selection change or
  // an edit leaves the two in step and the next tick does not redraw on top of
  // a panel that is already current.
  inspectorRunSig = inspectorSig();
  body.innerHTML = "";
  const node = selected ? nodeById(selected) : null;
  if (!node) {
    body.appendChild(text("div", "empty", doc && doc.nodes.length
      ? "Select a step to set its inputs." : "Nothing selected."));
    return;
  }
  const prompt = isPrompt(node);
  const tool = toolOf(node);

  const label = text("div", "field");
  label.appendChild(text("label", "", "Label"));
  const labelInput = document.createElement("input");
  labelInput.value = node.label || "";
  labelInput.addEventListener("input", () => {
    node.label = labelInput.value;
    mark();
    renderNodes();
  });
  label.appendChild(labelInput);
  body.appendChild(label);

  if (prompt) {
    // THE PROMPT ITSELF, in place of the tool line and the parameter picker.
    // There is nothing to pick: this step's whole content is the sentence, and
    // the only structure it has is the one `run.py` wraps around it.
    const box = text("div", "field");
    box.appendChild(text("label", "", "Prompt"));
    const area = document.createElement("textarea");
    area.rows = 7;
    area.value = node.prompt || "";
    area.placeholder = "Summarise which accounts have unread mail.";
    area.addEventListener("input", () => {
      node.prompt = area.value;
      mark();
      renderNodes();
    });
    box.appendChild(area);
    body.appendChild(box);
    body.appendChild(text("div", "n-tool",
      "Claude does this, then records its conclusion with the run's own " +
      "step_note tool — which is what makes the step show progress, and what " +
      "later steps read as this step's output."));
  } else {
    const where = text("div", "field");
    where.appendChild(text("label", "", "Tool"));
    where.appendChild(text("div", "n-tool", node.tool + "  ·  " + node.app));
    body.appendChild(where);

    if (!tool) {
      body.appendChild(note(
        "That app folder no longer declares a tool called " + node.tool +
        ". Re-curate it in the app's MCP panel, or delete this step — a run will " +
        "refuse the whole workflow while it is here.", true));
    }
  }

  // Incoming edges, with their conditions. They live here rather than on the
  // canvas because a condition is a SENTENCE and a canvas has nowhere to put
  // one; the edge shows dashed once there is one, which is the part a reader
  // needs at a glance.
  const incoming = edgesInto(node.id);
  if (incoming.length) {
    const box = text("div", "edge-row");
    box.appendChild(text("label", "", "Runs after"));
    for (const edge of incoming) {
      const from = nodeById(edge.from);
      const row = text("div", "field");
      row.appendChild(text("label", "", (from ? nameOf(from) : edge.from) +
        " → this step, only if:"));
      const input = document.createElement("input");
      input.value = edge.condition || "";
      input.placeholder = "always (leave empty — Claude decides)";
      input.addEventListener("input", () => {
        edge.condition = input.value;
        mark();
        renderNodes();
      });
      row.appendChild(input);
      const drop = text("button", "btn", "disconnect");
      drop.addEventListener("click", () => {
        doc.edges = doc.edges.filter((e) => e !== edge);
        mark();
        renderAll();
      });
      row.appendChild(drop);
      box.appendChild(row);
    }
    body.appendChild(box);
  }

  // The parameter picker (below). A prompt step has no signature and therefore
  // nothing to pick: skipped entirely rather than drawn empty, which would read
  // as "this tool takes no parameters" about a step that has no tool.
  if (!prompt) renderParamPicker(body, node, tool);

  // What the step ACTUALLY returned, once a run has said so. This is the fact
  // nothing else on this surface has: an MCP tool declares its inputs and says
  // nothing at all about its output, and `search_mail` and `send_mail` share
  // one entrypoint while returning entirely different things.
  const state = runNodes[node.id];
  if (state && (state.output || state.error)) {
    const box = text("div", "edge-row");
    box.appendChild(text("label", "", state.error ? "Failed with" : "Returned"));
    if (!state.error && node.observedOutput) box.appendChild(shapeLine(node.observedOutput));
    renderOutput(box, state.error || state.output, {
      bad: !!state.error,
      truncated: !state.error && !!state.truncated,
      path: "insp:" + node.id,
    });
    body.appendChild(box);
  }

  const remove = text("button", "btn danger", "Delete step");
  remove.style.marginTop = "10px";
  remove.addEventListener("click", () => removeNode(node.id));
  body.appendChild(remove);
}

// ------------------------------------------------------- pan / zoom / drag

function stagePoint(event) {
  const rect = stage.getBoundingClientRect();
  return {
    x: (event.clientX - rect.left - view.x) / view.z,
    y: (event.clientY - rect.top - view.y) / view.z,
  };
}

let drag = null;

function onNodePointerDown(event, node) {
  if (event.button !== 0) return;
  event.stopPropagation();
  // Completing a link takes priority over selecting: the user is mid-gesture,
  // and a click that both ended the link and moved the selection would leave
  // them looking at a different step than the one they just connected.
  if (linkFrom) {
    connect(linkFrom, node.id);
    endLink();
    return;
  }
  select(node.id);
  const start = stagePoint(event);
  drag = { node: node, dx: start.x - (node.x || 0), dy: start.y - (node.y || 0), moved: false };
  renderAll();
  // CAPTURE ON `stage`, NOT ON THE NODE. `renderAll()` above rebuilds the node
  // list from scratch, which detaches whatever element the pointer was captured
  // on — and removing a capture element releases the capture implicitly. The
  // drag then only tracked while the pointer stayed inside `#stage`: moving
  // toward the inspector, the palette or off the window stopped the node dead
  // and committed wherever it was when the pointer left. `stage` survives every
  // re-render, so it is the only element here that can hold a capture for the
  // length of a gesture. Set AFTER the paint for the same reason.
  captureOn(event.pointerId);
  const div = nodesEl.querySelector('[data-id="' + CSS.escape(node.id) + '"]');
  if (div) div.classList.add("dragging");
}

// One place owns the pointer capture, because one element does. Guarded: a
// synthetic event (a test driver, an assistive tool) may carry a pointerId no
// capture was ever opened for, and `setPointerCapture` throws on one.
let captured = null;

function captureOn(pointerId) {
  try {
    stage.setPointerCapture(pointerId);
    captured = pointerId;
  } catch (err) {
    captured = null;
  }
}

function releaseCapture() {
  if (captured === null) return;
  try { stage.releasePointerCapture(captured); } catch (err) { /* already gone */ }
  captured = null;
}

stage.addEventListener("pointermove", (event) => {
  if (drag) {
    const at = stagePoint(event);
    drag.node.x = Math.round(at.x - drag.dx);
    drag.node.y = Math.round(at.y - drag.dy);
    drag.moved = true;
    const div = nodesEl.querySelector('[data-id="' + CSS.escape(drag.node.id) + '"]');
    if (div) {
      div.style.left = drag.node.x + "px";
      div.style.top = drag.node.y + "px";
    }
    // Wires only — a full re-render per pointermove would rebuild the inspector
    // (and blur whatever input has focus) sixty times a second.
    renderWires();
    return;
  }
  if (pan) {
    view.x = pan.x0 + (event.clientX - pan.cx);
    view.y = pan.y0 + (event.clientY - pan.cy);
    applyView();
  }
});

function endDrag() {
  if (!drag) return;
  const div = nodesEl.querySelector('[data-id="' + CSS.escape(drag.node.id) + '"]');
  if (div) div.classList.remove("dragging");
  // A click that did not move anything is not an edit. Marking it dirty would
  // put a • on Save for looking at the canvas.
  if (drag.moved) mark();
  drag = null;
}

let pan = null;

stage.addEventListener("pointerdown", (event) => {
  if (event.button !== 0) return;
  if (linkFrom) { endLink(); return; }
  // Background click clears the selection: it is the gesture every canvas has,
  // and without it there is no way to close the inspector.
  if (selected) { select(""); renderAll(); }
  pan = { x0: view.x, y0: view.y, cx: event.clientX, cy: event.clientY };
  stage.classList.add("panning");
  // A pan needs the capture as much as a node drag does — without it the
  // gesture dies the moment the pointer crosses into a side panel.
  captureOn(event.pointerId);
});

window.addEventListener("pointerup", () => {
  endDrag();
  pan = null;
  stage.classList.remove("panning");
  releaseCapture();
});

stage.addEventListener("wheel", (event) => {
  event.preventDefault();
  const rect = stage.getBoundingClientRect();
  const px = event.clientX - rect.left, py = event.clientY - rect.top;
  const factor = Math.exp(-event.deltaY * 0.0015);
  const next = Math.min(2.4, Math.max(0.3, view.z * factor));
  // Zoom about the POINTER, not the origin: the point under the cursor stays
  // under the cursor, which is the only zoom that feels like the canvas is a
  // surface rather than a scaling image.
  view.x = px - (px - view.x) * (next / view.z);
  view.y = py - (py - view.y) * (next / view.z);
  view.z = next;
  applyView();
}, { passive: false });

// Drag from the palette drops a node where the pointer is.
stage.addEventListener("dragover", (event) => { event.preventDefault(); });
stage.addEventListener("drop", (event) => {
  event.preventDefault();
  let payload;
  try {
    payload = JSON.parse(event.dataTransfer.getData("text/plain") || "");
  } catch (err) { return; }
  if (!payload) return;
  const at0 = stagePoint(event);
  if (payload.kind === "prompt") {
    addPromptNode({ x: at0.x - 100, y: at0.y - 24 });
    return;
  }
  if (!catalog) return;
  const app = (catalog.apps || []).find((a) => a.folder === payload.folder);
  const tool = app && (app.tools || []).find((t) => t.name === payload.tool);
  if (!app || !tool) return;
  const at = stagePoint(event);
  addNode(app, tool, { x: at.x - 100, y: at.y - 24 });
});

function startLink(id) {
  linkFrom = id;
  stage.classList.add("linking");
  say("Click the step this one feeds into. Escape to cancel.");
}

function endLink() {
  linkFrom = "";
  stage.classList.remove("linking");
  say("");
}

window.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && linkFrom) endLink();
});

// ----------------------------------------------------------- save and run

function updateButtons() {
  const runnable = doc && doc.nodes.length && !runId && catalog && catalog.fusedCli;
  const runBtn = el("run");
  runBtn.disabled = busy || !runnable;
  // D334 / MC-5a: the reason a disabled Run is disabled goes ON the control.
  // A workflow's servers are `fused app serve` processes, and a machine with no
  // exported `fused` cannot start one — a Run that failed silently inside a
  // detached session is a failure nobody can see.
  runBtn.title = !doc || !doc.nodes.length
    ? "Add a step first."
    : (catalog && !catalog.fusedCli
      ? "No `fused` command is available, so this workflow's MCP servers cannot be started."
      : "Run this workflow");
  el("cancel").hidden = !runId || runDone;
}

async function save() {
  if (!doc) return;
  doc.name = el("wf-name").value;
  const body = JSON.stringify(doc, null, 2) + "\n";
  say("Saving…");
  try {
    // The optimistic lock is armed whenever there is an mtime to arm it with.
    // Without it, two windows on the same document silently clobber each other
    // — and this file is exactly the kind somebody leaves open in a second tab.
    const stat = await fused.writeFile(TARGET, body,
      mtime ? { expectedMtime: mtime } : {});
    mtime = stat ? stat.mtime : null;
    dirty = false;
    el("save").textContent = "Save";
    say("Saved.");
  } catch (err) {
    if (err.type === "conflict") {
      sayWithRetry("This file changed on disk since it was read. Re-read to see " +
        "the other version (this discards your edits), or save again to overwrite.",
        () => guard(load));
      // The overwrite path: dropping the lock is what the second Save does.
      mtime = null;
      return;
    }
    say("Could not save: " + (err.message || err), true);
  }
}

async function run() {
  if (dirty) {
    // Run compiles the file on disk, not the object in this page — `run.py`
    // reads the path. Saving first is the only way the two can be the same
    // thing, and silently running a stale version is the confusion this avoids.
    await save();
    if (dirty) return;  // the save failed; its message is already on screen
  }
  say("Starting…");
  const out = await fused.runPython("./run.py", { action: "start", path: TARGET });
  if (!out.ok) { say(out.message, true); return; }
  runId = out.runId;
  runNodes = {};
  runDone = false;
  runLearned = false;
  // A new run's summary is not written yet, and last run's is not about it.
  runSummary = "";
  runSummaryTruncated = false;
  summaryDismissed = false;
  renderSummary();
  // Every open disclosure was opened over a result this run is about to replace.
  treeOpened.clear();
  treeClosed.clear();
  // Retire any loop still in flight from a previous run before starting this
  // one's — the timer AND the generation, since an awaiting tick has no timer
  // to clear.
  pollGen += 1;
  if (polling) clearTimeout(polling);
  updateButtons();
  poll();
}

// The poll loop deliberately does NOT go through `guard`. `guard` is a
// single-flight lock over the user's own actions, and a tick that arrived while
// one was in progress would be dropped — which does not retry, it ends the loop
// and freezes the readout on whatever it last drew. So this carries its own
// try/catch and its own re-arm.
async function poll() {
  if (!runId) return;
  const gen = pollGen;
  let out;
  try {
    // `key: null` opts out of the stale-request cancellation runPython applies
    // per file (D114): this is a polling loop, and the default would have each
    // tick abort the one before it.
    out = await fused.runPython("./run.py",
      { action: "poll", runId: runId }, { key: null });
  } catch (err) {
    // One failed tick is not a failed run — the executor is a subprocess and
    // can lose a race. Keep polling and say so; the run itself is detached and
    // carries on regardless of whether this page can see it.
    if (gen !== pollGen) return;
    say("Lost contact with the run (" + (err.message || err) + ") — retrying…", true);
    polling = setTimeout(poll, 1500);
    return;
  }
  // The await is over; anything that happened while it ran wins. A Stop or a
  // fresh Run bumped the generation, and this tick's answer describes a run
  // nobody is watching any more.
  if (gen !== pollGen || !runId || !doc) return;
  if (!out.ok) {
    say(out.message, true);
    runId = "";
    updateButtons();
    return;
  }
  runNodes = {};
  for (const node of out.nodes || []) runNodes[node.id] = node;
  // THE OBSERVED OUTPUT IS MERGED INTO THE DOCUMENT, NOT WRITTEN BEHIND THE
  // PAGE'S BACK. The page is this file's only writer; a backend that saved into
  // it mid-edit would race whatever is in the inspector. So a run's findings
  // land as an unsaved edit, marked, and Save is the deliberate step — the
  // same rule the rest of this panel follows.
  let learned = false;
  for (const node of doc.nodes) {
    const state = runNodes[node.id];
    if (state && state.observedOutput &&
        JSON.stringify(node.observedOutput) !== JSON.stringify(state.observedOutput)) {
      node.observedOutput = state.observedOutput;
      learned = true;
    }
  }
  if (learned) { runLearned = true; mark(); }
  if ((out.summary || "") !== runSummary) {
    runSummary = out.summary || "";
    runSummaryTruncated = !!out.summaryTruncated;
    renderSummary();
  }
  renderNodes();
  // THE INSPECTOR IS NOT REBUILT ON A TIMER. `renderInspector` starts with
  // `innerHTML = ""`, so calling it unconditionally every 1.5 s destroyed focus
  // and caret in whatever was being typed — an edge condition, a label, a
  // literal value, the parameter filter — which made the panel untypeable for
  // the whole length of a run. The only thing a tick can add to the inspector
  // is the selected node's own run state, so that is the only thing that
  // triggers a redraw. Same rule as the pointermove path, which redraws wires
  // and nothing else for exactly this reason.
  if (inspectorSig() !== inspectorRunSig) renderInspector();
  if (out.done) {
    runDone = true;
    const failed = (out.nodes || []).filter((n) => n.status === "error").length;
    say(out.error ? "Run failed: " + out.error
      : (failed ? failed + " step(s) failed." : "Run finished.") +
        (runLearned ? " Output shapes recorded — Save to keep them." : ""),
      !!out.error || !!failed);
    runId = "";
    updateButtons();
    return;
  }
  const running = (out.nodes || []).find((n) => n.status === "running");
  say(running ? "Running: " + running.label : "Waiting for the first tool call…");
  polling = setTimeout(poll, 1500);
}

async function cancel() {
  if (!runId) return;
  const id = runId;
  runId = "";
  runDone = true;
  pollGen += 1;
  if (polling) clearTimeout(polling);
  updateButtons();
  const out = await fused.runPython("./run.py", { action: "cancel", runId: id });
  say(out.cancelled ? "Run stopped." : (out.message || "Could not stop the run."),
    !out.cancelled);
}

// One place turns a rejected promise into a footer line. Without it a thrown
// runPython would auto-open the red traceback overlay, which is the debugging
// default and the wrong answer for a panel that has a status line.
async function guard(fn) {
  if (busy) return;
  busy = true;
  updateButtons();
  try {
    await fn();
  } catch (err) {
    say((err && err.type ? err.type + ": " : "") + (err && err.message ? err.message : err), true);
  } finally {
    busy = false;
    updateButtons();
  }
}

el("save").addEventListener("click", () => guard(save));
el("run").addEventListener("click", () => guard(run));
el("cancel").addEventListener("click", () => guard(cancel));
el("wf-name").addEventListener("input", mark);
window.addEventListener("beforeunload", (event) => {
  // The document lives in memory until Save, which is stated in the docstring
  // above and is worth one confirm: a graph is twenty minutes of wiring and a
  // reload is one keystroke.
  if (!dirty) return;
  event.preventDefault();
  event.returnValue = "";
});

// The selection is the one piece of state in the URL, so Back/Forward move it.
fused.params.onChange(() => {
  const next = fused.params.get("sel") || "";
  if (next === selected || !doc) return;
  selected = next;
  renderAll();
});

if (!TARGET) {
  say("No workflow file selected.", true);
} else {
  guard(load);
}
</script>
</body>
</html>
