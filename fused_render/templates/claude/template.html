  .perm .plan-note:focus {
    outline: none;
    border-color: color-mix(in srgb, var(--accent) 60%, transparent);
  }
  /* "Sent back for revision" is not a refusal — it is the other half of a
     conversation, so it does not read in the deny red. */
  .perm.plan .perm-status.deny { color: var(--dim); }

  /* ── the tool timeline (segments inside an assistant turn) ──
     Deliberately quieter than a permission card: a card is a question and has
     to be seen, a chip is a receipt for something that already happened, and a
     transcript of forty loud cards is unreadable. Same border language, no
     accent ring, no shadow. `white-space: normal` is kept explicit here even
     though `.assistant .body` no longer inherits pre-wrap down to them: these
     rows are also built inside the permission cards, and stating it costs
     nothing next to reintroducing the blank-line bug by inheritance. */
  .toolchip, .thinking { white-space: normal; margin: 6px 0; }
  /* A CLOSED chip is a line in a timeline, not a card: one hairline rail down
     the left edge and nothing else — no box, no fill, no radius. Fifteen boxed
     rows in a row read as fifteen separate things each asking to be considered
     (and, stacked, as a dotted staircase); fifteen rail lines read as one
     transcript you can skim in a single pass. Opening a chip is what promotes
     it to a surface: the rail brightens, a faint fill comes in, and the right
     side rounds off — so at most a couple of chips in a long turn are ever
     drawn as boxes, which is exactly the couple the user opened. */
  .toolchip {
    padding: 2px 0 2px 12px;
    border-left: 1px solid var(--border);
    border-radius: 0;
    margin: 1px 0;
    font-size: 13px;
  }
  .toolchip[open] {
    border-left-color: var(--border-strong);
    background: color-mix(in srgb, var(--surface) 45%, transparent);
    border-radius: 0 8px 8px 0;
    margin: 8px 0;
    padding: 4px 0 6px 12px;
  }
  /* The body's own right inset — the chip itself keeps `padding-right: 0` so a
     diff's coloured bands can run the full width of the box (see pre.diff). */
  .toolchip .chip-body { padding-right: 10px; }
  /* One clipped line, always: the summary is a control, and a wrapped 40-line
     command would make the row taller than the body it hides. The clip stays on
     the summary itself as the backstop, and the summary itself is NOT the flex
     container — `display: flex` there takes the disclosure triangle with it,
     since the marker only exists on a `display: list-item` box. The marker also
     stays INSIDE (the default), which is what keeps it in the same line box, and
     right beside the tool name, as the row it opens: moved outside it is painted
     left of the summary's border box, a marker's width away from the row, and
     `overflow: hidden` on a list item clips an outside marker away entirely.
     `text-overflow` is deliberately NOT set here: the row below is an atomic
     inline, which an ellipsis cannot clip INTO — it would drop the entire row and
     draw a lone "…" in its place. Each half of the row ellipsizes itself. */
  .toolchip > summary {
    cursor: pointer;
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
    transition: color .12s ease-out;
  }
  .toolchip > summary:hover { color: var(--fg); }
  /* The row inside the summary is a flex line, because its halves do not clip
     the same way. A command reads left-to-right and can lose its tail; a PATH's
     tail is its filename, which is the whole reason the row carries a path —
     clipped from the right ("/Users/…/claude-template…") the row names no file at
     all. Flex is what gives the path half a width to ellipsize against: as the
     one shrinkable item it gets exactly the space the fixed halves (name, counts)
     leave over, and clips inside itself. INLINE-flex, so it shares the summary's
     first line box with the disclosure marker instead of pushing it onto a line
     of its own (a block child of a `list-style-position: inside` list item takes
     the whole first line and leaves the marker stranded above the row) — and
     the marker's room is 1.2em of it, taken TWICE, once for each way this row
     gets measured:
       * `max-width` for a chip in a constrained column — an inline-level
         shrink-to-fit box is sized against the whole containing block, the marker
         beside it not subtracted, so without the cap the row comes out one marker
         too wide and the tail of the path falls outside the clip;
       * `margin-right` for a chip whose container is itself shrink-to-fit (a
         turn's body is), where 100% IS this row's own content: the cap alone
         would then shave 1.2em off a row that had all the room in the world and
         clip a short path for no reason. A margin is counted into the width the
         container asks for, so it buys back exactly what the cap takes.
     What overflows in the first case is the empty margin, never the text. */
  .toolchip > summary > .chip-row {
    display: inline-flex;
    align-items: baseline;
    max-width: calc(100% - 1.2em);
    margin-right: 1.2em;
    min-width: 0;
    overflow: hidden;
  }
  /* Nested flex: .chip-sub keeps owning both halves, so the mono/colour rules
     below stay one declaration, and only the path half may shrink. */
  .toolchip .chip-sub { display: flex; min-width: 0; flex: 0 1 auto; }
  .toolchip .chip-row > .chip-status,
  .toolchip .chip-row > .chip-name { flex: 0 0 auto; }
  /* The lead half ellipsizes on its own (the summary's `text-overflow` cannot
     reach INTO a flex item), which is what a long Bash command needs... */
  .toolchip .chip-sub > .chip-lead {
    flex: 0 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* ...but never when there is a path beside it: flex distributes shrinkage in
     proportion to base size, so a 700px path and a 40px "+12 -3" would BOTH give
     up their share and the counts would come out as "+12 …". With a path present
     the counts are fixed and the path absorbs the whole overflow. */
  .toolchip .chip-sub.has-path > .chip-lead { flex: 0 0 auto; }
  /* The LEFT-clipping half. `direction: rtl` moves the line's end edge — and
     with it the ellipsis — to the left; `text-align: left` keeps a short path
     against the left edge instead of floating it out to the right; and the <bdi>
     inside it (see buildToolChip) isolates the path so its own characters stay in
     logical order — an rtl paragraph would otherwise swing a trailing "/" or the
     multiline clip marker round to the front of the string. */
  .toolchip .chip-sub > .chip-path {
    flex: 0 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    direction: rtl;
    text-align: left;
  }
  /* The gap the halves used to get from the "  " in the summary string — on the
     LEAD, and only when there is one: a Read has no lead at all, and a margin on
     the path would then double the space after the tool name. */
  .toolchip .chip-sub > .chip-lead:not(:empty) { margin-right: 6px; }
  /* The status slot. `width: 1.1em` on the base holds the column open whether
     or not the glyph is drawn, so every chip's name starts at the same x — an
     ok chip has NO glyph (see TOOL_STATUS_GLYPH: success is the default outcome
     and a wall of ticks is a wall of noise), and only running and error mark
     themselves. The classes are `is-*` prefixed because a bare `error` here
     collided with the page's `.error` card rule (see .turn.error above). */
  .toolchip .chip-status { display: inline-block; width: 1.1em; color: var(--dim); }
  .toolchip .chip-status.is-ok { color: var(--ok); }
  .toolchip .chip-status.is-error { color: var(--error); }
  /* A DRAWN ring, not a spinning glyph: "◜" rotated about the line box's centre
     rather than its own, so it orbited — a quarter-circle swinging around a
     point below itself, which reads as a glitch rather than as progress. This
     is a real 9px circle with one accent arc, rotating about its own centre. */
  .toolchip .chip-status.is-running {
    width: 9px;
    height: 9px;
    margin: 0 4px 0 1px;
    border: 1.5px solid var(--border-strong);
    border-top-color: var(--accent);
    border-radius: 50%;
    display: inline-block;
    vertical-align: -1px;
    animation: chipspin .7s linear infinite;
  }
  @keyframes chipspin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .toolchip .chip-status.is-running { animation: none; }
  }
  /* The tool NAME is a label, not the headline: what the user scans a
     transcript for is the path or the command beside it, and fifteen accent
     names down the left made the accent meaningless. --dim + 600 keeps it
     readable as the row's key without competing with its value. */
  .toolchip .chip-name { color: var(--dim); font-weight: 600; }
  /* The summary's value half — a path, a command, a count — is machine text, so
     it is set in the mono stack the body uses. Same string, same shape, whether
     the chip is open or closed. */
  .toolchip .chip-sub {
    color: var(--dim);
    margin-left: 6px;
    font-family: "SF Mono", Menlo, Monaco, "Cascadia Mono", monospace;
    font-size: 12px;
  }
  .toolchip .chip-label {
    color: var(--dim); font-size: 12px; margin-top: 6px; word-break: break-word;
  }
  /* The full path, WRAPPED — the one place a clipped path is recoverable. The
     summary row keeps the filename (see .chip-path) but a 120-character path
     still loses its middle there, and the middle is where the repo, the worktree
     and the package live. Mono because it is machine text, and `word-break:
     break-word` (inherited above) because a path has no spaces to break at. */
  .toolchip .chip-label.chip-label-path {
    font-family: "SF Mono", Menlo, Monaco, "Cascadia Mono", monospace;
    color: var(--faint);
  }
  /* A flag that changes what the call DID (`replace_all`), as its own badge —
     it used to be parenthetical text glued to a path the summary row already
     showed, which read as part of the filename. */
  .toolchip .chip-flag {
    display: inline-block;
    margin-top: 6px;
    padding: 0 7px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .03em;
    color: var(--dim);
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  /* WRAPPED, not scrolled. A tool's output is a wall of lines of unknown width
     (a stack trace, a `ls -la`, a JSON dump) and a horizontal scrollbar hides
     the end of every one of them behind a gesture nobody makes — the text is
     there but unread. The radius steps down to 8px inside an 8px-rounded chip:
     a 12px child corner inside a smaller parent corner reads as a mistake. */
  .toolchip .chip-body pre {
    margin: 6px 0 2px;
    max-height: 260px;
    overflow: auto;
    border-radius: 8px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  /* A diff is read as BANDS: one span per line, each a block, so the +/- colour
     covers the whole row instead of stopping where the text does (the old
     inline spans left ragged right edges that made a diff look like highlighted
     prose). The pre gives up its side padding and the lines take it back, so a
     band runs the full width of the box. Clipped at 14 lines with a fade at the
     bottom edge — a 400-line Edit must not own the whole viewport, and a hard
     cut with no cue reads as "that was the whole change". */
  .toolchip pre.diff {
    white-space: pre-wrap;
    word-break: break-word;
    padding: 8px 0;
    max-height: calc(14 * 1.55em);   /* CHIP_DIFF_CLIP_LINES, in JS */
  }
  /* The fade is on a CLASS, not on every diff: a mask is painted on the element
     box whether or not there is anything below it, so an unconditional one would
     dissolve the last line of a two-line diff. fillToolChipBody adds `clipped`
     when the diff has more lines than the clip above can show — the only case
     where a hard bottom edge would read as "that was the whole change". */
  .toolchip pre.diff.clipped {
    /* Masks read only the alpha channel, so `black` is not a theme colour —
       named to satisfy the no-hex-outside-palettes gate (test_theme.py). */
    mask-image: linear-gradient(to bottom, black calc(100% - 24px), transparent);
    -webkit-mask-image: linear-gradient(to bottom, black calc(100% - 24px), transparent);
  }
  .toolchip pre.diff > span {
    display: block;
    padding: 0 12px;
    min-height: 1.55em;
  }
  .diff-add { color: var(--diff-add-fg); background: var(--diff-add-bg); }
  .diff-del { color: var(--diff-del-fg); background: var(--diff-del-bg); }
  /* Pinned while the pre scrolls: absolutely positioned inside a scroll
     container, the copy button is positioned against the CONTENT, so it slid
     out of the frame the moment a long output was scrolled — the affordance
     vanished exactly when the block was big enough to want it. So the STICKY box
     is this zero-height wrapper (attachCodeCopy puts it first in flow, which is
     where a sticky box has to start to be held at the top of a scrollport), and
     the button is absolutely positioned inside it — see .copywrap for why the
     button itself is not the sticky one. */
  .assistant .toolchip .chip-body pre .copywrap,
  .perm .toolchip .chip-body pre .copywrap {
    position: sticky;
    top: 0;
    z-index: 1;
  }
  /* ...and the wrapper reserves NO space. The button used to be `float: right`
     itself, which shortens the first line box by a button's width whether or not
     the button is drawn — with `opacity: 0` the payload's first line was simply
     60px narrower than every line under it, permanently, for a control nobody
     could see. A `height: 0` block generates no line box and no float intrusion,
     so the payload starts at the pre's own padding edge; `overflow: visible` lets
     the button paint outside it; and being the sticky (i.e. positioned) box makes
     it the containing block the absolute button resolves against. The button is
     not the sticky box because a sticky box is confined to its containing block:
     inside a zero-height float it would have nowhere to travel and would scroll
     away with the content, which is the bug this whole seam exists to fix. */
  .assistant pre .copywrap,
  .perm pre .copywrap { display: block; height: 0; overflow: visible; }
  /* The diff's per-line band rule would otherwise give the wrapper a line's
     worth of height and a line's padding — it is a `> span` like the lines are. */
  .toolchip pre.diff > span.copywrap { min-height: 0; padding: 0; }
  .toolchip .chip-todo { font-size: 13px; }
  .toolchip .chip-todo.done { color: var(--dim); text-decoration: line-through; }
  /* A plan, in the chip that RECORDS it (the card is the live surface; on a
     restored transcript the card is gone and this is the only copy). Prose, so it
     borrows the plan card's own typography — `.plan-body`'s rules are unscoped
     for exactly this reason — and only the card's box furniture is left behind. */
  .toolchip .chip-plan { font-size: 13px; margin-top: 6px; }
  .toolchip .chip-plan > :first-child { margin-top: 0; }
  .toolchip .chip-plan > :last-child { margin-bottom: 0; }
  /* A question and its options, as the transcript record of what was asked. The
     option rows keep their leading spaces (`pre-wrap`) because the indent is what
     makes them read as options OF the question above them, and every string here
     is model-authored text put in through textContent — never markdown. */
  .toolchip .chip-ask-q { font-size: 13px; margin-top: 10px; word-break: break-word; }
  .toolchip .chip-ask-o {
    margin-top: 2px;
    color: var(--dim);
    font-size: 12px;
    font-family: "SF Mono", Menlo, Monaco, "Cascadia Mono", monospace;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .toolchip .chip-img {
    display: block; max-width: 100%; border-radius: 8px; margin-top: 6px;
  }
  .thinking > summary {
    cursor: pointer; color: var(--faint); font-size: 12px; font-style: italic;
    transition: color .12s ease-out;
  }
  .thinking > summary:hover { color: var(--dim); }
  .thinking .thinking-body {
    color: var(--dim);
    border-left: 2px solid var(--border-strong);
    padding-left: 10px;
    margin-top: 4px;
  }
  /* Opening a chip or a thinking block reveals its body in one short beat, so
     the eye follows what appeared instead of re-finding it after a jump.
     Opacity + 2px of travel only (no height animation: <details> has no
     animatable open height, and faking one janks a 400ms-repainting transcript),
     inside the reduced-motion guard — with motion off the body simply appears,
     which is the same information without the movement. */
  @media (prefers-reduced-motion: no-preference) {
    .toolchip[open] > .chip-body,
    .thinking[open] > .thinking-body { animation: reveal .14s ease-out; }
  }
  @keyframes reveal {
    from { opacity: 0; transform: translateY(2px); }
    to { opacity: 1; transform: none; }
  }

  /* ── composer (shared by home + chat) ── */
  .composer {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 12px 14px 10px;
    box-shadow: 0 6px 24px var(--shadow);
    transition: border-color .15s;
  }
  .composer:focus-within { border-color: var(--border-strong); }
  .composer textarea {
    width: 100%;
    background: transparent;
    border: 0;
    outline: none;
    resize: none;
    color: var(--fg);
    font: inherit;
    font-size: 14px;
    line-height: 1.5;
    max-height: 200px;
    padding: 2px 2px 6px;
  }
  .composer textarea::placeholder { color: var(--faint); }
  .composer-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .composer-row .spacer { flex: 1; }
  /* ── the control row's two degradations, stamped by fitComposerRow ──
     The row is five controls and a column floor of 380px (the sidebar's MIN_W,
     explorer/lib/side-width.ts), and at that width the full-length approvals
     label was enough to tip it over: screenshotted live it broke into a ragged
     wrap with one pill stranded per line, which reads as broken rather than as
     adapted (Akshil, 2026-08-20: "nor do I see the change in UI to show or hide
     things"). `flex-wrap: wrap` above is still the last resort and stays — what
     these two classes do is spend the width DELIBERATELY before the browser has
     to guess, in the order a reader would: shorten the one long word first, and
     only then split the row, and split it where its own grammar already splits
     (the three selects that describe the run / the things you DO with a draft).

     Measured, never a breakpoint: fitComposerRow sums the row's own content
     against its box, which is the same discipline annFitStrip uses one pane over
     — a fixed width would have to guess at three select labels whose text the
     user changes.

     `.compact` carries no declarations on purpose. What it shortens is option
     TEXT, which is DOM content and not something a stylesheet can rewrite (see
     PERMISSION_SHORT); the class is still written onto the row so the state is
     visible in the inspector and readable from the outside. */
  /* Two tidy lines, never a ragged wrap. The spacer — the row's one elastic cell
     while everything fits — becomes the LINE BREAK, which is the only way a flex
     row can be told where to fold.

     `width: 100%` and NOT `flex-basis: 100%`, measured in the browser this
     template actually ships inside (WKWebView): a percentage basis on this span
     was ignored outright and the row went on wrapping wherever it liked, which is
     the bug this class exists to prevent. A width with `flex: 0 0 auto` resolves
     the basis the long way round and folds the line every time.

     The break's own height is 0, so the two lines sit the row's gap apart TWICE
     — 12px, because an empty flex line takes a gap above and below it. That is
     the deliberate answer rather than the tidier 6px: `row-gap: 0` on this row
     does not take in the same engine (an inline `row-gap` loses to the `gap`
     shorthand above), and 12px between "what the run is" and "what to do with
     the draft" reads as the grouping it is. Every gap WITHIN a line is still 6. */
  /* Stage 3, and the one that keeps the ROW WHOLE: everything stays on one line
     and the chrome gets denser instead — gaps to 3px, pill insets trimmed, the
     select carets pulled in. Folding was tried as stage 3 and rejected on sight
     (Akshil, 2026-08-20: "the chat icons and dropdown are not in single line") —
     a fold moves controls to a place they never sit at any other width, and a
     denser line keeps every control exactly where the reader's hand knows it.
     fitComposerRow re-runs fitSelect after stamping this, because the fitted
     widths bake the paddings in. */
  .composer-row.tight { gap: 3px; }
  .composer-row.tight .pill { padding-left: 5px; padding-right: 5px; }
  .composer-row.tight select.pill { padding-right: 17px; background-position: right 5px center; }
  .composer-row.stack .spacer { flex: 0 0 auto; width: 100%; height: 0; }
  /* Line two stays flush RIGHT, where these controls sit in the wide layout, so
     folding the row never teleports Send across the composer. `.lead2` is written
     by fitComposerRow onto the first control that actually lands on line two:
     `.viewshot` is [hidden] in the narrow layout and when there is no pane at
     all, so the anchor cannot be named in the stylesheet. `.send` gives up its
     own `margin-left: auto` here (two autos on one line split the slack and
     centre the group instead of pinning it), and the `.lead2` rule follows it so
     it wins on source order for the case where Send IS that first control. */
  .composer-row.stack .send { margin-left: 0; }
  .composer-row.stack .lead2 { margin-left: auto; }
  .pill {
    background-color: transparent;
    border: 1px solid transparent;
    border-radius: 999px;
    color: var(--dim);
    font: inherit;
    font-size: 12px;
    padding: 3px 8px;
    cursor: pointer;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    transition: background-color .12s, color .12s, filter .12s;
  }
  /* Select pills only (not pressable button pills): a caret so they read as
     dropdowns at rest, and a JS-fitted width (see fitSelect) because an
     appearance:none select otherwise sizes to its WIDEST option — "fable"
     rendered inside a "sonnet"-wide pill, leaving dead space that made the
     row's gaps look uneven. background-color (not the background shorthand)
     everywhere on pills, or the hover repaint erases this caret. */
  select.pill {
    background-image: var(--pill-caret);
    background-repeat: no-repeat;
    background-position: right 9px center;
    background-size: 8px 8px;
    padding-right: 22px;
    text-align: left;
  }
  /* outline:none above kills the UA focus ring; keyboard users still need a
     receipt, mouse users still shouldn't get one on click. */
  .pill:focus-visible {
    border-color: var(--border-strong);
    background-color: var(--surface-2);
    color: var(--fg);
  }
  /* THE ONE RULE about hover and an active state, shared with #annbtn in the left
     pane's banner: a neutral hover never applies to a control that is switched on,
     and an on control hovers WITHIN its accent.
     Spelled out in the selectors on purpose, and kept after the pane-shot pill
     that motivated it was deleted: `.pill:hover` and a pill's own
     `[aria-pressed="true"]` rule are both specificity (0,2,0), so a plain
     `.pill:hover` wins on source order alone and repaints an ARMED pill neutral —
     the "this is on" receipt disappearing under the cursor at exactly the moment
     the user is deciding whether to click. Relying on rule order for that is one
     reshuffle away from the bug coming back, and the next pressable pill in this
     row inherits the fix rather than rediscovering it.

     `:not(:disabled)` for the second half of the same argument. A dimmed pill that
     still lights up under the cursor is a control saying two things at once, and
     the reader believes the one that moves — this row now has a pill that goes dead
     for as long as a scheduled message is pending (.schedbtn), so the exclusion is
     spelled here rather than fought locally: at (0,2,0) a `.schedbtn:disabled`
     override would lose to this rule on source order, which is the bug above with
     the roles swapped. It is also the idiom the rest of this file already uses
     (.stop, .perm button, .sb-acts button all hover `:not(:disabled)`). */
  .pill:hover:not([aria-pressed="true"]):not(:disabled) { background-color: var(--surface-2); color: var(--fg); }
  .pill[aria-pressed="true"]:hover { filter: brightness(1.1); }
  /* Still styled, because the native popup is only SUPPRESSED for the pointer
     (openSelPop): a keyboard user who presses Space still gets the platform
     menu, and it should not arrive white. */
  .pill option { background: var(--bg); color: var(--fg); }
  /* The pills' own dropdown (openSelPop), replacing the OS popup — the one piece
     of this composer the template could not skin, arriving light and rounded in
     the middle of a dark row. Drawn as the THIRD popup in this file, not as a
     fourth idea: same box as #leftmodepop and #kebabpop (panel, --border-strong,
     10px, one shadow) so the menus in this template are one family, with the
     shell mode menu's structure inside — a muted heading naming the list, then
     one row per value, the current one wearing an accent wash.
     `position: fixed` and not absolute: the composer clips (overflow) and sits at
     the very bottom of a pane, so an in-flow popup would be cut off. */
  .selpop {
    position: fixed;
    z-index: 40;
    padding: 4px;
    background: var(--panel);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    box-shadow: 0 6px 24px var(--shadow);
  }
  /* Same story as #leftmodepop: `position: fixed` outranks the UA's [hidden]. */
  .selpop[hidden] { display: none; }
  /* Names what the list IS (the select's optgroup label), which the pill itself
     cannot say — it only ever shows the current value. Not a row: no hover, no
     pointer, nothing to aim at. */
  .selpop-head {
    padding: 4px 9px 6px;
    font-size: 11px;
    line-height: 1;
    color: var(--faint);
    letter-spacing: .02em;
    user-select: none;
  }
  .selpop-opt {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 7px 9px;
    font: inherit;
    font-size: 12px;
    line-height: 1;
    white-space: nowrap;
    border: 0;
    border-radius: 7px;
    background: none;
    color: var(--fg);
    cursor: pointer;
    text-align: left;
  }
  .selpop-opt:hover, .selpop-opt:focus-visible { background: var(--surface-2); }
  /* THE ONE RULE about hover and an active state again (see .pill): the selected
     row hovers WITHIN its wash instead of being repainted neutral by it. The
     wash alone carries the state — no tick glyph — and the ink stays --fg:
     --accent is a fill here, never text on its own tint. */
  .selpop-opt.on { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .selpop-opt.on:hover { background: color-mix(in srgb, var(--accent) 26%, transparent); }
  /* ── the Schedule button's confirm, over the composer ──
     The FOURTH popup in this file and deliberately the same box as the other
     three (#leftmodepop, #kebabpop, .selpop): panel, --border-strong, 10px, one
     shadow. A menu and a confirm ask different questions, but a reader should
     not have to learn a second surface to answer one of them.
     There IS a confirm because the click LEAVES: it replaces the chat with the
     Schedule page, carrying whatever is half-typed in the box with it, and that
     is not something to do on a pointer that missed Send by 34px. It also says
     what travels, which is the part a user cannot see from the icon.
     `position: fixed` for .selpop's reason — the composer clips (overflow) and
     sits at the very bottom of a pane, so an in-flow popup would be cut off. */
  .schedpop {
    position: fixed;
    z-index: 40;
    width: 260px;
    padding: 12px;
    background: var(--panel);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    box-shadow: 0 6px 24px var(--shadow);
  }
  /* Same story as .selpop: a `display` of our own outranks the UA's [hidden]. */
  .schedpop[hidden] { display: none; }
  .schedpop-title { font-size: 13px; line-height: 1.4; color: var(--fg-strong); }
  /* The one line the icon cannot say: this hop is not a dead end, the draft and
     the folder go with it. Muted, because it is a receipt and not a control. */
  .schedpop-sub { margin-top: 3px; font-size: 11.5px; line-height: 1.45; color: var(--faint); }
  .schedpop-row { display: flex; justify-content: flex-end; gap: 6px; margin-top: 10px; }
  .schedpop-btn {
    background-color: transparent;
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    color: var(--dim);
    font: inherit;
    font-size: 12px;
    line-height: 1;
    padding: 5px 11px;
    cursor: pointer;
    transition: background-color .12s, color .12s, filter .12s;
  }
  .schedpop-btn:hover { background-color: var(--surface-2); color: var(--fg); }
  /* The one filled thing in this box, for the same reason .send is the one filled
     thing in the composer: exactly one control here commits, and it is the one
     that navigates. */
  .schedpop-btn.go {
    background: var(--accent);
    border-color: transparent;
    color: var(--on-accent);
  }
  .schedpop-btn.go:hover { background: var(--accent); color: var(--on-accent); filter: brightness(1.1); }
  .send {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: var(--on-accent);
    border: 0;
    border-radius: 50%;
    padding: 0;
    cursor: pointer;
    flex-shrink: 0;
    /* Redundant while the spacer is on the same line; keeps the button pinned
       right when a narrow pane wraps it onto its own line. */
    margin-left: auto;
    transition: filter .12s, transform .12s, opacity .12s;
  }
  .send:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .send:active { transform: none; }
  /* While a run is live the send buttons become stop buttons: the arrow hides and
     a stop square shows. Clicking then kills the run (same as Escape). */
  .send .ic-stop { display: none; }
  body.running .send .ic-send { display: none; }
  body.running .send .ic-stop { display: block; }

  /* The chat composer's <form> is a WRAPPER, not a box: #composer-chat is what
     has to be #chat's flex child (so it sits under #logwrap and shrinks to its
     content), and a form box in between would break that. `display: contents`
     removes the form from layout while keeping it in the DOM, which is what makes
     one <form> able to wrap the whole composer and still let the flex column see
     through it.
     IT LIVES HERE, IN THE STYLESHEET, AND MAY NEVER GO BACK ON THE ELEMENT. As a
     `style="display:contents"` attribute it outranked every stylesheet rule short
     of the CSS force flag (`important`) — which is forbidden in this file (D146) — so the
     narrow layout's `body.view-preview #chat > *:not(#anntools) { display: none }`
     could not collapse it. In Preview view #composer-chat was promoted into
     #chat's flex layout under the #anntools strip and the whole composer
     (textarea, three selects, the send button) rendered there,
     eating ~105px of the height the preview was supposed to get. As a rule it is
     plain specificity (0,1,0,0) against the media block's (0,2,1,1), so the collapse
     wins. tests/test_claude_narrow.py forbids an inline `display` anywhere in the
     column for exactly this reason. */
  #inputbox { display: contents; }

  #composer-chat {
    flex-shrink: 0;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    padding: 8px 20px 6px;
  }
  /* The live artifacts strip: a page Claude publishes DURING a turn, announced
     while the turn is still going. It sits under the composer rather than in the
     transcript because it is not part of what was said — the transcript's own
     record of a publish is a tool chip that scrolls away, and the thing the user
     wants afterwards ("open the page you just made") must not scroll with it.
     A chip row, not the landing page's stacked rows: this is an accumulating
     count of small identical things beside a live conversation, which is the
     same job .annchips does two elements up, so it takes that shape.
     `hidden` rather than an inline `display`, because a child of #chat may not
     carry an inline display — see the #inputbox rule (D146, and
     tests/test_claude_narrow.py pins it). The [hidden] rule below is needed for
     the same reason .annchips-style flex boxes need one: `display: flex`
     outranks the UA's `[hidden]`. */
  #artstrip {
    flex-shrink: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    padding: 2px 24px 6px;
  }
  #artstrip[hidden] { display: none; }
  #chat.home #artstrip { display: none; }
  .art-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    max-width: 220px;
    padding: 3px 9px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    color: var(--fg);
    font-size: 11.5px;
    text-decoration: none;
  }
  .art-chip:hover { border-color: var(--accent); color: var(--accent); }
  .art-chip .art-chip-lbl { overflow: hidden; text-overflow: ellipsis;
                            white-space: nowrap; }
  .art-chip .art-chip-go { color: var(--faint); flex-shrink: 0; }
  .art-chip:hover .art-chip-go { color: var(--accent); }

  #footnote {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px 10px;
    text-align: center;
    color: var(--faint);
    font-size: 11px;
    /* Spelled rather than inherited (body is 1.65) for two reasons: two lines of
       11px prose under a composer wants less air than a paragraph does, and
       fitFootnote below measures this box in LINES — an explicit value is the one
       it can divide by without asking the UA what a footnote's line is. */
    line-height: 1.5;
  }
  /* TWO LINES IS THE WHOLE BUDGET. In a 380px column the sentence pair ran to
     three, which under a composer is no longer a footnote — it is a paragraph
     competing with the thing it annotates. The second sentence goes instead of
     the first being ellipsised: half a sentence with a "…" on it says the app
     ran out of room, while one whole sentence says what it says. Which one is
     kept is not a coin toss either — "Claude can read and edit files here" is
     the reach, the part a reader needs before they type; approvals are named by
     the pill two rows up, which is where that sentence was pointing anyway.
     `.fn-more` is written by setTargetNoun (the only place this text lives) and
     the class is decided by measurement, not by a width. */
  #footnote.tight .fn-more { display: none; }
  #chat.home #footnote { display: none; }

  /* ── markdown, in the TWO places rendered markdown lands ──
     `.assistant` (a reply) and `.plan-body` (a plan card's body, which
     buildPlanCard runs through the same renderMd funnel — D248). Every rule
     below is dualled for the same reason the hljs and .copybtn overrides above
     are: an `.assistant`-only markdown rule left a plan's headings, lists,
     tables and inline code completely unstyled — UA defaults (a 2em h1, 40px
     list indents, borderless tables) inside a card that is otherwise 13px
     prose. `pre`/`pre code.hljs`/`.copybtn` are NOT dualled here on purpose:
     `.perm pre` already boxes a plan's code blocks, and a second `.plan-body
     pre` rule of equal specificity would be a source-order coin flip. */
  .assistant b, .assistant strong,
  .plan-body b, .plan-body strong { color: var(--fg-strong); font-weight: 600; }
  .assistant em, .plan-body em { font-style: italic; }
  .assistant code,
  .plan-body code {
    background: var(--code-bg);
    color: var(--code-fg);
    border-radius: 5px;
    padding: 1px 5px;
    font-size: 13px;
  }
  .assistant pre {
    position: relative;  /* anchors .copybtn, top-right */
    background: var(--pre-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    margin: 8px 0;
    overflow-x: auto;
    white-space: pre;
    font-size: 13px;
    line-height: 1.55;
  }
  .assistant pre code, .plan-body pre code {
    background: transparent; color: var(--pre-fg); padding: 0;
  }
  /* vendor/hljs.css ships its own `pre code.hljs{padding:1em;overflow-x:auto}`
     (unmodified github/github-dark rules) — its <link> lands after this
     inline <style> at runtime and would otherwise win the cascade over the
     padding:0 above, stacking an extra 1em of padding AND nesting a second
     horizontal scrollbar inside this pre's own overflow-x:auto. Needs two
     overrides per scope, not one: the dark/default vendor rule is bare `pre
     code.hljs` (1 class' worth of specificity: .assistant+.hljs, or
     .perm+.hljs, beats it), but the light-theme vendor rule is
     `:root[data-theme="light"] pre code.hljs` — :root + [data-theme="light"]
     + .hljs is 3 classes' worth, which the bare override does NOT beat (2 < 3,
     so on light theme the vendor rule still wins and the bug reproduces
     there). The light rules below match that scope one class richer
     (:root[data-theme="light"] + .assistant|.perm + .hljs = 4), so they
     provably outrank it on specificity alone — no dependence on which
     stylesheet the browser loads/parses later.

     BOTH scopes, because a code block reaches the page through two funnels:
     the assistant transcript, and `buildPlanCard`, which renders `input.plan`
     through the same renderMd + attachCodeCopy pair inside a `.perm` card
     (D248). An `.assistant`-only override left a plan's code blocks with the
     vendor padding unopposed — the exact bug this comment describes,
     reintroduced one call site over. */
  .assistant pre code.hljs,
  .perm pre code.hljs { padding: 0; overflow-x: visible; }
  :root[data-theme="light"] .assistant pre code.hljs,
  :root[data-theme="light"] .perm pre code.hljs { padding: 0; overflow-x: visible; }
  /* Copy button: hidden until the pre is hovered (or focused, keyboard-only
     users get no hover) — a permanently-visible button on every code block
     is noise the eye has to filter on every single message. Scoped to both
     funnels for the same reason as the hljs overrides above: attachCodeCopy
     runs on a plan card too, and an unscoped `.copybtn` there is an unstyled
     inline `copy` word shoved into the middle of the plan's prose. Both
     `.assistant pre` and `.perm pre` set `position: relative`, which is what
     the `position: absolute` here is anchored to. */
  .assistant pre .copybtn,
  .perm pre .copybtn {
    position: absolute;
    top: 6px;
    right: 6px;
    opacity: 0;
    transition: opacity .12s;
    font: inherit;
    font-size: 11px;
    padding: 3px 9px;
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    background: var(--surface);
    color: var(--dim);
    cursor: pointer;
  }
  .assistant pre:hover .copybtn,
  .assistant pre .copybtn:focus-visible,
  .perm pre:hover .copybtn,
  .perm pre .copybtn:focus-visible { opacity: 1; }
  .assistant pre .copybtn:hover,
  .perm pre .copybtn:hover { color: var(--fg); border-color: var(--faint); }
  /* GFM tables (marked) — borders only, the assistant column is narrow
     enough that anything fancier just fights word-break. Full width, because a
     shrink-to-fit table in a prose column reads as a floating fragment, and
     roomier cells: 4px of vertical padding put the rows closer together than
     the text inside them was tall. */
  .assistant table,
  .plan-body table {
    border-collapse: collapse;
    margin: 8px 0;
    font-size: 13px;
    width: 100%;
  }
  .assistant th, .assistant td,
  .plan-body th, .plan-body td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: left;
  }
  .assistant th, .plan-body th { color: var(--fg-strong); background: var(--surface); }
  /* marked emits real h1-h4/ul/ol/li/blockquote now — the old renderMd's
     hand-rolled `.h`/`.bullet` span markup (and this CSS's old targets of
     the same names) is gone with it.
     A LADDER, not one size four times over: every heading was 15px/600, so a
     reply's h1 and its h3 were the same object and the document had no
     structure to skim — the only cue left was the text itself. Four steps,
     each a clear notch apart at this reading size, with h4 dropping to --dim
     because by the fourth level the useful signal is "this is a sub-label",
     not "look here". */
  .assistant h1, .plan-body h1 {
    color: var(--fg-strong); font-weight: 600; font-size: 17px;
    letter-spacing: -.01em; margin: 18px 0 6px;
  }
  .assistant h2, .plan-body h2 {
    color: var(--fg-strong); font-weight: 600; font-size: 15.5px; margin: 18px 0 6px;
  }
  .assistant h3, .plan-body h3 {
    color: var(--fg-strong); font-weight: 600; font-size: 14px; margin: 18px 0 6px;
  }
  .assistant h4, .plan-body h4 {
    color: var(--dim); font-weight: 600; font-size: 13px; margin: 18px 0 6px;
  }
  /* Every paragraph marked emits is a real <p>, whose UA default margin is 1em
     — too much in a column this narrow, while the old 6px was too little for
     the heading ladder above to breathe against. Zeroed at the two ends of a
     body so a reply does not float inside its own bubble (the same rule `.perm
     .plan-body` already applies to itself), and zeroed for whatever element
     comes first — a turn that opens on a heading was starting 18px down. */
  .assistant p, .plan-body p { margin: 12px 0; }
  .assistant .body > :first-child, .seg-text > :first-child { margin-top: 0; }
  .assistant .body > p:last-child, .seg-text > p:last-child { margin-bottom: 0; }
  .assistant ul, .assistant ol,
  .plan-body ul, .plan-body ol { margin: 8px 0; padding-left: 22px; }
  .assistant li, .plan-body li { margin: 2px 0; }
  /* The bullets are punctuation, not content: in the accent they were fifteen
     orange dots pulling the eye down the left margin of every list. */
  .assistant li::marker, .plan-body li::marker { color: var(--faint); }
  .assistant blockquote,
  .plan-body blockquote {
    margin: 8px 0; padding: 2px 0 2px 12px;
    border-left: 3px solid var(--border-strong);
    color: var(--dim);
  }
  .assistant a, .plan-body a { color: var(--link); text-decoration: none; }
  .assistant a:hover, .plan-body a:hover { text-decoration: underline; }
  .cursor { color: var(--accent); animation: blink 1s step-end infinite; }
  @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

  /* ── home view ── */
  #home {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 14vh;
  }
  /* The bottom breathing room belongs to the COLUMN, not to each section: every
     landing section used to end in its own `padding-bottom: 32px`, which only
     the last one needed and which added itself to the next one's `margin-top`
     for a 60px gutter between blocks that read as three unrelated screens
     stacked. One 32px here, one margin per block below. */
  #home .inner { width: 100%; max-width: 620px; padding: 0 24px 32px; }
  .home-title {
    /* 26px IS the title, and it stays the title wherever there is room for one.
       Where there is not — this column's floor is 380px and a folder name is
       arbitrarily long — fitHomeTitle stamps one of the two steps below, so the
       name shrinks to its ONE line instead of becoming a 26px two-line headline
       that outweighs the composer it is introducing (the landing page's actual
       subject). Measured, and deliberately not a container query — this template
       detects collisions and declares no breakpoints, a rule
       tests/test_claude_annotation_modes.py enforces over the whole file — and
       the thing worth measuring is whether THIS name fits, not how wide the
       column is.
       `anywhere` for the case past the last step: these names are paths and
       slugs with no spaces in them, and without it one unbroken name overflows
       the column instead of wrapping inside it. */
    font-size: 26px;
    overflow-wrap: anywhere;
    font-weight: 600;
    letter-spacing: -.02em;
    color: var(--fg-strong);
    text-align: center;
    margin-bottom: 4px;
  }
  /* TWO STEPS AND A CLASS, not a computed pixel size written inline. The size is
     declared here for the reason every other verdict in this file is (D146, the
     narrow layout's collapse, #inputbox): a stylesheet declaration can be
     overridden by a later rule and reasoned about in the inspector, and the sizes
     a headline is allowed to take are a design decision that belongs where the
     rest of the type scale is — fitHomeTitle only decides WHICH.
     Two steps and not a continuum because a headline has a small number of sizes
     it can be and still look chosen: 21px is a title in a 380px column, 17px is
     the last size that still reads as a heading rather than as body text. Past
     that the name wraps at 17px, which is the honest end. */
  .home-title.t-mid { font-size: 21px; }
  .home-title.t-min { font-size: 17px; }
  .home-title .spark { color: var(--accent); margin-right: 10px; font-weight: 400; }
  .home-sub {
    color: var(--faint);
    font-size: 12.5px;
    text-align: center;
    margin-bottom: 28px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* ONE block for the two cross-session lists — past chats and published
     artifacts — because they are two answers to the same question ("what has
     happened here before?") and stacking them cost the landing page two
     headings, two 60px gutters and an artifacts section pushed so far down it
     was below the fold on a short pane. Where there is something in both, the
     block wears a TAB BAR and shows one list at a time; where only one of them
     exists it is just that list under its own heading, exactly as before, since
     a tab bar with one tab is a label pretending to be a control. */
  #lists { margin-top: 28px; }
  #listtabs {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 8px;
    padding: 0 4px;
  }
  /* `display: flex` outranks the UA's `[hidden]` rule. */
  #listtabs[hidden] { display: none; }
  /* The tabs ARE the section headings — same 11px uppercase letter-spaced
     micro-type as every other label on this page (.head below), so switching
     lists never changes the shape of the screen. The only thing that marks the
     active one is ink plus a hairline under it; a pair of pills here would be
     the loudest object on a landing page whose subject is the composer. */
  .list-tab {
    font: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .8px;
    text-transform: uppercase;
    color: var(--faint);
    background: none;
    border: 0;
    border-bottom: 1.5px solid transparent;
    border-radius: 0;
    padding: 0 0 4px;
    cursor: pointer;
    white-space: nowrap;
  }
  .list-tab:hover { color: var(--fg); }
  .list-tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
  .list-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .list-tab .tab-count { font-weight: 400; letter-spacing: 0; }
  /* Tabbed: the bar names both lists, so the per-list headings would say the
     active tab's label twice. */
  #lists.tabbed #recent .head, #lists.tabbed #artifacts .head { display: none; }
  #recent .head {
    color: var(--faint);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .8px;
    text-transform: uppercase;
    margin-bottom: 8px;
    padding: 0 4px;
  }
  /* Claude snapshots (SPEC §34). Same visual family as .chat-row — this is
     another "list of past things about this target" on the same landing page —
     and like those rows it is pressable: a row expands to its diff and the one
     action that goes back to it. The SECTION is not pressable: it is a quiet
     static label over that stack, exactly as #recent is, because the list is
     painted on arrival rather than hidden behind a control. */
  #snaps { margin-top: 28px; padding-bottom: 32px; }
  #snaps .head {
    color: var(--faint);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .8px;
    text-transform: uppercase;
    margin-bottom: 8px;
    padding: 0 4px;
  }
  /* THE HEADING IS A LABEL, and there is no control on this line at all.
     Two revisions were spent on the wrong element: first the heading itself was
     the toggle (11px uppercase letter-spaced micro-type stretched across a
     full-width bordered pill reads as neither a heading nor a button — "the
     claude snapshots toggle thing UI is very ugly"), then a placeholder .snap-row
     stood in for the section with a "hide" beside the label. Both existed to
     defer a read that no longer needs deferring: an unenriched, undiffed timeline
     is ~6 ms, so the list is simply there, and the cheapest control is the one
     that does not have to exist. The heading keeps its flex box for the retry
     the failure path puts on this line. */
  #snapshead { display: flex; align-items: center; gap: 8px; }
  /* Only ever present after a failed read — the note says what went wrong and
     this is the way to ask again. Normal case, so it reads as a control beside
     the label rather than as part of its type. */
  #snapsretry {
    margin-left: auto;
    font: inherit;
    font-size: 11.5px;
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
    color: var(--faint);
    background: none;
    border: 0;
    border-radius: 6px;
    padding: 2px 6px;
    cursor: pointer;
  }
  #snapsretry:hover { color: var(--fg); }
  /* ONE RUN of checkpoints from one chat. The rule down the left is the whole
     point of the box: it says "these numbers belong together", which is what
     makes a v2 under one heading and a v2 under another stop reading as the same
     row twice. Indented past the rule rather than boxed, so the rows keep their
     full width in a narrow pane. */
  .snap-runbox {
    border-left: 1px solid var(--border);
    padding-left: 10px;
    margin-bottom: 14px;
  }
  .snap-runbox:last-child { margin-bottom: 0; }
  /* Not the section's uppercase micro-type: that type is reserved for the ONE
     heading of the panel ("Claude snapshots"), and a second tier wearing it would
     compete with it. This is normal-case text at row scale, one step quieter. */
  .snap-run {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 0 4px 5px;
    font-size: 11.5px;
  }
  /* The chat's own words, so it can be long: it takes the space and ellipsises
     rather than pushing the count off the row. */
  .snap-run-name {
    color: var(--fg);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .snap-run-sub { color: var(--faint); flex-shrink: 0; margin-left: auto; }
  .snap-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 6px;
    font-size: 12.5px;
  }
  /* The dot answers exactly ONE question — where is disk right now — rather
     than competing with a second marker for the same column. */
  .snap-row .snap-dot { color: var(--faint); flex-shrink: 0; font-size: 10px; }
  .snap-row.here { border-color: var(--border-strong); }
  .snap-row.here .snap-dot { color: var(--accent); }
  .snap-row .snap-v { color: var(--fg); flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .snap-row .snap-when { color: var(--faint); flex: 1; overflow: hidden;
                         text-overflow: ellipsis; white-space: nowrap; }
  .snap-row .snap-d { color: var(--faint); flex-shrink: 0; }
  .snap-row .snap-plus { color: var(--accent); }
  .snap-row .snap-minus { color: var(--faint); }
  .snap-row .snap-caret { color: var(--faint); font-size: 9px; flex-shrink: 0; }
  .snap-row { cursor: pointer; }
  .snap-row:hover { background: var(--surface); }
  .snap-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* An open row and its body are one box: the expansion is part of the row it
     belongs to, not a panel floating under the list. */
  .snap-item { margin-bottom: 6px; }
  .snap-item .snap-row { margin-bottom: 0; }
  .snap-row.open { border-bottom-left-radius: 0; border-bottom-right-radius: 0;
                   border-bottom-color: transparent; }
  .snap-body {
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 12px 12px;
    padding: 10px 14px 12px;
    font-size: 12px;
  }
  .snap-row.open + .snap-body { border-color: var(--border-strong); }
  .snap-diff {
    background: var(--pre-bg);
    color: var(--pre-fg);
    border-radius: 8px;
    padding: 8px 10px;
    margin: 0 0 10px;
    max-height: 240px;
    overflow: auto;
    font-size: 11.5px;
    line-height: 1.45;
    white-space: pre;
  }
  .snap-diff .dl-add { color: var(--ok); }
  .snap-diff .dl-del { color: var(--error); }
  .snap-diff .dl-hunk { color: var(--link); }
  .snap-diff .dl-head { color: var(--faint); }
  .snap-act { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .snap-ask { color: var(--fg); }
  .snap-go, .snap-no {
    font: inherit;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--fg);
    cursor: pointer;
  }
  .snap-go { border-color: var(--accent); color: var(--accent); }
  .snap-go:hover, .snap-no:hover { background: var(--surface-2); }
  .snap-note { color: var(--faint); flex-basis: 100%; }
  .snap-err { color: var(--error); }
  #snapsnote { color: var(--faint); font-size: 11.5px; padding: 4px; }

  /* Artifacts: the pages Claude PUBLISHED from this target's working directory.
     Now the SECOND HALF of #lists rather than a third stack of its own, and
     styled as the same thing — the same quiet uppercase label (when it is alone
     and has to carry one) over the same bordered pressable rows as #recent and
     #snaps, because it answers the same shape of question and a fourth visual
     idiom on one screen would only make the other three look accidental.
     ALWAYS EXPANDED: the read is one localhost call made with the landing page,
     so by the time the section exists the rows are already in hand and
     collapsing them would hide what was just paid for. The `hide ▾` that used
     to sit on the head line is GONE — in the tabbed case the tab bar is already
     the control for which list shows (a second one for the same box, in a
     different type system, beside a label that is itself a control), and in the
     single-list case the section is high in a tighter column now, so the thing
     it was protecting — the composer's own history below it — is no longer
     below it. */
  #artifacts { margin-top: 0; }
  #artifacts .head {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--faint);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .8px;
    text-transform: uppercase;
    margin-bottom: 8px;
    padding: 0 4px;
  }
  .art-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 6px;
    font-size: 12.5px;
    cursor: pointer;
    background: transparent;
    transition: background .12s, border-color .12s;
  }
  .art-row:hover { background: var(--surface); border-color: var(--border-strong); }
  .art-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* The favicon, in BOTH places an artifact is drawn (a landing row and a live
     chip) — one rule, because it is one thing: the emoji the author chose, sized
     to sit on the text baseline without stretching the line. */
  .art-ic { flex-shrink: 0; font-size: 13px; line-height: 1; }
  .art-chip .art-ic { font-size: 12px; }
  .art-row .art-title { color: var(--fg); flex: 1; overflow: hidden;
                        text-overflow: ellipsis; white-space: nowrap; }
  .art-row .art-when { color: var(--faint); flex-shrink: 0; }
  /* The hosted-page opener reads as a small BUTTON, not a bare glyph: it is
     the one control on the row that leaves the app (deployed preview), so it
     gets a bordered hit target — globe icon inside. */
  .art-row .art-go { color: var(--faint); flex-shrink: 0; text-decoration: none;
                     display: inline-flex; align-items: center; justify-content: center;
                     width: 24px; height: 24px; border: 1px solid var(--border);
                     border-radius: 6px; }
  .art-row .art-go svg { display: block; }
  .art-row .art-go:hover { color: var(--link); border-color: var(--link); }
  #artifactscount { font-weight: 400; letter-spacing: 0; }

  .chat-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 8px;
    cursor: pointer;
    background: transparent;
    transition: background .12s, border-color .12s;
  }
  .chat-row:hover { background: var(--surface); border-color: var(--border-strong); }
  .chat-row .dot { color: var(--accent); flex-shrink: 0; font-size: 10px; }
  .chat-row .row-title {
    color: var(--fg);
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .chat-row .row-sub { color: var(--faint); font-size: 12px; flex-shrink: 0; }

  /* ── skeleton loading placeholders ── */
  .skel-bar {
    height: 11px;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--surface) 25%, var(--border) 50%, var(--surface) 75%);
    background-size: 200% 100%;
    animation: skel-shimmer 1.2s ease-in-out infinite;
  }
  @keyframes skel-shimmer {
    from { background-position: 200% 0; }
    to { background-position: -200% 0; }
  }
  .skel-turn { margin: 0 0 20px; }
  .skel-turn-user { display: flex; justify-content: flex-end; }
  .skel-turn-user .skel-bar { width: 34%; height: 34px; border-radius: 16px; }
  .skel-turn-assistant { display: flex; gap: 10px; }
  .skel-turn-assistant .skel-dot-a {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--border); flex-shrink: 0;
  }
  .skel-turn-assistant .skel-lines { flex: 1; display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
  .skel-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border: 1px solid var(--border);
    border-radius: 12px; margin-bottom: 8px;
  }
  .skel-row .skel-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--border); flex-shrink: 0;
  }
  .skel-row .skel-bar.title { flex: 1; }
  .skel-row .skel-bar.sub { width: 42px; flex-shrink: 0; }

  /* ── narrow host: one view at a time ──────────────────────────────────────
     Two floors, and the breakpoint follows the HIGHER one. The layout's hard
     floor — where the halves squeeze past their minimums and then overflow — is
     #left's 200px + the 4px divider + #chat's 340px ≈ 544px, and the original
     breakpoint (560px, D236) sat just above it. That turned out to be the wrong
     floor to pick: a split that merely does not overflow is not yet a split
     worth having. The explorer's listing preview pane defaults to HALF its
     split container (about 700px on a 1700px window), so at 560px the split
     engaged in a host far too narrow for it — two cramped columns where one
     readable view was wanted. So the breakpoint is derived from the columns'
     minimum USEFUL widths instead:

         #left   a framed preview that is still a page       420px
                 (the phone-viewport family, rounded up)
       + #divider                                              4px
       + #chat   ~60 characters of transcript prose at the    440px
                 composer's own size (340 above is the
                 squeeze floor, not a target)
       = 864px floor. The breakpoint currently sits at 800px — deliberately a
                 little BELOW that floor, trading a slightly-squeezed band
                 (800–864) for keeping the split alive on more hosts.

     Below 800px the split becomes ONE view at a time with a toggle, the same
     idiom log_studio (780px), map (650), duckdb/sqlite (560) and bundle (640)
     already use. `history`, the other split-layout template, collapses LOWER
     (640px): its non-preview column is a 200px commit spine, not a 440px chat,
     so its split stays useful in hosts this one cannot survive.

     WHY this lives in the template and not in the shell: the alternative was to
     have the shell filter split-layout modes out of a narrow pane. A pane's
     width is DYNAMIC, and that makes the filter wrong in both directions — the
     listing preview pane defaults to HALF its container, so on a wide window
     the pane fits the split perfectly and the mode should be offered; and once
     it is offered, dragging the divider a little would make the mode appear and
     disappear from the switcher mid-drag, and could yank the ACTIVE mode out
     from under the user. It also needs per-template width knowledge in the
     shell, which no registry field carries and which every user template would
     be missing. A template that adapts itself needs none of that, and a user
     template gets the same treatment for free by writing its own media query.

     No min-width declaration was added to the registry or to stat for exactly
     that reason. */
  @media (max-width: 800px) {
    /* One column, holding one of the two views (plus the shared #anntools
       strip — see below). `position: relative` because the hidden view is
       PARKED out of flow against the body box, not display:none'd — see
       body.view-chat #left. */
    body { flex-direction: column; position: relative; }
    /* Nothing to drag when only one view is on screen. */
    #divider { display: none; }
    /* And no bar over the left pane: below the breakpoint there is no
       persistent left column to put one on, so the view picker goes back to
       #anntools — the row both views keep — and placeLeftPicker moves it. This
       rule is the layout half of that fact; the JS half is the move itself. */
    #leftbar { display: none; }
    /* NOTE what is NOT here: a width for #left. applySplit() writes
       `width: <split>%` INLINE on it, and an inline declaration outranks any
       stylesheet rule, so a plain `width: auto` here would simply lose. The two
       ways to neutralise it are the CSS force flag (`important`) and JS that
       refrains from writing the inline width while narrow — and the JS one is
       what this template does, in applySplit (see there): this file carries a
       hard no-force-flag rule (D146: cascade problems are stated in the
       SELECTORS, so that the next reader can reason about them by reading them,
       and a test asserts the flag appears nowhere in this file), so forcing here
       would be the one exception that makes the rule unenforceable. The
       behaviour is the same either way, because the `split` PARAM is never
       touched by the collapse:
       applySplit rewrites the inline percentage from it the moment the host grows
       back past 800px, so the wide layout returns with the user's own ratio and
       with no reload. `min-width` is a stylesheet declaration and does need
       clearing here — the 200px floor is a promise about the wide layout. */
    #left { min-width: 0; }
    /* The 340px floor is the wide layout's promise that the chat stays usable
       BESIDE the preview. Here the chat is the whole width, so the floor would
       only force a horizontal overflow of a 220px pane. */
    #chat { min-width: 0; order: -1; }

    /* Chat view — the default. The preview column is taken OUT OF FLOW and
       parked, full size, behind the chat rather than `display: none`d, and that
       is not a stylistic choice: an iframe with no layout box gives its content
       document a 0×0 viewport, which would (a) make shotPane rasterise a 1×1
       image of the app the moment a user attaches a pane screenshot from the
       chat, and (b) collapse every element rect the pins are anchored to, so
       arming annotate mode from here would find nothing to point at. Parked and
       `visibility: hidden` it keeps a real viewport and a real layout, costs one
       out-of-flow box, and shows nothing. `pointer-events: none` so the
       invisible pane cannot swallow a click meant for the chat. */
    body.view-chat #left {
      position: absolute;
      inset: 0;
      visibility: hidden;
      pointer-events: none;
    }
    body.view-chat #chat { flex: 1; min-height: 0; }
    /* A control that acts on the OTHER half is ABSENT here, not disabled: with
       no preview on screen there is nothing to annotate and no frame to place a
       pin in, and nothing to choose a view FOR. A disabled control still claims
       the space and still says "this view has an annotate feature", which is a
       worse lie than not offering it — and an ARMED annotate mode with no
       visible frame is worse than a dead one: it swallows clicks in a document
       the user cannot see. applyNarrowView disarms the mode when the view flips
       away from Preview for exactly that reason.
       `.viewshot` — the composer's "take a picture of the pane" button — is in
       the list too, and that one is a genuine judgement call: it still WORKS from
       here (the parked column keeps a real viewport, so shotPane rasterises the
       app correctly rather than a 1×1 image), so the narrow "it cannot work" test
       does not catch it. The rule that does is the stronger one: a view that shows
       no preview offers no features OF the preview. Photographing something the
       user cannot see is a worse affordance than a working one is a good
       affordance, and Preview view — one click away — is where a person deciding
       to attach the pane can actually see what they are attaching.
       Three things are deliberately NOT in this list:
         * the Chat ⇄ Preview toggle — it is the navigation between the two
           views, not a feature of either, so it is the one control that has to
           be reachable from both;
         * the annotation CHIPS above the composer — they are chat content (the
           notes about to be sent, in the user's own words), not a control that
           acts on the preview. Hiding them would hide part of the message;
         * and the screenshot chip that sits in the same row, for exactly that
           reason. It is a picture already taken, of a pane that was on screen
           when it was taken, and it is about to be sent — hiding it would hide
           part of the message while leaving the message carrying it. This is
           also why flipping to the chat view does NOT drop a captured shot the
           way it disarms annotate mode: an armed mode is an invisible promise,
           a chip is a visible attachment. */
    body.view-chat #annbtn,
    body.view-chat .viewshot,
    body.view-chat #leftmode { display: none; }
    /* The rule above also removes the row's ONE auto margin (#annbtn owns it,
       see the wide styles), which would let everything after it fall in next
       to #back at the LEFT edge. The view toggle takes the margin over while
       the switch is off screen, and the kebab is pushed to the row's LAST
       seat (see the #kebab order rule below): navigation reads left, actions
       read right, ⋮ closes the row — the same order every other view keeps. */
    body.view-chat #viewbtn { margin-left: auto; }
    /* THE STRIP'S GRAMMAR, in both narrow views: the way OUT of the view sits
       at the left edge, the controls that act on it sit right, and the kebab
       is always the row's last word — the one seat it holds in every layout,
       wide, narrow and no-pane alike, so it can never teleport across the row
       when the layout flips (it used to sit hard left in the chat view: the
       breakpoint crossing moved it end to end, and its right-anchored popup,
       suddenly against the viewport's left edge, clipped to a blank sliver).
       Flex `order` rather than moving DOM nodes: #back and #viewbtn ship in
       the position the WIDE layout wants, and these two rules are the whole
       narrow rearrangement. */
    #kebab { order: 10; }
    body.view-preview #viewbtn { order: -1; }
    /* The pin overlay (#annpins, #annhl, #annpop) needs no rule of its own: all
       three are children of #left, so parking the column takes them with it —
       `visibility: hidden` inherits (none of them sets `visibility: visible`)
       and `pointer-events: none` means the parked box cannot intercept a click
       meant for the chat, even though it is positioned and #annpop carries a
       z-index. Worth stating because it is the one part of the annotation UI
       that lives OVER the frame rather than in the strip, and a stray
       `visibility: visible` anywhere under #left would float it over the chat. */

    /* Preview view: the chat column collapses to its #anntools strip, so the
       Comment switch and this toggle stay reachable while the preview owns the
       screen. #anntools is a child of #chat (it is the chat pane's top row in
       the wide layout, and moving it out of there in the DOM would rework a
       layout that is correct), so the strip is kept by hiding #chat's OTHER
       children rather than by hiding #chat: display:none on the column would
       take the toggle with it and strand the user in the preview with no way
       back to the chat.
       THE SELECTOR IS ALSO THE WHOLE MECHANISM, and it is one an INLINE style
       silently defeats: a `style="display:…"` on any of those children outranks
       this rule, and the CSS force flag (`important`) — the only stylesheet
       answer to that — is forbidden in this file (D146). The composer's form used to carry exactly
       such an attribute, so this comment described a collapse that did not
       happen: #composer-chat was promoted into #chat's flex layout, the whole
       composer drew below the strip, and the preview got ~105px less than the
       screen it was told it owned. Every child of #chat now takes its `display`
       from the stylesheet (see the #inputbox rule), and
       tests/test_claude_narrow.py fails on any inline `display` in the column. */
    body.view-preview #left { flex: 1; min-height: 0; }
    /* `overflow: visible`, overriding the column's base `hidden`: here #chat
       IS the strip — a 43px box — and the kebab's popup hangs below it, over
       the preview. The base clip (sane for a full-height transcript column)
       cut that popup to a 3px sliver and left the menu painting under the
       frame. Safe to lift exactly here because every other child of #chat is
       display:none'd by the rule below — there is nothing else to spill. */
    body.view-preview #chat { flex: 0 0 auto; overflow: visible; }
    body.view-preview #chat > *:not(#anntools) { display: none; }
    /* #back survived the collapse above only because it moved into #anntools.
       It stays hidden HERE for the same reason the rest of the chat column is:
       the chat list it returns to is off screen in this view, so the button
       would navigate to something the layout cannot show. */
    body.view-preview #back { display: none; }

    #viewbtn { display: flex; align-items: center; }
  }
</style>
</head>
<body>
  <div id="left">
    <!-- The left pane's own top bar, holding the view picker in the split
         layout. Empty and `hidden` in the markup: placeLeftPicker moves
         #leftmode in here once the layout is known to be wide and the picker is
         known to have something to offer. A row ABOVE #leftview, never over it
         — see the stylesheet. -->
    <div id="leftbar" hidden></div>
    <!-- The iframe's own box, and the offset parent for every overlay that is
         positioned in FRAME viewport coordinates (pins, highlight, composer). -->
    <div id="leftview">
      <!-- "Preview", not "File preview": this frame holds a file's preview for a
           file target and the user's own app for an app folder, and an accessible
           name that names the wrong one of those is the same bug the footnote
           had. Nothing sets it per kind because "Preview" is already true of
           both. -->
      <iframe id="leftframe" title="Preview"></iframe>
      <div id="annhl"></div>
      <div id="annpins"></div>
      <div id="annpop">
        <!-- Just the words (Akshil, 2026-08-19): the anchor chip and the
             per-note mic left this card. What a click pins is chosen up front
             in the strip's Element/Point picker (Alt still overrides for one
             click), and speaking is the walkthrough's job — the card is for
             typing. The placeholder still names the target's KIND, so the
             one line of context the chip carried survives. -->
        <textarea rows="2" placeholder="What about this element?" spellcheck="false"></textarea>
        <div class="hint">Enter to save · Esc to cancel
          <button id="anndel" type="button" hidden>Delete</button></div>
      </div>
    </div><!-- /leftview -->
  </div>
  <div id="divider" role="separator" aria-orientation="vertical" aria-label="Resize panels"></div>

  <div id="chat" class="home">
    <!-- Annotation control: a real layout ROW above everything else in this
         pane, in both views — never an overlay, so it can't land on top of the
         topbar or the transcript. A real <button> (Enter/Space work, aria
         announces state) living in the parent document, a structural guarantee
         it can never appear in a pane capture (shotPane rasterises the framed
         document only). One switch is enough: the comment pins over the app
         show while annotating and hide when the mode is off. -->
    <div id="anntools">
      <!-- The way back to the chat list, at the strip's left end. It lived at
           the right end of #topbar; it sits HERE so the strip reads
           [← Chats … Comment] on one line, with the topbar below carrying only
           the session's identity. Hidden on the home view (there is no chat to
           leave) and in the narrow preview view (the view it returns to is off
           screen there) — both rules are in the stylesheet, where the topbar's
           own home-view hiding already lives. -->
      <button id="back" type="button" aria-label="Back to chats">← Chats</button>
      <!-- The picker sits FIRST in the right cluster so that arming reveals it
           at the cluster's LEFT, growing into the row's elastic middle: the
           two mode buttons under the pointer, the back button and the kebab
           all hold still (Akshil, 2026-08-19 — it used to appear between
           Record and ⋮ and shuffled the whole right cluster on every toggle).
           At rest the strip is [← Chats … 💬 Comment 🎙 Record ⋮]. -->
      <!-- WHAT a click pins, chosen up front: the element under it, or the
           exact spot. Appears while the mode is armed — typed comment and
           recording alike (Akshil, 2026-08-19) — it is a property of the
           armed click, and a picker for a click that cannot happen is noise.
           Alt stays as the momentary override of whichever tool is selected.
           A radiogroup, not two toggles: exactly one is ever the answer. -->
      <div id="anntool" role="radiogroup" aria-label="What a click pins" hidden>
        <button id="toolel" type="button" role="radio" aria-checked="true"
                aria-label="Element"
                title="Clicks pin the element under the cursor"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="2.5"/><rect class="fill" x="6" y="6" width="4" height="4" rx="1"/></svg><span class="lbl">Element</span></button>
        <button id="toolpt" type="button" role="radio" aria-checked="false"
                aria-label="Point"
                title="Clicks pin the exact spot, with a marked screenshot"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.25"/><line x1="8" y1="1.5" x2="8" y2="4"/><line x1="8" y1="12" x2="8" y2="14.5"/><line x1="1.5" y1="8" x2="4" y2="8"/><line x1="12" y1="8" x2="14.5" y2="8"/></svg><span class="lbl">Point</span></button>
      </div>
      <!-- TWO buttons at rest, ONE while a mode is on (Akshil, 2026-08-19):
           Comment on the left, Record on the right, each an icon plus a word
           (annFitStrip drops the words when the row runs out of room). A mode
           takes the strip down to a single control — the mic hides, and the
           Comment seat ITSELF morphs into the mode's exit: ✓ Done while a
           typed comment mode is armed (send the notes, leave the mode), ■
           plus the live clock while a walkthrough records (stop it). Ending a
           recording still puts the whole mode away by itself, and Esc still
           cancels. Both buttons are gated and hidden exactly like the old
           pill's seats (annCapable() / annPollTarget / enterNoPane's removal
           list) — the wrapper hides itself when it has no visible button.
           Every glyph and word is baked into the markup; the stylesheet swaps
           faces off the two state classes (#annbtn.on, #annrec.on), and
           #annreclbl is the one text the writers touch — the clock while
           recording, "Transcribing…" after — so no writer ever overwrites an
           icon. -->
      <div id="anncta">
        <!-- Discard, recording only (Akshil, 2026-08-19): an outline trash
             seat LEFT of the ■/clock — click throws the walkthrough away
             (recording stopped, nothing transcribed or sent, the clicks'
             empty marks deleted) where the stop seat keeps it. -->
        <button id="anndiscard" type="button" aria-label="Discard the recording"
                title="Discard the recording — nothing is transcribed or sent"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11"/><path d="M5.5 4V2.75a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1V4"/><path d="M3.75 4l.6 9a1 1 0 0 0 1 .95h5.3a1 1 0 0 0 1-.95l.6-9"/><line x1="6.5" y1="7" x2="6.5" y2="10.5"/><line x1="9.5" y1="7" x2="9.5" y2="10.5"/></svg></button>
        <button id="annbtn" type="button" aria-pressed="false" aria-label="Comment on the preview"
                title="Comment on the preview, then send the notes to Claude"><svg class="cmt-bubble" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 2.5h-11a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h2.5v2.9l3.4-2.9h5.1a1 1 0 0 0 1-1v-7a1 1 0 0 0-1-1z"/></svg><svg class="cmt-stop" viewBox="0 0 16 16" aria-hidden="true"><rect class="fill" x="4" y="4" width="8" height="8" rx="1.5"/></svg><svg class="cmt-done" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8.5l3.5 3.5 7-8"/></svg><span class="lbl cmt-word">Comment</span><span class="lbl done-word">Done</span><span id="annreclbl"></span></button>
