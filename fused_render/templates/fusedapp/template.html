<!DOCTYPE html>
<!-- The .fused app-file template (SPEC §43, D390). Opening a .fused IS the
     ordinary template path: /explorer/view/<path>.fused renders this inside
     the explorer shell, /explorer/embed/<path>.fused (what a Finder
     double-click maps to via the view-URL codec) renders it chrome-free.
     There is no gate (D389): on load it POSTs the internal
     /api/appfile/open (extract-or-reuse, hardened + read-only, appfile.py)
     and fills the viewport with an iframe of the entry page's embed URL.
     Extraction stays server-side, single implementation — this page must not
     re-implement any of it (and must not import fused_render, SPEC PY-15). -->
<html data-fused-theme="shell">
<head>
<meta charset="utf-8" />
<title>Fused app</title>
<style>
  :root {
    color-scheme: dark;
    --fg: #e8eaed; --fg-muted: #9aa0a6; --bg: #131417; --error: #ff6b6b;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --fg: #1f2023; --fg-muted: #61656c; --bg: #ffffff; --error: #c62828;
  }
  html, body { height: 100%; margin: 0; }
  body {
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--fg); background: var(--bg);
  }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  .state { padding: 40px; }
  .state h1 { font-size: 16px; margin: 0 0 10px; }
  .muted { color: var(--fg-muted); }
  .error { color: var(--error); white-space: pre-wrap;
           font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .migrate { max-width: 460px; margin: 10vh auto 0; padding: 22px 24px;
             border: 1px solid color-mix(in srgb, var(--fg) 14%, transparent);
             border-radius: 10px; }
  .migrate .row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .migrate .error { margin-top: 10px; }
  .btn { font: inherit; padding: 6px 14px; border-radius: 6px; cursor: pointer;
         color: var(--fg); background: transparent;
         border: 1px solid color-mix(in srgb, var(--fg) 22%, transparent); }
  .btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .btn:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div class="state" id="state"><span class="muted">Opening app…</span></div>
<script>
  const state = document.getElementById("state");
  const file = fused.params.get("_file");
  // A listing-pane peek / card thumbnail renders this template with
  // `_preview=1` (a reserved shell param, read off the URL — it is not a
  // page param). A preview must not COUNT as an open and must not extract:
  // it asks the server for an existing extract only (`preview: true` →
  // reuse_only + no recency, D396). A file the user HAS opened before
  // live-renders from that cache — the same look the /apps card shows —
  // and one they never opened gets the inert placeholder (extracting and
  // running a never-opened file's pages from a peek is exactly what
  // `_preview` exists to prevent, D301 / D390).
  const isPreview =
    new URLSearchParams(location.search).get("_preview") === "1";

  function placeholder() {
    state.innerHTML = "";
    const h = document.createElement("h1");
    h.textContent = "Fused app";
    const p = document.createElement("div");
    p.className = "muted";
    p.textContent = "Open this file to unpack and run the app.";
    state.append(h, p);
  }

  function fail(msg) {
    state.innerHTML = "";
    const h = document.createElement("h1");
    h.textContent = "Could not open app";
    const pre = document.createElement("div");
    pre.className = "error";
    pre.textContent = msg;
    state.append(h, pre);
  }

  async function open() {
    if (!file) return fail("No .fused file selected.");
    let resp, data;
    try {
      resp = await fetch("/api/appfile/open", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Fused": "1" },
        body: JSON.stringify(isPreview ? { file, preview: true } : { file }),
      });
      data = await resp.json();
    } catch (e) {
      return isPreview ? placeholder() : fail("Open request failed: " + e);
    }
    if (!resp.ok) {
      // A preview 400 is the normal "never opened" answer — inert card, not
      // an error surface.
      if (isPreview) return placeholder();
      return fail(data.error || "Not a valid .fused file.");
    }
    // Migrate-on-open (D883): a real open of a version that has no data yet,
    // when an earlier version of the same app on this machine does, asks
    // ONCE — copy that data across or start fresh — and only then frames
    // the entry page, so the data is on disk before the app's first render.
    // Previews never ask (a thumbnail is not an open), and a recorded
    // decision, either way, is never asked again for this extract.
    if (!isPreview) {
      const ok = await maybeMigrate();
      if (!ok) return;
    }
    mount(data.view);
  }

  function mount(view) {
    const frame = document.createElement("iframe");
    // The entry page's chrome-free embed URL. A preview forwards the two
    // picture-not-use stamps to the inner page: `_preview=1` (no open
    // recorded by anything downstream, D301) and `_nofocus=1` (a thumbnail
    // must not take the keyboard, D348).
    frame.src = view + (isPreview ? "?_preview=1&_nofocus=1" : "");
    frame.allow = "clipboard-read; clipboard-write; fullscreen";
    state.remove();
    document.body.appendChild(frame);
  }

  async function dataApi(body) {
    const resp = await fetch("/api/appfile/data", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Fused": "1" },
      body: JSON.stringify({ file, ...body }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || "data request failed");
    return data;
  }

  // Resolves true when the app may mount. Any failure on this path opens
  // the app plainly: the question is a courtesy, never a gate.
  async function maybeMigrate() {
    let st;
    try {
      st = await dataApi({});
    } catch (e) {
      return true;
    }
    if (!st.prior || st.decided || st.has_data) return true;
    return new Promise((resolve) => {
      state.innerHTML = "";
      const card = document.createElement("div");
      card.className = "migrate";
      const h = document.createElement("h1");
      h.textContent = "Bring your data along?";
      const p = document.createElement("div");
      p.className = "muted";
      const when = st.prior.exported_at ? " exported " + st.prior.exported_at : "";
      const from = st.prior.source ? " (" + st.prior.source + ")" : "";
      p.textContent =
        "This is a new version of an app you have used before. The version you " +
        "opened last" + when + from + " holds " + st.prior.files +
        (st.prior.files === 1 ? " data file" : " data files") +
        " (" + fmtBytes(st.prior.bytes) + "). Copy that data into this version, or start fresh?";
      const row = document.createElement("div");
      row.className = "row";
      const copy = button("Copy my data", true);
      const fresh = button("Start fresh", false);
      const err = document.createElement("div");
      err.className = "error";
      const decide = async (decision) => {
        copy.disabled = fresh.disabled = true;
        try {
          await dataApi({ decision });
        } catch (e) {
          // A failed copy is reported and the app still opens: the user can
          // re-open to be asked again (nothing was recorded).
          err.textContent = String(e.message || e);
          copy.disabled = fresh.disabled = false;
          return;
        }
        resolve(true);
      };
      copy.onclick = () => decide("copy");
      fresh.onclick = () => decide("fresh");
      row.append(copy, fresh);
      card.append(h, p, row, err);
      state.append(card);
      copy.focus();
    });
  }

  function button(label, primary) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    b.className = primary ? "btn primary" : "btn";
    return b;
  }

  function fmtBytes(n) {
    if (!(n > 0)) return "0 B";
    const u = ["B", "KB", "MB", "GB"];
    let i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return (i ? n.toFixed(1) : n) + " " + u[i];
  }

  open();
</script>
</body>
</html>
