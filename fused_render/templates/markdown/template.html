        for (let i = 0; i < files.length; i++) {
          const name = await freeMediaName(assets, files[i]);
          // Awaited BEFORE the insert, deliberately: a link inserted first
          // could end up pointing at a file that never made it to disk. The
          // cost is that a very large video briefly stalls the editor.
          await fused.uploadFile(assets + "/" + name, files[i]);
          // Ordinary markdown through an ordinary dispatch, so undo removes it
          // in one step and every other markdown tool can still read the note.
          // Video gets the same `![](…)` — markdown has no video syntax, and
          // the live-preview widget picks the element off the extension.
          const insert = "![](assets/" + name + ")" + (files.length > 1 ? "\n" : "");
          view.dispatch({
            changes: { from: pos, insert },
            selection: { anchor: pos + insert.length },
          });
          pos += insert.length;
        }
      } catch (err) {
        // Never swallowed: a paste that silently did nothing is
        // indistinguishable from a broken editor.
        mediaNotice("Could not add the file: " + (err.message || ""));
      }
    }

    // Pasting a URL over a selection makes a link out of it, rather than
    // replacing the words the user just chose. Pasting or dropping an image or
    // a video writes it into assets/ and links it in (MD-23).
    const pasteHandler = CM.EditorView.domEventHandlers({
      paste(event, target) {
        const media = mediaFiles(event.clipboardData && event.clipboardData.files);
        if (media.length) {
          // Read-only: fall through untouched, the same posture whenWritable
          // takes for every writing key (MD-1a/MD-15).
          if (target.state.readOnly) return false;
          event.preventDefault();
          void insertMediaFiles(target, media, target.state.selection.main.head);
          return true;
        }
        const url = ((event.clipboardData || {}).getData
          ? event.clipboardData.getData("text/plain") : "").trim();
        if (!/^[a-z][a-z0-9+.-]*:\/\/\S+$/i.test(url)) return false;
        const { from, to } = target.state.selection.main;
        if (from === to) return false;
        const selected = target.state.sliceDoc(from, to);
        event.preventDefault();
        target.dispatch({
          changes: { from, to, insert: `[${selected}](${url})` },
          selection: { anchor: from + selected.length + url.length + 4 },
        });
        return true;
      },

      // Not optional and easy to miss: without preventDefault here the browser
      // never fires `drop` at all and instead NAVIGATES the webview to the
      // dropped file, which looks like the whole editor vanishing. Gated to a
      // drag carrying files so CodeMirror's own text drag-and-drop is
      // untouched. It deliberately does NOT check readOnly: refusing here
      // would hand a file drop on a read-only note straight back to the
      // browser, and navigating away is not what "read-only" should mean.
      dragover(event) {
        if (!dragHasFiles(event)) return false;
        event.preventDefault();
        return false;   // not "handled": CM still draws its own drop cursor
      },

      drop(event, target) {
        // A text drag stays CodeMirror's — it moves the text, and this handler
        // must not touch it. The question is whether the drag carried FILES,
        // never whether media matched: dragover already committed to owning
        // every file drag (per-file MIME is not readable that early), so drop
        // has to honour that for all of them.
        if (!dragHasFiles(event)) return false;
        // Prevent FIRST, ask questions after. CM only calls preventDefault for
        // a handler that returns true, so any `return false` below this line
        // would hand the event back to the browser, whose default action for a
        // file drop is to navigate the webview to the dropped file — the
        // editor disappears, taking every edit since the last autosave with it
        // (pagehide fires a best-effort save that may not land).
        event.preventDefault();
        if (target.state.readOnly) {
          mediaNotice("This note is read-only, so files can't be added to it.");
          return true;
        }
        const media = mediaFiles(event.dataTransfer.files);
        if (!media.length) {
          mediaNotice("Only images and video can be added to a note.");
          return true;
        }
        // The one real difference from paste: dropping into the middle of a
        // note lands where the POINTER is, not where the caret happens to be.
        // posAtCoords answers null for a drop past the last line, which falls
        // back to the caret.
        const at = target.posAtCoords({ x: event.clientX, y: event.clientY });
        const pos = at === null || at === undefined
          ? target.state.selection.main.head : at;
        void insertMediaFiles(target, media, pos);
        return true;
      },
    });

    // ---- the completion popups (MD-14) -------------------------------------
    // Candidates come from the same scan the graph reads, so the popups are free
    // once the index exists and can never offer a note the graph disagrees
    // about. Cached briefly so a fast typist does not spawn a run per keystroke.
    let candidates = null;
    let candidatesAt = 0;
    let candidatesPending = null;
    let candidatesNotice = "";  // why there are none, when there are none
    const CANDIDATES_TTL_MS = 5000;

    // A failed or absent scan is cached exactly as hard as a successful one, and
    // the REASON is kept. Both matter: an uncached null re-ran the action on
    // every keystroke down the one path where it can never succeed (a
    // mount-backed root, which graph.py refuses by design, MD-11), and a
    // reasonless null left every source silently bailing — which the popup drew
    // as "no matches" (MD-11a: unknown is not missing).
    async function ensureCandidates() {
      if (Date.now() - candidatesAt < CANDIDATES_TTL_MS) return candidates;
      if (candidatesPending) return candidatesPending;
      candidatesPending = (async () => {
        candidates = null;
        candidatesNotice = "";
        const root = notes ? notes.root : (fused.params.get("root") || "");
        if (!root) {
          candidatesNotice = UNRESOLVED_HERE;
        } else {
          try {
            // `file` is sent so graph.py can validate every inserted form from
            // THIS note (MD-14): resolution tier 1 is relative to the containing
            // note's folder, so a form validated from the root is not validated
            // for a note in a subfolder.
            const data = await fused.runPython("./graph.py",
              { action: "candidates", root, file }, { key: "md-candidates" });
            if (data.error) candidatesNotice = data.message || UNRESOLVED_HERE;
            else candidates = data;
          } catch (err) {
            candidatesNotice = "The folder scan failed: " + (err.message || String(err));
          }
        }
        candidatesAt = Date.now();
        return candidates;
      })();
      try { return await candidatesPending; } finally { candidatesPending = null; }
    }

    // One informational row instead of an empty popup, in graph.py's own words
    // where it had any — so a mount refusal, a note outside its root and a
    // crashed scan each read as themselves, exactly as the sidebar does.
    // Non-selectable: `apply` deliberately inserts nothing, and `filter: false`
    // keeps the row from being typed away into an empty list again.
    function scanNoticeOptions(from, message) {
      return {
        from,
        filter: false,
        options: [{
          label: message || candidatesNotice || UNRESOLVED_HERE,
          type: "text",
          apply: () => {},
        }],
      };
    }

    // Where a row DISPLAYS something other than what it inserts, CM refuses to
    // guess where the typed characters landed and highlights nothing at all
    // (`sortOptions`: a `displayLabel` with no `getMatch` gets an empty match) —
    // which on these lists silenced the one signal that says why a row survived
    // the filter, since every path row and every heading row displays a form of
    // its own. So the mapping is supplied: the characters CM matched IN THE
    // LABEL, found again as a subsequence of what the row shows. A character the
    // display deliberately drops (a heading's `#`, a `%20`'s escape) is skipped
    // rather than fudged, so the emphasis is always on real matched text or
    // absent — never a range slid sideways over the wrong letters.
    function displayMatch(completion, matched) {
      const shown = completion.displayLabel;
      // No display form of its own, or nothing matched (an unfiltered list calls
      // this with no ranges at all): the label's own ranges are already right.
      if (!shown || !matched) return matched || [];
      const lower = shown.toLowerCase();
      let typed = "";
      for (let i = 0; i < matched.length; i += 2) {
        typed += completion.label.slice(matched[i], matched[i + 1]);
      }
      const out = [];
      let at = 0;
      for (const ch of typed) {
        const found = lower.indexOf(ch.toLowerCase(), at);
        if (found === -1) continue;
        if (out.length && out[out.length - 1] === found) out[out.length - 1] = found + 1;
        else out.push(found, found + 1);
        at = found + 1;
      }
      return out;
    }

    // NESTING depth over the levels actually present, not the raw level: a note
    // that starts at `##` is not an indented note, and `#` → `###` is one step in
    // rather than two. Shared by the two surfaces that draw the same note's
    // headings — the completion popup and the sidebar outline — because "the popup
    // indents the way the outline does" (MD-14) is only true if it is one rule and
    // not two that agree on the notes we happened to look at.
    function withDepth(headings) {
      const stack = [];
      return headings.map((h) => {
        while (stack.length && stack[stack.length - 1] >= h.level) stack.pop();
        stack.push(h.level);
        return { ...h, depth: stack.length - 1 };
      });
    }

    // A heading row says its nesting the way the SIDEBAR's outline says it —
    // indentation, plus the level as a dimmed marker in the detail column (MD-14,
    // MD-19b). Printing `### ` into the label was a third visual language for the
    // one thing this template already renders twice: the same note's headings.
    function headingOptions(headings, prefix, encode) {
      return withDepth(headings).map((h) => ({
        label: prefix + "#" + (encode ? encodeTarget(h.text) : h.text),
        displayLabel: "  ".repeat(h.depth) + h.text,
        detail: "H" + h.level,
        type: "text",
      }));
    }

    // ---- a path, as the target of an inline link (MD-14) -------------------
    // The candidates payload already carries every note AND every non-note file
    // under the root, both root-relative POSIX, so path completion needs no new
    // Python action — only the string work below. `resolvePath` goes the other
    // way (join to an fs-absolute path) and so has nothing reusable here; this
    // stays pure string manipulation for the same reason it does, and it never
    // rebuilds a path from segments, so the Windows drive form `C:/…` (which
    // must NOT gain a leading slash) passes through untouched.

    // The open note's own folder, root-relative, "" when it sits at the root —
    // and null when the note is not under the root at all, which is a thing to
    // say rather than an empty popup.
    function vaultRelDir(root) {
      const base = (root || "").replace(/\/+$/, "");
      if (!file || !base || !file.startsWith(base + "/")) return null;
      const rel = file.slice(base.length + 1);
      const cut = rel.lastIndexOf("/");
      return cut === -1 ? "" : rel.slice(0, cut);
    }

    // `rel` (root-relative) as written from `dir` (root-relative). A file beside
    // the note comes out as `img.png` and one below it as `sub/img.png`; `../`
    // appears only where the target really is above the note, because climbing
    // to the root and back down is noise nobody would type.
    function relativeTarget(dir, rel) {
      const from = dir ? dir.split("/") : [];
      const to = rel.split("/");
      let shared = 0;
      while (shared < from.length && shared < to.length - 1
             && from[shared] === to[shared]) shared++;
      return "../".repeat(from.length - shared) + to.slice(shared).join("/");
    }

    // `[x](my file.png)` is not a link to the GFM parser at all, so the
    // human-readable path is the one thing that must NOT be inserted: it would
    // put a target in the document that Live Preview cannot render and the click
    // handler never sees. Encoded per segment so `/` and `..` survive, and
    // parentheses go too since one of them closes the target early. The readable
    // form is what the row DISPLAYS (`displayLabel`), so the escapes only ever
    // exist in the document — where MD-4a's widget decodes them again.
    function encodeTarget(path) {
      return path.split("/")
        .map((segment) => (segment === ".." || segment === "."
          ? segment
          : encodeURIComponent(segment).replace(/\(/g, "%28").replace(/\)/g, "%29")))
        .join("/");
    }

    // Only an image renders in `![…](…)`, so that trigger offers only images.
    const IMAGE_EXT_RE = /\.(png|jpe?g|gif|webp|svg|avif|bmp|ico)$/i;

    // Relative to the note's own folder, which is `resolve_link`'s FIRST tier
    // (MD-4) — so the form the popup inserts is the form the graph follows back
    // to this exact file, with no basename ambiguity to lose to. It is also a
    // real relative path, which is what the shell navigates by (MD-4a) even
    // where no scan ever ran.
    function pathOptions(data, dir, imagesOnly) {
      // An asset row is `{ rel, embed }`; only `rel` matters here, because this
      // context's form is computed as a relative path below rather than taken
      // from the payload.
      const assetRels = data.assets.map((asset) => asset.rel);
      const rels = imagesOnly
        ? assetRels.filter((rel) => IMAGE_EXT_RE.test(rel))
        : data.notes.map((note) => note.rel).concat(assetRels);
      return rels.map((rel) => {
        const readable = relativeTarget(dir, rel);
        return {
          label: encodeTarget(readable),
          displayLabel: readable,
          // No `detail`: it carried `rel`, which for the common case (a target
          // in or under the note's own folder) is the readable path the row
          // already shows — the row read `docs/other.mddocs/other.md`. The
          // detail column is for something the label does not say, and here
          // there is nothing (MD-14).
          type: isNote(rel) ? "class" : "text",
        };
      });
    }

    const OUTSIDE_ROOT =
      "Paths are not offered here — this note is not under the scanned folder.";

    // ---- `[[…` and `![[…` --------------------------------------------------
    async function wikilinkCompletions(context) {
      const before = context.state.doc.sliceString(
        Math.max(0, context.pos - 240), context.pos);
      const wiki = /\[\[([^\[\]\n]*)$/.exec(before);
      if (!wiki) return null;
      const typed = wiki[1];
      const from = context.pos - typed.length;
      const data = await ensureCandidates();
      if (!data) return scanNoticeOptions(from);
      const hash = typed.indexOf("#");
      if (hash === -1) {
        // `![[image.png]]` is the common Obsidian embed, and an embed resolves
        // through the ASSET index while a plain `[[…]]` resolves through the note
        // index (graph.py `_resolved_links`). So the two contexts read two
        // different validated forms off the same rows: `embed` here, `link`
        // there. A row whose form is **null** has no form that resolves back to
        // it from this note, and is dropped rather than inserted as a path the
        // resolver would read as a ghost or as another file — the page still
        // invents no form of its own (MD-3/MD-14).
        const embedding = before[wiki.index - 1] === "!";
        const options = [];
        for (const note of data.notes) {
          const form = embedding ? note.embed : note.link;
          if (form) options.push({ label: form, detail: note.title, type: "class" });
        }
        if (embedding) {
          for (const asset of data.assets) {
            if (asset.embed) {
              options.push({ label: asset.embed, detail: "embed", type: "text" });
            }
          }
        }
        return { from, options, validFor: /^[^\[\]#\n]*$/ };
      }
      const notePart = typed.slice(0, hash);
      // Matched against BOTH forms: whichever popup offered the note is the form
      // sitting in the document now, and `[[a/B#` must find B's headings either
      // way. Null forms simply never match.
      const headings = notePart
        ? ((data.notes.find((n) => [n.link, n.embed].some(
              (form) => form && form.toLowerCase() === notePart.toLowerCase()))
            || {}).headings || [])
        : (notes ? notes.headings : []);
      return { from, options: headingOptions(headings, notePart), getMatch: displayMatch };
    }

    // ---- `](…` — an inline link's or image's target -------------------------
    async function inlinePathCompletions(context) {
      const before = context.state.doc.sliceString(
        Math.max(0, context.pos - 240), context.pos);
      const inline = /(!?)\[[^\]\n]*\]\(([^)\s]*)$/.exec(before);
      if (!inline) return null;
      const typed = inline[2];
      if (typed.startsWith("#")) return null;  // headingAnchorCompletions' case
      const from = context.pos - typed.length;
      const data = await ensureCandidates();
      if (!data) return scanNoticeOptions(from);
      const dir = vaultRelDir(data.root);
      if (dir === null) return scanNoticeOptions(from, OUTSIDE_ROOT);
      return {
        from,
        options: pathOptions(data, dir, inline[1] === "!"),
        // Keystrokes filter the list locally instead of re-running the source —
        // the same reason `[[` carries one.
        validFor: /^[^)\s]*$/,
        // The row displays the readable path and inserts the encoded one, so the
        // typed-substring emphasis needs the mapping between them.
        getMatch: displayMatch,
      };
    }

    // ---- `](#…` — an anchor inside this note --------------------------------
    // The same headings `[[#` offers, from the note payload, so this context
    // needs no candidate scan of its own — but it does need the note payload,
    // and where that failed the answer is graph.py's reason, not an empty list.
    async function headingAnchorCompletions(context) {
      const before = context.state.doc.sliceString(
        Math.max(0, context.pos - 240), context.pos);
      const anchor = /\]\((#[^)\s]*)$/.exec(before);
      if (!anchor) return null;
      const from = context.pos - anchor[1].length;
      if (!notes) return scanNoticeOptions(from, scanNotice || UNRESOLVED_HERE);
      return {
        from,
        options: headingOptions(notes.headings, "", true),
        validFor: /^#[^)\s]*$/,
        getMatch: displayMatch,
      };
    }

    // ---- the popup's presentation (MD-14) ----------------------------------
    // Through CM's OWN theme mechanism, not page CSS, for one concrete reason:
    // an appearance flip dispatches `StateEffect.reconfigure` over the extension
    // array (buildEditor), so a theme extension IN that array is reinstalled with
    // everything else, while a page rule has to keep out-specifying whatever
    // oneDark reinstates. And every colour is a var() token read off <html> at
    // paint time, so ONE theme is right in both palettes — there is no dark copy
    // of these rules to keep in sync (D192).
    // The list is long by nature (every note plus every asset in the vault), so
    // the shape is the SIDEBAR's list, not a code editor's: prose font, one row
    // per line, a dimmed right-hand detail column, and a selected row that reads
    // like `.bl:hover` (--bg on the --bg-alt panel) plus an accent left edge and
    // bold weight — two non-colour signals, so the selection survives without it.
    const completionTheme = CM.EditorView.theme({
      // `.cm-tooltip.cm-tooltip-autocomplete` rather than the single class: the
      // page's generic `.cm-editor .cm-tooltip` rule is equal-specificity and
      // earlier in <head> (StyleModule mounts first), so the popup's own rules
      // have to out-specify it rather than tie with it.
      ".cm-tooltip.cm-tooltip-autocomplete": {
        border: "1px solid var(--border)",
        borderRadius: "8px",
        background: "var(--bg-alt)",
        color: "var(--fg)",
        boxShadow: "0 6px 24px rgba(0, 0, 0, 0.28)",
        overflow: "hidden",
      },
      ".cm-tooltip.cm-tooltip-autocomplete > ul": {
        margin: "0",
        padding: "4px",
        // Not monospace: these rows are paths and heading text, which is what the
        // rest of this view sets in the body font.
        fontFamily: "inherit",
        fontSize: "13px",
        minWidth: "16em",
        maxWidth: "34em",
        // Tidy scrolling for a vault-sized list instead of a popup the height of
        // the window.
        maxHeight: "16em",
        overflow: "hidden auto",
        scrollbarWidth: "thin",
      },
      ".cm-tooltip.cm-tooltip-autocomplete > ul > li": {
        display: "flex",
        alignItems: "baseline",
        columnGap: "8px",
        padding: "4px 7px",
        borderRadius: "5px",
        // The accent edge's slot, transparent until the row is the selected one,
        // so selecting a row does not shift its text.
        borderLeft: "2px solid transparent",
        lineHeight: "1.35",
        cursor: "pointer",
      },
      ".cm-tooltip.cm-tooltip-autocomplete > ul > li[aria-selected]": {
        background: "var(--bg)",
        color: "var(--fg)",
        borderLeftColor: "var(--accent)",
        fontWeight: "600",
      },
      ".cm-tooltip.cm-tooltip-autocomplete > ul > li:hover:not([aria-selected])": {
        background: "var(--bg)",
      },
      // `white-space: pre` is load-bearing: a heading row says its level with
      // leading spaces, and HTML would collapse them.
      ".cm-tooltip-autocomplete .cm-completionLabel": {
        flex: "0 1 auto",
        minWidth: "0",
        overflow: "hidden",
        textOverflow: "ellipsis",
        whiteSpace: "pre",
      },
      // The typed substring. Emphasised, because in a list this long the matched
      // characters are the only thing telling you why a row is still here.
      ".cm-tooltip-autocomplete .cm-completionMatchedText": {
        textDecoration: "none",
        color: "var(--accent)",
        fontWeight: "700",
      },
      // Its own dimmed column, pushed right — `docs/other.mddocs/other.md` and
      // `a.pngembed` were the label and the detail with nothing between them.
      ".cm-tooltip-autocomplete .cm-completionDetail": {
        marginLeft: "auto",
        flex: "none",
        paddingLeft: "12px",
        fontStyle: "normal",
        fontSize: "11px",
        color: "var(--fg-muted)",
      },
    });

    function editorExtensions() {
      const base = [
        completionTheme,
        CM.basicSetup,
        ...(wantsDark() ? [CM.oneDark] : []),
        CM.markdown({ base: CM.markdownLanguage }),
        CM.EditorView.lineWrapping,
        // Above basicSetup's default keymap: Enter must continue the list
        // marker rather than plain-indent, and Tab must indent the list item.
        CM.Prec.high(CM.keymap.of(CM.markdownKeymap.concat(editorKeymap))),
        // One source per context, not one function with a chain of regexes: CM
        // runs every source and merges what they return, so each stays a single
        // trigger with a single answer. `override` still replaces the default
        // sources wholesale, and still at high precedence.
        CM.Prec.high(CM.autocompletion({
          override: [
            wikilinkCompletions, inlinePathCompletions, headingAnchorCompletions,
          ],
          // No icon column (D192). CM renders the `type` field as a glyph, and
          // its glyph for `text` is the literal string "abc" — on every path
          // row, which is not what any of these rows are. The row itself already
          // names its kind (an extension, `.md` or not; an indented heading; the
          // `embed` detail), so the column could only spend width to repeat it —
          // or, with two type values across four contexts, to blur it.
          icons: false,
        })),
        pasteHandler,
        livePreviewField,
        CM.EditorView.updateListener.of((update) => {
          if (!update.docChanged) return;
          setDirty(true);
          armAutosave();
          // The outline's only trigger: headings change as you type, and this is
          // the event that says the document did (MD-19b — no timer, no poll).
          renderOutline();
        }),
      ];
      if (!editing()) {
        // Two ways to reach here, one mechanism (MD-1a). An UNWRITABLE file:
        // the server refuses the write anyway, and opening disabled is what
        // makes the UI honest up front — on an rclone mount with CacheMode=full
        // a doomed write even succeeds locally and only 403s later on upload, so
        // this reads the shell's persisted read_only flag through stat.writable
        // rather than os.access (MD-15). Or read-only MODE, asked for by the
        // user. Either way the decorations are unchanged and the buffer is
        // locked, which is what "reading view" is here (MD-1).
        base.push(CM.EditorView.editable.of(false));
        base.push(CM.EditorState.readOnly.of(true));
      }
      return base;
    }

    function buildEditor(body) {
      const previous = view;
      const selection = previous ? previous.state.selection.main.head : cursorMemory();
      const scroll = previous ? previous.scrollDOM.scrollTop : 0;
      previous?.destroy();
      editorWrapEl.innerHTML = "";
      const extensions = editorExtensions();
      view = new CM.EditorView({ doc: body, extensions, parent: editorWrapEl });
      const at = Math.min(selection, view.state.doc.length);
      view.dispatch({ selection: { anchor: at } });
      view.scrollDOM.scrollTop = scroll;
      // Every path that replaces the document comes through here — the first
      // load, an external reload, switching note, switching mode — and each of
      // them can change the headings, so the outline is redrawn from the new doc.
      outlineKey = null;
      renderOutline();

      // A live appearance change reconfigures the RUNNING view — rebuilding it
      // would throw away unsaved edits, the caret and the scroll position.
      themeObserver?.disconnect();
      themedDark = wantsDark();
      themeObserver = new MutationObserver(() => {
        const next = wantsDark();
        if (next === themedDark || !view) return;
        themedDark = next;
        try {
          view.dispatch({
            effects: CM.StateEffect.reconfigure.of(
              extensions.filter((e) => e !== CM.oneDark).concat(next ? [CM.oneDark] : [])),
          });
        } catch (err) { /* cosmetic only — keep the current editor theme */ }
      });
      themeObserver.observe(document.documentElement,
        { attributes: true, attributeFilter: ["data-theme"] });
    }

    // Cursor position per file, so switching away and back lands where you were
    // (Obsidian remembers this; sessionStorage is the right lifetime for it).
    function cursorKey() { return "fused-md-cursor:" + file; }
    function cursorMemory() {
      try { return parseInt(sessionStorage.getItem(cursorKey()) || "0", 10) || 0; }
      catch (e) { return 0; }
    }
    function rememberCursor() {
      if (!view) return;
      try { sessionStorage.setItem(cursorKey(), String(view.state.selection.main.head)); }
      catch (e) { /* private mode — the memory is a nicety */ }
    }

    // `?heading=` is how a `[[Note#Heading]]` link arrives. There are no
    // rendered headings to scan any more, so the doc itself is the index:
    // scroll the matching ATX line into view without moving the caret onto it,
    // which would un-render that line the moment you arrived.
    //
    // The argument is for `[[#Heading]]`, an anchor into THIS note: same jump,
    // no navigation and no param, because the document is already open.
    function scrollToHeading(heading) {
      const wanted = (heading === undefined
        ? fused.params.get("heading") || "" : heading).trim().toLowerCase();
      if (!wanted || !view) return;
      const doc = view.state.doc;
      for (let n = 1; n <= doc.lines; n++) {
        const match = /^#{1,6}\s+(.*)$/.exec(doc.line(n).text);
        if (match && match[1].trim().toLowerCase() === wanted) {
          scrollToLine(n);
          return;
        }
      }
    }

    // MD-4b's rule in one place, so every heading jump obeys it: scroll the line
    // into view and leave the caret alone. The outline (below) scrolls by LINE
    // rather than by text because it built the row from that line — matching by
    // text would re-search the document and hand the second `## Notes` to the
    // first one.
    function scrollToLine(n) {
      if (!view || !(n >= 1) || n > view.state.doc.lines) return;
      view.dispatch({
        effects: CM.EditorView.scrollIntoView(view.state.doc.line(n).from, { y: "start" }),
      });
    }

    // ---- the outline, in the same sidebar (MD-19b) --------------------------
    // Read from the LIVE document, never from `notes.headings`: the payload only
    // re-parses on save (MD-9), so a payload-fed outline would lag every heading
    // you type by up to one autosave interval — and a stale outline is the one
    // thing an outline may not be. The document is already the index for
    // `?heading=` (MD-4b), so this is the same source of truth read the same way,
    // and it needs no timer: the editor's existing docChanged listener is the
    // only trigger this has (nothing in this template polls — MD-17).
    //
    // Frontmatter and fenced code are masked exactly as graph.py's `_mask_code`
    // masks them, because `# not a heading` inside a fenced block appears in no
    // other heading surface (the `[[#` popup, the graph payload) and must not
    // appear here either. ATX only, which is all `_HEADING` and `scrollToHeading`
    // know. Not the syntax tree, tempting as it is: `syntaxTree(state)` is parsed
    // only as far as CM has got, so on a long note the tail headings would
    // silently be missing from the outline.
    function documentHeadings() {
      if (!view) return [];
      const doc = view.state.doc;
      const rows = [];
      let fence = null;         // the opening run while inside a fenced block
      // The closer is found BEFORE anything is skipped, which is the whole point:
      // an UNCLOSED `---` is not frontmatter, it is a horizontal rule someone is
      // still typing under. Marking it open and skipping to the end of the
      // document blanked the entire outline from the keystroke that opened the
      // block until the one that closed it, while graph.py's `_frontmatter_span`
      // and the decoration scan above both kept those headings — three surfaces
      // for the same note disagreeing (MD-19b, and MD-18a for the same rule).
      let frontmatterEnd = 0;
      if (doc.lines > 1 && doc.line(1).text.trim() === "---") {
        for (let n = 2; n <= doc.lines; n++) {
          if (/^(---|\.\.\.)[ \t]*$/.test(doc.line(n).text)) { frontmatterEnd = n; break; }
        }
      }
      for (let n = frontmatterEnd + 1; n <= doc.lines; n++) {
        const text = doc.line(n).text;
        const opener = /^ {0,3}(`{3,}|~{3,})/.exec(text);
        if (fence !== null) {
          // Inside a fence everything is code, including the closing line.
          if (opener && opener[1][0] === fence[0] && opener[1].length >= fence.length) {
            fence = null;
          }
          continue;
        }
        if (opener) { fence = opener[1]; continue; }
        const match = /^(#{1,6})[ \t]+(.+?)[ \t]*#*[ \t]*$/.exec(text);
        if (match) rows.push({ level: match[1].length, text: match[2], line: n });
      }
      return rows;
    }

    // The last outline drawn, so an unchanged one is not redrawn. Load-bearing,
    // not an optimisation: this runs on every keystroke, and rewriting the list's
    // innerHTML while someone types inside a heading would reset the outline's
    // own scroll position and drop the row under their pointer.
    let outlineKey = null;

    function renderOutline() {
      const listEl = document.getElementById("outline");
      const headEl = document.getElementById("outline-head");
      if (!graphOn()) {
        // The panel is closed; there is nothing to draw and this is the hot path.
        outlineKey = null;
        return;
      }
      const rows = documentHeadings();
      const key = rows.map((r) => `${r.line}:${r.level}:${r.text}`).join("\n");
      if (key === outlineKey) return;
      outlineKey = key;

      const drawn = withDepth(rows);

      headEl.textContent = rows.length ? `Outline (${rows.length})` : "Outline";
      listEl.innerHTML = drawn.length
        ? drawn.map((row) => `
            <button class="bl ol" style="--ol-depth: ${row.depth}"
                    data-line="${row.line}" title="${escapeHtml(row.text)}">
              <span class="ol-text">${escapeHtml(row.text)}</span>
            </button>`).join("")
        // Same voice as the backlinks empty state: state the absence as a fact
        // about this note, rather than hiding the section.
        : `<div class="bl-empty">No headings in this note.</div>`;
    }

    // ---- backlinks, in the sidebar ------------------------------------------
    function renderSidebar() {
      const linksEl = document.getElementById("links");
      const listEl = document.getElementById("bl-list");
      const noticeEl = document.getElementById("notice");
      if (!notes) {
        // Say WHY rather than hiding the section. An empty backlinks panel reads
        // as "nothing links here", which is an answer we never computed — the
        // same mistake the ghost rendering used to make (MD-11).
        linksEl.hidden = false;
        listEl.innerHTML = "";
        document.getElementById("links-head").textContent = "Backlinks";
        // graph.py's own words for why, so a mount refusal, a note outside its
        // root and a failed scan each read as themselves.
        noticeEl.textContent = "Backlinks need a folder scan. " + scanNotice;
        noticeEl.hidden = false;
        return;
      }
      linksEl.hidden = false;

      // One row per LINKING NOTE, not per link: a note that references this one
      // three times rendered as three identical rows, which read as three
      // different notes until the paths were compared. The multiplicity is
      // real information — it just belongs in a count on the one row, and the
      // header keeps counting notes, since "how many notes point here" is the
      // question a backlinks panel answers.
      const byPath = new Map();
      for (const row of notes.backlinks || []) {
        const seen = byPath.get(row.path);
        if (seen) seen.count += 1;
        else byPath.set(row.path, { ...row, count: 1 });
      }
      const rows = [...byPath.values()];
      document.getElementById("links-head").textContent =
        rows.length ? `Backlinks (${rows.length})` : "Backlinks";
      listEl.innerHTML = rows.length
        ? rows.map((row) => `
            <button class="bl" data-path="${escapeHtml(row.path)}">
              <span class="bl-title">${escapeHtml(row.title)}</span>
              <span class="bl-path">${escapeHtml(row.rel)}</span>
              ${row.count > 1 ? `<span class="bl-count">×${row.count}</span>` : ""}
            </button>`).join("")
        : `<div class="bl-empty">No other note under ${escapeHtml(notes.root)}
             links here.</div>`;

      // Caps are reported, never silently applied (MD-10).
      const notices = [];
      if (notes.truncated) {
        // Any cap can set `truncated` — notes, assets, or the walk's total-entry
        // budget — so the wording says a cap fired without claiming which.
        notices.push(`Partial scan: ${notes.notes} note(s) under
          ${escapeHtml(notes.root)} were indexed before the walk hit a cap, so some
          backlinks or embeds may be missing.`);
      }
      noticeEl.innerHTML = notices.join("<br />");
      noticeEl.hidden = !notices.length;
    }

    async function refreshLinks() {
      const root = fused.params.get("root") || "";
      try {
        const data = await fused.runPython("./graph.py",
          { action: "note", file, root }, { key: "md-note" });
        if (data.error) {
          // A mount-backed root, or a note outside its root: the document still
          // renders and stays editable, the link layer just has nothing to say
          // (MD-11). Reading and writing one file never needed the walk. Note
          // `resolved = null` means UNKNOWN, not "nothing resolved" — every
          // wikilink renders inert rather than as a ghost.
          notes = null;
          resolved = null;
          scanNotice = data.message || UNRESOLVED_HERE;
        } else {
          notes = data;
          scanNotice = "";
          resolved = new Map();
          for (const link of data.links) {
            if (!resolved.has(link.target)) resolved.set(link.target, link);
          }
        }
      } catch (err) {
        notes = null;
        resolved = null;
        scanNotice = "The folder scan failed: " + (err.message || String(err));
      }
      renderSidebar();
      // Every ghost may just have become a real link (or the reverse), and the
      // decorations were built against the old answer.
      view?.dispatch({ effects: relinkEffect.of(null) });
      return notes;
    }

    // Clicking an unresolved link creates the note — Obsidian's behaviour, and
    // only possible because this template writes.
    async function createGhost(target) {
      if (!notes) return;
      const clean = String(target).replace(/\\/g, "/").replace(/^(\.\/)+/, "");
      const name = /\.(md|markdown)$/i.test(clean) ? clean : clean + ".md";
      // Belt and braces against a degenerate target (a directory link used to
      // produce a file called literally `.md`): graph.py no longer makes a ghost
      // for one, and this refuses to act on one if it ever arrives anyway.
      if (!name.replace(/\.(md|markdown)$/i, "").split("/").pop()) return;
      // WHERE it lands has to be decided the way graph.py's `resolve_link`
      // decides it, or this creates a note the graph that offered it will never
      // look for. That is the same divergence MD-3 exists to prevent, here in
      // the one place the page computes a path of its own. The resolver tries the
      // linking note's OWN FOLDER first and the vault root second, so an
      // explicitly relative target means "from this note" and a plain
      // `folder/note` means "from the root" — Obsidian's convention.
      const relative = /(^|\/)\.\.(\/|$)/.test(clean);
      const base = relative || !clean.includes("/") ? noteDir() : notes.root;
      const path = resolvePath(base, name);
      // A note created outside the scan root is invisible to the graph that
      // offered to create it, so the offer would be incoherent — and `..` in a
      // target is exactly how a write escapes upwards. The boundary slash keeps
      // a sibling folder with a shared prefix out.
      const root = notes.root.replace(/\/+$/, "");
      if (path !== root && !path.startsWith(root + "/")) {
        saveStateEl.textContent =
          "Won't create " + name + ": that is outside " + root + ".";
        saveStateEl.classList.add("error");
        return;
      }
      // CREATE-ONLY, and the server decides (`create: true` → 409 on an
      // existing path). This is load-bearing and must not be "simplified" back
      // to a plain write, nor to stat-then-write: a ghost is not proof the
      // target is missing. `resolved` holds only the LAST scan's answers, so a
      // link you just typed is a ghost until the next scan lands, and an
      // ambiguous target is a ghost by design (graph.py's `_only`) — the very
      // case where a real note sits at this path. An unconditional write there
      // replaced someone's note with a one-line stub.
      //
      // So: absent → created; already there → we navigate to it, which is what
      // clicking a link that turned out to be real should do anyway; anything
      // else (a directory at the path, an unwritable file or parent) is
      // reported. Note what is NOT here: a swallowed error. Treating every
      // failure as "absent" is how the clobber hid.
      try {
        await fused.writeFile(path, "# " + name.replace(/\.(md|markdown)$/i, "") + "\n",
          { create: true });
      } catch (err) {
        if (err.type !== "exists") {
          saveStateEl.textContent = "Could not create " + name + ": " + (err.message || "");
          saveStateEl.classList.add("error");
          return;
        }
      }
      openNote(path, "");
    }

    // One delegated handler for every link surface: wikilink and markdown-link
    // widgets and backlink rows all carry data-path; ghosts carry data-create.
    document.addEventListener("click", (event) => {
      // `[[#Heading]]`: the target note IS this one, so this is a scroll, not a
      // navigation. Checked first — its data attribute is the narrowest.
      const anchor = event.target.closest("[data-anchor]");
      if (anchor) {
        event.preventDefault();
        scrollToHeading(anchor.getAttribute("data-anchor"));
        return;
      }
      // An outline row: it knows the line it was built from, so it scrolls to
      // that line instead of re-finding the heading by text (see scrollToLine).
      const outlined = event.target.closest("[data-line]");
      if (outlined) {
        event.preventDefault();
        scrollToLine(parseInt(outlined.getAttribute("data-line"), 10));
        return;
      }
      const create = event.target.closest("[data-create]");
      if (create) {
        event.preventDefault();
        void createGhost(create.getAttribute("data-create"));
        return;
      }
      const el = event.target.closest("[data-path]");
      if (!el) return;
      event.preventDefault();
      openNote(el.getAttribute("data-path"), el.getAttribute("data-heading") || "");
    });

    document.getElementById("reload").addEventListener("click", () => void reloadFromDisk());
    document.getElementById("keep").addEventListener("click", () => void keepMine());

    // Cmd/Ctrl+S forces the flush early — it is not "the save", because the
    // idle timer and the blur hook already saved. There is no Cmd/Ctrl+E: with
    // one surface there is nothing to toggle to (MD-1).
    window.addEventListener("keydown", (event) => {
      if (!(event.metaKey || event.ctrlKey)) return;
      if (event.key.toLowerCase() !== "s") return;
      event.preventDefault();
      void save();
    });

    // Flush on focus loss and on tab switch, then look for an external change
    // when we come back (see checkExternalChange).
    window.addEventListener("blur", () => { rememberCursor(); void save(); });
    window.addEventListener("pagehide", () => { rememberCursor(); void save(); });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") {
        rememberCursor();
        void save();
      } else {
        void checkExternalChange();
      }
    });
    window.addEventListener("focus", () => { void checkExternalChange(); });

    // Flush hook for the shell: anything that remounts this iframe (a mode
    // switch) would silently discard edits newer than the last autosave.
    window.__fusedFlushEdits = async () => {
      if (!view || !dirty) return { ok: true };
      if (conflictEl.style.display === "flex") return { ok: false };
      await save();
      return { ok: !dirty && conflictEl.style.display !== "flex" };
    };

    // ---- the sidebar's graph (MD-19) ---------------------------------------
    // The canvas, the sim and every interaction rule live in
    // /template-shared/graph-canvas.js, shared with the folder-level `graph`
    // mode — one implementation, so the two surfaces cannot drift apart.
    const sideEl = document.getElementById("side");
    const toggleEl = document.getElementById("toggle-graph");
    const editToggleEl = document.getElementById("toggle-edit");
    const canvasEl = document.getElementById("graph-canvas");
    const graphCountEl = document.getElementById("graph-count");
    const graphNoteEl = document.getElementById("graph-note");
    const depthEl = document.getElementById("depth");

    const canvas = fusedGraph.create({
      canvas: canvasEl,
      onOpenNote: (path) => openNote(path, ""),
      onCreateGhost: (label) => void createGhost(label),
    });

    // ---- the panel's width --------------------------------------------------
    // Persisted in localStorage and deliberately NOT in fused.params. Params are
    // the view state a shared URL should reproduce (MD-20) — which note, which
    // heading, sidebar open, graph depth, read-only or editing. How wide someone
    // dragged their panel is personal window furniture, and inheriting it from
    // a link would be a bug, not a feature.
    const gripEl = document.getElementById("side-grip");
    const SIDE_KEY = "fused-md-side-width";
    const SIDE_MIN = 15 * 16;   // 15rem — narrower and the backlink rows wrap badly
    const SIDE_MAX = 45 * 16;   // 45rem — wider and the note itself is squeezed

    function applySideWidth(px, persist) {
      // The note keeps at least 20rem whatever the stored width says: 45rem of
      // panel in a narrow window would otherwise squeeze the prose to a word per
      // line, and a width stored on a wide monitor travels to a narrow one.
      const room = document.getElementById("split").getBoundingClientRect().width;
      const max = Math.max(SIDE_MIN, Math.min(SIDE_MAX, room - 20 * 16));
      const width = Math.min(max, Math.max(SIDE_MIN, Math.round(px)));
      sideEl.style.width = width + "px";
      // A canvas is a fixed-size bitmap: its backing store only follows its CSS
      // box when something tells it to, and nudge() is that (it re-measures and
      // re-runs the sim, which also re-frames the graph for the new shape).
      canvas.nudge();
      if (persist) {
        try { localStorage.setItem(SIDE_KEY, String(width)); }
        catch (e) { /* private mode — the width is a nicety */ }
      }
    }

    function storedSideWidth() {
      try {
        const raw = parseInt(localStorage.getItem(SIDE_KEY) || "", 10);
        return Number.isFinite(raw) ? raw : 0;
      } catch (e) { return 0; }
    }

    gripEl.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      const startX = event.clientX;
      const startWidth = sideEl.getBoundingClientRect().width;
      gripEl.setPointerCapture(event.pointerId);
      // Dragging LEFT widens: the panel is on the right, so its width grows as
      // the pointer moves away from it.
      const onMove = (move) => applySideWidth(startWidth + (startX - move.clientX), false);
      const onUp = () => {
        gripEl.removeEventListener("pointermove", onMove);
        gripEl.removeEventListener("pointerup", onUp);
        gripEl.removeEventListener("pointercancel", onUp);
        applySideWidth(sideEl.getBoundingClientRect().width, true);
      };
      gripEl.addEventListener("pointermove", onMove);
      gripEl.addEventListener("pointerup", onUp);
      gripEl.addEventListener("pointercancel", onUp);
    });

    gripEl.addEventListener("keydown", (event) => {
      const step = event.key === "ArrowLeft" ? 16 : event.key === "ArrowRight" ? -16 : 0;
      if (!step) return;
      event.preventDefault();
      applySideWidth(sideEl.getBoundingClientRect().width + step, true);
    });

    function graphOn() { return fused.params.get("graph") === "1"; }
    // -1 is the `all` option: graph.py skips the neighbourhood filter for a
    // negative depth, so the panel shows the whole vault with the focus still
    // drawn apart. Anything outside [-1, 3] is not one of our options, so it
    // falls back rather than being sent on.
    function graphDepth() {
      const n = parseInt(fused.params.get("depth") || "1", 10);
      return Number.isFinite(n) && n >= -1 && n <= 3 ? n : 1;
    }

    async function loadGraph() {
      if (!graphOn() || !file) return;
      const root = fused.params.get("root") || "";
      let data;
      try {
        data = await fused.runPython("./graph.py",
          { action: "graph", file, root, depth: String(graphDepth()) },
          { key: "md-graph" });
      } catch (err) {
        data = { error: "graph_failed", message: err.message || String(err) };
      }
      if (data.error) {
        // A mount-backed root is refused outright rather than walked (MD-11);
        // say so instead of drawing an empty canvas.
        canvas.setData({ nodes: [], edges: [] });
        graphCountEl.textContent = "";
        graphNoteEl.hidden = false;
        graphNoteEl.textContent = data.message || data.error;
        return;
      }
      graphNoteEl.hidden = !data.truncated;
      if (data.truncated) graphNoteEl.textContent = "Partial: the walk hit a cap.";
      // Notes compared with notes: `nodes` also carries ghost nodes, so a bare
      // length reads "221 of 205 notes" on the `all` depth — and was quietly
      // overcounting at every other depth too.
      const shownNotes = data.nodes.filter((n) => n.kind === "note").length;
      graphCountEl.textContent = `${shownNotes} of ${data.total_notes} notes`;
      canvas.setData(data);
    }

    toggleEl.addEventListener("click", () => {
      fused.params.set("graph", graphOn() ? "0" : "1");
    });

    // Leaving editing must not lose edits newer than the last autosave — the
    // same reason navigation flushes first (MD-16). The param is set only after
    // the flush, so the rebuild it triggers cannot race the write.
    editToggleEl.addEventListener("click", async () => {
      if (!writable) return; // disabled anyway; belt and braces (MD-15)
      const next = editWanted() ? "0" : "1";
      if (next === "0") await save();
      fused.params.set("edit", next);
    });

    depthEl.addEventListener("change", () => fused.params.set("depth", depthEl.value));

    // The button's own state, and — when the mode actually changed — the
    // rebuild that applies it. `editable` is a facet chosen at construction
    // here, so the view is rebuilt rather than reconfigured; buildEditor carries
    // the caret and the scroll position across, which is what makes that
    // invisible.
    function applyEditMode(rebuild) {
      const on = editing();
      // Pressed = EDITING, the non-default state (see the button's markup).
      editToggleEl.setAttribute("aria-pressed", String(on));
      editToggleEl.disabled = !writable;
      editToggleEl.title = writable
        ? (on ? "Editing — click to read only" : "Read-only — click to edit")
        : "This file can't be written, so it is always read-only.";
      if (rebuild && view) buildEditor(view.state.doc.toString());
    }

    // One toggle for the whole sidebar: backlinks and the graph are the same
    // panel, as they are in Obsidian's right sidebar. The state lives in a
    // param, so an open sidebar is part of a shareable URL.
    function applySidebar() {
      const on = graphOn();
      sideEl.classList.toggle("on", on);
      toggleEl.setAttribute("aria-pressed", String(on));
      depthEl.value = String(graphDepth());
      if (on) {
        // A stored width is applied here rather than at load: the panel has no
        // box at all while it is hidden, so measuring or nudging then is moot.
        const stored = storedSideWidth();
        if (stored) applySideWidth(stored, false);
        canvas.nudge(); // the canvas had zero size while the panel was hidden
        // renderOutline draws nothing while the panel is closed, so opening it is
        // the moment to draw what the document says now.
        renderOutline();
        void loadGraph();
      }
    }

    function fail(html, isError) {
      skelEl.hidden = true;
      statusEl.hidden = false;
      statusEl.classList.toggle("error", isError === true);
      statusEl.innerHTML = html;
    }

    // ---- load --------------------------------------------------------------
    async function load() {
      file = fused.params.get("_file");
      if (!file) {
        fail("No file selected (missing _file param).", true);
        return;
      }
      const rawUrl = fused.rawUrl(file);
      try {
        const st = await fused.stat(file);
        if (st.size !== null && st.size !== undefined && st.size > MAX_BYTES) {
          fail(`File is too large to edit inline (${st.size.toLocaleString()} bytes).
            <a href="${rawUrl}" target="_blank" rel="noopener">Open raw</a>`, false);
          return;
        }
        text = await fused.readFile(file);
        mtime = st.mtime;
        writable = st.writable !== false; // absent field (older server) → editable
      } catch (err) {
        fail(`Failed to load file: ${escapeHtml(err.message)}`, true);
        return;
      }

      fusedRoBadge.update(document.getElementById("ro"),
        writable ? "" : "Read-only",
        writable ? "" : "This file can't be written, so the editor opens locked.");

      skelEl.hidden = true;
      buildEditor(text);
      applyEditMode(false); // the view was just built with the mode applied
      scrollToHeading();
      // The link scan runs alongside the first build; a failed or refused scan
      // degrades to plain markdown rather than blocking the document, and
      // refreshLinks re-decorates once it lands.
      await refreshLinks();
      lastGraph = (fused.params.get("graph") || "0") + "/" + (fused.params.get("depth") || "1");
      lastEdit = fused.params.get("edit") || "0";
      applySidebar();
    }

    // Params are the state: the sidebar toggle, the depth and the mode all write
    // params, and this is the single re-render path — which is also what makes a
    // graph view (and now a reading view) URL-shareable, unlike Obsidian's.
    let lastGraph = null;
    let lastEdit = null;
    fused.params.onChange((params) => {
      const key = (params.graph || "0") + "/" + (params.depth || "1");
      if (key !== lastGraph) {
        lastGraph = key;
        applySidebar();
      }
      const edit = params.edit || "0";
      if (edit !== lastEdit) {
        lastEdit = edit;
        applyEditMode(true);
      }
    });

    load();
  </script>
</body>
</html>
