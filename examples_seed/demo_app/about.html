<!DOCTYPE html>
<html data-fused-theme="shell">
<head>
<meta charset="utf-8" />
<title>Demo App — About</title>
<style>
  :root {
    color-scheme: dark;
    --fg: #e8eaed; --fg-muted: #9aa0a6; --border: #2a2d33;
    --bg: #131417; --bg-alt: #1b1d21;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --fg: #1f2023; --fg-muted: #61656c; --border: #d8dade;
    --bg: #ffffff; --bg-alt: #f4f5f7;
  }
  body {
    margin: 0; padding: 40px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--fg); background: var(--bg);
  }
  h1 { font-size: 20px; }
  dl { max-width: 30rem; }
  dt { color: var(--fg-muted); font-size: 12px; margin-top: 12px; }
  dd { margin: 2px 0 0; }
</style>
</head>
<body>
  <h1>About</h1>
  <dl>
    <dt>App</dt><dd>Demo App v0.1.0</dd>
    <dt>What it shows</dt><dd>The fused_app.json manifest format: entry page, pages list, title and metadata.</dd>
    <dt>Author</dt><dd>fused-render</dd>
  </dl>
</body>
</html>
