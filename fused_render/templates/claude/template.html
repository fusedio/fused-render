// one and left the pane it governs with no chrome of its own.
// NARROW layout (<800px): back into #anntools. There is no persistent left
// column below the breakpoint — one view shows at a time — so there is nothing
// to hang a bar on, and #anntools is the one row BOTH views keep on screen
// (which is why the Chat ⇄ Preview toggle lives there too).
//
// ONE element, MOVED, never two copies: the control is a single subtree —
// trigger, listbox and every listener — and a DOM move carries all of it, so
// relocating it cannot desync from `leftmode` the way a second control would.
// The move is skipped when the element is already in the right host, so a
// params.onChange storm cannot yank an open popup shut.
//
// TDZ, worth stating: this reads NARROW_MQ and calls renderAnn, both declared
// further down the file. Every caller is reached only AFTER the script has
// finished executing — the loader awaits a fetch before its call, and the media
// listener fires later still — which is the same guarantee enterNoPane relies on.
const leftBar = document.getElementById("leftbar");
// Whether the bar was showing at the end of the last call, so the pin
// re-measure below fires on a CHANGE rather than on every call.
let leftBarShown = false;
function placeLeftPicker() {
  // No pane, no hosts: enterNoPane removed #left (with #leftbar inside it) and
  // #anntools, so every lookup here would be null.
  if (noPane) return;
  const wide = !NARROW_MQ.matches;
  // Nothing to pick means no bar at all — an empty bordered strip above the
  // preview would be chrome for a choice that does not exist. buildLeftPicker
  // leaves the select `hidden` in exactly that case, so it is already the
  // answer; the bar just follows it.
  const show = wide && !leftSel.hidden;
  // Looked up rather than closed over: `viewbtn` has a const of its own further
  // down (viewBtn), and a second `const` of the same name here would be a
  // redeclaration. In the shared strip the picker belongs BETWEEN the annotate
  // switch and the view toggle — appending would put it after #viewbtn, and the
  // toggle must stay the row's last word (it is the way out of the preview).
  const host = wide ? leftBar : document.getElementById("anntools");
  if (leftSel.parentElement !== host) {
    host.insertBefore(leftSel, wide ? null : document.getElementById("viewbtn"));
  }
  leftBar.hidden = !show;
  if (show === leftBarShown) return;
  leftBarShown = show;
  // The bar is a row ABOVE #leftview, so showing or hiding it changes that
  // box — and the pins are positioned in #leftview coordinates. Re-measure
  // twice, for the two reasons applyNarrowView spells out at its own renderAnn
  // pair: reading a rect flushes THIS document's layout now, and the framed
  // document only reflows to the iframe's new height on the next frame.
  renderAnn();
  requestAnimationFrame(renderAnn);
}

// Frame whatever `leftmode` now names. Re-derived from the entry list stat
// already gave us — never a second stat.
function applyLeftMode() {
  const t = curLeftEntry();
  if (!t || t.mode === framedMode) return;   // idempotent: onChange fires for
                                             // every param, `split` included
  const frame = document.getElementById("leftframe");
  if (!frame) return;   // the boot error path removed it; nothing to swap
  // RESOLVED BEFORE ANYTHING IS COMMITTED. paneSrcFor throws for an offerable
  // entry with no `path`, and `framedMode` is the record of what the iframe IS
  // showing — writing it first left it naming a mode the frame was never pointed
  // at, which then made the idempotence guard above SKIP the retry, and the throw
  // propagated out of the params.onChange listener so applyNarrowView() and
  // renderAnn() were skipped for that tick with the runtime quietly logging it.
  // Only reachable if a non-sentinel offerable entry lacks `path`, which stat does
  // not produce today — so this is ordering discipline, not a live bug, and the
  // ordering is pinned by a test rather than left to be remembered.
  const src = paneSrcFor(t);
  framedMode = t.mode;
  syncLeftPicker(t);
  // ANNOTATIONS SURVIVE THE SWAP, deliberately. Every pin is anchored to an
  // element of the LEFT document (anchorId, or a tag:nth-of-type path), so a new
  // left view invalidates the anchors — the same note points at nothing in
  // `code` that it pointed at in `markdown`. Dropping the list on a switch was
  // the other option and is worse: the notes live in the `annotations` param
  // because they are the user's words, they are still perfectly sendable as
  // text, and losing them to a click on a view picker would be data loss with no
  // warning. So the list stays and only the POSITIONS are recomputed: an
  // unresolvable anchor already means "no pin this frame, the chip still shows
  // it" (see renderAnn), and #leftframe's `load` handler re-wires the fresh
  // document and calls renderAnn() itself — which is why there is no renderAnn
  // here, unlike the divider drag, where no load event is coming.
  frame.src = src;
}

// ── no pane at all: the ordinary folder's full-width chat (D239) ──────────
//
// THE HAZARD THIS SHAPE EXISTS TO AVOID. The obvious implementation — ship the
// markup without `#leftframe` for this target — cannot work, and it fails in a
// way that hides itself. The frame's `load` hook is wired at TOP LEVEL; with no
// element to wire, that statement throws a TypeError, which aborts every
// declaration after it: the agent poll loop, the annotate switch, the composer
// wiring.
// The boot catch below cannot report that either, because its first statement is
// `.remove()` on the same missing element — so the throw lands INSIDE the catch
// and neither the error panel nor pushAppLog ever runs. A blank page with a
// working-looking composer.
//
// So the pane is a designed ABSENCE, not a missing element: the markup ships the
// column exactly as it does for a file, every declaration initialises against
// it, and this function takes it away afterwards. "Afterwards" is guaranteed,
// not hoped for — this whole file is ONE <script>, and the loader below reaches
// here only after `await`ing a fetch, so the script has finished executing
// before the first node is removed.
//
// Removed rather than hidden, because there is no state in which any of it is
// wanted again: the target's kind does not change mid-session (a folder that
// grows a tagged entry page gets its pane on the next open, which is where the
// predicate is read). Two subtrees go whole:
//   * #left — the frame, the pins, the highlight and the note popover;
//   * #divider — no two columns, no ratio to drag;
// and #anntools is SLIMMED, not removed: every control in it that acts on the
// pane goes — the annotate switch, the view toggle, and the `leftmode` picker
// when the narrow layout is what put it there (in the split layout the picker
// sits in #leftbar and goes with #left above) — but the kebab STAYS, because
// its one item ("New session in terminal") acts on the TARGET, and a folder
// with no preview is still a thing to open a terminal session on. The strip is
// a child of #chat, so it survives removing #left; with the kebab in it, it is
// no longer the empty bordered row that used to justify taking it too.
// Plus both copies of the screenshot button (#viewshot in the chat composer,
// #hviewshot on the home card): "photograph the WHOLE visible pane" has nothing
// to photograph, and its block's caption names a pane unconditionally.
//
// What this deliberately does NOT do is tidy the URL. `split`, `paneview`,
// `leftmode`, `annmode` and `annotations` left by an old bookmark are IGNORED,
// silently — the same forgiving posture PT-9 takes for an unknown `_mode`.
// Deleting them would break the bookmark's round trip for the day that folder
// becomes an app and gets its pane back.
// ORDER MATTERS HERE, and both of the first two steps are undoing something the
// BOOT already did on the strength of a param, before anyone knew there was no
// pane. Both were live bugs found by opening a folder URL that still carried an
// old bookmark's `annotations` and `paneview=preview`.
//
// CHAT_ONLY takes this same path (paneURL answers `null` for every kind there)
// and it is the one caller for which "no pane of ours" is NOT "nothing to
// annotate": the host has a pane, it is marked, and the notes point at it. So
// the three annotation steps below are the ones that ask first — the list is
// kept, the mode is left as the boot default found it, and the switch stays in
// the strip. Everything else — the column, the divider, the picker, the view
// toggle, the narrow view classes — goes exactly as it does for a folder,
// because all of that is about OUR layout and our layout really is gone.
function enterNoPane() {
  // 1. Drop the notes and repaint, while `noPane` is still false so renderAnn
  //    actually runs. In-memory only: `pending` is what composeOutgoing reads,
  //    so an emptied list is what stops a note anchored to a document that no
  //    longer exists from riding the next message — and the boot renderAnn had
  //    ALREADY painted a chip per composer from the `annotations` param, which a
  //    later `noPane` early-return would have frozen on screen. A chip showing a
  //    note that cannot be sent is a worse lie than no chip. The param itself is
  //    left alone (see above): this drops the list, it does not rewrite the URL.
  //
  //    Not in CHAT_ONLY: there the notes are anchored to the HOST's pane, which
  //    is still on screen — notes added THIS visit (the boot list is empty in a
  //    sidebar; see annLoad's caller) are still sendable, and emptying them
  //    because we took OUR column away would silently discard a live review.
  if (!CHAT_ONLY) annotations = [];
  renderAnn();
  noPane = true;
  // 2. Through annSetMode, the one door in and out of the mode: the boot default
  //    already armed it. With `noPane` set the call is a plain disarm that writes
  //    no param (see there). CHAT_ONLY skips it for the same reason as step 1 —
  //    annSetMode's own guard is `annCapable()`, not `noPane`, so a disarm here
  //    would be a real disarm of a mode that still has a target.
  if (!CHAT_ONLY) annSetMode(false);
  // 3. And drop the narrow layout's view class, which boot stamped from
  //    `paneview`. It has to go rather than be left inert: `view-preview`
  //    collapses #chat to its #anntools strip inside the 800px block, and with
  //    the strip removed and no pane to show instead, a narrow host would have
  //    rendered a blank page. applyNarrowView returns early from here on, so
  //    nothing puts either class back.
  document.body.classList.remove("view-preview", "view-chat");
  // 4. Slim the strip to the two controls that outlive the pane: #back (the
  //    way back to the chat list; the home view hides it by CSS, same as ever)
  //    and the kebab. The `nopane` class hands the kebab the row's auto margin
  //    — #annbtn, the usual owner, is about to leave the document — so the ⋮
  //    keeps the right-hand seat it has in every other layout. (In CHAT_ONLY the
  //    switch stays and takes its margin back; the stylesheet says so, scoped to
  //    a switch that is actually THERE and not merely hidden.)
  document.body.classList.add("nopane");
  // 5. Rescue the note composer BEFORE the column it lives in is removed — it
  //    is declared inside #leftview, and the loop below takes #leftview's
  //    ancestor out of the document.
  //
  //    #chat is where it comes to REST, not where it works. The composer
  //    describes an element in the host's pane, so when it opens it is portaled
  //    into that pane's document and placed at the click (annPortalPop), and
  //    annCloseComposer brings it back here. This move is what gives it a seat
  //    to come back to, and it doubles as the fallback for the one case with no
  //    point to aim at — a note whose element no longer resolves — which the
  //    `sidebar` class positions under the #anntools strip. See the stylesheet.
  //
  //    The close FIRST, because this teardown is not the first thing that can
  //    happen to the composer. paneURL awaits a fetch before it answers `null`,
  //    and the poll that injects the annotation layer and wires the pane's click
  //    handler ran at the end of the script — so a reader who clicks the pane in
  //    that gap has an open composer, portaled, before this line is reached.
  //    Yanking a live one across documents with `appendChild` would leave it
  //    visible in the chat column at a coordinate that meant something in
  //    someone else's viewport. Closing it is the same close Escape does, and it
  //    is what puts the node back in this document so the move below is a move
  //    within one document again.
  if (CHAT_ONLY) {
    annCloseComposer();
    annPop.classList.add("sidebar");
    document.getElementById("chat").appendChild(annPop);
  }
  // The switch and both screenshot buttons are the exception CHAT_ONLY buys: they
  // act on the HOST's pane now, which this layout still has (annCapable, not
  // `noPane`, is what either of them asks). Everything else in this list acts on
  // the column being removed — and for an ordinary folder, where nothing is
  // hosted either, "photograph the whole visible pane" has nothing to photograph,
  // so the buttons go with it rather than sitting there as a promise.
  const hostedControls = new Set(["annbtn", "annrec", "anntool", "viewshot", "hviewshot"]);
  for (const id of ["annbtn", "annrec", "anntool", "viewshot", "hviewshot", "leftmode",
                    "viewbtn", "left", "divider"]) {
    if (CHAT_ONLY && hostedControls.has(id)) continue;
    const el = document.getElementById(id);
    if (el) el.remove();
  }
}

// ── left pane: the target's ordinary preview ─────────────────────
// Held as a promise (not just fired) because `targetNoun` — the page's ONE
// answer to "what kind of thing is this chat about" — is set inside paneURL,
// and the landing page's own boot needs that answer before it can decide
// whether to show the snapshots panel. Never rejects: the catch below is inside
// it, so awaiting this is only ever a wait, not a second failure path.
const paneReady = (async () => {
  try {
    const src = await paneURL();
    if (src === null) { enterNoPane(); return; }
    document.getElementById("leftframe").src = src;
    buildLeftPicker();
    // Build first, then place: placeLeftPicker asks the built picker whether it
    // has anything to offer (`leftSel.hidden`) before deciding the bar exists.
    placeLeftPicker();
  } catch (err) {
    // Swap only the iframe for the message — #leftview also hosts the annotation
    // layer (button, pins, highlight, popover), and wiping it would leave JS
    // driving detached nodes. No app, nothing to annotate: hide the toggle.
    //
    // EVERY LOOKUP HERE IS NULL-CHECKED, and that is not defensive padding: this
    // catch also covers a throw from enterNoPane(), by which point the elements
    // it names may already be out of the document. An unguarded `.remove()` here
    // would throw INSIDE the catch and take the error panel and the pushAppLog
    // with it — the same self-hiding failure the no-pane branch exists to avoid,
    // one layer down. If we got here after the column was removed there is no
    // #leftview to put a message in, so only the log leg runs.
    const frame = document.getElementById("leftframe");
    if (frame) frame.remove();
    const btn = document.getElementById("annbtn");
    if (btn) btn.style.display = "none";
    const host = document.getElementById("leftview");
    if (host) {
      const d = document.createElement("div");
      d.id = "msg";
      d.textContent = "Could not open preview: " + err.message;
      host.prepend(d);
    }
    // Tell Claude too: "the pane is showing an error instead of your app" is the
    // most important thing the state channel can carry, and from here the iframe
    // is gone (appWindow returns null forever) so nothing else will report it.
    pushAppLog("error", "the left pane could not open the preview: " + err.message);
  }
})();

// ── resizable divider; the split ratio is view state, so it lives in a param ──
const leftEl = document.getElementById("left");
const clampPct = (pct) => Math.min(80, Math.max(20, pct));
// The narrow single-view layout's breakpoint, duplicated from the media query at
// the end of the stylesheet because applySplit has to know about it — see below.
// A `matchMedia` object rather than a width comparison so the two stay one
// definition and one evaluation: `innerWidth < 800` and the media query disagree
// about a scrollbar's width, and that disagreement is a half-collapsed layout.
const NARROW_MQ = window.matchMedia("(max-width: 800px)");
function applySplit() {
  // No pane, no ratio: #left is out of the document (enterNoPane), so there is
  // nothing to size and `split` describes a layout this target does not have.
  if (noPane) return;
  // Below the breakpoint the stylesheet owns #left's width (one view at a time,
  // no divider, nothing to be a ratio OF), and an inline width would beat it —
  // inline outranks every rule short of the CSS force flag, which this file does
  // not use (D146). So the inline declaration is CLEARED while narrow and rewritten
  // from the param on the way back out; the param itself is never touched, so
  // the wide layout always returns with the user's own ratio, with no reload.
  // The divider is hidden while narrow, so nothing can write a width behind this.
  if (NARROW_MQ.matches) { leftEl.style.width = ""; return; }
  leftEl.style.width = clampPct(parseFloat(fused.params.get("split") || "70")) + "%";
}
applySplit();

document.getElementById("divider").addEventListener("mousedown", (e) => {
  e.preventDefault();
  document.body.classList.add("dragging");
  const move = (ev) => {
    leftEl.style.width = clampPct((ev.clientX / window.innerWidth) * 100) + "%";
    renderAnn();  // pins are positioned in #leftview coordinates — track the drag
  };
  const up = (ev) => {
    document.body.classList.remove("dragging");
    window.removeEventListener("mousemove", move);
    window.removeEventListener("mouseup", up);
    fused.params.set("split", clampPct((ev.clientX / window.innerWidth) * 100).toFixed(1));
  };
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
});


// ── annotations: element-anchored notes on the left app, sent with the ──
// next chat message. The anchor model is the annotate template's (anchorId
// when the element has an id, else a tag:nth-of-type path from <body>; iu/iv
// content-box fractions on images/canvas/video) — element-level, never
// screenshots or raw coordinates, so Claude can map each note straight back
// to the app's HTML source. Lifecycle: pending → `sent` (stamped when a
// message carries it; pin dims) → gone (auto-resolved when that run finishes
// cleanly). The list is persisted in the `annotations` param so a reload
// mid-review keeps the pins — which, since this page sets no param boundary,
// means the URL the runtime writes to: this frame's own when it is the page,
// the SHELL's when it is framed (D46/D72).
//
// Framed (CHAT_ONLY) the param is WRITE-ONLY: the shell tears this document
// down on every sidebar mode switch (the frame is keyed on the mode) and on a
// close, so "the page reloaded" and "the user left for Git and came back" are
// the same event here — indistinguishable at boot. Hydrating meant the second
// one re-armed pins for a review the user had walked away from, sent receipts
// included. So a sidebar boot starts empty and the stale param is ignored, not
// rewritten — the posture every other stale param gets (see enterNoPane).
const annBtn = document.getElementById("annbtn");
const annRecBtn = document.getElementById("annrec");
const annDiscardBtn = document.getElementById("anndiscard");
// The buttons' wrapper: annRecEnd stamps `.busy` on it while a transcription
// runs, the one state the two buttons' own classes cannot express (recording
// over, mode still armed, words on their way).
const annCta = document.getElementById("anncta");
// The Comment button's one writable text seat — the clock while a recording
// runs, "Transcribing…" after. The icon SVGs and word spans beside it are
// baked into the markup, and writing the button's textContent would erase them.
const annRecLbl = document.getElementById("annreclbl");
const annPop = document.getElementById("annpop");
const annTa = annPop.querySelector("textarea");
const annChipsEls = [
  document.getElementById("annchips-home"),
  document.getElementById("annchips-chat"),
];

// The pictures waiting to ride the NEXT message. Each entry is
// `{kind, view, viewNote, thumb, name?}` — `kind` being `"pane"` for a capture of
// the preview and `"image"` for a file the user pasted or dropped in — and each is
// drawn as one chip above both composers.
//
// A LIST, where D285 kept a single shot, and the rule that made it one is intact
// inside the list rather than abandoned: "the pane, now" still has exactly one
// answer, so a second camera click REPLACES the `pane` entry (shotAttachPane) and
// never stacks two pictures of the same screen. What the list adds is the other
// kind — a screenshot the user already had, from another app, from a phone, from a
// bug report — which has no such uniqueness and for which "the last one wins"
// would be an arbitrary limit rather than a fact about the subject. One list and
// not two because everything downstream treats them identically: same chip, same
// viewer, same ✕, same receipt, same wire block. The only thing `kind` decides is
// the words.
//
// Deliberately NOT persisted to a param the way `annotations` is. A note is the
// user's words and survives a reload worth keeping; these are temp files and blob
// URLs, both of which a restored page would hold a dead handle to — and a bookmark
// that re-attaches yesterday's picture of a screen that has since changed is worse
// than one that attaches nothing.
//
// Declared UP HERE with the annotation state rather than beside the button that
// fills it, for the same reason `annObserver` is: renderAnn draws its chips, and
// the boot renderAnn runs several hundred lines above that wiring — a `let` read
// before its declaration is a temporal-dead-zone ReferenceError, not an undefined.
let shotAttached = [];

// ── the annotate target: WHICH document a note points at ──────────────────
// Bindings rather than constants, and that is the entire retargeting
// mechanism: everything downstream (renderAnn, annPlaceHl, annSetMode, the
// capture, the anchor extraction) names them and never asks which layout it is
// in. Standalone and full-split they hold exactly what they always held — our
// own frame and the overlay nodes sitting over it in #leftview — so that path
// is unchanged by construction. CHAT_ONLY repoints them (annSyncTarget).
//

// Pixel surfaces: a click on an image/canvas/video records iu/iv — fractions

  if (el.tagName === "IMG" && el.naturalWidth > 0) return { w: el.naturalWidth, h: el.naturalHeight };

// The retargeted layout needs no second reading of this and that is why the
// injected layer is `position: fixed` inside the target's own document: its box
// is that document's viewport, so "the element's rect inside its frame" goes on
// being the whole answer — see annInjectLayer.

function annLabelFor(i) {

function renderAnn() {
  // No pane, no pins and no chips: both hosts (#annpins over the frame, the two
  // #annchips rows in the composers) describe notes anchored to a document this
  // target does not have, and #annpins itself is out of the document. `annotations`
  // is already emptied by enterNoPane, so this is belt-and-braces against a later
  // caller — of which there are five, including a params.onChange for EVERY param.
  //
  // CHAT_ONLY is `noPane` too and means none of that: the notes point at the
  // host's pane, and the chips are the payload of a message this chat can still
  // send. So the flag stops being the whole answer here and the two halves are
  // asked separately — the pins need a layer (annSyncTarget hands back nulls
  // when the host is showing nothing marked), the chips need only the list.
  //
  // The ATTACHED PICTURES are a third case and they are why this is not a bare
  // return any more: a pasted or dropped screenshot has nothing to do with a pane
  // — it is a file the user brought in, and a folder with no app entry is exactly
  // where they are most likely to bring one — so its chip has to be drawn even
  // where there is no document to annotate. (The camera stays hidden there:
  // `annCapable()` is false, and there is genuinely nothing to photograph.)
  if (noPane && !CHAT_ONLY) { renderShotChips(); return; }
  annSyncTarget();
  // pins over the frame
  if (annPins) {
    annPins.innerHTML = "";
    annPins.style.display = annOn ? "" : "none";
  }
  const doc = annOn && annPins ? annTargetDoc() : null;
  // #leftview, not #left: pins are placed in FRAME viewport coordinates, so their
  // host must be the box the iframe fills — #left also holds the control strip,
  // and measuring that would put every pin the strip's height too high. Hosted,
  // the same box is the target document's own viewport (annSyncTarget).
  const host = annStageEl;
  annotations.forEach((c, i) => {
    let x, y;
    if (c.kind === "point") {
      // No element to resolve — the anchor IS the coordinate, converted back
      // through whatever the CURRENT scroll is (annPointXY), same as an
      // element's own getBoundingClientRect() is always current.
      // Cross-origin overlay: the coords are overlay-relative and there is no
      // window to read a scroll off — the zero-scroll stand-in keeps the one
      // converter honest (see ANN_XO_SCROLL).
      const p = annPointXY(c, (doc && doc.defaultView) || (annXO ? ANN_XO_SCROLL : null));
      if (!p) return;
      x = p.x; y = p.y;
    } else {
      const el = doc ? annResolve(c, doc) : null;
      if (!el) return;  // detached / frame not loaded: the chip still shows it
      if (c.iu != null && c.iv != null && annIntrinsic(el)) {
        const b = annContentBox(el);
        x = b.left + c.iu * b.width; y = b.top + c.iv * b.height;
      } else {
        const r = el.getBoundingClientRect();
        x = r.right; y = r.top;
      }
    }
    // Scrolled out of the framed viewport: no pin this frame — the chip stays.
    if (y < 0 || y > host.clientHeight || x < 0) return;
    // Created in the layer's OWN document: hosted, that is the app's, and a node
    // minted here would be adopted into it on append anyway — doing it by hand
    // keeps the two documents' nodes from being quietly swapped between them.
    const pin = annPins.ownerDocument.createElement("div");
    pin.className = "annpin" + (c.sent ? " sent" : "");
    pin.style.left = Math.min(host.clientWidth - 14, Math.max(14, x)) + "px";
    pin.style.top = Math.max(14, y) + "px";
    pin.textContent = c.sent ? "✓" : annLabelFor(i);
    pin.title = c.sent ? "Sent to Claude: " + c.content : c.content + " — click to edit";
    if (!c.sent) pin.onclick = () => annOpenEditor(c, parseFloat(pin.style.left), parseFloat(pin.style.top));
    annPins.appendChild(pin);
  });

  const pending = annPending();
  annChipsEls.forEach((box) => {
    if (!box) return;
    box.innerHTML = "";
    pending.forEach((c) => {
      const chip = document.createElement("div");
      chip.className = "annchip";
      const lbl = document.createElement("span");
      lbl.className = "pinlbl";
      // A point note's chip leads with the crosshair glyph — the same word the
      // anchor chip used when it was saved — so the two kinds read apart in
      // the pending row without opening either.
      lbl.textContent = (c.kind === "point" ? "⌖" : "") + annLabelFor(annotations.indexOf(c));
      const txt = document.createElement("span");
      txt.className = "txt";
      txt.textContent = c.content;
      txt.title = c.content + " — click to edit";
      txt.style.cursor = "pointer";
      // Edit from the chip too. The popover belongs beside the element the note
      // is about, so resolve that element in the TARGET document (ours in the
      // split layout, the host's pane in the sidebar) and hand annPlacePop its
      // rect — the same coordinates a click on the pin would have produced.
      //
      // Nothing to resolve is where the two layouts part. Standalone the
      // popover has a pane of its own to sit over, so it is roughly centred
      // there and the reader still sees it against the preview. Hosted there is
      // no such consolation prize: a coordinate invented in someone else's
      // viewport would put the composer over an arbitrary part of the app,
      // beside nothing. NULL says so, and annPlacePop parks the composer in
      // this column instead of portaling it to a point that means nothing.
      txt.onclick = () => {
        const d = annTargetDoc();
        // A point HAS a coordinate even with nothing to resolve — reuse it
        // rather than falling all the way to the generic thirds a truly
        // unresolvable element note is stuck with.
        const p = c.kind === "point"
          ? annPointXY(c, (d && d.defaultView) || (annXO ? ANN_XO_SCROLL : null))
          : null;
        const el2 = !p && d ? annResolve(c, d) : null;
        const r = el2 && el2.getBoundingClientRect();
        const w = host ? host.clientWidth : 0, h = host ? host.clientHeight : 0;
        const cx = p ? p.x : r ? r.right : (CHAT_ONLY ? null : w / 3);
        const cy = p ? p.y : r ? r.top : (CHAT_ONLY ? null : h / 3);

      };
      const x = document.createElement("button");
      x.type = "button";
      x.setAttribute("aria-label", "Remove annotation");
      x.textContent = "✕";
      x.onclick = () => {
        // If this note's editor is open, close it — otherwise the popover
        // lingers with annEditing pointing at a deleted id.
        if (annEditing === c.id) annCloseComposer();
        annotations = annotations.filter((a) => a.id !== c.id);
        annSave();
      };
      chip.append(lbl, txt, x);
      box.appendChild(chip);
    });
    // The pictures ride in the SAME row, last and in attachment order, because
    // they are the same kind of thing: something this message is about to carry,
    // shown before it goes.
    for (const shot of shotAttached) box.appendChild(shotChip(shot));
  });
}

// The attached pictures' chips, on their own, for the no-pane target where the
// rest of renderAnn has nothing to draw. Built fresh per box rather than moved
// between them — there are two composers and one node cannot be in both.
//
// It CLEARS the rows, which is what makes it a complete answer rather than an
// append: dropping the last picture has to leave the row empty, and in this
// target there are no annotation chips it could wipe (enterNoPane empties
// `annotations`).
function renderShotChips() {
  annChipsEls.forEach((box) => {
    if (!box) return;
    box.innerHTML = "";
    for (const shot of shotAttached) box.appendChild(shotChip(shot));
  });
}

// What one attached picture IS, in the words the chip, the viewer and the alt
// text all use. ONE place, because the same three strings were about to be spelled
// in three — and a pasted image called "preview screenshot" in the receipt is a
// receipt that describes the wrong thing.
function shotNoun(shot) {
  if (!shot) return "picture";
  if (shot.kind === "image") return shot.name || "pasted image";
  if (shot.kind === "overview") return "annotated overview";
  return paneNoun + " screenshot";
}
function shotAlt(shot) {
  if (shot && shot.kind === "image") {
    return "image attached to this message" + (shot.name ? ": " + shot.name : "");
  }
  if (shot && shot.kind === "overview") {
    return "overview of the " + paneNoun + " pane with a badge at each comment";
  }
  return "screenshot of the whole " + paneNoun + " pane";
}

// One attached picture's chip: an annotation chip's pill with the picture where
// the note's words would be.
//
// The thumbnail is a <button>, not an <img>, and that is the smallest edit that
// answers "I could not tell what I was about to send". 22 pixels can prove a
// picture EXISTS; nothing that size can show what is in it. So the chip's job is
// to be a door — it says a shot is attached, and one click opens it at full size
// where the user can actually read it and, if it is the wrong moment, throw it
// away from there.
function shotChip(shot) {
  const chip = document.createElement("div");
  // `shotchip` is only the animation hook (the entrance that says a capture just
  // happened); every other rule it wears is `.annchip`'s, because it IS one.
  chip.className = "annchip shotchip";
  const lbl = document.createElement("span");
  lbl.className = "pinlbl";
  lbl.textContent = "🖼";
  chip.appendChild(lbl);
  if (shot.thumb) {
    chip.appendChild(shotThumbBtn("shotthumb", shot, shotAlt(shot)));
  }
  const txt = document.createElement("span");
  txt.className = "txt";
  // Says WHICH it is. "here is your picture" and "no picture, and here is why" are
  // different facts, and the second is the one a user has to be told BEFORE they
  // press send — that is the whole advantage of attaching on the gesture rather
  // than during the send, where a failure could only be reported afterwards.
  txt.textContent = shot.view ? shotNoun(shot)
    : (shot.kind === "image" ? "image failed" : "screenshot failed");
  // The path, or the reason there is none. Hovering a crop's receipt shows the
  // same thing, for the same reason: what the agent was handed is checkable.
  txt.title = shot.viewNote || shot.view || "";

  x.type = "button";
  x.setAttribute("aria-label", "Remove " + shotNoun(shot));

}

// A thumbnail that opens the viewer: one <button><img> for every place a
// screenshot is shown small — the pending chip and every sent turn's receipt.
// ONE builder because they are one affordance, and a picture the user can open
// while drafting but not after sending (or the other way round) is exactly the
// inconsistency that makes a control feel arbitrary.
//
// A real <button>, so it is tabbable, Enter/Space activates it and it is
// announced as something to press — none of which an <img> with an onclick is.
// `shot` is `{view, viewNote, thumb, src}`: `src` is what to DISPLAY (a blob URL

function shotThumbBtn(cls, shot, alt) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = cls;

  img.alt = alt;

const annDelBtn = document.getElementById("anndel");

// The composer's one line of context: the placeholder names the KIND of thing
// the note is pinned to. The anchor chip that used to spell the target out —
// and flip a click between its two readings — left the card (Akshil,
// 2026-08-19): the strip's Element/Point picker owns that choice up front
// now, and Alt is still the one-click override, so the card is just the words.
function annPaintPlaceholder(anchor) {
  annTa.placeholder = anchor && anchor.kind === "point"
    ? "What about this spot?" : "What about this element?";
}

// ── the composer's two seats ──────────────────────────────────────────────
// Is #annpop currently living in someone else's document? OWNERSHIP is the
// question, not parentage, and that is what makes the answer survive everything
// that can happen to the node while it is away: a pane that reloads leaves it
// parented to a dead shadow tree, an `adoptNode` that lands and an `appendChild`
// that then throws leaves it parented to nothing at all. `ownerDocument` is
// what `adoptNode` changes and the only thing that is still true in both.
//
// It is also the reason there is no remembered home node. One used to be
// captured at the first portal, which was a race with a teardown that had not
// run yet — see annUnportalPop.
const annPortaled = () => annPop.ownerDocument !== document;

// beside the element it describes. An iframe cannot paint outside its own box,
// and the target is a sibling frame elsewhere in the host's layout — so there is
// no placement in this column that puts the text box next to the ring. The node
// has to go there.
//
// The node, not a copy. Everything the composer is lives on it: the keydown
// handler that saves on Enter and closes on Escape, the delete button's click,
// the textarea's current text. All of those are addEventListener bindings and
// closures over THIS document's state (`annotations`, `annDraft`, `annEditing`,
// the chat composer), and a moved node keeps every one of them — a rebuilt
// popover would be a second implementation to keep in step. `adoptNode` is
// spelled out even though `appendChild` would adopt implicitly: the ownership
// change is the whole point of this function, and it should read like it.
//

  } catch (err) {
    return false;   // document torn down mid-gesture: park it instead
  }

}
// And back again, on every close. Not merely tidiness: a pane that reloads or a

// in the document that owns it.
//

// visit. Remembering it was a race: annPollTarget injects the layer and wires

// which is what moves the composer out of #leftview and into #chat — waits on
// an `await fetch` inside paneURL. A click in the pane that lands in that gap
// portals a composer whose parent is still #leftview, and #leftview is exactly

// a detached column, i.e. a composer that opens into nothing. Asking the
// document is a question with only one right answer at any moment.
//

// portal INTO — annLayerRoot is null without a marked frame), so every node

// (x, y) are the click's FRAME viewport coordinates — the same space the pins

//

// viewport (#leftview over our own iframe; the `fixed` layer host inside the

// push the box off the pane.
//
// CHAT_ONLY only adds the question of WHERE the node lives, and the answer has
// exactly one fallback: null coordinates (the chip-edit path, for a note whose

function annOpenComposer(x, y, anchor) {
  annDraft = anchor;
  annEditing = null;
  annDelBtn.hidden = true;
  annPaintPlaceholder(anchor);
  annTa.value = "";
  annPlacePop(x, y);
}
// Reopen a PENDING note for editing (a sent one is already in the transcript
// and can't be recalled — its pin is inert). The anchor stays as captured;
// only the text is editable.
function annOpenEditor(c, x, y) {
  // Toggle: clicking the same note's marker while its editor is open closes it.
  if (annEditing === c.id && annPop.style.display === "block") {
    annCloseComposer();
    return;
  }
  annDraft = null;
  annEditing = c.id;
  annDelBtn.hidden = false;
  annPaintPlaceholder(c);
  annTa.value = c.content;
  annPlacePop(x, y);

  // wipe the note.
  annTa.setSelectionRange(annTa.value.length, annTa.value.length);
}
function annCloseComposer() {
  annPop.style.display = "none";
  annDraft = null;
  annEditing = null;

  // reader's (annSetMode's disarm, a chip deleted out from under the editor,
  // annSyncTarget noticing the pane it was lent to is gone). An idle composer
  // parked in someone else's document is a node that a reload can orphan, and
  // this is the single choke point every close already goes through.
  annUnportalPop();

// A message needs no prompt to carry annotations: the comments ARE the
// content, so an annotation-only send goes out with an EMPTY message (the old
// "apply the comments" prefill is gone — canned words told the model nothing
// the notes did not). What DOES ride along is anything the user chose to add:
// `seed` is a walkthrough's spoken intro (everything said before the first
// click), and a draft already typed in the composer is theirs and goes too —
// appended-to rather than clobbered when both exist.
function annPrefillComposer(seed) {
  const home = chatEl.classList.contains("home");
  const el = home ? homebox : box;
  if (seed) {
    const v = el.value.trim();
    el.value = v ? v + "\n\n" + seed : seed;
  }
  (home ? growHome : growBox)();

// Click anywhere outside the popover dismisses it. mousedown, not click, so
// it fires before the target's own handlers; pins and chips are exempt — their
// click handlers own the toggle/reopen behavior and a mousedown-close here
// would make the pin's toggle reopen instead.
//
// THIS document's half of the dismissal. The other half hangs off the target's
// document (annWireTarget), because a click inside a frame never bubbles out of
// it, and while portaled the composer is over there — so each document dismisses
// what the other cannot see, and each exempts the composer's own subtree. The
// `contains` below covers it here; over there the event RETARGETS at the shadow
// boundary, so a mousedown in the textarea arrives as the layer host and the
// layer's own exemption already catches it.
document.addEventListener("mousedown", (e) => {
  if (annPop.style.display !== "block") return;
  const t = e.target;
  // The strip's own controls are exempt alongside the pins and chips: a
  // mousedown on ✓ Done used to close the composer HERE, before the click
  // could reach annDone, silently dropping the words the user was about to
  // send (Bugbot, PR #664). The Element/Point picker rides along — choosing
  // the next click's tool is not walking away from this note.
  if (annPop.contains(t) || (t.closest && (t.closest(".annpin") || t.closest(".annchip")

  annCloseComposer();
});
annDelBtn.addEventListener("click", () => {
  if (annEditing) annotations = annotations.filter((a) => a.id !== annEditing);
  annSave();
  annCloseComposer();
});
// Save whatever the composer holds — the one commit path, the Enter key's.
// Nothing here awaits any more: a note's picture is the send-time overview
// screenshot (annCaptureOverview), taken once for the whole message rather
// than per note at save time.
async function annCommit() {
  const content = annTa.value.trim();
  const isNew = !!(content && annDraft);
  if (isNew) {
    annotations.push({ id: crypto.randomUUID(), content, createdAt: Date.now(), ...annDraft });
    annSave();
  } else if (content && annEditing) {
    const c = annotations.find((a) => a.id === annEditing);
    if (c && !c.sent) { c.content = content; annSave(); }
  }
  annCloseComposer();
  // Auto-send fires for NEW notes only — editing an existing pending note must
  // not send. Skipped while a turn is in flight (the note stays pending and
  // rides the next message). The message may be EMPTY — an annotation-only
  // send is the normal case — and whatever the user already typed in the
  // composer is theirs and rides along as the message's own words.
  if (isNew && !sending) annAutoSubmit();
}
annTa.addEventListener("keydown", (e) => {
  // stopPropagation, because the document-level Escape binding also kills a live
  // run: without it, closing the composer would end the turn as well (this

  // precedence check up there could not see it).
  if (e.key === "Escape") { e.stopPropagation(); annCloseComposer(); }
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    annCommit();

  // Flags down BEFORE the stop's await (Bugbot, PR #665): the Discard seat
  // stays on screen exactly as long as #annrec.on does, and a discard click
  // landing inside this await used to pass its own guard, call stop() on an
  // already-inactive recorder (InvalidStateError) and delete nothing while
  // this function went on to send the walkthrough it tried to throw away.
  // With the flags (and the face) gone first, that click is a no-op on a
  // seat that is already leaving.
  // The WHOLE session is snapshotted synchronously here (Bugbot, PR #665):
  // the flags drop before the await, and Esc re-enables the seat, so a NEW
  // recording can begin while this one settles — every global read after
  // the await would be the new session's. Chunks, ids, timer and epoch are
  // captured now and the globals handed back fresh; from here down this
  // function touches only its own session.
  const recorder = annRecorder;
  const chunks = annRecChunks;
  const ids = annRecIds;
  const armed = annArmEpoch;
  clearInterval(annRecTimerId);
  annRecTimerId = null;
  annRecChunks = [];
  annRecIds = [];
  annRecorder = null;
  annRecOn = false;
  // The face goes with the flags — the trash and the stop clock leave the
  // strip the moment the choice is made, not after the recorder settles.
  // The picker stays: it follows the MODE (see annSetMode), and the mode is
  // still armed until the disarm below. The selected tool stays too — it is
  // on screen in both flavours of the mode, so carrying a walkthrough's
  // Point into the next typed comment is a visible fact, not a trap.
  annRecBtn.classList.remove("on");
  annRecBtn.setAttribute("aria-pressed", "false");
  annRecBtn.setAttribute("aria-label", "Record a spoken walkthrough");
  annRecBtn.title = "Record a spoken walkthrough — talk while you click, and each click becomes a note";
  // The settle window is a STATUS, not a Done button (Bugbot, PR #665): with
  // #annrec.on gone the armed CSS would show an enabled ✓ Done for however
  // long MediaRecorder.stop()'s encode takes (no timeslice — it can take a
  // while), still wearing the stop aria-label, and a click there ran annDone
  // and disarmed the mode before transcription ever started. Same treatment
  // the transcription below gets: disabled, .busy (the face yields to
  // #annreclbl), named for what is happening.
  annBtn.disabled = true;
  annBtn.setAttribute("aria-label", "Stopping the recording");
  annBtn.title = "Stopping the recording…";
  annCta.classList.add("busy");
  annRecLbl.textContent = "Stopping…";
  const stopped = new Promise((resolve) => recorder.addEventListener("stop", resolve, { once: true }));
  recorder.stop();
  await stopped;
  // The chunks are complete here: the recorder's final dataavailable fires
  // before its stop event resolves the await above, and it landed in THIS
  // session's captured array — annRecBegin's sink is a closure, not the
  // global name this function already reset.
  const blob = new Blob(chunks, { type: recorder.mimeType || "" });
  // Ending a walkthrough puts the whole mode away (Akshil, 2026-08-19):
  // record → talk → stop is the complete gesture, and a comment layer left
  // armed after it swallows the reading clicks that usually come next. The
  // epoch — captured at ENTRY, before the settle a new arming can slip into
  // — pins WHICH arming this disarm belongs to (Bugbot, PR #644/#665): a
  // user who re-armed meanwhile owns a NEW arming this stale disarm must
  // not close. It also keeps the disarm from echoing when annSetMode's own
  // disarm called us (annOn is already false there). Nothing recorded:
  // disarm and go.
  if (!blob.size) {   // nothing said: no transcript to fetch
    // The status leaves with this path's own hands — the transcription's
    // finally never runs here. The disarm below renames the seat; the
    // epoch-skipped case (someone re-armed mid-stop) is renamed by the
    // annSetMode(true) that re-armed it.
    // A NEW session that began during the settle owns the seat now — its
    // labels, its clock — and this stale path must not repaint it. The
    // no-op disarm below is already epoch-guarded.
    if (!annRecOn) {
      annCta.classList.remove("busy");
      annRecLbl.textContent = "";
      annBtn.disabled = false;
      // Derived from the state, not assumed armed (Bugbot, PR #665): an Esc
      // in the settle already idle-named the seat through annSetMode, and a
      // blind Done restore here would dress a Comment face in Done's name.
      annBtn.setAttribute("aria-label", annOn
        ? "Done — send the notes and finish commenting"
        : "Comment on the " + paneNoun);
      annBtn.title = annOn ? ANN_ARMED_TITLE : annIdleTitle();
    }
    if (annOn && annArmEpoch === armed) annSetMode(false);
    return;
  }
  // The seat is already busy/disabled from the stop above; only the words
  // move on, from "Stopping…" to "Transcribing…" — one status seat, two
  // tenses. GATED like every other post-settle write (Bugbot, PR #665): a
  // new live recording that slipped in through an Esc'd settle owns the
  // seat, and painting the stale status here — with the finally's matching
  // guard skipping the re-enable — left that walkthrough's stop control
  // inert. When the seat is someone else's, the transcription just runs
  // quietly in the background.
  if (!annRecOn) {
    annRecBtn.disabled = true;
    annBtn.disabled = true;
    annBtn.setAttribute("aria-label", "Transcribing the walkthrough");
    annBtn.title = "Transcribing the walkthrough — the notes send themselves when the words land";
    annCta.classList.add("busy");
    annRecLbl.textContent = "Transcribing…";
  }
  try {
    // The same 0700 temp dir the pane crops use (shotDirPath/shotJoin/shotStamp,
    // below) — it is already pruned by age and count (agent.py's `_prune_shots`),
    // and a walkthrough's audio is exactly the kind of scratch file that
    // pruning exists for. Unlike a crop this file is never handed to Claude —
    // fused.ai.transcribe reads it locally and only the WORDS leave this
    // function — so it needs no `Read(...)` rule of its own.
    const dir = await shotDirPath();
    const path = shotJoin(dir, shotStamp() + "-walkthrough" + annRecExt(blob.type));
    await fused.uploadFile(path, blob);
    const rec = await fused.ai.transcribe({ path });
    // Everything said BEFORE the first click is the main prompt, not a note:
    // it seeds the composer as the message's own words, so the send reads as
    // "here is the task, and here are the spots" rather than a first comment
    // that swallowed the framing. A walkthrough with NO clicks is the
    // degenerate case of the same rule — everything came before the first
    // click, so the whole transcript is the prompt.
    const intro = ids.length
      ? annRecAssign(ids, rec.segments)
      : (rec.segments || []).map((s) => s.text).join(" ")
          .replace(/\s+/g, " ").trim();
    // Auto-send, the same way a typed note sends itself: the walkthrough is
    // finished the moment its words land, and "record, talk, stop" should
    // reach Claude without a fourth step. Only when words actually landed —
    // on a note OR as intro; a transcription that assigned nothing leaves the
    // clicks pending and editable rather than sending empty notes — and never
    // over a live run. The intro joins whatever is already typed (the user's
    // extras ride along, never get clobbered), and no words at all is fine:
    // the comments are the content.
    const spoke = ids.some((id) => {
      const c = annotations.find((a) => a.id === id);
      return c && c.content && !c.sent;
    });
    // The intro is seeded even when a live run blocks the auto-send: the words
    // wait in the composer (beside the pending notes) and ride the user's next
    // send, instead of evaporating because the walkthrough ended mid-turn.
    if (spoke || intro) {
      annPrefillComposer(intro);
      if (!sending) annAutoSubmit();
    }
  } catch (err) {
    console.warn("spoken annotation transcription failed:", err.message);
  } finally {
    // A NEW session that began mid-transcription owns the seat — its stop
    // face, its clock, even the mic's disabled flag (annRecBegin holds it
    // through the permission prompt) — and this stale finally must not
    // repaint, re-name or re-enable any of it (Bugbot, PR #665). Symmetric
    // with the gated writes above: if this ender never painted the status,
    // there is nothing of its to undo.
    if (!annRecOn) {
      annRecBtn.disabled = false;
      annBtn.disabled = false;
      annCta.classList.remove("busy");
      annRecLbl.textContent = "";   // "Transcribing…" only ever describes now
      // The disarm below renames the seat on the normal path; when the guards
      // skip it (re-armed mid-transcription, or Esc already disarmed) the
      // name comes back by hand — derived from the state, so an idle face is
      // never dressed in Done's name.
      annBtn.setAttribute("aria-label", annOn
        ? "Done — send the notes and finish commenting"
        : "Comment on the " + paneNoun);
      annBtn.title = annOn ? ANN_ARMED_TITLE : annIdleTitle();
    }
  }
  // The other half of the stop-disarms rule above: transcript fetched (or
  // failed — the notes stay in the transcript either way), walkthrough done,
  // mode off. After the auto-send, deliberately: annPrefillComposer needs the
  // armed composer it seeds. Same-epoch only — see the guard's note above.
  if (annOn && annArmEpoch === armed) annSetMode(false);
}

// The mic hides whenever a mode is on (the stylesheet's :has rule), so from
// where it can be clicked it only ever starts a walkthrough; the recording
// leg is a guard against a click racing the hide, not a second stop control.
annRecBtn.addEventListener("click",
  () => (annRecOn ? annRecEnd() : annRecBegin()));

// Discard: the walkthrough thrown away instead of sent (Akshil, 2026-08-19).
// The recording stops with nothing kept — no upload, no transcription, no
// auto-send — and the clicks' empty marks are deleted with it: a note that
// was only ever going to carry the recording's words is nothing without
// them. The mode goes away the same way a kept stop puts it away. annRecEnd
// no-ops after this (annRecOn is false and the recorder is gone), so a stop
// click racing the discard cannot resurrect the walkthrough.
async function annRecDiscard() {
  if (!annRecOn || !annRecorder) return;
  // The whole session is snapshotted synchronously, like annRecEnd's: a new
  // recording can begin while this one's stop settles, and every global read
  // after the await would be the new session's — its marks deleted, its
  // timer killed (Bugbot, PR #665).
  const recorder = annRecorder;
  const ids = new Set(annRecIds);
  const armed = annArmEpoch;
  clearInterval(annRecTimerId);
  annRecTimerId = null;
  annRecChunks = [];
  annRecIds = [];
  annRecorder = null;
  annRecOn = false;
  // The face goes BEFORE the await, like annRecEnd's: the trash and the
  // stop clock leave the strip the moment the choice is made, and a second
  // click has nothing left to land on. The NAME comes back with the face
  // (Bugbot, PR #665): annRecBegin called this seat "Stop the recording",
  // and only annRecEnd used to give it back. Across the settle the seat is
  // the same disabled status annRecEnd shows — never an enabled Done.
  annRecBtn.classList.remove("on");
  annRecBtn.setAttribute("aria-pressed", "false");
  annRecBtn.setAttribute("aria-label", "Record a spoken walkthrough");
  annRecBtn.title = "Record a spoken walkthrough — talk while you click, and each click becomes a note";
  annBtn.disabled = true;
  annBtn.setAttribute("aria-label", "Discarding the recording");
  annBtn.title = "Discarding the recording…";
  annCta.classList.add("busy");
  annRecLbl.textContent = "Discarding…";
  const stopped = new Promise((resolve) => recorder.addEventListener("stop", resolve, { once: true }));
  recorder.stop();   // onstop releases the mic tracks, same as a kept stop
  await stopped;
  // A NEW session that began during the settle owns the seat now — leave its
  // busy state, labels and clock alone (Bugbot, PR #665).
  if (!annRecOn) {
    annCta.classList.remove("busy");
    annRecLbl.textContent = "";
    annBtn.disabled = false;
    // Derived, same reason as annRecEnd's restores: Esc during this settle
    // has already idle-named the seat.
    annBtn.setAttribute("aria-label", annOn
      ? "Done — send the notes and finish commenting"
      : "Comment on the " + paneNoun);
    annBtn.title = annOn ? ANN_ARMED_TITLE : annIdleTitle();
  }
  // The marks die with the recording whatever the mode is doing now — they
  // are THIS session's, captured above — and the repaint must not wait on a
  // disarm that an Esc during the settle already spent (the pins/chips would
  // stay on screen for notes that no longer exist).
  if (ids.size) {
    annotations = annotations.filter((a) => !ids.has(a.id));
    annSave();
    renderAnn();
  }
  // Epoch-guarded like annRecEnd's disarm: a new arming that slipped into
  // the settle is not this discard's to close.
  if (annOn && annArmEpoch === armed) annSetMode(false);
}
annDiscardBtn.addEventListener("click", () => annRecDiscard());

// ── hosted only: keeping up with a target this document cannot hear ────────
// The split layout is told about its pane by the pane itself — one iframe, one
// `load` event, ours. The sidebar's target belongs to the host: it appears after
// the shell's first paint, it is REPLACED when the reader switches the pane's
// mode (the mark moves to another frame), and it disappears when the pane shows
// something unannotatable. None of that reaches this document as an event, and
// the one mechanism that would carry it — postMessage — is the thing this
// template deliberately does not have (D3/D4).
//
// So the switch asks, and asking is one querySelector in the parent document
// plus one in the target's. Cheap, and only ever in this layout. Two triggers,
// for the two ways the answer changes:
//   * focus — the reader came back to this frame, very often by way of clicking
//     something in the host that changed the pane;
//   * a slow interval, for everything else (the shell's own mode switch, a
//     folder navigation) — slow enough to be free, quick enough that the switch
//     is there by the time a hand gets to it.
// A MutationObserver on the host's document would be the precise version and is
// not worth it: it means holding a live observer on someone else's DOM for the
// life of the session to learn a fact two cheap reads already give us.
const ANN_TARGET_POLL_MS = 750;
function annPollTarget() {
  const had = !!annFrame;
  const moved = annSyncTarget();
  const has = !!annFrame;
  // Hidden, not disabled: a switch that cannot do anything is not a promise
  // worth keeping on screen — the same rule the narrow layout applies to the
  // controls of a hidden pane. (#annbtn's own `display: flex` outranks the UA's
  // [hidden] rule, so the stylesheet spells the hiding out.)
  annBtn.hidden = !has;
  annRecBtn.hidden = !has;
  // The screenshot buttons answer the SAME question and so follow the same
  // switch: `annCapable()` is "is the host showing something marked", and a
  // button offering to photograph a pane that is not there would either capture
  // this chat's own chrome or nothing at all. In the split layout there is no
  // poll and no need for one — enterNoPane removes both buttons outright, which
  // is the structural version of this line.
  for (const b of shotBtns()) b.hidden = !has;
  if (has === had) {
    // Same ANSWER, different FRAME: the shell switched the pane's mode between
    // two iframes it keeps mounted and moved the mark from one to the other.
    // The switch has nothing to say about that — there was a target before and
    // there is one now — but the pins do, and nobody else is going to draw
    // them. Every other repaint on this path is somebody's `load`, and the two
    // frames both loaded long ago: annWatchTarget refuses a frame it has
    // already adopted (`__fusedAnnWatched`), so no wiring runs and no render
    // comes with it. The layer we just re-resolved is the one THAT frame was
    // left with, painted from whatever `annotations` said when it was last on
    // screen — a note added, deleted or sent in the meantime is not in it.
    if (moved) renderAnn();
    return;
  }
  // A target that has just ARRIVED re-applies the boot default, because the boot
  // itself may have run before the host stamped anything — the switch would then
  // read "Comment" while the URL says the mode is on. Through annSetMode, the
  // one door, so the label, aria-pressed, the param and the pins agree.
  if (has) annSetMode(fused.params.get("annmode") === "1");
  // And a target that has GONE disarms without writing the param: annSetMode
  // refuses (annCapable is false now) after setting annOn, which is exactly the
  // "ignored, not rewritten" posture a stale `annmode` gets everywhere else. The
  // repaint is ours to ask for, since that early return skips it — the chips
  // stay, the pins went with the document.
  else { annSetMode(false); renderAnn(); }
}

// Auto-send: a saved NEW note goes to Claude immediately, always — there is no
// off switch. The `filled`/`sending` guards below are the only gates.
//
// This is the one path that starts a run while the transcript may be OFF SCREEN:
// notes are saved in the narrow layout's Preview view, where #log is collapsed
// with the rest of the chat column. That is fine for progress output (something
// to read afterwards) and not fine for a permission card (something the run is
// blocked on), so the card is what pulls the view back — see showPermissionCard.
// Deliberately not a gate here: refusing to send from Preview would take away the
// feature instead of fixing where its output lands.
function annAutoSubmit() {
  if (chatEl.classList.contains("home")) document.getElementById("card").requestSubmit();
  else submitChat();
}

// Wire the framed app on every load (the app live-reloads on Claude's edits;
// pins re-resolve against the fresh DOM). Handlers stay attached and gate on
// `annOn`, so toggling never needs a rewire.
//
// Adopt a frame as the target: hear its future loads, and wire whatever document
// is in it NOW. That second half is what the split layout never needed — its
// frame is empty until we give it a src, so `load` always arrives after this
// script — and what the hosted layout cannot do without: the shell's pane was
// loaded long before this sidebar booted, and a document already in a frame
// fires no event for a listener that arrives late.

  if (!frame || frame.__fusedAnnWatched) return;
  frame.__fusedAnnWatched = true;
  frame.addEventListener("load", annWireTarget);
  // `about:blank` is not a document that was already there, it is the
  // placeholder before the first real one (every frame starts on it, ours
  // included until paneReady gives it a src) — and its `load` is coming anyway.
  try {
    const w = frame.contentWindow;
    if (w && String(w.location.href) !== "about:blank") annWireTarget();
  } catch (err) { /* cross-origin or mid-navigation: nothing to wire */ }
}
function annWireTarget() {

  // mode under us, and the mark may already have moved to another frame — the
  // one we want is whichever one is marked now, never "the one that fired".

  // document — it is a single instance that has to point at whichever document
  // is the target NOW, and re-selecting an already-wired one is exactly the case
  // the guard below skips. The split layout reaches it only through here;
  // hosted, annSyncTarget asks as well, and both are no-ops for a document we

  // for the same reason, as watchWindow's `__fusedAppWatched`): a reload brings a

  // wired — the mark leaving and coming back as the reader switches the pane's
  // mode to and fro — must not stack a second set of listeners on it.

  // Our own injected layer, seen from inside the app's document. In the split

  // handlers cannot see) and this is always false; hosted, it is what keeps the
  // overlay from being treated as part of the app — a pin is a control of ours,
  // not an element a note can point at.

  // boundary is what makes one test cover both: an event raised in the shadow
  // tree is retargeted to the host for every listener out here, so a mousedown
  // in the textarea, a hover over the card and a click on the delete button all

    if (annOwnNode(e.target)) return;

    annHl.style.top = r.top + "px";
    annHl.style.width = r.width + "px";
    annHl.style.height = r.height + "px";

    // its own handler: swallowing it here would eat the click that reopens the
    // note's editor and then anchor a NEW note to the pin marking the old one.
    if (annOwnNode(e.target)) return;
    e.preventDefault();
    e.stopPropagation();

    // because every click can name one: it is the note when there is no
    // element to anchor to (background, a shadow tree annPathOf cannot walk)
    // and when the reader forces it (Alt, or the Point tool — "this spot, not
    // this box"). No picture of its own — the send-time overview badges the
    // spot, same convention the recording's point notes follow

        drain();
      }
    }
  } finally {
    // One last drain: the callback is a microtask, so a mutation during the final
    // chunk may not have been delivered anywhere else.
    drain();
    if (observer) { try { observer.disconnect(); } catch (err) { /* gone */ } }
  }
  const incomplete = mutated ? "mutated" : (detached ? "detached" : stopped);
  return { styled, incomplete, scrolled };
}

// Put every scrolled box back where the user had it.
//
// THE BUG THIS EXISTS FOR, because it is not obvious from the code that was here:
// `cloneNode` copies attributes, and `scrollTop`/`scrollLeft` are PROPERTIES, not
// attributes. There is no markup for "scrolled 3160px down" — so a clone of a
// scrolled page is a clone of that page at the top, and there is nothing in the
// serialized SVG that could say otherwise. shotPane compensated for the WINDOW's
// scroll and for nothing else, which is correct for a document that scrolls itself
// and wrong for every app whose content lives in an inner `overflow: auto` box —
// which is most of them, and is every template in this repo. Measured against the
// markdown preview (a CodeMirror editor, one `.cm-scroller`): the user scrolled to
// an API list halfway down, pressed the camera, and the picture was the top of the
// document — worse than merely misplaced, because CodeMirror only renders the rows
// near the viewport, so the top of an unscrolled clone of a scrolled editor is
// SPACER. The file was a title on an empty page.
//
// The fix has to be expressible in markup, so it is a transform on the children
// rather than a scroll offset on the parent: the scroll box keeps the `overflow`
// its computed style already carries (which is what clips), and each child is
// shifted up/left by the offset — exactly the paint the browser does when it
// scrolls, and it changes no layout, so a flex or grid scroller (`.cm-scroller` is
// display:flex) is not rearranged by being photographed.
//
// Two kinds of child are skipped, and both would be WRONG to shift:
//   `position: fixed` and `position: sticky` — a sticky header does not move with
//     the scroll, which is the whole point of it, and an unshifted clone already
//     draws it where a stuck one sits.
// The child's own transform is preserved and COMPOSED with, never replaced: the
// style walk writes the computed `transform` (a matrix, for anything the app has
// transformed itself), and dropping it would flatten a rotated or scaled element
// while fixing its scroll. Ours goes first — leftmost is outermost — so the shift
// is applied in the scroller's space, after the element's own transform, which is
// what scrolling does.
//
// The last declaration in a style attribute wins, so this appends rather than
// rewrites the property in place: same result, and no regex has to find and splice
// a value that may contain semicolons inside a `matrix(...)`.
function shotApplyScroll(scrolled) {
  let shifted = 0;
  for (const box of scrolled || []) {
    for (const child of box.clone.children) {
      const style = child.getAttribute("style") || "";
      const pos = /(?:^|;)\s*position\s*:\s*([a-z-]+)/.exec(style);
      if (pos && (pos[1] === "fixed" || pos[1] === "sticky")) continue;
      const own = /(?:^|;)\s*transform\s*:\s*([^;]+)/.exec(style);
      const keep = own && own[1].trim() !== "none" ? " " + own[1].trim() : "";
      child.setAttribute("style", style + ";transform:translate(" + (-box.x)
                         + "px," + (-box.y) + "px)" + keep + ";");
      shifted++;
    }
  }
  return shifted;
}

// The one sentence a crop carries about what its capture could NOT do, or "" when
// the capture was whole. Every cause shotInlineStyles can report is worded here
// and nowhere else: the old single `truncated` boolean was set by either the
// element cap or the deadline and the note blamed page size, so a capture that
// merely ran out of time told the agent the DOM was too large — a misdiagnosis it
// might act on by simplifying a page that is not big.
function shotPaneNote(pane) {
  const styled = (pane && pane.styled) || 0;
  switch (pane && pane.incomplete) {
    case "elements":
      return "part of this capture is unstyled: the page has more elements than "
        + "the capture budget allows (it stopped after " + styled + "), so some of "
        + "what you see may render without its CSS rather than as the user saw it";
    case "deadline":
      return "part of this capture is unstyled: it ran out of time after " + styled
        + " elements, so some of what you see may render without its CSS rather "
        + "than as the user saw it. This is about capture speed, not page size";
    case "detached":
      return "part of this capture is unstyled: the page removed elements while the "
        + "capture was running, so some of what you see may render without its CSS";
    case "mutated":
      return "the page re-rendered while the capture was running, so this picture "
        + "may not match what was on screen: some elements are missing their "
        + "styling and the layout may be a blend of before and after";
    default:
      return "";
  }
}

// The other caveat a capture can carry, and it is deliberately NOT one of
// shotPaneNote's causes: those are all "some of this may not be what you think it
// is", spread over an unknown set of elements, while this one is BOUNDED and
// visible — every picture that could not be inlined is a dashed box that says so
// in the image itself. Folding it into `incomplete` would have one missing logo
// tell the agent to distrust the whole crop (see shotTrustLine).
function shotImageNote(pane) {
  const n = (pane && pane.imagesMissing) || 0;
  if (!n) return "";
  return n + (n === 1 ? " image" : " images") + " could not be embedded in this "
    + "picture and " + (n === 1 ? "shows" : "show") + " as a dashed "
    + "\"image not captured\" box (or, for a background, as plain colour): a page "
    + "rasterised through SVG cannot load a URL, so every image has to be fetched "
    + "and inlined first, and " + (n === 1 ? "that one" : "those") + " could not "
    + "be. The app is very likely showing the image fine";
}

// The closing instruction a caveated shot carries: what to DO about the doubt, as
// against shotPaneNote's description of what went wrong. Two jobs, two functions —
// saying "trust the anchor over this crop" in both put one rule in two places.
//
// Chosen by the WORST doubt present, because a reader takes the caveats as ONE
// instruction. The two kinds are genuinely different:
//   a blank WebGL region is BOUNDED — the crop note names how much of the element
//   it covers — so
//     "ignore that area, the rest is the app" is exactly right.
//   anything the style walk reports is UNBOUNDED: it could be any element, and a
//     `mutated` capture can look perfectly plausible while being a blend of two
//     moments. Closing THAT with "the rest of the crop is what the user saw" told
//     the agent to distrust the picture and to trust it in the same breath, which
//     cancels to nothing and leaves it acting on a blended image.
// Hence: bounded doubt keeps the reassurance, unbounded doubt replaces it with
// corroboration. Used by the crop note so one capture
// cannot ask for two different levels of trust in its two attachments.
function shotTrustLine(incomplete) {
  return incomplete
    ? "Do not act on this image alone — check anything you read from it against "
      + "the element's anchor and the DOM outline first."
    : "The rest of the image is what the user saw.";
}

// Whether a canvas read back nothing we can use.
//
// This is the mandatory check, not a nicety. maplibre and deck.gl create their
// WebGL context with `preserveDrawingBuffer: false`, so the browser is free to
// discard the drawing buffer after each frame and `toDataURL` hands back a fully
// TRANSPARENT image of the right size. Shipping that would tell the agent the map
// rendered nothing — and an agent that believes the app is blank spends a whole
// debugging loop on a bug that does not exist.
//
// Compared against a same-size EMPTY canvas's encoding rather than by walking
// pixels: PNG of a fully-transparent WxH is deterministic, so equality is the
// test, and it costs one extra encode instead of a getImageData scan.
//
// "Cannot tell" is unreadable, not fine: an empty readback (toDataURL threw, or
// the canvas is tainted) and a missing probe both mean we must not claim these
// pixels are what is on screen.
function shotReadbackIsBlank(url, blankUrl) {
  return !url || !blankUrl || url === blankUrl;
}

// ── inlining the images ───────────────────────────────────────────────────────
// WHY ANY OF THIS EXISTS. The capture serializes the clone into an `<svg>` and
// loads it through an `<img>`, and an SVG loaded that way is rendered with
// external resource loading DISABLED — no network requests, of any kind, to any
// origin, same-origin included. It is a deliberate browser rule (an `<img>` must
// not become a fetch engine), not a CORS problem and not a bug to work around with
// headers. So every `<img src="http…">` in the clone drew as a broken-image glyph
// with its alt text beside it, which is exactly what the README's hero screenshot
// came out as: a 684px hole in the middle of the picture, in a capture the user
// took to show what the page looked like.
//
// The one src such an image CAN follow is a `data:` one, so each URL is fetched
// here — while we are still an ordinary page with an ordinary network — and the
// bytes are written into the markup before it is serialized.

// A blob as a `data:` URL. FileReader rather than manual base64: it is the only
// path that does not push the whole file through a JS string byte by byte.
function shotDataUrl(blob) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(String(fr.result || ""));
    fr.onerror = () => rej(new Error("the image bytes could not be read"));
    fr.readAsDataURL(blob);
  });
}

function shotLoadImage(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error("the image could not be decoded"));
    img.src = src;
  });
}

// Re-encode an oversized image down to something worth embedding. base64 adds a
// third on top of the bytes and the result is inlined in markup that then has to
// be parsed, rasterised and encoded again — so a 4 MB photo would cost more than
// the whole screenshot it appears in. Capped at SHOT_VIEW_EDGE, which is the
// resolution the finished picture is encoded at anyway; anything finer is thrown
// away by the next step regardless.
//
// Drawn from an object URL rather than from the page's own <img>: a blob URL is
// same-origin, so the canvas is never tainted and `toDataURL` cannot throw for a
// cross-origin image the way reading the live element would.
async function shotShrinkImage(blob) {
  const objUrl = URL.createObjectURL(blob);
  try {
    const img = await shotLoadImage(objUrl);
    const fit = shotFit(img.naturalWidth || 1, img.naturalHeight || 1,
                        SHOT_VIEW_EDGE);
    const c = document.createElement("canvas");
    c.width = fit.width;
    c.height = fit.height;
    c.getContext("2d").drawImage(img, 0, 0, fit.width, fit.height);
    // WebP where it is real, PNG where it silently is not — the same one-line
    // check shotExt spells out, for the same WKWebView reason.
    const webp = await shotBlob(c, "image/webp", 0.8);
    if (webp && webp.type === "image/webp") return webp;
    return (await shotBlob(c, "image/png")) || blob;
  } finally {
    URL.revokeObjectURL(objUrl);
  }
}

// One URL's bytes as a data: URL. `el` is the element that referenced it, and it
// is only ever used as the SECOND chance: a cross-origin image served without CORS
// headers cannot be fetched, but the browser has already loaded it into the
// element, and drawing that element into a canvas gets the pixels back — unless it
// taints the canvas, which is precisely the case `toDataURL` throws for. So the
// order is fetch (works for our own /api/fs/raw, and for any host that sends
// `access-control-allow-origin`), then the element, then nothing.
async function shotUrlAsData(url, el) {
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const blob = await res.blob();
    const small = blob.size > SHOT_IMG_MAX_BYTES ? await shotShrinkImage(blob)
                                                 : blob;
    return await shotDataUrl(small);
  } catch (err) {
    if (!el || !el.naturalWidth) throw err;
    const c = document.createElement("canvas");
    c.width = el.naturalWidth;
    c.height = el.naturalHeight;
    c.getContext("2d").drawImage(el, 0, 0);
    return c.toDataURL("image/png");   // throws when the canvas is tainted
  }
}

// Every `url(…)` a style attribute points at, minus the two that are already
// local: `data:` (nothing to do) and `url(#id)` (an SVG fragment reference — a
// filter or a clip path in the same document, which travels with the clone).
function shotStyleUrls(style) {
  const out = [];
  const re = /url\((['"]?)([^'")]+)\1\)/g;
  let m;
  while ((m = re.exec(style))) {
    const u = m[2].trim();
    if (u && u.slice(0, 5) !== "data:" && u[0] !== "#") out.push(u);
  }
  return out;
}

// What a picture that could not be fetched leaves behind: a dashed box the size of
// the image, saying so. NOT a broken-image glyph (which reads as a bug in the page
// being photographed rather than in the photograph) and NOT nothing at all (which
// would silently redraw the layout around a hole the user's screen did not have).
// The alt text goes in because it is the one description of the missing picture
// that the page itself wrote.
function shotImagePlaceholder(d, alt) {
  const box = d.ownerDocument.createElement("div");
  box.setAttribute("style", (d.getAttribute("style") || "")
    + ";display:flex;align-items:center;justify-content:center;text-align:center;"
    + "box-sizing:border-box;overflow:hidden;border:1px dashed #b4b4b4;"
    + "color:#8a8a8a;font:11px system-ui,sans-serif;");
  box.textContent = alt ? "image not captured — " + alt : "image not captured";
  d.replaceWith(box);
}

// Rewrite every image reference in the clone to `data:`, and return
// `{missing}` — how many could not be, which the caveat line reports.
//
// Pairing is by INDEX here, not by the styles walk's guarded descent, and that is
// a deliberate difference in kind: shotRasterise (right below) has always paired
// canvases the same way, a mispaired image swaps one picture for another rather
// than dressing an element in a stranger's layout, and the walk has already
// reported `mutated` for any capture where the pairing could have slipped.
//
// `<source>` elements go first. A `<picture>` whose `<source>` still points at an
// http URL would have the browser re-resolve the child over the `src` we just
// rewrote, and lose the image again inside the very element we fixed.
async function shotInlineImages(src, dst, deadline) {
  let missing = 0, fetched = 0;
  const cache = new Map();
  const resolve = (url, el) => {
