# The torch image-understanding runner's environment (SPEC AI-33).
#
# Both families load through transformers' `from_pretrained`; Moondream 2's
# model is the Python in its repo (`trust_remote_code`), which imports
# `tokenizers` itself. No `accelerate`: it adds ~1.7 s to the transformers
# import and saves ~1 s of weight loading (measured on M5, 2026-10-13).
# `pillow-heif` opens iPhone photos, as in the embed runners.
# torch comes from the CPU index like `diffusers_image/`: the macOS wheel there
# carries MPS, which is where this runner is offered today.
[project]
name = "fused-render-runner-vision-torch"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.13,<3",
    "transformers>=5.19,<6",
    "tokenizers>=0.23,<1",
    "safetensors>=0.4,<1",
    "numpy>=1.26,<3",
    "pillow",
    "pillow-heif>=1.5,<2",
    "huggingface_hub",
    "psutil",
]

# Not a distribution — a folder of scripts, not something to build and install.
[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
