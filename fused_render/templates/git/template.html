<!DOCTYPE html>
<html data-fused-theme="shell">
<head>
<meta charset="utf-8" />
<title>Git</title>
<style>
  /* Appearance (SPEC §30/AP-9, D134). The dark block below IS this view's
     palette; every colour a rule uses is a token from it, because a literal is
     a colour light mode cannot repaint (tests/test_theme.py enforces both the
     opt-in on <html> and the two blocks defining the SAME token set).
     `data-theme` is written onto <html> by the injected runtime, which acts only
     because this document opted in via `data-fused-theme`. */
  :root {
    color-scheme: dark;
    --bg: #131417;
    --surface: #1b1d21;
    --surface-2: #22252b;
    --line: #2a2d33;
    --line-strong: #3a3e46;
    --line-hover: #454a53;
    --ink: #e8eaed;
    --ink-2: #9aa0a6;
    --ink-3: #868d94;
    --accent: #E5FF44;
    --accent-dim: #b8cc36;
    --on-accent: #131417;
    --grid-dot: #1e2126;
    --skel-shine: #2f333c;
    /* status letters: added / modified / deleted / renamed / untracked */
    --st-add: #7ec97e;
    --st-mod: #d9b34a;
    --st-del: #e08585;
    --st-ren: #7fb4e0;
    --st-new: #9aa0a6;
    /* diff gutter + hunk colours */
    --diff-add-bg: #16241a;
    --diff-add-fg: #a8dfa8;
    --diff-del-bg: #251618;
    --diff-del-fg: #efb0b0;
    --diff-hunk-fg: #86a7c4;
    --diff-meta-fg: #9aa0a6;
    /* empty state + truncation notice */
    --note-line: #5c4a1f;
    --note-bg: #1b1913;
    --note-fg: #e8d8ac;
    /* Anything that can LOSE WORK wears these, and only those things do — a
       discard, a stash drop, and the confirmation step in front of each. The
       point is that the colour is a promise: if it is red here, it is one of the
       three ops the module marks destructive. */
    --danger: #e08585;
    --danger-bg: #241618;
    --danger-line: #5e2f33;
    /* A mutation that landed, and one that did not. */
    --good-fg: #a8dfa8;
    --good-bg: #16241a;
    --good-line: #2c4a31;
    --bad-fg: #efb0b0;
    --bad-bg: #251618;
    --bad-line: #5e2f33;
  }
  /* The brand lime is unreadable as text on white, so light mode uses
     shell.css's same-hue deep olive — one token still serving text, focus ring
     and the selected-row edge. */
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff;
    --surface: #f4f5f7;
    --surface-2: #eceef0;
    --line: #d8dade;
    --line-strong: #c4c8ce;
    --line-hover: #b4b9c0;
    --ink: #1f2023;
    --ink-2: #61656c;
    --ink-3: #6f747c;
    --accent: #5f7300;
    --accent-dim: #4e5f00;
    --on-accent: #ffffff;
    --grid-dot: #e8eaed;
    --skel-shine: #dfe2e7;
    --st-add: #2f7d32;
    --st-mod: #8a6410;
    --st-del: #a32828;
    --st-ren: #1f5f96;
    --st-new: #61656c;
    --diff-add-bg: #e8f6e8;
    --diff-add-fg: #1f5f22;
    --diff-del-bg: #fdecec;
    --diff-del-fg: #8f2020;
    --diff-hunk-fg: #2b5f88;
    --diff-meta-fg: #61656c;
    --note-line: #e0cd94;
    --note-bg: #fdf7e6;
    --note-fg: #6b5316;
    --danger: #a32828;
    --danger-bg: #fdecec;
    --danger-line: #e6b6b6;
    --good-fg: #1f5f22;
    --good-bg: #e8f6e8;
    --good-line: #bcdcbc;
    --bad-fg: #8f2020;
    --bad-bg: #fdecec;
    --bad-line: #e6b6b6;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--bg);
    background-image: radial-gradient(circle, var(--grid-dot) 1px, transparent 1px);
    background-size: 28px 28px;
    /* The page body NEVER scrolls horizontally — wide content (diffs) scrolls
       inside its own container instead. */
    overflow-x: hidden;
  }
  #root {
    max-width: 1080px;
    margin: 0 auto;
    padding: 20px 24px 80px;
    min-width: 0;
  }
  a { color: var(--accent-dim); }

  /* ================= panes ================= */
  .cols {
    display: grid;
    grid-template-columns: minmax(0, 420px) minmax(0, 1fr);
    gap: 20px;
    margin-top: 18px;
    align-items: start;
  }
  .cols.no-diff { grid-template-columns: minmax(0, 1fr); }
  @media (max-width: 900px) {
    .cols, .cols.no-diff { grid-template-columns: minmax(0, 1fr); }
    /* Stacked, the diff goes ABOVE the lists. Otherwise clicking a commit
       appends a pane thirty rows below the fold and reads as "nothing
       happened" — the response to a click has to be where the eye already is. */
    .cols > .col:last-child:not(:first-child) { order: -1; }
    .pane { position: static; }
    .diff { max-height: 50vh; }
  }
  .col { min-width: 0; }

  section { margin: 0 0 18px; }
  section > h2 {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  section > h2 .n { color: var(--ink-2); font-weight: 400; letter-spacing: 0; }
  section > h2 .spacer { flex: 1; }
  /* An unborn/detached HEAD rides the section label rather than a header band:
     it is DATA, and normal case, letter-spacing reset because it is not a label. */
  section > h2 .state {
    color: var(--accent-dim);
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  section > h2 .sep { color: var(--ink-3); font-weight: 400; }

  /* ================= toolbar ================= */
  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 6px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
  }
  .bar .gap { flex: 1; }
  .bar .rule {
    width: 1px;
    align-self: stretch;
    margin: 2px 2px;
    background: var(--line);
  }

  /* One button shape for every action in the view; the variants only change
     colour, never geometry, so a row of them lines up whatever they do. */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex: none;
    padding: 4px 9px;
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    background: transparent;
    color: var(--ink-2);
    font: inherit;
    font-size: 12px;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 120ms cubic-bezier(0.2, 0, 0, 1);
  }
  .btn:hover:not([disabled]) { color: var(--ink); border-color: var(--line-hover); background: var(--surface-2); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn[disabled] { opacity: 0.45; cursor: default; }
  .btn[aria-expanded="true"] { color: var(--ink); background: var(--surface-2); border-color: var(--line-hover); }
  .btn.primary {
    border-color: var(--accent-dim);
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 700;
  }
  .btn.primary:hover:not([disabled]) { background: var(--accent-dim); color: var(--on-accent); }
  .btn.danger { color: var(--danger); border-color: var(--danger-line); }
  .btn.danger:hover:not([disabled]) { color: var(--danger); background: var(--danger-bg); border-color: var(--danger); }
  .btn .count {
    padding: 0 5px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--ink);
    font-size: 10px;
  }
  /* A tiny square button for the per-row +/-/revert affordances. Icon-only, so
     it carries its meaning in aria-label rather than in text. */
  /* A single-glyph button is centred by its BOX, not by padding. Sized as a
     square with no padding at all, so the glyph is placed by the flex centring
     `.btn` already declares (`align-items: center` + `justify-content` here)
     rather than by arithmetic that has to come out even.
     It did not: `padding: 1px 6px` with `line-height: 1.3` made a 15.6px line
     box inside a 20px button, and the leftover half-pixel landed on one side —
     measured 1px above the glyph and 2.6px below it, so every +/−/↩ in the
     lists rode visibly high. `line-height: 1` keeps the line box from carrying
     its own uneven leading into that centring. (The revert button now carries an
     SVG rather than a glyph, so it is centred as a box either way — the +/− ones
     are still text and still need this.) */
  .btn.icon {
    width: 22px;
    height: 22px;
    padding: 0;
    justify-content: center;
    font-size: 12px;
    line-height: 1;
  }

  /* ================= commit box ================= */
  .commit { margin-top: 10px; }
  .commit textarea {
    display: block;
    width: 100%;
    min-height: 62px;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    resize: vertical;
  }
  .commit textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  .commit textarea::placeholder { color: var(--ink-3); }
  .commit-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  /* The AI sparkle. Quiet by default — it is an offer, not the action this box
     is for — and it announces WORK by pulsing rather than by swapping in a
     spinner glyph, so its box never changes size mid-generation and the row
     does not reflow while text is streaming into the textarea above it. */
  .btn.ai { color: var(--ink-3); }
  .btn.ai:hover:not([disabled]) { color: var(--accent); }
  .btn.ai.working { opacity: 1; color: var(--accent); animation: ai-pulse 1.2s ease-in-out infinite; }
  @keyframes ai-pulse {
    0%, 100% { opacity: 0.45; }
    50% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn.ai.working { animation: none; }
  }

  /* ================= notices ================= */
  .note {
    margin: 0;
    padding: 9px 12px;
    border-top: 1px solid var(--note-line);
    background: var(--note-bg);
    color: var(--note-fg);
    font-size: 11px;
  }
  .warn {
    margin: 8px 0 0;
    padding: 8px 11px;
    border: 1px solid var(--note-line);
    border-radius: 8px;
    background: var(--note-bg);
    color: var(--note-fg);
    font-size: 11px;
  }
  .warn ul { margin: 4px 0 0; padding-left: 18px; }
  /* The result of the LAST mutation, good or bad. A failure is rendered here
     and never as the runtime's red traceback overlay: a git refusal is an
     ordinary answer, not a bug in this view. */
  .flash {
    margin: 0 0 10px;
    padding: 8px 11px;
    border: 1px solid var(--good-line);
    border-radius: 8px;
    background: var(--good-bg);
    color: var(--good-fg);
    font-size: 12px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .flash.bad { border-color: var(--bad-line); background: var(--bad-bg); color: var(--bad-fg); }

  /* ================= confirmation ================= */
  /* In-view and inline, never `window.confirm`: this document renders inside an
     iframe, where a native dialog is at best chrome the user cannot place and at
     worst suppressed entirely. Inline also puts the question next to the row it
     is about, which is the whole reason it is being asked. */
  .confirm {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 8px 12px;
    border-top: 1px solid var(--danger-line);
    background: var(--danger-bg);
    color: var(--danger);
    font-size: 12px;
  }
  .confirm .q { flex: 1; min-width: 12ch; }

  /* ================= dropdown panels ================= */
  .panel {
    margin-top: 8px;
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    background: var(--surface);
    overflow: hidden;
  }
  .panel-head {
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink-3);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .panel-form {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 9px 12px;
    border-top: 1px solid var(--line);
  }
  .panel-form input[type="text"] {
    flex: 1;
    min-width: 12ch;
    padding: 4px 8px;
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    background: var(--bg);
    color: var(--ink);
    font: inherit;
    font-size: 12px;
  }
  .panel-form input[type="text"]:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  .panel-form label { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); font-size: 12px; }
  .panel-form input[type="checkbox"] { accent-color: var(--accent-dim); }

  /* ================= rows ================= */
  .rows {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    overflow: hidden;
  }
  .line {
    display: flex;
    align-items: center;
    gap: 8px;
    border-top: 1px solid var(--line);
  }
  .line:first-child { border-top: 0; }
  .line:hover { background: var(--surface-2); }
  .line[aria-current="true"] {
    background: var(--surface-2);
    box-shadow: inset 3px 0 0 0 var(--accent);
  }
  .line .acts { display: flex; gap: 4px; flex: none; padding-right: 8px; }
  .row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex: 1;
    min-width: 0;
    padding: 7px 12px;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  div.row { cursor: default; }
  .line[aria-current="true"] .subject, .line[aria-current="true"] .path { font-weight: 700; }
  .row .sha {
    flex: none;
    color: var(--accent-dim);
    font-variant-numeric: tabular-nums;
  }
  .row .subject, .row .path {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* Two trailing columns rather than one "author · date" string: in a 420px
     list the single string truncated from the RIGHT, which ate the date — the
     one field you actually scan a log by. So the date is `flex: none` and never
     truncates, and the author is the field that gives way. */
  .row .who {
    flex: none;
    max-width: 12ch;
    color: var(--ink-3);
    font-size: 11px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row .when {
    flex: none;
    color: var(--ink-3);
    font-size: 11px;
    white-space: nowrap;
  }
  .row .code {
    flex: none;
    width: 2ch;
    white-space: pre;
    font-weight: 700;
    color: var(--st-new);
  }
  .row .code.is-A { color: var(--st-add); }
  .row .code.is-M, .row .code.is-T { color: var(--st-mod); }
  .row .code.is-D { color: var(--st-del); }
  .row .code.is-R, .row .code.is-C { color: var(--st-ren); }
  .row .where.is-moved { border-color: var(--st-ren); color: var(--st-ren); }
  .row .where {
    flex: none;
    padding: 0 6px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    color: var(--ink-3);
    font-size: 10px;
    letter-spacing: 0.04em;
  }
  .row .where.is-current { border-color: var(--accent-dim); color: var(--accent-dim); }

  .more {
    display: block;
    width: 100%;
    padding: 9px 12px;
    border: 0;
    border-top: 1px solid var(--line);
    background: transparent;
    color: var(--ink-2);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .more:hover { color: var(--ink); background: var(--surface-2); }
  .more:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .more[disabled] { color: var(--ink-3); cursor: default; background: transparent; }

  .none { padding: 12px; color: var(--ink-3); font-size: 12px; }
  .hint { color: var(--ink-3); font-size: 11px; }

  /* ================= diff pane ================= */
  .pane {
    position: sticky;
    top: 0;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    overflow: hidden;
  }
  .pane-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--surface-2);
  }
  .pane-head .title {
    flex: 1;
    min-width: 0;
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pane-head .sub { color: var(--ink-3); font-size: 11px; }

  /* The one place wide content lives: its OWN scroll container, so the page
     body never gains a horizontal scrollbar (a diff line is arbitrarily long). */
  .diff {
    margin: 0;
    padding: 0;
    max-height: 70vh;
    overflow: auto;
    font-size: 12px;
    line-height: 1.45;
    tab-size: 4;
  }
  .diff .ln {
    display: block;
    padding: 0 12px;
    white-space: pre;
    color: var(--ink);
  }
  .diff .ln.add { background: var(--diff-add-bg); color: var(--diff-add-fg); }
  .diff .ln.del { background: var(--diff-del-bg); color: var(--diff-del-fg); }
  .diff .ln.hunk { color: var(--diff-hunk-fg); }
  .diff .ln.meta { color: var(--diff-meta-fg); }

  /* ================= empty / error state ================= */
  .empty {
    margin-top: 36px;
    padding: 28px 24px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    text-align: center;
  }
  .empty .glyph { color: var(--ink-3); }
  .empty h2 { margin: 12px 0 6px; font-size: 15px; font-weight: 700; }
  .empty p { margin: 0 auto; max-width: 46ch; color: var(--ink-2); font-size: 12px; }

  /* ================= skeleton =================
     Laid out at the real thing's dimensions, so nothing jumps when data lands. */
  .skel-bar {
    border-radius: 4px;
    background: linear-gradient(90deg, var(--surface-2) 25%, var(--skel-shine) 50%, var(--surface-2) 75%);
    background-size: 200% 100%;
    animation: skel-shimmer 1.3s ease-in-out infinite;
  }
  @keyframes skel-shimmer {
    0% { background-position: 100% 0; }
    100% { background-position: -100% 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .skel-bar { animation: none; }
    .row, .more, .btn { transition: none; }
  }
  .skel-h2 { height: 11px; width: 120px; margin: 0 0 10px; }
  .skel-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--line); }
  .skel-row:first-child { border-top: 0; }
  .skel-cell { height: 12px; }
  .skel-bar.skel-toolbar { height: 32px; width: 100%; border-radius: 10px; margin-bottom: 10px; }
  .skel-bar.skel-box { height: 62px; width: 100%; border-radius: 10px; margin-bottom: 18px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
<div id="root">
  <div id="skeleton">
    <div class="skel-bar skel-toolbar"></div>
    <div class="skel-bar skel-box"></div>
    <div class="cols no-diff">
      <div class="col">
        <section>
          <div class="skel-bar skel-h2"></div>
          <div class="rows">
            <div class="skel-row"><span class="skel-bar skel-cell" style="width:2ch"></span><span class="skel-bar skel-cell" style="width:44%"></span></div>
            <div class="skel-row"><span class="skel-bar skel-cell" style="width:2ch"></span><span class="skel-bar skel-cell" style="width:32%"></span></div>
          </div>
        </section>
        <section>
          <div class="skel-bar skel-h2" style="width:90px"></div>
          <div class="rows">
            <div class="skel-row"><span class="skel-bar skel-cell" style="width:7ch"></span><span class="skel-bar skel-cell" style="width:48%"></span><span class="skel-bar skel-cell" style="width:76px;margin-left:auto"></span></div>
            <div class="skel-row"><span class="skel-bar skel-cell" style="width:7ch"></span><span class="skel-bar skel-cell" style="width:36%"></span><span class="skel-bar skel-cell" style="width:76px;margin-left:auto"></span></div>
            <div class="skel-row"><span class="skel-bar skel-cell" style="width:7ch"></span><span class="skel-bar skel-cell" style="width:54%"></span><span class="skel-bar skel-cell" style="width:76px;margin-left:auto"></span></div>
          </div>
        </section>
      </div>
    </div>
  </div>
  <div id="view" hidden></div>
</div>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ------------------------------------------------------------------ state
 * This view is COMMIT MANAGEMENT: what is staged, what changed, what is
 * untracked, what is stashed, plus the toolbar's branch/remote actions and the
 * commit box. It draws NO history — the commit log is the `versions` mode's
 * view of the same repository, and the two are offered side by side on every
 * target inside a work tree, so a History section here was one story told
 * twice. The overview read opts out of the log entirely (`history: ""`), so
 * opening this view does not run `git log` at all.
 *
 * Params ARE the state (the house pattern): every piece of UI state lives in
 * the URL, so a refresh or a bookmark reproduces the exact view — including an
 * open diff pane, an open dropdown, a half-typed commit message and a pending
 * destructive confirmation.
 *
 *   wt=<relpath>  the selected change, whose diff fills the right-hand pane
 *   panel=branch|stash   which toolbar dropdown is open
 *   msg=<text>    the commit message draft
 *   ask=<key>     the destructive action awaiting confirmation, e.g.
 *                 "discard:pkg/mod.py", "discard_all", "stash_drop:0"
 *
 * `msg` and `ask` are the two additions that are easy to argue against and
 * belong here anyway. A commit message is the most expensive thing in this view
 * to retype, so losing it to a refresh is the worst small bug it could have; and
 * a confirmation that survives a refresh cannot be bypassed by one.
 */
const READER = "./log.py";
const OPS = "./ops.py";

/* The ops that can lose uncommitted work. Mirrors ops.py's DESTRUCTIVE_OPS, and
 * the mirroring is the safety property: an op named here gets the inline
 * confirmation step, and one that is not gets called on the first click. */
const DESTRUCTIVE = new Set(["discard", "discard_all", "stash_drop"]);

const file = fused.params.get("_file") || "";
const skeleton = document.getElementById("skeleton");
const view = document.getElementById("view");
const live = document.getElementById("live");

/* Serial guard: concurrent runPython calls can resolve out of order, and a
 * stale overview landing after a fresh one would repaint the wrong data. Every
 * mutation bumps it too, so an in-flight overview cannot repaint OVER the fresh
 * one a mutation just asked for. */
let seq = 0;
/* The last good overview + stash list, kept so selecting a commit repaints the
 * pane without refetching the lists. */
let snapshot = null;
/* Which structural param combination the DOM currently shows. A `msg` keystroke
 * changes the URL but not the structure, so comparing this is what keeps typing
 * from tearing the textarea out from under the cursor on every character. */
let drawn = null;
/* The op currently in flight (a string key), and the result of the last one.
 * Both live in memory rather than the URL: an in-flight call cannot survive a
 * refresh, and a result that outlived its action would be a lie. */
let busy = null;
let flash = null;

const num = (key, fallback) => {
  const raw = parseInt(fused.params.get(key) || "", 10);
  return Number.isFinite(raw) && raw > 0 ? raw : fallback;
};
const param = (key) => fused.params.get(key) || "";

/* `fused.params` has no delete — an empty string is how a param is cleared, and
 * it leaves `key=` behind in the URL. So a no-op write is SKIPPED: clearing `wt`
 * while selecting a commit is the common case, and writing it would stamp a bare
 * `&wt=` onto every URL the view produces. It also keeps `onChange` (hence
 * `draw`) from firing for a write that changed nothing. */
function setParams(patch) {
  for (const [key, value] of Object.entries(patch)) {
    const next = value === null ? "" : String(value);
    if ((fused.params.get(key) || "") === next) continue;
    fused.params.set(key, next);
  }
}

const el = (tag, props, ...kids) => {
  const node = Object.assign(document.createElement(tag), props || {});
  for (const kid of kids.flat()) {
    if (kid !== null && kid !== undefined && kid !== false) node.append(kid);
  }
  return node;
};

const plural = (n, one, many) => n + " " + (n === 1 ? one : (many || one + "s"));

/* ------------------------------------------------------------------ chrome */

function icon(paths, size) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("width", size || 28);
  svg.setAttribute("height", size || 28);
  svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor");
  svg.setAttribute("stroke-width", "1.6");
  svg.setAttribute("stroke-linecap", "round");
  svg.setAttribute("stroke-linejoin", "round");
  svg.setAttribute("aria-hidden", "true");
  for (const d of paths) {
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", d);
    svg.append(p);
  }
  return svg;
}

const BRANCH_GLYPH = ["M6 6v12", "M18 9a9 9 0 0 1-9 9", "M6 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4z",
                      "M18 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4z", "M6 22a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"];

/* A counter-clockwise circular arrow — "roll this file back to where it was".
   The `↩` glyph it replaces reads as "return"/"enter" (or as a reply arrow in
   mail), which is the wrong promise for a control that destroys work; a full
   restore-history loop says "revert" without needing the tooltip. */
const REVERT_GLYPH = ["M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8", "M3 3v5h5"];

function emptyState(title, message) {
  return el("div", { className: "empty" },
    el("div", { className: "glyph" }, icon(BRANCH_GLYPH, 30)),
    el("h2", { textContent: title }),
    el("p", { textContent: message }));
}

/* A button that runs an op. `key` is what `busy` holds while the call is in
 * flight, so exactly the control that was clicked is the one that disables —
 * the whole view staying live is what keeps a slow `push` from feeling like a
 * freeze. */
function action(key, label, opts) {
  const settings = opts || {};
  const btn = el("button", {
    className: "btn" + (settings.className ? " " + settings.className : ""),
    type: "button",
    disabled: busy !== null || settings.disabled === true,
    title: settings.title || "",
  }, label);
  if (settings.label) btn.setAttribute("aria-label", settings.label);
  if (settings.count !== undefined && settings.count !== null) {
    btn.append(el("span", { className: "count", textContent: String(settings.count) }));
  }
  if (settings.expanded !== undefined) {
    btn.setAttribute("aria-expanded", String(settings.expanded));
  }
  btn.addEventListener("click", (event) => {
    event.preventDefault();
    if (busy !== null) return;
    settings.onClick(key);
  });
  return btn;
}

/* A destructive action is never called from its own button: the button asks,
 * and the confirmation calls. `ask` lives in the URL so the pending question
 * survives a refresh rather than being silently dropped by one. */
function confirmable(key, label, question, opts) {
  return action(key, label, Object.assign({}, opts, {
    onClick: () => setParams({ ask: key }),
    className: ((opts && opts.className) ? opts.className + " " : "") + "danger",
    title: question,
  }));
}

function confirmBar(question, run) {
  const bar = el("div", { className: "confirm", role: "alertdialog" },
    el("span", { className: "q", textContent: question }));
  bar.append(action("confirm", "Yes, do it", {
    className: "danger", onClick: () => { setParams({ ask: null }); run(); },
  }));
  bar.append(action("cancel", "Cancel", { onClick: () => setParams({ ask: null }) }));
  return bar;
}

/* ------------------------------------------------------- repository state text
 *
 * A template renders INSIDE the shell's chrome — breadcrumb, preview header, mode
 * switcher — so it does not own a header of its own (owner ruling: "a template is
 * not the same as app, it does not require any headers"). Anything the shell
 * already says (the repo's name, the path this view is scoped to) is therefore not
 * repeated at all. The toolbar below is not a header: every item in it is a
 * CONTROL, and the branch name is on it because it is the thing you click to
 * change branches, not because it is a title.
 */

function headState(repo) {
  if (repo.detached) return "detached at " + (repo.head || "unknown commit");
  return repo.branch || "no branch";
}

/* ------------------------------------------------------------------ toolbar */

function toolbar(data, stashes) {
  const repo = data.repo;
  const panel = param("panel");
  const bar = el("div", { className: "bar" });

  bar.append(action("panel-branch", el("span", { textContent: headState(repo) }), {
    label: "Branch: " + headState(repo) + " — switch or create a branch",
    expanded: panel === "branch",
    onClick: () => setParams({ panel: panel === "branch" ? null : "branch" }),
  }));

  bar.append(el("div", { className: "rule" }));

  const remote = repo.remote;
  bar.append(action("fetch", "⟳ Fetch", {
    disabled: !remote,
    title: remote ? "git fetch --prune " + remote
                  : "This repository has no remote to fetch from.",
    onClick: () => run("fetch", { op: "fetch" }),
  }));
  bar.append(action("pull", "↓ Pull", {
    disabled: !remote,
    count: repo.behind || null,
    title: repo.behind
      ? plural(repo.behind, "commit") + " to pull (fast-forward only)"
      : "git pull --ff-only",
    onClick: () => run("pull", { op: "pull" }),
  }));
  /* Two different words for two different acts. With an upstream this pushes to
     it; without one it CREATES the remote branch and records it, which is a
     bigger thing than "push" and so says so. */
  bar.append(action("push", repo.upstream ? "↑ Push" : "↑ Publish branch", {
    disabled: !remote || repo.detached,
    count: repo.upstream ? (repo.ahead || null) : null,
    title: repo.detached ? "HEAD is detached — there is no branch to push."
      : repo.upstream ? "git push to " + repo.upstream
      : "Create " + (repo.branch || "this branch") + " on " + (remote || "the remote")
        + " and track it",
    onClick: () => run("push", { op: "push" }),
  }));

  bar.append(el("div", { className: "gap" }));

  bar.append(action("panel-stash", "Stash", {
    label: "Stash the changes under this path",
    expanded: panel === "stash",
    count: stashes.length || null,
    onClick: () => setParams({ panel: panel === "stash" ? null : "stash" }),
  }));

  const wrap = el("div", null, bar);
  if (panel === "branch") wrap.append(branchPanel(data));
  if (panel === "stash") wrap.append(stashPanel(data));
  return wrap;
}

/* ------------------------------------------------------------ branch panel */

/* The branch list is fetched only when the panel is open. It is the one read in
   this view that is NOT scoped to the open path — a branch is a repository
   concept, so checking one out is inherently repo-wide (GT-13), and pretending
   otherwise would be the lie. */
let branchCache = null;

function branchPanel(data) {
  const panel = el("div", { className: "panel" },
    el("div", { className: "panel-head", textContent: "Branches" }));

  if (!branchCache) {
    panel.append(el("div", { className: "none", textContent: "Reading branches…" }));
    return panel;
  }
  if (!branchCache.ok) {
    panel.append(el("div", { className: "none",
                             textContent: branchCache.message || "Could not read branches." }));
    return panel;
  }

  const rows = el("div", { className: "rows" });
  for (const branch of branchCache.branches) {
    const line = el("div", { className: "line" });
    const row = el("button", {
      className: "row", type: "button",
      disabled: busy !== null || branch.current,
      title: branch.upstream ? "tracks " + branch.upstream : "no upstream",
    },
      el("span", { className: "path", textContent: branch.name }),
      branch.upstream && (branch.ahead || branch.behind)
        ? el("span", { className: "where",
                       textContent: "↑" + branch.ahead + " ↓" + branch.behind })
        : null,
      branch.current ? el("span", { className: "where is-current", textContent: "current" }) : null);
    row.addEventListener("click", () => run("checkout:" + branch.name, {
      op: "branch_checkout", name: branch.name,
    }));
    line.append(row);
    if (!branch.current) {
      /* `branch -d` and never `-D`: it refuses a branch whose commits are
         reachable from nowhere else, so it cannot lose work and needs no
         confirmation — git's own refusal IS the safety step. */
      line.append(el("div", { className: "acts" }, action("del:" + branch.name, "✕", {
        className: "icon", label: "Delete branch " + branch.name,
        title: "Delete " + branch.name + " (refused if it is not fully merged)",
        onClick: () => run("del:" + branch.name, { op: "branch_delete", name: branch.name }),
      })));
    }
    rows.append(line);
  }
  if (!branchCache.branches.length) {
    rows.append(el("div", { className: "none", textContent: "No local branches yet." }));
  }
  panel.append(rows);
  if (branchCache.truncated) {
    panel.append(el("p", { className: "note", textContent:
      "Only the " + branchCache.branches.length + " most recently updated "
      + "branches are listed." }));
  }

  const name = el("input", { type: "text", placeholder: "new-branch-name",
                             disabled: busy !== null });
  const create = (checkout) => {
    const value = name.value.trim();
    if (!value) return;
    run("create", { op: "branch_create", name: value, checkout });
  };
  name.addEventListener("keydown", (event) => {
    if (event.key === "Enter") { event.preventDefault(); create(true); }
  });
  panel.append(el("div", { className: "panel-form" }, name,
    action("create", "Create + switch", { onClick: () => create(true) }),
    action("create-only", "Create only", { onClick: () => create(false) })));
  return panel;
}

/* ------------------------------------------------------------- stash panel */

function stashPanel(data) {
  const scope = data.repo.rel || "this repository";
  const panel = el("div", { className: "panel" },
    el("div", { className: "panel-head", textContent: "Stash changes in " + scope }));
  const message = el("input", { type: "text", placeholder: "message (optional)",
                                disabled: busy !== null });
  const untracked = el("input", { type: "checkbox", disabled: busy !== null });
  const push = () => run("stash_push", {
    op: "stash_push", message: message.value, include_untracked: untracked.checked,
  });
  message.addEventListener("keydown", (event) => {
    if (event.key === "Enter") { event.preventDefault(); push(); }
  });
  panel.append(el("div", { className: "panel-form" }, message,
    el("label", null, untracked, "include untracked"),
    action("stash_push", "Stash", { onClick: push })));
  return panel;
}

/* ------------------------------------------------------------- commit box */

/* Null when there is nothing to commit.
 *
 * The box is an affordance for an action that cannot be taken with an empty
 * index, and a permanently disabled button that says "nothing staged" is a
 * control teaching you it does not work — it occupied the top of the view in
 * the state the view spends most of its time in (a clean tree), pushing the
 * lists that DO have something to say further down.
 *
 * The test is what a commit would actually RECORD, which is the index and not
 * this scope: `staged` counts what is staged under the open path and
 * `outside.count` what is staged elsewhere (GT-14). Gating on `staged` alone
 * would hide the box while `git commit` still had work to do, which is the
 * same dishonesty in the other direction — so a scope with nothing staged of
 * its own still shows the box when the index is non-empty, carrying the
 * warning below that says whose changes those are. */
function commitBox(data) {
  const staged = data.changes.filter((c) => c.staged).length;
  const outside = data.staged_outside || { count: 0, paths: [] };
  const total = staged + outside.count;
  if (!total) return null;
  const message = param("msg");

  const box = el("textarea", {
    id: "msg",
    value: message,
    placeholder: "Message (Ctrl+Enter to commit)",
    disabled: busy !== null,
  });
  box.setAttribute("aria-label", "Commit message");
  /* Written to the URL on every keystroke, but `draw` ignores a change that
     only touches `msg` — otherwise each character would repaint the textarea
     out from under the caret. */
  box.addEventListener("input", () => setParams({ msg: box.value }));
  box.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
      event.preventDefault();
      commit(box.value);
    }
  });

  const actions = el("div", { className: "commit-actions" },
    /* No staged-count gate on `disabled`: the box does not exist unless the
       index has something in it, so the only thing that can disable this
       button is a call already in flight (`action` applies `busy` itself). */
    action("commit", "✓ Commit", {
      className: "primary",
      count: total,
      title: "Commit everything that is staged",
      onClick: () => commit(box.value),
    }),
    generateButton(),
    el("span", { className: "hint",
                 textContent: plural(total, "staged change") + " will be committed" }));

  const wrap = el("div", { className: "commit" }, box, actions);

  /* GT-14, the honesty rule. `git commit` records the INDEX — that is what the
     word means — so a commit made from a view scoped to `pkg/` also carries
     whatever is staged elsewhere. The alternative (`git commit -- <paths>`)
     would commit the WORKING TREE for those paths and bypass the index, which
     is a silent data surprise rather than a fix. So the view says it instead. */
  if (outside.count) {
    const warn = el("div", { className: "warn" },
      el("strong", { textContent: "⚠ " + plural(outside.count, "staged change")
                                  + " outside this scope will also be committed." }));
    const list = el("ul");
    for (const path of outside.paths) list.append(el("li", { textContent: path }));
    warn.append(list);
    if (outside.count > outside.paths.length) {
      warn.append(el("div", { textContent: "… and "
        + (outside.count - outside.paths.length) + " more." }));
    }
    wrap.append(warn);
  }
  return wrap;
}

/* ------------------------------------------------- AI commit message (GT-18)
 *
 * The sparkle writes the message the user was about to type, from the diff the
 * commit would record. Everything about it is deliberately narrow: it fills a
 * TEXTAREA and never commits, it is one button with no options, and what it
 * produces is a draft the user edits and sends — Ctrl+Enter still commits
 * whatever is in the box, generated or typed.
 */

const SPARK_GLYPH = ["M11 3.5l1.7 4.3 4.3 1.7-4.3 1.7L11 15.5 9.3 11.2 5 9.5l4.3-1.7z",
                     "M17.5 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"];

/* Written as a SYSTEM prompt rather than folded into the diff message, so the
   rules are not one more thing the model has to notice inside 80 KB of patch.
   Every clause here is a failure mode of the naive version: a preamble ("Here
   is a commit message:"), a code fence around it, a subject that runs past what
   `git log --oneline` shows, and a three-paragraph body explaining a one-line
   change. */
const AI_SYSTEM = [
  "You write git commit messages. Reply with the commit message ONLY —",
  "no preamble, no explanation, no code fences, no surrounding quotes.",
  "Line 1 is a summary in the imperative mood ('add', not 'added'/'adds'),",
  "at most 72 characters, no trailing period. Use a conventional-commit",
  "prefix (feat/fix/docs/refactor/test/chore) when one clearly applies.",
  "Add a body ONLY when the change genuinely needs one: separate it with a",
  "blank line, wrap at 72 columns, and say WHY rather than restating the diff.",
  "Most changes need no body at all. Never invent an issue number.",
].join(" ");

/* True while a generation is in flight. Module-level rather than a closure over
   the button, because a repaint (any mutation elsewhere in the view) rebuilds
   the button — reading the flag at BUILD time is what keeps the rebuilt button
   disabled instead of handing the user a second click into the same stream. */
let aiBusy = false;

function generateButton() {
  return action("ai", icon(SPARK_GLYPH, 14), {
    className: "icon ai" + (aiBusy ? " working" : ""),
    disabled: aiBusy,
    label: "Generate a commit message with AI",
    title: aiBusy ? "Writing a commit message…"
                  : "Write a commit message from the staged changes",
    onClick: generateMessage,
  });
}

/* The one writer of the box during generation, and it re-finds the node every
   time rather than closing over it: a mutation elsewhere in the view repaints
   between two chunks, and the textarea the stream started in is by then
   detached. Writing `msg` as well is what makes that survivable — the rebuilt
   box is filled from the param, so the text picks up where it left off. */
function setMessage(text) {
  const box = document.getElementById("msg");
  if (box) box.value = text;
  setParams({ msg: text });
}

/* The model is asked not to fence its answer (AI_SYSTEM), so this is the belt
   to that braces: a stray ``` wrapper is stripped rather than committed. */
function cleanMessage(text) {
  const trimmed = (text || "").trim();
  const fenced = trimmed.match(/^```[a-z]*\n([\s\S]*?)\n?```$/i);
  return (fenced ? fenced[1] : trimmed).trim();
}

function aiPrompt(payload) {
  const parts = [payload.kind === "staged"
    ? "These changes are STAGED — they are exactly what the next commit will record."
    : "NOTHING is staged yet; these are the uncommitted changes in the working tree."];
  if (payload.branch) parts.push("Branch: " + payload.branch);
  if (payload.scope) parts.push("The view is scoped to: " + payload.scope);
  if (payload.files.length) {
    parts.push("Files changed:\n" + payload.files.map((f) => "- " + f).join("\n")
      + (payload.files_truncated ? "\n- (more files than are listed here)" : ""));
  }
  if (payload.diff) {
    parts.push("Diff:\n```diff\n" + payload.diff + "\n```"
      + (payload.truncated
         ? "\n(The diff was cut off at this view's size cap — describe what is "
           + "shown and do not guess at the rest.)"
         : ""));
  }
  parts.push("Write the commit message.");
  return parts.join("\n\n");
}

/* A failure is a `flash`, exactly like a failed mutation: an AI that is not
   configured on this server, or a model that errored, is an ordinary answer
   this view reports in its own words — never the red traceback overlay. */
function aiFailed(message) {
  aiBusy = false;
  flash = { ok: false, message };
  announce(message);
  draw(true);
}

async function generateMessage() {
  if (aiBusy || busy !== null) return;
  aiBusy = true;
  flash = null;
  draw(true);                       // repaint with the sparkle pulsing

  let payload;
  try {
    payload = await fused.runPython(READER, { file, op: "pending" }, chan("pending"));
  } catch (err) {
    payload = { ok: false, message: err && err.message ? err.message : String(err) };
  }
  if (!payload.ok) {
    aiFailed("Could not read the changes: " + (payload.message || "git refused that."));
    return;
  }
  if (payload.empty) {
    aiFailed("There is nothing to describe — no changes were found.");
    return;
  }

  /* Cleared on click, VS Code's behaviour: the button REPLACES the draft rather
     than appending to it, so what streams in is readable as it arrives. The
     previous text is kept for the failure path — losing a typed message to a
     server that has no AI configured would be the worst outcome here. */
  const box = document.getElementById("msg");
  const before = box ? box.value : param("msg");
  let received = "";
  setMessage("");
  try {
    const result = await fused.ai(aiPrompt(payload), {
      systemPrompt: AI_SYSTEM,
      effort: "low",              // a commit message is not a thinking problem
      onChunk: (text) => {
        received += text;
        setMessage(cleanMessage(received));
      },
    });
    const message = cleanMessage(result.text);
    if (!message) throw new Error("The AI returned an empty message.");
    aiBusy = false;
    setMessage(message);
    announce("Commit message written. Review it, then commit.");
    draw(true);
    const written = document.getElementById("msg");
    if (written) written.focus();
  } catch (err) {
    if (!received) setMessage(before);
    aiFailed(err && err.type === "ai_unavailable"
      ? "AI is not available on this server."
      : "Could not write a commit message: "
        + ((err && err.message) || "the request failed."));
  }
}

function commit(message) {
  if (!message.trim()) {
    flash = { ok: false, message: "Write a commit message before committing." };
    draw(true);
    return;
  }
  run("commit", { op: "commit", message }, () => { setParams({ msg: null }); });
}

/* ------------------------------------------------- uncommitted change lists */

/* Whether `ops.py` would let this row be CHANGED — the mirror of that module's
   `_in_scope`, and it has to be a mirror rather than an approximation, because a
   button that is always refused is worse than no button: it advertises an action
   ("delete this whole directory") the module is guaranteed to decline.

   Two rows the reader deliberately lists fail this. A rename with only one side
   in the scope is shown because "this file left the folder you are looking at"
   is the change a scoped view exists for — but its path is elsewhere. And a
   wholly-untracked directory git collapsed to `dir/` can be an ANCESTOR of the
   scope, so it covers files outside it and discarding it would reach them. Both
   still open their diff; neither offers an action. */
function writable(repo, path) {
  if (!repo.rel) return true;                     // the whole repo is the scope
  const rel = path.replace(/\/+$/, "");           // a collapsed `dir/` row
  if (rel === repo.rel) return true;
  return repo.is_dir && rel.startsWith(repo.rel + "/");
}

function changeLine(repo, change, selected, kind) {
  const letter = change.untracked ? "?" : (change.x !== " " ? change.x : change.y);
  const label = change.orig ? change.orig + " -> " + change.path : change.path;
  const line = el("div", { className: "line" });
  const row = el("button", {
    className: "row",
    type: "button",
    title: (change.label || kind) + " — " + label,
  },
    el("span", { className: "code is-" + letter, textContent: change.status }),
    el("span", { className: "path", textContent: label }),
    /* A rename with only one side in the open scope is a MOVE relative to it,
       and the direction is the fact worth reading — "renamed" says nothing about
       a file that left the folder you are looking at. */
    change.moved
      ? el("span", { className: "where is-moved", textContent: "moved " + change.moved })
      : null);
  /* An out-of-scope row's `path` is outside the scope, but the diff is
     `-- <path>` against HEAD and git resolves it from the repo ROOT, so the row
     still opens the right diff: the pathspec is repo-relative, not
     scope-relative. Its ACTIONS are a different matter — see `writable`. */
  row.addEventListener("click", () => setParams({ wt: change.path }));
  if (selected) line.setAttribute("aria-current", "true");
  line.append(row);

  const acts = el("div", { className: "acts" });
  const path = change.path;
  if (writable(repo, path)) {
    if (kind === "staged") {
      acts.append(action("unstage:" + path, "−", {
        className: "icon", label: "Unstage " + path,
        onClick: () => run("unstage:" + path, { op: "unstage", paths: [path] }),
      }));
      /* The section is in the KEY, not derived from the entry later. An `MM`
         file is in both lists and both rows would otherwise build the identical
         `discard:<path>`, so the confirmation could not tell which revert was
         clicked — it re-derived "staged" from the entry, and the CHANGES row's
         revert, whose question says only "discard changes in <path>", quietly
         threw away the staged version as well. */
      acts.append(confirmable("discard:staged:" + path, icon(REVERT_GLYPH, 14),
        "Unstage and discard " + path + "? Both the staged version and the "
        + "working-tree version go. This cannot be undone.",
        { className: "icon", label: "Unstage and discard " + path }));
    } else {
      acts.append(action("stage:" + path, "+", {
        className: "icon", label: "Stage " + path,
        onClick: () => run("stage:" + path, { op: "stage", paths: [path] }),
      }));
      acts.append(confirmable("discard:worktree:" + path, icon(REVERT_GLYPH, 14),
        (change.untracked ? "Delete the untracked file " + path + "?"
                          : "Discard the unstaged changes in " + path
                            + "? Anything staged for it is kept.")
        + " This cannot be undone.",
        { className: "icon", label: "Discard " + path }));
    }
  }
  line.append(acts);
  return line;
}

function stashLine(stash) {
  const line = el("div", { className: "line" });
  line.append(el("div", { className: "row" },
    el("span", { className: "sha", textContent: stash.ref }),
    el("span", { className: "path", textContent: stash.message }),
    stash.branch ? el("span", { className: "where", textContent: stash.branch }) : null,
    el("span", { className: "when", textContent: stash.relative })));
  /* Every stash call carries the entry's COMMIT ID as well as its index.
     `stash@{n}` is a position, and a `stash push` from anywhere — this view,
     another tab, a terminal — renumbers every entry, so an index alone can
     address a different, still-wanted stash by the time the call lands. That is
     survivable for apply and unrecoverable for drop, which is why the id travels
     with all three and ops.py verifies it before touching anything. */
  line.append(el("div", { className: "acts" },
    action("apply:" + stash.index, "apply", {
      title: "Apply " + stash.ref + " and keep it",
      onClick: () => run("apply:" + stash.index,
                         { op: "stash_apply", index: stash.index, sha: stash.sha }),
    }),
    action("pop:" + stash.index, "pop", {
      title: "Apply " + stash.ref + " and remove it",
      onClick: () => run("pop:" + stash.index,
                         { op: "stash_pop", index: stash.index, sha: stash.sha }),
    }),
    confirmable("stash_drop:" + stash.index + ":" + stash.sha, "drop",
      "Drop " + stash.ref + "? The stashed changes are gone for good.",
      { label: "Drop " + stash.ref })));
  return line;
}

/* A section with a header, an action cluster on the right of the header, rows,
   and — when this section owns the pending confirmation — the confirm bar
   directly under the rows it is about. */
function listSection(title, count, controls, rows, emptyText, footer, state) {
  const body = el("div", { className: "rows" });
  if (rows.length) {
    for (const row of rows) body.append(row);
  } else {
    body.append(el("div", { className: "none", textContent: emptyText }));
  }
  if (footer) body.append(footer);
  return el("section", null,
    el("h2", null, title,
      count !== null ? el("span", { className: "n", textContent: count }) : null,
      state ? el("span", { className: "sep", textContent: "·" }) : null,
      state ? el("span", { className: "state", textContent: state }) : null,
      el("span", { className: "spacer" }),
      controls || []),
    body);
}

/* ------------------------------------------------------------------ diff pane */

const LINE_CLASS = (line) => {
  if (line.startsWith("@@")) return "hunk";
  if (line.startsWith("+++") || line.startsWith("---")) return "meta";
  if (line.startsWith("+")) return "add";
  if (line.startsWith("-")) return "del";
  if (line.startsWith("diff ") || line.startsWith("index ")
      || line.startsWith("similarity ") || line.startsWith("rename ")
      || line.startsWith("new file") || line.startsWith("deleted file")
      || line.startsWith("old mode") || line.startsWith("new mode")
      || line.startsWith("Binary files")) return "meta";
  return "";
};

function diffBody(text) {
  const pre = el("pre", { className: "diff", tabIndex: 0 });
  /* One element per line rather than one big text node: a diff needs per-line
     backgrounds, and a stack of styled spans is what gives it them without a
     syntax highlighter. */
  const frag = document.createDocumentFragment();
  for (const line of text.split("\n")) {
    frag.append(el("span", { className: "ln " + LINE_CLASS(line), textContent: line || " " }));
  }
  pre.append(frag);
  return pre;
}

function diffPane(title, sub, payload) {
  const close = action("close", "Close", {
    onClick: () => setParams({ wt: null }),
  });

  const pane = el("div", { className: "pane" },
    el("div", { className: "pane-head" },
      el("span", { className: "title", textContent: title }),
      sub ? el("span", { className: "sub", textContent: sub }) : null,
      close));

  if (payload === "loading") {
    pane.append(el("div", { className: "rows" },
      el("div", { className: "skel-row" },
        el("span", { className: "skel-bar skel-cell", style: "width:70%" })),
      el("div", { className: "skel-row" },
        el("span", { className: "skel-bar skel-cell", style: "width:45%" })),
      el("div", { className: "skel-row" },
        el("span", { className: "skel-bar skel-cell", style: "width:60%" }))));
    return pane;
  }
  if (!payload.ok) {
    pane.append(el("div", { className: "none", textContent: payload.message || "Could not read that diff." }));
    return pane;
  }
  /* An untracked DIRECTORY has no diff — git collapsed it to one `dir/` row, so
     its honest answer is what is inside it. Each file clicks through to its own
     whole-file diff. */
  if (payload.kind === "untracked-dir") {
    if (!payload.files.length) {
      pane.append(el("div", { className: "none", textContent:
        "This directory is untracked and holds nothing git would add "
        + "(it may contain only ignored files)." }));
      return pane;
    }
    const rows = el("div", { className: "rows" });
    for (const name of payload.files) {
      const row = el("button", { className: "row", type: "button", title: name },
        el("span", { className: "code is-?", textContent: "??" }),
        el("span", { className: "path", textContent: name }));
      row.addEventListener("click", () => setParams({ wt: name }));
      rows.append(el("div", { className: "line" }, row));
    }
    pane.append(rows);
    if (payload.truncated) {
      pane.append(el("p", { className: "note", textContent:
        "Only the first " + payload.files.length + " untracked files in this "
        + "directory are listed." }));
    }
    return pane;
  }
  if (payload.empty) {
    /* Two different situations wore the commit sentence. A worktree entry that
       diffs to nothing is not "a commit that missed the scope" — it is a file
       whose content matches HEAD (mode-only change, or already reverted). */
    pane.append(el("div", { className: "none", textContent: payload.kind === "diff"
      ? "Nothing to show: this file's contents already match HEAD."
      : "Nothing in this commit touched the path this view is scoped to." }));
    return pane;
  }
  pane.append(diffBody(payload.diff));
  if (payload.truncated) {
    pane.append(el("p", { className: "note", textContent:
      "Diff truncated at " + payload.shown_lines + " lines (cap: "
      + payload.max_lines + " lines / " + Math.round(payload.max_bytes / 1024)
      + " KB). Open the file in git for the rest." }));
  }
  return pane;
}

/* ------------------------------------------------------------------ render */

function show(node) {
  /* Restore the caret if the commit box had it: a mutation repaints the whole
     view, and a message half-typed when someone clicks "stage" must not lose
     its cursor. */
  const focused = document.activeElement;
  const restore = focused && focused.id === "msg"
    ? { start: focused.selectionStart, end: focused.selectionEnd } : null;
  view.replaceChildren(node);
  skeleton.hidden = true;
  view.hidden = false;
  if (restore) {
    const box = document.getElementById("msg");
    if (box) {
      box.focus();
      try { box.setSelectionRange(restore.start, restore.end); } catch (_) { /* no-op */ }
    }
  }
}

function announce(text) {
  live.textContent = text;
}

function renderRefusal(payload) {
  /* Whole-VIEW refusals only — the reasons `_locate` can produce. A per-entry
     or per-op refusal never reaches here: it comes back from `run` or `loadDiff`
     and is rendered next to the control that caused it, which is where it
     belongs. */
  const titles = {
    "not-a-repo": "Not a git repository",
    "missing": "Nothing to show",
    "mount": "Not available on remote mounts",
    "no-git": "git is not available",
    "timeout": "git did not answer in time",
    "git-failed": "git could not read this repository",
    "bad-op": "Unsupported request",
  };
  show(el("div", null,
    emptyState(titles[payload.reason] || "Nothing to show",
               payload.message || "There is no git history for this path.")));
  announce(titles[payload.reason] || "No git history");
}

/* The pending confirmation, if any, rendered inside the section it belongs to.
 *
 * `ask` is a key the button wrote and this reads back, so the URL never carries
 * a callable. Its GRAMMAR is the fix for two bugs that were both "the key did
 * not say enough", so it now says everything the question needs:
 *
 *   discard_all
 *   discard:staged:<path>      the row in STAGED CHANGES
 *   discard:worktree:<path>    the row in CHANGES or UNTRACKED
 *   stash_drop:<index>:<sha>
 *
 * The section is IN the key rather than re-derived from the entry, because an
 * `MM` file appears in both lists and the two rows were building the same key.
 * The stash's commit id is in the key for the same reason ops.py wants it: a
 * confirmation can sit in the URL indefinitely, and a `stash push` in the
 * meantime renumbers every entry.
 *
 * Fields are split off the FRONT, never with a plain `split(":")`, because the
 * last field is a path and a path may contain a colon.
 */
function pendingConfirm(data) {
  const ask = param("ask");
  if (!ask) return null;
  const cut = ask.indexOf(":");
  const op = cut === -1 ? ask : ask.slice(0, cut);
  const rest = cut === -1 ? "" : ask.slice(cut + 1);
  if (!DESTRUCTIVE.has(op)) {
    /* A hand-written `ask=` for a non-destructive op is not a confirmation of
       anything; drop it rather than render a question about it. */
    return null;
  }
  if (op === "discard_all") {
    return {
      where: "changes",
      node: confirmBar(
        "Discard every change under " + (data.repo.rel || "this repository")
        + "? Modified files go back to the index and untracked files are deleted. "
        + "Ignored files are never touched. This cannot be undone.",
        () => run("discard_all", { op: "discard_all" })),
    };
  }
  if (op === "stash_drop") {
    const split = rest.indexOf(":");
    if (split === -1) return null;
    const index = parseInt(rest.slice(0, split), 10);
    const sha = rest.slice(split + 1);
    if (!Number.isFinite(index) || !sha) return null;
    return {
      where: "stashes",
      node: confirmBar("Drop stash@{" + index + "}? The stashed changes are gone "
                       + "for good.",
                       () => run("stash_drop", { op: "stash_drop", index, sha })),
    };
  }
  const split = rest.indexOf(":");
  if (split === -1) return null;
  const which = rest.slice(0, split);
  const path = rest.slice(split + 1);
  if (which !== "staged" && which !== "worktree") return null;
  const entry = data.changes.find((c) => c.path === path);
  return {
    where: which === "staged" ? "staged"
      : (entry && entry.untracked ? "untracked" : "changes"),
    node: confirmBar(
      which === "staged"
        ? "Unstage and discard " + path + "? Both the staged version and the "
          + "working-tree version go. This cannot be undone."
        : (entry && entry.untracked)
          ? "Delete the untracked file " + path + "? This cannot be undone."
          : "Discard the unstaged changes in " + path + "? Anything staged for "
            + "it is kept. This cannot be undone.",
      () => {
        /* Two calls for the staged row, deliberately. `discard` restores from
           the INDEX, so a staged change has to leave the index first or the
           discard silently restores the very content being thrown away. Each
           half is its own addressable op in ops.py — the view composes them
           behind ONE confirmation, it does not ask the backend for a compound
           verb. The CHANGES row does exactly one of them, which is why the two
           rows can no longer share a key. */
        if (which === "staged") {
          run("discard:" + path, { op: "unstage", paths: [path] }, () => {
            run("discard:" + path, { op: "discard", paths: [path] },
                null, "The change was unstaged, but discarding it failed");
            return true;
          });
        } else {
          run("discard:" + path, { op: "discard", paths: [path] });
        }
      }),
  };
}

function render(data, stashes, diff) {
  const wt = param("wt");
  const ask = pendingConfirm(data);

  const staged = data.changes.filter((c) => c.staged);
  const unstaged = data.changes.filter((c) => c.unstaged && !c.untracked);
  const untracked = data.changes.filter((c) => c.untracked);

  const truncNote = data.changes_truncated
    /* One flag, two causes (MAX_CHANGES or the status byte cap), so the wording
       has to be true of both — "the first N" is a lie when the cap fired before
       N entries were even in scope. */
    ? el("p", { className: "note", textContent:
        "This list is truncated: the repository has more uncommitted changes "
        + "than this view will read." })
    : null;

  const stagedSection = listSection("Staged changes", String(staged.length),
    staged.length ? action("unstage_all", "− Unstage all", {
      onClick: () => run("unstage_all", { op: "unstage_all" }),
    }) : null,
    staged.map((c) => changeLine(data.repo, c, c.path === wt, "staged")),
    "Nothing is staged under this path.",
    ask && ask.where === "staged" ? ask.node : null,
    headState(data.repo) + (data.repo.has_commits ? "" : " · no commits yet"));

  const changesSection = listSection("Changes", String(unstaged.length),
    unstaged.length ? [
      action("stage_all", "+ Stage all", {
        onClick: () => run("stage_all", { op: "stage_all" }),
      }),
      confirmable("discard_all", "↩ Discard all",
                  "Discard every change under this path?", {}),
    ] : null,
    unstaged.map((c) => changeLine(data.repo, c, c.path === wt, "changes")),
    data.repo.dirty ? "No unstaged changes under this path."
                    : "Working tree is clean.",
    ask && ask.where === "changes" ? ask.node : truncNote);

  /* This one section stages an explicit path LIST rather than the scope
     pathspec, so it has to apply `writable` itself — one out-of-scope row in the
     list would make ops.py refuse the whole call, taking the in-scope ones with
     it. */
  const stageableUntracked = untracked.filter((c) => writable(data.repo, c.path));
  const untrackedSection = listSection("Untracked", String(untracked.length),
    stageableUntracked.length ? action("stage_untracked", "+ Stage all", {
      onClick: () => run("stage_untracked", {
        op: "stage", paths: stageableUntracked.map((c) => c.path),
      }),
    }) : null,
    untracked.map((c) => changeLine(data.repo, c, c.path === wt, "untracked")),
    "Nothing untracked under this path.",
    ask && ask.where === "untracked" ? ask.node : null);

  const stashSection = listSection("Stashes", String(stashes.length), null,
    stashes.map(stashLine),
    "Nothing stashed.",
    ask && ask.where === "stashes" ? ask.node : null);

  /* No History section, and no "load more" paging behind it. The commit LOG is
     the `versions` mode's view of this repository — it renders the same commits
     with a timeline this one never had — and since both modes are now offered
     on every target inside a work tree, drawing it here too was one story told
     twice. What is left is the working tree: what is staged, what changed, what
     is untracked, what is stashed. */
  const left = el("div", { className: "col" },
    stagedSection, changesSection, untrackedSection, stashSection);

  const cols = el("div", { className: "cols" + (diff ? "" : " no-diff") }, left);
  if (diff) cols.append(el("div", { className: "col" }, diff));

  const page = el("div", null);
  if (flash) {
    page.append(el("div", { className: "flash" + (flash.ok ? "" : " bad"),
                            textContent: flash.message }));
  }
  page.append(toolbar(data, stashes));
  /* Guarded, not appended blind: `commitBox` returns null when nothing is
     staged, and `Node.append(null)` inserts the literal text "null". */
  const box = commitBox(data);
  if (box) page.append(box);
  page.append(cols);
  show(page);
}

/* ------------------------------------------------------------------ mutations */

/* The runPython CHANNEL for one operation, and the reason this view names them.
 *
 * `fused.runPython` supersedes by channel, and the default channel is the .py
 * PATH — so two calls to the same reader are the same channel whether or not
 * they ask it different questions. Superseding is not a cancel: the older call
 * gets a promise that NEVER SETTLES (runtime.js: "hang forever so the stale
 * continuation never runs"), which is right for a stale repaint and fatal for a
 * concurrent one. This view reads the same log.py several ways, so on the
 * default channel `Promise.all([overview, stashes])` deadlocks — the stashes
 * call supersedes the overview, the overview never resolves, and the page sits
 * on its skeleton forever with both HTTP requests answered 200.
 *
 * One channel per OP is what this view actually wants: a newer overview still
 * supersedes an older overview (the staleness guard, kept), while overview and
 * stashes no longer collide (the deadlock, gone). */
const chan = (op) => ({ key: READER + "#" + op });

/* One path for every write. A mutation is: disable the control, call ops.py,
 * record what happened, then REFETCH the overview and repaint — never patch the
 * DOM from the op's own reply, because git is the authority on what the
 * repository now looks like and a locally-guessed state is how a UI drifts out
 * of sync with the repo it claims to show. */
async function run(key, args, then, context) {
  if (busy !== null) return;
  busy = key;
  flash = null;
  draw(true);                       // repaint with the control disabled
  let payload;
  try {
    payload = await fused.runPython(OPS, Object.assign({ file }, args));
  } catch (err) {
    /* A crash in ops.py is still a message in this view, not the red traceback
       overlay: the overlay is a debugging affordance for a view's own bug. */
    payload = { ok: false, message: err && err.message ? err.message : String(err) };
  }
  busy = null;
  /* `context` is what the caller already did before this call. The staged
     discard is two ops behind one confirmation, and when the second fails the
     first has still HAPPENED — reporting only "discard failed" would leave the
     user believing nothing moved when the file is now unstaged. The lists below
     do show the truth; the sentence has to as well. */
  flash = { ok: payload.ok === true,
            message: payload.ok ? (payload.detail || "Done.")
                                : (context ? context + ": " : "")
                                  + (payload.message || "git refused that.") };
  announce(flash.message);
  /* Bump the serial BEFORE refetching so any overview still in flight from
     before the mutation cannot repaint stale data over the fresh one. */
  seq += 1;
  snapshot = null;
  branchCache = null;
  /* The question has been answered — by acting on it. Leaving `ask` set would
     re-render the confirmation over the fresh lists, and (for a stash) leave a
     stale index/sha pair sitting in the URL for the next click to act on. */
  setParams({ ask: null });
  // A continuation that returns `true` owns the repaint (the staged-discard
  // chain, which repaints at the end of its SECOND call). Anything else falls
  // through to the repaint here — which the commit path needs, because clearing
  // `msg` is not a structural param change and so triggers no draw of its own.
  if (payload.ok && then && then() === true) return;
  await draw(true);
}

/* ------------------------------------------------------------------ loading */

async function loadDiff(data) {
  const wt = param("wt");
  if (wt) {
    const payload = await fused.runPython(READER, { file, op: "worktree", entry: wt },
                                          chan("worktree"))
      .catch((err) => ({ ok: false, message: err.message }));
    const sub = !payload.ok ? null
      : payload.kind === "untracked-dir" ? "untracked directory — contents"
      : payload.untracked ? "untracked — whole file"
      : "working tree vs HEAD";
    return diffPane(wt, sub, payload);
  }
  return null;
}

/* The branch list is a second read, and only when the panel is open — the
   toolbar's own label comes from the overview, so an unopened panel costs
   nothing. */
async function loadBranches(mine) {
  if (param("panel") !== "branch" || branchCache) return false;
  const payload = await fused.runPython(READER, { file, op: "branches" },
                                        chan("branches"))
    .catch((err) => ({ ok: false, message: err.message }));
  if (mine !== seq) return false;
  branchCache = payload;
  return true;
}

/* Everything the DOM's shape depends on. A `msg` keystroke is deliberately NOT
   in here: it changes the URL and must not repaint the view. */
const structural = () => [param("wt"), param("panel"), param("ask")].join("\u0000");

async function draw(force) {
  const key = structural();
  if (!force && drawn !== null && key === drawn) return;
  drawn = key;

  const mine = ++seq;
  const wt = param("wt");

  if (!file) {
    renderRefusal({ reason: "missing", message: "No file or folder was selected." });
    return;
  }

  /* Repaint from the snapshot first when only the SELECTION changed: the lists
     are unchanged, so refetching them would blank a list the user is looking at.
     The diff then arrives into an already-laid-out pane. The snapshot used to
     be keyed by the log window (`pages`); with no log to widen, holding it is
     unconditional. */
  let data = snapshot ? snapshot.data : null;
  let stashes = snapshot ? snapshot.stashes : [];

  if (data) {
    render(data, stashes, wt ? diffPane(wt, null, "loading") : null);
  }

  if (!data) {
    let payload;
    let stashPayload;
    try {
      /* Two reads, one round of latency: the overview is the view, and the
         stash list is a section of it.
         Concurrently, so they MUST be on different channels — see `chan`. Run
         on the default channel this deadlocks: the second call supersedes the
         first, the first then hangs forever by design, and `Promise.all` waits
         on it for the life of the page. */
      [payload, stashPayload] = await Promise.all([
        /* `history: ""` — falsy through the string binder — so the reader
           skips `git log` altogether. This view draws no commits, so it does
           not pay to fetch them either. */
        fused.runPython(READER, { file, op: "overview", history: "" },
                        chan("overview")),
        fused.runPython(READER, { file, op: "stashes" }, chan("stashes")),
      ]);
    } catch (err) {
      /* A crash in the reader is still an empty state here, not the red
         traceback overlay: the overlay is a debugging affordance for a view's
         own bug, and "this folder has no git" is not one. */
      renderRefusal({ reason: "git-failed", message: err.message });
      return;
    }
    if (mine !== seq) return;
    if (!payload.ok) {
      snapshot = null;
      renderRefusal(payload);
      return;
    }
    data = payload;
    stashes = (stashPayload && stashPayload.ok) ? stashPayload.stashes : [];
    snapshot = { data, stashes };
    render(data, stashes, wt ? diffPane(wt, null, "loading") : null);
    announce(data.changes.length + " uncommitted changes");
  }

  if (await loadBranches(mine)) {
    if (mine !== seq) return;
    render(data, stashes, wt ? diffPane(wt, null, "loading") : null);
  }

  if (!wt) return;
  const diff = await loadDiff(data);
  if (mine !== seq) return;
  render(data, stashes, diff);
}

/* Escape closes whatever is open, innermost first: a pending confirmation, then
   a dropdown, then the diff pane. Everything else is native — every row and
   every control is a real <button>, so tab/enter already work. */
document.addEventListener("keydown", (event) => {
  if (event.key !== "Escape") return;
  if (param("ask")) { event.preventDefault(); setParams({ ask: null }); return; }
  if (param("panel")) { event.preventDefault(); setParams({ panel: null }); return; }
  if (param("wt")) {
    event.preventDefault();
    setParams({ wt: null });
  }
});

fused.params.onChange(() => draw());
draw(true);
</script>
</body>
</html>
