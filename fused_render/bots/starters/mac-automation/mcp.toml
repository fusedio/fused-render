# MCP tools for this app, curated in fused-render's MCP panel. Every tool calls
# mac.py main(action=...). Reads (status, probe, shortcuts, applets, frontmost,
# reminders, calendar, dark_mode/volume without a value) run at once; anything
# that runs a script, a shortcut or an applet, or changes a setting, pauses for
# the user's approval (its name carries a write verb).

[[tool]]
name = "mac_status"
description = "Check Mac automation from here: macOS version and what it supports (scripting, Shortcuts CLI, Shortcuts automations, Use Model), whether System Events answers, how many shortcuts and applets exist. Call this first; its `note` tells the user what their macOS can and cannot do."
file = "mac.py"
entrypoint = "main"
signature = "main(action: str='status', script: str='', language: str='applescript', args: list=[], app: str='', name: str='', input: str='', output_type: str='public.plain-text', title: str='', message: str='', subtitle: str='', value=None, limit: int=20, days: int=7, reminder_list: str='', calendar: str='', body: str='', due: str='', overwrite: bool=False)"

[tool.pinned]
action = "status"

[[tool]]
name = "mac_probe"
description = "Which stock apps this process may automate (the Automation grant, skill Step 0): one harmless read each against Reminders, Calendar, Notes, Mail, Messages, Finder, Safari and Music, or only `app`. Returns granted:[...], denied:[...] with the hint to give the user for a denied app. Call before scripting an app for the first time."
file = "mac.py"
entrypoint = "main"
signature = "main(action: str='status', script: str='', language: str='applescript', args: list=[], app: str='', name: str='', input: str='', output_type: str='public.plain-text', title: str='', message: str='', subtitle: str='', value=None, limit: int=20, days: int=7, reminder_list: str='', calendar: str='', body: str='', due: str='', overwrite: bool=False)"

[tool.pinned]
action = "probe"

[[tool]]
name = "mac_run_script"
description = "Run an AppleScript (language='applescript') or JavaScript for Automation (language='jxa') `script` through osascript with `args` as argv (AppleScript: `on run argv`; JXA: `function run(argv)`; never paste user text into the script body). JXA must `return JSON.stringify(...)`: the result comes back parsed in `json`, plus stdout, rc, stderr and a `hint` on known macOS errors (-1743 = no Automation grant: stop and tell the user, do not retry)."
file = "mac.py"
entrypoint = "main"
signature = "main(action: str='status', script: str='', language: str='applescript', args: list=[], app: str='', name: str='', input: str='', output_type: str='public.plain-text', title: str='', message: str='', subtitle: str='', value=None, limit: int=20, days: int=7, reminder_list: str='', calendar: str='', body: str='', due: str='', overwrite: bool=False)"

[tool.pinned]
action = "run"

[[tool]]
name = "mac_compile_check"
description = "Syntax-check a `script` (language 'applescript' or 'jxa') with osacompile without running it. Use before mac_run_script or mac_create_applet for anything that sends, deletes or changes data."
file = "mac.py"
entrypoint = "main"
signature = "main(action: str='status', script: str='', language: str='applescript', args: list=[], app: str='', name: str='', input: str='', output_type: str='public.plain-text', title: str='', message: str='', subtitle: str='', value=None, limit: int=20, days: int=7, reminder_list: str='', calendar: str='', body: str='', due: str='', overwrite: bool=False)"

