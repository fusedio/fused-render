// ── permission cards ──────────────────────────────────────────
// Headless claude cannot open a terminal prompt, so agent.py points its
// --permission-prompt-tool at an MCP server that parks each request on disk;
// poll hands them here and these buttons write the answer back. Until one is
// clicked the subprocess is genuinely blocked — the card IS the prompt.
const permCards = new Map();  // request id -> card handle, cleared with the log

// Tools where "allow all of these for the rest of the reply" is a
// proportionate offer. Everything else — Bash, web tools, Task, unknown/MCP —
// gets Allow/Deny only (see the claude template for the full rationale).
const WHOLE_TOOL_GRANTABLE = new Set([
  "Edit", "Write", "Read", "Glob", "Grep", "NotebookEdit",
]);

// What the user is actually being asked to allow. Every field goes in through
// textContent — tool input is model-authored text, never parsed as markup.
// NOTHING here truncates: an Allow hands the tool its input verbatim, so a
// card that rendered only a prefix would ask the user to approve bytes they
// never saw. `covered` is derived from what was actually RENDERED (non-empty),
// and buildPermCard dumps whatever is left over, so no key can be invisible.
function summarizePermission(tool, input) {
  const inp = input && typeof input === "object" ? input : {};
  const str = (v) => (typeof v === "string" ? v : v === undefined || v === null ? "" : JSON.stringify(v));
  const mark = (v, ch) => str(v).split("\n").map((line) => ch + " " + line).join("\n");

  const used = [];
  const show = (k) => {
    const v = str(inp[k]);
    if (v) used.push(k);
    return v;
  };
  const pick = (...keys) => {           // an alternation: record only the winner
    for (const k of keys) if (inp[k]) { used.push(k); return str(inp[k]); }
    return "";
  };
  const out = (sub, body) => ({ sub, body, covered: used });

  switch (tool) {
    case "Bash":
      return out(show("description"), show("command"));
    case "Edit": {
      const path = show("file_path");
      show("replace_all");  // rendered as the annotation below, so it is covered
      return out(path + (inp.replace_all ? "  (every occurrence)" : ""),
                 mark(show("old_string"), "-") + "\n" + mark(show("new_string"), "+"));
    }
    case "Write":
      return out(show("file_path"), show("content"));
    case "NotebookEdit":
      return out(show("notebook_path"), show("new_source"));
    case "Read":
      return out(pick("file_path", "path"), "");
    case "Glob":
    case "Grep": {
      const where = show("path");
      const glob = show("glob");
      return out([where, glob ? "in " + glob : ""].filter(Boolean).join("  "),
                 show("pattern"));
    }
    case "WebFetch":
    case "WebSearch":
      return out(pick("url", "query"), show("prompt"));
  }
  // Unknown tool: the whole object is the body, so every key is covered.
  const keys = Object.keys(inp);
  used.push(...keys);
  return out("", keys.length ? JSON.stringify(inp, null, 2) : "");
}

// Whatever summarizePermission did not render — shown verbatim, never dropped.
// Object.fromEntries, not `{}` + assignment: res.json() DEFINES an own
// `__proto__` key; assignment would silently lose it while updatedInput still
// authorises it.
function leftoverInput(input, covered) {
  const seen = covered || [];
  const rest = Object.keys(input || {}).filter((k) => seen.indexOf(k) < 0);
  return rest.length ? Object.fromEntries(rest.map((k) => [k, input[k]])) : null;
}

// The buttons a card offers. `liveMode` is the mode the run is ACTUALLY in, as
// reported by poll — never the picker's `permission` param (the picker applies
// to the next spawn).
function permChoices(tool, label, liveMode) {
  const choices = [["Allow", "allow", "once", "", "primary"]];
  if (WHOLE_TOOL_GRANTABLE.has(tool)) {
    choices.push(["Allow all " + label + " in this reply", "allow", "session", "", ""]);
  }
  if ((liveMode || DEFAULT_PERMISSION) !== "auto") {
    choices.push(["Allow, and let Claude decide from here", "allow", "once", "auto", ""]);
  }
  choices.push(["Deny", "deny", "once", "", ""]);
  return choices;
}

function buildPermCard(p, run_id, liveMode) {
  const toolName = p.tool || "a tool";
  const label = toolName.length > 28 ? toolName.slice(0, 27) + "…" : toolName;

  const el = document.createElement("div");
  el.className = "turn perm";
  const head = document.createElement("div");
  head.className = "perm-head";
  const tool = document.createElement("span");
  tool.className = "tool";
  tool.textContent = toolName;
  head.append("Claude wants to use ", tool);
  el.appendChild(head);

  const { sub, body, covered } = summarizePermission(p.tool, p.input);
  if (sub) {
    const d = document.createElement("div");
    d.className = "perm-sub";
    d.textContent = sub;
    el.appendChild(d);
  }
  if (body) {
    const pre = document.createElement("pre");
    pre.textContent = body;
    el.appendChild(pre);
  }
  const extra = leftoverInput(p.input, covered);
  if (extra) {
    const pre = document.createElement("pre");
    pre.textContent = JSON.stringify(extra, null, 2);
    el.appendChild(pre);
  }

  const actions = document.createElement("div");
  actions.className = "perm-actions";
  const status = document.createElement("div");
  status.className = "perm-status";
  el.append(actions, status);

  // Re-render whenever the verdict CHANGES: the click renders optimistically,
  // the polls report what landed on disk, and the file is the truth claude
  // acts on — so it has to be able to correct the label.
  let shown = "";
  function resolve(decision, scope, mode) {
    const key = decision + "/" + (scope || "") + "/" + (mode || "");
    if (key === shown) return;
    shown = key;
    actions.remove();
    el.classList.add("resolved");
    if (decision === "allow") {
      status.className = "perm-status allow";
      status.textContent = mode
        ? "✓ Allowed — approvals set to “" + (PERMISSION_LABELS[mode] || mode) + "”"
        : scope === "session"
          ? "✓ Allowed — not asking again for " + label + " in this reply"
          : "✓ Allowed";
    } else if (decision === "expired") {
      status.className = "perm-status expired";
      status.textContent = "◦ Unanswered — the reply ended before you decided";
    } else {
      status.className = "perm-status deny";
      status.textContent = "✗ Denied";
    }
  }

  async function send(decision, scope, mode) {
    actions.querySelectorAll("button").forEach((b) => { b.disabled = true; });
    status.className = "perm-status";
    status.textContent = "sending…";
    try {
      const res = await fused.runPython(AGENT, {
        action: "decide", run_id, request_id: p.id, decision, scope,
        mode: mode || "",
      }, { key: null });
      if (res && res.error) throw new Error(res.error);
      // A mode switch outlives this run: carry it into the next spawn too.
      if (res && res.mode) { fused.params.set("permission", res.mode); syncSelects(); }
      // agent.py answers with what landed on disk (first writer wins).
      resolve((res && res.decision) || decision, (res && res.scope) || scope,
              (res && res.mode) || "");
    } catch (err) {
      // The subprocess is still blocked, so the buttons have to come back.
      actions.querySelectorAll("button").forEach((b) => { b.disabled = false; });
      status.className = "perm-status deny";
      status.textContent = "Could not send that: " + err.message;
    }
  }

  permChoices(p.tool, label, liveMode).forEach(([text, decision, scope, mode, cls]) => {
    const b = document.createElement("button");
    b.type = "button";
    if (cls) b.className = cls;
    b.textContent = text;
    if (mode) b.title = "Stops asking for what Claude judges safe; it still "
                      + "escalates anything it will not vouch for.";
    b.onclick = () => send(decision, scope, mode);
    actions.appendChild(b);
  });

  return { el, resolve };
}

// Put a permission card into the transcript AND make sure the transcript is what
// the user is looking at.
//
// A card is not progress output: it IS the prompt, and the subprocess stays
// blocked until it is answered. In the narrow layout's Preview view the whole
// chat column collapses to its #anntools strip, #log included — so a card
// appended there is a turn stalled forever behind an element nobody can see or
// click, with the strip saying nothing about a decision waiting. And Preview view
// is exactly where this happens: `annAutoSubmit` sends a real turn the moment a
// note is saved, which is the ONE way a run starts while the transcript is
// hidden.
//
// Of the three candidate fixes this is the one that keeps every promise:
//   * "don't auto-submit from Preview view" removes the feature — a saved note
//     going to Claude immediately is the point of annotating, and the user is in
//     Preview precisely because that is where notes are made;
//   * "surface it in the #anntools strip" means a second, smaller renderer for
//     the permission UI (tool name, arguments, four scope choices, the deny
//     path), i.e. a fork of the thing whose whole job is to be read carefully
//     before it is answered;
//   * leaving Preview is honest and reversible: the run cannot continue without
//     the user's attention, "Back to chat"/"Annotate preview" is one click either
//     way, and the notes and pins survive the trip (applyNarrowView re-measures
//     them). We only take the screen for a HARD BLOCK, never for ordinary
//     progress — the working line and errors still go to the hidden #log, and
//     that is correct: they are things to read afterwards, not things to answer.
//
// Writes the param rather than calling applyNarrowView, the same one-way flow
// #viewbtn uses. No-op in the wide layout (nothing is hidden) and for the no-pane
// target (`paneview` describes a collapse it never does).
function showPermissionCard(card, working) {
  if (working && working.el && working.el.isConnected) log.insertBefore(card.el, working.el);
  else log.appendChild(card.el);
  if (!noPane && NARROW_MQ.matches && fused.params.get("paneview") === "preview") {
    fused.params.set("paneview", "chat");
  }
  scrollBottom();
}

// Reconcile the poll's request list with what is on screen. Idempotent — poll
// replays the whole list every 400 ms.
function syncPermissions(list, run_id, working, liveMode) {
  for (const p of list || []) {
    if (!p || !p.id) continue;
    let card = permCards.get(p.id);
    if (!card) {
      card = buildPermCard(p, run_id, liveMode);
      permCards.set(p.id, card);
    }
    if (!card.el.isConnected) {
      showPermissionCard(card, working);
    }
    if (p.decision) card.resolve(p.decision, p.scope, p.mode);
  }
}

// What a LIVE api_retry says on the status line. The status code picks the
// words, because 529 and 429 send the user looking in different places: the API
// is swamped and waiting helps, versus we are being throttled. `max_retries` is
// the CLI's budget and is only shown when it told us one.
function retryVerb(retry) {
  const what = retry.status === 429 ? "Rate limited"
             : retry.status === 529 ? "Overloaded"
             : "API error";
  const budget = retry.max_retries ? "/" + retry.max_retries : "";
  return what + " — retrying (" + retry.attempt + budget + ")";
}

function addWorking() {
  const d = document.createElement("div");
  d.className = "turn working";
  const thinkVerb = VERBS[Math.floor(Math.random() * VERBS.length)];
  const start = Date.now();
  let stats = { tokens: 0, phase: "thinking", retry: null };
  let stopping = false;
  d.innerHTML = '<span class="star">✻</span> <span class="verb"></span><span class="meta"></span>'
    // The key rides on the label, not in a hint row: same reasoning as the
    // claude template — a separate hint line grows and shrinks the chrome every
    // time a turn starts and ends, and the pane here is narrower still.
    + '<button id="stopbtn" class="stop" type="button" title="Stop this turn">stop · esc</button>';
  const verbEl = d.querySelector(".verb");
  const meta = d.querySelector(".meta");
  const stopBtn = d.querySelector(".stop");
  stopBtn.addEventListener("click", () => stopRun());
  const draw = () => {
    const secs = Math.round((Date.now() - start) / 1000);
    // A live retry outranks every phase but the user's own stop: it is the only
    // one of these that explains why nothing is happening.
    verbEl.textContent = (stopping ? "Stopping" :
                          stats.retry ? retryVerb(stats.retry) :
                          stats.phase === "awaiting" ? "Waiting for your approval" :
                          stats.phase === "composing" ? "Composing" :
                          stats.phase === "tooling" ? "Working" : thinkVerb) + "…";
    const effort = curEffort();
    const parts = [secs + "s"];
    if (stats.tokens) parts.push("↓ " + stats.tokens + " tokens");
    if (stats.phase === "thinking" && effort) parts.push(effort + " effort");
    meta.textContent = " (" + parts.join(" · ") + ")";
  };
  const timer = setInterval(draw, 1000);
  draw();
  log.appendChild(d);
  scrollBottom();
  return {
    el: d,
    setStats(tokens, phase, retry) { stats = { tokens, phase, retry: retry || null }; draw(); },
    // Reversible: the kill can fail, and a run that is still streaming must not
    // be left wearing a "Stopping…" line it will never honour.
    setStopping(on) { stopping = on; stopBtn.disabled = on; draw(); },
    stop: () => clearInterval(timer),
  };
}

// ── minimal markdown → HTML, tolerant of unclosed markers mid-stream ──
function renderMd(text) {
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = (s) => {
    // pull inline code out first so its contents stay literal
    const codes = [];
    return esc(s)
      .replace(/`([^`]+)`/g, (_, c) => "" + (codes.push(c) - 1) + "")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|\W)\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
      .replace(/(^|[^"(\]])(https?:\/\/[^\s)<]+)/g, '$1<a href="$2" target="_blank">$2</a>')
      .replace(/(\d+)/g, (_, i) => "<code>" + codes[i] + "</code>");
  };

  const out = [];
  const parts = text.split(/```/);
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 1) {  // inside a fence (possibly still open mid-stream)
      const body = parts[i].replace(/^[\w+-]*\n?/, "");  // drop language tag
      out.push("<pre><code>" + esc(body) + "</code></pre>");
      continue;
    }
    const lines = parts[i].split("\n").map((line) => {
      let m;
      if ((m = line.match(/^(#{1,4})\s+(.*)$/)))
        return '<span class="h">' + inline(m[2]) + "</span>";
      if ((m = line.match(/^(\s*)[-*]\s+(.*)$/)))
        return m[1] + '<span class="bullet">•</span> ' + inline(m[2]);
      if ((m = line.match(/^(\s*)(\d+)\.\s+(.*)$/)))
        return m[1] + '<span class="bullet">' + m[2] + ".</span> " + inline(m[3]);
      return inline(line);
    });
    out.push(lines.join("\n"));
  }
  return out.join("");
}

// ── typewriter: polls fill `target`; a rAF loop drains it smoothly ──
function makeTyper(bodyEl) {
  let target = "";
  let shown = 0;
  let finished = false;
  let raf = null;
  const cur = document.createElement("span");
  cur.className = "cursor";
  cur.textContent = "▋";
  bodyEl.after(cur);

  function tick() {
    raf = null;
    if (shown > target.length) {
      // Target got rewritten shorter (authoritative final text): without this
      // clamp nothing ever redraws and the frozen frame keeps stale text.
      shown = target.length;
      bodyEl.innerHTML = renderMd(target);
    }
    const remaining = target.length - shown;
    if (remaining > 0) {
      const atBottom = nearBottom();
      const step = Math.max(1, Math.ceil(remaining / 36));  // drain in ~36 frames
      shown = Math.min(target.length, shown + step);
      bodyEl.innerHTML = renderMd(target.slice(0, shown));
      if (atBottom) scrollBottom();
    }
    if (shown < target.length) raf = requestAnimationFrame(tick);
    else if (finished) cur.remove();
  }

  return {
    update(text) { target = text; if (!raf) raf = requestAnimationFrame(tick); },
    finish(text) {
      target = text;
      finished = true;
      if (!raf) raf = requestAnimationFrame(tick);
      return new Promise((resolve) => {
        (function wait() { raf ? requestAnimationFrame(wait) : resolve(); })();
      });
    },
    abort() { if (raf) cancelAnimationFrame(raf); cur.remove(); },
  };
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// ── the pull channel: answer the agent's app_state reads ──────
// agent.py parks each `app_state` tool call as a file and hands the unanswered
// ones to every poll; this frame is the only thing that can see the app, so it
// is the only thing that can answer. No card and no confirmation: it is a read
// of the user's own screen, for the agent they are already talking to, and the
// tool call is BLOCKED until it is answered. The one-line note is the whole
// transparency story, and it is the right size for it.
const answeredStates = new Set();  // ids already answered; poll replays the list
// Ids whose note is already in the log. Separate from `answeredStates` because
// that one is RELEASED when an attempt fails so the next poll retries — and a
// retry must not append a second "read app state" line for one read.
const notedStates = new Set();
// Polls a request may see an empty snapshot before we stop waiting and answer
// with appStatePull's explicit sentence instead. The poll loop is 400 ms, so
// this is ~2 s — comfortably longer than a live-reload of the left pane, and far
// shorter than the tool's own timeout (minutes), which would be the alternative
// backstop and a much worse answer for the model.
const APP_STATE_NULL_POLLS = 5;
const nullStatePolls = new Map();  // req.id -> polls seen with nothing to report
// Cap on all three of the above. One entry per app_state call for the page's
// lifetime is bounded in practice and unbounded in principle; dropping the oldest
// is safe because agent.py only ever lists UNANSWERED requests, so a forgotten id
// cannot come back — and if it somehow did, the on-disk latch makes a second
// answer a no-op.
const APP_STATE_MEMO_MAX = 200;
function appStateTrim(memo) {
  while (memo.size > APP_STATE_MEMO_MAX) memo.delete(memo.keys().next().value);
}

// Skill invocations already announced in the log, by `tool_use` id. Poll replays
// every call in the file on each 400 ms tick, so without this the same skill
// would append a row per tick — the same reason `notedStates` exists next door.
// Trimmed on the shared cap: the ids are unique per run and a turn that invokes
// two hundred skills is not a thing, so the oldest can never come back.
const notedSkills = new Set();

// Which skills the model reached for, as they happen. Worth a row of its own
// because a skill silently changes how the reply was produced: without this the
// only visible difference between a session that loaded the fused-render
// authoring skill and one that did not is that the answers are better.
function noteSkills(list, working) {
  for (const call of list || []) {
    if (!call || !call.id || !call.skill || notedSkills.has(call.id)) continue;
    notedSkills.add(call.id);
    appStateTrim(notedSkills);
    // Skill names are model-authored text; addNote puts them in via textContent.
    addNote("skill · " + call.skill, working, "◆");
  }
}

async function answerAppState(list, run_id, working) {
  for (const req of list || []) {
    if (!req || !req.id || answeredStates.has(req.id)) continue;
    // Taken HERE, not at send time: the whole point of the pull channel is that
    // the pushed snapshot has gone stale.
    const state = appStateSnapshot();
    if (!state) {
      // Nothing to report YET. Almost always the pane mid-reload — and an edit
      // is exactly what triggers a reload, so this is the common case right
      // after the model edits something and then asks what happened. Leave the
      // id UNclaimed so the next poll tries again, rather than settling the tool
      // call as an error it cannot retry (see appStatePull).
      const seen = (nullStatePolls.get(req.id) || 0) + 1;
      nullStatePolls.set(req.id, seen);
      appStateTrim(nullStatePolls);
      if (seen <= APP_STATE_NULL_POLLS) continue;
      // Still nothing: this is not a reload, it is a project with no app to
      // read. Fall through and answer, so the model is told that instead of
      // waiting out the tool timeout for the same news.
    }
    answeredStates.add(req.id);   // claimed before the await: polls overlap
    appStateTrim(answeredStates);
    // Once per REQUEST, not once per attempt: the claim above is released again
    // when an attempt fails, and a retry appending another line would make the
    // log read as several reads of the app for one tool call.
    if (!notedStates.has(req.id)) {
      notedStates.add(req.id);
      appStateTrim(notedStates);
      addNote(req.reason ? "read app state — " + req.reason : "read app state", working);
    }
    let res = null;
    try {
      res = await fused.runPython(AGENT, {
        action: "app_state", run_id, request_id: req.id,
        // A JSON string, not a nested object: params cross into python
        // string-shaped, and nothing on that side reads inside the snapshot.
        // Never the bare `null` a snapshot can be — agent.py reads a non-dict as
        // a permanent failure.
        state: JSON.stringify(state || appStatePull()),
      }, { key: null });
    } catch (err) {
      // The tool call is still blocked, so this has to be retried — un-claim
      // the id and let the next poll (400 ms) have another go. Its own timeout
      // is the backstop if this keeps failing.
      answeredStates.delete(req.id);
      continue;
    }
    // A RESOLVED error is the same news as a throw when it says so. agent.py
    // flags which of its errors could ever be helped by another go: a write that
    // did not reach disk can (the window is alive, the tool is still blocked),
    // an unknown run or request never will — and retrying that one every 400 ms
    // until the run ends is worse than letting the tool's timeout settle it.
    if (res && res.error && res.retry) answeredStates.delete(req.id);
  }
}

// ── stopping a turn ───────────────────────────────────────────
// Mirrors the claude template (this chat is a fork of it): agent.py could always
// kill a run, and until the stop button nothing called it — a turn that went off
// the rails could only be waited out or escaped by navigating away, which leaves
// the detached subprocess working on. pollLoop publishes the live run so the
// button and Escape have something to aim at, which covers a re-attached run too.
let activeRun = null;
let activeWorking = null;
// Keyed by id, not a bare boolean: it is read when a run ENDS, and a stale flag
// would label the next turn's ending as a stop too.
let stoppedRun = "";

// How a finished run ends on screen. Killing claude leaves the run dead with no
// `result` row, which `_poll` reports as an error BY DESIGN (a truncated reply
// must never read as a clean success) — but when the user asked for the stop,
// that error IS the stop, and repeating it back reads as a crash they caused. So
// it is swallowed here, and only here. Pure, and tested as such — against the
// claude template's copy, which must decide identically.
function runEnding(data, stopped) {
  if (!stopped) return { error: data.error || "", note: "", keepText: !data.error };
  // The stop landed. Whatever streamed before the kill is real work and stays.
  if (data.error) return { error: "", note: "Stopped.", keepText: true };
  // The stop did NOT land: the reply completed between the click and the signal.
  return { error: "", note: "The turn finished before the stop landed.", keepText: true };
}

async function stopRun() {
  const run_id = activeRun;
  if (!run_id || stoppedRun === run_id) return;  // nothing live, or already going
  stoppedRun = run_id;
  // Detach the queue BEFORE the await — a drain racing the cancel must find it
  // empty — but move nothing to the composer until the stop actually lands:
  // a failed cancel leaves the run live, and the queue (bubbles untouched, the
  // array put back) has to keep auto-draining when that run really ends.
  const held = queuedMsgs.splice(0);
  if (activeWorking) activeWorking.setStopping(true);
  try {
    await fused.runPython(AGENT, { action: "cancel", run_id }, { key: null });
    unqueueAll(held);
  } catch (err) {
    // The kill never reached the backend, so the run is still going and the poll
    // loop is still streaming it. Take the claim back: leaving it set would
    // relabel this run's real ending as a stop the user never got.
    stoppedRun = "";
    // unshift, not push: anything queued DURING the await went to the array's
    // tail, and its bubble sits below the held ones — the held entries go back
    // to the front so drain order keeps matching both typed and screen order.
    queuedMsgs.unshift(...held.filter((q) => !q.dead));
    // The mirror was deliberately NOT cleared at the splice above: the detach is
    // provisional until the cancel lands, and a frame that died mid-cancel would
    // otherwise come back to a live run with the queue erased. So the store
    // still holds these; re-persisting is what folds in whatever was queued
    // during the await and re-states the order they were just put back in.
    persistQueue();
    if (activeWorking) activeWorking.setStopping(false);
    addError("Could not stop the run: " + err.message);
  }
}

// Escape has three claimants in this pane: the annotation composer, annotate
// mode, and a live run. Ordered least-destructive first — dismissing a popover is
// small and repeatable, leaving annotate mode costs one click to undo, killing a
// turn costs the turn. So a user reaching for Escape with a text box in front of
// them means the text box, and one reaching for it while annotating means
// annotate mode, not the run they may also have going. Split out as a pure
// decision so the precedence is a tested rule and not an ordering accident.
function escapeAction(composerOpen, annotating, runId) {
  if (composerOpen) return "close-composer";
  if (annotating) return "exit-annotate";
  return runId ? "stop-run" : "";
}

// Gated on there being something to do, so the binding is inert the rest of the
// time — this page sits in an iframe and must not swallow Escape from the shell
// around it for nothing.
function onEscape(e) {
  if (e.key !== "Escape") return;
  // The textarea's own Escape handler stops propagation, so what reaches here
  // with the popover open is an Escape pressed with focus somewhere else.
  const act = escapeAction(annPop.style.display === "block", annOn, activeRun);
  if (!act) return;
  e.preventDefault();
  if (act === "close-composer") annCloseComposer();
  else if (act === "exit-annotate") annSetMode(false);
  else stopRun();
}

// Bound on BOTH documents. Annotate mode is driven with the pointer over the
// iframe, so that is where the keydown lands, and a keydown in the frame's
// document does not bubble across the boundary to this one — the same reason the
// mousedown/mousemove/click handlers all hang off `doc`. The frame-side binding
// is (re)attached on every frame load; see the load handler.
document.addEventListener("keydown", onEscape);

// ── message queue: text typed while a run is live ──
// Mirrored into sessionStorage (see QUEUE_STORE below) so a teardown does not
// eat it, text-only by design: annotations are folded in at SEND time, so whatever is pending when a queued message actually goes
// out rides that send — which is also the desirable reading for the app-state
// snapshot (fresh state after the previous turn's edits, not a stale one from
// queue time). Each entry renders as a dashed placeholder bubble in #queue —
// a SIBLING after #log, not inside it, so queued messages always sit below
// every turn, including turns appended to the log while they wait; the ×
// unqueues it back into the composer.
//
// Sited BELOW stopRun (which calls into it — fine, the calls happen at click
// time) because test_claude_stop_run.py extracts `runEnding` as "everything up
// to `async function stopRun`" and runs it under node: anything between the
// two that touches `document` breaks that extraction.
// The queue's mirror. sessionStorage, not localStorage: the queue belongs to
// this tab's trip through this conversation — a mode switch, a navigation, a
// reload — and must not surface in a second window that happens to be looking
// at the same file, nor outlive the tab. One record — but NOT because one frame
// is one conversation: a tab can hold several of these pages at once now (the
// explorer's preview pane renders one for whatever row is selected, beside a
// full-screen chat), and they share this key. So a page may only ever write or
// delete the record it can prove is ITS OWN; see queueOwnedBy.
const QUEUE_STORE = "fused-render:claude-queue";

// The record for a queue, or null when there is nothing worth keeping. Pure so
// the identity rule is a tested decision rather than an accident of where the
// setItem call happens to sit.
//
// BOTH ids go in, and the restore matches on EITHER (see queueRestore), because
// they drift on purpose: `run` is set the moment a turn launches, while
// `session_id` only lands when the first poll reports it — so a message parked
// in that window knows only the run, and the boot that re-attaches to that run
// knows both. Storing the pair is what lets the two views of the same
// conversation recognise each other.
function queueRecord(sessionId, runId, texts) {
  if (!texts.length) return null;          // drained/unqueued to nothing
  if (!sessionId && !runId) return null;   // nothing a later boot could match on
  return { session: sessionId || "", run: runId || "", texts };
}

// The texts a stored record hands back to THIS boot — [] unless the record was
// written for the conversation now booting. That check is the whole guard
// against resurrection: a record from a finished or unrelated chat names ids
// this page does not have, and a brand-new chat names no ids at all, so neither
// can pull a previous conversation's words into the composer's place. Damage
// (hand-edited storage, a half-written record, a shape from an older build) is
// treated as absence rather than thrown: losing the queue is the bug we are
// fixing, but a red overlay on boot would be a worse one.
// Is the stored record THIS boot's own? The identity rule, on its own, because
// two questions need it and they must not answer differently: what may be
// restored, and — the dangerous one — what may be DELETED.
//
// A page that cannot match the record has no standing over it. sessionStorage is
// per TAB, not per frame, and the preview pane means a second claude page is
// mounted for any row that previews in claude mode: id-less, matching nothing,
// and (before this) deleting on sight the queue that a live conversation in the
// same tab had parked behind a running turn. Silently, and exactly in the
// scenario the queue was built for.
function queueOwnedBy(raw, sessionId, runId) {
  let rec;
  try { rec = JSON.parse(raw || "null"); } catch (err) { return false; }
  if (!rec) return false;
  return !!((rec.session && sessionId && rec.session === sessionId)
         || (rec.run && runId && rec.run === runId));
}

function queueRestore(raw, sessionId, runId) {
  let rec;
  try { rec = JSON.parse(raw || "null"); } catch (err) { return []; }
  if (!rec || !Array.isArray(rec.texts)) return [];
  if (!queueOwnedBy(raw, sessionId, runId)) return [];
  return rec.texts.filter((t) => typeof t === "string" && t);
}

// Write the CURRENT queue. Called from every place queuedMsgs changes — the
// enqueue, the ×, the drain, the hand-back — because a mirror that is only
// written on the way in re-sends messages that already went out, which is a
// worse failure than the one this replaces. Cheap enough to do eagerly: the
// queue is a handful of short strings.
//
// Returns whether the queue is safely stored, which is what the teardown hook
// answers with. A refused write (quota, a locked-down profile) is a real
// failure and says so; an empty queue is nothing to lose and says ok.
//
// The DELETE is gated by queueOwnedBy, exactly as restoreQueue's is, and for
// the same reason: an empty queue is not evidence the stored record is this
// page's. The pane's claude frame has no ids and no queue, and it reaches here
// on every mode switch — the shell awaits `__fusedFlushEdits` before it
// remounts anything — so an ungated removeItem let selecting a row bin the
// queue a live conversation elsewhere in the same tab had parked behind a
// running turn. The identical bug the restore side already had; both sites now
// ask the one question, which is why the rule is a function and not an inline
// comparison.
function persistQueue() {
  const sessionId = fused.params.get("session_id") || "";
  const runId = fused.params.get("run") || "";
  const texts = queuedMsgs.map((q) => q.text);
  const rec = queueRecord(sessionId, runId, texts);
  try {
    if (rec) sessionStorage.setItem(QUEUE_STORE, JSON.stringify(rec));
    else if (!texts.length) {
      // Nothing of ours to keep — so bin the record only if it IS ours. A
      // record we cannot name is left alone: it dies with the tab anyway, and
      // it may well be a running chat's.
      const raw = sessionStorage.getItem(QUEUE_STORE);
      if (raw && queueOwnedBy(raw, sessionId, runId)) sessionStorage.removeItem(QUEUE_STORE);
    }
    else return false;  // queued text with no id to key it by — see queueRecord
    return true;
  } catch (err) {
    console.warn("the message queue could not be saved:", err.message);
    // An EMPTY queue still says ok, whichever storage call threw. The hook's
    // {ok:false} exists to stop a teardown eating the user's TEXT, and there is
    // none here — the failed call was the removal of a record we no longer
    // need. Refusing the mode switch over that would strand the reader in a
    // pane to protect nothing. It read `return false` while the doc comment
    // above said the opposite, which held only because nothing had made a
    // locked-down store refuse a removal.
    return !texts.length;
  }
}

// Put a saved queue back on screen. Rebuilt through queueMessage, so restored
// entries are indistinguishable from freshly parked ones — same bubble, same ×,
// same array — and each append re-persists under the ids this boot has, which
// is how a record written with only a run id acquires its session id.
//
// The record is dropped only when this boot OWNS it and it has nothing left in
// it. It used to be dropped whenever it failed to match, on the reasoning that
// a record this page cannot adopt is a dead chat's leftovers — which was true
// while a tab held one of these pages. It no longer does: an id-less preview in
// the pane matches nothing by construction, so "does not match me" became "is
// almost certainly someone else's", and the sweep deleted live queues. A
// record nobody claims is harmless — it is keyed to ids no future boot will
// have, and sessionStorage dies with the tab.
function restoreQueue(sessionId, runId) {
  let raw = null;
  try { raw = sessionStorage.getItem(QUEUE_STORE); } catch (err) { return; }
  if (!raw) return;
  const texts = queueRestore(raw, sessionId, runId);
  for (const t of texts) queueMessage(t);
  if (!texts.length && queueOwnedBy(raw, sessionId, runId)) {
    try { sessionStorage.removeItem(QUEUE_STORE); } catch (err) {}
  }
}

// The shell's remount-safety hook, same contract as the code template's editor
// (Preview.tsx awaits it before switching modes, with a 10 s bound, and aborts
// the switch on {ok:false}). The queue is written on every mutation already, so
// this is a belt-and-braces re-save covering anything that changed the array
// without going through those paths — and, more importantly, the one place that
// can REFUSE to let the frame go when the queue genuinely cannot be stored.
// Never {ok:false} merely because a queue exists: a user with messages parked
// behind a run must still be able to change modes.
window.__fusedFlushEdits = async () => {
  return { ok: persistQueue() };
};

const queueEl = document.getElementById("queue");
const queuedMsgs = [];  // [{ text, el }]

function queueMessage(text) {
  const d = document.createElement("div");
  d.className = "turn queued";
  const b = document.createElement("div");
  b.className = "qbubble";
  b.textContent = text;
  const meta = document.createElement("div");
  meta.className = "qmeta";
  const lbl = document.createElement("span");
  lbl.textContent = "queued";
  const x = document.createElement("button");
  x.type = "button";
  x.className = "qx";
  x.textContent = "remove";
  x.title = "Unqueue: put this message back in the input box";
  const entry = { text, el: d };
  x.onclick = () => {
    const i = queuedMsgs.indexOf(entry);
    if (i >= 0) queuedMsgs.splice(i, 1);
    entry.dead = 1;  // may be detached in stopRun's `held` right now — see below
    persistQueue();
    d.remove();
    // Back into the composer, not the void — appended so a draft in progress
    // is never clobbered.
    box.value = box.value ? box.value.replace(/\s*$/, "\n\n") + text : text;
    growBox();
    focusBox(box);
  };
  meta.append(lbl, x);
  d.append(b, meta);
  queueEl.appendChild(d);
  scrollBottom();
  queuedMsgs.push(entry);
  persistQueue();
}

// Fire the next queued message once nothing is live. Called from the tails of
// sendMessage AND resumeRun — a message queued against a re-attached run has
// to drain too. Draining after an errored turn is deliberate (the user queued
// it knowing less than we do now, but un-sending their words is worse); a
// STOPPED turn is the exception, handled in stopRun above.
function drainQueue() {
  if (sending || activeRun || !queuedMsgs.length) return;
  const next = queuedMsgs.shift();
  // Out of the store as it leaves the array, not after the send resolves: from
  // here the text's fate is sendMessage's (a real user bubble, and on failure
  // an error beside it), and a mirror still holding it would re-park a message
  // the next boot can already see in the log.
  persistQueue();
  next.el.remove();  // sendMessage adds the real user bubble
  sendMessage(next.text);
}

// Stop means halt: give queued text back to the composer instead of firing it
// at the session a second after the user said stop. Takes the entries rather
// than reading queuedMsgs, because stopRun detaches them first.
function unqueueAll(entries) {
  for (const q of entries) {  // head first: composer keeps typed order
    if (q.dead) continue;  // × was clicked while this entry was detached
    q.el.remove();
    box.value = box.value ? box.value.replace(/\s*$/, "\n\n") + q.text : q.text;
  }
  growBox();
  // The entries are in the composer now and gone from the array, so the mirror
  // has to let them go too — otherwise a reload would show them BOTH parked
  // below the log and typed in the box, and send the copy nobody edited.
  persistQueue();
}

// ── send one message: start detached claude, poll + stream ──
// One turn at a time: concurrent turns would share the session_id param and
// launch parallel claude runs against the same resumed session.
let sending = false;

// Stream one run into the log. The `run` URL param marks the run as in-flight
// for the page's whole life — if this frame dies mid-loop, the subprocess
// keeps going and the next boot re-attaches via resumeRun.
async function pollLoop(run_id) {
  const w = addWorking();
  // This run is now the one the stop button and Escape aim at. Set here, the one
  // place a run is ever in flight, which covers a re-attached run for free.
  activeRun = run_id;
  activeWorking = w;
  setRunningUi(true);
  let reply = null;
  let typer = null;
  try {
    while (true) {
      const data = await fused.runPython(AGENT, { action: "poll", run_id }, { key: null });
      if (data.session_id) { fused.params.set("session_id", String(data.session_id)); showSession(); }
      // usage arrives only at message end; estimate from streamed text meanwhile
      const tokens = Math.max(data.tokens || 0, Math.round((data.text || "").length / 4));
      w.setStats(tokens, data.phase || "thinking", data.retry);
      syncPermissions(data.permissions, run_id, w, data.mode);
      noteSkills(data.skills, w);
      // Not awaited: a snapshot must never hold up the streaming reply, and the
      // answered-set makes a second poll arriving mid-answer a no-op.
      if (data.app_state && data.app_state.length) answerAppState(data.app_state, run_id, w);
      if (data.text) {
        if (!reply) {
          reply = addAssistant("");
          log.insertBefore(reply, w.el);  // status line stays below the streaming reply
          typer = makeTyper(reply.lastChild);
        }
        if (!data.done) typer.update(data.text);
      }
      if (data.done) {
        fused.params.set("run", "");
        w.stop(); w.el.remove();
        // The run this frame sent (or re-attached to) is over: annotations it
        // carried are handled — auto-resolve them. Kept even on error? No: an
        // errored run may not have acted on them, but they were already
        // stamped `sent` and folded into the transcript, so they resolve
        // either way — re-annotating is one click, silently re-sending isn't.
        annResolveSent();
        // The turn may have edited the file, and Claude Code checkpoints what it
        // edits — so the snapshots panel's cached timeline is now behind.
        snapInvalidate();
        const end = runEnding(data, stoppedRun === run_id);
        if (!end.keepText) {
          if (typer) typer.abort();
          if (reply) reply.remove();
        } else if (typer) {
          await typer.finish(data.text);
        } else if (data.text) {
          addAssistant("").lastChild.innerHTML = renderMd(data.text);
        }
        if (end.error) addError(end.error);
        if (end.note) addNote(end.note, null, "⏹");
        break;
      }
      await sleep(400);
    }
  } catch (err) {
    // Kill the rAF loop and drop the partial bubble so a failed run never
    // leaves a half-streamed reply behind. The `run` param is deliberately
    // NOT cleared: a poll that died with the page being torn down should
    // still re-attach on the next boot.
    if (typer) typer.abort();
    if (reply) reply.remove();
    addError(err.message);
  } finally {
    if (w.el.isConnected) { w.stop(); w.el.remove(); }
    // Nothing is interruptible any more. Cleared even when the loop threw: an
    // Escape landing after this must not cancel a finished run and then mislabel
    // the NEXT turn's ending as a stop.
    activeRun = null;
    activeWorking = null;
    setRunningUi(false);
  }
}

// The composer's send buttons double as stop buttons while a run is live: the
// arrow swaps for a stop square (CSS on body.running) and a click aims at the
// run, same as Escape. Labels follow so a screen reader hears the real action.
function setRunningUi(on) {
  document.body.classList.toggle("running", on);
  document.querySelectorAll(".send").forEach((b) => {
    b.setAttribute("aria-label", on ? "Stop" : "Send");
    // No "(Esc)" hint: Escape's first claim is the annotation composer, then
    // annotate mode (default ON) — during a normal run it disarms annotating,
    // not the turn. Advertising it here would teach a keystroke that usually
    // does something else; the working line's own stop control stays the
    // keyboard-adjacent path.
    b.title = on ? "Stop this turn" : "";
  });
}

async function sendMessage(message) {
  if (sending) return;
  sending = true;
  // Fold pending annotations into the outgoing message and stamp them `sent`.
  // If the start below never launches a run, the stamp (and the receipt) are
  // rolled back so the notes stay editable and re-sendable.
  const pending = annPending();
  if (!message && !pending.length) { sending = false; return; }
  // Both composer entry points come through here, so the snapshot is taken in
  // exactly one place — at SEND time, which is the moment whose state the user is
  // describing when they type.
  const state = appStateSnapshot();
  // The bubble goes up BEFORE the screenshot capture below, which is the one slow
  // step on this path: the user's words appearing instantly is worth more than a
  // receipt and a bubble arriving together.
  let bareTurn = null;
  if (message) {
    addUser(message);
  } else {
    // annotation-only send: a bubble-less user turn to hang the receipt on
    bareTurn = document.createElement("div");
    bareTurn.className = "turn user";
    log.appendChild(bareTurn);
  }
  // Crop each annotated element out of one capture of the left pane. Awaited
  // because composeOutgoing needs the paths, and bounded and swallowing, because
  // no screenshot is worth losing the user's message over (see annShots).
  const shots = await annShots(pending);
  annApplyShots(pending, shots);
  // Write the DOM outline to a file and send its path instead of its bytes. Here
  // rather than inside composeOutgoing because that function is sync and pure —
  // it is the exact inverse of stripBlocks, and both halves have to stay that way.
  const sentState = await appStateFile(state);
  const outgoing = composeOutgoing(message, pending, sentState);
  if (pending.length) {
    for (const c of pending) c.sent = 1;
    annSave();
  }
  // Subtle receipt under the bubble: which annotations rode this message.
  // Nothing is attached invisibly.
  let receipt = null;
  if (pending.length) {
    const turns = log.querySelectorAll(".turn.user");
    const turn = turns[turns.length - 1];
    const sum = document.createElement("div");
    receipt = sum;
    sum.className = "annsum";
    pending.forEach((c) => {
      const row = document.createElement("div");
      row.className = "annsum-row";
      const lbl = document.createElement("span");
      lbl.className = "annsum-lbl";
      // Same letter the pin wears (index in the full list, not the pending
      // subset), so the receipt and the ✓-pin match up.
      lbl.textContent = "📌 " + annLabelFor(annotations.indexOf(c));
      const txt = document.createElement("span");
      txt.className = "annsum-txt";
      txt.textContent = c.content;
      txt.title = c.content;
      row.append(lbl, txt);
      if (c.tag) {
        const el = document.createElement("span");
        el.className = "annsum-el";
        el.textContent = "<" + c.tag + ">";
        row.appendChild(el);
      }
      // What was actually attached. The user has to be able to see the crop that
      // went out — a screenshot they cannot check is a screenshot they cannot
      // trust. The blob URL, not the file path: the path is for the agent, and
      // this pane cannot read a temp file back.
      const thumbUrl = shots && shots.thumbs && shots.thumbs[c.id];
      if (thumbUrl) {
        const shot = document.createElement("img");
        shot.className = "annsum-shot";
        shot.src = thumbUrl;
        shot.alt = "screenshot of the annotated element";
        shot.title = c.shot || "";
        row.appendChild(shot);
      }
      sum.appendChild(row);
    });
    turn.appendChild(sum);
    scrollBottom();
  }
  // The push channel's own receipt. A sibling of the bubble, not a wrapper around
  // it: the re-attach probe matches on `.user .bubble`'s textContent, and folding
  // this line inside would make every such turn stop matching.
  let attach = null;
  if (state) {
    const turns = log.querySelectorAll(".turn.user");
    attach = document.createElement("div");
    attach.className = "attach";
    attach.textContent = "app state attached";
    turns[turns.length - 1].appendChild(attach);
    scrollBottom();
  }
  let started = false;
  try {
    const { run_id, error } = await fused.runPython(AGENT, {
      action: "start",
      file: FILE,
      message: outgoing,
      session_id: fused.params.get("session_id") || "",
      model: curModel(),
      effort: curEffort(),
      permission_mode: fused.params.get("permission") || DEFAULT_PERMISSION,
      // WHETHER THERE IS A PANE IS THIS PAGE'S ANSWER TO GIVE, and it is sent on
      // every turn. `noPane` is the layout flag enterNoPane sets, so this is a
      // report of what is on screen — the only thing that can be — rather than a
      // second guess at what is on disk. agent.py used to re-resolve it per turn,
      // which drifted the moment a session scaffolded an app into an ordinary
      // folder: turn 2 offered `app_state` against a chat with no pane, and the
      // model got APP_STATE_UNREADABLE back, which the invariant beside that
      // constant says can never be the answer to it. See agent.py `_has_pane`.
      has_pane: noPane ? "0" : "1",
      // key:null — all agent calls opt out of default per-file cancellation
      // (D114): start/poll/history/sessions share one file, and superseding an
      // awaited poll would leave it pending and hang the streaming loop.
    }, { key: null });
    if (error) throw new Error(error);
    started = true;
    fused.params.set("run", run_id);
    await pollLoop(run_id);
  } catch (err) {
    // The run never launched, so the agent never saw the annotations: give
    // them back as pending (and pull the receipt) so they can be re-sent.
    if (!started) {
      // Same for the app-state receipt: nothing was attached to anything.
      if (attach) attach.remove();
      if (pending.length) {
        for (const c of pending) c.sent = 0;
        annSave();
      }
      // Outside the pending check: a view-only send has a receipt and a ghost row
      // to clean up too, and a thumbnail to release, with no annotations at all.
      if (receipt) receipt.remove();
      if (bareTurn) bareTurn.remove();  // no bubble either — drop the ghost row
      // Removing the receipt detaches the only <img> holding each thumbnail's
      // blob URL, and an unrevoked one pins its Blob for the life of the page.
      // A retried send captures fresh crops anyway, so nothing here is reusable.
      annRevokeThumbs(shots);
    }
    addError(err.message);
  } finally {
    sending = false;
  }
  scrollBottom();
  focusBox(box);
  drainQueue();
}

// Re-attach to a run that was streaming when this page last unloaded (mode
// switch / reload): only the poll loop died with the frame — the detached
// claude subprocess kept working. The poll replays the WHOLE turn's text, so
// any partial rows the history restore already rendered are trimmed first.
async function resumeRun(run_id) {
  if (sending) return;
  sending = true;
  try {
    const probe = await fused.runPython(AGENT, { action: "poll", run_id }, { key: null });
    if (probe.error === "unknown run_id") {
      // stale param (bookmarked mid-run URL, pruned tmp) — nothing to attach
      // to, and nothing to hand annotations back to: resolve any stragglers
      fused.params.set("run", "");
      annResolveSent();
      return;
    }
    const probeMsg = stripBlocks(probe.message || "");
    const users = log.querySelectorAll(".user .bubble");
    const lastUser = users[users.length - 1];
    const lastTurn = lastUser && lastUser.parentElement;
    // A marker-only message never counts as a match: every such send collapses to
    // the same text, so it can't identify a specific turn — and a false match
    // trims another turn's assistant rows. Worst case for refusing: a duplicated
    // marker row, which is harmless by comparison. `isMarkerOnly` rather than a
    // literal, so a marker added to stripBlocks cannot leave this check behind.
    const matches = !!lastUser && !isMarkerOnly(probeMsg)
                    && lastUser.textContent === probeMsg;
    if (probe.done) {
      // Run finished with no frame attached: only repair what the restored
      // transcript can provably be missing (see the claude template).
      fused.params.set("run", "");
      annResolveSent();  // the run this frame missed still handled its notes
      snapInvalidate();  // ...and may have edited the file while we were away
      if (probe.error) {
        if (matches || !users.length) addError(probe.error);
        return;
      }
      if (matches) {
        while (lastTurn.nextElementSibling) lastTurn.nextElementSibling.remove();
        if (probe.text) addAssistant("").lastChild.innerHTML = renderMd(probe.text);
      } else if (!users.length && probeMsg) {
        addUser(probeMsg);
        if (probe.text) addAssistant("").lastChild.innerHTML = renderMd(probe.text);
      }
      scrollBottom();
      return;
    }
    if (matches) {
      // In flight and this turn's user line is on screen: keep it, drop the
      // partial assistant rows — pollLoop re-streams the whole turn.
      while (lastTurn.nextElementSibling) lastTurn.nextElementSibling.remove();
    } else if (probeMsg) {
      addUser(probeMsg);
    }
    await pollLoop(run_id);
  } catch (err) {
    console.warn("run re-attach failed:", err.message);
  } finally {
    sending = false;
    focusBox(box);
  }
  drainQueue();
}

function submitChat() {
  // A live run queues instead of refusing: the text is parked and fired when
  // the turn ends. Gated on activeRun, NOT `sending` — `sending` is also held
  // by loadHistory and resumeRun's probe, and a message typed while browsing
  // an old session must not be parked with no run to drain it after.
  if (activeRun) {
    const message = box.value.trim();
    if (!message) return;  // text-only queue; annotation-only sends can't park
    box.value = "";
    growBox();
    queueMessage(message);
    return;
  }
  if (sending) return;
  const message = box.value.trim();
  // notes alone are sendable
  if (!message && !annPending().length) return;
  box.value = "";
  growBox();
  sendMessage(message);
}
// The submit event is the send BUTTON's path (Enter in the box is handled below
// and never reaches here): while a run is live the button is a stop button.
document.getElementById("inputbox").onsubmit = (e) => {
  e.preventDefault();
  if (activeRun) { stopRun(); return; }
  submitChat();
};
box.addEventListener("keydown", (e) => {
  // Enter never stops a run — a user drafting the next message mid-run must not
  // kill the turn with a keystroke meant to queue text. Only the button (now a
  // stop square) and Escape do.
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submitChat(); }
});

// ── home: big input + this file's sidecar sessions ──
document.getElementById("card").onsubmit = (e) => {
  e.preventDefault();
  if (activeRun) { stopRun(); return; }
  if (sending) return;
  const message = homebox.value.trim();
  // notes alone are sendable
  if (!message && !annPending().length) return;
  homebox.value = "";
  growHome();
  enterChat();
  sendMessage(message);
};
homebox.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    document.getElementById("card").requestSubmit();
  }
});

function ago(ts) {
  const s = Math.max(0, Date.now() / 1000 - ts);
  if (s < 60) return "now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  if (s < 172800) return "yesterday";
  return Math.floor(s / 86400) + "d ago";
}

// Content-shaped placeholder for a restoring transcript.
function renderLogSkeleton() {
  log.innerHTML = "";
  const user = document.createElement("div");
  user.className = "turn skel-turn skel-turn-user";
  user.innerHTML = '<div class="skel-bar"></div>';
  const assistant = document.createElement("div");
  assistant.className = "turn skel-turn skel-turn-assistant";
  assistant.innerHTML =
    '<span class="skel-dot-a"></span><span class="skel-lines">' +
    '<span class="skel-bar" style="width:88%"></span>' +
    '<span class="skel-bar" style="width:72%"></span>' +
    '<span class="skel-bar" style="width:50%"></span></span>';
  log.append(user, assistant);
}

async function loadHistory(session_id) {
  // Reuse the `sending` gate: a message sent during the await would be
  // appended first and the older history turns dumped after it.
  if (sending) return;
  sending = true;
  permCards.clear();
  notedSkills.clear();
  renderLogSkeleton();  // replace the visible conversation, don't append to it
  try {
    const { turns } = await fused.runPython(AGENT, { action: "history", file: FILE, session_id }, { key: null });
    log.innerHTML = "";  // drop the skeleton now that real turns are ready
    for (const t of turns) {
      if (t.role === "user") addUser(stripBlocks(t.text));
      else addAssistant("").lastChild.innerHTML = renderMd(t.text);
    }
    scrollBottom();
  } catch (err) {
    log.innerHTML = "";
    console.warn("history restore failed:", err.message);
  } finally {
    sending = false;
  }
}

function addChatRow(list, s) {
  const row = document.createElement("div");
  row.className = "chat-row";
  row.setAttribute("role", "button");
  row.tabIndex = 0;
  row.innerHTML = '<span class="dot">⏺</span><span class="row-title"></span><span class="row-sub"></span>';
  row.querySelector(".row-title").textContent = s.preview || s.id;
  row.querySelector(".row-sub").textContent = ago(s.last_used || s.created_at || 0);
  const open = async () => {
    fused.params.set("session_id", s.id);
    showSession();
    enterChat();
    await loadHistory(s.id);
  };
  row.onclick = open;
  row.onkeydown = (e) => { if (e.key === "Enter") open(); };
  list.appendChild(row);
}

// Content-shaped placeholder for the session list.
function renderRecentSkeleton(list) {
  list.innerHTML = "";
  [72, 58, 44].forEach((pct) => {
    const row = document.createElement("div");
    row.className = "skel-row";
    row.innerHTML =
      '<span class="skel-dot"></span>' +
      '<span class="skel-bar title" style="max-width:' + pct + '%"></span>' +
      '<span class="skel-bar sub"></span>';
    list.appendChild(row);
  });
}

async function loadRecent() {
  const list = document.getElementById("recentlist");
  renderRecentSkeleton(list);
  try {
    const { sessions, error } = await fused.runPython(AGENT, { action: "sessions", file: FILE }, { key: null });
    if (error) throw new Error(error);
    list.innerHTML = "";  // drop the skeleton now that we know the real state
    if (!sessions.length) {
      document.getElementById("recent").style.display = "none";
      return;
    }
    for (const s of sessions) addChatRow(list, s);
  } catch (err) {
    list.innerHTML = "";
    console.warn("session list failed:", err.message);
  }
}

// ── Claude snapshots: the file-history checkpoint chain (SPEC §34) ──
//
// Ported from the superseded `annotate` template. What moved is the OFFER —
// `shared/file_history.py` is unchanged and is still the one reader for this
// store, which stays strictly read-only (it is Claude Code's data, and the very
// edit history the feature exists to protect).
//
// The panel is INTERACTIVE: a list you can only look at answers no question the
// user actually has ("can I get that back?"). A row expands in place to the diff
// between it and the file as it is now, and carries the one action that makes
// the list mean anything — going back to it.
//
// It is also COLLAPSED until asked for. The question it answers is one a user
// arrives at deliberately, so the landing page shows a heading and reads the
// timeline on the first expand rather than paying a worker round trip on every
// file open. See `mountSnapshots` / `loadSnapshots` below for the caching rule.
//
// The two-call contract is annotate's, unchanged, because it is the reason the
// write is safe: `snapshot_plan` describes (diff, counts, whether a copy of the
// current bytes will be kept), `snapshot_revert` only ever applies the id the
// plan handed back. The page never names a version to the write itself. The
// confirm is inline — the row's button turns into "Really go back?" — rather
// than a sheet: one destructive action, one click to arm it, and the diff the
// user is confirming stays on screen the whole time.

// What restoring a version would do to the file AS IT IS NOW. `exact:false`
// means the helper refused to diff (too big, or not text) and only net counts
// are honest, so it says so with a tilde rather than implying a real diff.
function snapDelta(v) {
  const frag = document.createDocumentFragment();
  const span = (cls, text) => {
    const el = document.createElement("span");
    el.className = cls;
    el.textContent = text;
    return el;
  };
  if (!v.existed) return span("snap-minus", "did not exist");
  if (v.added == null || v.removed == null) return document.createTextNode("binary");
  if (!v.differs) return document.createTextNode("on disk now");
  frag.append(span("snap-plus", (v.exact ? "" : "~") + "+" + v.added),
              document.createTextNode(" "),
              span("snap-minus", "−" + v.removed));
  return frag;
}

function snapAgo(sec) {
  if (!sec) return "time unknown";
  const d = Math.max(0, Date.now() / 1000 - sec);
  if (d < 90) return "just now";
  if (d < 3600) return Math.round(d / 60) + "m ago";
  if (d < 86400) return Math.round(d / 3600) + "h ago";
  if (d < 172800) return "yesterday";
  if (d < 86400 * 30) return Math.round(d / 86400) + "d ago";
  return new Date(sec * 1000).toLocaleDateString();
}

// The timeline the panel is painted from, and the row expanded right now. Page
// state rather than DOM state, because a revert repaints the whole list from the
// timeline the write returned and both facts have to survive that.
let snapTimeline = null;
let snapOpenId = null;

function renderSnapshots(timeline) {
  const list = document.getElementById("snapslist");
  const note = document.getElementById("snapsnote");
  if (!list) return;
  snapTimeline = timeline;
  list.textContent = "";
  // Every absence is answered with the reader's own sentence rather than by
  // taking the section away. The panel is now something the user OPENED, and a
  // heading that vanishes under the click that opened it reads as a bug; the
  // reader already distinguishes "no store on this machine" from "a store with
  // nothing for this file" in `note`, so the honest thing is to say which.
  if (!timeline.available) {
    note.textContent = timeline.note || "No Claude Code file history on this machine.";
    return;
  }
  for (const v of timeline.versions) {
    // The row and its expansion share one box, so the open body is visibly part
    // of the row it belongs to rather than a panel floating under the list.
    const item = document.createElement("div");
    item.className = "snap-item";
    const row = document.createElement("div");
    const here = v.id === timeline.position;
    const open = v.id === snapOpenId;
    row.className = "snap-row" + (here ? " here" : "") + (open ? " open" : "");
    row.setAttribute("role", "button");
    row.setAttribute("aria-expanded", open ? "true" : "false");
    row.tabIndex = 0;
    const toggle = () => {
      snapOpenId = open ? null : v.id;
      renderSnapshots(snapTimeline);
    };
    row.onclick = toggle;
    row.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } };
    if (here) row.title = "what is on disk now";
    const dot = document.createElement("span");
    dot.className = "snap-dot";
    dot.textContent = here ? "●" : "○";
    const num = document.createElement("span");
    num.className = "snap-v";
    // A did-not-exist checkpoint IS a numbered version of the chain (v1, the
    // creation boundary), so it wears its number. The dash is only for a record
    // that carried no usable number — "v0" would invent one the store never
    // wrote.
    num.textContent = v.version >= 1 ? "v" + v.version : "—";
    const when = document.createElement("span");
    when.className = "snap-when";
    when.textContent = snapAgo(v.mtime);
    // Version numbers restart per session, so two rows can both say v2; the
    // session's short id is the only thing that tells them apart.
    when.title = (v.mtime ? new Date(v.mtime * 1000).toLocaleString() + " · " : "")
      + "session " + v.session;
    const d = document.createElement("span");
    d.className = "snap-d";
    d.append(snapDelta(v));
    const caret = document.createElement("span");
    caret.className = "snap-caret";
    caret.textContent = open ? "▾" : "▸";
    row.append(dot, num, when, d, caret);
    item.append(row);
    if (open) item.append(snapExpand(v));
    list.appendChild(item);
  }
  note.textContent = timeline.note || "";
}

function snapNote(text) {
  const el = document.createElement("div");
  el.className = "snap-note";
  el.textContent = text;
  return el;
}

function snapErr(text) {
  const el = document.createElement("div");
  el.className = "snap-err";
  el.textContent = text;
  return el;
}

// The expanded row: what going back to this version WOULD do, then the action.
//
// The plan is fetched fresh on every expansion and never cached: it is a
// statement about the file as it is right now, and a stale one is exactly how a
// user confirms one diff and gets a different one. A refusal (unwritable file, a
// version the store can no longer resolve) is rendered IN the row — the row is a
// real thing that exists, and hiding it would read as a bug rather than as an
// answer.
function snapExpand(v) {
  const body = document.createElement("div");
  body.className = "snap-body";
  body.append(snapNote("reading this snapshot…"));
  fused.runPython(AGENT, { action: "snapshot_plan", file: FILE, version_id: v.id }, { key: null })
    .then((plan) => {
      body.textContent = "";
      if (!plan.ok) {
        body.append(snapErr(plan.error || "this snapshot cannot be restored"));
        return;
      }
      body.append(snapDiff(plan), snapAction(plan));
    })
    .catch((err) => {
      body.textContent = "";
      body.append(snapErr(err.message));
    });
  return body;
}

// The change itself, because the counts on the row answer how MUCH and never
// WHAT — and on the one destructive action here the second is the question being
// confirmed. `reason` is the helper's single channel for every "no diff", the
// genuinely empty one included, so a missing diff always says why rather than
// rendering a blank block that reads as broken.
function snapDiff(plan) {
  const wrap = document.createElement("div");
  const d = plan.diff || {};
  if (!d.lines || !d.lines.length) {
    wrap.append(snapNote(d.reason || "There is no diff to show for this snapshot."));
    return wrap;
  }
  const pre = document.createElement("pre");
  pre.className = "snap-diff";
  for (const ln of d.lines) {
    const el = document.createElement("span");
    // The `---`/`+++` file headers before the `+`/`-` test: they open with the
    // same characters and colouring them as added and removed lines is how a
    // two-line header reads as part of the change.
    el.className =
      ln.startsWith("---") || ln.startsWith("+++") ? "dl-head"
      : ln.startsWith("@@") ? "dl-hunk"
      : ln.startsWith("+") ? "dl-add"
      : ln.startsWith("-") ? "dl-del" : "";
    el.textContent = ln + "\n";
    pre.append(el);
  }
  wrap.append(pre);
  if (d.truncated) {
    wrap.append(snapNote("Showing part of " + d.changed + " changed lines."));
  }
  return wrap;
}

// One button, armed by a click rather than acting on it. The confirm is inline
// so the diff being confirmed stays on screen underneath it, and the cost is
// stated BEFORE the click: when the bytes on disk are in no snapshot this write
// destroys the only copy, and whether a copy is kept is the plan's `stash`
// answer rather than a permanent hedge.
function snapAction(plan) {
  const bar = document.createElement("div");
  bar.className = "snap-act";
  const gone = plan.action === "delete";
  const risk = !plan.unique_current ? ""
    : plan.stash
      ? "What is on disk now is in no snapshot — a copy of it is kept for you."
      : "What is on disk now is in no snapshot, and "
        + (plan.stash_note || "no copy of it can be kept") + ".";
  const arm = document.createElement("button");
  arm.type = "button";
  arm.className = "snap-go";
  // No kind noun in any of this copy: the panel is files-only, but a literal
  // "file" in a spoken string is the sink this page has regressed on three
  // times (see test_claude_kind), so the wording simply makes no claim.
  arm.textContent = gone ? "Go back to before it existed"
                         : "Go back to this snapshot";
  arm.onclick = () => {
    bar.textContent = "";
    const ask = document.createElement("span");
    ask.className = "snap-ask";
    ask.textContent = gone ? "Really delete it?" : "Really go back?";
    const yes = document.createElement("button");
    yes.type = "button";
    yes.className = "snap-go";
    yes.textContent = "Yes";
    yes.onclick = () => snapGoBack(plan, bar);
    const no = document.createElement("button");
    no.type = "button";
    no.className = "snap-no";
    no.textContent = "No";
    no.onclick = () => { bar.textContent = ""; bar.append(arm); if (risk) bar.append(snapNote(risk)); };
    bar.append(ask, yes, no);
    if (risk) bar.append(snapNote(risk));
  };
  bar.append(arm);
  if (risk) bar.append(snapNote(risk));
  return bar;
}

// The write. It is handed the id the PLAN returned and nothing else — the page
// never names a version to this action itself, which is the whole of the
// two-call contract the module also enforces.
async function snapGoBack(plan, bar) {
  bar.textContent = "";
  bar.append(snapNote("going back…"));
  try {
    const out = await fused.runPython(AGENT, {
      action: "snapshot_revert", file: FILE, version_id: plan.id,
      // Sent only for the case the user was actually shown the loss for: a
      // token passed on every call is a token nobody reads.
      confirm_unique: plan.unique_current ? "1" : "",
    }, { key: null });
    if (out.error) throw new Error(out.error);
    // Repaint from the timeline the write returned rather than following with a
    // second round trip, for the length of which the list would go on showing
    // the pre-revert position — precisely when the user is staring at it to find
    // out whether it worked.
    snapOpenId = null;
    if (out.timeline) renderSnapshots(out.timeline); else await loadSnapshots();
    document.getElementById("snapsnote").textContent =
      (out.action === "delete"
        ? "Removed — that is how it was at this snapshot."
        : "Back at this snapshot.")
      + (out.stashed ? " The previous content was kept, in case."
                     : out.stash_note ? " " + out.stash_note : "");
  } catch (err) {
    bar.textContent = "";
    bar.append(snapErr(err.message));
  }
}

// ── the section itself: collapsed, and read only when opened ──
//
// The timeline was fetched on every landing-page build, which is a round trip
// through the worker on every file open for a history most opens never look at.
// So the section is offered as soon as the target is known to be a file — a
// static heading over one pressable row — and the read is deferred to the click
// on that row.
//
// The list is cached for the life of the page — the target file never changes
// under it — so re-opening is instant and costs nothing. What invalidates that
// cache is a WRITE: `snapGoBack` repaints from the post-revert timeline the
// write itself returned (and falls back to a refetch), which is the only event
// that appends to the chain from here. A failed read caches nothing, so the
// next expand retries rather than leaving the section permanently empty.
let snapLoaded = false;
let snapExpanded = false;

// A FINISHED TURN is the other way this chain grows. Claude edits the file, and
// Claude Code checkpoints what it edits — exactly what a revert does, and the
// panel has no way to see it: the cache is keyed to nothing but the page, so a
// landing page reached after a turn showed the pre-turn position, stale deltas
// and none of the new versions. Called from every place a run ENDS (the poll
// loop's `done` branch, and resumeRun's, for a turn this frame was not attached
// to), beside `annResolveSent` — the same "that turn is over" moment.
//
// The lazy contract survives: a COLLAPSED panel drops the cache and reads
// nothing, because a turn is not an expand. An OPEN one refetches and repaints
// now, for the reason the revert path repaints rather than waiting — a list left
// on screen saying the wrong thing is worse than one that costs a round trip.
// The expanded ROW is left open on purpose: `snapExpand` fetches its plan fresh
// on every render, so it re-reads against the new bytes rather than going stale,
// and closing it under the user would lose the thing they were reading.
//
// Hoisted past its own `let`s, like the rest of this section: every caller is an
// async continuation that cannot run until the script has finished executing.
function snapInvalidate() {
  snapLoaded = false;
  if (snapExpanded) loadSnapshots();
}

// Reveal the collapsed section. Called on every path onto the landing page; it
// fetches nothing, and it deliberately does NOT reset `snapExpanded` — a user
// who opened the panel, entered a chat and came back is still looking at the
// same file's history.
async function mountSnapshots() {
  // FILES only, and `targetNoun` is the page's ONE answer to what the target is
  // (set by paneURL from the stat). Reusing it rather than re-probing is what
  // keeps this panel from ever disagreeing with the rest of the page — and
  // awaiting `paneReady` first is what makes the answer available: both boot
  // IIFEs start together, so reading the noun without the wait raced the stat
  // and read "" on every open. Note it is `targetNoun`, not `paneNoun` — the
  // latter names the left pane's DOCUMENT ("preview"/"app") and is never
  // "file", so gating on it would have hidden the panel permanently.
  //
  // The backend refuses a folder too (agent.py `_snapshots`): the gate is the
  // UX, the module is the guarantee (MD-11).
  await paneReady;
  if (targetNoun !== "file") return;
  document.getElementById("snaps").hidden = false;
}

const snapOpenRow = document.getElementById("snapsopen");
const snapHideBtn = document.getElementById("snapshide");
const SNAP_OPEN_LABEL = "Show version history";

// FOUR states in one function, because they are one question — what is on
// screen — and three booleans set from four call sites is how two of them end
// up disagreeing. `loading` keeps the placeholder row exactly where it is and
// only changes its words, so the wait costs no layout jump; `error` puts that
// same row back (it is the retry) with the note underneath it.
function snapShow(state) {
  snapExpanded = state === "open";
  snapOpenRow.querySelector(".snap-open-label").textContent =
    state === "loading" ? "Loading…" : SNAP_OPEN_LABEL;
  snapOpenRow.hidden = snapExpanded;
  snapOpenRow.setAttribute("aria-expanded", snapExpanded ? "true" : "false");
  // Nothing to show while collapsed, and nothing to show WHILE READING either:
  // an empty bordered body under the row would be a box that says nothing.
  document.getElementById("snapsbody").hidden = state === "collapsed" || state === "loading";
  snapHideBtn.hidden = !snapExpanded;
}

const snapToggle = () => {
  if (snapExpanded) { snapShow("collapsed"); return; }
  // Cached: the target file cannot change under this page, so a second open is
  // instant and costs no round trip.
  if (snapLoaded) { snapShow("open"); return; }
  snapShow("loading");
  loadSnapshots();
};
// A div with role=button gets Enter and Space by hand — the same wiring the
// snapshot rows below it use, for the same reason.
snapOpenRow.onclick = snapToggle;
snapOpenRow.onkeydown = (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); snapToggle(); }
};
snapHideBtn.onclick = snapToggle;

// The read. Only ever reached from an expand (or from a revert whose write did
// not hand back a timeline), so the gate is `mountSnapshots`' and this call is
// free to assume the target is a file. The waiting state is the ROW's business
// (snapShow), not this function's.
async function loadSnapshots() {
  const note = document.getElementById("snapsnote");
  note.textContent = "";
  try {
    // No `enrich`: enrichment reads session transcripts (5 MB+). The unenriched
    // timeline cannot see the creation boundary, which is why this panel never
    // claims a chain is complete.
    const timeline = await fused.runPython(AGENT, { action: "snapshots", file: FILE }, { key: null });
    if (timeline.error) throw new Error(timeline.error);
    snapLoaded = true;
    renderSnapshots(timeline);
    snapShow("open");
  } catch (err) {
    // An ordinary absence, never the red overlay: a file Claude has never
    // touched is the common case, not a bug in this view. `snapLoaded` stays
    // false so the next expand asks again instead of leaving the section stuck
    // on the failure for the life of the page — which is exactly why the
    // pressable row comes BACK rather than the section opening onto an error.
    console.warn("snapshots failed:", err.message);
    snapShow("error");
    note.textContent = "The snapshots could not be read (" + err.message + ").";
  }
}

// ── boot: resume from URL, or show the landing page ──
(async () => {
  const session_id = fused.params.get("session_id");
  const run_id = fused.params.get("run");
  if (session_id || run_id) {
    // A bare `run` param (frame died before the first poll saw the session id)
    // still means an in-flight conversation — enter chat and re-attach.
    enterChat();
    // BEFORE both awaits, and that ordering is the feature. resumeRun's tail
    // calls drainQueue, so entries restored after it would sit below the log
    // untouched until some later turn happened to end. Restoring first also
    // means the bubbles are on screen for the whole of the history load and the
    // re-attach probe, which is exactly what the user left behind — rather than
    // appearing seconds later as if the page had thought better of it.
    // Cheap and synchronous (a storage read and a few nodes), so it costs the
    // re-attach nothing.
    restoreQueue(session_id, run_id);
    if (session_id) await loadHistory(session_id);
    if (run_id) await resumeRun(run_id);
    // The run this queue was parked behind may have finished while no frame was
    // attached (`resumeRun` takes the done branch and never polls), and then
    // nothing else will ever call drainQueue for it. Firing here sends what the
    // live page would have sent the moment that turn ended; a no-op when the
    // queue is empty or resumeRun already drained it.
    drainQueue();
  } else {
    // No conversation to belong to, so nothing to restore — and nothing to
    // clean up either. This boot owns no record by definition (it has no ids to
    // match one with), and the tab's storage may well belong to a chat that is
    // still running in another frame: the preview pane mounts one of these for
    // any row previewed in claude mode. Touching the store from here is exactly
    // how a live conversation's parked messages used to disappear.
    focusBox(homebox);
    await loadRecent();
    await mountSnapshots();
  }
})();
</script>
</body>
</html>
