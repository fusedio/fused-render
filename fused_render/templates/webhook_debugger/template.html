<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Webhook Debugger</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #101318;
    --panel: #151920;
    --panel-2: #1a1f27;
    --rail: #12161c;
    --input: #11151a;
    --hover: #151a21;
    --detail: #12171e;
    --line: #2a303a;
    --line-soft: #202630;
    --text: #dce2ea;
    --strong: #f2f5f8;
    --muted: #8993a3;
    --faint: #5d6877;
    --accent: #55b8d2;
    --accent-dim: rgba(85, 184, 210, 0.13);
    --grid: #252c35;
    --axis: #687281;
    --get: #63b3ed;
    --post: #56c271;
    --put: #e6b450;
    --patch: #9b8afb;
    --delete: #f06464;
    --other: #8993a3;
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f7f8fa;
    --panel: #ffffff;
    --panel-2: #eef1f5;
    --rail: #f2f4f7;
    --input: #ffffff;
    --hover: #edf2f6;
    --detail: #f4f6f8;
    --line: #cfd5dd;
    --line-soft: #e1e5ea;
    --text: #202733;
    --strong: #101722;
    --muted: #5f6b7a;
    --faint: #7b8795;
    --accent: #147d99;
    --accent-dim: rgba(20, 125, 153, 0.11);
    --grid: #dce1e7;
    --axis: #687586;
    --post: #2f9e51;
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-size: 13px; }
  button, input, textarea { font: inherit; }
  button { color: inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .app { min-height: 100vh; display: grid; grid-template-columns: 262px minmax(0, 1fr); }
  .app.focus-mode { grid-template-columns: minmax(0, 1fr); }
  .app.focus-mode .facets { display: none; }
  .app.facets-collapsed { grid-template-columns: 46px minmax(0, 1fr); }
  .app.facets-collapsed .facets-inner, .app.facets-collapsed .brand-label, .app.facets-collapsed .theme-toggle { display: none; }
  .app.facets-collapsed .brand { justify-content: center; padding: 0; }

  .facets { position: sticky; top: 0; height: 100vh; overflow: auto; border-right: 1px solid var(--line); background: var(--rail); }

  .brand { height: 48px; display: flex; align-items: center; gap: 9px; padding: 0 14px; border-bottom: 1px solid var(--line); color: var(--strong); font-size: 11px; font-weight: 700; letter-spacing: 0.13em; }
  .brand-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rail-toggle { display: grid; place-items: center; width: 22px; height: 28px; padding: 0; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
  .rail-toggle:hover { color: var(--accent); background: var(--accent-dim); }
  .brand-mark { width: 17px; height: 17px; display: grid; align-content: center; gap: 2px; }
  .brand-mark i { display: block; height: 2px; background: var(--accent); }
  .brand-mark i:nth-child(2) { width: 60%; }
  .brand-mark i:nth-child(3) { width: 82%; }
  .theme-toggle { display: grid; place-items: center; width: 26px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: var(--muted); cursor: pointer; font-size: 15px; }
  .theme-toggle:hover { color: var(--accent); background: var(--accent-dim); }

  .facet-section { padding: 15px 13px; border-bottom: 1px solid var(--line-soft); }
  .facet-title { margin: 0 0 10px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: 0.11em; text-transform: uppercase; }

  .endpoint-list { display: grid; gap: 3px; }
  .endpoint { width: 100%; display: flex; align-items: center; gap: 8px; padding: 7px 8px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--text); cursor: pointer; text-align: left; }
  .endpoint:hover { background: var(--hover); }
  .endpoint.active { border-color: var(--accent); background: var(--accent-dim); }
  .endpoint.active .endpoint-name { color: var(--strong); font-weight: 650; }
  .endpoint-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .endpoint-path { color: var(--faint); font: 10px ui-monospace, monospace; }

  .listener { display: grid; gap: 9px; }
  .listener-row { display: flex; align-items: center; gap: 7px; }
  .url-field { flex: 1; min-width: 0; height: 30px; padding: 0 8px; border: 1px solid var(--line); border-radius: 3px; background: var(--input); color: var(--strong); font: 11px ui-monospace, SFMono-Regular, Consolas, monospace; overflow: hidden; text-overflow: ellipsis; }
  .copy-btn { flex: 0 0 auto; }
  .live-dot { width: 7px; height: 7px; display: inline-block; border-radius: 50%; background: var(--faint); }
  .live-dot.on { background: var(--post); box-shadow: 0 0 0 3px rgba(86,194,113,0.2); }
  .listener-meta { display: grid; grid-template-columns: auto 1fr; gap: 5px 9px; color: var(--muted); font-size: 11px; }
  .listener-meta dd { margin: 0; text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
  .listener-note { color: var(--faint); font-size: 10px; line-height: 1.5; }
  .tunnel-input { width: 100%; height: 28px; padding: 0 8px; border: 1px solid var(--line); border-radius: 3px; background: var(--input); color: var(--strong); font: 11px ui-monospace, monospace; }
  .tunnel-input::placeholder { color: var(--faint); }

  .method-list { display: grid; gap: 3px; }
  .method-option { width: 100%; display: grid; grid-template-columns: 15px 8px 1fr auto; align-items: center; gap: 7px; padding: 4px 5px; border: 0; border-radius: 3px; background: transparent; cursor: pointer; text-align: left; }
  .method-option:hover { background: var(--panel-2); }
  .check { width: 14px; height: 14px; display: grid; place-items: center; border: 1px solid var(--muted); border-radius: 2px; color: var(--input); font-size: 10px; font-weight: 900; }
  .method-option.active .check { border-color: var(--accent); background: var(--accent); }
  .method-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--method-color); }
  .method-count { color: var(--faint); font-variant-numeric: tabular-nums; }

  .workspace { min-width: 0; }
  .query-header { min-height: 48px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  .query-form { min-width: 180px; flex: 1; display: flex; align-items: stretch; }
  .query-prefix { display: grid; place-items: center; padding: 0 10px; border: 1px solid var(--line); border-right: 0; border-radius: 3px 0 0 3px; background: var(--input); color: var(--accent); font: 600 11px ui-monospace, Consolas, monospace; }
  #query { width: 100%; height: 32px; padding: 0 10px; border: 1px solid var(--line); background: var(--input); color: var(--strong); font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; }
  #query::placeholder { color: var(--faint); }
  .button { min-height: 32px; padding: 0 11px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel-2); cursor: pointer; white-space: nowrap; }
  .button:hover:not(:disabled) { border-color: var(--muted); background: var(--hover); }
  .button:disabled { opacity: 0.4; cursor: default; }
  .button.small { min-height: 27px; font-size: 11px; }
  .query-submit { border-left: 0; border-radius: 0 3px 3px 0; border-color: #318da7; background: #287e97; color: white; font-weight: 600; }
  .query-submit:hover { background: #3190aa; }
  #live-toggle[aria-pressed="true"] { border-color: var(--post); color: var(--post); background: rgba(86,194,113,0.1); }
  #focus-toggle[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }

  .canvas-panel { height: 168px; display: grid; grid-template-rows: 31px minmax(0, 1fr); border-bottom: 1px solid var(--line); background: var(--rail); }
  .canvas-head { display: flex; align-items: center; gap: 12px; padding: 0 13px; color: var(--muted); font-size: 11px; }
  .canvas-head strong { color: var(--text); font-weight: 600; }
  #hist-summary { margin-left: auto; font-variant-numeric: tabular-nums; }
  .canvas-wrap { min-height: 0; position: relative; padding: 0 8px 5px; }
  #histogram { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #hist-tooltip { position: absolute; z-index: 3; display: none; max-width: 220px; padding: 6px 8px; border: 1px solid #404957; border-radius: 3px; background: rgba(13,16,21,0.96); color: #dbe1e8; font-size: 11px; line-height: 1.45; pointer-events: none; box-shadow: 0 5px 18px rgba(0,0,0,0.35); }

  .view-bar { height: 42px; display: flex; align-items: end; gap: 4px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .tab { height: 41px; padding: 0 12px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); cursor: pointer; }
  .tab:hover { color: var(--text); }
  .tab.active { border-bottom-color: var(--accent); color: var(--strong); }
  #result-summary { align-self: center; margin-left: auto; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }

  .status { min-height: 240px; display: grid; place-content: center; gap: 12px; padding: 34px; color: var(--muted); text-align: center; }
  .status.error { color: #f18c8c; }
  .status .onboard { display: grid; gap: 10px; justify-items: center; max-width: 520px; }
  .status code, .curl-box { display: block; padding: 9px 11px; border: 1px solid var(--line); border-radius: 4px; background: var(--input); color: var(--text); font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; text-align: left; overflow-wrap: anywhere; }

  .req-list { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .req-row { display: grid; grid-template-columns: 25px 128px 66px minmax(0, 1fr) 74px; min-height: 32px; border-bottom: 1px solid var(--line-soft); background: var(--bg); cursor: pointer; }
  .req-row:hover { background: var(--hover); }
  .req-row.expanded { background: var(--panel-2); }
  .req-cell { min-width: 0; padding: 8px; border-right: 1px solid var(--line-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .es-expand-mark { color: var(--faint); text-align: center; }
  .req-time { color: var(--muted); font-variant-numeric: tabular-nums; }
  .req-path { color: var(--text); }
  .req-size { color: var(--faint); text-align: right; font-variant-numeric: tabular-nums; }
  .method-badge { align-self: center; justify-self: start; padding: 2px 7px; border-radius: 3px; font-size: 10px; font-weight: 700; letter-spacing: 0.03em; color: #fff; background: var(--method-color, var(--other)); }

  .req-detail { display: none; grid-column: 1 / -1; padding: 12px 14px 14px 33px; border-top: 1px solid var(--line); background: var(--detail); }
  .req-row.expanded .req-detail { display: block; }
  .detail-section { margin-bottom: 12px; }
  .detail-label { margin: 0 0 6px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .kv-table { width: 100%; border-collapse: collapse; font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; }
  .kv-table td { padding: 3px 8px 3px 0; vertical-align: top; overflow-wrap: anywhere; }
  .kv-table td:first-child { width: 210px; color: var(--muted); }
  .kv-table td:last-child { color: var(--text); }
  .body-pane { margin: 0; padding: 10px 11px; border: 1px solid var(--line); border-radius: 4px; background: var(--input); color: var(--text); font: 12px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace; overflow: auto; max-height: 340px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .tok-key { color: var(--patch); }
  .tok-str { color: var(--post); }
  .tok-num { color: var(--put); }
  .tok-bool { color: var(--delete); }
  .detail-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 4px; }

  .replay-panel, .ab-hint { display: none; margin-top: 10px; padding: 11px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); }
  .replay-panel.open { display: block; }
  .replay-grid { display: grid; gap: 8px; }
  .replay-grid label { display: grid; gap: 4px; color: var(--muted); font-size: 11px; }
  .replay-grid input, .replay-grid textarea { padding: 6px 8px; border: 1px solid var(--line); border-radius: 3px; background: var(--input); color: var(--strong); font: 12px ui-monospace, Consolas, monospace; }
  .replay-grid textarea { min-height: 72px; resize: vertical; }
  .replay-result { margin-top: 9px; }
  .replay-status { font-weight: 700; }

  .diff-wrap { padding: 12px 14px 30px; }
  .diff-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .diff-col h3 { margin: 0 0 7px; color: var(--strong); font-size: 12px; }
  .diff-line { display: block; padding: 1px 6px; font: 12px/1.5 ui-monospace, Consolas, monospace; overflow-wrap: anywhere; white-space: pre-wrap; }
  .diff-add { background: rgba(86,194,113,0.14); color: var(--post); }
  .diff-del { background: rgba(240,100,100,0.14); color: var(--delete); }
  .diff-same { color: var(--muted); }

  .pager { min-height: 47px; display: flex; align-items: center; gap: 7px; padding: 7px 12px; border-top: 1px solid var(--line); background: var(--panel); }
  .pager[hidden] { display: none; }
  .page-position { margin-left: auto; color: var(--muted); font: 11px ui-monospace, Consolas, monospace; }

  .skel-bar { display: inline-block; border-radius: 3px; background: linear-gradient(90deg, var(--line-soft) 25%, var(--panel-2) 50%, var(--line-soft) 75%); background-size: 200% 100%; animation: skel 1.2s ease-in-out infinite; }
  @keyframes skel { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .skel-row, .skel-row:hover { background: var(--bg); cursor: default; }
  .hist-skel { position: absolute; z-index: 2; inset: 0; border-radius: 3px; background: linear-gradient(90deg, var(--line-soft) 25%, var(--panel-2) 50%, var(--line-soft) 75%); background-size: 200% 100%; animation: skel 1.2s ease-in-out infinite; pointer-events: none; }
  .hist-skel[hidden] { display: none; }

  @media (max-width: 820px) {
    .app, .app.facets-collapsed, .app.focus-mode { display: block; grid-template-columns: none; }
    .facets { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    .app.facets-collapsed .facets-inner { display: block; }
    .facets-inner { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); align-items: start; }
    .facet-section { border-bottom: 0; border-right: 1px solid var(--line-soft); }
    .req-row { grid-template-columns: 22px 104px 58px minmax(0, 1fr); }
    .req-row > .req-size { display: none; }
    .diff-cols { grid-template-columns: 1fr; }
  }

  @media (max-width: 560px) {
    .facets-inner { grid-template-columns: 1fr; }
    .facet-section { border-right: 0; border-bottom: 1px solid var(--line-soft); }
    .query-header { flex-wrap: wrap; }
    .query-form { flex-basis: 100%; order: -1; }
    .query-header > .button { flex: 1; }
    .canvas-panel { height: 150px; }
    .req-row { grid-template-columns: 20px 78px 54px minmax(0, 1fr); }
    .req-time { font-size: 11px; }
    .req-detail { padding-left: 14px; }
    .kv-table td:first-child { width: 108px; }
    #result-summary { max-width: 50%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  }
</style>
</head>
<body>
  <div class="app">
    <aside class="facets">
      <div class="brand">
        <button class="rail-toggle" id="rail-toggle" type="button" title="Collapse sidebar" aria-label="Collapse sidebar" aria-pressed="false">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        </button>
        <span class="brand-label">WEBHOOK DEBUGGER</span>
        <button class="theme-toggle" id="theme-toggle" type="button" title="Switch theme" aria-label="Switch theme">&#9680;</button>
      </div>
      <div class="facets-inner">
      <section class="facet-section">
        <h2 class="facet-title">Endpoints</h2>
        <div class="endpoint-list" id="endpoint-list"></div>
      </section>
      <section class="facet-section">
        <h2 class="facet-title">Listener</h2>
        <div class="listener" id="listener">
          <div class="listener-row">
            <span class="url-field" id="capture-url" title="Capture URL"><span class="skel-bar" style="width:80%;height:11px"></span></span>
            <button class="button copy-btn small" id="copy-url" type="button">Copy</button>
          </div>
          <dl class="listener-meta">
            <dt><span class="live-dot" id="live-dot"></span> Status</dt><dd id="listen-status">-</dd>
            <dt>Captured</dt><dd id="listen-count">-</dd>
            <dt>Buffer</dt><dd id="listen-buffer">-</dd>
          </dl>
          <div class="listener-row">
            <button class="button small" id="tunnel-btn" type="button">Start tunnel</button>
            <span id="tunnel-state" style="color:var(--faint);font-size:11px"></span>
          </div>
          <input class="tunnel-input" id="public-url" type="text" spellcheck="false" autocomplete="off" placeholder="or paste your own tunnel URL" aria-label="Public tunnel URL" />
          <p class="listener-note">Local only — tunnel with cloudflared/ngrok to receive from the internet.</p>
        </div>
      </section>
      <section class="facet-section">
        <h2 class="facet-title">Method</h2>
        <div class="method-list" id="method-list"></div>
      </section>
      </div>
    </aside>

    <main class="workspace">
      <header class="query-header">
        <form class="query-form" id="query-form">
          <span class="query-prefix">q</span>
          <input id="query" type="search" autocomplete="off" spellcheck="false" placeholder="Filter text, path, headers, or /regex/" aria-label="Request filter" />
          <button class="button query-submit" type="submit">Filter</button>
        </form>
        <button class="button" id="focus-toggle" type="button" aria-pressed="false">Focus</button>
        <button class="button" id="clear-range" type="button">Clear time</button>
        <button class="button" id="clear-all" type="button">Clear captures</button>
        <button class="button" id="live-toggle" type="button" aria-pressed="true"><span class="live-dot on" style="margin-right:6px"></span>Live</button>
      </header>

      <section class="canvas-panel" aria-label="Request arrivals">
        <div class="canvas-head">
          <strong>Arrivals</strong>
          <span id="time-window">All time</span>
          <span id="hist-summary"></span>
        </div>
        <div class="canvas-wrap" id="canvas-wrap">
          <canvas id="histogram"></canvas>
          <div class="hist-skel" id="hist-skel" aria-hidden="true"></div>
          <div id="hist-tooltip"></div>
        </div>
      </section>

      <nav class="view-bar" aria-label="Result view">
        <button class="tab active" id="requests-tab" type="button">Requests</button>
        <button class="tab" id="diff-tab" type="button">Diff</button>
        <span id="result-summary"></span>
      </nav>

      <section id="results" aria-live="polite">
        <div class="req-list">
          <div class="req-row skel-row"><span class="req-cell"></span><span class="req-cell"><span class="skel-bar" style="width:70%;height:10px"></span></span><span class="req-cell"><span class="skel-bar" style="width:60%;height:10px"></span></span><span class="req-cell"><span class="skel-bar" style="width:80%;height:10px"></span></span><span class="req-cell"><span class="skel-bar" style="width:40%;height:10px"></span></span></div>
          <div class="req-row skel-row"><span class="req-cell"></span><span class="req-cell"><span class="skel-bar" style="width:70%;height:10px"></span></span><span class="req-cell"><span class="skel-bar" style="width:60%;height:10px"></span></span><span class="req-cell"><span class="skel-bar" style="width:55%;height:10px"></span></span><span class="req-cell"><span class="skel-bar" style="width:40%;height:10px"></span></span></div>
          <div class="req-row skel-row"><span class="req-cell"></span><span class="req-cell"><span class="skel-bar" style="width:70%;height:10px"></span></span><span class="req-cell"><span class="skel-bar" style="width:60%;height:10px"></span></span><span class="req-cell"><span class="skel-bar" style="width:90%;height:10px"></span></span><span class="req-cell"><span class="skel-bar" style="width:40%;height:10px"></span></span></div>
        </div>
      </section>

      <footer class="pager" id="pager" hidden>
        <button class="button" id="prev-page" type="button">Previous</button>
        <button class="button" id="next-page" type="button">Next</button>
        <span class="page-position" id="page-position"></span>
      </footer>
    </main>
  </div>

<script src="/template-shared/event-stream.js"></script>
<script>
  const ES = window.EventStream;
  const escapeHtml = ES.escapeHtml;
  const PAGE_LIMIT = 100;
  const METHODS = ["GET", "POST", "PUT", "PATCH", "DELETE", "OTHER"];
  const METHOD_COLOR = {
    GET: "var(--get)", POST: "var(--post)", PUT: "var(--put)",
    PATCH: "var(--patch)", DELETE: "var(--delete)", OTHER: "var(--other)"
  };

  const PARAM_DEFS = {
    q: "", methods: "", path_prefix: "", from: "", to: "", page: "0",
    view: "requests", live: "1", sel: "", diffa: "", diffb: "", target: "",
    open: "", theme: "light", focus: "0"
  };

  const el = (id) => document.getElementById(id);
  const endpointList = el("endpoint-list");
  const methodList = el("method-list");
  const listenStatus = el("listen-status");
  const listenCount = el("listen-count");
  const listenBuffer = el("listen-buffer");
  const liveDot = el("live-dot");
  const captureUrlEl = el("capture-url");
  const copyUrlBtn = el("copy-url");
  const tunnelBtn = el("tunnel-btn");
  const tunnelState = el("tunnel-state");
  const publicUrlInput = el("public-url");
  const queryForm = el("query-form");
  const queryInput = el("query");
  const focusToggle = el("focus-toggle");
  const clearRange = el("clear-range");
  const clearAll = el("clear-all");
  const liveToggle = el("live-toggle");
  const themeToggle = el("theme-toggle");
  const requestsTab = el("requests-tab");
  const diffTab = el("diff-tab");
  const resultSummary = el("result-summary");
  const results = el("results");
  const pager = el("pager");
  const prevPage = el("prev-page");
  const nextPage = el("next-page");
  const pagePosition = el("page-position");
  const histSkel = el("hist-skel");
  const timeWindow = el("time-window");
  const histSummary = el("hist-summary");

  let daemon = null;
  let descriptor = { name: "", path: "", public_url: "", capture_url: "" };
  let endpoints = [];
  let lastSeq = 0;
  let generation = 0;
  let listenSince = 0;
  let liveTimer = null;
  let liveBusy = false;
  const fullCache = new Map();

  const chart = ES.Histogram(el("histogram"), {
    order: METHODS,
    tooltip: el("hist-tooltip"),
    colorFor: (m) => {
      const styles = getComputedStyle(document.documentElement);
      return styles.getPropertyValue(({ GET: "--get", POST: "--post", PUT: "--put",
        PATCH: "--patch", DELETE: "--delete" })[m] || "--other").trim() || "#888";
    },
    formatTime: (v) => formatTime(v),
    emptyLabel: "No requests captured in this range",
    onBrush: (from, to) => ES.setParams(fused, { from: String(from), to: String(to), page: "0", live: "0" })
  });

  function state() { return ES.readParams(fused, PARAM_DEFS); }

  function activeMethods(s) {
    return s.methods ? s.methods.split(",").map((m) => m.trim().toUpperCase()).filter(Boolean) : [];
  }

  function formatTime(epoch) {
    const n = Number(epoch);
    if (!Number.isFinite(n)) return "-";
    const d = new Date(n * 1000);
    return new Intl.DateTimeFormat(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit" }).format(d);
  }

  function formatClock(epoch) {
    const n = Number(epoch);
    if (!Number.isFinite(n)) return "-";
    return new Intl.DateTimeFormat(undefined, { month: "short", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" }).format(new Date(n * 1000));
  }

  function formatBytes(value) {
    let amount = Number(value) || 0;
    if (amount < 1024) return `${amount} B`;
    const units = ["KB", "MB", "GB"];
    let unit = -1;
    do { amount /= 1024; unit += 1; } while (amount >= 1024 && unit < units.length - 1);
    return `${amount.toFixed(amount >= 10 ? 1 : 2)} ${units[unit]}`;
  }

  function methodColor(m) { return METHOD_COLOR[m] || METHOD_COLOR.OTHER; }
  function methodBucket(m) { return METHODS.includes(m) ? m : "OTHER"; }

  let daemonPromise = null;
  async function ensureDaemon() {
    if (daemon && daemon.control_port) return daemon;
    // Share one in-flight ensure across concurrent callers (initial load +
    // onChange + pollLive all race here on a cold open); without this each
    // fires its own runPython and they collide on the fixed capture port.
    if (daemonPromise) return daemonPromise;
    daemonPromise = (async () => {
      const r = await fused.runPython("./server.py", { file: fused.params.get("_file") || "" }, { key: null }).catch(() => null);
      if (r && r.error) { daemon = null; return { error: r.error }; }
      if (r && r.control_port) {
        daemon = r;
        descriptor.public_url = descriptor.public_url || r.public_url || "";
        descriptor.capture_url = r.capture_url || "";
        descriptor.name = r.name || "";
        descriptor.path = r.path || "";
        loadDescriptor();
      }
      return daemon;
    })();
    try { return await daemonPromise; }
    finally { daemonPromise = null; }
  }

  function dURL(path) {
    const sep = path.includes("?") ? "&" : "?";
    return `http://127.0.0.1:${daemon.control_port}${path}${sep}t=${encodeURIComponent(daemon.token || "")}`;
  }

  async function api(path, opts) {
    const d = await ensureDaemon();
    if (!d || d.error || !d.control_port) throw new Error(d && d.error ? d.error : "daemon unavailable");
    try {
      const res = await fetch(dURL(path), opts);
      if (!res.ok && res.status !== 404 && res.status !== 400) throw new Error(`control ${res.status}`);
      return await res.json();
    } catch (err) {
      daemon = null;
      const d2 = await ensureDaemon();
      if (!d2 || d2.error || !d2.control_port) throw new Error(d2 && d2.error ? d2.error : "daemon unavailable");
      const res = await fetch(dURL(path), opts);
      return await res.json();
    }
  }

  function filterParams(s, includeMethods) {
    const q = new URLSearchParams();
    if (s.q) q.set("q", s.q);
    if (s.path_prefix) q.set("path_prefix", s.path_prefix);
    if (s.from) q.set("from", s.from);
    if (s.to) q.set("to", s.to);
    if (includeMethods && s.methods) q.set("methods", s.methods);
    return q;
  }

  function captureUrl(s) {
    const base = descriptor.capture_url || (daemon && daemon.capture_url) || "";
    return base + (descriptor.path || "");
  }

  function renderEndpoints(s) {
    const active = activeMethods(s);
    endpointList.innerHTML = endpoints.map((ep) => {
      const on = (s.path_prefix || "") === (ep.path || "");
      return `<button class="endpoint ${on ? "active" : ""}" type="button" data-path="${escapeHtml(ep.path || "")}">
        <span class="endpoint-name">${escapeHtml(ep.name)}</span>
        <span class="endpoint-path">${escapeHtml(ep.path || "/*")}</span>
      </button>`;
    }).join("");
  }

  function renderMethods(s, counts) {
    const active = new Set(activeMethods(s));
    methodList.innerHTML = METHODS.map((m) => {
      const on = active.size === 0 || active.has(m);
      return `<button class="method-option ${on ? "active" : ""}" type="button" data-method="${m}" style="--method-color:${methodColor(m)}" aria-pressed="${on}">
        <span class="check">${on ? "x" : ""}</span>
        <span class="method-dot"></span>
        <span>${m}</span>
        <span class="method-count">${(counts[m] || 0).toLocaleString()}</span>
      </button>`;
    }).join("");
  }

  function renderState(s) {
    document.documentElement.dataset.theme = s.theme;
    document.querySelector(".app").classList.toggle("focus-mode", s.focus === "1");
    queryInput.value = s.q;
    themeToggle.title = s.theme === "light" ? "Switch to dark mode" : "Switch to light mode";
    focusToggle.setAttribute("aria-pressed", String(s.focus === "1"));
    liveToggle.setAttribute("aria-pressed", String(s.live !== "0"));
    clearRange.disabled = !s.from && !s.to;
    requestsTab.classList.toggle("active", s.view !== "diff");
    diffTab.classList.toggle("active", s.view === "diff");
    timeWindow.textContent = s.from && s.to ? `${formatClock(s.from)} — ${formatClock(s.to)}` : "All time";
    publicUrlInput.value = s.target || descriptor.public_url || "";
  }

  function renderListener(ping, s) {
    const url = captureUrl(s);
    captureUrlEl.textContent = url;
    captureUrlEl.title = url;
    if (!ping) return;
    const live = s.live !== "0";
    liveDot.classList.toggle("on", live);
    if (!listenSince) listenSince = Date.now();
    listenStatus.textContent = live ? "Listening" : "Paused";
    listenCount.textContent = (ping.count || 0).toLocaleString();
    listenBuffer.textContent = `${Math.round((ping.count || 0) / 10)}% of 1000`;
    tunnelState.textContent = ping.public_url ? "tunnel up" : (ping.tunnel_state === "starting" ? "starting…" : "");
    if (ping.public_url && !s.target) descriptor.public_url = ping.public_url;
  }

  function bodyHtml(full) {
    if (full.binary) {
      return `<pre class="body-pane">binary payload · ${escapeHtml(formatBytes(full.body_len))}${full.body_truncated ? " (truncated at 1 MiB)" : ""}</pre>`;
    }
    const text = full.body_text || "";
    if (!text) return `<pre class="body-pane" style="color:var(--faint)">(empty body)</pre>`;
    const ctype = (full.headers.find(([k]) => k.toLowerCase() === "content-type") || ["", ""])[1].toLowerCase();
    if (ctype.includes("application/x-www-form-urlencoded")) {
      const rows = text.split("&").map((pair) => {
        const eq = pair.indexOf("=");
        const k = decodeURIComponent((eq < 0 ? pair : pair.slice(0, eq)).replace(/\+/g, " "));
        const v = eq < 0 ? "" : decodeURIComponent(pair.slice(eq + 1).replace(/\+/g, " "));
        return `<tr><td>${escapeHtml(k)}</td><td>${escapeHtml(v)}</td></tr>`;
      }).join("");
      return `<table class="kv-table">${rows}</table>`;
    }
    let pretty = text;
    try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch (_) {}
    return `<pre class="body-pane">${colorizeJson(pretty)}</pre>${full.body_truncated ? `<div class="listener-note">Body truncated at 1 MiB.</div>` : ""}`;
  }

  function colorizeJson(text) {
    const escaped = escapeHtml(text);
    return escaped.replace(
      /(&quot;(?:[^&]|&(?!quot;))*?&quot;)(\s*:)?|(\b-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b)|(\btrue\b|\bfalse\b|\bnull\b)/g,
      (m, str, colon, num, bool) => {
        if (str) return `<span class="${colon ? "tok-key" : "tok-str"}">${str}</span>${colon || ""}`;
        if (num) return `<span class="tok-num">${num}</span>`;
        if (bool) return `<span class="tok-bool">${bool}</span>`;
        return m;
      });
  }

  function toCurl(full, target) {
    const parts = [`curl -X ${full.method}`];
    const url = (target || captureUrl(state())) + full.path + (full.query ? `?${full.query}` : "");
    for (const [k, v] of full.headers) {
      if (["content-length", "host", "connection"].includes(k.toLowerCase())) continue;
      parts.push(`-H '${String(k)}: ${String(v).replace(/'/g, "'\\''")}'`);
    }
    if (full.body_text) parts.push(`--data-raw '${full.body_text.replace(/'/g, "'\\''")}'`);
    parts.push(`'${url}'`);
    return parts.join(" \\\n  ");
  }

  async function loadFull(id) {
    if (fullCache.has(id)) return fullCache.get(id);
    const full = await api(`/api/request?id=${encodeURIComponent(id)}`);
    if (full && full.id) fullCache.set(id, full);
    return full;
  }

  function detailHtml(full, s) {
    const query = full.query
      ? `<div class="detail-section"><p class="detail-label">Query</p><table class="kv-table">${
          full.query.split("&").map((p) => { const eq = p.indexOf("="); const k = eq < 0 ? p : p.slice(0, eq); const v = eq < 0 ? "" : p.slice(eq + 1); return `<tr><td>${escapeHtml(decodeURIComponent(k))}</td><td>${escapeHtml(decodeURIComponent(v))}</td></tr>`; }).join("")
        }</table></div>`
      : "";
    const headers = `<div class="detail-section"><p class="detail-label">Headers</p><table class="kv-table">${
      full.headers.map(([k, v]) => `<tr><td>${escapeHtml(k)}</td><td>${escapeHtml(v)}</td></tr>`).join("")
    }</table></div>`;
    const abActive = s.diffa === full.id ? " (A)" : s.diffb === full.id ? " (B)" : "";
    return `
      <div class="req-detail">
        ${query}
        ${headers}
        <div class="detail-section"><p class="detail-label">Body · ${escapeHtml(formatBytes(full.body_len))}</p>${bodyHtml(full)}</div>
        <div class="detail-actions">
          <button class="button small" type="button" data-curl="${escapeHtml(full.id)}">Copy as curl</button>
          <button class="button small" type="button" data-replay="${escapeHtml(full.id)}">Replay…</button>
          <button class="button small" type="button" data-ab="${escapeHtml(full.id)}">Compare A/B${abActive}</button>
          <span class="detail-meta" style="color:var(--faint);font-size:10px">seq ${full.seq} · ${escapeHtml(full.remote_addr)} · ${escapeHtml(full.http_version)}</span>
        </div>
        <div class="replay-panel" data-replay-panel>
          <div class="replay-grid">
            <label>Target URL<input type="text" data-replay-url spellcheck="false" value="${escapeHtml(state().target || descriptor.public_url || captureUrl(s))}" /></label>
            <label>Method<input type="text" data-replay-method value="${escapeHtml(full.method)}" /></label>
            <label>Body<textarea data-replay-body spellcheck="false">${escapeHtml(full.body_text || "")}</textarea></label>
          </div>
          <div class="detail-actions"><button class="button small query-submit" type="button" data-replay-send="${escapeHtml(full.id)}">Send replay</button></div>
          <div class="replay-result" data-replay-result></div>
        </div>
      </div>`;
  }

  function renderRequests(data, s) {
    lastSeq = Math.max(lastSeq, Number(data.next_seq) || 0);
    const rows = data.rows || [];
    resultSummary.textContent = `${(data.matching_count || 0).toLocaleString()} matching · ${(data.count || 0).toLocaleString()} captured`;
    histSkel.hidden = true;

    if (!rows.length) {
      pager.hidden = true;
      results.innerHTML = emptyStateHtml(s, data.count);
      return;
    }
    const page = Math.max(0, parseInt(s.page, 10) || 0);
    const start = page * PAGE_LIMIT;
    const pageRows = rows.slice().reverse().slice(start, start + PAGE_LIMIT);
    pager.hidden = rows.length <= PAGE_LIMIT;
    prevPage.disabled = page <= 0;
    nextPage.disabled = start + PAGE_LIMIT >= rows.length;
    pagePosition.textContent = `${start + 1}–${Math.min(start + PAGE_LIMIT, rows.length)} of ${rows.length.toLocaleString()}`;

    results.innerHTML = `<div class="req-list">${pageRows.map((r) => {
      const bucket = methodBucket(r.method);
      const expanded = s.sel === r.id;
      return `<article class="req-row ${expanded ? "expanded" : ""}" data-row data-id="${escapeHtml(r.id)}" style="--method-color:${methodColor(bucket)}">
        <span class="req-cell es-expand-mark">${expanded ? "−" : "+"}</span>
        <time class="req-cell req-time">${escapeHtml(formatTime(r.ts))}</time>
        <span class="req-cell"><span class="method-badge">${escapeHtml(r.method)}</span></span>
        <span class="req-cell req-path" title="${escapeHtml(r.path + (r.query ? "?" + r.query : ""))}">${escapeHtml(r.path)}${r.query ? escapeHtml("?" + r.query) : ""}</span>
        <span class="req-cell req-size">${escapeHtml(formatBytes(r.body_len))}</span>
      </article>`;
    }).join("")}</div>`;

    if (s.sel) {
      const row = results.querySelector(`[data-id="${cssEscape(s.sel)}"]`);
      if (row) hydrateDetail(row, s.sel);
    }
  }

  function cssEscape(value) {
    return String(value).replace(/[^a-zA-Z0-9_-]/g, (c) => "\\" + c);
  }

  function emptyStateHtml(s, count) {
    if (count) {
      return `<div class="status"><strong>No requests match the filters</strong><span>Adjust the query, method, or time range.</span></div>`;
    }
    const url = captureUrl(s);
    return `<div class="status"><div class="onboard">
      <strong>Waiting for the first request</strong>
      <span>Point a webhook or client at your capture URL:</span>
      <code>${escapeHtml(url)}</code>
      <button class="button" id="onboard-copy" type="button">Copy capture URL</button>
      <span style="color:var(--faint)">Try it now:</span>
      <code>curl -X POST ${escapeHtml(url)}${descriptor.path ? "" : "/stripe"} -d '{"hello":1}'</code>
      <span class="listener-note">Local only — start a cloudflared tunnel (left) to receive from the internet.</span>
    </div></div>`;
  }

  async function hydrateDetail(row, id) {
    const s = state();
    const existing = row.querySelector(".req-detail");
    if (existing) return;
    const placeholder = document.createElement("div");
    placeholder.className = "req-detail";
    placeholder.innerHTML = `<span style="color:var(--muted)">Loading…</span>`;
    row.appendChild(placeholder);
    try {
      const full = await loadFull(id);
      if (!full || !full.id) { placeholder.innerHTML = `<span class="status error">Request no longer in buffer.</span>`; return; }
      placeholder.outerHTML = detailHtml(full, s);
    } catch (err) {
      placeholder.innerHTML = `<span class="status error">${escapeHtml(String(err.message || err))}</span>`;
    }
  }

  function lineDiff(a, b) {
    const al = a.split("\n"); const bl = b.split("\n");
    const bset = new Set(bl); const aset = new Set(al);
    const left = al.map((line) => `<span class="diff-line ${bset.has(line) ? "diff-same" : "diff-del"}">${escapeHtml(line)}</span>`).join("");
    const right = bl.map((line) => `<span class="diff-line ${aset.has(line) ? "diff-same" : "diff-add"}">${escapeHtml(line)}</span>`).join("");
    return { left, right };
  }

  async function renderDiff(s) {
    histSkel.hidden = true;
    pager.hidden = true;
    if (!s.diffa || !s.diffb) {
      results.innerHTML = `<div class="status"><strong>Pick two requests to compare</strong><span>Open a request, choose <em>Compare A/B</em> for each side, then return here.</span></div>`;
      resultSummary.textContent = "Diff";
      return;
    }
    resultSummary.textContent = "Diff A ↔ B";
    try {
      const [a, b] = await Promise.all([loadFull(s.diffa), loadFull(s.diffb)]);
      if (!a || !a.id || !b || !b.id) {
        results.innerHTML = `<div class="status error">One of the selected requests is no longer in the buffer.</div>`;
        return;
      }
      const headerText = (r) => r.headers.map(([k, v]) => `${k}: ${v}`).sort().join("\n");
      const hd = lineDiff(headerText(a), headerText(b));
      const bd = lineDiff(a.body_text || "", b.body_text || "");
      results.innerHTML = `<div class="diff-wrap">
        <div class="detail-label">Headers</div>
        <div class="diff-cols"><div class="diff-col"><h3>A · ${escapeHtml(a.method)} ${escapeHtml(a.path)}</h3>${hd.left}</div><div class="diff-col"><h3>B · ${escapeHtml(b.method)} ${escapeHtml(b.path)}</h3>${hd.right}</div></div>
        <div class="detail-label" style="margin-top:14px">Body</div>
        <div class="diff-cols"><div class="diff-col">${bd.left || '<span class="diff-line diff-same">(empty)</span>'}</div><div class="diff-col">${bd.right || '<span class="diff-line diff-same">(empty)</span>'}</div></div>
      </div>`;
    } catch (err) {
      results.innerHTML = `<div class="status error">${escapeHtml(String(err.message || err))}</div>`;
    }
  }

  function setError(message, detail) {
    histSkel.hidden = true;
    pager.hidden = true;
    resultSummary.textContent = "Unavailable";
    results.innerHTML = `<div class="status error"><strong>${escapeHtml(message)}</strong>${detail ? `<span>${escapeHtml(detail)}</span>` : ""}</div>`;
  }

  async function load() {
    const s = state();
    renderState(s);
    renderEndpoints(s);
    const request = ++generation;

    const d = await ensureDaemon();
    if (!d || d.error) {
      const home = "~/.cache/fused-render-webhook/daemon.log";
      setError("Capture daemon failed to start", (d && d.error ? d.error + " · " : "") + `See ${home}`);
      return;
    }
    if (request !== generation) return;

    if (s.view === "diff") { renderDiff(s); syncLive(s); return; }

    try {
      const ping = await api("/ping").catch(() => null);
      renderListener(ping, s);
      const [data, facetHist, hist] = await Promise.all([
        api(`/api/requests?${filterParams(s, true).toString()}&limit=1000&tail=1`),
        api(`/api/histogram?${filterParams(s, false).toString()}&bins=80`),
        api(`/api/histogram?${filterParams(s, true).toString()}&bins=80`)
      ]);
      if (request !== generation) return;
      const counts = {};
      METHODS.forEach((m) => { counts[m] = 0; });
      (facetHist.bins || []).forEach((bin) => {
        for (const m in bin.methods) counts[m] = (counts[m] || 0) + bin.methods[m];
      });
      renderMethods(s, counts);
      const bins = (hist.bins || []).map((b) => ({ start: b.start, end: b.end, counts: b.methods }));
      const min = bins.length ? bins[0].start : 0;
      const max = bins.length ? bins[bins.length - 1].end : 1;
      chart.setData({ bins, min, max });
      chart.setSelection(Number(s.from), Number(s.to));
      histSummary.textContent = `${(hist.matching_count || 0).toLocaleString()} events`;
      renderRequests(data, s);
      syncLive(s);
    } catch (err) {
      if (request !== generation) return;
      setError("Could not reach the capture daemon", String(err.message || err));
    }
  }

  async function pollLive() {
    const s = state();
    if (s.live === "0" || s.view === "diff" || liveBusy || !daemon) return;
    liveBusy = true;
    try {
      const probe = await api(`/api/requests?since=${lastSeq}&limit=1&tail=1`);
      if (probe && Number(probe.next_seq) > lastSeq) load();
    } catch (_) {
    } finally {
      liveBusy = false;
    }
  }

  function syncLive(s) {
    if (liveTimer) clearInterval(liveTimer);
    liveTimer = null;
    if (s.live !== "0" && s.view !== "diff") liveTimer = setInterval(pollLive, 1000);
  }

  // ---------------- events ----------------
  queryForm.addEventListener("submit", (e) => { e.preventDefault(); ES.setParams(fused, { q: queryInput.value.trim(), page: "0" }); });
  clearRange.addEventListener("click", () => ES.setParams(fused, { from: "", to: "", page: "0" }));
  focusToggle.addEventListener("click", () => ES.setParams(fused, { focus: state().focus === "1" ? "0" : "1" }));
  themeToggle.addEventListener("click", () => ES.setParams(fused, { theme: state().theme === "light" ? "dark" : "light" }));
  liveToggle.addEventListener("click", () => ES.setParams(fused, { live: state().live === "0" ? "1" : "0" }));
  requestsTab.addEventListener("click", () => ES.setParams(fused, { view: "requests" }));
  diffTab.addEventListener("click", () => ES.setParams(fused, { view: "diff" }));

  clearAll.addEventListener("click", async () => {
    if (!daemon) return;
    await api("/api/clear", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }).catch(() => null);
    fullCache.clear();
    lastSeq = 0;
    load();
  });

  copyUrlBtn.addEventListener("click", () => copyText(captureUrl(state()), copyUrlBtn));
  results.addEventListener("click", (e) => {
    const onboard = e.target.closest("#onboard-copy");
    if (onboard) copyText(captureUrl(state()), onboard);
  });

  function copyText(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
      const old = btn.textContent;
      btn.textContent = "Copied";
      setTimeout(() => { btn.textContent = old; }, 1200);
    }).catch(() => {});
  }

  publicUrlInput.addEventListener("change", () => {
    descriptor.public_url = publicUrlInput.value.trim();
    ES.setParams(fused, { target: publicUrlInput.value.trim() });
  });

  tunnelBtn.addEventListener("click", async () => {
    if (!daemon) return;
    tunnelBtn.disabled = true;
    tunnelState.textContent = "starting…";
    try {
      const r = await api("/api/tunnel/start", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
      if (r.available === false) {
        tunnelState.textContent = "";
        setError("cloudflared not found", r.hint);
      } else if (r.public_url) {
        descriptor.public_url = r.public_url;
        tunnelState.textContent = "tunnel up";
        publicUrlInput.value = r.public_url;
      } else {
        tunnelState.textContent = "starting…";
      }
    } catch (err) {
      tunnelState.textContent = "";
    } finally {
      tunnelBtn.disabled = false;
    }
  });

  endpointList.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-path]");
    if (btn) ES.setParams(fused, { path_prefix: btn.dataset.path, page: "0" });
  });

  methodList.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-method]");
    if (!btn) return;
    const s = state();
    const active = new Set(activeMethods(s).length ? activeMethods(s) : METHODS);
    const m = btn.dataset.method;
    if (active.has(m)) active.delete(m); else active.add(m);
    const next = METHODS.filter((x) => active.has(x));
    ES.setParams(fused, { methods: next.length === METHODS.length ? "" : next.join(","), page: "0" });
  });

  prevPage.addEventListener("click", () => ES.setParams(fused, { page: String(Math.max(0, (parseInt(state().page, 10) || 0) - 1)) }));
  nextPage.addEventListener("click", () => ES.setParams(fused, { page: String((parseInt(state().page, 10) || 0) + 1) }));

  ES.expandable(results, {
    row: ".req-row", mark: ".es-expand-mark", ignore: ".req-detail",
    onToggle: (row, open) => {
      ES.setParams(fused, { sel: open ? row.dataset.id : "" });
      if (open) hydrateDetail(row, row.dataset.id);
    }
  });

  results.addEventListener("click", async (e) => {
    const curlBtn = e.target.closest("[data-curl]");
    if (curlBtn) {
      e.stopPropagation();
      const full = await loadFull(curlBtn.dataset.curl);
      if (full && full.id) copyText(toCurl(full, state().target || descriptor.public_url), curlBtn);
      return;
    }
    const replayBtn = e.target.closest("[data-replay]");
    if (replayBtn) {
      e.stopPropagation();
      const panel = replayBtn.closest(".req-detail").querySelector("[data-replay-panel]");
      panel.classList.toggle("open");
      return;
    }
    const abBtn = e.target.closest("[data-ab]");
    if (abBtn) {
      e.stopPropagation();
      const s = state();
      const id = abBtn.dataset.ab;
      if (s.diffa === id) ES.setParams(fused, { diffa: "" });
      else if (s.diffb === id) ES.setParams(fused, { diffb: "" });
      else if (!s.diffa) ES.setParams(fused, { diffa: id });
      else ES.setParams(fused, { diffb: id });
      return;
    }
    const sendBtn = e.target.closest("[data-replay-send]");
    if (sendBtn) {
      e.stopPropagation();
      const detail = sendBtn.closest(".req-detail");
      const resultBox = detail.querySelector("[data-replay-result]");
      const url = detail.querySelector("[data-replay-url]").value.trim();
      const method = detail.querySelector("[data-replay-method]").value.trim();
      const body = detail.querySelector("[data-replay-body]").value;
      resultBox.innerHTML = `<span style="color:var(--muted)">Replaying…</span>`;
      sendBtn.disabled = true;
      try {
        const r = await api("/api/replay", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: sendBtn.dataset.replaySend, url, method, body })
        });
        if (r.error) {
          resultBox.innerHTML = `<span class="status error" style="min-height:0;padding:0">${escapeHtml(r.error)}</span>`;
        } else {
          resultBox.innerHTML = `<div class="replay-status" style="color:${r.status < 400 ? "var(--post)" : "var(--delete)"}">${r.status} · ${escapeHtml(String(r.duration_ms))} ms</div><pre class="body-pane">${colorizeJson(r.body || "")}</pre>`;
          fullCache.delete(sendBtn.dataset.replaySend);
        }
      } catch (err) {
        resultBox.innerHTML = `<span class="status error" style="min-height:0;padding:0">${escapeHtml(String(err.message || err))}</span>`;
      } finally {
        sendBtn.disabled = false;
      }
    }
  });

  function loadDescriptor() {
    const file = fused.params.get("_file") || "";
    const s = state();
    let opened = [];
    try { const p = JSON.parse(s.open || "[]"); if (Array.isArray(p)) opened = p; } catch (_) {}
    endpoints = [{ name: "All requests", path: "" }];
    if (descriptor.name || descriptor.path) {
      endpoints.push({ name: descriptor.name || (file.split(/[\\/]/).pop() || "endpoint"), path: descriptor.path || "" });
    }
  }

  ES.railToggle(document.querySelector(".app"), el("rail-toggle"), { autoCollapse: 900 });

  fused.params.onChange(() => { generation += 1; load(); });
  loadDescriptor();
  load();
</script>
</body>
</html>
