# The map template's environment (SPEC PY-16). Every .py in this folder shares
# the venv built from this file: `prepare.py` and `discover.py` (the page's two
# runPython entrypoints), `map_tools.py`/`map_doc.py` (the MCP tools, stdlib
# only), and what they reach (`geo_paths.py`, `blob_tokens.py`).
#
# The page draws everything in the browser — rasters by HTTP range read on the
# GPU, vectors through DuckDB-WASM, Zarr as a MapLibre custom layer, PMTiles by
# protocol — so there is no tile server, and this environment only does the
# work a browser cannot:
#
#   rasterio            prepare.py — striped / non-TIFF / refused-remote rasters
#                       re-encoded as a local COG (GDAL's COG driver), inspect
#   pyogrio/geopandas/  prepare.py — the GeoJSON fallback when DuckDB-WASM is
#   shapely/pyproj      unavailable (offline), inspect, and the GeoDataFrame a
#                       user's map script returns (written out as GeoParquet)
#   xarray/zarr/        prepare.py — NetCDF / HDF5 rewritten as a Zarr store the
#   h5netcdf/h5py/      browser layer streams; h5netcdf + scipy read what
#   scipy/cftime        netCDF4 would (NEVER add netCDF4: its bundled HDF5
#                       clashes with h5py's in one process on Windows)
#   numpy/pandas/       arrays and tables a script returns; GeoParquet writes
#   pyarrow
#
# `duckdb` and `requests` are here because a user's `.py` map target runs in
# THIS process (prepare.py imports it to get the object it returns), and those
# two are what such scripts overwhelmingly import; `requests` also fetches a
# remote NetCDF before conversion. Anything else a script needs is reported by
# name (prepare.main's ModuleNotFoundError message).
#
# Gone with the tile server: rio-tiler, matplotlib, rioxarray, fsspec, aiohttp,
# pillow — the browser renders, so nothing here tiles, colormaps or serves.
[project]
name = "fused-render-template-map"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "rasterio",
    "pyogrio",
    "geopandas",
    "shapely",
    "pyproj",
    "xarray",
    "zarr>=3.1",
    "h5netcdf",
    "h5py",
    "scipy",
    "cftime",
    "numpy",
    "pandas",
    "pyarrow",
    "duckdb>=1.1",
    "requests",
]

# Not a distribution — this folder is a set of scripts, not something to build
# and install. Without this uv would try to build the "project" itself and fail.
[tool.uv]
package = false
