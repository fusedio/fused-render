<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Recording</title>
<!-- The floating recording pill (src/recpill/recpill.ts): served at /recording-pill by the in-process server and hosted
     in a non-activating WKWebView panel by fused_render/recording_pill_panel.py (bridge:
     window.webkit.messageHandlers.recpill). A plain browser tab works too for development (?cid=<recording id>). -->
<style>
  :root {
    color-scheme: light dark;
    --pill-bg: #ffffff;
    --pill-fg: #1c1c1e;
    --pill-dim: rgba(28,28,30,.55);
    --pill-hover: rgba(0,0,0,.07);
    --bar: #1c1c1e;
    --stop: #ff3b30;
    --shadow: 0 6px 18px rgba(0,0,0,.22), 0 0 0 .5px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --pill-bg: #2c2c2e;
      --pill-fg: #f2f2f5;
      --pill-dim: rgba(242,242,245,.6);
      --pill-hover: rgba(255,255,255,.12);
      --bar: #f2f2f5;
      --shadow: 0 6px 18px rgba(0,0,0,.5), 0 0 0 .5px rgba(255,255,255,.14);
    }
  }
  html, body { margin: 0; padding: 0; background: transparent; width: 100%; height: 100%; overflow: hidden; }
  body {
    font: 11px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, sans-serif;
    color: var(--pill-fg); -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none; cursor: default;
  }
  body.dev { background: #d9dde3; }
  /* The window is 72x216; the pill is 56x200 inside an 8px margin that holds the shadow. */
  #pill {
    position: absolute; left: 8px; top: 8px; width: 56px; height: 200px; box-sizing: border-box;
    border-radius: 28px; background: var(--pill-bg); box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 10px 0;
  }
  #pill[hidden] { display: none; }
  #icon {
    width: 32px; height: 32px; flex: none; border-radius: 8px; overflow: hidden; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #icon img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
  #icon.home img { width: var(--home-scale, 113.7%); height: var(--home-scale, 113.7%); max-width: none; object-fit: cover; }
  #meter { height: 34px; display: flex; align-items: center; justify-content: center; gap: 3px; }
  #meter i {
    display: block; width: 3px; border-radius: 2px; background: var(--bar);
    height: 4px; transition: height 90ms linear;
  }
  #pill.paused #meter i { opacity: .35; }
  #time { font-size: 10px; color: var(--pill-dim); font-variant-numeric: tabular-nums; }
  button {
    appearance: none; border: 0; padding: 0; margin: 0; background: none; cursor: pointer; color: var(--pill-fg);
    width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  }
  button:hover { background: var(--pill-hover); }
  button svg { width: 16px; height: 16px; display: block; }
  #pause[hidden] { display: none; }
  #pill:not(.paused) .play, #pill.paused .pausebars { display: none; }
  #stop { background: var(--stop); }
  #stop:hover { background: #e0352b; }
  #stop i { display: block; width: 12px; height: 12px; border-radius: 3px; background: #fff; }
  @media (prefers-reduced-motion: reduce) { #meter i { transition: none; } }
</style>
</head>
<body>
<div id="pill" hidden>
  <div id="icon" title="Open the app"></div>
  <div id="meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <div id="time">0:00</div>
  <button id="pause" type="button" title="Pause">
    <svg class="pausebars" viewBox="0 0 16 16" fill="currentColor"><rect x="3.5" y="2.5" width="3" height="11" rx="1"/><rect x="9.5" y="2.5" width="3" height="11" rx="1"/></svg>
    <svg class="play" viewBox="0 0 16 16" fill="currentColor"><path d="M4.5 2.7v10.6a.7.7 0 0 0 1.06.6l8.6-5.3a.7.7 0 0 0 0-1.2L5.56 2.1a.7.7 0 0 0-1.06.6z"/></svg>
  </button>
  <button id="stop" type="button" title="Stop and save"><i></i></button>
</div>
<script type="module" src="/src/recpill/recpill.ts"></script>
</body>
</html>
