<!DOCTYPE html>
<html data-fused-theme="shell">
<head>
<meta charset="utf-8">
<title>Claude</title>
<style>
  /* Chat pane styled like a modern assistant app (claude.ai / v0 / ChatGPT):
     sans-serif UI, a centered message column, right-aligned user bubbles,
     full-width assistant prose behind a spark avatar, and a floating rounded
     composer. Backend and behavior are the claude template's 1:1 — only the
     skin differs. Every colour is a token; the light block repaints all of
     them (SPEC §30). */
  :root {
    color-scheme: dark;
    --bg: #191a1e;
    --panel: #1e2025;
    --surface: #26282f;          /* composer, cards */
    --surface-2: #2d3038;        /* hover, user bubble */
    --bubble-user: #2f3239;
    --fg: #ececf1;
    --fg-strong: #ffffff;
    --dim: #9a9fa9;
    --faint: #6b7079;
    --border: #34363e;
    --border-strong: #4a4d57;
    --accent: #d97757;
    --on-accent: #1a1a1a;
    --error: #f26d6d;
    --ok: #6cc07a;
    --code-bg: #2a2c33;
    --code-fg: #e8c07d;
    --pre-bg: #141519;
    --pre-fg: #d4d4d8;
    --link: #7aa8ff;
    --shadow: rgba(0, 0, 0, .4);
    --scrollbar: #3a3d45;
    --handle-hover: #4a4d57;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff;
    --panel: #fafafa;
    --surface: #f4f4f6;
    --surface-2: #ebebef;
    --bubble-user: #f0f0f3;
    --fg: #1f2023;
    --fg-strong: #000000;
    --dim: #61656c;
    --faint: #9a9ea6;
    --border: #e3e4e8;
    --border-strong: #c9cbd2;
    --accent: #b8542f;
    --on-accent: #ffffff;
    --error: #c62828;
    --ok: #2e7d32;
    --code-bg: #f0f1f3;
    --code-fg: #8a5a12;
    --pre-bg: #f7f8f9;
    --pre-fg: #33363c;
    --link: #1c5fb8;
    --shadow: rgba(0, 0, 0, .10);
    --scrollbar: #cdd0d6;
    --handle-hover: #a8adb6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.65;
    display: flex;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  code, pre, .mono { font-family: "SF Mono", Menlo, Monaco, "Cascadia Mono", monospace; }

  /* ── split layout ─────────────────────────────── */
  #left { position: relative; min-width: 200px; display: flex; flex-direction: column; }
  /* The iframe's box, and the offset parent for everything that floats over the
     app — the annotate button, the pins, the highlight, the composer. `min-height:
     0` because a flex child's default `min-height: auto` would let the iframe
     refuse to shrink. */
  #leftview { position: relative; flex: 1; min-height: 0; }
  #leftview iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: var(--bg);
  }
  #divider {
    flex-shrink: 0;
    width: 4px;
    cursor: col-resize;
    background: var(--border);
    transition: background .15s;
  }

  /* ── annotation controls: a layout row at the top of the chat pane ─────── */
  /* One labelled left-right sliding switch — annotate mode (#annbtn) — in a
     real flex ROW above the chat content, shown in both views. A row, not an
     overlay: the floating versions (corner icon, then margin pills) kept
     landing on top of whatever the chat pane drew underneath. Pin visibility
     follows the mode (annotating shows the comment pins; leaving the mode
     hides them), so a second switch has nothing left to govern. Deliberately
     quiet: plain label text and a small track that tints accent when armed —
     no filled pill, no border. */
  /* `min-width: 0` because this row has to survive a 220px host (the listing
     preview pane's floor, FS-12) and a flex item's default `min-width: auto`
     refuses to shrink below its content — without it the row overflows a narrow
     pane instead of letting its one elastic label give. Which label gives is
     decided below: the view toggle never does, the annotate switch does. */
  /* ONE rule for BOTH strips, and that is the point: #leftbar (the left pane's
     own bar, further down) is the same row on the other side of the divider,
     and the two must agree on height or the pane's bottom border runs a few
     pixels off the listing's and the row reads as broken. They were two
     byte-identical blocks with a comment asking the reader to keep them in
     step; a shared selector cannot drift. Anything that is NOT shared —
     #leftbar's `[hidden]` and its removal in the narrow layout — is declared
     separately and later, so it still wins. */
  #anntools,
  #leftbar {
    flex-shrink: 0;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
  }
  #annbtn {
    height: 26px;
    padding: 0;
    /* The row's ONE auto margin, and the strip's right-hand anchor: everything
       before it (#back) sits left, everything after it (the picker, the view
       toggle) rides right with it. It was #viewbtn's, back when the switch led
       the row — see #leftbar #leftmode for why a row gets exactly one. */
    margin-left: auto;
    /* The elastic one. Its label is a mode name, and "Annot…" beside a visible
       accent track still reads — where half of "Back to chat" would not tell you
       it is the way back. See #viewbtn's flex-shrink. */
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 7px;
    font: inherit;
    font-size: 12px;
    line-height: 1;
    white-space: nowrap;
    border: 0;
    background: transparent;
    /* `--dim` is THIS file's muted ink (see the palettes at the top). It read
       `var(--muted, var(--fg))` for a long time, and `--muted` is defined nowhere
       here and is not injected by the shell theme — the runtime writes
       `data-theme`, not tokens — so the fallback always won and the switch drew at
       full foreground in both states, making `:hover { color: var(--fg) }` below a
       no-op. Silent, because an undefined token is inert rather than an error.
       tests/test_theme.py now fails on any var() this file does not define. */
    color: var(--dim);
    cursor: pointer;
    transition: color .12s;
  }
  #annbtn:hover { color: var(--fg); }
  #annbtn.on { color: var(--fg); }
  /* Where the row's shrinking actually happens — on the TEXT, not on the track,
     which stays 28px (a knob that slid off its rail would stop being a switch). */
  #annbtn .lbl { overflow: hidden; text-overflow: ellipsis; }
  /* The slider: knob left = off, knob right = on. Off is drawn in the quiet
     currentColor; the on-state fills the track with the accent — the only
     colour the control ever shows, and only while armed. */
  #annbtn .track {
    position: relative;
    width: 28px;
    height: 16px;
    border-radius: 999px;
    border: 1px solid currentColor;
    flex-shrink: 0;
    transition: background .15s, border-color .15s;
  }
  #annbtn .knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: currentColor;
    transition: left .15s, background .15s;
  }
  #annbtn.on .track { background: var(--accent); border-color: var(--accent); }
  #annbtn.on .knob { left: 14px; background: var(--on-accent); }

  /* ── the left pane's own top bar ────────────────────────────────────────
     Home of the view picker in the SPLIT layout: the control that chooses what
     the left pane frames sits ON the left pane, over the thing it changes,
     rather than across the divider in the chat pane's strip. It used to live in
     #anntools, where it was a control for one column rendered on the other one.

     A real layout ROW, for the same reason #anntools is one: an overlay would
     land on top of whatever the framed app draws under it, and the app owns
     every pixel of its own viewport. Its box IS #anntools' box — they share the
     one rule up there, so the two strips cannot drift out of alignment across
     the divider.

     `[hidden]` needs a rule of its own because the shared `display: flex`
     outranks the UA's `[hidden] { display: none }`. TWO independent things can
     hide this bar, and they are separate on purpose: JS sets `hidden` when
     there is nothing to pick (buildLeftPicker / placeLeftPicker — a content
     fact), and the 800px media block drops it outright (a layout fact — the
     narrow layout has one column and one shared strip, so the picker goes back
     to #anntools). Neither can disagree with the other, because they answer
     different questions. Both are declared AFTER the shared rule, so both
     win. */
  #leftbar[hidden] { display: none; }

  /* WHICH view the left pane frames (`leftmode`): a trigger and its own listbox
     popup, quiet to the same degree as #annbtn — borderless, transparent, 12px,
     the muted colour until hovered. Loud chrome here would read as the pane's
     TITLE rather than a switch, and the pane's title is the file name in the
     topbar. Hidden until there is more than one view to choose between; see
     buildLeftPicker(). It is ONE element that MOVES between the two hosts above
     (placeLeftPicker), not one per layout: a second copy would be a second
     value, a second listener and a second thing to keep in step with
     `leftmode`.

     It WAS a native <select>, chosen for the platform popup, keyboard handling
     and accessible name it brings for free. What overturned that is the ICON: a
     `<option>` renders text and nothing else in every engine, so a mode list
     that shows what the shell's own mode menu shows — the template's icon.svg
     beside its name — cannot be built out of one. The replacement is the same
     shape the `reader` template's voice menu already uses in this codebase
     (a button carrying `aria-haspopup="listbox"` over a `role="listbox"` div),
     and its rows are real <button>s, so focus, Enter and Space stay the
     platform's job and only the arrows and Escape are ours. */
  #leftmode { position: relative; flex-shrink: 0; }
  /* THE RIGHT-HAND END of the pane's own bar. The bar exists to carry this one
     control, and a lone control hard against the left edge reads as a label for
     the pane rather than as a switch on it — the same reason #annbtn parks
     itself at the end of the strip across the divider. Scoped to #leftbar: in
     the narrow layout the picker shares #anntools with the annotate switch and
     the view toggle, where #annbtn already owns the auto margin and a second
     one would split the free space between them and float the picker into the
     middle of the row. */
  #leftbar #leftmode { margin-left: auto; }
  #leftmodebtn {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 26px;
    max-width: 160px;
    padding: 0 6px;
    font: inherit;
    font-size: 12px;
    line-height: 1;
    border: 0;
    border-radius: 6px;
    background: transparent;
    /* Same muted ink as #annbtn beside it — and copied from it AFTER the
       `var(--muted, …)` bug had been sitting in that rule unnoticed, which is how a
       dead style spreads. */
    color: var(--dim);
    cursor: pointer;
    transition: color .12s, background .12s;
  }
  /* Open is a state the trigger has to WEAR: with the popup drawn below it, a
     trigger that goes back to looking untouched reads as a menu belonging to
     nothing. */
  #leftmodebtn:hover,
  #leftmodebtn[aria-expanded="true"] { color: var(--fg); background: var(--surface); }
  #leftmodebtn .mode-lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #leftmodebtn .mode-chev { font-size: 9px; flex-shrink: 0; }
  /* The template's own icon.svg, drawn the way the shell draws it (mode-icon-mask
     in preview.css): a MASK filled with currentColor, so one flat glyph inherits
     the row's ink and both themes instead of shipping two colourways. */
  .mode-ic {
    display: inline-block;
    flex-shrink: 0;
    width: 14px;
    height: 14px;
    background-color: currentColor;
    -webkit-mask-position: center; mask-position: center;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-size: contain; mask-size: contain;
  }
  /* A template folder with no icon.svg (and the `_render` sentinel, which is not
     a folder at all) gets the shell's own fallback: a lettered box, so the
     column of icons never goes ragged. */
  .mode-ic.letter {
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: 1px solid var(--border-strong);
    border-radius: 3px;
    font-size: 9px;
    font-weight: 600;
  }
  #leftmodepop {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: 30;
    min-width: 172px;
    padding: 4px;
    background: var(--panel);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    box-shadow: 0 6px 24px var(--shadow);
  }
  /* `display: flex`-shaped children do not save it: the popup itself is the box
     the attribute has to hide, and `position: absolute` outranks the UA's
     `[hidden]` rule the same way #leftbar's `display: flex` does. */
  #leftmodepop[hidden] { display: none; }
  .mode-opt {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 7px 9px;
    font: inherit;
    font-size: 12px;
    line-height: 1;
    border: 0;
    border-radius: 7px;
    background: none;
    color: var(--fg);
    cursor: pointer;
    text-align: left;
  }
  .mode-opt:hover, .mode-opt:focus-visible { background: var(--surface-2); }
  .mode-opt[aria-selected="true"] { color: var(--accent); }

  /* More options (⋮) beside the annotate switch: trigger drawn as quiet as
     #annbtn and #leftmodebtn (borderless, muted ink), popup drawn exactly like
     #leftmodepop — same box, same shadow — because to the user they are the
     same kind of thing: a small menu hanging off the strip. */
  #kebab { position: relative; flex-shrink: 0; }
  #kebabbtn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 26px;
    padding: 0;
    font: inherit;
    font-size: 14px;
    line-height: 1;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--dim);
    cursor: pointer;
    transition: color .12s, background .12s;
  }
  #kebabbtn:hover, #kebabbtn[aria-expanded="true"] { color: var(--fg); background: var(--surface); }
  #kebabpop {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: 30;
    min-width: 196px;
    padding: 4px;
    background: var(--panel);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    box-shadow: 0 6px 24px var(--shadow);
  }
  /* Same story as #leftmodepop: `position: absolute` outranks the UA's
     `[hidden]` rule, so the hide needs a rule of its own. */
  #kebabpop[hidden] { display: none; }
  .kebab-opt {
    display: block;
    width: 100%;
    padding: 7px 9px;
    font: inherit;
    font-size: 12px;
    line-height: 1;
    white-space: nowrap;
    border: 0;
    border-radius: 7px;
    background: none;
    color: var(--fg);
    cursor: pointer;
    text-align: left;
  }
  .kebab-opt:hover, .kebab-opt:focus-visible { background: var(--surface-2); }
  .kebab-opt[disabled] { color: var(--dim); cursor: default; }

  /* "Annotate preview" ⇄ "Back to chat" toggle. Exists for the NARROW layout only
     (see the 800px block at the end of this stylesheet): while both columns are on
     screen there is nothing to toggle, so it is display:none here and the media
     query is the only thing that reveals it. Drawn like #back (bordered, quiet)
     rather than like #annbtn: it navigates between views, it is not a mode.
     `flex-shrink: 0` and the tighter 8px padding are what let the longer labels
     live in a 220px row: this is the control that must never be half-readable,
     because a truncated "Back to cha…" is the only way out of the preview. */
  #viewbtn {
    display: none;
    flex-shrink: 0;
    height: 26px;
    padding: 0 8px;
    font: inherit;
    font-size: 12px;
    line-height: 1;
    white-space: nowrap;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--dim);
    cursor: pointer;
    transition: color .12s, border-color .12s, background .12s;
  }
  #viewbtn:hover { color: var(--fg); border-color: var(--border-strong); background: var(--surface); }
  #annpins { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
  .annpin {
    position: absolute;
    transform: translate(-50%, -50%);
    min-width: 22px;
    height: 22px;
    padding: 0 4px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--on-accent);
    border: 1.5px solid var(--panel);
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    cursor: default;
    user-select: none;
    box-shadow: 0 1px 4px var(--shadow);
  }
  .annpin.sent { opacity: .55; }
  #annhl {
    position: absolute;
    z-index: 1;
    display: none;
    pointer-events: none;
    border: 1.5px solid var(--accent);
    border-radius: 4px;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
  }
  #annpop {
    position: absolute;
    z-index: 5;
    display: none;
    width: 280px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 6px 24px var(--shadow);
  }
  #annpop textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--fg);
    font: inherit;
    font-size: 13px;
    padding: 7px 9px;
    resize: none;
    outline: none;
  }
  #annpop .hint { color: var(--faint); font-size: 11px; margin-top: 5px; display: flex; align-items: center; }
  #anndel {
    margin-left: 8px;
    border: 0;
    background: transparent;
    color: var(--error);
    font: inherit;
    font-size: 11px;
    cursor: pointer;
    padding: 0 2px;
  }
  .annpin:not(.sent) { cursor: pointer; }

  /* pending-annotation chips above the composer */
  .annchips { display: flex; flex-wrap: wrap; gap: 6px; }
  .annchips:not(:empty) { padding: 0 0 8px; }
  .annchip {
    display: flex;
    align-items: center;
    gap: 6px;
    max-width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 6px 3px 10px;
    font-size: 12px;
    color: var(--fg);
  }
  .annchip .txt {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 240px;
  }
  .annchip .pinlbl { color: var(--accent); font-weight: 600; flex-shrink: 0; }
  .annchip button {
    border: 0;
    background: transparent;
    color: var(--dim);
    cursor: pointer;
    font-size: 12px;
    padding: 0 3px;
    border-radius: 50%;
  }
  .annchip button:hover { color: var(--fg); }
  #divider:hover, body.dragging #divider { background: var(--handle-hover); }
  body.dragging #leftview iframe { pointer-events: none; }
  #msg { margin: auto; color: var(--dim); text-align: center; padding: 24px; }

  /* ── chat pane ─────────────────────────────── */
  #chat {
    flex: 1;
    min-width: 340px;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    overflow: hidden;
  }
  #chat.home #topbar, #chat.home #logwrap, #chat.home #composer-chat { display: none; }
  /* #back rides the #anntools strip (which BOTH views keep), so its home-view
     hiding is its own rule — the landing page IS the chat list, and a "back to
     where you already are" is a control for nothing. */
  #chat.home #back { display: none; }
  #chat:not(.home) #home { display: none; }

  /* top bar */
  #topbar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
  }
  #topbar .spark { color: var(--accent); font-size: 15px; }
  #topbar .tb-title {
    font-weight: 600;
    font-size: 13px;
    color: var(--fg-strong);
    white-space: nowrap;
  }
  #topbar .tb-file {
    color: var(--faint);
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  #session {
    color: var(--faint);
    font-size: 11px;
    letter-spacing: .3px;
  }
  #back {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--dim);
    font: inherit;
    font-size: 12px;
    padding: 4px 10px;
    cursor: pointer;
    flex-shrink: 0;
    transition: color .12s, border-color .12s, background .12s;
  }
  #back:hover { color: var(--fg); border-color: var(--border-strong); background: var(--surface); }

  /* message log */
  #logwrap { flex: 1; overflow-y: auto; }
  #logwrap::-webkit-scrollbar { width: 8px; }
  #logwrap::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }
  #log {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 20px 12px;
  }
  /* queued messages live in their own container AFTER #log, so they always
     render below every turn — including turns appended while they wait. */
  #queue { max-width: 720px; margin: 0 auto; padding: 0 20px 12px; }
  .turn { margin: 0 0 20px; animation: rise .18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .turn { animation: none; } }

  .user { display: flex; flex-direction: column; align-items: flex-end; }
  /* annotations a sent message carried — subtle receipt under the bubble */
  .annsum {
    max-width: 82%;
    margin-top: 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .annsum .annsum-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 11.5px;
    color: var(--dim);
    justify-content: flex-end;
  }
  .annsum .annsum-lbl { color: var(--accent); font-weight: 600; flex-shrink: 0; }
  .annsum .annsum-el { color: var(--faint); flex-shrink: 0; font-size: 11px; }
  /* The crop that rode with this note. Small on purpose — it is a receipt, not a
     viewer; hovering shows the path the agent was given. */
  .annsum .annsum-shot {
    flex-shrink: 0;
    height: 28px;
    max-width: 64px;
    object-fit: cover;
    border: 1px solid var(--border);
    border-radius: 3px;
    align-self: center;
  }
  .annsum .annsum-txt {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  /* The push channel's receipt: this message carried a description of the app
     the user is looking at, and they should be able to see that it did. */
  .user .attach { margin-top: 4px; font-size: 11px; color: var(--faint); }
  .user .bubble {
    background: var(--bubble-user);
    border-radius: 18px 18px 4px 18px;
    padding: 9px 14px;
    max-width: 82%;
    white-space: pre-wrap;
    word-break: break-word;
  }
  /* a message typed while a run is live, parked until the turn ends. Its own
     class tree (`qbubble`, not `.user .bubble`): the re-attach probe and the
     receipt code both select `.turn.user` / `.user .bubble` and must never
     match a message that has not been sent yet. */
  .queued { display: flex; flex-direction: column; align-items: flex-end; }
  .queued .qbubble {
    background: transparent;
    border: 1px dashed var(--border-strong);
    color: var(--dim);
    border-radius: 18px 18px 4px 18px;
    padding: 9px 14px;
    max-width: 82%;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .queued .qmeta {
    display: flex; gap: 6px; align-items: center;
    font-size: 11px; color: var(--faint); margin-top: 3px;
  }
  .queued .qx {
    background: none; border: none; padding: 0; font: inherit;
    color: var(--faint); cursor: pointer;
  }
  .queued .qx:hover { color: var(--fg); text-decoration: underline; }
  .assistant { display: flex; gap: 10px; }
  .assistant .dot {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--accent);
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 2px;
  }
  .assistant .body {
    min-width: 0;
    white-space: pre-wrap;
    word-break: break-word;
    padding-top: 2px;
  }
  .error {
    color: var(--error);
    background: color-mix(in srgb, var(--error) 8%, transparent);
    border: 1px solid color-mix(in srgb, var(--error) 30%, transparent);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* working indicator */
  .working { display: flex; align-items: baseline; gap: 8px; color: var(--dim); font-size: 13px; }
  .working .star { color: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .working .star { animation: none; } }
  .working .verb { color: var(--fg); }
  .working .meta { color: var(--faint); font-size: 12px; }
  /* The stop control rides ON the working line, which exists for exactly as long
     as a run is interruptible — so the button cannot outlive what it cancels. */
  .working .stop {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--dim);
    font: inherit;
    font-size: 12px;
    padding: 1px 7px;
    cursor: pointer;
  }
  .working .stop:hover:not(:disabled) { color: var(--fg); border-color: var(--faint); }
  .working .stop:disabled { opacity: .55; cursor: default; }

  /* A one-liner for something that happened beside the conversation: the agent
     reading the app state on its own, or the user ending a turn. */
  .note { display: flex; gap: 8px; font-size: 12px; color: var(--faint); }
  .note .eye { color: var(--dim); }

  /* ── permission cards (the approval bridge) ── */
  .perm {
    border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
    border-radius: 14px;
    background: var(--surface);
    padding: 12px 14px;
    box-shadow: 0 4px 16px var(--shadow);
  }
  .perm.resolved { border-color: var(--border); box-shadow: none; }
  .perm .perm-head { font-size: 13px; color: var(--dim); }
  .perm .perm-head .tool { color: var(--accent); font-weight: 600; }
  .perm .perm-sub { color: var(--dim); word-break: break-word; font-size: 12px; margin-top: 2px; }
  .perm pre {
    background: var(--pre-bg);
    color: var(--pre-fg);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin: 8px 0 0;
    padding: 8px 10px;
    max-height: 190px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 12px;
  }
  .perm .perm-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .perm button {
    font: inherit;
    font-size: 12.5px;
    font-weight: 500;
    padding: 5px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: transparent;
    color: var(--fg);
    cursor: pointer;
    transition: background .12s, border-color .12s, filter .12s;
  }
  .perm button:hover:not(:disabled) { border-color: var(--border-strong); background: var(--surface-2); }
  .perm button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
  }
  .perm button.primary:hover:not(:disabled) { filter: brightness(1.1); background: var(--accent); }
  .perm button:disabled { opacity: .55; cursor: default; }
  .perm .perm-status { margin-top: 10px; font-size: 13px; }
  .perm .perm-status.allow { color: var(--ok); }
  .perm .perm-status.deny { color: var(--error); }
  .perm .perm-status.expired { color: var(--dim); }

  /* ── composer (shared by home + chat) ── */
  .composer {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 12px 14px 10px;
    box-shadow: 0 6px 24px var(--shadow);
    transition: border-color .15s;
  }
  .composer:focus-within { border-color: var(--border-strong); }
  .composer textarea {
    width: 100%;
    background: transparent;
    border: 0;
    outline: none;
    resize: none;
    color: var(--fg);
    font: inherit;
    font-size: 14px;
    line-height: 1.5;
    max-height: 200px;
    padding: 2px 2px 6px;
  }
  .composer textarea::placeholder { color: var(--faint); }
  .composer-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .composer-row .spacer { flex: 1; }
  .pill {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 999px;
    color: var(--dim);
    font: inherit;
    font-size: 12px;
    padding: 3px 8px;
    cursor: pointer;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    transition: background .12s, color .12s, filter .12s;
  }
  /* THE ONE RULE about hover and an active state, shared with #annbtn in the left
     pane's banner: a neutral hover never applies to a control that is switched on,
     and an on control hovers WITHIN its accent.
     Spelled out in the selectors on purpose, and kept after the pane-shot pill
     that motivated it was deleted: `.pill:hover` and a pill's own
     `[aria-pressed="true"]` rule are both specificity (0,2,0), so a plain
     `.pill:hover` wins on source order alone and repaints an ARMED pill neutral —
     the "this is on" receipt disappearing under the cursor at exactly the moment
     the user is deciding whether to click. Relying on rule order for that is one
     reshuffle away from the bug coming back, and the next pressable pill in this
     row inherits the fix rather than rediscovering it. */
  .pill:hover:not([aria-pressed="true"]) { background: var(--surface-2); color: var(--fg); }
  .pill[aria-pressed="true"]:hover { filter: brightness(1.1); }
  .pill option { background: var(--bg); color: var(--fg); }
  .send {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: var(--on-accent);
    border: 0;
    border-radius: 50%;
    padding: 0;
    cursor: pointer;
    flex-shrink: 0;
    transition: filter .12s, transform .12s, opacity .12s;
  }
  .send:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .send:active { transform: none; }
  /* While a run is live the send buttons become stop buttons: the arrow hides and
     a stop square shows. Clicking then kills the run (same as Escape). */
  .send .ic-stop { display: none; }
  body.running .send .ic-send { display: none; }
  body.running .send .ic-stop { display: block; }

  /* The chat composer's <form> is a WRAPPER, not a box: #composer-chat is what
     has to be #chat's flex child (so it sits under #logwrap and shrinks to its
     content), and a form box in between would break that. `display: contents`
     removes the form from layout while keeping it in the DOM, which is what makes
     one <form> able to wrap the whole composer and still let the flex column see
     through it.
     IT LIVES HERE, IN THE STYLESHEET, AND MAY NEVER GO BACK ON THE ELEMENT. As a
     `style="display:contents"` attribute it outranked every stylesheet rule short
     of the CSS force flag (`important`) — which is forbidden in this file (D146) — so the
     narrow layout's `body.view-preview #chat > *:not(#anntools) { display: none }`
     could not collapse it. In Preview view #composer-chat was promoted into
     #chat's flex layout under the #anntools strip and the whole composer
     (textarea, three selects, the send button) rendered there,
     eating ~105px of the height the preview was supposed to get. As a rule it is
     plain specificity (0,1,0,0) against the media block's (0,2,1,1), so the collapse
     wins. tests/test_claude_narrow.py forbids an inline `display` anywhere in the
     column for exactly this reason. */
  #inputbox { display: contents; }

  #composer-chat {
    flex-shrink: 0;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    padding: 8px 20px 6px;
  }
  #footnote {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px 10px;
    text-align: center;
    color: var(--faint);
    font-size: 11px;
  }
  #chat.home #footnote { display: none; }

  /* markdown inside assistant turns */
  .assistant b, .assistant strong { color: var(--fg-strong); font-weight: 600; }
  .assistant em { font-style: italic; }
  .assistant code {
    background: var(--code-bg);
    color: var(--code-fg);
    border-radius: 5px;
    padding: 1px 5px;
    font-size: 12.5px;
  }
  .assistant pre {
    background: var(--pre-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    margin: 8px 0;
    overflow-x: auto;
    white-space: pre;
    font-size: 12.5px;
    line-height: 1.55;
  }
  .assistant pre code { background: transparent; color: var(--pre-fg); padding: 0; }
  .assistant .h { color: var(--fg-strong); font-weight: 600; font-size: 15px; }
  .assistant .bullet { color: var(--accent); }
  .assistant a { color: var(--link); text-decoration: none; }
  .assistant a:hover { text-decoration: underline; }
  .cursor { color: var(--accent); animation: blink 1s step-end infinite; }
  @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

  /* ── home view ── */
  #home {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 14vh;
  }
  #home .inner { width: 100%; max-width: 620px; padding: 0 24px; }
  .home-title {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -.02em;
    color: var(--fg-strong);
    text-align: center;
    margin-bottom: 4px;
  }
  .home-title .spark { color: var(--accent); margin-right: 10px; font-weight: 400; }
  .home-sub {
    color: var(--faint);
    font-size: 12.5px;
    text-align: center;
    margin-bottom: 28px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #recent { margin-top: 28px; padding-bottom: 32px; }
  #recent .head {
    color: var(--faint);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .8px;
    text-transform: uppercase;
    margin-bottom: 8px;
    padding: 0 4px;
  }
  /* Claude snapshots (SPEC §34). Same visual family as .chat-row — this is
     another "list of past things about this target" on the same landing page —
     and like those rows it is pressable: a row expands to its diff and the one
     action that goes back to it. The SECTION itself is pressable too: it is a
     collapsed heading until asked for, so the landing page costs no round trip
     for a history most opens never look at. */
  #snaps { margin-top: 28px; padding-bottom: 32px; }
  #snaps .head {
    color: var(--faint);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .8px;
    text-transform: uppercase;
    margin-bottom: 8px;
    padding: 0 4px;
  }
  /* WHAT OPENS THE SECTION IS A ROW, not the heading.
     The heading was the control for one revision and it was the wrong element:
     11px uppercase letter-spaced micro-type stretched across a full-width
     bordered pill reads as neither a heading nor a button ("the claude
     snapshots toggle thing UI is very ugly"), and a lowercase "show" hint
     sitting beside an uppercase label made two type systems argue inside one
     box. The page already has an affordance vocabulary and it is not headings:
     EVERY section here is a quiet static uppercase label over a stack of
     pressable rows (#recent's heading over .chat-row). So the heading goes back
     to being a label, and the thing you press is one placeholder .snap-row —
     the SAME class the snapshots themselves use, borrowed rather than copied —
     which is literally a preview of what is inside: a row that opens into more
     rows exactly like it. */
  #snapshead { display: flex; align-items: center; gap: 8px; }
  /* The way back out, and it only exists once there is something to close. It
     lives on the heading LINE (there is no placeholder row to press any more)
     but not in the heading's type: normal case, so it reads as a control beside
     the label rather than as part of it. */
  #snapshide {
    margin-left: auto;
    font: inherit;
    font-size: 11.5px;
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
    color: var(--faint);
    background: none;
    border: 0;
    border-radius: 6px;
    padding: 2px 6px;
    cursor: pointer;
  }
  #snapshide:hover { color: var(--fg); }
  /* `.snap-row` is `display: flex`, which outranks the UA's `[hidden]` rule. */
  #snapsopen[hidden] { display: none; }
  /* The one thing the placeholder does not take from .snap-row: its label is the
     row's SUBJECT, so it carries the row's own ink rather than the muted
     timestamp colour .snap-when is for. */
  #snapsopen .snap-open-label { color: var(--fg); flex: 1; }
  .snap-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 6px;
    font-size: 12.5px;
  }
  /* The dot answers exactly ONE question — where is disk right now — rather
     than competing with a second marker for the same column. */
  .snap-row .snap-dot { color: var(--faint); flex-shrink: 0; font-size: 10px; }
  .snap-row.here { border-color: var(--border-strong); }
  .snap-row.here .snap-dot { color: var(--accent); }
  .snap-row .snap-v { color: var(--fg); flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .snap-row .snap-when { color: var(--faint); flex: 1; overflow: hidden;
                         text-overflow: ellipsis; white-space: nowrap; }
  .snap-row .snap-d { color: var(--faint); flex-shrink: 0; }
  .snap-row .snap-plus { color: var(--accent); }
  .snap-row .snap-minus { color: var(--faint); }
  .snap-row .snap-caret { color: var(--faint); font-size: 9px; flex-shrink: 0; }
  .snap-row { cursor: pointer; }
  .snap-row:hover { background: var(--surface); }
  .snap-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* An open row and its body are one box: the expansion is part of the row it
     belongs to, not a panel floating under the list. */
  .snap-item { margin-bottom: 6px; }
  .snap-item .snap-row { margin-bottom: 0; }
  .snap-row.open { border-bottom-left-radius: 0; border-bottom-right-radius: 0;
                   border-bottom-color: transparent; }
  .snap-body {
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 12px 12px;
    padding: 10px 14px 12px;
    font-size: 12px;
  }
  .snap-row.open + .snap-body { border-color: var(--border-strong); }
  .snap-diff {
    background: var(--pre-bg);
    color: var(--pre-fg);
    border-radius: 8px;
    padding: 8px 10px;
    margin: 0 0 10px;
    max-height: 240px;
    overflow: auto;
    font-size: 11.5px;
    line-height: 1.45;
    white-space: pre;
  }
  .snap-diff .dl-add { color: var(--ok); }
  .snap-diff .dl-del { color: var(--error); }
  .snap-diff .dl-hunk { color: var(--link); }
  .snap-diff .dl-head { color: var(--faint); }
  .snap-act { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .snap-ask { color: var(--fg); }
  .snap-go, .snap-no {
    font: inherit;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--fg);
    cursor: pointer;
  }
  .snap-go { border-color: var(--accent); color: var(--accent); }
  .snap-go:hover, .snap-no:hover { background: var(--surface-2); }
  .snap-note { color: var(--faint); flex-basis: 100%; }
  .snap-err { color: var(--error); }
  #snapsnote { color: var(--faint); font-size: 11.5px; padding: 4px; }

  .chat-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 8px;
    cursor: pointer;
    background: transparent;
    transition: background .12s, border-color .12s;
  }
  .chat-row:hover { background: var(--surface); border-color: var(--border-strong); }
  .chat-row .dot { color: var(--accent); flex-shrink: 0; font-size: 10px; }
  .chat-row .row-title {
    color: var(--fg);
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .chat-row .row-sub { color: var(--faint); font-size: 12px; flex-shrink: 0; }

  /* ── skeleton loading placeholders ── */
  .skel-bar {
    height: 11px;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--surface) 25%, var(--border) 50%, var(--surface) 75%);
    background-size: 200% 100%;
    animation: skel-shimmer 1.2s ease-in-out infinite;
  }
  @keyframes skel-shimmer {
    from { background-position: 200% 0; }
    to { background-position: -200% 0; }
  }
  .skel-turn { margin: 0 0 20px; }
  .skel-turn-user { display: flex; justify-content: flex-end; }
  .skel-turn-user .skel-bar { width: 34%; height: 34px; border-radius: 16px; }
  .skel-turn-assistant { display: flex; gap: 10px; }
  .skel-turn-assistant .skel-dot-a {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--border); flex-shrink: 0;
  }
  .skel-turn-assistant .skel-lines { flex: 1; display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
  .skel-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border: 1px solid var(--border);
    border-radius: 12px; margin-bottom: 8px;
  }
  .skel-row .skel-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--border); flex-shrink: 0;
  }
  .skel-row .skel-bar.title { flex: 1; }
  .skel-row .skel-bar.sub { width: 42px; flex-shrink: 0; }

  /* ── narrow host: one view at a time ──────────────────────────────────────
     Two floors, and the breakpoint follows the HIGHER one. The layout's hard
     floor — where the halves squeeze past their minimums and then overflow — is
     #left's 200px + the 4px divider + #chat's 340px ≈ 544px, and the original
     breakpoint (560px, D236) sat just above it. That turned out to be the wrong
     floor to pick: a split that merely does not overflow is not yet a split
     worth having. The explorer's listing preview pane defaults to HALF its
     split container (about 700px on a 1700px window), so at 560px the split
     engaged in a host far too narrow for it — two cramped columns where one
     readable view was wanted. So the breakpoint is derived from the columns'
     minimum USEFUL widths instead:

         #left   a framed preview that is still a page       420px
                 (the phone-viewport family, rounded up)
       + #divider                                              4px
       + #chat   ~60 characters of transcript prose at the    440px
                 composer's own size (340 above is the
                 squeeze floor, not a target)
       = 864px floor. The breakpoint currently sits at 800px — deliberately a
                 little BELOW that floor, trading a slightly-squeezed band
                 (800–864) for keeping the split alive on more hosts.

     Below 800px the split becomes ONE view at a time with a toggle, the same
     idiom log_studio (780px), map (650), duckdb/sqlite (560) and bundle (640)
     already use. `history`, the other split-layout template, collapses LOWER
     (640px): its non-preview column is a 200px commit spine, not a 440px chat,
     so its split stays useful in hosts this one cannot survive.

     WHY this lives in the template and not in the shell: the alternative was to
     have the shell filter split-layout modes out of a narrow pane. A pane's
     width is DYNAMIC, and that makes the filter wrong in both directions — the
     listing preview pane defaults to HALF its container, so on a wide window
     the pane fits the split perfectly and the mode should be offered; and once
     it is offered, dragging the divider a little would make the mode appear and
     disappear from the switcher mid-drag, and could yank the ACTIVE mode out
     from under the user. It also needs per-template width knowledge in the
     shell, which no registry field carries and which every user template would
     be missing. A template that adapts itself needs none of that, and a user
     template gets the same treatment for free by writing its own media query.

     No min-width declaration was added to the registry or to stat for exactly
     that reason. */
  @media (max-width: 800px) {
    /* One column, holding one of the two views (plus the shared #anntools
       strip — see below). `position: relative` because the hidden view is
       PARKED out of flow against the body box, not display:none'd — see
       body.view-chat #left. */
    body { flex-direction: column; position: relative; }
    /* Nothing to drag when only one view is on screen. */
    #divider { display: none; }
    /* And no bar over the left pane: below the breakpoint there is no
       persistent left column to put one on, so the view picker goes back to
       #anntools — the row both views keep — and placeLeftPicker moves it. This
       rule is the layout half of that fact; the JS half is the move itself. */
    #leftbar { display: none; }
    /* NOTE what is NOT here: a width for #left. applySplit() writes
       `width: <split>%` INLINE on it, and an inline declaration outranks any
       stylesheet rule, so a plain `width: auto` here would simply lose. The two
       ways to neutralise it are the CSS force flag (`important`) and JS that
       refrains from writing the inline width while narrow — and the JS one is
       what this template does, in applySplit (see there): this file carries a
       hard no-force-flag rule (D146: cascade problems are stated in the
       SELECTORS, so that the next reader can reason about them by reading them,
       and a test asserts the flag appears nowhere in this file), so forcing here
       would be the one exception that makes the rule unenforceable. The
       behaviour is the same either way, because the `split` PARAM is never
       touched by the collapse:
       applySplit rewrites the inline percentage from it the moment the host grows
       back past 800px, so the wide layout returns with the user's own ratio and
       with no reload. `min-width` is a stylesheet declaration and does need
       clearing here — the 200px floor is a promise about the wide layout. */
    #left { min-width: 0; }
    /* The 340px floor is the wide layout's promise that the chat stays usable
       BESIDE the preview. Here the chat is the whole width, so the floor would
       only force a horizontal overflow of a 220px pane. */
    #chat { min-width: 0; order: -1; }

    /* Chat view — the default. The preview column is taken OUT OF FLOW and
       parked, full size, behind the chat rather than `display: none`d, and that
       is not a stylistic choice: an iframe with no layout box gives its content
       document a 0×0 viewport, which would (a) make shotPane rasterise a 1×1
       image of the app the moment a user attaches a pane screenshot from the
       chat, and (b) collapse every element rect the pins are anchored to, so
       arming annotate mode from here would find nothing to point at. Parked and
       `visibility: hidden` it keeps a real viewport and a real layout, costs one
       out-of-flow box, and shows nothing. `pointer-events: none` so the
       invisible pane cannot swallow a click meant for the chat. */
    body.view-chat #left {
      position: absolute;
      inset: 0;
      visibility: hidden;
      pointer-events: none;
    }
    body.view-chat #chat { flex: 1; min-height: 0; }
    /* A control that acts on the OTHER half is ABSENT here, not disabled: with
       no preview on screen there is nothing to annotate and no frame to place a
       pin in, and nothing to choose a view FOR. A disabled control still claims
       the space and still says "this view has an annotate feature", which is a
       worse lie than not offering it — and an ARMED annotate mode with no
       visible frame is worse than a dead one: it swallows clicks in a document
       the user cannot see. applyNarrowView disarms the mode when the view flips
       away from Preview for exactly that reason.
       Two things are deliberately NOT in this list:
         * the Chat ⇄ Preview toggle — it is the navigation between the two
           views, not a feature of either, so it is the one control that has to
           be reachable from both;
         * the annotation CHIPS above the composer — they are chat content (the
           notes about to be sent, in the user's own words), not a control that
           acts on the preview. Hiding them would hide part of the message. */
    body.view-chat #annbtn,
    body.view-chat #leftmode { display: none; }
    /* The rule above also removes the row's ONE auto margin (#annbtn owns it,
       see the wide styles), which would let the view toggle fall in next to
       #back at the LEFT edge. The toggle takes the margin over only while the
       switch is off screen, so the strip keeps its shape — way back at one end,
       way forward at the other — in both views. */
    body.view-chat #viewbtn { margin-left: auto; }
    /* The pin overlay (#annpins, #annhl, #annpop) needs no rule of its own: all
       three are children of #left, so parking the column takes them with it —
       `visibility: hidden` inherits (none of them sets `visibility: visible`)
       and `pointer-events: none` means the parked box cannot intercept a click
       meant for the chat, even though it is positioned and #annpop carries a
       z-index. Worth stating because it is the one part of the annotation UI
       that lives OVER the frame rather than in the strip, and a stray
       `visibility: visible` anywhere under #left would float it over the chat. */

    /* Preview view: the chat column collapses to its #anntools strip, so the
       Annotate switch and this toggle stay reachable while the preview owns the
       screen. #anntools is a child of #chat (it is the chat pane's top row in
       the wide layout, and moving it out of there in the DOM would rework a
       layout that is correct), so the strip is kept by hiding #chat's OTHER
       children rather than by hiding #chat: display:none on the column would
       take the toggle with it and strand the user in the preview with no way
       back to the chat.
       THE SELECTOR IS ALSO THE WHOLE MECHANISM, and it is one an INLINE style
       silently defeats: a `style="display:…"` on any of those children outranks
       this rule, and the CSS force flag (`important`) — the only stylesheet
       answer to that — is forbidden in this file (D146). The composer's form used to carry exactly
       such an attribute, so this comment described a collapse that did not
       happen: #composer-chat was promoted into #chat's flex layout, the whole
       composer drew below the strip, and the preview got ~105px less than the
       screen it was told it owned. Every child of #chat now takes its `display`
       from the stylesheet (see the #inputbox rule), and
       tests/test_claude_narrow.py fails on any inline `display` in the column. */
    body.view-preview #left { flex: 1; min-height: 0; }
    body.view-preview #chat { flex: 0 0 auto; }
    body.view-preview #chat > *:not(#anntools) { display: none; }
    /* #back survived the collapse above only because it moved into #anntools.
       It stays hidden HERE for the same reason the rest of the chat column is:
       the chat list it returns to is off screen in this view, so the button
       would navigate to something the layout cannot show. */
    body.view-preview #back { display: none; }

    #viewbtn { display: flex; align-items: center; }
  }
</style>
</head>
<body>
  <div id="left">
    <!-- The left pane's own top bar, holding the view picker in the split
         layout. Empty and `hidden` in the markup: placeLeftPicker moves
         #leftmode in here once the layout is known to be wide and the picker is
         known to have something to offer. A row ABOVE #leftview, never over it
         — see the stylesheet. -->
    <div id="leftbar" hidden></div>
    <!-- The iframe's own box, and the offset parent for every overlay that is
         positioned in FRAME viewport coordinates (pins, highlight, composer). -->
    <div id="leftview">
      <!-- "Preview", not "File preview": this frame holds a file's preview for a
           file target and the user's own app for an app folder, and an accessible
           name that names the wrong one of those is the same bug the footnote
           had. Nothing sets it per kind because "Preview" is already true of
           both. -->
      <iframe id="leftframe" title="Preview"></iframe>
      <div id="annhl"></div>
      <div id="annpins"></div>
      <div id="annpop">
        <textarea rows="2" placeholder="What about this element?" spellcheck="false"></textarea>
        <div class="hint">Enter to save · Esc to cancel
          <button id="anndel" type="button" hidden>Delete</button></div>
      </div>
    </div><!-- /leftview -->
  </div>
  <div id="divider" role="separator" aria-orientation="vertical" aria-label="Resize panels"></div>

  <div id="chat" class="home">
    <!-- Annotation control: a real layout ROW above everything else in this
         pane, in both views — never an overlay, so it can't land on top of the
         topbar or the transcript. A real <button> (Enter/Space work, aria
         announces state) living in the parent document, a structural guarantee
         it can never appear in a pane capture (shotPane rasterises the framed
         document only). One switch is enough: the comment pins over the app
         show while annotating and hide when the mode is off. -->
    <div id="anntools">
      <!-- The way back to the chat list, at the strip's left end. It lived at
           the right end of #topbar; it sits HERE so the strip reads
           [← Chats … Annotate] on one line, with the topbar below carrying only
           the session's identity. Hidden on the home view (there is no chat to
           leave) and in the narrow preview view (the view it returns to is off
           screen there) — both rules are in the stylesheet, where the topbar's
           own home-view hiding already lives. -->
      <button id="back" type="button" aria-label="Back to chats">← Chats</button>
      <!-- Kind-free wording, and rewritten by applyPaneNoun once stat says what
           the pane is: "the app" for an app folder, "the preview" for a file. It
           said "the app" unconditionally, so a screen-reader user on `notes.md`
           heard "Annotate the app" over a markdown preview — the same bug the
           footnote and the frame's own title had. -->
      <button id="annbtn" type="button" aria-pressed="false" aria-label="Annotate the preview"
              title="Annotate the preview, then send the notes to Claude"><span
        class="lbl">Annotate</span><span class="track" aria-hidden="true"><span class="knob"></span></span></button>
      <!-- More options (⋮), beside the annotate switch. One item today: hand
           this session to a real terminal. The LABEL is decided at open time
           (kebabOpen) because it names what the copied command will do —
           "Continue in terminal" when a session id is on the URL, "New session
           in terminal" from the landing page — and the id is a param that
           changes without a reload. -->
      <div id="kebab">
        <button id="kebabbtn" type="button" aria-haspopup="menu" aria-expanded="false"
                aria-label="More options" title="More options">⋮</button>
        <div id="kebabpop" role="menu" aria-label="More options" hidden>
          <button id="terminalopt" type="button" role="menuitem" class="kebab-opt"></button>
        </div>
      </div>
      <!-- Which view the LEFT pane frames. The popup ships EMPTY and the whole
           control `hidden`: the options are the target's own preview modes,
           which only the stat call in paneURL() knows, and there is no picker to
           show at all unless that call found more than one of them
           (buildLeftPicker). The rows carry each template's own icon.svg, which
           is why this is a listbox and not a <select> — see the stylesheet.
           It SHIPS here and lives here in the NARROW layout, where this strip is
           the one row both views keep and there is no persistent left column to
           put a bar on. In the split layout placeLeftPicker moves this same
           element up into #leftbar, onto the pane it controls. Ships here rather
           than there because this is the position that needs no JS to be right:
           a picker in an unbuilt left bar would be a control in a bar that may
           never be shown. -->
      <div id="leftmode" hidden>
        <button id="leftmodebtn" type="button" aria-haspopup="listbox" aria-expanded="false"
                aria-label="Preview pane view" title="Which view the preview pane shows">
          <span class="mode-ic" aria-hidden="true"></span>
          <span class="mode-lbl"></span>
          <span class="mode-chev" aria-hidden="true">▾</span>
        </button>
        <div id="leftmodepop" role="listbox" aria-label="Preview pane view" hidden></div>
      </div>
      <!-- Chat ⇄ Preview, for the narrow single-view layout only (hidden by CSS
           until the 800px media query reveals it). It sits in THIS strip
           because the strip is the one row that both views keep on screen. -->
      <button id="viewbtn" type="button" aria-label="Annotate preview"
              title="Switch between the chat and the preview pane, where the annotation tools are">Annotate preview</button>
    </div>
    <!-- chat view -->
    <div id="topbar">
      <span class="spark">✻</span>
      <span class="tb-title">Claude</span>
      <span class="tb-file" id="banner-sub"></span>
      <span id="session" class="mono"></span>
    </div>
    <div id="logwrap"><div id="log"></div><div id="queue"></div></div>
    <!-- `display: contents` is in the stylesheet, deliberately not here: an inline
         declaration cannot be overridden by the narrow layout's collapse, and
         the CSS force flag (`important`) is forbidden in this file (D146).
         See the #inputbox rule. -->
    <form id="inputbox" class="composer">
      <div id="composer-chat">
        <div class="annchips" id="annchips-chat"></div>
        <div class="composer">
          <textarea id="box" rows="1" placeholder="Reply to Claude…" spellcheck="false"
                    data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false"></textarea>
          <div class="composer-row">
            <select id="model" class="pill model-sel" title="Model"></select>
            <select id="effort" class="pill effort-sel" title="Effort"></select>
            <select id="perm" class="pill perm-sel" title="How much Claude may do without asking"></select>
            <span class="spacer"></span>
            <button class="send" type="submit" aria-label="Send">
              <svg class="ic-send" width="14" height="14" viewBox="0 0 16 16" fill="none">
                <path d="M8 13V3M8 3L3.5 7.5M8 3l4.5 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <svg class="ic-stop" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <rect x="4" y="4" width="8" height="8" rx="1.5" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </form>
    <!-- The second piece of chrome that names the target (the composer
         placeholder is the first), and it ships the kind-FREE wording for the
         same reason: the kind is not known until stat answers, and a sentence
         that flips from a wrong noun to a right one is worse than one that gains
         a noun. setTargetNoun writes both. -->
    <div id="footnote">Claude can read and edit files here. Approvals control what runs without asking.</div>

    <!-- home view -->
    <div id="home">
      <div class="inner">
        <div class="home-title"><span class="spark">✻</span><span id="home-file"></span></div>
        <div class="home-sub" id="home-path"></div>
        <div class="annchips" id="annchips-home"></div>
        <form id="card" class="composer">
          <!-- The placeholder names WHAT the chat is about, and that depends on
               the target's KIND, which only paneURL() knows (see setTargetNoun).
               The markup ships the kind-free wording so the box is never empty
               and never wrong: "this project" was hardcoded here and lied about
               every file and every ordinary folder this mode is bound to. -->
          <textarea id="homebox" rows="2" placeholder="Ask Claude…" spellcheck="false"
                    data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false"></textarea>
          <div class="composer-row">
            <select id="hmodel" class="pill model-sel" title="Model"></select>
            <select id="heffort" class="pill effort-sel" title="Effort"></select>
            <select id="hperm" class="pill perm-sel" title="How much Claude may do without asking"></select>
            <span class="spacer"></span>
            <button class="send" type="submit" aria-label="Send">
              <svg class="ic-send" width="14" height="14" viewBox="0 0 16 16" fill="none">
                <path d="M8 13V3M8 3L3.5 7.5M8 3l4.5 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <svg class="ic-stop" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <rect x="4" y="4" width="8" height="8" rx="1.5" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </form>
        <div id="recent">
          <div class="head">Recent chats</div>
          <div id="recentlist"></div>
        </div>
        <!-- Claude Code's own file-history checkpoints for this file (SPEC
             §34). Ported from the superseded `annotate` template, whose reader
             (shared/file_history.py) was written annotate-agnostic for exactly
             this adoption. FILE targets only — the store keys on one absolute
             file path, so a folder has no chain. COLLAPSED by default: the
             heading is offered as soon as the target is known to be a file, and
             the timeline behind it is only read when the user opens it. -->
        <div id="snaps" hidden>
          <div class="head" id="snapshead">
            <span>Claude snapshots</span>
            <!-- Only ever shown once the section is open: a "hide" for something
                 that is not showing is a control for nothing. -->
            <button id="snapshide" type="button" hidden
                    aria-expanded="true" aria-controls="snapsbody">hide ▾</button>
          </div>
          <!-- The one pressable thing while collapsed, and a .snap-row on
               purpose: it is a preview of what opening does, in the same shape
               as what it opens into. Ships BEFORE the body so a failed read can
               put it back with the error underneath it. -->
          <div class="snap-row" id="snapsopen" role="button" tabindex="0"
               aria-expanded="false" aria-controls="snapsbody">
            <span class="snap-dot">●</span>
            <span class="snap-open-label">Show version history</span>
            <span class="snap-caret">▸</span>
          </div>
          <div id="snapsbody" hidden>
            <div id="snapslist"></div>
            <div id="snapsnote"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
// THE chat: ./agent.py behind it
// (start/poll/decide/history/sessions), permission cards, run/session params,
// resume semantics. It is the RIGHT pane of a split for a file and for an app
// folder, and the WHOLE window for an ordinary folder, which has no pane at all
// (D239) — so "the right pane of a split view", which this comment used to say,
// is true of two of its three shapes and the layout is paneURL's business, not
// this description's.
// It began as a 1:1 fork of the `claude` template's chat and
// is now the only one — `claude` is deleted, this mode is offered on files and
// on every directory, and the one feature that never came across is the annotate
// comment handoff (claudeComments/claudeReturn): annotate hands off to
// `_mode=claude`, which no longer resolves, and the return-trip existed to show
// the edited file — which the left pane already does.
//
// A chat must never reload out from under a live conversation: the runtime
// watches _file (LR-1), so Claude's own edit to the target would reload THIS
// frame mid-stream — killing the poll loop and orphaning the run. The left
// preview iframe is its own document and keeps live-reloading on its own.
fused.autoReload(false);

// The agent is this template's own copy (templates are self-contained, no
// cross-template imports).
const AGENT = "./agent.py";

const log = document.getElementById("log");
const logwrap = document.getElementById("logwrap");
const box = document.getElementById("box");
const chatEl = document.getElementById("chat");
const sessionEl = document.getElementById("session");
const homebox = document.getElementById("homebox");

// Focus a composer — unless this page is a PREVIEW IN THE EXPLORER'S PANE.
//
// The pane is a same-origin iframe, so an input that focuses itself here takes
// document focus away from the shell, and the listing's arrow keys stand down
// the moment focus leaves it: previewing a file stopped the user browsing file
// to file from the keyboard. `window.__fusedNoAutofocus` is the shell's signal
// (runtime.js, from `_nofocus=1` on this frame's URL) and it goes false the
// instant the reader touches this page — so clicking into the pane, or opening
// this chat full-screen, focuses exactly as it always did. A standalone page
// never sees the flag at all.
//
// Every composer focus goes through this, not only the boot ones: after the
// first gesture it is a plain .focus(), so there is nothing to gain from
// keeping two spellings and one obvious way for the next boot-path focus to
// re-break the pane.
function focusBox(el) {
  if (window.__fusedNoAutofocus) return;
  el.focus();
}

// The target file arrives as the read-only _file param (template contract).
const FILE = fused.params.get("_file") || "";
const BASENAME = FILE.split("/").pop();

if (!FILE) {
  document.body.innerHTML = '<div id="msg">No file selected (missing _file param).</div>';
  throw new Error("claude template: missing _file");
}

document.getElementById("banner-sub").textContent = BASENAME;
document.getElementById("home-file").textContent = BASENAME;
document.getElementById("home-path").textContent = FILE;
document.title = "Claude — " + BASENAME;

// ── live app state: what the agent can SEE of the running app ──
// Without this the agent is editing a page it cannot look at: it has no way to
// tell whether its own change rendered, whether the console filled with errors,
// or whether the page went blank. Two channels close that, and both are served
// from here:
//
//   push — appStateSnapshot() rides along with each message (appStateBlock).
//   pull — the agent's `app_state` MCP tool, answered from the poll loop, for
//          after it edits something and the snapshot has gone stale.
//
// It is deliberately TEXT ONLY — structure, own-text, params, console lines —
// for the same reason the annotation anchors are (#372): a description Claude
// can map straight back to the app's HTML source beats pixels it has to guess
// from. Nothing here is allowed to break the chat: the framed document can be
// mid-navigation, absent (no app entry — see the loader below) or cross-origin,
// so every access is guarded and a failure degrades to LESS state, never to a
// thrown send.
const APP_STATE_MAX_LOGS = 50;    // ring buffer: a live-reloading page logs forever
const APP_STATE_MAX_TEXT = 300;   // per console line / text snippet
const APP_STATE_MAX_NODES = 60;   // elements in the DOM outline
const APP_STATE_MAX_DEPTH = 4;    // how deep the outline descends
// Text per OUTLINED element, deliberately tighter than a console line: this one
// is paid 60 times over, and the whole snapshot is meant to be a few KB rather
// than a transcription of the page's copy.
const APP_STATE_MAX_NODE_TEXT = 120;
// ── caps on annotation screenshots ──
// Same spirit as the outline caps above: a crop is an ATTACHMENT to an anchor,
// not the anchor itself, so it is allowed to cost a little and never a lot.
// Longest edge of a crop. 640 is enough to read a label or see that a chart drew
// nothing, and small enough that the agent's own image budget is not the story.
const SHOT_MAX_EDGE = 640;
// Encoded bytes per crop. Over budget, the crop is halved and re-encoded (PNG has
// no quality dial) — and if it is STILL over, no crop is better than one that
// dominates the turn.
const SHOT_MAX_BYTES = 300 * 1024;
// Crops per send. The pane is captured once however many notes there are, so this
// caps the ENCODING and the uploads, which is where the time goes.
const SHOT_MAX_COUNT = 6;
// px² below which there is nothing to look at — a 0x0 rect (display:none), or a
// hairline border. Cheaper to say so than to write a file nobody can read.
const SHOT_MIN_AREA = 64;
// The whole capture's budget. Past it the send goes out WITHOUT shots: a user
// losing their message because a screenshot was slow is not a trade we make.
const SHOT_TIMEOUT_MS = 6000;
// Elements whose computed style the capture will inline before it gives up. Each
// one costs a getComputedStyle plus ~340 property reads and adds a few KB to the
// serialized SVG, so this is the cap that keeps a big app from turning the send
// into a freeze. Past it the capture is finished with what it has and every crop
// says so.
const SHOT_MAX_ELEMENTS = 3000;
// Elements between yields to the event loop during that walk. The reason it is a
// number and not "never": a synchronous walk cannot be interrupted by a timer, so
// without these yields SHOT_TIMEOUT_MS below could not fire and the chat UI froze
// for the whole capture. Small enough that a frame is never missed by much, large
// enough that the yields themselves are not the cost.
const SHOT_STYLE_CHUNK = 200;
// Fraction of an annotated element's own area that may sit over an unreadable
// canvas before the crop is suppressed instead of annotated. Half is the line
// between "a picture of the thing, with a hole in a corner" (worth sending, with
// a note) and "a picture of blank backdrop with a control floating on it" (worth
// refusing — see shotBlankCover).
const SHOT_BLANK_BLOCK = 0.5;
// The block's delimiter, duplicated in agent.py (which strips it back out of
// everything user-facing) and in stripAppStateBlock below — a test holds the
// three together, because a drift is invisible until the chat starts showing
// the user a screenful of JSON they never typed (D146).
const APP_STATE_TAG = "live-app-state";
// The whole-pane screenshot's block delimiter. NOTHING WRITES ONE ANY MORE — the
// composer's per-message "attach a picture of the whole pane" pill was deleted —
// and this stays because sessions already on disk carry those blocks: a restored
// transcript has to peel one off and show what the user typed, or it renders a
// screenful of JSON they never wrote. Reading an old wire format is a permanent
// obligation; being able to write it is not.
const PANE_SHOT_TAG = "pane-shot";
// Why there is nothing to say about the app. ONE const because two callers say
// it: the snapshot itself, and the pull channel's fallback answer (appStatePull)
// — a divergence there would tell the model two different stories about the same
// condition (D146: the duplicated rule gets a test, not a comment).
// It enumerates CAUSES, so it may only name conditions that can actually
// produce it. "A project may have no app entry" used to be one and is not any
// more: a folder with no app entry has no pane at all now (D239), and no pane
// means no `app_state` tool in the run's roster — the model cannot ask, so this
// sentence can never be the answer to it. Naming that case here would have the
// snapshot explain a structural absence as a failed read.
//
// That invariant holds only because THIS PAGE is what tells the run whether there
// is a pane: `has_pane` rides every start call (see the start payload in
// submitChat) and agent.py takes it as given. While the server re-resolved the
// kind from disk per turn it was false in precisely the case that matters — a
// session that scaffolds an app INTO an ordinary folder has an app folder on disk
// by turn 2 and still no pane on screen, so the tool was offered, called, and
// answered with this very sentence.
const APP_STATE_UNREADABLE = "the left pane's document could not be read (a "
  + "file may have no preview view, or the pane has not finished loading), so "
  + "nothing is known about its title, url or DOM right now";
// {level, text, source?, line?, ts}. PARENT-side, deliberately: the buffer has
// to outlive the framed app's own reloads, which is exactly what makes "that
// error was already there before my edit" answerable.
const appLogs = [];
let appEntry = "";                // the entry html the pane is rendering
let appLoads = 0;                 // loads seen, so a RELOAD can be told apart

function clipText(value, max) {
  const s = value === null || value === undefined ? "" : String(value);
  return s.length > max ? s.slice(0, max) + "…" : s;
}

function pushAppLog(level, text, source, line) {
  const entry = { level, text: clipText(text, APP_STATE_MAX_TEXT),
                  ts: Math.round(Date.now() / 1000) };
  if (source) entry.source = clipText(source, 200);
  if (line) entry.line = line;
  appLogs.push(entry);
  while (appLogs.length > APP_STATE_MAX_LOGS) appLogs.shift();
}

// console.error's arguments are anything at all, including cross-realm objects
// (the frame's Error is not this realm's Error, so `instanceof` is useless here).
function fmtLogArg(v) {
  if (typeof v === "string") return v;
  if (v && typeof v.message === "string") return v.message;
  try {
    const json = JSON.stringify(v);
    return json === undefined ? String(v) : json;
  } catch (err) {
    return String(v);  // circular, or a throwing toJSON
  }
}

// The window the app runs in — #leftframe's OWN, with no descent. #372 moved
// the pane from /embed/<app> (fused-render's React shell, with the app nested
// one iframe deeper) to /render?path=<entry>, the raw rendered document: the
// frame's contentDocument IS the app's document now, so the frame-walking layer
// that used to live here is gone rather than merely unused.
//
// There is no third pane shape to describe here any more. An ordinary folder had
// one — /embed, the file browser, whose DOM this used to report — and D239 took
// the pane away entirely, which also took away the whole question of whether a
// reading of OUR UI could be mistaken for a reading of the user's code: for that
// target the `app_state` tool is not in the run's roster at all (agent.py), so
// nothing calls this.
//
// Returns null — never this chat's own window — in the three cases that are
// genuinely "no app":
//   * the pane could not open its preview, so the loader below REMOVED the frame
//     (and the no-pane target removed the whole column);
//   * about:blank, the placeholder before the first real document;
//   * unreachable (cross-origin, or mid-navigation).
function appWindow() {
  try {
    if (!annFrame || !annFrame.isConnected) return null;
    const win = annFrame.contentWindow;
    if (!win || !win.document) return null;
    if (String(win.location.href) === "about:blank") return null;
    return win;
  } catch (err) {
    return null;
  }
}

// Wrap one window's console + error events. Returns true when THIS document was
// newly wrapped, which is also how a reload is detected (see watchApp).
function watchWindow(win) {
  try {
    const doc = win && win.document;
    // Marked on the DOCUMENT, not the window: a same-origin navigation keeps the
    // window proxy but replaces the global, so a flag there would survive as
    // little as the wrapper itself does — and re-wrapping is exactly what a
    // reload needs.
    if (!doc || doc.__fusedAppWatched) return false;
    doc.__fusedAppWatched = true;
    // console.log is deliberately NOT wrapped: an app's chatter is not news, and
    // 50 ring-buffer slots spent on it would push out the errors that are.
    for (const level of ["error", "warn"]) {
      const original = win.console && win.console[level];
      if (typeof original !== "function") continue;
      win.console[level] = function (...args) {
        try { pushAppLog(level, args.map(fmtLogArg).join(" ")); } catch (err) { /* never */ }
        // Call through: the app's own logging (and the devtools output the user
        // may be reading) must behave exactly as it did uninstrumented.
        return original.apply(win.console, args);
      };
    }
    win.addEventListener("error", (ev) => {
      pushAppLog("error", (ev && (ev.message || (ev.error && ev.error.message)))
                 || "script error", ev && ev.filename, ev && ev.lineno);
    });
    win.addEventListener("unhandledrejection", (ev) => {
      const reason = ev && ev.reason;
      pushAppLog("error", "unhandled promise rejection: " + fmtLogArg(reason));
    });
    return true;
  } catch (err) {
    // Cross-origin, navigating, or already torn down. The snapshot simply has
    // no console entries to report; the chat is unaffected.
    return false;
  }
}

// Called from #leftframe's `load` (beside the annotation rewiring) and once at
// boot. That is enough BECAUSE of the /render framing: a live-reload replaces
// the frame's own document, so `load` fires again — under the old /embed nesting
// it was the INNER frame that navigated and only a timer could see it.
//
// The one thing this cannot win is the race against the app's FIRST inline
// script, which runs before `load`: logging from there is still missed. The DOM
// outline shows what that script did or failed to do, and everything from the
// next tick onwards is captured.
function watchApp() {
  const win = appWindow();
  if (!win) return;
  if (!watchWindow(win)) return;
  appLoads++;
  // Mark the reload IN the buffer rather than clearing it: "these three errors
  // were there before, this one appeared after your edit" is the single most
  // useful thing the buffer can tell the agent, and clearing it destroys that.
  if (appLoads > 1) pushAppLog("reload", "the pane reloaded (a file it uses changed)");
}

// The app's params from its URL, for before its runtime has booted.
function searchParamsOf(search) {
  const out = {};
  new URLSearchParams(search || "").forEach((v, k) => { out[k] = v; });
  return out;
}

// This page sets no `_fusedParamBoundary`, so the pane's runtime treats OUR URL
// as its param target (D46/D72) and its `getAll()` hands back the app's params
// merged with this chat's own bookkeeping. Dropped by name: telling the model
// that the app is "running with" session_id and split is worse than telling it
// nothing about params at all.
