<!DOCTYPE html>
<html data-fused-theme="shell">
<head>
<meta charset="utf-8">
<title>Claude</title>
<style>
  /* Chat pane styled like a modern assistant app (claude.ai / v0 / ChatGPT):
     sans-serif UI, a centered message column, right-aligned user bubbles,
     full-width assistant prose behind a spark avatar, and a floating rounded
     composer. Backend and behavior are the claude template's 1:1 — only the
     skin differs. Every colour is a token; the light block repaints all of
     them (SPEC §30). */
  :root {
    color-scheme: dark;
    --bg: #191a1e;
    --panel: #1e2025;
    --surface: #26282f;          /* composer, cards */
    --surface-2: #2d3038;        /* hover, user bubble */
    --bubble-user: #2f3239;
    --fg: #ececf1;
    --fg-strong: #ffffff;
    --dim: #9a9fa9;
    /* --faint is the quietest text on the page (timestamps, meta lines, the
       thinking summary). It was #6b7079 on #191a1e — 3.1:1, under the 4.5:1
       floor for text this small — so it is lifted to a value that clears it
       while still reading as "quieter than --dim". */
    --faint: #8a8f99;
    --border: #34363e;
    --border-strong: #4a4d57;
    --accent: #d97757;
    /* --accent is a FILL/BORDER colour: it is chosen to look right as a solid
       swatch, not to be read as text on a tinted background (the qhead chip's
       accent-on-10%-accent was 3.4:1 dark / 3.9:1 light). --accent-text is the
       same hue pushed until small text on that tint clears 4.5:1. Never use it
       for a fill and never use --accent for text on a tint. */
    --accent-text: #e8907a;
    --on-accent: #1a1a1a;
    --error: #f26d6d;
    --ok: #6cc07a;
    --code-bg: #2a2c33;
    --code-fg: #e8c07d;
    --pre-bg: #141519;
    --pre-fg: #d4d4d8;
    --link: #7aa8ff;
    /* diff lines in Edit chips — own variables, not --ok/--error: those are
       status colours on text, these are backgrounds a whole line sits on and
       need to stay readable under --pre-fg in each theme. */
    --diff-add-bg: rgba(108, 192, 122, .14);
    --diff-add-fg: #8ed49a;
    --diff-del-bg: rgba(242, 109, 109, .14);
    --diff-del-fg: #f08d8d;
    --shadow: rgba(0, 0, 0, .4);
    /* The screenshot viewer's backdrop. Heavier than --shadow because it has a
       different job: a shadow lifts a surface, a scrim removes everything behind
       one. Darker in the light theme than in the dark for the same reason a
       shadow is lighter there — the contrast it has to win against is the page. */
    --scrim: rgba(0, 0, 0, .62);
    --scrollbar: #3a3d45;
    --handle-hover: #4a4d57;
    /* Caret for the composer's select pills. A data URI can't read
       currentColor, so the stroke bakes in this theme's --dim — keep the two
       in sync when either changes. */
    --pill-caret: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="8" height="8" viewBox="0 0 8 8"><path d="M1.5 3l2.5 2.5L6.5 3" stroke="%239a9fa9" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>');
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff;
    --panel: #fafafa;
    --surface: #f4f4f6;
    --surface-2: #ebebef;
    --bubble-user: #f0f0f3;
    --fg: #1f2023;
    --fg-strong: #000000;
    --dim: #61656c;
    --faint: #676c74;
    --border: #e3e4e8;
    --border-strong: #c9cbd2;
    --accent: #b8542f;
    --accent-text: #9e4319;
    --on-accent: #ffffff;
    --error: #c62828;
    --ok: #2e7d32;
    --code-bg: #f0f1f3;
    --code-fg: #8a5a12;
    --pre-bg: #f7f8f9;
    --pre-fg: #33363c;
    --link: #1c5fb8;
    --diff-add-bg: rgba(46, 125, 50, .10);
    --diff-add-fg: #1f6b25;
    --diff-del-bg: rgba(198, 40, 40, .10);
    --diff-del-fg: #a81f1f;
    --shadow: rgba(0, 0, 0, .10);
    --scrim: rgba(0, 0, 0, .48);
    --scrollbar: #cdd0d6;
    --handle-hover: #a8adb6;
    --pill-caret: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="8" height="8" viewBox="0 0 8 8"><path d="M1.5 3l2.5 2.5L6.5 3" stroke="%2361656c" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>');
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.65;
    display: flex;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  code, pre, .mono { font-family: "SF Mono", Menlo, Monaco, "Cascadia Mono", monospace; }

  /* ── split layout ─────────────────────────────── */
  #left { position: relative; min-width: 200px; display: flex; flex-direction: column; }
  /* The iframe's box, and the offset parent for everything that floats over the
     app — the annotate button, the pins, the highlight, the composer. `min-height:
     0` because a flex child's default `min-height: auto` would let the iframe
     refuse to shrink. */
  #leftview { position: relative; flex: 1; min-height: 0; }
  #leftview iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: var(--bg);
  }
  #divider {
    flex-shrink: 0;
    width: 4px;
    cursor: col-resize;
    background: var(--border);
    transition: background .15s;
  }

  /* ── annotation controls: a layout row at the top of the chat pane ─────── */
  /* One labelled left-right sliding switch — annotate mode (#annbtn) — in a
     real flex ROW above the chat content, shown in both views. A row, not an
     overlay: the floating versions (corner icon, then margin pills) kept
     landing on top of whatever the chat pane drew underneath. Pin visibility
     follows the mode (annotating shows the comment pins; leaving the mode
     hides them), so a second switch has nothing left to govern. Deliberately
     quiet: plain label text and a small track that tints accent when armed —
     no filled pill, no border. */
  /* `min-width: 0` because this row has to survive a 220px host (the listing
     preview pane's floor, FS-12) and a flex item's default `min-width: auto`
     refuses to shrink below its content — without it the row overflows a narrow
     pane instead of letting its one elastic label give. Which label gives is
     decided below: the view toggle never does, the annotate switch does. */
  /* ONE rule for BOTH strips, and that is the point: #leftbar (the left pane's
     own bar, further down) is the same row on the other side of the divider,
     and the two must agree on height or the pane's bottom border runs a few
     pixels off the listing's and the row reads as broken. They were two
     byte-identical blocks with a comment asking the reader to keep them in
     step; a shared selector cannot drift. Anything that is NOT shared —
     #leftbar's `[hidden]` and its removal in the narrow layout — is declared
     separately and later, so it still wins. */
  #anntools,
  #leftbar {
    flex-shrink: 0;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
  }
  /* Two separate buttons — Comment on the left, Record on the right (the
     split pill is gone — Akshil, 2026-08-19). Exactly one mode is ever on,
     and the OTHER button always shows the way out of it: arming Comment turns
     the mic seat into ✓ Done (send the notes, leave the mode); starting a
     recording turns the Comment seat into ■ plus the live clock (stop it).
     The wrapper carries the row's ONE auto margin, the strip's right-hand
     anchor: everything before it (#back, the picker when it appears) sits
     left of the slack, everything after (the kebab) rides right with it — see
     #leftbar #leftmode for why a row gets exactly one. The picker unfolds to
     the buttons' LEFT, into the slack, so they hold still under the pointer. */
  #anncta {
    margin-left: auto;
    display: flex;
    align-items: center;
    flex-shrink: 0;
    gap: 8px;
  }
  /* The wrapper hides itself when it has no visible button: both are gated
     alike (annPollTarget's [hidden], enterNoPane's removal), and an empty
     wrapper still holding the auto margin would shove the kebab around. :has,
     so the wrapper needs no writer of its own. */
  #anncta:not(:has(#annbtn:not([hidden]))) { display: none; }
  /* One auto margin per row: `body.nopane #kebab` grants the kebab its own
     when the pane's controls are gone — but when the buttons ARE here (the
     hosted sidebar keeps them), two auto margins split the slack and parked
     the control mid-strip (Akshil, 2026-08-19: "why is this in the middle?").
     A visible button revokes the kebab's grant, so the pair sits right, beside ⋮. */
  #anncta:has(#annbtn:not([hidden])) ~ #kebab { margin-left: 0; }
  #anncta button {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    /* `--dim` is THIS file's muted ink (see the palettes at the top). It read
       `var(--muted, var(--fg))` for a long time, and `--muted` is defined nowhere
       here and is not injected by the shell theme — the runtime writes
       `data-theme`, not tokens — so the fallback always won and the control drew at
       full foreground in both states, making the hover brighten below a no-op.
       Silent, because an undefined token is inert rather than an error.
       tests/test_theme.py now fails on any var() this file does not define. */
    color: var(--dim);
    font: inherit;
    font-size: 12px;
    white-space: nowrap;
    height: 26px;
    padding: 0 10px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: color .12s, background .12s, border-color .12s;
  }
  /* Hover must not outrank a STATE (Bugbot, PR #644): the bare hover rule beat
     #annbtn.on and #annrec.on on order, so crossing the armed Comment seat
     wiped the accent fill — the mode's only on-screen signal — on the way to
     the click that ends it. :not(.on) keeps hover a resting-seat affair; the
     armed looks below stay put under the pointer. */
  #anncta button:hover:not(:disabled):not(.on) { color: var(--fg); background: var(--surface); }
  /* Armed comment mode draws the seat in accent OUTLINE — accent border and
     ink on a quiet ground (Akshil, 2026-08-19: the filled seat shouted). The
     picker's selected seat keeps its fill; this is a state, that is a choice. */
  #annbtn.on { color: var(--accent); background: transparent; border-color: var(--accent); }
  /* The buttons are HIDDEN, not disabled, when there is nothing to annotate —
     the sidebar layout's case, where the target is the host's content pane and
     the host may be showing something unmarked (annPollTarget). Same rule the
     narrow layout follows for the controls of a hidden pane: absent beats
     dead. Restated because the flex display above outranks the UA's
     `[hidden] { display: none }`, exactly as #leftbar[hidden] does. */
  #annbtn[hidden] { display: none; }
  #annrec[hidden] { display: none; }
  #anncta button:disabled { opacity: .55; cursor: default; }
  /* The recording state borrows --error, the one token already meant for
     "something the user should notice is live" (it colours a failed run) —
     no new token to keep in step across the two palettes. */
  #annrec.on { color: var(--error); border-color: var(--error); animation: annrecpulse 1.1s infinite; }
  /* The icons: stroke glyphs in the button's own ink, so state colours (the
     hover brighten, the recording --error) reach them for free. `.fill` seats
     are the solid parts — the picker's inner square, the stop block. */
  #anncta svg, #anntool svg {
    width: 14px;
    height: 14px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linecap: round;
    flex-shrink: 0;
  }
  #anncta svg .fill, #anntool svg .fill { fill: currentColor; stroke: none; }
  /* Icon-plus-word buttons keep their words only while the strip has room —
     COLLISION-detected, not a breakpoint (Akshil, 2026-08-19: a fixed width
     dropped the words while there was still space for them). annFitStrip
     measures the row with the words ON — plus the off-screen picker's
     reserved width, so arming can never flip the words under the click — and
     stamps `.tight` on #anntools only when that content truly would not fit,
     whatever the divider, the picker or the seats' current faces are doing. The words are spans marked .lbl reading
     `var(--annlbl, inline)`; a tight strip sets the token to none and every
     word yields at once. The clock (#annreclbl) is state, not a label, and
     never hides. The var, not a plain `.tight .lbl { display: none }`: the
     face-swap rules below SHOW their words through higher-specificity :has
     selectors, and only a token they all read wins without a specificity
     war. This blanket rule sits ABOVE the face swaps on purpose: the idle
     hide of .done-word ties it on specificity and must win by order. */
  #anntools.tight #anncta, #anntools.tight #anntool { --annlbl: none; }
  #anncta .lbl, #anntool .lbl { display: var(--annlbl, inline); }
  /* Each button is a seat with swappable glyphs and words, all baked into the
     markup so no writer ever rebuilds an icon (textContent would erase an
     inline SVG — #annreclbl is the only text the writers touch). Which face a
     seat wears is DERIVED from the two state classes the JS already maintains
     (#annbtn.on = mode armed, #annrec.on = recording live), via :has on the
     wrapper — no third writer to fall out of step.

     Idle faces: 💬 Comment · 🎙 Record. A mode ON means ONE control (Akshil,
     2026-08-19): the mic hides outright, and the Comment seat morphs into
     the mode's exit. */
  #annbtn .cmt-stop, #annbtn .cmt-done, #annbtn .done-word { display: none; }
  #anncta:has(#annbtn.on) #annrec { display: none; }
  /* Comment armed (and no recording): the seat IS ✓ Done, in the armed
     accent — send the notes and finish. `:not(.busy)` on the SHOW rules, so
     the transcribing state below is one word, not "✓ Done Transcribing…"
     (Akshil, 2026-08-19) — the hide rules stay unconditional because busy
     wants the bubble and the word gone too. */
  #anncta:has(#annbtn.on):not(:has(#annrec.on)) #annbtn .cmt-bubble,
  #anncta:has(#annbtn.on):not(:has(#annrec.on)) #annbtn .cmt-word { display: none; }
  #anncta:not(.busy):has(#annbtn.on):not(:has(#annrec.on)) #annbtn .cmt-done { display: block; }
  #anncta:not(.busy):has(#annbtn.on):not(:has(#annrec.on)) #annbtn .done-word { display: var(--annlbl, inline); }
  /* The discard seat exists ONLY while a walkthrough records — an outline
     trash beside the stop, for throwing the recording away instead of
     sending it. Derived from the same state class as every other face.
     `#anncta #anndiscard`, two ids, because a bare `#anndiscard` LOSES to
     the base `#anncta button` display rule on specificity and the trash sat
     on the strip in every state (Akshil, 2026-08-19). */
  #anncta #anndiscard { display: none; }
  #anncta:has(#annrec.on) #anndiscard { display: inline-flex; padding: 0 8px; }
  /* Two ids + the same pseudo-class count as the base hover above, or the
     resting brighten wins and the destructive hint never paints. */
  #anncta #anndiscard:hover:not(:disabled):not(.on) { color: var(--error); border-color: var(--error); }
  /* Recording: the seat is ■ plus the live clock, in the recording's own
     --error ink rather than the armed accent (the accent says "commenting",
     and what this seat says now is "stop"). */
  #anncta:has(#annrec.on) #annbtn .cmt-bubble,
  #anncta:has(#annrec.on) #annbtn .cmt-word { display: none; }
  #anncta:has(#annrec.on) #annbtn .cmt-stop { display: block; }
  #anncta:has(#annrec.on) #annbtn.on {
    color: var(--error);
    background: transparent;
    border-color: var(--error);
  }
  /* Transcribing (recording over, words on their way): the seat carries the
     one word of status in #annreclbl ALONE. No rules of its own: the armed
     hide above already took the bubble and the word (the mode is still on),
     and the `:not(.busy)` guards keep ✓ Done from joining the status text.
     annRecEnd owns the .busy class. */
  /* Empty label must not hold a gap seat open beside the icon. */
  #annreclbl:empty { display: none; }

  /* The tool picker: a two-seat segmented pill in #anncta's own idiom. The
     selected seat wears the accent the way the armed Comment button does — it
     is a mode within the mode, and the two controls should read as one family.
     On screen whenever the mode is armed — typed comment AND recording alike
     (Akshil, 2026-08-19: the picker used to follow the recording only, and a
     typed comment pinned the default tool with no say). While visible it
     takes the row's auto margin from #anncta (the `~` rule outweighs
     #anncta's own single-id grant), so it unfolds beside the buttons, into
     the slack, and they hold still. */
  #anntool {
    display: flex;
    flex-shrink: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    /* 26px like #anncta's buttons, same reason: a seat taller than the row
       makes the row jump when the picker appears. */
    height: 26px;
  }
  #anntool:not([hidden]) { margin-left: auto; }
  #anntool:not([hidden]) ~ #anncta { margin-left: 0; }
  #anntool[hidden] { display: none; }
  /* The picker slides out of the buttons and back into them (Akshil, 2026-08-19):
     its seat's WIDTH lands instantly — nothing else may move — and the glyphs
     glide the last 10px into place. Entry rides the display flip (an element
     leaving display:none restarts its animation, so un-hiding IS the trigger);
     exit is the .out class annToolHide holds up the display flip for. */
  #anntool { animation: annkitin .18s ease; }
  #anntool.out { animation: annkitout .15s ease forwards; }
  @keyframes annkitin { from { opacity: 0; transform: translateX(10px); } }
  @keyframes annkitout { to { opacity: 0; transform: translateX(10px); } }
  @media (prefers-reduced-motion: reduce) {
    #anntool, #anntool.out { animation: none; }
  }
  #anntool button {
    border: 0;
    background: transparent;
    color: var(--dim);
    font: inherit;
    font-size: 12px;
    padding: 0 10px;
    height: 100%;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    transition: color .12s, background .12s;
  }
  #anntool button + button { border-left: 1px solid var(--border); }
  #anntool button:hover { color: var(--fg); background: var(--surface); }
  #anntool button[aria-checked="true"] { color: var(--on-accent); background: var(--accent); }

  /* ── the left pane's own top bar ────────────────────────────────────────
     Home of the view picker in the SPLIT layout: the control that chooses what
     the left pane frames sits ON the left pane, over the thing it changes,
     rather than across the divider in the chat pane's strip. It used to live in
     #anntools, where it was a control for one column rendered on the other one.

     A real layout ROW, for the same reason #anntools is one: an overlay would
     land on top of whatever the framed app draws under it, and the app owns
     every pixel of its own viewport. Its box IS #anntools' box — they share the
     one rule up there, so the two strips cannot drift out of alignment across
     the divider.

     `[hidden]` needs a rule of its own because the shared `display: flex`
     outranks the UA's `[hidden] { display: none }`. TWO independent things can
     hide this bar, and they are separate on purpose: JS sets `hidden` when
     there is nothing to pick (buildLeftPicker / placeLeftPicker — a content
     fact), and the 800px media block drops it outright (a layout fact — the
     narrow layout has one column and one shared strip, so the picker goes back
     to #anntools). Neither can disagree with the other, because they answer
     different questions. Both are declared AFTER the shared rule, so both
     win. */
  #leftbar[hidden] { display: none; }

  /* WHICH view the left pane frames (`leftmode`): a trigger and its own listbox
     popup, quiet to the same degree as #annbtn — borderless, transparent, 12px,
     the muted colour until hovered. Loud chrome here would read as the pane's
     TITLE rather than a switch, and the pane's title is the file name in the
     topbar. Hidden until there is more than one view to choose between; see
     buildLeftPicker(). It is ONE element that MOVES between the two hosts above
     (placeLeftPicker), not one per layout: a second copy would be a second
     value, a second listener and a second thing to keep in step with
     `leftmode`.

     It WAS a native <select>, chosen for the platform popup, keyboard handling
     and accessible name it brings for free. What overturned that is the ICON: a
     `<option>` renders text and nothing else in every engine, so a mode list
     that shows what the shell's own mode menu shows — the template's icon.svg
     beside its name — cannot be built out of one. The replacement is the same
     shape the `reader` template's voice menu already uses in this codebase
     (a button carrying `aria-haspopup="listbox"` over a `role="listbox"` div),
     and its rows are real <button>s, so focus, Enter and Space stay the
     platform's job and only the arrows and Escape are ours. */
  #leftmode { position: relative; flex-shrink: 0; }
  /* THE RIGHT-HAND END of the pane's own bar. The bar exists to carry this one
     control, and a lone control hard against the left edge reads as a label for
     the pane rather than as a switch on it — the same reason #annbtn parks
     itself at the end of the strip across the divider. Scoped to #leftbar: in
     the narrow layout the picker shares #anntools with the annotate switch and
     the view toggle, where #annbtn already owns the auto margin and a second
     one would split the free space between them and float the picker into the
     middle of the row. */
  #leftbar #leftmode { margin-left: auto; }
  #leftmodebtn {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 26px;
    max-width: 160px;
    padding: 0 6px;
    font: inherit;
    font-size: 12px;
    line-height: 1;
    border: 0;
    border-radius: 6px;
    background: transparent;
    /* Same muted ink as #annbtn beside it — and copied from it AFTER the
       `var(--muted, …)` bug had been sitting in that rule unnoticed, which is how a
       dead style spreads. */
    color: var(--dim);
    cursor: pointer;
    transition: color .12s, background .12s;
  }
  /* Open is a state the trigger has to WEAR: with the popup drawn below it, a
     trigger that goes back to looking untouched reads as a menu belonging to
     nothing. */
  #leftmodebtn:hover,
  #leftmodebtn[aria-expanded="true"] { color: var(--fg); background: var(--surface); }
  #leftmodebtn .mode-lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #leftmodebtn .mode-chev { font-size: 9px; flex-shrink: 0; }
  /* The template's own icon.svg, drawn the way the shell draws it (mode-icon-mask
     in preview.css): a MASK filled with currentColor, so one flat glyph inherits
     the row's ink and both themes instead of shipping two colourways. */
  .mode-ic {
    display: inline-block;
    flex-shrink: 0;
    width: 14px;
    height: 14px;
    background-color: currentColor;
    -webkit-mask-position: center; mask-position: center;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-size: contain; mask-size: contain;
  }
  /* A template folder with no icon.svg (and the `_render` sentinel, which is not
     a folder at all) gets the shell's own fallback: a lettered box, so the
     column of icons never goes ragged. */
  .mode-ic.letter {
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: 1px solid var(--border-strong);
    border-radius: 3px;
    font-size: 9px;
    font-weight: 600;
  }
  #leftmodepop {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: 30;
    min-width: 172px;
    padding: 4px;
    background: var(--panel);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    box-shadow: 0 6px 24px var(--shadow);
  }
  /* `display: flex`-shaped children do not save it: the popup itself is the box
     the attribute has to hide, and `position: absolute` outranks the UA's
     `[hidden]` rule the same way #leftbar's `display: flex` does. */
  #leftmodepop[hidden] { display: none; }
  .mode-opt {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 7px 9px;
    font: inherit;
    font-size: 12px;
    line-height: 1;
    border: 0;
    border-radius: 7px;
    background: none;
    color: var(--fg);
    cursor: pointer;
    text-align: left;
  }
  .mode-opt:hover, .mode-opt:focus-visible { background: var(--surface-2); }
  .mode-opt[aria-selected="true"] { color: var(--accent); }

  /* More options (⋮) beside the annotate switch: trigger drawn as quiet as
     #annbtn and #leftmodebtn (borderless, muted ink), popup drawn exactly like
     #leftmodepop — same box, same shadow — because to the user they are the
     same kind of thing: a small menu hanging off the strip. */
  #kebab { position: relative; flex-shrink: 0; }
  /* The no-pane strip (an ordinary folder, D239): #annbtn — the row's usual
     auto-margin owner — is out of the document, so the kebab, the one control
     the teardown keeps, anchors the right-hand end itself. */
  body.nopane #kebab { margin-left: auto; }
  /* Unless the switch is still there and still usable, which is the sidebar
     layout (chat_only): it keeps its auto margin, and TWO of them would split
     the row's free space between them and float the switch into the middle
     instead of parking it at the end. `:not([hidden])` and not a bare `#annbtn`,
     because a hidden switch takes no space and the kebab has to slide back to
     the end while it is away. */
  body.nopane #annbtn:not([hidden]) ~ #kebab { margin-left: 0; }
  #kebabbtn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 26px;
    padding: 0;
    font: inherit;
    font-size: 14px;
    line-height: 1;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--dim);
    cursor: pointer;
    transition: color .12s, background .12s;
  }
  #kebabbtn:hover, #kebabbtn[aria-expanded="true"] { color: var(--fg); background: var(--surface); }
  #kebabpop {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: 30;
    min-width: 196px;
    padding: 4px;
    background: var(--panel);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    box-shadow: 0 6px 24px var(--shadow);
  }
  /* Same story as #leftmodepop: `position: absolute` outranks the UA's
     `[hidden]` rule, so the hide needs a rule of its own. */
  #kebabpop[hidden] { display: none; }
  .kebab-opt {
    display: block;
    width: 100%;
    padding: 7px 9px;
    font: inherit;
    font-size: 12px;
    line-height: 1;
    white-space: nowrap;
    border: 0;
    border-radius: 7px;
    background: none;
    color: var(--fg);
    cursor: pointer;
    text-align: left;
  }
  .kebab-opt:hover, .kebab-opt:focus-visible { background: var(--surface-2); }
  .kebab-opt[disabled] { color: var(--dim); cursor: default; }

  /* "Comment on preview" ⇄ "Back to chat" toggle. Exists for the NARROW layout only
     (see the 800px block at the end of this stylesheet): while both columns are on
     screen there is nothing to toggle, so it is display:none here and the media
     query is the only thing that reveals it. Drawn like #back (bordered, quiet)
     rather than like #annbtn: it navigates between views, it is not a mode.
     `flex-shrink: 0` and the tighter 8px padding are what let the longer labels
     live in a 220px row: this is the control that must never be half-readable,
     because a truncated "Back to cha…" is the only way out of the preview. */
  #viewbtn {
    display: none;
    flex-shrink: 0;
    height: 26px;
    padding: 0 8px;
    font: inherit;
    font-size: 12px;
    line-height: 1;
    white-space: nowrap;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--dim);
    cursor: pointer;
    transition: color .12s, border-color .12s, background .12s;
  }
  #viewbtn:hover { color: var(--fg); border-color: var(--border-strong); background: var(--surface); }
  #annpins { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
  .annpin {
    position: absolute;
    transform: translate(-50%, -50%);
    min-width: 22px;
    height: 22px;
    padding: 0 4px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--on-accent);
    border: 1.5px solid var(--panel);
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    cursor: default;
    user-select: none;
    box-shadow: 0 1px 4px var(--shadow);
  }
  .annpin.sent { opacity: .55; }
  #annhl {
    position: absolute;
    z-index: 1;
    display: none;
    pointer-events: none;
    border: 1.5px solid var(--accent);
    border-radius: 4px;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
  }
  #annpop {
    position: absolute;
    z-index: 5;
    display: none;
    width: 280px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 6px 24px var(--shadow);
  }
  /* The note composer's FALLBACK seat in the sidebar layout, and only that.
     The composer describes an element in another column of the HOST's window,
     so where it belongs is beside THAT element — and an iframe cannot draw
     outside its own bounds, so annPlacePop PORTALS the node into the target
     document's injected overlay and places it at the click there. None of these
     rules apply on that path: the shadow root the composer moves into has never
     heard of this stylesheet and carries its own copy of the composer's looks
     (ANN_LAYER_CSS).

     What is left for this rule is the case with no point to aim at — a chip
     opened for a note whose element no longer resolves, or a host showing
     nothing marked at all. The composer then stays HERE, parked directly under
     the #anntools strip (the 51px) and spanning the column: a text box the
     reader can still type in, rather than one placed at a coordinate we do not
     have.

     `fixed`, not absolute: this document IS the sidebar column, so the frame's
     viewport is the column and no positioned ancestor has to be invented for
     it. That also keeps it clear of #chat's `overflow: hidden`, which would
     otherwise clip a popover placed at the very top of the column. Above
     #kebabpop's 30 — it is a text field the reader is typing in, and nothing in
     the strip may land on top of it. */
  #annpop.sidebar {
    position: fixed;
    z-index: 40;
    top: 51px;
    left: 12px;
    right: 12px;
    width: auto;
  }
  #annpop textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--fg);
    font: inherit;
    font-size: 13px;
    padding: 7px 9px;
    resize: none;
    outline: none;
  }
  #annpop .hint { color: var(--faint); font-size: 11px; margin-top: 5px; display: flex; align-items: center; }
  #anndel {
    margin-left: auto;
    border: 0;
    background: transparent;
    color: var(--error);
    font: inherit;
    font-size: 11px;
    cursor: pointer;
    padding: 0 2px;
  }
  .annpin:not(.sent) { cursor: pointer; }

  /* pending-annotation chips above the composer */
  .annchips { display: flex; flex-wrap: wrap; gap: 6px; }
  .annchips:not(:empty) { padding: 0 0 8px; }
  .annchip {
    display: flex;
    align-items: center;
    gap: 6px;
    max-width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 6px 3px 10px;
    font-size: 12px;
    color: var(--fg);
  }
  .annchip .txt {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 240px;
  }
  .annchip .pinlbl { color: var(--accent); font-weight: 600; flex-shrink: 0; }
  .annchip button {
    border: 0;
    background: transparent;
    color: var(--dim);
    cursor: pointer;
    font-size: 12px;
    padding: 0 3px;
    border-radius: 50%;
  }
  .annchip button:hover { color: var(--fg); }
  /* The pending screenshot's chip is the SAME pill as an annotation's, with the
     picture itself where the note's words would be. That likeness is the point:
     both are things this message is about to carry, both sit above the composer,
     and both come off with the same ✕ — so one row reads as "what is attached"
     rather than as two features that happen to be neighbours.
     Small, because it is a receipt and not a viewer: enough to recognise the
     screen you just photographed, and never enough to push the composer down. */
  /* A real <button>, not decoration: it opens the full-size viewer. `cursor` and
     the hover ring are the only things that can say so at 22px, and they have to,
     because a thumbnail this small proves a picture EXISTS and cannot show what
     is in it. The button is the frame (border, clip, hit area) and the <img>
     inside it does the sizing — a button cannot `object-fit` its own content. */
  .annchip .shotthumb {
    display: block;
    flex-shrink: 0;
    padding: 0;
    background: none;
    border: 1px solid var(--border);
    border-radius: 3px;
    overflow: hidden;
    line-height: 0;
    cursor: zoom-in;
  }
  .annchip .shotthumb img {
    display: block;
    height: 22px;
    max-width: 64px;
    object-fit: cover;
  }
  .annchip .shotthumb:hover, .annchip .shotthumb:focus-visible {
    border-color: var(--accent);
    outline: none;
  }
  /* The chip arriving. HALF of the "did it even do anything?" answer — the other
     half is the flash over the pane itself (shotFlash) — and it is deliberately
     the loud half: the pane is where the user was looking, the composer is where
     they will look next, so the chip has to still be moving when their eye gets
     there. One 220ms scale+fade, no bounce: a receipt, not a celebration.
     Opacity-only under reduced motion, which keeps the signal and drops the
     movement. */
  @keyframes shotchip-in {
    from { opacity: 0; transform: scale(.82); }
    to   { opacity: 1; transform: scale(1); }
  }
  .annchip.shotchip { animation: shotchip-in .22s cubic-bezier(.2, .9, .3, 1.1); }
  @media (prefers-reduced-motion: reduce) {
    .annchip.shotchip { animation: none; }
  }

  /* ── the screenshot viewer ───────────────────
     Fixed over the whole template, above every other layer this page paints
     (#annpop is 40, the permission card sits in the log). It is modal on
     purpose: the one thing the user is doing here is looking at one picture, and
     anything else on screen competing for the click is a way to dismiss it by
     accident. */
  #shotview {
    position: fixed;
    inset: 0;
    z-index: 90;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Tight, because of where this template usually lives. `fixed` is the
       TEMPLATE's viewport, and in the sidebar layout that is a ~440px column —
       the viewer cannot escape it (no postMessage, D3/D4), so every pixel of
       padding is a pixel off a screenshot that was 1600px wide. 12px is enough
       to read as an overlay and cheap enough not to matter. */
    padding: 12px;
  }
  /* The half that makes `hidden` real. See the markup's note: `display: flex`
     above outranks the UA rule, so without this the closed viewer is an
     invisible sheet over the entire template eating every click. */
  #shotview[hidden] { display: none; }
  #shotview-scrim { position: absolute; inset: 0; background: var(--scrim); }
  #shotview-box {
    position: relative;
    margin: 0;
    max-width: 100%;
    max-height: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 18px 50px var(--shadow);
  }
  /* `min-height: 0` so the flex column may actually shrink the image — without
     it a tall screenshot pushes the caption bar off the bottom of the viewport,
     which is where the Discard button lives.

     TWO SIZES, and the second one is not a nicety. Fitted, a 1600px-wide capture
     lands at ~310px in the sidebar — four times the chip, still not enough to
     read the UI it is a picture OF, which is the whole reason the user opened it.
     So the fitted view is the overview and one click swaps to natural size with
     the box scrolling, which is the only way a narrow column can show a wide
     screenshot at a legible scale. The cursor names which click you are about to
     make. */
  #shotview-img {
    min-height: 0;
    max-width: 100%;
    object-fit: contain;
    border-radius: 4px;
    background: var(--surface-2);
    cursor: zoom-in;
  }
  #shotview-box.zoom { overflow: auto; }
  #shotview-box.zoom #shotview-img {
    max-width: none;
    max-height: none;
    /* `align-self` is the load-bearing one, and it is why the first attempt at
       this toggled a class and changed nothing measurable: the box is a COLUMN
       flex container, so its default `align-items: stretch` sizes the image to
       the container's width on the cross axis. Lifting max-width alone left the
       picture pinned at the box's own width — visibly identical to the fitted
       view, with a zoom-out cursor promising something that had not happened.
       Only `flex-start` lets it take its intrinsic width and overflow, which is
       what gives the box something to scroll. */
    align-self: flex-start;
    width: auto;
    cursor: zoom-out;
  }
  /* The scrolled state needs the caption to stay put — it holds Discard and
     Close, and a bar that scrolls away with a 1600px image takes the way out
     with it. */
  #shotview-box.zoom #shotview-bar {
    position: sticky;
    bottom: 0;
    background: var(--panel);
    padding-top: 6px;
  }
  #shotview-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
    color: var(--dim);
  }
  #shotview-bar .spacer { flex: 1; }
  /* The path the AGENT was given, which is the one fact a picture cannot show
     about itself. Truncated from the LEFT (see .chip-path): the filename is the
     half that identifies it. */
  #shotview-path {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    direction: rtl;
    text-align: left;
    min-width: 0;
    font-size: 11px;
    color: var(--faint);
  }
  #shotview-drop { color: var(--error); }
  /* Whatever the picture does NOT show, in the one place the user is actually
     looking at the picture. It rode the wire from the first version of this
     feature (`viewNote`) and had nowhere on screen to be said until now. */
  #shotview-note {
    max-width: 60ch;
    font-size: 11.5px;
    line-height: 1.45;
    color: var(--dim);
  }
  #shotview-note:empty { display: none; }

  /* ── the "what was sent" popup: same overlay family as the viewer ─────── */
  /* Below the screenshot viewer (90): the popup's overview thumb opens the
     viewer, which must land ON TOP of the popup or the click looks dead. */
  #sentpop { position: fixed; inset: 0; z-index: 80;
             display: flex; align-items: center; justify-content: center; }
  #sentpop[hidden] { display: none; }
  #sentpop-scrim { position: absolute; inset: 0; background: var(--scrim); }
  #sentpop-box {
    position: relative; display: flex; flex-direction: column;
    width: min(720px, calc(100vw - 48px)); max-height: calc(100vh - 64px);
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 12px 40px var(--shadow); overflow: hidden;
  }
  #sentpop-bar {
    display: flex; align-items: center; gap: 8px; padding: 10px 14px;
    border-bottom: 1px solid var(--border); font-weight: 600; font-size: 13px;
  }
  #sentpop-bar .spacer { flex: 1; }
  #sentpop-body { overflow: auto; padding: 14px; display: flex;
                  flex-direction: column; gap: 12px; }
  #sentpop-body .sent-shot { max-width: 100%; border: 1px solid var(--border);
                             border-radius: 6px; cursor: zoom-in; }
  #sentpop-body .sent-note-row { display: flex; gap: 8px; align-items: baseline;
                                 font-size: 13px; }
  #sentpop-body .sent-note-lbl {
    flex: none; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px;
    background: var(--accent); color: var(--on-accent); font-weight: 700;
    font-size: 12px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  #sentpop-body .sent-note-meta { color: var(--dim); font-size: 12px; }
  #sentpop-body .sent-caveat { color: var(--dim); font-size: 12px; }
  #sentpop-body h4 { margin: 6px 0 0; font-size: 12px; text-transform: uppercase;
                     letter-spacing: .04em; color: var(--dim); }
  #sentpop-body pre.sent-wire {
    margin: 0; padding: 10px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 11px; line-height: 1.45; white-space: pre-wrap;
    word-break: break-word; max-height: 40vh; overflow: auto;
  }
  /* A comment row in a receipt IS the door into the "what was sent" popup —
     no separate button, the row itself is clickable. */
  .annsum-note { cursor: pointer; border-radius: 4px; }
  .annsum-note:hover .annsum-txt { text-decoration: underline;
                                   text-underline-offset: 2px; }
  #divider:hover, body.dragging #divider { background: var(--handle-hover); }
  body.dragging #leftview iframe { pointer-events: none; }
  #msg { margin: auto; color: var(--dim); text-align: center; padding: 24px; }

  /* ── chat pane ─────────────────────────────── */
  #chat {
    flex: 1;
    min-width: 340px;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    overflow: hidden;
  }
  /* A picture is being dragged over the column. An INSET ring rather than a
     border or an overlay: a border would resize the column mid-drag (the layout
     jumping under a pointer that is holding something is the worst possible
     moment for it), and a full-bleed overlay would sit between the pointer and
     the drop target it is describing. `dragenter`/`dragleave` fire per child
     element, so the class is driven by a COUNTER — see shotDragHasFiles. */
  #chat.dropping {
    box-shadow: inset 0 0 0 2px var(--accent);
    background: color-mix(in srgb, var(--accent) 6%, var(--panel));
  }
  #chat.home #topbar, #chat.home #logwrap, #chat.home #composer-chat { display: none; }
  /* #back rides the #anntools strip (which BOTH views keep), so its home-view
     hiding is its own rule — the landing page IS the chat list, and a "back to
     where you already are" is a control for nothing. */
  #chat.home #back { display: none; }
  #chat:not(.home) #home { display: none; }

  /* top bar */
  #topbar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
  }
  #topbar .spark { color: var(--accent); font-size: 15px; }
  #topbar .tb-title {
    font-weight: 600;
    font-size: 13px;
    color: var(--fg-strong);
    white-space: nowrap;
  }
  #topbar .tb-file {
    color: var(--faint);
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  /* TASK-023 (see showSession) — tabular figures for the same reason the
     composer block's `.sb-id` has them: the same identifier must not shift
     width as its digits change. */
  #session {
    color: var(--faint);
    font-size: 11px;
    letter-spacing: .3px;
    font-variant-numeric: tabular-nums;
  }
  #back {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--dim);
    font: inherit;
    font-size: 12px;
    padding: 4px 10px;
    cursor: pointer;
    flex-shrink: 0;
    transition: color .12s, border-color .12s, background .12s;
  }
  #back:hover { color: var(--fg); border-color: var(--border-strong); background: var(--surface); }

  /* the scheduled-message block (see the #schedblock markup)
     It rides the COMPOSER'S column — same 720px measure, same 20px gutter as
     #composer-chat below it — so it reads as a lid on that box rather than as a
     band across the pane. No entry animation and no reserved space: the composer
     is anchored at the bottom of #chat's flex column and #logwrap is the only
     child that grows, so this appears into height the transcript gives up and the
     box under the reader's cursor does not move (see applyComposerBlockState,
     which puts a bottom-pinned transcript back at the bottom). */
  #schedblock {
    flex-shrink: 0;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    padding: 0 20px 6px;
  }
  #schedblock[hidden] { display: none; }
  /* Never on the landing page: there is no session there, so nothing can be
     pending "in this conversation" — the same rule #topbar and #logwrap take. */
  #chat.home #schedblock { display: none; }
  #schedblock .sb-card {
    /* A COLUMN: reason, row, then the one control right-aligned under it. Side by
       side, the row and the button fought over a pane that is often 340px wide and
       the row's own right-hand cell — the time, the thing it is for — was the
       first thing to be squeezed out. */
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px 11px;
    border: 1px solid color-mix(in srgb, var(--accent) 34%, var(--border));
    /* Slightly tighter than the composer's 20px: a lid, not a second box of
       equal weight. */
    border-radius: 14px;
    /* A tint of the accent rather than a solid band: the notice has to read as
       a state this pane is IN, not as a message in the transcript above it. */
    background: color-mix(in srgb, var(--accent) 8%, var(--surface));
    font-size: 12px;
    line-height: 1.45;
  }
  #schedblock .sb-why { display: flex; gap: 6px; color: var(--dim); }
  #schedblock .sb-ic { color: var(--accent-text); flex-shrink: 0; }

  /* ── the task row ────────────────────────────────────────────────────────────
     The Tasks LIST view's row, TRANSCRIBED and not linked: this template cannot
     import frontend/src/styles/tasks.css, so the geometry that file defines is
     copied here — the 8px row gap, the ring in the leading cell, TASK-nnn in
     tabular mono, the ellipsed name, one spacer, and the fixed right-hand cell.
     Every colour goes through this page's own tokens, so the row is the shell's
     shape in the chat's palette rather than a second palette smuggled in.

     It is a BUTTON because the hop is a pushState into the React shell rather
     than a document load (see openTaskOnCalendar) — an <a href> here would be a
     link that cannot be trusted to a middle click. */
  #schedblock .sb-row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 6px 9px;
    /* Sits BACK from the accent-tinted card rather than on top of it, which is
       what makes it read as a row lifted out of the notice. --panel is the one
       surface that steps away from --surface in both themes (down in dark, up in
       light), so the separation survives the light block. */
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 9px;
    color: var(--fg);
    font: inherit;
    font-size: 12.5px;
    text-align: left;
    cursor: pointer;
    transition: background-color .12s, border-color .12s;
  }
  #schedblock .sb-row:hover {
    background: var(--surface);
    border-color: var(--border-strong);
  }
  /* Reachable before the destructive button (it is first in the DOM) and visibly
     so — the ring is the same one every control in this card wears. */
  #schedblock .sb-row:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  /* THE spacer, and there is exactly one: tasks.css's own house rule, because a
     second `margin-left: auto` in the same row centres the right-hand group
     instead of pinning it. */
  #schedblock .sb-grow { flex: 1 1 auto; min-width: 8px; }
  #schedblock .sb-id {
    flex: 0 0 auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .01em;
    color: var(--dim);
  }
  /* An EMPTY id is "/api/tasks could not be read", not "this task has no number":
     the cell disappears rather than holding a gap open, and the rest of the row
     still says which message is holding the box shut (see schedTaskRec). */
  #schedblock .sb-id:empty { display: none; }
  /* The name, and it is the one thing here allowed to be long — so it is the one
     thing that gives way. */
  #schedblock .sb-name {
    min-width: 0;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* State and time, on the right, in one cell: "Upcoming · 14:00 tomorrow". Fixed
     rather than flexible, because the whole point of the right end of this row is
     that the time is always readable. */
  #schedblock .sb-meta {
    flex: 0 0 auto;
    color: var(--dim);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  /* The status ring, drawn the way the shell draws it: a 2px currentColor circle,
     so the STATE only ever changes the hue. 14px rather than the list's 16 — this
     row sits at 12.5px inside a banner, not at 13px in a full-width table. */
  #schedblock .sb-ring {
    position: relative;
    box-sizing: border-box;
    flex: 0 0 14px;
    width: 14px;
    height: 14px;
    border: 2px solid currentColor;
    border-radius: 999px;
    /* Upcoming, which is what a pending message almost always is. */
    color: var(--accent-text);
  }
  #schedblock .sb-ring.sb-ring--in_progress { color: var(--code-fg); }
  #schedblock .sb-ring.sb-ring--done { color: var(--ok); }
  #schedblock .sb-ring.sb-ring--failed { color: var(--error); }
  #schedblock .sb-ring.sb-ring--archived { color: var(--faint); }
  /* Settled — well or badly — carries the inner dot, so the two terminal states
     are told apart by more than a hue. */
  #schedblock .sb-ring.sb-ring--done::after,
  #schedblock .sb-ring.sb-ring--failed::after {
    content: "";
    position: absolute;
    inset: 0;
    margin: auto;
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: currentColor;
  }
  /* A refused cancel, in the one colour this page keeps for a loss. `:empty`
     rather than `hidden`, so the line costs nothing when there is nothing to
     say (see renderSchedBlock — it is written every render, keyed to the entry). */
  #schedblock .sb-note { color: var(--error); }
  #schedblock .sb-note:empty { display: none; }
  /* Under the row and against its right edge — the last thing read, which is what
     a control that spends every future run of a task should be. */
  #schedblock .sb-acts {
    display: flex;
    align-items: center;
    gap: 4px;
    justify-content: flex-end;
  }
  #schedblock .sb-acts button {
    background: transparent;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    color: var(--fg);
    font: inherit;
    font-size: 12px;
    padding: 3px 9px;
    cursor: pointer;
    white-space: nowrap;
    transition: color .12s, border-color .12s, background .12s;
  }
  #schedblock .sb-acts button:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent-text);
  }
  #schedblock .sb-acts button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #schedblock .sb-acts button:disabled { opacity: .55; cursor: default; }
  /* ARMED — one press in, and the next one cancels every future run of a repeat.
     The colour changes with the label because the button is now a different
     question, and this is the page's only red. */
  #schedblock .sb-acts button.armed,
  #schedblock .sb-acts button.armed:hover:not(:disabled) {
    border-color: var(--error);
    color: var(--error);
    background: color-mix(in srgb, var(--error) 10%, transparent);
  }
  /* A run in flight BREATHES, and only where motion is welcome — `no-preference`
     rather than a `reduce` override, so reduced motion is the state that needs no
     opt-out. The ring's hue already says "in progress" on its own. */
  @keyframes sb-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  @media (prefers-reduced-motion: no-preference) {
    #schedblock .sb-ring.sb-ring--in_progress {
      animation: sb-pulse 2s ease-in-out infinite;
    }
  }
  /* The box itself says it is shut, since the banner is at the other end of the
     pane and a reader who clicks into a dead textarea is owed an answer there. */
  #box:disabled {
    opacity: .6;
    cursor: not-allowed;
  }

  /* message log */
  #logwrap { flex: 1; overflow-y: auto; }
  #logwrap::-webkit-scrollbar { width: 8px; }
  #logwrap::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }
  #log {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 20px 12px;
  }
  /* queued messages live in their own container AFTER #log, so they always
     render below every turn — including turns appended while they wait. */
  #queue { max-width: 720px; margin: 0 auto; padding: 0 20px 12px; }
  .turn { margin: 0 0 20px; animation: rise .18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes annrecpulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .turn, #annrec.on { animation: none; } }

  /* The turn a `?msg=` link asked for (see MESSAGE_ANCHOR). A HALO that fades,
     not a selection state: the flare answers "this one" and then leaves, where
     a permanent tint would sit there implying something is still selected and
     that clearing it is the reader's job. Drawn entirely with box-shadow so it
     costs no layout — a padded, backgrounded turn would nudge every turn under
     it the moment the class landed, which reads as the page moving underneath a
     scroll that is still settling. */
  .turn.is-anchored {
    border-radius: 10px;
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 28%, transparent);
    animation: anchor-flare 1.6s ease-out forwards;
  }
  @keyframes anchor-flare {
    0%, 45% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 28%, transparent); }
    100% { box-shadow: 0 0 0 4px transparent; }
  }
  /* Higher specificity than the `.turn { animation: none }` above, so the flare
     has to be switched off on its own. The halo then simply holds until the JS
     timer strips the class — a state change instead of a fade, which is what
     reduced motion asks for. */
  @media (prefers-reduced-motion: reduce) { .turn.is-anchored { animation: none; } }

  .user { display: flex; flex-direction: column; align-items: flex-end; }
  /* annotations a sent message carried — subtle receipt under the bubble */
  .annsum {
    max-width: 82%;
    margin-top: 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .annsum .annsum-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 11.5px;
    color: var(--dim);
    justify-content: flex-end;
  }
  .annsum .annsum-lbl { color: var(--accent); font-weight: 600; flex-shrink: 0; }
  .annsum .annsum-el { color: var(--faint); flex-shrink: 0; font-size: 11px; }
  /* The crop that rode with this note. Small on purpose — it is a receipt, not a
     viewer; hovering shows the path the agent was given. */
  .annsum .annsum-shot {
    flex-shrink: 0;
    height: 28px;
    max-width: 64px;
    object-fit: cover;
    border: 1px solid var(--border);
    border-radius: 3px;
    align-self: center;
  }
  .annsum .annsum-txt {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  /* The whole-pane picture a SENT turn carried. Bigger than a crop's receipt and
     on its own line, because it is a different claim: a crop says "this element",
     which the note beside it already names, while this says "the screen, as it
     was when I asked" — and that is the row a user scrolls back to find. Still a
     receipt, so it is capped well under the bubble's width; the viewer is where
     it gets read. */
  .annsum .annsum-pane {
    display: block;
    align-self: flex-end;
    margin-top: 2px;
    padding: 0;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    line-height: 0;
    cursor: zoom-in;
  }
  /* Cropped from the TOP, not centred: a screenshot of a page is read from its
     top edge, so that is the part worth showing in 140px. */
  .annsum .annsum-pane img {
    display: block;
    max-width: min(220px, 100%);
    max-height: 140px;
    object-fit: cover;
    object-position: top;
  }
  .annsum .annsum-pane:hover, .annsum .annsum-pane:focus-visible {
    border-color: var(--accent);
    outline: none;
  }
  /* A restored turn whose file the shots directory has since pruned (12h/200).
     Said plainly rather than left as a broken-image glyph, which reads as a bug
     in the chat rather than as a temp file that expired. */
  .annsum .annsum-gone { font-size: 11px; color: var(--faint); }
  /* The push channel's receipt: this message carried a description of the app
     the user is looking at, and they should be able to see that it did. */
  .user .attach { margin-top: 4px; font-size: 11px; color: var(--faint); }
  /* The composer's screenshot button. It has NO pressed state, and that absence is
     the design: the pill deleted before it was a per-message toggle you armed and
     that then re-armed itself away after every send, so the only way to know what
     the next message carried was to remember. This one ACTS — it takes the picture
     on click and the picture appears as a chip — so the state that used to live in
     the button's paint now lives above the composer where it can be looked at.
     `disabled` is therefore the only state left, and it lasts one capture.

     Its content is a monochrome inline svg on `currentColor`, not the colour emoji
     the first version used: `.pill` paints only `color`, so its three neighbours
     are quiet dim TEXT and a saturated multicolour glyph was the one loud thing in
     the row. Inheriting `color` also gets the hover colour applied to the icon for
     free — an emoji cannot be recoloured at all. Icon-only, and no word beside it:
     the row already carries three selects and a send button and wraps in a narrow
     chat pane, so every extra millimetre costs a line.

     It deliberately does NOT override `.pill`'s padding. The pill box is the shared
     visual language of that row, and while every background is transparent a
     different box is invisible — it only appears once hover paints one, as a pill
     that is taller and narrower than the selects beside it. So the icon is centred
     inside the pill's own box instead: `min-height` is the pills' text line box
     (their font-size × the inherited line-height), which is what gives a text pill
     its height. */
  .viewshot {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 1.65em;
  }
  .viewshot svg { display: block; }
  /* Hidden where the hosted layout has nothing to photograph (annPollTarget), and
     spelled out for the same reason #annbtn's hiding is: the rule above is
     `display: inline-flex`, which outranks the UA's [hidden] rule, so [hidden]
     alone would leave a live button on screen over a pane that is not there. */
  .viewshot[hidden] { display: none; }
  /* Mid-capture. Not a spinner: a capture is a second at most, and a 9px ring
     inside a 13px pill reads as a smudge rather than as progress — but the dim and
     the cursor still have to say that a second click will not start a second one
     (shotBusy is the half that enforces it). */
  .viewshot:disabled { opacity: .45; cursor: default; }
  /* The composer's calendar button, immediately left of Send. Same box as
     .viewshot above and for the same three reasons — an icon-only control in a
     row that wraps, a monochrome inline svg on `currentColor` so it stays as
     quiet as its neighbours, and `.pill`'s own padding kept so the hover paints
     the shape the rest of the row paints. Spelled out rather than folded into
     the .viewshot selector: the two buttons share a look, not a fate, and
     .viewshot's `[hidden]` rule is about a pane this one never touches. */
  .schedbtn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 1.65em;
  }
  .schedbtn svg { display: block; }
  /* Dead for as long as a scheduled message is pending in this session — the same
     refusal as the disabled textarea above it, because a task queued from here is
     input into that message's context exactly as a typed reply would be (see
     applyComposerBlockState). The hover that would have contradicted the dim is
     excluded on `.pill:hover` itself, where source order can no longer undo it.

     `not-allowed`, which is #box:disabled's cursor and not .viewshot's `default`:
     these two are the SAME refusal and should feel like one, while .viewshot's
     disable is a one-second capture that is nobody's mistake to make. Dimmer than
     the box (.45 against .6) because an 14px monochrome glyph at .6 still reads
     as a live icon, where a whole greyed textarea does not. */
  .schedbtn:disabled { opacity: .45; cursor: not-allowed; }
  .user .bubble {
    background: var(--bubble-user);
    border-radius: 18px 18px 4px 18px;
    padding: 9px 14px;
    max-width: 82%;
    white-space: pre-wrap;
    word-break: break-word;
  }
  /* a message typed while a run is live, parked until the turn ends. Its own
     class tree (`qbubble`, not `.user .bubble`): the re-attach probe and the
     receipt code both select `.turn.user` / `.user .bubble` and must never
     match a message that has not been sent yet. */
  .queued { display: flex; flex-direction: column; align-items: flex-end; }
  .queued .qbubble {
    background: transparent;
    border: 1px dashed var(--border-strong);
    color: var(--dim);
    border-radius: 18px 18px 4px 18px;
    padding: 9px 14px;
    max-width: 82%;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .queued .qmeta {
    display: flex; gap: 6px; align-items: center;
    font-size: 11px; color: var(--faint); margin-top: 3px;
  }
  .queued .qx {
    background: none; border: none; padding: 0; font: inherit;
    color: var(--faint); cursor: pointer;
  }
  .queued .qx:hover { color: var(--fg); text-decoration: underline; }
  .assistant { display: flex; gap: 10px; }
  .assistant .dot {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--accent);
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 2px;
  }
  .assistant .body {
    min-width: 0;
    word-break: break-word;
    padding-top: 2px;
  }
  /* NOT pre-wrap, and `.seg-text` (the per-segment prose element) with it.
     Everything that lands in either is marked's BLOCK html, and marked
     separates block elements with a literal newline —
     `<p>a</p>\n<p>b</p>\n<ul>\n<li>x</li>\n</ul>\n`. Under pre-wrap every one
     of those is a VISIBLE blank line: between paragraphs, INSIDE lists, and one
     trailing the reply. `.toolchip, .thinking` below already set `normal` for
     exactly this reason; this is the same fix at its source. Nothing here still
     needs pre-wrap: all three addAssistant() callers pass "", and renderMd's
     vendor-less fallback wraps its text in a `<pre>`, which owns its own
     white-space. A line break inside a paragraph is marked's job (`breaks:
     true` turns a lone newline into a `<br>`), not the cascade's. */
  .assistant .body, .seg-text { white-space: normal; }
  /* SCOPED, deliberately: `.error` unqualified is a magnet. The tool chip's
     status glyph used to carry a bare `error` class and picked this whole red
     pill up by accident — background, border, 8px of padding — which both
     recoloured a 1-character glyph as a badge and made the chip's row jump
     taller the moment a tool failed. The glyph's classes are `is-ok`/`is-error`
     /`is-running` now (see .chip-status), and this rule names the ONE element
     that is actually a failed-run card: addError()'s `turn error` row. Anything
     that wants this box asks for it by that shape. */
  .turn.error {
    color: var(--error);
    background: color-mix(in srgb, var(--error) 8%, transparent);
    border: 1px solid color-mix(in srgb, var(--error) 30%, transparent);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* The trouble card (SPEC §42): a failure the user can act on, as opposed to
     the plain red row above. WARNING-toned rather than error-toned on the same
     argument the shell's card makes — the app is running, Claude is not — and
     wide enough to hold an install command without wrapping it. */
  .turn.trouble {
    background: color-mix(in srgb, var(--accent) 7%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
  }
  .turn.trouble .trouble-title { font-weight: 600; margin-bottom: 4px; }
  .turn.trouble .trouble-explain { margin: 0 0 8px; color: var(--dim); }
  .turn.trouble .trouble-error {
    margin: 0 0 10px;
    padding: 8px 10px;
    max-height: 200px;
    overflow: auto;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .turn.trouble .trouble-cmd {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px;
  }
  .turn.trouble .trouble-cmd code {
    flex: 1 1 auto;
    padding: 6px 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    overflow-x: auto;
  }
  .turn.trouble .trouble-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .turn.trouble .trouble-btn {
    padding: 3px 10px;
    font: inherit;
    font-size: 12px;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    text-decoration: none;
    cursor: pointer;
  }
  .turn.trouble .trouble-btn:hover { border-color: var(--border-strong); }

  /* working indicator */
  .working { display: flex; align-items: baseline; gap: 8px; color: var(--dim); font-size: 13px; }
  .working .star { color: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .working .star { animation: none; } }
  /* The verb SHIMMERS for as long as the turn is live. The elapsed counter next
     to it is the other liveness signal, and it is a weak one: a second that
     ticks over once a second reads as static in peripheral vision, and the
     token count beside it only moves when the model emits usage — a long tool
     call leaves both sitting still while the run is perfectly healthy. A sweep
     across the label is motion the eye catches without being read.
     Gradient-over-text, so it costs no layout and no extra element. */
  .working .verb {
    color: var(--fg);
    background: linear-gradient(90deg, var(--fg) 35%, var(--faint) 50%, var(--fg) 65%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: skel-shimmer 2.2s linear infinite;
  }
  /* Awaiting approval is the one phase where nothing is running: the turn is
     blocked on the user, and a shimmer there would promise progress that only
     their click can produce. Stopping keeps it — the kill is still in flight. */
  .working.awaiting .verb {
    animation: none;
    background: none;
    -webkit-text-fill-color: var(--fg);
  }
  /* Reduced motion drops the sweep, and with it the transparent fill the
     gradient stands in for — otherwise the label would be invisible. */
  @media (prefers-reduced-motion: reduce) {
    .working .verb {
      animation: none;
      background: none;
      -webkit-text-fill-color: var(--fg);
    }
  }
  .working .meta { color: var(--faint); font-size: 12px; }
  /* The stop control rides ON the working line, which exists for exactly as long
     as a run is interruptible — so the button cannot outlive what it cancels. */
  .working .stop {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--dim);
    font: inherit;
    font-size: 12px;
    padding: 1px 7px;
    cursor: pointer;
  }
  .working .stop:hover:not(:disabled) { color: var(--fg); border-color: var(--faint); }
  .working .stop:disabled { opacity: .55; cursor: default; }

  /* A one-liner for something that happened beside the conversation: the agent
     reading the app state on its own, or the user ending a turn. */
  .note { display: flex; gap: 8px; font-size: 12px; color: var(--faint); }
  .note .eye { color: var(--dim); }

  /* ── permission cards (the approval bridge) ── */
  .perm {
    border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
    border-radius: 14px;
    background: var(--surface);
    padding: 12px 14px;
    box-shadow: 0 4px 16px var(--shadow);
  }
  /* A resolved card is a RECEIPT, not a question. It keeps its place in the
     transcript (the decision is part of the history) and gives up everything
     that was competing for attention: the fill, the shadow, the accent ring,
     and a chunk of its padding. What is left is the status line at full
     contrast and its context at --dim — the shape of a note, not of a prompt.
     Its header goes past tense in JS (resolve()), because a card still reading
     "Claude is asking you" under an answer is a card that looks live. */
  .perm.resolved {
    border-color: var(--border);
    box-shadow: none;
    background: transparent;
    padding: 8px 12px;
    border-radius: 10px;
  }
  /* ...and once it IS history it is parked inside the turn it belongs to
     (parkResolvedCard), where it is a sibling of the segment views rather than a
     top-level turn — so it takes their vertical rhythm instead of a turn's 20px
     gutter, and sits on the reply's text column because `.assistant` is a flex
     row and the body is its second item. */
  .assistant .body > .perm { margin: 8px 0; }
  .perm.resolved .plan-body,
  .perm.resolved .qtext,
  .perm.resolved .perm-sub { color: var(--dim); }
  .perm.resolved .qhead {
    color: var(--dim);
    border-color: var(--border);
    background: transparent;
  }
  .perm .perm-head { font-size: 13px; color: var(--dim); }
  .perm .perm-head .tool { color: var(--accent-text); font-weight: 600; }
  .perm .perm-sub { color: var(--dim); word-break: break-word; font-size: 12px; margin-top: 2px; }
  /* The second selector is the SAME rule one class richer, for a card that has
     been parked back into its turn (parkResolvedCard): inside `.assistant` the
     `.assistant pre` rule far below matches too, at equal specificity and later
     in the sheet — so it would win and hand the card's payload box `white-space:
     pre` and no height cap, i.e. a long Bash command that scrolls sideways
     instead of wrapping and a 400-line body with no ceiling. Restating the
     selector is enough to outrank it wherever the card sits. */
  .perm pre,
  .assistant .perm pre {
    /* Anchors .copybtn, top-right — attachCodeCopy runs on a plan card's body
       too (buildPlanCard), and without this its absolutely-positioned button
       escapes to the nearest positioned ancestor instead of its own pre. */
    position: relative;
    background: var(--pre-bg);
    color: var(--pre-fg);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin: 8px 0 0;
    padding: 8px 10px;
    max-height: 190px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 12px;
  }
  .perm .perm-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .perm button {
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 5px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: transparent;
    color: var(--fg);
    cursor: pointer;
    transition: background .12s, border-color .12s, filter .12s;
  }
  .perm button:hover:not(:disabled) { border-color: var(--border-strong); background: var(--surface-2); }
  .perm button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
  }
  .perm button.primary:hover:not(:disabled) { filter: brightness(1.1); background: var(--accent); }
  .perm button:disabled { opacity: .55; cursor: default; }
  /* ONE focus ring for every keyboard-reachable control on these surfaces.
     Buttons and options had none at all (a `cursor: pointer` box that a Tab key
     cannot find is not a control), and a <summary> keeps only the UA's default
     which the card fills paint over. :focus-visible, not :focus — a mouse click
     on a summary should not leave a ring behind. */
  .perm button:focus-visible,
  .perm .qopt:focus-visible,
  .toolchip > summary:focus-visible,
  .thinking > summary:focus-visible {
    outline: 2px solid color-mix(in srgb, var(--accent) 70%, transparent);
    outline-offset: 2px;
  }
  .perm .perm-status { margin-top: 10px; font-size: 13px; }
  .perm .perm-status.allow { color: var(--ok); }
  .perm .perm-status.deny { color: var(--error); }
  .perm .perm-status.expired { color: var(--dim); }
  /* An ANSWER is not an approval: "You chose: Beta" in the allow green reads as
     a verdict on the question. The label recedes and the choice itself carries
     the contrast, because the choice is the fact worth re-reading later. */
  .perm .perm-status.chose { color: var(--dim); }
  .perm .perm-status.chose .val { color: var(--fg); }

  /* ── question cards (AskUserQuestion) ──
     The same bones as a permission card — one quiet box, one status line when it
     resolves — but the accent is stronger and the options fill the width: this
     one is not "may I", it is a question waiting for an answer, and the answer
     is a choice rather than a verdict, so the options are the card's body
     instead of a row of pill buttons under a payload. */
  .perm.ask { border-color: color-mix(in srgb, var(--accent) 80%, transparent); }
  .perm.ask.resolved { border-color: var(--border); }
  /* The questions scroll, the send button does not. A four-question card with
     four options each is ~40 rows of controls; unbounded, it pushed its own
     "Send answer" past the bottom of the pane, so the one control that
     completes the card was the one thing the user could not see. */
  .perm.ask .qscroll { max-height: 46vh; overflow: auto; }
  .perm .qblock + .qblock { margin-top: 14px; }
  .perm .qhead {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--accent-text);
    border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    border-radius: 999px;
    padding: 1px 8px;
    margin-bottom: 6px;
  }
  .perm .qtext { font-size: 14px; line-height: 1.45; word-break: break-word; }
  .perm .qopts { display: flex; flex-direction: column; gap: 6px; margin-top: 9px; }
  /* Both shapes of an option: a click-to-answer button, and a tickable row for
     multi-select / multi-question cards. Same box either way. */
  .perm .qopt {
    display: flex;
    gap: 9px;
    align-items: flex-start;
    text-align: left;
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: transparent;
    color: var(--fg);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: background .12s ease-out, border-color .12s ease-out;
  }
  .perm .qopt:hover:not(:disabled) {
    border-color: color-mix(in srgb, var(--accent) 60%, transparent);
    background: var(--surface-2);
  }
  .perm .qopt .lbl { font-weight: 600; display: block; }
  .perm .qopt .desc {
    display: block;
    margin-top: 2px;
    color: var(--dim);
    font-size: 12px;
    line-height: 1.4;
    word-break: break-word;
  }
  /* Drawn, not native. Under `color-scheme: dark` Chrome paints an UNCHECKED
     checkbox as a filled light square, which on a dark card reads as already
     ticked — so a four-option multi-select looked pre-answered, and the one
     option the user actually ticked (accent-filled) read as merely
     highlighted. appearance: none takes that away and states both states
     explicitly: empty box = the card's own background, checked = an accent
     fill with a --surface inset punching the middle out (a dot for a radio, a
     square for a checkbox) — no glyph font, no SVG, both themes from tokens. */
  .perm .qopt input {
    appearance: none;
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    margin: 3px 0 0;
    flex-shrink: 0;
    border: 1.5px solid var(--border-strong);
    background: var(--bg);
    border-radius: 4px;
    cursor: pointer;
    transition: background .12s ease-out, border-color .12s ease-out;
  }
  .perm .qopt input[type="radio"] { border-radius: 50%; }
  .perm .qopt input:checked {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: inset 0 0 0 3px var(--surface);
  }
  .perm .qopt input:focus-visible {
    outline: 2px solid color-mix(in srgb, var(--accent) 70%, transparent);
    outline-offset: 2px;
  }
  .perm .qsend { margin-top: 12px; }

  /* ── plan cards (ExitPlanMode) ──
     Same bones again, with one difference that is the whole point: the body is
     rendered MARKDOWN, not a monospace payload — a plan is prose Claude wrote to
     be read — so it gets a reply's type and line height, and only its code
     blocks fall back to the `.perm pre` box above. Scrolls at a bounded height:
     a long plan must not push its own two buttons off the screen. */
  .perm.plan { border-color: color-mix(in srgb, var(--accent) 80%, transparent); }
  .perm.plan.resolved { border-color: var(--border); }
  .perm .plan-body {
    font-size: 13px;
    line-height: 1.5;
    margin-top: 8px;
    max-height: 420px;
    overflow: auto;
    word-break: break-word;
  }
  .perm .plan-body > :first-child { margin-top: 0; }
  .perm .plan-body > :last-child { margin-bottom: 0; }
  .perm .plan-note {
    display: block;
    box-sizing: border-box;
    width: 100%;
    margin-top: 10px;
    padding: 6px 9px;
    font: inherit;
    font-size: 13px;
    color: var(--fg);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    resize: vertical;
  }
